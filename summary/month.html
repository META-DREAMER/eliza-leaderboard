3d8c528eddf6d59ac5aa2989b705c2d` passes 25 task tests, two credential-configuration tests, and two Cloud action-policy tests under Node24.15.0/Bun1.4.2. Its full root verification and exact-head hosted checks are running. Prior combined head22a855 passed all284 tasks and final audits; that earlier result does not qualify the new revision by itself.\n\n## Current repair and validation\n\nHead `fbb16af0dbdc8457bd323ced1589b832bc2f7665` integrates develop, including the reminder context change. A real HTTP/Pause regression reproduced stale choice delivery after refresh. Reads now recheck the task epoch, active status and authorization immediately before returning the widget.\n\nAll 21 related HTTP, presentation and choice tests pass. The new presentation scenarios now use authenticated HTTP task admission, file-backed SQLite and actual filesystem selection effects; they preserve restart, stale publication, forged labels and actor isolation checks. Agent typecheck initially failed because a cold ignore-scripts install had no embeddings declarations; the owning builds and final typecheck/lint are running. Full combined-stack verification and current-head hosted checks remain required. Earlier-head results below are historical and do not qualify this head.\n\n# Relates to\n\nDepends on #32976, #32980, #32981, #32983 and #32984. This branch includes the preceding stack and must not merge ahead of its dependencies.\n\n# Change\n\nChat delivery needs a durable view of a host-issued task choice without offering it again or executing a task. Add SqliteTaskPresentation over existing choice authority: reads refresh commitment state, expired/paused/old-epoch offers disappear, and a stored generation fences late publication after replacement or Clear. Capture option input before asynchronous storage so later caller mutation cannot change the response schema. Add public service exports for presentation, choices and their SQLite authority store.\n\nHosts retain authenticated route binding, product UI and effect policy. Models and renderer payloads cannot publish authoritative offers through this service.\n\n# Original-head validation\n\n- 16 focused SQLite/task-choice tests passed, including real disk close/reopen, paused restart, actor isolation, expiry, forged labels, mutable input, concurrent replacement, Clear races, and malformed storage.\n- Owning typecheck/lint and dependency builds passed 76 tasks.\n- Root verification passed all 284 tasks and repository audits.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:fbb16af0dbdc8457bd323ced1589b832bc2f7665 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - backend presentation persistence; inherited UI evidence is attributed below.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32985-desktop-retry.png)\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32985-desktop.mp4\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [32985-senior-presentation-tests4.log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32985-senior-presentation-tests4.log)\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend transport changes in this extraction.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no prompt or inference changes; offers come from trusted host workflows.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [32985-senior-presentation-root.log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32985-senior-presentation-root.log)\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] [32985-ocr-review.txt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32985-ocr-review.txt)\n\n# Evidence Details\n\nSQLite tests exercise real persistence and task authority with a controlled actuator. They do not establish authenticated product chat delivery. Inherited UI screenshots/video/OCR, when attached, are from unchanged TaskChoice at #32981 (`a712e7d27c8506a31f2ebc70336234c1535be6cc`), and demonstrate that dependency only.\n\n## Known gaps\n\nThe initial resume test incorrectly called the synchronous control API; it was corrected to resume through a fresh runtime observation. Root verification passed; hosted CI/review remain pending. Product chat wiring and consumer adoption are separate work; no live Google, Chromium, device or user acceptance is claimed. Clear removes presentation only and does not replace explicit task cancellation or revoke an effect already committed by the authority.\n\n"])</script><script>self.__next_f.push([1,"4f:T14f1,"])</script><script>self.__next_f.push([1,"# Relates to\n\nExisting approved phone [#30844](https://github.com/elizaOS/eliza/issues/30844) and [#31025](https://github.com/elizaOS/eliza/issues/31025).\n\n# Change\n\nClock requests use the existing proposal, approval, claim and receipt flow. Owners review the exact request before separate native consent. Unknown results are reconciled without replay. Recurrence requires the negotiated v2 capability. A Clock-only executor exposes only operations it supports, while separately authorized app actions remain available.\n\nThe native instruction now defines the existing set, show, dismiss and snooze meanings under those capability checks. Show opens Android Clock without creating or changing an alarm. It is not generic app navigation, and it still requires native approval. Set may create or update an alarm; dismiss and snooze may change one. An opened receipt proves handoff, not final alarm state or ringing.\n\nExact action selection uses the existing DISCOVER_ACTIONS names interface. It does not request the nonexistent candidateActionNames discovery parameter or add an unconditional discovery stage.\n\n# Why this implementation\n\nThe fix uses the existing capability, permission, consent, proposal and receipt gat
