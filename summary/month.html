re\":0,\"commentScore\":0.2,\"summary\":null},{\"username\":\"moyaqoob\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/163942111?u=12817254d04f1eb8d60821acdafe4f4062912a47\u0026v=4\",\"totalScore\":17.198947636399186,\"prScore\":15.198947636399186,\"issueScore\":2,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"kenjohnscreates\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/144142574?u=c390be2e863f5d8704e0d596e116ddebb1629dd6\u0026v=4\",\"totalScore\":16.266299746576628,\"prScore\":16.266299746576628,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"CopperKoi\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/91732947?u=31aaece8627730e645b69f4a375e2ddeee00cd13\u0026v=4\",\"totalScore\":6,\"prScore\":0,\"issueScore\":6,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"obukowhoowigho78-svg\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/289285968?u=d9e9df2f557b97397dc7eaa80deed2b5c2ecbc1a\u0026v=4\",\"totalScore\":5,\"prScore\":0,\"issueScore\":0,\"reviewScore\":5,\"commentScore\":0,\"summary\":null}],\"focusAreas\":[{\"area\":\"cloud\",\"count\":1646},{\"area\":\"agent\",\"count\":1163},{\"area\":\"app\",\"count\":958},{\"area\":\"ui\",\"count\":558},{\"area\":\"os\",\"count\":469},{\"area\":\"core\",\"count\":344},{\"area\":\"plugins/plugin-personal-assistant\",\"count\":314},{\"area\":\"plugins/plugin-assistant\",\"count\":229},{\"area\":\".github/workflows\",\"count\":189},{\"area\":\"plugins/plugin-native-agent\",\"count\":133}],\"topIssues\":[{\"id\":\"I_kwDOMT5cIs8AAAABP_ZjDw\",\"title\":\"Android cloud APK build blocked by optional wallet browser analytics\",\"author\":\"lalalune\",\"number\":30844,\"repository\":\"elizaos/eliza\",\"body\":\"The Android cloud debug build fails on develop during the renderer audit. `bun run --cwd packages/app build:android:cloud:debug` rejects `navigator.serviceWorker` in the crypto vendor chunk. Coinbase/Base wallet SDK optional browser analytics embeds a script containing that capability, even though the Android cloud shell prohibits service-worker routing.\\n\\nAcceptance: compile optional wallet browser analytics out of Android cloud builds while preserving wallet providers and the unchanged routing audit; keep browser builds unchanged; build the actual debug APK and verify installation in the Android emulator. Include focused bundle regression coverage and report repository validation results.\\n\",\"createdAt\":\"2026-09-06T22:35:16Z\",\"closedAt\":\"2026-10-06T03:55:54Z\",\"state\":\"CLOSED\",\"commentCount\":5},{\"id\":\"I_kwDOMT5cIs8AAAABVBwGjA\",\"title\":\"Repair main validation prerequisites and stale contract fixtures\",\"author\":\"lalalune\",\"number\":33659,\"repository\":\"elizaos/eliza\",\"body\":\"$14\",\"createdAt\":\"2026-10-05T03:41:06Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":5},{\"id\":\"I_kwDOMT5cIs8AAAABQr447Q\",\"title\":\"Assistant routines\",\"author\":\"lalalune\",\"number\":31022,\"repository\":\"elizaos/eliza\",\"body\":\"$15\",\"createdAt\":\"2026-09-10T16:23:28Z\",\"closedAt\":\"2026-10-06T03:55:53Z\",\"state\":\"CLOSED\",\"commentCount\":4},{\"id\":\"I_kwDOMT5cIs8AAAABUocKRQ\",\"title\":\"fix(cloud): reject malformed JSON before optional-body mutations\",\"author\":\"hermesagent270-commits\",\"number\":33070,\"repository\":\"elizaos/eliza\",\"body\":\"$16\",\"createdAt\":\"2026-10-02T15:24:46Z\",\"closedAt\":\"2026-10-04T03:12:51Z\",\"state\":\"CLOSED\",\"commentCount\":3},{\"id\":\"I_kwDOMT5cIs8AAAABVA-DQQ\",\"title\":\"Resuming a paused goal never restores its recurring check-ins\",\"author\":\"hermesagent270-commits\",\"number\":33642,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nPausing a goal with a recurring cadence, or changing its cadence kind and back, permanently loses its check-ins. Sync dismisses the slot's task while it's unwanted. When the goal is active again, sync finds that dismissed task under the slot's key and skips it, and scheduling under the same key replays the dismissed row. The active goal has no check-in, and nothing reports it.\\n\\n**Expected**\\n\\nResuming a goal, or restoring its cadence, brings its check-ins back. A check-in the owner dismissed stays off.\\n\\nFix: #33641\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-05T01:47:22Z\",\"closedAt\":\"2026-10-05T07:19:49Z\",\"state\":\"CLOSED\",\"commentCount\":3},{\"id\":\"I_kwDOMT5cIs8AAAABVA1Qvg\",\"title\":\"MESSAGE delivery preference fails to record once a person is reached from a second world\",\"author\":\"hermesagent270-commits\",\"number\":33631,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nAfter MESSAGE `op=send` reaches a person, the delivery-preference component (fixed id per entity and agent) is written through `upsertComponent` with the message's `worldId`. The SQL adapter keys that upsert on the world, so reaching the same person from a second world inserts the fixed id again: a duplicate primary key. A message without a world uses an invented world id, which violates the `worlds` foreign key. The preference never moves past the first world, and every such send reports an error. Reproduced on real PGlite.\\n\\n**Expected**\\n\\nOne delivery preference per person, updated by every successful send.\\n\\nFix: #33630\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-05T01:28:46Z\",\"closedAt\":\"2026-10-05T13:48:54Z\",\"state\":\"CLOSED\",\"commentCount\":3},{\"id\":\"I_kwDOMT5cIs8AAAABVAZ_Zg\",\"title\":\"Moving a one-time goal away and back to its date drops its check-in\",\"author\":\"hermesagent270-commits\",\"number\":33615,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nSince #33493 keyed one-time goal check-ins by their date, moving a pending one-time goal to another date and then back (an undo, or correcting a typo) leaves it with no live check-in. The original task was dismissed by the sync and still holds the date's key, and the sync never revives a dismissed slot. Reported on #33493 by @attentionhead and @fadhelcarlos.\\n\\n**Expected**\\n\\nMoving the date back restores the check-in, while a check-in the owner dismissed stays off.\\n\\nFix: #33614\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-05T00:25:34Z\",\"closedAt\":\"2026-10-05T07:24:10Z\",\"state\":\"CLOSED\",\"commentCount\":3},{\"id\":\"I_kwDOMT5cIs8AAAABVAWj8Q\",\"title\":\"Calendar update/delete targets the wrong all-day event in calendars west of UTC\",\"author\":\"hermesagent270-commits\",\"number\":33610,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nIn `calendar-handler.ts`, `calendarEventLocalDate` (update/delete target selection) and `formatCalendarMoment` (all-day labels) read an all-day event's UTC-midnight `startAt` as an instant in the event's own time zone. For calendars west of UTC they read the previous day. In a New York calendar, \\\"delete the field trip on November 1\\\" targets the November 2 all-day event. Reported on #33499 by @lww0134-ctrl; Google all-day events were already affected.\\n\\n**Expected**\\n\\nAll-day events are selected and labelled by their civil date, as the calendar views read it.\\n\\nFix: #33609\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-05T00:17:51Z\",\"closedAt\":\"2026-10-05T07:37:11Z\",\"state\":\"CLOSED\",\"commentCount\":3},{\"id\":\"I_kwDOMT5cIs8AAAABTu33KQ\",\"title\":\"Investigate evaluator overhead between independent read actions\",\"author\":\"NubsCarson\",\"number\":32900,\"repository\":\"elizaos/eliza\",\"body\":\"$17\",\"createdAt\":\"2026-09-28T18:15:24Z\",\"closedAt\":\"2026-10-04T03:54:36Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABUubNlw\",\"title\":\"fix(cloud): keep failed affiliate session claims retryable\",\"author\":\"hermesagent270-commits\",\"number\":33126,\"repository\":\"elizaos/eliza\",\"body\":\"$18\",\"createdAt\":\"2026-10-03T02:27:23Z\",\"closedAt\":\"2026-10-04T03:12:33Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABUjo_Zg\",\"title\":\"[Security] Desktop: DNS rebinding through the renderer proxy gives any website credential-free OWNER-level reads of the agent API (including plaintext stored API keys)\",\"author\":\"CopperKoi\",\"number\":33036,\"repository\":\"elizaos/eliza\",\"body\":\"$19\",\"createdAt\":\"2026-10-02T07:50:56Z\",\"closedAt\":\"2026-10-04T03:12:28Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABUjeMRw\",\"title\":\"[Security] Desktop: any website can steal the OWNER-level agent API token — renderer serves CORS `*` and embeds the token in the index HTML\",\"author\":\"CopperKoi\",\"number\":33034,\"repository\":\"elizaos/eliza\",\"body\":\"$1a\",\"createdAt\":\"2026-10-02T07:32:58Z\",\"closedAt\":\"2026-10-04T03:12:26Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABU-xG9A\",\"title\":\"plugin-blocker: website block misses the www host for co.uk-style domains and for www-named requests (site stays reachable)\",\"author\":\"saltwire-dev\",\"number\":33544,\"repository\":\"elizaos/eliza\",\"body\":\"$1b\",\"createdAt\":\"2026-10-04T20:23:07Z\",\"closedAt\":\"2026-10-05T13:46:15Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABVKUROg\",\"title\":\"Inbox and X verify lose inbound X DMs behind the owner's replies\",\"author\":\"hermesagent270-commits\",\"number\":33926,\"repository\":\"elizaos/eliza\",\"body\":\"The LifeOps X DM cache holds outbound DMs alongside inbound ones. `readXInboundDms` and the inbox X DM fetch read the newest N rows and only then drop the outbound ones. As a result, the owner's recent replies hide inbound DMs from the inbox, and X verify under-reports inbound DMs.\\n\\n**Acceptance:**\\n- The direction is filtered before `LIMIT`.\\n- Tests cover a real-PGlite repository read and the inbox fetch.\\n\",\"createdAt\":\"2026-10-05T15:52:50Z\",\"closedAt\":\"2026-10-06T21:28:18Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABVKPu1Q\",\"title\":\"Inbox chat fetch drops user messages behind the agent's own replies\",\"author\":\"cursor\",\"number\":33922,\"repository\":\"elizaos/eliza\",\"body\":\"`fetchChatMessages` in `@elizaos/plugin-inbox` reads the newest `limit * 3` memories and only then drops the agent's own replies and blank texts. When those rows fill the window, `MESSAGE` inbox chat / the aggregated chat feed returns fewer user messages than requested — or none — even though older user messages exist.\\n\\nThis is the stored-memory sibling of the Discord live triage window fixed in #33914. It does not reopen that issue: Discord paging is a different adapter.\\n\\n**Acceptance:**\\n- The caller's `limit` counts non-agent messages with text, paging older raw memories until that many candidates are collected or history ends.\\n- A store that ignores `offset` and repeats a page stops instead of looping.\\n- Blank texts do not consume a result slot.\",\"createdAt\":\"2026-10-05T15:47:39Z\",\"closedAt\":\"2026-10-06T21:28:21Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABVJ0LMA\",\"title\":\"Inbox search on Discord/X filters only the newest N messages\",\"author\":\"hermesagent270-commits\",\"number\":33909,\"repository\":\"elizaos/eliza\",\"body\":\"`MESSAGE search_inbox` on connectors without native search (Discord, X DMs) lists the newest `limit + 1` messages and only then filters by content, sender, until, or tags. Matches older than that window are dropped, and the search receipt still reports the result as complete.\\n\\n**Acceptance:**\\n- The fallback lists without the result limit, filters, then limits.\\n- Tests cover both `BaseMessageAdapter` and `TriageService`.\\n\",\"createdAt\":\"2026-10-05T15:17:09Z\",\"closedAt\":\"2026-10-06T21:19:32Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABVFhYjw\",\"title\":\"Model dispatch detaches provider cancellation from the turn when an explicit signal is present\",\"author\":\"Guo-Yixin\",\"number\":33820,\"repository\":\"elizaos/eliza\",\"body\":\"$1c\",\"createdAt\":\"2026-10-05T10:02:03Z\",\"closedAt\":\"2026-10-05T13:57:01Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABVCo6Uw\",\"title\":\"TRANSCRIPTION: elizacloud and local-inference ignore audio bytes when the required audioUrl is empty\",\"author\":\"hermesagent270-commits\",\"number\":33711,\"repository\":\"elizaos/eliza\",\"body\":\"Core `TranscriptionParams` requires `audioUrl`, so a caller that holds the audio bytes sends `{ audioUrl: \\\"\\\", audio }`. The audio-redaction verifier (`runtimeTranscriptionTranscriber`) sends exactly this. Two providers mishandle it:\\n\\n- `plugin-elizacloud` tries to fetch the empty URL.\\n- `plugin-local-inference` rejects any `audioUrl` before reading `audio`.\\n\\nAs a result, redaction verification always fails on both providers. `plugin-openai` already handles this shape correctly.\\n\\n**Acceptance:** both handlers transcribe the `audio` bytes when they are present, and a test for each provider covers this.\\n\",\"createdAt\":\"2026-10-05T05:42:08Z\",\"closedAt\":\"2026-10-05T13:50:17Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABVCUMrg\",\"title\":\"Relationships merge routes return 500/200 for unknown candidates and self-links\",\"author\":\"hermesagent270-commits\",\"number\":33687,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe relationships merge routes answer caller mistakes as server errors or false success. Accepting an unknown candidate id returns 500, rejecting one returns 200 although nothing changed, and linking a person to themselves returns 500. This is the narrow scope invited when #32029 was closed (#32017).\\n\\n**Expected**\\n\\n404 for an unknown merge candidate, 400 for a self-link, and no schema change.\\n\\nFix: #33686\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-05T04:59:48Z\",\"closedAt\":\"2026-10-05T13:49:35Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABQr46xA\",\"title\":\"Four-phone rollout\",\"author\":\"lalalune\",\"number\":31025,\"repository\":\"elizaos/eliza\",\"body\":\"$1d\",\"createdAt\":\"2026-09-10T16:23:31Z\",\"closedAt\":\"2026-10-06T03:55:56Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABQr414g\",\"title\":\"Nitro deployment\",\"author\":\"lalalune\",\"number\":31018,\"repository\":\"elizaos/eliza\",\"body\":\"$1e\",\"createdAt\":\"2026-09-10T16:23:24Z\",\"closedAt\":\"2026-10-04T04:51:31Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUzNB7g\",\"title\":\"Steer token-address queries return unrelated wallet vaults\",\"author\":\"hermesagent270-commits\",\"number\":33208,\"repository\":\"elizaos/eliza\",\"body\":\"$1f\",\"createdAt\":\"2026-10-03T15:09:58Z\",\"closedAt\":\"2026-10-04T03:11:54Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUzMNoQ\",\"title\":\"KNOWLEDGE_GRAPH set_relationship adds a duplicate edge on every restatement\",\"author\":\"hermesagent270-commits\",\"number\":33207,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`KNOWLEDGE_GRAPH set_relationship` (`plugins/plugin-relationships/src/actions/entity.ts`) calls `RelationshipStore.upsert` without a `relationshipId`, and the store creates a new id whenever one is missing. Restating a relationship (\\\"Pat is my manager\\\" twice) therefore adds a second active edge instead of updating the first, and the relationships API and viewer show duplicates.\\n\\n**Expected**\\n\\nRestating an edge updates the existing active `(from, to, type)` edge.\\n\\nFix: #33206\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T15:08:18Z\",\"closedAt\":\"2026-10-04T03:11:56Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUzAuNg\",\"title\":\"elizaOS Cloud buffered text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33204,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nelizaOS Cloud's buffered text requests (`generateNativeChatCompletion` → `/chat/completions`, and `/responses`, in `plugins/plugin-elizacloud/src/models/text.ts`) don't pass `GenerateTextParams.signal` to `requestRaw`, and the warming-503 backoff sleeps without it. A stopped turn's buffered request runs to the client timeout, plus the warming ladder, while holding the shared native-chat concurrency permit. The streaming and embeddings paths already forward the signal.\\n\\n**Expected**\\n\\nCancelling a turn aborts its buffered Cloud request and ends any warming backoff.\\n\\nFix: #33203\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:44:26Z\",\"closedAt\":\"2026-10-04T03:11:58Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUy--Mg\",\"title\":\"Anthropic text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33202,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe Anthropic text handler (`plugins/plugin-anthropic/models/text.ts`) never passes `GenerateTextParams.signal` to the AI SDK request, so stopping a chat turn does not cancel the Anthropic request. It keeps generating, and is billed, up to `maxOutputTokens`. `executeWithRetry` also treats `AbortError` as retryable, so a cancelled request would be re-sent three more times.\\n\\nOpenAI and the elizaOS Cloud stream path forward the signal.\\n\\n**Expected**\\n\\nA cancelled turn aborts the Anthropic request once and does not retry it.\\n\\nFix: #33201\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:40:51Z\",\"closedAt\":\"2026-10-04T03:12:00Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUy2pCQ\",\"title\":\"Telegram personal-account search matches the untrimmed query\",\"author\":\"hermesagent270-commits\",\"number\":33198,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe personal Telegram account's `searchConnectorMessages` (`plugins/plugin-telegram/src/account-client-service.ts`) checks `params.query.trim()` for blankness but matches the untrimmed query, so `\\\" invoice \\\"` finds only messages containing the word with spaces on both sides. The bot-side Telegram search and the Slack and Discord searches trim first.\\n\\n**Expected**\\n\\nA padded query matches the same messages as the trimmed one.\\n\\nFix: #33197\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:22:49Z\",\"closedAt\":\"2026-10-04T00:07:52Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUy09_g\",\"title\":\"X connector reports an empty inbox when the DM fetch fails\",\"author\":\"hermesagent270-commits\",\"number\":33196,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.fetchConnectorMessages` and `listRecentConnectorTargets` (`plugins/plugin-x/src/services/x.service.ts`) catch a DM fetch failure (expired token, rate limit), report it, and return `[]`. An X outage therefore reads as an empty inbox. The LifeOps X read delegate returns `handled` with no DMs instead of `unavailable`, and the MESSAGE action sees no recent DM partners. The code comment itself says the failure must not read as an empty inbox.\\n\\n**Expected**\\n\\nThe failure propagates to the callers' existing error boundaries, as it does for the Discord, Slack and Telegram connectors.\\n\\nFix: #33195\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:19:14Z\",\"closedAt\":\"2026-10-04T03:12:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyzUzw\",\"title\":\"Form undo reverts an older change after a field's first answer\",\"author\":\"hermesagent270-commits\",\"number\":33194,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nIn `@elizaos/plugin-form`, `FormService.updateField` records an undo entry only when the field already had a value, so a field's first answer is never in `session.history`. `undoLastChange` then reverts an older change, or does nothing.\\n\\n**Reproduction**\\n\\nA form with `name` and `email` (`allowUndo` is the default): set `name=Bob`, correct to `name=Rob`, set `email=a@b.co`, then undo. `name` goes back to `Bob` and `email` stays filled. Undo right after a single first answer returns `null`.\\n\\n**Expected**\\n\\nUndo reverts the most recent change: here it clears `email` and leaves `name` as `Rob`.\\n\\nFix: #33193\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:14:59Z\",\"closedAt\":\"2026-10-04T03:12:07Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyxDWQ\",\"title\":\"X connector attributes the account's own DMs to another user\",\"author\":\"hermesagent270-commits\",\"number\":33192,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.buildXDirectMessageMemory` (`plugins/plugin-x/src/services/x.service.ts`) compares `senderId` (an X numeric user id) with `runtime.agentId` (a UUID) to decide whether a DM is the account's own. That comparison is never true. The account's own outbound DMs are stored as memories from a synthetic `x:user:\u003cown id\u003e` entity with `fromBot: false`, so the X message connector shows the agent's own replies as if another user wrote them.\\n\\n`listRecentDirectMessages` already marks own DMs with `isInbound: false`, but the builder only copies that into `metadata.x`.\\n\\n**Expected**\\n\\nOwn DMs have `entityId === runtime.agentId` and `fromBot: true`.\\n\\nFix: #33191\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:09:56Z\",\"closedAt\":\"2026-10-04T03:12:10Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyr3kg\",\"title\":\"CONTACT follow-up confirmations use the host timezone instead of the owner's\",\"author\":\"hermesagent270-commits\",\"number\":33190,\"repository\":\"elizaos/eliza\",\"body\":\"$20\",\"createdAt\":\"2026-10-03T13:58:58Z\",\"closedAt\":\"2026-10-04T03:12:12Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyqsDQ\",\"title\":\"fix(cloud): an explicit-but-unknown Google disconnect connectionId silently revokes a different connection\",\"author\":\"OutstandingRetard\",\"number\":33189,\"repository\":\"elizaos/eliza\",\"body\":\"$21\",\"createdAt\":\"2026-10-03T13:56:32Z\",\"closedAt\":\"2026-10-04T03:12:14Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyc0sg\",\"title\":\"fix(scripts): install-time Bun pin guard must validate the installer runtime and describe its post-resolution failure\",\"author\":\"lumix5\",\"number\":33187,\"repository\":\"elizaos/eliza\",\"body\":\"$22\",\"createdAt\":\"2026-10-03T13:26:15Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUxO8DA\",\"title\":\"Reminder dispatch and fallback bodies use the host timezone instead of the owner's\",\"author\":\"lumix5\",\"number\":33172,\"repository\":\"elizaos/eliza\",\"body\":\"$23\",\"createdAt\":\"2026-10-03T10:29:35Z\",\"closedAt\":\"2026-10-04T03:12:25Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUwxa0A\",\"title\":\"Gmail replies can leave the original conversation thread\",\"author\":\"hermesagent270-commits\",\"number\":33165,\"repository\":\"elizaos/eliza\",\"body\":\"$24\",\"createdAt\":\"2026-10-03T09:18:38Z\",\"closedAt\":\"2026-10-04T03:12:27Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUwVxWw\",\"title\":\"LIFE cadence summaries use host timezone and can delete the wrong reminder\",\"author\":\"hermesagent270-commits\",\"number\":33155,\"repository\":\"elizaos/eliza\",\"body\":\"$25\",\"createdAt\":\"2026-10-03T08:11:04Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUvwkLw\",\"title\":\"PERSONAL_ASSISTANT sign_document approvals always fail with DOCUMENT_REQUEST_NOT_FOUND\",\"author\":\"hermesagent270-commits\",\"number\":33145,\"repository\":\"elizaos/eliza\",\"body\":\"$26\",\"createdAt\":\"2026-10-03T06:27:06Z\",\"closedAt\":\"2026-10-04T03:12:31Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUuLX2Q\",\"title\":\"plugin-sql jsonb writes fail with raw PostgreSQL errors on lone UTF-16 surrogates\",\"author\":\"hermesagent270-commits\",\"number\":33125,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe plugin-sql jsonb sanitizer handles NUL but not lone UTF-16 surrogates (e.g. a truncated emoji `\\\"hi \\\\ud83d\\\"`), which PostgreSQL jsonb also rejects. Memory writes fail with a raw `invalid input syntax for type json` instead of a typed error, and a log body containing one fails the whole insert.\\n\\nReproduced on develop `811c3fac48` with the real PGlite adapter (createMemory text/metadata and log).\\n\\n## Acceptance\\n\\n- Strict writes reject lone surrogates with a typed error (as for NUL), leaving no partial row.\\n- Lenient sanitization (log bodies) replaces them with U+FFFD (as it strips NUL).\\n\\nFix: #33124\\n\",\"createdAt\":\"2026-10-03T01:45:12Z\",\"closedAt\":\"2026-10-04T03:12:35Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUuH4Qg\",\"title\":\"LIFE \\\"calendar today\\\" uses the host's midnight instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":33123,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nLIFE `query_calendar_today` builds \\\"today\\\" from the host clock's midnight plus 24 h and passes the host zone, ignoring the owner's timezone fact. On a UTC or shared server, an owner in New York asking at 21:00 gets tomorrow's events; DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48`: at `2026-10-03T01:00Z` (21:00 Oct 2 in New York), a `TZ=UTC` host queries `2026-10-03T00:00Z..2026-10-04T00:00Z` instead of `2026-10-02T04:00Z..2026-10-03T04:00Z`.\\n\\n## Acceptance\\n\\n- The calendar-today window is the owner's local day in their zone (23/25 h on DST days), independent of the host zone.\\n\\nFix: #33122\\n\",\"createdAt\":\"2026-10-03T01:35:21Z\",\"closedAt\":\"2026-10-04T03:12:37Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUuFC2g\",\"title\":\"queryEntities pagination skips and repeats entities across writes\",\"author\":\"hermesagent270-commits\",\"number\":33120,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`queryEntities` (plugin-sql `base.ts`) pages with `limit`/`offset` and no `ORDER BY`. Rows come back in physical order, which an `UPDATE` rewrites, so paging across a write skips an entity and serves another twice. plugin-form's `getRestorableSessions` pages this way and can drop a live session from restore.\\n\\nReproduced on develop `811c3fac48` on real PGlite: four entities paged with `limit: 1` across an `updateEntity` serve `e0, e2, e3, e0`.\\n\\n## Acceptance\\n\\n- Pages are totally ordered; each entity is served exactly once across a concurrent update.\\n\\nFix: #33119\\n\",\"createdAt\":\"2026-10-03T01:27:10Z\",\"closedAt\":\"2026-10-04T03:12:38Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUt--tg\",\"title\":\"Quiet-hours gate refires an hour off on DST nights\",\"author\":\"hermesagent270-commits\",\"number\":33118,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe `quiet_hours` gate defers by a wall-clock minute count (`until.offsetMinutes`), so a DST change inside the window shifts the refire: with quiet hours 22:00–07:00, a task deferred at 22:30 refires at 08:00 after spring-forward (New York, London), at 06:00 (still quiet) after fall-back, and at 07:30 in Lord Howe.\\n\\nReproduced on develop `811c3fac48` with the real gate.\\n\\n## Acceptance\\n\\n- Deferral targets the window's end instant in the owner's zone (`until.atIso`), 07:00 local on DST nights.\\n\\nFix: #33117\\n\",\"createdAt\":\"2026-10-03T01:10:32Z\",\"closedAt\":\"2026-10-04T03:12:40Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUt7WRA\",\"title\":\"GENERATE_MEDIA rejects the voice, genre, instrumental, quality, style, and negativePrompt it supports\",\"author\":\"hermesagent270-commits\",\"number\":33116,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`GENERATE_MEDIA` forwards `quality`, `style`, `negativePrompt`, `instrumental`, `genre`, and `voice` to the media service, but none is declared in the action's `parameters`. Core `validateToolArgs` rejects undeclared arguments, so a planner call can never choose a TTS voice, instrumental music or a genre, or image quality/style/negative prompt.\\n\\nReproduced on develop `811c3fac48` with the real `validateToolArgs`: `{ mediaType: \\\"audio\\\", audioKind: \\\"tts\\\", prompt, voice: \\\"nova\\\" }` → `Unexpected argument 'voice'`.\\n\\n## Acceptance\\n\\n- The six controls are declared (with the enums `buildRequest` accepts) and reach the media service from a validated planner call.\\n\\nFix: #33115\\n\",\"createdAt\":\"2026-10-03T01:00:41Z\",\"closedAt\":\"2026-10-04T03:12:42Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUtvzUQ\",\"title\":\"plugin-sql getLogs returns and deletes other agents' logs in a shared database\",\"author\":\"hermesagent270-commits\",\"number\":33113,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nIn a database shared by several agents, `getLogs` (plugin-sql `base.ts`) returns every agent's logs whenever no `roomId` is passed, because the `logs` table has no agent column and the query has no room/agent join. `deleteLogs`/`updateLogs` act on any id. Agent export therefore includes other agents' logs, and the logs-retention sweep and inference-timing pruner delete other agents' rows.\\n\\nReproduced on develop `811c3fac48` with two real `PgliteDatabaseAdapter`s on one PGlite database: `A.getLogs({ type: \\\"inference_timing\\\" })` returns B's log too.\\n\\n## Acceptance\\n\\n- `getLogs` returns only logs in the calling agent's rooms (as `getAgentRunSummaries` already does).\\n- `deleteLogs`/`updateLogs` cannot touch another agent's rows.\\n- Export pagination is stable.\\n\\nFix: #33112\\n\",\"createdAt\":\"2026-10-03T00:30:58Z\",\"closedAt\":\"2026-10-04T03:12:44Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUtq-2w\",\"title\":\"Google Fit health summaries use UTC days instead of the owner's local day\",\"author\":\"hermesagent270-commits\",\"number\":33111,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe health bridge documents day keys as calendar days in `HealthBridgeConfig.timeZone` (#31248/#31264), but the Google Fit backend aggregates `${date}T00:00Z` + 24 h, enumerates sleep days in UTC, and `getHealthDailySummary(date)` passes no zone. Every owner outside UTC gets Google Fit steps, sleep, heart rate, and calories for the wrong window every day, and DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48` (real `getDailySummary`, `fetch` stubbed): Asia/Kolkata 2026-10-02 is aggregated 05:30–05:30 IST; America/New_York 2026-03-08 is aggregated 3/7 19:00 EST – 3/8 20:00 EDT.\\n\\n## Acceptance\\n\\n- Google Fit day windows are local midnight to local midnight in the owner's zone (23/25 h on DST days).\\n- Sleep series use the owner's local days.\\n- The daily-summary path receives the owner's zone, like the trend path.\\n\\nFix: #33110\\n\",\"createdAt\":\"2026-10-03T00:19:03Z\",\"closedAt\":\"2026-10-04T03:12:45Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUtcGkg\",\"title\":\"Orchestrator rewrites GitLab subgroup repository URLs to the parent group\",\"author\":\"hermesagent270-commits\",\"number\":33109,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`normalizeRepositoryInput` in `plugins/plugin-agent-orchestrator/src/services/repo-input.ts` keeps only two path segments, so `https://gitlab.com/group/subgroup/project` becomes `https://gitlab.com/group/subgroup.git`, which can never be a repository (GitLab namespaces cannot hold a project and a subgroup with the same path). The TASKS action's text extractor also captures only two segments. Every coding task for a GitLab subgroup project therefore fails to clone.\\n\\nReproduced on develop `811c3fac48`: `https://gitlab.com/gitlab-org/charts/gitlab` normalizes to `https://gitlab.com/gitlab-org/charts.git`, and `git ls-remote` on that URL fails, while `…/charts/gitlab.git` lists branches.\\n\\n## Acceptance\\n\\n- GitLab URLs keep the full namespace path up to the `/-/` page separator (and legacy page routes).\\n- GitHub and Bitbucket keep `owner/repo`; existing forms normalize as before.\\n- Output still passes `assertSafeGitRemote`.\\n\\nFix: #33108\\n\",\"createdAt\":\"2026-10-02T23:44:09Z\",\"closedAt\":\"2026-10-04T03:12:47Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUogUog\",\"title\":\"fix(cloud): reject malformed Google disconnect bodies before bulk removal\",\"author\":\"hermesagent270-commits\",\"number\":33073,\"repository\":\"elizaos/eliza\",\"body\":\"$27\",\"createdAt\":\"2026-10-02T15:30:21Z\",\"closedAt\":\"2026-10-04T03:12:49Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoWsMQ\",\"title\":\"crypto refunds: a malformed or reused refund key is reported as CRYPTO_REFUND_INVALID_AMOUNT\",\"author\":\"nothingxnowhere\",\"number\":33065,\"repository\":\"elizaos/eliza\",\"body\":\"$28\",\"createdAt\":\"2026-10-02T15:17:29Z\",\"closedAt\":\"2026-10-04T03:12:52Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoQdlA\",\"title\":\"LOGS delete and RUNTIME reload_config report success on unacknowledged responses\",\"author\":\"hermesagent270-commits\",\"number\":33062,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nTwo agent actions report success on a 2xx response that does not carry the route's acknowledgement (the defect 6beb04b5c1 fixed for PLUGIN configure):\\n\\n- LOGS `delete` (`packages/agent/src/actions/logs.ts`): `resp.json().catch(() =\u003e ({}))` and a defaulted `cleared` make a proxy page, `{}`, or `{\\\"cleared\\\":\\\"lots\\\"}` report \\\"Cleared 0 log entries.\\\" with `success: true`.\\n- RUNTIME `reload_config` (`packages/agent/src/actions/runtime.ts`): `{}` or `{\\\"reloaded\\\":false}` reports \\\"No hot-reloadable fields changed.\\\" with `success: true`.\\n\\nReproduced on develop `27dec7b0c3` with the real handlers and a stubbed fetch.\\n\\n## Acceptance\\n\\n- Each op fails with its `*_FAILED` code unless the body matches its route: `{ cleared: \u003cnon-negative integer\u003e }` and `{ reloaded: true, applied: string[], requiresRestart: string[] }`.\\n- Genuine acknowledgements behave as before.\\n\\nFix: #33060\\n\",\"createdAt\":\"2026-10-02T15:09:36Z\",\"closedAt\":\"2026-10-04T03:12:54Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoPLRQ\",\"title\":\"agent status: canRespond is true on a runtime whose only text handler is the local-inference router\",\"author\":\"nothingxnowhere\",\"number\":33059,\"repository\":\"elizaos/eliza\",\"body\":\"$29\",\"createdAt\":\"2026-10-02T15:07:58Z\",\"closedAt\":\"2026-10-04T03:12:56Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoIk5w\",\"title\":\"cloud operator scripts: refund, promote-admin and set-billing-email cannot start (unresolvable @/ imports)\",\"author\":\"nothingxnowhere\",\"number\":33054,\"repository\":\"elizaos/eliza\",\"body\":\"$2a\",\"createdAt\":\"2026-10-02T14:59:17Z\",\"closedAt\":\"2026-10-04T03:12:59Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUnqlJw\",\"title\":\"fix(cloud): reject malformed Docker-node drain bodies before mutation\",\"author\":\"hermesagent270-commits\",\"number\":33050,\"repository\":\"elizaos/eliza\",\"body\":\"$2b\",\"createdAt\":\"2026-10-02T14:19:59Z\",\"closedAt\":\"2026-10-04T03:13:01Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUnkNmA\",\"title\":\"Log redaction clones print a Symbol.toPrimitive line on every object under Bun\",\"author\":\"hermesagent270-commits\",\"number\":33049,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nSince #32957, every plain and Map/Set clone produced by `packages/core/src/security/log-redaction.ts` carries an own non-enumerable `Symbol.toPrimitive`. Bun's console prints non-enumerable symbol keys, so under Bun every object passed as a trailing log argument shows `[Symbol(Symbol.toPrimitive)]: [Function: value]` once per nesting level:\\n\\n```\\n Info       probe-console-symbol {\\n  [Symbol(Symbol.toPrimitive)]: [Function: value],\\n  owner: {\\n    [Symbol(Symbol.toPrimitive)]: [Function: value],\\n    id: \\\"u1\\\",\\n  },\\n```\\n\\nReproduced on develop `27dec7b0c3` with `logger.info(\\\"probe-console-symbol\\\", { owner: { id: \\\"u1\\\" } })` under Bun 1.4.2; Node 24 prints the same clone without it.\\n\\n## Acceptance\\n\\n- Clones without a shadowing `toString` own no symbol keys and print cleanly under Bun.\\n- #32957's coercion protection still holds for clones that own a non-callable `toString` (and for Error clones).\\n\\nFix: #33048\\n\",\"createdAt\":\"2026-10-02T14:11:25Z\",\"closedAt\":\"2026-10-04T03:12:24Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUlGbSg\",\"title\":\"Log redaction marks shared (non-cyclic) references as [Circular]\",\"author\":\"hermesagent270-commits\",\"number\":33046,\"repository\":\"elizaos/eliza\",\"body\":\"$2c\",\"createdAt\":\"2026-10-02T10:18:38Z\",\"closedAt\":\"2026-10-04T03:13:02Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8rR-Q\",\"title\":\"All-day ICS events from feeds east of UTC show a day early\",\"author\":\"hermesagent270-commits\",\"number\":33500,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nAll-day events from ICS feeds in time zones east of UTC show a day early in the calendar. The ICS parser stores `DTSTART;VALUE=DATE` at local midnight in the feed's zone (Berlin 2026-03-08 → `2026-03-07T23:00Z`). The calendar views place all-day events by the date part of `startAt`, the UTC-midnight encoding Google all-day events use.\\n\\n**Expected**\\n\\nAn all-day ICS event appears on its own date in every time zone.\\n\\nFix: #33499\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:42:20Z\",\"closedAt\":\"2026-10-04T18:58:53Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8mHBQ\",\"title\":\"Agent export duplicates logs written while the export runs\",\"author\":\"hermesagent270-commits\",\"number\":33498,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nAgent export with `includeLogs` reads logs in newest-first offset pages of 500. Logs the running agent writes during the export shift later pages, so a row is exported twice and the bundle doesn't match the table at any instant. After import, the restored agent has a duplicate log. In a real two-runtime reproduction, 600 logs plus one write during the export restore as 601.\\n\\n**Expected**\\n\\nThe export carries one consistent log snapshot, as the log retention sweep already reads its inventory in one query.\\n\\nFix: #33497\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:31:25Z\",\"closedAt\":\"2026-10-04T18:58:49Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8dSSA\",\"title\":\"FOLLOW_UPS labels same-day follow-ups as tomorrow\",\"author\":\"hermesagent270-commits\",\"number\":33496,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`FOLLOW_UPS` labels upcoming follow-ups with `Math.ceil` of elapsed days, so \\\"(today)\\\" is effectively never shown. A follow-up later the same day reads \\\"(tomorrow)\\\", and one two calendar days away can read \\\"(in 3 days)\\\". The planner is told a same-day follow-up is tomorrow.\\n\\n**Expected**\\n\\nLabels count calendar days in the owner's zone.\\n\\nFix: #33495\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:11:58Z\",\"closedAt\":\"2026-10-04T18:58:46Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8Ys6w\",\"title\":\"Moving a one-time goal after its check-in fired never schedules a new check-in\",\"author\":\"hermesagent270-commits\",\"number\":33494,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nA goal with a one-time (`once`) cadence gets a single check-in at `dueAt`. After that check-in has fired, moving the goal to a new date (`update_goal` or `PUT /api/lifeops/goals/:id`) edits the finished task in place, because once check-ins share the fixed key `goals:checkin:\u003cgoalId\u003e:once`. A finished once task never fires again, so no check-in arrives for the new date, while the sync logs it as edited.\\n\\n**Expected**\\n\\nMoving a once goal schedules a check-in at the new date.\\n\\nFix: #33493\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:02:47Z\",\"closedAt\":\"2026-10-04T18:58:43Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8R-MQ\",\"title\":\"GITHUB_PR list by repo and author only checks the newest 100 PRs\",\"author\":\"hermesagent270-commits\",\"number\":33492,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`GITHUB_PR` `op: \\\"list\\\"` with both `repo` and `author` fetches one REST page of 100 PRs and filters it by author client-side. In a repo with more than 100 PRs in that state, an author whose PRs are older than the newest 100 gets \\\"Found 0 pull request(s)\\\" as a successful result. The unscoped list already filters by author server-side through search.\\n\\n**Expected**\\n\\nEvery PR by that author in the repo and state is found.\\n\\nFix: #33491\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T14:50:51Z\",\"closedAt\":\"2026-10-04T18:58:39Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8D9Vg\",\"title\":\"REPLY_CONTEXT repeats the room transcript when replying to an older message\",\"author\":\"hermesagent270-commits\",\"number\":33489,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nWhen an incoming message replies to an older message, `REPLY_CONTEXT` dedupes its surrounding window against only the newest `getConversationLength()` rows (default 100). `RECENT_MESSAGES` renders every retained room row. In a room longer than the conversation length, a reply to an older message re-renders every older row under \\\"Surrounding messages … older than the recent transcript above\\\", repeating up to the whole transcript in the prompt and mislabelling it.\\n\\n**Expected**\\n\\nREPLY_CONTEXT dedupes against the same complete window RECENT_MESSAGES renders, adding only the replied-to line.\\n\\nFix: #33488\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T14:20:25Z\",\"closedAt\":\"2026-10-04T18:58:36Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU7-a9w\",\"title\":\"BROWSER reports success when closing a tab id that is not open (web mode)\",\"author\":\"hermesagent270-commits\",\"number\":33486,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nIn web mode, the browser workspace's `close` and `tab close` commands return `{ closed: false }` for a tab id that isn't open, and the BROWSER action reports that as success. The agent then tells the user a tab was closed when nothing happened, for example with a tab id left over from before a restart. Desktop mode, the other web subactions and the HTTP tab route all report `tab_not_found` for an unknown id.\\n\\n**Expected**\\n\\nClosing an unknown tab id fails with `tab_not_found`.\\n\\nFix: #33485\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T14:07:45Z\",\"closedAt\":\"2026-10-04T18:58:32Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU5W9XA\",\"title\":\"personal-assistant ENTITY set_relationship adds a duplicate edge each time a relationship is restated\",\"author\":\"hermesagent270-commits\",\"number\":33352,\"repository\":\"elizaos/eliza\",\"body\":\"`plugins/plugin-personal-assistant/src/actions/entity.ts` `set_relationship` calls `relationshipStore.upsert` without a `relationshipId`, and the store keys upserts by `relationshipId`, so restating the same `(from, to, type)` creates another active edge each time.\\n\\nRepro (real PGlite, `relationships.integration.test.ts`): run `ENTITY set_relationship { toEntityId, relationshipType: \\\"manages\\\" }` twice → `relationshipStore.list({ toEntityId, type: \\\"manages\\\" })` returns 2 edges.\\n\\n#33206 fixed the same defect in plugin-relationships with a separate `list` + `upsert`, which still races under concurrent restatements.\\n\\nFix PR: #33336\",\"createdAt\":\"2026-10-04T07:42:30Z\",\"closedAt\":\"2026-10-04T08:22:08Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU3_MxA\",\"title\":\"fix(auth): a corrupted saved pending sign-in reports 502 \\\"Cloud service unavailable\\\" instead of the designed account-recovery state\",\"author\":\"lumix5\",\"number\":33282,\"repository\":\"elizaos/eliza\",\"body\":\"$2d\",\"createdAt\":\"2026-10-04T03:22:19Z\",\"closedAt\":\"2026-10-04T08:01:57Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVWJQGw\",\"title\":\"listInbox answers \\\"No unread messages\\\" from an all-read cache without a live pull\",\"author\":\"lumix5\",\"number\":34125,\"repository\":\"elizaos/eliza\",\"body\":\"$2e\",\"createdAt\":\"2026-10-06T11:18:21Z\",\"closedAt\":\"2026-10-06T21:19:17Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVUjkHQ\",\"title\":\"Follow-up: CVE IDs for the two fixed desktop security issues (#33034, #33036)\",\"author\":\"CopperKoi\",\"number\":34111,\"repository\":\"elizaos/eliza\",\"body\":\"$2f\",\"createdAt\":\"2026-10-06T09:03:10Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVUOTTw\",\"title\":\"Goal check-in responses revert concurrent goal edits\",\"author\":\"hermesagent270-commits\",\"number\":34109,\"repository\":\"elizaos/eliza\",\"body\":\"Recording a goal check-in response writes the whole goal back from a read taken before the check-in task completes. A rename, status change, or review written in the meantime is reverted.\\n\\n**Acceptance:**\\n- Check-ins persist only their own fields.\\n- A real-runtime test covers a concurrent edit.\\n\",\"createdAt\":\"2026-10-06T08:34:33Z\",\"closedAt\":\"2026-10-06T21:19:20Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVT0IzA\",\"title\":\"Goal review reverts concurrent goal edits and check-ins\",\"author\":\"hermesagent270-commits\",\"number\":34104,\"repository\":\"elizaos/eliza\",\"body\":\"A goal review writes the whole goal row back from a snapshot taken before an LLM evaluation, or before a loop over every goal. Edits and check-ins written to the goal in the meantime are reverted: the title or status changes back, and new check-in log entries disappear.\\n\\n**Acceptance:**\\n- Reviews persist only their own fields.\\n- A real-database test covers a concurrent edit.\\n\",\"createdAt\":\"2026-10-06T07:59:11Z\",\"closedAt\":\"2026-10-06T21:23:35Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTzQUw\",\"title\":\"Pending approvals hidden behind newer device actions in /api/approvals\",\"author\":\"hermesagent270-commits\",\"number\":34102,\"repository\":\"elizaos/eliza\",\"body\":\"`GET /api/approvals` reads the newest `limit` pending approvals and only then removes device-action requests. When the newest rows are device actions, older pending approvals (for example a `send_email`) are cut off by the limit and never appear in the pending-actions panel.\\n\\n**Acceptance:**\\n- The exclusion runs in the query before the limit.\\n- A real-queue test covers it.\\n\",\"createdAt\":\"2026-10-06T07:57:54Z\",\"closedAt\":\"2026-10-06T21:31:40Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTiQYw\",\"title\":\"plugin-sql entity-graph jsonb writes surface raw 22P02/22P05 errors for NUL and lone surrogates\",\"author\":\"hermesagent270-commits\",\"number\":34097,\"repository\":\"elizaos/eliza\",\"body\":\"$30\",\"createdAt\":\"2026-10-06T07:33:43Z\",\"closedAt\":\"2026-10-06T21:24:54Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTacvQ\",\"title\":\"Database viewer pages repeat and skip rows when the sort column has ties\",\"author\":\"hermesagent270-commits\",\"number\":34096,\"repository\":\"elizaos/eliza\",\"body\":\"The database viewer's rows API pages with OFFSET over a sort column that can tie, or with no ORDER BY at all. As a result, pages repeat some rows and skip others: in a 120-row table sorted by a two-valued column, only 98 distinct rows are shown.\\n\\n**Acceptance:**\\n- Paging uses a total order (primary-key tie-break).\\n- A real-database test shows every row exactly once.\\n\",\"createdAt\":\"2026-10-06T07:22:27Z\",\"closedAt\":\"2026-10-06T21:24:56Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTXP-A\",\"title\":\"fix(plugin-sql): three jsonb writes bypass the shared sanitizer and surface raw 22P05/22P02 driver errors\",\"author\":\"nothingxnowhere\",\"number\":34093,\"repository\":\"elizaos/eliza\",\"body\":\"$31\",\"createdAt\":\"2026-10-06T07:17:57Z\",\"closedAt\":\"2026-10-06T21:24:59Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTTq2g\",\"title\":\"Lifeops graph PATCH routes revert concurrent identity and interaction updates\",\"author\":\"hermesagent270-commits\",\"number\":34092,\"repository\":\"elizaos/eliza\",\"body\":\"The lifeops entity and relationship PATCH routes read the record, wait for the request body, and then write back a merge of that earlier read. Identities, interactions, or a retirement recorded in the meantime are reverted: identity rows are deleted, `interactionCount` rolls back, and a retired edge returns as active.\\n\\n**Acceptance:**\\n- The routes read the body first.\\n- The merge-and-write runs in one store operation.\\n- Tests reproduce the concurrent write.\\n\",\"createdAt\":\"2026-10-06T07:12:50Z\",\"closedAt\":\"2026-10-06T21:25:01Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTFHqg\",\"title\":\"SQLite adapter merges metadata on update, so keys can never be removed\",\"author\":\"hermesagent270-commits\",\"number\":34088,\"repository\":\"elizaos/eliza\",\"body\":\"The SQLite adapter merges provided metadata on `updateMemories` and `updateRelationships`, while plugin-sql replaces it. On SQLite no metadata key can ever be removed. For example, a recovered chat reply keeps its failure marker and keeps rendering as failed.\\n\\n**Acceptance:**\\n- Provided metadata replaces the stored object, as in plugin-sql.\\n- A real-SQLite test covers this.\\n\",\"createdAt\":\"2026-10-06T06:52:21Z\",\"closedAt\":\"2026-10-06T21:25:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSyJGA\",\"title\":\"MCP server discovery drops tools and resources after the first page\",\"author\":\"Guo-Yixin\",\"number\":34084,\"repository\":\"elizaos/eliza\",\"body\":\"### Problem\\r\\n\\r\\nOn develop `65621da3a424f8fcdce760db5c9c414117082e18`, `plugins/plugin-mcp/src/service.ts` requests only the first\\r\\nSDK page when listing tools, resources, and resource templates. A server returning\\r\\n`nextCursor` connects successfully but capabilities after that first page never\\r\\nreach the runtime MCP catalog/provider projection.\\r\\n\\r\\n### Reproduction and expected behavior\\r\\n\\r\\nA real stdio SDK server advertises one capability, an empty intermediate page with\\r\\na continuation cursor, and one final capability on each list. Registered\\r\\n`McpService` on an initialized SQLite runtime publishes only the first capability.\\r\\nIt should follow opaque cursors until `nextCursor` is absent and expose both.\\r\\nSingle-page and empty-catalog controls already pass on upstream.\\r\\n\\r\\nRegression evidence: 10 failures / 2 controls pass on upstream production code;\\r\\n12/12 pass with the scoped discovery fix. A PR with the real transport harness is\\r\\nprepared. No provider credentials or external MCP services are required.\\r\\n\",\"createdAt\":\"2026-10-06T06:22:32Z\",\"closedAt\":\"2026-10-06T21:27:58Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSSYKQ\",\"title\":\"Screen-time history buckets use the server's days, not the owner's\",\"author\":\"hermesagent270-commits\",\"number\":34081,\"repository\":\"elizaos/eliza\",\"body\":\"Screen-time history ranges (\\\"today\\\", \\\"this week\\\", and the daily buckets) use the server host's midnight, weekday, and dates. On a cloud host in UTC, an owner in another zone gets \\\"today\\\" starting at the wrong hour, a week starting on the UTC Sunday, and buckets on UTC days.\\n\\n**Acceptance:**\\n- History uses the owner's civil days, including across DST.\\n- Tests pin the ranges.\\n\",\"createdAt\":\"2026-10-06T05:26:52Z\",\"closedAt\":\"2026-10-06T21:28:00Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSOxGA\",\"title\":\"LIFE 'which one?' lists due times in the server's time zone\",\"author\":\"hermesagent270-commits\",\"number\":34079,\"repository\":\"elizaos/eliza\",\"body\":\"When LIFE complete or snooze asks \\\"which one?\\\" across several occurrences, it shows each due time in the server's zone. On a cloud host, a 07:00 Los Angeles dose is offered as 2:00 PM.\\n\\n**Acceptance:**\\n- Labels use the occurrence's own time zone.\\n- A test pins this.\\n\",\"createdAt\":\"2026-10-06T05:20:09Z\",\"closedAt\":\"2026-10-06T21:23:37Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSEGPg\",\"title\":\"Health summary window ends on the UTC date, missing the owner's today\",\"author\":\"hermesagent270-commits\",\"number\":34076,\"repository\":\"elizaos/eliza\",\"body\":\"The connector health summary window ends by default on the UTC date, while health samples are keyed by the provider's local day. Owners away from UTC miss \\\"today\\\" at some hours: the HEALTH action, the summary route, the provider, and connector sync all exclude it.\\n\\n**Acceptance:**\\n- The default window ends on the owner's local date.\\n- A test covers a non-UTC owner.\\n\",\"createdAt\":\"2026-10-06T04:59:22Z\",\"closedAt\":\"2026-10-06T21:23:39Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSAW_w\",\"title\":\"SCREEN_TIME today reads the UTC day instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":34074,\"repository\":\"elizaos/eliza\",\"body\":\"`SCREEN_TIME` \\\"today\\\" computes the owner's local date, but the service reads that date over the UTC day. As a result:\\n- west of UTC, tonight's usage is missing and yesterday evening is counted;\\n- east of UTC in the morning, it reports \\\"no screen time\\\".\\n\\n**Acceptance:**\\n- The daily read covers the owner's civil day, DST included, when a zone is given.\\n- Tests pin the windows.\\n\",\"createdAt\":\"2026-10-06T04:51:43Z\",\"closedAt\":\"2026-10-06T21:28:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVR6Vow\",\"title\":\"Sent-email commitments get UTC-day due dates instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":34072,\"repository\":\"elizaos/eliza\",\"body\":\"Commitments extracted from approved sent email (\\\"I'll send it tomorrow\\\") get due dates computed on the UTC day at 17:00 UTC, not on the owner's local day. #32886 fixed only the meeting-transcript path.\\n\\n**Acceptance:**\\n- The sent-mail path resolves deadlines in the owner's time zone.\\n- A test covers a non-UTC owner.\\n\",\"createdAt\":\"2026-10-06T04:39:23Z\",\"closedAt\":\"2026-10-06T21:23:42Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRv4PQ\",\"title\":\"Inbox messages API returns nothing for a source behind a busier connector\",\"author\":\"hermesagent270-commits\",\"number\":34069,\"repository\":\"elizaos/eliza\",\"body\":\"`GET /api/inbox/messages` reads one global window of `limit * 3` rows, and only then filters by source, reactions, and empty text. A busier connector ahead of the requested source empties the result: `?sources=telegram` behind newer Discord traffic returns `[]`, and nothing in the response signals that it was truncated.\\n\\n**Acceptance:**\\n- The route pages until `limit` messages survive or history ends.\\n- A real-runtime route test covers this.\\n\",\"createdAt\":\"2026-10-06T04:18:38Z\",\"closedAt\":\"2026-10-06T05:25:48Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRrjwA\",\"title\":\"Entity resolution prompt lists room history newest-first\",\"author\":\"hermesagent270-commits\",\"number\":34067,\"repository\":\"elizaos/eliza\",\"body\":\"`findEntityByName` gives the model the room history newest-first for resolving pronouns and partial names. The latest mention therefore appears first, and \\\"send him the doc\\\" can resolve to an earlier-mentioned person.\\n\\n**Acceptance:**\\n- The resolution transcript is chronological.\\n- A real-runtime test pins the order.\\n\",\"createdAt\":\"2026-10-06T04:10:44Z\",\"closedAt\":\"2026-10-06T21:19:23Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRnclg\",\"title\":\"Limited cadence-overdue relationship list returns nothing while overdue contacts exist\",\"author\":\"hermesagent270-commits\",\"number\":34065,\"repository\":\"elizaos/eliza\",\"body\":\"`RelationshipStore.list` limits the read before it applies `cadenceOverdueAsOf` and `metadataMatch`. Overdue edges are the least recently updated ones, so a limited overdue query returns the freshest edges, filters all of them out, and answers empty while overdue contacts exist.\\n\\n**Acceptance:**\\n- The limit applies after the post-filters, on both the record and SQL paths.\\n- Tests cover both paths.\\n\",\"createdAt\":\"2026-10-06T04:02:23Z\",\"closedAt\":\"2026-10-06T21:25:07Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRayug\",\"title\":\"chunkMarkdownText emits empty code blocks when a fence's closing line has trailing whitespace or a longer marker\",\"author\":\"hermesagent270-commits\",\"number\":34062,\"repository\":\"elizaos/eliza\",\"body\":\"$32\",\"createdAt\":\"2026-10-06T03:35:51Z\",\"closedAt\":\"2026-10-06T21:28:06Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRYUuA\",\"title\":\"Action and extraction prompts receive the conversation newest-first\",\"author\":\"hermesagent270-commits\",\"number\":34061,\"repository\":\"elizaos/eliza\",\"body\":\"`recentConversationTexts` returns stored room history newest-first. Every action prompt that renders it as the conversation therefore shows it backwards: the grounded reply's \\\"Complete conversation\\\", and the LifeOps task, goal, and draft extractors, and the calendar, health, and travel actions. Later corrections appear before the instructions they correct.\\n\\n**Acceptance:**\\n- The texts are chronological.\\n- A real-adapter test pins the order.\\n\",\"createdAt\":\"2026-10-06T03:30:43Z\",\"closedAt\":\"2026-10-06T21:19:29Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQ2rhg\",\"title\":\"Discord triage paging requests only limit messages per history read\",\"author\":\"hermesagent270-commits\",\"number\":34046,\"repository\":\"elizaos/eliza\",\"body\":\"Discord triage pages each channel until it yields `limit` non-agent messages (#33914), but each history read requests only `limit` messages. In agent-heavy channels, one `list_inbox` can then make hundreds of sequential Discord history requests.\\n\\n**Acceptance:**\\n- Each read requests a full 100-message page.\\n- Candidates are still counted against `limit`.\\n- A test pins the read count.\\n\",\"createdAt\":\"2026-10-06T02:26:16Z\",\"closedAt\":\"2026-10-06T21:28:08Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQtyXw\",\"title\":\"Agent's own messages keep the old name in prompts after a character rename\",\"author\":\"hermesagent270-commits\",\"number\":34040,\"repository\":\"elizaos/eliza\",\"body\":\"The agent's own entity keeps the character name it was created with. Renaming the agent (character editor, `CHARACTER` action, or first-run) updates the character and the agent row, but not the entity. Prompts label speakers with `entity.names[0]`, so the agent's own turns and its roster entry keep the old name, and a restart does not repair it.\\n\\n**Acceptance:**\\n- A rename persisted through `updateAgent` updates the agent entity.\\n- `initialize` repairs a stale entity.\\n- Real-runtime tests cover both.\\n\",\"createdAt\":\"2026-10-06T02:08:28Z\",\"closedAt\":\"2026-10-06T21:28:12Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQiaZw\",\"title\":\"CLOUD_ACCOUNT context goes stale after agent create/delete and account switch\",\"author\":\"hermesagent270-commits\",\"number\":34037,\"repository\":\"elizaos/eliza\",\"body\":\"The `CLOUD_ACCOUNT` snapshot (credits plus hosted agents) is not invalidated when hosted agents are created or shut down through the cloud routes. It also survives a sign-in to another organization on the same runtime. `elizacloud_credits` reuses that snapshot without checking its age.\\n\\n**Impact:** the planner narrates a stale agent list, and after an account switch it can show the previous organization's balance and agents labelled with the new organization's id.\\n\\n**Acceptance:**\\n- The routes invalidate the snapshot after a successful create or shutdown.\\n- A snapshot is never rendered for a different organization.\\n- The shared snapshot read honours the TTL.\\n\",\"createdAt\":\"2026-10-06T01:46:04Z\",\"closedAt\":\"2026-10-06T21:28:14Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQchgA\",\"title\":\"Gmail triage list/search read only the first requested account\",\"author\":\"hermesagent270-commits\",\"number\":34034,\"repository\":\"elizaos/eliza\",\"body\":\"`GoogleGmailAdapter` declares multi-account support, but its list and search paths query only `worldIds[0]`. As a result, `MESSAGE triage` / `list_inbox` / `search_inbox` across several Gmail accounts silently omits every account after the first.\\n\\n**Acceptance:**\\n- Every requested account is queried.\\n- Results are merged newest-first before the limit.\\n- A test covers both list and search.\\n\",\"createdAt\":\"2026-10-06T01:33:48Z\",\"closedAt\":\"2026-10-06T21:30:33Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVKX3oQ\",\"title\":\"plugin-wallet x402: concurrent payments can exceed per-service daily budget (check and record span the on-chain transfer)\",\"author\":\"domondi1\",\"number\":33927,\"repository\":\"elizaos/eliza\",\"body\":\"$33\",\"createdAt\":\"2026-10-05T15:56:57Z\",\"closedAt\":\"2026-10-06T02:28:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVKDFbg\",\"title\":\"Discord inbox triage loses user messages behind the agent's own replies\",\"author\":\"hermesagent270-commits\",\"number\":33915,\"repository\":\"elizaos/eliza\",\"body\":\"The Discord triage adapter reads the newest `limit` messages per channel and drops the agent's own messages afterwards. In any channel where the agent has replied recently, those replies fill the window, so `MESSAGE triage` / `list_inbox` returns few or no inbox items even though older user messages exist.\\n\\n**Acceptance:**\\n- Each channel yields up to `limit` non-agent messages by paging older.\\n- Tests cover the paging and a read that ignores `before`.\\n\",\"createdAt\":\"2026-10-05T15:33:39Z\",\"closedAt\":\"2026-10-05T15:45:27Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVKALHA\",\"title\":\"Inbox iMessage deep links ignore the chat id plugin-imessage stores\",\"author\":\"cursor\",\"number\":33912,\"repository\":\"elizaos/eliza\",\"body\":\"`buildIMessageLink` only reads room `handle`, `chatIdentifier`, and `chat_identifier`. `plugin-imessage` `ensureRoomExists` stores chat.db `chat_identifier` as room metadata `chatId` and `Room.channelId`, and never writes those three keys. Every iMessage inbox row therefore falls back to `/inbox`.\\n\\n1:1 identifiers are a phone or email, either bare (`+15551234567`, `person@icloud.com`) or wrapped (`iMessage;-;+15551234567`). Group ids (`chat…`, `iMessage;+;chat…`) have no public `imessage://` URL and must stay null.\\n\\n**Acceptance:**\\n- A 1:1 room whose `chatId` or `channelId` is `iMessage;-;+15551234567`, a bare E.164 number, or an email builds `imessage://…` with that address.\\n- A group room (`iMessage;+;chat123` or `chat839…`) still returns null.\\n- Existing `handle` / `chat_identifier` links are unchanged.\\n\\nAI assistance: yes. Provider/model: xAI / Grok 4.7. Client: Cursor cloud agent.\",\"createdAt\":\"2026-10-05T15:30:21Z\",\"closedAt\":\"2026-10-06T21:28:23Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVJO9rg\",\"title\":\"turbo rewrites AGENTS.md on every agent-run verify/build\",\"author\":\"hermesagent270-commits\",\"number\":33902,\"repository\":\"elizaos/eliza\",\"body\":\"`turbo` 2.11 adds a managed guidance block to the root `AGENTS.md` before repository-scoped commands whenever it detects an AI agent, because `agentGuidance` defaults to `true`. As a result, every agent-run `bun run verify` or build leaves `AGENTS.md` modified with generic Turborepo text.\\n\\n**Acceptance:**\\n- Set `\\\"agentGuidance\\\": false` in the root `turbo.json`.\\n- After an agent-run `verify`, `AGENTS.md` is still clean.\\n\",\"createdAt\":\"2026-10-05T14:36:24Z\",\"closedAt\":\"2026-10-05T15:40:31Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVIc04w\",\"title\":\"LifeOps Telegram search returns null senderId and null dialogId for agent replies\",\"author\":\"hermesagent270-commits\",\"number\":33887,\"repository\":\"elizaos/eliza\",\"body\":\"`memoryToTelegramMessageSearchResult` (plugin-personal-assistant lifeops/domains/telegram-service.ts) reads `telegram.senderId`/`metadata.senderId`, but plugin-telegram stamps the sender as `telegram.userId`/`telegramUserId`, so every hit has `senderId: null`. Agent replies store `telegram.chatId` as a number (`sentMessage.chat.id`), which the string-only check drops, so their `dialogId` is null.\\n\\nFix: #33886\",\"createdAt\":\"2026-10-05T13:44:37Z\",\"closedAt\":\"2026-10-05T13:52:23Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVIa1Lw\",\"title\":\"Model cancellation can overwrite the first abort reason during provider cleanup\",\"author\":\"hermesagent270-commits\",\"number\":33883,\"repository\":\"elizaos/eliza\",\"body\":\"$34\",\"createdAt\":\"2026-10-05T13:42:33Z\",\"closedAt\":\"2026-10-05T13:56:57Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVIZUbA\",\"title\":\"Inbox chat deep links are always null for Discord and Slack\",\"author\":\"hermesagent270-commits\",\"number\":33882,\"repository\":\"elizaos/eliza\",\"body\":\"`fetchChatMessages` (plugin-inbox message-fetcher.ts) builds deep links from `room.metadata`, but connectors store the platform channel on `Room.channelId`, so `buildDiscordLink`/`buildSlackLink` always return null. It also passes the runtime memory UUID as the message id instead of `metadata.messageIdFull` (Discord snowflake / Slack ts).\\n\\nFix: #33880\",\"createdAt\":\"2026-10-05T13:40:55Z\",\"closedAt\":\"2026-10-05T13:52:20Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVIKsgg\",\"title\":\"CHARACTER modify prompts show the recent conversation newest-first\",\"author\":\"hermesagent270-commits\",\"number\":33874,\"repository\":\"elizaos/eliza\",\"body\":\"The `CHARACTER` action's `buildRecentConversationContext` reads the room's messages without specifying an order. Adapters default to newest-first, so the `RECENT CONVERSATION:` block in the modify and per-user preference prompts shows the conversation backwards.\\n\\n**Acceptance:**\\n- The block is chronological.\\n- A real-adapter test pins the order.\\n\",\"createdAt\":\"2026-10-05T13:25:05Z\",\"closedAt\":\"2026-10-05T13:48:52Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVFwt9Q\",\"title\":\"LifeOps Discord search returns memory UUIDs and null guild ids\",\"author\":\"hermesagent270-commits\",\"number\":33825,\"repository\":\"elizaos/eliza\",\"body\":\"`memoryToDiscordMessageSearchResult` (plugin-personal-assistant lifeops/domains/discord-service.ts) reads `metadata.messageId` and `metadata.discordGuildId`, but Discord connector memories from `buildMemoryFromMessage` carry `discordMessageId`/`messageIdFull` and `discordServerId`. Every delegated search hit returns the runtime memory UUID as `id` and `guildId: null`; cross-channel search cites `discord:\u003cuuid\u003e` instead of the Discord message.\\n\\nFix: #33824\",\"createdAt\":\"2026-10-05T10:21:16Z\",\"closedAt\":\"2026-10-05T13:50:14Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVE6SaA\",\"title\":\"Gmail sinceMs drops messages on exact whole-second boundaries\",\"author\":\"hermesagent270-commits\",\"number\":33807,\"repository\":\"elizaos/eliza\",\"body\":\"$35\",\"createdAt\":\"2026-10-05T09:13:01Z\",\"closedAt\":\"2026-10-05T13:45:57Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVESsaQ\",\"title\":\"Gmail triage applies the result limit before channel and time filters\",\"author\":\"hermesagent270-commits\",\"number\":33789,\"repository\":\"elizaos/eliza\",\"body\":\"`GoogleGmailAdapter` list/search send `maxResults: limit` to Gmail with a query that omits `channelIds` and `sinceMs`, then filter locally, so the newest provider page can contain no match while older matches exist (search \\\"invoice\\\" in INBOX with limit 5 returns 0 when the 6 newest hits are sent mail). The channel check also compares only `labels[0]`, so inbox mail whose first label is UNREAD/IMPORTANT never matches INBOX.\\n\\nFix: #33788\",\"createdAt\":\"2026-10-05T08:21:13Z\",\"closedAt\":\"2026-10-05T13:46:00Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVD_CPQ\",\"title\":\"Google Chat connector only sees the first spaces.list page\",\"author\":\"hermesagent270-commits\",\"number\":33779,\"repository\":\"elizaos/eliza\",\"body\":\"`GoogleChatService.getSpaces` makes one `GET /v1/spaces` call and ignores `nextPageToken`; spaces.list returns at most 100 spaces per page by default. Connector target resolution, recent targets, rooms and chat context (via `listConnectorSpaces`) never see spaces past the first page, so an account in more than 100 spaces cannot resolve the rest.\\n\\nFix: #33778\",\"createdAt\":\"2026-10-05T07:54:58Z\",\"closedAt\":\"2026-10-05T13:46:02Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVD32LA\",\"title\":\"Discord cached chat context attributes the agent's own bot as a separate entity\",\"author\":\"hermesagent270-commits\",\"number\":33774,\"repository\":\"elizaos/eliza\",\"body\":\"$36\",\"createdAt\":\"2026-10-05T07:44:43Z\",\"closedAt\":\"2026-10-05T13:46:05Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVD0o-g\",\"title\":\"Telegram personal history credits incoming DMs to a synthetic service sender\",\"author\":\"hermesagent270-commits\",\"number\":33771,\"repository\":\"elizaos/eliza\",\"body\":\"Incoming private messages omit `from_id` since MTProto layer 119. The personal-account connector projects raw `messages.GetHistory` rows (`account-client-service.ts` `project()`) and, without `fromId`, assigns `fromId: \\\"service:\u003cpeer\u003e\\\"` and a synthetic entity, so MESSAGE read_channel and search credit the other person's DMs to a non-existent sender. GramJS's Message wrapper resolves the sender to the peer for non-outgoing PeerUser messages; raw invoke results skip it.\\n\\nFix: #33769\",\"createdAt\":\"2026-10-05T07:40:09Z\",\"closedAt\":\"2026-10-05T13:46:07Z\",\"state\":\"CLOSED\",\"commentCount\":1}],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs8AAAABGpCBaw\",\"title\":\"Promote qualified staging into production\",\"author\":\"lalalune\",\"number\":33708,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T05:39:55Z\",\"mergedAt\":null,\"additions\":3776993,\"deletions\":3207813},{\"id\":\"PR_kwDOMT5cIs8AAAABFPK6lA\",\"title\":\"Promote develop to staging\",\"author\":\"lalalune\",\"number\":32809,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-26T10:14:25Z\",\"mergedAt\":\"2026-10-03T23:05:41Z\",\"additions\":3053643,\"deletions\":2975977},{\"id\":\"PR_kwDOMT5cIs8AAAABGiUiEw\",\"title\":\"Promote reviewed runtime integration to staging\",\"author\":\"lalalune\",\"number\":33420,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T10:20:27Z\",\"mergedAt\":\"2026-10-04T10:33:44Z\",\"additions\":274920,\"deletions\":297170},{\"id\":\"PR_kwDOMT5cIs8AAAABGhq-CA\",\"title\":\"fix: integrate core app UI and testing ownership refactors\",\"author\":\"lalalune\",\"number\":33377,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T08:19:05Z\",\"mergedAt\":\"2026-10-04T10:17:58Z\",\"additions\":140658,\"deletions\":159823},{\"id\":\"PR_kwDOMT5cIs8AAAABGgogWg\",\"title\":\"Promote current runtime and device clients to staging\",\"author\":\"lalalune\",\"number\":33299,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:16:28Z\",\"mergedAt\":\"2026-10-04T04:21:18Z\",\"additions\":77901,\"deletions\":1148},{\"id\":\"PR_kwDOMT5cIs8AAAABGhoBcg\",\"title\":\"refactor(core)!: separate kernel, host and domain ownership\",\"author\":\"lalalune\",\"number\":33368,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T08:10:08Z\",\"mergedAt\":\"2026-10-04T10:18:01Z\",\"additions\":71878,\"deletions\":76765},{\"id\":\"PR_kwDOMT5cIs8AAAABGf8Eqw\",\"title\":\"feat(os): share native OTA trust engine with compiled host policy\",\"author\":\"lalalune\",\"number\":33251,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:35:26Z\",\"mergedAt\":\"2026-10-04T02:36:10Z\",\"additions\":48936,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABG0b3Aw\",\"title\":\"Promote reviewed develop fixes into staging\",\"author\":\"lalalune\",\"number\":34027,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T00:45:46Z\",\"mergedAt\":\"2026-10-06T15:34:08Z\",\"additions\":48332,\"deletions\":33362},{\"id\":\"PR_kwDOMT5cIs8AAAABGhwYsg\",\"title\":\"Consolidate testing fixtures and integrate leased API scenario worlds\",\"author\":\"lalalune\",\"number\":33386,\"body\":\"$3f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T08:36:47Z\",\"mergedAt\":\"2026-10-04T10:18:01Z\",\"additions\":44894,\"deletions\":53363},{\"id\":\"PR_kwDOMT5cIs8AAAABGo1pyw\",\"title\":\"Promote reviewed develop into staging\",\"author\":\"lalalune\",\"number\":33693,\"body\":\"Promote the reviewed develop branch into staging using the literal branch relationship required by deployment provenance checks. Earlier staging backports and the superseded promotion candidate have been reconciled into develop without dropping their content.\\n\\nDraft while the final develop workflow run and remaining failure audit are qualified. Focused reminder, plugin-regression, and Android-runner tests and their repository-wide verification passed on the reviewed PR heads; these are not a substitute for final destination validation. Production reconciliation remains separate.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T05:08:53Z\",\"mergedAt\":\"2026-10-05T05:32:50Z\",\"additions\":42854,\"deletions\":40326},{\"id\":\"PR_kwDOMT5cIs8AAAABGhTb5g\",\"title\":\"Integrate reviewed agent, auth, benchmark, billing and native changes\",\"author\":\"lalalune\",\"number\":33333,\"body\":\"$40\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:01:11Z\",\"mergedAt\":\"2026-10-04T07:19:35Z\",\"additions\":38948,\"deletions\":39103},{\"id\":\"PR_kwDOMT5cIs8AAAABGgDbfA\",\"title\":\"Promote reviewed shared Android platform and current runtime to staging\",\"author\":\"lalalune\",\"number\":33260,\"body\":\"Advance staging to the reviewed develop integration, including the shared Android speech tooling and native adapter contracts from #33253. AlphaPhone can then consume the current upstream platform without restoring local patches.\\n\\nThe merge is conflict-free. Its computed tree exactly matches develop at 1dd84321762d6fb39e11b405d87aff07d88af8f2; staging-only speech warmup, late-abort receipts, owning test-runner changes, cloud build exclusions, and source credential gates are preserved.\\n\\nValidation: the shared-platform app suite passed 160 Node tests, 26 Bun tests, and four real mobile/auth integration tests. Five speech Java classes, five speech manifests/patch inputs, and 2,344 historical baseline source hashes were checked for preservation. Root verification and final hosted validation are running; consumer APK and emulator qualification remain separate.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T02:03:07Z\",\"mergedAt\":\"2026-10-04T02:03:35Z\",\"additions\":19261,\"deletions\":1559},{\"id\":\"PR_kwDOMT5cIs8AAAABGJq6gg\",\"title\":\"Add durable approved workflows and device actions with managed Cloud identity\",\"author\":\"lalalune\",\"number\":33002,\"body\":\"$41\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T18:19:15Z\",\"mergedAt\":\"2026-10-02T05:54:22Z\",\"additions\":18603,\"deletions\":426},{\"id\":\"PR_kwDOMT5cIs8AAAABGiDwnQ\",\"title\":\"refactor(ui): consolidate public APIs, move host ownership, and remove dead code\",\"author\":\"lalalune\",\"number\":33398,\"body\":\"$42\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T09:35:40Z\",\"mergedAt\":\"2026-10-04T10:18:00Z\",\"additions\":16456,\"deletions\":22248},{\"id\":\"PR_kwDOMT5cIs8AAAABGg0pjw\",\"title\":\"Consolidate benchmark infrastructure and harden result evidence\",\"author\":\"lalalune\",\"number\":33319,\"body\":\"$43\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T05:05:13Z\",\"mergedAt\":\"2026-10-04T07:19:37Z\",\"additions\":16224,\"deletions\":18001},{\"id\":\"PR_kwDOMT5cIs8AAAABFZZrZw\",\"title\":\"Harden action admission, confidential host boundaries, and privacy controls\",\"author\":\"lalalune\",\"number\":32871,\"body\":\"$44\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-27T22:14:42Z\",\"mergedAt\":\"2026-10-01T11:41:55Z\",\"additions\":15884,\"deletions\":6020},{\"id\":\"PR_kwDOMT5cIs8AAAABGhcaUw\",\"title\":\"fix(native-agent): retire stale WebView health observations\",\"author\":\"lalalune\",\"number\":33346,\"body\":\"$45\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T
