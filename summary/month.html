 into #34189 so they can land independently. Once that branch merges, this diff will contain only the Clock work and its test fixture repair. Original Clock ancestry is preserved from #34167.\\n\\nThe eight controlled-host browser cases, normal desktop/mobile Clock flow, 321 Java checks, and 218 app audit browser checks pass. Physical phone-flow acceptance and installed-alarm readback remain missing. An opened receipt is dispatch evidence, not proof of a saved or ringing alarm. This draft stays open until the original Clock acceptance gates are met.\\n\\nThe complete audit OCR step timed out under Bun; an unchanged Node-based OCR retry is running over the existing captures. MP4 recordings are saved locally; permission to upload them is pending. Full combined-root tests also found timeouts in unchanged restore and retention tests; no speculative restore optimization or timeout increase is included.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T21:16:29Z\",\"mergedAt\":null,\"additions\":9465,\"deletions\":429},{\"id\":\"PR_kwDOMT5cIs8AAAABG0sU7A\",\"title\":\"feat(app): serve authenticated self-hosted Cartesia voice sessions\",\"author\":\"NubsCarson\",\"number\":34030,\"body\":\"$4b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T01:22:47Z\",\"mergedAt\":\"2026-10-06T15:05:48Z\",\"additions\":9335,\"deletions\":7212},{\"id\":\"PR_kwDOMT5cIs8AAAABFZLPFg\",\"title\":\"fix(core,agent,app): quality-review bug fixes\",\"author\":\"lalalune\",\"number\":32867,\"body\":\"$4c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-27T21:33:38Z\",\"mergedAt\":\"2026-10-01T12:29:13Z\",\"additions\":8896,\"deletions\":2614},{\"id\":\"PR_kwDOMT5cIs8AAAABGCQetA\",\"title\":\"feat(agent): add host credential and Cloud action policies\",\"author\":\"lalalune\",\"number\":32987,\"body\":\"$4d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T06:07:15Z\",\"mergedAt\":\"2026-10-01T12:16:57Z\",\"additions\":8312,\"deletions\":536},{\"id\":\ fixes to staging\",\"author\":\"lalalune\",\"number\":33913,\"body\":\"$54\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T15:32:40Z\",\"mergedAt\":\"2026-10-05T17:58:36Z\",\"additions\":6730,\"deletions\":3006},{\"id\":\"PR_kwDOMT5cIs8AAAABGgvnKA\",\"title\":\"refactor(auth): consolidate services, delivery, and package ownership\",\"author\":\"lalalune\",\"number\":33313,\"body\":\"$55\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:45:36Z\",\"mergedAt\":\"2026-10-04T07:19:37Z\",\"additions\":6681,\"deletions\":8797},{\"id\":\"PR_kwDOMT5cIs8AAAABGgqEZg\",\"title\":\"Add crypto terminal: live markets, paper trading, price alerts, token safety\",\"author\":\"jlhawkins541\",\"number\":33303,\"body\":\"$56\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:22:50Z\",\"mergedAt\":null,\"additions\":6511,\"deletions\":35},{\"id\":\"PR_kwDOMT5cIs8AAAABGf4Rlw\",\"title\":\"feat(agent): share native gateway and runtime host mechanisms\",\"author\":\"lalalune\",\"number\":33250,\"body\":\"$57\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:21:37Z\",\"mergedAt\":\"2026-10-04T02:44:52Z\",\"additions\":5975,\"deletions\":26},{\"id\":\"PR_kwDOMT5cIs8AAAABGBryyQ\",\"title\":\"feat(ui): shared task choices and speech segments\",\"author\":\"lalalune\",\"number\":32981,\"body\":\"$58\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T04:39:03Z\",\"mergedAt\":\"2026-10-01T12:16:30Z\",\"additions\":5953,\"deletions\":437},{\"id\":\"PR_kwDOMT5cIs8AAAABGl1j2Q\",\"title\":\"Promote reviewed runtime, billing and benchmark repairs to staging\",\"author\":\"lalalune\",\"number\":33541,\"body\":\"Promote the reviewed develop batch through d77085d53c85 to staging. This includes agent cleanup with restored persisted-schedule migration, OTA preparation and source tooling, original invoice attribution, benchmark evidence/scoring cleanup with sparse-label and Python 3.11 fixes, shared domain similarity and hosted WebView tooling, and workflow fixture repairs.\\n\\nThe merge is conflict-free and its tree is identical to the reviewed develop head. Targeted runtime/storage, PostgreSQL, browser and native-host contracts passed across the reviewed PRs; the shared hosted-fixture run passed 90 tests. Consolidated repository verification is running on candidate 299951609cfe40bca29fcc47bea1d61745685962. Four benchmark campaign tests are being rechecked after installing the declared CI dependencies; no current full-green claim is made. No AOSP boot, live provider, production OTA or physical-device qualification is implied.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:17:04Z\",\"mergedAt\":\"2026-10-04T20:17:32Z\",\"additions\":5729,\"deletions\":5444},{\"id\":\"PR_kwDOMT5cIs8AAAABGBpDvw\",\"title\":\"feat(browser): task-bound native actions and guidance\",\"author\":\"lalalune\",\"number\":32980,\"body\":\"$59\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T04:32:30Z\",\"mergedAt\":\"2026-10-01T12:16:25Z\",\"additions\":5571,\"deletions\":357},{\"id\":\"PR_kwDOMT5cIs8AAAABGgmbsA\",\"title\":\"Upstream host-configured Maps, Files and Notes clients\",\"author\":\"lalalune\",\"number\":33295,\"body\":\"$5a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:08:40Z\",\"mergedAt\":\"2026-10-04T04:17:46Z\",\"additions\":5442,\"deletions\":30},{\"id\":\"PR_kwDOMT5cIs8AAAABGpZ9MQ\",\"title\":\"Promote reviewed develop fixes to staging\",\"author\":\"lalalune\",\"number\":33739,\"body\":\"$5b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T06:30:56Z\",\"mergedAt\":\"2026-10-05T06:44:25Z\",\"additions\":5366,\"deletions\":437},{\"id\":\"PR_kwDOMT5cIs8AAAABG0vGpg\",\"title\":\"fix(assistant): ground direct replies and narrow planner inputs\",\"author\":\"NubsCarson\",\"number\":34032,\"body\":\"$5c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T01:29:21Z\",\"mergedAt\":\"2026-10-06T14:58:39Z\",\"additions\":5272,\"deletions\":297},{\"id\":\"PR_kwDOMT5cIs8AAAABGmL0Ug\",\"title\":\"fix(knowledge): keep story declarations out of runtime source\",\"author\":\"lalalune\",\"number\":33558,\"body\":\"The Knowledge declaration build included Storybook files that import UI implementation files. With `tsc6 --noCheck` and the plugin's narrow `rootDir`, this emitted declarations into `packages/ui/src`, making an otherwise successful clean resident installation fail immutable-source verification.\\n\\nExclude `.stories.ts` and `.stories.tsx` consistently with neighboring plugins. A real compiler regression fixture reproduces `csrf-cookie.d.ts` pollution before this change and passes afterward; the Alpha Phone consumer retains this regression test. Full clean consumer preparation is running.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:12:22Z\",\"mergedAt\":null,\"additions\":5142,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGXR9Cg\",\"title\":\"Fix native reminder plans, controls and review evidence\",\"author\":\"NubsCarson\",\"number\":33096,\"body\":\"$5d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:15:13Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":5137,\"deletions\":312},{\"id\":\"PR_kwDOMT5cIs8AAAABGgWZvw\",\"title\":\"feat(personal-assistant): share owner-bound bill host orchestration\",\"author\":\"lalalune\",\"number\":33281,\"body\":\"$5e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:13:47Z\",\"mergedAt\":\"2026-10-04T03:45:36Z\",\"additions\":4872,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABGqBpvg\",\"title\":\"Promote reviewed billing and Telegram fixes to staging\",\"author\":\"lalalune\",\"number\":33768,\"body\":\"$5f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T07:38:02Z\",\"mergedAt\":\"2026-10-05T08:09:50Z\",\"additions\":4591,\"deletions\":5587},{\"id\":\"PR_kwDOMT5cIs8AAAABGhvFzA\",\"title\":\"refactor(app): consolidate ownership and retire legacy scaffolding\",\"author\":\"lalalune\",\"numbe "elizaos/eliza\",\"createdAt\":\"2026-10-05T04:40:45Z\",\"mergedAt\":\"2026-10-05T04:56:07Z\",\"additions\":3632,\"deletions\":19},{\"id\":\"PR_kwDOMT5cIs8AAAABFxPgAw\",\"title\":\"Manage saved Reminders in Automations without adding them to Todos\",\"author\":\"NubsCarson\",\"number\":32939,\"body\":\"$67\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:20:57Z\",\"mergedAt\":\"2026-10-01T12:51:40Z\",\"additions\":3365,\"deletions\":229},{\"id\":\"PR_kwDOMT5cIs8AAAABGl9twQ\",\"title\":\"Promote Android reminder background I/O to consumer staging\",\"author\":\"lalalune\",\"number\":33548,\"body\":\"Promote elizaOS/eliza#33547's Android reminder tap background-I/O fix to consumer staging. The candidate starts at AlphaPhone's reviewed 49a9773564073bd8feae8bad71fade371fccdb4f source pin and adds only this change, so the consumer can adopt it without unrelated runtime changes.\\n\\nThe reminder package contents match the develop candidate. Package tests/typecheck/lint and Android fixture builds pass there; all three real independent emulator tests pass, covering slow-store UI responsiveness, permission/CRUD bridge behavior and engine isolation. Full develop-root verification passes all 298 tasks and repository audits after the unrelated develop assertion fix in #33549. AlphaPhone's encrypted-store/PendingIntent upgrade qualification and adoption remain separate work.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:36:26Z\",\"mergedAt\":\"2026-10-04T20:43:31Z\",\"additions\":3303,\"deletions\":29},{\"id\":\"PR_kwDOMT5cIs8AAAABGxwJtA\",\"title\":\"refactor(core): consolidate domain modules and move platform ownership to host\",\"author\":\"lalalune\",\"number\":33965,\"body\":\"$68\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T19:21:42Z\",\"mergedAt\":\"2026-10-05T19:32:51Z\",\"additions\":3177,\"deletions\":3172},{\"id\":\"PR_kwDOMT5cIs8AAAABGlxYww\",\"title\":\"Promote shared hosted WebView provisioning to consumer staging\",\"author\":\"lalalune\",\"number\":33539,\"body\":\"Promote the shared hosted WebView provisioner from #33538 to consumer staging. The candidate is based on Alpha's current reviewed d6de9d8317f60f381643640f8a98d12328ab51dd pin and adds only the shared provisioner, archive extractor, tests/fixture and documentation. Consumers may pin this reviewed candidate commit without unrelated runtime changes.\\n\\nThe helper content is identical to the develop candidate, where 65 focused tests and Biome checks pass. All 65 focused staging tests pass. Full develop-root verification passes all 297 tasks and repository audits. The change preserves strict fixture/provider admission and adds explicit host configuration plus optimization-independent archive validation. No fresh hosted emulator or runtime-feature acceptance is claimed.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:05:41Z\",\"mergedAt\":\"2026-10-04T20:15:27Z\",\"additions\":3168,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGlweQQ\",\"title\":\"Share pinned hosted WebView provisioning across consumer apps\",\"author\":\"lalalune\",\"number\":33538,\"body\":\"$69\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:03:21Z\",\"mergedAt\":\"2026-10-04T20:15:04Z\",\"additions\":3168,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGgUq6w\",\"title\":\"feat(os): share OTA release verification, authorization and admission\",\"author\":\"lalalune\",\"number\":33278,\"body\":\"$6a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:06:59Z\",\"mergedAt\":null,\"additions\":2888,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGlrtAA\",\"title\":\"fix(benchmarks): preserve evidence and simplify harness contracts\",\"author\":\"lalalune\",\"number\":33532,\"body\":\"$6b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:50:23Z\",\"mergedAt\":\"2026-10-04T20:01:44Z\",\"additions\":2795,\"deletions\":3121},{\"id\":\"PR_kwDOMT5cIs8AAAABGlTsYA\",\"title\":\"Integrate reviewed upgrade quotes and develop regression fixes\",\"author\":\"lalalune\",\"number\":33508,\"body\":\"$6c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T18:47:57Z\",\"mergedAt\":\"2026-10-04T18:50:22Z\",\"additions\":2774,\"deletions\":234},{\"id\":\"PR_kwDOMT5cIs8AAAABGmJOGA\",\"title\":\"refactor(app): retire legacy paths and consolidate package ownership\",\"author\":\"lalalune\",\"number\":33554,\"body\":\"$6d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:05:01Z\",\"mergedAt\":\"2026-10-05T02:33:37Z\",\"additions\":2652,\"deletions\":7093},{\"id\":\"PR_kwDOMT5cIs8AAAABGgMN-A\",\"title\":\"feat(app): share native consumer gateway and Cloud adapters\",\"author\":\"lalalune\",\"number\":33266,\"body\":\"$6e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T02:34:51Z\",\"mergedAt\":null,\"additions\":2609,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABGlNrFQ\",\"title\":\"feat(cloud): add organization upgrade reviews and confirmation journal\",\"author\":\"lalalune\",\"number\":33506,\"body\":\"$6f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T18:33:19Z\",\"mergedAt\":\"2026-10-04T18:50:24Z\",\"additions\":2553,\"deletions\":196},{\"id\":\"PR_kwDOMT5cIs8AAAABGmXlmA\",\"title\":\"refactor(ui): consolidate APIs, contracts, and state ownership\",\"author\":\"lalalune\",\"number\":33566,\"body\":\"UI consumers currently depend on forwarding modules, retired routes and duplicated state. This consolidates public JavaScript APIs at the package root, moves internal imports to their owners, removes dead modules, and migrates app and plugin consumers together.\\n\\nThe coordinated contract changes preserve explicit view visibility and XR modality, require server-authoritative auth roles, use canonical device status, and remove the UI hardware-classification fallback. Conversation visibility follows explicit scope rather than titles; persistence failures stay visible; shared dialog focus and render telemetry replace duplicate implementations.\\n\\nValidation is in progress. Focused UI boundary tests (46) and remote-view decoder tests (2) pass; UI lint has no errors. Full UI tests, remaining owning-package checks, packed API validation, app desktop/mobile visual audit, and repository verification are still pending. This PR remains a draft until those checks are complete.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:45:03Z\",\"mergedAt\":\"2026-10-05T01:17:38Z\",\"additions\":2447,\"deletions\":9608},{\"id\":\"PR_kwDOMT5cIs8AAAABGhggOw\",\"title\":\"Preserve navigation and Calendar reads while trimming completed reply context\",\"author\":\"NubsCarson\",\"number\":33358,\"body\":\"$70\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:47:02Z\",\"mergedAt\":\"2026-10-04T08:04:45Z\",\"additions\":2373,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs8AAAABGqES3g\",\"title\":\"refactor(core): consolidate source modules and production comments\",\"author\":\"lalalune\",\"number\":33772,\"body\":\"$71\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T07:42:33Z\",\"mergedAt\":\"2026-10-05T08:06:08Z\",\"additions\":2348,\"deletions\":5283},{\"id\":\"PR_kwDOMT5cIs8AAAABGgdDXQ\",\"title\":\"feat(app): share consent-bound research collector and task trace hosts\",\"author\":\"lalalune\",\"number\":33290,\"body\":\"$72\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:39:47Z\",\"mergedAt\":\"2026-10-04T04:29:37Z\",\"additions\":2346,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGqxOpA\",\"title\":\"Promote reviewed develop fixes into staging\",\"author\":\"lalalune\",\"number\":33799,\"body\":\"$73\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T08:53:12Z\",\"mergedAt\":\"2026-10-05T08:57:15Z\",\"additions\":2328,\"deletions\":151},{\"id\":\"PR_kwDOMT5cIs8AAAABHAZ_Bg\",\"title\":\"fix: land reviewed runtime and data correctness repairs\",\"author\":\"lalalune\",\"number\":34189,\"body\":\"$74\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T22:03:52Z\",\"mergedAt\":null,\"additions\":2160,\"deletions\":129},{\"id\":\"PR_kwDOMT5cIs8AAAABGXbC8Q\",\"title\":\"Enable configured Android reminder push delivery\",\"author\":\"NubsCarson\",\"number\":33106,\"body\":\"$75\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:36:06Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":2046,\"deletions\":169},{\"id\":\"PR_kwDOMT5cIs8AAAABGmHCkA\",\"title\":\"Promote reviewed upgrade and browser fixes to staging\",\"author\":\"lalalune\",\"number\":33551,\"body\":\"Promote the reviewed develop batch to staging, including atomic paid-upgrade completion, website blocking fixes, browser consumer preparation and recorded benchmark deadlines. The merge is conflict-free and its tree matches develop f9ddff7c876a.\\n\\nValidation: the previous staging candidate passed root `bun run verify` (298 tasks). This delta passed 16 PostgreSQL finalization tests, 44 billing component tests, 17 website-blocking engine tests, and 3 browser consumer filesystem/subprocess tests. Full hosted verification of this combined head remains pending.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:58:49Z\",\"mergedAt\":\"2026-10-04T20:59:02Z\",\"additions\":1998,\"deletions\":128},{\"id\":\"PR_kwDOMT5cIs8AAAABGhgxNA\",\"title\":\"Keep reminder alerts and owner brief facts accurate\",\"author\":\"NubsCarson\",\"number\":33359,\"body\":\"$76\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:47:55Z\",\"mergedAt\":\"2026-10-04T08:04:45Z\",\"additions\":1932,\"deletions\":212},{\"id\":\"PR_kwDOMT5cIs8AAAABGfYJUw\",\"title\":\"feat(native): share host custody, runtime and update primitives\",\"author\":\"lalalune\",\"number\":33242,\"body\":\"$77\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T23:23:05Z\",\"mergedAt\":\"2026-10-03T23:28:11Z\",\"additions\":1895,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABG1bVvw\",\"title\":\"fix(ui): remove Home Today cards and repair Once automations\",\"author\":\"NubsCarson\",\"number\":34059,\"body\":\"$78\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T03:13:54Z\",\"mergedAt\":\"2026-10-06T14:58:51Z\",\"additions\":1888,\"deletions\":1349},{\"id\":\"PR_kwDOMT5cIs8AAAABGYIhyw\",\"title\":\"fix(personal-assistant): ground owner briefs and preserve scheduled copy\",\"author\":\"NubsCarson\",\"number\":33114,\"body\":\"$79\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T00:37:45Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":1837,\"deletions\":212},{\"id\":\"PR_kwDOMT5cIs8AAAABGlr7Rg\",\"title\":\"Promote shared consumer source and Android fixture tooling\",\"author\":\"lalalune\",\"number\":33533,\"body\":\"Promote the consumer source verifier (#33529) and hosted Android fixture helpers (#33530) to staging. The candidate is based on Alpha's current reviewed pin, 4c7cc7038b6e77581bd81468cba1b45374deec6c, so consumers may adopt the published candidate commit without unrelated runtime changes.\\n\\nAll 34 focused source-integrity and hosted-fixture tests pass on this candidate. Source-verifier full upstream verification passed 297 tasks and final audits; the combined fixture branch also passed all 297 root verification tasks and final audits. No fresh hosted-emulator qualification is claimed. The candidate changes only shared build helpers, tests, fixtures, consumer typecheck coverage and documentation.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:50:53Z\",\"mergedAt\":\"2026-10-04T19:52:29Z\",\"additions\":1816,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABGfIViQ\",\"title\":\"Integrate latest runtime and retire AlphaPhone patch overlays\",\"author\":\"lalalune\",\"number\":33230,\"body\":\"$7a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T22:42:54Z\",\"mergedAt\":\"2026-10-03T22:56:34Z\",\"additions\":1782,\"deletions\":116},{\"id\":\"PR_kwDOMT5cIs8AAAABGng6mg\",\"title\":\"feat(cloud): review scheduled organization downgrades\",\"author\":\"lalalune\",\"number\":33628,\"body\":\"$7b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T01:21:40Z\",\"mergedAt\":\"2026-10-05T01:28:46Z\",\"additions\":1777,\"deletions\":373},{\"id\":\"PR_kwDOMT5cIs8AAAABGpnElw\",\"title\":\"feat(cloud): settle scheduled target renewals and retain paid authority\",\"author\":\"lalalune\",\"number\":33749,\"body\":\"$7c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T06:53:07Z\",\"mergedAt\":\"2026-10-05T07:11:06Z\",\"additions\":1723,\"deletions\":64},{\"id\":\"PR_kwDOMT5cIs8AAAABGatlxQ\",\"title\":\"feat(os): opt in to signer-bound Chromium activity embedding\",\"author\":\"lalalune\",\"number\":33167,\"body\":\"$7d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T09:49:16Z\",\"mergedAt\":\"2026-10-03T10:09:38Z\",\"additions\":1688,\"deletions\":37},{\"id\":\"PR_kwDOMT5cIs8AAAABGsrBrQ\",\"title\":\"Promote verified speech controls and audio fixes to staging\",\"author\":\"lalalune\",\"number\":33849,\"body\":\"$7e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T11:51:08Z\",\"mergedAt\":\"2026-10-05T12:09:31Z\",\"additions\":1658,\"deletions\":26},{\"id\":\"PR_kwDOMT5cIs8AAAABGl3T9Q\",\"title\":\"feat(cloud): atomically finalize paid organization upgrades\",\"author\":\"lalalune\",\"number\":33542,\"body\":\"$7f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:21:51Z\",\"mergedAt\":\"2026-10-04T20:25:47Z\",\"additions\":1592,\"deletions\":121},{\"id\":\"PR_kwDOMT5cIs8AAAABGlZ5qA\",\"title\":\"Promote reviewed follow-ups and repair staging fixture checks\",\"author\":\"lalalune\",\"number\":33513,\"body\":\"Promote reviewed develop `25f096252940` to staging. The promotion tree matches develop and preserves the original PR commits.\\n\\nIncludes the task-pipeline browser fixture import repair, owner-connected morning brief selection, shared browser address parser, and organization upgrade execution fencing and paid-invoice observations. Cloud changes do not execute provider charges or publish allowance. The additive dispatch migration prevents an expired persisted lease from being renewed in the same dispatch write.\\n\\nValidation: 31 browser plugin tests plus TypeScript/Rollup build, 54 morning brief tests, 32 PostgreSQL upgrade/cancellation tests and 19 invoice tests passed. Task-pipeline desktop/mobile browser assertions passed. Root verification is running on this promotion head; staging hosted failures are being checked before merge.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:04:54Z\",\"mergedAt\":\"2026-10-04T19:05:58Z\",\"additions\":1572,\"deletions\":56},{\"id\":\"PR_kwDOMT5cIs8AAAABGnxyMg\",\"title\":\"feat(cloud): journal original organization schedule effects\",\"author\":\"lalalune\",\"number\":33647,\"body\":\"$80\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T02:07:32Z\",\"mergedAt\":\"2026-10-05T02:11:19Z\",\"additions\":1537,\"deletions\":46},{\"id\":\"PR_kwDOMT5cIs8AAAABGf_aAQ\",\"title\":\"feat(auth): share native Cloud service and document adapters\",\"author\":\"lalalune\",\"number\":33255,\"body\":\"$81\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:47:21Z\",\"mergedAt\":\"2026-10-04T02:47:50Z\",\"additions\":1527,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABGf9mkQ\",\"title\":\"Share external Android speech tooling and native adapter contracts\",\"author\":\"lalalune\",\"number\":33253,\"body\":\"$82\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:41:24Z\",\"mergedAt\":\"2026-10-04T02:02:19Z\",\"additions\":1516,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs8AAAABGlppcg\",\"title\":\"Share disposable Android CI fixture admission and diagnostics\",\"author\":\"lalalune\",\"number\":33530,\"body\":\"Move reusable disposable Android CI fixture admission and diagnostics from Alpha into app platform tooling. Hosts inject ADB execution and retain orchestration/output paths. Preserve the restrictive GitHub-hosted emulator-5554/AVD-test/user0 admission, unsecured keyguard readback, fresh network fixture checks, exact API35 x86_64 boot topology, bounded retries and privacy-conscious diagnostics. Admission failures use a named HostedFixtureError. This does not broaden the set of devices that may be mutated.\\n\\nValidation: all 29 captured-state and fake-ADB refusal/recovery tests pass. Changed-file Biome checks pass. All four suites are discovered by the maintained Node script lane. Full upstream verification passed all 297 tasks and final audits; these fixture tests are not a claim of a fresh hosted emulator qualification run.\\n\\nConsumer adoption will replace the four local helper implementations with pinned imports and run the existing provider orchestration tests against them.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:45:43Z\",\"mergedAt\":\"2026-10-04T19:52:13Z\",\"additions\":1512,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGos7DA\",\"title\":\"Preserve reminder request ownership and reduce repeated planner context\",\"author\":\"NubsCarson\",\"number\":33679,\"body\":\"$83\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T04:45:41Z\",\"mergedAt\":\"2026-10-05T05:05:35Z\",\"additions\":1505,\"deletions\":189},{\"id\":\"PR_kwDOMT5cIs8AAAABGe5Vmg\",\"title\":\"feat(native-reminders): extract host-configured Android engine candidate\",\"author\":\"lalalune\",\"number\":33217,\"body\":\"$84\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T22:05:48Z\",\"mergedAt\":\"2026-10-03T22:48:02Z\",\"additions\":1496,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGXSGGQ\",\"title\":\"Remove redundant receipt data and maintenance-task prompt context\",\"author\":\"NubsCarson\",\"number\":33100,\"body\":\"$85\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:15:34Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":1495,\"deletions\":759},{\"id\":\"PR_kwDOMT5cIs8AAAABGf-RcA\",\"title\":\"feat(os): build and qualify shared Chromium protection for consumers\",\"author\":\"lalalune\",\"number\":33254,\"body\":\"$86\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:43:54Z\",\"mergedAt\":\"2026-10-04T01:57:04Z\",\"additions\":1462,\"deletions\":154},{\"id\":\"PR_kwDOMT5cIs8AAAABGgTehg\",\"title\":\"feat(app): compose thin task and document hosts with shared Cloud services\",\"author\":\"lalalune\",\"number\":33275,\"body\":\"$87\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:03:11Z\",\"mergedAt\":\"2026-10-04T03:45:30Z\",\"additions\":1451,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs8AAAABFm2-Jw\",\"title\":\"fix(phone): keep first-use briefs and system notices truthful\",\"author\":\"NubsCarson\",\"number\":32928,\"body\":\"First-use remote phones could receive an invented morning brief when its sources were unavailable, or route a host error notice through ordinary assistant prose rendering.\\n\\nKeep source availability explicit in first-use check-ins and moment decisions, and preserve typed system notices through delivery and rendering. Error and setup messages remain distinct from generated assistant replies; unavailable brief sources are reported truthfully rather than replaced with fabricated content.\\n\\nValidation: six personal-assistant suites (54 tests, including real PGlite availability coverage); agent system-error notice suite; ChatOverlay suite (199 tests); focused Biome and typechecks. This is independently rebased onto develop and has not been installed on hardware; original combined phone QA is not a blanket acceptance of this draft. Auth/reconnect (#32922) and local-model readiness (#32926) are separate drafts. PGlite lifecycle and unsolicited-watcher fixes are excluded.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:17:30Z\",\"mergedAt\":\"2026-10-01T13:00:27Z\",\"additions\":1383,\"deletions\":208},{\"id\":\"PR_kwDOMT5cIs8AAAABGgn5BA\",\"title\":\"fix(os): consolidate installer contracts and remove
