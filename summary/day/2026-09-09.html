isted-memory evaluator fixture.\n\n- Final follow-up head `447867a89f947cf1b7495612733cbe4646264f05`: preserve saved calendar selections if account disconnection fails. All 13 account-transition tests passed; root `bun run verify` exited 0 with 373 successful tasks and all final audits. Hosted checks must pass on this revision before merge.\n\n## Remaining release work\n\nThis is an incremental implementation PR; full MVP release acceptance remains open. Full operational account cutover (schedules, pending/in-flight approvals, destinations, and test-data disposition), live Google two-way sync and approved email receipts, messaging acceptance, source intake, knowledge-sharing acceptance, current deployment verification, and the final evidence bundle remain open. Account replacement currently verifies connection health; it is not full production handoff acceptance. No provider credentials or private family records are included.\n\nRefs #30123.\n\n"])</script><script>self.__next_f.push([1,"16:T25b8,"])</script><script>self.__next_f.push([1,"# Relates to\n\nFollow-up to the addressed-turn failure gate in `MessageProcessor` (the \"91 canned-failure sends in 2 days\" fix) and the Discord generation-timeout reply. No issue filed; observed live: five \"I timed out while generating that reply. Please retry.\" posts from one agent into a shared guild channel between Sep 6 and Sep 8 during a 29h provider outage.\n\nDefinition of Done: [CONTRIBUTING.md](https://github.com/elizaOS/eliza/blob/develop/CONTRIBUTING.md).\n\n- [x] Targets `develop`; branched from `357084b3092efb39f95807bcd459baadcc39f095` with no conflicts.\n- [x] Frozen install on Bun 1.4.0 / Node 24.14.0; touched-package tests, biome and tsc run after sync.\n- [x] Behavioral evidence is included below (before/after test runs on clean develop vs this head).\n\n# Sync with develop\n\nBase is `357084b3092efb39f95807bcd459baadcc39f095` (current `origin/develop` at branch time). No rebase needed.\n\n# Risks\n\nBehavior change with a new default. Under `FAILURE_REPLY_POLICY=dm-only` (default) an addressed turn in a public room that dies before producing a reply now stays silent (error reaction only on Discord) instead of posting a canned failure notice. DMs, VOICE_DM, API, SELF rooms and autonomous turns are unchanged. Operators who want the old behavior set `FAILURE_REPLY_POLICY=all`. Unknown values fail closed to `dm-only` with a one-time warning.\n\nOn the Discord group-coordination path the suppressed failure still releases the speaker lease (`state=released`) and writes a `delivery-reconciled` receipt with `outcome=failure-reply-suppressed`, so the crash sweeper does not re-dispatch the edge and other contenders see it close. Covered on the real PGlite path.\n\nTelegram is not touched.\n\n# Background\n\n## What does this PR do?\n\nAdds a shared, vendor-neutral `FAILURE_REPLY_POLICY` runtime setting (runtime.getSetting, env fallback) in `packages/core/src/failure-reply-policy.ts`:\n\n- `dm-only` (default): canned failure text only in DM / VOICE_DM / API / SELF rooms and autonomous turns\n- `all`: legacy behavior, failure text everywhere\n- `off`: never post failure text\n\nTwo producers consult it:\n\n1. **core** `MessageProcessor`: the existing deterministic-addressing gate decides *whether the turn addressed the agent*; the policy now decides *whether that room may receive failure text at all*. Suppression logs the existing \"suppressing failure reply\" pattern with `reason=policy`, `policy`, `policyReason`, `channelType`, and terminates as IGNORE.\n2. **plugin-discord** `sendFailureReply` (timeout and provider-error paths): under `dm-only` in a guild channel or thread it still sets the ❌ reaction, aborts the pending draft, runs the inbound-memory release, releases the speaker lease and writes the coordination receipt, but never calls `channel.send`. Logs at info with `code=DISCORD_FAILURE_REPLY_SUPPRESSED_PUBLIC`, `channelId`, `cause` (`timeout` | `provider`).\n\n## What kind of change is this?\n\nFeature with a behavior-changing default, plus regression tests.\n\n# Documentation changes needed?\n\nSetting is documented in the module docblock. No user-facing docs page lists connector env vars for this path yet; happy to add one if maintainers point at the right file.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/core/src/failure-reply-policy.ts` (the whole policy, ~200 lines), then the two call sites: `packages/core/src/services/message/processor.ts` (structured-failure gate) and `plugins/plugin-discord/messages.ts` (`sendFailureReply`).\n\n## Detailed testing steps\n\n```sh\nbun install --frozen-lockfile\n# core\nbunx vitest run --config packages/core/vitest.config.ts \\\n  packages/core/src/__tests__/failure-reply-policy.test.ts \\\n  packages/core/src/services/message.runtime-failure-suppression.test.ts\nbunx vitest run --config packages/core/vitest.config.ts packages/core/src/services\n# discord\ncd plugins/plugin-discord \u0026\u0026 bunx vitest run\n```\n\nBidirectional proof (same new test files copied onto a clean `357084b3092` worktree, fix absent):\n\n| suite | clean develop | this head |\n|---|---|---|\n| plugin-discord full (`bunx vitest run`) | 6 failed / 869 passed (875), 2 files | 875 passed (875), 100 files |\n| plugin-discord `__tests__/failure-reply-policy.test.ts` | 5 failed / 3 passed | 8 passed |\n| plugin-discord `test/messages-group-coordination-pglite.test.ts` | 1 failed / 9 passed | 10 passed |\n| core `message.runtime-failure-suppression.test.ts` | 4 failed / 16 passed | 20 passed |\n| core `__tests__/failure-reply-policy.test.ts` | n/a (new module) | 15 passed |\n| core `packages/core/src/services` sweep + touched runtime tests | not run | 1864 passed (1864), 107 files |\n\nThe 3 passing-on-baseline cases in the new Discord file are the legacy-behavior pins (DM keeps reply, `all` keeps reply); the 5 failing ones are exactly the suppression cases. Three existing core tests that pin failure-reply TEXT on an addressed group turn (`message.character-failure-templates`, `message.context-overflow-reply`, `message.credit-exhaustion-reply`) opt into `FAILURE_REPLY_POLICY=all` so they keep exercising the template path; the existing pglite \"fences the provider-error reply\" test does the same.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:530c1b3832c514e63c98d39f3f1471cb0c645153 --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered UI changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered UI changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - connector and message-service logic, no UI interaction.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Real `MessageManager.handleMessage` and `DefaultMessageService.handleMessage` runs on clean develop vs this head:\n\n\u003cdetails\u003e\u003csummary\u003eplugin-discord, clean develop 357084b3092 (fix absent, new tests present)\u003c/summary\u003e\n\n```text\n × guild channel timeout: no channel.send, error reaction set, suppression logged\n × guild channel provider error: no channel.send, cause=provider\n × public thread timeout: silent like its parent guild channel\n ✓ DM timeout: failure reply still sent\n ✓ DM provider error: failure reply still sent\n ✓ guild channel timeout: legacy behavior, failure reply sent   (FAILURE_REPLY_POLICY=all)\n × DM timeout: silent too, error reaction still set             (FAILURE_REPLY_POLICY=off)\n × fails closed to dm-only: guild silent, DM replies, warning logged\n × a provider failure under the default dm-only policy releases the slot without a public send   (pglite)\n ✓ FAILURE_REPLY_POLICY=all keeps the legacy fenced failure reply in a guild channel              (pglite)\n\n Test Files  2 failed | 98 passed (100)\n      Tests  6 failed | 869 passed (875)\n```\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eplugin-discord, this head\u003c/summary\u003e\n\n```text\n Test File 26gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a bare \u003ccode\u003e\u0026gt;\u003c/code\u003e in the children of an Astro expression being treated as markup, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;a \u0026gt; b\u0026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed HTML comments inside an Astro expression failing to parse. They are now read as trivia, wherever they appear among the children.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;\u0026lt;!-- first --\u0026gt;text\u0026lt;!-- last --\u0026gt;\u0026lt;/div\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;a\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;!-- c --\u0026gt;\u0026lt;b\u0026gt;\u0026lt;/b\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\ ub.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a quote inside a regex character class breaking the rest of an Astro file, such as \u003ccode\u003econst unsafe = /[/\u0026quot;]/;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11508\"\u003e#11508\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/54f3a2ea2765c80df11d04e47cd8da0354f5f7ca\"\u003e\u003ccode\u003e54f3a2e\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-flat-math-min-max/\"\u003e\u003ccode\u003euseFlatMathMinMax\u003c/code\u003e\u003c/a\u003e. Because \u003ccode\u003eMath.min()\u003c/code\u003e and \u003ccode\u003eMath.max()\u003c/code\u003e accept any number of arguments, the rule reports unnecessary nested calls to the same method:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eMath.max(Math.max(a, b), c);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe fix flattens this expression to \u003ccode\u003eMath.max(a, b, c)\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/biomejs/biome/blob/main/packages/@biomejs/biome/CHANGELOG.md\"\u003e@​biomejs/biome's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003 03c/code\u003e in the children of an Astro expression being treated as markup, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;a \u0026gt; b\u0026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed HTML comments inside an Astro expression failing to parse. They are now read as trivia, wherever they appear among the children.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;\u0026lt;!-- first --\u0026gt;text\u0026lt;!-- last --\u0026gt;\u0026lt;/div\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;a\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;!-- c --\u0026gt;\u0026lt;b\u0026gt;\u0026lt;/b\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ccode\u003eis:raw\u003c/code\u003e children inside an Astro expression being read as JSX, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div is:raw\u0026gt;{not js} \u0026lt; \u0026amp; text\u0026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed an apostrophe or quote in the text of a JSX element inside an Astro expression ending the expression early, such as \u003ccode\u003e{items.map((i) =\u0026gt; \u0026lt;li\u0026gt;it's {i}\u0026lt;/li\u0026gt;)}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed the children of a \u003ccode\u003e\u0026lt;script\u0026gt;\u003c/code\u003e or \u003ccode\u003e\u0026lt;style\u0026gt;\u003c/code\u003e inside an Astro expression being read as JSX. Their contents are text, so braces and comparisons no longer have to be escaped.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{cond \u0026amp;\u0026amp; \u0026lt;style\u0026gt;a { color: red }\u0026lt;/style\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;script\u0026gt;let x = {a: 1};\u0026lt;/script\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Added support for template literal attribute values inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;C data-x=`t${x}` /\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed unquoted attribute values being rejected inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;a class=foo maxlength=255 href=/about\u0026gt;go\u0026lt;/a\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a template literal nested inside \u003ccode\u003e${}\u003c/code\u003e breaking the rest of an Astro file, such as \u003ccode\u003econst href = `/blog${page === 0 ? '' : `/${page + 1}`}`;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a quote inside a regex character class breaking the rest of an Astro file, such as \u003ccode\u003econst unsafe = /[/\u0026quot;]/;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11508\"\u003e#11508\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/54f3a2ea2765c80df11d04e47cd8da0354f5f7ca\"\u003e\u003ccode\u003e54f3a2e\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-flat-math-min-max/\"\u003e\u003ccode\u003euseFlatMathMinMax\u003c/code\u003e\u003c/a\u003e. Because \u003ccode\u003eMath.min()\u003c/code\u003e and \u003ccode\u003eMath.max()\u003c/code\u003e accept any number of arguments, the rule reports unnecessary nested calls to the same method:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eMath.max(Math.max(a, b), c);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe fix flattens this expression to \u003ccode\u003eMath.max(a, b, c)\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11585\"\u003e#11585\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/c5c8315cc2174b52834513d4c01edd09341e46cd\"\u003e\u003ccode\u003ec5c8315\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Netail\"\u003e\u003ccode\u003e@​Netail\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11475\"\u003e#11475\u003c/a\u003e: \u003ccode\u003enoUnresolvedImports\u003c/code\u003e no longer reports Bun runtime built-in modules (\u003ccode\u003ebun\u003c/code\u003e, \u003ccode\u003ebun:bundle\u003c/code\u003e, \u003ccode\u003ebun:ffi\u003c/code\u003e, \u003ccode\u003ebun:jsc\u003c/code\u003e, \u003ccode\u003ebun:sqlite\u003c/code\u003e, \u003ccode\u003ebun:test\u003c/code\u003e).\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u0 ode\u003e54f3a2e\u003c/code\u003e\u003c/a\u003e feat(lint/js): add \u003ccode\u003euseFlatMathMinMax\u003c/code\u003e (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11508\"\u003e#11508\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/1d6210b8ef6a2d2d83ea16e6fb95c124fd370690\"\u003e\u003ccode\u003e1d6210b\u003c/code\u003e\u003c/a\u003e feat(lint/js): add \u003ccode\u003enoUnmodifiedLoopCondition\u003c/code\u003e (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11491\"\u003e#11491\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/2d559316e00764b0843d3d483d4a093fb566de57\"\u003e\u003ccode\u003e2d55931\u003c/code\u003e\u003c/a\u003e feat(js_analyze): added a React naming convention rule (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11554\"\u003e#11554\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/ee69e0e8a90e6231a3b208cda4b3e65ad8b2006a\"\u003e\u003ccode\u003eee69e0e\u003c/code\u003e\u003c/a\u003e fix(schema): domains (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11565\"\u003e#11565\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/f5d7896f7115a2d57962471f6d7abfafddb07918\"\u003e\u003ccode\u003ef5d7896\u003c/code\u003e\u003c/a\u003e feat(lint/js): add \u003ccode\u003enoInvalidFileInputAccept\u003c/code\u003e (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11497\"\u003e#11497\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/biomejs/biome/commits/@biomejs/biome@2.5.12/packages/@biomejs/biome\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@playwright/test` from 1.62.1 to 1.63.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/microsoft/playwright/releases\"\u003e@​playwright/test's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev1.63.0\u003c/h2\u003e\n\u003ch2\u003e🔒 Test locks\u003c/h2\u003e\n\u003cp\u003eTests that access a shared resource — an external service, a global account setting — can now declare a named \u003ccode\u003elock\u003c/code\u003e.\nTests that share a lock name never run concurrently, across files, workers and \u003ca href=\"https://playwright.dev/docs/test-projects\"\u003eprojects\u003c/a\u003e, while\neverything else keeps running in parallel:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003etest('update user settings', { lock: 'user-settings' }, async ({ page }) =\u0026gt; {\r\n  // never runs at the same time as other tests holding 'user-settings'\r\n});\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eA test can hold multiple locks, and \u003ca href=\"https://playwright.dev/docs/api/class-test#test-describe\"\u003etest.describe()\u003c/a\u003e accepts a \u003ccode\u003elock\u003c/code\u003e for the whole group.\nLearn more about \u003ca href=\"https://playwright.dev/docs/test-parallel#test-locks\"\u003etest locks\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e🪟 Locate across frames\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://playwright.dev/docs/api/class-page#page-frame-locator\"\u003epage.frameLocator()\u003c/a\u003e and \u003ca href=\"https://playwright.dev/docs/api/class-frame#frame-frame-locator\"\u003eframe.frameLocator()\u003c/a\u003e called without a selector search in any frame of the\nsubtree, so you no longer need to locate the iframe first:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003e// Finds the button in any frame on the page.\r\nawait page.frameLocator().getByRole('button').click();\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe rest of the locator resolves inside a single frame, just like a regular locator, and an error is thrown when it\nmatches elements in several frames.\u003c/p\u003e\n\u003ch2\u003e👁️ Visible-only locators\u003c/h2\u003e\n\u003cp\u003eNew \u003ca href=\"https://playwright.dev/docs/api/class-locator#locator-visible\"\u003elocator.visible()\u003c/a\u003e returns a locator that matches only visible elements. It is the recommended\nreplacement for the \u003ccode\u003e:visible\u003c/code\u003e CSS pseudo-class:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eawait page.locator('button').visible().click();\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e🧾 Step params and subtitles\u003c/h2\u003e\n\u003cp\u003eSteps now carry structured data for reporters. Playwright API steps report the target locator and call arguments,\nand \u003ca href=\"https://playwright.dev/docs/api/class-test#test-step\"\u003etest.step()\u003c/a\u003e accepts \u003ccode\u003esubtitle\u003c/code\u003e and \u003ccode\u003eparams\u003c/code\u003e options for your own steps:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eawait test.step('Login', async () =\u0026gt; {\r\n  // ...\r\n}, { subtitle: 'as admin', params: { user: 'admin' } });\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReporters receive them via \u003ca href=\"https://playwright.dev/docs/api/class-teststep#test-step-subtitle\"\u003etestStep.subtitle\u003c/a\u003e and \u003ca href=\"https://playwright.dev/docs/api/class-teststep#test-step-params\"\u003etestStep.params\u003c/a\u003e. For Playwright API\u003c/p\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/1b025d7e20a026371cd5f98ba0cdce48892737c8\"\u003e\u003ccode ithub.com/microsoft/playwright/issues/42540\"\u003e#42540\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/7894f5653e7f253c17aa1638c19f63e0d54d5e0e\"\u003e\u003ccode\u003e7894f56\u003c/code\u003e\u003c/a\u003e docs(mcp): clarify how tool file names are resolved (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42538\"\u003e#42538\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/52900a1b99ca51011526afcaf8981970cc1a521a\"\u003e\u003ccode\u003e52900a1\u003c/code\u003e\u003c/a\u003e devops: restore npm publishing from GitHub Actions (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42550\"\u003e#42550\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/8c47f596edebd2460895a5953f2ea67f8b884001\"\u003e\u003ccode\u003e8c47f59\u003c/code\u003e\u003c/a\u003e docs(csharp): fix nonexistent method names in guide examples (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42507\"\u003e#42507\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/bd6e552a63f8cf9b0da0216f392b8e63a08bf1d2\"\u003e\u003ccode\u003ebd6e552\u003c/code\u003e\u003c/a\u003e chore(video): emit frames with real timestamps, drop frame number quantizatio...\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/microsoft/playwright/compare/v1.62.1...v1.63.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@testing-library/react` from 16.3.2 to 16.3.3\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/testing-library/react-testing-library/releases\"\u003e@​testing-library/react's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev16.3.3\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/compare/v16.3.2...v16.3.3\"\u003e16.3.3\u003c/a\u003e (2026-08-27)\u003c/h2\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eAvoid act() re-entrant when dispatching events (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1468\"\u003e#1468\u003c/a\u003e) (\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e20ce75f\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e\u003ccode\u003e20ce75f\u003c/code\u003e\u003c/a\u003e fix: Avoid act() re-entrant when dispatching events (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1468\"\u003e#1468\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/be9d81d91314c9f0bafaa363f70b409b4b31989c\"\u003e\u003ccode\u003ebe9d81d\u003c/code\u003e\u003c/a\u003e docs: fix typos in comments and types (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1446\"\u003e#1446\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/testing-library/react-testing-library/compare/v16.3.2...v16.3.3\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@types/bun` from 1.3.14 to 1.4.2\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/DefinitelyTyped/DefinitelyTyped/commits/HEAD/types/bun\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@vitejs/plugin-react` from 6.0.5 to 6.1.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/releases\"\u003e@​vitejs/plugin-react's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eplugin-react@6.1.1\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003eplugin-react@6.1.0\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/blob/main/packages/plugin-react/CHANGELOG.md\"\u003e@​vitejs/plugin-react's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.1.1 (2026-08-28)\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003e6.1.0 (2026-08-19)\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/04cac5020e349f452d76c5a4f6d788ad4b38930a\"\u003e\u003ccode\u003e04cac50\u003c/code\u003e\u003c/a\u003e release: plugin-react@6.1.1 (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1440\"\u003e#1440\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/82d35abe4946eddd4e6456802bf2b53444e264f2\"\u003e\u003ccode\u003e82d35ab\u003c/code\u003e\u003c/a\u003e fix(react): respect environment sourcemap option when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/397e8471a559f18a16dd21bd797ac01a369dabdc\"\u003e\u003ccode\u003e397e847\u003c/code\u003e\u003c/a\u003e fix(react): make logging diagnostics an opt-in for React Compiler (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1431\"\u003e#1431\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/61006e6f52124821c24121a78712f7162  |\n| [@testing-library/user-event](https://github.com/testing-library/user-event) | `14.6.4` | `14.6.7` |\n| [storybook](https://github.com/storybookjs/storybook/tree/HEAD/code/core) | `10.5.8` | `10.6.0` |\n| [@types/ssh2](https://github.com/DefinitelyTyped/DefinitelyTyped/tree/HEAD/types/ssh2) | `1.15.5` | `1.15.6` |\n| [@typescript-eslint/parser](https://github.com/typescript-eslint/typescript-eslint/tree/HEAD/packages/parser) | `8.67.0` | `8.69.0` |\n| [rollup](https://github.com/rollup/rollup) | `4.62.4` | `4.63.1` |\n\n\nUpdates `@biomejs/biome` from 2.5.8 to 2.5.12\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/biomejs/biome/releases\"\u003e@​biomejs/biome's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eBiome CLI v2.5.12\u003c/h2\u003e\n\u003ch2\u003e2.5.12\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro attribute expressions rejecting TypeScript and JSX syntax that is accepted in text expressions.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;Component icon={\u0026lt;Icon /\u0026gt;} count={total as number} onSelect={(e: Event) =\u0026gt; e} /\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro attribute names being split on \u003ccode\u003e:\u003c/code\u003e and \u003ccode\u003e.\u003c/code\u003e inside an expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;button x-on:keyup.enter={go} client:load.foo /\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a bare \u003ccode\u003e\u0026gt;\u003c/code\u003e in the children of an Astro expression being treated as markup, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;a \u0026gt; b\u0026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed HTML comments inside an Astro expression failing to parse. They are now read as trivia, wherever they appear among the children.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;\u0026lt;!-- first --\u0026gt;text\u0026lt;!-- last --\u0026gt;\u0026lt;/div\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;a\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;!-- c --\u0026gt;\u0026lt;b\u0026gt;\u0026lt;/b\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ccode\u003eis:raw\u003c/code\u003e children inside an Astro expression being read as JSX, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div is:raw\u0026gt;{not js} \u0026lt; \u0026amp; text\u0026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed an apostrophe or quote in the text of a JSX element inside an Astro expression ending the expression early, such as \u003ccode\u003e{items.map((i) =\u0026gt; \u0026lt;li\u0026gt;it's {i}\u0026lt;/li\u0026gt;)}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed the children of a \u003ccode\u003e\u0026lt;script\u0026gt;\u003c/code\u003e or \u003ccode\u003e\u0026lt;style\u0026gt;\u003c/code\u003e inside an Astro expression being read as JSX. Their contents are text, so braces and comparisons no longer have to be escaped.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{cond \u0026amp;\u0026amp; \u0026lt;style\u0026gt;a { color: red }\u0026lt;/style\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;script\u0026gt;let x = {a: 1};\u0026lt;/script\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Added support for template literal attribute values inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;C data-x=`t${x}` /\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed unquoted attribute values being rejected inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;a class=foo maxlength=255 href=/about\u0026gt;go\u0026lt;/a\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a template literal nested inside \u003ccode\u003e${}\u003c/code\u003e breaking the rest of an Astro file, such as \u003ccode\u003econst href = `/blog${page === 0 ? '' : `/${page + 1}`}`;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a quote inside a regex character class breaking the rest of an Astro file, such as \u003ccode\u003econst unsafe = /[/\u0026quot;]/;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11508\"\u003e#11508\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/54f3a2ea2765c80df11d04e47cd8da0354f5f7ca\"\u003e\u003ccode\u003e54f3a2e\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-flat-math-min-max/\"\u003e\u003ccode\u003euseFlatMathMinMax\u003c/code\u003e\u003c/a\u003e. Because \u003ccode\u003eMath.min()\u003c/code\u003e and \u003ccode\u003eMath.max()\u003c/code\u003e accept any number of arguments, the rule reports unnecessary nested calls to the same method:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eMath.max(Math.max(a, b), c);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe fix flattens this expression to \u003ccode\u003eMath.max(a, b, c)\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/biomejs/biome/blob/main/packages/@biomejs/biome/CHANGELOG.md\"\u003e@​biomejs/biome's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.5.12\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro attribute expressions rejecting TypeScript and JSX syntax that is accepted in text expressions.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;Component icon={\u0026lt;Icon /\u0026gt;} count={total as number} onSelect={(e: Event) =\u0026gt; e} /\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro attribute names being split on \u003ccode\u003e:\u003c/code\u003e and \u003ccode\u003e.\u003c/code\u003e inside an expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;button x-on:keyup.enter={go} client:load.foo /\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a bare \u003ccode\u003e\u0026gt;\u003c/code\u003e in the children of an Astro expression being treated as markup, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;a \u0026gt; b\u0026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed HTML comments inside an Astro expression failing to parse. They are now read as trivia, wherever they appear among the children.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div\u0026gt;\u0026lt;!-- first --\u0026gt;text\u0026lt;!-- last --\u0026gt;\u0026lt;/div\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;a\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;!-- c --\u0026gt;\u0026lt;b\u0026gt;\u0026lt;/b\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ccode\u003eis:raw\u003c/code\u003e children inside an Astro expression being read as JSX, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;div is:raw\u0026gt;{not js} \u0026lt; \u0026amp; text\u0026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed an apostrophe or quote in the text of a JSX element inside an Astro expression ending the expression early, such as \u003ccode\u003e{items.map((i) =\u0026gt; \u0026lt;li\u0026gt;it's {i}\u0026lt;/li\u0026gt;)}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed the children of a \u003ccode\u003e\u0026lt;script\u0026gt;\u003c/code\u003e or \u003ccode\u003e\u0026lt;style\u0026gt;\u003c/code\u003e inside an Astro expression being read as JSX. Their contents are text, so braces and comparisons no longer have to be escaped.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{cond \u0026amp;\u0026amp; \u0026lt;style\u0026gt;a { color: red }\u0026lt;/style\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;script\u0026gt;let x = {a: 1};\u0026lt;/script\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\" ommit/be9d81d91314c9f0bafaa363f70b409b4b31989c\"\u003e\u003ccode\u003ebe9d81d\u003c/code\u003e\u003c/a\u003e docs: fix typos in comments and types (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1446\"\u003e#1446\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/testing-library/react-testing-library/compare/v16.3.2...v16.3.3\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@types/bun` from 1.3.14 to 1.4.0\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/DefinitelyTyped/DefinitelyTyped/commits/HEAD/types/bun\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@vitejs/plugin-react` from 6.0.5 to 6.1.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/releases\"\u003e@​vitejs/plugin-react's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eplugin-react@6.1.1\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003eplugin-react@6.1.0\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/blob/main/packages/plugin-react/CHANGELOG.md\"\u003e@​vitejs/plugin-react's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.1.1 (2026-08-28)\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003e6.1.0 (2026-08-19)\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/04cac5020e349f452d76c5a4f6d788ad4b38930a\"\u003e\u003ccode\u003e04cac50\u003c/code\u003e\u003c/a\u003e release: plugin-react@6.1.1 (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1440\"\u003e#1440\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/82d35abe4 "providerExecutions\": 1,\n    \"clientStatus\": 200\n  }\n}\n```\n\nThe new transport suite runs the real RPC handler/retry/fetch with only the provider URL redirected to local HTTP. All eight stateful methods, separately and inside mixed batches, execute once after an ambiguous502. Read-only batches retry and return the healthy response. A non-idempotent provider timeout does not replay. Already-canceled, active, and backoff cancellation preserve the original reason and stop further requests.\n\nThe cache suite runs the real proxy engine, RPC handler/config, and an isolated instance of the shipped `CacheClient`/`MemoryCacheAdapter` against local HTTP. Authentication, pricing, credits, and usage are fixture collaborators; there are no live financial operations.\n\n```text\nCache regression before fix: 2 pass, 7 fail, exit1\n  State-changing second requests incorrectly reused provider-result-1;\n  provider executions: expected2, actual1.\n\nCache regression after fix: 9 pass, 0 fail, 54 assertions, exit0\n  Stateful second requests execute and return provider-result-2.\n  Read-only balance control still returns provider-result-1 with X-Cache:HIT.\n```\n\nFinal focused suites, each in its own Bun process:\n\n| Suite | Passed | Assertions |\n| --- | ---: | ---: |\n| Real HTTP retry/cancellation | 13 | 58 |\n| Real engine/cache/HTTP | 9 | 54 |\n| Existing retry error contract | 5 | 12 |\n| Existing EVM RPC contract | 6 | 10 |\n| Chain-data caller contract | 8 | 14 |\n| Market-data caller contract | 5 | 10 |\n| Total | 46 | 158 |\n\nAll six processes exited0. Chain-data supported methods were reviewed: two NFT GETs plus token-balance, token-metadata and asset-transfer queries; market-data uses GET. Provider URLs/authentication and the existing Solana transport are unchanged.\n\nPinned normal `bun install` passed (6803 packages,59.47s), including normal scripts. Initial `bun run verify` passed373/373 tasks with no cache hits and all subsequent audits. Final exact-head `b h an unknown or non-zero start never reaches the staging file.\n\n# Background\n\n## What does this PR do?\n\n`plugins/plugin-local-inference/src/services/downloader.ts` (single-file and bundle paths) and its UI twin `packages/ui/src/services/local-inference/downloader.ts` (consumed by `services/local-inference/service.ts`) each decided whether to append to a partial staging file with `startByte \u003e 0 \u0026\u0026 response.statusCode !== 206`. A 206 whose `Content-Range` reports `bytes 0-…` with the whole body, which a proxy that clamps or ignores the requested `Range` produces, was therefore appended onto the partial. On the hash-verified bundle path the corrupt file failed its check and the whole file was fetched a second time; on a path with no hash the corrupt file was kept.\n\nEach site now parses `Content-Range` (`contentRangeStart`, the same parser #30888 added to the route downloader) and decides via `resumeDecision`: continue (start equals the partial, or no usable header), restart from zero (200, or start reported as 0), or refetch (any other start: the body is released without being read and the file is requested again without `Range`; a 206 with a non-zero start to that unranged request fails closed).\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNone.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe four guards (search `contentRangeStart(response.headers`), then the three new cases in `plugins/plugin-local-inference/src/services/downloader.test.ts`, which drive the real `Downloader` with a stubbed origin in the new `clamp-to-zero`, `honor-no-cr`, and `block-aligned` range modes (the fixture also counts the bytes read from each 206 body), and the parser cases in `packages/ui/src/services/local-inference/downloader.content-range.test.ts`.\n\n## Detailed testing steps\n\n```bash\n# plugins/plugin-local-inference\nbunx vitest run src/services/downloader.test.ts   # 31 passed\nbun run typecheck  **Client:** Claude Code\n- **Provider:** Anthropic\n- **Model:** claude-fable-5-1\n- **Attribution status:** self-reported\n\n# Risks\n\nLow. One early return in `reconcileEvent`; the policy branches, task shapes, anchors, dismissal on policy change or event end, and the scheduler itself are unchanged. Settlement is per role and a `failed` task is never settled, so a failed join is retried on the next sync in both modes; in ask mode the retry under an already-completed approval is anchored at the event start instead of re-prompting the owner (see the review thread).\n\n# Background\n\n## What does this PR do?\n\n`reconcileEvent` in `plugins/plugin-calendar/src/meetings/auto-join.ts` decided whether an event already had its join or approval task by looking only at live tasks (`scheduled`, `fired`, `acknowledged`). Once the join task fired and completed, the next routine feed sync during the meeting saw no live task and scheduled a fresh join anchored at start - 1 min. That anchor was already in the past, so the task was immediately due and the agent joined the same meeting a second time. In ask mode, an approval the owner had dismissed was re-prompted the same way.\n\nA task of the same role that reached a terminal state other than `failed` for the same event start under the same policy now counts as settled and is not recreated. The check is keyed on role, `autoJoinMode`, and `eventStartAt`, so a policy change still replaces tasks, a rescheduled event still gets a fresh join, and a completed approval never settles the join on its behalf. When the owner already approved and the join failed, the retry is anchored at the event start rather than chained to the terminal approval, because an `after_task` child only fires when its parent transitions.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNone; the module header's \"exactly one join task per event\" contract is what this restores.\n\n# Testing\n\n## Where should wo tests in `packages/cloud/api/v1/voice/tts` have been shipping **red on `develop`**, and one of them is pointing at a real regression.\n\n```\nroute-provider-selection.test.ts   19 pass   2 fail\ncartesia-synthesis.test.ts          0 pass  12 fail\n```\n\n# 1. The `Server-Timing` regression (source fix)\n\n`#15927` added assertions that a rejected Kokoro request still reports its timings:\n\n```ts\nconst serverTiming = response.headers.get(\"Server-Timing\") ?? \"\";\nexpect(serverTiming).toContain(\"auth;dur=\");\nexpect(serverTiming).toContain(\"admission;dur=\");\n```\n\nThey passed then. `#30265` (*fuse generative credential and balance admission*) later converted the early `return Response.json(...)` sites into a deferred `pendingResponse`, so an unauthenticated caller can't learn the validation outcome. **That deferral is correct.** But it builds the `Response` *eagerly*, at the point of assignment — which is before `requireGenerativeRouteCaller` runs, and therefore before `timings.authMs` exists:\n\n```ts\npendingResponse = Response.json(… , { headers: buildTtsObservabilityHeaders(provider, timings) });   // authMs undefined\n…\ntimings.authMs = Date.now() - requestStart;\nif (pendingResponse) return pendingResponse;                                                          // too late\n```\n\n`buildTtsObservabilityHeaders` filters out undefined entries, so the list came out empty and the header was **omitted entirely**. Every deferred 4xx on this route silently lost `Server-Timing`. `#30362` did not touch this — I found it while baselining that PR's suites before mutating them.\n\nThe fix makes the pending response a thunk so the header is built at return time:\n\n```ts\nlet pendingResponse: (() =\u003e Response) | undefined;\n…\nif (pendingResponse) {\n  timings.admissionMs = Date.now() - admissionStart;\n  return pendingResponse();\n}\n```\n\n`admissionMs` is recorded deliberately rather than left absent: `#30265` fused admission *into* the auth call, so
