oduction authorization.\n- `bun run --cwd packages/ui test:home-locale-e2e` passes for en-US and de-DE, preserving the fixed-clock hour-cycle and Fahrenheit/Celsius assertions against the rendered real widgets.\n- Page errors are surfaced at their cause rather than hidden behind a readiness timeout; missing weather must not be reported as verified temperature behavior.\n- Inspect the locale captures, run owning and repository checks, and verify the corresponding hosted step on the merged revision.\n\nThis is a reproduced browser-harness defect encountered during Bettina's final acceptance work (#30123), not a coverage inventory request. It is separate from the retired-header expectations in #31214.\n"])</script><script>self.__next_f.push([1,"15:T843,"])</script><script>self.__next_f.push([1,"## Summary\n\n`tests / Script Tests (Linux)` in the develop \"Validate develop\" workflow has been red since 2026-09-11. One of its causes is `packages/scripts/__tests__/staging-cloud-receipt.test.ts`: two cases fail before any receipt assertion runs.\n\n```\nerror: [cloud-live-continuity] artifact must use the exact closed schema\n      at requireClosedRecord (packages/app/test/cloud-live-continuity-contract.ts:2134:5)\n      at parseCloudLiveContinuityEvidence (packages/app/test/cloud-live-continuity-contract.ts:2379:20)\n      at createDeployedRendererProof (packages/cloud/scripts/pages-deployment-authority.mjs:836:22)\n      at deployedProofFile (packages/scripts/__tests__/staging-cloud-receipt.test.ts:72:17)\n(fail) staging Cloud live receipt \u003e persists closed correlation in receipt v4 from a validated proof file\n(fail) staging Cloud live receipt \u003e rejects boolean claims and proof/source/latency mismatches\n```\n\nLatest red run: https://github.com/elizaOS/eliza/actions/runs/34723784763/job/103635168326 (develop `1fa9dbf22d74`).\n\n## Root cause\n\n`7e9e3f946a0e` (\"fix(cloud): validate deployed continuity with the browser contract\") made `createDeployedRendererProof` parse its `continuity` input with `parseCloudLiveContinuityEvidence`, which requires the closed `schemaVersion: 2` record including the Dedicated mutation keys. The receipt test still builds the proof with the retired `schemaVersion: 1` literal (`reloadHistoryPassed`, `freshContextHistoryPassed`, no `dedicated*` keys), so the fixture itself is rejected. The sibling suite `packages/cloud/scripts/__tests__/pages-deployment-authority.test.ts` was updated in that commit to build the record with `createCloudLiveContinuityEvidence`; this test was not.\n\n## Acceptance criteria\n\n- `bun test packages/scripts/__tests__/staging-cloud-receipt.test.ts` passes (8/8) on develop.\n- The proof fixture is produced by the continuity contract's own builder rather than a hand-copied literal, so future key additions cannot silently drift.\n- The \"does not match the receipt source/run identity\" and \"latency does not match\" rejections are still exercised.\n"])</script><script>self.__next_f.push([1,"16:T99b,"])</script><script>self.__next_f.push([1,"A successful owner upload currently reaches a dead end before agreement review. On deployed revision917f68d490923502a866c7800e56eb2b6493578a, a two-page synthetic agreement was saved and exported correctly, but the owner read returns `obligations: []`. FamilyOperationsView only renders/approves/rejects existing proposals. OWNER_AGREEMENT_KNOWLEDGE supports list/read/approve/reject/pin/unpin/preview, and no proposal-creation operation. The only production caller of AgreementKnowledgeService.proposeObligation is the raw POST obligations route.\n\nAffected user: an owner uploads a PDF and expects the application/agent to help review its cited requirements before making them active. Today an operator must invent a backend API call to populate the review list; a successful upload is not a usable review journey.\n\nEvidence: [deployed owner upload, empty owner obligation list, immutable export and reviewed extraction](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-917f68d4-owner-pdf.zip). This was a synthetic fixture; no real co-parent was contacted. Related draft #31032 and extraction issue #31026.\n\nAcceptance:\n\n- Provide an owner-accessible review entry point in the agreement UI and an equivalent discoverable owner agent action. The ordinary user must not supply backend identifiers or manually construct citation payloads.\n- Generate reviewable proposals from complete persisted page evidence, preserving source version and page citations. Treat document instructions as source data; do not fabricate missing terms, resolve conflicts, or turn silence into consent.\n- Validate proposed citation/page bindings against the saved source. Show explicit no-proposals, failed and incomplete outcomes instead of a healthy-looking empty review list.\n- Keep proposal generation separate from approval, pinning, sharing and scheduling. Only exact owner-approved proposals become active; preview/generation must not send messages or create calendar events.\n- Retry/lost-response/restart behavior must not duplicate proposals or overwrite prior owner decisions. Preserve immutable original bytes and extraction history.\n- Verify the real owner upload -\u003e cited proposal generation -\u003e approve/reject -\u003e pinned-context retrieval flow with a live model and controlled synthetic data. Include desktop/phone interaction, source/output trajectory, persistence and failure/idempotency evidence; mocked proposal lists alone are insufficient.\n"])</script><script>self.__next_f.push([1,"17:T5cf,"])</script><script>self.__next_f.push([1,"## Reproduced failure\n\nOn the Bettina HTTPS pilot at `58cd2df949d37627131de2427ca043e218385e09`, a normal owner password login succeeds and authenticated `GET /api/status` returns 200 with `canRespond: true`. A same-origin browser WebSocket using that session closes with code 1008, `Unauthorized`, after a ping instead of receiving a pong. The backend recorded ntity exclusively from the verified machine identity binding, never a caller-supplied principal or role.\n- Delegate authorization to the existing agreement and household grant contracts; expose only the approved, scoped projection. Keep original PDF, owner export, review history, proposals, rejections, and owner mutations owner-only.\n- Prove missing/wrong binding, wrong household/resource, expiry, revocation, and relationship changes deny access, including after restart.\n- Exercise a real paired synthetic guest against the deployed route with a scoped grant, then revoke it and verify denial; include grant history in an owner export.\n- Complete owning-package tests/typecheck/lint, real PGlite integration, root verification, and exact-head hosted checks.\n\nRelated: #31162 (owner export, including grant history). This issue covers the guest transport boundary rather than replacing the owner export implementation.\n"])</script><script>self.__next_f.push([1,"1a:T8e2,"])</script><script>self.__next_f.push([1,"## Observed gap\n\nBettina's PDD KNOW-8 requires the owner to export the original agreement, reviewed obligations, hashes, pins, grants and audit history. The verification plan requires an independently re-hashed manifest export. Current `AgreementKnowledgeService.readOwnerPdf` and `GET /api/lifeops/agreements/:id/download` return only the verified PDF bytes. `FamilyOperationsView` has review, pin and guest controls but no export journey. There is no agreement export manifest or agreement mutation audit trail in the current service.\n\n## Acceptance\n\n- Provide an owner-authenticated export for one immutable agreement version containing the exact original PDF and a versioned manifest of source metadata/page map, all obligation review states and citations, pins, grants and available audit history. Do not expose credentials or infer guest permission from a pin.\n- Verify original byte length and SHA-256 before export; unavailable or mismatched bytes fail visibly. Provide a manifest integrity contract that an independent reader can verify.\n- Reuse the canonical audit ledger for agreement upload/extraction, review, pin/unpin, grant/revoke and export events. Preserve actor, artifact version/content identity and state transitions. Do not fabricate missing legacy history; represent its coverage explicitly.\n- Keep the manifest internally consistent during concurrent review, pin and grant changes. Do not add another file store, scheduler or shadow audit system.\n- Expose the download through the real Family Operations UI with visible loading/error states and an original-download option. Exercise denied-principal and corrupt/missing-storage paths.\n- Real PGlite regression, owning package gates, root verification and exact-head hosted checks pass. On the pilot, export a synthetic agreement after review/pin/grant activity, independently hash and inspect its contents, and attach sanitized UI/network/video evidence.\n\nThis implements the missing KNOW-8 journey under #30123. Broader workspace export (AUDIT-4), dependency-aware deletion (AUDIT-5/AUDIT-7), verified guest live acceptance and final merged MVP deployment remain separate acceptance requirements; this issue does not stand in for them. Selected-correspondence intake remains owned by #31063/#31032.\n"])</script><script>self.__next_f.push([1,"1b:T78f,"])</script><script>self.__next_f.push([1,"## Summary\n\n`ui-extended / fixture-e2e` in the develop \"Validate develop\" workflow (step \"Wallet widget e2e\", `bun run --cwd packages/ui test:wallet-widget-e2e`) has been red on every develop run since `d27659348e` (2026-09-07 07:49Z; last green `9bd31de1ac`). The three widget states pass; the wallet-section step then times out on both viewports:\n\n```\n✓ UNAVAILABLE state shows no fabricated default rows (got 0)\nTimeoutError: waitForSelector: Timeout 30000ms exceeded.\n  - waiting for locator('[data-testid=\"wallet-section-header-inset\"]') to be visible\n    64 × locator resolved to hidden \u003cdiv class=\"\" data-testid=\"wallet-section-header-inset\"\u003e\u003c/div\u003e\n```\n\nLatest red run: https://github.com/elizaOS/eliza/actions/runs/34723784763/job/103634726799 (develop `1fa9dbf22d74`). Reproduces locally on develop.\n\n## Root cause\n\n`3038df42bfdf` (\"Polish view controls, loading states, and Eliza boot branding\") changed `ViewHeader` to render nothing unless a view passes trailing `right` actions: views no longer repeat a title and launcher-back row above their content. `WalletSectionNav` still wraps `\u003cViewHeader title=\"Wallet\" /\u003e` in the `wallet-section-header-inset` div, so that inset is now an empty zero-height element. The e2e runner waits for the inset to be *visible* and asserts a rendered `[data-testid=\"view-header\"]`, both of which describe the retired contract. `de39b4ce727a` removed the matching unit-test expectations from `WalletSectionNav.test.tsx` but left the e2e runner untouched.\n\n## Acceptance criteria\n\n- `bun run --cwd packages/ui test:wallet-widget-e2e` passes on develop with no page errors and the wallet-section desktop/mobile captures produced.\n- The wallet-section step anchors on an element that is actually visible under the current header contract (the real `section-nav-wallet` strip) and pins the new contract (no repeated title header row) instead of the retired one.\n- No production code changes.\n"])</script><script>self.__next_f.push([1,"1c:T753,"])</script><script>self.__next_f.push([1,"## Summary\n\nThree develop lanes have been red since `619545c5357f` (PR #30989, first red run 2026-09-11 01:36Z): `chat-shell / Chat shell gesture + parity e2e` (step \"Home-screen gesture e2e\"), `ui-core / ui-core-fixture-e2e` (step \"Home-screen real-touch e2e\"), and the PR-level `ui-e2e-gate` job that runs the same script. All three run `bun run --cwd packages/ui test:home-screen-e2e` and fail the same way:\n\n```\n  ⚠ pageerror: TypeError: client.onAuthorityChange is not a function\nTimeoutError: waitForSelector: Timeout 30000ms exceeded.\n  - waiting for locator('[data-testid=\"home-screen\"]') to be visible\n      at assertQuietHome (packages/ui/src/components/shell/__e2e__/run-home-screen-e2e.mjs:565:14)\n```\n\nLatest red run: https://github.com/elizaOS/eliza/actions/runs/34723784763/job/103634726748 (develop `1fa9dbf22d74`). Reproduces locally on develop with the same page error.\n\n## Root cause\n\n#30989 added `onAuthorityChange` / `getAuthorityRevision` to the shared `ElizaClient`, and the LifeOps activity-signal capture (`plugins/plugin-personal-assistant/src/lifeops/activity-signals-capture.ts:831`), which the shell's renderer service starts after first paint, subscribes through them. The home-screen e2e bundle replaces `../../api/client` with `home-screen-fixture.api-stub.ts`, whose `client` object never gained those members. The capture throws synchronously during start, the page error aborts the shell mount, and `[data-testid=\"home-screen\"]` never appears.\n\n## Acceptance criteria\n\n- `bun run --cwd packages/ui test:home-screen-e2e` passes on develop with no page errors.\n- The fixture stub exposes an inert `onAuthorityChange` subscription and a constant `getAuthorityRevision`, documented as such, so the capture starts without observing a change.\n- No production code changes; the fixture continues to render the real widgets against seeded data.\n"])</script><script>self.__next_f.push([1,"1d:T78e,"])</script><script>self.__next_f.push([1,"## Reproduced failure\n\nThe deployed Bettina pilot at `40bf83d22b150d71632878b3868097cc51ccd713` now discovers and invokes the requested household action. A real owner request for `HOUSEHOLD_COORDINATION_ISSUE_GRANT` supplied `subjectEntityIds: []` with `scopes: [\"knowledge.read\"]`, a persisted synthetic caregiver role and an explicit household/principal. The action returned `MISSING_HOUSEHOLD_PARAMETERS` naming `subjectEntityIds` even though that parameter was supplied. A subsequent owner export independently confirmed that no household grant was stored for the synthetic principal.\n\nThe generic `resolveActionArgs` presence check treats every empty required array as missing. `HouseholdCoordinationService.issueGrant` deliberately permits an empty subject list for a knowledge-only grant; it separately rejects non-owner calendar grants without subjects. The action resolver prevents this valid domain contract from reaching the service.\n\n## Acceptance\n\n- Preserve the distinction between an omitted parameter and an explicitly supplied empty array for action parameters whose domain allows empty lists.\n- Allow the household knowledge-only grant with explicit `subjectEntityIds: []` through the real owner action path and persist the actual grant.\n- Keep omitted subjects, malformed arrays, unauthorized principals/roles, out-of-relationship subjects and non-owner calendar grants without subjects rejected by their existing boundaries. Do not make all required arrays optional or silently default an omitted array to empty.\n- Cover the resolver and promoted household action with meaningful regression tests, run owning package/root and hosted checks, and complete the paired-guest read/revoke/expiry/export acceptance on the deployed pilot.\n\nPart of #30123, #31172 and #31162. The action-discovery repair #31181 is separately verified: it successfully executes the role binding and exposes this downstream parameter defect.\n"])</script><script>self.__next_f.push([1,"1e:T639,"])</script><script>self.__next_f.push([1,"## Defect\n\n`packages/scripts/audit-tsconfig-workspace-resolution.test.mjs` case 6, \"historic app and Electrobun mappings are real red-green controls\", is red on `develop` (tip `ce68dbca425412131bd2d042b2cc4ffa6c8a61f7`; `tests / Script Tests (Linux)` and `canonical / Tests (scripts)` in run 34694307489):\n\n```text\nnode --test packages/scripts/audit-tsconfig-workspace-resolution.test.mjs\nnot ok 6 - historic app and Electrobun mappings are real red-green controls\n  The input did not match the regular expression /platforms\\/electrobun\\/tsconfig\\.json: unresolved @elizaos\\/capacitor-bun-runtime imported by packages\\/app-core\\/src\\/platform\\/ios-runtime-bridge\\.ts/. Input:\n  '@elizaos/electrobun typecheck -\u003e packages/app-core/platforms/electrobun/tsconfig.json: unresolved @elizaos/capacitor-bun-runtime imported by packages/ui/src/api/ios-local-agent-transport.ts'\n# pass 5\n# fail 1\n```\n\n## Cause\n\nThe control removes the `@elizaos/capacitor-bun-runtime` path mapping from the Electrobun tsconfig and expects the audit to report it unresolved. It also pins the *importer* to `packages/app-core/src/platform/ios-runtime-bridge.ts`. The audit reports the first importer it meets, and since `c745213d6100` (fix: consolidate duplicate systems behind canonical owners, #30229) that is `packages/ui/src/api/ios-local-agent-transport.ts`. The same pin already broke once and was re-pointed in #30709.\n\n## Fix\n\nMatch any workspace importer (`imported by packages/…`). The contract the control proves is that the missing mapping is detected, not which file imports the package first. Test-only.\n"])</script><script>self.__next_f.push([1,"1f:T454,New Cloud signups currently receive an automatic $5 opening balance from the canonical signup policy, including Steward, wallet and personal-account paths. The owner explicitly requires zero automatic signup credit and paid funding before Dedicated compute. The $5 policy was restored in #30139 and is present in the current production tree.\n\nRestore zero-credit account creation and truthful auth response metadata across callers. Preserve existing balances and explicit funding transactions. Verify that signup cannot provision Dedicated compute and insufficient funds reject create/start/resume before provider effects. Audit prepaid hosting, atomic inference reservation/settlement and exhausted-balance stop enforcement separately; a nonnegative displayed balance alone is not proof of cost recovery.\n\nAcceptance: real account creation persists zero, no automatic credit transaction or funded response flag, historical funded/orphan accounts retain their balance, and unauthorized or unfunded Dedicated activation creates no provider resources. Stage and production live checks must precede completion.\n20:T49c,A trace-correlated Dedicated staging embedding request spent 1,500 ms on a timed-out rate-limit Durable Object call and another 724 ms retrying. A follow-up call to the same gate completed in 268 ms without a retry. Full request times were 5,867 ms and 2,650 ms respectively; these two observations are diagnostic samples, not a controlled benchmark.\n\nThe existing warmInferenceRateLimitGate operation loads the strongly ordered rate-limit state without consuming a request or reserving credit. Dedicated browser pairing currently does not schedule it. Schedule that existing operation in the Worker lifetime after successful owner/lifecycle checks and token generation, so preparation can overlap the app handoff. Do not await it on the pairing response or alter admission, retries, auth, billing or models. Shared/Telegram behavior is outside scope.\n\nAcceptance: authorized, ready Dedicated pairing returns while warming is pending; warm failures do not change pairing results; denied/shared/not-ready requests do not warm a gate. Verify the existing real Durable Object warm contract and complete a real staged pairing followed by first chat, with timing and history evidence.\n21:T498,Routine agent heartbeats advance `agent_sandboxes.lifecycle_revision`, so a long-running Dedicated snapshot can be rejected even when its agent, placement, credentials and lifecycle state are unchanged. A production capture was rejected with only `last_heartbeat_at` and the resulting revision changed. A read-only trigger inspection and a real local PGlite reproduction confirm the behavior.\n\nScope: add an append-only migration excluding only `last_heartbeat_at` from the existing revision trigger. Preserve the existing billing/scheduler exclusions, the default protection of all other columns, and revision anti-forgery. Do not disable snapshot authority checks or enable the fleet queue as part of this fix.\n\nAcceptance: heartbeat-only writes leave an existing capture's revision valid; status, placement, environment, deletion/ownership and combined heartbeat/lifecycle changes invalidate it; caller-supplied revisions cannot bypass the trigger. Exercise the real migration and guarded write in PGlite, verify migration replay and relevant repository contracts, then run a bounded staged capture across a heartbeat. Deployment must use the canonical migration workflow.\n22:T5aa,"])</script><script>self.__next_f.push([1,"## Summary\n\nplugin-local-inference's vision-context augmenter registry is bundled twice. `plugins/plugin-local-inference/build.ts:89` sets `splitting: false`; `dist/index.js` (inlining `src/services/vision/augmenter.ts`) and `dist/services/index.js` each define `registerVisionContextAugmenter`, and `dist/index.js` never imports `./services/`. plugin-vision registers through `@elizaos/plugin-local-inference/services` (`plugins/plugin-vision/src/index.ts:99-108`, exports map → `dist/services/index.js`), while the IMAGE_DESCRIPTION path `plugins/plugin-local-inference/src/provider.ts:962` calls `augmentVisionRequest` from the `index.js` copy.\n\n## Reproduction (develop `5b183d21ff25`, built dist)\n\nProbe registering through `dist/services/index.js` and reading through `dist/index.js`: `services getVisionContextAugmenter -\u003e probe-aug`, index copy has no registration; both bundles define their own `registered` slot.\n\n## Consequence\n\nOCR + object + face fusion never augments describe-image prompts in packaged builds, while plugin-vision logs success. Distinct from #31118 (Apple Foundation adapter registry) and same class as the computeruse OCR registry (filed separately).\n\n## Acceptance criteria\n\n- The au rajectory file), `plugins/plugin-app-control/src/services/app-registry-service.ts:257-262`, `plugins/plugin-agent-orchestrator/src/services/subagent-stdout-log.ts:75`, `packages/app-core/platforms/electrobun/src/startup-trace.ts:101-103`, `plugins/plugin-capacitor-bridge/src/android/bridge.ts:387`. `packages/corpus-tools/src/collectors/gmail.ts:1297` is the same shape but its reader re-fetches dropped rows, so it is benign. `packages/app-core/src/services/account-pool-status.ts:347` loses one diagnostic snapshot after a torn tail (`readSnapshots` skips the glued line).\n\n## Acceptance criteria\n\n- Once #30879 lands, the auth audit writer (and the listed siblings) append through `appendJsonlRecord` so a torn line isolates only itself.\n- A test appends torn bytes between two events and asserts the second event stays readable.\n"])</script><script>self.__next_f.push([1,"25:T706,"])</script><script>self.__next_f.push([1,"## Summary\n\nMeeting-ghost relative due dates are resolved on the UTC calendar day of the meeting. `parseDueDate` in `plugins/plugin-personal-assistant/src/lifeops/meeting-ghost/index.ts:355-370` does `new Date(meetingStartedAt)`, adds days with `setUTCDate`, reads the weekday with `getUTCDay()` and formats with `toISOString().slice(0,10)`; `dueDateToLedgerDueAt` (373-377) then pins `${dueDate}T17:00:00.000Z` and the calendar deadline (436) `T09:00:00.000Z`. `event-handler.ts:67` feeds every transcript through this path.\n\n## Reproduction (develop `5b183d21ff25`)\n\nProbe calling the exported `analyzeMeetingGhostTranscript` (results are offset-driven, identical under any process TZ):\n\n```\nstartedAt=2026-09-14T17:30:00-07:00 \"Alice will send the report by tomorrow\" -\u003e dueDate=2026-09-16  (Mon 5:30pm PT; tomorrow is 09-15)\nstartedAt=2026-09-17T17:30:00-07:00 \"Bob will send the deck by Friday\"       -\u003e dueDate=2026-09-25  (Thu 5:30pm PT; Friday is 09-18)\nstartedAt=2026-09-14T08:00:00+09:00 \"Alice will send the report by tomorrow\" rl`/`botName`/`language`/`sessionId` through `optionString` (`actions/shared.ts:31-42`) and `resolveTargetSession` (`shared.ts:117`). Core's `validateToolArgs` rejects any argument an action does not declare, so no planner call can ever deliver those values (same class as #29723, #31114, #31115).\n\n## Reproduction (develop `5b183d21ff25`)\n\nReal `validateToolArgs` from `@elizaos/core` against each action's declared parameters with the argument the handler expects:\n\n```\nJOIN_MEETING declared= =\u003e {\"valid\":false,\"errors\":[\"Unexpected argument 'meetingUrl'\",\"Unexpected argument 'botName'\",\"Unexpected argument 'language'\"]}\nLEAVE_MEETING … [\"Unexpected argument 'sessionId'\"]\nGET_MEETING_TRANSCRIPT … [\"Unexpected argument 'sessionId'\"]\n```\n\n## Consequence\n\nAny planner call carrying arguments fails validation and is retried bare; `botName`/`language` are unreachable; with two or more active meetings `LEAVE_MEETING` asks \"which one should I leave?\" (`leave-meeting.ts:27-34`) but the planner can never answer with `sessionId`, so disambiguation dead-ends unless the user pastes the URL. `shared.test.ts:55-66` exercises `optionString` directly and never sees the planner path.\n\n## Acceptance criteria\n\n- Each action declares the parameters (and aliases) its handler reads, with types and descriptions.\n- A test runs the real `validateToolArgs` + `normalizeParamAliases` over each action with the handler's expected arguments and asserts `valid: true`.\n"])</script><script>self.__next_f.push([1,"29:T68b,"])</script><script>self.__next_f.push([1,"## Summary\n\n`packages/cloud/services/gateway-discord/src/server-router.ts:26` and `packages/cloud/services/gateway-webhook/src/server-router.ts:21` compute `Number(process.env.KEDA_COOLDOWN_SECONDS ?? 900)`. `??` guards only an unset variable, so any present-but-invalid value yields `NaN`, which flows into `redis.expire(key, NaN)` in `_common/src/gateway-routing.ts:40`. The `@upstash/redis` client drops LED: \"true\" }`, `authenticateWithDevice` stubbed to count calls:\n\n```\nPROBE getSetting -\u003e boolean true\nPROBE authenticateWithDevice calls = 0\n```\n\n## Consequence\n\nWith no API key and `ELIZAOS_CLOUD_ENABLED=true` the service logs `[CloudAuth] Cloud not enabled (set ELIZAOS_CLOUD_ENABLED=true)`, the instruction the user already followed.\n\n## Acceptance criteria\n\n- The gate uses `isTruthyCloudFlag` (or `parseBooleanValue`) so `true`, `\"true\"` and `\"1\"` all enable auto-signup.\n- A test drives the real `getSetting` coercion.\n2b:T51c,## Summary\n\n`plugins/plugin-discord/messages.ts:992-1003` compares two settings against string literals that core never returns. `AgentRuntime.getSetting` (`packages/core/src/runtime.ts:2431-2432`) coerces the strings `\"true\"`/`\"false\"` to booleans before returning, so `getSetting(\"DISCORD_DRAFT_STREAMING\") === \"true\"` is always false and `getSetting(\"DISCORD_ENVELOPE_ENABLED\") !== \"false\"` is always true. The suite passes only because `__tests__/messages-component-delivery.test.ts:58` uses a fake runtime that returns raw strings.\n\n## Reproduction (develop `5b183d21ff25`)\n\nProbe with a real `AgentRuntime`, `secrets: { DISCORD_DRAFT_STREAMING: \"true\", DISCORD_ENVELOPE_ENABLED: \"false\" }`:\n\n```\nPROBE getSetting: true false\nPROBE draftStreamingEnabled = false | envelopeEnabled = true\n```\n\n## Consequence\n\nAn operator who sets `DISCORD_DRAFT_STREAMING=true` gets no draft streaming; one who sets `DISCORD_ENVELOPE_ENABLED=false` still gets envelopes. Silent, no log. Same class as #30996 / #31000; core exposes `parseBooleanValue`.\n\n## Acceptance criteria\n\n- Both flags accept the boolean core returns (and `\"1\"`/`\"0\"` where currently documented) through `parseBooleanValue` or the plugin's boolean helper.\n- A test drives the real `getSetting` coercion (boolean values), not a string-returning fake.\n2c:T514,## Summary\n\n`POST /api/plugins/:id/reveal` (`plugins/plugin-registry/src/api/app- code the pre-3038df42bfdf chrome contract (#13451/#13586: centered title, icon-only back, ≥44px tap target on mobile). Either that contract is restored in `ViewHeader`, or `assertSharedViewHeaderContract`, `clickViewHeaderBack`, the `requireViewHeader`/`viewHeaderTitle` route probes, the `text=\"Character\"` ready checks, and the per-surface header specs (notes, calendar, settings, documents, browser workspace) move to the new contract (no title row; `view-actions` only when a view has actions; back navigation via `ViewBackButton` where a surface still renders one: Settings, Trajectories, ManagedCloudPage). That is a product decision for the owner of `3038df42bfdf`; the wallet fixture slice (#31211) follows the new contract because its unit suite already had.\n\n## Acceptance criteria\n\n- Every spec above passes on develop under whichever contract is chosen.\n- `helpers/view-header.ts` describes the chosen contract in one place; route probes stop anchoring on title copy that no longer renders.\n- `canonical / Smoke (1..6)` and `Zero-Key full-walkthrough (mock lane)` are green on the develop tip.\n"])</script><script>self.__next_f.push([1,"37:T912,"])</script><script>self.__next_f.push([1,"## Summary\n\n`scenarios / Zero-Key app browser core` in the develop \"Validate develop\" workflow has been red on every run since `619545c5357f` (PR #30989; first red run 2026-09-11 01:36Z, last green `77041c39df`). The single failing case is `test/ui-smoke/onboarding-to-home.spec.ts` › \"Remote connect adopts a host and replaces onboarding without the old screen\":\n\n```\nError: expect(locator).toBeVisible() failed\nLocator:  getByTestId('home-launcher-surface')\nExpected: visible\nReceived: hidden\nTimeout:  60000ms\n```\n\nThe Playwright error context shows the runtime chooser still on screen after the `eliza:connect` event (`onboarding-step:runtime onboarding-choices:__first_run__:runtime:cloud,…`). Latest red run: https://github.com/elizaOS/eliza/actions/runs/34723784763/jo om the local agent and returned404.\n\nReproduced in native Chrome with the owner account. The bounded fix verifies the existing scoped CLI key against the fixed staging account endpoint only in explicitly configured loopback staging development, preserves JWT/native/hosted authentication, claims account callbacks before entering protected routes, and sends local account requests only to the staging API with bearer authentication and no local cookies.\n\nThis is source/local-development work. The certified hosted Dedicated latency/account release can retain its independently verified tree. No provider, backend authorization, billing policy, server, or paid capacity change.\n39:T5b8,"])</script><script>self.__next_f.push([1,"Dedicated inference repeatedly spends about four seconds in the Cloud gateway before a provider receives a request. Exclusive policy-read contention has been repaired separately, but deployed staging still showed warm pre-dispatch spans of 3531-4042ms.\n\nControlled production comparison used the same 71 prompt / 50 completion-token requests, unchanged code 7fdcfba, model, account, original Dedicated node and policy settings: default warm pre-dispatch 3645-3809ms; explicit gcp:us-west2 placement 827-846ms; restored default 3339-4347ms. All 12 requests returned 200 and the exact expected answer. Staging independently showed the same direction (warm 877-1908ms). Both experiments automatically restored placement {} and verified all other settings unchanged.\n\nAdopt the explicitly measured placement in canonical staging/production configuration. This selects a measured Worker region; it does not assert the physical region of the production database. Preserve every authentication, primary-policy, Durable Object, billing and memory check. Cold requests still take longer (production 4304ms before dispatch under placement), and provider tail latency varies.\n\nPlacement applies to the API fetch handler, so deployed routing, account pages and actual Dedicated proxy/chat behavior must be checked before production promotion. No extra Worker, node, database or capacity is needed. Reference: https://developers.cloudflare.com/workers/configuration/placement/\n"])</script><script>self.__next_f.push([1,"3a:T719,"])</script><script>self.__next_f.push([1,"A production Dedicated first-message test took 37.852 seconds from submission to finalized reply. Five model requests reported 26.729 seconds of gateway pre-forward work in total (the parallel evaluator requests overlap, so this sum is not wall time). The memory creation itself took 15 milliseconds.\n\nThe current rate limiter, organization inference admission and final dispatch fence each read policy inside a transaction holding `FOR UPDATE` on the organization row. Parallel model requests for the same agent therefore serialize their policy checks, including remote Durable Object calls performed while holding the row lock. The inference hot-path guide still describes a no-Postgres path, which is not the current implementation.\n\nScope: establish a real PostgreSQL reproduction, then permit shared policy locks only for audited inference reads whose rate/money decisions are separately serialized by Durable Objects. Preserve exclusive locks for policy publication, resource admission and other mutations. Keep the final fresh-policy check, authorization/revocation, money recovery, rate limits and complete runtime memory unchanged. Reject the candidate if real integration evidence does not support it.\n\nAcceptance: concurrent inference readers can proceed; a policy writer and credit update still conflict and order correctly; later admission sees committed policy changes; resource-count admission remains exclusive; owning tests/typecheck/lint and root verification pass; real Dedicated app traces show the result without hiding regressions. This issue does not authorize a broader runtime redesign or Shared/Telegram changes.\n\nCLAIMING: bounded Dedicated inference latency diagnosis and read-lock candidate in `codex/dedicated-inference-read-locks-20260913`. No deployment is part of this initial claim.\n"])</script><script>self.__next_f.push([1,"3b:T270d,"])</script><script>self.__next_f.push([1,"# Relates to\n\nPart of #24594 — node-loss recovery, phase 1 (durable foundation only).\n\nThis PR does **not** close #24594. It delivers the persistent records, locks,\nauthority references, exact capacity reservation, and recovery-idempotency\nfoundation. Automatic failover is not enabled anywhere.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [x] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased/merged onto the latest `origin/develop`; zero conflicts.\n- [x] `bun run verify` passes post-sync: 373/373 turbo tasks, exit 0.\n\n# Risks\n\n**High, contained by the hard-off gate.** Two reasons: the repository gains a new\nschema (two migrations, six tables and six guard triggers), and the two active\nproduction container-create paths change how they reserve node capacity.\n\nThe hard-off gate contains only the automatic failover path. It does not disable\nordinary container creation, which is exactly where this PR changes existing\nbehaviour, so that part must be reviewed on its own merits rather than assumed\ninert.\n\n- The migrations are additive and unregistered by anything: no route, worker, or\n  cron reads the six new tables.\n- `DockerSandboxProvider` and `HetznerContainersClient` now reserve a slot with a\n  compare-and-set bound to the exact node occurrence instead of a blind increment\n  by node handle. This is the only behaviour change in existing production code:\n  a node cordoned, replaced, re-attested, or filled between selection and\n  reservation is now refused rather than used.\n- Rollback now releases the same occurrence it reserved; a refused release is\n  logged as needing a recount instead of silently decrementing a same-named node.\n\n# Background\n\n## What does this PR do?\n\nAdds the durable foundation for recovering Agents when a node occurrence stops\nanswering:\n\n- **Fault records and evidence** — `agent_node_failure_events`, keyed to one\n  immutable node occurrence, plus append-only `agent_node_failure_signals`. The\n  verdict is `triggered`, not `confirmed`: corroboration starts recovery work, it\n  does not establish that a node is dead.\n- **Declared independence** — observers are a controlled enumeration, each signal\n  records the independence class and policy version it was collected under, and a\n  database constraint pins the source-to-class mapping. Two probes down one\n  network path cannot corroborate each other.\n- **Frozen fault scene** — `agent_node_failure_candidates` is written inside the\n  transaction that cordons the node, from the activation publications that\n  actually authorize each Agent on that occurrence.\n- **Processing state and concurrency** — `agent_failover_operations` (executor\n  lease with a rotating generation and DB-clock horizon, frozen source authority,\n  referenced restore authority, cutover identity bundle) and\n  `agent_failover_step_attempts` (append-only progress journal).\n- **Guards** — steps advance one at a time, an interrupted attempt must be\n  reconciled before its step runs again, a superseded executor cannot settle\n  anything, and a committed cutover cannot be cancelled or failed.\n\n`packages/cloud/shared/docs/agent-failover-contract.md` states what is proven and\nwhat is explicitly deferred.\n\n## What kind of change is this?\n\nFeature (non-breaking; the new surface is unused and the failover switch is hard\noff).\n\n## Why are we doing this?\n\nMoving an Agent between nodes must not produce two live instances, a blank Agent\npresented as recovered, or two copies of one recovery. Those failures are worse\nthan downtime, so the durable state machine and its guards land first and\nseparately, with the automated behaviour behind a switch that cannot be turned on.\n\n# Documentation changes needed?\n\nMy changes require a change to the project documentation: this PR adds\n`packages/cloud/shared/docs/agent-failover-contract.md`, which records the\ncontracts, the proof boundary, and the open decisions.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/cloud/shared/docs/agent-failover-contract.md` for the contracts, then\n`packages/cloud/shared/src/db/migrations/0387_agent_failover_guards.sql` for what\nthe database refuses.\n\n## Detailed testing steps\n\nRun the following commands:\n\n```bash\n# Durable state contracts and the migration/schema parity gate\nbun test packages/cloud/shared/src/db/repositories/__tests__/agent-failover.pglite.test.ts\nbun test packages/cloud/shared/src/db/repositories/__tests__/agent-failover-migration-parity.pglite.test.ts\n# Exact-occurrence placement reservation\nbun test packages/cloud/shared/src/db/repositories/__tests__/docker-node-exact-reservation.pglite.test.ts\n# Both create paths\nbun test packages/cloud/shared/src/lib/services/containers/hetzner-client/client.error-policy.test.ts\nbun test packages/cloud/shared/src/lib/services/__tests__/docker-sandbox-replacement-cleanup.test.ts\n# Multi-session concurrency on real PostgreSQL (local image avoids a registry pull)\nAPPS_TENANT_DB_EPHEMERAL=1 APPS_TENANT_DB_TEST_IMAGE=pgvector/pgvector:pg16 \\\n  bun test packages/cloud/shared/src/db/repositories/__tests__/agent-failover-postgres.integration.test.ts\n```\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\n- [x] Before full-page screenshots — `N/A - no UI change; no file under\n      packages/app or packages/ui is touched.`\n- [x] After full-page screenshots — `N/A - no UI change.`\n- [x] Video walkthrough — `N/A - no UI change and no user flow; the change is a\n      database authority layer plus placement reservation.`\n- [x] Backend logs — No deployed failover runtime capture applies because\n      automatic failover remains disabled. Backend behavior for the two active\n      placement paths is exercised by the attached focused test output, including\n      reservation refusal, pre-create failure, post-create cleanup, retained\n      capacity on ambiguous cleanup, and exact release.\n- [x] Frontend console and network logs — `N/A - no UI or HTTP surface.`\n- [x] Real-LLM trajectory — `N/A - no agent, action, provider, prompt, or model\n      change.`\n- [x] Domain artifacts — attached below: migration-enforced refusals and\n      real-PostgreSQL concurrency results.\n- [x] OCR visual-text review — `N/A - no rendered visual surface.`\n\n### Domain artifacts\n\nDatabase-level refusals, asserted by the guards rather than by repository\nconvention:\n\n```\n# packages/cloud/shared/src/db/repositories/__tests__/agent-failover.pglite.test.ts\n(pass) a reconciled-continued cutover clears the same authority bar as a success\n(pass) the identity bundle is frozen before the publication exists\n(pass) an unrecorded reserved attempt cannot be skipped on the way to terminal\n(pass) a failover cannot go terminal before its slot is provably back\n(pass) an event cannot be withdrawn while an operation still needs to release capacity\n 44 pass, 0 fail\n```\n\n```\n# real PostgreSQL, independent sessions\n(pass) hands one operation to exactly one of two racing workers\n(pass) refuses to displace a live lease under real sessions\n(pass) rotates the fence exactly once when two workers race an expired lease\n(pass) admits only one step attempt when the winning worker is duplicated\n(pass) refuses a settlement presented by a superseded session\n(pass) cordons and freezes exactly one agent set under concurrent freezes\n(pass) never counts target capacity itself\n(pass) replays both migrations and installs every guard\n 8 pass, 0 fail\n```\n\n```\n# placement reservation, both create paths\nclient.error-policy.test.ts                         24 pass, 0 fail\ndocker-sandbox-replacement-cleanup.test.ts          68 pass, 0 fail\ndocker-sandbox-exact-restore.test.ts                21 pass, 0 fail\ndocker-node-exact-reservation.pglite.test.ts         8 pass, 0 fail\n```\n\n# Known gaps / failures\n\n1. **`bun install --frozen-lockfile` exits non-zero in this environment, before\n   any change in this PR.** Dependency resolution succeeds and `bun.lock` is\n   untouched, but the `postinstall` step fails building the fused-inference\n   native library:\n\n   ```\n   Embedding Metal library (compiled metallib + eliza-shipped kernels)\n   error: cannot execute tool 'metal' due to missing Metal Toolchain;\n          use: xcodebuild -downloadComponent MetalToolchain\n   [stage-desktop-fused-lib] ERROR: cmake exited 2\n   error: postinstall script from \"eliza\" exited with 1\n   ```\n\n   Reproduced identically on Bun 1.4.0 and on the pinned Bun 1.3.14, so it is a\n   missing local Xcode component, not this change. `bun run verify` passes on\n   both.\n\n2. **The switch stays hard off.** `AGENT_BACKUP_RESTORE_FAILOVER_ENABLED=1`\n   still throws in\n   `agent-backup-restore-coordinator-runtime.ts`; there is no new environment\n   variable, configuration entry, background caller, cron entry, worker wiring,\n   deployment, or autoscaling on this path. Its gate test passes.\n\n3. **Deferred to the wiring and enablement phase, not claimed here:**\n   - enforcing the authority at the three business boundaries (inbound message,\n     state write, outbound send). Recording an authority chain is not isolation;\n     nothing in this PR rejects a stale instance at a boundary.\n   - the explicit recovery flow integration, node drain/cordon orchestration, and\n     cleanup of the old container.\n   - the seal-and-import protocol for shared-mode data written during the outage.\n   - staging failover rehearsal with RTO/RPO evidence, and the full fault\n     injection matrix.\n\n4. **Validation environment.** Suites were run on an isolated Bun 1.3.14\n   (`/tmp/bun-1.3.14`, absolute path only); the machine's default Bun remains\n   1.4.0 and was not modified.\n"])</script><script>self.__next_f.push([1,"3c:T2ec4,"])</script><script>self.__next_f.push([1,"# Relates to\n\nPart of #31180 and #30123. This PR adds the storage and admission foundation for reviewed family deletion; it does not close either issue.\n\n# Background\n\nOwner-bound dependency snapshots now fingerprint complete persisted rows while exposing only reviewable identities. The guarded transaction rejects stale previews and unsettled operations. Agreement uploads, review decisions, pins, grants, warning intents, and scheduled family mutations participate in the durable lifecycle fence.\n\nScheduled ownership includes monthly tasks, grant warnings, and approval reminders, including a canonical household approval whose domain link has not been acknowledged. Removing task metadata cannot bypass the fence. Execution admission and the scheduler's metadata compare-and-swap keep the observed task associated with the execution, and the operation stays unsettled until final receipt persistence. Lost source-write acknowledgements preserve reconciliation identity instead of reporting successful rollback without proof.\n\n# Risks\n\nMedium: short database transactions acquire ordered table locks around admission. Unknown write or execution outcomes retain durable claims and therefore block deletion; elapsed time does not clear them. Typed domain errors remain intact for callers, with reconciliation identity recorded in diagnostics. Unrelated tasks and approvals remain usable.\n\nThe complete owner deletion UI/API, primary/derived/cache purge, backup retention, remaining packet/school writers, and deployed acceptance remain in #31180. This PR neither invokes deletion on the pilot nor changes provider events or messages.\n\n# Sync and validation\n\nRebased without conflicts on `b0e467c7ddef98951a234f1765ab1a32e434c043`; `bun install` and all checks below ran afterward at `e3c2d5db8efbba3ae126bf4d6b09ef688136f04d`.\n\n- `bun run verify`: 373/373 tasks, all repository audits passed.\n- Personal-assistant package tests: 2,662 passed, six existing skips, 303 files.\n- Scheduling package tests: 642 passed, 36 files.\n- Four real-PGlite agreement, household, and scheduled-store suites: 71 passed.\n- Both packages' typecheck and lint:check passed.\n- Independent artifact capture: two real-runtime database cases passed; captured JSON rows were manually inspected and their checksums reverified after public download.\n\nThe document, metadata-race, unlinked-warning, and missing-approval-reminder regressions were observed failing before repair. The resulting records show preserved family task/history rows, an unrelated approval becoming dismissed after fencing, and unrelated task/history deletion remaining atomic under an injected SQL failure.\n\n# Documentation\n\nUpdated the personal-assistant and scheduling contracts, plus the Bettina verification plan's already authorized automatic school-import policy.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:e3c2d5db8efbba3ae126bf4d6b09ef688136f04d --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - no rendered UI surface changes; the new deletion guards are internal database contracts.\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - no rendered UI surface changes or owner deletion screen is introduced.\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - the exercised admission and injected-failure paths run through real storage fixtures, not a new frontend journey.\n\u003c!-- evidence-row:backend-logs --\u003e\n[Real-runtime integration and artifact-producer res ant/src/components/family-operations/adapter.test.ts` exercising `createFamilyOperationsAdapter` against a mock client double, validating that all paths, methods, and chunk binary upload headers pass through `apiClient.fetch`."])</script><script>self.__next_f.push([1,"41:T8f2,"])</script><script>self.__next_f.push([1,"When a Dedicated agent cannot pay its accrued compute, billing currently gives it 48 hours of grace and depends on warning-email delivery before scheduling a stop. A separate five-second creation timestamp assumption also leaves one live staging agent permanently failing billing.\n\nThis eight-file promotion queues an immediate, durable billing stop without an email dependency and correctly handles the explicit revision-zero, zero-rate creation interval. It preserves funding rechecks, retry receipts, workload-generation fencing and rejection of incomplete rate history. A top-up before provider stop still wins the locked settlement recheck.\n\nSource PRs #31284 and #31287 are merged. Production head `a8de106ae64f8e895b1ec00553e1d34c93ee2e65` has whole tree `de5c544df96c27075649987d81efbe2756fe4ede`, exactly matching staging candidate `48114e60dc50a3bb312a229ce7b3e7ef2bf53dd9`. No broad develop merge, rate change, existing-balance reset, schema migration or runtime image change.\n\nValidation: all 373 source repository verification tasks and final audits passed. Combined staging runs passed 83 database/cron tests (602 assertions) and API TypeScript/router/production Worker bundle checks. The two slow-creation regressions failed before the fix. All five hosted production checks passed. Canonical staging Cloud release 34780536173 and control-plane release 34781409370 succeeded at 5e308dab. The live staging zero-balance test admitted a durable billing stop, created a fresh backup, and confirmed provider shutdown in about 45 seconds. The temporary hold of existing founder credits was fully refunded; no card charge or grant was made. Backup decryption and manifest verification passed (content hash was not checked). After funded recovery through the already-open app, all 49 rendered messages matched the pre-stop history exactly after reload. The test used the authorized deployed service on the control plane; it was not a public HTTP cron test.\n\nA queued stop does not prove provider shutdown. Prepaid hosting reservations, provider paid-time expiry, cost-based pricing/capacity and storage expiry remain outstanding under #31280. Automatic VM expansion is separately paused in staging and production. UI screenshots: N/A for these backend billing changes.\n\nRefs #31280.\n"])</script><script>self.__next_f.push([1,"42:T5a0,"])</script><script>self.__next_f.push([1,"Local `bun run dev` users who completed Cloud sign-in could loop back through login on `/cloud/billing`, then send account requests to the local agent and receive `Not found`. Claim the one-time callback on the app settings route before returning to the requested account page, verify the CLI credential against the staging account authority, and route account requests to that same authority.\n\nThis behavior is confined to the explicitly configured loopback staging development lane. Offline cookie-backed local Cloud keeps its same-origin authority until a CLI credential is claimed. Hosted and native authentication, cross-origin restrictions, and the server requirement for interactive billing mutations remain intact. Invalid credentials and stale responses cannot authenticate a different account.\n\nValidation: 91 focused callback, provider, and transport tests passed; UI typecheck, nine-file Biome, and diff checks passed. Root verification completed 373 tasks and repository audits; the later transport/provider changes were covered by the final focused tests and UI typecheck. The real local Billing payment replay, including agent-status503 reload, passed after the offline-cookie routing regression was corrected. Native Chrome testing with the owner profile completed normal Cloud login, restored the existing 41-message conversation, and displayed the correct Billing account, balance, and Dedicated resource.\n\nCloses #31207.\n"])</script><script>self.__next_f.push([1,"43:Ted2,"])</script><script>self.__next_f.push([1,"Closes #31245\n\n## What\n\n- `packages/cloud/services/_common/src/integer-env.ts` (new, exported as `./integer-env`): the lexical integer parser previously private to gateway-discord, plus `parsePositiveIntegerEnvValue(name, value, default)` which applies the default only when the variable is unset.\n- `packages/cloud/services/_common/src/gateway-routing.ts`: `resolveKedaCooldownSeconds(value)` (default 900) next to the `refreshGatewayActivity` it feeds.\n- `gateway-discord/src/server-router.ts` and `gateway-webhook/src/server-router.ts` call `resolveKedaCooldownSeconds(process.env.KEDA_COOLDOWN_SECONDS)` at module load.\n- `gateway-discord/src/integer-env.ts` becomes a re-export of the shared parser (existing importers and `integer-env-parsing.test.ts` unchanged).\n- New tests: `_common/tests/integer-env.test.ts`, `gateway-discord/tests/keda-cooldown-env.test.ts`, `gateway-webhook/__tests__/keda-cooldown-env.test.ts`. Env docs updated in the three CLAUDE.md/AGENTS.md pairs.\n\n## Why\n\n`Number(process.env.KEDA_COOLDOWN_SECONDS ?? 900)` guards only an unset variable, so a present-but-invalid value yields `NaN` (or `0` for an empty string, or a negative TTL), which reaches `redis.expire(key, NaN)` in `_common/src/gateway-routing.ts`. The Upstash client drops the `NaN` argument and Redis rejects the one-argument `EXPIRE`; in gateway-discord that rejection lands in the same `catch` that wraps `forwardToServer`, so every inbound message is counted as failed and never forwarded, and in gateway-webhook `lpush`/`ltrim` have already run so the activity key persists with no TTL and KEDA never scales down. The fix follows the existing gateway-discord policy for numeric env (`parseIntegerEnvValue` + fatal `ElizaError` `INVA ed trust-policy entry is rewrapped as the invalid setting it lives in (J2) instead of being swallowed into `{}`. The trust-policy reader was not named in the issue but had the identical `catch { return {} }` shape, so it is fixed alongside the three named readers.\n- The connect route reads all four settings through `loadPersistedCapabilityRouterState` **before** it calls the endpoint or cloud provider, and `persistEndpoint` consumes that snapshot. A corrupt setting therefore fails the request with a structured 500 naming the setting, the runtime is not mutated, `persistConfigEnv`/`saveConfig` are never called, and the stored value is left untouched. The route catch (J1) answers 500 for this error class and keeps 400 for request-validation and provider failures. The pre-existing \"persistence is unavailable in this runtime\" check also moves ahead of the connect as part of the same fail-closed ordering. `persist: false` connects are unaffected.\n\nTests in `remote-capability-routes.test.ts` pin: trailing-comma `ELIZA_CAPABILITY_ROUTER_URLS` via `process.env` and via `config.env.vars`, a corrupt `ELIZA_CAPABILITY_ROUTER_ALLOWED_MODULES`, a corrupt `ELIZA_CAPABILITY_ROUTER_TRUST_POLICY`, a corrupt `ELIZA_CAPABILITY_ROUTER_TRUST_AUDIT`, a non-array endpoint list, and the `persist: false` path still connecting. Each corrupt case asserts the 500 names the setting, no persist call happened, the provider was never invoked, and the stored value is byte-identical afterwards. The suite's `afterEach` now also restores `ELIZA_CAPABILITY_ROUTER_TRUST_POLICY` / `_TRUST_AUDIT`, which earlier tests leak into `process.env` through the `persistConfigEnv` stub (that leak masked the trust-policy case).\n\n## Why\n\n`readPersistedEndpoints` parsed `ELIZA_CAPABILITY_ROUTER_URLS` inside a `catch` that returned `[]`; `persistEndpointInner` merged the new endpoint into that empty list and called `persistConfigEnv`/`saveConfig`, so every previously configured endpoint was overwritten and the laywright`) from the local install and are untouched by this change.\n\nRoot `bun run verify` will be run on a stack with the other hunt fixes and posted here.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01Gpg1SzympM3Yf5LQvzktqk\n"])</script><script>self.__next_f.push([1,"49:Tec8,"])</script><script>self.__next_f.push([1,"# Relates to\n\nPart of #31180 and #30123; neither issue is closed by this change. Builds on merged #31229.\n\n# Behavior\n\nSchool source configuration, ingestion, and approved calendar application now reject new work after the family workspace deletion fence. Ingestion holds a durable source/run claim through PDF extraction and persisted review; application holds its claim through calendar delivery and the final database receipt.\n\nA known fetch failure releases the claim after recording failure. A lost storage acknowledgement preserves the PDF hash and canonical media URL, and an unknown calendar outcome preserves the source/run/application identity. Deletion cannot race these unfinished operations. Claims have no time-based expiry.\n\n# Validation\n\nAt `7c45c43e6748954233ea08f2093376f4c4459a6d`, all 28 school workflow tests passed; the full personal-assistant package passed 2,676 tests with six existing skips across 303 files. Package typecheck and lint passed, and `bun run verify` passed 373/373 tasks. A fresh fetch/rebase was unchanged; `bun install` made no changes and the subsequent pre-submit repository gate also passed. Before repair, all three fenced mutation cases incorrectly succeeded.\n\nThe exact-head artifact run passed eight selected real PGlite cases; twenty other cases were intentionally excluded from capture, not omitted from the complete suite. Captured rows were inspected: acknowledged completion permits fencing, while unknown storage or provider outcomes retain the corresponding durable identity.\n\nAfter #31229 merged, this branch rebased to `13fddecebbe5e91d173d95c3c nRoot `bun run verify` will be run on a stack with the other hunt fixes and posted here.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01Gpg1SzympM3Yf5LQvzktqk\n"])</script><script>self.__next_f.push([1,"4e:T13bb,"])</script><script>self.__next_f.push([1,"Closes #31249\n\n## What\n\n- `plugins/plugin-personal-assistant/src/lifeops/meeting-ghost/index.ts`: `MeetingGhostTranscript` gains an optional IANA `timeZone`. `parseDueDate` projects the meeting instant into that zone with `getZonedDateParts` and walks days with `addDaysToLocalDate` / `getWeekdayForLocalDate` (from `lifeops/time.ts`); the 17:00 ledger `dueAt` and the 09:00 calendar deadline are wall times in that zone built with `buildUtcDateFromLocalParts`. An explicit `YYYY-MM-DD` is re-validated so an impossible day (e.g. `02-30`) yields no instant instead of rolling forward. The header documents the zone precedence: transcript `timeZone` -\u003e owner's configured zone -\u003e process zone.\n- `consumer.ts`: `runMeetingGhostForTranscript` stamps a transcript that carries no zone with `resolveOwnerTimeZone(runtime, \u003cmeeting instant\u003e)` before analysis, so the reachable event path (`event-handler.ts`, whose finalized payload carries no zone) resolves on the owner's calendar day.\n- Existing fixtures in `test/meeting-ghost.test.ts` and `test/meeting-ghost.integration.test.ts` are pinned to `timeZone: \"UTC\"` so their instant assertions stay deterministic on any host.\n- New `test/meeting-ghost.local-due-dates.test.ts` pins the four cases from the issue (with the transcript zone, and again through the process-zone fallback), an explicit date, and an impossible date.\n\n## Why\n\n`parseDueDate` resolved \"tomorrow\"/weekday phrases on the UTC calendar day of `meetingStartedAt` (`setUTCDate`, `getUTCDay`, `toISOString().slice(0,10)`), and `dueDateToLedgerDueAt` / the calendar deadline pinned `T17:00:00Z` / `T09:00:00Z`. A Monday 5:30pm PT meeting is already Tuesday in UTC, so \"by tomorrow\" landed on Wednesday and \"by Friday\" a week out; a Monday 8am JST meeting is still Sunday in UTC, so \"by tomorrow\" landed on Monday itself and \"by Monday\" on the meeting day. The ledger `dueAt`, follow-up approvals, and \"Deadline:\" calendar intent all carried that day. Resolving on the meeting's local day and building the instants in that zone fixes every consumer at once.\n\n## Evidence\n\nRed on `develop` (`5b183d21ff25`) with the new test only (`bunx vitest run test/meeting-ghost.local-due-dates.test.ts` in `plugins/plugin-personal-assistant`):\n\n```\n ❯ test/meeting-ghost.local-due-dates.test.ts (9 tests | 9 failed)\n   Monday 5:30pm PT, 'by tomorrow'   AssertionError: expected '2026-09-16' to be '2026-09-15'\n   Thursday 5:30pm PT, 'by Friday'   AssertionError: expected '2026-09-25' to be '2026-09-18'\n   Monday 8am JST, 'by tomorrow'     AssertionError: expected '2026-09-14' to be '2026-09-15'\n   Monday 8am JST, 'by Monday'       AssertionError: expected '2026-09-14' to be '2026-09-21'\n   explicit 2026-09-18 in PT         AssertionError: expected '2026-09-18T17:00:00.000Z' to be '2026-09-19T00:00:00.000Z'\n Test Files  1 failed (1)\n      Tests  9 failed (9)\n```\n\nGreen after the fix (`--reporter=verbose`):\n\n```\n ✓ Monday 5:30pm PT, 'by tomorrow' is Tuesday \u003e uses the transcript zone for the due day and the 5pm/9am instants\n ✓ Monday 5:30pm PT, 'by tomorrow' is Tuesday \u003e falls back to the process zone when the transcript carries none   (TZ=America/Los_Angeles)\n ✓ Thursday 5:30pm PT, 'by Friday' is the next day \u003e uses the transcript zone ...\n ✓ Thursday 5:30pm PT, 'by Friday' is the next day \u003e falls back to the process zone ...                         (TZ=America/Los_Angeles)\n ✓ Monday 8am JST, 'by tomorrow' is Tuesday \u003e uses the transcript zone ...\n ✓ Monday 8am JST, 'by tomorrow' is Tuesday \u003e falls back to the process zone ...                                (TZ=Asia/To ia/Tokyo`, `America/Los_Angeles`, `Pacific/Kiritimati`.\n\n## Why\n\nEvery \"today\" in the health plugin came from `new Date().toISOString().slice(0, 10)`, the UTC calendar day. HealthKit's `--date` is a device-local day and screen-time / connector rows are keyed by local day, so a Tokyo owner asking before 09:00 JST (or a Kiritimati owner before 14:00) was handed yesterday's day and the reply labelled it as today; the N-day trend ended on yesterday as well. The runners now resolve the owner's zone once per invocation and every day key and the trend walk are computed in that zone.\n\n## Evidence\n\nRed on `develop` (`5b183d21ff25`) with the new tests only, `bunx vitest run` in `plugins/plugin-health`:\n\n```\n ❯ src/actions/screen-time.local-day.test.ts (3 tests | 2 failed)\n     × TZ='Asia/Tokyo' at 22:30Z requests and labels '2026-09-14'\n     × TZ='Pacific/Kiritimati' at 22:30Z requests and labels '2026-09-14'\n ❯ src/health-bridge/health-bridge.local-day.test.ts (9 tests | 6 failed)   # all three Asia/Tokyo and Pacific/Kiritimati cases\n ❯ src/actions/health.local-day.test.ts (9 tests | 8 failed)\n       × requests and labels the HealthKit day 2026-09-14 for \"today\"        # Asia/Tokyo\n       × walks the trend window in Asia/Tokyo\n       × requests and labels the HealthKit day 2026-09-14 for \"today\"        # Pacific/Kiritimati\n       × walks the trend window in Pacific/Kiritimati\n       ...\nAssertionError: expected \"vi.fn()\" to be called with arguments: [ '2026-09-14' ]\nAssertionError: expected [ '2026-09-11', '2026-09-12', '2026-09-13' ] to deeply equal [ '2026-09-12', '2026-09-13', '2026-09-14' ]\n Test Files  3 failed (3)\n      Tests  16 failed | 5 passed (21)\n```\n\nGreen after the fix (same command):\n\n```\n ✓ src/actions/health.local-day.test.ts (9 tests)          TZ=Asia/Tokyo, America/Los_Angeles, Pacific/Kiritimati\n ✓ src/actions/screen-time.local-day.test.ts (3 tests)\n ✓ src/health-bridge/health-bridge.local-day.test.ts (9 tests)\n Test Files  3 passed (3)\n      Tests  21 passed (21)\n```\n\n- `bun run --cwd plugins/plugin-health test`: `Test Files 41 passed | 4 skipped (45)`, `Tests 226 passed | 4 skipped (230)`.\n- `bun run --cwd plugins/plugin-health typecheck`: exit 0.\n- personal-assistant: `bunx vitest run src/lifeops/domains/health-service.status.test.ts src/actions/owner-surfaces.reminder-context.test.ts test/owner-action-handler-permissions.test.ts`: `Tests 26 passed (26)`. `tsc --noEmit -p tsconfig.build.json` with `@elizaos/plugin-health` mapped to this branch's source: no errors in changed files (the only two errors are the pre-existing `voice-observer-bridge.ts` agent `dist`/`src` mismatch in the linked install).\n- `bunx biome check` on all 14 changed files: `No fixes applied`, no errors.\n\nRoot `bun run verify` will be run on a stack with the other hunt fixes and posted here.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01Gpg1SzympM3Yf5LQvzktqk\n"])</script><script>self.__next_f.push([1,"54:T78a,"])</script><script>self.__next_f.push([1,"Agreement downloads, owner lists, exports, and pinned context could still return retained private data after the workspace entered revoking or deleted state. These reads now check lifecycle admission before and after asynchronous retrieval. Export-audit writes use the same active-workspace transaction boundary; the planner receives an explicit revoked-context result.\n\nPart of #31180. This supplies read revocation for the owner deletion journey; deletion UI, primary/derived purge, backups, and live deployment acceptance remain open.\n\nValidation:\n- Real-PGlite agreement integration: 41 passed, including retained-source and in-flight storage-read revocation.\n- Personal assistant: 2676 passed, 6 existing skips, 303 files; typecheck and lint passed.\n- Root verify: 373 tasks passed; fresh post-rebase install and root verify also passed.\n\n[Download inspected synthetic storage/database evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31180-bettina-read-revocation-2f4909d-evidence.zip). ZIP SHA-256: `c1e5b90eae6313ce00694b55fb27e4b2dad8f0fe543b8cb1aafbf4bff9c9d50d`. The three manifest entries and downloaded public bytes were verified. Both lifecycle records show rejected reads while the canonical document and private-byte hash remain present.\n\nCapture revision: `2f4909df4d61c137d4a093e65fc7f09e891e26b4`. Rebased revision: `e31a9201244dd822fc50e02be32ae2803639bc92`. Both have identical tree `df647a35309f1df927802356010cb89758b2bf88`. The artifact rerun selects two tests; its 39 exclusions are not claimed as a full-suite run.\n\nUI/native recordings: N/A — no UI or native implementation changes. Live-model trajectory: N/A — this change rejects data at the storage/lifecycle boundary and returns a fixed unavailable provider result, without a generation call. Real deployment/connector sends: not performed by this PR.\n\n\u003c!-- evidence-head: e31a9201244dd822fc50e02be32ae2803639bc92 --\u003e\n"])</script><script>self.__next_f.push([1,"55:Teaf,"])</script><script>self.__next_f.push([1,"# Relates to\n\nPart of #31180 and #30123; neither issue is closed by this change.\n\n# Behavior\n\nMonthly packet creation, external draft creation, and draft revision now check the durable family workspace lifecycle in the same transaction as their write. Once deletion fences the workspace, these operations reject without adding private packet or draft content.\n\nEnqueuing a reviewed draft holds a durable operation through canonical approval persistence and reminder surfacing. Deletion waits while that operation is in flight. Successful completion settles the claim; an uncertain acknowledgement retains the packet ID and draft version for reconciliation instead of permitting deletion to race unfinished work.\n\n# Validation\n\nThe six new regression cases use fresh real PGlite databases. Four prove fenced packet, draft, revision, and approval mutations leave existing rows unchanged. Two exercise delayed reminder completion and a lost acknowledgement. The approval queue is an injected collaborator for this lifetime boundary; no provider message is sent.\n\nBefore repair, all four fenced mutation cases incorrectly succeeded. After repair, the complete packet integration suite passed 17 tests. The personal-assistant package suite passed 2,668 tests with six existing skips across 303 files. Repository verification passed 373 tasks. These results ran at the pre-rebase source tree; rebase onto merged #31226 preserved that tree byte for byte.\n\nAfter rebase at `3c94b3da387aec0e75340459f0de182a321b5aae`, `bun install` made no changes and `bun run verify` passed 373/373 tasks. The exact-head database artifact producer passed all six selected cases. The other 11 packet tests were intentionally excluded from that capture run, not skipped by the package suite.\n\n# Scope remaining\n\nThis is the packet mutation portion of the deletion workflow. It does not add a deletion screen, purge private data, revoke reads, select backup retention, or deploy the pilot. School writers and the complete owner deletion journey remain in #31180.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:3c94b3da387aec0e75340459f0de182a321b5aae --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - internal transaction and approval-lifetime guards; no rendered UI changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - no rendered UI changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - database admission is exercised by real PGlite fixtures; no new frontend journey.\n\u003c!-- evidence-row:backend-logs --\u003e\n\u003cdetails\u003e\u003csummary\u003eReal-PGlite evidence producer results\u003c/summary\u003e\n\n```text\n\n RUN  v4.1.10 \u003cworktree\u003e\n\n\n Test Files  1 passed (1)\n      Tests  6 passed | 11 skipped (17)\n   Start at  06:09:42\n   Duration  9.44s (transform 5.00s, setup 3.47s, import 2.74s rovider body whose parsed envelope carries an `error` member (JSON-RPC object, or the bare string Alchemy's NFT REST API can emit). It throws a typed `ElizaError` with code `EVM_PROVIDER_RPC_ERROR`, context `{ provider, chain, chainId, rpcCode }`, and the provider's own message. The helper wraps the Alchemy `eth_getBalance` and `alchemy_getTokenBalances` calls, the Ankr `ankr_getAccountBalance` call, and both NFT calls (`getNFTsForOwner`, `ankr_getNFTsByOwner`). The public-RPC path keeps its existing `data.error?.message` check unchanged.\n\nFive new tests in `wallet-evm-balance.test.ts` pin the 200-with-error envelope on each path: balances assert `error !== null` carrying the provider message with no zero balances presented as healthy; the NFT paths assert the envelope is rejected and logged with the chain and provider message rather than silently read as an empty collection (`WalletEvmNftCollection` has no error field, so the existing per-chain NFT boundary is kept as-is; widening that public DTO is out of scope here).\n\n## Why\n\nAlchemy and Ankr answer HTTP 200 with `{\"jsonrpc\":\"2.0\",\"id\":1,\"error\":{...}}` for compute-unit throttling, invalid keys, and unsupported chains. `jsonOrThrow` only rejected non-2xx or non-JSON bodies, and the keyed paths read a missing `result` as `0n` / `[]`, so every throttled chain was emitted as `nativeBalance: \"0\", tokens: [], error: null` and `makeEvmChainFailure` never fired. The wallet UI then showed $0 on every EVM chain, and `wallet-balance-delta` (which excludes only chains with `error !== null`) took the false zero as a real sample and produced spurious \"dropped to zero\" / \"restored\" notifications. With the helper the throw reaches the existing per-chain `catch` in `fetchEvmBalances`, which reports it through `makeEvmChainFailure` with the provider text.\n\n## Evidence\n\nRed on develop `5b183d21ff25` (`bunx vitest run src/api/wallet-evm-balance.test.ts -t \"JSON-RPC error envelopes\"` in `packages/agent`):\n r\":\"lalalune\",\"number\":31184,\"repository\":\"elizaos/eliza\",\"body\":\"$17\",\"createdAt\":\"2026-09-12T22:30:17Z\",\"closedAt\":\"2026-09-13T03:06:38Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABRAJpSQ\",\"title\":\"fix(lifeops): make household actions available to authenticated owner planning\",\"author\":\"lalalune\",\"number\":31176,\"repository\":\"elizaos/eliza\",\"body\":\"$18\",\"createdAt\":\"2026-09-12T20:57:20Z\",\"closedAt\":\"2026-09-13T03:12:34Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABRAAXtQ\",\"title\":\"fix(lifeops): expose agreement reads to verified scoped guest sessions\",\"author\":\"lalalune\",\"number\":31172,\"repository\":\"elizaos/eliza\",\"body\":\"$19\",\"createdAt\":\"2026-09-12T20:29:37Z\",\"closedAt\":\"2026-09-13T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABQ_U_hQ\",\"title\":\"feat(lifeops): export agreement originals with provenance and audit history\",\"author\":\"lalalune\",\"number\":31162,\"repository\":\"elizaos/eliza\",\"body\":\"$1a\",\"createdAt\":\"2026-09-12T18:09:11Z\",\"closedAt\":\"2026-09-13T03:12:32Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABRCfRtg\",\"title\":\"test(ui): wait for the consent return URL effect before asserting persistence\",\"author\":\"lalalune\",\"number\":31222,\"repository\":\"elizaos/eliza\",\"body\":\"The full UI suite on develop plus the test-only locale fix (`600e147805888cf9b53aa82754d8d1b57f9e75e3`) failed in `authorize-content.test.tsx:180`: the consent screen was visible but `APP_AUTH_RETURN_TO_KEY` was still null. 14,210 other tests passed. The same file passes in isolation.\\n\\n`AuthorizeContent` writes this handoff value in a passive effect after status becomes ready. The test waits for DOM text, then assumes that separate effect has completed. Wait for the actual persisted handoff result while retaining its expected URL. Do not change production authorization or swallow persistence failures to make the test pass.\\n\\nAcceptance: the existing consent test observes the expected persisted return URL through an asynchronous assertion; the focused authorization and full UI suites pass, with root verification. This is a test synchronization defect discovered during Bettina acceptance validation.\\n\",\"createdAt\":\"2026-09-13T06:10:41Z\",\"closedAt\":\"2026-09-13T07:02:30Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABRCBatw\",\"title\":\"fix(agent): preserve decimal source evidence during trajectory redaction\",\"author\":\"lalalune\",\"number\":31218,\"repository\":\"elizaos/eliza\",\"body\":\"A live synthetic agreement review recorded PDF geometry such as `328.31999999999994` as `328.\u003cCARD\u003e`. The trajectory normalizer mistakes a fractional digit run for a payment-card number. The saved source evidence is then invalid JSON, preventing source-to-record verification.\\n\\nAffected boundary: `normalizeLlmCallPayload` in the standalone agent trajectory recorder, used by owner agreement review.\\n\\nAcceptance:\\n- Complete decimal coordinates survive normalization and can be parsed back without changing numeric values.\\n- Existing standalone card-number, email, and credential redaction remains active.\\n- Cover the observed failure at the real normalizer boundary, including card-shaped text alongside numeric source data.\\n- Run package validation and retain a fresh live review trajectory before claiming end-to-end completion.\\n\\nDiscovered while validating #31192 / #31032. No real card data is required for reproduction.\\n\",\"createdAt\":\"2026-09-13T04:12:06Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABRBwliQ\",\"title\":\"test(ui): wallet widget e2e waits for the retired wallet-section title header, failing the ui-extended lane\",\"author\":\"hermesagent270-commits\",\"number\":31210,\"repository\":\"elizaos/eliza\",\"body\":\"$1b\",\"createdAt\":\"2026-09-13T03:03:37Z\",\"closedAt\":\"2026-09-13T05:07:46Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABRBiklQ\",\"title\":\"Keep account recovery controls reachable when the selected agent is unavailable\",\"author\":\"NubsCarson\",\"number\":31203,\"repository\":\"elizaos/eliza\",\"body\":\"A valid Cloud account could not open agent-management recovery controls when its selected Dedicated agent was asleep: the full app startup gate waited for that same agent before mounting `/cloud/agents`. This was observed while restoring the original production QA agent from backup.\\n\\nAccount management is authorized by the Steward/Cloud session and its registered UI page. Keep that exact account surface accessible independently of agent startup and agent-password state, while preserving normal startup/auth gates for signed-out and plugin-owned runtime surfaces.\\n\\nRegression: all four initially tested unavailable-agent phases blocked the account fixture before the fix. The candidate passes six startup phases plus signed-out and plugin-owner negative cases, and the existing first-run overlay tests. Add a browser reload with agent status503 while real account billing APIs remain available.\\n\",\"createdAt\":\"2026-09-13T02:12:45Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABRBfhfQ\",\"title\":\"test(ui): home-screen fixture client lacks onAuthorityChange, failing the chat-shell and ui-core e2e lanes\",\"author\":\"hermesagent270-commits\",\"number\":31198,\"repository\":\"elizaos/eliza\",\"body\":\"$1c\",\"createdAt\":\"2026-09-13T02:00:08Z\",\"closedAt\":\"2026-09-13T05:07:29Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABRArPUA\",\"title\":\"fix(lifeops): accept explicit empty subjects for knowledge-only household grants\",\"author\":\"lalalune\",\"number\":31186,\"repository\":\"elizaos/eliza\",\"body\":\"$1d\",\"createdAt\":\"2026-09-12T22:46:14Z\",\"closedAt\":\"2026-0 closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABRBgXxQ\",\"title\":\"Preserve account deep links when the Cloud plugin registers late\",\"author\":\"NubsCarson\",\"number\":31200,\"repository\":\"elizaos/eliza\",\"body\":\"Authenticated account deep links can display Launcher instead of Billing or Agents. This was reproduced in the real staging app after returning Google sign-in, and in source CI run 34728356779 (billing replay completed settlement assertions but never requested billing/limits).\\n\\nThe deferred plugin-elizacloud app registration and the managed web account page share the cloud id. The registry replaces entries by id. If the plugin module finishes last, its root-only /cloud declaration overwrites the managed /cloud/* route family. Import order explains why the same renderer passed staging CI but failed source CI.\\n\\nPreserve the managed account registration when the plugin fallback loads later, while retaining the signed plugin page in local/native hosts. Cover both actual module import orders and the standalone plugin case. Validate Billing and Agents in the real app after deployment. Agent-unavailable startup blocking remains a separate acceptance item.\\n\",\"createdAt\":\"2026-09-13T02:03:34Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABRBHIRw\",\"title\":\"Dedicated inference serializes policy reads behind exclusive organization locks\",\"author\":\"NubsCarson\",\"number\":31191,\"repository\":\"elizaos/eliza\",\"body\":\"$3a\",\"createdAt\":\"2026-09-13T00:20:58Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0}],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs8AAAABDU7Y_g\",\"title\":\"feat(cloud): add durable node-failure and failover foundation\",\"author\":\"sclfcz\",\"number\":31230,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-13T10:21:52Z\",\"mergedAt\":null,\"additions\":8553,\"deletions\":43},{\"id\":\"PR_kwDOMT5cIs8AAAABDU
