ngSession queued via scriptedDeps), then fired two concurrent requestJoin calls for the same meeting URL:\n\n  const { deps } = scriptedDeps([new ScriptedAdapter(\"google_meet\")], [new FakeMeetingBillingSession(), new FakeMeetingBillingSession()]);\n  const service = new MeetingService(fake.runtime, deps);\n  const results = await Promise.allSettled([\n    service.requestJoin({ platform: \"google_meet\", meetingUrl: MEET_URL }),\n    service.requestJoin({ platform: \"google_meet\", meetingUrl: \"https://meet.google.com/abcdefghij\" }),\n  ]);\n\nCommand: `npx vitest run src/toctou-billing.repro.test.ts` (from plugins/plugin-meetings).\nObserved: `fulfilled: 2 live sessions: 2`; two \"[MeetingService] meeting join requested\" logs with two different sessionIds for the same nativeMeetingId `abc-defg-hij`; two transcript records created. Test assertion `expect(fulfilled).toHaveLength(1)` fails (got 2).\nExpected (matches the no-billing MJ-4 test at service.test.ts:139): exactly one fulfilled, one rejected with code `already_joined`, one live session, one bot launched.\nThe scratch test was removed after confirming the failure.\n```\n\n## Proposed fix\nMake the reservation truly synchronous with the duplicate check by inserting the session into `this.sessions` BEFORE the first await (before `await billing.reserveInitial()`), instead of at the current `this.sessions.set(sessionId, session)` that follows the billing await. Concretely: build the session record (or a minimal non-terminal reservation placeholder keyed by sessionId with the platform/nativeMeetingId and status \"requested\") and `this.sessions.set` it immediately after the dup-check in the same synchronous turn; then run `await billing.reserveInitial()` and the rest of setup against the already-claimed slot. Extend the existing rollback: if billing.reserveInitial (or later world/room/writer setup) throws, `this.sessions.delete(sessionId)` so the meeting stays joinable (mirrors the current catch that releases the reservation). Test plan (\u003e=10 lines): add a billing-enabled variant of the MJ-4 concurrency test asserting exactly one fulfilled join, one `already_joined` rejection, one live session, one adapter launch, and exactly one billing reserveInitial consumed; plus a test that a failing reserveInitial rolls the reservation back so a subsequent join of the same meeting succeeds (not permanently `already_joined`).\n\n## Evidence plan\nPR attaches the failing-before/passing-after billing concurrency test output (fulfilled count 2→1, live sessions 2→1) and the rollback test, run via `npx vitest run` in plugins/plugin-meetings, alongside the unchanged existing no-billing MJ-4 test to show no regression.\n\n## Duplicate search\ngh search issues --repo elizaOS/eliza --state all, queries: \"plugin-meetings TOCTOU\", \"meetings double bot\", \"meetings concurrent join billing\", \"MeetingService already_joined billing\", \"reserveInitial concurrent\", \"meetings billing\" — all empty. Checked our own swarm: `gh pr list --repo elizaOS/eliza --author agent-cortex --state open` and `gh issue list ... --author agent-cortex --state open`. The only meetings items are #30087/#30089 (\"in-flight throttled flush can clobber the finalized transcript back to recording\" — the transcript-writer lost-update, a different file/path). No open issue or PR covers the requestJoin billing TOCTOU / double-bot-launch.\n\n_Filed under a standing operator authorization for the autonomous audit pipeline, after local reproduction and duplicate search._\n\nAI provider/model: anthropic / claude-opus-4-8\nClient / agent tooling: pi-coding-agent\nContribution skill revision: elizaOS/eliza@d8c5b3124d97fac8189ad49afc14363ba56764f6:packages/skills/skills/contribute-to-eliza\nAttribution status: self-reported\n— [eliza-swarm]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-4-8\",\"client\":\"pi-coding-agent\",\"skill_revision\":\"elizaOS/eliza@d8c5b3124d97fac818 rgets. The critical defects include divergent core/shared runtime contracts, incompatible agent/shared config schemas, a second relationships graph schema that active consumers do not use, conflicting UI/runtime local-inference recommendations, Cloud-private MCP code, unsafe legacy-copy migration frameworks, and unmanaged native source copies.\n\nAffected callers include first-run and runtime configuration, relationship/entity storage, local model provisioning, Cloud MCP tools, LifeOps domain migrations, plugin view delivery, native HTTP/capture bridges, registry clients, gateway routing, and release/native build pipelines.\n\n## Scope\n\nImplement the complete duplicate-systems consolidation plan on one coordinated branch while preserving intentional provider, platform, storage-tenancy, auth-domain, generated, vendored, and compatibility boundaries.\n\nDependency order:\n\n1. Canonical ownership manifest and drift guards.\n2. Data-bearing graph and migration safety.\n3. Runtime contracts, config schemas, scheduling types, and local-inference policy.\n4. MCP, registry, gateway, API-host, retry, frontmatter, telemetry, native transport, and capture kernels.\n5. Provider/connector/native authoring contracts, media and voice client boundaries.\n6. Native/release provenance, shared configuration, assets, and compatibility cleanup.\n\n## Acceptance criteria\n\n- One executable owner for each consolidated behavior; old public paths are re-exports or generated adapters only.\n- No live relationship data is lost and no deleted legacy LifeOps data can be resurrected.\n- UI/runtime local model recommendations are identical for the same typed capability input.\n- Local and Cloud MCP hosts pass shared conformance fixtures.\n- Signed and dynamic plugin views have the same accessible, visual, and interaction contract.\n- Native transports and capture preserve exact binary, header, streaming, abort, permission, and error semantics.\n- Standalone and integrated native sources have nce. No unrelated parser rewrite.\n\nCorrect concrete misleading maintenance context: `params.ts` opens with @module/@description saying it only picks a single token, while it now owns complete user references, normalization and optional-reference semantics; `view-command-shortcut.ts` says the VIEWS callback owns the visible response while `views-show.ts` and current guide say post-tool model wording owns it. Review the short set of touched navigation/cache headers for stale ownership, migration stories and code narration. `provider-cache-plan.ts` cloud-affinity commentary should be reconciled in #17072 with the implementation already scheduled there, not reimplemented here.\n\nAcceptance: one executable owner for the selected view applicability decision; every migrated caller demonstrably uses it with parity for app text/app voice/audio-only/connector/relay cases; zero redundant helper remaining where equivalence was proven; preserved intentional differences documented concretely. No broad speculative rewriting, line-count quotas, generated/vendor edits or per-file coverage issues. Prompt/model data remains complete. Separate comment-only commits/PR diffs from code changes: comment-only work MUST pass `bun run check:comment-only` with unchanged token stream. Retain one concise responsibility header, caller-facing contract docs, and required error-policy rationale. Guide changes author CLAUDE.md then copy AGENTS.md byte-for-byte and run guide parity/link validation. Code changes run owning tests/typecheck/lint and root verify, plus actual behavior evidence and app audit where applicable. Do not claim whole-codebase cleanup complete after this tranche.\n\n\nCurrent overlap: open PR #30229 owns broad canonical-system consolidation; merged #30605 and #30560 already removed shared SQL/time and dormant duplicates. Read the current diff and coordinate the selected tranche with that lane, preserving its existing integration branch/PR policy. Do not redo completed removals or race concurrent shared-tree notification work.\n\nThe user's complete request remains the campaign goal: examine all maintained packages/plugins for duplicate executable owners, fragile unnecessary abstractions and obsolete compatibility code; consolidate only after caller/contract evidence, preserve intentional platform/provider boundaries, and maintain useful headers throughout the maintained source inventory. Prioritize touched and load-bearing systems, then progress by domain with an explicit remaining ledger. A four-day tranche is not whole-codebase completion. Comments should state responsibility, consumers/dependencies, invariants and non-obvious reasons; remove change notes and narration, preserve licenses/generated sources and required error-policy rationale.\n\nProject 19 Sprint 3 (October 3–16, 2026): scope candidate, not a capacity-committed completion date. Planning estimate: **4 person-days** for this slice. Preserve existing ownership; @NubsCarson is the sprint integration lead. Full scope exceeds two-person sprint capacity; sequencing and remaining policy decisions are in the project README.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n## Current-source audit and implementation plan — 2026-09-06\n\nAudited develop snapshot: `8fea4f94c29c7712ce3caf303e3350150622d048`. This issue remains the whole-repository consolidation campaign; the Project 19 four-day tranche is a narrow caller/helper/header cleanup after #30690, not completion of the campaign.\n\n### Live coordination and already-delivered work\n\n- [PR #30229](https://github.com/elizaOS/eliza/pull/30229) remains OPEN on `fix/duplicate-systems-consolidation`, head `48b28e7afa2fa54dcde72beed4030328aead3e3c` at this inspection. Its current hosted Source static smoke and All Tests Passed checks are failed; the displayed billing/PostgreSQL/Windows checks pass. The older comment describing candidate `d8ded5b` and green checks is historical and must not certify this different head. Re-fetch before any coordinated branch change.\n- PRs [#30605](https://github.com/elizaOS/eliza/pull/30605) and [#30560](https://github.com/elizaOS/eliza/pull/30560) are merged. Do not redo shared SQL/time extraction or dormant duplicate removal. #30229's paginated file list includes Calendar and Notes-related work; preserve its integration policy and compare exact overlapping hunks/exports before migration.\n- #30690 explicitly owns the behavioral presentation-capability decision. This tranche must consume its landed contract and remove superseded callers, not implement another decision owner concurrently. #23111/#30682 remain the contextual/exact navigation owners and #17072 owns provider-cache affinity commentary alongside its behavior.\n\n### Concrete current source findings\n\n1. Presentation applicability is still split: [views.ts](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/actions/views.ts#L99-L205) has source-name/relay rules; exact and contextual evaluators check action registration; current-view provider can fetch renderer state; view-delivery reads realtime transport/client identity. They answer related but not identical questions. Consolidate eligibility while preserving distinct transport identity, authorization and domain-tool applicability.\n2. [readStringOpt](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/actions/views-show.ts#L130-L139) reads direct properties only. [readStringOption](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/params.ts#L134-L157) first selects a nested parameters object. These are not automatically equivalent when both direct and nested keys exist. The public VIEWS path already normalizes options before calling show; helper duplication alone does not prove a current normal-call bug. Test exported/direct callers and precedence before replacement.\n3. The params header says it only extracts a single token, but the module owns complete user-reference handling, option normalization and optional-reference sentinel semantics. `readOptionalRefOption` deliberately treats absent strings differently from literal setting/search values. Preserve this distinction; a blanket normalization rewrite would change legitimate `none` values.\n4. The shortcut header says the VIEWS callback owns the visible response, while [current-view's responsibility header](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/providers/current-view.ts#L1-L6) and show-result behavior identify post-tool evaluation/model wording. Reconcile comments against actual continuation behavior, not a preferred architecture description.\n5. Current source comments in view-target resolution still describe compatibility intent around a simple-calendar destination. Treat this as a caller/registration question to verify, not permission to remove published aliases by string search. Current CalendarView's public export now mounts CalendarPage/CalendarSection, and an intentional compact projection still exists.\n\n### Ordered four-day tranche\n\n1. **Freeze ownership and exact overlap.** Read #30229's live head/base, owner disposition and full diff plus #30690/#23111/#30682 implementation state. Build a small table of selected behavior, executable owner, public callers, intentional platform/transport adapters and needed migration. Reuse the coordinated branch/PR policy; do not create a competing broad consolidation writer or silently absorb shared-tree changes.\n2. **Wait for/consume the typed presentation owner.** Once #30690's behavior and real boundary evidence land, route action validation/execution, exact shortcut, contextual selection and current-view provider through its decision. Keep `view-delivery` identity extraction as an adapter where it serves a different purpose. Remove old predicates only after every production caller has migrated. A common helper that callers can bypass does not satisfy one owner.\n3. **Prove option-reader equivalence through actual calls.** Exercise show/open with direct arguments, nested parameters, both present with conflicting values, empty/whitespace/non-string values, subview/section aliases and literal `none`/`null` search/setting inputs. Trace the normalization performed by the main action and any public runViewsShow consumers. Reuse readStringOption only where the desired precedence is equivalent; otherwise make the intentional adapter contract explicit rather than changing behavior under a cleanup label.\n4. **Remove obsolete implementations narrowly.** Delete superseded decision/helper code and migrate imports/exports/tests after consumer proof. Preserve provider, native platform, storage-tenancy, auth-domain and compatibility boundaries. Do not reopen the rejected static heuristic operation ledger or add per-file coverage issues. New tests should exercise real dispatch and results, not count helpers or check that an import exists.\n5. **Reconcile touched documentation independently.** Write one concise responsibility header covering real consumers/invariants, remove incident/change-story narration where unnecessary, retain caller JSDoc, licenses and required error-policy rationale. Keep comment-only changes in independently reviewable commits/diffs and run `bun run check:comment-only` against the correct comparison base. Guide edits must author CLAUDE.md, copy identical AGENTS.md and pass parity/link validation. Do not blanket-edit generated/vendor/native copies.\n6. **Verify and integrate on the live candidate.** Run plugin-app-control/shared/core and affected UI tests/typecheck/lint plus root verify. Prove app text, app voice with attached screen, audio-only, connector, unknown source and sub-agent relay behavior; include disconnect/cancel and ownership changes. Preserve complete prompt/action/model content. UI behavior changes require app audit, inspected desktop/mobile capture and relevant live voice/connector evidence. Re-fetch #30229 refs before integration and resolve actual conflicts with the owner; old-head evidence cannot certify the new candidate.\n\n### Whole-campaign continuation and acceptance\n\n- Maintain an explicit remaining domain ledger for persistence/graph migrations, runtime/config/scheduling/local-inference policy, MCP/registry/gateway/transport/capture, provider/native authoring boundaries, release provenance and maintained headers. Each entry needs a current duplicate executable owner, affected caller, intentional boundaries, acceptance and estimate. Do not revive historical defects that merged work already removed.\n- Data-bearing consolidation requires real migration/restart/deletion readbacks, not just re-exports. Transport/native consolidation requires exact bytes/headers/stream/abort/error conformance on the supported targets; local fixture evidence is not deployed/device proof. Route source-only cleanup and visual redesign to their appropriate existing owners.\n- After the coordinated implementation stabilizes, review all open PRs against its actual head/base for path and contract overlap; record conflict disposition and migrate only authorized branches. A mergeable status alone is not a semantic conflict review.\n- The tranche is complete when all selected callers use one verified owner, option behavior is preserved, redundant code is removed where equivalence was demonstrated, comments match actual contracts, and exact-head gates/evidence pass. #30125 stays open while the remaining campaign or required branch coordination remains. No code, publication, build or live test was performed during this audit.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent adversarial review — consolidation tranche\n\nSource `b676280384b15df54204276e34bb8740db26936f`. Live issue and #30229 re-read. #30229 remains open at48b28e7afa2fa54dcde72beed4030328aead3e3c; API now reports mergeable=false and basef567055f1c3656590369e6f9c416c253a773f283. That confirms an integration blocker, not its exact conflict resolution; this audit did not rewrite its branch.\n\n### P2 — Reproduced non-idempotent normalization makes the proposed helper swap behavior-changing\n\nThe old plan correctly flags precedence, but the actual caller adds a second-normalization hazard. [VIEWS handler](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-app-control/src/actions/views.ts#L2962) first normalizes options, then [passes actionOptions to runViewsShow](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-app-control/src/actions/views.ts#L3084). Show currently reads its direct fields. Replacing that reader with readStringOption invokes normalizeActionOptions again. [Normalizer](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-app-control/src/params.ts#L129) is not idempotent for nested parameters objects.\n\nA safe Bun1.3.14 probe extracted and transpiled the actual normalizer and readStringOption functions from source (no runtime/UI call): input `{parameters:{view:\"notes\",parameters:{view:\"calendar\"}}}` normalizes once to a direct notes target; the existing direct reader returns notes, the proposed shared reader returns calendar. Output also proves normalize(normalize(x)) differs from normalize(x). The saved script/stdout are in the local deep-review packet. This is a reproduced helper contract, not a claim an ordinary valid UI input already fails.\n\nAmendment: distinguish raw HandlerOptions from already-normalized action parameters at the type/boundary level. Normalize exactly once; share a direct typed value reader after that boundary. Explicitly reject unsupported nested envelopes or preserve the existing precedence via a compatibility adapter. Do not make normalization recursively peel arbitrary objects: capability payloads may legitimately contain a parameters field. Test the real public handler with conflicting two-level envelopes and direct exported show calls, asserting the selected view and its downstream dispatch, not just helper output.\n\nFor the real-handler regression, use neutral user text, an explicit show operation and registered notes/calendar targets. A message such as “open notes” can trigger the existing later deterministic intent override in `views-show.ts` and mask the normalization difference; exercise that override separately.\n\n### P2 — Preserve build-time versus runtime configuration authority during deduplication\n\nThe renderer [build-variant accessor](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/build-variant.ts#L1) reads a Vite define; [app-core accessor](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/app-core/src/runtime/build-variant.ts#L1) already re-exports core's runtime owner. These are intentionally different adapters despite identical store/direct names. Removing the renderer adapter or replacing it with a process.env import would change the signed bundle's distribution decision and can affect #30693 update authority. This is a concrete counterexample to blanket duplicate removal, not a current bug.\n\nAmendment: share pure value validation/types only where dependency direction permits; keep configuration acquisition at its platform owner. Test production renderer and Node/runtime packaging with explicit store/direct inputs and absent/invalid inputs; inspect emitted bundle dependency graph for browser imports of Node-only code. Link the precise adapter inventory to #30693 rather than moving updater authority into a generic convenience module.\n\n### Tranche acceptance refinement\n\nSeparate behavior-preserving cleanup from deliberate malformed-input rejection and from #30690 eligibility changes. Each requires its own acceptance evidence. The existing full campaign is broader than four days; do not claim unrelated persistence/transport domains are consolidated after this helper slice. Current PR mergeability failure needs owner-led rebase/conflict review against fetched develop and renewed tests; source equivalence at this audit SHA does not certify the moving PR.\n\nNo repository edits, install, UI run or PR mutation occurred. Only the isolated source-function probe executed.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n"])</script><script>self.__next_f.push([1,"17:T54c,## Defect\n\nA saved `ELIZAOS_CLOUD_LARGE_MODEL` override can outlive the model at the Cloud provider. Startup currently proves only that a text handler is registered and that the Cloud API/key are reachable; it does not prove that the selected small/large model ids can produce a response. `/api/status` therefore reports `canRespond: true` while real chat fails.\n\n## Live evidence\n\nOn a self-hosted remote agent, `TEXT_LARGE` was pinned to a stale model id. Startup reported running/connected/canRespond, but the first user turn exhausted warming retries and `/chat/completions` returned 404 `Not Found`. Removing only the stale override restored the current `gemma-4-31b` default and real chat plus `CALENDAR_CREATE_EVENT` succeeded.\n\n## Acceptance criteria\n\n- Startup/readiness validates the effective configured TEXT_SMALL and TEXT_LARGE model ids against the provider catalog or a bounded non-billable capability probe.\n- A missing configured model is surfaced with a typed, actionable error naming the config key/model and does not report healthy `canRespond`.\n- Transient provider/catalog warming remains retryable and is not treated as permanent model removal.\n- The UI distinguishes invalid model configuration from general provider outage.\n- Tests cover stale configured override, valid configured override, provider warming, and default fallback.18:T49bf,"])</script><script>self.__next_f.push([1,"## Summary\n\nThis PR consolidates the independently executable duplicate systems identified by the repository-wide audit in #30125. It establishes one executable owner for each migrated behavior, leaves host/platform policy in thin adapters, adds parity or provenance checks around compatibility paths, and preserves the boundaries that are intentionally separate (providers, connectors, auth domains, storage tenancy, platform I/O, generated output, and vendored code).\n\nThe highest-risk changes are deliberately structured around canonical kernels rather than broad package mergers:\n\n- runtime/config contracts now execute from `@elizaos/core`, with stable `@elizaos/shared` paths acting as compatibility facades;\n- dependency-light config input validation lives in shared, while agent-only defaults are applied in an explicit materialization step;\n- LifeOps carve-outs use durable receipts so deleted data is not silently resurrected;\n- UI and runtime local-inference selection use the same typed recommendation policy;\n- Cloud/local MCP, registry, gateway routing, retry timing, frontmatter, native HTTP, screen capture, host routes, training staging, and quantization now share inward kernels with target-specific adapters;\n- data-bearing or native-source duplicates that cannot be deleted safely without live or ABI evidence are guarded and surfaced rather than silently discarded.\n\nCloses #30125.\n\n## Canonical ownership and audit-family mapping\n\n| Audit family | Canonical owner | Adapters / compatibility paths | Contract evidence in this change |\n| --- | --- | --- | --- |\n| **C1 — runtime/config contracts** | `packages/core/src/contracts/{service-routing,first-run-options,cloud-topology,wallet}.ts` and `packages/core/src/runtime-env.ts` | Existing shared subpaths re-export the core implementations; consumers keep stable imports while executing one implementation | core/shared parity coverage plus broad core, shared, app-core, agent, UI, scenario, and example lanes |\n| **C2 — config schemas/defaults** | `packages/shared/src/config/zod-schema.core.ts` owns dependency-light input schemas | `packages/agent/src/config/zod-schema.core.ts` reuses shared schemas and applies runtime defaults via `materializeRuntimeModelDefinition` | shared schema corpus and agent config/first-run coverage |\n| **C3 — relationship graph** | Agent `KnowledgeGraphService` and `app_lifeops.life_entities` / `life_relationships_v2` remain canonical | `plugin-relationships` stops treating the retired `app_relationships` schema as an active second owner and adds a read-only `LegacyRelationshipsSchemaAuditService` | `plugins/plugin-relationships/test/legacy-schema-audit.test.ts`; live non-empty installations remain a migration gate, described below |\n| **C4 — local inference policy** | `packages/shared/src/local-inference/recommendation.ts` | UI and `plugin-local-inference` project host-specific capabilities/manifests into the shared policy; filesystem/download work remains in the plugin | UI/runtime parity matrix, plugin-local-inference package coverage, shared tests |\n| **C5 — copied native sources** | Standalone/native and integrated-fork ownership is declared in `plugins/plugin-local-inference/native/copied-source-ownership.json` | Integrated copies remain build inputs only where the ownership manifest permits them | `native-source-provenance.test.ts` verifies declared paths and hashes; ABI/device proof remains an explicit merge gate |\n| **H1 — MCP fork** | `packages/shared/src/mcp/**` owns the edge-safe protocol/schema/naming/provider/resource kernel | `plugin-mcp` retains Node transports and `call_tool`; Cloud retains OAuth and visibility policy but imports the shared kernel | shared facade/schema conformance plus local MCP action/tool-compatibility tests and Cloud MCP tests |\n| **H2 — carve-out migrations** | `plugins/plugin-sql/src/carve-out-migration.ts` owns lease, durable receipt, retry, and completion semantics | calendar, finances, goals, inbox, reminders, and scheduling retain domain columns, repairs, and copy callbacks | orchestrator concurrency/failure tests plus each domain migration suite |\n| **H3 — scheduling type fork** | `@elizaos/plugin-scheduling` `ScheduledTaskInput` | personal-assistant consumers now import the canonical type; `wave1-types.ts` is removed | PA first-run/spine/simulation coverage and scheduling package tests |\n| **H4 — plugin page composition** | Each plugin `*Page.tsx` is the component owner; `packages/ui/src/components/pages/PluginPageFrame.tsx` owns shared page chrome | signed registration and dynamic view bundles point at the same page exports; Contacts, Messages, Phone, Calendar, Cloud, Maps, and related pages use the shared frame | page/bundle tests plus app audit; store-build remote-JS prohibition is unchanged |\n| **H5 — native HTTP codec** | `packages/ui/src/api/native-http-codec.ts` owns base64 byte decoding, bodyless-status handling, response construction, and request classification | Android, iOS, desktop/Electrobun, native Cloud, and app-core iOS retain only IPC/routing/lifecycle policy | native codec binary/status/path tests and affected transport tests |\n| **H6 — screen capture protocol** | `packages/shared/src/contracts/screen-capture.ts` owns the request/image format contract | renderer and `plugin-vision` use the shared schema while retaining native capture versus agent queue responsibilities | shared normalization plus renderer and vision queue/frame correlation tests |\n| **H7 — gateway routing** | `packages/cloud/services/_common/src/hash-router.ts` owns EndpointSlice discovery, ring refresh, stale eviction, and target selection | Discord and webhook gateways inject HashRing construction, service credentials, and their logger | deterministic common hash-router tests plus both gateway adapter lanes |\n| **H8 — retries/deadlines** | `_common/src/retry.ts`, `_common/src/response-attempts.ts`, and `packages/shared/src/utils/deadline.ts` own retry timing, `Retry-After`, abort/deadline composition, and attempt lifecycle | provider HTTP, proxy fetch, provisioning, and connector paths retain named replay/status/auth policy | deterministic retry/response-attempt/deadline tests, including abort and unsafe replay boundaries |\n| **H9 — registry/marketplace** | `packages/registry/src/runtime-kernel.ts` owns wire decoding, normalized entries, cache freshness, search policy, and scoring | agent keeps filesystem/config/network adapters; core keeps install/clone facade | runtime-kernel tests plus agent/core registry suites |\n| **H10 — duplicate host controllers** | `packages/shared/src/host-use-cases.ts` owns background-task coalescing and shared pairing-code normalization | agent and app-core preserve auth, origin, rate-limit, persistence, and HTTP translation policy | shared use-case tests and `background-tasks-cross-host.test.ts` plus both host route suites |\n| **H11 — frontmatter** | `packages/core/src/markdown/frontmatter.ts` owns bounded YAML/frontmatter document parsing | skills, HookService, agent hook discovery, and skill-learning decode their domain metadata from the core result | adversarial core parser tests plus skills/hook discovery consumers |\n| **H12 — training/release pipelines** | `eliza1_staging_kernel.py` and `gguf_k_quant.py` own staging and K-quant mechanics | existing local/real staging commands and public quant wrapper filenames remain compatibility entrypoints with profile data only | staging-kernel tests, real-stager tests, and quant recipe smoke tests |\n\n## Additional consolidation and drift prevention\n\nThe same ownership rules are applied to medium-risk exact clones and meta-systems touched by the implementation:\n\n- AES-256-GCM token-at-rest behavior moves to the Node core utility, with finances/health compatibility exports and ciphertext/key-file/environment tests.\n- Integration observability becomes a shared event/span contract with agent/app-core policy adapters.\n- Voice settings share one UI controller while local/device and Cloud panels keep capability-specific rendering.\n- Real-runtime Vitest configuration, native Capacitor/Rollup scaffolding, template cleanup scripts, static assets, and nested workflow templates are generated or manifest-checked instead of hand-copied.\n- Cloud migration prefixes gain a total-order manifest and duplicate-prefix check without renaming historical migrations.\n- Provider and connector account plumbing gains authoring/conformance helpers while preserving provider/channel implementations.\n\n## Data migration, security, and compatibility\n\n### Relationships\n\nThis change does **not** guess that a retired data store is empty. The active graph remains `KnowledgeGraphService`; startup inventory reports whether legacy `app_relationships` tables exist and whether they contain rows. Empty legacy tables may be retired safely. A non-empty inventory is a hard migration decision: rows must be imported with identity, redirect, merge, and evidence preservation before the old schema can be dropped. No destructive DDL is introduced here.\n\n### LifeOps carve-outs\n\nThe common migration runner writes a durable `app_eliza_migrations.carve_out_receipts` record keyed by domain migration. It uses a holder token and recoverable lease, marks completion only after the domain callback succeeds, and releases its own lease on failure. Completed receipts prevent a later empty target table from being interpreted as “never migrated,” which is the stale-source resurrection failure this work is intended to close. Domain callbacks remain responsible for explicit columns, validation, repairs, and sensitive-field scrubbing.\n\n### Secrets and untrusted boundaries\n\n- Token encryption preserves the existing AES-256-GCM ciphertext and key discovery contract; adapters do not log plaintext, keys, or provider payloads.\n- MCP schemas and model-produced JSON are budgeted and validated in an isolated boundary; Cloud OAuth/tool visibility and local transport authorization remain host policies.\n- Registry URLs/wire records are normalized before use; registry cache fallback remains explicit rather than fabricating healthy data.\n- Native HTTP and capture contracts validate/normalize crossing data while preserving exact bytes, bodyless statuses, timestamps, dimensions, and formats.\n- Gateway discovery retains bounded stale-ring behavior and authenticated Kubernetes discovery; connector identity/auth and forwarded-host policy stay outside the generic hash kernel.\n- Retry code centralizes timing and disposal mechanics without granting replay permission to unsafe non-idempotent requests.\n\n## Rollback plan\n\nRollback is by ownership family, not by deleting user data:\n\n1. Revert an adapter to its prior implementation while leaving new shared kernels present; stable import paths and public wrappers are preserved for this purpose.\n2. Do not delete durable carve-out receipts during rollback. Their presence is the safety record that prevents stale legacy rows from being re-imported.\n3. Do not drop `app_relationships` on rollback or deployment. If the inventory reports rows, stop and run an evidence-preserving migration before any retirement change.\n4. Native integrated copies and public training wrapper commands remain available, so provenance/kernel adoption can be reverted without changing artifact names or ABI inputs.\n5. Cloud gateway/retry/MCP rollbacks retain connector-specific auth, OAuth, identity, and routing policy in the host adapters; no credential or tenancy migration is required.\n\n## Validation\n\nFinal implementation certificate: `8d941b808e46575cad0d2581d85b2e597b0fec23`, rebased on `origin/develop` `6c957b412dad0bd49659201dafd43c719aea2a0c` with verified ancestry and a clean worktree. Hosted gitleaks then identified three synthetic migration receipt fixtures; the repository-standard line-scoped allow annotations produced final PR head `cbafeb1a48807da2a6a7969d7324e61eebdcf10a`, which passes the exact hosted gitleaks command and the affected 4/4 test.\n\n- Root `lint`: **141/141** tasks.\n- Root `typecheck`: **233/233** tasks.\n- Root `build`: **132/132** tasks; view-bundle guard **22/22**.\n- Root `verify`: **376/376** tasks; focused/skipped audit scanned **11,316** test files with **0 focused** and **0 orphaned skips**.\n- Repository executable script tests: green.\n- App visual audit: **223/223** captures, **0 broken**, **0 needs-work**; OCR **208 verified / 12 needs-eye / 0 broken**.\n- App-core: **4,500 pass / 23 skip**, plus **74** Node-script and **24** Bun-script tests.\n- Agent: **757/757**.\n- Cloud Shared authoritative matrix: **327/327** batches; **11,898 pass / 163 skip / 0 fail**.\n- Orchestrator: **3,114 pass / 11 explicitly gated live skips**; live Cerebras coverage now requires the repository-wide explicit live-test opt-in.\n- Wallet: **418 pass / 1 live skip**, with zero unhandled LI.FI background requests.\n- Remaining non-cloud official package runner: the pre-wallet segment reached **99** package commands green; wallet passed after repair; the final **8/8** packages passed with **991 executed / 14 skipped**.\n- Focused readiness regression ran green three consecutive times; package-level scheduling, relationships, MCP, local inference, registry, native transport, Cloud gateway/retry, training, and generated-system-file suites are included in the package and root results above.\n\nOne monolithic local root test attempt encountered a Vitest worker-start timeout after app-core had completed 362 files; the same current content then passed the full app-core lane and the remaining official package graph in isolated exact-content segments. No assertion failure was waived.\n\n## Required before merge: hosted proof\n\n- Run hosted CI to terminal green for the exact current PR head, including Cloud and native/build lanes required by the repository rules.\n- If develop advances before merge, update the branch and repeat the affected exact-head certificate rather than merging stale evidence.\n- Re-run `packages/app` audit on the exact head and inspect affected desktop/mobile captures, rest/hover states, console/network output, and required evidence bundle.\n- For Cloud behavior, deploy/read back the exact SHA and exercise real MCP, gateway discovery/routing, retry/auth-refresh, registry, and host-route paths.\n- For native behavior, build/install the exact SHA and verify binary bodies, repeated headers, 204/304, streaming, abort/timeout, capture permissions, JPEG/PNG, cleanup, and the integrated native graph.\n- For native-source governance, add/attach ABI symbol comparison, scalar/SIMD and architecture-dispatch parity, and a real integrated-fork smoke from the exact built revision.\n- For relationships, attach a PGlite/PostgreSQL inventory result. If any legacy rows exist, migration and round-trip evidence are required before schema retirement.\n- Merge only after independent review and all required current-head checks are terminal and green.\n\n## Findings that still need explicit implementation/evidence confirmation\n\nThe current diff contains clear implementation evidence for every critical/high family at the kernel or guard level, but the following audit acceptance points are **not yet proven by the diff alone** and must remain visible in review:\n\n- **C3:** there is an inventory/guard, but no generic migration can safely be implemented until real installations establish whether `app_relationships` contains data and how identities map.\n- **C5:** the ownership manifest and hash/provenance test prevent silent drift, but no diff-only evidence proves ABI symbol parity, scalar/SIMD parity, architecture dispatch, or the exact integrated graph on supported hardware.\n- **H4:** shared page exports/frame consolidation is visible, but a single generated `defineAppView` descriptor and a signed-vs-dynamic mount conformance harness are not obvious as standalone artifacts; reviewers should confirm the existing bundle/page tests cover both delivery modes.\n- **H6:** the agent/renderer wire contract is unified, but the audit also called for common camera/display recorder and cleanup utilities; no complete cross-native media-recorder extraction is obvious in this diff.\n- **H7:** the hash-ring discovery/cache kernel is consolidated. A full shared resolve/wake/forward attempt kernel across gateway servers is not obvious; connector-specific orchestration still needs review against the issue acceptance criteria.\n- **H8:** shared retry/deadline primitives and several migrated callers are visible, but repository-wide replacement of every plugin-specific retry loop is neither evident nor desirable without named-policy review. Confirm the intended scope is mechanism convergence, not one universal policy.\n- **H10:** background-task coalescing and pairing normalization are shared. A complete transport-neutral first-run transaction/use case is not obvious in the current diff; host-specific first-run behavior should be checked before claiming that subfamily fully consolidated.\n- **H12:** staging and quantization kernels/wrappers are present; release artifact inspection with real converter/quantizer binaries remains external evidence.\n\nThese are merge gates or intentionally evidence-driven follow-ups, not permission to fabricate success or delete compatibility/data paths.\n\n## Post-open-PR follow-up phase\n\nAfter this PR is opened and has a stable head:\n\n1. Query every open PR targeting `develop` and classify overlap with the canonical owners above.\n2. Post a concise blocking note on PRs that edit a retired implementation or reintroduce a fork, linking to this PR and naming the canonical import/path.\n3. Rebase/update affected branches where repository permissions and ownership allow; otherwise leave exact conflict guidance for their authors.\n4. Re-run the overlap query after updates so moving-head PRs are not missed.\n5. Track any intentionally deferred hardware, deployed-Cloud, or live-data proof as explicit acceptance evidence tied to this PR; do not silently convert it into an unowned TODO.\n\n## Reviewer guide\n\nReview by ownership boundary rather than file count:\n\n1. Data safety: relationship inventory and carve-out receipts.\n2. Public contracts: core/shared facades, shared schema plus agent materialization, scheduling inputs.\n3. User-visible parity: local inference, plugin pages, voice controls.\n4. Edge/Cloud kernels: MCP, registry, retry/deadline, gateway routing, host routes.\n5. Native protocols: HTTP bytes/statuses and capture request/result semantics.\n6. Provenance/meta-systems: native source ownership, training wrappers, generated configs/assets/workflows, migration ordering.\n\nThe intended end state is one executable owner per behavior, with compatibility paths reduced to re-exports, generated artifacts, or thin policy adapters—and with no destructive data or source deletion ahead of the evidence needed to make it safe.\n"])</script><script>self.__next_f.push([1,"19:T433,Closes #30123\n\n## Summary\n- adds owner-private parenting-agreement knowledge, reviewed citations, chat/agent pins, and bounded guest projections\n- adds Eliza-first family calendar plus Google synchronization and approval-oriented family workflows\n- adds Concord school-calendar hash/idempotency workflow, monthly coordination packets, and secure calendar cards for iMessage/Telegram/Discord\n- repairs pairing, Bun-only startup, and fused local-inference installation paths needed by the Bettina deployment\n\n## Verification\nThe feature stack passed its focused package suites and the full 375/375 repository verification gate before this latest clean rebase. Hosted checks on this PR must establish current-head evidence before merge.\n\n## Known current-head review item\nThe agreement upload currently retains the earlier bounded whole-PDF JSON path. Per owner feedback, 6732ac9c768aa00f3ffae46241848\"\u003e\u003ccode\u003ee2fc036\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11157\"\u003e#11157\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/no-unused-variables/\"\u003e\u003ccode\u003enoUnusedVariables\u003c/code\u003e\u003c/a\u003e no longer reports Vue \u003ccode\u003e\u0026lt;script setup\u0026gt;\u003c/code\u003e bindings used by CSS \u003ccode\u003ev-bind()\u003c/code\u003e as unused.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11398\"\u003e#11398\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/afc4615079a72e0810f06186f78e5cb177a5638e\"\u003e\u003ccode\u003eafc4615\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11389\"\u003e#11389\u003c/a\u003e: Files passed through \u003ccode\u003e--stdin-file-path\u003c/code\u003e now use full HTML support for Astro, Svelte, and Vue when it is enabled.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11526\"\u003e#11526\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/372cd68ba156efdc497017598a49e21484a3ada9\"\u003e\u003ccode\u003e372cd68\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://biomejs.dev/linter/rules/no-vue-ref-as-operand/\"\u003e\u003ccode\u003enoVueRefAsOperand\u003c/code\u003e\u003c/a\u003e to track Vue refs through declaration aliases and \u003ccode\u003etoRefs()\u003c/code\u003e properties, and to recognize \u003ccode\u003euseTemplateRef()\u003c/code\u003e results. The rule no longer reports false positives such as plain ref transfers, plain \u003ccode\u003etoRefs()\u003c/code\u003e property access, \u003ccode\u003edefineModel()\u003c/code\u003e modifiers, or the supported \u003ccode\u003e.effect\u003c/code\u003e member as operands.\u003c/p\u003e\n\u003cp\u003eThe refactor enabling these fixes also improves the performance of the rule.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11458\"\u003e#11458\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/a7cd2868c3d98fbc75174c5bf69fdcfacbe87304\"\u003e\u003ccode\u003ea7cd286\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11436\"\u003e#11436\u003c/a\u003e: GritQL snippets such as \u003ccode\u003eexport { $specifiers } from $source\u003c/code\u003e now match named re-exports with aliases, inline \u003ccode\u003etype\u003c/code\u003e modifiers, and multiple specifiers.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11515\"\u003e#11515\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/382b15d5e0f9e2a75604fec1f15ad342628c99c7\"\u003e\u003ccode\u003e382b15d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11390\"\u003e#11390\u003c/a\u003e, where \u003ccode\u003enoFloatingPromises\u003c/code\u003e performed expensive full type inference for calls to non-Promise methods declared on third-party TypeScript classes. The rule now classifies those calls using targeted type information.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11516\"\u003e#11516\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/6f40e8224afc58737626d997c0ea779e2b37baca\"\u003e\u003ccode\u003e6f40e82\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/levrik\"\u003e\u003ccode\u003e@​levrik\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://biomejs.dev/linter/rules/no-vue-ref-as-operand/\"\u003e\u003ccode\u003enoVueRefAsOperand\u003c/code\u003e\u003c/a\u003e so it no longer reports a callback parameter (e.g. from \u003ccode\u003e.find()\u003c/code\u003e, \u003ccode\u003e.map()\u003c/code\u003e) as an unwrapped ref value just because it's nested inside a \u003ccode\u003eref()\u003c/code\u003e, \u003ccode\u003ecomputed()\u003c/code\u003e, or similar call.\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003econst result = computed(() =\u0026gt; list.find((item) =\u0026gt; item.label === \u0026quot;a\u0026quot;));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePreviously, \u003ccode\u003eitem\u003c/code\u003e here was incorrectly treated as a ref value because the rule attributed it to the outer \u003ccode\u003ecomputed()\u003c/code\u003e call.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11495\"\u003e#11495\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/496268d1470b6a4cd52bff03d37899c4bb7f77ab\"\u003e\u003ccode\u003e496268d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Netail\"\u003e\u003ccode\u003e@​Netail\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://biomejs.dev/linter/rules/use-graphql-naming-convention/\"\u003e\u003ccode\u003euseGraphqlNamingConvention\u003c/code\u003e\u003c/a\u003e so it no longer reports GraphQL enum value definitions with comments \u0026amp; descriptions and now displays a more accurate diagnostic range.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11407\"\u003e#11407\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/6ef52b02fc07e23de7ad498d853aaf2c825717fd\"\u003e\u003ccode\u003e6ef52b0\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/1678092075\"\u003e\u003ccode\u003e@​1678092075\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11214\"\u003e#11214\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/no-unused-variables/\"\u003e\u003ccode\u003enoUnusedVariables\u003c/code\u003e\u003c/a\u003e no longer reports type parameters declared by non-default function overload signatures that have an implementation.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11322\"\u003e#11322\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/5c353e6c85a40807e2710684da807f8757ee650c\"\u003e\u003ccode\u003e5c353e6\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/jp-knj\"\u003e\u003ccode\u003e@​jp-knj\u003c/code\u003e\u003c/a\u003e! - Added a new nursery rule \u003ccode\u003enoAstroSetHtmlDirective\u003c/code\u003e, which disallows Astro's \u003ccode\u003eset:html\u003c/code\u003e directive because untrusted content can introduce cross-site scripting vulnerabilities.\u003c/p\u003e\n\u003cp\u003eFor example, the following snippet triggers the rule:\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;div set:html={content} /\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/biomejs/biome/blob/main/packages/@biomejs/biome/CHANGELOG.md\"\u003e@​biomejs/biome's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.5.11\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11499\"\u003e#11499\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/9743d0ceae807757300e5b0ec66266125bc664c1\"\u003e\u003ccode\u003e9743d0c\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/scs0209\"\u003e\u003ccode\u003e@​scs0209\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11496\"\u003e#11496\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/use-valid-anchor/\"\u003e\u003ccode\u003euseValidAnchor\u003c/code\u003e\u003c/a\u003e now treats Astro JSX shorthand attributes like \u003ccode\u003e\u0026lt;a {href}\u0026gt;\u003c/code\u003e as a valid \u003ccode\u003ehref\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11437\"\u003e#11437\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/88f805e19b67ab4c876e4fc4a8b4018bd03df20b\"\u003e\u003ccode\u003e88f805e\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/9944\"\u003e#9944\u003c/a\u003e: adjacent elements inside an Astro expression now parse as an implicit fragment instead of raising an error.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{options.map(() =\u0026gt;\n  \u0026lt;div /\u0026gt;\n  \u0026lt;div /\u0026gt;\n)}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11437\"\u003e#11437\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/88f805e19b67ab4c876e4fc4a8b4018bd03df20b\"\u003e\u003ccode\u003e88f805e\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro templates rejecting unclosed HTML void elements, such as \u003ccode\u003e{cond \u0026amp;\u0026amp; \u0026lt;br\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11507\"\u003e#11507\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/e2fc03669886732ac9c768aa00f3ffae46241848\"\u003e\u003ccode\u003ee2fc036\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11157\"\u003e#11157\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/no-unused-variables/\"\u003e\u003ccode\u003enoUnusedVariables\u003c/code\u003e\u003c/a\u003e no longer reports Vue \u003ccode\u003e\u0026lt;script setup\u0026gt;\u003c/code\u003e bindings used by CSS \u003ccode\u003ev-bind()\u003c/code\u003e as unused.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11398\"\u003e#11398\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/afc4615079a72e0810f06186f78e5cb177a5638e\"\u003e\u003ccode\u003eafc4615\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11389\"\u003e#11389\u003c/a\u003e: Files passed through \u003ccode\u003e--stdin-file-path\u003c/code\u003e now use full HTML support for Astro, Svelte, and Vue when it is enabled.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11526\"\u003e#11526\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/372cd68ba156efdc497017598a49e21484a3ada9\"\u003e\u003ccode\u003e372cd68\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://biomejs.dev/linter/rules/no-vue-ref-as-operand/\"\u003e\u003ccode\u003enoVueRefAsOperand\u003c/code\u003e\u003c/a\u003e to track Vue refs through declaration aliases and \u003ccode\u003etoRefs()\u003c/code\u003e properties, and to recognize \u003ccode\u003euseTemplateRef()\u003c/code\u003e results. The rule no longer reports false positives such as plain ref transfers, plain \u003ccode\u003etoRefs()\u003c/code\u003e property access, \u003ccode\u003edefineModel()\u003c/code\u003e modifiers, or the supported \u003ccode\u003e.effect\u003c/code\u003e member as operands.\u003c/p\u003e\n\u003cp\u003eThe refactor enabling these fixes also improves the performance of the rule.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11458\"\u003e#11458\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/a7cd2868c3d98fbc75174c5bf69fdcfacbe87304\"\u003e\u003ccode\u003ea7cd286\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11436\"\u003e#11436\u003c/a\u003e: GritQL snippets such as \u003ccode\u003eexport { $specifiers } from $source\u003c/code\u003e now match named re-exports with aliases, inline \u003ccode\u003etype\u003c/code\u003e modifiers, and multiple specifiers.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11515\"\u003e#11515\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/382b15d5e0f9e2a75604fec1f15ad342628c99c7\"\u003e\u003ccode\u003e382b15d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11390\"\u003e#11390\u003c/a\u003e, where \u003ccode\u003enoFloatingPromises\u003c/code\u003e performed expensive full type inference for calls to non-Promise methods declared on third-party TypeScript classes. The rule now classifies those calls using targeted type information.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11516\"\u003e#11516\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/6f40e8224afc58737626d997c0ea779e2b37baca\"\u003e\u003ccode\u003e6f40e82\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/levrik\"\u003e\u003ccode\u003e@​levrik\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://biomejs.dev/linter/rules/no-vue-ref-as-operand/\"\u003e\u003ccode\u003enoVueRefAsOperand\u003c/code\u003e\u003c/a\u003e so it no longer reports a callback parameter (e.g. from \u003ccode\u003e.find()\u003c/code\u003e, \u003ccode\u003e.map()\u003c/code\u003e) as an unwrapped ref value just because it's nested inside a \u003ccode\u003eref()\u003c/code\u003e, \u003ccode\u003ecomputed()\u003c/code\u003e, or similar call.\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003econst result = computed(() =\u0026gt; list.find((item) =\u0026gt; item.label === \u0026quot;a\u0026quot;));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePreviously, \u003ccode\u003eitem\u003c/code\u003e here was incorrectly treated as a ref value because the rule attributed it to the outer \u003ccode\u003ecomputed()\u003c/code\u003e call.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11495\"\u003e#11495\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/496268d1470b6a4cd52bff03d37899c4bb7f77ab\"\u003e\u003ccode\u003e496268d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Netail\"\u003e\u003ccode\u003e@​Netail\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://biomejs.dev/linter/rules/use-graphql-naming-convention/\"\u003e\u003ccode\u003euseGraphqlNamingConvention\u003c/code\u003e\u003c/a\u003e so it no longer reports GraphQL enum value definitions with comments \u0026amp; descriptions and now displays a more accurate diagnostic range.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11407\"\u003e#11407\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/6ef52b02fc07e23de7ad498d853aaf2c825717fd\"\u003e\u003ccode\u003e6ef52b0\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/1678092075\"\u003e\u003ccode\u003e@​1678092075\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11214\"\u003e#11214\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/no-unused-variables/\"\u003e\u003ccode\u003enoUnusedVariables\u003c/code\u003e\u003c/a\u003e no longer reports type parameters declared by non-default function overload signatures that have an implementation.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11322\"\u003e#11322\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/5c353e6c85a40807e2710684da807f8757ee650c\"\u003e\u003ccode\u003e5c353e6\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/jp-knj\"\u003e\u003ccode\u003e@​jp-knj\u003c/code\u003e\u003c/a\u003e! - Added a new nursery rule \u003ccode\u003enoAstroSetHtmlDirective\u003c/code\u003e, which disallows Astro's \u003ccode\u003eset:html\u003c/code\u003e directive because untrusted content can introduce cross-site scripting vulnerabilities.\u003c/p\u003e\n\u003cp\u003eFor example, the following snippet triggers the rule:\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;div set:html={content} /\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11462\"\u003e#11462\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/18883b7dafb8f9581534508fdd5b1e34632f2724\"\u003e\u003ccode\u003e18883b7\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/10776\"\u003e#10776\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/use-vue-hyphenated-attributes/\"\u003e\u003ccode\u003euseVueHyphenatedAttributes\u003c/code\u003e\u003c/a\u003e no longer reports lowercase attribute names containing punctuation, such as \u003ccode\u003ept:header:data-test-id\u003c/code\u003e and \u003ccode\u003esome_attr\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/4d9c1d53ff57c44247e7a32718e1c69a0c1735af\"\u003e\u003ccode\u003e4d9c1d5\u003c/code\u003e\u003c/a\u003e ci: release (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11457\"\u003e#11457\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/18883b7dafb8f9581534508fdd5b1e34632f2724\"\u003e\u003ccode\u003e18883b7\u003c/code\u003e\u003c/a\u003e fix(html): ignore punctuation in Vue attribute casing (\u003ca href=\"https://github.com/biomejs/biome/tre \"\u003e#1468\u003c/a\u003e) (\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e20ce75f\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e\u003ccode\u003e20ce75f\u003c/code\u003e\u003c/a\u003e fix: Avoid act() re-entrant when dispatching events (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1468\"\u003e#1468\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/be9d81d91314c9f0bafaa363f70b409b4b31989c\"\u003e\u003ccode\u003ebe9d81d\u003c/code\u003e\u003c/a\u003e docs: fix typos in comments and types (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1446\"\u003e#1446\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/testing-library/react-testing-library/compare/v16.3.2...v16.3.3\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@types/bun` from 1.3.14 to 1.4.0\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/DefinitelyTyped/DefinitelyTyped/commits/HEAD/types/bun\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@vitejs/plugin-react` from 6.0.5 to 6.1.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/releases\"\u003e@​vitejs/plugin-react's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eplugin-react@6.1.1\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003eplugin-react@6.1.0\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/blob/main/packages/plugin-react/CHANGELOG.md\"\u003e@​vitejs/plugin-react's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.1.1 (2026-08-28)\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003e6.1.0 (2026-08-19)\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/04cac5020e349f452d76c5a4f6d788ad4b38930a\"\u003e\u003ccode\u003e04cac50\u003c/code\u003e\u003c/a\u003e release: plugin-react@6.1.1 (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1440\"\u003e#1440\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/82d35abe4946eddd4e6456802bf2b53444e264f2\"\u003e\u003ccode\u003e82d35ab\u003c/code\u003e\u003c/a\u003e fix(react): respect environment sourcemap option when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/397e8471a559f18a16dd21bd797ac01a369dabdc\"\u003e\u003ccode\u003e397e847\u003c/code\u003e\u003c/a\u003e fix(react): make logging diagnostics an opt-in for React Compiler (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1431\"\u003e#1431\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/61006e6f52124821c24121a78712f7162ae36f5b\"\u003e\u003ccode\u003e61006e6\u003c/code\u003e\u003c/a\u003e fix(deps): update all non-major dependencies (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1433\"\u003e#1433\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/e2a649cbaa7334d6991f843563683975667e1be1\"\u003e\u003ccode\u003ee2a649c\u003c/code\u003e\u003c/a\u003e chor e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro rejecting JavaScript comments between attributes.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;div /* block comment */ class=\u0026quot;something\u0026quot;\u0026gt;\u0026lt;/div\u0026gt;\n\u0026lt;Component /* c */ client:load /\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a bare \u003ccode\u003e\u0026lt;\u003c/code\u003e in Astro text being treated as the start of a tag, such as \u003ccode\u003e\u0026lt;p\u0026gt;5 \u0026lt; 6 and 7 \u0026gt; 6\u0026lt;/p\u0026gt;\u003c/code\u003e. As in HTML, a \u003ccode\u003e\u0026lt;\u003c/code\u003e that cannot open a tag is text and needs no escaping.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11438\"\u003e#11438\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/3133ffa9ae6beaa3c4464edac60de47d5c6f6426\"\u003e\u003ccode\u003e3133ffa\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/8294\"\u003e#8294\u003c/a\u003e: an Astro expression holding only a comment is no longer reported as a parse error, which also stopped the whole file from being formatted.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;div\u0026gt;{/* a note */}\u0026lt;/div\u0026gt;\n\u0026lt;div class={/* a note */}\u0026gt;x\u0026lt;/div\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/9165\"\u003e#9165\u003c/a\u003e: an empty Astro expression such as \u003ccode\u003e\u0026lt;div\u0026gt;{}\u0026lt;/div\u0026gt;\u003c/code\u003e no longer fails to parse. Astro renders \u003ccode\u003e{}\u003c/code\u003e as nothing.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro expressions containing a comment failing to parse.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;div\u0026gt;{/* block comment */ x}\u0026lt;/div\u0026gt;\n\u0026lt;div\u0026gt;{/* only a comment */}\u0026lt;/div\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Added support for Astro's fragment shorthand.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;\u0026gt;\n  \u0026lt;p\u0026gt;a\u0026lt;/p\u0026gt;\n\u0026lt;/\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed an Astro frontmatter block being cut short by a closing tag inside a string or comment.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e---\nconst a = \u0026quot;\u0026lt;/script\u0026gt;\u0026quot;;\n// \u0026lt;/script\u0026gt; in a comment\n---\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ccode\u003e---\u003c/code\u003e being read as an Astro frontmatter fence when markup precedes it. Astro only recognizes frontmatter at the very start of a file, so a file opening with a comment now has no frontmatter, and its \u003ccode\u003e---\u003c/code\u003e lines are content.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\
