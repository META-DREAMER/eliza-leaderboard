ts.\n- [x] Repairs two suites failing on `develop` right now.\n- [x] Changes no runtime source — the diff is two assertions.\n\n# Sync with develop\n\n- [x] Built on the current `origin/develop` tree; zero conflicts.\n- [x] Two files differ: `+7/-2` total.\n\n# Risks\n\nNone to runtime. No production file is touched, and the assertions become *stricter* in\nthe useful direction: they now pin the actionable `code` on the error callers actually\nreceive, rather than a wrapper that no longer exists.\n\n# Background\n\n## What is broken\n\n`@elizaos/plugin-anthropic` fails 3 of 143 on `develop`. Two share one cause:\n\n```\nFAIL native-plumbing.shape.test.ts \u003e rejects an output-limited completion instead of returning its text prefix\n  expected ElizaError: [anthropic] Model output did … to match object { cause: ObjectContaining{…} }\n\nFAIL image-description.shape.test.ts \u003e rejects a provider length stop instead of parsing the partial description\n  expected ElizaError: [anthropic] Model output did … to match object { Object (cause) }\n```\n\n## Root cause\n\n`assertModelOutputComplete` (`packages/core/src/utils/model-errors.ts:71`) throws a typed\n**origin** error — code on the error, no `cause`:\n\n```\nElizaError {\n  message: \"[anthropic] Model output did not complete successfully (length).\",\n  code: \"MODEL_OUTPUT_INCOMPLETE\",\n  context: { finishReason: \"length\", model: \"claude-test-small\", provider: \"anthropic\" },\n}\n```\n\nBoth call sites catch through `formatModelError` (`utils/retry.ts:151`), which returns a\ntyped error unchanged and wraps only untyped ones:\n\n```ts\nif (isElizaError(error)) {\n  return error;                              // passthrough — no cause\n}\n...\nreturn new Error(message, { cause: error }); // only untyped errors get a cause\n```\n\nSo `cause: { code: ... }` describes a wrapper that is gone. The behaviour is right —\ncallers get an actionable `code` plus full `context`, and declining to double-wrap an\nalready-typed domain error is correct.\n\n## Attribution\n\nThe passthrough came from **#28112** (`4333300926`, 2026-08-25). Verified by checking for\n`isElizaError(error)` inside `formatModelError` across the file's history:\n\n```\n2026-08-25 4333300926  present   \u003c-- added here\n2026-07-04 9f83ba8752  absent\n2026-07-04 d203202c65  absent\n2026-06-19 f7a6b0fea5  absent\n```\n\nBefore it, `formatModelError` wrapped everything with `cause` — exactly what these two\nassertions describe. Neither test was updated alongside.\n\n## What is the fix?\n\nAssert the code where it now lives:\n\n```diff\n-    ).rejects.toMatchObject({\n-      cause: expect.objectContaining({ code: \"MODEL_OUTPUT_INCOMPLETE\" }),\n-    });\n+    ).rejects.toMatchObject({\n+      code: \"MODEL_OUTPUT_INCOMPLETE\",\n+    });\n```\n\nNo `src` change: the current shape is the correct one, and loosening the assertion to\naccept either shape would stop pinning the contract at all.\n\n# Documentation changes needed?\n\nNo. Test only.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe mutation block.\n\n## Detailed testing steps\n\n| Gate | Result |\n| --- | --- |\n| the two changed suites | **21 passed (21)** — was `2 failed | 19 passed` |\n| full `plugin-anthropic` package | `1 failed | 142 passed (143)` — was `3 failed | 140 passed` |\n| `biome check` (repository-pinned 2.5.8) | `No fixes applied.` |\n| diff vs `develop` | `+7/-2`, two test files, zero runtime files |\n\nMutation resistance — restoring **only** develop's assertions:\n\n```\nAssertionError: expected ElizaError: [anthropic] Model output did … to match object { Object (cause) }\nAssertionError: expected ElizaError: [anthropic] Model output did … to match object { cause: ObjectContaining{…} }\n Tests  2 failed | 19 passed (21)\n```\n\n**The remaining failure is deliberately not fixed here.**\n`error-policy.shape.test.ts \u003e surfaces a failed CLI stream as an error instead of a\nhealthy-empty completion` fails for an unrelated reason: it expects\n`result.finishReason` to resolve to `\"error\"`, while `createTextStream`\n(`utils/claude-cli.ts:484`) throws instead. Both satisfy \"not a healthy-empty completion\",\nso which is intended is a design call for the plugin owner. Recorded in #30148; happy to\nfollow up once that is decided.\n\nAlso worth noting for anyone reproducing: this package runs on **vitest**\n(`bunx vitest run --config vitest.config.ts`). Running it with `bun test` fails\nmisleadingly on `vi.doMock is not a function`.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:55aac605edf72a1da97ae4cfbb095c1104a4440b --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] Before screenshots `N/A - provider error-shape assertions; no rendered surface`.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] After screenshots `N/A - provider error-shape assertions; no rendered surface`.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] A video walkthrough `N/A - the observable result is the suites' pass/fail, quoted above`.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] Backend logs `N/A - no service is started; the model handlers are driven directly against a mocked provider`.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] Frontend console/network logs `N/A - no frontend change`.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] Real-LLM trajectory `N/A - the provider is a deterministic double by the suites' design; no live model call`.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] Domain artifacts `N/A - the artifact is the thrown ElizaError shape, quoted above`.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [ ] OCR visual-text review `N/A - no rendered visual surface`.\n\n# Attribution\n\n- Identified and fixed by Claude Code (`claude-opus-5`): `Plugin Tests` shard triage, local reproduction at the exact `develop` tip, reading `formatModelError` and `assertModelOutputComplete` to establish that the runtime shape is correct and the assertions are not, the `isElizaError`-presence history isolating the change to #28112, and the mutation proof.\n\nAttribution status: self-reported\n"])</script><script>self.__next_f.push([1,"3c:T440,\u003c!-- evidence-gate --\u003e\n\u003c!-- evidence-head:7d38e26f511286175aaf8c37fbcf691fa13e4616 --\u003e\n\n## Summary\nIn `@elizaos/ui`:\n1. `generateFallbackLogo` (`packages/ui/src/providers/index.ts`) extracted provider initials using raw `providerId.slice(0, 2)`.\n2. Public character page (`packages/ui/src/cloud/public-pages/pages/chat/public-chat-page.tsx`) extracted character initials using raw `character.name.slice(0, 2)`.\n3. Hosted charge payment page (`packages/ui/src/cloud/public-pages/pages/payment/app-charge-page.tsx`) extracted app initials using raw `details.app.name.slice(0, 2)`.\n\nWhen names begin with multi-code-unit UTF-16 surrogate pairs, raw slicing severed the surrogate pairs.\n\n## Proposed Changes\n1. Replaced raw `.slice(0, 2)` with `truncateWellFormed(toWellFormedUnicode(...), 2)` from `@elizaos/core` across all three modules.\n\n## Verification\n- Verified well-formed Unicode output in provider logo fallback and avatar initials rendering.\n\n```yaml contribution-provenance\nskill_revision: \"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\"\n```\n3d:T72a,"])</script><script>self.__next_f.push([1,"## Problem\n\nThe current `develop` full-stack cloud lane failed during the onboarding reprovision spec with:\n\n```\nError: listen EADDRINUSE: address already in use 127.0.0.1:45213\n```\n\nThe stack selected the Hetzner and control-plane mock ports by opening and closing probe sockets before either real mock server bound. That creates a check-then-bind race (and permits the same released ephemeral port to be selected twice).\n\nRun: https://github.com/elizaOS/eliza/actions/runs/33329081779/job/99306076298\n\n## Fix\n\nLet each in-process Node HTTP mock bind `port: 0` directly. The kernel assigns and reserves the t\":\"2026-08-31T23:36:34Z\",\"closedAt\":\"2026-09-27T18:41:20Z\",\"state\":\"CLOSED\",\"commentCount\":1}],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs8AAAABBjIHKg\",\"title\":\"release: promote certified develop d8c5b312 to production\",\"author\":\"lalalune\",\"number\":30128,\"body\":\"Promotes the exact staging-certified develop tree to production.\\\\n\\\\n- Certified source: `d8c5b3124d97fac8189ad49afc14363ba56764f6`\\\\n- Certified tree: `73bb94c86c300be814d232748e19ab891d735d2f`\\\\n- Staging certification: workflow run `33329098510` (success)\\\\n- Production blocker fixed: inference admission no longer routes every request through the completed rate-limit cutover coordinator that is timing out in production.\\\\n- Bettina account prerequisite: active account has an audited $1,000 test-credit ledger grant; no secret values are included here.\\\\n\\\\nProduction deployment must use the canonical Cloud CF Deploy workflow. After deployment, verify direct authenticated inference and the paired Bettina VPS chat against the deployed Worker version.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T03:22:23Z\",\"mergedAt\":\"2026-08-31T03:54:09Z\",\"additions\":98503,\"deletions\":12129},{\"id\":\"PR_kwDOMT5cIs8AAAABBrLOdw\",\"title\":\"fix: consolidate duplicate systems behind canonical owners\",\"author\":\"lalalune\",\"number\":30229,\"body\":\"$18\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T23:53:41Z\",\"mergedAt\":\"2026-09-10T23:14:05Z\",\"additions\":21841,\"deletions\":14064},{\"id\":\"PR_kwDOMT5cIs8AAAABBktRQw\",\"title\":\"release: promote certified develop cloud tree\",\"author\":\"lalalune\",\"number\":30145,\"body\":\"Promotes the exact develop tree certified by Cloud CF staging run 33371392989.\\n\\nProduction recovery blocker fixed: build core before the database identity gate imports core edge.\\n\\nEvidence:\\n- Cloud CF staging release: https://github.com/elizaOS/eliza/actions/runs/33371392989\\n- Migration, Worker PR_kwDOMT5cIs8AAAABBe3UKg\",\"title\":\"fix(imessage): add Blooio transport and durable CLI auth handoff\",\"author\":\"lalalune\",\"number\":30029,\"body\":\"$1b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-30T04:14:53Z\",\"mergedAt\":\"2026-08-31T07:16:50Z\",\"additions\":2147,\"deletions\":129},{\"id\":\"PR_kwDOMT5cIs8AAAABBndMgQ\",\"title\":\"feat(cloud): reserve subscription allowance before credits\",\"author\":\"wtfsayo\",\"number\":30166,\"body\":\"## Summary\\n\\n- reserve allowance-eligible usage from the current subscription period before purchased credits\\n- keep cash-only operations entirely on purchased credits\\n- lock the organization and both funding sources in one transaction\\n- persist the exact allowance and purchased-credit allocation through #30154's reviewed authority tables\\n- settle under-estimates to the original sources, recording expired allowance refunds without minting cash\\n- route paid inference through the subscription funding path while free organizations retain the existing credit flow\\n\\nStacked on #30165, which is stacked on #30154. This is the reservation and bounded settlement slice of #23092. Overage collection and remaining debit-boundary migrations follow in the next stacked PR.\\n\\n## Verification\\n\\n- Cloud shared TypeScript check\\n- allowance-first and cash-only split tests\\n- paid/free inference funding selection tests\\n- funding policy and production debit inventory tests\\n- Biome on changed TypeScript files\\n- `git diff --check`\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T14:47:55Z\",\"mergedAt\":\"2026-09-02T11:01:07Z\",\"additions\":1958,\"deletions\":823},{\"id\":\"PR_kwDOMT5cIs8AAAABBk9lag\",\"title\":\"fix(lifeops): ingest complete agreement PDFs\",\"author\":\"lalalune\",\"number\":30146,\"body\":\"## Summary\\n\\n- replace whole-file base64 uploads and semantic size/page caps with resumable, integrity-bound chunks\\n- extract every parser-declared PDF page with native positioned text, OCR when available, and required rendered-page vision reconciliation\\n- fail the entire ingestion when any page cannot be verified; preserve immutable owner-private source bytes and authenticated downloads\\n- serialize upload mutation/commit, make retries idempotent, prevent stale mixed-file resumes, and protect private media from blind FIFO eviction\\n\\n## Verification\\n\\n- `bun run --cwd plugins/plugin-pdf typecheck`\\n- `bun run --cwd plugins/plugin-pdf lint:check`\\n- `bun run --cwd plugins/plugin-pdf test` (56 passed)\\n- `bun run --cwd plugins/plugin-personal-assistant lint:check`\\n- `bun run --cwd plugins/plugin-personal-assistant build:types`\\n- focused personal-assistant suites (25 passed)\\n- `bunx vitest run packages/agent/src/api/media-store.test.ts` (74 passed)\\n- `git diff --check origin/develop...HEAD`\\n\\nCloses #30123\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T09:05:10Z\",\"mergedAt\":\"2026-08-31T09:09:51Z\",\"additions\":1947,\"deletions\":370},{\"id\":\"PR_kwDOMT5cIs8AAAABBouBHg\",\"title\":\"ci: split ruleset source by protected branch\",\"author\":\"standujar\",\"number\":30169,\"body\":\"$1c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T17:36:56Z\",\"mergedAt\":null,\"additions\":1636,\"deletions\":165},{\"id\":\"PR_kwDOMT5cIs8AAAABBrL6Nw\",\"title\":\"fix(calendar): ship responsive CRUD and reliable family-ops integrations\",\"author\":\"lalalune\",\"number\":30230,\"body\":\"$1d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T23:55:58Z\",\"mergedAt\":\"2026-09-01T00:18:31Z\",\"additions\":874,\"deletions\":201},{\"id\":\"PR_kwDOMT5cIs8AAAABBj9nDw\",\"title\":\"chore(deps-dev): bump the dev-dependencies group across 1 directory with 22 updates\",\"author\":\"dependabot\",\"number\":30140,\"body\":\"$1e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T06:26:25Z\",\"mergedAt\":null,\"additions\":774,\"deletions\":692},{\"id\":\"PR_kwDOMT5cIs8AAAABBZsJ1g\",\"title\":\"chore(deps-dev): bump the dev-dependencies group across 1 directory with 20 updates\",\"author\":\"dependabot\",\"number\":29834,\"body\":\"$1f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-29T00:16:40Z\",\"mergedAt\":null,\"additions\":724,\"deletions\":648},{\"id\":\"PR_kwDOMT5cIs8AAAABBlMw_w\",\"title\":\"fix(plugin-native-inference): make fused loader auto-load guard role-aware\",\"author\":\"agent-cortex\",\"number\":30150,\"body\":\"$20\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T09:39:12Z\",\"mergedAt\":null,\"additions\":624,\"deletions\":81},{\"id\":\"PR_kwDOMT5cIs8AAAABBlVroQ\",\"title\":\"fix(plugin-native-swabble): gate web wake word on token boundaries (#30151)\",\"author\":\"agent-cortex\",\"number\":30152,\"body\":\"$21\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T09:59:55Z\",\"mergedAt\":null,\"additions\":552,\"deletions\":16},{\"id\":\"PR_kwDOMT5cIs8AAAABBq6dzA\",\"title\":\"fix(ci): restore develop cloud, browser, and fixture gates\",\"author\":\"lalalune\",\"number\":30221,\"body\":\"$22\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T23:05:49Z\",\"mergedAt\":\"2026-09-01T00:49:11Z\",\"additions\":421,\"deletions\":114},{\"id\":\"PR_kwDOMT5cIs8AAAABBkS42w\",\"title\":\"fix(plugin-blocker): invalidate app-blocker status cache after native mutation, not before\",\"author\":\"agent-cortex\",\"number\":30143,\"body\":\"$23\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T07:21:57Z\",\"mergedAt\":null,\"additions\":371,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBnR5Fw\",\"title\":\"fix(plugin-slack): stop rewriting the inside of fenced code blocks\",\"author\":\"lets-order-some-fries\",\"number\":30164,\"body\":\"$24\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T14:25:50Z\",\"mergedAt\":null,\"additions\":363,\"deletions\":12},{\"id\":\"PR_kwDOMT5cIs8AAAABBitfGw\",\"title\":\"fix(plugin-agent-skills): parse SKILL.md YAML block scalar descriptions (#30121)\",\"author\":\"agent-cortex\",\"number\":30124,\"body\":\"$25\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T01:37:37Z\",\"mergedAt\":null,\"additions\":323,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBj7AmA\",\"title\":\"fix(cloud): restore $5 signup credit\",\"author\":\"wtfsayo\",\"number\":30139,\"body\":\"$26\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T06:19:16Z\",\"mergedAt\":\"2026-08-31T07:46:59Z\",\"additions\":303,\"deletions\":88},{\"id\":\"PR_kwDOMT5cIs8AAAABBlxK8w\",\"title\":\"fix(plugin-wallet): return deployed vault from receipt VaultCreated event, not a post-mine re-simulation\",\"author\":\"agent-cortex\",\"number\":30155,\"body\":\"$27\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T11:05:12Z\",\"mergedAt\":null,\"additions\":254,\"deletions\":20},{\"id\":\"PR_kwDOMT5cIs8AAAABBjIf6w\",\"title\":\"fix(cloud): return app sign-ins without CLI consent\",\"author\":\"NubsCarson\",\"number\":30129,\"body\":\"## Summary\\n- recognize an exact loopback Eliza app login handoff using the matching callback/session markers and same-origin browser referrer\\n- persist that narrow trust only for the matching session across the hosted login round trip\\n- return signed-in app launches automatically while preserving explicit authorization for generic/copied CLI links\\n\\n## Local verification\\n- `packages/ui`: focused CLI-login + same-tab Cloud login tests (49/49)\\n- `packages/ui`: full typecheck\\n- Biome on all three changed files\\n- `git diff --check`\\n\\nThis is a bounded staging UX fix; it does not merge the protected stable branch or alter production/paid state.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T03:23:50Z\",\"mergedAt\":\"2026-08-31T06:01:17Z\",\"additions\":229,\"deletions\":20},{\"id\":\"PR_kwDOMT5cIs8AAAABBmt2dw\",\"title\":\"fix(plugin-elizacloud): guard unguarded JSON.parse of cloud-bridge WebSocket frames\",\"author\":\"agent-cortex\",\"number\":30162,\"body\":\"$28\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T13:17:06Z\",\"mergedAt\":null,\"additions\":218,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBmd9XA\",\"title\":\"fix(plugin-app-manager): skip malformed package.json in /api/apps/load-from-directory scan\",\"author\":\"agent-cortex\",\"number\":30159,\"body\":\"$29\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T12:44:55Z\",\"mergedAt\":null,\"additions\":187,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBjiecw\",\"title\":\"fix(core): retain stored role-write audit history in mergeWorldMetadataForLegacyWrite\",\"author\":\"HomunculusLabs\",\"number\":30135,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T04:57:26Z\",\"mergedAt\":null,\"additions\":161,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABBneGHA\",\"title\":\"fix(cloud): report uncollected subscription overages\",\"author\":\"wtfsayo\",\"number\":30167,\"body\":\"## Summary\\n\\n- settle estimated subscription funding in one organization-locked transaction\\n- cap collection at the amount durably reserved across allowance and purchased credits\\n- report excess provider usage as `uncollected_overage` instead of opening a second charge\\n- keep the original reservation as the only durable settlement identity\\n- use database time after the organization lock for terminal persistence\\n\\nStacked on #30166. This closes the over-estimate settlement gap without weakening the atomic funding invariant established below it.\\n\\n## Verification\\n\\n- Cloud shared TypeScript check\\n- 23 underlying billing, funding split, and inference admission cases (7 package-runner tests; mock-heavy cases run in isolated child processes)\\n- direct covered-usage and excess-usage settlement-cap tests\\n- Biome check\\n- `git diff --check`\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T14:49:45Z\",\"mergedAt\":\"2026-09-02T11:01:43Z\",\"additions\":145,\"deletions\":30},{\"id\":\"PR_kwDOMT5cIs8AAAABBmZ87Q\",\"title\":\"fix(plugin-wallet): resolve relative native swap amounts in bigint\",\"author\":\"sharkwon\",\"number\":30158,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T12:35:55Z\",\"mergedAt\":null,\"additions\":132,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs8AAAABBid32Q\",\"title\":\"fix(plugin-zai): guard MODEL_USED emission against unhandled rejection (#30115)\",\"author\":\"agent-cortex\",\"number\":30117,\"body\":\"$2c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T00:30:34Z\",\"mergedAt\":null,\"additions\":82,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBlyyqA\",\"title\":\"fix(plugin-form): render string boolean forms correctly in formatValue\",\"author\":\"mtcow\",\"number\":30156,\"body\":\"## Summary\\n`formatValue`'s boolean branch did `value ? 'Yes' : 'No'`, but every non-empty string is truthy in JS, so a stored string `'false'` (or `'no'`/`'0'`/`'off'` — all valid per `validateBoolean`) displayed as **'Yes'**, the exact opposite of its meaning (#30112).\\n\\n## Fix\\nParse boolean-like strings explicitly: falsy list (`false/no/0/off`) → `No`, truthy list (`true/yes/1/on`) → `Yes`, falling back to truthiness for anything unrecognized.\\n\\n## Verification\\n14 cases verified: real booleans, string forms in both cases, and `Yes`/`No` all render correctly.\\n\\nCloses #30112.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T11:09:05Z\",\"mergedAt\":null,\"additions\":49,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp9u2g\",\"title\":\"fix(agent): use surrogate-safe truncation in maskSecret and shortenMint in api/wallet\",\"author\":\"Kayvan-Zahiri\",\"number\":30198,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:b1ac7338aeda03ad4514b6c2c4113f5c8900d68a --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/api/wallet.ts`):\\n1. `maskSecret` masked secrets longer than 8 characters using raw `${value.slice(0, 4)}...${value.slice(-4)}`.\\n2. `shortenMint` shortened Solana mint addresses using raw `${mint.slice(0, 4)}...${mint.slice(-4)}`.\\n\\nWhen custom secret tokens, seed phrases, or test mint addresses contain multi-code-unit UTF-16 surrogate pairs at head or tail boundaries, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed(..., 4)`, and `tailWellFormed(..., 4)` from `@elizaos/core` across both masking and mint-shortening functions.\\n\\n## Verification\\n- Verified well-formed Unicode output during wallet secret masking and token mint abbreviation.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:38:13Z\",\"mergedAt\":null,\"additions\":32,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBp0_5A\",\"title\":\"fix(ui): keep natural navigation shortcuts behind their feature flag\",\"author\":\"sloppyist\",\"number\":30172,\"body\":\"$2d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:18:01Z\",\"mergedAt\":null,\"additions\":32,\"deletions\":62},{\"id\":\"PR_kwDOMT5cIs8AAAABBifJjg\",\"title\":\"fix(app-core): keep the supervised Vite proxy on Node\",\"author\":\"agent-cortex\",\"number\":30118,\"body\":\"$2e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T00:36:26Z\",\"mergedAt\":null,\"additions\":29,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABBinUig\",\"title\":\"fix(app-core): resolve the Node runtime for the supervised API child\",\"author\":\"sloppyist\",\"number\":30120,\"body\":\"$2f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T01:11:35Z\",\"mergedAt\":null,\"additions\":26,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBZ2yDw\",\"title\":\"fix(app-core): repair diagnostics collection and auth fixtures\",\"author\":\"NubsCarson\",\"number\":29855,\"body\":\"$30\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-29T01:07:15Z\",\"mergedAt\":\"2026-08-31T22:02:37Z\",\"additions\":25,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBqvwSA\",\"title\":\"fix(plugin-x): use truncateWellFormed and toWellFormedUnicode for vault segment normalization\",\"author\":\"Kayvan-Zahiri\",\"number\":30217,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:cf4c789a05e3fc556d55f707411e33eb3a568dd8 --\u003e\\n\\n## Summary\\nIn `plugins/plugin-x/src/connector-credential-refs.ts`:\\n`normalizeVaultSegment` normalized vault path segments using standard `.slice(0, 64)`. When inputs contained multi-byte Unicode or lone surrogate code units, raw slicing could truncate code unit pairs midway, producing invalid UTF-16 strings in durable vault keys.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` on input strings prior to slug sanitization.\\n2. Used `truncateWellFormed` for surrogate-safe length limiting to 64 characters.\\n3. Added unit tests in `plugins/plugin-x/src/connector-credential-refs.test.ts`.\\n\\n## Verification\\n- Passed unit tests in `plugins/plugin-x/src/connector-credential-refs.test.ts`.\\n\\n\u003c!-- slop-contribution-attribution:v1 {\\\"provider\\\":\\\"anthropic\\\",\\\"model\\\":\\\"claude-3-7-sonnet\\\",\\\"client\\\":\\\"antigravity-ide\\\",\\\"skill_revision\\\":\\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"} --\u003e\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:34:58Z\",\"mergedAt\":null,\"additions\":24,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBqthtQ\",\"title\":\"fix(plugin-slack): use truncateWellFormed and toWellFormedUnicode for vault segment normalization\",\"author\":\"Kayvan-Zahiri\",\"number\":30211,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:9ecb74a76b1a151a586b95b83deb3cfb263aaab0 --\u003e\\n\\n## Summary\\nIn `plugins/plugin-slack/src/connector-credential-refs.ts`:\\n`normalizeVaultSegment` normalized vault path segments using standard `.slice(0, 64)`. When inputs contained multi-byte Unicode or lone surrogate code units, raw slicing could truncate code unit pairs midway, producing invalid UTF-16 strings in durable vault keys.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` on input strings prior to slug sanitization.\\n2. Used `truncateWellFormed` for surrogate-safe length limiting to 64 characters.\\n3. Added unit tests in `plugins/plugin-slack/src/connector-credential-refs.test.ts`.\\n\\n## Verification\\n- Passed unit tests in `plugins/plugin-slack/src/connector-credential-refs.test.ts`.\\n\\n\u003c!-- slop-contribution-attribution:v1 {\\\"provider\\\":\\\"anthropic\\\",\\\"model\\\":\\\"claude-3-7-sonnet\\\",\\\"client\\\":\\\"antigravity-ide\\\",\\\"skill_revision\\\":\\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"} --\u003e\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:28:31Z\",\"mergedAt\":null,\"additions\":24,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBqvO5g\",\"title\":\"fix(plugin-spotify): use truncateWellFormed and toWellFormedUnicode for vault segment normalization\",\"author\":\"Kayvan-Zahiri\",\"number\":30216,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:d55f0731cf80794f9ffea0e855535dc21f1ca1b1 --\u003e\\n\\n## Summary\\nIn `plugins/plugin-spotify/src/credential-refs.ts`:\\n`normalizeVaultSegment` normalized vault path segments using standard `.slice(0, 64)`. When inputs contained multi-byte Unicode or lone surrogate code units, raw slicing could truncate code unit pairs midway, producing invalid UTF-16 strings in durable vault keys.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` on input strings prior to slug sanitization.\\n2. Used `truncateWellFormed` for surrogate-safe length limiting to 64 characters.\\n3. Added unit tests in `plugins/plugin-spotify/src/credential-refs.test.ts`.\\n\\n## Verification\\n- Passed unit tests in `plugins/plugin-spotify/src/credential-refs.test.ts`.\\n\\n\u003c!-- slop-contribution-attribution:v1 {\\\"provider\\\":\\\"anthropic\\\",\\\"model\\\":\\\"claude-3-7-sonnet\\\",\\\"client\\\":\\\"antigravity-ide\\\",\\\"skill_revision\\\":\\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"} --\u003e\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:33:24Z\",\"mergedAt\":null,\"additions\":23,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBquN3A\",\"title\":\"fix(plugin-sql): use truncateWellFormed and toWellFormedUnicode for vault segment normalization\",\"author\":\"Kayvan-Zahiri\",\"number\":30213,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:263e405d77eb2367aa21cba08a20d35595ddf436 --\u003e\\n\\n## Summary\\nIn `plugins/plugin-sql/src/connector-credential-store.ts`:\\n`normalizeVaultSegment` normalized vault path segments using standard `.slice(0, 64)`. When inputs contained multi-byte Unicode or lone surrogate code units, raw slicing could truncate code unit pairs midway, producing invalid UTF-16 strings in durable vault keys.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` on input strings prior to slug sanitization.\\n2. Used `truncateWellFormed` for surrogate-safe length limiting to 64 characters.\\n3. Added unit tests in `plugins/plugin-sql/src/connector-credential-store.test.ts`.\\n\\n## Verification\\n- Passed unit tests in `plugins/plugin-sql/src/connector-credential-store.test.ts`.\\n\\n\u003c!-- slop-contribution-attribution:v1 {\\\"provider\\\":\\\"anthropic\\\",\\\"model\\\":\\\"claude-3-7-sonnet\\\",\\\"client\\\":\\\"antigravity-ide\\\",\\\"skill_revision\\\":\\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"} --\u003e\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:30:26Z\",\"mergedAt\":null,\"additions\":23,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBquh8g\",\"title\":\"fix(plugin-google-workspace): use truncateWellFormed and toWellFormedUnicode for \nIn `@elizaos/agent` (`packages/agent/src/diagnostics/integration-observability.ts`):\\n`sanitizeToken` clamped input error tokens using raw `value.slice(0, 1024)` and `normalized.slice(0, 64)`. When error messages contain multi-code-unit UTF-16 surrogate pairs at the 1024-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed` from `@elizaos/core` to generate safe error tokens.\\n2. Added unit tests in `packages/agent/src/diagnostics/integration-observability.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/agent/src/diagnostics/integration-observability.test.ts` (4/4 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:41:19Z\",\"mergedAt\":null,\"additions\":19,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBp2EXg\",\"title\":\"fix(ui): use truncateWellFormed for sentence window splitting in voice playback\",\"author\":\"Kayvan-Zahiri\",\"number\":30175,\"body\":\"$32\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:20:33Z\",\"mergedAt\":null,\"additions\":19,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBcIMOA\",\"title\":\"test(google-workspace): assert the Gmail limit rejection #28112 introduced\",\"author\":\"Svector-anu\",\"number\":29912,\"body\":\"$33\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-29T12:42:47Z\",\"mergedAt\":null,\"additions\":18,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBp238Q\",\"title\":\"fix(core): ensure maskSecretValue preserves UTF-16 surrogate integrity at visible boundaries\",\"author\":\"Kayvan-Zahiri\",\"number\":30177,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:e09ca3a64a7f92e89e4a1964a13a9f482882af28 --\u003e\\n\\n## Summary\\nIn `@elizaos/core` (`packages/core/src/features/secrets/actions/mask.ts`):\\n`maskSecretValue` sliced visible prefixes and suffixes with `value.slice(0, 4)` and `value.slice(-4)`. When secret values contain multi-code-unit UTF-16 surrogate pairs at the 4-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed(wellFormed, 4)`, and `tailWellFormed(wellFormed, 4)` from `packages/core/src/utils/well-formed.ts` to preserve surrogate pair integrity.\\n2. Added regression test in `packages/core/src/features/secrets/actions/mask.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/core/src/features/secrets/actions/mask.test.ts` (5/5 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:22:30Z\",\"mergedAt\":null,\"additions\":18,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBqjbPw\",\"title\":\"fix(plugin-workflow): use truncateWellFormed for shortId in getUserTagName\",\"author\":\"Kayvan-Zahiri\",\"number\":30210,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:64aa8d443c28000f74ed1b9d7b4dd5f80606890d --\u003e\\n\\n## Summary\\nIn `@elizaos/plugin-workflow` (`plugins/plugin-workflow/src/utils/context.ts`):\\n`getUserTagName` derived user tag short IDs using raw `userId.replace(/-/g, '').slice(0, 8)`. When custom or simulated user identifiers contain multi-code-unit UTF-16 surrogate pairs at the 8-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `truncateWellFormed(toWellFormedUnicode(userId).replace(/-/g, ''), 8)` from `@elizaos/core` to generate safe user tag short IDs.\\n2. Added unit tests in `plugins/plugin-workflow/__tests__/unit/context.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run plugins/plugin-workflow/__tests__/unit/context.test.ts` (5/5 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:04:06Z\",\"mergedAt\":null,\"additions\":16,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp3fEA\",\"title\":\"fix(ui): use truncateWellFormed for plugin monograms in plugin-list-utils\",\"author\":\"Kayvan-Zahiri\",\"number\":30179,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:f140ca983ebdeeb9abce8375d784b98e6625bc16 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/pages/plugin-list-utils.ts`):\\n`pluginMonogram` extracted single-word and multi-word monograms using raw string indexing `words[0][0] + words[1][0]` and `single.slice(0, 2)`. When plugin names contain multi-code-unit UTF-16 surrogate pairs, raw indexing and slicing severed surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed` from `@elizaos/core` to extract individual characters and two-character prefixes safely without splitting astral surrogate pairs.\\n2. Added unit tests in `packages/ui/src/components/pages/plugin-list-utils.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/ui/src/components/pages/plugin-list-utils.test.ts` (6/6 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:23:58Z\",\"mergedAt\":null,\"additions\":16,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBqt2DQ\",\"title\":\"fix(agent): use truncateWellFormed and toWellFormedUnicode for connector vault segment normalization\",\"author\":\"Kayvan-Zahiri\",\"number\":30212,\"body\":\"$34\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:29:26Z\",\"mergedAt\":null,\"additions\":15,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBp7fyw\",\"title\":\"fix(shared): use truncateWellFormed in interpolateString for long config templates\",\"author\":\"Kayvan-Zahiri\",\"number\":30192,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:1b16474aa282adcf781b8559ad25dc7e7e4d55b8 --\u003e\\n\\n## Summary\\nIn `@elizaos/shared` (`packages/shared/src/config/config-catalog.ts`):\\n`interpolateString` clamped oversized template strings using raw `template.slice(0, 100_000)`. When template strings contain multi-code-unit UTF-16 surrogate pairs at the 100_000-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 100_000)` from `@elizaos/core` to ensure safe template bounds.\\n2. Added unit tests in `packages/shared/src/config/config-catalog.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/shared/src/config/config-catalog.test.ts` (64/64 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:33:12Z\",\"mergedAt\":null,\"additions\":15,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBq-sPQ\",\"title\":\"fix(ui): restore components/pages test collection\",\"author\":\"sloppyist\",\"number\":30225,\"body\":\"$35\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T23:18:19Z\",\"mergedAt\":null,\"additions\":14,\"deletions\":21},{\"id\":\"PR_kwDOMT5cIs8AAAABBpvGZg\",\"title\":\"fix(ui): use truncateWellFormed for session lastActivity in startup hydrate\",\"author\":\"Kayvan-Zahiri\",\"number\":30170,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:d2d7c03269041b56eb40d61d2e0e30d72bbc00f6 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/state/startup-phase-hydrate.ts`):\\n`bindReadyPhase` clamped session lastActivity strings using raw `.slice(0, 60)` during `tool_running`, `blocked_auto_resolved`, `coordination_decision`, and `error` events. When tool descriptions, prompts, reasoning, or error messages contain multi-code-unit UTF-16 surrogate pairs at index 60, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Replaced raw `.slice()` calls with `truncateWellFormed(toWellFormedUnicode(...))` from `@elizaos/core`.\\n\\n## Verification\\n- Verified well-formed Unicode output during session lastActivity event formatting.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:04:30Z\",\"mergedAt\":null,\"additions\":14,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs8AAAABBjGZhA\",\"title\":\"fix(ui): restore frontend hosting browser fixture\",\"author\":\"hermesagent270-commits\",\"number\":30127,\"body\":\"$36\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T03:16:03Z\",\"mergedAt\":\"2026-09-01T05:25:38Z\",\"additions\":14,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBq1wwg\",\"title\":\"fix(cloud): add shred -f to cloud-cf-deploy and railway-audit cleanup (#30204)\",\"author\":\"seb4ez\",\"number\":30219,\"body\":\"Fixes #30204\\n\\n## Summary\\ne08934f52a added -f to shred in .github/workflows/cloud-cf-release.yml to securely shred read-only recovery evidence, but two sibling workflows (cloud-cf-deploy.yml and production-railway-database-authority-audit.yml) retained shred -u -- without -f. Because read-only admission scripts (e.g. chmod 0500) cannot be opened for writing without -f, evidence survived cleanup on the runner.\\n\\n## Changes\\n- Added -f flag (shred -f -u --) to the evidence destruction steps in .github/workflows/cloud-cf-deploy.yml and .github/workflows/production-railway-database-authority-audit.yml.\\n- Updated packages/cloud/scripts/staging-release-certification.test.mjs to pin the -f flag across all three sibling workflows to prevent silent regression.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:51:36Z\",\"mergedAt\":null,\"additions\":13,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBqi80Q\",\"title\":\"fix(plugin-whatsapp): use truncateWellFormed for fallback chatId in resolveWhatsAppSystemLocation\",\"author\":\"Kayvan-Zahiri\",\"number\":30209,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:f44c1d7ad7fd10ee849e5d7ad94bb170ff258159 --\u003e\\n\\n## Summary\\nIn `@elizaos/plugin-whatsapp` (`plugins/plugin-whatsapp/src/normalize.ts`):\\n`resolveWhatsAppSystemLocation` formatted fallback chat locations when `chatName` was omitted using raw `chatId.slice(0, 8)`. When custom or simulated chat identifiers contain multi-code-unit UTF-16 surrogate pairs at the 8-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `truncateWellFormed(toWellFormedUnicode(chatId), 8)` from `@elizaos/core` to generate safe fallback location labels.\\n2. Added unit tests in `plugins/plugin-whatsapp/src/normalize.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run plugins/plugin-whatsapp/src/normalize.test.ts` (19/19 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:03:04Z\",\"mergedAt\":null,\"additions\":13,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBqhYWg\",\"title\":\"fix(agent): use truncateWellFormed for lastInteractionAt in rolodex provider\",\"author\":\"Kayvan-Zahiri\",\"number\":30205,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:e9196f43f093d26921f98063af4cb012b67d6a96 --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/providers/rolodex.ts`):\\n`formatPerson` formatted contact last interaction timestamps using raw `person.lastInteractionAt.slice(0, 10)`. When interaction timestamp strings contain multi-code-unit UTF-16 surrogate pairs at the 10-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(..., 10)` from `@elizaos/core` to generate safe timestamp prefixes.\\n2. Added unit tests in `packages/agent/src/providers/rolodex.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/agent/src/providers/rolodex.test.ts` (13/13 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T21:59:35Z\",\"mergedAt\":null,\"additions\":13,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp6-nQ\",\"title\":\"fix(ui): use truncateWellFormed for railMonogram and humanizeEventKind in trigger-form-utils\",\"author\":\"Kayvan-Zahiri\",\"number\":30191,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:a5b39350099120a465a3832e6e307fa9748313eb --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/pages/trigger-form-utils.ts`):\\n1. `railMonogram` extracted monograms using raw string indexing `word[0]` and `label.slice(0, 1)`.\\n2. `humanizeEventKind` capitalized event kind parts using `part.charAt(0).toUpperCase() + part.slice(1)`.\\n\\nWhen trigger labels or event kinds contain multi-code-unit UTF-16 surrogate pairs, raw slicing and `charAt(0)` severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed` from `@elizaos/core` across both helper functions.\\n\\n## Verification\\n- Verified well-formed Unicode output during trigger rail monogram and event kind humanization rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:32:00Z\",\"mergedAt\":null,\"additions\":12,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBqhvgQ\",\"title\":\"fix(plugin-wallet): use surrogate-safe truncation in wallet status and inventory views\",\"author\":\"Kayvan-Zahiri\",\"number\":30206,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:00:23Z\",\"mergedAt\":null,\"additions\":10,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABBp749g\",\"title\":\"fix(shared): use truncateWellFormed in normalizeMalformedCandidate in base-url\",\"author\":\"Kayvan-Zahiri\",\"number\":30193,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:4a3dabe5d65b227294ea0e77a28cceac3b782ead --\u003e\\n\\n## Summary\\nIn `@elizaos/shared` (`packages/shared/src/elizacloud/base-url.ts`):\\n`normalizeMalformedCandidate` clamped candidate base URL strings using raw `candidate.slice(0, 8192)`. When malformed or custom candidate strings contain multi-code-unit UTF-16 surrogate pairs at the 8192-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 8192)` from `@elizaos/core` to generate safe URL candidates.\\n2. Added unit tests in `packages/shared/src/elizacloud/base-url.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/shared/src/elizacloud/base-url.test.ts` (14/14 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:34:03Z\",\"mergedAt\":null,\"additions\":10,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp9Mqw\",\"title\":\"fix(shared): use surrogate-safe truncation in sanitizeApiKey\",\"author\":\"Kayvan-Zahiri\",\"number\":30196,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:4a795935488311c3eaf1f4b393324277a520d63a --\u003e\\n\\n## Summary\\nIn `@elizaos/shared` (`packages/shared/src/voice.ts`):\\n`sanitizeApiKey` masked API keys longer than 8 characters using raw `${apiKey.slice(0, 4)}...${apiKey.slice(-4)}`. When custom, tokenized, or test keys contain multi-code-unit UTF-16 surrogate pairs at head or tail boundaries, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed(wellFormed, 4)`, and `tailWellFormed(wellFormed, 4)` from `@elizaos/core` to generate safe masked keys.\\n2. Added unit tests in `packages/shared/src/voice.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/shared/src/voice.test.ts` (3/3 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:36:57Z\",\"mergedAt\":null,\"additions\":8,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBp84qw\",\"title\":\"fix(shared): use surrogate-safe unicode iteration for monograms in getAppHeroMonogram\",\"author\":\"Kayvan-Zahiri\",\"number\":30195,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:e4018811bcb419996fadf05d407b7018a4c8d7f6 --\u003e\\n\\n## Summary\\nIn `@elizaos/shared` (`packages/shared/src/app-hero-art.ts`):\\n`getAppHeroMonogram` extracted monograms using raw string indexing `word[0]` and `label.slice(0, 2)`. When app names or display labels begin with astral Unicode characters (such as emojis or multi-code-unit symbols), raw string indexing severed the UTF-16 surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and Unicode-aware iteration (`Array.from(...)`) to extract initials and fallback monogram strings without splitting surrogate pairs.\\n2. Added unit tests in `packages/shared/src/app-hero-art.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/shared/src/app-hero-art.test.ts` (5/5 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:36:13Z\",\"mergedAt\":null,\"additions\":8,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBp5GQg\",\"title\":\"fix(ui): use surrogate-safe truncation in cloud crypto address formatters\",\"author\":\"Kayvan-Zahiri\",\"number\":30185,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:27:41Z\",\"mergedAt\":null,\"additions\":8,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp8arQ\",\"title\":\"fix(shared): use truncateWellFormed for decoded Teams nativeMeetingId in parseMeetingUrl\",\"author\":\"Kayvan-Zahiri\",\"number\":30194,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:9a92daa7f45d004cf8adfbaa2d75b78b8163a0b6 --\u003e\\n\\n## Summary\\nIn `@elizaos/shared` (`packages/shared/src/meetings.ts`):\\n`parseMeetingUrl` extracted Teams native meeting IDs from decoded URI path segments using raw `decoded.slice(0, 128)`. When percent-decoded identifiers contain multi-code-unit UTF-16 surrogate pairs at the 128-character limit, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(..., 128)` from `@elizaos/core` to generate safe Teams native meeting IDs.\\n2. Added unit tests in `packages/shared/src/meetings.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run packages/shared/src/meetings.test.ts` (8/8 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:35:13Z\",\"mergedAt\":null,\"additions\":7,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp5q0A\",\"title\":\"fix(ui): use truncateWellFormed for agent and job IDs in cloud instances views\",\"author\":\"Kayvan-Zahiri\",\"number\":30187,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:29:00Z\",\"mergedAt\":null,\"additions\":7,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBp5VsA\",\"title\":\"fix(ui): use surrogate-safe truncation in cloud moderation admin views\",\"author\":\"Kayvan-Zahiri\",\"number\":30186,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:f550360098506e007f22f4fba4290e61b02294c0 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/cloud/admin/ModerationPage.tsx`):\\nUser identifiers, admin wallet addresses, and flagged user IDs were clamped for display using raw `.slice(0, 8)`, `.slice(0, 10)`, `.slice(0, 12)`, and `.slice(-8)`. When identifiers or wallet strings contain multi-code-unit UTF-16 surrogate pairs, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed`, and `tailWellFormed` from `@elizaos/core` across all table and detail rows in `ModerationPage`.\\n\\n## Verification\\n- Verified well-formed Unicode output during moderation admin table and user detail rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:28:14Z\",\"mergedAt\":null,\"additions\":7,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABBp0-Ag\",\"title\":\"fix(ui): use truncateWellFormed for ASR error reason and TTS fetch target debug formatting\",\"author\":\"Kayvan-Zahiri\",\"number\":30171,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:17:56Z\",\"mergedAt\":null,\"additions\":7,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBlJ7ag\",\"title\":\"test(plugin-anthropic): assert the incomplete-output code on the error itself\",\"author\":\"Svector-anu\",\"number\":30149,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T09:33:08Z\",\"mergedAt\":null,\"additions\":7,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBkjwAw\",\"title\":\"fix(cloud): word-boundary the room-title intent regexes\",\"author\":\"mtcow\",\"number\":30144,\"body\":\"## Summary\\n`generateFallbackTitle` anchored every intent regex with `^(word|word|...)` and **no word boundary**, so a message merely *starting with a word that begins like an intent keyword* collapsed to a generic title: `History of the Roman Empire` hit `^hi` → `New Conversation`, `Written notes` hit `^write` → `Coding Assistance`, `Supporting evidence` hit `^support` → `Help Request`. The mistake is permanent — rooms are never retitled (#30122).\\n\\n## Fix\\nAdd `\\\\b` after each alternation so intent regexes match only whole words.\\n\\n## Verification\\n14 cases verified: the 8 regression messages (History/You were/Suppose/Heyday/Written/Supporting/Island/Dos) now get content-derived titles; 6 genuine intents (hello there, yo!, why?, please help, write a haiku, define success metrics) still map to their generic buckets.\\n\\nCloses #30122.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T08:03:52Z\",\"mergedAt\":null,\"additions\":7,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBp40ww\",\"title\":\"fix(ui): use truncateWellFormed for fallback subagent session ID in task pipeline\",\"author\":\"Kayvan-Zahiri\",\"number\":30184,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:35facddd70efb08111f2588343b687ad85b9721e --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/chat/widgets/task-pipeline.tsx`):\\n`SubagentBlock` rendered fallback subagent identifiers using raw `agent.sessionId.slice(0, 8)`. When custom or simulated session identifiers contain multi-code-unit UTF-16 surrogate pairs at the 8-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(..., 8)` from `@elizaos/core` to generate safe subagent session previews.\\n\\n## Verification\\n- Verified well-formed Unicode output during subagent activity block rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:27:01Z\",\"mergedAt\":null,\"additions\":6,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBp3HyA\",\"title\":\"fix(ui): use truncateWellFormed for string node preview in RuntimeView\",\"author\":\"Kayvan-Zahiri\",\"number\":30178,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:c1d3a232c4abae016297326d77f0429a7ee70623 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/pages/RuntimeView.tsx`):\\n`nodeSummary` formatted long string values using raw `${value.slice(0, 100)}...`. When strings exceed 100 characters and contain multi-code-unit UTF-16 surrogate pairs at the 100-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 100)` from `@elizaos/core` to ensure safe truncation.\\n\\n## Verification\\n- Verified well-formed Unicode output during runtime debug tree node preview rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:23:07Z\",\"mergedAt\":null,\"additions\":6,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp1fZA\",\"title\":\"fix(ui): use truncateWellFormed for fallback avatar and logo initials\",\"author\":\"Kayvan-Zahiri\",\"number\":30174,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:19:12Z\",\"mergedAt\":null,\"additions\":6,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBqiFUA\",\"title\":\"fix(plugin-wallet): use surrogate-safe truncation in shortenAddress in birdeye utils\",\"author\":\"Kayvan-Zahiri\",\"number\":30207,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:7758af0edb1ce5c3b666fa317540562538e60691 --\u003e\\n\\n## Summary\\nIn `@elizaos/plugin-wallet` (`plugins/plugin-wallet/src/analytics/birdeye/utils.ts`):\\n`shortenAddress` abbreviated addresses using raw `${address.slice(0, 6)}...${address.slice(-4)}`. When non-standard or simulated wallet addresses contain multi-code-unit UTF-16 surrogate pairs at head or tail boundaries, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed(..., 6)`, and `tailWellFormed(..., 4)` from `@elizaos/core` to generate safe shortened addresses.\\n\\n## Verification\\n- Verified well-formed Unicode output during Birdeye token market and search address formatting.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:01:08Z\",\"mergedAt\":null,\"additions\":5,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBp6KUA\",\"title\":\"fix(ui): use truncateWellFormed in normalizeBaseUrl in client-base\",\"author\":\"Kayvan-Zahiri\",\"number\":30189,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:62e00ba1766436731722507cea988b393a47e28e --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/api/client-base.ts`):\\n`normalizeBaseUrl` clamped input base URLs using raw `value?.slice(0, 4096)`. When malformed or custom URLs contain multi-code-unit UTF-16 surrogate pairs at the 4096-character limit, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 4096)` from `@elizaos/core` to ensure safe normalization.\\n\\n## Verification\\n- Verified well-formed Unicode output during base URL sanitization in `normalizeBaseUrl`.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:30:09Z\",\"mergedAt\":null,\"additions\":5,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBjg26g\",\"title\":\"fix(cloud): reuse bounded recovery evidence directory\",\"author\":\"lalalune\",\"number\":30134,\"body\":\"## Summary\\n\\nMain-side companion for #30133. It carries byte-identical trusted recovery policy bytes so production can consume only the independently certified develop policy.\\n\\nRefs #30130.\\n\\n## Hard ordering gate\\n\\n**Do not merge until #30133 has a write-access approval, is merged to `develop`, and its exact merged develop tree receives a successful immutable staging release certificate.** The production dispatch must use that exact certified develop policy SHA.\\n\\n## Verification\\n\\n- All five trusted policy blob IDs are byte-identical to develop candidate `1e01e1c2adf4ee2cffd4915b71590c6abeac1e20`.\\n- Focused certification/admission suites: 63/63 PASS.\\n- actionlint: PASS.\\n- `git diff --check`: PASS.\\n\\nNo Cloudflare binding, database row, tenant, Worker, billing, or deployment mutation is included.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T04:51:09Z\",\"mergedAt\":\"2026-08-31T06:21:18Z\",\"additions\":5,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBjcfEg\",\"title\":\"fix(cloud): reuse bounded recovery evidence directory\",\"author\":\"lalalune\",\"number\":30133,\"body\":\"## Summary\\n\\nMakes the bounded production Hyperdrive recovery authority directory idempotent across its sequential Cloudflare and Railway evidence steps. The Railway step currently fails before any mutation because the prior step already created the shared private directory.\\n\\nRefs #30130.\\n\\n## Evidence\\n\\n- Reproduced in protected recovery run `33357391241`: Cloudflare authority passed; Railway capture failed on `mkdir: File exists`.\\n- Both authority steps now use `install -d -m 0700`, preserving private permissions while allowing the second step to reuse the directory.\\n- Regression assertion requires both idempotent directory initializations.\\n- Focused certification/admission suites: 63/63 PASS.\\n- actionlint: PASS.\\n- Biome: PASS.\\n- `git diff --check`: PASS.\\n\\nAfter merge, the exact develop tree will be deployed to staging to obtain the immutable recovery-policy certificate before byte-identical promotion to `main`.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T04:35:44Z\",\"mergedAt\":null,\"additions\":5,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp4XDg\",\"title\":\"fix(ui): use truncateWellFormed for segment base keys in MessageContent\",\"author\":\"Kayvan-Zahiri\",\"number\":30182,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:f1c2b08d7dfd533285f3ce9316678a5b17c884af --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/chat/MessageContent.tsx`):\\nSegment base keys for message body rendering clamped segment content using raw `.slice(0, 80)` for `text`, `code`, and `ui` segments. When segment content contains multi-code-unit UTF-16 surrogate pairs at the 80-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed` from `@elizaos/core` to generate safe segment base keys.\\n\\n## Verification\\n- Verified well-formed Unicode output during message segment key derivation and rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:25:57Z\",\"mergedAt\":null,\"additions\":4,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBp2Y3w\",\"title\":\"fix(plugin-computeruse): use truncateWellFormed for session kind label formatting\",\"author\":\"Kayvan-Zahiri\",\"number\":30176,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:c2ff0c7445c3dd65b86dcf59e34645e6c325f6fd --\u003e\\n\\n## Summary\\nIn `@elizaos/plugin-computeruse` (`plugins/plugin-computeruse/src/views/ComputerUseSessionsView.tsx`):\\n`kindLabel` extracted session kind labels using raw `${kind.slice(0, 1).toUpperCase()}${kind.slice(1)}`. When session kind strings begin with multi-code-unit UTF-16 surrogate pairs, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 1)` from `@elizaos/core` to extract the initial grapheme/code-unit safely without splitting astral surrogate pairs.\\n\\n## Verification\\n- Verified well-formed Unicode output during session kind label formatting.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:21:21Z\",\"mergedAt\":null,\"additions\":4,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp1NkQ\",\"title\":\"fix(ui): use truncateWellFormed for table monograms in DatabaseView\",\"author\":\"Kayvan-Zahiri\",\"number\":30173,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:2a105cde37ba142535a3f564842245e7cbf291d1 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/pages/DatabaseView.tsx`):\\nRail item icons and sidebar item icons for database tables extracted table monograms using raw `table.name.slice(0, 1).toUpperCase()` and `t.name.slice(0, 1).toUpperCase()`. When table names begin with multi-code-unit UTF-16 surrogate pairs, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Replaced raw `.slice(0, 1)` with `truncateWellFormed(toWellFormedUnicode(...), 1)` from `@elizaos/core`.\\n\\n## Verification\\n- Verified well-formed Unicode output in table rail item and sidebar item monogram rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:18:33Z\",\"mergedAt\":null,\"additions\":4,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBihK0g\",\"title\":\"fix(cloud-e2e): bind mock ports atomically\",\"author\":\"hermesagent270-commits\",\"number\":30119,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T00:45:22Z\",\"mergedAt\":\"2026-08-31T22:40:09Z\",\"additions\":4,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABBqiWJw\",\"title\":\"fix(plugin-wallet): use surrogate-safe truncation for vault and token names in SteerLiquidityService\",\"author\":\"Kayvan-Zahiri\",\"number\":30208,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:01:46Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBp-nDA\",\"title\":\"fix(agent): use truncateWellFormed for stepId in reportLateTrajectoryCapture\",\"author\":\"Kayvan-Zahiri\",\"number\":30202,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:1fcefb2d28917bda4ca859f27215c9e5ac1dfeca --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/runtime/trajectory-storage.ts`):\\n`reportLateTrajectoryCapture` formatted trajectory step diagnostic details using raw `stepId.slice(0, 12)`. When step identifiers contain multi-code-unit UTF-16 surrogate pairs at the 12-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(..., 12)` from `@elizaos/core` to generate safe step diagnostic logs.\\n\\n## Verification\\n- Verified well-formed Unicode output during trajectory diagnostic capture reporting.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:40:23Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp99eg\",\"title\":\"fix(agent): use surrogate-safe truncation for short wallet addresses in agent-status-routes\",\"author\":\"Kayvan-Zahiri\",\"number\":30199,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:6d87c76db99ef2c04328c4b38dd8b4a3fbd9efe9 --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/api/agent-status-routes.ts`):\\n`handleAgentStatusRoutes` formatted short EVM and Solana wallet address responses (`evmAddressShort` and `solanaAddressShort`) using raw `.slice(0, 6)`, `.slice(0, 4)`, and `.slice(-4)`. When test keys or custom wallet addresses contain multi-code-unit UTF-16 surrogate pairs at head or tail boundaries, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed`, and `tailWellFormed` from `@elizaos/core` to generate safe short address strings.\\n\\n## Verification\\n- Verified well-formed Unicode output during agent status route wallet payload construction.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:38:48Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBp9hoA\",\"title\":\"fix(agent): use truncateWellFormed for cloudApiKeyFingerprint in runtime/eliza\",\"author\":\"Kayvan-Zahiri\",\"number\":30197,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:c9a181a9dc5b7f7d4568359151e311728ed902d1 --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/runtime/eliza.ts`):\\n`cloudApiKeyFingerprint` logged cloud API key prefix fingerprints using raw `v.slice(0, 6)`. When test tokens or custom cloud credentials contain multi-code-unit UTF-16 surrogate pairs at the 6-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(v, 6)` from `@elizaos/core` to generate safe fingerprint logs.\\n\\n## Verification\\n- Verified well-formed Unicode output during runtime cloud configuration logging and fingerprint derivation.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:37:43Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp6lsA\",\"title\":\"fix(ui): use truncateWellFormed for execution IDs in WorkflowEditor\",\"author\":\"Kayvan-Zahiri\",\"number\":30190,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:89ac6fe300b44047de9b6ed58b7f977e29e9a8c4 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/pages/WorkflowEditor.tsx`):\\n`WorkflowEditor` formatted execution run identifiers in the sidebar runs list and header detail view using raw `execution.id.slice(0, 12)` and `selectedRun.id.slice(0, 12)`. When execution identifiers contain multi-code-unit UTF-16 surrogate pairs at the 12-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(..., 12)` from `@elizaos/core` to generate safe execution ID previews.\\n\\n## Verification\\n- Verified well-formed Unicode output during workflow execution runs list and inspector header rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:31:06Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp4l3g\",\"title\":\"fix(ui): use truncateWellFormed for error detail preview in ModelDownloadWidget\",\"author\":\"Kayvan-Zahiri\",\"number\":30183,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:8e692bbe92ca2181a91669f9840a2f09a8239df1 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/chat/widgets/model-download.tsx`):\\n`truncateDetail` clamped error detail previews using raw `${trimmed.slice(0, 39)}…`. When error messages or localized strings contain multi-code-unit UTF-16 surrogate pairs around the 39-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 39)` from `@elizaos/core` to generate safe error detail previews.\\n\\n## Verification\\n- Verified well-formed Unicode output during model download tile error state rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:26:27Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp4A-A\",\"title\":\"fix(ui): use truncateWellFormed for connector account initials in ConnectorAccountCard\",\"author\":\"Kayvan-Zahiri\",\"number\":30181,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:9544572d20fa79089f2d91a0c31b907b6ff1cc0e --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/connectors/ConnectorAccountCard.tsx`):\\n`initials` extracted initials for connector accounts using `part.charAt(0).toUpperCase()`. When account labels start with multi-code-unit UTF-16 surrogate pairs (e.g. emoji avatars or international symbols), `charAt(0)` sliced only the leading high surrogate, creating a broken lone surrogate.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(part, 1)` from `@elizaos/core` to extract initial graphemes/code units safely.\\n\\n## Verification\\n- Verified well-formed Unicode output during connector account card initials generation.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:25:12Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp-Y8Q\",\"title\":\"fix(agent): use truncateWellFormed for safeDisplay in validateSkillId in server-helpers-config\",\"author\":\"Kayvan-Zahiri\",\"number\":30201,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:572c7a4b9570778d70df01d74eab815c2aab42b5 --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/api/server-helpers-config.ts`):\\n`validateSkillId` formatted error response preview strings using raw `skillId.slice(0, 80)`. When invalid skill IDs contain multi-code-unit UTF-16 surrogate pairs at the 80-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(..., 80)` from `@elizaos/core` to generate safe error message displays.\\n\\n## Verification\\n- Verified well-formed Unicode output during invalid skill identifier error sanitization.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:39:52Z\",\"mergedAt\":null,\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp-JLA\",\"title\":\"fix(agent): use surrogate-safe truncation for tokenFingerprint in server-helpers-auth\",\"author\":\"Kayvan-Zahiri\",\"number\":30200,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:2ef66531b756b7d701d7750944a820868204d372 --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/api/server-helpers-auth.ts`):\\n`ensureApiTokenForBindHost` generated token log fingerprints using raw `${generated.slice(0, 4)}...${generated.slice(-4)}`. When random tokens contain multi-code-unit UTF-16 surrogate pairs at head or tail boundaries, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed(..., 4)`, and `tailWellFormed(..., 4)` from `@elizaos/core` to generate safe token fingerprints.\\n\\n## Verification\\n- Verified well-formed Unicode output during server auth bootstrap token fingerprint logging.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:39:17Z\",\"mergedAt\":null,\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp57CA\",\"title\":\"fix(ui): use truncateWellFormed for iOS conversation titles in handleIosLocalAgentRequest\",\"author\":\"Kayvan-Zahiri\",\"number\":30188,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:b259dc95fb12e20ecc1e9304068bde7decd3ecf4 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/api/ios-local-agent-kernel.ts`):\\n`handleIosLocalAgentRequest` derived default conversation titles from first messages using raw `text.slice(0, 60)`. When first user messages contain multi-code-unit UTF-16 surrogate pairs at the 60-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `truncateWellFormed(toWellFormedUnicode(text), 60)` from `@elizaos/core` to generate safe conversation titles.\\n\\n## Verification\\n- Verified well-formed Unicode output during iOS local agent webview kernel conversation title derivation.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:29:36Z\",\"mergedAt\":null,\"additions\":2,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp3saw\",\"title\":\"fix(ui): use truncateWellFormed for fallback column type badges in database-utils\",\"author\":\"Kayvan-Zahiri\",\"number\":30180,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:59b66e854c2ed8ef72e511c9e90c53a71746f3b8 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/pages/database-utils.tsx`):\\n`typeLabel` extracted fallback database column type labels using raw `type.slice(0, 6)`. When custom or dialect-specific column types contain multi-code-unit UTF-16 surrogate pairs at the 6-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `truncateWellFormed(toWellFormedUnicode(type), 6)` from `@elizaos/core` to ensure safe truncation.\\n\\n## Verification\\n- Verified well-formed Unicode output during fallback database column type badge rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:24:28Z\",\"mergedAt\":null,\"additions\":2,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBkKC_Q\",\"title\":\"fix(cloud): securely shred read-only recovery evidence\",\"author\":\"lalalune\",\"number\":30141,\"body\":\"Fix the bounded production Hyperdrive recovery cleanup so GNU shred can securely delete the trusted admission script after it is intentionally chmod 0500.\\n\\nThe live bounded-recovery run passed policy, database identity, and migration-ledger admission, then failed before mutation because `shred -u` could not open that read-only evidence file. `shred -f -u` changes permissions as needed before overwriting and unlinking.\\n\\nValidation:\\n- `bun test packages/cloud/scripts/staging-release-certification.test.mjs` (34 pass)\\n- `actionlint .github/workflows/cloud-cf-release.yml`\\n- `git diff --check`\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T07:01:16Z\",\"mergedAt\":\"2026-08-31T07:06:04Z\",\"additions\":2,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBjVeYw\",\"title\":\"fix(cloud): restore production Hyperdriv
