escaping.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11438\"\u003e#11438\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/3133ffa9ae6beaa3c4464edac60de47d5c6f6426\"\u003e\u003ccode\u003e3133ffa\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/8294\"\u003e#8294\u003c/a\u003e: an Astro expression holding only a comment is no longer reported as a parse error, which also stopped the whole file from being formatted.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;div\u0026gt;{/* a note */}\u0026lt;/div\u0026gt;\n\u0026lt;div class={/* a note */}\u0026gt;x\u0026lt;/div\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/9165\"\u003e#9165\u003c/a\u003e: an empty Astro expression such as \u003ccode\u003e\u0026lt;div\u0026gt;{}\u0026lt;/div\u0026gt;\u003c/code\u003e no longer fails to parse. Astro renders \u003ccode\u003e{}\u003c/code\u003e as nothing.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed Astro expressions containing a comment failing to parse.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;div\u0026gt;{/* block comment */ x}\u0026lt;/div\u0026gt;\n\u0026lt;div\u0026gt;{/* only a comment */}\u0026lt;/div\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Added support for Astro's fragment shorthand.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e\u0026lt;\u0026gt;\n  \u0026lt;p\u0026gt;a\u0026lt;/p\u0026gt;\n\u0026lt;/\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u003ccode\u003e8f7786f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed an Astro frontmatter block being cut short by a closing tag inside a string or comment.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e---\nconst a = \u0026quot;\u0026lt;/script\u0026gt;\u0026quot;;\n// \u0026lt;/script\u0026gt; in a comment\n---\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11403\"\u003e#11403\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/8f7786ff62aef61cf75a91e1604cd380456a60f4\"\u003e\u0 \u003ev6.10.0\u003c/h2\u003e\n\u003ch3\u003eMinor Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e51c2733: Expose the optional legacy authentication cache for Verdaccio 6.x through \u003ccode\u003eserver.legacyAuthCache\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThis feature is intended for performance-sensitive installations that still use legacy bearer tokens. When enabled, Verdaccio caches successful legacy token authentication results for a short period of time, so repeated requests using the same token do not need to run password verification through the authentication plugin every time. Concurrent requests for the same legacy token can also share the same in-flight authentication result.\u003c/p\u003e\n\u003cp\u003eThe cache is disabled by default, so existing installations keep their current authentication behavior unless they explicitly opt in. Basic authentication is not cached. If the cache is enabled, changed or revoked credentials may remain valid until the cached entry expires.\u003c/p\u003e\n\u003cp\u003eEnable it in \u003ccode\u003econfig.yaml\u003c/code\u003e:\u003c/p\u003e\n\u003cpre lang=\"yaml\"\u003e\u003ccode\u003eserver:\n  legacyAuthCache:\n    enabled: true\n    ttlMs: 15000\n    maxEntries: 1000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOptions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eenabled\u003c/code\u003e: enables the legacy token authentication cache. Default: \u003ccode\u003efalse\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ettlMs\u003c/code\u003e: time in milliseconds before a cached validation expires. Default: \u003ccode\u003e15000\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emaxEntries\u003c/code\u003e: maximum number of cached legacy tokens. Default: \u003ccode\u003e1000\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSee \u003ca href=\"https://redirect.github.com/verdaccio/verdaccio/pull/6147\"\u003e#6147\u003c/a\u003e and the original 8.x backport in \u003ca href=\"https://redirect.github.com/verdaccio/verdaccio/pull/6143\"\u003e#6143\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev6.9.3\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e3c8f391: Reject wildcard characters in package and tarball path validation.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eebc08ba: Update verdaccio dependencies to the \u003ccode\u003elatest\u003c/code\u003e npm dist-tag (\u003ccode\u003e@verdaccio/ui-theme\u003c/code\u003e tracks \u003ccode\u003enext-9\u003c/code\u003e):\u003c/p\u003e\n\u003cp\u003eThis dependency refresh includes \u003ccode\u003e@verdaccio/package-filter\u003c/code\u003e \u003ccode\u003e13.2.0\u003c/code\u003e with \u003ccode\u003eexcludeDeprecated\u003c/code\u003e support from \u003ca href=\"https://redirect.github.com/verdaccio/verdaccio/pull/6142\"\u003e#6142\u003c/a\u003e by \u003ca href=\"https://github.com/jotadeveloper\"\u003e\u003ccode\u003e@​jotadeveloper\u003c/code\u003e\u003c/a\u003e, based on the original work by \u003ca href=\"https://github.com/davidus27\"\u003e\u003ccode\u003e@​davidus27\u003c/code\u003e\u003c/a\u003e. It also includes the \u003ccode\u003e@verdaccio/ui-theme\u003c/code\u003e update containing the homepage action hover fix from \u003ca href=\"https://redirect.github.com/verdaccio/verdaccio/pull/6135\"\u003e#6135\u003c/a\u003e by \u003ca href=\"https://github.com/pranshuchittora\"\u003e\u003ccode\u003e@​pranshuchittora\u003c/code\u003e\u003c/a\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e@verdaccio/auth\u003c/code\u003e: \u003ccode\u003e8.1.1\u003c/code\u003e → \u003ccode\u003e8.1.2\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e@verdaccio/config\u003c/code\u003e: \u003ccode\u003e8.2.1\u003c/code\u003e → \u003ccode\u003e8.2.2\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e@verdaccio/core\u003c/code\u00 neviction through the same executor. No public handler signature, model type, or\nregistration surface changes. Worst case is that a cross-role request or a voice\neviction now *queues* behind an in-flight native call instead of interleaving\nwith it — which is the intended correctness behavior.\n\n# Background\n\n## What does this PR do?\n\nThe AOSP fused text loader owns **one** native context that holds exactly one\nmodel (chat or embedding) at a time. `makeLoaderLifecycle` originally shared a\nsingle `inflight` promise across **both** roles, so when nothing was resident\n(fresh boot, or after any `markEvicted()` from the idle-unloader or a voice\neviction) and two different-role requests arrived concurrently, the second\n`loadRole()` hit `if (inflight) return inflight;`, awaited the **other** role's\nload, and then ran its native call against the wrong GGUF — a chat completion\nexecuting against the embedding model (garbage text), or a `TEXT_EMBEDDING` call\nrunning against the chat model (semantically wrong vectors persisted into the\nmemory/vector store). This is reachable in normal operation because the\nembedding handler is **not** behind the process-wide inference priority gate, so\na memory-indexing embedding and a chat generate genuinely run concurrently\n(#30147).\n\nReview (`@ss251`, `@attentionhead`) then showed that serializing the *loads*\nalone was insufficient: `ensureXLoaded()` resolved the instant `loadModel()`\nreturned, while the native `generate()`/`embed()` ran **outside** any lock, so a\ndifferent-role load could still swap the single mutable context **mid-inference**.\n`@attentionhead`'s probe captured it directly — a completion that started on\n`eliza-1-chat.gguf` finished with `bge-embedding.gguf` swapped in underneath it.\n\n## The fix (final head `c5cd7d03`)\n\n1. **Serialize the whole load-plus-use transaction.** `makeLoaderLifecycle` now\n   runs every context mutation through a single serial executor `runOnContext`\n   (`contextChain.then(task, task)`). `withChat()` / `withEmbedding()` wrap the\n   optional role load-swap **and** the `generate()`/`embed()` that consumes it in\n   one critical section (`withRole`); `generateOnPriorityLane` and\n   `makeEmbeddingHandler` go through them. `ensureChatLoaded` /\n   `ensureEmbeddingLoaded` remain for pure prewarm loads and are serialized on\n   the same executor, so a prewarm can't swap mid-call either. A concurrent\n   cross-role load can no longer interleave with an in-flight native call.\n2. **Serialize the out-of-band voice eviction.** `evict()` runs the\n   `loader.unloadModel()` that the voice ASR/TTS path uses to reclaim RAM through\n   the **same** executor, so it waits behind any in-flight `generate()`/`embed()`\n   instead of freeing the native context out from under it. `markEvicted()` (the\n   idle-unloader seam that already gates on #11760 in-flight tracking) is\n   preserved for the path that cannot join the executor.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo. This is an internal native-context concurrency fix with no user-facing API,\nconfig, or model-registration change.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-native-inference/__tests__/aosp-crossrole-load-guard.test.ts` —\nfive regression cases that drive the **real registered** `TEXT_LARGE` /\n`TEXT_EMBEDDING` handlers via `ensureAospLocalInferenceHandlers` over a\ndeterministic barrier-backed `AospLoader` and a temp `STATE_DIR` manifest\nlisting both a chat and an embedding GGUF (no source-under-test mock). The\nbarrier can pin a load in flight **and** hold a `generate()`/`embed()` call open,\nand each case records the resident model when the call **returns**, so a mid-call\nswap surfaces as a wrong-model observation. Coverage: (a) no cross-role\npiggyback; (b) load-plus-use stays atomic while an embed is in flight; (c)\nsame-role concurrent dedup issues one `loadModel`; (d) an out-of-band `evict()`\nqueues behind an in-flight embed; (e) each role change reloads and runs against\nits own model.\n\n## Detailed testing steps\n\n```bash\ncd plugins/plugin-native-inference\nbun test __tests__/aosp-crossrole-load-guard.test.ts\n```\n\nAll five cases pass on the current head. Reverting `withRole` to the pre-fix\n\"load-only\" behavior (run the load on the executor but return `use()` **outside**\nit) flips the atomicity and eviction cases to fail with a cross-role\n`loadModel` firing mid-call (`Received +1`) — see **Evidence Details**.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\u003c!-- evidence-head:c5cd7d03fada0a483fa32a6675bb5f17d8869398 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no UI surface. plugin-native-inference is a headless Node/native model-loader bootstrap; no rendered view changed.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - no UI surface. See above.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - no UI/user flow. Correctness is a native-context concurrency invariant, proven by the failing-before/passing-after bun test inlined under Evidence Details.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] `N/A - no standalone HTTP server path; the change is in the fused model-loader lifecycle. The real registered-handler lifecycle logs (load / reload / serialized eviction) are inlined under Evidence Details below.`\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] `N/A - no frontend/browser request path. Headless native-inference loader module.`\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] `N/A - no prompt/model/provider contract change; the fix serializes the native model-context load-plus-use lifecycle and the handler input/output contracts are unchanged. The harness drives the real registered handlers with a deterministic barrier-backed loader (no live GGUF is available in this environment), so there is no live model trajectory to record.`\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - the domain artifact is the failing-before (load-only mutant) / passing-after bun regression output, inlined under Evidence Details below. A fork contributor cannot mint gate-accepted GitHub attachment URLs from this headless environment: no push access to the pr-evidence release, and the user-attachments upload path requires a browser session.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] `N/A - no rendered visual surface.`\n\n# Evidence Details\n\n## Real LLM-call trajectory\n\n`N/A - no agent/action/provider/prompt/model behavior change.` The registered\n`TEXT_LARGE`/`TEXT_EMBEDDING` handler contracts are unchanged; only the\nloader-lifecycle serialization they run through is corrected. The regression\nharness drives those real handlers with a deterministic barrier-backed loader\nbecause no live GGUF is available in this environment.\n\n## Domain artifact — failing-before / passing-after regression (bun test)\n\n`aosp-crossrole-load-guard.test.ts` passes on head (5 pass / 0 fail). Reverting\n`withRole` to the pre-fix load-only behavior — `await runOnContext(load); return use();`\nso the native call runs **outside** the serial transaction — makes the\natomicity and eviction cases fail: a cross-role `loadModel` fires while the embed\nis still in flight (`Received +1`), exactly the wrong-model swap the review\nraised.\n\n\u003cdetails\u003e\n\u003csummary\u003eAFTER (head c5cd7d03) — 5 pass / 0 fail\u003c/summary\u003e\n\n```\n(pass) AOSP fused loader cross-role in-flight guard (#30147) \u003e loads the chat model for a chat request racing an in-flight embedding load (no cross-role piggyback)\n(pass) AOSP fused loader cross-role in-flight guard (#30147) \u003e keeps load-plus-use atomic: an arriving chat request cannot swap the native context while an embedding call is still running\n(pass) AOSP fused loader cross-role in-flight guard (#30147) \u003e dedups concurrent same-role embedding loads onto a single native load\n(pass) AOSP fused loader cross-role in-flight guard (#30147) \u003e routes an out-of-band eviction through the context executor so the unload waits behind an in-flight embed instead of dropping the model mid-call\n(pass) AOSP fused loader cross-role in-flight guard (#30147) \u003e reloads the single native context on every role change, each call running against its own model\n 5 pass\n 0 fail\n 23 expect() calls\nRan 5 tests across 1 file.\n```\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eBEFORE (load-only mutant: use() outside the serial section) — 3 pass / 2 fail\u003c/summary\u003e\n\n```\n# Diff applied to withRole():\n#   -    return runOnContext(async () =\u003e {\n#   -      if (currentRole !== role) { await performRoleLoad(role); }\n#   -      return use();\n#   -    });\n#   +    await runOnContext(async () =\u003e {\n#   +      if (currentRole !== role) { await performRoleLoad(role); }\n#   +    });\n#   +    return use();\n\n(pass) ... no cross-role piggyback\n- Expected  - 0\n+ Received  + 1\n(fail) ... keeps load-plus-use atomic: an arriving chat request cannot swap the native context while an embedding call is still running\n(pass) ... dedups concurrent same-role embedding loads onto a single native load\n- Expected  - 0\n+ Received  + 1\n(fail) ... routes an out-of-band eviction through the context executor so the unload waits behind an in-flight embed instead of dropping the model mid-call\n(pass) ... reloads the single native context on every role change, each call running against its own model\n 3 pass\n 2 fail\nRan 5 tests across 1 file.\n```\n\u003c/details\u003e\n\n## Backend + runtime lifecycle logs\n\nReal registered `eliza-aosp-llama` lifecycle logs emitted during the cross-role\ntest at head — load / reload ordering on the single native context:\n\n\u003cdetails\u003e\n\u003csummary\u003e[aosp-local-inference] lifecycle logs (excerpt)\u003c/summary\u003e\n\n```\n[aosp-local-inference] building fused text loader…\n[aosp-local-inference] fused text loader ready\n[aosp-local-inference] registered eliza-aosp-llama handlers for TEXT_SMALL / TEXT_LARGE / TEXT_EMBEDDING / TEXT_TO_SPEECH (priority 0, text backend fused-libelizainference)\n[aosp-local-inference] Loading bundled embedding model: bge-embedding.gguf\n[aosp-local-inference] Loaded embedding model (path=.../models/bge-embedding.gguf)\n[aosp-local-inference] Loading bundled chat model: eliza-1-chat.gguf\n[aosp-local-inference] Loaded chat model (path=.../models/eliza-1-chat.gguf)\n```\n\u003c/details\u003e\n\n## Pre-existing failure isolation\n\nThe full package suite is **94 pass / 2 fail**; the only unique failing case,\n`generateOnPriorityLane — lock priority (#11914) \u003e rejects an unsupported background output request before the loader`,\nfails **identically on the PR base source** (`9b93ec4374`), so it is **not**\nintroduced by this PR (independently re-confirmed by `@attentionhead` at prior\nheads).\n\n\u003cdetails\u003e\n\u003csummary\u003einference-priority-lane.test.ts — head vs base source (same 3 pass / 1 fail)\u003c/summary\u003e\n\n```\n-- head source (c5cd7d03) --\n(pass) dispatches an interactive turn ahead of an earlier queued background job\n(fail) rejects an unsupported background output request before the loader\n(pass) never rewrites an interactive turn\n(pass) background job that cannot get the lane within its bounded wait fails typed and never reaches the loader\n 3 pass / 1 fail\n\n-- base source (9b93ec4374, pre-feature) --\n(fail) rejects an unsupported background output request before the loader   ← same failure on base\n 3 pass / 1 fail\n```\n\u003c/details\u003e\n\n## Owning-package gates (head c5cd7d03)\n\n```\n$ bun run --cwd plugins/plugin-native-inference typecheck   → clean (tsc --noEmit)\n$ bun run --cwd plugins/plugin-native-inference lint:check   → clean (biome, 20 files)\n$ bun run --cwd plugins/plugin-native-inference format:check →  PR targets `develop` and is rebased onto the latest `origin/develop` with zero conflicts.\n- [x] `bun install` was run after sync. Package-scoped gates (test/typecheck/lint/build/format) pass; see logs below. Full `bun run verify` is a repo-wide gate not run here (see Known gaps).\n- [x] A reviewer can confirm the change works without reading the code, from the before/after reproduction and test evidence below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop`; zero conflicts (0 commits behind at push).\n- [ ] `bun run verify` passes post-sync — the repo-wide gate was not executed on this constrained machine; the owning package's full gate suite passed (see **Known gaps / failures**).\n\n# Risks\n\nLow. The change is confined to `WakeWordGate` in the Web Speech fallback of a single opt-in Capacitor plugin (`plugins/plugin-native-swabble`). It has no elizaOS runtime integration and ships no `Plugin` object. The word-boundary rule is strictly more conservative than the previous substring rule: it can only *reject* firings that previously fired; every previously-valid whitespace/punctuation-delimited command still fires (proved by the 11 pre-existing tests, including the three non-Latin locales, remaining green).\n\n# Background\n\n## What does this PR do?\n\nThe Web Speech fallback's wake-word gate (`WakeWordGate.match` / `hasTrigger` in `plugins/plugin-native-swabble/src/web.ts`) located the trigger with a bare `normalizedTranscript.indexOf(trigger)` and accepted the match with no word-boundary check. Any transcript that merely *contained* the trigger as a substring fired a `wakeWord` event and dispatched the trailing text as a command.\n\n- Speaking **\"elizabeth opened the door\"** (trigger `\"eliza\"`) emitted `{ wakeWord: \"eliza\", command: \"beth opened the door\" }` — the assistant activated and executed a garbled command the user never issued.\n- Common English words tripped it too: **\"they\"** fired trigger `\"hey\"`; any word starting with the trigger fired.\n\nThis defeated the purpose of a wake-word gate: it must not act unless the wake word is actually spoken as a distinct token.\n\n**Fix:** `WakeWordGate` now builds a per-trigger Unicode word-boundary matcher — `(?\u003c![\\p{L}\\p{N}\\p{M}])\u003cescaped-trigger\u003e(?![\\p{L}\\p{N}\\p{M}])` with the `u` flag — and uses the regex match index as the trigger position. Combining marks (`\\p{M}`) are token constituents on both sides, so a decomposed accent adjacent to the trigger keeps it inside its host word (e.g. trigger `\"e\"` does not fire inside the NFD form of `\"éclair\"`). The existing command slice and `minCommandLength` check are preserved unchanged, so the command still begins immediately after the standalone trigger token. `hasTrigger` uses the same boundary rule so a triggerless substring word (e.g. \"elizabeth\") is no longer retained in the carry-over buffer.\n\n**Script-aware boundary (documented in the `WakeWordGate` header):** in space-delimited scripts the trigger must be a standalone token, so `\"elizabeth\"` never fires `\"eliza\"`. Continuous scripts (Japanese, Chinese, Thai, …) write the command directly after the trigger with no whitespace, so an adjacent letter also satisfies the boundary there; without this relaxation the wake word could never fire in those scripts — a strictly worse failure than the substring over-firing this PR fixes. The residual cost is that a trigger which is a prefix of a longer continuous-script word (e.g. `\"エリザ\"` inside `\"エリザベス\"`) still fires, matching the prior substring behavior, because text alone cannot segment those words. Matchers are case-insensitive and run against the original transcript, so the match index aligns with the sliced string even when case folding changes length (U+0130).\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nThe `WakeWordGate` in-code header was updated to document the boundary contract and the CJK tradeoff. No external docs describe the substring behavior, so no other doc change is required.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-native-swabble/src/web.test.ts` — new cases exercise the corrected contract against the real `SwabbleWeb` state machine with deterministic browser-API doubles (no mocking of the system under test):\n\n1. **substring non-fire** — \"elizabeth opened the door\" emits no `wakeWord` (the exact reproduction from the issue);\n2. **standalone fire** — \"eliza open calendar\" still emits `{ wakeWord: \"eliza\", command: \"open calendar\" }`;\n3. **prefix-word non-fire** — trigger \"hey\" does not fire on \"they left the room\";\n4. **punctuation-delimited fire** — \"eliza, open calendar\" still fires (command retains the leading comma — pre-existing whitespace-only trim behavior, asserted honestly);\n5. **carry-over buffer drop** — a triggerless substring word (\"elizabeth spoke\") followed by an unrelated final (\"open calendar\") emits no `wakeWord`;\n6. **continuous-script fire (review)** — `ja-JP`/`zh-CN`/`th-TH` transcripts where the command abuts the trigger with no space (`\"エリザカレンダーを開いて\"`, `\"你好打开日历\"`, `\"สวัสดีเปิดปฏิทิน\"`) still fire, guarding the false-negative that a strict boundary would introduce;\n7. **match-index pin (review)** — `\"elizabeth and eliza open calendar\"` yields command `\"open calendar\"`, pinning the boundary match index against a raw `indexOf` that would anchor inside `\"elizabeth\"`;\n8. **metacharacter trigger (review)** — a trigger `\"hey(\"` constructs and matches as a literal, guarding the `escapeRegExp` call from a `new RegExp` `SyntaxError`;\n9. **case-fold index (review)** — `\"İİ eliza open calendar\"` slices `\"open calendar\"`, proving the match index stays aligned when case folding changes length.\n\nThe pre-existing non-Latin space-delimited cases and the other suite tests remain unchanged and green (32 total).\n\n## Detailed testing steps\n\ iden the change to cover them — the blast radius is smaller than \"code isn't protected\" would suggest.\n- **Escaping had to move.** `escapeSlackMrkdwn` previously reached code bodies, and Slack *does* render raw `\u0026`, `\u003c` and `\u003e` inside a fence. Lifting the body out would have silently dropped that escaping, so the body is escaped at lift-out time instead, with a test pinning it.\n\n## Tests\n\nRed before / green after, and the whole plugin is 176/176.\n\n## Note on `bun run verify`\n\nThe run reports `EXIT=1` from `@elizaos/plugin-pdf#typecheck` — `Cannot find module '@napi-rs/canvas'`, an optional native dependency my `--ignore-scripts` install skipped. Reproduced identically on clean `develop` with zero changes from me, so it is pre-existing and unrelated. `plugin-slack` itself is fully green in the same run. Flagging it rather than reporting the gate green.\n"])</script><script>self.__next_f.push([1,"25:T2b6f,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #30121\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop`; the branch is currently conflict-free against\n      `origin/develop` (GitHub reports `MERGEABLE` / `CLEAN`).\n- [x] `bun install` was run; the owning package's test, typecheck, and lint pass\n      (see **Testing** and the inlined before/after evidence).\n- [x] A reviewer can confirm the change works without reading the code, from the\n      failing-before / passing-after vitest output inlined under **Evidence\n      Details** and the green **All Tests Passed** CI job at this head.\n\n# Sync with develop\n\n- [x] Branch is mergeable with the latest `origin/develop` (`bc84c05273`); GitHub\n      merge state is `CLEAN`, so no rebase was required for this evidence update.\n- [x] Owning-package gates pass. Full-repo `bun run verify` was not run on this\n      constrained device — see **Known gaps / failures**.\n\n# Risks\n\nLow. The change is confined to the hand-rolled YAML subset parser in\n`plugins/plugin-agent-skills/src/parser.ts`. It adds recognition of YAML block\nscalar headers (`|` / `\u003e` and their chomping/indent variants) and a decoder for\nthe block body. No public signature, type, or return value changes; a\n`description:` written as an ordinary inline scalar keeps its existing handling.\nWorst case for a non-block-scalar document is unchanged behavior, because the\nnew branch only fires when the value matches a block-scalar header.\n\n# Background\n\n## What does this PR do?\n\nThe `plugin-agent-skills` SKILL.md validator parses frontmatter with a small\nin-repo YAML subset parser (the plugin intentionally does not pull a full YAML\ndependency into this path). That parser treated a bare `|` or `\u003e` value the same\nas an empty value, so a real published skill written as:\n\n```yaml\n---\nname: build-modern-redux-apps\ndescription: \u003e\n  Use this skill when building Redux Toolkit apps: modeling slices,\n  wiring the store, and testing reducers.\n---\n```\n\nparsed `description` as an empty object `{}`. The enclosing frontmatter then\nresolved to `null`, and validation reported **`MISSING_FRONTMATTER`**, rejecting\na structurally valid skill (issue #30121).\n\nThis PR teaches the parser about YAML block scalars:\n\n- **`parseBlockScalarHeader`** recognizes `|` (literal) and `\u003e` (folded) plus a\n  chomping indicator (`-` strip / `+` keep / default clip) and an optional\n  explicit indentation digit (`|2`, `\u003e2`). Anything else returns `null` and\n  falls through to the previous scalar / nested-object handling.\n- **`parseBlockScalarBody`** consumes the following lines indented past the key,\n  strips the common (or explicit) indentation, and decodes the body:\n  - **literal (`|`)** keeps internal newlines verbatim;\n  - **folded (`\u003e`)** folds a single break between two equally-indented, non-blank\n    lines to one space, but preserves the breaks around **more-indented** lines\n    and around **blank** lines per YAML 1.2 §8.1.3 (so nested bullets, indented\n    snippets, and paragraph breaks survive instead of being flattened);\n  - **chomping** clip/strip/keep is applied to the trailing newline.\n\nThe decoded string is assigned to the key, so `description: \u003e` / `description: |`\nnow yields a real string and the skill validates.\n\n## Review-driven refinements\n\nThis fix was hardened across review rounds (all addressed at the current head):\n\n- **@ss251** — folding was not indentation-aware; more-indented lines were\n  flattened. Fixed in `3097e2b` with a regression test.\n- **@attentionhead** / **@hermesagent270-commits** — two folding shapes still\n  deviated from the reference `yaml` package: a blank line *after* a\n  more-indented line was swallowed, and a folded block *starting* with a blank\n  line emitted a leading space. Fixed in `37efaba` by making the fold loop\n  paragraph-aware (blank-run counting, leading-blank preservation), with two new\n  differential regression tests that match the `yaml` reference exactly.\n- **@attentionhead** M3 mutant (explicit `|2`/`\u003e2` indent had no test) — pinned\n  in `a365286`.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo. This corrects frontmatter parsing for an already-documented SKILL.md format;\nno user-facing API or config changes.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-agent-skills/src/parser.validation.test.ts` — the\n`YAML block scalar descriptions (issue #30121)` block adds nine cases covering\nfolded space-joining, same-indent key continuation (no line swallowing), literal\n`|` newline preservation, more-indented line breaks, explicit `|2` indent,\nblank-line-after-more-indented paragraph breaks, leading-blank preservation,\n`\u003e-` strip chomping, and the end-to-end \"valid, not `MISSING_FRONTMATTER`\" case.\nSeveral fixtures were checked against the real `yaml` package as an oracle by the\nreviewers.\n\n## Detailed testing steps\n\n```bash\ncd plugins/plugin-agent-skills\nbunx vitest run src/parser.validation.test.ts   # focused\nbun run test                                     # full package suite\nbun run typecheck\n```\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\u003c!-- evidence-head:37efaba5e4343ba5710a544857b2da7ecfb6e76a --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no UI surface. Pure YAML-subset parser change in plugins/plugin-agent-skills/src/parser.ts; nothing is rendered.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - no UI surface. See above.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - no UI/user flow. Correctness is proven by the failing-before / passing-after vitest output inlined under Evidence Details.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] `N/A - no server/runtime log path. The changed code is a synchronous string parser; its real execution is the vitest output inlined under Evidence Details.`\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] `N/A - no frontend request/response path.`\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] `N/A - no agent/action/provider/prompt/model behavior change. Only SKILL.md frontmatter parsing is corrected.`\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - domain artifact is the vitest before/after reproduction, inlined under Evidence Details. This fork-contributor account lacks elizaOS/eliza push access, so it cannot mint pr-evidence release-asset URLs; logs are inlined per the template inline allowance and the same suite runs green in the All Tests Passed CI job at this head.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] `N/A - no rendered visual surface.`\n\n# Evidence Details\n\n## Real LLM-call trajectory\n\n`N/A - no agent/action/provider/prompt/model behavior change.`\n\n## Failing-before / passing-after (the domain artifact)  machine; owning-package test/lint/typecheck were run and the only failure is a pre-existing unrelated module-resolution error documented in **Known gaps**.\n\n# Risks\n\nLow. The change is confined to `MutualStakeEscrow.create()` vault-address resolution in `plugins/plugin-wallet`. It replaces a post-mine `eth_call` re-simulation with decoding the authoritative `VaultCreated` event from the mined receipt. No public type or signature changes: `EscrowCreated { address, txHash }` is unchanged. Behavior change: `create()` now **throws** a typed `ElizaError` when the factory transaction mines without a `VaultCreated` event instead of silently returning a fabricated/wrong address — a strictly safer failure on a money path.\n\n# Background\n\n## What does this PR do?\n\n`MutualStakeEscrow.create()` (public SDK, exported from `plugins/plugin-wallet/src/sdk/index.ts`) sent the factory `createEscrow` transaction, awaited the receipt, then **discarded the receipt** and obtained the vault address by re-running `createEscrow` through `publicClient.readContract` (an `eth_call`). Because the state-changing tx had already mined, that `eth_call` simulated a **second, hypothetical** deployment against the advanced factory state and returned the address the *next* `createEscrow` would produce — not the vault that was actually created. The authoritative `VaultCreated` event (whose ABI was already defined in the same file but never decoded) was ignored.\n\n**User-facing impact:** consumers received a wrong `StakeVault` address. Subsequent `fund()`/`accept()` then approve and deposit real payment + stake collateral to a contract that does not hold this escrow (or revert), directing buyer/seller funds at the wrong address — a data-integrity/contract break on a money path.\n\n**The fix:**\n- Capture the mined receipt and decode the `VaultCreated` event from `receipt.logs` with viem's `parseEventLogs`, filtered to logs whose `address === factoryAddress` so an unrelated contract cannot spoof the result. Return that log's `vault` as the deployed address.\n- Throw a typed `ElizaError` (`code: ESCROW_VAULT_CREATED_EVENT_MISSING`, severity `fatal`, with `factoryAddress`/`txHash`/`factoryLogCount` context) when no `VaultCreated` log is present — no fallback to the misleading re-simulation.\n- Remove the post-mine `readContract(\"createEscrow\")` call entirely.\n\n## What kind of change is this?\n\nBug fix (non-breaking data-integrity fix on a money path).\n\n## Scope boundary\n\nOnly `plugins/plugin-wallet/src/sdk/escrow/MutualStakeEscrow.ts` (the `create()` path) and a new focused regression test. No other escrow lifecycle methods, no type/signature changes, no other packages touched.\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The public `EscrowCreated` shape and `create()` signature are unchanged; only the correctness of the returned `address` and a new typed failure mode change.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-wallet/src/sdk/escrow/MutualStakeEscrow.create.test.ts`. It stubs the viem public/wallet clients at the RPC boundary and builds genuine `VaultCreated` logs with viem's real `encodeEventTopics`/`encodeAbiParameters`, so the SDK must actually decode them.\n\n## Detailed testing steps\n\n```bash\ncd plugins/plugin-wallet\n./node_modules/.bin/vitest run src/sdk/escrow/MutualStakeEscrow.create.test.ts\n```\n\nThe suite is **red on the pre-fix code** (the re-simulation returns `0xBbbb…` instead of the deployed `0xAAaA…`) and **green after** decoding the receipt. Cases:\n1. `create()` returns the vault from the receipt's `VaultCreated` event even when a hypothetical re-simulation would differ, and asserts the removed `readContract` path is never called.\n2. `create()` throws `ESCROW_VAULT_CREATED_EVENT_MISSING` when the receipt has no `VaultCreated` event, rather than fabricating an address.\n3. `create()` ignores a `VaultCreated` log emitted by an unrelated  latest `origin/develop` with zero conflicts.\n- [x] `bun install` was run after sync; focused package checks pass (see Testing). `bun run verify` is a full-repo gate; the affected-surface checks (focused vitest, typecheck, Biome) are recorded below and pass.\n- [x] A reviewer can confirm the change works without reading the code, from the evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop` (`9b93ec4374`); zero conflicts.\n- [x] Focused checks pass post-sync (see **Testing** / **Evidence Details**).\n\n# Risks\n\nLow, and strictly risk-reducing. The change is confined to one transport\nboundary: the inbound WebSocket `\"message\"` listener in\n`plugins/plugin-elizacloud/src/services/cloud-bridge.ts`. Valid JSON-object\nframes stay on the exact same JSON-RPC dispatch path they used before; only\nframes that are unparseable or are valid JSON but not an object (numbers,\nstrings, arrays, `null`) are now dropped with a redacted warn line instead of\neither crashing the process or being dispatched to handlers typed as\n`BridgeMessage`. No public type, export, or protocol field changes.\n\n# Background\n\n## What does this PR do?\n\n`CloudBridgeService`'s WebSocket `\"message\"` listener parsed every inbound frame\nwith an unguarded `JSON.parse(data)` (`cloud-bridge.ts:156`). undici's\n`WebSocket` is an `EventTarget` subclass, so a throw inside the listener is\nre-raised via `process.nextTick` and surfaces as an `uncaughtException`. The\nagent host installs a global `uncaughtException` handler that calls\n`process.exit(1)` (`packages/app-core/src/cli/run-main.ts:69`). Net effect: a\n**single** non-JSON text frame from the cloud gateway (protocol drift, a\nproxy-injected error page, a gateway error delivered as text, or a\nmisbehaving/compromised peer) took down the **entire agent process**, not just\nthe bridge.\n\nThis PR sanitizes the untrusted frame at the transport boundary:\n\n- Adds `parseBridgeFrame(containerId, data)`, which returns `null` for any frame\n  that is not a JSON object. The listener drops a `null` result\n  (`if (!message) return;`) before any `message.method` / `message.id` access.\n- The malformed-parse arm logs **only** the error name and byte length\n  (`SyntaxError (10 bytes)`) — never the raw bytes, and never the `SyntaxError`\n  message, which itself quotes a slice of the input. This matters because the\n  connect URL carries `?token=\u003capiKey\u003e`, so a proxy-injected error page echoing\n  that URL is exactly the frame most likely to be malformed and to contain the\n  key. This mirrors the log-redaction fix in #30159.\n- The non-object arm logs **only** the JSON shape and byte length\n  (`JSON array (21 bytes)`), never the peer bytes. The shape label special-cases\n  `null` because `typeof null === \"object\"` would otherwise mislabel a dropped\n  `null` frame as a JSON object.\n- Both handlers carry `// error-policy:J3` (untrusted-input sanitizing): an\n  invalid frame becomes an explicit dropped result, never a fake-valid message.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue), with a security-hardening\ndimension on the diagnostic log path.\n\n# Documentation changes needed?\n\nNo. The behavior is documented in the new `parseBridgeFrame` JSDoc and the\ninline `error-policy` rationale.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-elizacloud/src/services/cloud-bridge.malformed-frame.test.ts` —\nthree tests that stand up a **real `ws` server and the real undici client**,\ntemporarily capture `uncaughtException`, and assert the actual failure mode\nrather than unit-testing `JSON.parse`.\n\n## Detailed testing steps\n\n```\ncd plugins/plugin-elizacloud\nbunx vitest run src/services/cloud-bridge.malformed-frame.test.ts --reporter=verbose\n```\n\nThe three tests are:\n\n1. **drops a malformed text frame without crashing and still resolves a pending\n   request** — sends a non-JSON frame, asserts no `uncaughtException` fired, the\n   connection stays `connected`, and a subsequent valid JSON-RPC response still\n   resolves the pending request. This is the process-kill regression lock.\n2. **drops a valid-JSON but non-object frame without dispatching it to\n   handlers** — registers a handler and asserts it receives nothing for `42` and\n   `[\"not\",\"an\",\"object\"]`, locking the `typeof !== \"object\" || null ||\n   Array.isArray` branch that would otherwise deliver non-objects to\n   `BridgeMessage`-typed handlers.\n3. **never logs peer frame bytes and labels the dropped JSON shape precisely** —\n   feeds a leak marker through all arms, captures `logger.warn`, and asserts the\n   combined output omits the marker while emitting `JSON string` / `JSON null` /\n   `JSON array` and never `JSON object`. This pins both the redaction and the\n   `null`-label fix (same shape as #30159's `not.toContain(\"LEAKMARK\")`).\n\n# Evidence Gate\n\n\u003c!-- evidence-head:f1c43965d10d816326516e56c3f485d72d786e2b --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no rendered UI surface changed; this is a backend WebSocket transport-boundary parser guard with no view, component, or style diff.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - no rendered UI surface changed; this is a backend WebSocket transport-boundary parser guard with no view, component, or style diff.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - no user-facing UI flow; the changed contract is inbound frame handling, verified by the real-undici regression suite and the mutation proof in Evidence Details.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - fork contributor account cannot upload assets to the upstream pr-evidence release (HTTP 404, push access required) and cannot mint GitHub user-attachment URLs headlessly; the real focused-test run, the redacted warn output, and the red/green mutation proof are pasted inline verbati e, route, or wire contract changes.\n\n# Background\n\n## What does this PR do?\n\nThe `POST /api/apps/load-from-directory` handler scans a directory of app packages and is explicitly designed to **skip bad entries and keep going**: a missing/unreadable `package.json` (`readFile(...).catch(() =\u003e null); continue`), a manifest with no `elizaos.app` (`continue`), a manifest with no package `name` (`continue`), and invalid permissions (recorded via `recordManifestRejection` + `continue`).\n\nBut the `JSON.parse(raw)` sitting **between** those guards was unguarded. A single sibling directory containing a syntactically malformed `package.json` threw `SyntaxError`, which unwound to the route's outer `catch` and returned **HTTP 500 \"Load failed: ...\"**. Because the throw happened mid-loop, every valid app package in the same directory that had not yet been reached was silently **NOT registered** — the entire batch was lost to one corrupt manifest.\n\nThis PR wraps the parse in a `try/catch` that mirrors the existing bad-entry handling:\n\n- push a `{ directory, packageName: null, reason: \"invalid JSON: \u003cmessage\u003e\", path }` entry into `rejectedManifests`,\n- forward it through `registry.recordManifestRejection?.(...)` so callers still learn which manifest was rejected,\n- `continue` so every valid sibling app still registers.\n\nUser-facing impact: an admin loading a directory of apps no longer loses the whole batch (and gets an opaque 500) because one folder has a broken `package.json`. Valid apps register (HTTP 200, `registered: N`) and the malformed manifest is surfaced in `rejectedManifests` — matching the loop's own documented skip-and-continue design and the repository error policy (fail-fast per entry, don't abort the batch).\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes a data-integrity / error-policy defect on a real admin route).\n\n# Documentation changes needed?\n\nNo. The route's documented behavior (skip bad entries, continue) is unchanged — this PR makes the implementation match it. No doc edits required.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-app-manager/src/api/apps-routes.test.ts` — three tests exercise the changed contract against a real temp dir with a stubbed `app-registry` service (no live runtime, no credentials):\n\n1. **registers every valid sibling app when one package.json is malformed** — temp dir with `app-good` (valid `elizaos.app` manifest) + `app-bad` (`\"{ this is not json \"`). Asserts HTTP **200**, `registered: 1`, `items` = `[\"@elizaos/app-good\"]`, `register` called once with the good app, and `rejectedManifests` contains exactly the bad dir with `packageName: null`, `reason` containing `\"invalid JSON\"`, and the exact `path`. Also asserts `recordManifestRejection` was called once with the rejection plus `requesterEntityId: null` / `requesterRoomId: null`. This is the direct reproduction from the issue.\n2. **registers all apps when every manifest in the directory is valid** — regression: an all-valid directory still registers every app (`registered: 3`, no rejections, `recordManifestRejection` never called).\n3. (existing) **rejects relative app directories at the host boundary** — unchanged host-boundary guard.\n\n## Detailed testing steps\n\n```bash\ncd plugins/plugin-app-manager\n# Full owning-package route suite (18 tests):\nnode node_modules/vitest/vitest.mjs run src/api/apps-routes.test.ts --config vitest.config.ts\nbun run typecheck\nbun run lint:check\n```\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\u003c!-- evidence-head:6ea66b37b015a971b5d3ea862f23b068ae35ba34 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - backend/API-only change (route handler in plugin-app-manager); no rendered UI surface.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - backend/API-only change; no rendered UI surface.`\n\u003c!-- evidence-row:walkthrough-video --\u ase/world-metadata-cas.test.ts`, 5 tests): stale-shorter-audit retention, absent-audit retention + ordinary-key passthrough, caller-audit drop when stored has none (symmetric with `roles`), combined roles/roleSources/revision/audit pinning, and input non-mutation + detached-output clone isolation.\n- **Neighbors at head**: `roles.role-write-cas` (12), `roles.resolution`, `roles.owner-for-message`, `trust/actions/roles.cas`, `trust/actions/roles` (62 total), `dm-world-metadata` (4) — all green.\n- `bun run --cwd packages/core typecheck`: 0 errors. `biome check` on both files: clean.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto `origin/develop` at `d8c5b3124d` with zero conflicts.\n- [x] `bun install` not needed (no dependency change); package typecheck and focused suites pass as listed above.\n- [x] A reviewer can confirm the defect and fix from the reproduction, red control, and suite above without reading anything else.\n\n# Sync with develop\n\n- [x] Branched from `origin/develop` tip `d8c5b3124d`; zero conflicts.\n- [x] Focused verification rerun after commit at the final head.\n\n# Risks\n\nLow. One function's merge semantics narrow: caller-supplied `__eliza_role_audit` values were previously (incorrectly) passed through; now the stored history always wins, matching the documented invariant and the sibling `roles`/`roleSources` behavior in the same function. No adapter, wire, or migration surface changes.\n\n\u003c!-- evidence-head:725b3eddff8ea0d578f681c0c1617d9024dc6fc4 --\u003e\n\n\u003c!-- evidence-row:backend-logs --\u003e\nRebase verification at head 725b3eddff (2026-09-01T11:35Z, worktree, pinned bun 1.3.14, real install):\n```sh\n$ bun test packages/core/src/database/world-metadata-cas.test.ts\n  5 pass\n  0 fail\n  12 expect() calls\nRan 5 tests across 1 file. [103.00ms]\n\n$ bun run --cwd packages/core typecheck   # rc=0\nDone!\n\n$ bunx biome check packages/core t applied exact-integer arithmetic to the ERC-20 path.\n\nFixes #29937\n\n## Change\n\nParse the balance into wei once with `parseUnits`, run the half/max/percent arithmetic in `bigint`, and format exactly once with `formatUnits`.\n\n- `half` -\u003e `raw / 2n`\n- `max` -\u003e `(raw * 9n) / 10n`, preserving the existing 10% gas reserve exactly\n- `percent` -\u003e percentage scaled to an integer basis-of-a-million so fractional percentages stay representable, then `(raw * scaledPercent) / 100_000_000n`\n\nNative decimals come from `chainConfig.nativeCurrency.decimals`. The lookup is skipped when the balance is `undefined`, so the existing unknown-balance `EVMError` still fires first and a chain the model may have invented never reaches `getChainConfigs`.\n\n## Verification\n\nExecuted on this branch at `84b670efc4`, worktree off `origin/develop` at `9b93ec4374`.\n\n**Behaviour, before -\u003e after** (the before column is the failure recorded in the issue):\n\n| case | before | after |\n|---|---|---|\n| `half` of `0.0000001` | `\"5e-8\"` -\u003e `parseUnits` throws | `\"0.00000005\"` |\n| `max` of `0.0000001` | `\"9e-8\"` -\u003e `parseUnits` throws | `\"0.00000009\"` |\n| `30%` of `0.0000005` | `\"1.5e-7\"` -\u003e `parseUnits` throws | `\"0.00000015\"` |\n| `1%` of `0.00001` | `\"1.0000000000000001e-7\"` -\u003e `parseUnits` throws | `\"0.0000001\"` |\n\n**Regression control** — ordinary balances are byte-identical: `half` of `2` -\u003e `\"1\"`, `max` of `10` -\u003e `\"9\"`, `30%` of `10` -\u003e `\"3\"`, `25%` of `8` -\u003e `\"2\"`. All four are covered by pre-existing tests that still pass unchanged.\n\n**Red/green check.** Stashing only the source change and re-running the suite fails the 4 new tests with exactly the issue's reported values (`Expected: \"0.0000001\"` / `Received: \"1.0000000000000001e-7\"`) while the 10 pre-existing tests stay green. Restoring the fix takes the file to 14/14.\n\n**Gates run locally:**\n\n```\nbun run --cwd plugins/plugin-wallet test\n  -\u003e Test Files  3 failed | 66 passed | 1 skipped (70)\n     Tests  415 passed | 1 skipped (416)\n```\n\nThe 4 added tests account for the delta from the `origin/develop` baseline of 411 passed. The 3 failing files are **pre-existing collection failures**, reproduced identically on a clean `origin/develop` worktree with this change stashed: `src/api/wallet-routes.test.ts` and `src/api/wallet-routes.authority.test.ts` cannot resolve `@elizaos/plugin-elizacloud`, and `src/ui/InventoryView.test.tsx` cannot resolve `@elizaos/ui/spatial` — unbuilt workspace dependencies, not test failures, and untouched by this change.\n\n```\nbun run --cwd plugins/plugin-wallet typecheck\n  -\u003e src/api/wallet-routes.ts(96,5): error TS2307: Cannot find module '@elizaos/plugin-elizacloud'\n```\n\nSame pre-existing error, same file, present on clean `origin/develop` with this change stashed. Both changed files typecheck clean.\n\n```\nbunx @biomejs/biome check \u003cthe two changed files\u003e\n  -\u003e Checked 2 files. No fixes applied.\n```\n\n## Files\n\n- `plugins/plugin-wallet/src/chains/evm/actions/swap.ts` — bigint arithmetic in `resolveRelativeAmount`, `decimals` threaded from the caller\n- `plugins/plugin-wallet/src/chains/evm/__tests__/unit/swap-amount-mode.test.ts` — 4 tests: dust `half`, dust `max` (gas reserve preserved), dust `percent`, and the float-residue `1%` case; each asserts the plain-decimal value, absence of exponent notation, and that `parseUnits` accepts the result\n\n\u003c!-- pr-evidence:v1 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - no UI change; pure arithmetic/formatting fix in an action helper\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - no UI change; pure arithmetic/formatting fix in an action helper\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - no UI change; pure arithmetic/formatting fix in an action helper\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - deterministic unit tests; vitest output shown in PR checks and quoted under Verification\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] N/A - no UI change; pure arithmetic/formatting fix in an action helper\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] N/A - the intent model is mocked in the affected suite; no LLM execution in the changed path\n\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - no migrations, schemas, or generated artifacts; two source files only\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\n\u003c!-- attribution-row:ai-assistance --\u003e\nyes - z.ai/glm-5.3\n\n\u003c!-- attribution-row:models --\u003e\nz.ai/glm-5.3\n\n\u003c!-- attribution-row:client --\u003e\nHermes Agent\n\n\u003c!-- attribution-row:skill-revision --\u003e\nN/A - direct contribution\n\n\u003c!-- attribution-row:status --\u003e\nself-reported\n\n\u003c!-- evidence-head:84b670efc48fed9a1834a176552c8003ff0181d6 --\u003e\n"])</script><script>self.__next_f.push([1,"2c:T27e4,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #30115\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop` with zero conflicts.\n- [x] `bun install` ran; owning-package `test`, `typecheck`, and `lint:check` are green (evidence below). `bun run verify` is a repo-wide gate; the focused package gates are attached.\n- [x] A reviewer can confirm the change works without reading the code, from the before/after regression output below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop`; zero conflicts (branch was up to date at rebase time).\n- [x] Focused package gates pass post-sync; see **Known gaps / failures** for the repo-wide `verify` note.\n\n# Risks\n\nLow. The change is scoped to a single function (`emitModelUsageEvent` in `plugins/plugin-zai/utils/events.ts`). It only adds a `.catch` to an already fire-and-forget emission and forwards the failure to `runtime.reportError`; the success path and the emitted `MODEL_USED` payload are byte-for-byte unchanged (the two existing normalization tests still pass unmodified).\n\n# Background\n\n## What does this PR do?\n\nAfter a **successful** z.ai text completion, `generateTextWithModel` calls `emitModelUsageEvent`, which invoked `runtime.emitEvent(EventType.MODEL_USED, ...)` **without awaiting and without a `.catch`**. `AgentRuntime.emitEvent` is async and rejects when any registered `MODEL_USED` handler throws/rejects (it does `await Promise.all(handlers.map(...))`). So a faulty or transient metering/billing `MODEL_USED` handler turned a completed, otherwise-successful model call into an **unhandled promise rejection**. Under Node's default unhandled-rejections policy (`throw`, default since Node 15; this repo pins Node 24.15.0), that **terminates the agent process** — a direct violation of repo error policy **J7** (\"diagnostics must not kill the loop\").\n\nThe fix mirrors the already-correct sibling provider `plugin-zerollama` (`utils/modelUsage.ts` → `emitModelUsed`): capture the emission promise, and on rejection warn to the logger and route the failure through `runtime.reportError(\"plugin-zai.model-usage\", ...)`. Usage telemetry can no longer convert a successful model call into a process-killing failure.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo. Behavior of the success path is unchanged; this only hardens diagnostic emission. The package AGENTS.md already documents that both handlers emit `MODEL_USED` via `emitModelUsageEvent`.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-zai/__tests__/events.test.ts` — the new regression `captures the emission rejection and reports it without leaking (J7)`. It installs a live `process.on(\"unhandledRejection\")` collector, calls `emitModelUsageEvent` with a **plain** `emitEvent` returning `Promise.reject(...)` (a vitest mock would mask the bug by attaching its own `.catch`), flushes a macrotask, then asserts (a) the guarded rejection did **not** leak, (b) an unguarded control `Promise.reject` **was** collected (proving the collector is live), and (c) `runtime.reportError` was called with scope `\"plugin-zai.model-usage\"`.\n\n## Detailed testing steps\n\n```bash\nbun run --cwd plugins/plugin-zai test\nbun run --cwd plugins/plugin-zai typecheck\nbun run --cwd plugins/plugin-zai lint:check\n```\n\n# Evidence Gate\n\n\u003c!-- evidence-head:7d024059672fb3a10c4633a6e8a10068d8d3d8ef --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no UI surface; provider plugin registers only model handlers (no actions/providers/routes/views).`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - no UI surface (see above).`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - no user-facing flow; the change is a background diagnostic-emission guard.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] AFTER — full `plugin-zai` package suite green (61/61) with the fix applied. Inline transcript below; same file also at the gist link.\n\u003cdetails\u003e\u003csummary\u003ebackend logs: after (bun run --cwd plugins/plugin-zai test)\u003c/summary\u003e\n\n```\n$ bunx vitest run --config vitest.config.ts\n\n RUN  v4.1.10 /home/home/Developer/eliza-swarm/state/worktrees/issue-30115/plugins/plugin-zai\n\n\n Test Files  7 passed (7)\n      Tests  61 passed (61)\n   Start at  01:29:19\n   Duration  28.44s (transform 42.42s, setup 0ms, import 60.66s, tests 839ms, environment 1ms)\n```\n\n\u003c/details\u003e\n[zai-30115-after.txt](https://gist.github.com/agent-cortex/fecdeced6e37f2476e217a5c630a03ed/c44a480e87f5942ec957597fe6034dd079709691#file-zai-30115-after-txt)\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] `N/A - no frontend surface.`\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] `N/A - no prompt/model vior changes; the guard runs only after a successful completion and does not alter model I/O.`\n\n## Backend + frontend logs\n\n**BEFORE (fix reverted — the regression test captures the leaked unhandled rejection):**\n\n```\n FAIL  __tests__/events.test.ts \u003e z.ai usage events \u003e when a MODEL_USED handler rejects \u003e captures the emission rejection and reports it without leaking (J7)\nAssertionError: expected [ Error: metering handler boom, …(1) ] to not include Error: metering handler boom\n ❯ __tests__/events.test.ts:104:29\n    103|       // (a) the guarded emission did NOT leak an unhandled rejection.\n    104|       expect(unhandled).not.toContain(boom);\n       |                             ^\n\n Test Files  1 failed (1)\n      Tests  1 failed | 2 passed (3)\n```\n\nThe rejected emit promise surfaces as a real `unhandledRejection` — exactly what kills the process under Node's default policy.\n\n**AFTER (fix applied — full package suite green):**\n\n```\n Test Files  7 passed (7)\n      Tests  61 passed (61)\n```\n\nThe guarded rejection no longer leaks; the live control `Promise.reject` is still collected (proving the probe is real); and `runtime.reportError(\"plugin-zai.model-usage\", ...)` is invoked.\n\n**Parity with the already-correct sibling** `plugin-zerollama/utils/modelUsage.ts` `emitModelUsed` — both now wrap the emission in `void Promise.resolve(emission).catch(...)`, warn to `logger`, and forward to `runtime.reportError` with a `plugin-*.model-usage` scope. The only differences are the source label (`zai` vs `ollama`) and reportError scope/context.\n\n## Screenshots (before / after) + video walkthrough\n\n`N/A - no UI change.`\n\n## Audio / voice walkthrough\n\n`N/A - no voice/transcript/TTS/STT surface.`\n\n## Known gaps / failures\n\n- Full repo-wide `bun run verify` was not run to completion on this constrained ARM build host; the owning package's `test` (61 passing), `typecheck`, and `lint:check` (all green) are attached and are the ient command path`.\nThey have been green, unchanged and un-exercised since `4b5b84c47a` (2026-06-23).\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (base `9b93ec4374878428a7a53b24202dfa15a8dbb55b`).\n- [x] `bun install` was run after sync. `bun run verify` was not run; the exact\n      blocker and the checks substituted for it are recorded in\n      **Known gaps / failures**.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop` (`9b93ec4374`); zero conflicts.\n- [x] The affected-surface checks pass post-sync (see **Testing** and\n      **Evidence Details**).\n\n# Risks\n\n**Low.** The diff deletes one candidate list from a resolver loop; it adds no\nbranch, no dependency, and no new failure mode.\n\nWhat could be affected is the Enter handler in the chat composer, for ordinary\nprose that happens to resemble a client command. Both directions are covered by\ntests that already exist in the repo and are run before/after below:\n\n- With `naturalShortcutsEnabled` **off** (the value actually shipped), an\n  ordinary sentence no longer performs a client-side navigation. It is sent to\n  the model, which is what the flag exists to guarantee.\n- With the flag **on**, such a sentence navigates and the draft is consumed\n  once, instead of navigating *and* posting the same text to the model as a\n  second turn. This is already how every other client command behaves.\n- The narrow optimistic fast path (`go home`, `open \u003cloaded view\u003e`) is\n  unchanged: it is resolved from the local vocabulary first today, and remains\n  resolved from the local vocabulary only.\n\n`resolveClientShortcutExecution` — the flag-gated resolver, the authority\nfail-closing added in #12087, and the slash menu itself — is untouched.\n\n# Background\n\n## What does this PR do?\n\n`resolveOptimisticNavigationExecution()` accelerated the optimistic navigation\nfast path out of `packages/ui`'s small built-in Home/loaded-view vocabulary\n**and then fell through to the entire remote command catalog**, calling\n`resolveClientShortcutExecution()` with `allowNatural` hardcoded to `true`.\n\nThat made the fast path claim every navigate-targeted command the server\ncatalog happens to declare, ahead of and independently of\n`slash.naturalShortcutsEnabled`. In `ChatOverlay.submit()` the fast path also\nalways calls `submitText()` afterwards, so the same ordinary message both\nnavigated the shell and reached the model — the draft was never consumed by the\nclient-command path that is supposed to own it.\n\nThis PR confines the fast path to the local `OPTIMISTIC_NAVIGATION_COMMANDS`\nvocabulary it was built from. The remote catalog argument no longer has a role\nin the function, so it is removed: the invariant \"the fast path cannot see the\nremote catalog\" is now structural rather than asserted.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n## Why are we doing this?\n\n`useSlashCommandController` pins the flag off and states why, verbatim:\n\n\u003e Natural language belongs to the agent model. Client-side shortcuts are\n\u003e reserved for explicit slash protocol so host configuration cannot bypass\n\u003e inference for an ordinary chat message.\n\u003e — `packages/ui/src/chat/useSlashCommandController.ts:450-453`\n\nThe fall-through did exactly that: with the flag off, `open settings` bypassed\ninference governance and drove the shell. The two symptoms and the single root\ncause are reproduced in **Evidence Details**, and the timeline is unambiguous:\n\n| date | commit | effect |\n| --- | --- | --- |\n| 2026-06-23 | `4b5b84c47a` | both tests added, green |\n| 2026-08-27 19:11 | `12a3a4bb85` | fast path introduced over the **remote catalog** with `allowNatural: true` → both tests red |\n| 2026-08-27 20:03 | `9debbd9822` | added the narrow local vocabulary as a first pass, kept the remote fall-through |\n| this PR | | remote fall-through removed |\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The documented\nuser contract is unchanged: natural-language navigation is available when\n`naturalShortcutsEnabled` is on, and the Home/loaded-view fast path is always\navailable.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/ui/src/chat/slash-menu.ts` → `resolveOptimisticNavigationExecution`.\nThe whole behavioural change is that its candidate list is now the local\nvocabulary only. Then read the two tests it repairs:\n`packages/ui/src/components/shell/ChatOverlay.slash.test.tsx:229-246`.\n\n## Detailed testing steps\n\n```bash\n# 1. reproduce the defect at the exact base revision\ngit checkout 9b93ec4374878428a7a53b24202dfa15a8dbb55b\nbun run --cwd packages/ui vitest run src/components/shell/ChatOverlay.slash.test.tsx\n#   → 2 failed | 15 passed\n\n# 2. confirm this PR head repairs it and nothing else\ngit checkout 17cc197334b0adb24cc61d097078af72c91b00d9\nbun run --cwd packages/ui vitest run \\\n  src/chat/slash-menu.test.ts \\\n  src/components/shell/ChatOverlay.slash.test.tsx \\\n  src/components/shell/ChatOverlay.test.tsx\n#   → 263 passed (0 failed)\n```\n\nThe same two revisions were then driven in a real Chromium against the real app\nshell, typing `open settings` into the composer. Before: the router navigates to\n`/settings`, the Settings view mounts, **and** one chat `POST` still fires. After:\nno navigation, no mount, one chat `POST`. Desktop and mobile captures, the\nwalkthrough videos, the browser console logs and an OCR readout of the screens\nare attached on the **Evidence Gate** rows below and described in\n**Evidence Details → Real-browser differential**.\n\n# Evidence Gate\n\nEvidence matches the exact commit reviewed; rerun identical procedure, separate build |\n\nCapture host: WSL Debian, Bun 1.3.14 / Node 24.14.0, Chromium from the\nrepository's pinned Playwright, app shell served by\n`packages/app-core/scripts/playwright-ui-live-stack.ts` with\n`ELIZA_UI_SMOKE_FORCE_STUB=1` (the same wiring\n`playwright.ui-smoke.config.ts` uses in CI).\n\nOne input is overridden, deliberately: `GET /api/commands` is fulfilled with a\nsingle `navigate -\u003e settings` catalog entry, exactly as the existing\n`packages/app/test/ui-smoke/slash-commands.spec.ts` does, because the default\nsmoke stub serves an empty catalog and an empty catalog cannot reach the\nfall-through under test. Nothing else is stubbed: the router, the shell, the\nslash controller, the composer and the message pipeline are the shipped code,\nand `naturalShortcutsEnabled` keeps its shipped value (`false`,\n`useSlashCommandController.ts:453`).\n\n## Real-browser differential\n\nEach run opens `/chat`, waits for the real composer\n(`data-testid=\"chat-composer-textarea\"`) to be enabled, types `open settings`\nkey by key, presses Enter, and records what the app did.\n\n| run | revision | viewport | route after Enter | `settings-shell` visible | `ViewLifecycle … \"settings\" mounted` lines | chat `POST`s after Enter |\n| --- | --- | --- | --- | --- | --- | --- |\n| before-desktop | `9b93ec4374` | 1280x720 | `/chat` → **`/settings`** | **yes** | **1** | 1 |\n| after-desktop | `17cc197334` | 1280x720 | `/chat` | no | 0 | 1 |\n| before-mobile | `9b93ec4374` | 412x915 | `/chat` → **`/settings`** | **yes** | **1** | 1 |\n| after-mobile | `17cc197334` | 412x915 | `/chat` | no | 0 | 1 |\n\nBoth halves of the defect are visible in one keystroke. At the base revision an\nordinary sentence drives the shell (the Settings view really mounts, the router\nreally moves) **and** still reaches the model - the draft is consumed twice, by\ntwo different owners. At this head the sentence only reaches the model, which is\nwhat the flag's documented invar \n`resolveNodeExecPathFromCandidates` is already the repository's standard way to\nresolve a Node executable — four live callers use it\n(`run-node-tsx.mjs`, `run-production-build.mjs`,\n`packages/app/scripts/lib/playwright-node-runtime.mjs`, and its own suite) — so\nthis adds no new resolution policy, no new dependency, and no new failure mode.\n\n# Background\n\n## What does this PR do?\n\n`packages/app-core/scripts/dev-ui.mjs` resolves the API child's runtime in\n`resolveApiRuntimeCommand()`. When that resolution selects Node, it returned\n`command: resolveNodeRuntimePath(env)`. `2345bbbc1f` deleted\n`resolveNodeRuntimePath` and its `resolveNodeExecPathFromCandidates` import while\nleaving that call site in place, so the branch now throws\n\n```\nReferenceError: resolveNodeRuntimePath is not defined\n```\n\nbefore either dev child is spawned. This PR restores the helper (and the import\nit needs), so the Node branch resolves a real Node executable again.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n## Why are we doing this?\n\nThe broken branch is not an obscure corner — `chooseElizaRuntime()` selects Node\nin three situations, none of which is a misconfiguration:\n\n1. `ELIZA_RUNTIME=node` is requested explicitly.\n2. The host has no `bun` in `PATH` (`hasBun === false \u0026\u0026 hasNode`).\n3. **Automatically**, as a safety fallback: `isKnownUnstableBunOnLinux()` matches\n   Bun 1.3.9 on Linux and the supervisor deliberately downgrades to Node with the\n   warning *\"Detected Bun 1.3.9 on Linux (known segfault risk). Defaulting\n   runtime to Node.js.\"*\n\nCase 3 is the sharp edge: the code path that exists specifically to keep a user\noff a crashing Bun runtime crashes with a `ReferenceError` instead. Every one of\nthese users gets a `bun run dev` that dies immediately, with an error that names\nnothing they did wrong.\n\n`resolveApiRuntimeCommand()` has no test coverage on `develop` — `git grep`\nreturns exactly its definition and this one call site — and no TypeScript project\ncovers `packages/app-core/scripts/*.mjs`, which is why the deletion shipped\ngreen.\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The user-facing\ncontract (`ELIZA_RUNTIME`, `ELIZA_NODE_PATH`) is unchanged; this restores it.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/app-core/scripts/dev-ui.mjs` — the restored `resolveNodeRuntimePath()`\nand the `run-node-runtime.mjs` import. Compare against the version deleted in\n`git show 2345bbbc1f -- packages/app-core/scripts/dev-ui.mjs`.\n\n## Detailed testing steps\n\nBoth failures and the fix are proven through the **real product path**, not a\nunit test: the actual combined-dev supervisor booting as a user runs it.\n\n```bash\n# before, at origin/develop d8c5b3124d -\u003e dies in ~4s\nELIZA_RUNTIME=node bun run dev\n# ReferenceError: resolveNodeRuntimePath is not defined\n\n# after -\u003e full stack comes up\nELIZA_RUNTIME=node bun run dev\n# [eliza] UI ready ... / [eliza] API ready ...\n\n# the repository's own real-system startup gate, both runtime modes\nnode packages/app-core/scripts/dev-startup-smoke.mjs                      # PASS\nELIZA_RUNTIME=node node packages/app-core/scripts/dev-startup-smoke.mjs   # FAIL before, PASS after\n```\n\nFull captured output for every command, with revisions and exit statuses, is in\nthe `\u003cdetails\u003e` blocks under **Backend + frontend logs**.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed. `scripts/pr-evidence.mjs rows`\nsets this marker from the live PR head; rerun it after every push.\n\u003c!-- evidence-head:a0fb38a6d9f7c3e74bebb9714a664a9053aee840 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - no rendered UI surface is built or changed: the diff touches only the Node runtime resolution helper inside the local dev supervisor script packages/app-core/scripts/dev-ui.mjs, with no a
