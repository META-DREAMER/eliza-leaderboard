cution. Non-email destinations fail before any pause or disconnection. The onboarding UI now saves exact choices, reads active progress on reopening, and advances or cancels the saved review. Event selection includes the revision shown to the owner; changed events require a new review. Failed steps scroll their error into view.\n- Approval insertion, retirement and both dispatch claim paths share a database lock and persisted control revisions. Retired approvals cannot execute after handoff; fresh explicitly bound approvals remain usable after reconnect. Unbound Google approvals require a new account review after retirement. Additive migration preserves old rows, which remain fenced for retired account scopes.\n- Reviewed school-source facts in family drafts. Opted-in imports use stored school titles and dates, excluding private calendar edits. Existing sources without a sharing policy remain private.\n- Correct calendar source labels and required PDF-extraction errors surfaced as unavailable with diagnostics. Failed initial connection inventory now shows an unavailable state and Retry instead of falsely claiming no account is connected or offering setup actions.\n\nLatest published head: `97c527856f41a2287e179fcc4f14660e74c3fd77`, including develop `754bb18e1599f`. Install/root verify pass; personal-assistant package: 307 files, 2,683 passed, six existing skips. Exact-head desktop/phone browser journeys pass. [Connection error/retry, saved-review recovery, MP4s, browser logs and validation evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/connection-inventory-97c5278.zip). The full 226-check app audit ran on the same UI repair before the develop merge; all 12 OCR exceptions were inspected as declared unavailable/fallback states. Linux root verify and personal-assistant/Google/app builds pass. The isolated pilot now runs `97c5278`; [deployment receipt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/connection-inventory-97c5278-deployment.json) verifies 3,577 build files, served entry/view assets, three deep links, unchanged calendar pause revision14 and unchanged saved packet hash. Live browser readback reached the loading view but computer control then timed out; successful current-pilot UI rendering is not yet claimed. Hosted PostgreSQL, billing and Windows checks pass; source smoke remains pending.\n\n**Keep this PR in draft.** Full MVP acceptance is incomplete. Remaining release work includes deploying and validating the reviewed UI with live two-account cutover, PDF extraction, knowledge pin/ACL and guest/revocation flows, useful selected-source monthly packet intake, and iMessage/Telegram/Discord acceptance. Configured connectors and deterministic test ports are not live delivery evidence.\n\nRelated: #30123, #30991, #30998, #31010, #31011, #31015, #31026, #31028, #31030, #31039. Incorporates overlapping drafts #31003 and #31006; do not merge them independently.\n\nCurrent source: `6e5af7a93e01fb4edf5be7cd3a018c1c0547f386`, including merged develop `5bf3faef78a9a214431fb3e8a7eaa0f0518767de`. No conflicts. The isolated pilot now runs this exact source. Linux verification and release builds passed; served entry and onboarding bundle hashes match. A consistent pre-deployment backup was taken; paused calendar control and the existing monthly packet were preserved.\n\n| Validation | Result and boundary |\n| --- | --- |\n| Reviewed account-switch UI | [Screenshots, desktop/phone MP4s, console/network logs, and validation logs](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-handoff-ui-6e5af7a.zip). The populated browser journey verifies read/write selection, exact linked-event revision and copy choice, review before execution, lost response, reload/recovery, and zero direct disconnect calls. The only failed HTTP response is the deliberate 503. Browser provider routes are synthetic fixtures; backend HTTP/PGlite coverage is separate. Repository verification, PA typecheck/lint, 54 handoff integration tests and 23 focused review/component tests passed. |\n| Google handoff coordinator and upgrade recovery | [Pinned install](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/f41fb3e-family-handoff-combined-install.log), [root verification](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/f41fb3e-family-handoff-combined-verify.log), and [54 integration tests](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/f41fb3e-family-handoff-combined-tests.log) passed on f41fb3e. The real HTTP/PGlite journey covers owner authorization, stale/concurrent requests, provider outage recovery, exact-account disconnection, and readback after each checkpoint. Google provider probes are deterministic. Older paused handoffs establish the approval fence before release; interrupted releases require the persisted fence. No live provider mutation. |\n| Prior repository gate | [Pinned install](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-approval-fence-install.log) and [root verification](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-approval-fence-root-verify.log) passed on 4450974. Develop 5bf3fae was fetched again and is already included. |\n| Approval fence | [83 database integration tests](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-approval-fence-broad-final.log), [21 agent service tests](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-approval-fence-agent-unit.log), agent/PA/SQL typecheck and lint passed. [Independent PostgreSQL ordering proof](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-approval-fence-4450974-pg-result.json) records exact source hashes; [scheduling claim proof](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-scheduling-fence-pg-result.json) used the same candidate before final formatting. No provider calls. |\n| Existin oke tests](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-replacement-combined-pa-integration.log) and [775 agent test files](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-replacement-agent-test.log) passed on e2f04b7. These are historical scoped evidence, not current-head full-suite results. |\n| Handoff and sender evidence | [Real HTTP owner review/client](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5628964167), [recipient binding](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5628648017), [source checkpoint recovery](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5628307223), [independent PostgreSQL dispatch/pause sessions](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5629281664), [scheduling](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5629414289), [meeting follow-up](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5629557967), [delegation](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5629623455). Each link identifies its tested revision and limitations. |\n| UI evidence | [226 app checks and Connections/family browser harness](https://github.com/elizaOS/eliza/issues/30991#issuecomment-5628234350), [screenshots/MP4/logs](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/family-onboarding-926ebe2-browser.zip), on 926ebe20. OCR reported zero broken and 12 requiring human inspection. Fixture recordings do not prove live handoff or current merged UI acceptance. |\n| Hosted checks | All five hosted checks passed on exact `6e5af7a`: source static smoke, billing replay, PostgreSQL authority, Windows browser security and the aggregate gate. |\n\nEarlier live integration evidence on ab7a9f2 (preserved across the update; these provider actions were not repeated):\n\n- [Unicode self-email with exact inbox content, saved receipt/export and duplicate suppression](https://github.com/elizaOS/eliza/pull/31032#issuecomment-5625667963). Transport acceptance; completed approvals must not be resent.\n- [All-day civil dates](https://github.com/elizaOS/eliza/pull/31032#issuecomment-5625834247) and [timed DST duration/offset preservation](https://github.com/elizaOS/eliza/pull/31032#issuecomment-5625858281), including cleanup. Google remained connected and sync paused; standalone operation without Google is unverified.\n- [Real future scheduler execution](https://github.com/elizaOS/eliza/pull/31032#issuecomment-5625923906) without manual firing. Full monthly school-source creation/update UX remains open.\n- [Earlier storage restore](https://github.com/elizaOS/eliza/pull/31032#issuecomment-5623412960) is database evidence only; the later isolated application-boot receipt below adds HTTP readback evidence. Live connector resumption remains unverified.\n\nPilot deployment proof: [source, build results, served-asset hashes and acceptance limits](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/handoff-6e5af7a-deployment-receipt.json). The live browser displayed the new replacement flow and blocked a same-account switch. A real second-account connection/cutover remains unverified: tester registration is saved and the final Google permission consent remains pending. Keep this PR in draft for the remaining full-MVP acceptance work.\n\nRestored application acceptance: [network-isolated boot receipt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/restored-app-6e5af7a.json). The real restored app returned three packet versions with the unchanged packet-state hash, paused calendar revision14 and successful active-handoff readback. Restore requires the service vault environment and preserved private directory permissions. Networking and scheduling tick were disabled, so this does not certify live connector resumption. Browser access recovered and the designated second account was added to the OAuth tester allowlist. The flow now reaches the final permission-consent screen; that consent remains pending. No account switch or additional email send occurred.\n"])</script><script>self.__next_f.push([1,"15:T260f,"])</script><script>self.__next_f.push([1,"First-run activation persists the selected model and account routing through readiness, chat and cold restart. Failed activation restores still-owned durable and live configuration without overwriting concurrent updates. Busy admission rejects before persistence. Plugin staging preserves source entries and dependency identities, relocates Windows junctions before publication, and builds runtime exports in dependency order.\n\nBackground evaluation now finishes durably before scenario fixtures yield ownership. Complete visible entity names and IDs have stable ordering, so hidden display-name metadata cannot invalidate an unchanged evaluator request. Recovery control output stays out of visible responses while complete model inputs and recordings remain intact. Selected UI controls retain their selected state and readable nested text, pipeline badges use the canonical design variant, and Accounts actions wrap within mobile cards.\n\nThe Accounts inventory route shares one freshly validated credential snapshot across provider projections, reducing a measured request from 29 full reads to 2 including the expiry sweep. It preserves existing selection policies and older host compatibility; corrupt storage still fails explicitly. The branch also repairs deterministic scenario contracts and CI prerequisite/import/timer failures without weakening their behavioral assertions.\n\nCurrent head: `7321244a200285498ff831164f4918250d54407b`, rebased onto `d07f6dc2e2271ab8e4ebc2fef2cf389e40dabb39`. Normal frozen installation, the complete root verification, and all 99 combined scenarios passed with Bun 1.3.14 and Node 24.15.0. The browser fixture now advances its real workspace tab only after the real action emits a nonmatching URL poll; it no longer races a 500 ms timer. Production polling and the at-least-two-polls assertion remain unchanged.\n\nPrevious head `2ea08dc` passed PR admission and Windows runtime qualification. Its full CI first attempt failed one real Worker Twilio assertion (expected configuration HTTP 503, received HTTP 500); an explicit failed-job rerun now passes all full CI jobs. The same source passes fresh local Worker/PGlite qualification: all 18 cloud API E2E files, 517 passes, zero failures, 18 explicit skips. This does not explain or erase the hosted failure. Final selected-state UI and actual activation/restart HTTP qualification are tracked separately below.\n\n| Contract | Evidence and remaining validation |\n| --- | --- |\n| Final installation and repository gates | PASS at `7321244a`: normal frozen install and complete root verification, including package types/lint and repository audits. Clean committed source retained. |\n| Account inventory | Component `ca4e5c63`: 69 owner tests pass, real encrypted-store/HTTP parity and freshness checks pass, and restoring original production reproduces the 29-versus-2 read failure. Real browser flow passes 49 assertions with 26 captures. Measured two-account GET falls from 2,251 to 239 ms; hosted timeout causation remains provisional until the final hosted rerun. Final combined route and pool tests pass (27 route and 69 pool tests); the real API/pool/disk hosted Accounts flow passes at `2ea08dc`. |\n| Activation and cold restart | Historical `5c16100b` proof runs the real host with a synthetic provider: all 11 model pins, account/routing, both replies and personal-assistant survive cold restart; owned processes and ports are released. The `2ea08dc` rerun failed when personal-assistant staging exceeded the unchanged watchdog. The final `7321244a` run passes all actual HTTP activation and cold-restart assertions in 115.958 seconds with that same watchdog; owned ports and process groups are released. The earlier failure remains recorded without an established cause. This is not live-provider \n\n# Sync with develop\n\n- [x] Rebased onto `origin/develop` (`47216363f51bcd1057b20b55f9666d5f7013c927`); zero conflicts.\n- [x] Package `typecheck` and changed-file Biome pass; unrelated blockers\n      documented under **Known gaps / failures**.\n\n# Risks\n\nLow. The change is confined to how `lower_confidence` policy effects are\nconsumed. Finite nonnegative amounts behave exactly as before; an omitted amount\nkeeps the documented `0.1` default; only malformed supplied amounts change —\nthey are skipped instead of poisoning the confidence. Malformed effects are\nstill present in `policyEffects`, so nothing is silently dropped.\n\nPer the maintainer's triage on #29527: omission, finite nonnegative amounts, and\ninvalid input are now three distinct outcomes, and invalid input rejects the\neffect rather than scoring it as a healthy `0.1`.\n\n# Background\n\n## What does this PR do?\n\nAn `EmailCurationPolicyEffect` is a public seam any third-party\n`EmailCurationPolicyHook` can return. `calibrateEmailCurationConfidence` did\n`confidence -= effect.amount ?? 0.1` with no validation, so\n`{ kind: \"lower_confidence\", amount: Number.NaN }` made the decision\n`confidence` `NaN`. Downstream, `confidenceBand(NaN)` returned `\"low\"`,\n`bulkReviewForDecision` rendered `NaN` into the reviewer-facing rationale, and\n`validateCurationDecisionCitations`' high-band early return was inherited\nwithout the decision ever qualifying for it.\n\nThe engine now validates the supplied amount once, at the boundary where the\neffect is consumed:\n\n- omitted `amount` → the documented `0.1` default;\n- finite `amount \u003e= 0` → applied exactly;\n- `NaN`, `±Infinity`, or a negative value → the effect is **not applied** and is\n  not replaced by a fabricated default. It stays in `policyEffects` carrying an\n  `invalidReason` naming the effect code and the violated constraint, so the\n  decision surfaces why the hook input was refused.\n\n## What kind of change is this?\n\nBug fixes (n \"]' }]`\n- it renders at `plugins/plugin-relationships/src/components/relationships/RelationshipsSpatialView.tsx:157`\n- `packages/app/test/ui-smoke/apps-session-route-cases.ts:97` already uses it as the readiness selector for `/apps/relationships` in this same Playwright suite\n- `packages/app/test/ui-smoke/view-switching-core-matrix.ts:142` uses it as `readySelector` for the same route\n\nThat covers the contract as asked: the view is ready when its own root renders, an empty relationship graph still satisfies it because the testid is on the view rather than on its contents, and a failure to render leaves the testid absent so the probe fails instead of passing on the shell.\n\n## Verification, and what I did not run\n\nVerified by reading the tree at `e2678ac`: the selector's declaration, its render site, and both existing ui-smoke consumers, each cited above with a line number. The change keeps the existing `ReadyCheck` shape (`{ selector: string }`) so there is no type change, and matches the file's own quoting convention for a selector containing double quotes, as in `'[data-testid=\"settings-shell\"]'` on the settings probe.\n\n**I did not run the ui-smoke lane.** It needs a built app plus Playwright browsers and I could not stand that up here, so I am not claiming a green run. The argument that this passes is that two other files in the same suite already await this exact selector on this exact route. If a maintainer would rather see the run first, I am happy to wait on CI or take a pointer to a cheaper way to exercise just this probe.\n\nNothing else in the file changes.\n\nAI provider/model: anthropic / claude-opus-5\n"])</script><script>self.__next_f.push([1,"2a:T943,"])</script><script>self.__next_f.push([1,"The browser plugin lane fails because an existing native-read test expects an obsolete size-limit message and permits a truncated snapshot. Update it to require the typed incomplete-read rejection for both text and snapshots, preserving the adjacent
