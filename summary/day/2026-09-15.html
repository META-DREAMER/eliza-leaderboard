ill rejects a 0777 parent as replaceable\n- POSIX without the Android boundary still fails closed on EACCES\n- existing race suite remains green\n\nBiome check clean on the three touched files. `tsc --noEmit` in `packages/agent` reported no errors in those files.\n"])</script><script>self.__next_f.push([1,"38:T1d5a,"])</script><script>self.__next_f.push([1,"# The defect\n\n`fetchWithTimeout` in `packages/agent/src/providers/media-provider.ts` spreads `init` and then overwrites `signal` with its own controller's:\n\n```ts\nconst controller = new AbortController();\nconst timer = setTimeout(() =\u003e controller.abort(), timeoutMs);\nreturn fetch(url, { ...init, signal: controller.signal })   // \u003c- init.signal discarded\n```\n\nA caller-supplied `AbortSignal` is silently dropped. A request the caller cancels **keeps running until the full timeout elapses** — 30s by default, 120s for audio, 300s for the Veo polling path.\n\nThis helper backs **every media provider in the file** — twenty-plus call sites across FAL, OpenAI, Google, xAI, Anthropic, ElevenLabs and Suno — and it had **no tests at all**. Neither did the fifteen provider classes; the two existing suites reference only the four factory functions.\n\n# The repo already knows the right shape\n\n`fetchWithTimeoutGuard` in `packages/agent/src/api/server-helpers-fetch.ts` — same package — chains the upstream signal properly, handling both the already-aborted case and a later abort. This change makes `fetchWithTimeout` mirror it:\n\n```ts\nconst upstreamSignal = init.signal;\nconst onUpstreamAbort = () =\u003e controller.abort();\n\nif (upstreamSignal) {\n  if (upstreamSignal.aborted) {\n    controller.abort();\n  } else {\n    upstreamSignal.addEventListener(\"abort\", onUpstreamAbort, { once: true });\n  }\n}\n\nconst timer = setTimeout(() =\u003e controller.abort(), timeoutMs);\nreturn fetch(url, { ...init, signal: controller.signal }).finally(() =\u003e {\n  clearTimeout(timer);\n  upstreamSignal?.removeEventListener(\"abort\", onUpstreamAbort);\n});\n```\n\n**No caller passes a signal today**, so this is a latent trap rather than an active outage, and behaviour is byte-identical when `init.signal` is undefined. I'm fixing it because the next caller to reach for cancellation would get silence, not an error.\n\nI deliberately did **not** adopt the guard's `TimeoutError` renaming — that would change what the providers' error boundary reports, which is beyond this fix.\n\n# Causal evidence\n\nRestoring `develop`'s implementation under the new suite fails three tests, and the mid-flight case takes the **full 30 seconds** — which is precisely the bug:\n\n```\n× honours a caller signal that is ALREADY aborted, without opening a request      5ms\n× honours a caller signal aborted MID-FLIGHT                                  30005ms\n× cancels well before the timeout would have fired                            30003ms\n\nTests  3 failed | 11 passed (14)\n```\n\n# Mutation testing: 8 mutants, 7 killed\n\n| mutant | result |\n|---|---|\n| already-aborted branch removed | killed |\n| upstream listener never attached | killed |\n| `clearTimeout` removed | killed |\n| timeout never armed | killed |\n| controller signal not passed to `fetch` | killed |\n| default `timeoutMs` changed | killed |\n| `removeEventListener` removed | killed |\n| `{ once: true }` dropped | **survived — redundant, see below** |\n\nThe listener-removal mutant only died after I made the leak *observable*. Asserting that `controller.abort()` doesn't throw was not enough: a stale listener aborting an already-settled controller is harmless. `getEventListeners(signal, \"abort\")` from `node:events` is what actually sees it, and the test now drives five sequential requests through one signal and asserts zero listeners remain.\n\n**The `{ once: true }` survivor is genuine redundancy, not a coverage hole.** If the listener fires, `once` removes it; if it never fires, the `finally` removes it. Either mechanism alone suffices, so no test can distinguish them. I'd keep both — the pair is what makes the \"reused signal\" case safe regardless of which way the race resolves.\n\n# The tests\n\n`media-provider.fetch.test.ts`, 14 tests, driven against a local HTTP server on an ephemeral port — the same approach `server-helpers-fetch.test.ts` uses for the sibling helper. No stubbed `fetch`, no network, no timing luck.\n\n- method, headers and body pass through unchanged\n- a **non-2xx response is not a failure** — the providers check `response.ok` themselves and read the error body, so rejecting here would hide their messages behind a generic network error\n- aborts once `timeoutMs` elapses; does **not** abort a request that finishes in time\n- the timer is cleared on success **and on failure** — `.finally` rather than `.then` is what makes the second one true, and a leaked timer in a long-lived agent accumulates one handle per provider call\n- the three caller-signal cases: already aborted (and the server is never reached), aborted mid-flight, and supplied-but-never-fired (which must still time out normally)\n- a caller abort resolves in well under the 30s timeout, proving it came from the caller and not the timer\n\nPlus three for `createMediaProviders`, which was also untested: it is **fail-fast and all-or-nothing** — the four factories are evaluated eagerly inside one object literal, so an unusable image slot aborts the bundle before audio, video or vision are constructed, and the image message is the one an operator actually sees.\n\n# Evidence\n\n```\nbunx vitest run packages/agent/src/providers/media-provider.fetch.test.ts   → 14 pass\n  with the existing media-provider suite                                    → 42 pass across 2 files\nbun run --cwd packages/agent typecheck                                      → clean\nbunx @biomejs/biome check                                                   → clean\n```\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signe n { ok: false, status: 429, body: anthropicQuotaError() };\n}\n```\n\nLines are written with `appendFileSync`, so a crash, a signal or a full disk\nbetween the record and its trailing newline leaves a partial line behind. I\nseeded a real record, appended one truncated line, and called the admission\nfunction twice:\n\n```\nattempt 1: THREW SyntaxError\nattempt 2: THREW SyntaxError\n```\n\nNothing skips or repairs the line, so it is not one failed request — every\nlater admission decision re-reads the same bytes and throws again, in this\nprocess and in every future one. `queryAccountPoolConsumerUsage` throws with it.\n\n## The same cast also decides wrongly rather than loudly\n\n`used` is a `reduce` over `record.totalTokens`. One well-formed line missing\nthat field makes the sum `NaN` — and `NaN \u003e quota` is `false`. Against a\nconsumer already far past a 100-token quota:\n\n```\nover-quota admission BEFORE: {\"ok\":false,\"status\":429,...}\nover-quota admission AFTER : {\"id\":\"qbfxPIAqQd3VrtsV\",...}     \u003c- admitted\n```\n\nTwo more shapes behave the same way: a record with no `usage` object throws a\n`TypeError` out of the summary via `addRecordToBucket`, and a record with no\n`ts` passes *both* halves of `parsed.ts \u003c start || parsed.ts \u003e= end` — since\n`undefined` compares `false` either way — so it is counted into every day.\n\n**On reachability, so the severity is not overstated:** `normalizeUsage` runs\nevery member through `normalizeNonNegativeInteger`, so `usageTotal` is always\nfinite and today's writer *cannot* emit a record without `totalTokens`; the\nfield and the log format also arrived in the same commit (d59e659500), so no\nolder schema produced one either. The quota bypass therefore needs external\nmodification of the state directory or a future schema change. **The truncated\nline does not** — an interrupted append is enough. So the throw is why this\nneeds fixing, and the bypass is why the fix validates rather than merely\ncatching: a bare `try/catch` closes the outage and leaves the gate open.\n\n## The fix, and why it is this shape\n\nThis module already applies the right rule to its *other* untrusted input.\n`consumeEvent` guards `JSON.parse` on upstream SSE bytes:\n\n```ts\n} catch {\n  // error-policy:J3 upstream SSE data is untrusted input; malformed events\n  // are invalid for metering but the already-enqueued passthrough bytes are\n  // still owned by the transport proxy.\n  return;\n}\n```\n\nA log line written by a previous process is untrusted in exactly the same sense.\nThis extends that existing in-file policy to the reader 900 lines away, rather\nthan importing an outside opinion: skip a line that cannot be parsed, and\nvalidate the rest through `isUsageRecord`, which checks every field the\naggregation and the quota comparison go on to accumulate or compare.\n\n## What I deliberately did not change\n\n- **The damaged line is left on disk.** #30528 evicts an unreadable row because\n  a cache row is reconstructible; this is an audit log, and repairing it by\n  rewriting would destroy records. Skipping is the whole remedy.\n- **No logger.** The module imports only node builtins plus `resolveStateDir`,\n  and its own SSE precedent skips silently with a comment. Adding a logging\n  dependency to announce a skipped line would be a bigger change than the fix.\n  If you would rather surface a skipped-line count, say so and I will add it —\n  it is a deliberate omission, not an oversight.\n- **A truncation that strands the newline still costs the *next* record too**,\n  because the following append glues onto the same line. That is inherent to\n  the JSONL-plus-`appendFileSync` format, not something the reader can recover;\n  a test pins the boundary explicitly so the limit is documented rather than\n  assumed.\n- `readTotalsFile`, `readReservationsFile` and `readKeysFile` are untouched.\n  What separates them from the log reader is that all three read a *whole* file\n  written through `atomicWriteJson` (temp file + `rename`), so the interrupted\n  write that produces a partial JSONL line cannot produce a partial one of\n  these. `readReservationsFile` and `readKeysFile` additionally check a version\n  and reject a bad shape — `readReservationsFile` validates every reservation\n  field by field, which is the model I followed for `isUsageRecord`.\n  `readTotalsFile` does **not**: it is a bare\n  `JSON.parse(readFileSync(file)) as AccountPoolConsumerUsageTotals` with no\n  checks at all, so a totals file with no `byConsumer` would throw a\n  `TypeError` out of `recordAccountPoolConsumerUsage`. I am leaving it out of\n  this PR because its atomic write means nothing in normal operation produces\n  such a file — but the asymmetry with its immediate neighbour is real, and if\n  you would like it validated too, say so and I will extend this PR rather than\n  open a second one against the same module.\n\n## Tests\n\n9 added, alongside the 10 existing ones.\n\n- Admission survives a truncated trailing line, **twice** — the second call is\n  what proves it is not permanent.\n- A damaged line costs only its own record: intact records before it, and after\n  it when the newline survived, are still counted.\n- A table of five non-conforming shapes (no `totalTokens`, no `usage`, a\n  missing `usage` member, no `ts`, a string `totalTokens`) is ignored by the\n  summary.\n- An exhausted quota **stays** exhausted when a `totalTokens`-less line is\n  appended.\n- **Liveness control**: two intact records around a damaged line still report\n  `tokens: 17`, `requests: 2`. Without it, every \"is ignored\" assertion above\n  would pass just as well if the reader returned nothing at all.\n\n**Ablation** — reverting only the reader and re-running:\n\n```\nTests  9 failed | 10 passed (19)\n```\n\nRestored: `19 passed`. Biome clean. `tsc -p packages/app-core` reports 22\nerrors, unchanged from `develop` and none in either changed file.\n\nCompute receipt: 0 project ge projects the attempt's late result:\n\n```ts\nif (!result) {\n  void attempt\n    .then((late) =\u003e (late ? projectResolution(late) : undefined))\n    .catch(() =\u003e undefined);\n  return;\n}\nreturn await projectResolution(result);\n```\n\nThe projection body is lifted into `projectResolution` so both stages share one implementation rather than duplicating the write-and-telemetry block. **Behaviour on the non-deadline path is unchanged** — the diff there is pure extraction.\n\nThe late stage is deliberately **best-effort**: it is not registered with `waitUntil`, because registering a possibly-never-settling attempt is exactly the hang above. On a Worker the isolate may be torn down before the late write lands. That is strictly better than guaranteed-abandoned, and a durable version would need its own bounded second deadline — happy to add that instead if maintainers prefer it.\n\n## Second fix: the session strong-boundary gate was unobserved\n\n`inference-session-auth-context.ts:245` gates the session projection so a session failing `enforceStrongSessionBoundary` is never cached as authorized. Removing it entirely left the suite **12 pass / 0 fail** — nothing tested it. This adds that test.\n\n## Verification\n\nBoth new tests were confirmed load-bearing by reverting only the corresponding source behaviour:\n\n| | with fix | fix reverted |\n|---|---|---|\n| `inference-auth-context.test.ts` | **53 / 53** | 52 pass / **1 fail** |\n| `inference-session-auth-context.test.ts` | **13 / 13** | 12 pass / **1 fail** (gate removed) |\n\nAlso executed:\n\n- `bun run format:check` → **143 / 143 tasks successful**\n- `biome check` on all three changed files → clean\n- `tsc --noEmit -p packages/cloud/shared/tsconfig.json` → **exit 0**\n- All 20 `*inference*` suites in `packages/cloud/shared` → green, except `inference-hot-path-benchmark.test.ts`, which **fails identically on clean `develop`** (pre-existing, unrelated to this change).\n\n## Context\n\nThese two defects w liza/releases/download/pr-evidence-12/31408-vault-restore-proof-a66cb086.json).\n"])</script><script>self.__next_f.push([1,"3f:T1b42,"])</script><script>self.__next_f.push([1,"# What\n\n`healthScopesToCapabilities` converts the scopes a user actually granted at a provider's consent screen into the capabilities this agent will exercise. It is a **consent-fidelity boundary**: a capability it returns that the granted scopes don't cover is a promise the token can't keep, and a capability it drops silently disables a feature the user did authorize.\n\nIt is four hand-written per-provider branches, and **nine of the ten exports in `health-oauth.ts` were referenced by no test in the repo** — including this one. This adds 40 tests. No production change.\n\n# Both directions of the boundary\n\nThe two invariants I most wanted are cheap to state and easy to break in a copy-and-adapt file like this one:\n\n- **No over-grant** — for every single-scope grant *and* the full grant, every derived capability must appear in that provider's declared capability set.\n- **No under-grant** — authorizing the full `defaultScopes` must yield *exactly* the declared set. If those diverge, the connector either advertises a capability no scope can unlock, or requests a scope that unlocks nothing.\n\nBoth hold for all four providers today, and both are now asserted per-provider rather than by eyeball. The second one is a **cross-file** check: it ties `health-oauth.ts`'s branches to `health-provider-registry.ts`'s `capabilities` and `defaultScopes` lists, so registry drift in either direction fails the suite.\n\nAlso pinned: empty scopes derive nothing; unrecognised scopes derive nothing; adding a scope never *removes* a capability; results are deduplicated; and both accessors return copies rather than the shared registry arrays (a caller that sorts or splices the result must not mutate every later connector's spec).\n\n# Scope matching must stay exact\n\n```ts\nconst set = new Set(scopes);\n...\nif (set.has(\"activity:read\") || set.has(\"activity:read_all\")) { ... }\n```\n\nA refactor to `startsWith` or `includes` would let `activity:read_all_admin` or `daily-summary` unlock real health data. There's a test that feeds each provider its own scopes mangled three ways — `${scope}_extra`, `x-${scope}`, and uppercased — and requires an empty result.\n\n# One thing I looked at and deliberately did NOT change\n\nWithings maps **two** scopes to `health.sleep.read`:\n\n```ts\nif (set.has(\"user.activity\")) {\n  capabilities.push(\"health.activity.read\", \"health.sleep.read\");\n}\nif (set.has(\"user.sleepevents\")) capabilities.push(\"health.sleep.read\");\n```\n\nThat asymmetry looked like a possible over-grant, so I traced the sleep sync to `withingsPost(args.token, \"/v2/sleep\", …)` in `health-connectors.ts:1019`. **I could not determine from inside this repository which Withings scope that endpoint actually requires** — the vendor's docs are the authority and I can't verify them from here.\n\nChanging scope semantics on a guess would be the wrong move, so I pinned both mappings exactly as they stand and am flagging the question instead. If `user.activity` alone genuinely covers Withings sleep, this is correct as written and the test documents it. If it doesn't, the fix is one line plus one assertion. **Your call — you have the vendor context I don't.**\n\n# Mutation testing: 15 mutants, 14 killed\n\nSpanning both `health-oauth.ts` and `health-provider-registry.ts`:\n\n| mutant | result |\n|---|---|\n| strava requires *both* activity scopes instead of either | killed |\n| strava grants on the identity-only `read` scope | killed |\n| oura `daily` drops readiness | killed |\n| oura vitals requires both `heartrate` **and** `spo2` | killed |\n| oura `personal` maps to vitals instead of body | killed |\n| fitbit `activity` loses workouts | killed |\n| fitbit `weight` maps to vitals instead of body | killed |\n| withings `user.activity` loses sleep | killed |\n| withings `user.metrics` loses vitals | killed |\n| accessors return the registry array by reference | killed (×2) |\n| scope matching by prefix | killed |\n| registry: fitbit declares an extra capability | killed |\n| registry: fitbit drops its `sleep` default scope | killed |\n| oura `new Set(...)` dedup removed | **survived — redundant** |\n\n**The dedup survivor is genuine redundancy, not a coverage hole**, and I checked rather than assumed: oura's four push sites are guarded by mutually exclusive conditions pushing distinct capabilities, so no input can produce a duplicate. Same for the fitbit and withings branches. I'd **keep** them — they cost nothing and become load-bearing the moment a scope is added that overlaps an existing one. No test can kill them, and writing one would mean asserting an unreachable state.\n\n# Evidence\n\n```\nbunx vitest run test/health-oauth-scopes.test.ts   → 40 pass\nbunx vitest run test/ src/health-bridge/           → 75 pass, 4 skipped across 13 files\nbunx tsc --noEmit                                  → clean\nbunx @biomejs/biome check                          → clean\n```\n\nTests only — `git diff` touches no source file.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MRRRRTAS3Q8P4AX2KY8JG1\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T23:13:23.226Z\",\"completed_at\":\"2026-09-03T23:14:09.221 ute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Branched from `origin/develop` at `9c6fc21cce`; zero conflicts. Exact head `d84cdedbde84da9d8e2aaac636d3de87b410dacd`.\n\n# Risks\n\nLow and contained to `reconnect.ts`. The ladder's success, failure, and exhaustion behaviour is unchanged when the monitor is not stopped — the harness control case pins that (attempt 1 fails, attempt 2 succeeds, `onReconnect` fires once). The only new behaviour is that a stopped monitor abandons its ladder: no further `provision` calls, no callbacks, no pending timer. `start()` after `stop()` gets a fresh epoch, so a restarted monitor is unaffected by the abandoned ladder.\n\n# Background\n\n## What does this PR do?\n\n`stop()` (`reconnect.ts:49-57`) cleared the heartbeat interval and reset `reconnecting`, but a running `attemptReconnect()` (`:91-131`) held no reference to either. It kept calling `client.provision()` on the client captured at construction — so a swapped API key was never seen — and slept on a bare `setTimeout` (`:112`) that nothing could clear, for up to ten attempts with backoff capped at 60s. On success it fired `onStatusChange(\"connected\")` and `onReconnect()` regardless; on exhaustion it fired `onStatusChange(\"disconnected\")` minutes after a clean stop. Through `CloudManager.disconnect()` / `replaceApiKey()` that flips a deliberate disconnect back to `connected` with a `null` proxy.\n\nThe fix: `stop()` advances an `epoch` and wakes any pending backoff sleep; the ladder captures the epoch on entry and returns after every `await` once it has moved; the backoff timer is stored and cleared instead of left dangling.\n\n## What kind of change is this?\n\nBug fix.\n\n# Documentation changes needed?\n\nNo.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-elizacloud/src/cloud/reconnect.test.ts` — five cases over the real `ConnectionMonitor` with fake timers and a stub client. Each of the three fence points is killed by its own case.\n\n## Detailed testing steps\n\n1. Check out exact head `d84cdedbde84da9d8e2aaac636d3de87b410dacd`.\n2. From `plugins/plugin-elizacloud`: `bun x vitest run src/cloud/reconnect.test.ts` → **5/5**.\n3. RED control — the same five tests against `origin/develop`'s `reconnect.ts`: **4 failed | 1 passed** (only the harness control passes). Failures: `provision` called 2× after `stop()`; 1 timer still pending; a provision resolving after `stop()` still emits `connected`; all 10 attempts run and exhaustion is reported after `stop()`.\n4. Mutation kills, each applied alone and reverted:\n   - drop the post-provision epoch check → the mid-flight case fails (1/5);\n   - drop the post-sleep epoch check → the abandon and exhaustion cases fail (2/5);\n   - remove `cancelBackoff()` from `stop()` → the no-pending-timer case fails (1/5).\n5. Pinned Biome on both files: exit 0.\n\n\u003c!-- evidence-head:d84cdedbde84da9d8e2aaac636d3de87b410dacd --\u003e\n\n## Evidence\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- Before screenshots: N/A — connector lifecycle state with no rendered surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- After screenshots: N/A — connector lifecycle state with no rendered surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- Walkthrough video: N/A — the RED control and three independent mutation kills below are the proof.\n\u003c!-- evidence-row:backend-logs --\u003e\n- Backend logs:\n\n\u003cdetails\u003e\u003csummary\u003eReproduction against develop, RED control, green at head, and the three mutation kills\u003c/summary\u003e\n\n```\n# reproduction: real ConnectionMonitor + CloudManager, stop() between provision attempts (origin/develop)\n Info  [cloud-monitor] Reconnect attempt 1/10...\n Info  [cloud-monitor] Connection monitor stopped\n Info  [cloud-monitor] Reconnect attempt 2/10...\n Info  [cloud-monitor] Reconnection successful\n[\"onDisconnect\",\"status:reconnecting\",\"provision#1\",\"--- after stop(); isMonitoring=false ---\",\n \"provision#2\",\"status:connected\",\"onReconnect\",\"--- 4s after stop(); provisionCalls=2 ---\"]\nAFTER disconnect; status=disconnected proxy=null agentId=null\n4s LATER; status=connected proxy=null agentId=null provisionCalls=3\n\n# RED control: this PR's tests vs origin/develop reconnect.ts\n      Tests  4 failed | 1 passed (5)\n\n# head d84cdedbde\n      Tests  5 passed (5)\n\n# mutation A -- drop post-provision epoch check\n × ignores a provision call that resolves after stop() was called mid-flight\n      Tests  1 failed | 4 passed (5)\n# mutation B -- drop post-sleep epoch check\n × abandons an in-flight ladder after stop(): no more provisioning, no callbacks\n × does not report exhaustion for a ladder that was stopped mid-backoff\n      Tests  2 failed | 3 passed (5)\n# mutation C -- stop() no longer cancels the backoff\n × leaves no backoff timer pending after stop()\n      Tests  1 failed | 4 passed (5)\n```\n\n\u003c/details\u003e\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- Frontend console/network logs: N/A — no frontend surface changed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- Live-model trajectory: N/A — deterministic timer/state path with no model call.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- Domain artifacts:\n\n\u003cdetails\u003e\u003csummary\u003eFence points and static gates at exact head\u003c/summary\u003e\n\n```\nreconnect.ts  stop(): this.epoch += 1; this.cancelBackoff()\nreconnect.ts  attemptReconnect(): const epoch = this.epoch  (entry)\n              after await provision  -\u003e if (epoch !== this.epoch) return\n              after await sleepBackoff -\u003e if (epoch !== this.epoch) return\nreconnect.ts  sleepBackoff(): timer handle stored; cancelBackoff() clears it and resolves the sleep\n\n$ node_modules/.bin/biome check \\\n    plugins/plugin-elizacloud/src/cloud/reconnect.ts \\\n    plugins/plugin-elizacloud/src/cloud/reconnect.test.ts\n(exit 0, captured directly)\n\n$ git diff --stat origin/develop..HEAD\n .../plugin-elizacloud/src/cloud/reconnect.test.ts  | 154 +++++++++++++++++++++\n plugins/plugin-elizacloud/src/cloud/reconnect.ts   |  35 ++++-\n 2 files changed, 188 insertions(+), 1 deletion(-)\n```\n\n\u003c/details\u003e\n\n\u003c!-- evidence-row:ocr-review --\u003e\n- OCR review: N/A — no captured imagery.\n\n# Known gaps / failures\n\n- Three sibling suites in `src/cloud/` (`auth.session-id`, `cloud-api-key.authority`, `managed-payment-clients.routes`) fail in this review worktree with `Cannot find package '@elizaos/core/client-public'` — identically with `reconnect.ts` restored to develop, and none of them import `reconnect`. That is this worktree's package linking, not this change; the focused suite, RED control, and mutation kills above are the evidence.\n- `bun run verify` was not run for the same reason.\n\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-fable-5-1\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"48:T1a9a,"])</script><script>self.__next_f.push([1,"# What\n\n`PendingUserAction`, `PendingUserActionKind` and `PendingUserActionOption` are each declared **twice** under `packages/core/src/types`, and the two sets are structurally incompatible:\n\n| | `types/task.ts` | `types/pending-user-action.ts` |\n|---|---|---|\n| `PendingUserActionOption` | `{ name: string; description?: string; isCancel?: boolean }` | `{ id: string; label: string; isDefault?: boolean; isCancel?: boolean }` |\n| `PendingUserActionKind` | 4 members, incl. `\"clarifying\"` | 9 members, incl. `\"clarifying_question\"` |\n\nBoth docstrings claim to be the canonical #9449 Pillar C contract. `pending-user-action.ts` says it is \"the shared contract: every source maps its own shape onto this one interface\".\n\n# Why there is no TS2308\n\n`types/index.ts` re-exports the `pending-user-action.ts` names through an **explicit list**, and an explicit re-export outranks the `export * from \"./task\"` below it. So the duplicate is masked rather than reported.\n\nThat list was not a deliberate decision about these two shapes. Three commits landed on 2026-06-24 within 25 minutes:\n\n| time | commit | effect |\n|---|---|---|\n| 21:49 | `5a53e651f4` | adds `pending-user-action.ts` — the contract file, alone in its diff |\n| 21:59 | `2c23c4a33e` (#9569) | adds the second copy into `task.ts`, ten minutes later |\n| 22:14 | `122699af89` | converts `export * from \"./pending-user-action\"` into the explicit 7-name list |\n\nThat third commit is titled *\"feat(core): bridge raw connector message events\"* — the barrel edit is 10 lines of collateral in an unrelated change, applying the compiler's own suggestion (\"Consider explicitly re-exporting to resolve the ambiguity\"), which silences the diagnostic by making one side win silently.\n\n# The change\n\nDelete the `task.ts` trio and restore the plain `export *`.\n\nThe `task.ts` declarations are **unreachable**: the barrel serves the other shape, and nothing deep-imports them (`approval-routes.ts`, the UI notification components and `client-approvals.ts` all import from `@elizaos/core`). Everything already uses the `pending-user-action.ts` shape, so this removes dead code — it does not migrate anyone.\n\n# Ablation\n\n`typecheck` error counts, baselines 0/0/0:\n\n| variant | core | agent | ui |\n|---|---|---|---|\n| develop | 0 | 0 | 0 |\n| **A** — delete the `task.ts` trio only | 0 | 0 | 0 |\n| **B** — restore `export *` only | **3** | **3** | **3** |\n| **A + B** (this PR) | 0 | 0 | 0 |\n\nB's three errors are `TS2308` naming exactly `PendingUserAction`, `PendingUserActionKind` and `PendingUserActionOption`, which is the confirmation that these three names are the whole collision and the explicit list is the only thing hiding them.\n\nA alone is invisible; B alone breaks the build. Only the pair is correct, and it leaves the barrel uniform so a **future** re-duplication of these names raises TS2308 loudly instead of being masked.\n\n# The guard\n\n`packages/core/src/__tests__/types-barrel-export-collisions.test.ts`, following the existing `service-type-collisions.test.ts` precedent (AST scan plus an allowlist that demands a reason).\n\nRestoring `export *` only protects against a re-duplication that nobody papers over again. The test asserts the property the compiler *stops* checking the moment a star becomes an explicit list: across every module the barrel re-exports from, no exported name resolves to more than one underlying declaration.\n\nIt builds a real `ts.Program` and resolves through the checker, following alias chains — so re-exporting one binding through several files is not mistaken for a second declaration. A second test case pins that non-collision directly.\n\n**Proven against the unfixed tree.** With develop's two files restored it fails naming exactly the three names with correct file attribution — and it catches them *with the explicit list still in place*, which is the case TypeScript does not check:\n\n```\n+   \"PendingUserAction\n+   - ./pending-user-action -\u003e packages/core/src/types/pending-user-action.ts\n+   - ./task -\u003e packages/core/src/types/task.ts\",\n```\n\nThe scan is not vacuous: **65 modules resolved, 1238 export slots** compared, and only these three collided.\n\n# Verification\n\n- `typecheck`: core, agent, ui — **0 errors** each.\n- **177 tests green**: core barrel-collision + `pending-user-action-suite` + `approval` (18), agent `approval-routes` (41), ui `pending-action-notifications` + `NotificationsHomeCenter` (118).\n- `biome check` clean on all three files; `bunx vitest list` confirms the new file is collected.\n\n# Scope\n\nI did not touch the surviving contract or migrate any consumer, and I did not judge which of the two shapes is bett fail-closed contract for the super-admin canary seam — the one that swaps the container image under a running agent. Its own header calls it *\"the fail-closed image and target contract for super-admin demo canaries\"*.\n\nTwo of its exports run on inputs that are not freshly constructed by the caller: `isAdminCanaryImageJobData` gates dispatch on a **persisted job row** at `provisioning-jobs.ts:991` and `db/repositories/jobs.ts:173`, and `assertAdminCanaryImageJobData` runs immediately after it.\n\nThe suite covered the happy path, the upper target bound, duplicate agents and the plan fingerprint. This pins the edges beside them.\n\n# Evidence\n\nMutating each guard to a no-op, against `admin-canary-image.test.ts` + `admin-agent-image-rollout.pglite.test.ts`:\n\n| mutant | before | after |\n|---|---|---|\n| `SHA256_DIGEST_RE`: drop the `$` anchor | **survived** | killed |\n| `UUID_RE`: drop the `$` anchor | **survived** | killed |\n| `targets.length \u003c 1` (empty list) | **survived** | killed |\n| duplicate key `org:agent` → `agent` | **survived** | killed |\n| `isAdminCanaryImageJobData`: drop the operation union | **survived** | killed |\n| `isAdminCanaryImageJobData`: drop the string-field check | **survived** | killed |\n| `decisionAt` `Number.isFinite(Date.parse(...))` → `false` | **survived** | killed |\n| `assertDemoSourceImage` repository check → `false` | **survived** | killed |\n| `targets.length \u003e MAX` | killed | killed |\n| duplicate-target `seen.has(key)` | killed | killed |\n| demo repository prefix check | killed | killed |\n| canonical early return in `…CanonicalOrDemoPair` | killed | killed |\n| demo-pair digest equality | killed | killed |\n| `requestId` regex → case-insensitive | killed | killed |\n| target \"must change the current image pair\" | killed | killed |\n| recovery-metadata all-or-nothing check | killed | killed |\n\n**8 new kills; 18 mutants, 8 of which survived before.** The three the suite already caught still die — the new erColumnSQL`. `sql-generator` then asks `checkIfTypeChangeIsDestructive`, which normalizes the same pair with *its* copy.\n\nSo for a column introspected as `timestamp with time zone` against a schema spelling it `timestamptz`, the diff reports a change and the generator considers the two types identical — an `ALTER` that changes nothing, **re-emitted on every migration run**. Running both copies verbatim over the four spelling pairs:\n\n```\nprev (from DB)                curr (from schema)          diffCalc changed?  sqlGen equal?\ntimestamp with time zone      timestamptz                 true               true    \u003c-- spurious\ntimestamptz                   timestamp                   true               true    \u003c-- spurious\ntimestamp without time zone   timestamp                   false              true\ntimestamptz                   timestamp with time zone    true               true    \u003c-- spurious\n```\n\nThe diff never converges for such a column.\n\n## Why taking `sql-generator`'s variant loses nothing\n\nThis was the part worth checking rather than assuming. Collapsing `timestamptz` into `\"timestamp\"` looks like it would stop a genuine `timestamp` → `timestamptz` migration from being detected. It doesn't, because `diff-calculator` **already** collapses `timestamp without time zone` and `timestamp with time zone` to the same value — a real with/without-timezone change is already not detected there. Only the short alias slipped through, and only when the schema happened to spell it `timestamptz`. That is an incomplete alias list, not a designed capability.\n\n**The alternative I rejected:** keeping tz and non-tz distinct in a shared normalizer would be the semantically tighter choice, but `checkIfTypeChangeIsDestructive` returns `true` for any pair absent from `safeConversions`, and that table has:\n\n```ts\ntimestamp: [\"timestamp\"], // Simplified since normalization handles variations\n```\n\nSo distinguishing them would reclassify real timestamp changes as destructive and require extending that table. That is a semantics decision for maintainers, not something to smuggle into a de-duplication fix. Happy to do it as a follow-up if you'd like the tighter behaviour.\n\n## The change\n\n- `normalizeType` moves to a new `type-normalization.ts` with a comment recording *why* it must be one function — the two callers answer halves of one decision, so divergence makes the migrator contradict itself.\n- Both files import it; both private copies deleted. **Net −97 lines.**\n- A local `normalizeType` arrow inside `checkIfNeedsUsingClause` is renamed `baseType`. It strips the precision suffix to get a bare type name for the pair lookups, which is a different job, and it would otherwise shadow the new import. Block-scoped, so behaviour is unchanged.\n\n## Tests\n\nThe existing coverage is `type-normalization.real.test.ts`, and it would not have caught this for two reasons:\n\n1. The default vitest lane **excludes** it — `exclude: [..., \"**/*.real.test.ts\", ...]`.\n2. Its `timestamptz` case asserts only that `SELECT COUNT(*)` succeeds after migrating. It never checks that a **second** run finds nothing left to do, which is precisely the symptom.\n\nAdded 15 unit tests in the running lane covering the timestamp spellings (including an all-pairs-equal check), serial/bigserial/smallserial, numeric/decimal precision, `character varying` with and without a length, both text-array spellings, and pass-through of an unrecognised type.\n\n**Liveness control.** Reverting the shared normalizer to the drifted `diff-calculator` variant fails exactly 3 of the 15 — the two `timestamptz` spellings and the all-pairs-equal case.\n\n| check | result |\n|---|---|\n| `bun run typecheck` (`plugin-sql`) | exit 0 |\n| `vitest run runtime-migrator` | 15 passed |\n| `biome check` (4 touched files) | clean |\n\n## How this was found\n\nLooking for something else entirely — a scan for `String.replace` with a **string literal** pattern, which replaces only the first occurrence, in sanitizing contexts. That vein came up empty: 4270 `.replace()` calls, 337 with a string-literal pattern, 7 in a sanitize/normalize/strip context, and all 7 are clean (`parsePgTimestampWithoutTimezoneUtc` replaces the single space in a PG timestamp; `parseCudaCompute` has already stripped the `sm_` prefix so one underscore remains; the Reddit helper strips a `t3_` fullname prefix and base36 ids cannot contain an underscore; the rest are fixtures).\n\nWhat the scan did surface was `normalizeType` appearing twice in the same directory, which was worth more than the thing I was looking for.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PPHARXF8S4VYX1Z2TWRENN\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T17:12:51.230Z\",\"completed_at\":\"2026-09-04T17:17:45.637Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T17:12:51.803Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\" ail\ndrop activation_container_id === null             -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_node_id === null                  -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_boot_id === null                  -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_completed_at === null             -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_purpose === \"restore\"             -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop !activation_token_ciphertext.includes(NUL)   -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_consent_head_backup_id === null   -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\n…\n```\n\nThe suites only ever present rows that satisfy every clause at once, so they prove the conjunction as a whole and nothing about its parts. Dropping `activation_container_id === null` — which is what stops a sandbox that already has a container from being handed fresh vault key material — is currently a free change.\n\n# The change\n\nTests only, one new file. A single fixture representing a pristine `container_pending` restore quarantine, then one case per clause that violates exactly that clause, grouped by what each group protects:\n\n- **binding identity** (8) — soft-deleted row, another attempt's activation, unpinned or drifted lifecycle revision, non-restore purpose, wrong backup, wrong manifest hash, wrong activation-token hash;\n- **token ciphertext** (5) — absent, non-string, empty, over the byte bound, NUL-bearing;\n- **consent columns** (3) — the three that belong to a different activation path;\n- **precreate exactness** (11) — phase moved on, receipt, receipt hash, container, node, image digest, boot id, published authority, funding revision, dispatch, completion.\n\nPlus both sides of the ciphertext bound: exactly `MAX_ACTIVATION_TOKEN_CIPHERTEXT_BYTES` is accepted, and the bound is counted in UTF-8 **bytes** — a two-byte character repeated to the code-unit limit is refused. A denial-only table can always be satisfied by loosening the bound, so it is pinned from above and below.\n\n# Evidence\n\n`bun test src/db/repositories/__tests__/agent-backup-restore-precreate-quarantine.test.ts` → **30 pass / 0 fail**.\n\nSame battery, after: **22 of the 23 clauses now fail the new suite when dropped** (29 pass / 1 fail each; the `typeof … === \"string\"` clause fails 2).\n\n**One survivor, and it should not block:** `activation_lifecycle_revision !== null` cannot be killed, because the clause immediately after it — `activation_lifecycle_revision === BigInt(sandbox.lifecycle_revision)` — is false for `null` regardless. `lifecycle_revision` is `.notNull().default(0)`, so `BigInt(...)` cannot throw and cannot yield `null`; the `!== null` term is genuinely subsumed. It reads as a useful narrowing hint, so I have not touched it — but no fixture can distinguish its presence from its absence, and I would rather say that than pad the suite with a case that looks like it covers the clause and doesn't.\n\nNeighbouring suites unchanged, run file by file (combined `bun test` invocations in `cloud/shared` have produced false reds):\n\n```\nagent-backup-restore-quarantine.pglite.test.ts        18 pass  0 fail\nagent-backup-restore-authority.pglite.test.ts         31 pass  0 fail\nagent-backup-restore-operations.pglite.test.ts        27 pass  0 fail\nagent-backup-restore-authority-binding.test.ts         2 pass  0 fail\nagent-backup-global-lock-order.test.ts                 6 pass  0 fail\n```\n\n`bunx @biomejs/biome check` → clean. `bunx tsc --noEmit -p packages/cloud/shared/tsconfig.json` → no errors in the new file.\n\n# Context\n\nSame sweep as #30418 and #30419: multi-clause guards proven in aggregate but not per term. This one is the largest and sits on the most sensitive gate of the three.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / accurate about severity rather than dress this up: this was **not** a live defect. It was dead, divergent, exported contract code that would have become one the first time anything in health imported its own copy and tried to log a household event.\n\n# The change\n\n- Import `LIFEOPS_AUDIT_EVENT_TYPES` and `LifeOpsAuditEventType` from `@elizaos/shared`, alongside the signal-source vocabulary already imported there.\n- Re-export both from the existing re-export block.\n- Delete the 34-entry local array and its derived type.\n- Extend the header comment to name the audit-event vocabulary too, so the stated policy matches the code.\n\nNet **+8 / −42** in the source file. The public surface of `@elizaos/plugin-health` is unchanged in shape — both names are still exported — and the union only widens, so no existing producer or consumer can break. There are no in-repo exhaustive switches over the type (nothing imports health's copy at all).\n\n# Regression test\n\nNew file, `lifeops-audit-event-vocabulary.test.ts`, 14 tests. The assertion that matters is **identity, not deep equality**:\n\n```ts\nexpect(LIFEOPS_AUDIT_EVENT_TYPES).toBe(CANONICAL_AUDIT_EVENT_TYPES);\n```\n\nA reintroduced local array with identical contents satisfies `toEqual` and then drifts again on the next canonical edit. `toBe` is the only thing that says \"this is the canonical list, not a snapshot of it.\"\n\nThe eleven previously-missing types are also named individually, so the specific regression this file exists for is asserted by name rather than only by length — a future canonical addition changes the count but must not silently drop any of them.\n\n# Evidence\n\nExecuted at `01eec61dd9`.\n\n| mutant | result |\n|---|---|\n| control | **14 passed** |\n| reintroduce a local copy with **identical** contents | **1 failed** — the identity assertion |\n| re-narrow the export to the old two health-owned entries | **12 failed** |\n\n**Suites:** new file **14 passed**. Full `plugin-health` suite → **213 passed / 4 skipped**, 38 files. Consumer package `plugin-goals` → **74 passed / 1 skipped**.\n\n**Typecheck:** `plugin-health` exit **0**; `plugin-personal-assistant` exit **0**; `plugin-goals` exit **0**. Biome on both changed files → clean.\n\n# One note on conventions\n\nMy first draft imported from `bun:test` and failed `plugin-health`'s typecheck (`Cannot find module 'bun:test'`) — this package runs **vitest** (`\"test\": \"vitest run --config vitest.config.ts\"`), and my file was the only `bun:test` user in it. Switched to `vitest` and typed the `it.each` parameter explicitly to clear `TS7006`. Flagging it only because \"the tests pass\" and \"the package typechecks\" were two different questions here, and the first passed before the second did.\n\n# Related, not fixed here\n\n`LIFEOPS_AUDIT_EVENT_TYPES` had **zero** test references anywhere in the repo before this. It is one of roughly 68 exported LifeOps vocabulary lists in `personal-assistant.ts` with no test naming any member. I have not tried to pin them — that would be a large diff of low leverage, and most of those lists have no second copy to drift against. This PR covers the one that had actually drifted.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1M16XGABDENVFZFTXM1583K\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T16:21:41.002Z\",\"completed_at\":\"2026-09-03  arithmetic in `bigint`, and format exactly once with `formatUnits`.\n\n- `half` -\u003e `raw / 2n`\n- `max` -\u003e `(raw * 9n) / 10n`, preserving the existing 10% gas reserve exactly\n- `percent` -\u003e percentage scaled to an integer basis-of-a-million so fractional percentages stay representable, then `(raw * scaledPercent) / 100_000_000n`\n\nNative decimals come from `chainConfig.nativeCurrency.decimals`. The lookup is skipped when the balance is `undefined`, so the existing unknown-balance `EVMError` still fires first and a chain the model may have invented never reaches `getChainConfigs`.\n\n## Verification\n\nExecuted on this branch at `84b670efc4`, worktree off `origin/develop` at `9b93ec4374`.\n\n**Behaviour, before -\u003e after** (the before column is the failure recorded in the issue):\n\n| case | before | after |\n|---|---|---|\n| `half` of `0.0000001` | `\"5e-8\"` -\u003e `parseUnits` throws | `\"0.00000005\"` |\n| `max` of `0.0000001` | `\"9e-8\"` -\u003e `parseUnits` throws | `\"0.00000009\"` |\n| `30%` of `0.0000005` | `\"1.5e-7\"` -\u003e `parseUnits` throws | `\"0.00000015\"` |\n| `1%` of `0.00001` | `\"1.0000000000000001e-7\"` -\u003e `parseUnits` throws | `\"0.0000001\"` |\n\n**Regression control** — ordinary balances are byte-identical: `half` of `2` -\u003e `\"1\"`, `max` of `10` -\u003e `\"9\"`, `30%` of `10` -\u003e `\"3\"`, `25%` of `8` -\u003e `\"2\"`. All four are covered by pre-existing tests that still pass unchanged.\n\n**Red/green check.** Stashing only the source change and re-running the suite fails the 4 new tests with exactly the issue's reported values (`Expected: \"0.0000001\"` / `Received: \"1.0000000000000001e-7\"`) while the 10 pre-existing tests stay green. Restoring the fix takes the file to 14/14.\n\n**Gates run locally:**\n\n```\nbun run --cwd plugins/plugin-wallet test\n  -\u003e Test Files  3 failed | 66 passed | 1 skipped (70)\n     Tests  415 passed | 1 skipped (416)\n```\n\nThe 4 added tests account for the delta from the `origin/develop` baseline of 411 passed. The 3 failing files are **pre-existing collection failures**, reproduced identically on a clean `origin/develop` worktree with this change stashed: `src/api/wallet-routes.test.ts` and `src/api/wallet-routes.authority.test.ts` cannot resolve `@elizaos/plugin-elizacloud`, and `src/ui/InventoryView.test.tsx` cannot resolve `@elizaos/ui/spatial` — unbuilt workspace dependencies, not test failures, and untouched by this change.\n\n```\nbun run --cwd plugins/plugin-wallet typecheck\n  -\u003e src/api/wallet-routes.ts(96,5): error TS2307: Cannot find module '@elizaos/plugin-elizacloud'\n```\n\nSame pre-existing error, same file, present on clean `origin/develop` with this change stashed. Both changed files typecheck clean.\n\n```\nbunx @biomejs/biome check \u003cthe two changed files\u003e\n  -\u003e Checked 2 files. No fixes applied.\n```\n\n## Files\n\n- `plugins/plugin-wallet/src/chains/evm/actions/swap.ts` — bigint arithmetic in `resolveRelativeAmount`, `decimals` threaded from the caller\n- `plugins/plugin-wallet/src/chains/evm/__tests__/unit/swap-amount-mode.test.ts` — 4 tests: dust `half`, dust `max` (gas reserve preserved), dust `percent`, and the float-residue `1%` case; each asserts the plain-decimal value, absence of exponent notation, and that `parseUnits` accepts the result\n\n\u003c!-- pr-evidence:v1 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - no UI change; pure arithmetic/formatting fix in an action helper\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - no UI change; pure arithmetic/formatting fix in an action helper\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - no UI change; pure arithmetic/formatting fix in an action helper\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - deterministic unit tests; vitest output shown in PR checks and quoted under Verification\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] N/A - no UI c `\"ABORT_ERR\"`.\n- Updated `isTimeoutError` for both `Error` instances and plain object error shapes to check `candidate.code` against `TIMEOUT_CODES`.\n- Added unit tests in `packages/shared/src/utils/errors.test.ts` covering error instances and duck-typed error objects containing standard timeout codes.\n\n## Validation \u0026 Test Coverage\n- Ran `bun test packages/shared/src/utils/errors.test.ts` (10 passing tests, 100% coverage on `errors.ts`).\n- Ran `bun run --cwd packages/shared typecheck` (zero TypeScript errors).\n\n## Evidence\n\n\u003c!-- evidence-table --\u003e\n\n| Evidence | Source / link / artifact | Review notes |\n| --- | --- | --- |\n| before-screenshots | N/A - pure utility function | Error classification utility enhancement |\n| after-screenshots | N/A - pure utility function | Error classification utility enhancement |\n| walkthrough-video | N/A - pure utility function | No dynamic UI interaction involved |\n| backend-logs | N/A - pure utility function | No runtime backend logging changes |\n| frontend-logs | N/A - pure utility function | Classification verified via unit tests |\n| llm-trajectory | N/A - pure utility function | No LLM interaction required |\n| domain-artifacts | N/A - pure utility function | No persistent tables modified |\n| ocr-review | N/A - pure utility function | Pure error helper utility |\n\n\u003c!-- /evidence-table --\u003e\n\n\u003c!-- evidence-head:b6e9d352151ea6c9cfd607b5e4ff541c5d235605 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - pure utility function\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - pure utility function\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - pure utility function\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - pure utility function\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] N/A - pure utility function\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] N/A - pure utility function\n\n\u003c!- ilure reply. The\n`SubAgentRouter` stamps an unedited error narration onto a synthetic inbound\nmemory; `buildFailureReply()` in\n`plugins/plugin-agent-orchestrator/src/evaluators/sub-agent-failure.ts`\ncomposed the user line by unconditionally appending its own `.` before\n` Want me to retry?`. When the reason clause already ended in sentence\npunctuation — which the router's narration frequently does\n(`…registration request timed out.`) — the result doubled the terminator:\n\n```\nCouldn't finish the \"text-my-ex\" task — ACP session failed: registration request timed out.. Want me to retry?\n```\n\nThe fix normalizes the terminator at the single shared reply-composition\nboundary: if the assembled clause already ends in a sentence terminator, that\nexact punctuation is kept; otherwise exactly one period is added. The class\ncovers the ASCII stops plus the horizontal ellipsis `…` and the\nfullwidth/ideographic stops `。`/`！`/`？`, because `extractFailureReason` keeps\nonly the first line of a multi-line narration and routers commonly mark that\ntruncation with `…` — which the ASCII-only test would still double. The reason\ntext, label, question tail, structured error code, original cause chain, and\ntimeout metadata are all unchanged — punctuation composition only, no\nspecial-casing of any one call site.\n\n```ts\nconst SENTENCE_TERMINATOR = /[.!?…。！？]$/u;\nconst clause = `Couldn't finish ${what}${because}`;\nconst terminator = SENTENCE_TERMINATOR.test(clause) ? \"\" : \".\";\nreturn `${clause}${terminator} Want me to retry?`;\n```\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes a red `develop` assertion at a\nproduction failure boundary).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. A file-level\ncomment at the fixed boundary documents the invariant.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-agent-orchestrator/__tests__/unit/sub-agent-failure-evalua erence-items.ts` does too. When it returns true, the turn goes to a structured-output model call whose results are written back into durable fact, relationship and identity memory.\n\nFive clauses. Four have no fixture:\n\n| mutant | `reflection-items.test.ts` | `preference-items.test.ts` |\n|---|---|---|\n| drop `options?.semanticSignal !== false` | 0 fail | 0 fail |\n| drop `message.content.text?.trim()` | 0 fail | 1 fail |\n| drop `message.entityId` | 0 fail | 0 fail |\n| drop `message.roomId` | 0 fail | 0 fail |\n| **drop `!isSyntheticConversationArtifactMemory(message)`** | **0 fail** | **0 fail** |\n\nCoverage is thin in aggregate as well: inverting the whole predicate fails **one** test, in `preference-items.test.ts`. `reflection-items.test.ts` — the suite for the file that defines the gate and for the three evaluators that consult it — does not notice at all.\n\nThe synthetic-artifact clause is the one I would least like to be free. It is what stops the runtime's own compaction records and conversation summaries from being mined as though a participant had said them, and the results of that mining are durable: facts, relationship edges and identity claims persisted back into memory. Deleting that clause today changes no test anywhere.\n\n# The change\n\nTests only, appended to the existing suite. One case per clause, plus the parts of the contract that are easy to break by accident:\n\n- an ordinary turn is admitted;\n- `semanticSignal: false` refuses, while `true` and an absent option both admit — the clause is `!== false`, not `=== true`, so \"no opinion\" means allowed;\n- empty text, whitespace-only text and absent `content.text` all refuse;\n- a turn with no author refuses; a turn with no room refuses;\n- synthetic artifacts refuse, asserted once per detection input, since `isSyntheticConversationArtifactMemory` has three independent ones: `metadata.source`, `metadata.tags`, and the text marker;\n- and the wiring: `factMemoryEvaluator`, `relationshipEvaluator` and `identityEvaluator` each return `false` from `shouldRun` for an artifact and `true` for a real turn. A clause table is only worth having if the evaluators actually consult the predicate, so that is pinned rather than assumed.\n\n# Evidence\n\n`bunx vitest run src/features/advanced-capabilities/evaluators/reflection-items.test.ts` → **26 passed** (was 15).\n\n| mutant | before | after |\n|---|---|---|\n| drop `options?.semanticSignal !== false` | 0 fail | **1 fail** |\n| drop `message.content.text?.trim()` | 0 fail | **1 fail** |\n| drop `message.entityId` | 0 fail | **1 fail** |\n| drop `message.roomId` | 0 fail | **1 fail** |\n| drop `!isSyntheticConversationArtifactMemory(message)` | 0 fail | **5 fail** |\n| `semanticSignal !== false` → `=== true` | 0 fail | **3 fail** |\n\n**6 of 6 killed**, from 1 of 5 (and that one only in a sibling package's suite).\n\nNeighbouring suites unchanged:\n\n```\nreflection-items.test.ts   26 passed\npreference-items.test.ts   24 passed\nexperience-items.test.ts    5 passed\n```\n\n`bunx @biomejs/biome check` → clean. `bunx tsc --noEmit -p packages/core/tsconfig.json` → no errors in the file.\n\n# Context\n\nSame sweep as #30418, #30419, #30420 and #30421. Two candidates screened before this one — `capturedTerminalOutputIsSafe` and `isStagingSessionExchangeEnabled` — were already pinned clause by clause and needed nothing.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{  verify` not run on this constrained host — see **Known gaps**.\n- [x] A reviewer can confirm the change works from the evidence below (pure-function divergence + red→green regression test).\n\n# Sync with develop\n\n- [x] Based on latest `origin/develop` (`b47604274ea56621eaa1bbaa488dba63e37696c9`); zero conflicts.\n- [x] Focused package gates pass post-sync; full `bun run verify` blocker documented in **Known gaps**.\n\n# Risks\n\nLow **for the consolidation itself**. The change deletes a divergent local implementation and delegates to the canonical `@elizaos/core` `stringToUuid`. Any code that previously relied on the plugin-sql FNV-1a output for a *non-UUID* natural key will now receive the canonical SHA-1 UUID instead. That is the intended correction: the RLS `server_id` derived from `ELIZA_SERVER_ID` now equals the id core (and the package's own RLS test) already computes for the same key. Already-valid UUID inputs pass through unchanged in both implementations, so callers that pass real UUIDs are unaffected.\n\n## Data continuity / identifier cutover (flagged for maintainer decision)\n\nSwitching the derivation is a one-time identifier cutover for any data persisted under the retired FNV-1a keys. The FNV `string-to-uuid.ts` and the `AdvancedMemoryStorageService` that consumes it were introduced together in `2a4af7351c` (#29910), so the FNV derivation was never part of a stable release and the exposure is bounded to the beta window since that commit. Within that window, default deployments can still hold real rows keyed under the old ids:\n\n- **advanced-memory (all backends, incl. the default PGlite):** `getMemoryWorldId()` / `getLongTermRoomId()` (`services/advanced-memory-storage.ts`) derive world/room ids from natural keys via this function. After the cutover, reads resolve the new SHA-1 ids and do not discover FNV-keyed worlds/rooms/long-term memories, so pre-cutover long-term memories become unreachable — hidden, not deleted.\n- **natural-key RLS Postgres:** for a non-UUID `ELIZA_SERVER_ID`, `createDatabaseAdapter` (`index.node.ts:136`) now stamps and filters rows under a different `server_id`. Rows written under the old tenant id stay isolated under that id (no cross-tenant leak), but they are not visible to the new context, and globally-enforced unique constraints can still collide with the hidden rows. UUID-valued `ELIZA_SERVER_ID` deployments are unaffected (pass-through).\n\nThis PR intentionally scopes to the utility consolidation that #30056 requested (which the issue proved with pure functions and required no DB) and does **not** ship a re-keying migration. Maintainers should decide between (a) accepting the bounded beta-window cutover as fixing a corrupt derivation, or (b) gating merge on a follow-up migration / dual-read with a real two-tenant Postgres upgrade test. Raised by @HomunculusLabs's review; documented here per that request rather than decided unilaterally by the author.\n\n# Background\n\n## What does this PR do?\n\n`plugins/plugin-sql` shipped its own `stringToUuid` (`src/utils/string-to-uuid.ts`) that derived the UUID from four FNV-1a hash segments (`Math.imul(hash, 16777619)`), while `@elizaos/core`'s canonical `stringToUuid` derives it from SHA-1 of the same escaped input. The two functions had byte-for-byte identical doc comments and the identical name/signature, yet produced **completely different UUIDs for every non-UUID input**.\n\nThis is a security-relevant duplicate-utility drift in data-isolation (RLS):\n\n- `createDatabaseAdapter` (`src/index.node.ts` / `src/index.ts`) computes `rlsServerId = stringToUuid(ELIZA_SERVER_ID)` using the **local FNV** function and installs it as the Postgres tenant id used for row `server_id` stamping/filtering.\n- The package's own RLS integration test (`rls-entity.real.test.ts`) computes the same value as `stringToUuid(process.env.ELIZA_SERVER_ID)` imported from `@elizaos/core` (**SHA-1**).\n\nSo the tested tenant id was never the id production computes for the same `ELIZA_SERVER_ID`, and any code deriving an id from a natural key on one side of the core/plugin-sql boundary and looking it up on the other got a mismatch.\n\n**Fix:** delete the divergent FNV algorithm and re-export the canonical `stringToUuid` from `@elizaos/core`. Core's browser bundle exports the same WebCrypto/pure-JS implementation, so every build target (node/bun/browser/edge) now agrees. The three importers (`index.ts`, `index.node.ts`, `services/advanced-memory-storage.ts`) keep importing from `./utils/string-to-uuid` unchanged — the module now delegates to core, so there is a single source of truth.\n\n## What kind of change is this?\n\nBug fix (non-breaking correction of a divergent security-relevant utility).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The module header in `string-to-uuid.ts` was rewritten to explain the consolidation and the RLS invariant.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-sql/src/__tests__/unit/string-to-uuid-parity.test.ts`. It:\n1. Imports `stringToUuid` from **both** `@elizaos/core` and `../../utils/string-to-uuid` and asserts equality across a table (`\"server-123\"`, `\"advanced-memory:world:\u003cuuid\u003e\"`, numeric, empty string, already-valid UUID pass-through).\n2. Pins the known core SHA-1 value for `\"server-123\"` (`f569c7d7-…`), which the retired FNV impl could never produce (`9460a9f3-…`).\n3. Exercises the real `createDatabaseAdapter` RLS path and asserts the connection pool is keyed by `core.stringToUuid(ELIZA_SERVER_ID)` (pg's Pool connects lazily, so no live Postgres is needed).\n\n## Detailed testing steps\n\n```\ncd plugins/plugin-sql/src\nbunx vitest run __tests__/unit/string-to-uuid-parity.test.ts\n```\n\nRed before the fix (FNV impl): 3 of 5 tests fail. Green after: 5/5 pass. Full unit lane (`__tests__/unit` + advanced-memory-storage): 91 pass.\n\n# Evidence Gate\n\nEvidence must match the exact commi hes — and only rows the endpoint already refused to serve are now excluded earlier. The second test below pins that a readable row is still returned.\n\n# Background\n\n## What does this PR do?\n\n`AppChargeRequestsService.listForApp` pages at the database, then discards unreadable rows in JavaScript:\n\n```ts\n.orderBy(desc(cryptoPayments.created_at))\n.limit(Math.min(limit, 100));\n\nreturn rows\n  .map((row) =\u003e toChargeRequest(row))\n  .filter((request): request is AppChargeRequest =\u003e Boolean(request));\n```\n\n`toChargeRequest` returns `null` for a corrupt `expected_amount` — deliberately, so a mangled value cannot reach Stripe checkout. But those rows have already consumed slots in the page, so the page comes back short.\n\nThe failure is not just a short page. `expected_amount` is a `text` column, and the listing has no cursor: when the newest rows are all corrupt, the caller receives an empty array while valid older charges exist behind them, with no way to page past. Those charges are **unreachable**, not delayed.\n\n**Reachability.** This backs a live route rather than being dead code:\n\n```\npackages/cloud/api/v1/apps/[id]/charges/[chargeId]/route.ts:12\n  import { appChargeRequestsService } from \"@/lib/services/app-charge-requests\";\n```\n\n## What is the fix?\n\nApply the same validity predicate in SQL so `LIMIT` counts only readable rows:\n\n```sql\nCASE\n  WHEN expected_amount ~ '^[0-9]+(\\.[0-9]+)?$'\n  THEN expected_amount::numeric BETWEEN ${MIN_CHARGE_USD} AND ${MAX_CHARGE_USD}\n  ELSE false\nEND\n```\n\nThe pattern is safe against the real data: `create()` stores `amount.toFixed(2)`, so every legitimately written value is plain decimal.\n\n**The $1–$10,000 bound now exists in three places** — `normalizeAmount` (writer), `toChargeRequest` (reader), and this SQL filter. That is the fragile part of this change, so it is named once:\n\n```ts\nconst MIN_CHARGE_USD = 1;\nconst MAX_CHARGE_USD = 10_000;\n```\n\nIf the SQL bound ever drifted from the reader's bound, it would hide rows the endpoint can serve — reintroducing this exact defect from the other side. Naming it removes that possibility rather than relying on someone noticing all three.\n\n# Documentation changes needed?\n\nNo. No public surface, route contract, response shape, or setting changes.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe mutation block. The test drives the real exported `appChargeRequestsService` against **real PGlite** — no stubbed query builder, no pagination re-implemented in the test body.\n\n## Detailed testing steps\n\n| Gate | Result |\n| --- | --- |\n| `app-charge-list-pagination.pglite.test.ts` | **1 pass, 0 fail** |\n| `biome check` (repository-pinned 2.5.8) | `No fixes applied.` |\n| production diff vs `develop` | one SQL predicate, two named constants, three call sites updated to use them |\n\nMutation resistance — removing **only** the SQL predicate and keeping the test:\n\n```\nrawExpectedAmount: \"NaN\",\n- Expected  - 3\n+ Received  + 1\n(fail) app charge request listing \u003e corrupt newest rows do not hide older valid rows at the requested limit\n 0 pass\n 1 fail\n```\n\nThe caller gets nothing back while a valid older charge sits behind the corrupt rows — the state in which those charges can never be paged to.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:451049762d88c0b073e3277f000bd40097721595 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] Before screenshots `N/A - backend query change; this diff touches no rendering code`.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] After screenshots `N/A - backend query change; this diff touches no rendering code`.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] A video walkthrough `N/A - the observable behaviour is the returned row set, asserted directly against real PGlite above`.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] Backend logs `N/A - no service is started; the real service is driven directly against a real PGlite database in the suite above`.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] Frontend console/network logs `N/A - no frontend change`.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] Real-LLM trajectory `N/A - no model call is involved in charge listing`.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] Domain artifacts `N/A - the artifact is the returned charge-request row set, quoted in the mutation block above`.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [ ] OCR visual-text review `N/A - no rendered visual surface`.\n\n# Attribution\n\n- Found by OpenAI `gpt-5.6-sol` via Codex (AgentRouter) during a filter-after-pagination sweep under a mandatory reachability gate.\n- Independent verification of the route caller, confirmation that `toFixed(2)` writes make the SQL pattern safe, extraction of the triplicated bound into named constants, and the mutation proof by Claude Code (`claude-opus-5`).\n\nAI provider/model: openai / gpt-5.6-sol\nClient / agent tooling: codex\nAttribution status: self-reported\n"])</script><script>self.__next_f.push([1,"5c:T1823,"])</script><script>self.__next_f.push([1,"# What\n\n`documentMutationSnapshotMatches` is the conflict detector for document compare-and-swap. `compareAndSwapDocument`, `replaceDocumentRevision` and two sibling paths in `inMemoryAdapter.ts` all do:\n\n```ts\nif (!documentMutationSnapshotMatches(existing, params.expected)) {\n  return { status: \"conflict\" };\n}\n```\n\nEvery field it compares is a lost-update detector: if a comparison stops happening, a caller holding a stale snapshot overwrites a row that moved underneath it.\n\nIt compares ten things, and **eight of them have no fixture**. Dropping each clause in turn, against `document-list-query.test.ts`:\n\n| mutant | result |\n|---|---|\n| drop `actual !== null` | 18 pass / 0 fail |\n| drop `actual.scope === expected.scope` | 18 pass / 0 fail |\n| drop `actual.roomId === expected.roomId` | 18 pass / 0 fail |\n| drop `actual.entityId === expected.entityId` | 18 pass / 0 fail |\n| drop `actual.scopedToEntityId === …` | 18 pass / 0 fail |\n| drop `actual.addedBy === …` | 18 pass / 0 fail |\n| drop `actual.revision === …` | 18 pass / 0 fail |\n| drop `actual.ingestionAttemptId === …` | 18 pass / 0 fail |\n| drop the `directGrantEntityIds` compare | 17 pass / 1 fail |\n| drop `actual.ingestionState === …` | 17 pass / 1 fail |\n\nThe whole predicate is covered by a single assertion with two denial cases, which are exactly the two clauses that die. `actual.revision` — the field a compare-and-swap exists to compare — is among the eight with no detector at all.\n\nCoverage is thin in aggregate too, not just per clause. Inverting the entire predicate fails **one** test in `document-list-query.test.ts` and **zero** in `inMemoryAdapter.test.ts` and `inMemoryAdapter.access-context.test.ts`, so the adapter's conflict path never observes it.\n\n# The change\n\nTests only. One fixture carrying every compared field, a snapshot taken from it, and one case per field that perturbs exactly that field:\n\n- the row stops reading as a document snapshot at all (`roomId` no longer a UUID);\n- scope, room, owning entity;\n- a direct grant added; the private-scope target; the recorded author;\n- the revision advanced;\n- a different ingestion attempt owns the row; the ingestion state advanced.\n\nPlus one property the type signature does not carry: `uuidArraysEqual` compares **index-wise**, so a reordered direct-grant list is a divergence. Rewriting it to set membership (`normalizedRight.includes(value)`) looks like a harmless simplification and now fails.\n\n# Evidence\n\n`bunx vitest run src/database/document-list-query.test.ts` → **30 passed** (was 18).\n\nSame battery, after:\n\n| mutant | before | after |\n|---|---|---|\n| drop `actual !== null` | 0 fail | **1 fail** |\n| drop `scope` | 0 fail | **1 fail** |\n| drop `roomId` | 0 fail | **1 fail** |\n| drop `entityId` | 0 fail | **1 fail** |\n| drop `scopedToEntityId` | 0 fail | **1 fail** |\n| drop `addedBy` | 0 fail | **1 fail** |\n| drop `revision` | 0 fail | **1 fail** |\n| drop `ingestionAttemptId` | 0 fail | **1 fail** |\n| drop `directGrantEntityIds` compare | 1 fail | **3 fail** |\n| drop `ingestionState` | 1 fail | **2 fail** |\n| `uuidArraysEqual` index-wise → set membership | 0 fail | **1 fail** |\n\n**11 of 11 killed, from 3 of 11.**\n\nNeighbouring suites unchanged:\n\n```\ndocument-list-query.test.ts                 30 passed\ninMemoryAdapter.test.ts                      7 passed\ninMemoryAdapter.access-context.test.ts       4 passed\ndocuments/provider-pinned.test.ts           12 passed\ndocuments/service-orphan-compensation.test.ts 8 passed\n```\n\n`bunx @biomejs/biome check` → clean. `bunx tsc --noEmit -p packages/core/tsconfig.json` → no errors in the file.\n\nOne note on building the fixture: `readDocumentMutationSnapshot` reads the revision from `metadata.documentRevision`, not `metadata.revision`, and `\"shared\"` is not in `DOCUMENT_LIST_SCOPES`. My first fixture used both and produced a null snapshot — the tests failed loudly rather than passing vacuously, which is the behaviour you want, but worth knowing if you extend the table.\n\n# Context\n\nSame sweep as #30418, #30419 and #30420: multi-clause guards where the suite proves the conjunction and not its terms.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\" manently, and because `startEscalation` (`:491-500`) coalesces into any unresolved escalation for that agent — appending the reason, persisting, returning **without arming a timer** — every subsequent repeated systemic failure from `error-escalation.ts:99` was swallowed. Meanwhile `escalation-trigger.ts:98` kept injecting a high-urgency *\"Owner has not responded yet\"* trigger into the agent's prompt on every autonomous loop.\n\nThe fix arms the check unconditionally at start and reschedules while `currentStep \u003c maxRetries`, so the chain always terminates in the give-up branch, drops the cache row, and releases the agent for the next escalation.\n\n## What kind of change is this?\n\nBug fix.\n\n# Documentation changes needed?\n\nNo.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/agent/src/services/escalation.test.ts`, describe block `EscalationService timers`. Every prior test that reached the give-up branch called `checkEscalation` **by hand** (`:572`, `:603`), so the branch was covered in isolation while unreachable through the scheduler that owns it. The new cases drive `setTimeout` alone.\n\n## Detailed testing steps\n\n1. Check out exact head `62a902be64f30e6f47880d347431019694eb7f1f`.\n2. From `packages/agent`: `bun x vitest run src/services/escalation.test.ts` → **38/38**.\n3. RED control — restore only `src/services/escalation.ts` to `origin/develop` and rerun: **4 failed / 34 passed**, with the two rewritten tests and both new tests failing.\n4. Mutation kills, each applied alone and reverted:\n   - re-guarding the start-time schedule → the `maxRetries: 1` case fails (1 failed / 37 passed);\n   - restoring `currentStep + 1 \u003c maxRetries` → all three chain cases fail (3 failed / 35 passed).\n5. Neighbouring suites: `escalation-agent-isolation`, `escalation-channels`, `error-escalation`, `escalation-trigger` → **108/108** across all five files.\n6. Pinned Biome on both changed files: exit 0.\n\n\u003c!-- evidence-head:62a902be64f30e6
