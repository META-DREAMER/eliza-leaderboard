plicate/replayed events and legacy1:1 top-ups using actual queue/ledger behavior.\n- Never restore an unapplied shortfall or change resource holds, entitlements, auto-top-up policy or provider balances.\n\n#22930 explicitly records the existing applied-clawback-only reinstatement contract; its unresolved resource/entitlement and shortfall decisions remain outside this correction. This issue performs no historical ledger repair or production mutation.\n\nEvidence: real local database readback and backend failure above. UI screenshots/video and model trajectories: N/A, queue arithmetic/ledger defect. Full package/root/hosted qualification remains required before merge.\n"])</script><script>self.__next_f.push([1,"15:Ta53,"])</script><script>self.__next_f.push([1,"This integrates the reviewed context changes and their compatibility repairs for #30684. Progressive history/provider references remain restorable through the normal permission boundary; current requests, instructions and receipts stay inline. Complete original contexts and trajectory recordings remain available. Tool discovery retains the complete authorized catalog without eagerly loading unrelated families.\n\nThe integration includes source-grounded identity/reflection handling, single-delivery and reply-recovery repairs, developer trajectory inspection, complete browser text handling, and Codex SDK account/cancellation behavior. Additional repairs keep EXPERIENCE mutation/search receipts inside the planner, reject invalid optimized-prompt metrics before activation, and preserve model-call purpose in scenario exports. Source branches and their ancestry are retained.\n\nValidation at `708838c69359ca4fdb737ecde177ba3293c95b3c`:\n- `bun install`: passed.\n- `bun run verify`: passed, including 373 workspace tasks and repository audits (1,079.84 seconds).\n- Full core: 12,937 passed, 3 pending, zero failures (551.64 seconds).\n- CLI inference: 228 passed, 2 skipped, zero failures (14.17 seconds).\n- Scenario un sktop/mobile bounded scrolling and scroll handoff passed. Both403 and503 produced a visible unavailable state and recovered to a complete payload read. All24 before/after/error screenshots were inspected and passed OCR execution. These fixtures do not substitute for the real-server authorization tests above. The development backend was unavailable: full logs retain HTTP 502 responses from unrelated app services, failed WebSocket handshakes and build-info request failures. This is inspector fixture validation, not an error-free complete app session.\n\nNative storage validation on9e53 passed across two processes:103 complete imported messages reopened with their durable task, all received384-dimensional embeddings, and the target ranked first in scoped recall. Replay plus one backdated message inserted1 and skipped103, leaving104 rows. Both runtime diagnostic arrays are empty. Authorization was injected and workers were driven manually; this does not certify production authentication, RLS, scheduler timing or encrypted-settings restart.\n\nLocal publication gates are complete; hosted checks must finish for this exact head before merge. Current scope does not certify every scenario, benchmark, live voice path, or GEPA promotion; those remain tracked in #30684.\n\n\nThe complete original integration history is available on [the preserved branch](https://github.com/elizaOS/eliza/tree/fix/context-public-preserved-30684). [Reviewed #31031 disposition](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-31031-disposition.md).\n\n\u003c!-- evidence-head:ffe354ac1072a9c4d7a8e784b01562af886874e2 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nBaseline UI on14689 (UI identical to developa696), with the same synthetic payload fixture.\n![Before desktop](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-before-desktop.png)\n![Before mobile](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-before-mobile.png)\n\n\u003c!-- evidence-row:after-screenshots --\u003e\nUpdated inspector on9e53; its inspector source matches the rebased publication candidate. Complete text wraps and remains copyable.\n![After desktop](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-after-desktop.png)\n![After mobile](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-after-mobile.png)\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n[Desktop inspector walkthrough](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-walkthrough-desktop.mp4); [mobile inspector walkthrough](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-walkthrough-mobile.mp4). Real Chromium with API fixtures; not live backend retrieval.\n\n\u003c!-- evidence-row:backend-logs --\u003e\n[Native import/recovery log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-native-import-recovery-9e53.log); [Live Notes runtime log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-9e53-live-notes.log); [real trajectory capture integration log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-9e53-trajectory.log). Source9e53; exact publication [repository verification log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-ffe354-verify.log).\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n[Complete console/network event logs and whole-run clipboard checks](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-frontend-full-events.json). [Browser failures and completed checks](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-frontend-logs.json). [All inspected rest/hover/error captures, browser failures and exact-copy checks](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-inspector-captures-and-checks.zip). Before/after use identical fixtures. Full v6 logs retain HTTP 502 responses from the unavailable development backend, WebSocket failures and build-info failures; baseline mobile also records a local-inference stream failure. Permission and503 recovery fixtures passed on desktop/mobile.\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\n[Complete live Qwen inputs, outputs and HTTP bodies](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-9e53-http-trajectory.json). Six calls, one exact note, one creation event, read-back recovery and zero reported runtime errors. Task scheduler stopped before the foreground turn; no durable-worker or GEPA improvement claim.\n\n\u003c!-- evidence-row:domain-artifacts --\u003e\n[Native import/recovery receipts, diagnostics and model/library hashes](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-native-import-recovery-9e53.json); [Serialized Notes state, event and action evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-notes-domain.json); [checksummed validation manifest](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-validation.json). Broader scenario and benchmark campaigns remain unqualified.\n\n\u003c!-- evidence-row:ocr-review --\u003e\n[24-image OCR and manual review inventory](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-ocr-review.json). All OCR commands exited0; all images inspected. [Credential scan scope and result](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31426-privacy-scan.json).\n"])</script><script>self.__next_f.push([1,"17:T520,## Summary\n\nCompletes the remaining acceptance work for #25140 on top of #29754:\n\n- adds an explicit authorized, caller-bounded legacy-content reindex contract\n- locks and size-checks the parent before fetching legacy source bytes, with a 16 MiB hard ceiling\n- atomically publishes the bounded parent descriptor and immutable segment generation\n- threads page and reindex reads through the requester's PostgreSQL entity context so restrictive RLS and pushed-down access predicates compose\n- exposes the reindex operation through the runtime\n- adds a 10 MiB PGlite restart/reassembly proof and a real PostgreSQL/RLS authorization proof\n\nThis is intended as a completion/replacement for #29754, whose current body explicitly defers the legacy migration and PostgreSQL/RLS acceptance items.\n\n## Verified evidence\n\n- `bun run --cwd packages/core typecheck`\n- `bun run --cwd plugins/plugin-sql typecheck`\n- `bun run --cwd plugins/plugin-sql build`\n- PGlite real integration: 7/7 passed, including bounded 10 MiB legacy reindex, exact reassembly, and restart\n- PostgreSQL 16 + pgvector real RLS integration: 1/1 passed, including wrong-room denial and per-page reauthorization\n- core paging/segmentation tests: 16/16 passed\n- root `bun run verify`: 375/375 turbo tasks plus all repository audits passed\n\nCloses #25140\n18:T18fc,"])</script><script>self.__next_f.push([1,"# feat(core,plugin-sql): native paging for large messages and attachment text (#25140)\n\nCloses #25140\n\nAdds native content segmentation and paging so large message bodies and attachment text are stored as revision-fenced segments and paged on demand, instead of being written and read as single unbounded rows.\n\n## What changes\n\n- **`packages/core/src/memory/content-segmentation.ts` (new)** — segmentation contracts: bounded segment emission, surrogate-safe boundaries, deterministic segment identity; 14 unit tests.\n- **`core memory.ts` / `types/database.ts`** — `getMemoryContentPage` paging read path; message/readAttachment actions consume pages instead of whole rows.\n- **`plugin-sql` schema + store (new: `memoryTextSegments`)** — generation-addressed segments with revision fencing: `createMemory` publishes segments with a bounded marker, `updateMemory` replaces the generation and retires the stale one, large-to-small replacement retires the descriptor, deletion cascades; small content stays inline (fallback path returns null pages); large attachment text without an id or with duplicate ids is rejected.\n- **Real-runtime suites (new)** — 10 real PGlite tests: parent-first publication, paging with revision fencing, reassembly across restart, atomic generation replacement, legacy large-unsegmented row flagging, owner-bound attachment paging, access-context probe coverage, rollback atomicity.\n\n## Key invariants\n\n- Pages are revision-fenced: a reader can never reassemble content mixing two generations.\n- Generation replacement is atomic and retires the prior generation — stale segments are never served after an update.\n- Legacy large unsegmented rows are flagged, not silently repaged; small rows pass through inline.\n\n## Test-lane disclosure\n\nNine of the ten new plugin-sql tests live in `*.real.test.ts` files, which the PR vitest lane deliberately excludes (`plugins/plugin-sql/src/vitest.config.ts`, #10104) — they run on the post-merge lane (`VITEST_LANE=post-merge` / `TEST_LANE=post-merge`) and in the captures below. The pre-merge green checks therefore reflect the non-real suites (core unit + surface + probe tests), not the real-PGlite fencing behavior; see the backend-logs capture for the real-suite evidence. The post-merge lane does execute plugin-sql real suites.\n\n## Verification\n\n| Gate | Result |\n|---|---|\n| Core content-segmentation suite (fresh capture at new head) | 14/14 |\n| Core paging-surface suite | 2/2 |\n| Core readAttachmentAction segmented-save suite | 13/13 |\n| Real PGlite paging suites (post-merge lane, fresh capture at new head) | 11/11 |\n| Typecheck / Biome | green (core + plugin-sql typecheck PASS, biome clean on all touched files at new head) |\n| Merge vs develop tip | rebased onto develop tip `7677c92e4a` (was 55 behind its base); added-lines diff vs pre-rebase head verified byte-identical |\n| RP review | 4 rounds on the logic; rebase round at new head (see review below) |\n\nScope note: the issue's remaining acceptance items (authorized bounded reindex entrypoint, 10MiB+ Postgres/RLS lanes, full root verify) are documented as follow-up in issue comment 5446380062; this PR lands the paging core they build on.\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - no UI surface changed (storage-layer paging)\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - no UI surface changed (storage-layer paging)\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - no user-visible surface changed (storage-layer paging)\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] \u003cdetails\u003e\u003csummary\u003enative paging suites at head 3a5b76151f5141a1705bf37efb67e58bbb39011d (captured 2026-08-28, post-merge lane)\u003c/summary\u003e\n\n```text\nEvidence for issue #25140 — native paging suites at head 3a5b76151f5141a1705bf37efb67e58bbb39011d (captured 2026-08-28T21:25Z, post-rebase)\n===== core content-segmentation =====\n Test Files  1 passed (1)\n      Tests  14 passed (14)\n===== core memory-content-paging-surface =====\n Test Files  1 passed (1)\n      Tests  2 passed (2)\n===== core readAttachmentAction.segmented-save =====\n Test Files  1 passed (1)\n      Tests  13 passed (13)\n===== plugin-sql real paging suites (VITEST_LANE=post-merge) =====\n Info       [PLUGIN:SQL] Skipping RLS re-application (ENABLE_DATA_ISOLATION is not true)\n ✓ __tests__/integration/memory-content-paging.adapter.real.test.ts (6 tests) 10000ms\n ✓ __tests__/integration/memory-text-segments.real.test.ts (3 tests) 8116ms\n     ✓ publishes parent-first, pages with revision fencing, reassembles across restart, cascades deletion (1 MiB multibyte)  3487ms\n     ✓ replaces a generation atomically and retires the prior one  2342ms\n     ✓ flags legacy large unsegmented rows and passes small rows through  2286ms\n ✓ __tests__/integration/memory-text-segments.rollback-atomicity.test.ts (1 test) 3962ms\n     ✓ createMemory leaves neither parent nor segments when segment publication fails mid-transaction  3960ms\n ✓ __tests  `stringToUuid` / `createUniqueUuid` value, and core's own `uuidSchema` (`packages/core/src/utils.ts:1095-1100`) accepts that shape — but `plugins/plugin-sql/src/services/sql-membership.ts:52` mirrored the same idea as `[1-8]`, so `assertUuid` (same file, `:251-255`) throws `MEMBERSHIP_COMMAND_INVALID` with `severity: \"fatal\"` on **100% of them**. What a caller observes: an agent whose character has no explicit `id` gets `agentId = stringToUuid(character.name)` (`packages/core/src/runtime.ts:1577`), so *every* membership call it makes — `authorize`, snapshot apply, delta apply — dies at `assertUuid(scope.agentId, \"agentId\")` before touching the database. Connector-derived ids fail the same way: WhatsApp mints its world/room/entity ids through `createUniqueUuid` (`plugins/plugin-whatsapp/src/inbound-claim.ts:45,49,98`, `plugins/plugin-whatsapp/src/runtime-service.ts:287,732-752`), and those land on `assertUuid(member.canonicalPrincipalId | runtime.worldId | runtime.roomId | runtime.entityId, …)` at `sql-membership.ts:403-406`.\n\nThis is not a WhatsApp bug. It is a core-vs-plugin-sql contract split that makes the membership authority unusable for any connector that derives ids the documented elizaOS way. This PR is the first production caller that reaches it, which is how it was found.\n\n# Reproduction: failing before, passing after\n\nDeterministic, no database, no suite. The script reads the real `UUID_PATTERN` literal out of the repo file on disk and derives ids with the exact byte operations from `packages/core/src/utils.ts:1133-1145`. Save it as `/tmp/uuid-nibble-repro.mjs` and run both commands from the repo root:\n\n```js\n// /tmp/uuid-nibble-repro.mjs\nimport { readFileSync } from \"node:fs\";\nimport { createHash } from \"node:crypto\";\n\nconst src = readFileSync(process.argv[2] ?? \"plugins/plugin-sql/src/services/sql-membership.ts\", \"utf8\");\nconst literal = /const UUID_PATTERN = (\\/.*\\/i);/.exec(src)[1];\nconst UUID_PATTERN = new RegExp(literal.slice(1, -2), \"i\");\nconsole.log(\"sql-membership UUID_PATTERN =\", literal);\n\n// packages/core/src/utils.ts:1133-1145, verbatim operations\nfunction stringToUuid(target) {\n  const bytes = createHash(\"sha1\").update(encodeURIComponent(target)).digest().subarray(0, 16);\n  bytes[8] = (bytes[8] \u0026 0x3f) | 0x80;\n  bytes[6] = (bytes[6] \u0026 0x0f) | 0x00;              // version nibble forced to 0\n  const h = Buffer.from(bytes).toString(\"hex\");\n  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;\n}\n// packages/core/src/utils.ts:1095-1100\nconst coreUuidSchema = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;\n\nconst agentId   = stringToUuid(\"Eliza\");                                              // runtime.ts:1577\nconst worldId   = stringToUuid(`whatsapp:inbound-claims:world:${agentId}`);            // createUniqueUuid\nconst principal = stringToUuid(`whatsapp-entity:120363000000000000@g.us:${agentId}`);  // createUniqueUuid\n\nlet rejected = 0;\nfor (const [name, id] of [[\"agentId\", agentId], [\"worldId\", worldId], [\"canonicalPrincipalId\", principal]]) {\n  const core = coreUuidSchema.test(id);\n  const sql = UUID_PATTERN.test(id);\n  if (core \u0026\u0026 !sql) rejected++;\n  console.log(`${name.padEnd(21)} ${id}  core=${core}  sql=${sql}${core \u0026\u0026 !sql ? \"  -\u003e MEMBERSHIP_COMMAND_INVALID (fatal)\" : \"\"}`);\n}\nconsole.log(`\\n${rejected}/3 canonical ids accepted by core and fatally rejected by the SQL membership authority.`);\nprocess.exit(rejected === 0 ? 0 : 1);\n```\n\n**Before** — against untouched `develop` (this PR's base, `74d659184ca0e85d1412b74beda88e52a63ae002`):\n\n```bash\ngit show 74d659184ca0e85d1412b74beda88e52a63ae002:plugins/plugin-sql/src/services/sql-membership.ts \u003e /tmp/before.ts\nnode /tmp/uuid-nibble-repro.mjs /tmp/before.ts; echo \"exit=$?\"\n```\n\n```text\nsql-membership UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i\nagentId               b850bc30-45f8-0041-a00a-83df46d8555d  core=true  sql=false  -\u003e MEMBERSHIP_COMMAND_INVALID (fatal)\nworldId               6fe80507-b7ee-0364-944c-e48c2e474dc4  core=true  sql=false  -\u003e MEMBERSHIP_COMMAND_INVALID (fatal)\ncanonicalPrincipalId  2e010487-5d89-00a5-b89e-5c8cc1114666  core=true  sql=false  -\u003e MEMBERSHIP_COMMAND_INVALID (fatal)\n\n3/3 canonical ids accepted by core and fatally rejected by the SQL membership authority.\nexit=1\n```\n\n**After** — against this PR's head, `77065f78eb51eccfa43e418898c7e1e3897da1ef`:\n\n```bash\nnode /tmp/uuid-nibble-repro.mjs plugins/plugin-sql/src/services/sql-membership.ts; echo \"exit=$?\"\n```\n\n```text\nsql-membership UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i\nagentId               b850bc30-45f8-0041-a00a-83df46d8555d  core=true  sql=true\nworldId               6fe80507-b7ee-0364-944c-e48c2e474dc4  core=true  sql=true\ncanonicalPrincipalId  2e010487-5d89-00a5-b89e-5c8cc1114666  core=true  sql=true\n\n0/3 canonical ids accepted by core and fatally rejected by the SQL membership authority.\nexit=0\n```\n\nBoth outputs above were produced in this working session against the file contents at those two exact shas. The `3/3` is not a sample: `bytes[6] = (bytes[6] \u0026 0x0f) | 0x00` makes the version nibble unconditionally `0`, so the old pattern rejected the full output range of `stringToUuid`.\n\n## The whole fix\n\n```diff\n-const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n+// Version zero is the deliberate deterministic format emitted by core stringToUuid/createUniqueUuid.\n+const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n```\n\nOne line, `+2 -1`. It widens the accepted version nibble from `[1-8]` to `[0-8]`; the variant nibble stays pinned to `[89ab]`, so it is still strictly narrower than core's `validateUuid`.\n\n## Why existing coverage missed it\n\n`plugins/plugin-sql/src/__tests__/integration/membership-authority.real.test.ts` on `develop` has 15 `it(` blocks and builds **every** id with `crypto.randomUUID()` (4 call sites, 0 uses of `stringToUuid` or `createUniqueUuid` in the file — verified by reading the file at base sha `74d6591`). `crypto.randomUUID()` emits v4, whose version nibble is `4`, which the old `[1-8]` pattern happily accepts. The authority was therefore fully green against ids that production never produces. The new integration test in this PR builds its principal ids with `createUniqueUuid` (`plugins/plugin-whatsapp/src/membership-publisher.pglite.integration.test.ts:6,64`) and asserts the connector account id's version-zero shape at `:73-75`, so the regression is now covered by a real-database test rather than by the pattern's own text.\n\n# What else this PR ships\n\nThe one-line SQL fix is the blocker; the rest is the feature #25230 asks for, which is what surfaced it.\n\n`plugins/plugin-whatsapp/src/membership-publisher.ts` (new, 609 lines) forwards Baileys group rosters and participant events into the canonical `MembershipService` through an account-local publisher wired at `plugins/plugin-whatsapp/src/baileys/connection.ts`, `src/clients/baileys-client.ts`, and `src/runtime-service.ts`. Reconnects publish complete rosters; a group absent from a *successful complete* reconnect snapshot becomes an authoritative empty roster; role changes re-query complete metadata before committing; explicit removals revoke immediately. Disconnect, failure, and source termination change scope *health* (`unavailable` / `stale`) without deleting known membership facts — absence is never inferred from partial, failed, stale, paginated-incomplete, or disconnected state. Cloud webhook senders stay observational: publishers are constructed only for a live `BaileysClient`, and no Cloud API roster or point-query claim was added.\n\nScope of `Closes #25230`, stated plainly: the issue says \"explicit leave/kick/ban revokes immediately\". Baileys exposes `add`, `remove`, `promote`, `demote`, `modify` — there is no distinct `ban` participant action. A provider ban arrives as `remove` and is revoked immediately, and non-self removals are recorded as `kicked`. If a maintainer wants a distinct provider-level `ban` reason recorded, that is not deliverable against Baileys today and I will drop the `Closes` to a `Relates to`.\n\n# Changed files (8, +1068 -2)\n\n| File | |\n| --- | --- |\n| `plugins/plugin-sql/src/services/sql-membership.ts` | +2 -1 — the defect fix above |\n| `plugins/plugin-whatsapp/src/membership-publisher.ts` | +609 new |\n| `plugins/plugin-whatsapp/src/membership-publisher.pglite.integration.test.ts` | +234 new, real PGlite |\n| `plugins/plugin-whatsapp/src/runtime-service.ts` | +91 |\n| `plugins/plugin-whatsapp/src/baileys/connection.ts` | +41 -1 |\n| `plugins/plugin-whatsapp/src/baileys/connection.test.ts` | +54 |\n| `plugins/plugin-whatsapp/src/clients/baileys-client.ts` | +29 |\n| `plugins/plugin-whatsapp/README.md` | +8 |\n\n# Head, and what evidence belongs to which head\n\n**Every claim in the \"Reproduction\" and \"Why existing coverage missed it\" sections above is against base `74d659184ca0e85d1412b74beda88e52a63ae002` and head `77065f78eb51eccfa43e418898c7e1e3897da1ef`** — the current head as of this rewrite.\n\nHosted checks I read from the API at `77065f78`: `All Tests Passed`, `Source static smoke`, and `Browser bridge Windows security / windows-security-contract` are all `completed/success`; the aggregate commit status is still `pending` (further contexts not yet reported). Those are hygiene, not the working-system evidence — the working-system evidence is the before/after above plus the real-PGlite suite below.\n\n**Older-head evidence, labelled as such.** The suite outputs previously pasted in this body were captured at head `63adf6ee8a77a7602178eff3c75f228e7c0029b6`, four rebases ago. I am not re-asserting them as current. Re-run at the current head with:\n\n```bash\nbunx vitest run --reporter=verbose \\\n  --config plugins/plugin-whatsapp/vitest.config.ts \\\n  plugins/plugin-whatsapp/src/membership-publisher.pglite.integration.test.ts\n\nbunx vitest run \\\n  --config plugins/plugin-sql/src/vitest.real.config.ts \\\n  plugins/plugin-sql/src/__tests__/integration/membership-authority.real.test.ts\n```\n\nThe five scenarios in the WhatsApp file are: complete roster plus add/remove/promote/demote deltas without stale resurrection; roster facts preserved across reconnect failure then a missed removal repaired; complete-empty and absent-on-reconnect groups treated as authoritative; identical rooms and principals isolated across connector accounts; fail-closed on source termination without fabricating a removal.\n\nThe most recent full-repository verification at this exact head is on the record in the comment thread (25 Aug, 12:12 UTC): base `74d659184ca0e85d1412b74beda88e52a63ae002`, head `77065f78eb51eccfa43e418898c7e1e3897da1ef`, `bun run verify` pass including all Turbo tasks and audits, WhatsApp suite 198/198, plugin typecheck/lint pass, `git diff --check` pass. I did not execute that run myself in this rewrite and am citing it as a comment-thread record, not as my own observation.\n\n# Overlapping work, named up front\n\n**#28715** (`fix(telegram): wire membership authority admission and revocation into the Telegram connector`, opened 25 Aug 17:56 UTC, ~10h after this PR) independently hit the same defect and edits the same line, `plugins/plugin-sql/src/services/sql-membership.ts:52`:\n\n```diff\n-const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n+const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;\n```\n\nTwo things follow, and I would rather say them than be caught on them:\n\n1. This is independent confirmation of the defect from a second connector, which is the strongest argument that the `[1-8]` pattern is wrong rather than that WhatsApp is special.\n2. It is a textual conflict on one line. Their variant is the superset — full core `validateUuid` parity; mine keeps the variant nibble pinned to `[89ab]` and the version to `[0-8]`, which is deliberately conservative but is *not* core parity (a v9+/nonstandard id would pass core and still fail SQL). **If a maintainer prefers core parity, I will take #28715's wider pattern here — the conflict is one line and I will resolve it in whichever direction lands first.** No membership-authority behavior in this PR depends on the difference.\n\nNo other open or closed PR references #25230, and no other open PR touches WhatsApp membership (searched via the GitHub search API at the time of writing).\n\n# Review status\n\nNo formal reviews have been submitted on this PR (`GET /pulls/28312/reviews` returns empty). There is a `CLAIMING REVIEW` comment from @nothingxnowhere (25 Aug 07:40) with findings still to follow. **Nothing here is an unanswered `CHANGES_REQUESTED`.** When findings land I will answer each one on this thread, including conceding the ones that are correct.\n\n# Risks\n\nMedium, concentrated in the new publisher rather than the SQL fix.\n\n- The SQL change only widens an input-validation pattern; it grants no new capability and cannot admit a member the authority would otherwise deny, because admission is decided by the membership rows, not by the id's version nibble.\n- The publisher introduces an authorization *evidence producer* on the Baileys socket lifecycle. The real risks are stale socket events, incorrect absence inference, and cross-account leakage. These are addressed by generation fencing, complete-snapshot-only semantics, explicit `unavailable`/`stale` health rather than deletion, fresh point queries before role commits, serialized mutations, and the account-isolation scenario in the real-PGlite test.\n- Cloud API behavior is unchanged.\n\n# Acceptance criteria\n\n- [x] Publish complete Baileys group metadata snapshots to the canonical `MembershipService` — real-PGlite scenario 1.\n- [x] Publish participant add/remove/promote/demote deltas — same scenario, all four actions including admin role changes and revocation.\n- [x] Scope evidence by account + mode + external world + room — the account-isolation scenario proves two connector accounts cannot authorize each other's identical room/principal, and asserts the `baileys:` world identity.\n- [x] Keep Cloud webhook senders observational only — publishers are constructed only for a live `BaileysClient`; no Cloud roster or point-query claim added.\n- [x] Never infer removal from partial, failed, stale, paginated-incomplete, or disconnected state — the reconnect scenario keeps the roster active while health goes unavailable/stale.\n- [~] Revoke explicit leave/kick/ban immediately — leave and kick are covered and revoke immediately; **a distinct provider `ban` reason is not recorded**, because Baileys has no `ban` participant action. See the scope note above. Ticking this box outright would contradict the paragraph two screens up, so it is not ticked.\n- [x] Cover reconnect gaps and out-of-order delivery — reconnect repairs a missed removal; a stale `add` cannot resurrect a revoked member because current metadata is queried first.\n- [x] Cover complete empty snapshots and source termination — both scenarios pass; termination fails closed without fabricating removals and ignores later events.\n\n# Documentation\n\n`plugins/plugin-whatsapp/README.md` (+8) documents Baileys canonical membership publication, failure behavior, and why Cloud webhook senders remain observational evidence only.\n\n# Evidence Gate\n\nEvidence head: `77065f78eb51eccfa43e418898c7e1e3897da1ef`\n\n\u003c!-- evidence-head:77065f78eb51eccfa43e418898c7e1e3897da1ef --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before screenshots: N/A - connector/backend-only change with no rendered UI surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] After screenshots: N/A - connector/backend-only change with no rendered UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] Walkthrough video: N/A - no interactive or rendered UI flow changed.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs: the failing-before / passing-after reproduction is pasted verbatim above, produced against the file contents at base `74d6591` and head `77065f7`.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] Frontend logs: N/A - no frontend request, console, or network behavior changed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] LLM trajectory: N/A - no prompt, model, provider, action, or evaluator behavior changed.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Domain artifacts: the five real-PGlite scenarios exercise the production publisher against the canonical SQL authority; isolated databases are intentionally destroyed by the harness, so no stale DB file is attached.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] OCR review: N/A - no visual text or UI changed.\n\n# Known gaps\n\n- No live WhatsApp account was connected in this unattended environment. Provider delivery evidence is active-socket doubles plus the production publisher run against real PGlite; there is no captured session against WhatsApp's servers.\n- A distinct provider-level `ban` reason cannot be proven, because Baileys exposes `add`, `remove`, `promote`, `demote`, `modify` and not a separate `ban`. Any provider ban arriving as `remove` is revoked immediately.\n- The suite/lint/build/typecheck outputs that previously filled this body were captured at head `63adf6ee`, not at the current head. They have been removed rather than re-presented as current; the exact re-run commands are above, and the current-head `bun run verify` result is on the comment record rather than restated as my own observation.\n- `plugins/plugin-sql` owning-package typecheck has pre-existing diagnostics on `develop` unrelated to this change (`base.ts` `authorizedRoomIds`, `advanced-memory-storage.ts` interface implementation). This PR adds none; the branch and untouched-control outputs were byte-identical when that comparison was run at head `63adf6ee`, and that comparison has not been repeated at `77065f7`.\n- No `bun install` was run; the shared checkout already had dependencies installed.\n\n# Maintainer CI exception record\n\nN/A - no exception requested.\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: yes\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: xai/grok-4.6\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: grok\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: SlopDotCash/slopdotcash@1a2017b9fbbcef4263da9dda8d0b4e1d0a7bff42:skills/contribute-to-eliza\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: self-reported\n\nAI provider/model: xAI / grok-4.6\nClient / agent tooling: grok\nContribution skill revision: SlopDotCash/slopdotcash@1a2017b9fbbcef4263da9dda8d0b4e1d0a7bff42:skills/contribute-to-eliza\nAttribution status: self-reported\n— [grok-fleet-ss251]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"xai\",\"model\":\"grok-4.6\",\"client\":\"grok\",\"skill_revision\":\"SlopDotCash/slopdotcash@1a2017b9fbbcef4263da9dda8d0b4e1d0a7bff42:skills/contribute-to-eliza\"} --\u003e"])</script><script>self.__next_f.push([1,"22:T2157,"])</script><script>self.__next_f.push([1,"\u003c!-- Fill every visible section. Keep every evidence row visible; use N/A with a concrete reason when a row does not apply. --\u003e\r\n\r\n# Relates to\r\n\r\n\u003c!--\r\nLink the issue, ticket, or Project card. For agent/kanban work, follow\r\nCONTRIBUTING.md and keep the Project item status current.\r\n--\u003e\r\n\r\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\r\n\r\n- [ ] This PR target develop behavior after #31312 | before #31312 / with this PR |\n| --- | --- | --- |\n| stopped in place by expiry (settled window, `provider_stopped_at` set, no `retirement_backup_id`) | sleep path fails `\"Stopped Dedicated state has no backup bound to its paid stop\"`; intent never `provider_confirmed`; job burns 3 attempts | stopped fast path settles accrued billing, suspends billing, confirms the intent |\n| running with no open window (the expiry race the in-place branch exists for) | sleep commit phase fails `\"Paid retirement backup authority changed\"` after `persistSnapshotWithinTransaction` — one orphan pre-shutdown backup per retry | in-place stop with the backup gate, settle, confirm |\n\n## The fix\n\nRoute to `executeSleepWithStopAuthority` on funding **state**, not funding history: an open window (`fundedSource`), or a stopped record whose latest window is retirement-bound (`retirement_backup_id` set — the unfunded reclaim-from-backup crash-retry path). The probe now selects `retirement_backup_id` ordered by `(period_start, id) DESC` instead of an unordered existence `limit(1)`. All four of #31312's SSH scenarios stay routed by construction: funded user stop, stale generation, and backup-capture failure enter with an open window; the unfunded bound reclaim enters stopped with the binding present.\n\n## Regression tests\n\nFour cases in `power.test.ts` drive the real `executeSuspend` body (preflight, routing, and the full legacy commit transaction) over the deterministic simulation: the two regressed states above must complete through the legacy paths without touching paid retirement (the sleep spy throws if entered), and the open-funding and bound-reclaim states must still route. Funding histories are multi-row in deliberately adversarial table order, and the direct-read stub sorts by `(period_start, id) DESC` only when the query under test actually chained `orderBy` — so the ordered half of the probe is pinned too: an unordered read picks a stale window and fails the expiry-stopped and bound-reclaim cases (absorbing ss251's review point). The harness gains an opt-in direct-read override (`sandboxDirectReads`) because the routing probe reads `dbWrite` outside a transaction; default stays passthrough, so no existing fixture changes behavior. Funded ownership and settlement remain owned by the PostgreSQL/SSH suite.\n\n## Verification\n\n- `cd packages/cloud/shared \u0026\u0026 bun test src/lib/services/eliza-sandbox/power.test.ts` — 27/27 pass at this head (23 pre-existing + 4 new)\n- Two mutants (base `power.ts` blob restored; probe `orderBy` dropped): each fails exactly its two intended tests — matrix in the domain-artifacts row\n- Neighbor suites at this head: `deletion-teardown.test.ts` 16/16, `replacement.test.ts` 27/27\n- Real PostgreSQL (isolated loopback `dedicated_compute_test_*`, PostgreSQL 17.11): the funding suite passes 35/35 including two new cases that pin the routing probe's actual SQL — `latestAgentComputeFundingWindow` (extracted, same query) returns the latest window under adversarial physical heap order across multiple funding windows, and an exact `period_start` tie breaks to the higher id, matching the sleep path's read. Dropping the probe's `orderBy` fails both against the live database (mutant C below)\n- **Real SSH harness (new): the two expiry suspend states hermes asked for.** Live rig = colima VM (sshd, dockerd, systemd compute guard on loopback SSH) plus isolated loopback PostgreSQL 17.11. Two new fixture-gated scenarios let the funded lease genuinely expire on the host — the guard stops the container at the 60s stop margin and its durable receipt settles the window through `reconcileExpiredAgentCompute` over real SSH — then drive the real `executeSuspend`:\n  - `user-suspend-expiry-stopped`: stopped-in-place, settled window, no retirement binding → confirms through the stopped fast path; no live capture or persist attempted, the stopped container and its unbacked data verified still on the host, intent `provider_confirmed`, one settled window, money reconciled, terminal no-op on retry.\n  - `user-suspend-settled-running`: re-placed row (successor node) with only settled funding → in-place branch; the backup gate captures (container data read for real via `docker cp`), the legacy replacement stop tears down on the real host, backup verified, intent `provider_confirmed` with retained-backup billing, money reconciled.\n  - The pre-existing in-scenario probe that NULLed `retirement_backup_id` and expected the sleep-path refusal was unrunnable before any rig existed and contradicts this fix's own deterministic contract for intent-routed suspends; it now runs only for the direct `executeSleep` scenarios, and the dedicated expiry-stopped scenario owns the intent-routed contract.\n  - Full suite with the SSH fixture: **51/51 pass** at this head with the real persistence path in place (821 assertions, 813s; log attached). Three develop-side drifts that upstream CI can never catch (priced start admission on the fixture wake job, a suffix collision with a new lifecycle test, the #31504 ledger shape) are adapted in their own commit.\n  - **What is real vs. substituted in these two scenarios** (raised in review):\n\n| lifecycle edge | in these scenarios |\n| --- | --- |\n| SSH transport + systemd compute guard on the host | real |\n| Docker container create/start, guard stop at the margin, teardown | real |\n| lease grant/revocation and the durable provider stop receipt | real |\n| PostgreSQL 17 lifecycle transactions, settlement, refunds | real |\n| `reconcileExpiredAgentCompute`, `executeSuspend`, stop-intent machine | real |\n| backup persistence: encryption at rest, storage decision, `last_backup_at` | **real** (was mocked; now a pass-through spy) |\n| `fetchSnapshotState` — the bridge HTTP state read | substituted: the fixture image is a bare `node:22-alpine` http server, so it serves no Eliza state endpoint |\n\n  - The persistence mock previously hard-coded `verification_status: \"verified\"`, which production does not set on this path — the fixture was flattering the code. With the real path the stored row is asserted to be `kms-aes-256-gcm` ciphertext that decrypts to the exact captured state.\n  - **Acceptance records.** With `COMPUTE_FUNDING_EVIDENCE_DIR` set, each scenario writes a phase-by-phase document (funded/running before expiry → after real expiry reconciliation → after the user suspend → after the crash-retry replay) containing the funding rows, sandbox row, stop-intent rows, backup rows, node allocation, organization balance and the live host's view of the container. Both documents are inlined in the domain-artifacts row below.\n- `packages/cloud/shared` typecheck passes; `biome check` clean on the touched files\n- Root `bun run verify` at this head: **373/373 tasks pass**, including `@elizaos/ui#lint:check` (cache miss, executed, 3509 files). An earlier run of mine reported that task red; that was a local toolchain/build-state artifact in a freshly rebased worktree (a `bunx`-resolved Biome disagreeing with the repo-pinned 2.5.8 over `noImportantStyles`, which is a warning here, plus an unbuilt `@elizaos/prompts/dist` failing `@elizaos/cloud-api`'s wrangler dry-run). Neither reflects `develop`, and this branch touches no file under `packages/ui` or `packages/cloud/api`.\n- Environment: disposable worktree rebased onto current `origin/develop` (`ebc808e3a6`), Bun 1.3.14, `bun install`, `bun run build:core`. Suites and mutants were run at `c446d94325`; the rebase onto `ebc808e3a6` advances the base over six CI-workflow and Markdown commits that touch no source file, and the branch's own `+`/`-` lines are byte-identical across the two bases, so those results carry\n\n\u003c!-- evidence-head:c5d246d97d30018bf86440d9583eeec52d6e9767 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before full-page screenshots: `N/A - daemon lifecycle behavior; no rendered UI surface changes.`\n\u003 nd is rebased onto the latest `origin/develop`\n      with zero conflicts.\n- [x] `bun install` was run after sync; focused package gates pass. Repo-wide\n      `bun run verify` was not run to green on this machine — see **Known gaps**.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      before/after evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop` (`4c68a1e93b`); zero conflicts.\n- [x] Focused package checks (test + typecheck + biome) pass post-sync. Repo\n      `bun run verify` blocker documented in **Known gaps / failures**.\n\n# Risks\n\nLow. The change is confined to `plugins/plugin-vision` and only rewrites how the\nOCR results SharedArrayBuffer is encoded/decoded. The wire layout (reserved\n16-byte header, `uint32 length`, `uint32 frameId`, `float64 timestamp`, then\nJSON payload at offset 32) is preserved byte-for-byte; only the payload byte cap\nchanged from a hardcoded 65536 to the real buffer capacity, and the writer now\nguarantees `header length == bytes committed`. No public export, route, event,\nor cross-package surface changes.\n\n# Background\n\n## What does this PR do?\n\nOn the high-FPS screen-vision worker path (`targetScreenFPS \u003e 10` →\n`VisionService.initializeScreenVision` → `VisionWorkerManager`), the OCR worker\nserializes each frame's combined OCR result to JSON and exchanges it through a\n5 MB `SharedArrayBuffer`. Both sides hardcoded a **64 KB** cap far smaller than\nthe buffer:\n\n- writer (`ocr-worker.ts writeResultsToBuffer`, `MAX_TEXT_LENGTH = 65536`) wrote\n  the **true** JSON length into the header but copied at most 65536 bytes;\n- reader (`vision-worker-manager.ts readOCRResult`,\n  `new Uint8Array(Math.min(length, 65536))`) decoded at most 65536 bytes.\n\nA dense screen of text (code editor, web page, document, spreadsheet — a few\nhundred text blocks each carrying text + bbox coords) routinely clears 64 KB.\nThe JSON was then truncated mid-token, `JSON.parse` threw, `readOCRResult`\nreturned `null`, and the **entire OCR frame was discarded**. `latestOCRResult`\nstayed stale/null, so `getLatestEnhancedScene`, `getReadiness().ocr`, and the\nscene description silently lost all recognized text for every dense frame — even\nthough the header recorded the true (untruncated) length, so the data was\nknowably discarded.\n\nThe fix centralizes the buffer layout and codec in a new\n`workers/ocr-results-buffer.ts` shared by the writer and reader:\n\n- a single `OCR_RESULTS_PAYLOAD_CAPACITY = OCR_RESULTS_BUFFER_SIZE - 32` caps\n  both sides (replacing the magic 65536);\n- the writer commits **every** payload byte and records a header length equal to\n  the bytes it wrote — never larger;\n- only when a frame genuinely exceeds the multi-megabyte buffer does the writer\n  drop lowest-value block bounding boxes while preserving `fullText`, flagging\n  `truncated: true` at that hard resource boundary;\n- the reader reads exactly `length` bytes and treats `length \u003e capacity` as an\n  explicit typed `ElizaError` (degraded to a `null` OCR result and logged at the\n  manager boundary), never a truncated parse.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes silent data loss).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The buffer\ncodec is an internal worker/manager contract; no configuration keys, exports, or\nruntime surfaces documented in the package guide changed.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-vision/src/ocr-buffer-truncation.test.ts` — a deterministic\nregression suite that needs **no worker threads, GPU, or display**. It drives\nthe real, reachable `VisionWorkerManager.readOCRResult` (via reflection, exactly\nas `updateOCRCache` calls it on an `ocr_complete` message) and the shared codec\nthe worker writes with.\n\nReachability of the fixed path: `service.ts` `initializeScreenVision ndalone helpers take an additive, explicit type or resolver argument so one agent's custom registry cannot bleed into another's. An explicit legacy `TypeHandler` still overrides a built-in, while a per-runtime custom `ControlType` wins over that global legacy handler. Date-only answers normalize to a validated `YYYY-MM-DD` calendar day; explicit-year ISO, numeric, and English month-name formats are supported, while yearless or impossible dates remain invalid for re-asking. Sensitive display masking still precedes a type's formatter.\n\n# Risks and documentation\n\nModerate compatibility risk at the date boundary. Unsupported time-bearing, yearless, and locale-ambiguous input is now invalid rather than silently changed into a plausible saved date. Existing persisted timestamp-shaped values have no reliable original calendar-day provenance; this PR does not invent a migration or silently reinterpret them. Owners should assess those legacy sessions before release. No UI or route was changed. The plugin's existing README registration contract is implemented without a new global registry.\n\n# Testing\n\n- Clean `origin/develop` baseline: three exact-source probes fail for Tokyo date normalization (`2026-09-14T15:00:00.000Z` instead of `2026-09-15`), registered custom validation (healthy fallback), and the missing model-facing extraction hint. The same three probes pass at this head.\n- `bun run --cwd plugins/plugin-form test`: 153/153 pass across 11 files, including service validation, timezone matrix, custom type isolation and legacy precedence, evaluator prompt, single-field model/correction boundaries, and persisted readback checks.\n- `bun run --cwd plugins/plugin-form build`, `typecheck`, and `lint:check`: pass.\n- Lower-concurrency workspace typecheck/lint pre-warm: 373/373 tasks pass. Root `bun run verify` on the clean committed head: pass (workspace typecheck/lint, build and repository audits, 0 focused or orphaned skipped tests). An earlier concurrent attempt c fe (never throws during classification; defaults to the host zone, then UTC).\n\n# Background\n\n## What does this PR do?\n\n`FinancesService.getUpcomingBills` classified an email-extracted bill as `overdue` when its bare `YYYY-MM-DD` `dueDate` was less than `now.toISOString().slice(0, 10)` — the **UTC** calendar day. `dueDate` values are the day the owner reads on their own calendar, so the comparison was off by the owner's UTC offset:\n\n- **West of Greenwich**, a bill due *today* wrongly flipped to `overdue` in the owner's afternoon/evening (e.g. 16:00 in Los Angeles, 19:00 in New York).\n- **East of Greenwich**, a bill due *yesterday* wrongly stayed `upcoming` until UTC midnight (09:00 local in Tokyo).\n\nThis status feeds the `FINANCES` action `dashboard` payload the agent reasons over, `GET /api/lifeops/money/dashboard`, `GET /api/lifeops/money/bills`, and the bills-list `statusRank` sort order.\n\nThe fix compares `dueDate` against **today's calendar day in the owner's zone**, resolved in this precedence with fall-through on any invalid/failing value:\n\n1. an explicit `timeZone` argument on `getUpcomingBills` (for callers/tests),\n2. a host-supplied owner timezone resolver injected via the new `resolveTimeZone` option,\n3. the agent's `TIMEZONE` setting (`runtime.getSetting(\"TIMEZONE\")`, the same access the core current-time provider uses),\n4. the process/host zone (`Intl.DateTimeFormat().resolvedOptions().timeZone`), then `\"UTC\"` as a last resort.\n\nThe personal-assistant route factory (`getFinancesService` in `lifeops-routes.ts`) injects `resolveOwnerTimeZone` — the same owner-fact source reminders and scheduled tasks resolve — so the HTTP endpoints honour the owner's stored zone. The `FINANCES` action (`actions/finances.ts`) still constructs `new FinancesService(runtime)` without a resolver, because `plugin-finances` cannot import `plugin-personal-assistant` (dependency direction); its `dashboard` payload therefore resolves through the `TIMEZONE` setting / host zone rather than the owner timezone fact — still a strict improvement over the old UTC day. Two small pure helpers are added and exported: `calendarDateKeyInZone(now, timeZone)` (derives the zero-padded `YYYY-MM-DD` key for a zone via `Intl.DateTimeFormat(\"en-CA\").formatToParts`, throwing on an unknown zone) and `isValidTimeZone(timeZone)`.\n\n### Before / after status\n\nFor `now = 2026-03-03T03:30:00.000Z` and a bill with `dueDate: \"2026-03-02\"`:\n\n| Configured zone | Before (UTC-day bug) | After (owner-day) |\n| --- | --- | --- |\n| owner fact `America/Los_Angeles` | `overdue` ❌ | `upcoming` ✅ |\n| `TIMEZONE=Pacific/Honolulu` | `overdue` ❌ | `upcoming` ✅ |\n| `TIMEZONE=Asia/Tokyo` | `overdue` ✅ | `overdue` ✅ |\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue). The `resolveTimeZone` option and the `timeZone` arg are additive; existing callers keep working and now fall through to the `TIMEZONE` setting / host zone.\n\n# Documentation changes needed?\n\nMy changes do not require a documentation change. Behaviour is corrected to the documented intent (owner-local dueness); the public option/arg additions are documented via exported-symbol JSDoc.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-finances/src/upcoming-bills-timezone.test.ts` — a deterministic regression test that pins `now`, seeds one email bill through a stubbed repository (no DB), and asserts status across the full zone-resolution precedence, plus `calendarDateKeyInZone` directly. Then read the `getUpcomingBills` diff in `finances-service.ts` and the one-line injection in `lifeops-routes.ts`.\n\n## Detailed testing steps\n\nNone beyond automated tests. Reachability of the route path is proven by wiring `resolveTimeZone` into the existing `getFinancesService` factory that already backs `GET /api/lifeops/money/bills` and `GET /api/lifeops/money/dashboard` (unchanged URLs/response shapes).\n\n# Evidence Gate\n\n\u003c!-- evidenc rough the real `parseValue → validateField → formatValue` path:\n\n```text\nTZ=Asia/Tokyo    \"September 15, 2026\" → \"2026-09-14T15:00:00.000Z\"  valid  displayed verbatim\nTZ=Europe/Berlin \"9/15/2026\"          → \"2026-09-14T22:00:00.000Z\"  valid  displayed verbatim\nany TZ           \"Sept 15\"            → \"2001-09-14T15:00:00.000Z\"  valid  (V8 default year)\n```\n\nThe fix:\n\n- `registerControlType` publishes the type to the handler registry: a custom type in full; a builtin only its `extractionPrompt`.\n- New `calendar-date.ts`: `parseCalendarDate` (ISO passes through after a real-day check; any other format must carry a four-digit year and resolves through the local components of the parsed instant, which is the day the user named on every host), `calendarDateComponents`, and `formatCalendarDate` (builds the display from components so `2026-09-15` is not shown as the 14th west of UTC).\n- `parseValue`'s date branch and the builtin's `parse`/`format`/`validate` use the helper; `validateDate` requires a calendar-date string (a Date or timestamp number still works for min/max bounds).\n\n## What kind of change is this?\n\nBug fix.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-form/src/service.ts` (`registerControlType`), then `src/validation.ts` (`parseValue` date branch, `validateDate`, `formatValue`), then `src/calendar-date.ts`.\n\n## Detailed testing steps\n\nNew suite `plugins/plugin-form/src/control-type-registry.test.ts` (14 cases) drives the real `FormService`, the extractor prompt builder, and the validation module, switching `process.env.TZ` per case (Asia/Tokyo, Europe/Berlin, America/Los_Angeles, Pacific/Auckland, UTC).\n\nRED control — develop's `builtins.ts`/`service.ts`/`validation.ts` with this test file:\n\n```text\n × publishes builtin extraction prompts to the extractor\n × runs a custom simple type's validate, parse, format, and prompt for a top-level field\n × resolves natural-language answers to the named day under TZ=Asia/Tokyo\n × resolves natural-language answers to the named day under TZ=Europe/Berlin\n × resolves natural-language answers to the named day under TZ=America/Los_Angeles\n × resolves natural-language answers to the named day under TZ=Pacific/Auckland\n × resolves natural-language answers to the named day under TZ=UTC\n × rejects a year-less answer instead of storing a fabricated year\n × rejects a rolled-over day and an instant that is not a calendar date\n Tests  9 failed | 5 passed (14)\n```\n\n(The five that pass on develop pin the hardened number path, the display cases, and min/max bounds.)\n\nGREEN at `36287f191619`:\n\n```text\n$ bunx vitest run --config vitest.config.ts        # plugins/plugin-form\n Test Files  12 passed (12)\n      Tests  162 passed (162)\n$ bun run typecheck                                 # tsc --noEmit, 0 errors\n$ bunx @biomejs/biome check \u003c5 changed files\u003e       # clean\n```\n\nRoot `bun run verify` is running on this exact commit in a fully installed checkout; result follows as a comment.\n\nNot run: a live-model form session. The change is in deterministic parse/validate/format/prompt-assembly code; the new suite exercises the real service and prompt builder rather than a mock, and the model-facing change is only the type hint text now reaching the prompt.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01GnpYyWkEf3naaRGNtRmwNp\n"])</script><script>self.__next_f.push([1,"2c:T26af,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #30731.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [x] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker.\n- [x] A reviewer can confi t_f.push([1,"# Relates to\n\nCloses #30110\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [x] `bun install` was run after sync. `bun run verify` is a full-repo gate; the\n      owning package's `test`, `typecheck`, and `lint` all pass (see below). Any\n      unrelated full-repo blocker is recorded under **Known gaps / failures**.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      before/after harness output and the red→green regression test below.\n\n# Sync with develop\n\n- [x] Based on latest `origin/develop` (`d8c5b3124d`); zero conflicts.\n- [x] Package `test` + `typecheck` + `lint` pass post-sync (output inline). Any\n      full-repo `verify` limitation is documented in **Known gaps / failures**.\n\n# Risks\n\nLow. The change is confined to one library module's file-lock helper\n(`packages/evidence/src/queue/analysis-merge.ts`). It preserves the existing\npublic signature of `mergeAnalyzerResult` and the on-disk lockfile/analysis.json\nformats. The only behavioral change is *stronger* serialization: a writer that\ndetects its lock was broken in now retries instead of committing a stale\ndocument. The retry is bounded by the existing acquire deadline, so a\npathological subject cannot spin forever.\n\n# Background\n\n## What does this PR do?\n\n`mergeAnalyzerResult()` serializes each subject's read-modify-write of\n`analysis.json` behind a per-subject `O_EXCL` lockfile so two GPU workers merging\ndifferent analyzers \"never drop each other's analyzer result.\" The stale-lock\nreclamation path defeated that guarantee via a TOCTOU:\n\n`breakStaleLock()` stat'd the lockfile, judged it stale (holder crashed), then\n**unconditionally** `fs.unlinkSync(lockPath)` — without verifying the file it\nremoved was still the same stale lock it observed. When two waiters both\nobserved one stale lock, one (A) unlinked it, recreated a fresh **live** lock and\nentered the critical section; the second (B), whose unlink was scheduled after A\nrecreated, then removed A's live lock and also acquired. Both processes were then\ninside the critical section, both read the old document, and the later atomic\nrename silently overwrote the earlier holder's analyzer result — the exact lost\nupdate the lock exists to prevent. In production this fires when a crashed/killed\nworker leaves a stale lock (\u003e10s) and ≥2 workers concurrently merge results for\nthe same subject: a certified `analysis.json` then silently omits an analyzer's\nverdict.\n\nThe fix closes the window with two mechanisms:\n\n1. **Per-acquire nonce + commit-time theft check.** `acquireLock` now stamps a\n   random nonce (`${pid} ${randomUUID()} ${iso}`) into the lockfile and returns\n   it. Immediately before the atomic rename, the committer re-reads the lockfile\n   and asserts its nonce is still present. If the file is gone or the nonce\n   changed, a break-in stole the lock, so the writer aborts the pending write and\n   retries the whole acquire + read-modify-write (re-reading whatever the other\n   holder committed) instead of clobbering it. The temp file is staged *before*\n   the check, so the only work between the check and the commit is the single\n   atomic `rename` — the smallest possible window.\n2. **Atomic stale-lock reclamation.** `breakStaleLock` now renames the stale lock\n   aside to a process-unique sidecar instead of unlinking it. `rename` moves one\n   inode atomically, so of N racing breakers exactly one wins; the losers get\n   `ENOENT` and retry the create, where they meet the winner's fresh lock and\n   wait rather than deleting it. If the renamed inode turns out fresh (a holder\n   recreated it in the stat→rename gap), it is restored untouched so a live\n   holder is never silently evicted. This removes the break-in cascade; the nonce\n   check is the backstop for the residual stat→rename gap.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes a data-loss concurrency defect).\n\n# Documentation changes needed?\n\nNone. Behavior of the public API is unchanged except that it is now correct under\nconcurrent stale-lock reclamation; the module header documents the new\ninvariant.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/evidence/src/queue/analysis-merge.test.ts`. Two new regression suites:\n\n- **`stale-lock break-in, #30110`** — a multi-process stress test: each round\n  seeds an empty `analysis.json` plus an already-stale `\u003cpath\u003e.lock` (mtime 60s\n  in the past) so all N=16 `bun` workers hit the break-in path together via a\n  barrier file, then asserts every analyzer result survives across 8 rounds.\n- **`break-in detection, #30110`** — a deterministic, seam-injected unit test:\n  it stages the winner's temp doc, then simulates a second acquirer that breaks\n  the winner's lock, merges its own analyzer, and releases; the winner must\n  detect the nonce is gone and retry, preserving the intruder's result rather\n  than dropping it. This test **fails on the pre-fix source** (red proof below).\n\n## Detailed testing steps\n\n```\nbun run --cwd packages/evidence typecheck   # tsc --noEmit -p tsconfig.json\nbun run --cwd packages/evidence lint        # biome check src\nbun run --cwd packages/evidence test        # full vitest lane (515 passed | 7 skipped)\n```\n\nFocused merge suite:\n\n```\n$ node ../scripts/run-vitest.mjs run --config ./vitest.config.ts src/queue/analysis-merge.test.ts\n Test Files  1 passed (1)\n      Tests  6 passed (6)\n```\n\n# Evidence Gate\n\n\u003c!-- evidence-head:940e975870c750c61e843d4f28ab3f322a737f5f --\u003e\n\nThis is a library-internal cross-process concurrency fix with **no UI, no\nfrontend, no LLM/model, and no rendered visual surface**. The evidence harness\nand its outputs are text; th ldMetadataValueEquals` **is** the compare-and-swap comparison. Four call sites gate a world write on it:\n\n- `runtime.ts:4918`\n- `inMemoryAdapter.ts:1827`\n- `plugin-sql/src/base.ts:5289`\n- `plugin-inmemorydb/adapter.ts:1740`\n\nSo a wrong `true` there is a lost update, not a failed assertion — which makes the interesting cases the ones where two objects are jsonb-equal without being `===`, and the ones where they merely look equal.\n\n# Evidence\n\nMutating each guard to a no-op, against `roles.role-write-cas.test.ts`:\n\n| mutant | before | after |\n|---|---|---|\n| `Number.isSafeInteger(value) \u0026\u0026 value \u003e= 0` → `typeof value === \"number\"` | **survived** | killed |\n| drop `value \u003e= 0` | **survived** | killed |\n| collapse `malformed_revision` / `revision_mismatch` to one reason | **survived** | killed |\n| drop `delete incoming.roles` | **survived** | killed |\n| drop `delete incoming.roleSources` | **survived** | killed |\n| drop the `[REVISION_KEY]: storedRevision` pin | **survived** | killed |\n| `MAX_SAFE_INTEGER` exhaustion guard → `false` | **survived** | killed |\n| invalid-current-revision guard → `false` | **survived** | killed |\n| audit `Array.isArray(prior) ? prior : []` → `prior ?? []` | **survived** | killed |\n| drop the forced `0` in `initializeWorldMetadataRevision` | **survived** | killed |\n| drop the array length check | **survived** | killed |\n| drop the left-side `undefined` filter | **survived** | killed |\n| drop `leftKeys.length !== rightKeys.length` | **survived** | killed |\n| `Array.isArray(left) \u0026\u0026 Array.isArray(right)` → `false` | **survived** | killed |\n| `undefined` revision → `null` instead of `0` | killed | killed |\n| `storedRevision !== writerRevision` → `false` | killed | killed |\n\n**17 of 19 survived before; all 17 now die,** and the 2 the existing suites already caught still die. 12 → **54 passing** across both files. `packages/core` typechecks, biome clean, `bunx vitest run packages/core/src/database/` → 17 files, 148 passed.\n\n# The ones worth naming\n\n**The revision helpers' fail-closed signal was untyped.** `getWorldMetadataRevision` returns `null` for anything that isn't a non-negative safe integer, and callers turn that `null` into a thrown stale write. With only `typeof value === \"number\"` surviving, a float, a negative, an infinity or `NaN` would all have been used as a counter. Eight rejected shapes are now pinned, plus `MAX_SAFE_INTEGER` as an accepted one.\n\n**Both stale-write reasons are diagnoses, not decoration.** `revision_mismatch` means someone raced you; `malformed_revision` means the stored row itself is wrong. Collapsing them survived, so the tests now assert the `context` payload, not just that something threw.\n\n**The subset/superset case is what the key count exists for.** Every *left* key can be present and equal on the right while the right has more — so without comparing counts, `{a:1}` and `{a:1,b:2}` compare equal. On a CAS comparison that is precisely a lost update. Both directions are now asserted, along with `{}` against `{a:1}`.\n\n**`delete incoming.roles` matters only when the stored world has none.** The comment above it says an incoming owner-only projection built during message ingestion must never replace stored authority state. When stored *has* a role map, the restore spread below also protects it — so the case that isolates the delete is a stored world with no role map at all, for both `roles` and `roleSources`.\n\n# Two survivors left deliberately\n\nBoth are redundant rather than uncovered, and I'd rather say so than write a test that asserts nothing:\n\n- **The explicit `...(stored.roles === undefined ? {} : { roles: stored.roles })` restore.** `stored.roles` already arrives via `...stored`, and `...incoming` cannot override it because `incoming.roles` was just deleted. Executed across three incoming shapes (with roles, without roles, empty), the merged result is byte-identical with and without the clause.\n- **`Object.hasOwn(right, key)`.** Every surviving `leftKey` has a defined value (the filter above removed the rest), so a key absent from `right` yields `right[key] === undefined` and fails the recursive comparison anyway. Executed across eight object pairs — including same-count-different-keys, subset/superset, prototype-named keys and both-undefined — `hasOwn` changed the verdict in **0 of 8**.\n\nNeither is wrong, and both are cheap defence in depth on a lost-update path; I'd keep them. But a test \"covering\" them would be asserting a branch that cannot be reached, so I left them and named them here instead.\n\n# Scope\n\nNew test file only — no production code touched.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1M814QGPBARMAC7RT6039RY\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T18:20:51.824Z\",\"completed_at\":\"2026-09-03T18:22:01.494Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T18:20:52.463Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavaila uestAllWebsiteAccess`, `requestWebsiteAccess`, both `executeScript*` | **throw** |\n| `updateDynamicRules`, `getExtensionUrl` | no-op / fall back |\n\nThe middle row is the interesting one. A silent `false` from a *request* is indistinguishable from the user clicking Deny — it would send a caller down a \"user refused\" path when the truth is a broken runtime. Meanwhile `updateDynamicRules` runs on startup paths, so a throw there would take down the service worker on a browser that doesn't expose `declarativeNetRequest`. Both mutants (making the request return `false`, making the rule update throw) now fail.\n\nEach test stubs `chrome` with only the surface that case needs, so an accidental reach for another API throws rather than quietly passing.\n\n# Three specifics worth calling out\n\n**The origin patterns are exact.** `hasAllUrlHostPermission` asks for `[\"https://*/*\", \"http://*/*\"]` — deliberately *not* `\u003call_urls\u003e`, which would additionally cover `file://` and `ftp://`. Substituting `\u003call_urls\u003e` is now a failing mutant.\n\n**A denied request is re-checked.** Chrome can answer `false` to `permissions.request` while the permission is in fact already held; both helpers fall back to the `contains` check. All four combinations are covered, including that **no** re-check happens when the request already succeeded (so an unnecessary second call can't creep in).\n\n**World separation is load-bearing.** `executeContentScriptFiles` injects `world: \"ISOLATED\"`; only `executeScriptInMainWorld` uses `\"MAIN\"`. Injecting a content-script file into MAIN would expose it to page JavaScript and to anything the page has already patched onto its own globals. Swapping either world is a failing mutant.\n\n# Mutation testing: 17 mutants, 17 killed\n\nNo survivors.\n\n- both fail-open mutants (`hasAllUrlHostPermission`, `isIncognitoAccessAllowed` returning `true` when unavailable)\n- `\u003call_urls\u003e` substituted for the explicit scheme pair\n- every `getGrantedOrigins` normalization step removed individually — type filter, trim, blank filter, sort\n- the post-denial re-check dropped, and separately made unconditional\n- `ISOLATED` → `MAIN`, and `MAIN` → `ISOLATED`\n- `results[0]` → last frame (an iframe result silently replacing the top frame's)\n- request-unavailable throw → `false`; scripting-unavailable throw → no-op\n- the two deliberate tolerant paths (`updateDynamicRules`, `getExtensionUrl`) turned into throws\n\nOne deliberate non-assertion: `getGrantedOrigins` **keeps duplicates**. The browser is the source of truth for that list, and silently collapsing it would hide a real duplicate-grant condition from a caller comparing sets. That's asserted as intended behaviour rather than left ambiguous.\n\n# Evidence\n\n```\nbunx vitest run src/webextension.permissions.test.ts   → 26 pass\nbunx vitest run src/                                   → 173 pass across 20 files\nbunx tsc --noEmit                                      → clean\nbunx @biomejs/biome check                              → clean\n```\n\nTests only — `git diff` touches no source file.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MS106HXRKCT8S44VS1D1BN\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T23:17:52.977Z\",\"completed_at\":\"2026-09-03T23:18:32.647Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e254796 vated a plugin into a service that had already torn its state down.\n\n# Background\n\n## What does this PR do?\n\n`stop()` clears `pendingPlugins` **after** awaiting `activePoll` and the activation promises:\n\n```ts\nif (this.activePoll) { await this.activePoll; }\nawait Promise.allSettled(this.activationPromises.values());\nthis.pendingPlugins.clear();   // ← only now\n```\n\nA secret lookup suspended inside `getMissingSecrets` when shutdown begins therefore resumes with its pending entry **still identity-equal**, satisfies the post-await guard `#24428` added, and starts a brand-new activation after stop was requested. The identity guard is correct but cannot distinguish \"still wanted\" from \"stopped while I slept\", because the map it consults has not been cleared yet.\n\n`registerPlugin()` had no lifecycle fence at all — a registration after `stop()` activates synchronously via the secretless path, and one suspended at `checkPluginRequirements()` resumes and repopulates state `stop()` had just cleared.\n\nThe fix records **intent** before any draining:\n\n- `stopping` is set as the **first statement** of `stop()`, before the awaits that would let suspended work resume; `initialize()` clears it.\n- Both post-await guards become `if (this.stopping || this.pendingPlugins.get(pluginId) !== pending)`.\n- `registerPlugin()` refuses entry when stopping, and re-checks after its suspendable requirements lookup — deleting the `registeredPlugins` entry it wrote, so an aborted registration cannot repopulate cleared state.\n- `activatePlugin()` refuses **brand-new** attempts after stop, while still returning any in-flight attempt, so an activation that already started is drained rather than orphaned.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugin-activator.stop-fence.test.ts`. Each case suspends a real lookup at an exact point r anything. That matters here: the sibling suites in this directory register process-global module mocks, and staying mock-free keeps this file out of that entirely.\n\nEach clause is asserted on its own rather than through one happy path:\n\n- **secret floor** — 31 rejected, 32 accepted, and length measured *after* trimming (`\"    \" + 31 chars + \"    \"` is 39 characters long and still rejected).\n- **key-id pattern** `/^staging-qa-v1-[A-Za-z0-9._-]{1,48}$/` — start anchor (`x-staging-qa-v1-…` rejected), end anchor, empty suffix rejected, 48 accepted / 49 rejected, and the punctuation set (`.`/`_`/`-` accepted; `/`, space, `:`, `+`, `%2f` rejected).\n- **dedication** — three separate cases, one per Steward secret, plus a fourth proving the comparison is made on trimmed values, plus a negative proving a merely shared *prefix* is not a collision.\n- **`isStagingSessionSigningConfigured`** — true/false, and a hostile env whose getter throws a `TypeError` proves the catch **re-throws** a non-configuration failure instead of silently reporting \"not configured\".\n- **enablement** — the happy path, then each of the four conjuncts flipped individually, then that the flag is the exact string `\"true\"` (not `\"TRUE\"`, `\"1\"`, `\"yes\"`, `\"on\"`, `\" true\"`).\n- **`StagingSessionEligibilityError`** — the `reason` is a structured field and the message stays generic, so it can be surfaced without disclosing which check rejected the subject.\n\n# Evidence\n\nMutation-tested against the gate. **16 mutants, 16 killed, 0 survivors:**\n\n| mutant | result |\n|---|---|\n| `secret.length \u003c 32` → `\u003c 0` | killed (3) |\n| drop the `!secret` presence check | killed (1) |\n| key-id regex: drop the `$` end anchor | killed (3) |\n| key-id regex: drop the `^` start anchor | killed (2) |\n| `{1,48}` → `{1,}` | killed (1) |\n| drop the `STEWARD_JWT_SECRET` comparison | killed (3) |\n| drop the `STEWARD_SESSION_SECRET` comparison | killed (2) |\n| drop the `ELIZA_SERVICE_JWT_SECRET` comparison | killed (2) |\n| compare collisions untrimmed | killed (1) |\n| collapse the `isConfigured` catch to an unconditional `return false` | killed (1) |\n| drop the `NODE_ENV === \"production\"` conjunct | killed (2) |\n| drop the `ENVIRONMENT === \"staging\"` conjunct | killed (2) |\n| drop the `STAGING_SESSION_EXCHANGE_ENABLED === \"true\"` conjunct | killed (2) |\n| drop the version conjunct | killed (2) |\n| `STAGING_SESSION_MAX_TTL_SECONDS` `60 * 60` → `60 * 61` | killed (1) |\n\nRuns:\n\n- new file alone → **33 pass / 0 fail**\n- `src/lib/auth/` under the runner's `--isolate` → **211 tests, 0 fail** (178 before this PR)\n- the package runner's **real ordinary batch 6** (computed via `buildTestBatches`, the batch these files actually land in), plus the new file → **165 pass / 0 fail**\n- `bun run --cwd packages/cloud/shared typecheck` → clean\n- `bunx @biomejs/biome check` → clean\n\n# What I did not cover, and why\n\nOnly the configuration gate. `validateStagingSessionBinding`, `loadExistingStagingSessionSubjectForMint` and `loadVerifiedStagingSessionUser` all reach `../../db/repositories`, so covering them means mocking that module — and in this directory that is a process-global `mock.module` registration. `loadVerifiedStagingSessionUser` in particular is a nine-clause fail-closed disjunction that deserves clause-by-clause tests; I left it for a follow-up rather than dragging a global mock into a file that currently needs none.\n\nOne thing worth flagging separately, found while working here and **not** changed by this PR: running `bun test packages/cloud/shared/src/lib/auth/` directly reports 14 failures, because `steward-client-cache-invalidation.test.ts` stubs `InMemoryLRUCache` with only a `delete()` method and that process-global registration wins over its sibling's complete stub. It is **not** a CI defect — `scripts/run-bun-tests.mjs` always passes `--isolate`, and I confirmed the real batch is green — but it does mean the obvious local command is misleading. Happy to open that separately if you want it addressed.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MDSHZZ9BVVXZ05D28WDH9Z\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T20:01:34.719Z\",\"completed_at\":\"2026-09-03T20:02:27.053Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T20:01:35.497Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"5ad438f1ef70eeec86a77b92ae08c6e57040235b32128c4cd7e49851f32df4e4\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"c526159d-e067-4e28-910d-57a20d673a01\",\"object_id\":\"sha256:5ad438f1ef70eeec86a77b92ae08c6e57040235b32128c4cd7e49851f32df4e4\",\"sha256\":\"5ad438f1ef70eeec86a77b92ae08c6e57040235b32128c4cd7e49851f32df4e4\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyE
