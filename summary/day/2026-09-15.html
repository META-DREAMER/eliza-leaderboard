t](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31421-14689-validation.json). Existing codec tests generate, inspect and clean up actual Ogg/Opus and M4A/AAC audio, asserting mute/bleep and idempotency behavior.\n"])</script><script>self.__next_f.push([1,"66:T16a8,"])</script><script>self.__next_f.push([1,"# What users see today\n\nTwo of these ship visibly.\n\n**zh-CN**, `computeruseapprovaloverlay.ModeLine` — the overlay renders a label with nothing after it:\n\n```\n模式：auto · 工具：\n```\n\nThe translation is `'模式：{{mode}} · 工具：{{tool}}'`, but the call site in `ComputerUseApprovalOverlay.tsx:311` passes `mode` and never `tool`.\n\n**tl**, `charactereditor.ConversationCount` and `PostCount` — the count the translator meant to show is swallowed:\n\n```\nt(\"tl\", \"charactereditor.ConversationCount\", { defaultValue: \"conversations\" })  →  \" usapan\"\nt(\"tl\", \"charactereditor.PostCount\",         { defaultValue: \"posts\" })          →  \" post\"\n```\n\n`CharacterEditorPanels.tsx:866` already prints the number itself (`{length}{\" \"}{t(...)}`) and passes only `defaultValue`, so `{{count}}` resolves to nothing and leaves a stray leading space.\n\n# Why\n\n`interpolate` in `src/i18n/index.ts`:\n\n```ts\nfunction interpolate(template: string, vars?: TranslationVars): string {\n  if (!vars) return template;                 // ← unsupplied placeholder stays LITERAL\n  return template.replace(/\\{\\{(\\w+)\\}\\}/g, (_, key) =\u003e {\n    const raw = vars[key];\n    if (raw == null) return \"\";               // ← or becomes an empty string\n    return String(raw);\n  });\n}\n```\n\nA placeholder that exists only in a translation names a variable no caller was ever asked to supply. It renders empty, or — if the call site passes no vars at all — leaves the `{{name}}` on screen.\n\n# How I found it, and what I deliberately did not report\n\nComparing `{{…}}` sets per key across all eight locales gives **345 mismatches**, which is not a bug report. Triaging the classes:\n\n- `ja`/`ko`/`vi`/`zh-CN` dropping `{{plural}}` is **correct** — those languages have no plural form.\n- ~200 cases of a locale spelling the product name out instead of interpolating `{{appName}}` render fine.\n\nOnly the inverse is unconditionally wrong, and that narrows 345 to **5 keys**.\n\nOf those five, `header.MobileNavigationDescription` and `documentsview.DocumentCountOne` have **no call site** outside a checked-in e2e HTML snapshot — dead keys, no runtime impact. I fixed them so they're safe if ever wired up, but I'm not claiming they were breaking anything.\n\n# The fix\n\nEvery other locale already renders these three as plain labels — `es` `'Conversaciones'`, `ja` `'会話数'`, `es` `'Modo'`, `vi` `'Chế độ'`. `tl` and `zh-CN` were the outliers. So rather than invent copy, `tl` becomes exactly what the translator wrote minus the placeholder, and `zh-CN` `ModeLine` becomes `'模式'`, matching all six peers.\n\n7 changed lines across 4 files, no reformatting (`git diff --numstat`).\n\n# The guard\n\n`locale-placeholders.test.ts` pins only the direction that is always wrong: a translation **may** drop a placeholder English has, but must never introduce one. Asserting full parity would fail on the ~340 legitimate cases. A roster assertion keeps a newly added locale from silently skipping the check.\n\n**Control:** stashing only the locale files and keeping the test makes **exactly the 4 locales I edited fail**, while `ja`, `pt` and `vi` stay green — so the guard is neither vacuous nor over-broad.\n\n| | on `develop` | with the fix |\n|---|---|---|\n| `locale-placeholders.test.ts` | **4 failed** / 4 passed | 8 passed |\n| `packages/ui/src/i18n/` | — | 18 passed |\n\n`biome check` clean on all five files. `bun run --cwd packages/ui typecheck` exit 0, 0 errors.\n\n# Unrelated failures, attributed not reported\n\nThe character and shell component suites show 4 failures (`DefaultHomeWidgets` clock/weather tiles, a `ChatOverlay` fuzz test). Re-runn ummary case is the one a user actually sees, as a plausible-looking reply rather than an error.\n\n## This plugin already had the guard\n\n`providers/actions.ts` in the same plugin reads its numeric settings correctly, and is used for three timeout settings:\n\n```ts\nfunction numberSetting(runtime: IAgentRuntime, key: string, fallback: number): number {\n  const raw = runtime.getSetting?.(key) ?? env?.[key];\n  const value = typeof raw === \"string\" ? Number(raw) : raw;\n  return typeof value === \"number\" \u0026\u0026 Number.isFinite(value) \u0026\u0026 value \u003e 0 ? value : fallback;\n}\n```\n\nThe four planner sites hand-rolled the read and lost that rule. This PR adds `positiveIntSetting` to `utils/native-planner-guards.ts` — the module whose name already covers exactly this — applying the same requirement (integer and positive, else fall back), and routes all four bounds through it.\n\n## Reachability, graded honestly\n\n**Ordinary operation is unaffected.** An absent setting resolved to the default before this change and still does; the four defaults are unchanged. The reachable triggers are operator misconfiguration: an env var assigned empty, a placeholder word, or `0`. So this is a robustness fix rather than a bug ordinary use hits — but the failure mode it removes is the bad kind, because nothing logs and the planner degrades into silence or a canned reply.\n\n## Tests\n\nNew `native-planner-settings.test.ts`, 12 tests: the valid and absent cases, then each rejected input (empty string, whitespace, non-numeric word, `0`, `-1`, `1.5`, `null`, a boolean), plus one that pins the mechanism itself —\n\n```ts\nconst bad = Number.parseInt(String(\"\" ?? \"2\"), 10);\nexpect(Number.isNaN(bad)).toBe(true);\nexpect(0 \u003c bad).toBe(false);\nexpect(1 \u003c= bad).toBe(false);\nexpect(9 \u003e= bad).toBe(false);\n```\n\nThe file is registered in `vitest.config.ts`'s explicit `include` list, which its own comment requires for any file importing from `\"vitest\"` — otherwise the changed-file coverage lane filters against `include`, matches nothing, and hard-fails with *\"No test files found\"*.\n\n**Liveness control.** Replacing the guard body with the old `parseInt` idiom fails **7 of the 12** tests. The other 5 are the absent-setting and valid-value cases, which the old code also got right — so 7, not 12.\n\n## Verification\n\n| check | result |\n|---|---|\n| `packages/cloud/shared` (full suite) | 128 passed / 129 |\n| `bun run typecheck` (`packages/cloud/shared`) | clean |\n| `biome check` (4 touched files) | clean |\n\nThe single failure is `src/lib/services/__tests__/direct-wallet-payments.integration.test.ts` — *\"confirm rejects an expired payment even with a valid real signature\"* reports a quote-signature mismatch instead of expiry. Confirmed identical with my changes stashed on `develop`, and unrelated to this diff. It may be worth a separate look: it reads as though the signature check runs ahead of the expiry check, so an expired payment surfaces as tampering. I have not investigated far enough to say whether the test or the ordering is wrong, so I am only flagging it.\n\n## How this was found\n\nAn AST scan over 12,040 non-test source files found 902 variables initialised from `Number` / `parseInt` / `parseFloat`, 456 of them used in a relational comparison, and 82 with no `Number.isFinite` / `isInteger` / `isNaN` exclusion in the enclosing function. 82 is not evidence, so the discriminator was: keep only comparisons that are guards which *reject*, where `NaN` flips them to accept and nothing downstream re-enforces.\n\nThat closed the two highest-stakes candidates as clean negatives, both worth recording as fine:\n\n- `web-push/endpoint-validation.ts` derives its octets from a `^(\\d{1,3})\\.…$` match, so `Number()` can never be `NaN` and the private-range guard is sound.\n- `readImageWithLimit` in `fal-` and `atlascloud-image-generation.ts` uses the `content-length` header only as a fast path — the streaming `received \u003e MAX` loop and the `arrayBuffer` byte-length check still enforce the cap, so a `NaN` declared length loses nothing.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PMVPC73HC0JYG41Y3DEM1Y\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T16:43:33.639Z\",\"completed_at\":\"2026-09-04T16:48:31.853Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T16:43:33.857Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"3d2bff7cbe97e29e15bda7161cc916a1c0052b8ed6fe3430127e9def39d4de89\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"5a5203a0-ccea-4edd-9023-a318131121ba\",\"object_id\":\"sha256:3d2bff7cbe97e29e15bda7161cc916a1c0052b8ed6fe3430127e9def39d4de89\",\"sha256\":\"3d2bff7cbe97e29e15bda7161cc916a1c0052b8ed6fe3430127e9def39d4de89\"},\"signature_ e clause leaves every related suite green:\n\n| mutant | `agent-backup-diff` | `agent-backup-verifier` | `agent-sandboxes` |\n|---|---|---|---|\n| drop `\"filesChanged\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"filesRemoved\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"configChanged\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"configRemoved\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"memoriesBaseCount\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"memoriesAppended\" in value` | 0 fail | 0 fail | 0 fail |\n\nThe guard is pinned only in aggregate — inverting the whole predicate *is* caught (16 failures in the verifier suite). Every fixture in the repo carries all six keys, so nothing distinguishes a complete delta from a truncated one.\n\n# Why each clause is load-bearing\n\n`applyBackupDelta` reads all six fields unguarded. Executed against a base of three memories and a delta that should yield `[{id:1},{id:9}]`, dropping one field at a time:\n\n| missing field | result |\n|---|---|\n| `filesChanged` | `TypeError: Cannot convert undefined or null to object` |\n| `filesRemoved` | `TypeError: filesRemoved is not iterable` |\n| `configChanged` | `TypeError: Cannot convert undefined or null to object` |\n| `configRemoved` | `TypeError: configRemoved is not iterable` |\n| **`memoriesBaseCount`** | **no throw — `[{id:1},{id:2},{id:3},{id:9}]`** |\n| **`memoriesAppended`** | **no throw — `[{id:1},null]`** |\n\nFour fail loudly. The two memory clauses do not: `slice(0, undefined)` keeps the **whole** parent list, so a truncated delta silently resurrects history the parent had compacted away; `concat(undefined)` appends a hole that JSON-round-trips to `null`, so a restored agent gets a null memory entry. Those two are the clauses whose absence corrupts a restored agent rather than crashing the restore, and they were exactly as unprotected as the other four.\n\nThe guard is the only thing between a partial payload and that behaviour, which is why the clause it drops shouldn't be a free change.\n\n# The change\n\nTests only — no production change. One case per clause plus both directions of the discriminator:\n\n- a complete delta is recognized **and** rejected by `requireBackupStateData`;\n- a full state is recognized **and** rejected by `requireBackupDelta`;\n- `test.each` over the six keys: a delta missing that one key fails `isBackupDelta`, makes `requireBackupDelta` throw the id-bearing error, and is accepted by the other branch — so each clause is asserted on its own;\n- `in` tests key presence, not definedness. An explicitly `undefined` field still satisfies its clause today; pinned so that switching to a truthiness check becomes a deliberate change instead of an accident.\n\n# Evidence\n\n`bun test src/lib/services/agent-backup-diff.test.ts` → **42 pass / 0 fail** (was 33), 68 `expect()` calls.\n\nSame mutants, after:\n\n| mutant | before | after |\n|---|---|---|\n| drop `filesChanged` | 42 pass | **41 pass / 1 fail** |\n| drop `filesRemoved` | 42 pass | **41 pass / 1 fail** |\n| drop `configChanged` | 42 pass | **41 pass / 1 fail** |\n| drop `configRemoved` | 42 pass | **41 pass / 1 fail** |\n| drop `memoriesBaseCount` | 42 pass | **41 pass / 1 fail** |\n| drop `memoriesAppended` | 42 pass | **41 pass / 1 fail** |\n| invert the predicate | — | **33 pass / 9 fail** |\n| `\"memoriesAppended\" in value` → `!== undefined` | 42 pass | **41 pass / 1 fail** |\n\n**8 of 8 killed, from 0 of 8.**\n\nNeighbouring suites unchanged, run file by file:\n\n```\nagent-backup-diff.test.ts                     42 pass  0 fail\nagent-backup-diff.canonicalize-bound.test.ts   6 pass  0 fail\nagent-backup-diff.safe-sort.test.ts            3 pass  0 fail\nagent-backup-verifier.test.ts                 45 pass  0 fail\nagent-sandboxes.test.ts                       28 pass  0 fail\n```\n\n`bunx @biomejs/biome check` on the file → clean. `bunx tsc --noEmit -p packages/cloud/shared/tsconfig.json` → no errors in the touched file.\n\n# Context\n\nFound while sweeping multi-clause guards for unpinned terms — the same shape as #30407 (opaque exchange-code gate) and #30410 (outbound standing threshold).\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1K7FDD56K012VE171HGK8FB\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T08:51:56.453Z\",\"completed_at\":\"2026-09-03T08:56:02.335Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T08:51:57.183Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"e81f1e95adacefd12628b47a9e195bc7a5e0e48c0aa65b3819c132fc1dcda94c\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"9ee0bdac-3c4c-4d44-a541-f8c43d9999d1\",\"object_id\":\"sha256:e81f1e95adacefd12628b47a9e195bc7a5e0e48c0aa65b3819c132fc1dcda94c\",\"sha256\":\"e81f1e95adacefd12628b47a9e195bc7a5e0e48c0a ain deployment gates; this PR does not claim those are complete.\n"])</script><script>self.__next_f.push([1,"6b:T153f,"])</script><script>self.__next_f.push([1,"Creating a local encrypted backup can take longer than the client's generic ten-second request timeout. On Bettina, a valid backup took 16.162 seconds, so the owner UI could report a timeout while the server continued creating the archive. POST /api/backups now uses a two-minute budget and receives the completed receipt without retrying the mutation.\n\nCloses #31366. Related #31180 and #30123.\n\nThe regression test uses the real ElizaClient and a local HTTP server that responds after eleven seconds; it verifies delivery of one receipt and propagation of a server failure without replay. The focused client suite passed 11 tests. The full UI suite passed 1,316 files and 14,227 tests, with seven skips. Root verification passed both before the rebase and on the prior head `f9f6be735bf7d94cb8648dc6a05df0beda87524a` (11,755 test files audited). The full UI suite ran on `fd57796253f3c9fd7a2f4f2aef2d0f5ac3a29320`; the rebase adds the merged family footer and voice clock changes without modifying this backup patch.\n\nThe branch now includes the merged all-day calendar editor on head `819ee9e331afee26d81d3f9f3d5309ba737ee65d`. Its real HTTP regression passed again (two tests). Root verification passed on this head (11,792 test files audited). The application audit passed all 226 browser checks; OCR reports zero regressions and all four affected settings captures are verified and manually reviewed. All five hosted checks passed on this exact head in run34930435647. The rebuilt head is serving on the isolated VPS acceptance service: desktop and mobile creation succeeded in 17.661 and 13.446 seconds respectively, with one POST each, visible receipts and two matching archives independently verified on disk. Mobile also verifies the disabled Create Backup button while pending.\n\nRisk: backup creation can now remain pending for up to two minutes. It remains one request; the client does not replay a failed creation.\n\n## Evidence\n\n\u003c!-- evidence-head:819ee9e331afee26d81d3f9f3d5309ba737ee65d --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n![Before desktop](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-before-desktop.jpg)\n![Before mobile](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-before-mobile.jpg)\n[desktop hover](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-before-desktop-hover.jpg), [mobile hover](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-before-mobile-hover.jpg).\n\u003c!-- evidence-row:after-screenshots --\u003e\n![After desktop](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-after-desktop.jpg)\n![After mobile](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-after-mobile.jpg)\n[Desktop hover](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-after-desktop-hover.jpg), [mobile hover](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-after-mobile-hover.jpg), [mobile pending state](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-mobile-pending.jpg).\n\u003c!-- evidence-row:walkthrough-video --\u003e\n[Desktop MP4](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-desktop-walkthrough.mp4), [mobile MP4](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-mobile-walkthrough.mp4). Each records one creation through its visible receipt.\n\u003c!-- evidence-row:backend-logs --\u003e\n[Independent API and archive readback](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-backend-readback.json) confirms both file sizes and independently computed archive hashes.\n\u003c!-- evidence-row:frontend-logs --\u003e\n[Console and network logs](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-frontend-logs.json), [startup resource probe](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-startup-resource-probe.json). Each run has one successful backup POST and no uncaught page errors. The probe identifies two optional `/build-info.json` 404s; background GET cancellations remain recorded.\n\u003c!-- evidence-row:llm-trajectory --\u003e\nN/A - client request-budget change; no model or prompt changes.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n[Backup response metadata and elapsed times](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-domain-receipts.json). The synthetic encrypted archives and encryption key remain private.\n\u003c!-- evidence-row:ocr-review --\u003e\n[Manual visual and OCR review](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-manual-review.json), [desktop OCR](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-desktop-ocr.txt), [mobile OCR](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-mobile-ocr.txt). OCR recognizes the success messages and size, with timestamp/hash recognition errors and a missed button label; manual images and DOM/API assertions verify the actual controls and receipts.\n\n[Final application audit on 819ee](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31377-backup-timeout-app-review-819ee.json) records the current capture hashes, computed verdicts and OCR results.\n\nSeparate restore acceptance discovered missing vault database directories after restart, tracked in #31396. That defect is outside this request-timeout change and is not represented as completed restore acceptance here.\n"])</script><script>self.__next_f.push([1,"6c:T5e3,"])</script><script>self.__next_f.push([1,"## Add `elizaos-plugin-aiworker` to the third-party registry\n\nOne entry file under `packages/registry/entries/third-party/` plus the regenerated `generated-registry.json`\n(`bun run validate` → 50 entries validated; `bun run generate`).\n\n**What the plugin is.** [aiworker](https://aiworker.duckdns.org) sells seventeen small data routes to agents, paid per\ncall in USDC over the x402 protocol (no account, no API key). The plugin builds one action per route from the live\nOpenAPI catalogue; each action pays its own call from the agent's wallet through `@x402/fetch`. Routes: DeFi yields and\nprotocol snapshots, page-to-Markdown, Base token safety cards and wallet checks, Polymarket resolution, odds, history,\nscreener and rule backtests, fact checks, sourced briefs, headline search.\n\n- npm: https://www.npmjs.com/package/elizaos-plugin-aiworker (`keywords` include `elizaos`)\n- source: https://github.com/ai-worker227/aiworker-examples/tree/main/elizaos (MIT; tests run on fakes, no network)\n- configuration: `AIWORKER_BUYER_KEY` (a Base wallet holding USDC), optional `AIWORKER_BASE_URL`, `AIWORKER_CHAIN`,\n  `AIWORKER_MAX_PRICE_USD` (default 0.05). Without a key the plugin stays empty and the agent still starts.\n- security notes: arguments come only from `options.args` or a JSON message, never from the runtime's options bag;\n  invalid arguments make no request (nothing paid); a non-2xx answer is returned, never thrown; the key is used\n  only to sign the x402 payment header and is never logged.\n"])</script><script>self.__next_f.push([1,"6d:Tb5d,"])</script><script>self.__next_f.push([1,"## Summary\nCloses #28547\n\nImproves error robustness in `logTypingFailure` and `logAckFailure` by replacing direct `String(error)` coercions with `formatError(error)`, and guards `formatCoords` against non-finite coordinate inputs in `packages/core/src/utils/channel-utils.ts`.\n\n## Problem \u0026 Motivation\nIn `packages/core/src/utils/channel-utils.ts`:\n1. `logTypingFailure` and `logAckFailure` used string interpolation `${String(params.error)}`. When handling null-prototype objects, poisoned `.toString` getters, or complex structured error records, `String()` can raise unexpected exceptions, compromising diagnostics and crashing channel cleanup loops.\n2. `formatCoords` called `.toFixed(6)` directly on latitude and longitude parameters without verifying `Number.isFinite`, producing `\"NaN, NaN\"` when invalid coordinates were supplied.\n\n## Changes\n- Imported `formatError` in `packages/core/src/utils/channel-utils.ts` and updated `logTypingFailure` and `logAckFailure` to use `formatError(params.error)`.\n- Updated `formatCoords` to sanitize non-finite numeric coordinates with `\"0.000000\"` fallback.\n- Added unit test cases in `packages/core/src/utils/channel-utils.test.ts` verifying safe typing/ack log formatting and non-finite coordinate handling.\n\n## Validation \u0026 Test Coverage\n- Executed `bun test packages/core/src/utils/channel-utils.test.ts` (22 passing tests).\n- Executed `bun run --cwd packages/core typecheck` (zero TypeScript errors).\n\n## Evidence\n\n\u003c!-- evidence-table --\u003e\n\n| Evidence | Source / link / artifact | Review notes |\n| --- | --- | --- |\n| before-screenshots | N/A - pure utility function | Channel utility robust logging |\n| after-screenshots | N/A - pure utility function | Channel utility robust logging |\n| walkthrough-video | N/A - pure utility function | No dynamic UI interaction involved |\n| backend-logs | N/A - pure utility function | Error formatting helper improvement |\n| frontend-logs | N/A - pure utility function | Verified via channel-utils unit tests |\n| llm-trajectory | N/A - pure utility function | No LLM interaction required |\n| domain-artifacts | N/A - pure utility function | No persistent tables modified |\n| ocr-review | N/A - pure utility function | Pure channel helper utility |\n\n\u003c!-- /evidence-table --\u003e\n\n\u003c!-- evidence-head:4f144db2ef8cc25da6eeca432902d4cff2c95493 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - pure utility function\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - without an owner:\n\n\u003e `migrate-database.diagnostic.test.ts` 0295 child path times out at its 60 s\n\u003e `spawnSync` cap — separate investigation, not reproduced here.\n\nThat phrasing is the symptom this PR addresses. Characterising the red run\nrequired a separate investigation *before it could even be attributed*, because\nof how the failure presents.\n\n## The failure is the least legible one this file can produce\n\nEach case spawns the real admin script under a 60 s cap. When `spawnSync` kills\na child on `timeout` it returns:\n\n```\nstatus: null\nsignal: \"SIGTERM\"\nerror : ETIMEDOUT spawnSync ... ETIMEDOUT\nstdout: \"\"      \u003c- buffers die with the child\nstderr: \"\"\n```\n\nEvery assertion in the file has the form `expect(result.status, output).toBe(1)`,\nso the run reports:\n\n```\nexpected null to be 1 -- output was: \"\"\n```\n\nThe custom message the author deliberately attached is **empty**, because it is\nbuilt from the dead child's buffers. The report names neither the timeout nor\nthe cap, and the blank output tail reads as *\"the script printed nothing\"*\nrather than *\"the script was killed\"* — which points an investigation at the\nmigration logic instead of at the clock.\n\n## What this changes\n\nOnly the classification. `runAdminScript` now detects a child that did not exit\non its own terms and fails with the three facts a CI log needs:\n\n```\nadmin script did not exit on its own: status=null signal=SIGTERM\nerror=Error: spawnSync ... ETIMEDOUT. The 60000ms spawnSync cap kills the child\nand discards its output, so stdout/stderr below are expected to be empty.\n```\n\nThis follows the existing repo idiom rather than inventing one —\n`packages/scripts/run-with-deadline.test.mjs:659` reports `status`, `signal` and\n`error` together in its failure message, and\n`packages/core/scripts/provider-latency-report.test.ts:43` asserts\n`result.error` is undefined.\n\n## What I deliberately did not change\n\n- **The cap stays at 60 s.** The file passes locally — 5 tests in 26.5 s, with\n  the `0295` case alone at ~25.6 s, nearly all of it the spawned child. So 60 s\n  is roughly **2.5x headroom**: thin for a loaded runner, which fits an\n  intermittent CI timeout. But the test is not wrong, and raising the number\n  silently would mask the ~25 s runtime rather than report it. Choosing a new\n  cap is a CI-budget decision that belongs to you, so I made it a named constant\n  and an injectable parameter — it is now a one-line change if you want it, and\n  I am happy to make it here.\n- **The other 27 files.** 46 test files spawn a child with a `timeout`; 18\n  reference `ETIMEDOUT` / `.signal` / `result.error`, and 28 do not, so a\n  timeout in any of them surfaces the same way. I scoped this to the one file\n  that is actually red rather than editing all of them. Happy to follow up if\n  you want the pattern applied more broadly.\n\n  (Worth flagging that my first pass at that count was wrong — a loose\n  `/\\.error\\b/` matched unrelated domain fields like `job.error` in\n  `managed-dedicated-canary-diagnostic.test.ts`. The numbers above come from a\n  tightened predicate, spot-checked against the files it claims.)\n- **The migration itself.** Nothing about what the child does, or how long it\n  takes, is touched.\n\n## Tests\n\nOne added. It drives the *same* code path with a cap the child cannot meet, so\nit exercises a real `SIGTERM` kill rather than a synthetic result object, and\ncompletes in ~200 ms instead of waiting out a 60 s timeout. It asserts the three\nfacts that `expect(status).toBe(1)` discards, plus the sentence explaining why\nthe printed output is blank — so an empty tail is never mistaken for silence\nfrom the script.\n\n**Ablation** — reverting the guard and re-running just that test:\n\n```\nExpected to contain: \"did not exit on its own\"\nReceived: \"expected the harness to reject a killed child\"\n```\n\nRestored: `6 pass, 0 fail` for the whole file. Biome clean.\n`tsc --noE ll;` | 10 passed |\n| `if (agent.execution_tier === \"shared\") return null;` | 10 passed |\n| `if (!dedicatedAgentId \u0026\u0026 sourceIsSharedAdapter) return null;` | 10 passed |\n\nExactly one guard, which is what makes it a pin rather than a coincidence. (The last two rows are the guards #30376 pins; this PR is deliberately disjoint from that one and touches a different case in the same file.)\n\n# One thing I checked and did not act on\n\n`hasDedicatedUrl` looks redundant with the shared-base guard — whenever it is false, the base derives from `agentId` + the resolved cloud base and is always shared-shaped, so the later guard would catch it anyway. It is not redundant: if `resolveDirectCloudAuthApiBase` returns an empty string the base is empty, `isDirectCloudSharedAgentBase(\"\")` is false, and `hasDedicatedUrl` is the only guard left. It stays reachable, and I did not fabricate that state just to pin it.\n\n# Test-only gate\n\n- **Realistic regression prevented:** reverting the shared-base guard lets the client \"switch\" the conversation onto the shared REST adapter, which hosts no dedicated runtime — user-visible as a dead post-handoff chat.\n- **Observing consumer:** `startCloudAgentHandoff` → `startCloudConversationHandoff`, whose `onSwitch` repoints the app at the returned base.\n- **Why existing coverage does not own it:** demonstrated by mutation above — the guard's deletion is invisible to every current test, because they are all stopped by `hasDedicatedUrl` first.\n\n# Verification\n\n- `packages/ui` `src/api/client-cloud-handoff-target.test.ts` → **10 passed** (was 9)\n- All 19 `packages/ui/src/api/client-cloud*.test.ts` files → **326 passed**, no failures — the new case does not disturb the sibling handoff suites\n- `biome check` clean on the touched file\n\nTest-only; no runtime source is touched. Follows from the guard sweep I posted in my review of #30376.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally repo \"elizaos/eliza\",\"createdAt\":\"2026-09-03T08:56:10Z\",\"mergedAt\":null,\"additions\":71,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABDiisUg\",\"title\":\"fix(local-inference): register opted-in Dedicated embeddings\",\"author\":\"NubsCarson\",\"number\":31371,\"body\":\"$6a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-15T02:13:03Z\",\"mergedAt\":null,\"additions\":69,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABDitYPQ\",\"title\":\"fix(ui): allow local backup creation to finish\",\"author\":\"lalalune\",\"number\":31377,\"body\":\"$6b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-15T02:46:54Z\",\"mergedAt\":\"2026-09-15T05:33:16Z\",\"additions\":68,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABDKH8Kw\",\"title\":\"registry: add elizaos-plugin-aiworker (paid x402 data routes as actions)\",\"author\":\"ai-worker227\",\"number\":31056,\"body\":\"$6c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-11T14:40:45Z\",\"mergedAt\":null,\"additions\":67,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABA8IaGA\",\"title\":\"fix(core): use formatError in channel logging and sanitize non-finite coords in channel-utils\",\"author\":\"deepanshu-yd\",\"number\":28550,\"body\":\"$6d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-25T13:10:34Z\",\"mergedAt\":null,\"additions\":66,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABBB1Niw\",\"title\":\"fix(plugin-web-search): use typed ElizaError for query and options validation\",\"author\":\"deepanshu-yd\",\"number\":28990,\"body\":\"$6e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-26T04:34:13Z\",\"mergedAt\":null,\"additions\":65,\"deletions\":26},{\"id\":\"PR_kwDOMT5cIs8AAAABBKX8cA\",\"title\":\"fix(core): ensure single-winner atomic consumption in requireConfirmation (#29429)\",\"author\":\"teddiesloco\",\"number\":29489,\"body\":\"## Summary\\n\\nFixes #29429.\\n\\nIn `packages/core/src/utils/confirmation.ts`, `requireConfirmation` read the pending confirmation record via `getCache` and subsequently called `deleteCache`. Under concurrent affirmative messages, multiple executions could both read the pending record before deletion, causing double execution of destructive actions.\\n\\n### Changes\\n- Checks the return value of `runtime.deleteCache(cacheKey)` so that only the first successful delete resolves as confirmed; subsequent concurrent callers observe an already-consumed state.\\n- Adds concurrency test ensuring only one caller receives `status: \\\"confirmed\\\"` under simultaneous affirmative responses.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-27T05:18:01Z\",\"mergedAt\":null,\"additions\":65,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABCOHcfA\",\"title\":\"test(cloud): name the timeout when the admin-migrate child is killed\",\"author\":\"attentionhead\",\"number\":30531,\"body\":\"$6f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-04T15:21:51Z\",\"mergedAt\":null,\"additions\":65,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABDjNBZA\",\"title\":\"feat(registry): add elizaos-plugin-x402-scraper v1.4.2 entry\",\"author\":\"ami-guru\",\"number\":31384,\"body\":\"$70\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-15T04:24:45Z\",\"mergedAt\":null,\"additions\":65,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABA7032A\",\"title\":\"fix(core): getActionResultActionName resolves action name from action and top-level fields\",\"author\":\"deepanshu-yd\",\"number\":28496,\"body\":\"$71\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-25T12:30:30Z\",\"mergedAt\":null,\"additions\":63,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABBeEi1g\",\"title\":\"feat(registry): add AI Power Grid plugin\",\"author\":\"halfaipg\",\"number\":29964,\"body\":\"$72\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-29T22:44:09Z\",\"mergedAt\":null,\"additions\":63,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABB_HZCw\",\"title\":\"test(ui): pin the shared-REST-base handoff guard\",\"author\":\"attentionhead\",\"number\":30377,\"body\":\"$73\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-03T01:37:50Z\",\"mergedAt\":null,\"additions\":62,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABDirT3w\",\"title\":\"feat(registry): register opticparse-eliza-plugin in community registry\",\"author\":\"parastejpal987-cmyk\",\"number\":31375,\"body\":\"$74\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-15T02:40:16Z\",\"mergedAt\":null,\"additions\":62,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABBM2gRw\",\"title\":\"fix(app-test): bound visibility and click timeouts for optional onboarding controls\",\"author\":\"mtcow\",\"number\":29573,\"body\":\"## Summary\\n`clickIfVisible` inherited the enclosing test's overall deadline for both its visibility wait and its click action. On canonical staging, a continuously detached/re-rendered Cloud runtime choice kept the protected browser trajectory busy until the 2,100-second budget exhausted before any Personal identity request (#29534).\\n\\n## Fix\\n- Bound the click action to an independent timeout (`min(caller visibility timeout, 5s)`).\\n- A control that re-renders mid-click is treated as **unavailable** (`false`), so the caller falls through to the next onboarding variant instead of inheriting the enclosing deadline.\\n- The visibility wait keeps its existing bounded timeout.\\n\\n## Acceptance\\n- [x] Bound both visibility and click/action time for optional onboarding controls.\\n- [x] A continuously unstable offered control is treated as a typed, fail-closed phase (falls through).\\n\\nCloses #29534.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-27T12:00:58Z\",\"mergedAt\":null,\"additions\":61,\"deletions\":2}],\"detailedContributorSummaries\":{}},\"summaryContent\":null,\"className\":\"self-end sm:self-start\"}]]}],\"$L75\",\"$L76\",\"$L77\"]}]}]\n"])</script><script>self.__next_f.push([1,"78:I[3642796,[\"/eliza-leaderboard/_next/static/chunks/872c789639e5504e.js\",\"/eliza-leaderboard/
