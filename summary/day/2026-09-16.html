mounted read, create, exact replay, changed-payload rejection, stale-revision rejection, durable receipt identity, and unchanged rendered state after rejected edits.\n"])</script><script>self.__next_f.push([1,"15:T469,The public `/pricing` page cannot scroll to its renewal disclosure and **Open billing** link on a 390×844 viewport when both subscription plans render. The application root constrains overflow, while `PricingPage` does not own a vertical scroll region. The lower content remains outside the viewport after real wheel input.\n\nReproduced with the actual built renderer at `db15e8b5f2b93d266e803ffd4bc20115f7314641` and controlled HTTP catalog responses for both v1 plans. Desktop is readable. The mobile browser regression fails `Open billing` viewport reachability after scrolling, with the lower content clipped in the captured frame. No checkout or provider operation was performed.\n\nExpected: mobile visitors can scroll through both plans, read the renewal and purchased-credit disclosure, and reach the billing link. Preserve the existing desktop layout and pricing behavior.\n\nScope: give the existing pricing page its own scroll region and add a real browser reachability regression. Before/after screenshots, the original failing trace, and final source-bound validation will be linked from the combined billing repair PR.\n16:T666,"])</script><script>self.__next_f.push([1,"## Changes\nIntegrate the current application and runtime work with develop, including the nubsDONTDELETEpls planner/browser changes and subscription billing work. Restore dedicated hosting to $0.01/hour and provide $30/month Plus and $100/month Pro subscription checkout with atomic payment activation, replay handling, and allowance accounting.\n\nThe branch includes previously preserved app, runtime, provider, and developer-context work. Production billing activation and deployment remain separate: the production webhook and requested account subscription have not been enabled.\n\n## Validation\n- Merged latest origin/develop without conflicts.\n- bun install passed.\n- bun run verify passed on 0675c4f244c6d05861d0f15c39e69351f9632d8f.\n- 80 focused auth, subscription, credit concurrency, and settlement migration tests passed.\n- Prior integration checks passed: planner/browser 321 tests, UI client 22 tests, shared reply formatting 15 tests, and real-server WebSocket tests.\n- No frontend rendering change in the latest develop merge; prior subscription UI audit passed 226 checks. Production checkout end-to-end remains unverified pending test credentials and webhook setup.\n\nRelated: #31478.\n\nUse squash merge to satisfy develop linear-history requirements.\n\n## CI follow-up\nNormalized the preserved research CSV to LF, proving parsed rows unchanged. Added exact-line, exact-file secret-scan exceptions for two controlled Stripe fixture sentinels and the native credential-store prose false positive. The full branch diff whitespace check and historical secret scan now pass locally; hosted checks are running on the updated head.\n"])</script><script>self.__next_f.push([1,"17:T2949,"])</script><script>self.__next_f.push([1,"Develop Full exposed SQL size-boundary failures, stale deterministic action fixtures, and shared UI accessibility failures. This repair preserves complete declared SQL source content, validates simulated model decisions against real request/tool receipts, isolates simulated scenarios from native iMessage loading, and repairs contrast and responsive controls. Addresses #30839; native isolation is tracked in #29067. The merged workflow consolidation owns CI wiring; this PR changes no workflows.\n\n\u003c!-- evidence-head:a1ccc85ea8e1c725048a29aaee51458fce159c2d --\u003e\n\n## Changes\n\n- Preserve complete memory and attachment source fields above 1 MiB while retaining metadata, structure, accessor, depth/node and NUL safeguards. Preserve the existing 32 MiB document-fragment budget on create/update, including stored-row type enforcement.\n- Correlate deterministic evaluator responses with the original request, action arguments and actual tool receipt. Keep durable TODO persistence, privilege denials and strict grounding assertions. OpenAI transport tests check the complete native schema or fallback prompt contract without dropping original turn context.\n- Disable native iMessage before lazy loading in simulated scenarios while preserving explicitly registered synthetic services. Require observed browser content separately from navigation completion.\n- Repair shared UI contrast, orange hover states, billing layout, account counts and mobile social-card wrapping. Require the actual Relationships view root in its route probe, incorporating #31564.\n\n## Validation and revision scope\n\nFinal candidate `a1ccc85ea8e1c725048a29aaee51458fce159c2d` is based on develop `13cc36d4acbe0f29f426cd9e6e69aeb262abe818`. Normal `bun install` passed without skipping native setup. Final `bun run verify` passed all 373 tasks and repository audits. The final isolated deterministic run passed all 42 scenarios with zero failures or skips. Bun's post-summary directory-mismatch diagnostic is retained in the successful log.\n\nThe previous candidate `126a4e464d289fb3e38fc09af72b0d72283bc02f` passed all 373 repository tasks/audits and all 42 simulated scenarios. All 97 PR-owned file blobs are identical after the final rebase; only the separately merged Google/Discord files changed. [Final source continuity](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-final-source-continuity.json) distinguishes this evidence from final-head checks.\n\nUnchanged affected source also passed OpenAI 611 tests/43 files, Workerd 7 integration tests with one explicitly gated live-search skip, default SQL 235 tests with three Electric skips, and focused real SQL storage checks 112 tests with one PostgreSQL-only skip. Initial stale-core document-sharing failures and the successful canonical rebuild/retest are retained. ttps://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-a1ccc85e-inherited-provider-scenario-receipt.json) are retained.\n\nThe first generic transcript hover probe timed out because it omitted the deliberate reveal interaction, in both original and repaired builds. Those failures remain in the reports; separate real pointer/keyboard and touch sequences passed. Database's isolated story shows an unavailable backend, while the app-level database route has separate audit evidence. Simulated model fixtures, static UI stories and local native setup do not establish live-provider, packaged-device, deployment or latency acceptance.\n\n[Final installation receipt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-a1ccc85e-normal-install-receipt.json), [final repository log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-a1ccc85e-root.log), [final repository receipt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-a1ccc85e-root-receipt.json).\n\n[Original static provenance](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-before-static-verification.json). The [unabridged final scenario report](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-a1ccc85e-scenarios.json) is preserved in full; its linked outcome index carries the exact full-report SHA256 because the evidence checker limits document downloads to2MiB.\n\n## Evidence\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nOriginal hosted build `13b50880ebeb3b03c93e10faf76090373c3dbfe8`, with all 1,400 static file hashes verified: [desktop before](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-before-social-desktop.png), [mobile before](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-before-social-mobile.png), [all matched captures](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-before-responsive-captures.zip).\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n[Desktop after](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-social-desktop.png), [mobile after](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-social-mobile.png), [actual 320px billing](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-billing-320.png), [all component captures](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-responsive-captures.zip), [all app captures](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-app-captures.zip). Captured at 126a; unchanged renderer blobs are proven by final continuity above.\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\nComplete recorded hover/dismiss/reload interactions: [desktop MP4](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-social-controls-desktop.mp4), [mobile MP4](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-social-controls-mobile.mp4). Browser fixture interactions; no external account or billing operation is performed.\n\n\u003c!-- evidence-row:backend-logs --\u003e\n[Workerd persistence/privilege integration log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-workerd.log), [SQL integration log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-sql-default.log), [OpenAI loopback transport suite](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-openai.log). Per-run receipts record the actual tested revision; source continuity preserves their scope.\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n[Complete Storybook console/network log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-story-frontend-logs.json), [resource-error classification](https://github.com/elizaOS/eliza/releases/download/pr-evidence-13/31493-126a-story-log-classification Consolidates deterministic develop validation from 98 expanded jobs to 57 and removes seven redundant workflow wrappers (67 to 60 files). Required contracts retain explicit owners; actual runtime savings remain under measurement.\n\n# Sync with develop\n\nRebased onto `e2678ac60c`. Pinned Bun 1.3.14 / Node 24.15.0 install passed. Full root verify passed both before rebase and on this exact post-rebase head (exit 0).\n\n# Risks\n\nMedium: changes validation orchestration, dependency setup, shards and aggregate admission across the repository. The standalone secretless gateway, platform, database, release and deployment authority boundaries remain distinct. Aggregates reject failed, cancelled, skipped or missing mandatory results. Production effects are not dispatched by this validation exercise.\n\n# Background\n\nCanonical CI now owns server/client/plugin/script suites, root quality, the complete six-shard app inventory and unique migrated scenario/runtime contracts. UI fixtures share one owner. Story Gate uses four shards with the same complete catalog. Duplicate personal-assistant/agent integrations remain in the general E2E runner. Cloud source checks delegate to mandatory canonical verify only when called by Develop Full; standalone cloud validation retains them.\n\nDevelop Full removes 28 ineffective evidence-cache operations under its existing current-run-only policy. Exact-source evidence and successful completion remain prerequisites for the effect handoff. JS setup omits unneeded native/Python/protoc installation; existing native/manual consumers explicitly preserve prerequisites. Dependency caches restore only exact lock keys. Failure results are uploaded without inventing a successful manifest.\n\nType: CI performance and correctness improvements. No rendered UI, runtime prompts, product model behavior, credentials or production configuration changes.\n\n# Documentation changes needed?\n\nUpdated workflow ownership README and WORKFLOW_SIMPLIFICATION_PLAN.md with every workflow disposition, coverage mapping, baseline, implementation decisions and outstanding acceptance measurements.\n\n# Testing\n\nStart with the plan and `.github/workflows/develop-full.yml`, then canonical CI and the setup composite.\n\n- 153 focused workflow/script tests passed before the admission-only follow-up; that follow-up passed 16 parsed-condition cases and 7 dedicated-canary workflow tests. Exact admission-fixed head full verify passed; actionlint, 157 guide pairs and relative Markdown links pass. Real live-admission shell self-test passes; direct screenshot diagnostic 2 tests pass.\n- App partition enumeration: 962 project/test identities, complete union across six shards, zero overlaps/missing entries. This proves selection; hosted app shards separately passed on the earlier checkpoint.\n- Earlier full root `bun run verify`: exit 0. Final post-rebase root: exit 0.\n- Earlier [canonical run](https://github.com/elizaOS/eliza/actions/runs/35159462165) passed all six app shards, Android AAB, Windows security, desktop, frontend build, remote capabilities, accounts, walkthrough and real-local browser contracts. Other failures listed below prevent a full-green claim.\n- [Four-shard Story Gate](https://github.com/elizaOS/eliza/actions/runs/35159762211) passed and its aggregate was read: 1,689 stories, zero broken/accessibility failures. 78 stories record console errors; this is not console-clean evidence or a full develop result.\n- [Cloud run](https://github.com/elizaOS/eliza/actions/runs/35159764700) passed database integration, e2e and stack-e2e; unit and former gateway migration failures are recorded below.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:feb72b6ea3f674f37f281281090e1bacf28db47d --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - CI orchestration only; no rendered UI changes.\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - CI orchestration only; no rendered UI changes.\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - no changed interactive product flow.\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] N/A - no product backend behavior changes; actual workflow logs linked above.\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no changed frontend request or state path.\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no model, provider, prompt or action behavior changes.\n\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] N/A - no product domain state changes; workflow result artifacts and story report inspected from linked runs.\n\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual source changes.\n\n# Evidence Details\n\nWorkflow logs and generated reports are linked above. Local executable regression runs exercise failed/missing child-result admission, current-source evidence handling, real shell credential admission, shard completeness and planted formatting failures. UI screenshots/video, live LLM trajectories, audio and installed-device captures are N/A because this change only reorganizes their existing automation; it does not change those product surfaces.\n\n## Known gaps / failures\n\nEarlier checkpoints exposed two workflow regressions: operational YAML formatting affected a migration-boundary test, and removing the gateway wrapper violated a source-only authority test. Both are corrected with original formatting/boundary restored, and focused tests pass. App-core diagnostics were accidentally invoking the full chained package suite; the direct owning runner now executes the intended two tests. Device README wording was restored and checked.\n\nRemaining old-checkpoint failures have concurrent owners: browser incomplete-read assertion (#31544); goals source-leaf resolution and OpenAI fixture (#31470/#31493 repair lane); scenario/When2Speak fixtures (#31493); LIFE integration isolation (#31032); Workerd expected tool catalog (embedding repair plus #31537 prerequisites). No tests are suppressed for these failures. Current-develop hosted validation, cold/warm setup comparison and three comparable full-run timing samples remain outstanding. Seven-day baseline has no successful control; 98→57 is a structural reduction, not measured billed-minute savings.\n\n## CI availability record\n\n- PR head: feb72b6ea3f674f37f281281090e1bacf28db47d; validated base: `e2678ac60c`.\n- Run URLs and failures: above; older hosted checkpoints do not certify this exact head.\n- Exact-head focused commands exit 0; final post-rebase root gate exit 0.\n- Merge revision and method: not merged.\n- Remaining validation: exact-head hosted admission, develop full completion and performance measurement.\n\n## Admission correction review\n\nMoved remote-capability cloud/provider/validator jobs reject cleanup-only and diagnostic dispatches; generic smoke excludes the remote-capabilities suite. Sixteen executable cases evaluate the actual parsed conditions for permitted versus exclusive recovery modes. Dedicated canary workflow tests (7), formatting and actionlint pass. Full root verify on a433fe964a exited zero after pinned install. No live effects were dispatched to test admission.\n\n## Before/after command ownership\n\nComparison base `cfd144bf95`; implementation PR #31556. This maps automatic develop contracts, not hypothetical manual workflow invocations. Package manifests and selectors remain unchanged unless stated.\n\n| Old owner / command family | Current owner | Preservation / intentional difference |\n| --- | --- | --- |\n| CI + Test server/client/plugin suites | CI tests_server, tests_client, tests_plugins | Same lane runners and package filters; existing agent/remaining partition, four plugin shards, Node PGlite retained. Duplicate wrapper sweeps removed. |\n| CI + Test + Scenario full script sweep | CI tests | One complete discovered script inventory; no subset replacement. Root test-vacuity behavioral tests belong to this inventory. |\n| C f being deduplicated. Provider switches or runtime restarts could therefore run twice after a network retry, UI double-submit, or CLI retry.\n\nThe repository now removes an idempotency mapping only when the mapping still points to the operation being pruned. A filesystem-backed regression locks that ownership rule.\n\n# Relates to\n\nNo issue exists for this reproduced defect; this pull request is the complete defect report and fix.\n\n# Sync with develop\n\n- [x] Rebased onto `origin/develop` commit `3654ba0cff4928f1a72aa5c2c89c06898755255d` with zero conflicts.\n- [x] `bun run verify` was run post-sync. Its unrelated missing-dependency blocker is recorded below.\n\n# Risks\n\nLow. The production change only guards deletion of an in-memory key-to-operation mapping. A mapping that still points to the pruned operation is deleted exactly as before; a mapping rebound to a different operation is preserved.\n\n# Background\n\n## What does this PR do?\n\n`byIdempotencyKey` is a key-to-operation-ID map. When a key is reused after its 24-hour dedupe window, `create()` correctly rebinds it to the new operation. The old record still retains the same key. `pruneTerminal()` previously deleted the key unconditionally while evicting that old record, corrupting the newer binding.\n\nThe fix compares the indexed operation ID with the ID being pruned before deleting the mapping.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNo documentation change is needed; this restores the documented idempotency behavior.\n\n# Testing\n\n## Before: reproduced duplicate execution\n\nCommand:\n\n```text\nbun run \u003cprovided-reproduction\u003e/repro-idem2.ts\n```\n\nObserved output before the change:\n\n```text\n Info       [runtime-ops] Accepted op ed8a0191-86e1-4b41-8753-4b52e042fb9c kind=provider-switch tier=hot\n Info       [runtime-ops] Operation ed8a0191-86e1-4b41-8753-4b52e042fb9c succeeded\nfirst  : accepted ed8a0191-86e1-4b41-8753-4b52e042fb9c applies= 1\npruned : 1\nold gone: true\n Info       [runtime-ops] Accepted op d49be3f8-4af3-44b2-912f-2036cd7bbaf3 kind=provider-switch tier=hot\n Info       [runtime-ops] Operation d49be3f8-4af3-44b2-912f-2036cd7bbaf3 succeeded\nretry  : accepted d49be3f8-4af3-44b2-912f-2036cd7bbaf3 applies= 2\n```\n\n## After: retry deduplicates to the current operation\n\nThe supplied script hard-codes the shared checkout imports, so for isolated-worktree verification its two import paths were rewritten to the worktree through stdin; the reproduction logic was unchanged.\n\n```text\n Info       [runtime-ops] Accepted op 66517079-d646-47ee-8f08-c2e34c5d70c6 kind=provider-switch tier=hot\n Info       [runtime-ops] Operation 66517079-d646-47ee-8f08-c2e34c5d70c6 succeeded\nfirst  : accepted 66517079-d646-47ee-8f08-c2e34c5d70c6 applies= 1\npruned : 1\nold gone: true\n Info       [runtime-ops] Idempotent hit for key=cli-switch-openai → 66517079-d646-47ee-8f08-c2e34c5d70c6\nretry  : deduped 66517079-d646-47ee-8f08-c2e34c5d70c6 applies= 1\n```\n\n## Regression sensitivity: production guard reverted, test kept\n\nCommand:\n\n```text\nbunx vitest run --maxWorkers=2 packages/agent/test/runtime/operations/repository-idempotency.test.ts\n```\n\nObserved output with only the production change reverted:\n\n```text\n ❯ packages/agent/test/runtime/operations/repository-idempotency.test.ts (1 test | 1 failed) 7ms\n     × pruning an old operation preserves the current operation's reused key 6ms\n\nAssertionError: expected null to deeply equal { id: 'current-operation', …(8) }\n\n Test Files  1 failed (1)\n      Tests  1 failed (1)\n```\n\nAfter restoring the production guard:\n\n```text\n Test Files  1 passed (1)\n      Tests  1 passed (1)\n```\n\n## Owning-package suite and untouched control\n\nCommand, with the required worker cap:\n\n```text\nbunx vitest run --maxWorkers=2 --config packages/agent/vitest.config.ts\n```\n\nExact branch head:\n\n```text\n Test Files  19 failed | 727 passed | 3 skipped (749)\n      Tests  20 failed | 9958 passed | 58 skipped (10036)\n```\n\nUntouched `origin/develop` control:\n\n```text\n Test Files  19 failed | 726 passed | 3 skipped (748)\n      Tests  20 failed | 9957 passed | 58 skipped (10035)\n```\n\nThe branch has exactly one additional passing file/test. The same 19 files and 20 tests fail in both runs.\n\n## Formatting and typecheck\n\n```text\n$ bunx biome check --write packages/agent/src/runtime/operations/repository.ts packages/agent/test/runtime/operations/repository-idempotency.test.ts\nChecked 2 files in 68ms. No fixes applied.\n```\n\n`bunx tsc --noEmit -p packages/agent/tsconfig.json` reports the same four errors on the branch and untouched control: missing `@elizaos/plugin-notes/plugin`, `@elizaos/plugin-todos/edge`, `@radix-ui/react-radio-group`, and `minimatch`.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:ac451a1cb1008649755d745ea86495643b4e80ad --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before full-page screenshots: N/A - repository-only runtime state change with no rendered UI.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] After full-page screenshots: N/A - repository-only runtime state change with no rendered UI.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] Walkthrough video: N/A - no rendered or interactive UI changed.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs: inline before/after runtime-operation logs above show acceptance, pruning, and deduplication end to end.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] Frontend logs: N/A - no frontend request, response, or state changed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] Real-LLM trajectory: N/A - no model, prompt, provider, action, evaluator, or agent-loop behavior changed.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Domain artifacts: inline reproduction shows the old filesystem record removed while the current operation ID remains b y`: terminal pass on the stated head with pinned runtimes.\n- Hosted checks and a real post-merge Dev Smoke run remain pending.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:35a449475599febd9b12c9c6eb7c94eabba672df --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - workflow environment and deterministic test only; no rendered UI change.\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - workflow environment and deterministic test only; no rendered UI change.\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - no UI or interactive behavior is changed.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [31517-provider-regression.txt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31517-provider-regression.txt)\n\u003c!-- evidence-row:frontend-logs --\u003e\nN/A - no frontend code changed; live browser smoke acceptance remains pending.\n\u003c!-- evidence-row:llm-trajectory --\u003e\nN/A - deterministic configuration proof makes no model calls. This PR does not claim a live inference or latency pass.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [31517-workflow-validation.txt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-12/31517-workflow-validation.txt)\n\u003c!-- evidence-row:ocr-review --\u003e\nN/A - no rendered UI change.\n\n# Known gaps / failures\n\nA real CI Dev Smoke run is required after merge to confirm the selected provider's credentials and service are usable. Cerebras-specific latency certification remains separate. Native compilation was not exercised.\n\n"])</script><script>self.__next_f.push([1,"2e:Tffb,"])</script><script>self.__next_f.push([1,"Bumps [@node-rs/argon2](https://github.com/napi-rs/node-rs) from 2.1.0 to 2.2.1.\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/napi-rs/node-rs/commit/56c64a1f875d9568b0a6a79b6c658ce5996d25a2\"\u003e\u003ccode\u003e56c64a1\u003c/code\u003e\u003c iewed source unchanged. Hosted checks remain required before merge.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:a7644fce3d586d27c5ffb21369799a2e45c6a768 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - existing deterministic test repair; production runtime and UI source unchanged.\n\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - existing deterministic test repair; production runtime and UI source unchanged.\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - existing deterministic test repair; production runtime and UI source unchanged.\n\n\u003c!-- evidence-row:backend-logs --\u003e\n[Package validation, prerequisite failure/recovery, installation, and full repository verification](https://github.com/elizaOS/eliza/releases/download/pr-evidence-3/31555-eliza-31544-validation.txt)\n\n\u003c!-- evidence-row:frontend-logs --\u003e\nN/A - existing deterministic test repair; production runtime and UI source unchanged.\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\nN/A - existing deterministic test repair; production runtime and UI source unchanged.\n\n\u003c!-- evidence-row:domain-artifacts --\u003e\nN/A - existing deterministic test repair; production runtime and UI source unchanged.\n\n\u003c!-- evidence-row:ocr-review --\u003e\nN/A - existing deterministic test repair; production runtime and UI source unchanged.\n"])</script><script>self.__next_f.push([1,"30:T44b,Closes #31302\n\n## What broke\n\n`apps-builtin-pages-interactions.spec.ts:119` (`learning a skill opens an editable conversation draft`, added in `61446bb82c9b`) ends with `toHaveCount(1)` on the fixture replies in the thread. The keyless stub keeps `stubConversationMessages` as a module-level `Map` for the whole run, so replies from earlier specs in the same worker are still in the thread; `Smoke (1)` sees `Expected: 1 / Received: 4`, while the spec passes alone.\n\n## Change\n\nThe spec records the fixture-reply count before the send and expects exactly one more afterwards, the way it already treats `sentMessages`. One spec file.\n\n## Evidence (develop `61446bb82c9b`, chromium, local ui-smoke stack, `--repeat-each=2 --workers=1` so the second pass runs against a thread the first already filled)\n\n- Develop's assertion: pass 1 ✓, pass 2 ✘ `Expected: 1 / Received: 2` (the CI failure shape).\n- With this change: both passes ✓ (see comment below for the run output).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01JwaJQUMKt9LhWLhxDwVCAB\n31:T4d4,Closes #31298\n\n## What broke\n\n`61446bb82c9b` (#31269) made `/rolodex` a legacy path of Relationships (`rolodex: { aliasOf: \"relationships\" }`, `legacyPaths: [\"/rolodex\"]` in `builtin-route-descriptors.ts`, and `view-routes.ts` already probes `/apps/relationships`). `all-pages-clicksafe.spec.ts` still expected the URL to end in `/rolodex` and waited for an unavailable-state ready check, so `Zero-Key app browser all-pages` and `Smoke (1)` fail on every develop run since (`Expected pattern: /\\/rolodex$/`, `Received: …/apps/relationships`).\n\n## Change\n\nThe `rolodex` probe now carries `expectedUrl: /\\/apps\\/relationships$/` and a rendered-main ready check; the retained deep link is a redirect, not an unavailable state. One spec file.\n\n## Evidence (develop `61446bb82c9b`, chromium, local ui-smoke stack)\n\n- Baseline on develop: `desktop rolodex` ✘, `mobile rolodex` ✘ with the URL mismatch above (log `uismoke-baseline-0914.log`).\n- With this change: both ✓ (3.3 s / 2.8 s), in a run that also covered the sibling repairs #31299, #31300 and the whole `apps-builtin-pages-interactions` file (12/12).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01JwaJQUMKt9LhWLhxDwVCAB\n32:T1c40,"])</script><script>self.__next_f.push([1,"Bumps [@json-render/core](https://github.com/vercel-labs/json-render/tree/HEAD/packages/core) from 0.19.0 to 0.20.0.\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vercel-labs/json-render/blob/main/CHANGELOG.md\"\u003e@​json-render/core's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e0.20.0\u003c/h2\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003ch3\u003eNew Features\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNamed slots for React:\u003c/strong\u003e Components can declare named slots such as \u003ccode\u003eheader\u003c/code\u003e and \u003ccode\u003efooter\u003c/code\u003e, while \u003ccode\u003echildren\u003c/code\u003e remains the default slot. Slots are preserved through validation, streaming, nested conversion, code export, playground views, and Devtools navigation (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/320\"\u003e#320\u003c/a\u003e). Built from the original contribution by \u003ca href=\"https://github.com/wotnak\"\u003e\u003ccode\u003e@​wotnak\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/105\"\u003e#105\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNested repeats:\u003c/strong\u003e \u003ccode\u003erepeat.statePath\u003c/code\u003e now accepts item-relative paths such as \u003ccode\u003e{ \u0026quot;$item\u0026quot;: \u0026quot;employees\u0026quot; }\u003c/code\u003e, enabling nested data rendering across React, React Native, React Email, React PDF, Image, Ink, Solid, Svelte, and Vue (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/319\"\u003e#319\u003c/a\u003e). Built from the original contribution by \u003ca href=\"https://github.com/tmchow\"\u003e\u003ccode\u003e@​tmchow\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/256\"\u003e#256\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHarness chat example:\u003c/strong\u003e Added a complete Next.js example using the AI SDK 7 harness adapter, agent delegation, sandbox transport, and json-render components (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/302\"\u003e#302\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eChained action params:\u003c/strong\u003e Named \u003ccode\u003eonSuccess\u003c/code\u003e and \u003ccode\u003eonError\u003c/code\u003e actions now receive their configured \u003ccode\u003eparams\u003c/code\u003e across core and all renderer bridges (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/307\"\u003e#307\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConsistent optional visibility:\u003c/strong\u003e Element \u003ccode\u003evisible\u003c/code\u003e fields now remain optional across Zod 4 versions, while prompts explicitly require \u003ccode\u003echildren\u003c/code\u003e arrays for every element (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/299\"\u003e#299\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSpec validation and autofix:\u003c/strong\u003e Dangling child references are pruned, malformed visibility conditions are reported, and repeated items can be filtered safely (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/300\"\u003e#300\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eImprovements\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRelease toolchain hardening:\u003c/strong\u003e The workspace now requires Node.js 24 and pnpm 11, enforces package engine checks, and applies a minimum package release age (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/293\"\u003e#293\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eBreaking Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCustom renderer bridges that implement the core \u003ccode\u003eexecuteAction\u003c/code\u003e callback must now accept an \u003ccode\u003eActionBinding\u003c/code\u003e instead of a bare action name. This exposes chained action params to custom integrations at compile time (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/307\"\u003e#307\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eContributors\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ctate\"\u003e\u003ccode\u003e@​ctate\u003c/code\u003e\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/Railly\"\u003e\u003ccode\u003e@​Railly\u003c/code\u003e\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tmchow\"\u003e\u003ccode\u003e@​tmchow\u003c/code\u003e\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/wotnak\"\u003e\u003ccode\u003e@​wotnak\u003c/code\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vercel-labs/json-render/commit/ea4b361b9ff23bcab20286c4f559a5316f0e892b\"\u003e\u003ccode\u003eea4b361\u003c/code\u003e\u003c/a\u003e chore(release): prepare v0.20.0 (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/321\"\u003e#321\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vercel-labs/json-render/commit/0f6798b1937bf8f4371fc38a83de95dbf7c6a0fd\"\u003e\u003ccode\u003e0f6798b\u003c/code\u003e\u003c/a\u003e feat(react): support named slots (\u003ca href=\"https://github.com/vercel-labs/json-render/tree/HEAD/packages/core/issues/320\"\u003e#320\u003c/a\u003e)\u003c/li\u003e\ 7,"])</script><script>self.__next_f.push([1,"Bumps [coding-agent-adapters](https://github.com/HaruHunab1320/coding-agent-adapters) from 0.16.3 to 0.17.0.\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/HaruHunab1320/coding-agent-adapters/blob/main/CHANGELOG.md\"\u003ecoding-agent-adapters's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e[0.17.0] - 2026-06-16\u003c/h2\u003e\n\u003ch3\u003eAdded\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003eOpencodeAdapter\u003c/code\u003e\u003c/strong\u003e — first-class adapter for \u003ca href=\"https://opencode.ai\"\u003eOpenCode\u003c/a\u003e, a provider-agnostic coding agent that speaks OpenAI's chat-completions protocol against any compatible endpoint (Anthropic, OpenAI, Cerebras, OpenRouter, Groq, Together, DeepSeek, Ollama, vLLM, plus native Anthropic). \u003ccode\u003eadapterType = 'opencode'\u003c/code\u003e, \u003ccode\u003edisplayName = 'OpenCode'\u003c/code\u003e, \u003ccode\u003ememoryFilePath = 'AGENTS.md'\u003c/code\u003e. Implements \u003ccode\u003edetectLogin\u003c/code\u003e, \u003ccode\u003edetectBlockingPrompt\u003c/code\u003e, \u003ccode\u003edetectLoading\u003c/code\u003e, \u003ccode\u003edetectTaskComplete\u003c/code\u003e, \u003ccode\u003edetectReady\u003c/code\u003e, \u003ccode\u003eparseOutput\u003c/code\u003e, \u003ccode\u003egetPromptPattern\u003c/code\u003e, \u003ccode\u003egetHealthCheckCommand\u003c/code\u003e against opencode 1.14.x TUI output patterns. Non-interactive runs use \u003ccode\u003eopencode run --dangerously-skip-permissions \u0026lt;task\u0026gt;\u003c/code\u003e with the task as a positional arg (from \u003ccode\u003econfig.adapterConfig.initialPrompt\u003c/code\u003e); interactive runs launch the TUI. Recommended model picks claude-opus-4-7 when an Anthropic key is present, gpt-4o otherwise. Thanks \u003ca href=\"https://github.com/RemilioNubilio\"\u003e\u003ccode\u003e@​RemilioNubilio\u003c/code\u003e\u003c/a\u003e (\u003ca href=\"https://redirect.github.com/HaruHunab1320/coding-agent-adapters/issues/3\"\u003e#3\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e'opencode'\u003c/code\u003e added to \u003ccode\u003eAdapterType\u003c/code\u003e union and \u003ccode\u003eADAPTER_TYPES\u003c/code\u003e registry; \u003ccode\u003ecreateAllAdapters()\u003c/code\u003e now returns 6 adapters.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egenerateOpencodeApprovalConfig(preset)\u003c/code\u003e — only \u003ccode\u003eautonomous\u003c/code\u003e adds \u003ccode\u003e--dangerously-skip-permissions\u003c/code\u003e; other presets stay interactive.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eBASELINE_PATTERNS\u003c/code\u003e entry for opencode in \u003ccode\u003epattern-loader.ts\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e24 shape tests for \u003ccode\u003eOpencodeAdapter\u003c/code\u003e covering properties, command/args/env, login detection, blocking prompts, state detection, health check.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eChanged\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eClaude \u003ccode\u003eautonomous\u003c/code\u003e preset no longer emits \u003ccode\u003e--tools \u0026lt;list\u0026gt;\u003c/code\u003e.\u003c/strong\u003e The hardcoded \u003ccode\u003eCLAUDE_TOOL_CATEGORIES\u003c/code\u003e list reflected Claude Code's dev-tier tool registry (\u003ccode\u003eBash\u003c/code\u003e, \u003ccode\u003eEdit\u003c/code\u003e, \u003ccode\u003eWrite\u003c/code\u003e, \u003ccode\u003eTask\u003c/code\u003e, \u003ccode\u003eSkill\u003c/code\u003e, …). On the claude.ai OAuth subscription tier the registry differs (\u003ccode\u003eMonitor\u003c/code\u003e, \u003ccode\u003eScheduleWakeup\u003c/code\u003e, \u003ccode\u003eToolSearch\u003c/code\u003e, \u003ccode\u003eEnterPlanMode\u003c/code\u003e, \u003ccode\u003eCron*\u003c/code\u003e, …), so passing the dev-tier list via \u003ccode\u003e--tools\u003c/code\u003e filtered subscription-tier agents down to a tiny read-only subset (\u003ccode\u003eRead\u003c/code\u003e, \u003ccode\u003eGrep\u003c/code\u003e, \u003ccode\u003eGlob\u003c/code\u003e, \u003ccode\u003eAskUserQuestion\u003c/code\u003e, \u003ccode\u003eTodoWrite\u003c/code\u003e) — the opposite of what \u0026quot;autonomous\u0026quot; means. With \u003ccode\u003e--dangerously-skip-permissions\u003c/code\u003e already set on the autonomous preset, the explicit allowlist was redundant; dropping it makes the preset tier-agnostic. Thanks \u003ca href=\"https://github.com/RemilioNubilio\"\u003e\u003ccode\u003e@​RemilioNubilio\u003c/code\u003e\u003c/a\u003e (\u003ca href=\"https://redirect.github.com/HaruHunab1320/coding-agent-adapters/issues/1\"\u003e#1\u003c/a\u003e). \u003cstrong\u003eBehavior change for callers that inspected \u003ccode\u003ecliFlags\u003c/code\u003e for \u003ccode\u003e--tools\u003c/code\u003e\u003c/strong\u003e — that flag is no longer emitted on the autonomous preset.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e[0.16.4] - 2026-05-26\u003c/h2\u003e\n\u003ch3\u003eChanged\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eRepository extracted from the parallax monorepo into its own standalone repo at \u003ccode\u003egithub.com/HaruHunab1320/coding-agent-adapters\u003c/code\u003e. Package metadata (\u003ccode\u003erepository\u003c/code\u003e, \u003ccode\u003ehomepage\u003c/code\u003e, \u003ccode\u003ebugs\u003c/code\u003e) updated accordingly. No source code changes.\u003c/li\u003e\n\u003cli\u003eRemoved the (optional, workspace-only) \u003ccode\u003eagent-adapter-monitor\u003c/code\u003e peer dependency. The helper was never published to npm and the import inside \u003ccode\u003epattern-loader.ts\u003c/code\u003e is gated by an optional dynamic require, so callers that did not install it are unaffected.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\ ```\n\ninstead of `bun run --cwd packages/app-core test -- test/app/screenshot-quality.test.ts`, matching the neighbouring app step.\n\n## Why\n\nThe app-core `test` script is a `\u0026\u0026` chain, so Bun appends the file path to its last command (`bun run test:script-suites test/app/screenshot-quality.test.ts`) and vitest runs the whole suite. That suite now includes `steward-sidecar-login.test.ts`, which needs the `@elizaos/login` workspace the diagnostics job never builds, so `tests / Zero-Key diagnostics` fails on a test the step was never meant to run (latest: [run 34723784763](https://github.com/elizaOS/eliza/actions/runs/34723784763/job/103635168222): `1 failed | 365 passed`). Workflow-only change.\n\n## Evidence\n\nExpansion of the old invocation (first line Bun prints, locally on develop `1fa9dbf22d74`):\n\n```\n$ node ../scripts/run-vitest.mjs run --config vitest.config.ts \u0026\u0026 bun run test:script-suites test/app/screenshot-quality.test.ts\n RUN  v4.1.10 …/packages/app-core\n```\n\nNew invocation from the repository root:\n\n```\n Test Files  1 passed (1)\n      Tests  2 passed (2)\n   Duration  724ms\n```\n\nThe workflow still parses (PyYAML load; the step's `run` reads as above).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01Gpg1SzympM3Yf5LQvzktqk\n"])</script><script>self.__next_f.push([1,"38:T1db4,"])</script><script>self.__next_f.push([1,"Bumps [isomorphic-git](https://github.com/isomorphic-git/isomorphic-git) from 1.41.4 to 1.42.2.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/isomorphic-git/isomorphic-git/releases\"\u003eisomorphic-git's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev1.42.2\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/isomorphic-git/isomorphic-git/compare/v1.42.1...v1.42.2\"\u003e1.42.2\u003c/a\u003e ( eleases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.37.9\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.4\"\u003e2.26.4\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4106\"\u003e#4106\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev4.37.8\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/github/codeql-action/blob/main/CHANGELOG.md\"\u003egithub/codeql-action/init's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003eCodeQL Action Changelog\u003c/h1\u003e\n\u003cp\u003eSee the \u003ca href=\"https://github.com/github/codeql-action/releases\"\u003ereleases page\u003c/a\u003e for the relevant changes to the CodeQL CLI and language packs.\u003c/p\u003e\n\u003ch2\u003e[UNRELEASED]\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.9 - 26 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.4\"\u003e2.26.4\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4106\"\u003e#4106\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.8 - 21 Aug 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.7 - 13 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.3\"\u003e2.26.3\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4085\"\u003e#4085\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.6 - 04 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eChanged the default filepath for the new remote file address format that was introduced in CodeQL Action 4.37.0 / 3.37.0 to \u003ccode\u003e.github/codeql-config.yml\u003c/code\u003e to align it with the suggested path that is used elsewhere. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4070\"\u003e#4070\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.5 - 03 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed a bug where a network error while streaming the download of the CodeQL bundle could terminate the \u003ccode\u003einit\u003c/code\u003e Action instead of falling back to downloading the bundle before extracting it. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4061\"\u003e#4061\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.4 - 29 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThis version of the CodeQL Action adds support for the \u003ccode\u003etools\u003c/code\u003e input for the \u003ccode\u003ecodeql-action/init\u003c/code\u003e step to be specified using a \u003ccode\u003egithub-codeql-tools\u003c/code\u003e \u003ca href=\"https://docs.github.com/en/organizations/managing-organization-settings/managing-custom-properties-for-repositories-in-your-organization\"\u003erepository property\u003c/a\u003e. This feature will gradually be rolled out following the release of this version. Once rolled out, this allows for the CodeQL CLI version that is used in GitHub-managed workflows, such as Default Setup, to be set to a custom value. For example, customers who run into issues with rate limits when a new CodeQL CLI version is released can set the value to \u003ccode\u003etoolcache\u003c/code\u003e to always use the CodeQL CLI version that is available in the runner toolcache. For Advanced Setup workflows, the value provided for \u003ccode\u003etools\u003c/code\u003e in the workflow definition always takes precedence unless the value of the repository property starts with \u003ccode\u003e!\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4037\"\u003e#4037\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.2\"\u003e2.26.2\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4051\"\u003e#4051\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.3 - 22 Jul 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.2 - 21 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe new address format for the \u003ccode\u003econfig-file\u003c/code\u003e input that was introduced in CodeQL Action 4.37.0 is now enabled by default. In addition to the format described there, the \u003ccode\u003eremote=\u003c/code\u003e prefix can now be used to explicitly indicate that the input refers to a remote file. All previous input formats continue to be accepted as well. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4023\"\u003e#4023\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe CodeQL Action can now make use of \u003ca href=\"https://docs.github.com/en/code-security/how-tos/secure-at-scale/configure-organization-security/manage-usage-and-access/giving-org-access-private-registries\"\u003econfigured private registries\u003c/a\u003e in Default Setup to retrieve CodeQL configuration files from remote repositories that require authentication. This will allow customers to store their CodeQL configuration in a single repository that can then be referenced by Default Setup workflows in other repositories. We expect to roll this and other, related changes out to everyone in July. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4007\"\u003e#4007\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.1 - 16 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cem\u003eUpcoming breaking change\u003c/em\u003e: Add a deprecation warning for customers using CodeQL version 2.20.6 and earlier. These versions of CodeQL were discontinued on 1 July 2026 alongside GitHub Enterprise Server 3.16, and will be unsupported by the next minor release of the CodeQL Action. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/3956\"\u003e#3956\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.1\"\u003e2.26.1\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4019\"\u003e#4019\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.0 - 08 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.0\"\u003e2.26.0\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/3995\"\u003e#3995\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/cdf488f595d80d6e07e03d4674febd5ab45fa938\"\u003e\u003ccode\u003ecdf488f\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/github/codeql-action/issues/4107\"\u003e#4107\u003c/a\u003e from github/update-v4.37.9-920ba7cd1\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/7243f38558d187dde99730d224bb47aa26a95306\"\u003e\u003ccode\u003e7243f38\u003c/code\u003e\u003c/a\u003e action/releases\"\u003egithub/codeql-action/init's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.38.0\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOn GitHub-hosted runners, the CodeQL Action now deletes unused CodeQL bundles from the toolcache before downloading a different bundle, which frees up disk space for the analysis. We expect to roll this change out to everyone in September. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4124\"\u003e#4124\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe CodeQL Action now supports CodeQL releases that are compatible with Linux Arm64 and downloads the native \u003ccode\u003elinux-arm64\u003c/code\u003e CodeQL bundle when available. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4072\"\u003e#4072\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.0\"\u003e2.27.0\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4129\"\u003e#4129\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev4.37.9\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.4\"\u003e2.26.4\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4106\"\u003e#4106\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev4.37.8\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/github/codeql-action/blob/main/CHANGELOG.md\"\u003egithub/codeql-action/init's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003eCodeQL Action Changelog\u003c/h1\u003e\n\u003cp\u003eSee the \u003ca href=\"https://github.com/github/codeql-action/releases\"\u003ereleases page\u003c/a\u003e for the relevant changes to the CodeQL CLI and language packs.\u003c/p\u003e\n\u003ch2\u003e[UNRELEASED]\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.38.0 - 09 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOn GitHub-hosted runners, the CodeQL Action now deletes unused CodeQL bundles from the toolcache before downloading a different bundle, which frees up disk space for the analysis. We expect to roll this change out to everyone in September. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4124\"\u003e#4124\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe CodeQL Action now supports CodeQL releases that are compatible with Linux Arm64 and downloads the native \u003ccode\u003elinux-arm64\u003c/code\u003e CodeQL bundle when available. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4072\"\u003e#4072\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.0\"\u003e2.27.0\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4129\"\u003e#4129\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.9 - 26 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.4\"\u003e2.26.4\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4106\"\u003e#4106\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.8 - 21 Aug 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.7 - 13 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.3\"\u003e2.26.3\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4085\"\u003e#4085\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.6 - 04 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eChanged the default filepath for the new remote file address format that was introduced in CodeQL Action 4.37.0 / 3.37.0 to \u003ccode\u003e.github/codeql-config.yml\u003c/code\u003e to align it with the suggested path that is used elsewhere. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4070\"\u003e#4070\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.5 - 03 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed a bug where a network error while streaming the download of the CodeQL bundle could terminate the \u003ccode\u003einit\u003c/code\u003e Action instead of falling back to downloading the bundle before extracting it. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4061\"\u003e#4061\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.4 - 29 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThis version of the CodeQL Action adds support for the \u003ccode\u003etools\u003c/code\u003e input for the \u003ccode\u003ecodeql-action/init\u003c/code\u003e step to be specified using a \u003ccode\u003egithub-codeql-tools\u003c/code\u003e \u003ca href=\"https://docs.github.com/en/organizations/managing-organization-settings/managing-custom-properties-for-repositories-in-your-organization\"\u003erepository property\u003c/a\u003e. This feature will gradually be rolled out following the release of this version. Once rolled out, this allows for the CodeQL CLI version that is used in GitHub-managed workflows, such as Default Setup, to be set to a custom value. For example, customers who run into issues with rate limits when a new CodeQL CLI version is released can set the value to \u003ccode\u003etoolcache\u003c/code\u003e to always use the CodeQL CLI version that is available in the runner toolcache. For Advanced Setup workflows, the value provided for \u003ccode\u003etools\u003c/code\u003e in the workflow definition always takes precedence unless the value of the repository property starts with \u003ccode\u003e!\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4037\"\u003e#4037\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.2\"\u003e2.26.2\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4051\"\u003e#4051\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.3 - 22 Jul 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.2 - 21 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe new address format for the \u003ccode\u003econfig-file\u003c/code\u003e input that was introduced in CodeQL Action 4.37.0 is now enabled by default. In addition to the format described there, the \u003ccode\u003eremote=\u003c/code\u003e prefix can now be used to explicitly indicate that the input refers to a remote file. All previous input formats continue to be accepted as well. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4023\"\u003e#4023\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe CodeQL Action can now make use of \u003ca href=\"https://docs.github.com/en/code-security/how-tos/secure-at-scale/configure-organization-security/manage-usage-and-access/giving-org-access-private-registries\"\u003econfigured private registries\u003c/a\u003e in Default Setup to retrieve CodeQL configuration files from remote repositories that require authentication. This will allow customers to store their CodeQL configuration in a single repository that can then be referenced by Default Setup workflows in other repositories. We expect to roll this and other, related changes out to everyone in July. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4007\"\u003e#4007\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.1 - 16 Jul 2026\u003c/h2\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/b96794f015dfd88f77b49b1c93e0fa7110f94c63\"\u003e\u003ccode\u003eb96794f\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/github/codeql-action/issues/4131\"\u003e#4131\u003c/a\u003e from github/update-v4.38.0-7e08580a9\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/02d5093871674ea20274117103ce3038c73c77ef\"\u003e\u003ccode\u003e02d5093\u003c/code\u003e\u003c/a\u003e Update changelog for v4.38.0\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/7e08580a93dc4e4b9dda167e364577035cf504c6\"\u003e\u003ccode\u003e7e08580\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/github/codeql-action/issues/4130\"\u003e#4130\u003c/a\u003e from github/henrymercer/workflow-runner-sizing\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/bfcc52b4f5d98468a5993daa0bf0e4fb3f3ed698\"\u003e\u003ccode\u003ebfcc52b\u003c/code\u003e\u003c/a\u003e Run slow macOS checks on larger runners\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/8c251e757c0260283fc50214a06ac768b61d3af4\"\u003e\u003ccode\u003e8c251e7\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/github/codeql-action/issues/4129\"\u003e#4129\u003c/a\u003e from github/update-bundle/cod .js` and `No tests found`.\n\n## Change\n\nOne import: the zip writer comes from `../../../agent/src/api/zip-utils` (dependency-free source module), the pattern `test/dev-smoke/live-onboarding.ts` and `test/electrobun-packaged/live-api.ts` already use for app-core. Playwright transpiles it like the rest of the harness.\n\n## Evidence\n\n- `scripts/playwright-test-match.test.mjs` with `packages/agent/dist` moved aside: fails on develop's import (the CI error), passes with this change; passes on both with dist present (see comment below for the exact runs).\n- The ui-smoke stack with this import in place ran 12/12 across `all-pages-clicksafe`, `plugin-views-interaction` and `apps-builtin-pages-interactions` on develop `61446bb82c9b`, so the export mock still produces a readable archive.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01JwaJQUMKt9LhWLhxDwVCAB\n"])</script><script>self.__next_f.push([1,"42:Tfbb,"])</script><script>self.__next_f.push([1,"A replacement response with a missing, malformed, unresolved, or inactive `visualContinuation` field can leave the previous response's navigation decision staged. The next evaluator then consumes that discarded decision instead of using the authorized catalog/classifier fallback. Clear the previous same-message decision before parsing, and when the field is inactive. Valid replacements remain single-use; active prompt composition does not evict them.\n\nFixes #31400. Related: #31332, #31330. @lalalune\n\nDevelop now includes the broader same-turn navigation reuse implementation. This PR preserves its original history through an ordinary merge and keeps develop's newer behavior; the remaining diff is four files for the redispatch safeguard and regression coverage. It does not add a prompt, model call, utterance shortcut, or provider change to ordinary valid turns.\n\n## Sync, scope and risk\n\nOrdinary merge of develop `886df6eba0c33e40da1794f5e632da6c094bedea`, as reque lformed replacement expected 1 fresh classifier call, received 0.\nCandidate full plugin: 66 files passed; 2407 tests passed.\nRepository: 373 successful / 373 tasks; final audits exit 0.\n```\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] Current-head real application navigation/domain trace remains pending.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] Current-head real-model application acceptance remains pending. The deterministic redispatch reproduction proves the lifecycle defect, not its frequency in live conversations.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] Current-head live navigation/domain receipts remain pending. The registry/evaluator tests preserve the Calendar candidate and reply under a fresh navigation denial, but do not claim database or deployed app acceptance.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - this diff has no rendered visual text.\n\nThis remains draft. Old-head approvals, staging timing and image evidence do not establish acceptance of this head; no deployment or overall latency improvement is claimed. The broader context/recovery and final app acceptance work remains in #31330.\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-4xl\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-4 flex flex-col justify-between sm:flex-row\",\"children\":[[\"$\",\"$L12\",null,{\"currentInterval\":\"day\",\"currentDate\":\"2026-09-16\"}],[\"$\",\"$L13\",null,{\"metrics\":{\"date\":\"2026-09-16\",\"interval\":{\"intervalStart\":\"$D2026-09-16T00:00:00.000Z\",\"intervalEnd\":\"$D2026-09-17T00:00:00.000Z\",\"intervalType\":\"day\"},\"pullRequests\":{\"new\":29,\"merged\":26,\"total\":33},\"issues\":{\"new\":3,\"closed\":0,\"total\":3},\"activeContributors\":15,\"codeChanges\":{\"additions\":5825,\"deletions\":1200,\"files\":177,\"commitCount\":66},\"topContributors\":[{
