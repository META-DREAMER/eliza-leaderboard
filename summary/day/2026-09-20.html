first persist -\u003e ENOSPC, partial file exists (65536 bytes)\nsecond persist -\u003e success URL; route serves 200 with 65536 bytes and the immutable cache header\n```\n\n## Impact\n\nOne disk-full event permanently corrupts specific attachments in a user's history, and content addressing guarantees the corruption is reused for every future identical upload and cached forever by the browser.\n\n## Fix direction\n\nWrite to a temporary sibling (`\u003cname\u003e.\u003cpid\u003e.\u003crandom\u003e.tmp`), fsync, then rename over the final name, removing the temporary file on any failure (the auth package's account file writer already does this); treat an existing file whose size differs from the payload as absent and rewrite it. Apply to all four write sites and pin with a test that pre-seeds a short file under the correct hash.\n"])</script><script>self.__next_f.push([1,"15:T563,"])</script><script>self.__next_f.push([1,"The scheduled-item editor labels its primary control “Run now” for manual starters, but calls the acknowledge mutation. The canonical runner only changes lifecycle state when acknowledging; it does not dispatch the task. The current UI test asserts that same incorrect verb, so it can pass while the owner receives no run.\n\nObserved source: packages/ui/src/components/pages/ScheduledTaskEditor.tsx and ScheduledTaskEditor.test.tsx; plugins/plugin-scheduling/src/scheduled-task/runner.ts acknowledge implementation. The real fire API already exists.\n\nExpected behavior: an explicit run executes through the existing authenticated fire API and canonical scheduling dispatcher. Acknowledging a delivered item remains a separate operation. The UI reports failed or unavailable execution visibly. Manual dossier refresh must work after a settled run without consuming or resetting automatic once-per-owner-day admission. Pending or uncertain delivery cannot be blindly replayed.\n\nAcceptance: exercise UI to API to canonical dispatch and inspect the resulting effect; retain concurrency, authorization, paused/manual, settled refresh, pending delivery and automatic-day invariants. Review affected desktop/mobile app captures and run owning package checks plus root verification. Related dossier acceptance work: #31872. No second scheduler or state-only substitute for execution.\n"])</script><script>self.__next_f.push([1,"16:T792,"])</script><script>self.__next_f.push([1,"A long-running owner-private calendar turn can finish its reads and then reject the authorized write solely because its ingress delivery-audience attestation expired after five minutes. The user receives no calendar event despite retaining the same owner, room and request.\n\nObserved in core-flows scenario `live-note-to-calendar-stale-source`, run `29192f53-198d-4b05-a1bd-64d006500333`: two availability observations settled successfully; the follow-up retrieved the current note and then `CALENDAR_CREATE_EVENT` was rejected with `expired_attestation`. The scenario failed and no successful create receipt was returned. This was a simulated CLI-provider diagnostic, not release-qualified evidence.\n\nThe synchronous action gate rejects expiration before the existing async membership revalidation. Simply lengthening the TTL or ignoring expiration would weaken the existing contract and is not the intended fix.\n\nAcceptance:\n- An active, originally authorized turn can renew audience evidence from current trusted authority before tool exposure/execution and visible egress.\n- Renewal is scoped to the exact runtime, turn, actor and destination, and ends on completion or cancellation; stale completed turns cannot acquire renewed access.\n- Canonical-room renewal checks the current owner, room kind and complete participant census. Authenticated API renewal revalidates the host principal with fresh credential/session checks rather than cached ingress authorization.\n- Revocation, changed ownership/membership/destination, unavailable verification, actor/runtime mismatch and cancelled work remain denied. Sensitive-disclosure bookkeeping survives renewal.\n- Regressions advance the clock beyond the normal TTL without relaxing it; cover successful long work and each invalidation boundary. Re-run the note-to-calendar journey and inspect authoritative event state and receipts.\n\nRelated implementation/recovery work: #31856, #31799.\n"])</script><script>self.__next_f.push([1,"17:T19d4,"])</script><script>self.__next_f.push([1,"Bills now use the owner’s calendar day consistently through the FINANCES action and HTTP bills route. A cloud server running in UTC can no longer create or clear owner travel based on its own timezone. Explicit owner travel and expiry processing remain active, as does timezone inference on recognized personal devices.\n\nFixes #31062, #31842 and #31893. Supersedes #31777. Includes the task-metadata persistence fixture repair required by the current scheduler contract.\n\nOwner facts provide one shared calendar-zone resolver. Unavailable owner storage produces a typed 503 failure; an invalid configured zone produces 422. Neither silently falls back to another zone. When no owner zone is configured, the existing agent-setting and runtime-default precedence applies.\n\nValidation at `a975e79ccfb8968d6f4b95bfdeab82e6526d1ce2`: ordinary install; root verification (373 tasks and trailing audits); personal-assistant 2,911 passing tests with six existing skips; shared 2,769 passing tests; finances 205 passing tests. All five commands exited zero, with unchanged head and clean working tree. The third-party Google auth package’s missing source-map warning is retained in the logs.\n\nPublication revision `eb1f15ba66d8dd5ce84ad71477d30a33a2b5a558` rebases onto develop `8ee8c182f6127c5e5c79b48528f3b731272fb0d1`. All 14 changed files are byte-identical to the full-suite revision. Fresh installation and root verification passed at the publication revision (373 tasks and trailing audits, exit 0, 1224.59 seconds). The actual 10-case u003e\nThe real PGlite test reads persisted owner facts before and after scheduler execution and asserts the action and HTTP bill results. The enabled UTC cloud scheduler preserves the Los Angeles owner timezone and upcoming bill classification, preserves explicit travel, and expires old travel without fabricating a new host-derived trip. Recognized personal-device inference remains covered. These are asserted database reads, not fabricated row examples.\n\n```text\n✓ plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts \u003e finances bill dueness through both surfaces (#31062) \u003e does not infer owner travel from a UTC cloud host 1083ms\n✓ plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts \u003e finances bill dueness through both surfaces (#31062) \u003e preserves active owner travel on a cloud host 288ms\n✓ plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts \u003e finances bill dueness through both surfaces (#31062) \u003e does not treat a cloud host matching home as a device returning home 298ms\n✓ plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts \u003e finances bill dueness through both surfaces (#31062) \u003e expires travel on a cloud host without reopening it from the host zone 283ms\n✓ plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts \u003e finances bill dueness through both surfaces (#31062) \u003e retains timezone travel inference on a recognized personal device 340ms\n✓ plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts \u003e finances bill dueness through both surfaces (#31062) \u003e registers the owner-fact calendar zone resolver through plugin init 3ms\n✓ plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts \u 4: ~7.6K chars of `uiWidgets` / `recent-conversations` / `relevant-conversations` / `CHANNEL_TOPICS` / `firstRun` on every in-loop evaluation call.\n- Gate proofs: the in-loop evaluator user message omits People in the Room, `PLATFORM_USER_CONTEXT` and the widget catalog but still carries `RECENT_MESSAGES`, `FACTS` and `CURRENT_TIME`; calendar create/move/delete evaluator FINISH still selects `effectReceiptIds`; RESTORE_CONTEXT reads refresh the evaluator context.\n\nWhat changes:\n- `provider-state.ts`: `EVALUATOR_STAGE_PROVIDER_EXCLUSIONS` names the providers the evaluator stage never reads.\n- `pipeline.ts`: after the planner composition, `runV5MessageRuntimeStage1` composes a second `ContextObject` from the same already-run planner state through the existing `extraProviderExclusions` mechanism (the one ambient turns use), copies the planner composition's metadata onto it (`providerDiscoveryEnabled`, `historyReferenceEncoding`, `loadedContextProviders`, the completion-context selection), appends the same planner decision event and hands it to `runPlannerLoop` as `evaluatorContext`. The loaded context catalog reaches it too, so a reference the planner loaded never reads as still pending at evaluation time.\n- `planner-types.ts`: `PlannerTrajectory.evaluatorBaseContext?` and `PlannerLoopParams.evaluatorContext?`.\n- `planner-loop.ts`: the trajectory stores the evaluator composition (with the post-tool reply instruction appended when that seed is present); a planner-side `RESTORE_CONTEXT` read refreshes it through `restoreEvaluatorProviders` alongside `modelBaseContext`.\n- `runtime/evaluator.ts`: `renderEvaluatorModelInput` renders `evaluatorBaseContext ?? modelBaseContext ?? context`, so callers that supply no evaluator composition render exactly as before; an evaluator `contextRequest` re-run refreshes both contexts; `restoreEvaluatorProviders` carries the restored planner provider bodies onto the evaluator composition while keeping its exclusions, without a second composition.\n\nPolicy note: this is not a cap or truncation. Whole named providers are removed via the existing `extraProviderExclusions` mechanism, and the removal is limited to the evaluator stage: the planner prompt is untouched, `evaluatorTemplate` never references the excluded providers, and `RESTORE_CONTEXT` reads are honored on both contexts (planner read and evaluator `contextRequest` re-run).\n\nDerived from stable commits 51d30cd5d9f, 82c59fa5506 and the merge-only repairs in a3cbd5e9e26; carved onto `develop` (8e9fcf42d98) with only these hunks.\n\n## Verification\n\n- `bunx biome check --write` on the six changed files: clean.\n- `cd packages/core \u0026\u0026 bunx vitest run --maxWorkers=3` on `src/runtime/__tests__/evaluator-stage-context.test.ts` (new, 7 tests: evaluator renders the supplied composition and falls back unchanged without one; `runPlannerLoop` with `evaluatorContext` hands the evaluator a trajectory whose `evaluatorBaseContext` lacks the excluded providers while the planner wire still carries them; a planner `RESTORE_CONTEXT` read and an evaluator `contextRequest` re-run both refresh `evaluatorBaseContext`; `runV5MessageRuntimeStage1` hands `runPlannerLoop` an `evaluatorContext` carrying the loaded context catalog, the planner decision event and the completion-context metadata without `ENTITIES` / `uiWidgets`, and the in-loop evaluator wire reflects it), `src/runtime/__tests__/evaluator.test.ts`, `src/__tests__/message-runtime-stage1.test.ts`, `src/services/message.ttft-prefetch.test.ts`, `src/runtime/__tests__/planner-loop-discovery.test.ts`, `src/runtime/__tests__/completion-context.test.ts`, `src/runtime/__tests__/evaluator-foreground-context.test.ts`, `src/services/message.reply-recovery.test.ts`, `src/__tests__/message-stage1-context-catalog.test.ts` and every `src/runtime/__tests__/planner-loop*` suite: 40 test files, 1265 tests passed.\n- `cd packages/core \u0026\u0026 bunx tsc --noEmit -p tsconfig.json`: clean.\n\nModel attribution: Claude Fable 5.1 (`claude-fable-5-1`) via Claude Code.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"19:Tf6d,"])</script><script>self.__next_f.push([1,"Fixes #31957.\n\nAnchor-relative schedules now resolve occurrences on adjacent local days. A wake observed at 21:07 plus 240 minutes fires at 01:07 the following day, even when that following day has no observation or static fallback. Due decisions and the next-fire index share the same occurrence resolution; persisted fires are consumed once and stale observations do not replay on later days.\n\nThe change preserves DST-aware local-time resolution, negative offsets, and missed fixed-instant calendar anchors. Fixed-instant handling requires every relevant probe to resolve to the same non-null instant; sparse observations cannot masquerade as fixed anchors. Missing or malformed observations remain unresolved.\n\nValidation at `f13d62eb26dfffc4334a55f4da38843baadf89c2`, rebased without conflicts onto `3f462263f2033876d6003b88a894115c21c8cf58`, with Bun 1.3.14 and Node 24.15.0:\n\n- Normal frozen-lockfile installation: PASS.\n- Full scheduling suite: 630 tests in 37 files PASS, including DST/property sweeps, sparse observed anchors, negative offsets, malformed observations and runner persistence/idempotency.\n- Scheduling typecheck and lint: PASS.\n- Root `bun run verify`: PASS (all repository audits completed, exit 0).\n\nAn earlier qualification at `7bfe7b2e42a115d2d3964a9c581eb61780e44ed6` recorded one 15-second test timeout (629 passed, 1 failed). The unchanged focused file subsequently passed all 10 tests. The complete suite passed on the later base and on this final revision without increasing the deadline; the failed run remains part of the review evidence.\n\n\u003c!-- evidence-head:f13d62eb26dfffc4334a55f4da38843baadf89c2 --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered UI surface.\n\u003c!-- evidence-ro r(runtime, resolver)` stores one owner-zone resolver on the runtime (a global-symbol property, so a dist and a source copy of the module see the same registration), `resolveCalendarTimeZone(runtime, now)` resolves owner zone → agent `TIMEZONE` setting → host zone and reports the `source`, and `calendarDateKey(now, timeZone)` produces the owner-day key.\n- Fail-closed: a resolver that throws is a `LifeOpsServiceError` 503 `CALENDAR_TIME_ZONE_UNAVAILABLE` (cause preserved); an invalid zone from the owner or the setting is 422 `CALENDAR_TIME_ZONE_INVALID`. No step falls through to another zone. A `null` owner zone is \"not configured\" and continues to the setting; that is the only fallthrough.\n- `FinancesService.getUpcomingBills` derives `todayIso` from `calendarDateKey(now, (await this.resolveCalendarTimeZone(now)).timeZone)`; the wrapper rethrows the shared error as `FinancesServiceError` with the same status and code, which `runPaymentsHandler` already turns into `success:false` and `runFinancesRoute` into `ctx.error(res, message, status)`. The action constructs `new FinancesService(runtime)` and the route `new FinancesService(runtime, {ownerEntityId})` exactly as before; neither needs injection because the owner lives on the runtime.\n- The personal-assistant plugin registers `resolveConfiguredOwnerTimeZone` in `init`, next to the other first-turn registries. It reads the owner facts through `ownerFactsToView`, so the active-travel destination override is honoured like every other owner-zone consumer, and it propagates a store read failure instead of substituting the host zone (the lenient `resolveOwnerTimeZone` used by reminders is unchanged).\n- Behavioral change for operators: an invalid owner or `TIMEZONE` zone now surfaces as an error on the bills route and the dashboard action instead of a silently UTC-classified list. Documented in `plugins/plugin-finances/README.md`.\n\n# Background\n\n## What does this PR do?\n\nMoves calendar time zone ownership into `@elizaos/shared`, registers the personal-assistant owner facts as that owner, and makes the finances bill classification read the owner's calendar day from it on every surface.\n\n## What kind of change is this?\n\nBug fix (non-breaking; additive exports).\n\n# Documentation changes needed?\n\nMy changes require a change to the project documentation, and it is included in this PR (`plugins/plugin-finances/README.md`, `TIMEZONE` row).\n\n# Testing\n\n## Where should a reviewer start?\n\n- `plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts` — real runtime (normally registered personal-assistant plugin, finances schema on PGlite, real runtime-plugin HTTP dispatcher). One bill due `2026-03-02`, `now = 2026-03-03T03:30Z`. Owner fact `America/Los_Angeles` → `upcoming` through both `runPaymentsHandler` (`dashboard`) and `GET /api/lifeops/money/bills`; owner fact `Asia/Tokyo` → `overdue` on both; owner fact `Mars/Phobos` → action `success:false` with `{status: 422, code: CALENDAR_TIME_ZONE_INVALID}` and the route 422 naming the zone. It also asserts the resolver registered by `init` resolves with `source: \"owner\"`.\n- `plugins/plugin-finances/src/upcoming-bills-calendar-time-zone.test.ts` — stubbed repository; owner-zone, setting, host-default, precedence, 503 on resolver failure with cause, 422 on invalid owner or setting zone.\n- `packages/shared/src/lifeops-normalize/calendar-time-zone.test.ts` — the owner's precedence and fail-closed contract and the LA/Honolulu/Tokyo/UTC date-key table.\n\n## Detailed testing steps\n\n```bash\nbun run --cwd packages/shared test\nbun run --cwd plugins/plugin-finances test\ncd plugins/plugin-personal-assistant \u0026\u0026 bunx vitest run --config vitest.src-integration.config.ts src/routes/finances-calendar-time-zone.pglite.integration.test.ts\n```\n\nResults at `5a18df43`:\n\n| Lane | Result |\n| --- | --- |\n| `packages/shared` full suite | 232 files, 2907 tests passed |\n| `plugins/p r persistence schema changes.\n\n# Sync and scope\n\n- Base: `develop` at `51a69a9ae861c49e09216f2ed3e93af80df8f301`.\n- Head: `6a247c307172077942f245acac50fb1fc7a2eaf7`.\n- One rebased commit; exactly four advanced-memory source/test files change under `plugins/plugin-assistant`.\n- The package scope in the commit and PR title is updated from the removed core location to `plugin-assistant`.\n- The tests now read configuration through the public `getConfig()` method rather than reaching through a private-field cast.\n\n# Validation\n\nCurrent rebased head, repository-pinned Node 24.15.0 and Bun 1.4.2:\n\n- Plugin-assistant focused threshold suites: 23/23 passed (2 files).\n- Plugin-assistant typecheck: PASS.\n- Biome over all four changed files: PASS.\n- `git diff --check origin/develop...HEAD`: PASS.\n\nHosted workflow run `36253464299` passed on this exact head: Source checks in 31m19s, Billing payment replay E2E in 6m43s, Subscription authority PostgreSQL in 1m12s, and the aggregate All Tests Passed gate in 2s.\n\nThe prior head `3bf68597c6f791fe5920acbd3c297858f089bbcb` passed 23/23 focused tests in the former core location, core typecheck, Biome, hosted checks, and the stacked root verify gate (373/373 tasks). Independent review mutation checks killed each of three regressions: permissive float parsing, permissive integer parsing, and a non-finite confidence floor. Those results establish the patch behavior before the upstream feature relocation; current-head validation above covers the relocated implementation.\n\n# Reviewer path\n\n`memory-service.test.ts` initializes the real `MemoryService` with controlled runtime settings and reads its public configuration. `memory-items.confidence-floor.test.ts` exercises the production storage-floor helper. The production storage loop uses `extraction.confidence \u003c minConfidence`; without the finite guard, a `NaN` threshold makes that comparison false and stores every extracted item.\n\n# Evidence Gate\n\nEvidence ma  retry delay guaranteed time for a 20ms cancellation. Full jitter legitimately permits zero delay, so retries could finish first and make CI flaky.\\n\\nReturn HTTP 503 with `Retry-After: 1` from the real local server and force zero random jitter in this test. Preserve exact cancellation-reason identity and the one-request assertion; production transport is unchanged.\\n\\nValidation:\\n- Negative control: zero jitter without Retry-After fails because the request resolves before cancellation.\\n- Full transport file: 19 passed, 74 assertions.\\n- Biome and git diff whitespace checks passed.\\n\\nCloses #31960.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T16:36:03Z\",\"mergedAt\":\"2026-09-20T19:31:43Z\",\"additions\":8,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABEScNAQ\",\"title\":\"test(website-blocker): simplify fixtures and verify refreshed status\",\"author\":\"lalalune\",\"number\":31919,\"body\":\"$43\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T06:37:26Z\",\"mergedAt\":\"2026-09-20T07:08:22Z\",\"additions\":8,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs8AAAABEStyOA\",\"title\":\"test: consolidate interaction matrix artifact coverage\",\"author\":\"lalalune\",\"number\":31940,\"body\":\"$44\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T08:01:15Z\",\"mergedAt\":\"2026-09-20T11:05:23Z\",\"additions\":6,\"deletions\":250},{\"id\":\"PR_kwDOMT5cIs8AAAABDr2nZg\",\"title\":\"fix(core): read_channel treats a legacy source route beside its single account route as one connector family\",\"author\":\"NubsCarson\",\"number\":31459,\"body\":\"$45\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-15T22:54:56Z\",\"mergedAt\":null,\"additions\":5,\"deletions\":22},{\"id\":\"PR_kwDOMT5cIs8AAAABEQn9yA\",\"title\":\"test(core): remove obsolete incoming-warning risk assertion\",\"author\":\"lalalune\",\"number\":31830,\"body\":\"$46\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-19T22:04:43Z\",\"mergedAt\":\
