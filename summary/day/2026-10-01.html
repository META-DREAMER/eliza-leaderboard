3e\u003ccode\u003e075a664\u003c/code\u003e\u003c/a\u003e fix: join backslash line continuations when reading config values\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/62d1e2f63ec51f868781c79f8280dc90b46af987\"\u003e\u003ccode\u003e62d1e2f\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/gitpython-developers/GitPython/issues/2226\"\u003e#2226\u003c/a\u003e from gitpython-developers/dependabot/pre_commit/pre-...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/23d0e9269c84573129acd1f90dbedf639e889c8f\"\u003e\u003ccode\u003e23d0e92\u003c/code\u003e\u003c/a\u003e build(deps): bump \u003ca href=\"https://github.com/astral-sh/ruff-pre-commit\"\u003ehttps://github.com/astral-sh/ruff-pre-commit\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/8a14adc62401f6b3cb8d9dcf8fa78615810a7e98\"\u003e\u003ccode\u003e8a14adc\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/gitpython-developers/GitPython/issues/2225\"\u003e#2225\u003c/a\u003e from gitpython-developers/submodule-path-hardening\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/gitpython-developers/GitPython/compare/3.1.59...3.1.62\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `pyjwt` from 2.13.0 to 2.15.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/jpadilla/pyjwt/releases\"\u003epyjwt's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.15.0\u003c/h2\u003e\n\u003cp\u003eSee the \u003ca href=\"https://github.com/jpadilla/pyjwt/blob/2.15.0/CHANGELOG.rst\"\u003e2.15.0 changelog\u003c/a\u003e for complete release details.\u003c/p\u003e\n\u003ch2\u003e2.14.0\u003c/h2\u003e\n\u003cp\u003eSee the \u003ca href=\"https://github.com/jpadilla/pyjwt/blob/2.14.0/CHANGELOG.rst\"\u003e2.14.0 changelog\u003c/a\u003e for the complete release details and related security advisories.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/jpadilla/pyjwt/blob/master/CHANGELOG.rst\"\u003epyjwt's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e\u003ccode\u003ev2.15.0 \u0026lt;https://github.com/jpadilla/pyjwt/compare/2.14.0...2.15.0\u0026gt;\u003c/code\u003e__\u003c/h2\u003e\n\u003cp\u003eSecurity\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\n- Wrap recursion errors from deeply nested JWT payloads in ``DecodeError``\n  instead of exposing a raw ``RecursionError``.\n\u003cp\u003eAdded\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\n- Support Python 3.15 by @kytta in `[#1202](https://github.com/jpadilla/pyjwt/issues/1202) \u0026amp;lt;https://github.com/jpadilla/pyjwt/pull/1202\u0026amp;gt;`__\n\nChanged\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eJWKSetCache\u003c/code\u003e now stores the parsed \u003ccode\u003ePyJWKSet\u003c/code\u003e rather than the raw JWKS\npayload, so a cache hit no longer re-parses every key. \u003ccode\u003eJWKSetCache.put()\u003c/code\u003e\naccepts either form and raises \u003ccode\u003ePyJWKSetError\u003c/code\u003e for anything else. As a\nresult, \u003ccode\u003ePyJWKClient.get_jwk_set()\u003c/code\u003e returns the same \u003ccode\u003ePyJWKSet\u003c/code\u003e instance\nfor as long as it stays cached, rather than a freshly built one per call in\n\u003ccode\u003e[#1208](https://github.com/jpadilla/pyjwt/issues/1208) \u0026amp;lt;https://github.com/jpadilla/pyjwt/pull/1208\u0026amp;gt;\u003c/code\u003e__\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePyJWKClient.fetch_data()\u003c/code\u003e now raises\n\u003ccode\u003ePyJWKClientError(\u0026amp;quot;The JWKS endpoint did not return a JSON object\u0026amp;quot;)\u003c/code\u003e when\nthe endpoint response is not a JSON object, instead of returning it for\n\u003ccode\u003eget_jwk_set()\u003c/code\u003e to reject. Callers reaching the JWKS through\n\u003ccode\u003eget_jwk_set()\u003c/code\u003e see the same error as before in\n\u003ccode\u003e[#1208](https://github.com/jpadilla/pyjwt/issues/1208) \u0026amp;lt;https://github.com/jpadilla/pyjwt/pull/1208\u0026amp;gt;\u003c/code\u003e__\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFixed\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\n- Return cached ``PyJWKSet`` values from ``PyJWKClient.get_jwk_set()`` instead\n  of raising ``PyJWKClientError(\u0026amp;quot;The JWKS endpoint did not return a JSON\n  object\u0026amp;quot;)``. ``JWKSetCache.put()`` documents ``PyJWKSet`` as the cached value,\n  so callers pre-populating the cache to avoid a network round-trip could not\n  read it back in `[#914](https://github.com/jpadilla/pyjwt/issues/914) \u0026amp;lt;https://github.com/jpadilla/pyjwt/issues/914\u0026amp;gt;`__ and\n  `[#1208](https://github.com/jpadilla/pyjwt/issues/1208) \u0026amp;lt;https://github.com/jpadilla/pyjwt/pull/1208\u0026amp;gt;`__\n- ``PyJWKClient.get_jwk_set()`` now caches the key set it returns, so a\n  ``fetch_data()`` override that filters or transforms the JWKS is no longer\n  undone by the next cache hit in\n  `[#1208](https://github.com/jpadilla/pyjwt/issues/1208) \u0026amp;lt;https://github.com/jpadilla/pyjwt/pull/1208\u0026amp;gt;`__\n- Raise the documented ``PyJWTError`` subclass instead of leaking a\n  ``TypeError`` when the ``exp``, ``nbf``, or ``iat`` claim decodes to a\n  non-numeric, non-string value such as a list, dict, or ``null``.\n- Reject OKP JWK private keys when their public ``x`` component does not\n  match the private ``d`` component.\n- Treat malformed JWK Set members as unusable keys rather than letting\n  ``AttributeError`` or ``TypeError`` escape ``PyJWKSet``. A member that is not\n\u0026amp;lt;/tr\u0026amp;gt;\u0026amp;lt;/table\u0026amp;gt; \n\u0026lt;/code\u0026gt;\u0026lt;/pre\u0026gt;\n\u0026lt;/blockquote\u0026gt;\n\u0026lt;p\u0026gt;... (truncated)\u0026lt;/p\u0026gt;\n\u0026lt;/details\u0026gt;\n\u0026lt;details\u0026gt;\n\u0026lt;summary\u0026gt;Commits\u0026lt;/summary\u0026gt;\n\n\u0026lt;ul\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/1d41a6478e1562e68ff667fcd703356acf085f68\u0026quot;\u0026gt;\u0026lt;code\u0026gt;1d41a64\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; chore: prepare 2.15.0 release\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/9bc06658f875b9b40091539140bbbdc4639161c3\u0026quot;\u0026gt;\u0026lt;code\u0026gt;9bc0665\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; fix: make recursive payload tests deterministic\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/5fde08a6cf906aa7698de2d6391d88b73006b17b\u0026quot;\u0026gt;\u0026lt;code\u0026gt;5fde08a\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; fix: normalize recursive JWT payload errors\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/171062d2d734315272a901100aa4b109f2fc3c19\u0026quot;\u0026gt;\u0026lt;code\u0026gt;171062d\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; utils: mention bytes in force_bytes type error (\u0026lt;a href=\u0026quot;https://redirect.github.com/jpadilla/pyjwt/issues/1173\u0026quot;\u0026gt;#1173\u0026lt;/a\u0026gt;)\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/c9d4d5375bf464ef363506fed9eb6e7f33217ab6\u0026quot;\u0026gt;\u0026lt;code\u0026gt;c9d4d53\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; docs/conf: drop duplicate 'and' from read() docstring (\u0026lt;a href=\u0026quot;https://redirect.github.com/jpadilla/pyjwt/issues/1174\u0026quot;\u0026gt;#1174\u0026lt;/a\u0026gt;)\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/2763752196113e1473b0ed7905aa6034aedfbe53\u0026quot;\u0026gt;\u0026lt;code\u0026gt;2763752\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; Add support for Python 3.15 (\u0026lt;a href=\u0026quot;https://redirect.github.com/jpadilla/pyjwt/issues/1202\u0026quot;\u0026gt;#1202\u0026lt;/a\u0026gt;)\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/4adcd02722f5011c60079d3978dfc167b9a8eaa5\u0026quot;\u0026gt;\u0026lt;code\u0026gt;4adcd02\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; Catch http.client.HTTPException in PyJWKClient.fetch_data (\u0026lt;a href=\u0026quot;https://redirect.github.com/jpadilla/pyjwt/issues/1201\u0026quot;\u0026gt;#1201\u0026lt;/a\u0026gt;)\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/9e501d993b4d3e7dba14bdb1722b1d993ac75097\u0026quot;\u0026gt;\u0026lt;code\u0026gt;9e501d9\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; fix: correct docstring typo in _validate_jti (\u0026lt;a href=\u0026quot;https://redirect.github.com/jpadilla/pyjwt/issues/1179\u0026quot;\u0026gt;#1179\u0026lt;/a\u0026gt;)\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/4047c44d51950ffda15f40054508d3f17c43b1e2\u0026quot;\u0026gt;\u0026lt;code\u0026gt;4047c44\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; docs: clarify JWK certificate member handling (\u0026lt;a href=\u0026quot;https://redirect.github.com/jpadilla/pyjwt/issues/1212\u0026quot;\u0026gt;#1212\u0026lt;/a\u0026gt;)\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/commit/f4e2b59f543cc82d46d9d69922bba59e804216b9\u0026quot;\u0026gt;\u0026lt;code\u0026gt;f4e2b59\u0026lt;/code\u0026gt;\u0026lt;/a\u0026gt; [pre-commit.ci] pre-commit autoupdate (\u0026lt;a href=\u0026quot;https://redirect.github.com/jpadilla/pyjwt/issues/1210\u0026quot;\u0026gt;#1210\u0026lt;/a\u0026gt;)\u0026lt;/li\u0026gt;\n\u0026lt;li\u0026gt;Additional commits viewable in \u0026lt;a href=\u0026quot;https://github.com/jpadilla/pyjwt/compare/2.13.0...2.15.0\u0026quot;\u0026gt;compare view\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\n\u0026lt;/ul\u0026gt;\n\u0026lt;/details\u0026gt;\n\n\u0026lt;br /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\n\nUpdates `urllib3` from 2.7.0 to 2.8.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/urllib3/urllib3/releases\"\u003eurllib3's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.8.0\u003c/h2\u003e\n\u003ch2\u003e🚀 urllib3 is fundraising for HTTP/2 support\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://sethmlarson.dev/urllib3-is-fundraising-for-http2-support\"\u003eurllib3 is raising ~$40,000 USD\u003c/a\u003e to release HTTP/2 support and ensure long-term sustainable maintenance of the project. If your company or organization uses Python and would benefit from HTTP/2 support in Requests, pip, cloud SDKs, and thousands of other projects \u003ca href=\"https://opencollective.com/urllib3\"\u003eplease consider contributing financially\u003c/a\u003e to ensure HTTP/2 support is developed sustainably and maintained for the long-haul.\u003c/p\u003e\n\u003cp\u003eThank you for your support.\u003c/p\u003e\n\u003ch2\u003eSecurity\u003c/h2\u003e\n\u003cp\u003eFixed the following security issues:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe TLS configuration for HTTPS proxies could be ignored or overridden. (High severity, GHSA-8988-9cw3-xx77)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHTTPResponse.stream()\u003c/code\u003e and \u003ccode\u003eread_chunked()\u003c/code\u003e could buffer a chunk-size line of unbounded length in memory. (High severity, GHSA-vxq7-64xx-v4gw)\u003c/li\u003e\n\u003cli\u003eChunked Deflate streaming could enter an infinite loop. (Medium severity, GHSA-gh4c-6fx4-qh6g)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e[!IMPORTANT]\nurllib3 2.8.0 fixes HTTPS proxy TLS configuration being ignored or overridden by destination settings. Configurations relying on that behavior may require changes.\u003c/p\u003e\n\u003cp\u003eConfigure proxy CA certificates and client certificates in \u003ccode\u003eproxy_ssl_context\u003c/code\u003e, and proxy identity checks with \u003ccode\u003eproxy_assert_hostname\u003c/code\u003e or \u003ccode\u003eproxy_assert_fingerprint\u003c/code\u003e. Destination client certificates and identity overrides no longer apply to HTTPS forwarding proxy connections.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e[!NOTE]\nCVE IDs had not yet been assigned to these advisories at the time of release due to a backlog at GitHub's CNA.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003eDeprecations \u0026amp; Removals\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeprecated using an empty collection as the \u003ccode\u003eRetry\u003c/code\u003e option \u003ccode\u003eallowed_methods\u003c/code\u003e to retry any verb. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5044\"\u003e#5044\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eFeatures\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded \u003ccode\u003eUrl.auth_decoded\u003c/code\u003e and \u003ccode\u003eUrl.auth_decoded_joined\u003c/code\u003e convenience properties to the result of \u003ccode\u003eparse_url()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/4945\"\u003e#4945\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003ebasic_auth_encoding\u003c/code\u003e and \u003ccode\u003eproxy_basic_auth_encoding\u003c/code\u003e parameters to \u003ccode\u003eurllib3.util.make_headers()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5092\"\u003e#5092\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eBugfixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed response header handling to replace obsolete folded header lines (\u003ccode\u003eobs-fold\u003c/code\u003e) with spaces in accordance with RFC 9112, preventing raw CRLF sequences from appearing in header values such as \u003ccode\u003eSet-Cookie\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/1362\"\u003e#1362\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed usage of \u003ccode\u003eproxy_ssl_context\u003c/code\u003e with \u003ccode\u003eProxyManager\u003c/code\u003e when \u003ccode\u003euse_forwarding_for_https=True\u003c/code\u003e. Passing \u003ccode\u003essl_context\u003c/code\u003e instead of \u003ccode\u003eproxy_ssl_context\u003c/code\u003e for HTTPS proxies in this configuration now emits a \u003ccode\u003eFutureWarning\u003c/code\u003e and will raise an error in v3.0. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/2577\"\u003e#2577\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eChanged behavior of the default \u003ccode\u003eConnectionPool.pool\u003c/code\u003e initialization. \u003ccode\u003eLifoQueue\u003c/code\u003e is now resolved from the \u003ccode\u003equeue\u003c/code\u003e module after the \u003ccode\u003eConnectionPool\u003c/code\u003e is instantiated instead of using the default cached \u003ccode\u003eQueueCls\u003c/code\u003e class property. This is done because sometimes the \u003ccode\u003equeue.LifoQueue\u003c/code\u003e is monkey-patched late in the program, such as by gevent. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3289\"\u003e#3289\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eRaised \u003ccode\u003eUnrewindableBodyError\u003c/code\u003e instead of \u003ccode\u003eValueError\u003c/code\u003e when retrying a request whose body had \u003ccode\u003etell()\u003c/code\u003e but not \u003ccode\u003eseek()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3779\"\u003e#3779\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eDecoded percent-encoded SOCKS proxy credentials before authenticating with the proxy server. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3785\"\u003e#3785\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPResponse.drain_conn()\u003c/code\u003e to discard unread response data in 64 KiB chunks (same as the default \u003ccode\u003eamt\u003c/code\u003e when doing \u003ccode\u003eHTTPResponse.stream(...)\u003c/code\u003e). (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5019\"\u003e#5019\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eis_ipaddress()\u003c/code\u003e to detect non-standard IPv4 forms accepted by \u003ccode\u003esocket.connect\u003c/code\u003e, such as hex (\u003ccode\u003e0x7f000001\u003c/code\u003e), octal (\u003ccode\u003e0177.0.0.1\u003c/code\u003e), and decimal integers (\u003ccode\u003e2130706433\u003c/code\u003e), ensuring SSL certificate verification uses the correct mode for these addresses. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5029\"\u003e#5029\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPConnectionPool.urlopen\u003c/code\u003e raising a misleading \u003ccode\u003eFullPoolError\u003c/code\u003e instead of \u003ccode\u003eValueError\u003c/code\u003e when called with an invalid \u003ccode\u003etimeout\u003c/code\u003e argument on a pool created with \u003ccode\u003eblock=True\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5059\"\u003e#5059\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed port-zero handling to preserve explicit \u003ccode\u003e:0\u003c/code\u003e values instead of substituting the default ports 80 or 443 in URL parsing, pool selection, proxy configuration, \u003ccode\u003econnection_from_url()\u003c/code\u003e, and HTTP/2 request authority. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5071\"\u003e#5071\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5101\"\u003e#5101\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a bug where \u003ccode\u003ePoolManager\u003c/code\u003e passed the \u003ccode\u003eassert_hostname\u003c/code\u003e and \u003ccode\u003eassert_fingerprint\u003c/code\u003e parameters to HTTP connection pools. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5077\"\u003e#5077\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPConnectionPool.urlopen()\u003c/code\u003e and HTTP proxy forwarding to strip URL fragments from absolute request targets before sending requests. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5079\"\u003e#5079\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eAdded safeguards to the proxy tunneling code to prevent potential security issues when handling invalid characters in the proxy host and HTTP headers. This change affects users of Python 3.10, Python 3.11, and Python 3.12 when the standard library does not contain the fix; those on newer Python versions should upgrade to 3.13.14+ or 3.14.5+ to get the same security fixes. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5091\"\u003e#5091\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPSConnection.connect()\u003c/code\u003e overriding \u003ccode\u003eProxyConfig.ssl_context\u003c/code\u003e's certificate policy and proxy identity checks with the target connection's TLS settings when forwarding through an HTTPS proxy.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eHTTPSConnection\u003c/code\u003e no longer applies target SNI, assertions, or client credentials to forwarding proxy handshakes and continues to use its \u003ccode\u003essl_context\u003c/code\u003e as a fallback when an HTTPS proxy forwards an HTTP target. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5093\"\u003e#5093\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed URL parsing to more strictly enforce RFC 3986 host syntax, rejecting invalid host input such as raw spaces and control characters, malformed percent-encodings, and percent-encoded control characters in HTTP(S) hosts and IPv6 zone identifiers, including proxy CONNECT tunnel targets. Host normalization now also follows RFC 3986 normalization rules for percent-encoded octets by decoding percent-encoded unreserved characters and uppercasing the hexadecimal digits of retained percent-encoded octets. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5095\"\u003e#5095\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/urllib3/urllib3/blob/main/CHANGES.rst\"\u003eurllib3's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e2.8.0 (2026-09-15)\u003c/h1\u003e\n\u003ch2\u003eSecurity\u003c/h2\u003e\n\u003cp\u003eFixed the following security issues:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe TLS configuration for HTTPS proxies could be ignored or overridden.\n(High severity, \u003ccode\u003eGHSA-8988-9cw3-xx77 \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-8988-9cw3-xx77\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHTTPResponse.stream()\u003c/code\u003e and \u003ccode\u003eread_chunked()\u003c/code\u003e could buffer a chunk-size\nline of unbounded length in memory. (High severity,\n\u003ccode\u003eGHSA-vxq7-64xx-v4gw \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-vxq7-64xx-v4gw\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003eChunked Deflate streaming could enter an infinite loop. (Medium severity,\n\u003ccode\u003eGHSA-gh4c-6fx4-qh6g \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-gh4c-6fx4-qh6g\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e.. caution::\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eurllib3 2.8.0 fixes HTTPS proxy TLS configuration being ignored or\noverridden by destination settings. Configurations relying on that\nbehavior may require changes.\n\u003cp\u003eConfigure proxy CA certificates and client certificates in\n\u003ccode\u003eproxy_ssl_context\u003c/code\u003e, and proxy identity checks with\n\u003ccode\u003eproxy_assert_hostname\u003c/code\u003e or \u003ccode\u003eproxy_assert_fingerprint\u003c/code\u003e.\nDestination client certificates and identity overrides no longer\napply to HTTPS forwarding proxy connections.\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003ch2\u003eDeprecations \u0026amp; Removals\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeprecated using an empty collection as the \u003ccode\u003eRetry\u003c/code\u003e option\n\u003ccode\u003eallowed_methods\u003c/code\u003e to retry any verb.\n(\u003ccode\u003e[#5044](https://github.com/urllib3/urllib3/issues/5044) \u0026lt;https://github.com/urllib3/urllib3/issues/5044\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eFeatures\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded \u003ccode\u003eUrl.auth_decoded\u003c/code\u003e and \u003ccode\u003eUrl.auth_decoded_joined\u003c/code\u003e convenience\nproperties to the result of \u003ccode\u003eparse_url()\u003c/code\u003e.\n(\u003ccode\u003e[#4945](https://github.com/urllib3/urllib3/issues/4945) \u0026lt;https://github.com/urllib3/urllib3/issues/4945\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003ebasic_auth_encoding\u003c/code\u003e and \u003ccode\u003eproxy_basic_auth_encoding\u003c/code\u003e parameters to\n\u003ccode\u003eurllib3.util.make_headers()\u003c/code\u003e.\n(\u003ccode\u003e[#5092](https://github.com/urllib3/urllib3/issues/5092) \u0026lt;https://github.com/urllib3/urllib3/issues/5092\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eBugfixes\u003c/h2\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/b1d30ab61fe0db8f11092805e8c5ac43e091064a\"\u003e\u003ccode\u003eb1d30ab\u003c/code\u003e\u003c/a\u003e Release 2.8.0\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/9016d7e8afc68185496ef07f3c3a4a743d04922e\"\u003e\u003ccode\u003e9016d7e\u003c/code\u003e\u003c/a\u003e Skip \u003ccode\u003etest_read_chunked_with_trailing_data_does_not_hang\u003c/code\u003e for brotlicffi (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5258\"\u003e#5258\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/9101f581a8b3659af23b6ff335ae77200ca33533\"\u003e\u003ccode\u003e9101f58\u003c/code\u003e\u003c/a\u003e Fix \u003ccode\u003enox -s docs\u003c/code\u003e warning (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5256\"\u003e#5256\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/cd770b059b543be29298ea5c52afb0b1b090f5ed\"\u003e\u003ccode\u003ecd770b0\u003c/code\u003e\u003c/a\u003e Merge commit from fork\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/ea2ad7b21a80da3632f80016526a18864586077f\"\u003e\u003ccode\u003eea2ad7b\u003c/code\u003e\u003c/a\u003e Merge commit from fork\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/0716e31534345dc1599ea95d903c79f276239bd8\"\u003e\u003ccode\u003e0716e31\u003c/code\u003e\u003c/a\u003e Fix loading unencrypted client keys with a password in pyOpenSSL (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5255\"\u003e#5255\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/43c68c8b43a9dcb44ed2cf4ec91384ca0d46b37d\"\u003e\u003ccode\u003e43c68c8\u003c/code\u003e\u003c/a\u003e Test pickling of \u003ccode\u003eInvalidChunkLength\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5247\"\u003e#5247\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/308b279b3fb28e7bee952e152ec5baeb5bfd0817\"\u003e\u003ccode\u003e308b279\u003c/code\u003e\u003c/a\u003e Share security policy between GitHub and Read the Docs (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5253\"\u003e#5253\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/53fa0731b27d4b71ab0755ea5b896422d005d706\"\u003e\u003ccode\u003e53fa073\u003c/code\u003e\u003c/a\u003e Add policy on duplicate pull requests (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5252\"\u003e#5252\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/5f2a6a843d0100d1351c3f94d58581ca98d17267\"\u003e\u003ccode\u003e5f2a6a8\u003c/code\u003e\u003c/a\u003e Assert on the ALPN extension in test_tunnel_sets_http_11_alpn (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5232\"\u003e#5232\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/urllib3/urllib3/compare/2.7.0...2.8.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `urllib3` from 2.7.0 to 2.8.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/urllib3/urllib3/releases\"\u003eurllib3's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.8.0\u003c/h2\u003e\n\u003ch2\u003e🚀 urllib3 is fundraising for HTTP/2 support\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://sethmlarson.dev/urllib3-is-fundraising-for-http2-support\"\u003eurllib3 is raising ~$40,000 USD\u003c/a\u003e to release HTTP/2 support and ensure long-term sustainable maintenance of the project. If your company or organization uses Python and would benefit from HTTP/2 support in Requests, pip, cloud SDKs, and thousands of other projects \u003ca href=\"https://opencollective.com/urllib3\"\u003eplease consider contributing financially\u003c/a\u003e to ensure HTTP/2 support is developed sustainably and maintained for the long-haul.\u003c/p\u003e\n\u003cp\u003eThank you for your support.\u003c/p\u003e\n\u003ch2\u003eSecurity\u003c/h2\u003e\n\u003cp\u003eFixed the following security issues:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe TLS configuration for HTTPS proxies could be ignored or overridden. (High severity, GHSA-8988-9cw3-xx77)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHTTPResponse.stream()\u003c/code\u003e and \u003ccode\u003eread_chunked()\u003c/code\u003e could buffer a chunk-size line of unbounded length in memory. (High severity, GHSA-vxq7-64xx-v4gw)\u003c/li\u003e\n\u003cli\u003eChunked Deflate streaming could enter an infinite loop. (Medium severity, GHSA-gh4c-6fx4-qh6g)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e[!IMPORTANT]\nurllib3 2.8.0 fixes HTTPS proxy TLS configuration being ignored or overridden by destination settings. Configurations relying on that behavior may require changes.\u003c/p\u003e\n\u003cp\u003eConfigure proxy CA certificates and client certificates in \u003ccode\u003eproxy_ssl_context\u003c/code\u003e, and proxy identity checks with \u003ccode\u003eproxy_assert_hostname\u003c/code\u003e or \u003ccode\u003eproxy_assert_fingerprint\u003c/code\u003e. Destination client certificates and identity overrides no longer apply to HTTPS forwarding proxy connections.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e[!NOTE]\nCVE IDs had not yet been assigned to these advisories at the time of release due to a backlog at GitHub's CNA.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003eDeprecations \u0026amp; Removals\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeprecated using an empty collection as the \u003ccode\u003eRetry\u003c/code\u003e option \u003ccode\u003eallowed_methods\u003c/code\u003e to retry any verb. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5044\"\u003e#5044\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eFeatures\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded \u003ccode\u003eUrl.auth_decoded\u003c/code\u003e and \u003ccode\u003eUrl.auth_decoded_joined\u003c/code\u003e convenience properties to the result of \u003ccode\u003eparse_url()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/4945\"\u003e#4945\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003ebasic_auth_encoding\u003c/code\u003e and \u003ccode\u003eproxy_basic_auth_encoding\u003c/code\u003e parameters to \u003ccode\u003eurllib3.util.make_headers()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5092\"\u003e#5092\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eBugfixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed response header handling to replace obsolete folded header lines (\u003ccode\u003eobs-fold\u003c/code\u003e) with spaces in accordance with RFC 9112, preventing raw CRLF sequences from appearing in header values such as \u003ccode\u003eSet-Cookie\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/1362\"\u003e#1362\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed usage of \u003ccode\u003eproxy_ssl_context\u003c/code\u003e with \u003ccode\u003eProxyManager\u003c/code\u003e when \u003ccode\u003euse_forwarding_for_https=True\u003c/code\u003e. Passing \u003ccode\u003essl_context\u003c/code\u003e instead of \u003ccode\u003eproxy_ssl_context\u003c/code\u003e for HTTPS proxies in this configuration now emits a \u003ccode\u003eFutureWarning\u003c/code\u003e and will raise an error in v3.0. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/2577\"\u003e#2577\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eChanged behavior of the default \u003ccode\u003eConnectionPool.pool\u003c/code\u003e initialization. \u003ccode\u003eLifoQueue\u003c/code\u003e is now resolved from the \u003ccode\u003equeue\u003c/code\u003e module after the \u003ccode\u003eConnectionPool\u003c/code\u003e is instantiated instead of using the default cached \u003ccode\u003eQueueCls\u003c/code\u003e class property. This is done because sometimes the \u003ccode\u003equeue.LifoQueue\u003c/code\u003e is monkey-patched late in the program, such as by gevent. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3289\"\u003e#3289\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eRaised \u003ccode\u003eUnrewindableBodyError\u003c/code\u003e instead of \u003ccode\u003eValueError\u003c/code\u003e when retrying a request whose body had \u003ccode\u003etell()\u003c/code\u003e but not \u003ccode\u003eseek()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3779\"\u003e#3779\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eDecoded percent-encoded SOCKS proxy credentials before authenticating with the proxy server. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3785\"\u003e#3785\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPResponse.drain_conn()\u003c/code\u003e to discard unread response data in 64 KiB chunks (same as the default \u003ccode\u003eamt\u003c/code\u003e when doing \u003ccode\u003eHTTPResponse.stream(...)\u003c/code\u003e). (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5019\"\u003e#5019\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eis_ipaddress()\u003c/code\u003e to detect non-standard IPv4 forms accepted by \u003ccode\u003esocket.connect\u003c/code\u003e, such as hex (\u003ccode\u003e0x7f000001\u003c/code\u003e), octal (\u003ccode\u003e0177.0.0.1\u003c/code\u003e), and decimal integers (\u003ccode\u003e2130706433\u003c/code\u003e), ensuring SSL certificate verification uses the correct mode for these addresses. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5029\"\u003e#5029\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPConnectionPool.urlopen\u003c/code\u003e raising a misleading \u003ccode\u003eFullPoolError\u003c/code\u003e instead of \u003ccode\u003eValueError\u003c/code\u003e when called with an invalid \u003ccode\u003etimeout\u003c/code\u003e argument on a pool created with \u003ccode\u003eblock=True\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5059\"\u003e#5059\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed port-zero handling to preserve explicit \u003ccode\u003e:0\u003c/code\u003e values instead of substituting the default ports 80 or 443 in URL parsing, pool selection, proxy configuration, \u003ccode\u003econnection_from_url()\u003c/code\u003e, and HTTP/2 request authority. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5071\"\u003e#5071\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5101\"\u003e#5101\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a bug where \u003ccode\u003ePoolManager\u003c/code\u003e passed the \u003ccode\u003eassert_hostname\u003c/code\u003e and \u003ccode\u003eassert_fingerprint\u003c/code\u003e parameters to HTTP connection pools. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5077\"\u003e#5077\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPConnectionPool.urlopen()\u003c/code\u003e and HTTP proxy forwarding to strip URL fragments from absolute request targets before sending requests. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5079\"\u003e#5079\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eAdded safeguards to the proxy tunneling code to prevent potential security issues when handling invalid characters in the proxy host and HTTP headers. This change affects users of Python 3.10, Python 3.11, and Python 3.12 when the standard library does not contain the fix; those on newer Python versions should upgrade to 3.13.14+ or 3.14.5+ to get the same security fixes. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5091\"\u003e#5091\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPSConnection.connect()\u003c/code\u003e overriding \u003ccode\u003eProxyConfig.ssl_context\u003c/code\u003e's certificate policy and proxy identity checks with the target connection's TLS settings when forwarding through an HTTPS proxy.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eHTTPSConnection\u003c/code\u003e no longer applies target SNI, assertions, or client credentials to forwarding proxy handshakes and continues to use its \u003ccode\u003essl_context\u003c/code\u003e as a fallback when an HTTPS proxy forwards an HTTP target. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5093\"\u003e#5093\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed URL parsing to more strictly enforce RFC 3986 host syntax, rejecting invalid host input such as raw spaces and control characters, malformed percent-encodings, and percent-encoded control characters in HTTP(S) hosts and IPv6 zone identifiers, including proxy CONNECT tunnel targets. Host normalization now also follows RFC 3986 normalization rules for percent-encoded octets by decoding percent-encoded unreserved characters and uppercasing the hexadecimal digits of retained percent-encoded octets. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5095\"\u003e#5095\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/urllib3/urllib3/blob/main/CHANGES.rst\"\u003eurllib3's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e2.8.0 (2026-09-15)\u003c/h1\u003e\n\u003ch2\u003eSecurity\u003c/h2\u003e\n\u003cp\u003eFixed the following security issues:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe TLS configuration for HTTPS proxies could be ignored or overridden.\n(High severity, \u003ccode\u003eGHSA-8988-9cw3-xx77 \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-8988-9cw3-xx77\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHTTPResponse.stream()\u003c/code\u003e and \u003ccode\u003eread_chunked()\u003c/code\u003e could buffer a chunk-size\nline of unbounded length in memory. (High severity,\n\u003ccode\u003eGHSA-vxq7-64xx-v4gw \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-vxq7-64xx-v4gw\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003eChunked Deflate streaming could enter an infinite loop. (Medium severity,\n\u003ccode\u003eGHSA-gh4c-6fx4-qh6g \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-gh4c-6fx4-qh6g\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e.. caution::\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eurllib3 2.8.0 fixes HTTPS proxy TLS configuration being ignored or\noverridden by destination settings. Configurations relying on that\nbehavior may require changes.\n\u003cp\u003eConfigure proxy CA certificates and client certificates in\n\u003ccode\u003eproxy_ssl_context\u003c/code\u003e, and proxy identity checks with\n\u003ccode\u003eproxy_assert_hostname\u003c/code\u003e or \u003ccode\u003eproxy_assert_fingerprint\u003c/code\u003e.\nDestination client certificates and identity overrides no longer\napply to HTTPS forwarding proxy connections.\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003ch2\u003eDeprecations \u0026amp; Removals\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeprecated using an empty collection as the \u003ccode\u003eRetry\u003c/code\u003e option\n\u003ccode\u003eallowed_methods\u003c/code\u003e to retry any verb.\n(\u003ccode\u003e[#5044](https://github.com/urllib3/urllib3/issues/5044) \u0026lt;https://github.com/urllib3/urllib3/issues/5044\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eFeatures\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded \u003ccode\u003eUrl.auth_decoded\u003c/code\u003e and \u003ccode\u003eUrl.auth_decoded_joined\u003c/code\u003e convenience\nproperties to the result of \u003ccode\u003eparse_url()\u003c/code\u003e.\n(\u003ccode\u003e[#4945](https://github.com/urllib3/urllib3/issues/4945) \u0026lt;https://github.com/urllib3/urllib3/issues/4945\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003ebasic_auth_encoding\u003c/code\u003e and \u003ccode\u003eproxy_basic_auth_encoding\u003c/code\u003e parameters to\n\u003ccode\u003eurllib3.util.make_headers()\u003c/code\u003e.\n(\u003ccode\u003e[#5092](https://github.com/urllib3/urllib3/issues/5092) \u0026lt;https://github.com/urllib3/urllib3/issues/5092\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eBugfixes\u003c/h2\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/b1d30ab61fe0db8f11092805e8c5ac43e091064a\"\u003e\u003ccode\u003eb1d30ab\u003c/code\u003e\u003c/a\u003e Release 2.8.0\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/9016d7e8afc68185496ef07f3c3a4a743d04922e\"\u003e\u003ccode\u003e9016d7e\u003c/code\u003e\u003c/a\u003e Skip \u003ccode\u003etest_read_chunked_with_trailing_data_does_not_hang\u003c/code\u003e for brotlicffi (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5258\"\u003e#5258\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/9101f581a8b3659af23b6ff335ae77200ca33533\"\u003e\u003ccode\u003e9101f58\u003c/code\u003e\u003c/a\u003e Fix \u003ccode\u003enox -s docs\u003c/code\u003e warning (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5256\"\u003e#5256\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/cd770b059b543be29298ea5c52afb0b1b090f5ed\"\u003e\u003ccode\u003ecd770b0\u003c/code\u003e\u003c/a\u003e Merge commit from fork\u003c/li\u003e\n\u003cli\u0 ef=\"https://github.com/gitpython-developers/GitPython/compare/3.1.59...3.1.60\"\u003ehttps://github.com/gitpython-developers/GitPython/compare/3.1.59...3.1.60\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/db47516dac750c5968b8f6d388b18712c355df50\"\u003e\u003ccode\u003edb47516\u003c/code\u003e\u003c/a\u003e prepare new release\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/10ec385a725fee70def3d9bb7b52208e75174068\"\u003e\u003ccode\u003e10ec385\u003c/code\u003e\u003c/a\u003e get better commit messages from agents\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/b7548979693b3f7c8d13b8da2b7c3ecef07327da\"\u003e\u003ccode\u003eb754897\u003c/code\u003e\u003c/a\u003e test: cover subdirectory discovery and pathspec commands in bare-repo worktre...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/9ebf8b62dfb9ca05178334dc909a4d9a52b505df\"\u003e\u003ccode\u003e9ebf8b6\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/gitpython-developers/GitPython/issues/2227\"\u003e#2227\u003c/a\u003e from nkbeast/fix-config-backslash-continuation\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/a15f7910d1d9a169b5a0c7adf14ce9bf4ede35d0\"\u003e\u003ccode\u003ea15f791\u003c/code\u003e\u003c/a\u003e fix: parse joined config values as a whole\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/60dd9467a73140e00b0d1b0857df5176660b3832\"\u003e\u003ccode\u003e60dd946\u003c/code\u003e\u003c/a\u003e fix: ignore continuation markers in config comments\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/075a664f3da8564c44f2b74536914b9ce9fb4cc1\"\u003e\u003ccode\u003e075a664\u003c/code\u003e\u003c/a\u003e fix: join backslash line continuations when reading config values\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/62d1e2f63ec51f868781c79f8280dc90b46af987\"\u003e\u003ccode\u003e62d1e2f\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/gitpython-developers/GitPython/issues/2226\"\u003e#2226\u003c/a\u003e from gitpython-developers/dependabot/pre_commit/pre-...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/23d0e9269c84573129acd1f90dbedf639e889c8f\"\u003e\u003ccode\u003e23d0e92\u003c/code\u003e\u003c/a\u003e build(deps): bump \u003ca href=\"https://github.com/astral-sh/ruff-pre-commit\"\u003ehttps://github.com/astral-sh/ruff-pre-commit\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gitpython-developers/GitPython/commit/8a14adc62401f6b3cb8d9dcf8fa78615810a7e98\"\u003e\u003ccode\u003e8a14adc\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/gitpython-developers/GitPython/issues/2225\"\u003e#2225\u003c/a\u003e from gitpython-developers/submodule-path-hardening\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/gitpython-developers/GitPython/compare/3.1.59...3.1.62\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `urllib3` from 2.7.0 to 2.8.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/urllib3/urllib3/releases\"\u003eurllib3's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.8.0\u003c/h2\u003e\n\u003ch2\u003e🚀 urllib3 is fundraising for HTTP/2 support\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://sethmlarson.dev/urllib3-is-fundraising-for-http2-support\"\u003eurllib3 is raising ~$40,000 USD\u003c/a\u003e to release HTTP/2 support and ensure long-term sustainable maintenance of the project. If your company or organization uses Python and would benefit from HTTP/2 support in Requests, pip, cloud SDKs, and thousands of other projects \u003ca href=\"https://opencollective.com/urllib3\"\u003eplease consider contributing financially\u003c/a\u003e to ensure HTTP/2 support is developed sustainably and maintained for the long-haul.\u003c/p\u003e\n\u003cp\u003eThank you for your support.\u003c/p\u003e\n\u003ch2\u003eSecurity\u003c/h2\u003e\n\u003cp\u003eFixed the following security issues:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe TLS configuration for HTTPS proxies could be ignored or overridden. (High severity, GHSA-8988-9cw3-xx77)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHTTPResponse.stream()\u003c/code\u003e and \u003ccode\u003eread_chunked()\u003c/code\u003e could buffer a chunk-size line of unbounded length in memory. (High severity, GHSA-vxq7-64xx-v4gw)\u003c/li\u003e\n\u003cli\u003eChunked Deflate streaming could enter an infinite loop. (Medium severity, GHSA-gh4c-6fx4-qh6g)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e[!IMPORTANT]\nurllib3 2.8.0 fixes HTTPS proxy TLS configuration being ignored or overridden by destination settings. Configurations relying on that behavior may require changes.\u003c/p\u003e\n\u003cp\u003eConfigure proxy CA certificates and client certificates in \u003ccode\u003eproxy_ssl_context\u003c/code\u003e, and proxy identity checks with \u003ccode\u003eproxy_assert_hostname\u003c/code\u003e or \u003ccode\u003eproxy_assert_fingerprint\u003c/code\u003e. Destination client certificates and identity overrides no longer apply to HTTPS forwarding proxy connections.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e[!NOTE]\nCVE IDs had not yet been assigned to these advisories at the time of release due to a backlog at GitHub's CNA.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003eDeprecations \u0026amp; Removals\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeprecated using an empty collection as the \u003ccode\u003eRetry\u003c/code\u003e option \u003ccode\u003eallowed_methods\u003c/code\u003e to retry any verb. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5044\"\u003e#5044\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eFeatures\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded \u003ccode\u003eUrl.auth_decoded\u003c/code\u003e and \u003ccode\u003eUrl.auth_decoded_joined\u003c/code\u003e convenience properties to the result of \u003ccode\u003eparse_url()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/4945\"\u003e#4945\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003ebasic_auth_encoding\u003c/code\u003e and \u003ccode\u003eproxy_basic_auth_encoding\u003c/code\u003e parameters to \u003ccode\u003eurllib3.util.make_headers()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5092\"\u003e#5092\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eBugfixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed response header handling to replace obsolete folded header lines (\u003ccode\u003eobs-fold\u003c/code\u003e) with spaces in accordance with RFC 9112, preventing raw CRLF sequences from appearing in header values such as \u003ccode\u003eSet-Cookie\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/1362\"\u003e#1362\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed usage of \u003ccode\u003eproxy_ssl_context\u003c/code\u003e with \u003ccode\u003eProxyManager\u003c/code\u003e when \u003ccode\u003euse_forwarding_for_https=True\u003c/code\u003e. Passing \u003ccode\u003essl_context\u003c/code\u003e instead of \u003ccode\u003eproxy_ssl_context\u003c/code\u003e for HTTPS proxies in this configuration now emits a \u003ccode\u003eFutureWarning\u003c/code\u003e and will raise an error in v3.0. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/2577\"\u003e#2577\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eChanged behavior of the default \u003ccode\u003eConnectionPool.pool\u003c/code\u003e initialization. \u003ccode\u003eLifoQueue\u003c/code\u003e is now resolved from the \u003ccode\u003equeue\u003c/code\u003e module after the \u003ccode\u003eConnectionPool\u003c/code\u003e is instantiated instead of using the default cached \u003ccode\u003eQueueCls\u003c/code\u003e class property. This is done because sometimes the \u003ccode\u003equeue.LifoQueue\u003c/code\u003e is monkey-patched late in the program, such as by gevent. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3289\"\u003e#3289\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eRaised \u003ccode\u003eUnrewindableBodyError\u003c/code\u003e instead of \u003ccode\u003eValueError\u003c/code\u003e when retrying a request whose body had \u003ccode\u003etell()\u003c/code\u003e but not \u003ccode\u003eseek()\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3779\"\u003e#3779\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eDecoded percent-encoded SOCKS proxy credentials before authenticating with the proxy server. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/3785\"\u003e#3785\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPResponse.drain_conn()\u003c/code\u003e to discard unread response data in 64 KiB chunks (same as the default \u003ccode\u003eamt\u003c/code\u003e when doing \u003ccode\u003eHTTPResponse.stream(...)\u003c/code\u003e). (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5019\"\u003e#5019\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eis_ipaddress()\u003c/code\u003e to detect non-standard IPv4 forms accepted by \u003ccode\u003esocket.connect\u003c/code\u003e, such as hex (\u003ccode\u003e0x7f000001\u003c/code\u003e), octal (\u003ccode\u003e0177.0.0.1\u003c/code\u003e), and decimal integers (\u003ccode\u003e2130706433\u003c/code\u003e), ensuring SSL certificate verification uses the correct mode for these addresses. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5029\"\u003e#5029\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPConnectionPool.urlopen\u003c/code\u003e raising a misleading \u003ccode\u003eFullPoolError\u003c/code\u003e instead of \u003ccode\u003eValueError\u003c/code\u003e when called with an invalid \u003ccode\u003etimeout\u003c/code\u003e argument on a pool created with \u003ccode\u003eblock=True\u003c/code\u003e. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5059\"\u003e#5059\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed port-zero handling to preserve explicit \u003ccode\u003e:0\u003c/code\u003e values instead of substituting the default ports 80 or 443 in URL parsing, pool selection, proxy configuration, \u003ccode\u003econnection_from_url()\u003c/code\u003e, and HTTP/2 request authority. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5071\"\u003e#5071\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5101\"\u003e#5101\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a bug where \u003ccode\u003ePoolManager\u003c/code\u003e passed the \u003ccode\u003eassert_hostname\u003c/code\u003e and \u003ccode\u003eassert_fingerprint\u003c/code\u003e parameters to HTTP connection pools. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5077\"\u003e#5077\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPConnectionPool.urlopen()\u003c/code\u003e and HTTP proxy forwarding to strip URL fragments from absolute request targets before sending requests. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5079\"\u003e#5079\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eAdded safeguards to the proxy tunneling code to prevent potential security issues when handling invalid characters in the proxy host and HTTP headers. This change affects users of Python 3.10, Python 3.11, and Python 3.12 when the standard library does not contain the fix; those on newer Python versions should upgrade to 3.13.14+ or 3.14.5+ to get the same security fixes. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5091\"\u003e#5091\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed \u003ccode\u003eHTTPSConnection.connect()\u003c/code\u003e overriding \u003ccode\u003eProxyConfig.ssl_context\u003c/code\u003e's certificate policy and proxy identity checks with the target connection's TLS settings when forwarding through an HTTPS proxy.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eHTTPSConnection\u003c/code\u003e no longer applies target SNI, assertions, or client credentials to forwarding proxy handshakes and continues to use its \u003ccode\u003essl_context\u003c/code\u003e as a fallback when an HTTPS proxy forwards an HTTP target. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5093\"\u003e#5093\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed URL parsing to more strictly enforce RFC 3986 host syntax, rejecting invalid host input such as raw spaces and control characters, malformed percent-encodings, and percent-encoded control characters in HTTP(S) hosts and IPv6 zone identifiers, including proxy CONNECT tunnel targets. Host normalization now also follows RFC 3986 normalization rules for percent-encoded octets by decoding percent-encoded unreserved characters and uppercasing the hexadecimal digits of retained percent-encoded octets. (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5095\"\u003e#5095\u003c/a\u003e)\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/urllib3/urllib3/blob/main/CHANGES.rst\"\u003eurllib3's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e2.8.0 (2026-09-15)\u003c/h1\u003e\n\u003ch2\u003eSecurity\u003c/h2\u003e\n\u003cp\u003eFixed the following security issues:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe TLS configuration for HTTPS proxies could be ignored or overridden.\n(High severity, \u003ccode\u003eGHSA-8988-9cw3-xx77 \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-8988-9cw3-xx77\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHTTPResponse.stream()\u003c/code\u003e and \u003ccode\u003eread_chunked()\u003c/code\u003e could buffer a chunk-size\nline of unbounded length in memory. (High severity,\n\u003ccode\u003eGHSA-vxq7-64xx-v4gw \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-vxq7-64xx-v4gw\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003eChunked Deflate streaming could enter an infinite loop. (Medium severity,\n\u003ccode\u003eGHSA-gh4c-6fx4-qh6g \u0026lt;https://github.com/urllib3/urllib3/security/advisories/GHSA-gh4c-6fx4-qh6g\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e.. caution::\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eurllib3 2.8.0 fixes HTTPS proxy TLS configuration being ignored or\noverridden by destination settings. Configurations relying on that\nbehavior may require changes.\n\u003cp\u003eConfigure proxy CA certificates and client certificates in\n\u003ccode\u003eproxy_ssl_context\u003c/code\u003e, and proxy identity checks with\n\u003ccode\u003eproxy_assert_hostname\u003c/code\u003e or \u003ccode\u003eproxy_assert_fingerprint\u003c/code\u003e.\nDestination client certificates and identity overrides no longer\napply to HTTPS forwarding proxy connections.\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003ch2\u003eDeprecations \u0026amp; Removals\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeprecated using an empty collection as the \u003ccode\u003eRetry\u003c/code\u003e option\n\u003ccode\u003eallowed_methods\u003c/code\u003e to retry any verb.\n(\u003ccode\u003e[#5044](https://github.com/urllib3/urllib3/issues/5044) \u0026lt;https://github.com/urllib3/urllib3/issues/5044\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eFeatures\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded \u003ccode\u003eUrl.auth_decoded\u003c/code\u003e and \u003ccode\u003eUrl.auth_decoded_joined\u003c/code\u003e convenience\nproperties to the result of \u003ccode\u003eparse_url()\u003c/code\u003e.\n(\u003ccode\u003e[#4945](https://github.com/urllib3/urllib3/issues/4945) \u0026lt;https://github.com/urllib3/urllib3/issues/4945\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003ebasic_auth_encoding\u003c/code\u003e and \u003ccode\u003eproxy_basic_auth_encoding\u003c/code\u003e parameters to\n\u003ccode\u003eurllib3.util.make_headers()\u003c/code\u003e.\n(\u003ccode\u003e[#5092](https://github.com/urllib3/urllib3/issues/5092) \u0026lt;https://github.com/urllib3/urllib3/issues/5092\u0026gt;\u003c/code\u003e__)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eBugfixes\u003c/h2\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/b1d30ab61fe0db8f11092805e8c5ac43e091064a\"\u003e\u003ccode\u003eb1d30ab\u003c/code\u003e\u003c/a\u003e Release 2.8.0\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/9016d7e8afc68185496ef07f3c3a4a743d04922e\"\u003e\u003ccode\u003e9016d7e\u003c/code\u003e\u003c/a\u003e Skip \u003ccode\u003etest_read_chunked_with_trailing_data_does_not_hang\u003c/code\u003e for brotlicffi (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5258\"\u003e#5258\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/9101f581a8b3659af23b6ff335ae77200ca33533\"\u003e\u003ccode\u003e9101f58\u003c/code\u003e\u003c/a\u003e Fix \u003ccode\u003enox -s docs\u003c/code\u003e warning (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5256\"\u003e#5256\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/cd770b059b543be29298ea5c52afb0b1b090f5ed\"\u003e\u003ccode\u003ecd770b0\u003c/code\u003e\u003c/a\u003e Merge commit from fork\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/ea2ad7b21a80da3632f80016526a18864586077f\"\u003e\u003ccode\u003eea2ad7b\u003c/code\u003e\u003c/a\u003e Merge commit from fork\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/0716e31534345dc1599ea95d903c79f276239bd8\"\u003e\u003ccode\u003e0716e31\u003c/code\u003e\u003c/a\u003e Fix loading unencrypted client keys with a password in pyOpenSSL (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5255\"\u003e#5255\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/43c68c8b43a9dcb44ed2cf4ec91384ca0d46b37d\"\u003e\u003ccode\u003e43c68c8\u003c/code\u003e\u003c/a\u003e Test pickling of \u003ccode\u003eInvalidChunkLength\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5247\"\u003e#5247\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/308b279b3fb28e7bee952e152ec5baeb5bfd0817\"\u003e\u003ccode\u003e308b279\u003c/code\u003e\u003c/a\u003e Share security policy between GitHub and Read the Docs (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5253\"\u003e#5253\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/53fa0731b27d4b71ab0755ea5b896422d005d706\"\u003e\u003ccode\u003e53fa073\u003c/code\u003e\u003c/a\u003e Add policy on duplicate pull requests (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5252\"\u003e#5252\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/urllib3/urllib3/commit/5f2a6a843d0100d1351c3f94d58581ca98d17267\"\u003e\u003ccode\u003e5f2a6a8\u003c/code\u003e\u003c/a\u003e Assert on the ALPN extension in test_tunnel_sets_http_11_alpn (\u003ca href=\"https://redirect.github.com/urllib3/urllib3/issues/5232\"\u003e#5232\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/urllib3/urllib3/compare/2.7.0...2.8.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `pyjwt` from 2.13.0 to 2.15.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/jpadilla/pyjwt/releases\"\u003epyjwt's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquot...\n\n_Description has been truncated_"])</script><script>self.__next_f.push([1,"2f:T2ae7,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #32947\nRefs #32909, #32944\n\nStacked on #32944: the first commit here is #32944's head `190d8a3304`, and this PR adds one commit on top. Once #32944 merges the diff reduces to that commit. This fixes the replay case #32944 named as out of scope (probe P2 in the #32909 review).\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Change\n\nRecord removal in `drainCutoverHolds` is fenced to the lease owner (`packages/cloud/services/gateway-webhook/src/cutover-hold.ts:255-258`). When a drainer settles a turn while a *different* replica owns the lease, the record survives. If that replica dies without draining, the next drainer acquires the lapsed lease, finds a live record, and redelivers a turn whose dedup ledger already reads `delivered`. The Cloud turn and the provider send run a second time.\n\nThe drainer now reads the dedup ledger after acquiring the lease and before the expiry check (`src/cutover-hold.ts:281-282`). Only a `held` ledger is redelivered. `holdWebhookForCutover` writes `held` with no TTL, so while a record exists the ledger leaves `held` only when a drainer settles the turn: `delivered` after a completed redelivery, or reopened (absent) after a non-retryable release. Any such value means the turn is settled, so the record is removed under the same owner fence and counted in a new `stale` statistic (`CutoverHoldDrainStats.stale`, `:173`), with an info log naming the key and the ledger value. The ordering matters: the check runs before the hold-budget expiry branch, because `release(held, \"expired\")` would otherwise reopen a `delivered` ledger for a settled turn.\n\nRisk: low. The only changed path is a record whose ledger is not `held` at drain time; every other outcome is unchanged. `stale` is additive on the stats object; the drain summary in `src/index.ts` now counts it in its non-empty check and logs it with the other counts, and the tests assert it.\n\nNot addressed: two live drainers running the same turn concurrently after a renewal failure. The ledger stays `held` until a turn settles, so this check cannot see that window; lease renewal is the guard for it.\n\n# Testing\n\nEnvironment: Bun 1.3.14 on this machine (the repository pins 1.4.2), Node 24.15.0, `@elizaos/core` resolved from source through `--conditions=eliza-source` (no `dist` in this checkout). Not CI parity. All runs from `packages/cloud/services/gateway-webhook`.\n\nNew test, `a hold settled while another replica owned the lease is not redelivered once that lease lapses` (`__tests__/cutover-hold.test.ts:486`): drives the real `handleWebhook` and `drainCutoverHolds` against the local `Bun.serve` Cloud stub and in-memory Redis. While the attested turn runs, the lease key is overwritten with another replica's token; after the first drain the lease is deleted and a second drain runs. It asserts that the record survives the first drain (fenced), that the second drain reports `stale: 1` and nothing else, one Cloud turn, one provider send, the record removed, and a `delivered` ledger. The six existing `toEqual` stats assertions gain `stale: 0`.\n\n| Control | Command | Result |\n| --- | --- | --- |\n| GREEN, file, head `c9da363082` | `bun test --conditions=eliza-source __tests__/cutover-hold.test.ts` | 10 pass, 0 fail |\n| GREEN, whole package (5 files), at `d7ab904d1a` (same code; the final commit only reflows one `logger.info` call for Biome) | `bun test --conditions=eliza-source` | 47 pass, 0 fail |\n| RED, the ledger check removed and the `stale` field kept | same file, `-t \"another replica owned the lease\"` | 0 pass, 1 fail: `second.delivered` 1 instead of 0, `second.stale` 0 instead the old sleep row decides.\n\nReplaying a device's rows through the Cloud path on develop (sleep at 07:00, wake at 13:30, merged at 14:00):\n\n| Wake row | Local merge | Cloud merge on develop |\n| --- | --- | --- |\n| no meal forecast | `waking` | **`sleeping`**, `currentSleepStartedAt` 07:00 |\n| snapshot forecasts `breakfast` | `waking` | **`sleeping`**, `currentSleepStartedAt` 07:00 |\n\n# Change\n\n- **Contract:** `SyncLifeOpsScheduleObservationInput` (plugin-elizacloud) gains an optional `observedAt`, the time the device recorded that row.\n- **Serializer:** it moves into `schedule-state.ts` as `scheduleObservationSyncInput` and includes the row's `observedAt`. `RemindersDomain.serializeScheduleObservationForSync` delegates to it. The tests use the real serializer.\n- **Ingest:** `ingestScheduleObservations` normalizes the per-row `observedAt`. Before this change the field would have been dropped silently.\n- **`recordsFromSyncRequest`:** each row keeps its own `observedAt`. A missing value, or one after the batch's send time, falls back to the send time (the previous behavior), so a device clock cannot place a row in the future.\n- **`recordFromSyncInput`:** a synced row's `mealLabel` is only the label it was sent with. Real meal rows are always sent with an explicit label (`deriveLocalScheduleObservations`), and the snapshot still keeps `nextMealLabel`.\n\nOlder senders that omit the per-row time keep the current behavior. An older Cloud agent drops the unknown field during normalization.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (`4573712ebf`).\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\nThis used Ubuntu 24.04 (WSL2), Bun 1.4.2 and `bun install --frozen-lockfile` on develop `4573712ebf`.\n\nThe new tests are in `schedule-state-freshness.test.ts` (vitest). Each one builds the device's stored rows, serializes them with `scheduleObservationSyncInput`, ingests them with `recordsFromSyncRequest` as `device_sync` in one batch sent at `now`, and merges with `scope: \"cloud\"`:\n\n- *a synced batch keeps each row's own time, so replayed sleep does not beat the newer wake*: `waking`, `currentSleepStartedAt: null`, and the row times are preserved.\n- *a synced state row does not adopt its snapshot's meal forecast as its own label*: both rows have `mealLabel: null`, and the merge result is `waking`.\n- *an explicit meal row keeps its label through sync*.\n- *a row time after the batch send time falls back to the send time*.\n\n**Develop reproduction:** a throwaway test (not committed) serialized rows exactly as develop's `serializeScheduleObservationForSync` does and ran both scenarios against develop's `schedule-state.ts`:\n\n```\nREPRO-1 cloud: sleeping 2026-09-29T07:00:00.000Z\nREPRO-2 cloud: sleeping 2026-09-29T07:00:00.000Z\n   × develop: replayed sleep vs newer wake (no meal forecast)\n   × develop: wake row whose snapshot forecasts breakfast\n```\n\n| Run | Result |\n| --- | --- |\n| `schedule-state-freshness.test.ts`, this head | **12 pass** (8 existing + 4 new) |\n| `schedule-state.test.ts`, `schedule-sync-config.test.ts`, `schedule-insight.safe-sort.test.ts` | 10 pass |\n| `plugin-elizacloud` `lifeops-schedule-sync-client.test.ts` | 6 pass |\n| `plugin-elizacloud` `tsc --noEmit -p tsconfig.json` | pass |\n| `plugin-personal-assistant` `tsc --noEmit -p tsconfig.build.json` (after `plugin-elizacloud` `build:ts`, as `^build` orders it) | pass |\n| `biome check` on the changed files | clean |\n\n# Evidence Gate\n\n\u003c!-- evidence-head:26d3d0c8c7698ee2fa220bdd39dff1d5ae8d8cf4 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - schedule sync and merge logic; no rendered UI surface changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - schedule sync and merge logic; no rendered UI surface changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- 003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/vitest-dev/vitest/commits/v4.1.11/packages/vitest\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `drizzle-orm` from 0.44.7 to 0.45.3\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/drizzle-team/drizzle-orm/releases\"\u003edrizzle-orm's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e0.45.3\u003c/h2\u003e\n\u003ch2\u003eNew Netlify DB Driver\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eNote: The Netlify DB driver is developed and maintained by the Netlify team.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eInstallation:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre lang=\"bash\"\u003e\u003ccode\u003enpm i @netlify/db\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eUsage example:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre lang=\"typescript\"\u003e\u003ccode\u003eimport { drizzle } from 'drizzle-orm/netlify-db';\n\u003cp\u003e// reads NETLIFY_DB_URL and NETLIFY_DB_DRIVER env vars\nconst db = drizzle();\u003c/p\u003e\n\u003cp\u003econst result = await db.execute('select 1');\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003cpre lang=\"typescript\"\u003e\u003ccode\u003eimport { drizzle } from 'drizzle-orm/netlify-db';\n\nconst db = drizzle(process.env.DATABASE_URL);\n\nconst result = await db.execute('select 1');\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"typescript\"\u003e\u003ccode\u003eimport { drizzle } from 'drizzle-orm/netlify-db';\n\n// Explicit client — consumer controls the driver\nconst db = drizzle({ client: netlifyDbClient });\n\nconst result = await db.execute('select 1');\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e0.45.2\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed \u003ccode\u003esql.identifier()\u003c/code\u003e, \u003ccode\u003esql.as()\u003c/code\u003e escaping issues. Previously all the values passed to this functions were not properly escaped\ncausing a possible SQL Injection (CWE-89) vulnerability\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThanks to \u003ca href=\"https://github.com/EthanKim88\"\u003e\u003ccode\u003e@​EthanKim88\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://github.com/0x90sh\"\u003e\u003ccode\u003e@​0x90sh\u003c/code\u003e\u003c/a\u003e and \u003ca href=\"https://github.com/wgoodall01\"\u003e\u003ccode\u003e@​wgoodall01\u003c/code\u003e\u003c/a\u003e for reaching out to us with a reproduction and suggested fix\u003c/p\u003e\n\u003ch2\u003e0.45.1\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed pg-native Pool detection in node-postgres transactions breaking in environments with forbidden \u003ccode\u003erequire()\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/drizzle-team/drizzle-orm/issues/5107\"\u003e#5107\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e0.45.0\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed pg-native Pool detection in node-postgres transactions\u003c/li\u003e\n\u003cli\u003eAllowed subqueries in select fields\u003c/li\u003e\n\u003cli\u003eUpdated typo algorythm =\u0026gt; algorithm\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/drizzle-team/drizzle-orm/commit/15454dbe49d827c6081f3d0231e2e7985e517295\"\u003e\u003ccode\u003e15454db\u003c/code\u003e\u003c/a\u003e +\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/drizzle-team/drizzle-orm/commit/54e436feea82c856d5644152cc9d186e237e2e95\"\u003e\u003ccode\u003e54e436f\u003c/code\u003e\u003c/a\u003e exclude gel from pull\u003c/li\u003e\n\u003cli\u 500 default (`:106-109`).\n\nConsumers checked with `git grep -n \"AMOUNT_TOO_LARGE\\|AMOUNT_TOO_SMALL\\|CryptoPaymentError\\|validatePaymentAmount\"` across `packages/` and `plugins/`. The route above is the only code that maps these codes. The billing UI (`packages/ui/src/cloud/billing/components/billing-tab.tsx:429`) and the `plugin-elizacloud` billing proxy (`plugins/plugin-elizacloud/src/routes/cloud-billing-routes.ts:730-742`) show or forward the `error` text and do not switch on codes, so neither needed a change. The direct-wallet route (`packages/cloud/api/crypto/direct-payments/route.ts:80-84`) returns the validator message as a 400, and that message is unchanged.\n\nRisk: low. Valid, too-small and too-large amounts get the same code, message, HTTP status and response body as before. The tests below assert the exact response bytes. The only change callers see is the response for an amount with more than two decimal places: 400 \"Amount must be a USD value in whole cents\" instead of 400 \"Amount too large\". `NaN` and `Infinity` now produce the `AMOUNT_INVALID` code, but they reach `createPayment` only from direct callers, because JSON cannot carry them.\n\n# Testing\n\nEnvironment: Bun 1.3.14 on this machine (the repository pins 1.4.2), Node 24.15.0. `@elizaos/core` and `@elizaos/plugin-sql` resolve from source through `--conditions=eliza-source`, because no `dist` is built in this checkout. This is not CI parity. The fix is one commit, `3049d16651`, on `origin/develop` `4573712ebf`.\n\nTests:\n\n- `packages/cloud/shared/src/lib/config/crypto.test.ts` (extended): the validator gives `not_whole_cents` for `10.005`, `NaN`, `Infinity` and `-Infinity`, `below_minimum` for `4.99`, `above_maximum` for `1000.01`, and exactly `{ valid: true }` for `5.01`.\n- `packages/cloud/api/__tests__/crypto-payment-amount-codes.test.ts` (new): drives the real route and the real `cryptoPaymentsService.createPayment`. Only session auth and the rate limiter are stubbed. `OXAPAY_M
