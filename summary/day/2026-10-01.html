rovide the stakeholder demo and one follow-up Q\u0026A; track client review separately from implementation dates.\n\n**Done when:** Alpha reviews the branded screens and all four phones run the approved branded release without regressions.\n\n[Project and schedule](https://github.com/orgs/elizaOS/projects/20)\n"])</script><script>self.__next_f.push([1,"15:Tc6d,"])</script><script>self.__next_f.push([1,"## Summary\n\nThe `Validate develop` workflow is red at the current tip `4573712ebf` because the `cloud / agent-stability / deterministic-keyless` lane fails on every attempt, and `Complete manifest` fails with it (\"Require one current green row per surface\").\n\nRun: https://github.com/elizaOS/eliza/actions/runs/36636159978 (2026-09-29T21:52Z). The previous run at `2a464d8413` (https://github.com/elizaOS/eliza/actions/runs/36628914261) was green; the two runs in between were cancelled by later pushes, so this is the first observed run after the reminder-delivery change landed.\n\n## Failure\n\nThe step summary only prints `{\"status\":\"failed\",\"firstAttemptPassed\":false,\"passedAttempts\":0}`. The uploaded `cloud-stability-keyless-1` artifact carries the reason in each attempt's `scenario.stdout.log` (identical for attempts 01-03):\n\n```text\n| cloud-stability-agent | failed | 1470ms | deterministic model fixtures were not consumed:\n[{\"name\":\"cloud-reminder-dispatch-body\",\"consumed\":0,\"min\":1,\"max\":1,\"required\":true},\n {\"name\":\"cloud-reminder-dispatch-title\",\"consumed\":0,\"min\":1,\"max\":1,\"required\":true}] |\n```\n\nThe reminder itself was created and dispatched: the scenario's `assertCloudReadback` guard was never reached because the fixture-consumption check fails first, and the `scenario-report.json` shows `OWNER_REMINDERS_CREATE` with `cadence.kind: \"once\"`, `metadata.ownerSurface: \"OWNER_REMINDERS\"`, one `in_app` plan step.\n\n## Cause\n\n`packages/cloud/e2e/scenarios/cloud-stability-agent.scenario.ts` declares two required `TEXT_SMALL` fixtures for the dispatch path:\n\n- `cloud-reminder-dispatch-body` (matches `Current reminder:\\n- title: Review the synthetic Cloud inbox`, cardinality 1)\n- `cloud-reminder-dispatch-title` (matches `Message body:\\nTime to review the synthetic Cloud inbox.`, cardinality 1)\n\nSince `51bd56787c` (fix(reminders): deliver grounded one-shot content without prose rewriting, via #32931 merged as `6d13e67446`), `RemindersService` no longer calls the model for exactly this reminder shape. In `plugins/plugin-personal-assistant/src/lifeops/domains/reminders-service.ts` the `exactReminder` branch (owner occurrence, `in_app`, lifecycle `plan`, `cadence.kind === \"once\"`, `metadata.ownerSurface === \"OWNER_REMINDERS\"`, no `bodyOverride`) builds the body with `buildReminderBody` (`Reminder: \u003ctitle\u003e\\nDue: \u003clocal time\u003e`) and issues a `ReminderPresentation` whose title is the literal `Reminder`; `renderReminderBody` and `renderOwnerNotificationTitle` are only reached on the non-exact path. The scenario's reminder satisfies every `exactReminder` condition, so neither `TEXT_SMALL` call happens and the two required fixtures stay at `consumed: 0`.\n\nThe readback assertion itself still holds with the grounded body (`notification.body.includes(\"synthetic Cloud inbox\")` matches `Reminder: Review the synthetic Cloud inbox`).\n\n## Fix\n\nRemove the two dead fixtures from the deterministic scenario (they encode the pre-`51bd56787c` prose-rewriting contract), leaving the readback assertion to pin the grounded dispatch. Only the deterministic lane is affected; `stability:real` uses the same scenario without fixtures.\n\nI am opening a PR for this.\n"])</script><script>self.__next_f.push([1,"16:T14aa,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`drainCutoverHolds` (`packages/cloud/services/gateway-webhook/src/cutover-hold.ts`) fences record removal to the current lease owner: the Lua step at `:255-258` refuses to delete the hold record when a *different* token owns the lease. That fence is correct while the other owner is alive. It leaves a gap when the other owner dies:\n\n1. Drainer A acquires the lease and starts redelivering a held Blooio or Twilio turn.\n2. A's renewal fails for a whole lease period, the lease lapses, and replica B acquires it (`set nx`). B then dies before draining.\n3. A's turn completes. The dedup ledger is written `delivered`, but A's `removeHeldRecord()` returns 0 because B's token owns the lease, so the record and its index entry stay.\n4. B's lease lapses. The next drainer acquires the lease, finds a live record, and calls `redeliver` without looking at the ledger. The Cloud turn runs again and the provider receives a second send.\n\nThis is the \"P2\" probe from the review of #32909 and the case #32944 left out of scope. #32944 fixed the sibling case where the lease lapsed with *no* new owner; this one needs the drainer to notice that the ledger has already left `held`.\n\n**To Reproduce**\n\nThe real `handleWebhook` and `drainCutoverHolds` against the local `Bun.serve` Cloud stub and in-memory Redis used by `__tests__/cutover-hold.test.ts` (Bun 1.3.14, Node 24.15.0, `--conditions=eliza-source`). A signed Blooio webhook is held during a `503 personal_cutover_in_progress`. Cloud is then attested, and while the attested turn runs the lease key is overwritten with another replica's token. After the first drain the lease is deleted (the other replica died and its lease lapsed) and a second drain runs.\n\nOn `190d8a3304` (#32944's head) the second drain redelivers:\n\n```\n$ bun test --conditions=eliza-source __tests__/cutover-hold.test.ts -t \"another replica owned the lease\"\n534 |     expect(second).toEqual({\nerror: expect(received).toEqual(expected)\n-   \"delivered\": 0,\n+   \"delivered\": 1,\n(fail) connector ingress during Shared→Dedicated cutover \u003e a hold settled while another replica owned the lease is not redelivered once that lease lapses\n 0 pass\n 1 fail\n```\n\nGateway log for the message (timestamps and trace ids omitted): the turn completes twice and the provider egress runs twice.\n\n```\n{\"level\":\"warn\",\"message\":\"Personal connector turn held for Dedicated cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"holdCode\":\"personal_cutover_in_progress\"}\n{\"level\":\"info\",\"message\":\"Personal Eliza connector message completed\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"cloudAttempts\":1,\"egressMs\":2,\"totalMs\":3}\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"attempts\":1}\n{\"level\":\"info\",\"message\":\"Personal Eliza connector message completed\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"cloudAttempts\":1,\"egressMs\":1,\"totalMs\":4}\n```\n\n**Expected behavior**\n\nA drainer that acquires the lease over a record whose dedup ledger is no longer `held` does not redeliver. It removes the record under the same owner fence and moves on. The turn above runs once and the provider receives one send.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - server-side gateway queue behaviour with no rendered surface; the test transcript and gateway log above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: gateway log above; N/A for frontend (no UI).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model call; the Cloud route is a local stub.\n- [x] Domain artifacts when relevant: the drain statistics and the `delivered` ledger with a surviving record, in the transcript.\n\n**Additional context**\n\nThe remaining unguarded window is two live drainers running the same turn concurrently, which happens only if renewal fails and a second replica acquires the lease while the first turn is still in flight. Lease renewal (`renewLeaseWhileRedelivering`) exists to prevent that, and the ledger check below cannot see it because the ledger stays `held` until a turn settles.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-fable-5-1\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-fable-5-1\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"17:T24f8,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`POST /api/crypto/payments` tells the caller that `10.005` is too large. The service picks the amount error code by searching the validator's message, and since #32915 the validator has a third rejection that the search does not know about.\n\n- `validatePaymentAmount` (`packages/cloud/shared/src/lib/config/crypto.ts:232-254`) rejects in three places. `:236-238` rejects an amount that is not finite or has more than two decimal places, with \"Amount must be a finite USD amount in whole cents\". This check came in with #32915 (`1313e200a8`). `:239-244` rejects an amount below the $5 minimum, and `:246-251` one above the $1,000 maximum. The result is `{ valid: boolean; error?: string }`, with no machine-readable reason.\n- `CryptoPaymentsService.createPayment` (`packages/cloud/shared/src/lib/services/crypto-payments.ts:316-320`) sets `AMOUNT_TOO_SMALL` when the message contains \"at least\" and `AMOUNT_TOO_LARGE` otherwise. The whole-cents message has no \"at least\", so `10.005`, `NaN` and `Infinity` all become `AMOUNT_TOO_LARGE`. The code union (`:31-43`) has no code for an invalid amount.\n- The route's schema (`packages/cloud/api/crypto/payments/route.ts:29-34`) accepts any number of decimal places (`/^(?:\\d+|\\d+\\.\\d+)$/` or a finite number between 1 and 10,000). So `10.005` reaches the service, and the route maps `AMOUNT_TOO_LARGE` to 400 `{\"error\":\"Amount too large\"}` (`:95`). `NaN` and `Infinity` cannot arrive in JSON; they reach the service only from direct callers.\n- Consumers: the route is the only code that maps `CryptoPaymentError` codes (`:88-106`; any unmapped code falls through to a 500 at `:102-105`). The billing UI (`packages/ui/src/cloud/billing/components/billing-tab.tsx:429`) and the `plugin-elizacloud` billing proxy (`plugins/plugin-elizacloud/src/routes/cloud-billing-routes.ts:730-742`) show or pass through the `error` text without switching on codes. The other validator caller, `direct-wallet-payments.ts:1468-1469`, throws the message as a plain `Error`, and its route returns it as a 400 (`packages/cloud/api/crypto/direct-payments/route.ts:80-84`), so that path does not misclassify.\n\nThe repository error policy asks for typed errors and warns against branching on prose. This classification is an example: adding the third rejection message changed the error code without anyone touching the classifier.\n\n**To Reproduce**\n\nI mounted the real `packages/cloud/api/crypto/payments/route.ts` and called the real `cryptoPaymentsService.createPayment` from `packages/cloud/api` on `origin/develop` `4573712ebf`. Only session auth and the rate limiter were stubbed. `OXAPAY_MERCHANT_API_KEY` was set to a local placeholder so that `isOxaPayConfigured()` passes. `oxaPayService.createInvoice` was spied to throw, and it was never called.\n\n\u003cdetails\u003e\u003csummary\u003eProbe (scratch file \u003ccode\u003epackages/cloud/api/__tests__/zz-amount-probe.test.ts\u003c/code\u003e, not committed)\u003c/summary\u003e\n\n```ts\nprocess.env.DATABASE_URL = \"pglite://memory\";\nprocess.env.TEST_DATABASE_URL = \"pglite://memory\";\nprocess.env.NODE_ENV = \"test\";\nprocess.env.OXAPAY_MERCHANT_API_KEY = \"local-probe-placeholder\";\n\nconst organizationId = randomUUID();\nmock.module(\"@/lib/auth/workers-hono-auth\", () =\u003e ({\n  requireUserWithOrg: async () =\u003e ({ id: randomUUID(), organization_id: organizationId }),\n  requireUserOrApiKeyWithOrg: async () =\u003e ({ id: randomUUID(), organization_id: organizationId }),\n}));\nmock.module(\"@/lib/middleware/rate-limit-hono-cloudflare\", () =\u003e ({\n  moneyRateLimit: () =\u003e async (_c: unknown, next: () =\u003e Promise\u003cvoid\u003e) =\u003e next(),\n  rateLimit: () =\u003e async (_c: unknown, next: () =\u003e Promise\u003cvoid\u003e) =\u003e next(),\n  RateLimitPresets: { STRICT: {}, STANDARD: {} },\n}));\nconst { default: route } = await import(\"../crypto/payments/route\");\nconst { cryptoPaymentsService } = await import(\"@/lib/services/crypto-payments\");\nconst { oxaPayService } = await import(\"@/lib/services/oxapay\");\nconst invoice = spyOn(oxaPayService, \"createInvoice\").mockImplementation(async () =\u003e {\n  throw new Error(\"probe: no OxaPay invoice expected\");\n});\n\ntest(\"probe\", async () =\u003e {\n  for (const amount of [\"10.005\", 10.005, \"4.99\", \"1000.01\"]) {\n    const res = await route.request(\"/\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ amount }),\n    });\n    console.log(\"ROUTE\", JSON.stringify({ amount, status: res.status, body: await res.json() }));\n  }\n  for (const amount of [\"10.005\", Number.NaN, Number.POSITIVE_INFINITY, \"4.99\", \"1000.01\"]) {\n    const outcome = await cryptoPaymentsService.createPayment({ organizationId, amount }).then(\n      () =\u003e ({ resolved: true }),\n      (error: { code?: string; message?: string }) =\u003e ({ code: error.code, message: error.message }),\n    );\n    console.log(\"SERVICE\", JSON.stringify({ amount: String(amount), ...outcome }));\n  }\n  console.log(\"OXAPAY_INVOICE_CALLS\", invoice.mock.calls.length);\n  expect(invoice).not.toHaveBeenCalled();\n});\n```\n\n\u003c/details\u003e\n\nFrom `packages/cloud/api` (Bun 1.3.14, Node 24.15.0):\n\n```\n$ bun test --conditions=eliza-source __tests__/zz-amount-probe.test.ts --timeout 60000\nROUTE {\"amount\":\"10.005\",\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nROUTE {\"amount\":10.005,\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nROUTE {\"amount\":\"4.99\",\"status\":400,\"body\":{\"error\":\"Amount too small\"}}\nROUTE {\"amount\":\"1000.01\",\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nSERVICE {\"amount\":\"10.005\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"NaN\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"Infinity\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"4.99\",\"code\":\"AMOUNT_TOO_SMALL\",\"message\":\"Amount must be at least $5\"}\nSERVICE {\"amount\":\"1000.01\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must not exceed $1000\"}\nOXAPAY_INVOICE_CALLS 0\n 1 pass\n 0 fail\n```\n\n\u003cdetails\u003e\u003csummary\u003eRoute log for the \u003ccode\u003e10.005\u003c/code\u003e request (paths shortened)\u003c/summary\u003e\n\n```\n[Crypto Payments API] Create payment error: 315 |\n316 |     if (!validation.valid) {\n317 |       const errorCode = validation.error?.includes(\"at least\")\n318 |         ? \"AMOUNT_TOO_SMALL\"\n319 |         : \"AMOUNT_TOO_LARGE\";\n320 |       throw new CryptoPaymentError(errorCode, validation.error || \"Invalid amount\");\nCryptoPaymentError: Amount must be a finite USD amount in whole cents\n      at createPayment (packages/cloud/shared/src/lib/services/crypto-payments.ts:320:17)\n```\n\n\u003c/details\u003e\n\nA $10.005 request, which is below the $1,000 maximum, is answered \"Amount too large\". The error's own message says the actual problem is whole cents.\n\n**Expected behavior**\n\n- The validator returns a typed reason alongside its message, and the service maps that reason to a code without reading the message.\n- An amount that is not a finite whole-cent value gets its own code, for example `AMOUNT_INVALID`. The route answers 400 with a message that says what is wrong.\n- Below-minimum and above-maximum amounts keep `AMOUNT_TOO_SMALL` and `AMOUNT_TOO_LARGE`, with their current messages and 400 responses.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - API error classification with no rendered surface of its own. The UI only shows the route's `error` text in a toast. The route and service transcript above is the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface of its own; see the route and service transcript.\n- [x] Backend logs and frontend console/network logs when relevant: route log above; N/A for frontend (the UI does not branch on the code).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved.\n- [x] Domain artifacts when relevant: the HTTP status and body for each amount, and the `CryptoPaymentError` code and message from the real service, both in the transcript above.\n\n**Additional context**\n\n- The route's schema bounds (`route.ts:33-34`, $1 to $10,000) are looser than the service's limits ($5 to $1,000, `ORGANIZATION_CREDIT_CHECKOUT_LIMITS`). The service enforces the real bounds, so this report does not change them.\n- Because JSON cannot carry `NaN` or `Infinity`, the HTTP-reachable case is an amount with more than two decimal places. The same misclassification applies to any direct caller of `createPayment`.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"18:T2634,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nTwo replay defects remain in the durable connector hold after #32909 (head `bc812ab321`). Both are in `packages/cloud/services/gateway-webhook`, and both only affect Blooio and Twilio turns that the gateway has already acknowledged to the provider.\n\n1. **A non-retryable Cloud refusal is retried for the whole hold budget.** `redeliverHeldWebhook` re-holds every `PersonalSharedPreEgressError` (`src/webhook-handler.ts:949-956`). That includes failures that Cloud itself classified as `retryable: false`: a 4xx, or `X-Eliza-Retryable: false`, as read by `readPersonalSharedFailureMetadata` (`packages/cloud/services/_common/src/personal-shared-failure.ts:100-102`, `:127-132`). The refused turn is sent to Cloud again on every drain for `CUTOVER_HOLD_MAX_MS` (one hour). It is then logged as `Held personal connector turn exceeded the cutover budget`, with the stale `holdCode: personal_cutover_in_progress` and the operator action \"inspect the Dedicated target's attestation\". A first-delivery failure of the same kind is settled at once by `settleBackgroundDeliveryFailure`.\n2. **A delivered hold is replayed after its lease lapses.** `drainCutoverHolds` removes a settled record only while the lease still holds this drainer's token (`src/cutover-hold.ts:250`). Suppose renewal fails for a whole lease period and no other replica takes the lease. The turn is delivered and the ledger says `delivered`, but the record and its index entry stay. The next drain runs the Cloud turn and the provider send a second time.\n\n**To Reproduce**\n\nI ran the real handler and drainer (`handleWebhook`, `drainCutoverHolds`, `redeliverHeldWebhook`, `releaseExpiredHeldWebhook`) against a local `Bun.serve` stub of the Cloud personal-shared route and the in-memory Redis adapter (`MOCK_REDIS=1`, ioredis-mock). Only the Blooio provider API is substituted. The probe drives the same setup that `__tests__/cutover-hold.test.ts` uses. A signed Blooio webhook arrives while Cloud answers `503 personal_cutover_in_progress`, so the turn is held and the ledger is `held`. Then:\n\n- P2b: Cloud is attested. While the attested turn runs, the lease key is deleted (it expired with no new owner). The probe runs one drain, then a second drain.\n- P3: Cloud starts answering `400 {\"code\":\"invalid_request\"}` (`retryable: false`). The probe runs one drain at `now + 60s`, then a drain after the hold budget (`now + CUTOVER_HOLD_MAX_MS + 120s`).\n\n\u003cdetails\u003e\u003csummary\u003eProbe P2b and P3 (added to \u003ccode\u003e__tests__/\u003c/code\u003e of a checkout at \u003ccode\u003ebc812ab321\u003c/code\u003e)\u003c/summary\u003e\n\n`startCloud`, `holdOne`, `drainHandlers` and `providerSends` are the same helpers as in `__tests__/cutover-hold.test.ts`. `holdOne` sends one signed Blooio webhook and waits for the `held` ledger. The Cloud stub's `permanentStatus` returns that status with `{\"success\":false,\"code\":\"invalid_request\"}`.\n\n```ts\ntest(\"P2b a delivered outcome whose lease simply expired (no replacement) is replayed\", async () =\u003e {\n  const cloud = startCloud();\n  const redis = await holdOne(cloud, \"msg_probe_p2b\");\n  const dedupKey = \"webhook:blooio:msg_probe_p2b\";\n  const leaseKey = `webhook:cutover-hold-lease:${dedupKey}`;\n  const heldTurns = cloud.turns.length;\n  cloud.state.attested = true;\n  cloud.state.onAttestedTurn = async () =\u003e {\n    await redis.del(leaseKey);\n  };\n  const first = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 60_000 });\n  const ledgerAfterFirst = await redis.get(dedupKey);\n  cloud.state.onAttestedTurn = undefined;\n  const second = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 120_000 });\n  console.log(\"P2b\", JSON.stringify({ first, ledgerAfterFirst, second, turns: cloud.turns.length - heldTurns, sends: providerSends.length }));\n}, 60_000);\n\ntest(\"P3 a permanent non-hold Cloud 400 is retried until the hour budget, then released\", async () =\u003e {\n  const cloud = startCloud();\n  const redis = await holdOne(cloud, \"msg_probe_p3\");\n  const dedupKey = \"webhook:blooio:msg_probe_p3\";\n  cloud.state.permanentStatus = 400;\n  const retry = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 60_000 });\n  const ledgerAfterRetry = await redis.get(dedupKey);\n  const expired = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + CUTOVER_HOLD_MAX_MS + 120_000 });\n  const ledgerAfterExpiry = await redis.get(dedupKey);\n  console.log(\"P3\", JSON.stringify({ retry, ledgerAfterRetry, expired, ledgerAfterExpiry, sends: providerSends.length }));\n}, 60_000);\n```\n\n\u003c/details\u003e\n\nFrom `packages/cloud/services/gateway-webhook` (Bun 1.3.14, Node 24.15.0):\n\n```\n$ bun test --conditions=eliza-source __tests__/zz-review-probe.test.ts\nP2b {\"first\":{\"delivered\":0,\"rescheduled\":0,\"released\":0,\"expired\":0},\"ledgerAfterFirst\":\"delivered\",\"second\":{\"delivered\":1,\"rescheduled\":0,\"released\":0,\"expired\":0},\"turns\":2,\"sends\":2}\nP3 {\"retry\":{\"delivered\":0,\"rescheduled\":1,\"released\":0,\"expired\":0},\"ledgerAfterRetry\":\"held\",\"expired\":{\"delivered\":0,\"rescheduled\":0,\"released\":0,\"expired\":1},\"ledgerAfterExpiry\":null,\"sends\":0}\n 4 pass\n 0 fail\nRan 4 tests across 1 file. [9.48s]\n```\n\n\u003cdetails\u003e\u003csummary\u003eGateway logs for the two probes (abridged to the lines that matter)\u003c/summary\u003e\n\n```\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p2b\",\"heldForMs\":7,\"attempts\":1}\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p2b\",\"heldForMs\":11,\"attempts\":1}\n{\"level\":\"warn\",\"message\":\"Personal Shared Cloud attempt failed\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\",\"attempt\":1,\"status\":400,\"retryable\":false}\n{\"level\":\"error\",\"message\":\"Held personal connector turn exceeded the cutover budget\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\",\"holdCode\":\"personal_cutover_in_progress\",\"operatorAction\":\"inspect the Dedicated target's attestation; the turn was never executed\"}\n{\"level\":\"error\",\"message\":\"Background message processing failed\",\"error\":\"cutover hold expired\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\"}\n```\n\n\u003c/details\u003e\n\nP2b reports the same turn as delivered twice, with two Cloud turns and two provider sends. The first drain reports `delivered: 0`, although the ledger already reads `delivered`. P3 reschedules the refused turn instead of releasing it, and settles it only through the expiry path.\n\n**Expected behavior**\n\n- A redelivery that Cloud refuses with a non-retryable classification is settled at once, the same way the first background delivery settles it. `settleBackgroundDeliveryFailure` logs the failure at error level. Because no provider egress happened, it also reopens the dedup key. The drain reports `released: 1`, and later drains do nothing. Cutover holds and failures without a non-retryable classification (transport errors, 5xx) stay held, as #32909 intends.\n- A redelivery whose outcome is settled removes its record unless another replica now owns the lease. A lease that simply lapsed does not keep the record. P2b should give one Cloud turn and one provider send, with the first drain reporting `delivered: 1`.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - server-side gateway queue behaviour with no rendered surface; the probe transcript and gateway logs above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the probe transcript.\n- [x] Backend logs and frontend console/network logs when relevant: gateway logs above; N/A for frontend (no UI).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model call; the Cloud route is a local stub.\n- [x] Domain artifacts when relevant: the Redis ledger values and drain statistics in the probe transcript.\n\n**Additional context**\n\n- The #32909 review notes that the Telegram private no-reply failure (`src/webhook-handler.ts:1703-1705`, `retryable: false`) reaches this path. It does not in practice. Telegram webhooks return inside the Telegram branch (`src/webhook-handler.ts:630-713`) before the hold code (`:773-778`), so only Blooio and Twilio turns are ever held. The reachable cases are Blooio and Twilio turns that Cloud refuses with a 4xx or `X-Eliza-Retryable: false` after a hold.\n- A related case is not covered here. A different replica takes the lease mid-turn and then dies without draining (probe P2 in the #32909 review). The first drainer then correctly declines to remove the record, and it is replayed once that replica's lease lapses. Guarding against it would mean checking the dedup ledger before redelivery. It needs a lease stolen by a live owner, which lease renewal is designed to prevent.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"19:Tee6,"])</script><script>self.__next_f.push([1,"Agent clients need durable, owner-bound workflows and reviewed device operations that survive interruptions, reconnects and process restarts. This change adds generic runtime contracts and persistence for those flows, including managed Cloud Google delegation, hosted results and selected Maps reads.\n\n- Durable workflow authoring, validation, approval receipts, lifecycle changes and hosted delivery retain explicit approval and owner boundaries. Generic approval presentation is authoritative; legacy metadata remains a compatibility reader with downgrade rejection.\n- Device actions bind proposals, approval, claim and immutable receipts to authenticated owner, agent and device enrollment. Selected Maps reads require negotiated capability and matching target identity; replay retrieves the bounded historical result without a new device read.\n- Managed Cloud owner configuration and Google delegation provide identity and Gmail/Calendar access boundaries with server-side credentials and scope checks.\n- Action discovery retains umbrella actions when a resource-specific alias matches, preserving role and context eligibility.\n- Workflow mutation replies carry canonical receipts from the actual committed definition. Cancellation provenance is captured under the row lock, with per-service workflow control serialization. Submission, cancellation requests and pending device approvals cannot serve as proof that the requested operation completed. Pending workflow widgets retain their callback delivery.\n\nValidation at prior head 252152eaa0352fd26f4824371e967bbf4e828bfd:\n\n- Focused workflow SQL/worker/settlement/evaluator/parser checks: 7 tests and 243 assertions passed; workflow typecheck and lint passed.\n- Device HTTP/PGlite lifecycle and evaluator checks passed, including refusal of false completion claims for pending approval, unknown outcomes and selected reads; assistant and agent typechecks passed.\n- Independent source review found no remaining blocker in the receipt correction. Cancellation serialization is per service instance; it is not a cross-process SQLite guarantee.\n- Full frozen installation, all284 standard root tasks and audits, emitted host build, twelve compiler cases, packaged Reminder flow and import guard passed with unchanged source. The original aggregate run failed on an unexplained cancellation HTTP reset. Separate unchanged-source workflow recovery passed31/31 files and167 tests; that original failure remains recorded.\n- The separately enabled historical compiler-upgrade E2E passed24 assertions with historical source and current dependencies.\n- Actual Cerebras qwen-3.8-27b chat completed with seven model calls, created one inactive unscheduled workflow, then a manually reviewed source was explicitly approved and executed once to return56. Removal preserved canonical approval/execution/lifecycle receipts, confirmed by fresh readback. This is local synthetic workflow acceptance.\n\nHosted CI36908850398 completed successfully at exact head252152eaa0352fd26f4824371e967bbf4e828bfd, including source/build checks, billing replay and PostgreSQL.\n\nNative paired Maps flows, Cloud login/Gmail revocation and physical-device acceptance remain pending. This draft does not establish complete MVP or deployment acceptance.\n\nCurrent head ab8f9a7110ae adds one bounded correction for model-authored invalid source quotes before any response field or action effects. The exact source validator remains unchanged; a repeated invalid reply fails closed. Actual HTTP/auth/PGlite/planner tests pass four cases, including one pending Maps proposal with rejected draft facts absent from storage. Sixteen owning pipeline cases, production and test-inclusive typechecks and formatting checks pass. Full exact-head qualification and live provider/native acceptance are pending.\n"])</script><script>self.__next_f.push([1,"1a:T2552,"])</script><script>self.__next_f.push([1,"## Summary\n\nThis PR implements the code findings from the compliance research review (`compliance-research-2026-09-18`) across core, agent, cloud and app/ui, re-checked against HEAD. It also removes about 2,500 lines of dead or duplicate code.\n\n### core\n- A typed modality table drives PII swap and binary/text handling. `TEXT_EMBEDDING_BATCH`, `TEXT_TO_SPEECH` and `PII_SCRUB` are no longer pseudonymized.\n- A host-only processing policy extends `ConfidentialInferenceAuthority`. It admits each attempt before the secret/PII swap, the hooks and the handler.\n  - A denial is terminal: it never fails over, the embedding queue doesn't retry it, and it isn't retryable when a model call inside an action handler raises it.\n  - The policy sees the model type the caller asked for, before any LLM-mode override.\n  - With no policy installed, behavior is unchanged.\n- `runActionsByMode` and plugin-assistant plan steps now settle through the action gate (`settleActionHandler`).\n- Removed, with zero in-repo callers: the `zod-schema.agent-runtime` subpath, `ToolPolicyService` / `getFilteredActions` / `isActionAllowed`, 17 private model wrappers in `runtime.ts`, and duplicate helpers. `canonicalJson` and `parseBooleanFromText` now each have one implementation. The shared canonical backup JSON rejects sparse array holes.\n\n### agent\n- `ELIZA_PROTECTED_PROFILE=dstack-cpu` (captured from the process env at entry) runs admission before config load, vault hydration, API listen and plugin resolution.\n- `ELIZA_TEE_*`, `ELIZA_DSTACK_*`, `ELIZA_CONFIDENTIAL_*` and `ELIZA_PROTECTED_*` are env-only. They are blocked from config and API env writes, and the state-dir `config.env` can't apply or persist them either.\n- Evidence-factory registration is refused under the profile.\n- Audit sinks are async, and a failure in a required sink now rejects. Retention never deletes audit log types. Confidential-runtime schema is v2.\n\n### cloud\n- API key create, delete, regenerate and mobile revoke write their audit event in the same transaction. A sink failure rolls the change back.\n  - An oversized client `X-Request-Id` is dropped from the event instead of failing the write.\n- PII scrub markers record their inspection scope (migration `0506`).\n- There is a single retryable provider-fallback middleware with a `ProviderFallbackPolicy` hook. A refusal throws `PROVIDER_FALLBACK_REFUSED`.\n- With `FIELD_ENCRYPTION_REQUIRED`, agent env secrets no longer fall back to plaintext. `FIELD_ENCRYPTION_REQUIRE_AAD` is documented as off until writers pass coordinates.\n- New `user_consents` table (migration `0507`) with `GET`/`POST /api/v1/me/consents` for `vision_capture`. GET also returns `effective` (the enforced policy, with `basis` and `defaultGranted`) and `capture.modelCallRecording` (the deployment's recording policy).\n  - There's a user-scoped live `POST /api/v1/me/data-export` that requires a recent login.\n- A single `getRequestIp` helper (`cf-connecting-ip` first) serves all webhooks. Expired `auth_events` are purged.\n\n### app / ui\n- There is one session-cookie parser: identical duplicate cookies are accepted, conflicting ones rejected.\n- Logout revokes every presented session credential, including conflicting duplicates, and also expires the `Domain` variant.\n- Revoking a session closes its open WebSockets (1008). Admission re-reads the session after binding, so a revoke that races the handshake can't leave a socket open.\n- The privacy panel shows the deployment's model-call recording policy (read-only) and leaves vision/screen capture to device permissions. It uses the live export endpoint.\n- Removed the dead first-run fork, update policy, `api/response` and `globals` shims.\n\n### Review feedback addressed\n- Migration collisions: renumbered to `0506_pii_scrub_markers_inspection_scope`, `0507_user_consents` and `0508_app_notification_secret_envelope_v2`. These are the filenames present in the current branch.\n- The sparse-array bug in canonical backup JSON is fixed.\n- The consents API exposes the effective policy and default, as distinct from an explicit grant.\n\n### Model-call recording, session controls and attestation\n**Recording (no consent; off in production):**\n- The cloud records billed model calls under one policy: `LLM_TRAJECTORY_CAPTURE=on|off`, otherwise off in production and on elsewhere. The `trajectory_training` consent purpose is removed.\n- Payloads never go to the public `BLOB` bucket. They use a dedicated private store when one is bound, otherwise Postgres.\n- Bodies are encrypted with row-bound org field encryption.\n- `LLM_TRAJECTORY_RETENTION_DAYS` (default 90) sets retention, enforced by a daily purge.\n- Account deletion removes payload objects by org prefix, orphans included.\n- The agent's trajectory gate defaults off under `ELIZA_PROTECTED_PROFILE`. Operators can still enable it inside the TEE.\n\n**Session and data safeguards:**\n- **Automatic logoff:** the protected profile gets a 30-minute idle logoff and a 12h absolute cap. `ELIZA_SESSION_IDLE_MINUTES` sets the idle window in any profile. The idle window slides only on real user activity (`x-eliza-last-activity` from the shared UI clients, allowed in CORS for remote agents), never on background polling or sockets.\n- **Password change:** revokes every other session and closes its sockets.\n- **Auth store:** row counts no longer assume success.\n- **Media:** under the protected profile, media is served only after authentication. Same-origin cookie auth keeps `\u003cimg\u003e`/`\u003caudio\u003e` working.\n- **Field encryption:**\n  - Row-bound writes use an `enc:v2` envelope that authenticates its AAD flag.\n  - Unbound writes keep the legacy v1 bytes for old readers.\n  - `SECRETS_MASTER_KEY_PREVIOUS` plus a guarded DEK rewrap enable master-key rotation.\n  - Migration `0508` lets the billing notification guard accept v2.\n- **Audit logs:** the audit-log purge cron now actually runs (7-year retention).\n\n**Attestation implementation and emulator validation (hardware acceptance pending):**\n- **In-repo verification:** dstack v1 attestations and TDX v4/v5 quotes are parsed in-repo. The raw report_data binding, the TD debug bit, the quote's self-signature and register agreement are checked independently of the pinned external verifier.\n- **Hardware-free harness:** a fake guest-agent socket, a pinned stub verifier and an NRAS emulator drive the real admission code to success and through a rejection matrix. The matrix includes dstack simulator output.\n- **GPU attestation:** NVIDIA confidential-GPU attestation goes through NRAS, and the ES384 EAT tokens are verified locally against NVIDIA's CA. GPU claims can only come from verified evidence bound to the TDX nonce.\n- **Key release:** the agent appraises its own evidence before trusting any KMS. A dstack `GetKey` client verifies the KMS signature chain to a pinned root.\n- **Satisfiable topologies:** the state-volume, `tdx-cpu` and GPU weight topologies and the dstack cloud inference profile require only claims that dstack and NRAS evidence actually establish.\n- **Test lanes:** `test:tee:dstack` (hardware-free) and `test:tee:dstack-live`, which is opt-in for a real CVM, the dstack simulator and H100 CC GPUs.\n\nThe model-weight unseal helpers are available, but the production model loader does not yet call `prepareConfidentialModelWeights`. This PR does not establish encrypted-weight loading in the shipped inference path or regulatory compliance.\n\n**Deploy order:**\n- Apply migration `0508` before deploying the Worker. Billing notification secrets are written as `enc:v2`.\n- Roll out readers before relying on `SECRETS_MASTER_KEY_PREVIOUS`.\n\n### Follow-ups\n- **Processing policy:** before any host installs a policy, first-party actions need an `egress` declaration, including `egress: []` for the security evaluator hook. Otherwise every action is denied as `destination_undeclared`. No host installs a policy today.\n- **PII swap:** it now skips `TEXT_TO_SPEECH` and `PII_SCRUB`, so a remote TTS provider receives real names. Confirm this is intended, or scope the skip to local providers.\n- **`FIELD_ENCRYPTION_REQUIRE_AAD`:** it stays off until agent env secrets can be row-bound. They are encrypted before their row id exists.\n- **Real hardware:** running `test:tee:dstack-live` on a dstack TDX CVM (and an H100 CC GPU) needs infrastructure.\n\n## Verification (Node 24.15.0, Bun 1.4.2, merged with develop `4778fe302d5`)\n- Root `bun run verify` passes on the merged tree (284/284 turbo tasks, all audits).\n- core: full suite earlier in this PR; `trajectory-gate` passes (5).\n- cloud-shared: 56 targeted tests pass: capture policy, trajectory storage and encryption, field encryption, account-deletion payloads and adapters, fallback policy, PII scrub. The 15 app-billing/generic-billing Postgres suites pass (45 pass; the rest skip without a live Postgres).\n- cloud-api: consents/export, API-key audit transaction and PII scrub route pass (13).\n- ui: account-security, auth/activity and client tests pass (77 before the final merge; account-security 52 after it).\n- app: auth store, session idle/protected-profile/cookie, browser-session WebSocket and password-change revocation pass (52).\n- agent (real end-to-end): TDX/dstack admission, protected profile, GPU attestation, live lane (skipped without hardware), protected media, media capability, TEE env boundary and audit durability pass (10 files). `scripts/tee-full-stack-local.ts` passes.\n- `check-migration-prefix-order` passes. The router was regenerated.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\n"])</script><script>self.__next_f.push([1,"1b:T1376,"])</script><script>self.__next_f.push([1,"This PR fixes the behavior bugs from the core/agent/app quality review (report §3). It includes only bugs that need **no owner decision** and **do not overlap** the unmerged `shaw/agent-framework-review-refactor-e7a9a1` branch. Each fix is its own commit with a regression test that fails on the old code and passe tes removed from `voice-gate.ts` (#34); the reasoning filter covers all 7 canonical tags (#35).\n- mobile/embed: repeated warm deep links apply (#46), and embed auth failures are logged (#47).\n- app api: a key the user types beats an env key (#49).\n- steward: a 409 tenant-exists response now stops with a typed recovery error (#50).\n- electrobun: the updater no longer owns the menu dispatcher, and event cursors page forward (#51, #52).\n- electrobun: one desktop env-flag parser (#53).\n- CLI: honest exit codes for update, doctor and auth; canonical config writes; phantom pool fields dropped (#54, #57).\n- app: the browser barrel re-exports ui's canonical `AppWindowRenderer`, and the dead fork is deleted (#56).\n- benchmarks: recall-bench and entity-voice-bench import from their plugin homes (#58).\n- agent: dead `shouldReject` branch removed from the context inspector (#59).\n\n**Build / release tooling**\n- The gateway maintainer deploys only on the explicit drift exit code 3 (#60).\n- Device leases are written atomically (#61).\n- apk extract failures propagate (#62).\n- `sleepSync` is defined (#24).\n- `clean-repo` removes homepage outputs (#26).\n- The voice catalog fails closed and the default id is `same` (#36).\n- The walkthrough, fused-lib, libllama, iOS smoke and patch-deps scripts fail closed (#63, #64, #66–#68).\n- The renderer shares the LP3/VPS flag predicates with the native build policy (#65).\n\n## Behavior changes to review\n- `resolveActivePgliteDataDir` (agent `runtime/eliza.ts`) is now exported and gives `config.database.pglite.dataDir` precedence over `PGLITE_DATA_DIR`, matching `applyDatabaseConfigToEnv`. This file is also edited on the agent-framework branch, so expect a small merge.\n- Desktop flags now honor `on`/`off`/`yes`/`no`. An unrecognized value keeps the default and logs a warning.\n- Cloud log redaction output differs slightly. Cycles now show as `[Circular]`, and a PEM block masks to `***`. It masks the same or more than before.\ uild) fails on `@elizaos/plugin-elizacloud#build` with the locally installed Bun 1.4.0 (repo CI pins Bun 1.4.2); the scoped package gates above (typecheck, lint, targeted and full plugin-openai suite, develop-head regression test) were run instead, and the canonical CI lane will run the full verification on this PR.\n- The unrelated `cloud / agent-stability / deterministic-keyless` failure in the same develop run is not addressed here (separate stability-lane/artifact-permission failure).\n\n## Deployment\n\nNone — no schema, migration, or config changes; behavior restores the pre-#32991 treatment of strict-wire null artifacts at the provider boundary.\n"])</script><script>self.__next_f.push([1,"2a:T5e5,"])</script><script>self.__next_f.push([1,"## Summary\nResolves #30590. Fresh PR ported to the current package layout (`packages/core/src/utils/assistant-text.ts`), superseding #30620 following package restructure triage feedback from @lalalune.\n\nWhen `stripAssistantStageDirections` strips roleplay stage directions (such as `*smiles*` or `*sighs*`), the subsequent spacing normalization previously collapsed leading whitespace with `\\n[ \\t]+/g`, destroying code formatting and indentation inside fenced code blocks.\n\n### Changes\n1. **CommonMark-compliant Fenced Code Block Scanner** (`packages/core/src/utils/assistant-text.ts`):\n   - Implements delimiter matching for both backtick and tilde fences (\u003e= 3).\n   - Normalizes stage directions and spacing exclusively in prose segments while preserving fenced code blocks byte-for-byte without placeholders or sentinel tokens.\n   - Respects container-relative closing fence indentation (CommonMark ?4.5, Example 137).\n   - Preserves indentation in streaming / unterminated code blocks.\n2. **Deduplication in Agent Host** (`packages/agent/src/api/chat-text-helpers.ts`):\n   - Re-exports `stripAssistantStageDirections` directly from `@elizaos/core`, eliminating duplicated logic in the agent host.\n3. **Comprehensive Unit Test Suite** (`packages/core/src/utils/assistant-text.test.ts`):\n   - Adds unit tests verifying code indentation preservation, list-nested code blocks, comments with stage direction words inside code blocks, blockquotes, streaming code blocks, and Example 137 false closer scenarios."])</script><script>self.__next_f.push([1,"2b:T1014b,"])</script><script>self.__next_f.push([1,"Bumps the dev-dependencies group with 8 updates:\n\n| Package | From | To |\n| --- | --- | --- |\n| [@vitest/coverage-v8](https://github.com/vitest-dev/vitest/tree/HEAD/packages/coverage-v8) | `5.0.1` | `5.0.2` |\n| [jsdom](https://github.com/jsdom/jsdom) | `29.1.1` | `30.1.1` |\n| [turbo](https://github.com/vercel/turborepo) | `2.11.3` | `2.11.4` |\n| [vitest](https://github.com/vitest-dev/vitest/tree/HEAD/packages/vitest) | `5.0.1` | `5.0.2` |\n| [@typescript-eslint/parser](https://github.com/typescript-eslint/typescript-eslint/tree/HEAD/packages/parser) | `8.70.0` | `8.70.1` |\n| [prettier](https://github.com/prettier/prettier) | `3.9.8` | `3.9.9` |\n| [postal-mime](https://github.com/postalsys/postal-mime) | `3.0.0` | `4.0.0` |\n| [rollup](https://github.com/rollup/rollup) | `4.63.4` | `4.63.5` |\n\nUpdates `@vitest/coverage-v8` from 5.0.1 to 5.0.2\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitest-dev/vitest/releases\"\u003e@​vitest/coverage-v8's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev5.0.2\u003c/h2\u003e\n\u003ch3\u003e   🐞 Bug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eBind \u003ccode\u003eprocess\u003c/code\u003e in case global is overwritten  -  by \u003ca href=\"https://github.com/AriPerkkio\"\u003e\u003ccode\u003e@​AriPerkkio\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/vitest-dev/vitest/issues/11343\"\u003evitest-dev/vitest#11343\u003c/a\u003e \u003ca href=\"https://github.com/vites ://github.com/vitest-dev/vitest/commit/4e91e5668\"\u003e\u003c!-- raw HTML omitted --\u003e(4e91e)\u003c!-- raw HTML omitted --\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003espy\u003c/strong\u003e:\n\u003cul\u003e\n\u003cli\u003eFix stack overflow when spying \u003ccode\u003eSet.prototype.add\u003c/code\u003e  -  by \u003ca href=\"https://github.com/fengmk2\"\u003e\u003ccode\u003e@​fengmk2\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/vitest-dev/vitest/issues/11299\"\u003evitest-dev/vitest#11299\u003c/a\u003e \u003ca href=\"https://github.com/vitest-dev/vitest/commit/a0a939653\"\u003e\u003c!-- raw HTML omitted --\u003e(a0a93)\u003c!-- raw HTML omitted --\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eui\u003c/strong\u003e:\n\u003cul\u003e\n\u003cli\u003ePersist authentication cookie beyond current browser session  -  by \u003ca href=\"https://github.com/hi-ogawa\"\u003e\u003ccode\u003e@​hi-ogawa\u003c/code\u003e\u003c/a\u003e, \u003cstrong\u003eHiroshi Ogawa\u003c/strong\u003e and \u003cstrong\u003eOpenCode (gpt-5.6-sol)\u003c/strong\u003e in \u003ca href=\"https://redirect.github.com/vitest-dev/vitest/issues/11066\"\u003evitest-dev/vitest#11066\u003c/a\u003e \u003ca href=\"https://github.com/vitest-dev/vitest/commit/f88195e16\"\u003e\u003c!-- raw HTML omitted --\u003e(f8819)\u003c!-- raw HTML omitted --\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch5\u003e    \u003ca href=\"https://github.com/vitest-dev/vitest/compare/v5.0.1...v5.0.2\"\u003eView changes on GitHub\u003c/a\u003e\u003c/h5\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitest-dev/vitest/commit/428e2e5043c64635b6b157358bde2fdeaa7b6b3a\"\u003e\u003ccode\u003e428e2e5\u003c/code\u003e\u003c/a\u003e chore: release v5.0.2 (\u003ca href=\"https://github.com/vitest-dev/vitest/tree/HEAD/packages/coverage-v8/issues/11357\"\u003e#11357\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/vitest-dev/vitest/commits/v5.0.2/packages/coverage-v8\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `jsdom` from 29.1.1 to 30.1.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/jsdom/jsdom/releases\"\u003ejsdom's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev30.1.1\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed spurious window \u003ccode\u003eblur\u003c/code\u003e and \u003ccode\u003efocusout\u003c/code\u003e events and incorrect \u003ccode\u003eevent.relatedTarget\u003c/code\u003e values when focusing an element after removing the previously focused element, which regressed in v30.1.0. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed focus and blur behavior across frames, and focusing the document's viewport through \u003ccode\u003edocument.documentElement.focus()\u003c/code\u003e. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed focus targets removed or disabled by \u003ccode\u003eblur\u003c/code\u003e listeners becoming active, and text selections made by focus and blur listeners being overwritten. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003eelement.focus()\u003c/code\u003e incorrectly focusing disabled form controls and \u003ccode\u003e\u0026lt;input type=\u0026quot;hidden\u0026quot;\u0026gt;\u003c/code\u003e elements with \u003ccode\u003etabindex=\u0026quot;\u0026quot;\u003c/code\u003e. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed invalid \u003ccode\u003estyle.setProperty()\u003c/code\u003e calls changing existing \u003ccode\u003e!important\u003c/code\u003e priorities, serialized styles, or mutation records. (\u003ca href=\"https://github.com/FedgeNo\"\u003e\u003ccode\u003e@​FedgeNo\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003e!important\u003c/code\u003e handling when updating CSS longhands after shorthands, using variables or CSS-wide keywords, and assigning style properties directly. (\u003ca href=\"https://github.com/FedgeNo\"\u003e\u003ccode\u003e@​FedgeNo\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003e\u0026lt;noscript\u0026gt;\u003c/code\u003e parsing with \u003ccode\u003eincludeNodeLocations: true\u003c/code\u003e or inside frames to honor the \u003ccode\u003erunScripts\u003c/code\u003e option.\u003c/li\u003e\n\u003cli\u003eFixed the \u003ccode\u003estorageQuota\u003c/code\u003e option being ignored by frames.\u003c/li\u003e\n\u003cli\u003eFixed encoding detection of HTML and XML byte input to honor XML encoding declarations and detect UTF-16 without a byte order mark.\u003c/li\u003e\n\u003cli\u003eFixed exceptions caused by truncated \u003ccode\u003echarset\u003c/code\u003e parameters in \u003ccode\u003e\u0026lt;meta\u0026gt;\u003c/code\u003e elements, and encoding detection incorrectly using incomplete \u003ccode\u003e\u0026lt;meta\u0026gt;\u003c/code\u003e tags. (\u003ca href=\"https://github.com/FedgeNo\"\u003e\u003ccode\u003e@​FedgeNo\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed XML serialization errors for namespaces named \u003ccode\u003econstructor\u003c/code\u003e, \u003ccode\u003etoString\u003c/code\u003e, \u003ccode\u003e__proto__\u003c/code\u003e, or \u003ccode\u003e\u0026quot;null\u0026quot;\u003c/code\u003e, and incorrect reuse of namespace prefixes declared on sibling elements.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003eelement.innerHTML\u003c/code\u003e and \u003ccode\u003eelement.outerHTML\u003c/code\u003e in XML documents to reject invalid characters in attribute values and avoid stack overflows on large strings.\u003c/li\u003e\n\u003cli\u003eFixed selector matching for \u003ccode\u003e:lang()\u003c/code\u003e, \u003ccode\u003e:nth-child(... of ...)\u003c/code\u003e after mutations, and \u003ccode\u003e:has()\u003c/code\u003e with duplicate IDs or nested logical pseudo-classes. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev30.1.0\u003c/h2\u003e\n\u003cp\u003ejsdom is feeling the AGI!\u003c/p\u003e\n\u003cp\u003eThis release is dedicated to \u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, who unleashed \u003ca href=\"https://github.com/codex\"\u003e\u003ccode\u003e@​codex\u003c/code\u003e\u003c/a\u003e upon jsdom and found tons of performance improvements. Along the way, he found and fixed many correctness issues as well.\u003c/p\u003e\n\u003cp\u003eWe really appreciate his thoughtful PRs, which did a great job following the project's contribution guidelines, and were clearly human-curated, with their PR descriptions edited to be brief and respectful of the maintainers' time.\u003c/p\u003e\n\u003cp\u003eThanks to \u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, as well as all the other contributors of this release (most of whom were AI-assisted).\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAdded named access to elements on \u003ccode\u003edocument\u003c/code\u003e, such as \u003ccode\u003edocument.myForm\u003c/code\u003e for \u003ccode\u003e\u0026lt;form name=\u0026quot;myForm\u0026quot;\u0026gt;\u003c/code\u003e. (\u003ca href=\"https://github.com/vojtisprime11\"\u003e\u003ccode\u003e@​vojtisprime11\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003eQuotaExceededError\u003c/code\u003e, including its use for storage quota errors and oversized \u003ccode\u003ecrypto.getRandomValues()\u003c/code\u003e requests.\u003c/li\u003e\n\u003cli\u003eAdded support for the relaxed DOM naming rules when creating elements, attributes, and document types.\u003c/li\u003e\n\u003cli\u003eImproved performance of DOM construction, tree mutations, range operations, and live collection access, especially on large documents. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://github.com/erezrokah\"\u003e\u003ccode\u003e@​erezrokah\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eImproved performance of \u003ccode\u003egetComputedStyle()\u003c/code\u003e, style changes, and CSS serialization. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://github.com/jhult\"\u003e\u003ccode\u003e@​jhult\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eImproved performance of event dispatch, form control and label lookups, and updates to \u003ccode\u003e\u0026lt;select\u0026gt;\u003c/code\u003e elements and radio button groups. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eReduced memory use when creating and working with DOM nodes, attributes, event listeners, and mutation observers. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eChanged \u003ccode\u003ewindow.close()\u003c/code\u003e to preserve access to the document and its DOM through retained references.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003eelement.querySelectorAll()\u003c/code\u003e returning no matches when the first part of the selector matches the element itself, which regressed in v30.0.0. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed case sensitivity in CSS attribute selectors, including selectors matching \u003ccode\u003edata-state=\u0026quot;\u0026quot;\u003c/code\u003e, \u003ccode\u003etitle=\u0026quot;\u0026quot;\u003c/code\u003e, and other case-sensitive values. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003edocument.querySelector()\u003c/code\u003e failing to find a matching element when an earlier element has the same ID but does not match the rest of the selector. (\u003ca href=\"https://github.com/vojtisprime11\"\u003e\u003ccode\u003e@​vojtisprime11\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003e:focus\u003c/code\u003e matching in shadow trees. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed DOM insertion and replacement, including valid \u003ccode\u003edocument.replaceChildren()\u003c/code\u003e calls, invalid document element and doctype placements, and mutations during \u003ccode\u003eelement.replaceWith()\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eFixed the ordering of script execution, custom element callbacks, iframe loading, and mutation observer notifications during DOM insertion, including in shadow trees.\u003c/li\u003e\n\u003cli\u003eFixed queued events and navigation continuing after \u003ccode\u003ewindow.close()\u003c/code\u003e or iframe removal, and prevented new scripts, resource loads, timers, and animation frames from starting in destroyed documents. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed parent documents waiting indefinitely for loading to finish when a child iframe removes itself during loading.\u003c/li\u003e\n\u003cli\u003eFixed request cancellation across redirects, during pending \u003ccode\u003erequestInterceptor()\u003c/code\u003e callbacks, and when reusing an \u003ccode\u003eXMLHttpRequest\u003c/code\u003e after aborting it.\u003c/li\u003e\n\u003cli\u003eFixed resource loading and \u003ccode\u003eJSDOM.fromURL()\u003c/code\u003e potentially hanging when response handling throws and response stream cleanup does not finish.\u003c/li\u003e\n\u003cli\u003eFixed successful cached resource loads being treated as aborted.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e and \u003ccode\u003edocument.styleSheets\u003c/code\u003e using the wrong stylesheet order after inserting or updating \u003ccode\u003e\u0026lt;style\u0026gt;\u003c/code\u003e elements.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e ignoring nested \u003ccode\u003e@import\u003c/code\u003e and \u003ccode\u003e@media\u003c/code\u003e rules in imported stylesheets, and returning stale results after imports finish loading.\u003c/li\u003e\n\u003cli\u003eFixed style invalidation, stylesheet removal, and frame source updates in shadow trees.\u003c/li\u003e\n\u003cli\u003eFixed repeated \u003ccode\u003egetComputedStyle()\u003c/code\u003e calls changing case-sensitive background URLs, and inconsistent resolution of border shorthands containing system colors. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed computed border widths, including borderless elements incorrectly reporting \u003ccode\u003e16px\u003c/code\u003e, which regressed in v30.0.0. (\u003ca href=\"https://github.com/Alberto-BaseNet\"\u003e\u003ccode\u003e@​Alberto-BaseNet\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e to resolve \u003ccode\u003e'font-weight'\u003c/code\u003e keywords to numeric values. (\u003ca href=\"https://github.com/tianrking\"\u003e\u003ccode\u003e@​tianrking\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e to convert lengths to pixels inside CSS math functions containing percentages, and to resolve percentages in \u003ccode\u003e'font-size'\u003c/code\u003e math functions. (\u003ca href=\"https://github.com/soroushm\"\u003e\u003ccode\u003e@​soroushm\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/0a117f4581b067800fdb3287e22e7cec82221a3c\"\u003e\u003ccode\u003e0a117f4\u003c/code\u003e\u003c/a\u003e 30.1.1\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/103f67df7bb94971e111902e6b10bb500d7818a2\"\u003e\u003ccode\u003e103f67d\u003c/code\u003e\u003c/a\u003e Remove unnecessary window cleanup from API tests\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/cdda00a1c075548c62907cc76f26e93a4be1afac\"\u003e\u003ccode\u003ecdda00a\u003c/code\u003e\u003c/a\u003e Test HTTP/2 document and subresource loading\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/7ab92ce05b97b62286f1c9a4870a924ef4315a44\"\u003e\u003ccode\u003e7ab92ce\u003c/code\u003e\u003c/a\u003e Update \u003ccode\u003e@​asamuzakjp/dom-selector\u003c/code\u003e to v9.2.1\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/d940c206bcda5d43e92556d08fcb6a11960df148\"\u003e\u003ccode\u003ed940c20\u003c/code\u003e\u003c/a\u003e Share jsdom settings across descendant windows\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/6ba40cbea8d9ffcf08e3ce901cf432578166439d\"\u003e\u003ccode\u003e6ba40cb\u003c/code\u003e\u003c/a\u003e Fix and simplify option propagation\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/3b3be70acc9a7e5165ecaf90853b5197f5930e5a\"\u003e\u003ccode\u003e3b3be70\u003c/code\u003e\u003c/a\u003e Preserve CSS priorities across declaration updates\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/97b275821659e818044630e737fc2f6013ca4b6b\"\u003e\u003ccode\u003e97b2758\u003c/code\u003e\u003c/a\u003e Align focusing and unfocusing with HTML\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/b7b460bf473ea98557ad46748fb11e97d238ab81\"\u003e\u003ccode\u003eb7b460b\u003c/code\u003e\u003c/a\u003e Update w3c-xmlserializer to v6\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/71d562f858a48020dda69ab29c582394c3033573\"\u003e\u003ccode\u003e71d562f\u003c/code\u003e\u003c/a\u003e Update html-encoding-sniffer to v7\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/jsdom/jsdom/compare/v29.1.1...v30.1.1\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `turbo` from 2.11.3 to 2.11.4\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vercel/turborepo/releases\"\u003eturbo's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eTurborepo v2.11.4\u003c/h2\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003ch3\u003eChangelog\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003efix: Re  href=\"https://github.com/prettier/prettier/commit/cdd17f2288b28b170a76416c72dac56e3ea5daff\"\u003e\u003ccode\u003ecdd17f2\u003c/code\u003e\u003c/a\u003e Release 3.9.9\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/dc7b8968e678f51ea00e2be3fe8c717d114691a3\"\u003e\u003ccode\u003edc7b896\u003c/code\u003e\u003c/a\u003e Disable \u003ccode\u003esingleDollarTextMath\u003c/code\u003e in \u003ccode\u003emdast-util-math\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/prettier/prettier/issues/20140\"\u003e#20140\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/f9be58fb8ec62dd47197ea19a30aac5ad26dfee0\"\u003e\u003ccode\u003ef9be58f\u003c/code\u003e\u003c/a\u003e Git blame ignore 3.9.8\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/88470cb79ca3b757dd6b93906d9a992aa1a456c3\"\u003e\u003ccode\u003e88470cb\u003c/code\u003e\u003c/a\u003e Bump Prettier dependency to 3.9.8\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/9559cab39eb5082c99a27e8829760c055adba841\"\u003e\u003ccode\u003e9559cab\u003c/code\u003e\u003c/a\u003e Clean changelog_unreleased\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/4fc8ee87465de8d54780273a6996d74e8e9da827\"\u003e\u003ccode\u003e4fc8ee8\u003c/code\u003e\u003c/a\u003e Update dependents count\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/prettier/prettier/compare/3.9.8...3.9.9\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `postal-mime` from 3.0.0 to 4.0.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/postalsys/postal-mime/releases\"\u003epostal-mime's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.0.0\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/compare/v3.0.1...v4.0.0\"\u003e4.0.0\u003c/a\u003e (2026-09-26)\u003c/h2\u003e\n\u003ch3\u003e⚠ BREAKING CHANGES\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eNode.js 20 or newer is required.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAttachment.disposition\u003c/code\u003e is typed as \u003ccode\u003eAttachmentDisposition | null\u003c/code\u003e, which accepts any Content-Disposition token, instead of \u003ccode\u003e'attachment' | 'inline' | null\u003c/code\u003e. The parsed output is unchanged, but code that assigns the value to the narrower type has to widen it.\u003c/li\u003e\n\u003cli\u003ethe ES module entry point moved from src/postal-mime.js to dist/esm/postal-mime.js, so browser code that imported the file from node_modules directly has to use the new path. Consumers that import \u003ccode\u003epostal-mime\u003c/code\u003e by name are unaffected.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eFeatures\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003econvert to TypeScript and ship ES module and CommonJS builds (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/2559c820af2553d9166af586868ec636ea69e820\"\u003e2559c82\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003edeclare the CommonJS entry point with export = and ship source maps (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/84d11596d8fcf667de7805c1e46a98d7734786b1\"\u003e84d1159\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003etype the attachment disposition as the token the message carries (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/4bb27965cb1c39981d1571c082b353085288df6c\"\u003e4bb2796\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ekeep the public object types assignable to an index signature (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/336303952f3862f4397f58abf7f586de659f93d3\"\u003e3363039\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eMiscellaneous Chores\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003erequire Node.js 20 or newer (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/21eaae6553102e955c7de01f74a0deb7022d5990\"\u003e21eaae6\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev3.0.1\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/compare/v3.0.0...v3.0.1\"\u003e3.0.1\u003c/a\u003e (2026-09-25)\u003c/h2\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ecollect parsed addresses in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/68cd065f92c2cb64227b91cab7ba1409d89b9824\"\u003e68cd065\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003econvert html to text in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/38b2a839ca1f83bf570f7628375c1330f4495aef\"\u003e38b2a83\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003edetect angle bracket addresses in decoded words in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/390be2b4395ff46458ff7b8bf3d148d1e0997e0e\"\u003e390be2b\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003enormalize calendar attachment line endings in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/36edda70629074622a6b8d1529b2366ff2cfa71d\"\u003e36edda7\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003estrip header comments in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/com ailure. It does not reconstruct an already-missing recovery record, widen recovery eligibility to read-only turns, diagnose the original provider disconnect, or improve model latency. An exact saved evaluator replay returned the correct answer without executing tools; the original UI failure remains preserved. No model settings or recovery authorization rules change.\n\nThe read-only case confirms that the JSON evidence is retained without adding mutation receipts or advertising unsupported recovery availability. It does not change runtime behavior.\n"])</script><script>self.__next_f.push([1,"2e:T10042,"])</script><script>self.__next_f.push([1,"Bumps the uv group with 3 updates in the /packages/benchmarks/suites/OSWorld directory: [gitpython](https://github.com/gitpython-developers/GitPython), [pyjwt](https://github.com/jpadilla/pyjwt) and [urllib3](https://github.com/urllib3/urllib3).\nBumps the uv group with 2 updates in the /packages/benchmarks/suites/lifeops-bench directory: [urllib3](https://github.com/urllib3/urllib3) and [litellm](https://github.com/BerriAI/litellm).\nBumps the uv group with 1 update in the /packages/benchmarks/suites/swe_bench directory: [gitpython](https://github.com/gitpython-developers/GitPython).\nBumps the uv group with 1 update in the /packages/benchmarks/suites/visualwebbench directory: [urllib3](https://github.com/urllib3/urllib3).\nBumps the uv group with 4 updates in the /packages/training directory: [pyjwt](https://github.com/jpadilla/pyjwt), [urllib3](https://github.com/urllib3/urllib3), [litellm](https://github.com/BerriAI/litellm) and [virtualenv](https://github.com/pypa/virtualenv).\n\nUpdates `gitpython` from 3.1.59 to 3.1.62\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/gitpython-developers/GitPython/releases\"\u003egitpython's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e3.1.
