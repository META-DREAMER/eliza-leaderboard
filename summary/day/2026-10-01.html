y Blooio and Twilio turns that the gateway has already acknowledged to the provider and parked for a Shared→Dedicated cutover.\n\n1. **Non-retryable Cloud refusals are released at once.** `redeliverHeldWebhook` re-held every `PersonalSharedPreEgressError`. That included failures that Cloud classified as `retryable: false`: a 4xx, or `X-Eliza-Retryable: false`, as read by `readPersonalSharedFailureMetadata` (`packages/cloud/services/_common/src/personal-shared-failure.ts:100-102`, `:127-132`). Such a turn was sent to Cloud again on every drain for the one-hour hold budget, and then logged as a cutover expiry. The guard (`src/webhook-handler.ts:954-957`) now keeps a turn held only when Cloud returned a cutover hold, or when the failure is not classified as non-retryable. A non-retryable failure falls through to `settleBackgroundDeliveryFailure` (`:963`), the same path a first background delivery takes. That path logs `Background message processing failed` at error level. Because a pre-egress failure means no provider egress happened, it also reopens the dedup key (`:835-867`). This is the ledger contract that function documents for idempotent pre-egress failures, so a refused redelivery ends in the same state as a refused first delivery. Transport errors, 5xx responses and cutover holds stay in the durable queue, as #32909 intends.\n2. **A settled record is no longer kept because its lease lapsed.** `drainCutoverHolds` removed a delivered or released record only while the lease still held this drainer's token. Suppose renewal failed for a whole lease period and no other replica took the lease. The ledger already read `delivered`, but the record and index entry stayed, and the next drain ran the Cloud turn and the provider send again. The removal script (`src/cutover-hold.ts:247-260`) now refuses only when a *different* owner holds the lease. The existing tests `an expired drainer cannot mutate a replacement lease` and `a drainer releases only its own lease` still pass unchanged. The reschedule write (`:139`) keeps its strict token fence. With no lease, a `held` outcome is simply not stored, and the unchanged record is retried on the next drain.\n\nRisk: low. Only two paths change: the redelivery of a failure with `retryable: false`, and record removal when the lease key is absent. Every other outcome is unchanged. That covers cutover holds, transient failures, a lease owned by another replica, and expiry.\n\nNot addressed: a lease taken by another replica that dies without draining (probe P2 in the #32909 review). The first drainer still correctly declines to remove the record, and the record is replayed once that replica's lease lapses. Covering it would mean checking the dedup ledger before redelivery. It needs a live owner to steal the lease, which lease renewal is designed to prevent.\n\n# Testing\n\nEnvironment: Bun 1.3.14 on this machine (the repository pins 1.4.2), Node 24.15.0. `@elizaos/core` resolves from source through `--conditions=eliza-source` because no `dist` is built in this checkout. This is not CI parity. Prepared on the #32909 head `bc812ab321` as commit `332bb56054`, then rebased as the single commit `190d8a3304` onto `origin/develop` `4573712ebf`, which already contains #32909.\n\nThe tests are in `packages/cloud/services/gateway-webhook/__tests__/cutover-hold.test.ts`. They drive the real `handleWebhook`, `drainCutoverHolds`, `redeliverHeldWebhook` and `releaseExpiredHeldWebhook` against a local `Bun.serve` Cloud route and the in-memory Redis adapter. Only the Blooio provider API is substituted.\n\n- `a delivered hold whose lease lapsed with no new owner is not replayed`: the lease key is deleted while the attested turn runs. The test asserts 1 Cloud turn, 1 provider send, `delivered: 1` on the first drain, the record removed, all-zero stats on the next drain, and a `delivered` ledger.\n- `a held turn Cloud refuses as not retryable is released at once, not replayed for the hold budget`: Cloud answers 400. t` already treats `null` as not-present), and it is what the pinned live wire contract requires; strict tools cannot express optional absence any other way.\n\n# Testing\n\nAll commands run from a clean shallow checkout of `develop` at `3f38e5449` with the pinned Node `v24.15.0`:\n\n1. **Reproduction (before this commit):** `bunx vitest run --config plugins/plugin-personal-assistant/vitest.config.ts plugins/plugin-personal-assistant/test/work-thread-native-schema.test.ts` → `1 failed | 1 passed` — identical to the red CI lane (`AssertionError: expected false to be true` at line 99).\n2. **After this commit, same command:** `2 passed`.\n3. **Core suite:** `bun run --cwd packages/core test` → `Test Files 82 passed | 2 skipped (84)`, `Tests 1091 passed | 2 skipped (1093)` — includes the updated `nullable-schema.integration.test.ts` and every pre-existing admission test.\n4. **Typecheck:** `bun run --cwd packages/core typecheck` → clean.\n5. **Lint/format:** `bunx biome check` on both changed files → clean.\n\n`bun run verify` was not fully green locally for unrelated environment reasons: local Bun is `1.4.0` while the repo pins `1.4.2`, the SQLite driver runtime guard rejects `1.4.0`, and the postinstall workspace build fails in `plugins/plugin-elizacloud` package verification (`dist/lib/config-env` missing) on vanilla develop before this change. PR CI runs the pinned toolchain and owns the full gate.\n\n# Evidence Gate\n\nEvidence must match the reviewed commit. `packages/scripts/pr-evidence.ts rows` sets the marker from the live PR head; rerun after each push.\n\u003c!-- evidence-head:5f2fac5dd6000f5f9d26e85f07d3a3a527db547a --\u003e\n\nKeep every row. Attach artifacts inline or write `N/A - \u003creason\u003e` where inapplicable. UI changes require desktop/mobile before-and-after screenshots, a walkthrough, logs, and OCR review. Use MP4 videos and preferably JPG images. Keep generated artifacts out of source control.\n\n\u003c!-- evidence-row:before-screenshots --\u u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8319\"\u003e#8319\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/c6e8b20c27b08e94549a9431c38e867aa014b724\"\u003e\u003ccode\u003ec6e8b20\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Extend \u003ccode\u003eNetAddress.toCanonical\u003c/code\u003e to accept internet addresses. IPv4-mapped IPv6 addresses become IPv4 while retaining the port. Other addresses retain their identity and IPv6 scope metadata.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8317\"\u003e#8317\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/8d40572de3762d51b142cfff30e6927ef21e37a3\"\u003e\u003ccode\u003e8d40572\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tim-smart\"\u003e\u003ccode\u003e@​tim-smart\u003c/code\u003e\u003c/a\u003e! - Fix cluster workflows stalling after request resets.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8323\"\u003e#8323\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/1b21e0df6ab777d6a1664dfabdea88511f2d25d1\"\u003e\u003ccode\u003e1b21e0d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add validated multicast address refinements for IP and MAC addresses.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8310\"\u003e#8310\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/3b155e3e24e42b603d48dff5d3280715944998f0\"\u003e\u003ccode\u003e3b155e3\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/williamrobertson13\"\u003e\u003ccode\u003e@​williamrobertson13\u003c/code\u003e\u003c/a\u003e! - Fix memory leaks in \u003ccode\u003ePool.makeWithTTL\u003c/code\u003e with the usage strategy by releasing retired resources and consumed acquisition errors from the TTL queue.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8326\"\u003e#8326\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/895d94410f90c45546aec593730e5630f200ca1b\"\u003e\u003ccode\u003e895d944\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/lloydrichards\"\u003e\u003ccode\u003e@​lloydrichards\u003c/code\u003e\u003c/a\u003e! - Normalize identified MCP output schemas to object roots across protocol versions.\nSupport identified object schemas in MCP elicitation requests.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8318\"\u003e#8318\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/705fb6852ac24791352bd78889d57f07cbe949a9\"\u003e\u003ccode\u003e705fb68\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add \u003ccode\u003eQueue.shutdownUnsafe\u003c/code\u003e to synchronously discard buffered messages and settle pending queue operations from callbacks. Both \u003ccode\u003eQueue.shutdown\u003c/code\u003e and \u003ccode\u003eQueue.shutdownUnsafe\u003c/code\u003e return \u003ccode\u003efalse\u003c/code\u003e when the queue has already been shut down or completed; previously, \u003ccode\u003eQueue.shutdown\u003c/code\u003e always returned \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8325\"\u003e#8325\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/87912c014132648694015a5636177b2ba2bdeb2a\"\u003e\u003ccode\u003e87912c0\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add \u003ccode\u003eNetAddress.formatNativeHost\u003c/code\u003e and \u003ccode\u003eNetAddress.formatMulticastInterface\u003c/code\u003e with explicit platform and scope ID map parameters for native socket APIs.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8308\"\u003e#8308\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/106af64cf7117dfad53d3b11b61bb3d17d63bfca\"\u003e\u003ccode\u003e106af64\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tristanz\"\u003e\u003ccode\u003e@​tristanz\u003c/code\u003e\u003c/a\u003e! - Release savepoints after nested transactions succeed or successfully roll back in PostgreSQL, PGlite, MySQL, libSQL, and the Node, Bun, React Native, and WASM SQLite clients. This frees PostgreSQL transaction locks before the outer transaction completes.\u003c/p\u003e\n\u003cp\u003eCustom SQL clients can opt in through the new \u003ccode\u003ereleaseSavepoint\u003c/code\u003e option. Clients that omit it are unchanged.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8323\"\u003e#8323\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/1b21e0df6ab777d6a1664dfabdea88511f2d25d1\"\u003e\u003ccode\u003e1b21e0d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add generic branded NetAddress classifications and named validating schemas.\nSingleton address constants retain their base-family types; guards expose\nclassifications on demand. Operations that derive new address bits return only\nthe IPv4 or IPv6 family until callers revalidate the classification.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8305\"\u003e#8305\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/3d59ae6d5f9ff3e52cb6ed4a9f325320580218d5\"\u003e\u003ccode\u003e3d59ae6\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tim-smart\"\u003e\u003ccode\u003e@​tim-smart\u003c/code\u003e\u003c/a\u003e! - Make \u003ccode\u003ecriteria\u003c/code\u003e optional for \u003ccode\u003eDecision.probability\u003c/code\u003e. When supplied, \u003ccode\u003ecriteria\u003c/code\u003e still requires descriptions for both \u003ccode\u003efalse\u003c/code\u003e and \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eDecision.Probability.criteria\u003c/code\u003e is now optional, so consumers reading outcome descriptions (for example, \u003ccode\u003edecision.criteria.true\u003c/code\u003e) must first guard against \u003ccode\u003eundefined\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8329\"\u003e#8329\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/89c9a398412f1f5e7f9c6f697a1badd982bcd741\"\u003e\u003ccode\u003e89c9a39\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tim-smart\"\u003e\u003ccode\u003e@​tim-smart\u003c/code\u003e\u003c/a\u003e! - Warn when conflicting cluster workflow definitions reuse a tag.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.0.0-rc.116\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/7908\"\u003e#7908\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/c19c63fb710422aaf00b8d923188aa2e52a6776f\"\u003e\u003ccode\u003ec19c63f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/gcanti\"\u003e\u003ccode ached its expected TimeoutError. The probe did not reset or drive the Eliza app.\n- Frozen workspace installation and the exact Android asset command passed. Focused Biome and diff checks passed. The initial full tooling suite and configured emit rerun failed at the original 30-second budget; those logs are retained. The revised owning file passed 18 cases/47 assertions (59.62 seconds in the focused run; 93.42 seconds in the complete tooling replay). The complete tooling replay, including its Node lane, and root verification passed at this exact head. All four PR hosted checks passed in run 36853515358. The earlier complete replay exceeded the unchanged 120-second process cap under local load; that failure is retained alongside the successful complete replay.\n- Hosted bcabedb Device E2E run 36845567934 failed at the first optional native wait; its privacy-safe report records the location but no raw error. This setup defect is independently reproduced, while the complete hosted onboarding journey remains unverified.\n\n\u003c!-- evidence-head:853cd8454156b93481addcf231870fb46d642866 --\u003e\n\nEvidence Gate\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - CI dependency setup; actual native selector probe rejects missing driver assets.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered UI changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - native-selector prerequisite verified on a leased emulator.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Asset installation succeeded and actual native selector API progressed to expected timeout.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no renderer changes.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no model behavior changes.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Missing-driver and installed-driver probe results retained; full hosted journey pending.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n\nThe emit budget changes the deadline, not emitter behavior or performance. Before-change case timings were 64.072 and 53.001 seconds and failed the 30-second case limit. After-change complete-replay agent emission was 57.192 seconds; all three real workspace emissions and all fixture assertions passed. The existing hosted script suite passed before and after: [04d007e1 job](https://github.com/elizaOS/eliza/actions/runs/36857059380/job/110352096667) emitted the agent in 23.025 seconds; [853cd845 job](https://github.com/elizaOS/eliza/actions/runs/36857062713/job/110352162715) took 17.860 seconds. Linux did not reproduce the 30-second failure. This is a bounded allowance for the measured slower local host, not a speedup or a universal completion guarantee; the 120-second file supervisor still fails closed. The review response supplies both hosted runs and retains the two original local deadline failures separately.\n\nDevice run 36853389411 at 04d007e1 failed before route capture because the native phone dialer test timed out waiting for global UI silence (12/13 phone tests passed). This is separate from driver installation and already addressed by the complete-number readiness poll in #32942. Device run 36854468534 at 853cd845 also failed at that same global-idle dialer wait before route capture. Its native artifact confirms the exact TimeoutException; no onboarding success is claimed. The complete-number readiness poll in #32942 still needs to be composed with driver setup and run end to end.\n"])</script><script>self.__next_f.push([1,"4a:T3162,"])</script><script>self.__next_f.push([1,"Bumps [ox](https://github.com/wevm/ox) from 0.14.33 to 1.8.1.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/wevm/ox/releases\"\u003eox's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eox@1.8.1\u003c/h2\ n. Later, [CI 36851491795](https://github.com/elizaOS/eliza/actions/runs/36851491795) passed Quality but lost two running OS VM qualifications when a second manual CI dispatch at the same commit started. The reusable OS workflow still grouped both manual runs by branch.\n\n# Change\n\nSerialize Quality verification tasks: root `verify` gives each Node task an 8 GB heap, overriding the job's 4 GB setting, so two tasks can exhaust a 16 GB runner. Retain all checks and the job timeout.\n\nGive manually dispatched OS verification runs independent run-ID concurrency groups, matching the CI caller. Only push runs cancel an in-progress run. Independent manual dispatches can now complete their OS qualification instead of cancelling one another.\n\n# Testing\n\n- `actionlint` for both workflows and `git diff --check` passed.\n- Windows command coverage, workflow trigger policy and Bun version contracts passed with Bun 1.4.2 / Node 24.15.0.\n- A subprocess check confirmed the Quality concurrency override replaces 8 with 1 while retaining typecheck and lint tasks.\n- At predecessor `60dc1f11703daf60abd3bbcc76b7fba4f6224dbc`, [hosted Quality](https://github.com/elizaOS/eliza/actions/runs/36851491795/job/110334068047) passed all 284 verification tasks, trailing audits, 106 formatting tasks, Markdown links, prompt scan and Bun pin checks. Verification took 8 minutes 35 seconds within the unchanged timeout. The duplicate local cold run was stopped after this hosted success; it is not a local full-pass claim.\n- Final-head [Quality job](https://github.com/elizaOS/eliza/actions/runs/36854273783/job/110343399514) passed all 284 verification tasks, trailing audits, 106 formatting tasks, Markdown links, prompt scan and Bun pin checks at `889882428ac56df6569ed07ba0980132fdb9390f`.\n- Final-head [CI36854273783](https://github.com/elizaOS/eliza/actions/runs/36854273783) succeeded at `889882428ac56df6569ed07ba0980132fdb9390f`: all29 jobs passed, including both OS sector sizes and All Tests Passed. Overlapping [OS dispatch36854398162](https://github.com/elizaOS/eliza/actions/runs/36854398162) passed10/10 jobs, including both restore VMs. Both runs executed overlapping VM jobs without cancellation.\n\n- [x] Targets `develop`.\n- [x] Final-head hosted Quality passed full repository verification (284/284 tasks and trailing audits), formatting (106/106), Markdown links, prompt scan and Bun pins.\n- [x] N/A - no public documentation contract changed.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:889882428ac56df6569ed07ba0980132fdb9390f --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no product UI change.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no product UI change.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - no user flow change.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] N/A - no backend code change.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend code change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no agent or model change.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Final-head CI passed29/29 jobs and overlapping standalone OS passed10/10, with both restore VMs running concurrently without cancellation.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered surface change.\n\n## Known gaps / failures\n\nFinal-head Quality and all29 full CI jobs passed. The second overlapping standalone OS run also passed all10 jobs; manual-run isolation has terminal hosted proof. The earlier OOM cause remains an inference. Cancelled VM jobs in the earlier run are not acceptance proof; the subsequent dispatch exposed the independent OS concurrency defect.\n"])</script><script>self.__next_f.push([1,"4d:T49c,The complete maps quota case performs all 256 SQLite mutations before checking replay at capacity and overflow rejection. A shared CI runner exceeded its five-second default. Give this case 30 seconds while retaining ever 3cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/github/codeql-action/releases\"\u003egithub/codeql-action/init's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.38.2\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.1\"\u003e2.27.1\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4160\"\u003e#4160\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/github/codeql-action/blob/main/CHANGELOG.md\"\u003egithub/codeql-action/init's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003eCodeQL Action Changelog\u003c/h1\u003e\n\u003cp\u003eSee the \u003ca href=\"https://github.com/github/codeql-action/releases\"\u003ereleases page\u003c/a\u003e for the relevant changes to the CodeQL CLI and language packs.\u003c/p\u003e\n\u003ch2\u003e[UNRELEASED]\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.38.2 - 24 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.1\"\u003e2.27.1\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4160\"\u003e#4160\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.38.1 - 18 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe CodeQL Action now has experimental support for CodeQL releases for which per-language bundles are available. Per-language bundles support analysis for a single language and are therefore smaller than the combined bundles that allow analysis for all supported languages. As a result, per-language bundles take up less space on disk and are faster to download. We expect to roll this change out to everyone in the coming weeks. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4146\"\u003e#4146\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.38.0 - 09 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOn GitHub-hosted runners, the CodeQL Action now deletes unused CodeQL bundles from the toolcache before downloading a different bundle, which frees up disk space for the analysis. We expect to roll this change out to everyone in September. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4124\"\u003e#4124\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe CodeQL Action now supports CodeQL releases that are compatible with Linux Arm64 and downloads the native \u003ccode\u003elinux-arm64\u003c/code\u003e CodeQL bundle when available. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4072\"\u003e#4072\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.0\"\u003e2.27.0\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4129\"\u003e#4129\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.9 - 26 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.4\"\u003e2.26.4\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4106\"\u003e#4106\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.8 - 21 Aug 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.7 - 13 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.3\"\u003e2.26.3\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4085\"\u003e#4085\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.6 - 04 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eChanged the default filepath for the new remote file address format that was introduced in CodeQL Action 4.37.0 / 3.37.0 to \u003ccode\u003e.github/codeql-config.yml\u003c/code\u003e to align it with the suggested path that is used elsewhere. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4070\"\u003e#4070\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.5 - 03 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed a bug where a network error while streaming the download of the CodeQL bundle could terminate the \u003ccode\u003einit\u003c/code\u003e Action instead of falling back to downloading the bundle before extracting it. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4061\"\u003e#4061\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.4 - 29 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThis version of the CodeQL Action adds support for the \u003ccode\u003etools\u003c/code\u003e input for the \u003ccode\u003ecodeql-action/init\u003c/code\u003e step to be specified using a \u003ccode\u003egithub-codeql-tools\u003c/code\u003e \u003ca href=\"https://docs.github.com/en/organizations/managing-organization-settings/managing-custom-properties-for-repositories-in-your-organization\"\u003erepository property\u003c/a\u003e. This feature will gradually be rolled out following the release of this version. Once rolled out, this allows for the CodeQL CLI version that is used in GitHub-managed workflows, such as Default Setup, to be set to a custom value. For example, customers who run into issues with rate limits when a new CodeQL CLI version is released can set the value to \u003ccode\u003etoolcache\u003c/code\u003e to always use the CodeQL CLI version that is available in the runner toolcache. For Advanced Setup workflows, the value provided for \u003ccode\u003etools\u003c/code\u003e in the workflow definition always takes precedence unless the value of the repository property starts with \u003ccode\u003e!\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4037\"\u003e#4037\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.2\"\u003e2.26.2\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4051\"\u003e#4051\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.3 - 22 Jul 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2\"\u003e\u003ccode\u003e2892aa5\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/github/codeql-action/issues/4168\"\u003e#4168\u003c/a\u003e from github/update-v4.38.2-a6ef2c96f\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/8ad03a333eb88de8ad6833eda208d0fc51a9c571\"\u003e\u003ccode\u003e8ad03a3\u003c/code\u003e\u003c/a\u003e Trigger workflows\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/98af865db5041cee73c7185896319367f8c0adf2\"\u003e\u003ccode\u003e98af865\u003c/code\u003e\u003c/a\u003e Update changelog for v4.38.2\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/a6ef2c96fc0e37d0b44fb2bd0b32db4bcb89ae24\"\u003e\u003ccode\u003ea6 e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.38.1 - 18 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe CodeQL Action now has experimental support for CodeQL releases for which per-language bundles are available. Per-language bundles support analysis for a single language and are therefore smaller than the combined bundles that allow analysis for all supported languages. As a result, per-language bundles take up less space on disk and are faster to download. We expect to roll this change out to everyone in the coming weeks. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4146\"\u003e#4146\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.38.0 - 09 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOn GitHub-hosted runners, the CodeQL Action now deletes unused CodeQL bundles from the toolcache before downloading a different bundle, which frees up disk space for the analysis. We expect to roll this change out to everyone in September. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4124\"\u003e#4124\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe CodeQL Action now supports CodeQL releases that are compatible with Linux Arm64 and downloads the native \u003ccode\u003elinux-arm64\u003c/code\u003e CodeQL bundle when available. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4072\"\u003e#4072\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.0\"\u003e2.27.0\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4129\"\u003e#4129\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.9 - 26 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.4\"\u003e2.26.4\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4106\"\u003e#4106\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.8 - 21 Aug 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.7 - 13 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.3\"\u003e2.26.3\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4085\"\u003e#4085\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.6 - 04 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eChanged the default filepath for the new remote file address format that was introduced in CodeQL Action 4.37.0 / 3.37.0 to \u003ccode\u003e.github/codeql-config.yml\u003c/code\u003e to align it with the suggested path that is used elsewhere. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4070\"\u003e#4070\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.5 - 03 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed a bug where a network error while streaming the download of the CodeQL bundle could terminate the \u003ccode\u003einit\u003c/code\u003e Action instead of falling back to downloading the bundle before extracting it. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4061\"\u003e#4061\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.4 - 29 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThis version of the CodeQL Action adds support for the \u003ccode\u003etools\u003c/code\u003e input for the \u003ccode\u003ecodeql-action/init\u003c/code\u003e step to be specified using a \u003ccode\u003egithub-codeql-tools\u003c/code\u003e \u003ca href=\"https://docs.github.com/en/organizations/managing-organization-settings/managing-custom-properties-for-repositories-in-your-organization\"\u003erepository property\u003c/a\u003e. This feature will gradually be rolled out following the release of this version. Once rolled out, this allows for the CodeQL CLI version that is used in GitHub-managed workflows, such as Default Setup, to be set to a custom value. For example, customers who run into issues with rate limits when a new CodeQL CLI version is released can set the value to \u003ccode\u003etoolcache\u003c/code\u003e to always use the CodeQL CLI version that is available in the runner toolcache. For Advanced Setup workflows, the value provided for \u003ccode\u003etools\u003c/code\u003e in the workflow definition always takes precedence unless the value of the repository property starts with \u003ccode\u003e!\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4037\"\u003e#4037\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.2\"\u003e2.26.2\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4051\"\u003e#4051\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.3 - 22 Jul 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2\"\u003e\u003ccode\u003e2892aa5\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/github/codeql-action/issues/4168\"\u003e#4168\u003c/a\u003e from github/update-v4.38.2-a6ef2c96f\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/8ad03a333eb88de8ad6833eda208d0fc51a9c571\"\u003e\u003ccode\u003e8ad03a3\u003c/code\u003e\u003c/a\u003e Trigger wor he specific dependency (unless you unignore this specific dependency or upgrade to it yourself)\n- `@dependabot unignore \u003cdependency name\u003e` will remove all of the ignore conditions of the specified dependency\n- `@dependabot unignore \u003cdependency name\u003e \u003cignore condition\u003e` will remove the ignore condition of the specified dependency and ignore conditions\n\n\n\u003c/details\u003e"])</script><script>self.__next_f.push([1,"50:T3ce2,"])</script><script>self.__next_f.push([1,"Bumps [actions/setup-java](https://github.com/actions/setup-java) from 5.3.0 to 6.0.1.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/actions/setup-java/releases\"\u003eactions/setup-java's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev6.0.1\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFix failing GitHub Actions job for temurin 17 by \u003ca href=\"https://github.com/brunoborges\"\u003e\u003ccode\u003e@​brunoborges\u003c/code\u003e\u003c/a\u003e with \u003ca href=\"https://github.com/Copilot\"\u003e\u003ccode\u003e@​Copilot\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/actions/setup-java/pull/1259\"\u003eactions/setup-java#1259\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFix Temurin EA E2E signature verification by \u003ca href=\"https://github.com/brunoborges\"\u003e\u003ccode\u003e@​brunoborges\u003c/code\u003e\u003c/a\u003e with \u003ca href=\"https://github.com/Copilot\"\u003e\u003ccode\u003e@​Copilot\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/actions/setup-java/pull/1260\"\u003eactions/setup-java#1260\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFix Alpine GPG verification failures and support multiple keys by \u003ca href=\"https://github.com/brunoborges\"\u003e\u003ccode\u003e@​brunoborges\u003c/code\u003e\u0 \"author\":\"lalalune\",\"number\":32980,\"body\":\"$21\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T04:32:30Z\",\"mergedAt\":\"2026-10-01T12:16:25Z\",\"additions\":5571,\"deletions\":357},{\"id\":\"PR_kwDOMT5cIs8AAAABF_zz1w\",\"title\":\"feat(agent): durable interactive task lifecycle and choices\",\"author\":\"lalalune\",\"number\":32976,\"body\":\"$22\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T00:07:45Z\",\"mergedAt\":\"2026-10-01T10:49:08Z\",\"additions\":3982,\"deletions\":149},{\"id\":\"PR_kwDOMT5cIs8AAAABFxPgAw\",\"title\":\"Manage saved Reminders in Automations without adding them to Todos\",\"author\":\"NubsCarson\",\"number\":32939,\"body\":\"$23\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:20:57Z\",\"mergedAt\":\"2026-10-01T12:51:40Z\",\"additions\":3365,\"deletions\":229},{\"id\":\"PR_kwDOMT5cIs8AAAABFm2-Jw\",\"title\":\"fix(phone): keep first-use briefs and system notices truthful\",\"author\":\"NubsCarson\",\"number\":32928,\"body\":\"First-use remote phones could receive an invented morning brief when its sources were unavailable, or route a host error notice through ordinary assistant prose rendering.\\n\\nKeep source availability explicit in first-use check-ins and moment decisions, and preserve typed system notices through delivery and rendering. Error and setup messages remain distinct from generated assistant replies; unavailable brief sources are reported truthfully rather than replaced with fabricated content.\\n\\nValidation: six personal-assistant suites (54 tests, including real PGlite availability coverage); agent system-error notice suite; ChatOverlay suite (199 tests); focused Biome and typechecks. This is independently rebased onto develop and has not been installed on hardware; original combined phone QA is not a blanket acceptance of this draft. Auth/reconnect (#32922) and local-model readiness (#32926) are separate drafts. PGlite lifecycle and unsolicited-watcher fixes are exclud  input and generate an unbound reply-planner answer before the host’s receipt-bound evaluator.\\n\\nThe extractor separates only the trusted system prefix that exactly matches the live persona/role; dialogue, constraints, providers, receipts, repair and restoration remain intact. The hosted single-tool final-scope path now invokes semantic evaluation directly. Pre-tool prose cannot bypass that evaluation; queued work, pending dependencies and legacy standalone callers retain their existing paths.\\n\\nValidation: independent review; Core24, PA38 and Assistant132 focused tests; full combined verification/build. A two-packet, effect-free Qwen comparison removed513 input tokens (15,640→15,127) with valid plans on both sides. The reply-planner reduction is proved by no-I/O native/JSON/failure/legacy regression tests; fresh whole-chat timing remains pending. No queue batching, model-default change or new network call.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T17:54:37Z\",\"mergedAt\":\"2026-10-01T11:08:52Z\",\"additions\":478,\"deletions\":50},{\"id\":\"PR_kwDOMT5cIs8AAAABGIw0xg\",\"title\":\"fix(openai): drop strict-wire omitted-optional nulls before action validation\",\"author\":\"lumix5\",\"number\":33000,\"body\":\"$29\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T16:51:48Z\",\"mergedAt\":\"2026-10-02T03:31:26Z\",\"additions\":402,\"deletions\":59},{\"id\":\"PR_kwDOMT5cIs8AAAABF83UBA\",\"title\":\"fix(core): preserve code indentation during assistant text normalization (#30590)\",\"author\":\"0xalydev\",\"number\":32974,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T18:17:44Z\",\"mergedAt\":\"2026-10-01T10:58:11Z\",\"additions\":396,\"deletions\":192},{\"id\":\"PR_kwDOMT5cIs8AAAABF5YXkQ\",\"title\":\"chore(deps-dev): bump the dev-dependencies group with 8 updates\",\"author\":\"dependabot\",\"number\":32966,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T12:49:54Z\",\"m
