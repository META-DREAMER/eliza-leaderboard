ve, rather than a wrapper that no longer exists.\n\n# Background\n\n## What is broken\n\n`@elizaos/plugin-anthropic` fails 3 of 143 on `develop`. Two share one cause:\n\n```\nFAIL native-plumbing.shape.test.ts \u003e rejects an output-limited completion instead of returning its text prefix\n  expected ElizaError: [anthropic] Model output did … to match object { cause: ObjectContaining{…} }\n\nFAIL image-description.shape.test.ts \u003e rejects a provider length stop instead of parsing the partial description\n  expected ElizaError: [anthropic] Model output did … to match object { Object (cause) }\n```\n\n## Root cause\n\n`assertModelOutputComplete` (`packages/core/src/utils/model-errors.ts:71`) throws a typed\n**origin** error — code on the error, no `cause`:\n\n```\nElizaError {\n  message: \"[anthropic] Model output did not complete successfully (length).\",\n  code: \"MODEL_OUTPUT_INCOMPLETE\",\n  context: { finishReason: \"length\", model: \"claude-test-small\", provider: \"anthropic\" },\n}\n```\n\nBoth call sites catch through `formatModelError` (`utils/retry.ts:151`), which returns a\ntyped error unchanged and wraps only untyped ones:\n\n```ts\nif (isElizaError(error)) {\n  return error;                              // passthrough — no cause\n}\n...\nreturn new Error(message, { cause: error }); // only untyped errors get a cause\n```\n\nSo `cause: { code: ... }` describes a wrapper that is gone. The behaviour is right —\ncallers get an actionable `code` plus full `context`, and declining to double-wrap an\nalready-typed domain error is correct.\n\n## Attribution\n\nThe passthrough came from **#28112** (`4333300926`, 2026-08-25). Verified by checking for\n`isElizaError(error)` inside `formatModelError` across the file's history:\n\n```\n2026-08-25 4333300926  present   \u003c-- added here\n2026-07-04 9f83ba8752  absent\n2026-07-04 d203202c65  absent\n2026-06-19 f7a6b0fea5  absent\n```\n\nBefore it, `formatModelError` wrapped everything with `cause` — exactly what these two\nassertions describe. Neither test was updated alongside.\n\n## What is the fix?\n\nAssert the code where it now lives:\n\n```diff\n-    ).rejects.toMatchObject({\n-      cause: expect.objectContaining({ code: \"MODEL_OUTPUT_INCOMPLETE\" }),\n-    });\n+    ).rejects.toMatchObject({\n+      code: \"MODEL_OUTPUT_INCOMPLETE\",\n+    });\n```\n\nNo `src` change: the current shape is the correct one, and loosening the assertion to\naccept either shape would stop pinning the contract at all.\n\n# Documentation changes needed?\n\nNo. Test only.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe mutation block.\n\n## Detailed testing steps\n\n| Gate | Result |\n| --- | --- |\n| the two changed suites | **21 passed (21)** — was `2 failed | 19 passed` |\n| full `plugin-anthropic` package | `1 failed | 142 passed (143)` — was `3 failed | 140 passed` |\n| `biome check` (repository-pinned 2.5.8) | `No fixes applied.` |\n| diff vs `develop` | `+7/-2`, two test files, zero runtime files |\n\nMutation resistance — restoring **only** develop's assertions:\n\n```\nAssertionError: expected ElizaError: [anthropic] Model output did … to match object { Object (cause) }\nAssertionError: expected ElizaError: [anthropic] Model output did … to match object { cause: ObjectContaining{…} }\n Tests  2 failed | 19 passed (21)\n```\n\n**The remaining failure is deliberately not fixed here.**\n`error-policy.shape.test.ts \u003e surfaces a failed CLI stream as an error instead of a\nhealthy-empty completion` fails for an unrelated reason: it expects\n`result.finishReason` to resolve to `\"error\"`, while `createTextStream`\n(`utils/claude-cli.ts:484`) throws instead. Both satisfy \"not a healthy-empty completion\",\nso which is intended is a design call for the plugin owner. Recorded in #30148; happy to\nfollow up once that is decided.\n\nAlso worth noting for anyone reproducing: this package runs on **vitest**\n(`bunx vitest run --config vitest.config.ts`). Running it with `bun pected [Function] to throw error matching /Payment has expired/\n  but got 'Quote signature mismatch — payment may have been tampered with.'\n```\n\n## Two hypotheses, both wrong\n\n**First:** the test's raw `UPDATE` invalidates a quote signature that covers `expiresAt`, so tamper detection fires first. Reading `confirmPayment` killed the ordering half of that — the expiry check runs **before** the signature check:\n\n```ts\nif (observedPayment.expires_at \u003c new Date() \u0026\u0026 !params.allowExpired) throw new Error(\"Payment has expired\");   // 1867\n…\nif (!sigOk) throw new Error(\"Quote signature mismatch — payment may have been tampered with.\");                 // 1897\n```\n\nSo the real question was why the expiry check didn't fire at all.\n\n**Second:** `expires_at` is a string, so the comparison is NaN-false. No — Drizzle's `timestamp()` defaults to `mode: \"date\"` and returns a `Date`.\n\n## What the probe showed\n\nI stopped theorising and instrumented the branch:\n\n```\n[PROBE] expires_at= 2026-09-04T17:52:54.875Z  now= 2026-09-04T16:52:54.877Z  isPast= false\n```\n\nThe row written as **one hour in the past** reads back **one hour in the future**.\n\n## Root cause\n\n`crypto_payments.expires_at` is `timestamp` **without** time zone (migration `0001_certain_stellaris.sql`), and the Drizzle schema declares `timestamp()` to match — so there is no schema mismatch, and I checked for one before going further.\n\nThe mismatch is between two ways of *writing* that column:\n\n- **The service** writes a JS `Date` — `new Date(now.getTime() + PAYMENT_EXPIRATION_MS)`. Drizzle stores and reads that back as UTC wall-clock, consistently.\n- **The test** writes `now()`, which is a `timestamptz`. Casting it into a naive column applies the **session TimeZone**, storing *local* wall-clock — which the reader then interprets as UTC.\n\nThe stored value is therefore shifted by the session's UTC offset. Probing PGlite directly (it adopts the process `TZ` as its session TimeZone):\n\n| `TZ` | pg session | stored `now() - 1 hour` | vs real UTC now |\n|---|---|---|---|\n| `UTC` | `Etc/GMT0` | `15:57:41` | 1 h in the past |\n| `Europe/Berlin` | `Etc/GMT-1` | `16:57:42.092` | **1 ms** in the past |\n| `Asia/Tokyo` | `Etc/GMT-9` | `2026-09-05 00:57:42` | **8 h in the future** |\n\nThe test only holds while the offset is under one hour. At Tokyo the row is not expired, so `confirmPayment` runs past the expiry gate and fails later on the quote signature — which the raw `UPDATE` also invalidated, since the signature covers `expiresAt`. That is the error the assertion actually sees. Negative offsets make the row *more* expired, which is why `America/Los_Angeles` passes.\n\n**Production is unaffected.** Only this raw-SQL `now()` mixes the two conventions. The file's other `now()` writes target `crypto_sweep_outbox` columns declared `timestamptz`, where it is correct.\n\n## The fix\n\n`(now() AT TIME ZONE 'UTC') - interval '1 hour'` produces the UTC wall-clock the naive column's reader assumes, with a comment recording the convention. Kept the file's existing raw-SQL style rather than introducing the query builder for one line.\n\n## Verification\n\nSame test, four zones, before and after:\n\n| `TZ` | develop | patched |\n|---|---|---|\n| `UTC` | pass | pass |\n| `Europe/Berlin` | pass (by 1 ms) | pass |\n| `America/Los_Angeles` | pass | pass |\n| `Asia/Tokyo` | **fail** | pass |\n\nFull file **42/42**, up from 41/42. `packages/cloud/shared` typecheck clean; `biome check` clean.\n\n## A retraction, and one latent sibling\n\nI wrote a scan to find the same mistake elsewhere and then **threw its count away**: it keyed on column name, but column names are not unique across tables, so `expires_at` was excluded for appearing as `timestamptz` in other schemas — the scan missed the very line I was fixing. Not reporting a number I can't stand behind.\n\nChecking its one hit table-aware: `account-deletion-lifecycle-authority.test.ts:157` writes `admission_token_expires_at` (also a naive `timestamp`) with `now() + interval '1 day'`. Same pattern, but a day of slack absorbs any real-world offset, so it is latent rather than failing. Left alone; flagging it in case you'd like it made consistent.\n\nSeparately, and stated only as an observation: migration `0001` declares `created_at` / `updated_at` as `timestamp DEFAULT now()`, which carries the same offset skew on a non-UTC **database** session. The security-relevant field here — `expires_at` — is written explicitly by the service and is correct, so I have not proposed a migration.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PNFNPQC7JS0K6H3GGZSR9T\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T16:54:28.311Z\",\"completed_at\":\"2026-09-04T16:59:32.652Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T16:54:29.023Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\ e\n\nRemoved `CacheKeys`, `CACHE_TTL`, and `CACHE_STALE_TIME` from `service-cache.ts` (−46 lines) and recorded in the module header that keys and TTLs live in `./keys` and are deliberately not redefined there.\n\nConfirming they were unreferenced:\n\n- the module's only importer is `service-cache.invalidate.test.ts`, which imports exactly `CacheInvalidationError`, `invalidateCache`, `invalidateCachePattern`, `invalidateCacheBatch`\n- `CACHE_STALE_TIME` — zero references repo-wide\n- the `CACHE_TTL` matches elsewhere are unrelated private constants in `connection-cache.ts` and `credit-packs-cache.ts`, not imports of this export\n\nAfter the change, `grep \"export const CacheKeys\"` across `packages/cloud` returns exactly one hit.\n\n# What I left alone, and why\n\n**The `#13417` fail-closed invalidation helpers and their test are untouched.** `invalidateCache` / `invalidateCachePattern` / `invalidateCacheBatch` are deliberate security hardening — `delConfirmed`/`delPatternConfirmed`, `error-policy:J1` annotations, a docstring explaining that a swallowed delete keeps a revoked API key serving until TTL. This module surfaced in a sweep for modules imported only by tests, and the naive reading of that signal would have been to delete the file; that would have thrown away live-intent security work.\n\nI also left `withCache`, `withStaleWhileRevalidate`, and `withBatchCache`. They are unreferenced too, but they shadow nothing, so removing them would widen the diff without addressing a hazard. If you'd rather this PR take the whole unused surface, say so and I'll extend it.\n\n# Verification\n\n```\nbun run --cwd packages/cloud/shared typecheck   -\u003e exit 0, 0 error TS\nbunx @biomejs/biome check service-cache.ts      -\u003e clean\nbun test src/lib/cache/                         -\u003e 70 pass / 0 fail (13 files)\n  same directory on develop                     -\u003e 70 pass / 0 fail (13 files)\n```\n\nCompute receipt: 0 project-attributed tokens (unavailable; devic  --\u003e\n"])</script><script>self.__next_f.push([1,"52:T42d,## Summary\n- resolve the repository-pinned TypeScript compiler once\n- execute that compiler inside each temporary verification fixture\n- preserve the real npm-script and child-process boundary without downloading from the public registry\n\n## Root cause\nThe temp project ran `npx --yes -p typescript@5.6.2 tsc`. Because the fixture lives outside the repository, npx downloaded TypeScript on every cold runner. Two consecutive Develop Full jobs exceeded the 120-second test timeout while the orphaned compiler later completed successfully; the next identical fixture passed after npm cache warming.\n\n## Evidence\n- run 33821458523: timeout at 120006ms; child later passed at 143066ms; warmed fixture 27733ms\n- run 33819285065: timeout at 120106ms; child later passed at 177794ms; warmed fixture 62714ms\n- exact focused suite after fix: 25/25 passed in 13.31s before rebase and 20.28s after rebase\n- full plugin suite: 2025/2025 passed\n- plugin typecheck, lint, and build passed\n- full uncached `bun run verify`: 376/376 tasks plus all audits passed in 7m12s\n\nCloses #3048753:T4e1,Develop Full run 33920498044 started the prompts package test at 21:45:45 while agent tests were still importing it. The package consumer tests remove the real workspace `dist/` directory to validate clean resolution, and the agent suites beginning during that interval failed to resolve `@elizaos/prompts`.\n\nMark the prompts test task serial through its existing `elizaos.scripts.testSerial` metadata and document the shared artifact constraint. The runner completes the concurrent pool before starting serialized tasks, so the package's complete build, clean-resolution, and published-consumer tests remain enabled without deleting artifacts beneath another suite.\n\nValidation:\n- Prompts package tests 25/25, typecheck, and lint passed.\n- Previously affected agent consumer suites: 23/23 passed across three files.\n- Task-pool tests 32/32 passed. The live server plan classifies the prompts task as serial with zero parallel tasks.\n- Pinned Bun 1.3.14 and Node 24.15.0; `bun install`, root `bun run verify`, and `git diff --check` passed.\n- Hosted server validation is required after merge.\n\nUI captures and live-model trajectories: N/A. This changes test scheduling only; authored prompts and runtime code are unchanged.\n\nRefs #30552 and #30440.\n54:T1942,"])</script><script>self.__next_f.push([1,"# What\n\nAction eligibility is an exact-string overlap between an action's declared `contexts` and the routing contexts active for the turn (`hasActionContext` → `routingContextsOverlap`), and turns are classified only into **registered** context definitions. A declared name that nothing registers can never overlap.\n\n`plugin-notes` already documents this failure mode from experience, in its own words:\n\n\u003e Stage 1 classifies a turn into registered CONTEXTS, not actions: a context the taxonomy lacks is a request Stage 1 cannot name, however well the action itself advertises. Without this entry, \"what notes do i have?\" classified [wrongly] … the read then honestly reported an absence from the wrong store.\n\nIts fix was to register the context. This PR fixes four actions that hit the same trap without one.\n\n# How I found it\n\nValidated every `contexts: [...]` literal in the repo (12,839 source files) against `FirstPartyAgentContext`. 28 names are not first-party, across ~100 sites — which is a sweep result, not a bug report, so I triaged rather than filing it.\n\nThe discriminator: **exactly one plugin in the whole repo registers `ContextDefinition`s — `plugin-notes`.** So every other non-first-party name is registered nowhere. Narrowing to the class that is unconditionally wrong — actions where *every* declared context is unregistered, leaving no routable context at all — gives exactly two sites, one of which is a declared test fixture (`fixture-remote-plugin`) that I excluded.\n\n# The changes\n\n**1. `PROXY_STATUS` had no routable context at all** — `[\"debug\", \"operations\"]`, neither registered.\n\nReplacement chosen from precedent, not taste: core's own status actions use `[\"admin\",\"settings\"]`, `[\"secrets\",\"settings\"]`, `[\"automation\",\"agent_internal\"]`, and every sibling plugin status action pairs its custom tag with at least one first-party context. `PROXY_STATUS` reports mode, bound URL, listening state and token expiry → **`[\"system\", \"settings\"]`**, which maps the author's \"debug\"/\"operations\" intent onto contexts that exist.\n\n**2. Three near-miss names** where the intended registered context plainly exists, each sitting in an array whose every other member was already first-party:\n\n| file | was | now |\n|---|---|---|\n| `lifeops/household-operations/action.ts` | `finances` | `finance` |\n| `actions/agreement-knowledge.ts` | `docs` | `documents` |\n| `actions/document.ts` | `docs` | `documents` |\n\nI specifically checked the risk that a `@elizaos/plugin-finances` package might define `finances`: it registers no context, and its own scenario declares `contexts: [\"finance\"]` singular.\n\n# What I deliberately did not change\n\nThe other 22 non-first-party names (`apps`, `cloud`, `inbox`, `briefing`, `family`, …). Those are plausibly deliberate domain tags, and renaming them would be guessing at intent rather than correcting a demonstrable error. `agreement-knowledge.ts` still carries `family` for that reason.\n\n# Scope of the impact, stated honestly\n\n`shouldIncludeByContext` returns `true` when the active context set is empty, so these actions are not invisible in *every* situation — only whenever routing contexts are actually active, which is the case routing exists to serve.\n\n# The systemic gap\n\nNothing validates `action.contexts` against the registry, which is why these drifted silently. `ContextRegistry` already warns `Context ${id} references unknown context ${context}` for definitions, so the precedent exists — but the roster (`DEFAULT_CONTEXT_DEFINITIONS`) is not exported from the package index, so a plugin can't assert against it today either.\n\nI did not add a guard here because both plausible options — exporting the roster, or warning at registration — expand core's public surface or risk noisy warnings around plugin load order. Happy to do either if you tell me which you'd prefer.\n\n# Verification\n\n- `biome check` → clean on all four changed files.\n- `plugin-anthropic-proxy` typecheck → exit 0; `proxy-status.action.test.ts` → **4 pass / 0 fail**. Its wider suite has 2 failures that reproduce identically on `develop` (proxy config parsing, unrelated).\n- `plugin-personal-assistant` typecheck reports 186 errors — **byte-identical to `develop`'s 186**; I diffed the sorted error lists. Its two touched-file tests also fail on `develop`, from a missing `@elizaos/plugin-finances` workspace module.\n\nDiff is 4 files, **+4/−4**.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NEX19XQNSMGEXJTZ9JRZ55\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T05:40:11.709Z\",\"completed_at\":\"2026-09-04T05:41:28.497Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbf the flow these helpers implement no longer exists at that route.\n\n# When this happened, from git rather than from guesswork\n\n`0209487ea5` — *fix(cloud): minimize generative hot paths*, 2026-08-05:\n\n```\npackages/cloud/api/v1/apps/[id]/chat/route.ts | 861 +-------------------------\n1 file changed, 26 insertions(+), 835 deletions(-)\n```\n\nThat commit collapsed `route.ts` from 858 lines to 26 and removed all six references to the two helpers — and its diff touched **only** `route.ts`. Both modules and both test files were orphaned by it a month ago. This looks like leftover rather than something kept on purpose; if the reserve path is meant to come back to this route, say so and I'll close this instead.\n\n# Why remove rather than leave them\n\nDead code is cheap to ignore; **stale coverage is not.** The refund test's header says:\n\n\u003e This drives the REAL `reconcileChatSettleError` (the exact code the route runs)\n\nThat has been false for a month. `stream-refund.ts` carries ~50 lines of carefully-reasoned docstring about double-refunds minting credits during a DB blip (#10837, #11169, #11481, #11484), and a green test file asserting it is \"the exact code the route runs\". Anyone auditing app-chat refund safety would reasonably conclude the live path is covered. It isn't — the live path is `handleChatCompletionsPOST`.\n\nThat reasoning is preserved in the commits that wrote it and stays reachable via `git log`; what is removed is only the false claim that it is currently executing.\n\n# Verification\n\n- Repo-wide grep for `stream-refund`, `chat-reservation`, `reconcileChatSettleError`, `reservationOutputTokens`, `DEFAULT_ESTIMATED_OUTPUT_TOKENS`, `MAX_RESERVATION_OUTPUT_TOKENS`, `ChatSettleCredits` → **no matches remain**\n- `bun run --cwd packages/cloud/api typecheck` → **exit 0**, 0 `error TS`\n- `bunx @biomejs/biome check` on the remaining `route.ts` → clean\n\nFor the suite I compared **sorted failure lists**, not counts. `packages/cloud/api` is DB
