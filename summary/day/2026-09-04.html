/script><script>self.__next_f.push([1,"## The defect\n\n`diff-calculator.ts` and `sql-generator.ts` each kept a **private copy** of `normalizeType`, and the copies had drifted. Extracting both and diffing them, they are identical except for one branch — `sql-generator` lists three timestamp spellings, `diff-calculator` lists only the two long ones and is missing the `timestamptz` alias:\n\n| input | `diff-calculator` | `sql-generator` |\n|---|---|---|\n| `timestamptz` | **`\"timestamptz\"`** | `\"timestamp\"` |\n| `timestamp with time zone` | `\"timestamp\"` | `\"timestamp\"` |\n| `timestamp without time zone` | `\"timestamp\"` | `\"timestamp\"` |\n\nThat matters because **the two functions answer different halves of one decision**. `diff-calculator.ts:350`:\n\n```ts\nconst typeChanged = normalizeType(prevCol.type) !== normalizeType(currCol.type);\n```\n\npushes the column into `diff.columns.modified`, which drives `generateAlterColumnSQL`. `sql-generator` then asks `checkIfTypeChangeIsDestructive`, which normalizes the same pair with *its* copy.\n\nSo for a column introspected as `timestamp with time zone` against a schema spelling it `timestamptz`, the diff reports a change and the generator considers the two types identical — an `ALTER` that changes nothing, **re-emitted on every migration run**. Running both copies verbatim over the four spelling pairs:\n\n```\nprev (from DB)                curr (from schema)          diffCalc changed?  sqlGen equal?\ntimestamp with time zone      timestamptz                 true               true    \u003c-- spurious\ntimestamptz                   timestamp                   true               true    \u003c-- spurious\ntimestamp without time zone   timestamp                   false              true\ntimestamptz                   timestamp with time zone    true               true    \u003c-- spurious\n```\n\nThe diff never converges for such a column.\n\n## Why taking `sql-generator`'s variant loses nothing\n\nThis was the part worth checking rather than assuming. Collapsing `timestamptz` into `\"timestamp\"` looks like it would stop a genuine `timestamp` → `timestamptz` migration from being detected. It doesn't, because `diff-calculator` **already** collapses `timestamp without time zone` and `timestamp with time zone` to the same value — a real with/without-timezone change is already not detected there. Only the short alias slipped through, and only when the schema happened to spell it `timestamptz`. That is an incomplete alias list, not a designed capability.\n\n**The alternative I rejected:** keeping tz and non-tz distinct in a shared normalizer would be the semantically tighter choice, but `checkIfTypeChangeIsDestructive` returns `true` for any pair absent from `safeConversions`, and that table has:\n\n```ts\ntimestamp: [\"timestamp\"], // Simplified since normalization handles variations\n```\n\nSo distinguishing them would reclassify real timestamp changes as destructive and require extending that table. That is a semantics decision for maintainers, not something to smuggle into a de-duplication fix. Happy to do it as a follow-up if you'd like the tighter behaviour.\n\n## The change\n\n- `normalizeType` moves to a new `type-normalization.ts` with a comment recording *why* it must be one function — the two callers answer halves of one decision, so divergence makes the migrator contradict itself.\n- Both files import it; both private copies deleted. **Net −97 lines.**\n- A local `normalizeType` arrow inside `checkIfNeedsUsingClause` is renamed `baseType`. It strips the precision suffix to get a bare type name for the pair lookups, which is a different job, and it would otherwise shadow the new import. Block-scoped, so behaviour is unchanged.\n\n## Tests\n\nThe existing coverage is `type-normalization.real.test.ts`, and it would not have caught this for two reasons:\n\n1. The default vitest lane **excludes** it — `exclude: [..., \"**/*.real.test.ts\", ...]`.\n2. Its `timestamptz` case asserts only that `SELECT COUNT(*)` succeeds after migrating. It never checks that a **second** run finds nothing left to do, which is precisely the symptom.\n\nAdded 15 unit tests in the running lane covering the timestamp spellings (including an all-pairs-equal check), serial/bigserial/smallserial, numeric/decimal precision, `character varying` with and without a length, both text-array spellings, and pass-through of an unrecognised type.\n\n**Liveness control.** Reverting the shared normalizer to the drifted `diff-calculator` variant fails exactly 3 of the 15 — the two `timestamptz` spellings and the all-pairs-equal case.\n\n| check | result |\n|---|---|\n| `bun run typecheck` (`plugin-sql`) | exit 0 |\n| `vitest run runtime-migrator` | 15 passed |\n| `biome check` (4 touched files) | clean |\n\n## How this was found\n\nLooking for something else entirely — a scan for `String.replace` with a **string literal** pattern, which replaces only the first occurrence, in sanitizing contexts. That vein came up empty: 4270 `.replace()` calls, 337 with a string-literal pattern, 7 in a sanitize/normalize/strip context, and all 7 are clean (`parsePgTimestampWithoutTimezoneUtc` replaces the single space in a PG timestamp; `parseCudaCompute` has already stripped the `sm_` prefix so one underscore remains; the Reddit helper strips a `t3_` fullname prefix and base36 ids cannot contain an underscore; the rest are fixtures).\n\nWhat the scan did surface was `normalizeType` appearing twice in the same directory, which was worth more than the thing I was looking for.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PPHARXF8S4VYX1Z2TWRENN\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T17:12:51.230Z\",\"completed_at\":\"2026-09-04T17:17:45.637Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T17:12:51.803Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"2fe1d58877c56de30af71279b5a6a995cc1585374df73b1ab3738eb6af843ccd\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"aca9bb71-51f0-4ba4-ba34-56edf373ae44\",\"object_id\":\"sha256:2fe1d58877c56de30af71279b5a6a995cc1585374df73b1ab3738eb6af843ccd\",\"sha256\":\"2fe1d58877c56de30af71279b5a6a995cc1585374df73b1ab3738eb6af843ccd\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"I8rEt0HJYG6UaKomtz78X6muCFdtGqKggzc1mWwIU3wOgzo8EUlGovgKTyoTj59sNCI7QymbBgqo8ZkduSvQCQ\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"27:T5ca,"])</script><script>self.__next_f.push([1,"## Summary\n\n- recognize the complete hosted-gateway Blooio names-only credential tuple as an alternative to the generic connection tuple\n- make diagnostic alternative selection presence-aware on ties and report `partial` when any alternative has a configured name\n- cover all 32 Blooio cross-namespace states and preserve value-free reports\n\nThis changes only the managed-account diagnostic contract. It does not change provider registry behavior, provider configuration, credentials, gateway routing, deployment, database, control-plane, sandbox, or production state.\n\n## Exact-head validation\n\n- Base: `origin/develop` at `5463f6db84196db4f4588276bfb524c8c1453439`\n- Head: `367506becf74c1d45413e97f57246527b92188f5`\n- `mise exec -- bun run verify` — PASS\n- focused managed-account suites — 30 passed, 0 failed, 853 assertions\n- cloud/shared typecheck — PASS\n- Biome + diff check — PASS\n- security review on exact head — no findings\n- independent Bugbot/adversarial review on exact head — no bugs; all 243 absent/configured/placeholder combinations independently checked\n\n## Evidence boundaries\n\n- Browser/network: N/A — no customer-facing flow changed\n- Cloudflare/Railway/gateway: N/A — no runtime or configuration mutation\n- Database/control plane/sandbox: N/A — no access or lifecycle change\n- Provider receipt: N/A — no provider-side action\n- Credential handling: names only; no values read, emitted, or changed\n\nCloses #30510\nPart of #25025\nPart of #19910"])</script><script>self.__next_f.push([1,"28:Tf21,"])</script><script>self.__next_f.push([1,"## Problem\n\nTyping in the browser workspace address bar is silently discarded when a\nbackground workspace poll returns a snapshot that does not contain the selected\ntab. The field reverts to the committed URL and the edit is gone.\n\nThe polling loop runs every 2.5s while the view is visible, so this needs no\nuser action to trigger — it lands on whatever the user happens to be typing.\n\n## Cause\n\nTwo independent places both have to hold for the draft to survive, and neither\ndoes:\n\n1. `loadWorkspace` re-resolves the selection against every snapshot:\n\n   ```ts\n   setSelectedTabId((current) =\u003e\n     resolveBrowserWorkspaceSelection(snapshot.tabs, options?.preferTabId ?? current),\n   );\n   ```\n\n   `resolveBrowserWorkspaceSelection([], \"tab-apple\")` returns `null`, so an\n   empty background snapshot clears the user's selection. The `catch` immediately\n   below already treats a transient background result as non-authoritative\n   (`error-policy:J4 poll — retain the last successful workspace on a transient\n   background failure`); an empty success was not getting that treatment.\n\n2. The address-bar sync tested for a tab switch using `selectedTab?.id`:\n\n   ```ts\n   const currentSelectedId = selectedTab?.id ?? null;\n   if (currentSelectedId !== previousSelectedTabIdRef.current) {\n     previousSelectedTabIdRef.current = currentSelectedId;\n     setLocationInput(selectedTab?.url ?? \"\");\n     setLocationDirty(false);   // \u003c- the draft dies here\n     return;\n   }\n   ```\n\n   `selectedTab` is derived from the latest snapshot, so it is `null` for as long\n   as a refresh omits the tab. A transient snapshot therefore reads as a\n   deliberate tab switch and clears `locationDirty`.\n\nFixing either alone is not enough: keep the selection and `selectedTab` is still\nnull; fix the sync and the selection has already been nulled underneath it. I\nverified both halves separately before landing them together.\n\n## Fix\n\n- `loadWorkspace`: an empty snapshot from a **background** poll retains the\n  current selection rather than resolving it to null. Foreground loads and the\n  explicit close paths (which set the selection directly) are untouched, so a\n  genuinely closed tab still clears normally.\n- The sync now keys on `selectedTabId` — the user's selection — and only syncs\n  from a tab that actually resolved.\n\n## Tests\n\nTwo tests in `BrowserWorkspaceView.chrome.test.tsx`, one of which is a\ndeliberate control:\n\n| test | before | after |\n| --- | --- | --- |\n| unchanged poll repeated 3x keeps the draft | passes | passes |\n| poll drops the tab for one tick, then restores it | **fails** | passes |\n\nThe control matters: it shows an ordinary refresh was never the problem, so the\nfailing test is pinned to the transient-snapshot path specifically and is not\njust green-because-vacuous.\n\nMutation check — reverting only `BrowserWorkspaceView.tsx` and keeping both\ntests:\n\n```\n× keeps an in-progress address edit when a background poll drops the selected tab\n  Expected: \"docs.elizaos.ai\"\n  Received: \"https://www.apple.com/\"\n  Tests  1 failed | 1 passed | 30 skipped (32)\n```\n\n## Verification\n\n```\nnpx vitest run src/components/pages/BrowserWorkspaceView   -\u003e  36 passed (2 files)\nnpx biome check src/components/pages/BrowserWorkspaceView.tsx  -\u003e  clean\nnpx tsc --noEmit -p tsconfig.json                          -\u003e  clean\n```\n\n## Note on scope\n\n`canonical / Smoke (6)` is currently red on `develop` with the same shape —\n`browser-workspace.spec.ts:278` fills `docs.elizaos.ai` and reads back the\npreviously committed `https://example.com/`. That is what led me here. I have\n**not** proven the two are the same instance; I could not reproduce the E2E\nenvironment's snapshot timing, so I am not claiming this closes that job. The\nbug fixed here is reproducible on its own terms and is a real data-loss path\nregardless of whether it is also the Smoke (6) cause.\n"])</script><script>self.__next_f.push([1,"29:T18da,"])</script><script>self.__next_f.push([1,"## The failing job\n\n`canonical / Smoke (6)` fails on the current `develop` head — run\n[33822968275](https://github.com/elizaOS/eliza/actions/runs/33822968275) at\n`5463f6db84`, job\n[100870028378](https://github.com/elizaOS/eliza/actions/jobs/100870028378),\nstep *Deterministic end-to-end smoke*. It is the one failing job in that run\nthat no open PR claims: Smoke (3) is the HTTP 429 (#30527), Smoke lanes covers\ncartesia (#30529), `route-provider-selection` (#30395) and migrate-database\n(#30531), the four Zero-Key jobs are #30490, and the rest are downstream\naggregations.\n\n```\n1) [dashboard-desktop-landscape] › browser-workspace.spec.ts:82 ›\n   browser workspace can create, navigate, switch, and close tabs\n\n  Error: expect(locator).toHaveValue(expected) failed\n  Expected: \"docs.elizaos.ai\"\n  Received: \"https://example.com/\"\n\n  276 |\n  277 |   await addressInput.fill(\"docs.elizaos.ai\");\n\u003e 278 |   await expect(addressInput).toHaveValue(\"docs.elizaos.ai\");\n```\n\nThe spec waits for the address bar to settle on the selected tab's URL, fills\nthe field, and finds it back at that tab's **previous** address — 34 locator\nresolutions, so it never recovers. It passes on `desktop-webkit` and fails on\n`dashboard-desktop-landscape`: a timing difference, not a deterministic break.\n\n## Why it happens\n\n`locationDirty` is what stops the sync effect from overwriting what the user is\ntyping. The tab handlers end like this, after two awaits:\n\n```ts\nawait loadWorkspace({ preferTabId: tab.id, silent: true });\nsetLocationInput(tab.url);\nsetLocationDirty(false);\n```\n\nBoth writes are unconditional, so text typed while the operation was in flight\nis overwritten. Worse, clearing the flag **re-arms** the sync effect, which\nthen writes `selectedTab?.url` from workspace state over the top — which is why\nthe value CI sees is the tab's previous URL rather than either the typed text\nor the navigation target.\n\nI reproduced it against the real component with the client call held in flight:\n\n```\nuser typed  : \"typed-during-flight.test\"\nafter settle: \"https://example.com/\"        \u003c- CI's exact value\n```\n\nMy first hypothesis was wrong, for the record: I expected a background workspace\nrefresh to be the clobberer. It is not — typed text survives a background\nreload, because that path does respect `locationDirty`. Only the terminal write\nat the end of a tab operation clears it.\n\n## The fix\n\nEvery user edit bumps a `locationEditSeqRef`. The two handlers that write the\naddress bar *after* awaiting snapshot it before their first `await` and skip\nthat terminal write if the user has typed since.\n\nA real browser does not erase what you are typing when a page finishes loading,\nso I read this as a product bug rather than a flaky test — the spec asserts the\nright thing.\n\n**Scope.** Only `navigateSelectedBrowserWorkspaceTab` and\n`openNewBrowserWorkspaceTab`, the two paths that write the bar after an await.\nThe synchronous native-mobile branches cannot interleave with typing, and the\nclose-all reset is a deliberate response to an explicit user action; both are\nleft alone.\n\n## Tests\n\nTwo added, driving the real component with `navigateBrowserWorkspaceTab` held\nin flight.\n\n- Typing during the in-flight window survives the navigation settling.\n- **Liveness control**: with no typing, the settled URL is still adopted.\n  Without it, the fix could pass by making the address bar stop following\n  navigations altogether.\n\nThat control initially failed, and it was my fixture rather than the component:\nthe mock had `navigateBrowserWorkspaceTab` returning `docs.elizaos.ai` while\n`getBrowserWorkspace` still returned `example.com`, so the workspace the effect\nmirrors disagreed with the navigation. Made the mock self-consistent, as a real\nserver would be.\n\n**Ablation** — reverting only `BrowserWorkspaceView.tsx`:\n\n```\n× keeps what the user typed while a navigation was still in flight\n  → expected 'https://docs.elizaos.ai/' to be 'typed-during-flight.test'\nTests  1 failed | 31 passed (32)\n```\n\nRestored: `32 passed`. Biome clean. `tsc --noEmit -p packages/ui` reports 0\nerrors on this branch and 0 on `develop`.\n\nI have not re-run the full Playwright smoke lane locally (14.6 min in CI); the\ncomponent-level reproduction above is byte-identical to the value CI reported,\nand the lane will confirm on this PR.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PGQ3Z54Y79SH5YNCV2GADF\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T15:31:09.413Z\",\"completed_at\":\"2026-09-04T15:32:04.727Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T15:31:09.980Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"d6ef9aa8a79f6f3b05c7906256f23b0ae8eeca2478e4f8eba90539d9050499dd\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"4380b886-eac2-407e-99c1-de5f3ee64819\",\"object_id\":\"sha256:d6ef9aa8a79f6f3b05c7906256f23b0ae8eeca2478e4f8eba90539d9050499dd\",\"sha256\":\"d6ef9aa8a79f6f3b05c7906256f23b0ae8eeca2478e4f8eba90539d9050499dd\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"0lLIvm3i84a7Z4gSvu5kb4RSE_hXKnhXObBATf-5tzcYcHxHKCCtG-Jdxia2w1XuDLQmxdijBx1KeV5ABErNAQ\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"2a:T1896,"])</script><script>self.__next_f.push([1,"# What\n\nA path-gate pattern that matches nothing on disk is **silently inert**: the lane it was meant to trigger simply never sees that surface. Nothing fails, nothing warns.\n\nThis file already carries a test for one instance of that — the \"classifier self-registration regression\" block exists because `.github/workflows/classify-paths.yml` itself went unregistered in every `CONFIGS` rule during the workflow consolidation, so a classifier-only diff returned every lane `false`.\n\nThe same consolidation left a second one:\n\n```js\n\"packages/app-core/scripts/docker-healthcheck.mjs\",\n```\n\nThat path has **no history in this repository**. `git log --all --diff-filter=ADR` on it returns nothing — it was never restored because it never existed. It was added by `59ffb5ef60`, titled *\"restore scripts deleted by half-landed workflow consolidation; reconcile gates with surviving workflows\"*, and `ci-path-gate.mjs` is the only file in the repo that mentions the name. The real container healthchecks are inline `HEALTHCHECK` directives in `packages/app-core/deploy/Dockerfile.ci` and `Dockerfile.cloud-agent`.\n\n# The deletion changes no routing\n\nI checked this with `evaluate()` rather than by reading patterns, because the docker rule's second group already covers the whole directory:\n\n| changed file | docker lane | matched via |\n| --- | --- | --- |\n| `packages/app-core/scripts/docker-healthcheck.mjs` | **triggers** | `packages/app-core/**` |\n| `packages/app-core/scripts/docker-entrypoint.sh` | **triggers** | `packages/app-core/**` |\n| `packages/app-core/scripts/docker-ci-smoke.sh` | **triggers** | own pattern + `packages/app-core/**` |\n| `packages/app-core/deploy/Dockerfile.ci` | **triggers** | `packages/app-core/deploy/**` + `packages/app-core/**` |\n| `docs/README.md` | no-op | — |\n\nSo even a file created at that exact name would still trigger the lane. The last row is there to show the lane is not trivially always-on.\n\n# The guard\n\nThe new tests assert that every pattern in every `CONFIGS` rule — plus `failSafe` — matches at least one tracked file, using a verbatim copy of the script's own `globToRegExp` so the test asks exactly the question the gate asks.\n\nI swept all four configs this way: **2 of 111 patterns matched nothing**. The second is scenario-pr's root `vite.config.*`, and I deliberately kept it. The rule I used, which is written into the allowlist:\n\n\u003e naming a specific nonexistent **file** is a stale reference; a conventional config **glob** is forward-looking.\n\nNo root `vite.config.*` exists today, but the sibling `vitest.config.*` in the same rule matches the real root `vitest.config.ts`, so nothing is uncovered, and a root vite config added later should trigger the lane without a gate edit. It is allowlisted with that reason rather than silently tolerated.\n\nA second test keeps the allowlist honest: it fails if an allowlisted pattern starts matching a tracked file (so the entry gets removed) or stops being used by any rule (so the allowlist cannot outlive its pattern).\n\n# Verification\n\n**Proven against the unfixed tree.** Restoring the deleted pattern fails the new test, naming it exactly:\n\n```\n+   \"docker: packages/app-core/scripts/docker-healthcheck.mjs (Docker smoke workflow or image contract)\",\n```\n\n- `bun test packages/scripts/__tests__/ci-path-gate.test.mjs` → **13 pass / 0 fail** (was 11).\n- Sibling suites `ci-classifier-dedup-contract` + `ci-android-aab-workflow` → **9 pass / 0 fail**.\n- `node --check packages/scripts/ci-path-gate.mjs` → clean.\n- `biome check` on the test file is clean; `ci-path-gate.mjs` reports the same **4 pre-existing warnings** as develop (I did not touch them).\n\n# Scope\n\nOne dead pattern removed and a contract test added. No lane routing, output wiring, or workflow file changes.\n\nWhile I was here I also checked the rest of the CI wiring and found it sound, so there is nothing else in this PR: every `steps.\u003cid\u003e` reference resolves to a declared step id (104 references), every `needs.\u003cjob\u003e.outputs.\u003cname\u003e` resolves once reusable-workflow calls are followed into the callee's `on.workflow_call.outputs` (160 references), all 11 `workflow_call` output values resolve to real job outputs, and all 10 `classify-paths` outputs have at least one reader.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1P7NAJMXPJX0X4G8GXXC692\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T12:52:53.460Z\",\"completed_at\":\"2026-09-04T12:54:00.371Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T12:52:53.677Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_ rn(normalizedTerm)…}\\\\b`, \"i\");\nif (pattern.test(text)) return true;                    // ← raw text\n\nconst hasNonAsciiText = [...text].some((c) =\u003e c.charCodeAt(0) \u003e 0x7f);\nif (hasNonAsciiText) return normalizedText.includes(normalizedTerm);  // ← boundaries gone\n```\n\nBecause the pattern never sees normalized text, an NFKC-only spelling (full-width `ｓｃａｎ`) can't satisfy it — which is exactly what the substring fallback was compensating for. The compensation is far broader than the problem.\n\n# Fix\n\nTest the **normalized** text. That keeps the NFKC and CJK-embedded matches the fallback existed for, so the fallback is deleted rather than patched.\n\nI checked that with a differential harness over 12 cases before writing it:\n\n| text | term | before | after | wanted |\n|---|---|---|---|---|\n| `restart the server 🙂` | `art` | ✅ match | ❌ | must not |\n| `please reschedule 🙂` | `schedule` | ✅ match | ❌ | must not |\n| `I am scanning café` | `scan` | ✅ match | ❌ | must not |\n| `classified ✅` | `class` | ✅ match | ❌ | must not |\n| `run a scan now 🙂` | `scan` | ✅ | ✅ | must match |\n| `开始scan任务` | `scan` | ✅ | ✅ | must match |\n| `ｓｃａｎ now` | `scan` | ✅ | ✅ | must match (NFKC) |\n| `SCAN THIS` | `scan` | ✅ | ✅ | must match |\n| `scan  the   disk` | `scan the disk` | ❌ | ✅ | must match |\n\n# A second bug the harness exposed\n\nThat last row: `escapePattern` escapes `[.*+?^${}()|[\\]\\\\]`, which **does not include a space**, so the old `.replace(/\\ /g, \"\\s+\")` was looking for a backslash-space that never exists. The relaxation was inert, and a multi-word term could not span a double space or a line break. Normalizing the text fixes it; I also corrected the replace to `/ /g` so the author's intent survives if normalization ever changes.\n\n# Both copies\n\nThis module is duplicated byte-for-byte at `packages/core/src/i18n/validation-keywords.ts`. Fixed identically in both, with cases pinned in both suites and a comment in the core copy pointing at its sibling. (Deduplicating them is a bigger change than this fix warrants.)\n\n# Evidence\n\n**Control:** reverting only the two production files and keeping the tests fails **exactly 12 cases** (6 per copy); the other 20 — including every \"still matches\" positive — stay green, so the probes are neither vacuous nor over-tightened.\n\n| | on `develop` | with the fix |\n|---|---|---|\n| the two keyword suites | **12 failed** / 20 passed | 32 passed |\n| `shared/i18n` + `core/i18n` + `advanced-capabilities` | — | **819 passed** (55 files) |\n\n`biome check` clean. `packages/core` and `packages/shared` typecheck both exit 0, 0 errors.\n\nTwo of my own slips were caught by those checks rather than shipped: a duplicate import (TS2300 — and the `develop` control confirmed `shared` typechecks clean, so it was mine), and a `/[^\\x00-\\x7f]/` in a test that biome rejected under `noControlCharactersInRegex`, replaced with explicit literal cases.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NB90RFVHD0FA18RG1BX1CF\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T04:36:50.063Z\",\"completed_at\":\"2026-09-04T04:37:59.211Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df4863 een, no warning appears, and the artifact written specifically to explain it is discarded with the runner.\n\n# The asymmetry that produced it\n\nThe other three packaged smokes fail the job:\n\n| step | line | `continue-on-error` |\n|---|---|---|\n| Smoke test packaged Linux desktop | 924 | — |\n| Smoke test packaged Windows app | 1137 | — |\n| **Smoke test packaged macOS app** | **1451** | **`true`** |\n\nThere's no comment explaining the macOS exception, and the step immediately before it fails closed on a missing `Developer ID Application` signature.\n\n# What this changes — and what it deliberately doesn't\n\n**I did not change the gating.** Whether the macOS smoke *should* fail the release like the other two is your call: I can't assess macOS runner flakiness from here, and dropping `continue-on-error` could start breaking releases for reasons that have nothing to do with this bug. If it is meant to gate, that's a one-line follow-up; if it's meant to stay advisory, it should at least be audible.\n\nThree changes, all wiring:\n\n1. The smoke step gets `id: macos-packaged-smoke`, plus a comment recording that it is advisory unlike Linux/Windows and why the id is load-bearing.\n2. The diagnostics upload now also fires on that step's own outcome:\n   ```yaml\n   if: \u003e-\n     (failure() || steps.macos-packaged-smoke.outcome == 'failure') \u0026\u0026\n     matrix.platform.os == 'macos'\n   ```\n   Keeping `failure()` means this stays correct if the smoke is ever promoted to a hard gate.\n3. A new step emits a `::warning::` annotation and a `$GITHUB_STEP_SUMMARY` line when the advisory smoke fails, so a green release run still shows what happened.\n\n# Verification\n\n- `Bun.YAML.parse` on the edited workflow: parses, 6 jobs. The three touched steps resolve to the intended conditions, including the explicit `matrix.platform.os == 'macos'` guard on the new reporting step.\n- `packages/scripts/__tests__/release-electrobun-macos-smoke-diagnostics.test.ts` pins the wiring. Against **unmodified `develop`** it fails 3 of 4 — missing id, upload not keyed off the outcome, no advisory report. Against this branch: **4 pass**.\n- The 4th assertion (Linux and Windows smokes still fail the job) passes on both, which is the point: it guards the asymmetry from being \"fixed\" in the wrong direction.\n- `bunx @biomejs/biome check` clean on the new test.\n\nThe test pins wiring, not policy — if you later make the macOS smoke fail the job, `failure()` covers the upload and every assertion still holds.\n\n# Context\n\nFound by sweeping workflows for fail-open shapes after #30516. Two clean negatives worth recording: the verification-shaped `|| true` uses are all fine (`deploy-gateway-webhook.yml:623` is a curl inside a retry loop whose status is checked afterward with an explicit `exit 1`; the rest are `docker system prune` and `git checkout` cleanup), and the only other gate-shaped `continue-on-error` steps are disk reclamation.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1P3RGBHQH0PPH9WR3E06JJV\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T11:44:43.378Z\",\"completed_at\":\"2026-09-04T11:46:36.245Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e90 t.ts\n```\n\nAll three were deleted in #28109. I ran the exact command: the vitest half reports\n\n```\nNo test files found, exiting with code 0\nfilter: test/route-coverage.test.ts, test/ui-smoke-coverage.test.ts, test/view-interaction-coverage.test.ts\n```\n\nBecause the extra args append to the end of `packages/app`'s `test` script (`bun test scripts … \u0026\u0026 vitest run …`), the step's only remaining effect is re-running that package's bun scripts suite — **950 tests, ~33 s** — which the client lane already covers, since `packages/app` declares `testLanes: [\"client\"]` and `test:client` runs the same `test` script.\n\nSo the step is a redundant re-run plus a no-op gate. Removed. **No coverage is lost**: the work it still did is exactly what `test:client` does.\n\n# `test.yml:713` — Electrobun step silently runs 4 of 6\n\n`src/dynamic-view-rpc-schema.test.ts` and `src/dynamic-views/host.test.ts` are gone. Measured, the step runs **4 files / 76 tests**. That package's `test` script carries `--passWithNoTests`, so the dead filters can never complain. Dropped the two names; the four surviving ones are unchanged.\n\n# `scenario-pr.yml:463` — a comment asserting a guarantee that no longer exists\n\nThe comment said the ui-smoke deny-list wiring \"is enforced by `packages/app/test/ui-smoke-coverage.test.ts`\". That file went in #28109, and nothing covers `ui-smoke-pr-specs.mjs` today. Reworded to say the enforcement was removed rather than implying it still runs — I did not try to restore it, which is a separate decision.\n\n# The guard\n\n`packages/scripts/__tests__/workflow-test-path-references.test.ts` asserts every test path named in a workflow `run:` command resolves, against the repo root or any workspace package root (steps use `--cwd`/`working-directory`).\n\nRun against **unmodified `develop`**, it fails with exactly the five:\n\n```\n+   \"test.yml: test/route-coverage.test.ts\",\n+   \"test.yml: test/ui-smoke-coverage.test.ts\",\n+   \"test.yml: test/view-interaction-coverage.test.ts\",\n+   \"test.yml: src/dynamic-view-rpc-schema.test.ts\",\n+   \"test.yml: src/dynamic-views/host.test.ts\",\n```\n\nAgainst this branch: **2 pass, 0 fail.**\n\nIt deliberately skips YAML comments and any token containing `*` — comments are prose (`scenario-pr.yml` names a suite while describing it), and a glob is not a path. It lives in `packages/scripts/__tests__`, so `bun run test:scripts` picks it up.\n\n# Verification\n\n- Both workflows still parse — `Bun.YAML.parse`: `test.yml` 21 jobs, `scenario-pr.yml` 18 jobs.\n- Electrobun step after the edit: 4 files, **76 tests passing**.\n- Guard: fails on `develop` with the five names, passes here.\n- `bunx @biomejs/biome check` clean on the new test.\n\n# Context\n\nFound by extending the enumerated-path-list sweep from #30513/#30515 to CI. Two clean negatives on the way: `packages/elizaresearch` names 2 files and has exactly 2, and `plugins/plugin-local-inference` names 6 under `native/` plus a directory — its seventh, `voice_duet_sweep.test.mjs`, is covered because `vitest.config.ts:123` includes it explicitly.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1P3BJV4BGF8YGRZQW6FT3YS\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T11:37:39.940Z\",\"completed_at\":\"2026-09-04T11:39:57.906Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01 sh: null` — a deliberate re-broadcast of a row that had a recorded hash.\n\nThat is safe, and the code already knows why. A reverted ERC-20 transfer and an atomically-failed Solana transaction both moved no tokens, so the payout provably did not happen. The Solana branch says so inline:\n\n```ts\n// The transaction landed but failed atomically — no SPL transfer executed,\n// so it is safe to retry (markFailed clears the broadcast hash).\n```\n\nSo the code is correct and the docstring over-claims. **The real invariant is about an _unknown_ broadcast outcome, not a recorded hash.** I checked that the paths which do guard the strict rule guard it properly: all three `recoverStaleProcessing()` branches gate on `isNull(broadcast_tx_hash)`, and `handleProcessingThrow()` re-reads the hash and parks the row in `processing` when it is set. Nothing needed fixing there.\n\nThis matters because the over-claim invites a specific harmful edit, and #10588's framing (\"a recorded broadcast hash means recovery must never re-broadcast\") makes that edit look like a bug fix. Keeping the hash on a confirmed failure carries it into the next attempt, so a worker death during *that* attempt leaves a row `recoverStaleProcessing()` refuses to touch — stranded in `processing` forever. Routing the confirmed failure to reconciliation instead sends every reverted payout to manual review.\n\n# The change\n\nTwo things, no behavior change:\n\n1. Scope the docstring to what it actually guards, name the confirmed-failure exception and why it is safe, and say plainly what not to \"fix\".\n2. Add the two cases that were missing.\n\nThe suite has 13 cases and covers the **unknown** outcome well — `(d)` is \"an eviction during confirm leaves it for reconciliation\". Nothing covered a **confirmed** on-chain failure, which is exactly the behavior the old wording forbids. The new cases sit next to `(d)` so the pair reads as one contract:\n\n- **(d3)** a confirmed revert clears the broadcast hash, returns the row to `approved` with `retry_count = 1`, and broadcasts exactly once\n- **(d4)** the re-queued row completes on the next batch: two broadcasts, one payout, and exactly one `redemption` ledger entry\n\n# Mutation results\n\nBoth cases are load-bearing, and they discriminate different edits:\n\n| mutation | outcome |\n| --- | --- |\n| drop `broadcast_tx_hash: null` from `markFailed`'s retryable branch — the edit a literal reading of the old docstring invites | **(d3) fails** — 15 pass / 1 fail |\n| make the `reverted` return `retryable: false` | **(d3) and (d4) fail** — 14 pass / 2 fail |\n| unmodified | 16 pass / 0 fail |\n\nI ran these because I nearly filed the opposite PR. My first read was that `markFailed` clearing the hash was a double-pay bug against the stated invariant. It isn't — the two post-broadcast retryable returns are both confirmed-no-transfer outcomes — so the fix belonged in the prose and the coverage, not the logic.\n\n# Verification\n\n```\nbun run --cwd packages/cloud/shared typecheck                 -\u003e exit 0\nbunx @biomejs/biome check \u003cboth files\u003e                        -\u003e clean\nbun test __tests__/payout-stale-lock-recovery.test.ts         -\u003e 16 pass / 0 fail   (was 14)\nall four payout suites                                        -\u003e 34 pass / 6 skip / 0 fail\n  same four suites on develop                                 -\u003e 32 pass / 6 skip / 0 fail\n```\n\nThe 6 skips are pre-existing and identical on both sides; I diffed the counts rather than assuming.\n\n# What I did not change\n\n`markFailed`'s hash-clearing, the two post-broadcast `retryable: true` returns, the `recoverStaleProcessing()` gates, and `handleProcessingThrow()` are all untouched — they are correct as they stand. This PR only makes the docstring agree with them and pins the exception so a future reader cannot quietly remove it.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider 69tCkZsJmIP1M2uiiwWJPuuU7XWfqMRCk8bveGE59wSHwNYCQtQfhR9dRDg\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"2f:T16a8,"])</script><script>self.__next_f.push([1,"# What users see today\n\nTwo of these ship visibly.\n\n**zh-CN**, `computeruseapprovaloverlay.ModeLine` — the overlay renders a label with nothing after it:\n\n```\n模式：auto · 工具：\n```\n\nThe translation is `'模式：{{mode}} · 工具：{{tool}}'`, but the call site in `ComputerUseApprovalOverlay.tsx:311` passes `mode` and never `tool`.\n\n**tl**, `charactereditor.ConversationCount` and `PostCount` — the count the translator meant to show is swallowed:\n\n```\nt(\"tl\", \"charactereditor.ConversationCount\", { defaultValue: \"conversations\" })  →  \" usapan\"\nt(\"tl\", \"charactereditor.PostCount\",         { defaultValue: \"posts\" })          →  \" post\"\n```\n\n`CharacterEditorPanels.tsx:866` already prints the number itself (`{length}{\" \"}{t(...)}`) and passes only `defaultValue`, so `{{count}}` resolves to nothing and leaves a stray leading space.\n\n# Why\n\n`interpolate` in `src/i18n/index.ts`:\n\n```ts\nfunction interpolate(template: string, vars?: TranslationVars): string {\n  if (!vars) return template;                 // ← unsupplied placeholder stays LITERAL\n  return template.replace(/\\{\\{(\\w+)\\}\\}/g, (_, key) =\u003e {\n    const raw = vars[key];\n    if (raw == null) return \"\";               // ← or becomes an empty string\n    return String(raw);\n  });\n}\n```\n\nA placeholder that exists only in a translation names a variable no caller was ever asked to supply. It renders empty, or — if the call site passes no vars at all — leaves the `{{name}}` on screen.\n\n# How I found it, and what I deliberately did not report\n\nComparing `{{…}}` sets per key across all eight locales gives **345 mismatches**, which is not a bug report. Triaging the classes:\n\n- `ja`/`ko`/`vi`/`zh-CN` dropping `{{plural}}` is **correct** — those languages have no plural form.\n- ~200 cases of a locale spelling the product name out instead of interpolating `{{appName}}` render fine.\n\nOnly the inverse is unconditionally wrong, and that narrows 345 to **5 keys**.\n\nOf those five, `header.MobileNavigationDescription` and `documentsview.DocumentCountOne` have **no call site** outside a checked-in e2e HTML snapshot — dead keys, no runtime impact. I fixed them so they're safe if ever wired up, but I'm not claiming they were breaking anything.\n\n# The fix\n\nEvery other locale already renders these three as plain labels — `es` `'Conversaciones'`, `ja` `'会話数'`, `es` `'Modo'`, `vi` `'Chế độ'`. `tl` and `zh-CN` were the outliers. So rather than invent copy, `tl` becomes exactly what the translator wrote minus the placeholder, and `zh-CN` `ModeLine` becomes `'模式'`, matching all six peers.\n\n7 changed lines across 4 files, no reformatting (`git diff --numstat`).\n\n# The guard\n\n`locale-placeholders.test.ts` pins only the direction that is always wrong: a translation **may** drop a placeholder English has, but must never introduce one. Asserting full parity would fail on the ~340 legitimate cases. A roster assertion keeps a newly added locale from silently skipping the check.\n\n**Control:** stashing only the locale files and keeping the test makes **exactly the 4 locales I edited fail**, while `ja`, `pt` and `vi` stay green — so the guard is neither vacuous nor over-broad.\n\n| | on `develop` | with the fix |\n|---|---|---|\n| `locale-placeholders.test.ts` | **4 failed** / 4 passed | 8 passed |\n| `packages/ui/src/i18n/` | — | 18 passed |\n\n`biome check` clean on all five files. `bun run --cwd packages/ui typecheck` exit 0, 0 errors.\n\n# Unrelated failures, attributed not reported\n\nThe character and shell component suites show 4 failures (`DefaultHomeWidgets` clock/weather tiles, a `ChatOverlay` fuzz test). Re-running those three files on a stashed tree reproduces the same 4 on `develop`, so they're pre-existing and not from this change.\n\nCompute receipt: 0 project-attr ywright's `test:e2e`.\n\n| mutation | result |\n|---|---|\n| drop a real suite from the list | **1 failed** / 2 passed |\n| name a deleted suite | **1 failed** / 2 passed |\n| *(clean)* | **3 passed** |\n\n# Verification\n\n`bun run test` → **exit 0**, three batches:\n\n| batch | before | after |\n|---|---|---|\n| main | 261 tests / 21 files | **264 / 22** |\n| `provisioning-poll-hook` | 17 / 1 | 17 / 1 |\n| `use-eliza-app-provisioning-chat` | — | **16 / 1** |\n| **total** | **278 / 22** | **297 / 24** |\n\n`bunx @biomejs/biome check` clean on both changed files.\n\n# One correction\n\nMy first pass also reported a `.test.ts` vs `.test.tsx` extension mismatch on `get-started-continuation-render`. That was a bug in my own extraction regex — `(?:ts|tsx)` matches `ts` first and truncated the real `.tsx` path. There is no extension typo; the drift is the one stale entry and the one orphan above.\n\n# Context\n\nFound while asking which packages CI actually runs. Two clean negatives on the way: `packages/cloud/scripts` has no manifest and 73 of its 89 test files are named nowhere, but `test-cloud-run.mjs` targets that directory wholesale, so they do run; and all 151 workspace packages that contain tests declare a `test` script. `packages/homepage` sits outside every `testLanes` lane, but that's deliberate — `quality.yml` runs its tests directly and `audit-test-lane-membership.test.ts` names it explicitly.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1P194MH4XG1PXGAJ078GW1T\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T11:01:22.705Z\",\"completed_at\":\"2026-09-04T11:19:40.546Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T11:01:23.291Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"4526f1b48160c150a1d02c8fb59150806d2961f0f273073cfe5cc10fa0df8045\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"ae8e82c9-9099-46f2-96d3-6b10f92f4a92\",\"object_id\":\"sha256:4526f1b48160c150a1d02c8fb59150806d2961f0f273073cfe5cc10fa0df8045\",\"sha256\":\"4526f1b48160c150a1d02c8fb59150806d2961f0f273073cfe5cc10fa0df8045\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"7qkizsXDPy8HZX4b5kCyzT9H58_qCbFcpbJflSTFOAd0baSG6EcAwvkc-7grK4NJkrvi7cb11srFyZx8WJpUDQ\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"31:T1746,"])</script><script>self.__next_f.push([1,"# What\n\n`sharedRestMessageSend` drops the shared turn's `degraded` flag, so the guard added in #30482 and merged into `develop` can never fail.\n\nThat spec asserts:\n\n```ts\nexpect(firstTurn.json.degraded, `... must use the configured mock model ...`).not.toBe(true);\n```\n\nbut the endpoint it calls — `/api/v1/eliza/agents/:agentId/api/conversations/:conversationId/messages` — never returns the field:\n\n```ts\n// shared-rest-adapter.ts:645\nreturn {\n  text: replyText,\n  agentName: agentName || \"Eliza\",\n  ...(mediaUrls.length \u003e 0 ? { mediaUrls } : {}),\n  ...(timing ? { timing } : {}),\n};\n```\n\n`messages/route.ts` assigns `result` once and returns `Response.json(result)` verbatim, so `json.degraded` is permanently `undefined` and `expect(undefined).not.toBe(true)` passes — including on exactly the no-model turn the assertion exists to catch. Raised on #30482 after it merged; this is the follow-up I offered there.\n\nThe flag isn't missing upstream. `degraded: boolean` is **required** on the shared turn result (`run-shared-agent-turn.ts:231`, `:260`), set `true` only in the two `!modelId` branches (`:1144`, `:1379`), and both other response shapes already carry it — `shared-runtime-chat.ts:1482` and `eliza-sandbox.ts:5366`. The REST adapter is the one path that drops it, and it's the path this E2E reads.\n\n# The change\n\nForward what the bridge reported:\n\n```ts\n// The bridge always sends a boolean (`degraded` is required on the shared\n// turn result), so absence means the bridge shape changed rather than that\n// the turn was healthy — forward only what it actually reported.\n...(typeof result.degraded === \"boolean\" ? { degraded: result.degraded } : {}),\n```\n\nplus `degraded?: boolean` on the declared return type and `degraded?: unknown` on the bridge-result cast. Six lines in one function; no other production behaviour changes.\n\n## Why not `degraded: result.degraded === true`\n\nThat was my first instinct and it's wrong twice. It reports a healthy `false` when the bridge sent nothing at all, collapsing \"healthy\" and \"the bridge shape changed\" into one value — which is the exact ambiguity this flag exists to remove. And it breaks three existing `toEqual` assertions that pin the returned object exactly. Absence is forwarded as absence.\n\n## The spec assertion, tightened\n\n`.not.toBe(true)` → `.toBe(false)`, both turns. `not.toBe(true)` cannot distinguish \"field absent\" from \"turn healthy\", which is precisely how this went unnoticed. `toBe(false)` fails when the turn is degraded *and* when the field stops being emitted.\n\n# Evidence\n\n`bun test shared-rest-adapter.test.ts shared-rest-adapter.error-policy.test.ts` → **41 pass / 0 fail** (up from 38).\n`bun test 'v1/eliza/.../messages/route.test.ts'` → **1 pass / 0 fail**.\n`bun run --cwd packages/cloud/shared typecheck` and `--cwd packages/cloud/e2e typecheck` → clean.\n`bunx @biomejs/biome check` on the three touched files → no findings.\n\nMutation-tested the forwarding line against the three new tests:\n\n| mutant | result |\n|---|---|\n| drop the forwarding spread entirely | **2 fail** |\n| forward on `result.degraded !== undefined` | **1 fail** |\n| forward only when `result.degraded === true` | **1 fail** |\n| unconditional `degraded: result.degraded === true` | **3 fail** |\n\nAll four killed. The fourth's third failure is a pre-existing test, which is the direct evidence for the conservative form above.\n\nThe three new tests cover: `degraded: true` forwarded alongside the placeholder reply text; `degraded: false` surviving as `false` with `Object.hasOwn(out, \"degraded\") === true`; and a missing or non-boolean value (`undefined`, `\"true\"`, `1`, `null`) leaving the key absent rather than coerced.\n\n# Note\n\nI can't run the Playwright E2E itself here — it needs the deployed worker and a live shared runtime. The unit tests pin the adapter contract the spec depends on; the spec change is the one-token tightening above.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MXC2CRVY6XBZYV12FSY00T\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T00:33:49.976Z\",\"completed_at\":\"2026-09-04T00:34:45.818Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T00:33:50.656Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"676bade886eb420360b9173db6ad29dc425d838277103217bb66ca1b89f02a4d\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"1d52da06-52cc-440d-896a-4cb2b85c5667\",\"object_id\":\"sha256:676bade886eb420360b9173db6ad29dc425d838277103217bb66ca1b89f02a4d\",\"sha256\":\"676bade886eb420360b9173db6ad29dc425d838277103217bb66ca1b89f02a4d\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"HVdiwKQcpHukFqnTDimqaRqvr10OYDkDqSnIN6DyRwBF1ZkqeyvqI_6wdXzaPqbsDGwmVGlPWVoxVFpJQXS3BA\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"32:T155b,"])</script><script>self.__next_f.push([1,"# What\n\n`packages/app-core/vitest.config.ts` carves `scripts/**` suites out of vitest because they use `node:test` / `bun:test`, and its comment states the contract plainly:\n\n```\n// The runner-based suites above are excluded from vitest because they use\n// node:test/bun:test. They are executed by `bun run test:script-suites`\n// (chained from `test`) so the exclusion no longer means \"runs nowhere\".\n```\n\nNothing checked that promise, and it is broken in one place. `test:script-suites` **hand-enumerates** its files rather than globbing, and `scripts/mobile-auth-simulator-smoke-endstate.test.mjs` is excluded from vitest *and* absent from the list — so its **12 assertions run in no lane at all**. They pass when run directly (11 passing, 1 skipped); they simply weren't running.\n\nAuditing all 25 literal `scripts/*.test.mjs` exclusions:\n\n| | count |\n|---|---|\n| covered — enumerated, or Windows-only (still runs on every Linux lane) | 21 |\n| **stale** — exclusion names a file that no longer exists | **3** |\n| **runs nowhere** | **1** |\n\nThe three stale entries are `run-mobile-build-policy.test.mjs`, `aosp/compile-libllama-fused.test.mjs`, and `android-sms-gateway-template.test.mjs`.\n\n# The change\n\n- Add the orphaned suite to `test:script-suites`.\n- Drop the three stale exclusions.\n- Add `test/scripts/script-suite-coverage.test.ts`, which imports `vitest.config.ts` and asserts both halves of the documented contract: every literal `scripts/` exclusion is enumerated somewhere, every exclusion names a file that exists, and every enumerated file exists.\n\nThe guard reads the real `config.test.exclude` rather than re-parsing the config text, so it tracks the array as it's edited. It deliberately looks only at literal `scripts/…` entries — the glob exclusions (`**/*.e2e.test.ts` and friends) describe categories, not individual runner-based suites — and Windows-only exclusions need no entry, since that arm of the array is absent off Windows and those files run on every Linux lane.\n\n# The guard is not vacuous\n\n| mutation | result |\n|---|---|\n| remove the orphan from `test:script-suites` | **1 failed** / 41 passed |\n| re-add a stale exclusion | **2 failed** / 43 passed |\n| list a non-existent file in `test:script-suites` | **1 failed** / 43 passed |\n| *(clean tree)* | **43 passed** |\n\n# Verification\n\n- `bun run test:script-suites` → **74 → 86 tests**, exit 0, 0 failures — exactly the 12 recovered assertions.\n- `bunx vitest run test/scripts/script-suite-coverage.test.ts` → 43 passed.\n- `bunx @biomejs/biome check` clean on all three changed files.\n- `bun run --cwd packages/app-core typecheck` → the same **22 pre-existing errors** as `develop`, none in the new file.\n\n# Scope\n\nI left `test:script-suites` as an explicit list rather than converting it to a glob. The list splits deliberately across three runners (`node --test` for most, `bun test` for three), so a glob would need that routing encoded somewhere anyway; the guard makes the manual list safe without changing how the suites are invoked.\n\n# Context\n\nFound by asking which test files a package's runner actually collects — `bunx vitest list` against the files on disk — rather than reading include globs. In `app-core` that flagged 207 uncollected files, of which all but one were either `platforms/electrobun/**` (excluded on purpose, with its own runner and CI workflow) or collected by the default include after all.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NZR8GP6D9ZBY5WJ2R3P01F\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T10:34:41.046Z\",\"completed_at\":\"2026-09-04T10:37:06.815Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T10:34:41.257Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"3a9108f9ca133b7c29a2a5499dd858634f877d8b59541278cffca87cb6d7e7af\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"4fc162e1-4391-405b-afb5-1bd5d710f4f5\",\"object_id\":\"sha256:3a9108f9ca133b7c29a2a5499dd858634f877d8b59541278cffca87cb6d7e7af\",\"sha256\":\"3a9108f9ca133b7c29a2a5499dd858634f877d8b59541278cffca87cb6d7e7af\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"xLtt4TN6AmGdfdVKPf28_syTSVnp_H0NYhUQXKKu4GPdIt87kPoDBkeIoTVgsVFm-Ql6hy3Mmc4h_MwM5dPqBw\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"33:T1dd6,"])</script><script>self.__next_f.push([1,"## The defect\n\nThe native planner reads its four loop bounds like this:\n\n```ts\nconst maxIterations = options?.maxNativePlannerIterations ??\n  parseInt(String(runtime.getSetting(\"NATIVE_PLANNER_MAX_ITERATIONS\") ?? \"6\"));\nconst maxConsecutiveFailures = parseInt(\n  String(runtime.getSetting(\"NATIVE_PLANNER_MAX_CONSECUTIVE_FAILURES\") ?? \"2\"));\n// ...and the same shape for NATIVE_PLANNER_PARSE_RETRIES and NATIVE_RESPONSE_PARSE_RETRIES\n```\n\nThe `??` covers an **absent** setting. It does not cover a setting that is present but empty — `NATIVE_PLANNER_PARSE_RETRIES=` in an env file is an empty string, not `undefined` — nor a non-numeric value, nor `0`, nor a negative. Those reach `parseInt` and produce `NaN` or `0`.\n\n`NaN` does not throw. Every relational comparison against it is false, so the bound does not fail loudly — **it silently disables the loop it bounds**:\n\n| bound | site | what happens at `NaN` |\n|---|---|---|\n| `maxIterations` | `while (iterationCount \u003c maxIterations)` | loop never runs — the planner does nothing at all |\n| `maxParseRetries` | `for (a = 1; a \u003c= maxParseRetries; a++)` | loop never runs — `parsedStep` stays `null` |\n| `maxSummaryRetries` | summary retry loop | `summary` stays `null`, and the `else` branch replies with the canned *\"I completed the requested actions, but encountered an issue generating the summary.\"* |\n| `maxConsecutiveFailures` | `consecutiveFailures \u003e= maxConsecutiveFailures` | cap never trips — the failure limit is gone |\n\nI read the code after each loop rather than inferring these; the summary case is the one a user actually sees, as a plausible-looking reply rather than an error.\n\n## This plugin already had the guard\n\n`providers/actions.ts` in the same plugin reads its numeric settings correctly, and is used for three timeout settings:\n\n```ts\nfunction numberSetting(runtime: IAgentRuntime, key: string, fallback: number): number {\n  const raw = runtime.getSetting?.(key) ?? env?.[key];\n  const value = typeof raw === \"string\" ? Number(raw) : raw;\n  return typeof value === \"number\" \u0026\u0026 Number.isFinite(value) \u0026\u0026 value \u003e 0 ? value : fallback;\n}\n```\n\nThe four planner sites hand-rolled the read and lost that rule. This PR adds `positiveIntSetting` to `utils/native-planner-guards.ts` — the module whose name already covers exactly this — applying the same requirement (integer and positive, else fall back), and routes all four bounds through it.\n\n## Reachability, graded honestly\n\n**Ordinary operation is unaffected.** An absent setting resolved to the default before this change and still does; the four defaults are unchanged. The reachable triggers are operator misconfiguration: an env var assigned empty, a placeholder word, or `0`. So this is a robustness fix rather than a bug ordinary use hits — but the failure mode it removes is the bad kind, because nothing logs and the planner degrades into silence or a canned reply.\n\n## Tests\n\nNew `native-planner-settings.test.ts`, 12 tests: the valid and absent cases, then each rejected input (empty string, whitespace, non-numeric word, `0`, `-1`, `1.5`, `null`, a boolean), plus one that pins the mechanism itself —\n\n```ts\nconst bad = Number.parseInt(String(\"\" ?? \"2\"), 10);\nexpect(Number.isNaN(bad)).toBe(true);\nexpect(0 \u003c bad).toBe(false);\nexpect(1 \u003c= bad).toBe(false);\nexpect(9 \u003e= bad).toBe(false);\n```\n\nThe file is registered in `vitest.config.ts`'s explicit `include` list, which its own comment requires for any file importing from `\"vitest\"` — otherwise the changed-file coverage lane filters against `include`, matches nothing, and hard-fails with *\"No test files found\"*.\n\n**Liveness control.** Replacing the guard body with the old `parseInt` idiom fails **7 of the 12** tests. The other 5 are the absent-setting and valid-value cases, which the old code also got right — so 7, not 12.\n\n## Verification\n\n| check | result |\n|---|---|\n| `packages/cloud/shared` (full suite) | 128 passed / 129 |\n| `bun run typecheck` (`packages/cloud/shared`) | clean |\n| `biome check` (4 touched files) | clean |\n\nThe single failure is `src/lib/services/__tests__/direct-wallet-payments.integration.test.ts` — *\"confirm rejects an expired payment even with a valid real signature\"* reports a quote-signature mismatch instead of expiry. Confirmed identical with my changes stashed on `develop`, and unrelated to this diff. It may be worth a separate look: it reads as though the signature check runs ahead of the expiry check, so an expired payment surfaces as tampering. I have not investigated far enough to say whether the test or the ordering is wrong, so I am only flagging it.\n\n## How this was found\n\nAn AST scan over 12,040 non-test source files found 902 variables initialised from `Number` / `parseInt` / `parseFloat`, 456 of them used in a relational comparison, and 82 with no `Number.isFinite` / `isInteger` / `isNaN` exclusion in the enclosing function. 82 is not evidence, so the discriminator was: keep only comparisons that are guards which *reject*, where `NaN` flips them to accept and nothing downstream re-enforces.\n\nThat closed the two highest-stakes candidates as clean negatives, both worth recording as fine:\n\n- `web-push/endpoint-validation.ts` derives its octets from a `^(\\d{1,3})\\.…$` match, so `Number()` can never be `NaN` and the private-range guard is sound.\n- `readImageWithLimit` in `fal-` and `atlascloud-image-generation.ts` uses the `content-length` header only as a fast path — the streaming `received \u003e MAX` loop and the `arrayBuffer` byte-length check still enforce the cap, so a `NaN` declared length loses nothing.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d1 nd it.\n\nI measured the gap by running the real redactor rather than diffing the two lists by eye:\n\n| shape | before | after |\n| --- | --- | --- |\n| `AKIA…` AWS long-term | redacted | redacted |\n| `ASIA…` AWS temporary | **survives** | redacted |\n| `ABIA…` / `ACCA…` AWS bearer/context ids | **survives** | redacted |\n| `github_pat_…` fine-grained | **survives** | redacted |\n| `xox[baprs]-…` Slack | **survives** | redacted |\n| `ya29.…` Google OAuth | **survives** | redacted |\n| `ghp_…`, `sk-…`, `sk-ant-…`, `Bearer …` | redacted | redacted |\n\nEvery shape in the \"survives\" rows is one **core already redacts**. This is closing a drift against an existing in-repo decision, not new policy.\n\nEach addition carries core's own anchoring and case-sensitivity rationale — the AWS pattern stays case-sensitive so `Asia` in prose is not folded into the credential shape, and there is a test asserting exactly that.\n\n# What this deliberately does not do\n\n**It does not import core's full pattern list.** Core's broader ENV-assignment and JSON-field patterns are unsuitable for cached tool results, which routinely carry source code — core's comment records that the bare-`key` assignment form *\"corrupts code returned by READ\"*. Only anchored credential prefixes belong in this list, and the file now says so, so the next person extending it knows where the boundary is.\n\n**It does not add `gho_` / `ghu_` / `ghs_`.** Those are absent from core's list too, so adding them would be new policy rather than closing a drift. Flagging them here instead: if you want them, core is the place to decide it, and this file should follow.\n\nThe cache redactor's other two layers are unchanged — name-based redaction (`KEY|TOKEN|SECRET|…`) and env-secret value matching already cover credentials that appear under a secret-ish key or equal a known env value. The gap closed here is a credential appearing as free text in tool output.\n\n# Verification\n\n- The six new shape cases **fail against the unfixed redactor** (6 failed / 22 passed) and pass with it: **28 pass / 0 fail**, up from 21.\n- The `Asia`/`ACCA` prose case passes both before and after — it is there to catch over-redaction, not to prove the fix.\n- Full `tool-call-cache` suite: **222 pass / 0 fail** across 8 files.\n\n# Note on the test fixtures\n\nGitHub push protection rejected my first push: the Slack sample matched its live-credential detector. Rather than allow-listing it, the fixtures are assembled from fragments at runtime (`sample(\"xox\", \"b-\", …)`), so the file never contains a literal any scanner will flag while the redactor still sees the full shape. Worth knowing before anyone adds another sample here.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PAS2HFYPSSAT2GNCRFVCA3\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T13:47:22.031Z\",\"completed_at\":\"2026-09-04T13:48:48.423Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T13:47:22.255Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\ -plugin-map.json` | yes — the registry suite |\n\nSo a stale `generated.json` merges with a green build today.\n\nTwo notes on how that table was built, because my first pass got it wrong:\n\n- My first mutation deleted a channel from `channel-plugin-map.json`. The registry suite stayed 53/53 green and `--check` exited 1, which looked conclusive — but the app-core test *does* catch it. I redid this as a per-artifact matrix, and switched from deletions to **value** edits, since a deletion can trip an unrelated sortedness/non-emptiness assertion and overstate coverage.\n- `packages/app-core/src/runtime/eliza.test.ts` (\"no tests\") and `plugins/plugin-google-genai/__tests__/config.test.ts` (1 fail) are **already red on `develop`**. They \"fail\" under every mutation, so I discounted them entirely; the table counts only tests that are green at baseline.\n\n`generate.test.ts` doesn't close this either — it unit-tests the collector functions against synthetic entry lists and never compares a committed artifact to a regeneration.\n\n# The change\n\nOne extraction plus one test.\n\n`main()` built the expected bytes inline, so a test had to either duplicate that logic (including the `biomeFormatJson` pass, which is load-bearing — see the comment at `generate.ts:40`) or shell out. Instead `firstPartyArtifacts()` is now exported and `main()` consumes it, so the generator, the `--check` gate, and the new test all compute \"what should be committed\" through one code path and cannot disagree.\n\n`generate-drift.test.ts` then compares each committed artifact to a fresh generation, **as bytes** — not parsed JSON, since the committed files must also satisfy `format:check`, which key order and array wrapping affect.\n\n# The gate is not vacuous\n\nPerturbing one value in each artifact, with the new test in place:\n\n| mutated artifact | registry suite |\n|---|---|\n| `generated.json` | 1 failed / 58 passed |\n| `curated-app-definitions.json` | 1 failed / 58 passed |\n| `channel-plugin-map.json` | 1 failed / 58 passed |\n| `provider-plugin-map.json` | 2 failed / 57 passed |\n| `short-id-plugin-map.json` | 2 failed / 57 passed |\n| *(clean tree)* | **59 passed** |\n\nEvery artifact is now caught; the two rows with 2 failures are the ones that also trip their own existing tests.\n\n# Verification\n\n- `bun run --cwd packages/registry test` → **59 passed** (was 53; +1 manifest assertion, +5 per-artifact).\n- `bun run --cwd packages/registry typecheck` → exit 0, 0 `error TS`.\n- `bunx @biomejs/biome check` on both files → clean.\n- `bun run --cwd packages/registry generate:first-party` (the **write** path, not `--check`) → leaves the tree unchanged and still prints `wrote 84 entries + 4 curated-app definitions`, so the extraction didn't disturb it.\n- `generate:first-party:check` still passes on a clean tree.\n\n# Scope\n\nI left `generate:first-party:check` in place — it's the right thing to run by hand after editing the registry, and it now shares its comparison logic with the test rather than duplicating it. Wiring it into a workflow as well would be redundant with this test, so I didn't.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NXFS53BJJPR1GFZP4KXPKR\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T09:55:06.019Z\",\"completed_at\":\"2026-09-04T09:57:39.390Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e nc` kills\na child on `timeout` it returns:\n\n```\nstatus: null\nsignal: \"SIGTERM\"\nerror : ETIMEDOUT spawnSync ... ETIMEDOUT\nstdout: \"\"      \u003c- buffers die with the child\nstderr: \"\"\n```\n\nEvery assertion in the file has the form `expect(result.status, output).toBe(1)`,\nso the run reports:\n\n```\nexpected null to be 1 -- output was: \"\"\n```\n\nThe custom message the author deliberately attached is **empty**, because it is\nbuilt from the dead child's buffers. The report names neither the timeout nor\nthe cap, and the blank output tail reads as *\"the script printed nothing\"*\nrather than *\"the script was killed\"* — which points an investigation at the\nmigration logic instead of at the clock.\n\n## What this changes\n\nOnly the classification. `runAdminScript` now detects a child that did not exit\non its own terms and fails with the three facts a CI log needs:\n\n```\nadmin script did not exit on its own: status=null signal=SIGTERM\nerror=Error: spawnSync ... ETIMEDOUT. The 60000ms spawnSync cap kills the child\nand discards its output, so stdout/stderr below are expected to be empty.\n```\n\nThis follows the existing repo idiom rather than inventing one —\n`packages/scripts/run-with-deadline.test.mjs:659` reports `status`, `signal` and\n`error` together in its failure message, and\n`packages/core/scripts/provider-latency-report.test.ts:43` asserts\n`result.error` is undefined.\n\n## What I deliberately did not change\n\n- **The cap stays at 60 s.** The file passes locally — 5 tests in 26.5 s, with\n  the `0295` case alone at ~25.6 s, nearly all of it the spawned child. So 60 s\n  is roughly **2.5x headroom**: thin for a loaded runner, which fits an\n  intermittent CI timeout. But the test is not wrong, and raising the number\n  silently would mask the ~25 s runtime rather than report it. Choosing a new\n  cap is a CI-budget decision that belongs to you, so I made it a named constant\n  and an injectable parameter — it is now a one-line change if you want it, and\n  I am happy to make it here.\n- **The other 27 files.** 46 test files spawn a child with a `timeout`; 18\n  reference `ETIMEDOUT` / `.signal` / `result.error`, and 28 do not, so a\n  timeout in any of them surfaces the same way. I scoped this to the one file\n  that is actually red rather than editing all of them. Happy to follow up if\n  you want the pattern applied more broadly.\n\n  (Worth flagging that my first pass at that count was wrong — a loose\n  `/\\.error\\b/` matched unrelated domain fields like `job.error` in\n  `managed-dedicated-canary-diagnostic.test.ts`. The numbers above come from a\n  tightened predicate, spot-checked against the files it claims.)\n- **The migration itself.** Nothing about what the child does, or how long it\n  takes, is touched.\n\n## Tests\n\nOne added. It drives the *same* code path with a cap the child cannot meet, so\nit exercises a real `SIGTERM` kill rather than a synthetic result object, and\ncompletes in ~200 ms instead of waiting out a 60 s timeout. It asserts the three\nfacts that `expect(status).toBe(1)` discards, plus the sentence explaining why\nthe printed output is blank — so an empty tail is never mistaken for silence\nfrom the script.\n\n**Ablation** — reverting the guard and re-running just that test:\n\n```\nExpected to contain: \"did not exit on its own\"\nReceived: \"expected the harness to reject a killed child\"\n```\n\nRestored: `6 pass, 0 fail` for the whole file. Biome clean.\n`tsc --noEmit -p packages/cloud` reports 1 error on this branch and 1 on\n`develop` — baseline unchanged, and not in this file.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contributi
