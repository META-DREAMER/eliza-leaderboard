ever look like fresh usage and automatically charge the saved card again.\n\nThe `updated` CTE enforces it by setting `auto_top_up_enabled = false` in the same statement as the clawback. That UPDATE is gated on the clawback insert **alone** — not on `applied_amount \u003e 0` — and the difference only shows up at one boundary that nothing tests.\n\nWhen an org is already at $0, `applied_amount` is 0 and `new_balance` equals `current_balance`, so the balance write is a no-op and the *only* effect of the UPDATE is the flag. That is also the worst case for the invariant: auto top-up fires on a **low** balance, so an org left at $0 with the flag still on charges the just-refunded card again immediately.\n\nThe nearest existing case, `floors the balance at zero and records unrecovered shortfall metadata`, seeds `$50` against a `$100` clawback. It asserts the flag, but the org row is written for its balance anyway, so it cannot distinguish \"the UPDATE ran\" from \"the UPDATE ran because the balance changed\".\n\n# The change\n\nNo behavior change — one test and one comment.\n\n**The test.** I probed the boundary against PGlite before writing anything, and the code is already correct: balance `0`, clawback `100` → `applied 0`, `shortfall 100`, `auto_top_up_enabled false`, plus a zero-amount clawback row carrying `requested_clawback_usd: 100` / `unrecovered_clawback_usd: 100`. So this pins working behavior rather than fixing a bug. It also asserts the zero-value ledger row, since that is what makes an unrecoverable refund auditable instead of absent.\n\n**The comment**, at the gate, saying why it must stay gated on the insert alone and naming the test that pins it.\n\n# Why this test and not just a comment\n\nPer the mutation table, it discriminates a real and attractive edit — \"don't write the org row when the balance doesn't move\":\n\n```diff\n           WHERE o.id = candidate.id\n             AND EXISTS (SELECT 1 FROM inserted)\n+            AND candidate.applied_amount \u003e 0\n```\n\n| suite | unmodified | with that guard |\n| --- | --- | --- |\n| `credits-reconcile.test.ts` on `develop` (37 cases) | 37 pass | **37 pass** — undetected |\n| with this PR (38 cases) | 38 pass | **37 pass / 1 fail** |\n\nThat edit reads as a harmless optimisation, passes every existing test, and silently re-opens the exact hazard the comment names. That is what earns the case a place; I dropped a candidate test in a recent PR precisely because it survived every mutation the suite already caught.\n\n# Verification\n\n```\nbun run --cwd packages/cloud/shared typecheck        -\u003e exit 0\nbunx @biomejs/biome check \u003cboth files\u003e               -\u003e clean\nbun test __tests__/credits-reconcile.test.ts         -\u003e 38 pass / 0 fail\n  same file on develop                               -\u003e 37 pass / 0 fail\n```\n\nOne note for anyone editing near this: backticks inside the `sql` tagged template terminate the literal. My first draft of the comment quoted `applied_amount \u003e 0` in backticks and broke both `tsc` and biome; the committed version uses no backticks.\n\n# What I did not change\n\nThe gate itself, `candidate`'s `requested_amount \u003e 0` filter, the `ON CONFLICT DO NOTHING` idempotency, and the \"an operator/user can explicitly re-enable it\" behavior on a replayed webhook are all untouched and, as far as I can tell, correct as they stand.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-e r-proof logbook nobody — the agent included — can rewrite.\n\n- **npm**: [`@rh4cpu/plugin-rh4`](https://www.npmjs.com/package/@rh4cpu/plugin-rh4) v0.1.1\n- **Source**: [`giupy997/chipc`](https://github.com/giupy997/chipc), directory `eliza/plugin-rh4`\n- **Docs**: [README](https://github.com/giupy997/chipc/tree/main/eliza/plugin-rh4) · [integrator guide](https://github.com/giupy997/chipc/blob/main/INTEGRATION.md) · https://rh4cpu.tech\n\n## Plugin surface\n\n- 3 actions — `MINT_RH4_CHIP` (chip NFT + fixed-supply token in one tx), `TICK_RH4_CHIP` (one paid cycle: byte engraved, reward earned from the chip's mining reserve), `READ_RH4_CHIP` (free state read by id or ticker)\n- 1 provider — `RH4_CHIP_STATE`: keeps the agent aware of its own machine\n\n## Safety notes for review\n\n- Every transaction is **simulated (`eth_call`) before signing** — a taken ticker or a lost cycle costs nothing\n- **Read-only without a key**: write actions self-disable via `validate()` unless `RH4_PRIVATE_KEY` is set; docs insist on a dedicated low-value key\n- All contracts verified on Blockscout (exact match); chip tokens have no mint function, reserves leave the factory only through public `tick()` rewards\n- Tested against `@elizaos/core` 1.7.2 with a live `AgentRuntime` (registration, settings resolution, actions, provider) plus live-chain reads and mint/tick `eth_call` simulations against the production factory\n\n## Checklist\n\n- [x] Entry validated (`validate-cli`) — 50 third-party entries pass\n- [x] `generated-registry.json` regenerated with `src/generate.ts` (no hand edits)\n- [x] Package published to npm under own scope, `elizaos` keyword for runtime auto-discovery\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"39:T1f49,"])</script><script>self.__next_f.push([1,"## The defect\n\nFive markdown code-fence regexes in the model-output parsing path spell the info string `(?:json|json5)?`:\n\n| file | pattern |\n|---|---|\n| `packages/core/src/utils/json-llm.ts:11` | ``` /```(?:json\\|json5)?\\s*\\r?\\n?([\\s\\S]*?)\\r?\\n?```/i ``` |\n| `plugins/plugin-calendar/src/internal/detail.ts:89` | anchored variant |\n| `plugins/plugin-inbox/src/inbox/triage-classifier.ts:240` | anchored variant |\n| `plugins/plugin-inbox/src/inbox/priority-scoring.ts:181` | anchored variant, plus a duplicated `json\\|json` alternative |\n| `packages/ui/stories/src/eliza-core-browser-shim.ts:151` | anchored variant |\n\nNothing anchors the end of that alternation group — what follows is `\\s*\\r?\\n?`, all of which can match empty. So on a ` ```json5 ` fence the engine takes the `json` branch, matches only the first four characters, and the **overall match still succeeds**. There is no backtracking pressure to ever reach the longer branch. The stray `5` lands at the head of capture group 1, which is exactly the text handed to the parser:\n\n```\n'```json5\\n{\"a\":1}\\n```'   -\u003e  capture: '5\\n{\"a\":1}'     (then parse fails)\n'```json\\n{\"a\":1}\\n```'    -\u003e  capture: '{\"a\":1}'        (fine)\n'```\\n{\"a\":1}\\n```'        -\u003e  capture: '{\"a\":1}'        (fine)\n'```JSON5\\r\\n[1]\\r\\n```'   -\u003e  capture: '5\\r\\n[1]'       (then parse fails)\n```\n\nAll five sites read `match[1]`, so the stray character reaches the parser at every one. The `json5` label these parsers advertise has never worked; `json` and bare fences are unaffected. This is why the duplicated `json|json` in `priority-scoring` went unnoticed — nothing downstream of that alternative was reachable either way.\n\n## Reachability\n\nThe blast radius differs by site because of what the caller does next:\n\n- `extractAndParseJSONObjectFromText` throws `Failed to parse invalid JSON` — the whole structured model output is lost.\n- `scoreInboxMessages` returns `null` for the batch, so callers fall back to the heuristic scorer; the LLM scores are silently discarded.\n- `triage-classifier` raises `InboxTriageClassificationError`.\n- `plugin-calendar`'s `stripModelWrappers` yields a candidate that fails to parse downstream.\n\nThe trigger is ordinary operation: a model labelling its fence `json5` rather than `json`. That is a label these modules explicitly declare support for — `json-llm.ts` imports `JSON5` precisely so JSON5-flavoured output is accepted.\n\n## The repo already has the contract\n\n`packages/core/src/utils/code-fence.ts` — `unwrapWholeCodeFence`, core's canonical fence stripper — sorts its accepted languages longest-first before matching:\n\n```ts\nconst acceptedLanguage = [...languages]\n  .sort((left, right) =\u003e right.length - left.length)\n  .find((language) =\u003e lowerValue.startsWith(language.toLowerCase(), 3));\n```\n\nand it is called as `unwrapWholeCodeFence(candidate, [\"json\", \"json5\"])`. So the correct handling is already established in core; the five hand-rolled regex copies drifted from it. This PR restores that ordering at each copy and removes the duplicated alternative.\n\n## The change\n\nEach alternation becomes `(?:json5|json)?`, with a comment at the site recording why the order is load-bearing. No behaviour changes for ` ```json `, ` ```JSON `, bare ` ``` `, or an unrecognised info string — verified against each.\n\n## Tests\n\nPinned at the two exported entry points; the other three sites' strippers are module-private, so the identical one-token change there rides on the same reasoning rather than a separate test.\n\n- `packages/core/src/utils/json-llm.test.ts` — a ` ```json5 ` fence with a JSON5 body, and a ` ```JSON5 ` fence with CRLF line endings.\n- `plugins/plugin-inbox/src/inbox/priority-scoring.test.ts` — `scoreInboxMessages` given a ` ```json5 `-fenced response.\n\n**Liveness control.** Each patched regex was reverted in turn and the new tests do fail: core `2 failed | 8 passed`, plugin-inbox `1 failed | 2 passed`. Restored, both green.\n\nOne correction worth recording: my first version of the plugin test put JSON5 *syntax* (unquoted keys) inside the fence and failed even with the fix — `parseJsonModelRecord` parses with strict `JSON.parse`, so the body was failing for a reason unrelated to the fence. The body is now strict JSON so that only the fence label is under test, and the test comment says so.\n\n## Verification\n\n| check | result |\n|---|---|\n| `packages/core` `src/utils` + `src/actions` | 1025 passed / 1026 |\n| `plugins/plugin-calendar` (full) | 713 passed, 4 skipped |\n| `plugins/plugin-inbox` (full) | 239 passed, 2 skipped |\n| `tsc --noEmit` — core, ui, plugin-inbox, plugin-calendar | 0 errors each |\n| `biome check` — all 7 touched files | clean |\n\nThe single core failure is pre-existing and unrelated: `src/utils/project-registry.test.ts` asserts `resolve(\"/tmp/a\")` and receives `/private/tmp/a` — macOS's `/tmp` symlink. Confirmed identical with this branch stashed on `develop`, and this diff does not touch that file.\n\n## How this was found\n\nA scan of 70,592 regex literals across 22,328 tracked source files for prefix-shadowed alternation members (a shorter alternative preceding a longer one sharing its prefix) returned 598 pairs — almost all harmless, because backtracking reaches the longer branch whenever the pattern constrains what follows the group (`\\.(ts|tsx)$`, `\\b(local|locally)\\b`, `(lon|longitude)\\s*[:=]` are all fine). Filtering to groups at an *unconstrained* tail, where the short branch can win and its capture is consumed, left 20; the five fence patterns are the ones whose capture is actually read rather than tested as a boolean.\n\n## Not done here\n\nConsolidating the five copies onto `unwrapWholeCodeFence` would be the better end state, but they are not interchangeable as written: the helper only unwraps a whole-value fence, whereas core's `jsonBlockPattern` is unanchored and locates a fence embedded in surrounding prose. Happy to follow up separately if a maintainer wants the consolidation.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PK56J979GQ4YHR2H3BN40S\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T16:13:47.978Z\",\"completed_at\":\"2026-09-04T16:19:21.227Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T16:13:48.375Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"112245975871711cd74b82fd45359ad8a3efa37f1817caf3ca3e784888f86a9e\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"e1cfe993-74a5-42b3-a0ae-8ba96d7fcfcc\",\"object_id\":\"sha256:112245975871711cd74b82fd45359ad8a3efa37f1817caf3ca3e784888f86a9e\",\"sha256\":\"112245975871711cd74b82fd45359ad8a3efa37f1817caf3ca3e784888f86a9e\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"Srv5I1eVlfaUeJBOUkZ78xmnmbaMkIV-XtkmYj4xAoPqR5ge9KDGub0dXLvikYFrFFOOKF_wzn7JmARZeF7PBQ\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"3a:T1e5d,"])</script><script>self.__next_f.push([1,"## The defect\n\n`stripModelWrappers` in `packages/core/src/actions/json-model-output.ts` recognised a private-reasoning preamble like this:\n\n```ts\nconst thinkEnd = candidate.indexOf(\"\u003c/think\u003e\");\nif (candidate.startsWith(\"\u003cthink\u003e\") \u0026\u0026 thinkEnd !== -1) { … }\n```\n\nAn exact lowercase `\u003cthink\u003e` at position 0. But the codebase already has a canonical vocabulary for this in `packages/core/src/utils/reasoning-tags.ts`:\n\n```ts\nexport const REASONING_TAG_NAMES = [\n  \"think\", \"thinking\", \"analysis\", \"reasoning\", \"reflection\", \"thought\", \"antthinking\",\n] as const;\n```\n\nmatched case-insensitively, tolerant of whitespace inside the tag (`\u003c thinking \u003e`), with a documented repair for a **close-only residue** left by an earlier stripping pass — the evaluator's `None\u003c/think\u003e`, referenced from `planner-loop.ts` and `evaluator.ts` as #20080.\n\nThe parser knew none of that. Measured against 20 realistic inputs it handled **12**. The 8 it missed:\n\n| input | result on `develop` |\n|---|---|\n| `None\u003c/think\u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n| `\u003cthinking\u003er\u003c/thinking\u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n| `\u003creasoning\u003er\u003c/reasoning\u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n| `\u003canalysis\u003er\u003c/analysis\u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n| `\u003creflection\u003er\u003c/reflection\u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n| `\u003cTHINK\u003er\u003c/THINK\u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n| `\u003c think \u003er\u003c/ think \u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n| `Sure!\\n\u003cthink\u003er\u003c/think\u003e{\"a\":1}` | preamble reaches `JSON.parse` |\n\nIn every one `parseJsonModelOutput` returns `null` and the entire model output is discarded as unparseable. `parseJsonModelRecord` / `parseJsonModelArray` inherit it, and so do the callers that funnel through them (`plugin-inbox`'s triage classifier and priority scorer, `plugin-calendar`'s detail parser).\n\n## Why the obvious fix is wrong\n\nThe tempting change is to call `stripReasoningBlocks`. **Don't** — and this is the part that makes the narrow original defensible. Reasoning markup is also ordinary string data. Run real payloads through that helper:\n\n| payload | `stripReasoningBlocks` |\n|---|---|\n| `{\"text\":\"\u003cthink\u003ehi\u003c/think\u003e\"}` | `{\"text\":\"\"}` — **value silently rewritten** |\n| `{\"a\":1,\"note\":\"\u003c/think\u003e x\"}` | **parse fails** |\n| `{\"prompt\":\"use \u003cthinking\u003e tags\"}` | **parse fails** |\n\nCorrupting a value is strictly worse than leaving a preamble in place, and `stripReasoningBlocks` is right for its own job — user-visible egress text, where the goal is to remove markup wherever it appears. A JSON parser has the opposite constraint.\n\n## The fix\n\nBoth branches stay **anchored to the head of the candidate**, so nothing inside a payload can be touched:\n\n1. **A reasoning tag opens the candidate.** Then nothing up to its close can be payload — slice through the first close after it. First-close semantics, exactly matching the previous `indexOf` behaviour.\n2. **Close-only residue.** Strip through the first close tag only when no payload opener — `` ` ``, `{`, `[` — precedes it. A close tag inside a JSON string or a fenced body therefore always has an opener before it and is never touched.\n\nMatching goes through `findNextOpenTag` / `findNextCloseTag`, so it inherits the canonical tag vocabulary and the deliberately non-quadratic scan those functions document.\n\nAn unmatched open tag is still preserved so the parse fails closed — same rule `reasoning-tags.ts` gives for `stripReasoningPrefixes`, and for the same reason: deleting only the open tag would turn a private payload into apparently-clean output.\n\n## Results\n\n**12/20 → 20/20**, no regression on any of the 12 that already passed:\n\n| group | cases | before | after |\n|---|---|---|---|\n| preambles that should be stripped | 12 | 4 | 12 |\n| payloads that must be left alone | 5 | 5 | 5 |\n| fenced / array / fail-closed | 3 | 3 | 3 |\n\nThe five payload-safety cases are the ones the anchoring exists for, and they pass identically before and after.\n\n**Liveness control.** Reverting only the source file fails exactly 8 of the 19 tests — the same 8 the baseline measurement predicted.\n\n**Performance.** `reasoning-tags.ts` records that a maintainer benchmarked a regex form of this scan going quadratic on malformed residue, so I checked the property survives: 16,000 malformed `\u003cthink ` candidates (112,007 chars) parse in under 0.1 ms; a 500,000-char close-only prefix in 0.5 ms.\n\n| check | result |\n|---|---|\n| `packages/core` `src/actions` + `src/utils` + `src/services/message` | 1817 passed / 1818 |\n| `tsc --noEmit` `packages/core` | 0 errors |\n| `plugins/plugin-inbox` (full) | 238 passed, 2 skipped |\n| `plugins/plugin-calendar` (full) | 713 passed, 4 skipped |\n| `biome check` | clean |\n\nThe single failure is `src/utils/project-registry.test.ts`, the machine-state fixture defect fixed by #30537 and not on this branch.\n\n## Not done here — five sibling copies\n\nThe same `startsWith(\"\u003cthink\u003e\")` + `indexOf(\"\u003c/think\u003e\")` idiom appears in five more places:\n\n- `packages/cloud/api/src/stubs/elizaos-core.ts:1048`\n- `packages/ui/stories/src/eliza-core-browser-shim.ts:155`\n- `plugins/plugin-calendar/src/internal/detail.ts:93`\n- `plugins/plugin-inbox/src/inbox/triage-classifier.ts:253`\n- `plugins/plugin-inbox/src/inbox/priority-scoring.ts:188`\n\nI fixed only core's, deliberately. The three plugin copies run their local strip and then call `parseJsonModelRecord`, which runs core's — so for the JSON path this one change repairs them downstream, and it is the high-leverage edit. The other two are deliberate mirrors of core; I looked for a drift-check test enforcing that mirroring and found none, which is itself worth a maintainer's attention. Happy to follow up on any subset if you'd like them converged.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PMACGX9TPT205F8NZKJ0WB\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T16:34:06.493Z\",\"completed_at\":\"2026-09-04T16:39:17.143Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T16:34:07.119Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"cef3a6ffb69b2cecb873a7db97b1e64159f4944a95fc2ec556d969fcb18d96ad\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":  took pending migrations from **1 to 4**: the blind spot was hiding three of four, two of them in `packages/app-core`.\n\n# `:check` couldn't fail\n\nNone of `migrate-canonical-imports.mjs`, `migrate-raw-tables.mjs`, `migrate-raw-controls.mjs` ever exits non-zero. All three `:check` scripts report pending work and exit 0, so they could not gate a build even if something ran them — while `format:check` and `generate:first-party:check` in this repo do fail closed. They now set `exitCode = 1` when work is pending; `--write` runs still exit 0.\n\n# The change\n\n- `migrateImports` accepts export declarations with a string-literal specifier (declarations without one — `export { Button };` — are left alone, and there's a test pinning that).\n- The three `:check` variants fail closed.\n- The four pending files are migrated, which turns the red assertion green.\n\nTwo things I deliberately did **not** do:\n\n- **I didn't wire the `scripts/` tests into a suite.** I measured them first: 10 files, **97 passing / 1 failing on `develop`** (the failure being exactly the drift assertion above), ~95 s total with `design-contract-graph.test.ts` alone at 52 s. They're `node:test` files, so adding them to the vitest `include` isn't the right wiring, and the runtime is a real cost. That's a maintainer's call — here's the data.\n- **`Spinner` and `StatusBadge` in `browser.ts` / `ui-compat.ts` move from `@elizaos/ui/components/ui/*` to the `@elizaos/ui` barrel**, because neither has a dedicated public subpath (`Button`/`Input` do, and go to the *narrower* `@elizaos/ui/button` / `/input`). That's the script's own policy, but those two files carry comments about staying light, so flag it if the barrel widening is unwelcome there.\n\nOne note for anyone running the script: its output doesn't satisfy the format gate on its own — rewriting specifiers leaves imports unsorted and `organizeImports` flags every touched file, so it's a two-step operation (`--write`, then `biome check --write`).\n\n# Verification\n\n- `packages/ui/scripts` tests: **97 pass / 1 fail → 101 pass / 0 fail**.\n- The new re-export test **fails when the migrator change is reverted** (`not ok 3`), so it isn't vacuous.\n- `migrate:canonical-imports:check` → exit 1 with pending work, exit 0 once migrated. `raw-tables` / `raw-controls` → 0 pending, exit 0.\n- `packages/app-core` typecheck: **22 errors before and after**, identical file set, none in either changed file. `plugin-notes`: 1 error, also identical (both pre-existing on `develop`).\n- `bunx @biomejs/biome check` clean on all 7 changed files.\n\n# Context\n\nFound by sweeping for package.json scripts nothing invokes. That sweep alone is low-signal — 166 of 1961 scripts, mostly legitimate operator tools — so I narrowed it to *verification* scripts, which are pointless unless something automates them.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NYHXQX72YN1C06CZBQ8BY1\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T10:13:44.830Z\",\"completed_at\":\"2026-09-04T10:25:09.145Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d45 8 `contextSignal.\u003cname\u003e.strong` entries in `context-search.keywords.json`, all 37 other contexts have one — `messaging` alone does not.\n\n# Not a security issue\n\nThe module header is explicit that these helpers \"deliberately support retrieval/ranking only. They must not be used as hard action availability checks.\" A missing signal degrades ranking; it cannot open a gate. That is why this is a public PR.\n\n# The change\n\nTwo parts.\n\n**1. Back the reference.** Added `contextSignal.messaging.strong` to `context-search.keywords.json`. I chose to add the data rather than delete the reference: dropping it would enshrine the gap in the one context whose name is the domain itself.\n\nEvery existing entry in that file carries all seven locales and none are base-only, so authoring one honestly means writing seven locales. Rather than invent translations, **every term is one already attested in a sibling entry** — `contextSignal.send_message.strong`, `contextSignal.read_messages.strong`, `contextSignal.social.strong` and `contextSignal.phone.strong`.\n\n**2. A permanent guard.** A test that walks every stem in `CONTEXT_KEYWORD_STEMS`, resolves it against `VALIDATION_KEYWORD_DOCS`, and asserts the unresolved list is empty — reporting `context -\u003e stem` pairs on failure, so the next dead reference names itself. This is the part I actually care about; the data fix alone would leave the same trap open for the next context added.\n\nThat guard needed `CONTEXT_KEYWORD_STEMS` exported. It is documented in place as exported for exactly that assertion.\n\n# Control, both directions\n\nWith the data entry reverted and everything else in place:\n\n```\nAssertionError: expected [ Array(1) ] to deeply equal []\n+   \"messaging -\u003e contextSignal.messaging\",\nTests  1 failed | 15 passed (16)\n```\n\nWith the entry present, 16/16. One failure, exactly the stem claimed — that is the whole assertion, reproduced in both directions.\n\n# What this does and does not change\n\nHonest numbers, because they are small. For `contexts: [\"messaging\"]`, sources go **8 → 9** and the deduped term set **254 → 257**. Only three terms are genuinely new — `메세지`, `mga mensahe`, `tin nhan` — precisely *because* I restricted myself to attested vocabulary; the rest already arrived via the sibling stems.\n\nSo: this fixes the dangling reference and stops it recurring. It **does not** broaden messaging vocabulary — there is a good case for terms like \"inbox\", \"thread\" or \"messaging\" itself, and for locale forms not already in this file, but I am not the right author for translations I would have to invent. If you want that coverage, the entry is now there to extend.\n\n# Verification\n\n- `bunx vitest run packages/core/src/i18n packages/shared/src/i18n` → **39 passed / 0 failed** across 5 files (up from 38).\n- `bun run --cwd packages/core typecheck` → exit 0, 0 TS errors. Same for `packages/shared`.\n- `bunx @biomejs/biome check` → clean on all three changed files, no unrelated reformatting.\n- Regenerated the gitignored keyword modules with `packages/shared/scripts/generate-keywords.mjs` so codegen output matches the JSON.\n\nDiff is 3 files, +56/−1.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NDRCFR9MZ7WYERPTNSXKA4\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T05:20:10.744Z\",\"completed_at\":\"        // path ABSENT  -\u003e resolve() spelling\n  }\n}\n```\n\n`resolve()` is not the canonical spelling when an ancestor is a symlink, and on macOS `/tmp` **is** a symlink to `/private/tmp`. So the value the registry stores for `/tmp/a` is `/tmp/a` when nothing occupies that path and `/private/tmp/a` when something does. Two assertions compared the stored value against `resolve(\"/tmp/...\")` and are therefore only correct while the machine happens to have those paths free.\n\nThis is not hypothetical — it is how I found it. An unrelated stray file sitting at `/tmp/a` on my machine is enough:\n\n```\nAssertionError: expected '/private/tmp/a' to be '/tmp/a'\n  project-registry.test.ts:94   expect(getProjectById(p.id, env)?.localPath).toBe(resolve(\"/tmp/a\"))\n```\n\nAdding a directory at `/tmp/legacy-folder` fails a second test the same way (line 161). Measured on the unpatched file with a file at `/tmp/a` and directories at `/tmp/{b,repo-a,world-a,legacy-folder}`: **2 failed | 11 passed**.\n\n## No production bug behind it\n\nI checked, because the second failure sits in a test whose name is about id stability across the legacy migration. It is only the *spelling* assertion that fails — `expect(persisted.id).toBe(first)` **passes** under the hostile state. `upsertProject` canonicalizes both sides of its match:\n\n```ts\ncanonicalizeLocalPath(p.localPath) === localPath\n```\n\nso the id minted by `legacyProjectId` from the raw `workspace-folder.json` path survives the first real upsert even when the raw and canonical spellings differ. The migration invariant documented on `legacyProjectId` holds. This PR is test-only.\n\n## The fix\n\nThe correct pattern was already in this file. Its symlink test builds a real directory with `mkdtempSync` and asserts against `realpath`; only the `/tmp` literals had drifted from that. So:\n\n```ts\nconst fixturePath = (leaf: string): string =\u003e join(realpathSync(stateDir), leaf);\n```\n\n`stateDir` is the test's own `mkdtemp` directory, so `realpathSync(stateDir)` is canonical; the leaf is never created, so `canonicalizeLocalPath` takes its `resolve()` fallback, and `resolve()` of an already-canonical absolute path is the identity. The stored value equals the fixture path **by construction**, on every OS.\n\nEvery fixture that reaches `canonicalizeLocalPath` now routes through it (9 sites, 6 leaves), and `resolve` is no longer imported.\n\nWorth noting what the old comments got wrong: they reasoned carefully about Windows drive letters (`` `\u003cdrive\u003e:\\tmp\\a` ``) but not about symlinked ancestors, which is the actual reason `resolve()` is not the canonical form. The new fixture is correct on Windows for a stronger reason — `join(realpathSync(tempdir), leaf)` is already absolute and canonical there too, so `resolve()` is the identity.\n\n## Verification\n\n**Control.** Recreated the same hostile state against the patched file:\n\n| | unpatched | patched |\n|---|---|---|\n| file at `/tmp/a`, dirs at `/tmp/{b,repo-a,world-a,legacy-folder}` | 2 failed \\| 11 passed | **13 passed** |\n\nI created only the four paths that were absent, left the pre-existing `/tmp/a` alone, and removed exactly the four afterwards.\n\n| check | result |\n|---|---|\n| `packages/core` `src/utils` | 62 files, 879 tests, all passed (878/879 before) |\n| `tsc --noEmit` `packages/core` | 0 errors |\n| `biome check` (touched file) | clean |\n\n## A correction worth recording\n\nMy first reading of this failure blamed the macOS `/tmp` symlink directly. That was wrong, and probing killed it: `realpathSync` throws `ENOENT` for a missing leaf — `/tmp/nope/deeper`, `/etc/a`, and `/Users/.../nope` all threw — so on a machine where `/tmp/a` is genuinely absent, the fallback fires and the test passes. `existsSync(\"/tmp/a\")` returned `true`: a stray unrelated file was occupying it. The mechanism is machine state, and the symlink only decides *what* the wrong answer looks like. Which is exactly why the fixture should never have pointed outside the test's own sandbox.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PKQHS2C2XPRJP2GKN7DQPG\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T16:23:49.282Z\",\"completed_at\":\"2026-09-04T16:26:35.484Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T16:23:49.498Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"d1718f6f67e1cf82f1d7ebb5131754222925921cc1464122e5aa2bce585d607a\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"6ab55a60-0352-462e-946b-4de6a5826670\",\"object_id\":\"sha256:d1718f6f67e1cf82f1d7ebb5131754222925921cc1464122e5aa2bce585d607a\",\"sha256\":\"d1718f6f67e1cf82f1d7ebb5131754222925921cc1464122e5aa2bce585d607a\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjb === \"\" || raw === \"0\") return false;\n  if (raw !== \"1\") {\n    throw new Error(`${name} must be \"1\" or \"0\" when set, or left unset`);\n  }\n  return true;\n}\n```\n\n**`\"0\"` is accepted as off on purpose.** My first version rejected everything but `\"1\"` and unset, which made `COORDINATOR_ENABLED=0` throw — trading this bug for a worse one, since `0` is unambiguous intent and refusing it turns a deployment that means \"off\" into a boot failure. Only genuinely ambiguous values are refused now, and the comment says why so nobody tightens it later.\n\nBoth existing refusal tests use `\"1\"` and are untouched: behavior for well-formed values is identical.\n\n# Mutation results\n\nEach new case pins one direction, and neither is redundant:\n\n| mutation | result |\n| --- | --- |\n| revert to the lenient `raw === \"1\"` | **6 pass / 1 fail** — only `refuses a flag value that means on but is not \"1\"` |\n| re-apply my over-strict first version (reject `\"0\"` too) | **6 pass / 1 fail** — only `accepts \"0\" and empty as off` |\n| unmodified | 7 pass / 0 fail |\n\n# Blast radius\n\nA repo-wide grep finds **no** workflow, env template, script, or config that sets either variable, so no existing deployment configuration changes behavior. The coordinator is off by default and its consumer isn't wired yet, which makes this the cheap moment to fix the parse rather than after something depends on it.\n\n# Verification\n\n```\nbun run --cwd packages/cloud/shared typecheck   -\u003e exit 0, 0 error TS\nbunx @biomejs/biome check \u003cboth files\u003e          -\u003e clean\nbun test agent-backup-restore-coordinator-runtime.test.ts\n                                                -\u003e 7 pass / 0 fail  (was 5)\n```\n\n# How I got here, and what I deliberately left alone\n\nA file-level sweep for modules imported only by tests (the one that produced #30504 and #30505) flagged this module along with the other three `agent-backup-restore-v3-*` files, `shared-memory-dedicated-export.ts`, and `r2-storage-adapter.ts`.\n\n**Those are not orphans and I'm not proposing anything about them.** Their docstrings describe a deliberately staged, disabled-first feature — *\"owns neither copy selection nor failover\"*, *\"stops after a digest-pinned Docker container is created in the stopped, networkless quarantine\"*, *\"an off-by-default feature\"*. That's ~3,200 lines of work-in-progress that is correctly unwired, and it reads as intentional. The only thing I'm changing is a parsing bug inside the gate itself.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NSDE9ZF20654YA1RKXK9K5\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T08:43:55.071Z\",\"completed_at\":\"2026-09-04T08:46:20.268Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T08:43:55.840Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session chieve, aim, target, ambition, milestone, objective, dream, bucket list, resolution, i want to, working toward, strive, vision, purpose, intention`\n- `action.ownerGoals.request` — the goal-action vocabulary\n\nReferencing a differently-named signal is the established pattern in this map: `browser` already pulls `contextSignal.web_search`, `email` pulls `contextSignal.gmail`.\n\nResult: **0 → 260 terms.**\n\n**2. Make the map total, so this cannot recur.** Typed over `FirstPartyAgentContext` through a `ContextKeywordStems` alias. A context added to the taxonomy without stems is now a build error rather than a silent zero.\n\n`AgentContext` is an open union (`FirstPartyAgentContext | (string \u0026 {})`), so lookups go through a small `stemsForContext` accessor that casts to a partial record. Runtime behaviour for unknown names is unchanged, and there is a test pinning that an unknown context still returns no terms.\n\n# Control\n\nRemoving only the `goals` line:\n\n```\nsrc/i18n/action-search-keywords.ts(39,7): error TS2741: Property 'goals' is missing\nin type '{ admin: ...; ... 28 more ...; world: string[]; }'\nbut required in type 'ContextKeywordStems'.\n```\n\nThe guard names the missing context directly. With the line present, `packages/core` typecheck exits 0.\n\nFor this class a compile-time guard is strictly stronger than a test, which is why I typed the record rather than asserting over it.\n\n# A note on the diff\n\nMy first attempt annotated the const inline. That pushed the declaration past biome's line width, biome broke after the `=`, and all 40 map entries reindented — a 159-line diff for a one-line change. The type alias keeps the declaration short and the diff at **+46/−2**. (develop's copy of this file is biome-clean, so that churn was mine, not pre-existing.)\n\n# Also found, deliberately not changed\n\n`contextSignal.send_admin_message.strong` / `.weak` in `shared.keywords.json` are fully authored across all seven locales and read by **nothing** — not the lexicon, not this map. I looked for a consumer that should be using them; the nearest candidate, `providers/escalation-trigger.ts`, is condition-driven rather than keyword-driven. Deleting staged vocabulary or inventing a feature to consume it both seemed presumptuous, so I am flagging it rather than touching it. Happy to follow up either way if you say which.\n\n# Verification\n\n- `bunx vitest run packages/core/src/i18n packages/shared/src/i18n packages/agent/src/actions` → **581 passed / 0 failed** across 40 files.\n- `bun run --cwd packages/core typecheck` → exit 0.\n- `bunx @biomejs/biome check` → clean on both changed files, no reformatting.\n\n# Relation to #30495\n\nSame file, complementary halves of one failure mode. #30495 guards the **values** (every stem resolves to keyword data; it found `contextSignal.messaging` dangling); this guards the **keys** (every context has stems). They touch the `CONTEXT_KEYWORD_STEMS` declaration line, so whichever lands second needs a one-line rebase. Either order works — say the word and I will rebase this onto whichever you prefer.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NE7VWQ02MEDWH0MH0JS2YH\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T05:28:38.040Z\",\"completed_at\":\"2026-09-04T05:30:01.074Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779 h`/`subscribe`/`waitFor` for those events — has no production importer, and no production code anywhere emits or even names `SensitiveRequestSubmitted`, `SensitiveRequestExpired`, or `SensitiveRequestCanceled`.\n\n# Why it's worth writing down\n\nThe E2E test header reads as though it does. Under *\"This drives the REAL code, stitched together the way production wires it\"* it lists:\n\n\u003e the REAL `createSensitiveCallbackBus` wired as the service's `dispatchEvent`, so the agent's callback listener observes the actual fulfillment event — **this is how the agent \"sees the result land back\"**\n\nThe bus is wired by the test itself, and the three connector-facing event names are translated from the service's own events by that same file. On the path the header calls *\"the most security-sensitive path we ship\"*, that sentence is the kind of thing someone stops reading at.\n\n**To be clear about scope: the security invariants that file asserts are unaffected.** Token single-use, tamper rejection, expiry, `requireAuthenticatedLink` blocking anonymous submits, and redaction all live in `SensitiveRequestsService` and are genuinely exercised against the real service. What the bus proves is that the service emits the right lifecycle events at the right moments and that a listener *can* consume them — not that one is subscribed in production. That distinction is the whole change.\n\nI'm treating this as a correctness/coverage gap rather than a vulnerability, which is why it's here and not a private report: the missing piece is a workflow notification, with no confidentiality, integrity, or authorization impact, and nothing above describes an exploit.\n\n# The change\n\nDocumentation only, +40/−3 across two files:\n\n1. On `dispatchEvent` and `emit`: the exported singleton has no dispatcher, so dispatch is a no-op on every route; the bus has no production importer; callers needing the lifecycle must poll the API.\n2. In the E2E header: keep the bus in the list, then say plainly that the wiring is assembled by the test, and that the security assertions don't depend on it.\n\n# What I deliberately did not do\n\n- **Not wired a dispatcher.** I don't know the intended production target — the connector dispatch registry, a queue, something else — and wiring an event sink into a security path on speculation is exactly the change I'd ask another contributor not to make. If a dispatcher was meant to be here, this is a gap to close and the target is yours to name.\n- **Not deleted `sensitive-callback-bus.ts`.** Unlike the orphans in #30504, this one is plausibly load-bearing for wiring that hasn't landed yet, and the E2E test is a real consumer of its behavior. Removing it would presume the answer to the question above.\n- **Not added a test pinning the current no-op.** Pinning behavior I suspect is a gap would make the gap harder to close, not easier.\n\n# How I found it\n\nA file-level sweep for modules imported *only* by tests across `packages/cloud` — 73 hits, which self-validates by rediscovering both files from #30504. Most are test-only by design (stubs, fixtures, `push-schema-for-tests`, admin CLI scripts invoked from `package.json` rather than imported); 25 sit on production paths, and I verified this one by hand rather than trusting the sweep.\n\n# Verification\n\n```\nbun run --cwd packages/cloud/shared typecheck   -\u003e exit 0, 0 error TS\nbunx @biomejs/biome check \u003cboth files\u003e          -\u003e clean\nbun test sensitive-request-hosted-page-e2e.test.ts sensitive-requests.test.ts\n                                                -\u003e 13 pass / 3 skip / 0 fail\n```\n\nThe 3 skips are the pre-existing live-harness cases that need real deployed cloud credentials.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d next_f.push([1,"# What\n\n`lowerOrgBalanceHint` in `packages/cloud/shared/src/lib/services/inference-auth-cache.ts` has **zero call sites** — no production caller, no test. Four doc comments still describe it as the live post-debit gate-hint writer.\n\nThat claim isn't just stale, it's the opposite of a bug you already fixed. `inference-balance-republish.ts:34` spells it out:\n\n\u003e `lowerOrgBalanceHint` cannot repair this: it is lower-only and bails when no entry exists, so after the delete it is always a no-op.\n\nAnd the fast-path test file, at the regression it pins, calls it \"the **old** lower-only repair\":\n\n```\n// REGRESSION (staging 2026-08-05): every settled turn left the gate hint\n// ABSENT, because the committed debit's `onCreditMutation` deletes it and the\n// old lower-only repair bails when no entry exists.\n```\n\nSo the function survived the fix that superseded it, and the surrounding prose kept pointing at it.\n\n# The four doc sites\n\n| where | said | actually |\n|---|---|---|\n| `inference-billing-fast-path.ts` — gate-balance docstring | \"the debit settler **lowers** the hint after each settle, and top-ups invalidate it\" | the settler **republishes** the committed balance and revision (`republishOrgBalanceHintAfterDebit`); every other credit mutation **evicts** the entry |\n| `inference-auth-cache.ts` — inside `writeOrgBalanceHint` | \"the debit settler (`lowerOrgBalanceHint`) and top-ups (`invalidateOrgBalanceHint`)\" | both halves wrong: top-ups evict via `CacheInvalidation.onCreditMutation`; `invalidateOrgBalanceHint` is only reached on a **failed or refused** debit |\n| `inference-auth-cache.ts` — `republishOrgBalanceHint` | \"Unlike `{@link lowerOrgBalanceHint}`…\" | reworded to state the property directly, so it survives the deletion |\n| `container-billing-numeric.ts` + its test | \"`lowerOrgBalanceHint`/logs record a garbage figure\" | dangling name; now \"the cached balance hint and logs\" — I deliberately did **not** substitute `republishOrgBalanceHint`, because container billing doesn't go through the inference settler and I'd only be trading one wrong symbol for another |\n\nI also moved the gate-balance stale-while-revalidate docstring off `GateBalanceReadOptions` and onto `getGateBalanceHint`. It describes the read, not the options bag — hovering the interface currently shows a paragraph about the ~200-500ms balance re-read. While moving it I added the one branch it omitted: under `cacheOnly` a full miss fails closed with `InferenceBalanceCacheWarmingError` instead of blocking on the authoritative read.\n\nThe verified call chain, for the record: `creditsService.deductCredits` → `CacheInvalidation.onCreditMutation` (deletes `CacheKeys.inference.orgBalance`) → `debitInferenceCost` → `republishOrgBalanceHintAfterDebit` → `republishOrgBalanceHint` (unconditional `writeOrgBalanceHint`).\n\n# I added no test, and here is why\n\nThat was my first instinct, and mutation testing talked me out of it.\n\nI wrote a candidate: settle a debit whose committed balance is **higher** than the cached hint (a top-up lands mid-request), then assert the hint reflects the authoritative value — the one case every existing settle assertion happens to miss, since they all lower. Then I checked whether it actually discriminates:\n\n| mutation to `republishOrgBalanceHint` | existing suite | my candidate test |\n|---|---|---|\n| lower-only (bail when absent, skip when not lower) | **6 fail** | fail |\n| clamp to `min(cached, new)` | **1 fail** | **pass** |\n\nIt passed under the clamp because the mocked `deductCredits` deletes the hint first — exactly as production does — so there is never a cached value to clamp against. The test proved nothing the suite didn't already prove, so I dropped it rather than ship coverage theatre. `republish issues one direct authoritative write without a cache read` (line 692) already pins the raising case directly, `2 → 9`, which no lower-only or clamping writer can pass.\n\nThe one thing I renamed in a test is a title that named the removed mechanism: `#9899 hardening: backstop durability, lower-only hint, claim atomicity` → `…, hint republication, …`.\n\n# Verification\n\n- `bun run --cwd packages/cloud/shared typecheck` → **exit 0**, 0 `error TS`\n- `bunx @biomejs/biome check` → clean on all six touched files\n- `bun test inference-billing-fast-path.test.ts --isolate` → **42 pass / 0 fail**\n- `inference-billing-invalidation-logged` 1 pass · `inference-billing-cache-failure` 2 pass · `invalidation-credit-hint` 2 pass · `container-billing-numeric` 8 pass — all 0 fail\n- `grep -rn lowerOrgBalanceHint` across the repo → no hits remain\n\nNet **−6 lines**. No behavior change: the only executable code removed is a function nothing calls.\n\n# What I did not change\n\nI left `republishOrgBalanceHint`'s unconditional-write semantics, the `balanceAt`-before-query ordering in `refreshOrgBalanceHint`, and the documented KV residuals in the sweep exactly as they are. All three are deliberate and correctly described where they live; this PR only makes the *other* comments agree with them.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1NN1ZK6DTWNKX6VDN4TXSHY\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T07:27:45.254Z\",\"completed_at\":\"2026-09-04T07:31:32.660Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e25479 ites over-reading.\n\n`*.ec2.internal` and `*.compute.internal` were **still rejected** — either the lookup fails, or it answers with a private address and `isPrivateIpAddress` catches it. I could not construct a case that got through. So this is defense-in-depth plus duplicate removal, which is why it's a normal PR rather than a private report.\n\nWhat *is* observable is that those hosts reached the resolver, where every other blocked host short-circuits on the denylist. The control run shows it directly — the `.internal` cases take **7–10ms** against **~1ms** for the denylist cases. That's the DNS attempt.\n\n# Evidence\n\nA differential harness over the two functions, before the change:\n\n| host | `isBlockedHostname` | MCP guard |\n|---|---|---|\n| `localhost` | blocked | blocked |\n| `metadata.google.internal` | blocked | blocked |\n| `app.localhost` | blocked | blocked |\n| `printer.local` | blocked | blocked |\n| **`foo.internal`** | **blocked** | **fell through to DNS** |\n| **`bar.ec2.internal`** | **blocked** | **fell through to DNS** |\n| **`node-1.compute.internal`** | **blocked** | **fell through to DNS** |\n| `example.com` | allowed | accepted |\n\n# The change\n\nDelete the duplicate set and the inline suffix checks; call `isBlockedHostname`. The comment records which entry had drifted, so the next reader knows why the local copy is gone rather than re-adding one.\n\n# Tests\n\nA `describe.each` over `http`, `streamable-http` and `sse` asserting the denylist message for `localhost`, `metadata.google.internal`, `app.localhost`, `printer.local`, `foo.internal`, `bar.ec2.internal`, `node-1.compute.internal` — 21 cases, all short-circuiting before DNS as this suite's header promises.\n\n**Control, both ways.** Reverting only the production file and keeping the tests: **exactly the 9 `.internal` cases fail**, and the other 12 stay green — so the probes aren't vacuous.\n\n| | on `develop` | with the fix |\n|---|---|---|\n| `mcp-server-config.test.ts` | **9  | effect |\n|---|---|---|\n| `notifyLowCredits` | `currentBalance \u003e NaN` → `false` | early return skipped → low-credit email sent at **any** balance |\n| `classifyCreditBalance` | `newBalance \u003c= NaN` → `false` | returns `null` → low-credit webhook **never** fires |\n\n**`MCP_SCHEMA_CACHE_TTL=ten`** yields a `NaN` TTL (and logs `TTL: NaNs`).\n\n## The fix\n\nThis package already owns the correct parse. `envInt` fails closed to the\ncaller's fallback for anything non-canonical, and its own header states the\nreason: `parseInt(\"25junk\")` is `25`, so a corrupted value must never silently\nbecome a different budget than the operator wrote.\n\nIt lived inside `services/proxy/config.ts`. A DB repository, a credits service,\nand an MCP cache should not import a proxy config module to get a number parsed,\nso `envInt` moves to `lib/env-int.ts` and `proxy/config.ts` re-exports it —\n**no proxy call site changes**, and its existing test still resolves it through\n`./config`.\n\n## Behavior change worth flagging\n\nBeyond the `NaN` fix, values with trailing garbage (`\"20junk\"`) or a leading `-`\nnow fall back instead of parsing to a partial or negative number. That is\n`envInt`'s documented contract and the safer reading for a quota or threshold,\nbut it is a real change, so it belongs here rather than being discovered in\nreview.\n\n## Scope I deliberately did not take\n\n`envInt` is duplicated **six** times across the repo with three different\nsignatures (some take the raw string, some take the variable name):\n`app-core/scripts/copy-runtime-node-modules.ts`,\n`app-core/test/helpers/stochastic-test.ts`, `plugin-codex-cli/src/codex-backend.ts`,\n`plugin-local-inference/src/services/memory-monitor.ts`,\n`plugin-sql/src/pg/manager.ts`, and this one. Converging them is a cross-package\nchange with its own layering decisions and is not attempted here. Happy to follow\nup if that is wanted.\n\n## Verification\n\n- `bun run typecheck` from `packages/cloud/shared` — e h first and require it to *succeed*, then require the blocked subpath to *fail*. The control is what makes the second half mean anything, and neither depends on a message string that differs between Bun releases.\n\n**Surface check — match by name shape, not one identifier.** The consumer probe cannot inspect a module it is forbidden to load, so \"no test controls escape\" is asserted against the real module surface, filtering `__`-prefixed and `/ForTests?$/` names, plus a non-empty-surface assertion so the filter cannot pass vacuously on an empty module.\n\nI verified the boundary is genuinely enforced before rewriting around it — against a real sibling fixture, the deep path is blocked while `@elizaos/agent/runtime` imports fine with 226 exports.\n\n# Verification\n\n| mutation | result |\n| --- | --- |\n| reintroduce exactly `__createRuntimeInstallationIdLoaderForTests` on the module | **fails** the new surface test (`expected [ Array(1) ] to deeply equal []`) |\n| point the fixture symlink at a nonexistent path | **fails** the new probe (exit 1, stderr non-empty) |\n| unmodified tree | 15 pass / 1 skipped, up from **13 pass / 1 failed** / 1 skipped |\n\nThe first row is the one that matters: the original probe would **not** have caught it, structurally — the blocked import throws before `in loaded` is evaluated.\n\nWith `optional-plugins.test.ts` alongside: 24 pass / 1 skipped. `biome check` clean. One test file, +36/−6, no production code touched.\n\n# Context\n\nFound while auditing generator/committed-artifact drift in this package. `gen-optional-plugin-imports.ts` itself is fine — regeneration is a no-op diff, and corrupting a single `import()` specifier while leaving its key intact is caught by its drift test. This turned up as an unrelated failure in the same run.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution ski cript>self.__next_f.push([1,"46:T155e,"])</script><script>self.__next_f.push([1,"# What\n\nThe `MODEL_WINDOW_RESERVE_FRACTION` docstring states the scaled reserve applies only when:\n\n\u003e (a) the model name was passed AND resolved through `lookupModelContextWindow` AND **(b) the caller did not supply an explicit `reserveTokens`**\n\nClause (b) is wrong. It *also* applies when the caller supplies exactly `DEFAULT_INPUT_RESERVE_TOKENS` — that value is deliberately treated as \"carrying the legacy default\" rather than as an override, so the planner-loop call site (which always forwards its 10k default) still gets the per-model derivation.\n\n# Why it matters\n\nAgainst `claude-opus-4-8`'s **1,000,000**-token window:\n\n| caller passes | docstring implies | code actually gives |\n|---|---|---|\n| `reserveTokens: 10_000` | reserve 10,000 → threshold 990,000 | **reserve 200,000 → threshold 800,000** |\n| `reserveTokens: 10_001` | — | reserve 10,001 (verbatim) |\n\nA **20× reserve** and a **190,000-token** difference in the dispatch threshold, from a value that reads like the default. The discontinuity is sharp — one token more and it's honoured verbatim.\n\n# The behaviour is right; only the contract is stale\n\nI checked whether the *code* was the bug and concluded it isn't:\n\n- `buildModelInputBudget`'s inline comments explain the sentinel and give the reason (the planner-loop forwards `compactionReserveTokens`, default 10k; without the special case the explicit 10k would always beat the derivation).\n- It is already tested: *\"treats reserveTokens === DEFAULT as 'no override' so derivation fires (planner-loop call pattern)\"*.\n\nSo this corrects only the contract a caller reads first — and says how to actually pin the flat floor: omit `modelName` (no lookup fires) or pass `contextWindowTokens` explicitly.\n\n# The one test I added\n\nExisting coverage pins that `10_000` triggers derivation. Nothing pinned that the sentinel is **exactly one value** — someone generalizing it to `\u003c= DEFAULT` would silently re-scale reserves that callers had pinned. The new test asserts `DEFAULT − 1` and `DEFAULT + 1` are both honoured verbatim.\n\nControl — widening the comparison to `rawExplicitReserve \u003c= DEFAULT_INPUT_RESERVE_TOKENS`:\n\n```\n× applies that sentinel to exactly one value, not a range\nAssertionError: expected 26200 to be 9999\n```\n\nTwo pre-existing tests (explicit reserves of `5_000` and `0`) fail alongside it, which confirms that exact comparison is load-bearing in more than one place.\n\n# What I checked and found clean\n\nA property harness over seven groups, all passing — recording them so the ground is covered:\n\n- no `modelName` → flat default reserve, no scaling;\n- resolved `modelName`, no `reserveTokens` → `max(DEFAULT_INPUT_RESERVE_TOKENS, window × 0.20)`;\n- explicit reserves `0`, `1`, `5_000`, `25_000`, `999_999` → honoured verbatim;\n- `dispatchThresholdTokens === max(1, window − reserve)` across twelve model keys;\n- `compactionThresholdTokens` never drifts from its alias;\n- a 10,000,000 reserve against a 1,000-token window still leaves a threshold ≥ 1;\n- a small window keeps the 10k floor.\n\n# Verification\n\n- `model-input-budget.test.ts` → **30 passed / 0 failed** (up from 29).\n- Full `packages/core/src/runtime/__tests__` → **1572 passed / 0 failed**.\n- `bun run --cwd packages/core typecheck` → exit 0.\n- `biome check` → clean on both files, no reformatting.\n\nDiff is 2 files, **+34/−5**. Documentation and tests only — **no behaviour change**.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claud e billed at cacheWrite **(Anthropic's surcharge) on top of the regular input portion that paid for them.**\n\nThe code does the opposite:\n\n```ts\nconst nonCachedInput = Math.max(0, totalPrompt - cacheRead - cacheWrite);\nconst inputCost      = (nonCachedInput / 1_000_000) * price.input;\nconst cacheWriteCost = (cacheWrite / 1_000_000) * cacheWriteRate;\n```\n\nCache-creation tokens are **removed** from the input portion and billed once, at `cacheWrite`. Since `cacheWrite` is `1.25 × input` for every Anthropic entry, the prose describes a **2.25×** charge where the code bills **1.25×**.\n\nThat matters because the prose is what a future reader would \"fix\" the code against. Doing so overcharges every cache-creation token by **1.8×**.\n\nThe same misnomer had already reached a test name — `applies cache-read discount and cache-write **surcharge** for Anthropic` — even though that test's body correctly bills 100 cache-write tokens once at $1.25/M.\n\n# The convention, from this repo's own evidence\n\nI checked rather than assumed:\n\n- All 7 Anthropic entries store `cacheWrite = 1.25 × input` (e.g. `claude-opus-4-8`: input 5.0, cacheWrite 6.25). It's a **full rate**, not an increment.\n- The rate-card test already comments `cacheRead = 0.1x input, cacheWrite = 1.25x`.\n- An existing cost test spells out `1000 prompt = 200 fresh + 700 cacheRead + 100 cacheWrite`, which settles the other half: **`promptTokens` is inclusive of the cache counts.**\n\nSo the arithmetic is correct and already covered. Only the description is wrong.\n\n# The change\n\n**No behaviour change.** Docs and tests only.\n\n1. Rewrite the docstring to state what the code does — `promptTokens` is inclusive, the non-cached portion is the remainder clamped at 0, each portion is billed exactly once, a `0`/unset cache rate means bill at `input` — and name the hazard.\n2. Rename the test to `bills cache-read and cache-write portions at their own full rates`.\n3. Add one assertion that **isolates** the cache-write term, instead of leaving the property implied by a four-term total: make all 1M prompt tokens cache-creation, so every other term is 0 and the expected cost is exactly $1.25.\n\n# Control\n\nReverted the implementation to the model the old prose describes (`nonCachedInput = promptTokens - cacheRead`, leaving cache-write also billed as input):\n\n```\nAssertionError: expected 2.25 to be close to 1.25\nTests  2 failed | 44 passed (46)\n```\n\nThe new isolated assertion names the 1.8× overcharge directly. With the change reverted, 46/46 pass.\n\n# What I checked and found clean\n\nWhile auditing this file I ran two other properties over it — both pass, noting them so the ground is covered:\n\n- **Every one of the 20 price-table keys round-trips through `lookupModelPrice`.** It resolves unknown names by substring with longest-key-wins, so a key resolving to a *different* key would silently mis-price a model. None does.\n- **The `rate \u003e 0 ? rate : input` fallback is safe.** It treats `0` as \"unset\", which would overcharge if any entry had a genuine zero rate. The distribution is clean: `cacheWrite` is either `1.25 × input` (7 Anthropic entries) or exactly `0` (13 others), where `0` correctly means \"no separate cache-write price, bill as ordinary input\".\n\n# Verification\n\n- `bunx vitest run packages/core/src/features/trajectories/pricing.test.ts` → **46 passed / 0 failed** (up from 45).\n- `bun run --cwd packages/core typecheck` → exit 0.\n- `biome check` → clean on both files, no reformatting.\n\nDiff is 2 files, **+27/−5**.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthro pinned.\n\n`DEFAULT_QUARANTINED_SUITES` is checked twice — at runtime in `run-bun-tests.mjs`:\n\n```js\nconst missing = quarantinedSuites.filter((suite) =\u003e !existsSync(path.join(packageDir, suite)));\n```\n\nand here in a test whose name already states the rule:\n\n\u003e `every DEFAULT_QUARANTINED_SUITES entry exists (a rename must update the list, not silently skip)`\n\n`DEFAULT_PROCESS_ISOLATED_SUITES` has neither. It is only ever used to **filter** discovered files:\n\n```js\nconst processIsolatedFiles = testFiles.filter((file) =\u003e\n  DEFAULT_PROCESS_ISOLATED_SUITES.includes(file),\n);\n```\n\nso a renamed suite matches nothing and quietly stops getting its own process.\n\n# Why the boundary matters\n\nNot cosmetic — the list's own docstring says why it exists:\n\n\u003e Suites whose top-level `mock.module` registrations replace broad runtime dependencies for the lifetime of the Bun process. Bun's `--isolate` keeps test globals separate but does not restore those process-wide module mocks, so these suites need a process boundary from their alphabetical neighbors.\n\nA stale entry therefore does not just lose isolation: the suite gets batched, and the process-wide module mocks it was separated from leak into the neighbours.\n\nThat is a different failure from the quarantine list's, which is why the remedy differs — see Scope.\n\n# The existing test looks like it covers this, and does not\n\n`gives process-wide module-mock suites a fresh process` asserts:\n\n```js\nexpect(DEFAULT_PROCESS_ISOLATED_SUITES).toContain(isolated);\n```\n\nThat pins the **list**, not the tree. Rename the file and leave the list alone — the real-world mistake — and the list still contains the old literal, so it still passes.\n\nI checked this rather than assuming it. My first mutation edited the list, which trips that `toContain` and made the gap look already-covered. Redone in the correct direction, `git mv` on the actual suite with the list untouched:\n\n```\n52 pass, 1 fail\n(fail) every DEFAULT_PROCESS_ISOLATED_SUITES entry exists (a rename must update the list, not silently batch)\n```\n\nThe new test is the only thing that fails.\n\n# Scope\n\nTwo tests, one file, +26 lines: the mirrored existence check, and one documenting the consequence directly (a stale entry produces no `process-isolated` batch at all).\n\n**No runtime check added to `run-bun-tests.mjs`, deliberately.** A stale *quarantine* entry makes the quarantined pass run nothing — a coverage hole that has to fail closed at runtime. A stale *process-isolated* entry still runs the suite, so a CI-time guard is the proportionate remedy and does not risk failing a run over a batching detail.\n\n# Verification\n\n- `bun test scripts/run-bun-tests-helpers.test.ts` → **53 pass / 0 fail** (was 51).\n- `bun test scripts/run-bun-tests.e2e.test.ts` → **14 pass / 0 fail**.\n- `biome check` clean on the changed file.\n\n# Context\n\nFound while auditing this package for stranded suites, given its custom runner. Discovery itself is sound — `discoverTestFiles()` walks the package root by pattern and explicitly refuses a vacuous green run — so no suite is orphaned; the gap is only in the hand-maintained list beside it.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1P8EY22794G2JT431894AW0\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T13:06:52.610Z\",\"compl alidation\n- `bun run verify` — 376/376 workspace tasks plus root audits passed on the original exact head\n- Shared-to-Dedicated focused stack E2E — 1/1 passed after rebase on current develop and reviewer-requested structured assertion\n- cloud E2E typecheck passed after final rebase\n- Biome passed with 11 pre-existing undeclared-environment warnings in the dev-vars script\n- exact six-spec blocking cloud stack command — 10/10 passed before the concurrent fixture repair; affected focused spec rerun after each rebase\n\nCloses #304514b:T402,Cloud unit setup in Develop Full run 33926260898 failed before tests started because root postinstall downloaded the desktop embedding model and received HTTP 429 on every attempt. Cloud tests and the deployed staging renderer use fixture or remote inference, so that download is unrelated to their acceptance path.\n\nPass the existing explicit fused-inference setup opt-out during Cloud test dependency installation and deployed-renderer workspace setup. Dependency installation, linked workspace builds, browser tests, deployment authority, and desktop/device installer coverage retain their existing gates.\n\nValidation: pinned Bun 1.3.14 and Node 24.15.0; `bun install` and `bun run verify` passed; installer behavior tests 8/8 and Cloud workflow tests 11/11 passed; Actionlint and `git diff --check` passed. Hosted Cloud setup and release verification remain required after merge.\n\nUI screenshots and model trajectories: N/A for this CI setup change. Hosted setup logs are the applicable evidence.\n\nRefs #30552 and #30440.\n4c:T1a7a,"])</script><script>self.__next_f.push([1,"## The defect\n\n`packages/app/src/main.tsx` **already imports** from `./url-trust-policy`, yet keeps private copies of four functions that module owns: `isTrustedPrivateHttpHost`, `isLoopbackApiHost`, `isPrivateOrLoopbackApiHost`, `isIosLocalAgentIpcUrl`.\n\nThree copies are still byte-identical. The fourth has drifted:\n\n```ts\n// main.tsx\nreturn parsed.protocol === \"eliza-local-agent:\" \u0026\u0026 parsed.hostname === \"ipc\";\n\n// url-trust-policy.ts\nreturn isMobileLocalAgentIpcUrl(parsed);\n```\n\nThe shared predicate is broader, and its own comment records why:\n\n\u003e Chromium WebView treats non-special URL authorities as path data:\n\u003e `eliza-local-agent://ipc/api/status` → pathname `//ipc/api/status`.\n\nIn that parse the **hostname is empty**, so the inline check — which tests hostname only — returns `false` where the policy module returns `true`.\n\n## Consequence\n\nBoth call sites are the same shape, in `isTrustedApiBaseUrl` and `isTrustedDeepLinkApiBaseUrl`:\n\n```ts\nif (isIosLocalAgentIpcUrl(parsed)) return canUseIosLocalAgentIpc();\nif (parsed.protocol !== \"http:\" \u0026\u0026 parsed.protocol !== \"https:\") return false;\n```\n\nA `false` from the first line falls straight through to the protocol guard and returns `false`, so **the on-device agent's own API base is treated as untrusted**. It fails closed: this refuses a legitimate URL rather than accepting a hostile one, which is why this is a functionality fix and not a security report.\n\n**A limit worth stating plainly:** Node's URL parser reports `hostname === \"ipc\"` for every one of these inputs, so I could not reproduce the divergence in this environment. The evidence is the shared helper's documented behaviour and its own test, `mobile-runtime-mode.test.ts:130`, which asserts the `//ipc` pathname shape via a `URL` object.\n\n## The change\n\n- `isIosLocalAgentIpcUrl` delegates to `isMobileLocalAgentIpcUrl` — the same thing `url-trust-policy.ts` does. `main.tsx` already imports that module, so this adds one named import.\n- `isTrustedPrivateHttpHost` and `isLoopbackApiHost` are imported from `./url-trust-policy` instead of redefined.\n- `isPrivateOrLoopbackApiHost` is **left alone**: it is private in `url-trust-policy` too, and exporting it would widen that module's API for a change that does not need it. Flagging it so the remaining duplicate is visible.\n\nNet **+8 / −29**.\n\n**Delegation is not more permissive in a harmful direction.** The shared predicate additionally accepts the string fast path and the `//ipc` pathname shape; `eliza-local-agent://ipcevil/x` is still rejected on all three branches (hostname mismatch, pathname does not start with `//ipc/`, no string-prefix match) — already pinned by `attachment-url.test.ts:70`.\n\n## On not adding a test\n\nDeliberately none. `main.tsx` is the composition root and these helpers are not exported, so any test would have to re-assert the shared predicate — which this repo's own `CLAUDE.md` names as a test to avoid (\"do not add tests whose material assertions… restate the implementation\"). The delegation inherits `mobile-runtime-mode.test.ts`'s coverage, including the WebView pathname case, and the two imported functions are covered by `test/url-trust-policy.test.ts`.\n\n## Verification\n\n| check | result |\n|---|---|\n| `bun run typecheck` (`packages/app`) | exit 0 |\n| `bun run test` (`packages/app`) | 945 pass, 2 skip, 3 fail |\n| `biome check src/main.tsx` | clean |\n\nThe 3 failures are pre-existing — identical with my changes stashed on `develop`: the Playwright colocated-vitest contract, audit-projects worker propagation, and a `host-agent` pinned-Node delay test (my local Node is 22 against the repo's pinned 24).\n\n## How this was found\n\nThe previous two fires each turned up a drifted duplicate helper by accident, so I made it a scan: same-named function declarations of ≥6 lines appearing in more than one file, bodies comment-stripped and whitespace-normalised, compared by token-multiset similarity, keeping only pairs that are **near-identical but not identical** — an exact duplicate cannot have drifted, and a dissimilar one is coincidental name reuse.\n\nThat yields 2943 duplicated names across 23140 pairs, 3424 of them near-identical-but-different — far too many to act on, so the discriminator was drift inside a **security decision**, where a small divergence means one copy accepts what the other rejects.\n\nWorth recording that the top such candidate is **clean**: `embeddedIpv4ForPolicy` is duplicated between `packages/core/src/network/ssrf.ts` and `packages/cloud/shared/src/lib/security/outbound-url.ts` at 99.8% similarity, but the only differences are tab-vs-space indentation and comment wording. The NAT64, 6to4 and Teredo branches are identical, so the SSRF copies agree.\n\n---\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PQ5QVBG0SJGB3WCKVD8320\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T17:23:59.979Z\",\"completed_at\":\"2026-09-04T17:29:08.327Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T17:24:00.283Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"40523ace25ab7dfc78af07704ab7795673650a173c22
