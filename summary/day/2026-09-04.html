p-e1810944.mp4) |\n\n[Final renderer console and network receipt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30567-final-renderer-console-network.json) retains every console event and API request method/path/status from the two final traces. Both viewports reached `ready`; neither recorded a console error. Query strings, request bodies, and headers are excluded from this public diagnostic receipt. Backend and live-model logs are not applicable to the scripted renderer run and remain required for deployed acceptance below.\n\n## Deployed acceptance\n\nThe canonical Cloudflare staging workflow accepts `develop`, so deployed acceptance follows the merge. Deploy the exact merged revision with the coordinated worker rollout, run the renderer-enabled frontend receipt, inspect structured Cloudflare logs, and repeat direct-Cerebras versus gateway latency certification. Keep #30559 open until that proof is attached. The read-only personal Cloud check available during this review returned 401; no provisioning job was created from it. #30600 also repairs worker-before-renderer deployment ordering and must be coordinated with this staging run.\n"])</script><script>self.__next_f.push([1,"15:T221a,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #30553, #30554, #30555, #30556, #30558. Implements two bounded consolidation/removal slices of #30125; does not close that broader tracker.\n\nThis cleanup preserves complete Git and scheduled-event evidence, rejects invalid analysis merges, removes a queue listener leak, makes widget certification fail when execution fails, consolidates connector-token encryption, and deletes an unused voice-profile prototype. The changes were selected from a parallel source/caller audit and independently reviewed across lanes.\n\n- [x] Targets `develop`; rebased on `f3017932d3501c1e13b78fa248c6f074dd5e5c88` with zero conflicts.\n- [x] Bun 1.3.14 install and Node 24.15.0 verification run after sync.\n- [x] Concrete before/after examples and local validation are recorded below.\n\n# Sync with develop\n\n- [x] Latest fetched develop base is `f3017932d3501c1e13b78fa248c6f074dd5e5c88`.\n- [x] Post-sync `bun run verify` passes; see final exact-head ledger below.\n\n# Risks\n\nMedium. Invalid or incomplete Git output now throws; scheduled event data must be complete plain JSON rather than relying on lossy JavaScript conversions. Existing expected non-repository/unborn states and absent optional event payloads remain supported. The queue schema/locking and token key paths/envelope remain unchanged. No deployed renderer or native bridge implementation changes.\n\n# Background\n\n## What does this PR do?\n\n- Replaces duplicate synchronous/shell Git readers with one complete async reader; uses NUL-delimited filename protocols. A real 10.7 MB change previously lost its final marker while reporting `truncated:false`; Unicode paths previously pointed to nonexistent files.\n- Validates analysis document identity and results-map shape before merging. Arrays and mismatched subjects fail without replacing original bytes; arbitrary analyzer IDs are stored as own data properties.\n- Disposes the idle worker's abort listener on normal timer expiry and handles already-aborted signals immediately.\n- Replaces two 16,000-character event-payload cutoff helpers with a scheduling-owned JSON boundary; persistence, retry/escalation and final prompt assembly retain complete event data. Unsupported data fails before task claim.\n- Makes widget execution errors nonzero, clears old output, and reuses local fixture/Tailwind helpers instead of a CDN and fixed wait. Completed widget findings retain the existing `FAIL_ON_VIOLATIONS` policy.\n- Moves byte-identical finance/health token encryption into a Node-only shared subpath, retaining plugin compatibility exports and old envelopes.\n- Removes 13 unregistered/unexported voice-profile prototype files, including fabricated diarization and a 617-line self-contained role “integration” suite. Live voice-profile persistence remains in local-inference.\n\n## What kind of change is this?\n\nBehavioral bug fixes, consolidation, and removal of unused code. 44 files; net 749 lines removed including tests and compatibility adapters.\n\n# Documentation changes needed?\n\nUpdated shared subpath documentation and paired UI CLAUDE/AGENTS instructions. Guide parity passes. The detailed audit and remaining candidates are retained as local review artifacts, not committed evidence.\n\n# Testing\n\n## Where should a reviewer start?\n\nReview each issue's observable acceptance result, then the complete-diff/payload regressions, real filesystem merge tests, worker idle-loop tests, and real certification subprocess failures. Independent review covered Git capture (lead), evidence/queue (product lane), widget runner (runtime lane), and scheduling/crypto (cloud lane). Scheduling's first draft was corrected after independent review identified Maps/Sets that JSON would silently discard.\n\n## Detailed testing steps\n\nRun the owning package test scripts and root `bun run verify` using the pinned runtimes. Local terminal results:\n\n| Package/lane | Passed | Existing skips |\n|---|---:|---:|\n| Evidence | 529 | 2 live-only files |\n| Agent orchestrator | 3,115 | 10 tests |\n| Shared | 2,847 | 0 |\n| Finances | 188 | 0 |\n| Health | 199 | 4 tests |\n| Scheduling | 638 | 0 |\n| Personal assistant | 2,492 | 6 tests |\n| UI | 13,500 | 7 tests |\n| App-core Vitest | 4,461 | 25 tests |\n| App-core script suites | 74 Node + 21 Bun | 0 |\n\nA workflow-only develop update was rebased after the package suites completed. Git tree IDs prove all nine affected package trees are identical to the tested revision; the two changed base workflow suites additionally passed 28 tests. Root verification was rerun on the rebased head.\n\nAll owning-package typechecks/lint and required build dependencies pass through root verification. Chromium and WebKit each certified 2 fy: 376/376 tasks successful.\nCrypto move: before/after executable TypeScript token streams are identical.\nLegacy crypto: synthetic version-1 envelope decrypts through retained finance path.\nGit: complete \u003e8 MiB output equals Git's full output; Unicode/tab/newline/space paths verify on disk.\nScheduling: large event preserved in JSON persistence, rate-limit retry, escalation and final prompt.\nInvalid scheduled input: typed failure before any task claim or dispatch.\nAnalysis: invalid shape/subject leaves original file bytes unchanged; valid own keys persist.\nQueue: repeated real idle polls retain bounded listeners; zero after abort.\nChromium: passed=true, total=2, failed=0, consoleErrors=[]\nWebKit: passed=true, total=2, failed=0, consoleErrors=[]\n```\n\n\u003c/details\u003e\n\n## Screenshots (before / after) + video walkthrough\n\n### Before\nN/A - no product renderer change.\n### After\nN/A - no product renderer change; fixture captures inspected locally.\n### Walkthrough video\nN/A - no product interaction flow change.\n\n## Audio / voice walkthrough\n\nN/A - only a dormant, unregistered voice prototype was deleted. The live voice-profile store and audio pipeline are unchanged.\n\n## Known gaps / failures\n\n- Hosted checks are not yet claimed; this is a draft review handoff, not merge/deployment certification.\n- No live-model or native-device run was performed. The acceptance exercised deterministic transport/persistence boundaries and actual desktop browser fixtures.\n- An initial personal-assistant test run began before fresh-worktree app-core artifacts existed; after dependency builds, the full rerun passed 2,492 tests.\n- App-core's first wrapper invocation incorrectly forwarded `--maxWorkers` to its final Bun script command, expanding unrelated live-agent tests. That unintended child was stopped and excluded from acceptance. The intended Vitest suite and correctly invoked script suites each completed successfully; no broader live-agent claim is ect busy/disabled behavior.\n- Applies the same freshness rules to the invoice detail route.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNo. This restores the intended runtime contract and adds user-facing strings through the existing i18n catalog.\n\n# Testing\n\n## Where should a reviewer start?\n\nStart with `packages/ui/src/components/settings/billing/BillingSection.tsx`, then `billing-data.ts`, the invoice detail route, and their focused tests.\n\n## Detailed testing steps\n\n1. Open Settings \u003e Billing while signed out. Confirm the page settles on “Sign in required” with an operable Sign in action rather than permanent skeletons.\n2. Exercise query error, paused/refetching, missing-user, and organization-switch cases with the focused test suite.\n3. Review the attached full-page desktop/mobile before/after capture, walkthrough, frontend logs, and OCR output.\n\nCommands run:\n\n- `bun test` over the five affected Billing/settings test files: 86 passed.\n- `bun run --cwd packages/ui test -- src/cloud/billing`: 17 files, 277 tests passed at the exact head.\n- `bun run --cwd packages/ui typecheck`: passed.\n- `bun run --cwd packages/ui lint:check`: passed with seven pre-existing warnings.\n- focused Biome check: passed.\n- molecular inventory validation: passed.\n- i18n validation: passed with existing locale warnings.\n- `ELIZA_NODE_PATH=/opt/homebrew/bin/node bun run --cwd packages/app audit:app`: 219/219 views processed; `broken=0`, `needs-work=0`; all four affected Settings captures manually inspected.\n- exact signed-out Billing evidence spec on this branch: 2/2 passed; same spec on develop baseline: 2/2 passed.\n- `ELIZA_NODE_PATH=/opt/homebrew/bin/node bun run verify`: passed, 376 Turbo tasks successful and repository audits green.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:fe368839fcd9316bf6de84861b29164e31157627 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] ![before-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30546-before-desktop-mobile.jpg)\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30546-after-desktop-mobile.jpg)\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30546-after-mobile-walkthrough.mp4\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - signed-out terminal state intentionally sends no authenticated Billing request; the frontend network artifact proves the boundary\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] [30546-mobile-frontend.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30546-mobile-frontend.json)\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] N/A - no agent, action, provider, prompt, or model behavior changes\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - UI and query-state correction produces no persistent domain artifact\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] [30546-ocr-triage.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30546-ocr-triage.json)\n\n# Evidence Details\n\n## Real LLM-call trajectory\n\nN/A - no agent, action, provider, prompt, or model behavior changes.\n\n## Backend + frontend logs\n\nThe signed-out terminal state intentionally sends no authenticated Billing, invoice, or credit request. The attached frontend capture records zero console errors, zero page errors, and no Billing/invoice/credit network request at desktop and mobile widths. Backend logs are therefore N/A for this boundary.\n\n## Screenshots (before / after) + video walkthrough\n\nArtifacts are attached in the evidence rows above. Before shows develop remaining on skeletons; after shows the explicit signed-out action at desktop and mobile widths.\n\n## Audio / voice walkthrough\n\nN/A - no audio, voice, transcript, TTS, or esh candidates and evicted at `LOCALE_LIMIT`. This is precisely the bug f0d4c39d9 describes, on the code path it didn't cover. **The remaining 6 losses, all at the 48-term cap.**\n\n# The change\n\n```js\n-  for (const term of base.slice(0, 64)) {\n+  for (const term of base) {\n```\n```js\n-    const deduped = limitTerms(dedupeTerms(terms), LOCALE_LIMIT);\n+    const deduped = limitTermsPinned(\n+      dedupeTerms(arrayValue(existing[locale])),\n+      dedupeTerms(terms),\n+      LOCALE_LIMIT,\n+    );\n```\n\nThat was `limitTerms`' last caller, so it's removed (biome flagged it).\n\n# Both edits are load-bearing, and the window fix is *not* safe alone\n\n| variant | committed terms lost | terms gained |\n|---|---|---|\n| `develop` (neither) | **16** | +81 |\n| window fix only | **129** | +287 |\n| pin fix only | **0** | +76 |\n| **both (this PR)** | **0** | **+158** |\n\nTranslating all of `base` floods the 48-slot candidate list, so on its own it makes eviction **eight times worse**. It's only safe once the committed terms are pinned. Applied together the regen becomes purely additive: **0 lost, +158 gained, 4 entries added, 0 removed.**\n\nI'll flag a claim I had to drop: I first justified the window fix by arguing the new `action.channelRecap.request` (base length 68) would ship with a truncated translation set. Measured, it has 140 localized terms in all four variants — that argument was wrong. The window fix earns its place on different evidence: **+82 localized terms across 9 entries** (`browser`, `liquidity`, `logs`, `oauth`, `payment`, `room`, `scheduledTasks`, `wallet`, …), with none removed.\n\n# The 4 entries the regen adds\n\nAll four actions are shipped and had **no search keywords in any of the 7 locales**:\n\n| action | defined at |\n|---|---|\n| `CALCULATE` | `packages/core/src/features/basic-capabilities/actions/calculate.ts:247` |\n| `CHANNEL_RECAP` | `packages/core/src/features/basic-capabilities/actions/channel-recap.ts:96` |\n| `FAMILY_WORKFLOWS` | `plugins/plugin-personal-assistant/src/actions/family-workflows.ts:14` |\n| `OWNER_AGREEMENT_KNOWLEDGE` | `plugins/plugin-personal-assistant/src/actions/agreement-knowledge.ts:59` |\n\n# Why not `action-search-overrides.keywords.json`\n\nI checked whether the curated terms belong in the overrides file instead. `generate-keywords.mjs` merges every `*.keywords.json` in the directory, so that would work mechanically — but overrides holds one entry of hand-authored phrasing the audit cannot derive (`server template`, `guild management`, …), and none of the lost terms. These terms *are* dictionary-derived generator output; f0d4c39d9 chose to pin rather than relocate them for exactly this reason, and this follows that precedent.\n\n# Verification\n\n- `node packages/scripts/generate-action-search-keywords.mjs` → deterministic; **generate + biome format is byte-idempotent**.\n- Set-diff of every entry × `base` + 6 locales vs the committed artifact: **0 terms lost**, +158 gained, 151 → 155 entries, 0 entries removed.\n- `bunx vitest run packages/core/src/i18n/action-search-keywords.test.ts` → **15 passed**.\n- `bun run --cwd packages/shared typecheck` and `--cwd packages/core typecheck` → exit 0, 0 `error TS`.\n- `node packages/shared/scripts/generate-keywords.mjs` (the second half of the npm script) → clean.\n- `bunx @biomejs/biome check` on both changed files → clean; `node --check` on the generator → clean.\n\n# Out of scope, worth a follow-up\n\nNothing in CI runs this generator or asserts the artifact is current, which is how 4 shipped actions went keyword-less and why the eviction went unnoticed. A staleness gate is a separate change — and it should not land before this one, since on `develop` such a gate would demand a regeneration that destroys translations.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revisio yout, but terminal-state ordering can hide useful stale content or render contradictory states. Focused tests cover loading, failure recovery, empty, populated, and manifest-less inventories; exact-route desktop/mobile evidence forces the real API boundary to return HTTP 503.\n\n# Background\n\n## What does this PR do?\n\n- Makes loading, error, empty, and populated App Permissions states mutually exclusive.\n- Replaces ad hoc messages with the canonical `ContentState` surface and one recoverable Refresh action.\n- Adds polite busy semantics for loading and an accessible alert for failures.\n- Preserves manifest-less app discovery and existing agent-addressable controls.\n- Expands Refresh and manifest disclosure targets to the 44px interaction minimum.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNo. This restores an existing Settings runtime contract.\n\n# Testing\n\n## Where should a reviewer start?\n\nStart with `packages/ui/src/components/settings/AppPermissionsSection.tsx`, then its new terminal-state test.\n\n## Detailed testing steps\n\n1. Open Settings \u003e App Permissions while the permissions request is pending, fails, returns no grantable apps, and returns a grantable app.\n2. Confirm exactly one terminal state renders in each case.\n3. On failure, confirm Refresh retries and can settle into the empty state.\n4. Review the attached full-page desktop/mobile before/after capture and walkthrough from an intentional HTTP 503 response.\n\nCommands run:\n\n- focused App Permissions and canonical ContentState suite: 2 files, 11 tests passed.\n- full Settings component directory suite: 58 files, 443 tests passed.\n- `bun run --cwd packages/ui typecheck`: passed.\n- focused Biome check: passed.\n- molecular inventory validation: passed.\n- `ELIZA_NODE_PATH=/opt/homebrew/bin/node bun run --cwd packages/app audit:app`: 219/219 passed; `broken=0`, `needs-work=0`; all four Settings captures manually inspected.\n- exact rendered App Permissions 503 evidence spec on this head: desktop and mobile passed.\n- the same evidence spec on the develop baseline: desktop and mobile passed and reproduced simultaneous error + empty output.\n- `ELIZA_NODE_PATH=/opt/homebrew/bin/node bun run verify`: passed, 376 Turbo tasks successful and repository audits green.\n- two independent adversarial reviewers returned clean verdicts after requested corrections.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:6afbbedf58e2b7aaea0d209dc2959afb385f4d8b --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] ![before-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30547-before-desktop-mobile.jpg)\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30547-after-desktop-mobile.jpg)\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30547-app-permissions-error-recovery.mp4\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - deterministic renderer evidence intentionally intercepts the permissions API at the browser boundary\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] [30547-frontend.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30547-frontend.json)\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] N/A - no agent, action, provider, prompt, or model behavior changes\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - presentation-state correction produces no persistent domain artifact\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] [30547-ocr-triage.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30547-ocr-triage.json)\n\n# Evidence Details\n\n## Real LLM-call trajectory\n\nN/A - no model-facing behavior changes.\n\n## Backend + frontend logs\n\nThe deterministic renderer fixture forces `GET /api/apps/permissions` to return HTTP 503. The frontend artifact records the response status, visible state, Refresh count, and expected browser resource error at desktop and mobile sizes. Backend logs are N/A because interception is the tested boundary.\n\n## Screenshots (before / after) + video walkthrough\n\nBefore reproduces the contradictory failure and empty messages. After shows one canonical recoverable error state at both desktop and mobile widths.\n\n## Audio / voice walkthrough\n\nN/A - no audio, voice, transcript, TTS, or STT behavior changes.\n\n## Known gaps / failures\n\n- This draft changes the same generated molecular inventory as #30534 and #30546. It remains draft behind that stack; after both land, rebase, regenerate the expected combined `ContentState` count of 5, and rerun exact-head gates/evidence before review readiness.\n- The first focused test command used Bun's native runner instead of the package Vitest configuration; the corrected package command passed 11/11.\n- A manual formatter command initially included generator-owned JSON, whose deliberate format differs from Biome output. The owning inventory check and focused source/test Biome check pass.\n- The first baseline evidence attempt looked for the new accessible alert role, which the baseline does not have. The corrected cross-revision harness located the shared failure text and then passed 2/2 while reproducing the overlap.\n- The default PATH exposes Node 22.23.1 while the repository requires Node 24+. The supported `ELIZA_NODE_PATH` override used `/opt/homebrew/bin/node` 26.7.0 for repository/app gates.\n\n## Maintainer CI exception record\n\nN/A - no exception requested.\n\n- PR head SHA: N/A - no exception requested\n- Validated `origin/develop` SHA: N/A - no exception requested\n- Live ruleset readback and named bypass eligibility: N/A - no exception requested\n- Queued or failing checks and run URLs: N/A - no exception requested\n- Infrastructure-only or unrelated-failure proof: N/A - no exception requested\n- Exact-head commands, exit status, and artifacts: N/A - no exception requested\n- Exact-head security, secret-scan, and provenance results: N/A - no exception requested\n- Conflict-free and affected-path failure attestation: N/A - no exception requested\n- Independent approving reviewer: N/A - no exception requested\n- Bypass authorizer: N/A - no exception requested\n- Merge method: N/A - no exception requested\n- Rollback owner: N/A - no exception requested\n- Post-merge `develop` validation: N/A - no exception requested\n\n"])</script><script>self.__next_f.push([1,"1a:T1ecb,"])</script><script>self.__next_f.push([1,"## The bug\n\n`DiskStore.read` trusted its own state directory:\n\n```ts\nconst raw = readFileSync(file, \"utf8\");\nconst parsed = JSON.parse(raw) as ToolCacheEntry;\nif (parsed.key !== key) return undefined;\nreturn parsed;\n```\n\nNo error handling, and an unvalidated cast on bytes this process did not write.\n\n`ToolCallCache.run` calls that synchronously, *before* the executor:\n\n```ts\nconst hit = this.getByKey(descriptor, cacheKey);   // -\u003e disk.read(key)\nif (hit \u0026\u0026 shouldCache(hit.output)) return hit.output;\n```\n\nSo a malformed row does not degrade to a cache miss. It throws out of `run`\nand **the tool never runs at all**. That contradicts the contract stated a few\nlines away in `keyFor`, on the sibling failure path:\n\n\u003e error-policy:J7 the cache is optional degradation, not the tool call\n\nI confirmed it by writing a truncated row and calling `run`:\n\n| on-disk bytes | result | executor calls |\n|---|---|---|\n| `{\"key\":\"…\",\"toolName\":\"web_search\"` | throws `SyntaxError` | **0** |\n| `null` | throws `TypeError: Cannot read properties of null (reading 'key')` | **0** |\n\nAnd it is permanent. The read path never rewrote or removed the row it\nrejected, so the same key fails on every later call — in this process and in\nevery future one — until someone deletes the state directory by hand:\n\n```\nattempt 1: threw SyntaxError\nattempt 2: threw SyntaxError\npoisoned file still present: true\n```\n\nThis needs no attacker. `write` called `writeFileSync` straight onto the live\npath, with no temp-and-rename, so a crash, a signal or a full disk mid-write\nleaves exactly that partial file.\n\n## A quieter consequence of the same cast\n\n`getByKey` tests `candidate.expiresAt \u003c= this.now()`. When the field is absent\nthat is `undefined \u003c= now`, which is `false` — so the row reads as *not yet\nexpired at every clock value*. A row carrying no expiry is served forever and\nthe tool it caches never runs again. With a 1 s TTL and `now() = 1e15`:\n\n```\nserved: \"STALE\"   executor calls: 0\n```\n\nI checked two adjacent shapes that looked equally suspect and they are fine —\na string `expiresAt` coerces and does expire, and a row with no `output` field\nmisses — so this is the one field where absence is silently wrong rather than\nloud.\n\n## The fix\n\n- **`read` validates instead of casting.** A new `isStoredEntry` type guard\n  checks every field the read path or `getByKey` goes on to *compare*. Any\n  failure — unparseable, unreadable, non-object, or non-conforming — is a miss\n  that **also evicts the file**, so the key self-heals on the next call.\n- **`write` publishes atomically** through a uniquely-named temp file plus\n  `rename`, so a crash cannot produce the partial row in the first place.\n- **Neither method throws.** Two holes I found while auditing my own patch:\n  - If `\u003ckey\u003e.json` is a *directory*, `readFileSync` raises `EISDIR` and the\n    eviction's non-recursive `rmSync` then throws too. Eviction is now\n    best-effort.\n  - `disk.write` runs inside `run`'s `.then`, **after the tool has already\n    returned**, so a raised `ENOSPC`/`EACCES` rejects a promise whose tool\n    succeeded and discards the result. `write` now logs and continues uncached.\n\n`output` presence is checked with `in`, not truthiness, because `null`, `0` and\n`false` are all valid `ToolOutput` values.\n\n## What I deliberately did not change\n\n- **`output` shape is not validated.** That would mean a deep walk of untrusted\n  data, which `isRedactionDegraded` here and `shouldCache` in `run` already\n  perform on the way out. Presence only.\n- **The two traversals in `key.ts` and `bounded-walk.ts` stay separate.** The\n  header comment explains why at length; nothing here needs them merged.\n- **`invalidate(toolName, argHash)` does not verify that the entry's `toolName`\n  matches** before deleting by hash, so `invalidate(\"a\", hashOfB)` drops B's\n  row. Both callers pass a hash they just derived from that same descriptor, so\n  it is unreachable today — noting it rather than widening the diff.\n\n## Tests\n\n21 added, and the pinning tests updated.\n\n- `disk-store.test.ts`: two tables — 6 malformed-bytes cases (truncated, empty,\n  non-JSON, `null`, `[]`, bare number) and 8 non-conforming-shape cases — each\n  asserting **miss *and* eviction**; the not-a-regular-file case; a swallowed\n  publish failure leaving no temp residue.\n- `cache.test.ts`: the tool runs instead of the call failing; the key self-heals\n  so a second call is a hit; a no-expiry row is not served; a successful tool\n  result survives a failed disk write.\n- **Liveness control**: a conforming row whose `output` is `null`, `0`, `false`,\n  `\"\"`, `[]` or `{}` is still served. Without it, every \"reads as a miss\"\n  assertion above would pass just as well if the validator rejected everything.\n\nTwo existing tests pinned the old behaviour — `throws when the on-disk row is\nnot JSON`, and a key-mismatch case asserting `existsSync(file)` stays `true`.\nBoth come from d2cdce0d56 *\"test(agent): cover disk-store (#25621)\"*, a coverage\ncommit, with no stated rationale; they recorded what the code did rather than a\ndesigned contract, and they contradict error-policy:J7. Updated in place rather\nthan dropped, so the contract change is visible in the diff.\n\n**Ablation** — reverting only `disk-store.ts` to `develop` and re-running:\n\n```\nTests  21 failed | 220 passed (241)\n```\n\nRestored: `241 passed`. `biome check` clean; `tsc --noEmit -p packages/agent`\nclean.\n\nThe wider `packages/agent/src/runtime` suite has 14 pre-existing red files on\n`develop` locally (cloud-config, vault, wallet, plugin-resolver). None of them\nreference `ToolCallCache` or `DiskStore`, `DiskStore` has no consumers outside\nthis directory, and I reproduced one of them (`plugin-resolver-preflight`) on a\nclean `develop` checkout — so they are unrelated to this change rather than\nsomething it introduced.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1PBWNFM8KYX7B0FQ3JFGHEV\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-04T14:06:48.309Z\",\"completed_at\":\"2026-09-04T14:18:09.773Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-04T14:06:48.534Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\ nd\n\n## What does this PR do?\n\n- Parses successful Anthropic token responses as untrusted JSON instead of asserting their shape.\n- Requires nonblank access and exchange refresh tokens, validates optional rotated refresh tokens, and requires a positive finite expiry.\n- Rejects expiry values whose absolute timestamp would overflow to a non-finite value.\n- Reports malformed JSON and malformed response shapes as actionable `ElizaError` failures without including token values.\n- Adds adversarial exchange and refresh regression coverage, including JSON numeric overflow.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo. This corrects validation of an existing internal vendor response contract and does not change a documented public API.\n\n# Testing\n\n## Where should a reviewer start?\n\nReview `packages/auth/src/vendor/pi-oauth/anthropic-login.test.ts`, which exercises valid exchange and refresh responses plus every rejected boundary shape through real `Response` objects.\n\n## Detailed testing steps\n\nOn exact head `4deb3d1cdc6642bc94e24cff69f7324e1e83e82e` with Bun 1.3.14 and Node 24.15.0:\n\n1. `bun run --cwd packages/auth test` — 18 files, 230 tests passed.\n2. `bun run --cwd packages/auth typecheck` — passed.\n3. `bun run --cwd packages/auth lint:check` — passed.\n4. `bun run --cwd packages/auth format:check` — passed.\n5. `bun run --cwd packages/auth build` — passed.\n6. `bun run verify` — passed.\n7. `git diff --check origin/develop...HEAD` and `git show --check` — passed.\n\nTwo independent adversarial reviews initially identified absolute-expiry overflow. Regression tests were added before the fix; both reviewers then returned zero findings. One reviewer ran 31 tests across the token helper and wrapper suites; the focused helper suite passes 29 tests.\n\n# Evidence Gate\n\nEvidence matches the exact commit reviewed.\n\u003c!-- evidence-head:4deb3d1cdc6642bc94e24cff69f7324e1 nQuota) {\n  return { ok: false, status: 429, body: anthropicQuotaError() };\n}\n```\n\nLines are written with `appendFileSync`, so a crash, a signal or a full disk\nbetween the record and its trailing newline leaves a partial line behind. I\nseeded a real record, appended one truncated line, and called the admission\nfunction twice:\n\n```\nattempt 1: THREW SyntaxError\nattempt 2: THREW SyntaxError\n```\n\nNothing skips or repairs the line, so it is not one failed request — every\nlater admission decision re-reads the same bytes and throws again, in this\nprocess and in every future one. `queryAccountPoolConsumerUsage` throws with it.\n\n## The same cast also decides wrongly rather than loudly\n\n`used` is a `reduce` over `record.totalTokens`. One well-formed line missing\nthat field makes the sum `NaN` — and `NaN \u003e quota` is `false`. Against a\nconsumer already far past a 100-token quota:\n\n```\nover-quota admission BEFORE: {\"ok\":false,\"status\":429,...}\nover-quota admission AFTER : {\"id\":\"qbfxPIAqQd3VrtsV\",...}     \u003c- admitted\n```\n\nTwo more shapes behave the same way: a record with no `usage` object throws a\n`TypeError` out of the summary via `addRecordToBucket`, and a record with no\n`ts` passes *both* halves of `parsed.ts \u003c start || parsed.ts \u003e= end` — since\n`undefined` compares `false` either way — so it is counted into every day.\n\n**On reachability, so the severity is not overstated:** `normalizeUsage` runs\nevery member through `normalizeNonNegativeInteger`, so `usageTotal` is always\nfinite and today's writer *cannot* emit a record without `totalTokens`; the\nfield and the log format also arrived in the same commit (d59e659500), so no\nolder schema produced one either. The quota bypass therefore needs external\nmodification of the state directory or a future schema change. **The truncated\nline does not** — an interrupted append is enough. So the throw is why this\nneeds fixing, and the bypass is why the fix validates rather than merely\ncatching: a bare `try/catch` closes the outage and leaves the gate open.\n\n## The fix, and why it is this shape\n\nThis module already applies the right rule to its *other* untrusted input.\n`consumeEvent` guards `JSON.parse` on upstream SSE bytes:\n\n```ts\n} catch {\n  // error-policy:J3 upstream SSE data is untrusted input; malformed events\n  // are invalid for metering but the already-enqueued passthrough bytes are\n  // still owned by the transport proxy.\n  return;\n}\n```\n\nA log line written by a previous process is untrusted in exactly the same sense.\nThis extends that existing in-file policy to the reader 900 lines away, rather\nthan importing an outside opinion: skip a line that cannot be parsed, and\nvalidate the rest through `isUsageRecord`, which checks every field the\naggregation and the quota comparison go on to accumulate or compare.\n\n## What I deliberately did not change\n\n- **The damaged line is left on disk.** #30528 evicts an unreadable row because\n  a cache row is reconstructible; this is an audit log, and repairing it by\n  rewriting would destroy records. Skipping is the whole remedy.\n- **No logger.** The module imports only node builtins plus `resolveStateDir`,\n  and its own SSE precedent skips silently with a comment. Adding a logging\n  dependency to announce a skipped line would be a bigger change than the fix.\n  If you would rather surface a skipped-line count, say so and I will add it —\n  it is a deliberate omission, not an oversight.\n- **A truncation that strands the newline still costs the *next* record too**,\n  because the following append glues onto the same line. That is inherent to\n  the JSONL-plus-`appendFileSync` format, not something the reader can recover;\n  a test pins the boundary explicitly so the limit is documented rather than\n  assumed.\n- `readTotalsFile`, `readReservationsFile` and `readKeysFile` are untouched.\n  What separates them from the log reader is that all three read a *whole* file\n  written through `atomicWriteJson` (temp file + `rename`), so the interrupted\n  write that produces a partial JSONL line cannot produce a partial one of\n  these. `readReservationsFile` and `readKeysFile` additionally check a version\n  and reject a bad shape — `readReservationsFile` validates every reservation\n  field by field, which is the model I followed for `isUsageRecord`.\n  `readTotalsFile` does **not**: it is a bare\n  `JSON.parse(readFileSync(file)) as AccountPoolConsumerUsageTotals` with no\n  checks at all, so a totals file with no `byConsumer` would throw a\n  `TypeError` out of `recordAccountPoolConsumerUsage`. I am leaving it out of\n  this PR because its atomic write means nothing in normal operation produces\n  such a file — but the asymmetry with its immediate neighbour is real, and if\n  you would like it validated too, say so and I will extend this PR rather than\n  open a second one against the same module.\n\n## Tests\n\n9 added, alongside the 10 existing ones.\n\n- Admission survives a truncated trailing line, **twice** — the second call is\n  what proves it is not permanent.\n- A damaged line costs only its own record: intact records before it, and after\n  it when the newline survived, are still counted.\n- A table of five non-conforming shapes (no `totalTokens`, no `usage`, a\n  missing `usage` member, no `ts`, a string `totalTokens`) is ignored by the\n  summary.\n- An exhausted quota **stays** exhausted when a `totalTokens`-less line is\n  appended.\n- **Liveness control**: two intact records around a damaged line still report\n  `tokens: 17`, `requests: 2`. Without it, every \"is ignored\" assertion above\n  would pass just as well if the reader returned nothing at all.\n\n**Ablation** — reverting only the reader and re-running:\n\n```\nTests  9 failed | 10 passed (19)\n```\n\nRestored: `19 passed`. Biome clean. `tsc -p packages/app-core` reports 22\nerrors, unchanged from `develop` and none in either changed file.\n\nCompute s/auth/src/credentials-claude-cli-boundary.test.ts` exercises malformed and valid persisted files through both public consumers.\n\n## Detailed testing steps\n\n1. Run `bun run --cwd packages/auth test -- src/credentials-claude-cli-boundary.test.ts`.\n2. Confirm all 19 boundary cases pass, including independent malformed shadowed aliases, JSON numeric overflow, explicit nulls, missing expiry, future expiry, and expired snake_case refresh.\n3. Run `bun run --cwd packages/auth test`, `bun run --cwd packages/auth typecheck`, and `bun run verify`.\n\nObserved results on exact head:\n\n- Focused boundary suite: 19/19 passed.\n- Full auth suite: 19 files, 229/229 passed.\n- Auth typecheck and Biome checks passed.\n- Repository verify: 376/376 workspace tasks passed plus all repository audits.\n- Toolchain: Bun 1.3.14 and Node 24.15.0.\n- Two independent adversarial reviews completed with zero remaining findings.\n\nReal temporary-file runtime proof for the original malformed string-expiry case:\n\n```text\n{\"malformedStatusRows\":0}\n{\"deferredProbeCompleted\":true}\n```\n\nNo imported-token or detected-subscription log was emitted.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:b8ecf268319fbb3a7272232a6740a99b67f3bb49 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered UI surface changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered UI surface changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - this is a local auth parsing boundary with no visual flow.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] N/A - no backend transport changes; exact public-library runtime output is included above.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend code or network behavior changes.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no agent, action, prompt, provider inference, or model behavior changes.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x process. Two splits ship today, so it isn't.\n\n**1. `@elizaos/core` and `@elizaos/core/errors` are different classes, in plain Node.** `build.ts` lists `src/errors.ts` as its own entrypoint alongside `src/index.node.ts`, and the barrel re-exports `./errors`, so each emitted bundle inlines its own copy. Against the built `dist`:\n\n```\nnode barrel   -\u003e same class as ./errors subpath = false\nbrowser barrel-\u003e same class as ./errors subpath = false\nedge barrel   -\u003e same class as ./errors subpath = false\n```\n\n**2. The Cloud Worker bundle carries two of them.** `packages/cloud/api/wrangler.toml:34` aliases `\"@elizaos/core\"` to the hand-written worker-safe mirror `src/stubs/elizaos-core.ts`. That alias is exact, so `@elizaos/core/errors` escapes it and keeps resolving to the real module. The shipped bundle's sourcemap (`.wrangler-dry-run/index.js.map`, worker `eliza-cloud-api-prod`) lists both:\n\n```\n../src/stubs/elizaos-core.ts\n../../../core/src/errors.ts\n```\n\n# Why it matters: a paid Twilio call is misclassified\n\n`packages/cloud/shared/src/lib/utils/owned-bounded-fetch.ts:9` imports `ElizaError` from **`@elizaos/core/errors`** and throws `INVALID_CLOUD_REST_BOUNDS` and `CLOUD_REST_RESPONSE_TOO_LARGE` (`severity: \"ephemeral\"`).\n\n`packages/cloud/shared/src/lib/utils/twilio-api.ts:7` imports `isElizaError` from **`@elizaos/core`**, and awaits `twilioFetch` → `ownedBoundedFetch` inside the `try` at line 119:\n\n```ts\n} catch (cause) {\n  if (isElizaError(cause)) throw cause;\n  // error-policy:J2 transport failure after dispatch cannot prove whether\n  // Twilio accepted the paid operation.\n  throw new ElizaError(\"Twilio request acceptance is uncertain\", {\n    code: \"TWILIO_SUBMISSION_UNCERTAIN\", ..., severity: \"fatal\",\n  });\n}\n```\n\nThe pass-through misses. Reproduced end to end against `dist`:\n\n```\nisElizaError(cause) = false            \u003c-- twilio-api.ts:121 pass-through\ntoElizaError keeps code?  UNCLASSIFIED   (expected CLOUD_REST_RESPONSE_TOO_LARGE)\ndouble-wrapped: true\n```\n\nSo a deterministic, client-side bounds failure — where we know exactly what happened — is relabeled *\"Twilio request acceptance is uncertain\"*, `fatal`. That is the one classification that means \"we may have been charged and cannot tell.\" Both `owned-bounded-fetch.ts` and `twilio-api.ts` are in the shipped worker bundle; I checked.\n\n`toElizaError` has the same shape and loses the precise `code` to `UNCLASSIFIED`, burying the real one on `.cause`.\n\n# Why no test catches it\n\n`vitest.config.ts` aliases `@elizaos/core` and its subpaths to source, so every suite resolves a single module instance. The split is structurally unobservable from the existing harness — which is why the new tests construct a second copy explicitly.\n\n# The fix\n\nBrand the prototype with a **registry** symbol, which is shared by identity across every copy that uses the same key:\n\n```ts\nconst ELIZA_ERROR_BRAND = Symbol.for(\"@elizaos/core:ElizaError\");\n\nObject.defineProperty(ElizaError.prototype, ELIZA_ERROR_BRAND, {\n  value: true, enumerable: false, writable: false, configurable: false,\n});\n\nexport function isElizaError(value: unknown): value is ElizaError {\n  if (value instanceof ElizaError) return true;\n  return (\n    typeof value === \"object\" \u0026\u0026 value !== null \u0026\u0026\n    (value as Record\u003csymbol, unknown\u003e)[ELIZA_ERROR_BRAND] === true\n  );\n}\n```\n\n`instanceof` stays the fast path. `toElizaError` now calls `isElizaError` instead of a bare `instanceof`.\n\nIt is on the **prototype**, not a class field, so it is non-enumerable and inherited by subclasses: `JSON.stringify`, `Object.keys`, `{...err}` and structural equality are all unaffected (asserted). The same change is mirrored into `src/stubs/elizaos-core.ts`, which already documents itself as mirroring `packages/core/src/errors.ts`.\n\nThis also covers the general duplicate-copy case (two `@elizaos/core` versions in one dependency tree), not just the two splits above.\n\n# Evidence\n\nNew tests, **with the control run both ways** — reverting only the two production files and keeping the tests:\n\n| suite | on `develop` | with the fix |\n|---|---|---|\n| `packages/core/src/errors.test.ts` | **2 failed** / 9 passed | 11 passed |\n| `packages/cloud/api/__tests__/worker-core-stub-error-identity.test.ts` | **3 failed** / 2 passed | 5 passed |\n\nThe premise assertions (`other.ElizaError !== ElizaError`, `foreign instanceof ElizaError === false`) and the negative cases (plain `Error`, plain object, `null`) stay green in *both* directions, so the probes are not vacuous. The core test uses `vi.resetModules()` to get a genuinely separate module instance; the cloud test crosses the real stub against the real module — the exact production pairing.\n\nRegression sweep:\n\n- `bunx vitest run` over the core + agent `ElizaError` suites — **88 passed**. One unrelated suite fails to collect (`Failed to resolve entry for package \"@elizaos/plugin-sql\"`); it fails identically on `develop`, so it is pre-existing and not from this change.\n- `bun test` cloud/shared `twilio-api`, `steward-sync-default-provisioning`, `owned-bounded-fetch`, `cloud-bound-helpers` — **35 tests, 0 fail**.\n- `bun test` cloud/api stub consumers (`onboarding-coordinator-transport`, voice `revoke-and-metering`, `mint-consent-route`) — **34 tests, 0 fail**.\n- `bun run --cwd packages/core typecheck` and `--cwd packages/cloud/api typecheck` — exit 0, 0 TS errors.\n- `biome check` clean on all four files.\n\n# Not in this PR\n\nWhile confirming the above I noticed `dist/node/errors.js` carries a module-scope `createRequire(import.meta.url)` preamble even though `src/errors.ts` has no imports at all, and `__require` is declared but never used. Per the comments in `build.ts`, that preamble is exactly what workerd rejects at import time, and `./errors` has no `workerd` condition. It is not reachable today — the worker bundle resolves  in an unrelated change, applying the compiler's own suggestion (\"Consider explicitly re-exporting to resolve the ambiguity\"), which silences the diagnostic by making one side win silently.\n\n# The change\n\nDelete the `task.ts` trio and restore the plain `export *`.\n\nThe `task.ts` declarations are **unreachable**: the barrel serves the other shape, and nothing deep-imports them (`approval-routes.ts`, the UI notification components and `client-approvals.ts` all import from `@elizaos/core`). Everything already uses the `pending-user-action.ts` shape, so this removes dead code — it does not migrate anyone.\n\n# Ablation\n\n`typecheck` error counts, baselines 0/0/0:\n\n| variant | core | agent | ui |\n|---|---|---|---|\n| develop | 0 | 0 | 0 |\n| **A** — delete the `task.ts` trio only | 0 | 0 | 0 |\n| **B** — restore `export *` only | **3** | **3** | **3** |\n| **A + B** (this PR) | 0 | 0 | 0 |\n\nB's three errors are `TS2308` naming exactly `PendingUserAction`, `PendingUserActionKind` and `PendingUserActionOption`, which is the confirmation that these three names are the whole collision and the explicit list is the only thing hiding them.\n\nA alone is invisible; B alone breaks the build. Only the pair is correct, and it leaves the barrel uniform so a **future** re-duplication of these names raises TS2308 loudly instead of being masked.\n\n# The guard\n\n`packages/core/src/__tests__/types-barrel-export-collisions.test.ts`, following the existing `service-type-collisions.test.ts` precedent (AST scan plus an allowlist that demands a reason).\n\nRestoring `export *` only protects against a re-duplication that nobody papers over again. The test asserts the property the compiler *stops* checking the moment a star becomes an explicit list: across every module the barrel re-exports from, no exported name resolves to more than one underlying declaration.\n\nIt builds a real `ts.Program` and resolves through the checker, following alias chains — so re-exporting one binding through several files is not mistaken for a second declaration. A second test case pins that non-collision directly.\n\n**Proven against the unfixed tree.** With develop's two files restored it fails naming exactly the three names with correct file attribution — and it catches them *with the explicit list still in place*, which is the case TypeScript does not check:\n\n```\n+   \"PendingUserAction\n+   - ./pending-user-action -\u003e packages/core/src/types/pending-user-action.ts\n+   - ./task -\u003e packages/core/src/types/task.ts\",\n```\n\nThe scan is not vacuous: **65 modules resolved, 1238 export slots** compared, and only these three collided.\n\n# Verification\n\n- `typecheck`: core, agent, ui — **0 errors** each.\n- **177 tests green**: core barrel-collision + `pending-user-action-suite` + `approval` (18), agent `approval-routes` (41), ui `pending-action-notifications` + `NotificationsHomeCenter` (118).\n- `biome check` clean on all three files; `bunx vitest list` confirms the new file is collected.\n\n# Scope\n\nI did not touch the surviving contract or migrate any consumer, and I did not judge which of the two shapes is better — the question does not arise, because only one of them is reachable. This deletes the dead duplicate and removes the mask.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1P5PD0KQ1J6WEJ9K52ZZ2N6\",\"project\":\"eliza\",\"repository\":\ pposed to protect a user's edit.\nIt is read from the closure captured when the request was **issued**, so for\nanyone who had not started typing yet it is still `false` when the snapshot\nlands — and the edit is discarded.\n\n`refreshNativeState` has the same stale read. It uses the functional updater\nform, which protects the *value* being replaced but not the *flag* deciding\nwhether to replace it.\n\nReproduced by driving the real component with the bridge call held in flight —\nclick **Check / Download Update**, type, then let the snapshot arrive:\n\n```\ntyped  : \"https://typed-by-user.test/n\"\nsettled: \"https://from-check.example/notes\"     \u003c- edit discarded\n```\n\n## The fix\n\nThe flag becomes a ref, read at the moment of the write rather than the moment\nthe request was issued. Once the post-await reads go through the ref, nothing\nelse read the state at all — nothing renders from it — so `useState` was buying\na re-render and a stale read and nothing else, and it is gone rather than\nmirrored.\n\nThat also removes a smaller cost. `refreshNativeState` took the flag as a\ndependency, so the first keystroke changed its identity and re-ran the two\neffects holding it: one redundant `desktopGetUpdaterState` round trip plus a\nteardown and re-subscribe of both bridge listeners.\n\nI measured this rather than assuming it, and the measurement shrank the claim:\nfive keystrokes produced **one** extra call, not five, because the flag only\ntransitions once. It is now zero.\n\n## Relationship to #30532\n\nSame defect class, different mechanism. There, an async handler cleared the\nguard unconditionally after awaiting; here it reads a stale copy of it. In both\ncases the guard was right and the *read* was wrong. I found this by looking for\nthe mechanism rather than the symptom — exactly three components in\n`packages/ui` hold a user-is-typing flag, and checking the other two after\n#30532 turned this up.\n\n`VoiceConfigView`, the third, is clean: its `dirty` flag is only read in render\nand cleared by an explicit save.\n\n## Tests\n\nThis component had no test file; this PR adds one with three cases.\n\n- A URL typed while a check is in flight survives the snapshot.\n- **Liveness control**: an untouched field still adopts the checked snapshot\n  URL. Without it, the fix could pass by making the field stop following\n  snapshots altogether.\n- Editing the field does not re-run the updater refresh.\n\n**Ablation** — reverting only `ReleaseCenterView.tsx`:\n\n```\n× keeps a URL typed while an update check was in flight\n  → expected 'https://from-check.example/notes' to be 'https://typed-by-user.test/n'\n✓ still adopts the checked snapshot URL when the user did not type\n× does not re-run the updater refresh just because the field was edited\n  → expected 2 to be 1\nTests  2 failed | 1 passed (3)\n```\n\nRestored: `3 passed`. The control passing in both directions is the point of it.\n\n`packages/ui/src/components/pages` is `1 failed | 496 passed`; the failure is\n`AutomationsFeed.test.tsx` (\"Unable to find a label with the text of: Workflow\nname\", plus a `ResizeObserver` ReferenceError), which reproduces identically on\na clean `develop` checkout and is unrelated to this change. Biome clean.\n`tsc --noEmit -p packages/ui` reports 0 errors on this branch and 0 on\n`develop`.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M ep `Run ./.github/actions/setup-bun-workspace`:\n\n```text\n[ensure-fused-inference] downloading gte-small_fp16.gguf from pinned revision 208c4701ee35ad296b92918e02c03aebfaa6be6f\n[ensure-fused-inference] ERROR: failed to download gte-small_fp16.gguf: HTTP 429\nerror: script \"postinstall\" exited with code 1\n```\n\n(`ci-ok`, `Complete manifest`, and `canonical / All Tests Passed` in that run are downstream aggregations of this failure. The Zero-Key failures in the same run are a separate fixture root owned by #30490 and are untouched here.)\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [ ] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker. — Scoped verification\n      only: the package's script suite (12/12) and Biome on both changed files;\n      full `bun run verify` not run (see Testing).\n\n# Sync with develop\n\n- [x] Rebased/merged onto the latest `origin/develop`; zero conflicts.\n      Branch is a single commit cut directly from `origin/develop` @ `5463f6db8`.\n- [ ] `bun run verify` passes post-sync — not run; scoped evidence in Testing.\n\n# Risks\n\nLow. Only the embedding-model download path inside `ensureEmbeddingArtifact` changes. The success path still makes exactly one request; a failing download now takes at most 3 extra attempts bounded by ~90 s of backoff before producing the same typed error as before (message unchanged). No dependency, workflow, or artifact-contract changes; the pinned revision, SHA-256 verification, atomic rename, and HF_TOKEN handling are untouched.\n\n# Background\n\n## What does this PR do?\n\n`bun install` postinstall downloads the pinned `gte-small_fp16.gguf` (67,308,128 bytes, SHA-256-verified) from `huggingface.co` with a single `fetch` and no retry. CI sends no `HF_TOKEN` (no workflow sets it), so every full-install job downloads anonymously from shared GitHub-runner egress IPs — the host can answer `429` for traffic this repository did not generate, and one such answer fails the job's whole postinstall (observed above at the current integration head).\n\nThis adds a bounded, `Retry-After`-aware retry to that one download:\n\n- retries only `429 / 502 / 503 / 504` (plus never more than `downloadAttempts`, default 4);\n- honors a present, parseable, non-negative `Retry-After` header (capped at 60 s); otherwise backs off `retryDelayMs × attempt` (default 10 s × attempt, capped at 60 s);\n- preserves the existing typed error verbatim on exhaustion — a genuinely unavailable artifact still fails loudly;\n- exposes `downloadAttempts` / `retryDelayMs` / `sleep` options alongside the already-injectable `fetchImpl` so the behavior is deterministically testable without network.\n\n## What kind of change is this?\n\nBug fixes (non-breaking change which fixes an issue).\n\n## Why are we doing this? Any context or related work?\n\n`develop-full` has a standing zero-success streak where this HTTP 429 is one of the reproducible roots at the current head (the other, the Zero-Key fixture network removal, is owned by #30490). Rate-limit answers to anonymous shared-egress requests are transient by nature; a bounded second chance is the proportional control and does not mask a real outage. A cross-job artifact cache was considered and deliberately left out of scope — retry alone addresses the observed failure class; caching is a separate, larger workflow change if the nightly still trips after this lands.\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/app-core/scripts/ensure-fused-inference-install.test.mjs` — the four new `node:test` cases at the bottom run in the package's `test:script-suites` lan sults queued behind slow durable `onEvent` delivery\n- add a real child-process regression that emits an event followed by a terminal result while `onEvent` takes 1,100 ms\n\nCloses #30518\n\n## Root cause\n\n`runSmithersWorkflow` serialized stdout protocol lines through `lineProcessing`, and event lines awaited `onEvent`. After the worker exited, the parent raced that queue against `WORKER_STDIO_DRAIN_GRACE_MS` (1 second). A supported persistence/listener delay longer than that grace allowed result evaluation to run before the following terminal-result line had been consumed, producing `SMTHRS_RESULT_MISSING` for a successful worker.\n\nThe worker's exit already aborts protocol-owned model generation, and the existing process/pipe teardown grace still destroys inherited descriptors. After that teardown, the remaining queued work is ordered event delivery, which is part of the run contract and must finish before the terminal result is evaluated.\n\n## Exact head / base\n\n- Base: `elizaOS/eliza:develop`\n- Head: `hankbobtheresearchoor:fix/workflow-preserve-result-after-slow-event`\n- Head SHA: `de084256fa72c2ec7cf181986e17f59653d8182a`\n\n## Verification\n\n| Evidence | Command | Result |\n| --- | --- | --- |\n| Regression RED on unfixed runtime | Temporarily restore `plugins/plugin-workflow/src/services/smithers-runtime.ts` from `origin/develop`, then run `/Users/inference2/.bun/bin/bun test --isolate plugins/plugin-workflow/__tests__/unit/smithers-worker-lifecycle.test.ts` | Expected failure reproduced: **9 pass, 1 fail**; new test failed with `SMTHRS_RESULT_MISSING`. Fixed file restored with matching SHA-256. |\n| Focused lifecycle suite | `/Users/inference2/.bun/bin/bun test --isolate plugins/plugin-workflow/__tests__/unit/smithers-worker-lifecycle.test.ts` | **10 pass, 0 fail**. |\n| Package unit suite | `/Users/inference2/.bun/bin/bun run --cwd plugins/plugin-workflow test:unit` | **100 pass, 0 fail** across 14 files. |\n| Canonical package test | `/Users/infe
