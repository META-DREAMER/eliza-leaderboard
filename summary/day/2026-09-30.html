nder itself was created and dispatched: the scenario's `assertCloudReadback` guard was never reached because the fixture-consumption check fails first, and the `scenario-report.json` shows `OWNER_REMINDERS_CREATE` with `cadence.kind: \"once\"`, `metadata.ownerSurface: \"OWNER_REMINDERS\"`, one `in_app` plan step.\n\n## Cause\n\n`packages/cloud/e2e/scenarios/cloud-stability-agent.scenario.ts` declares two required `TEXT_SMALL` fixtures for the dispatch path:\n\n- `cloud-reminder-dispatch-body` (matches `Current reminder:\\n- title: Review the synthetic Cloud inbox`, cardinality 1)\n- `cloud-reminder-dispatch-title` (matches `Message body:\\nTime to review the synthetic Cloud inbox.`, cardinality 1)\n\nSince `51bd56787c` (fix(reminders): deliver grounded one-shot content without prose rewriting, via #32931 merged as `6d13e67446`), `RemindersService` no longer calls the model for exactly this reminder shape. In `plugins/plugin-personal-assistant/src/lifeops/domains/reminders-service.ts` the `exactReminder` branch (owner occurrence, `in_app`, lifecycle `plan`, `cadence.kind === \"once\"`, `metadata.ownerSurface === \"OWNER_REMINDERS\"`, no `bodyOverride`) builds the body with `buildReminderBody` (`Reminder: \u003ctitle\u003e\\nDue: \u003clocal time\u003e`) and issues a `ReminderPresentation` whose title is the literal `Reminder`; `renderReminderBody` and `renderOwnerNotificationTitle` are only reached on the non-exact path. The scenario's reminder satisfies every `exactReminder` condition, so neither `TEXT_SMALL` call happens and the two required fixtures stay at `consumed: 0`.\n\nThe readback assertion itself still holds with the grounded body (`notification.body.includes(\"synthetic Cloud inbox\")` matches `Reminder: Review the synthetic Cloud inbox`).\n\n## Fix\n\nRemove the two dead fixtures from the deterministic scenario (they encode the pre-`51bd56787c` prose-rewriting contract), leaving the readback assertion to pin the grounded dispatch. Only the deterministic lane is affected; `stability:real` uses the same scenario without fixtures.\n\nI am opening a PR for this.\n"])</script><script>self.__next_f.push([1,"15:T14aa,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`drainCutoverHolds` (`packages/cloud/services/gateway-webhook/src/cutover-hold.ts`) fences record removal to the current lease owner: the Lua step at `:255-258` refuses to delete the hold record when a *different* token owns the lease. That fence is correct while the other owner is alive. It leaves a gap when the other owner dies:\n\n1. Drainer A acquires the lease and starts redelivering a held Blooio or Twilio turn.\n2. A's renewal fails for a whole lease period, the lease lapses, and replica B acquires it (`set nx`). B then dies before draining.\n3. A's turn completes. The dedup ledger is written `delivered`, but A's `removeHeldRecord()` returns 0 because B's token owns the lease, so the record and its index entry stay.\n4. B's lease lapses. The next drainer acquires the lease, finds a live record, and calls `redeliver` without looking at the ledger. The Cloud turn runs again and the provider receives a second send.\n\nThis is the \"P2\" probe from the review of #32909 and the case #32944 left out of scope. #32944 fixed the sibling case where the lease lapsed with *no* new owner; this one needs the drainer to notice that the ledger has already left `held`.\n\n**To Reproduce**\n\nThe real `handleWebhook` and `drainCutoverHolds` against the local `Bun.serve` Cloud stub and in-memory Redis used by `__tests__/cutover-hold.test.ts` (Bun 1.3.14, Node 24.15.0, `--conditions=eliza-source`). A signed Blooio webhook is held during a `503 personal_cutover_in_progress`. Cloud is then attested, and while the attested turn runs the lease key is overwritten with another replica's token. After the first drain the lease is deleted (the other replica died and its lease lapsed) and a second drain runs.\n\nOn `190d8a3304` (#32944's head) the second drain redelivers:\n\n```\n$ bun test --conditions=eliza-source __tests__/cutover-hold.test.ts -t \"another replica owned the lease\"\n534 |     expect(second).toEqual({\nerror: expect(received).toEqual(expected)\n-   \"delivered\": 0,\n+   \"delivered\": 1,\n(fail) connector ingress during Shared→Dedicated cutover \u003e a hold settled while another replica owned the lease is not redelivered once that lease lapses\n 0 pass\n 1 fail\n```\n\nGateway log for the message (timestamps and trace ids omitted): the turn completes twice and the provider egress runs twice.\n\n```\n{\"level\":\"warn\",\"message\":\"Personal connector turn held for Dedicated cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"holdCode\":\"personal_cutover_in_progress\"}\n{\"level\":\"info\",\"message\":\"Personal Eliza connector message completed\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"cloudAttempts\":1,\"egressMs\":2,\"totalMs\":3}\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"attempts\":1}\n{\"level\":\"info\",\"message\":\"Personal Eliza connector message completed\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"cloudAttempts\":1,\"egressMs\":1,\"totalMs\":4}\n```\n\n**Expected behavior**\n\nA drainer that acquires the lease over a record whose dedup ledger is no longer `held` does not redeliver. It removes the record under the same owner fence and moves on. The turn above runs once and the provider receives one send.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - server-side gateway queue behaviour with no rendered surface; the test transcript and gateway log above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: gateway log above; N/A for frontend (no UI).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model call; the Cloud route is a local stub.\n- [x] Domain artifacts when relevant: the drain statistics and the `delivered` ledger with a surviving record, in the transcript.\n\n**Additional context**\n\nThe remaining unguarded window is two live drainers running the same turn concurrently, which happens only if renewal fails and a second replica acquires the lease while the first turn is still in flight. Lease renewal (`renewLeaseWhileRedelivering`) exists to prevent that, and the ledger check below cannot see it because the ledger stays `held` until a turn settles.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-fable-5-1\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-fable-5-1\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"16:T24f8,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`POST /api/crypto/payments` tells the caller that `10.005` is too large. The service picks the amount error code by searching the validator's message, and since #32915 the validator has a third rejection that the search does not know about.\n\n- `validatePaymentAmount` (`packages/cloud/shared/src/lib/config/crypto.ts:232-254`) rejects in three places. `:236-238` rejects an amount that is not finite or has more than two decimal places, with \"Amount must be a finite USD amount in whole cents\". This check came in with #32915 (`1313e200a8`). `:239-244` rejects an amount below the $5 minimum, and `:246-251` one above the $1,000 maximum. The result is `{ valid: boolean; error?: string }`, with no machine-readable reason.\n- `CryptoPaymentsService.createPayment` (`packages/cloud/shared/src/lib/services/crypto-payments.ts:316-320`) sets `AMOUNT_TOO_SMALL` when the message contains \"at least\" and `AMOUNT_TOO_LARGE` otherwise. The whole-cents message has no \"at least\", so `10.005`, `NaN` and `Infinity` all become `AMOUNT_TOO_LARGE`. The code union (`:31-43`) has no code for an invalid amount.\n- The route's schema (`packages/cloud/api/crypto/payments/route.ts:29-34`) accepts any number of decimal places (`/^(?:\\d+|\\d+\\.\\d+)$/` or a finite number between 1 and 10,000). So `10.005` reaches the service, and the route maps `AMOUNT_TOO_LARGE` to 400 `{\"error\":\"Amount too large\"}` (`:95`). `NaN` and `Infinity` cannot arrive in JSON; they reach the service only from direct callers.\n- Consumers: the route is the only code that maps `CryptoPaymentError` codes (`:88-106`; any unmapped code falls through to a 500 at `:102-105`). The billing UI (`packages/ui/src/cloud/billing/components/billing-tab.tsx:429`) and the `plugin-elizacloud` billing proxy (`plugins/plugin-elizacloud/src/routes/cloud-billing-routes.ts:730-742`) show or pass through the `error` text without switching on codes. The other validator caller, `direct-wallet-payments.ts:1468-1469`, throws the message as a plain `Error`, and its route returns it as a 400 (`packages/cloud/api/crypto/direct-payments/route.ts:80-84`), so that path does not misclassify.\n\nThe repository error policy asks for typed errors and warns against branching on prose. This classification is an example: adding the third rejection message changed the error code without anyone touching the classifier.\n\n**To Reproduce**\n\nI mounted the real `packages/cloud/api/crypto/payments/route.ts` and called the real `cryptoPaymentsService.createPayment` from `packages/cloud/api` on `origin/develop` `4573712ebf`. Only session auth and the rate limiter were stubbed. `OXAPAY_MERCHANT_API_KEY` was set to a local placeholder so that `isOxaPayConfigured()` passes. `oxaPayService.createInvoice` was spied to throw, and it was never called.\n\n\u003cdetails\u003e\u003csummary\u003eProbe (scratch file \u003ccode\u003epackages/cloud/api/__tests__/zz-amount-probe.test.ts\u003c/code\u003e, not committed)\u003c/summary\u003e\n\n```ts\nprocess.env.DATABASE_URL = \"pglite://memory\";\nprocess.env.TEST_DATABASE_URL = \"pglite://memory\";\nprocess.env.NODE_ENV = \"test\";\nprocess.env.OXAPAY_MERCHANT_API_KEY = \"local-probe-placeholder\";\n\nconst organizationId = randomUUID();\nmock.module(\"@/lib/auth/workers-hono-auth\", () =\u003e ({\n  requireUserWithOrg: async () =\u003e ({ id: randomUUID(), organization_id: organizationId }),\n  requireUserOrApiKeyWithOrg: async () =\u003e ({ id: randomUUID(), organization_id: organizationId }),\n}));\nmock.module(\"@/lib/middleware/rate-limit-hono-cloudflare\", () =\u003e ({\n  moneyRateLimit: () =\u003e async (_c: unknown, next: () =\u003e Promise\u003cvoid\u003e) =\u003e next(),\n  rateLimit: () =\u003e async (_c: unknown, next: () =\u003e Promise\u003cvoid\u003e) =\u003e next(),\n  RateLimitPresets: { STRICT: {}, STANDARD: {} },\n}));\nconst { default: route } = await import(\"../crypto/payments/route\");\nconst { cryptoPaymentsService } = await import(\"@/lib/services/crypto-payments\");\nconst { oxaPayService } = await import(\"@/lib/services/oxapay\");\nconst invoice = spyOn(oxaPayService, \"createInvoice\").mockImplementation(async () =\u003e {\n  throw new Error(\"probe: no OxaPay invoice expected\");\n});\n\ntest(\"probe\", async () =\u003e {\n  for (const amount of [\"10.005\", 10.005, \"4.99\", \"1000.01\"]) {\n    const res = await route.request(\"/\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ amount }),\n    });\n    console.log(\"ROUTE\", JSON.stringify({ amount, status: res.status, body: await res.json() }));\n  }\n  for (const amount of [\"10.005\", Number.NaN, Number.POSITIVE_INFINITY, \"4.99\", \"1000.01\"]) {\n    const outcome = await cryptoPaymentsService.createPayment({ organizationId, amount }).then(\n      () =\u003e ({ resolved: true }),\n      (error: { code?: string; message?: string }) =\u003e ({ code: error.code, message: error.message }),\n    );\n    console.log(\"SERVICE\", JSON.stringify({ amount: String(amount), ...outcome }));\n  }\n  console.log(\"OXAPAY_INVOICE_CALLS\", invoice.mock.calls.length);\n  expect(invoice).not.toHaveBeenCalled();\n});\n```\n\n\u003c/details\u003e\n\nFrom `packages/cloud/api` (Bun 1.3.14, Node 24.15.0):\n\n```\n$ bun test --conditions=eliza-source __tests__/zz-amount-probe.test.ts --timeout 60000\nROUTE {\"amount\":\"10.005\",\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nROUTE {\"amount\":10.005,\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nROUTE {\"amount\":\"4.99\",\"status\":400,\"body\":{\"error\":\"Amount too small\"}}\nROUTE {\"amount\":\"1000.01\",\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nSERVICE {\"amount\":\"10.005\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"NaN\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"Infinity\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"4.99\",\"code\":\"AMOUNT_TOO_SMALL\",\"message\":\"Amount must be at least $5\"}\nSERVICE {\"amount\":\"1000.01\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must not exceed $1000\"}\nOXAPAY_INVOICE_CALLS 0\n 1 pass\n 0 fail\n```\n\n\u003cdetails\u003e\u003csummary\u003eRoute log for the \u003ccode\u003e10.005\u003c/code\u003e request (paths shortened)\u003c/summary\u003e\n\n```\n[Crypto Payments API] Create payment error: 315 |\n316 |     if (!validation.valid) {\n317 |       const errorCode = validation.error?.includes(\"at least\")\n318 |         ? \"AMOUNT_TOO_SMALL\"\n319 |         : \"AMOUNT_TOO_LARGE\";\n320 |       throw new CryptoPaymentError(errorCode, validation.error || \"Invalid amount\");\nCryptoPaymentError: Amount must be a finite USD amount in whole cents\n      at createPayment (packages/cloud/shared/src/lib/services/crypto-payments.ts:320:17)\n```\n\n\u003c/details\u003e\n\nA $10.005 request, which is below the $1,000 maximum, is answered \"Amount too large\". The error's own message says the actual problem is whole cents.\n\n**Expected behavior**\n\n- The validator returns a typed reason alongside its message, and the service maps that reason to a code without reading the message.\n- An amount that is not a finite whole-cent value gets its own code, for example `AMOUNT_INVALID`. The route answers 400 with a message that says what is wrong.\n- Below-minimum and above-maximum amounts keep `AMOUNT_TOO_SMALL` and `AMOUNT_TOO_LARGE`, with their current messages and 400 responses.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - API error classification with no rendered surface of its own. The UI only shows the route's `error` text in a toast. The route and service transcript above is the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface of its own; see the route and service transcript.\n- [x] Backend logs and frontend console/network logs when relevant: route log above; N/A for frontend (the UI does not branch on the code).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved.\n- [x] Domain artifacts when relevant: the HTTP status and body for each amount, and the `CryptoPaymentError` code and message from the real service, both in the transcript above.\n\n**Additional context**\n\n- The route's schema bounds (`route.ts:33-34`, $1 to $10,000) are looser than the service's limits ($5 to $1,000, `ORGANIZATION_CREDIT_CHECKOUT_LIMITS`). The service enforces the real bounds, so this report does not change them.\n- Because JSON cannot carry `NaN` or `Infinity`, the HTTP-reachable case is an amount with more than two decimal places. The same misclassification applies to any direct caller of `createPayment`.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"17:T2634,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nTwo replay defects remain in the durable connector hold after #32909 (head `bc812ab321`). Both are in `packages/cloud/services/gateway-webhook`, and both only affect Blooio and Twilio turns that the gateway has already acknowledged to the provider.\n\n1. **A non-retryable Cloud refusal is retried for the whole hold budget.** `redeliverHeldWebhook` re-holds every `PersonalSharedPreEgressError` (`src/webhook-handler.ts:949-956`). That includes failures that Cloud itself classified as `retryable: false`: a 4xx, or `X-Eliza-Retryable: false`, as read by `readPersonalSharedFailureMetadata` (`packages/cloud/services/_common/src/personal-shared-failure.ts:100-102`, `:127-132`). The refused turn is sent to Cloud again on every drain for `CUTOVER_HOLD_MAX_MS` (one hour). It is then logged as `Held personal connector turn exceeded the cutover budget`, with the stale `holdCode: personal_cutover_in_progress` and the operator action \"inspect the Dedicated target's attestation\". A first-delivery failure of the same kind is settled at once by `settleBackgroundDeliveryFailure`.\n2. **A delivered hold is replayed after its lease lapses.** `drainCutoverHolds` removes a settled record only while the lease still holds this drainer's token (`src/cutover-hold.ts:250`). Suppose renewal fails for a whole lease period and no other replica takes the lease. The turn is delivered and the ledger says `delivered`, but the record and its index entry stay. The next drain runs the Cloud turn and the provider send a second time.\n\n**To Reproduce**\n\nI ran the real handler and drainer (`handleWebhook`, `drainCutoverHolds`, `redeliverHeldWebhook`, `releaseExpiredHeldWebhook`) against a local `Bun.serve` stub of the Cloud personal-shared route and the in-memory Redis adapter (`MOCK_REDIS=1`, ioredis-mock). Only the Blooio provider API is substituted. The probe drives the same setup that `__tests__/cutover-hold.test.ts` uses. A signed Blooio webhook arrives while Cloud answers `503 personal_cutover_in_progress`, so the turn is held and the ledger is `held`. Then:\n\n- P2b: Cloud is attested. While the attested turn runs, the lease key is deleted (it expired with no new owner). The probe runs one drain, then a second drain.\n- P3: Cloud starts answering `400 {\"code\":\"invalid_request\"}` (`retryable: false`). The probe runs one drain at `now + 60s`, then a drain after the hold budget (`now + CUTOVER_HOLD_MAX_MS + 120s`).\n\n\u003cdetails\u003e\u003csummary\u003eProbe P2b and P3 (added to \u003ccode\u003e__tests__/\u003c/code\u003e of a checkout at \u003ccode\u003ebc812ab321\u003c/code\u003e)\u003c/summary\u003e\n\n`startCloud`, `holdOne`, `drainHandlers` and `providerSends` are the same helpers as in `__tests__/cutover-hold.test.ts`. `holdOne` sends one signed Blooio webhook and waits for the `held` ledger. The Cloud stub's `permanentStatus` returns that status with `{\"success\":false,\"code\":\"invalid_request\"}`.\n\n```ts\ntest(\"P2b a delivered outcome whose lease simply expired (no replacement) is replayed\", async () =\u003e {\n  const cloud = startCloud();\n  const redis = await holdOne(cloud, \"msg_probe_p2b\");\n  const dedupKey = \"webhook:blooio:msg_probe_p2b\";\n  const leaseKey = `webhook:cutover-hold-lease:${dedupKey}`;\n  const heldTurns = cloud.turns.length;\n  cloud.state.attested = true;\n  cloud.state.onAttestedTurn = async () =\u003e {\n    await redis.del(leaseKey);\n  };\n  const first = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 60_000 });\n  const ledgerAfterFirst = await redis.get(dedupKey);\n  cloud.state.onAttestedTurn = undefined;\n  const second = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 120_000 });\n  console.log(\"P2b\", JSON.stringify({ first, ledgerAfterFirst, second, turns: cloud.turns.length - heldTurns, sends: providerSends.length }));\n}, 60_000);\n\ntest(\"P3 a permanent non-hold Cloud 400 is retried until the hour budget, then released\", async () =\u003e {\n  const cloud = startCloud();\n  const redis = await holdOne(cloud, \"msg_probe_p3\");\n  const dedupKey = \"webhook:blooio:msg_probe_p3\";\n  cloud.state.permanentStatus = 400;\n  const retry = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 60_000 });\n  const ledgerAfterRetry = await redis.get(dedupKey);\n  const expired = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + CUTOVER_HOLD_MAX_MS + 120_000 });\n  const ledgerAfterExpiry = await redis.get(dedupKey);\n  console.log(\"P3\", JSON.stringify({ retry, ledgerAfterRetry, expired, ledgerAfterExpiry, sends: providerSends.length }));\n}, 60_000);\n```\n\n\u003c/details\u003e\n\nFrom `packages/cloud/services/gateway-webhook` (Bun 1.3.14, Node 24.15.0):\n\n```\n$ bun test --conditions=eliza-source __tests__/zz-review-probe.test.ts\nP2b {\"first\":{\"delivered\":0,\"rescheduled\":0,\"released\":0,\"expired\":0},\"ledgerAfterFirst\":\"delivered\",\"second\":{\"delivered\":1,\"rescheduled\":0,\"released\":0,\"expired\":0},\"turns\":2,\"sends\":2}\nP3 {\"retry\":{\"delivered\":0,\"rescheduled\":1,\"released\":0,\"expired\":0},\"ledgerAfterRetry\":\"held\",\"expired\":{\"delivered\":0,\"rescheduled\":0,\"released\":0,\"expired\":1},\"ledgerAfterExpiry\":null,\"sends\":0}\n 4 pass\n 0 fail\nRan 4 tests across 1 file. [9.48s]\n```\n\n\u003cdetails\u003e\u003csummary\u003eGateway logs for the two probes (abridged to the lines that matter)\u003c/summary\u003e\n\n```\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p2b\",\"heldForMs\":7,\"attempts\":1}\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p2b\",\"heldForMs\":11,\"attempts\":1}\n{\"level\":\"warn\",\"message\":\"Personal Shared Cloud attempt failed\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\",\"attempt\":1,\"status\":400,\"retryable\":false}\n{\"level\":\"error\",\"message\":\"Held personal connector turn exceeded the cutover budget\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\",\"holdCode\":\"personal_cutover_in_progress\",\"operatorAction\":\"inspect the Dedicated target's attestation; the turn was never executed\"}\n{\"level\":\"error\",\"message\":\"Background message processing failed\",\"error\":\"cutover hold expired\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\"}\n```\n\n\u003c/details\u003e\n\nP2b reports the same turn as delivered twice, with two Cloud turns and two provider sends. The first drain reports `delivered: 0`, although the ledger already reads `delivered`. P3 reschedules the refused turn instead of releasing it, and settles it only through the expiry path.\n\n**Expected behavior**\n\n- A redelivery that Cloud refuses with a non-retryable classification is settled at once, the same way the first background delivery settles it. `settleBackgroundDeliveryFailure` logs the failure at error level. Because no provider egress happened, it also reopens the dedup key. The drain reports `released: 1`, and later drains do nothing. Cutover holds and failures without a non-retryable classification (transport errors, 5xx) stay held, as #32909 intends.\n- A redelivery whose outcome is settled removes its record unless another replica now owns the lease. A lease that simply lapsed does not keep the record. P2b should give one Cloud turn and one provider send, with the first drain reporting `delivered: 1`.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - server-side gateway queue behaviour with no rendered surface; the probe transcript and gateway logs above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the probe transcript.\n- [x] Backend logs and frontend console/network logs when relevant: gateway logs above; N/A for frontend (no UI).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model call; the Cloud route is a local stub.\n- [x] Domain artifacts when relevant: the Redis ledger values and drain statistics in the probe transcript.\n\n**Additional context**\n\n- The #32909 review notes that the Telegram private no-reply failure (`src/webhook-handler.ts:1703-1705`, `retryable: false`) reaches this path. It does not in practice. Telegram webhooks return inside the Telegram branch (`src/webhook-handler.ts:630-713`) before the hold code (`:773-778`), so only Blooio and Twilio turns are ever held. The reachable cases are Blooio and Twilio turns that Cloud refuses with a 4xx or `X-Eliza-Retryable: false` after a hold.\n- A related case is not covered here. A different replica takes the lease mid-turn and then dies without draining (probe P2 in the #32909 review). The first drainer then correctly declines to remove the record, and it is replayed once that replica's lease lapses. Guarding against it would mean checking the dedup ledger before redelivery. It needs a lease stolen by a live owner, which lease renewal is designed to prevent.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"18:T5f0,"])</script><script>self.__next_f.push([1,"Paired phones could lose a submitted turn when the stream disconnected, reuse an obsolete same-host pairing attempt, or clear a valid credential when Android replayed the connection deep link.\n\nThis change preserves accepted turns across transport disconnects, maintains paired-session authority through completion, persists terminal generation outcomes for reconnect, and binds pairing retries to the server and entered code. Credential persistence can retry without consuming the one-time code again; same-target deep-link replay preserves the paired session. Unpaired disconnected requests retain their cancellation behavior.\n\nValidation at integrated head `d172d7226a8e9b5b63f6eff7cc8a89a2ea8a7f12`: seven UI suites passed 194 tests, integrated agent pairing/readiness/failure-persistence suites passed 13 tests, and changed-file Biome passed. Full `bun run verify` passed 284/284 tasks and all final audits. The renderer build and full app capture passed 218/218 browser tests; all 24 manually flagged images plus desktop/mobile chat were inspected without a visual regression. Packaged OCR verified 208 views, zero broken, with four native-camera exemptions. Current-head hosted run 36630602979 passed all four checks; an additional Source checks rerun in 36628735628 is still running. The earlier renderer timeout is retained as a failed attempt, recovered by the completed renderer build and capture. These are source and browser-fixture results; this revised branch has not been installed on a physical phone.\n\n"])</script><script>self.__next_f.push([1,"19:T740,"])</scri g an approval- or signal-gated workflow could leave it waiting after its worker exited. Restarting a waiting run also replaced displayed event history and reused sequence numbers. In addition, successful HTTP202 control responses entered the client’s agent-resume loop, replaying the POST and eventually showing a misleading startup warning.\n\nThis uses Smithers’ durable subtree cancellation, preserves retained parent events and continues their sequence numbers, and consumes Cancel/Approval/Signal execution receipts without replay. Received terminal output, errors and continuation IDs survive a late abort. Cancelled runs now retain a neutral `cancelled` summary status; failures remain `error`. The existing Run behavior stays unchanged.\n\nValidation: the focused branch on develop passes 135 workflow tests across 17 isolated files, 38 UI/client/editor tests, and full repository verification. Independent review passed for the cancellation repair and incremental client/status changes. The combined candidate passed verification and app build; live QA cancelled the original paused execution, retained history through restart, then completed a second gated run with one Run POST and one Cancel POST, no false warning, no model call, and the correct All-list label. The recorded cancellation HTTP response was 397ms; this is not a general latency guarantee.\n\nApproval and Signal live interactions and model-bearing workflow execution were not part of that live run. If a native terminal result commits before its receipt is emitted, the operation fails explicitly with `WORKFLOW_TERMINAL_RESULT_UNAVAILABLE` and does not rerun the workflow. Native data stays intact. Previously overwritten display entries are retained in the existing archive/native store and are not silently reconstructed. External consumers with exhaustive execution-summary handling should accept the additive `cancelled` value.\n\nCost: cancellation uses one short control child and durable store operations, with no new model call or polling service. Sequence lookup scans retained history. The client correction prevents accepted control POSTs from being replayed.\n"])</script><script>self.__next_f.push([1,"1b:T707,"])</script><script>self.__next_f.push([1,"Task creation extractors could reload full conversation history even after the planner had already reviewed and selected the relevant originals. Reuse that selection only through a process-local binding to the exact request, actor, state, original sources and projection. Current provider constraints and receipts remain intact; absent, forged or changed bindings use the existing full-context path.\n\nThe extractor can request complete original context before proposing an effect. Restoration stays within the existing two-call budget, and mixed restoration/plan output or unresolved output fails without creating a task. Explicit source selection takes precedence over automatic background-history projection.\n\nCost: adds local hashing and rendering, and can avoid the redundant history read on a valid managed path. Restoration can still require the second extraction call. Live token and latency savings are unmeasured; no model defaults or source history storage change.\n\nValidation: 63 focused tests passed (core binding 5, extractor projection 11, existing extractor 27, background history 20). Core build and core/assistant/personal-assistant typechecks passed; six-file Biome and diff checks passed. The personal-assistant check required rebuilding existing cloud-sdk declarations to match this base's source exports. No source workaround or unrelated patch was added. Full branch CI and live acceptance remain pending.\n\nOffline CPU cost: a reconstructed context fixture measured roughly 32–71 ms median combined binding and rendering across its selection cases (20 measured iterations per case after 3 warmups). This is local fixture overhead, not live request latency or measured user-facing savings; reconstructed selections are not evidence of the historic planner's actual selection.\n"])</script><script>self.__next_f.push([1,"1c:T3117,"])</script><script>self.__next_f.push([1,"# Relates to\n\n#32907 (retire creator payouts, owner decision #22957 / #22961) merged with the agent publish path still able to turn creator inference markup back on. That was the first blocking point of [this review](https://github.com/elizaOS/eliza/pull/32907#pullrequestreview-5345258500), and it is unchanged on develop `4573712ebf`:\n\n- Migration 0500 set `monetization_enabled = false` on every agent, and `agentMonetizationService.updateSettings` refuses to set it back (`agent-monetization.ts:408`).\n- `POST /api/v1/agents/:agentId/publish` still accepts `enableMonetization` and `markupPercentage` up to 1000 (`publish/route.ts:25-26`). `userCharactersRepository.publish` writes both straight to `user_characters` (`characters.ts:752-753`).\n- The early `is_public` return means an owner only has to `DELETE` (unpublish) and then `POST` `{ enableMonetization: true, markupPercentage: 1000 }` to re-enable it.\n- A2A (`a2a/route.ts:433-437`, `:531-538`) and MCP (`mcp/route.ts:482-485`, `:589-596`) reserve and settle `base + markup` whenever the stored flag is set. The creator step then calls `recordCreatorEarnings`, which throws `CreatorMonetizationRetiredError` for any positive amount (`agent-monetization.ts:235`). That happens inside a settlement task whose `.catch` only logs \"Deferred settlement failed\".\n\n**Result:** the calling org pays up to 11× the inference cost, the surcharge accrues to nobody, and the retirement statement in migration 0500 no longer holds.\n\n# Change\n\n**Fence the write** (the only writer that could set the flag):\n\n- `publish/route.ts` throws `CreatorMonetizationRetiredError(\"agent_inference_markup\")` (410 `creator_monetization_retired`) when the request asks for the markup: `enableMonetization` set, or a positive `markupPercentage`.\n  - The check reads the raw request before validation, s \n\u003cli\u003eFixed focus targets removed or disabled by \u003ccode\u003eblur\u003c/code\u003e listeners becoming active, and text selections made by focus and blur listeners being overwritten. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003eelement.focus()\u003c/code\u003e incorrectly focusing disabled form controls and \u003ccode\u003e\u0026lt;input type=\u0026quot;hidden\u0026quot;\u0026gt;\u003c/code\u003e elements with \u003ccode\u003etabindex=\u0026quot;\u0026quot;\u003c/code\u003e. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed invalid \u003ccode\u003estyle.setProperty()\u003c/code\u003e calls changing existing \u003ccode\u003e!important\u003c/code\u003e priorities, serialized styles, or mutation records. (\u003ca href=\"https://github.com/FedgeNo\"\u003e\u003ccode\u003e@​FedgeNo\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003e!important\u003c/code\u003e handling when updating CSS longhands after shorthands, using variables or CSS-wide keywords, and assigning style properties directly. (\u003ca href=\"https://github.com/FedgeNo\"\u003e\u003ccode\u003e@​FedgeNo\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003e\u0026lt;noscript\u0026gt;\u003c/code\u003e parsing with \u003ccode\u003eincludeNodeLocations: true\u003c/code\u003e or inside frames to honor the \u003ccode\u003erunScripts\u003c/code\u003e option.\u003c/li\u003e\n\u003cli\u003eFixed the \u003ccode\u003estorageQuota\u003c/code\u003e option being ignored by frames.\u003c/li\u003e\n\u003cli\u003eFixed encoding detection of HTML and XML byte input to honor XML encoding declarations and detect UTF-16 without a byte order mark.\u003c/li\u003e\n\u003cli\u003eFixed exceptions caused by truncated \u003ccode\u003echarset\u003c/code\u003e parameters in \u003ccode\u003e\u0026lt;meta\u0026gt;\u003c/code\u003e elements, and encoding detection incorrectly using incomplete \u003ccode\u003e\u0026lt;meta\u0026gt;\u003c/code\u003e tags. (\u003ca href=\"https://github.com/FedgeNo\"\u003e\u003ccode\u003e@​FedgeNo\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed XML serialization errors for namespaces named \u003ccode\u003econstructor\u003c/code\u003e, \u003ccode\u003etoString\u003c/code\u003e, \u003ccode\u003e__proto__\u003c/code\u003e, or \u003ccode\u003e\u0026quot;null\u0026quot;\u003c/code\u003e, and incorrect reuse of namespace prefixes declared on sibling elements.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003eelement.innerHTML\u003c/code\u003e and \u003ccode\u003eelement.outerHTML\u003c/code\u003e in XML documents to reject invalid characters in attribute values and avoid stack overflows on large strings.\u003c/li\u003e\n\u003cli\u003eFixed selector matching for \u003ccode\u003e:lang()\u003c/code\u003e, \u003ccode\u003e:nth-child(... of ...)\u003c/code\u003e after mutations, and \u003ccode\u003e:has()\u003c/code\u003e with duplicate IDs or nested logical pseudo-classes. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev30.1.0\u003c/h2\u003e\n\u003cp\u003ejsdom is feeling the AGI!\u003c/p\u003e\n\u003cp\u003eThis release is dedicated to \u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, who unleashed \u003ca href=\"https://github.com/codex\"\u003e\u003ccode\u003e@​codex\u003c/code\u003e\u003c/a\u003e upon jsdom and found tons of performance improvements. Along the way, he found and fixed many correctness issues as well.\u003c/p\u003e\n\u003cp\u003eWe really appreciate his thoughtful PRs, which did a great job following the project's contribution guidelines, and were clearly human-curated, with their PR descriptions edited to be brief and respectful of the maintainers' time.\u003c/p\u003e\n\u003cp\u003eThanks to \u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, as well as all the other contributors of this release (most of whom were AI-assisted).\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAdded named access to elements on \u003ccode\u003edocument\u003c/code\u003e, such as \u003ccode\u003edocument.myForm\u003c/code\u003e for \u003ccode\u003e\u0026lt;form name=\u0026quot;myForm\u0026quot;\u0026gt;\u003c/code\u003e. (\u003ca href=\"https://github.com/vojtisprime11\"\u003e\u003ccode\u003e@​vojtisprime11\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003eQuotaExceededError\u003c/code\u003e, including its use for storage quota errors and oversized \u003ccode\u003ecrypto.getRandomValues()\u003c/code\u003e requests.\u003c/li\u003e\n\u003cli\u003eAdded support for the relaxed DOM naming rules when creating elements, attributes, and document types.\u003c/li\u003e\n\u003cli\u003eImproved performance of DOM construction, tree mutations, range operations, and live collection access, especially on large documents. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://github.com/erezrokah\"\u003e\u003ccode\u003e@​erezrokah\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eImproved performance of \u003ccode\u003egetComputedStyle()\u003c/code\u003e, style changes, and CSS serialization. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://github.com/jhult\"\u003e\u003ccode\u003e@​jhult\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eImproved performance of event dispatch, form control and label lookups, and updates to \u003ccode\u003e\u0026lt;select\u0026gt;\u003c/code\u003e elements and radio button groups. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eReduced memory use when creating and working with DOM nodes, attributes, event listeners, and mutation observers. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eChanged \u003ccode\u003ewindow.close()\u003c/code\u003e to preserve access to the document and its DOM through retained references.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003eelement.querySelectorAll()\u003c/code\u003e returning no matches when the first part of the selector matches the element itself, which regressed in v30.0.0. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed case sensitivity in CSS attribute selectors, including selectors matching \u003ccode\u003edata-state=\u0026quot;\u0026quot;\u003c/code\u003e, \u003ccode\u003etitle=\u0026quot;\u0026quot;\u003c/code\u003e, and other case-sensitive values. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003edocument.querySelector()\u003c/code\u003e failing to find a matching element when an earlier element has the same ID but does not match the rest of the selector. (\u003ca href=\"https://github.com/vojtisprime11\"\u003e\u003ccode\u003e@​vojtisprime11\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003e:focus\u003c/code\u003e matching in shadow trees. (\u003ca href=\"https://github.com/asamuzaK\"\u003e\u003ccode\u003e@​asamuzaK\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed DOM insertion and replacement, including valid \u003ccode\u003edocument.replaceChildren()\u003c/code\u003e calls, invalid document element and doctype placements, and mutations during \u003ccode\u003eelement.replaceWith()\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eFixed the ordering of script execution, custom element callbacks, iframe loading, and mutation observer notifications during DOM insertion, including in shadow trees.\u003c/li\u003e\n\u003cli\u003eFixed queued events and navigation continuing after \u003ccode\u003ewindow.close()\u003c/code\u003e or iframe removal, and prevented new scripts, resource loads, timers, and animation frames from starting in destroyed documents. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed parent documents waiting indefinitely for loading to finish when a child iframe removes itself during loading.\u003c/li\u003e\n\u003cli\u003eFixed request cancellation across redirects, during pending \u003ccode\u003erequestInterceptor()\u003c/code\u003e callbacks, and when reusing an \u003ccode\u003eXMLHttpRequest\u003c/code\u003e after aborting it.\u003c/li\u003e\n\u003cli\u003eFixed resource loading and \u003ccode\u003eJSDOM.fromURL()\u003c/code\u003e potentially hanging when response handling throws and response stream cleanup does not finish.\u003c/li\u003e\n\u003cli\u003eFixed successful cached resource loads being treated as aborted.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e and \u003ccode\u003edocument.styleSheets\u003c/code\u003e using the wrong stylesheet order after inserting or updating \u003ccode\u003e\u0026lt;style\u0026gt;\u003c/code\u003e elements.\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e ignoring nested \u003ccode\u003e@import\u003c/code\u003e and \u003ccode\u003e@media\u003c/code\u003e rules in imported stylesheets, and returning stale results after imports finish loading.\u003c/li\u003e\n\u003cli\u003eFixed style invalidation, stylesheet removal, and frame source updates in shadow trees.\u003c/li\u003e\n\u003cli\u003eFixed repeated \u003ccode\u003egetComputedStyle()\u003c/code\u003e calls changing case-sensitive background URLs, and inconsistent resolution of border shorthands containing system colors. (\u003ca href=\"https://github.com/scttcper\"\u003e\u003ccode\u003e@​scttcper\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed computed border widths, including borderless elements incorrectly reporting \u003ccode\u003e16px\u003c/code\u003e, which regressed in v30.0.0. (\u003ca href=\"https://github.com/Alberto-BaseNet\"\u003e\u003ccode\u003e@​Alberto-BaseNet\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e to resolve \u003ccode\u003e'font-weight'\u003c/code\u003e keywords to numeric values. (\u003ca href=\"https://github.com/tianrking\"\u003e\u003ccode\u003e@​tianrking\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetComputedStyle()\u003c/code\u003e to convert lengths to pixels inside CSS math functions containing percentages, and to resolve percentages in \u003ccode\u003e'font-size'\u003c/code\u003e math functions. (\u003ca href=\"https://github.com/soroushm\"\u003e\u003ccode\u003e@​soroushm\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/0a117f4581b067800fdb3287e22e7cec82221a3c\"\u003e\u003ccode\u003e0a117f4\u003c/code\u003e\u003c/a\u003e 30.1.1\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/103f67df7bb94971e111902e6b10bb500d7818a2\"\u003e\u003ccode\u003e103f67d\u003c/code\u003e\u003c/a\u003e Remove unnecessary window cleanup from API tests\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/jsdom/jsdom/commit/cdda00a1c 3c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e3.9.9\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eMarkdown: Fix text with \u003ccode\u003e$\u003c/code\u003e been incorrectly parsed as math syntax (\u003ca href=\"https://redirect.github.com/prettier/prettier/pull/20140\"\u003e#20140\u003c/a\u003e by \u003ca href=\"https://github.com/fisker\"\u003e\u003ccode\u003e@​fisker\u003c/code\u003e\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🔗 \u003ca href=\"https://github.com/prettier/prettier/blob/3.9.9/CHANGELOG.md#399\"\u003eChangelog\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/prettier/prettier/blob/main/CHANGELOG.md\"\u003eprettier's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e3.9.9\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/prettier/prettier/compare/3.9.8...3.9.9\"\u003ediff\u003c/a\u003e\u003c/p\u003e\n\u003ch4\u003eMarkdown: Fix text with \u003ccode\u003e$\u003c/code\u003e been incorrectly parsed as math syntax (\u003ca href=\"https://redirect.github.com/prettier/prettier/pull/20140\"\u003e#20140\u003c/a\u003e by \u003ca href=\"https://github.com/fisker\"\u003e\u003ccode\u003e@​fisker\u003c/code\u003e\u003c/a\u003e)\u003c/h4\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003cpre lang=\"md\"\u003e\u003ccode\u003e\u0026lt;!-- Input --\u0026gt;\n**Uses $FOO** from `a.sh` and `b.sh`, plus `$BAR` from `c.sh`, before anything else runs here.\n\u003cp\u003e\u0026lt;!-- Prettier 3.9.8 --\u0026gt;\u003cbr /\u003e\n\u003cstrong\u003eUses $FOO\u003c/strong\u003e from \u003ccode\u003ea.sh\u003c/code\u003e and \u003ccode\u003eb.sh\u003c/code\u003e, plus \u003ccode\u003e$BAR\u003c/code\u003efrom\u003ccode\u003ec.sh\u003c/code\u003e, before anything else runs here.\u003c/p\u003e\n\u003cp\u003e\u0026lt;!-- Prettier 3.9.9 --\u0026gt;\u003cbr /\u003e\n\u003cstrong\u003eUses $FOO\u003c/strong\u003e from \u003ccode\u003ea.sh\u003c/code\u003e and \u003ccode\u003eb.sh\u003c/code\u003e, plus \u003ccode\u003e$BAR\u003c/code\u003e from \u003ccode\u003ec.sh\u003c/code\u003e, before anything else runs here.\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/cdd17f2288b28b170a76416c72dac56e3ea5daff\"\u003e\u003ccode\u003ecdd17f2\u003c/code\u003e\u003c/a\u003e Release 3.9.9\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/dc7b8968e678f51ea00e2be3fe8c717d114691a3\"\u003e\u003ccode\u003edc7b896\u003c/code\u003e\u003c/a\u003e Disable \u003ccode\u003esingleDollarTextMath\u003c/code\u003e in \u003ccode\u003emdast-util-math\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/prettier/prettier/issues/20140\"\u003e#20140\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/f9be58fb8ec62dd47197ea19a30aac5ad26dfee0\"\u003e\u003ccode\u003ef9be58f\u003c/code\u003e\u003c/a\u003e Git blame ignore 3.9.8\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/88470cb79ca3b757dd6b93906d9a992aa1a456c3\"\u003e\u003ccode\u003e88470cb\u003c/code\u003e\u003c/a\u003e Bump Prettier dependency to 3.9.8\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/9559cab39eb5082c99a27e8829760c055adba841\"\u003e\u003ccode\u003e9559cab\u003c/code\u003e\u003c/a\u003e Clean changelog_unreleased\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/prettier/prettier/commit/4fc8ee87465de8d54780273a6996d74e8e9da827\"\u003e\u003ccode\u003e4fc8ee8\u003c/code\u003e\u003c/a\u003e Update dependents count\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/prettier/prettier/compare/3.9.8...3.9.9\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `postal-mime` from 3.0.0 to 4.0.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/postalsys/postal-mime/releases\"\u003epostal-mime's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.0.0\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/compare/v3.0.1...v4.0.0\"\u003e4.0.0\u003c/a\u003e (2026-09-26)\u003c/h2\u003e\n\u003ch3\u003e⚠ BREAKING CHANGES\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eNode.js 20 or newer is required.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAttachment.disposition\u003c/code\u003e is typed as \u003ccode\u003eAttachmentDisposition | null\u003c/code\u003e, which accepts any Content-Disposition token, instead of \u003ccode\u003e'attachment' | 'inline' | null\u003c/code\u003e. The parsed output is unchanged, but code that assigns the value to the narrower type has to widen it.\u003c/li\u003e\n\u003cli\u003ethe ES module entry point moved from src/postal-mime.js to dist/esm/postal-mime.js, so browser code that imported the file from node_modules directly has to use the new path. Consumers that import \u003ccode\u003epostal-mime\u003c/code\u003e by name are unaffected.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eFeatures\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003econvert to TypeScript and ship ES module and CommonJS builds (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/2559c820af2553d9166af586868ec636ea69e820\"\u003e2559c82\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003edeclare the CommonJS entry point with export = and ship source maps (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/84d11596d8fcf667de7805c1e46a98d7734786b1\"\u003e84d1159\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003etype the attachment disposition as the token the message carries (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/4bb27965cb1c39981d1571c082b353085288df6c\"\u003e4bb2796\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ekeep the public object types assignable to an index signature (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/336303952f3862f4397f58abf7f586de659f93d3\"\u003e3363039\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eMiscellaneous Chores\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003erequire Node.js 20 or newer (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/21eaae6553102e955c7de01f74a0deb7022d5990\"\u003e21eaae6\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev3.0.1\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/compare/v3.0.0...v3.0.1\"\u003e3.0.1\u003c/a\u003e (2026-09-25)\u003c/h2\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ecollect parsed addresses in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/68cd065f92c2cb64227b91cab7ba1409d89b9824\"\u003e68cd065\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003econvert html to text in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/38b2a839ca1f83bf570f7628375c1330f4495aef\"\u003e38b2a83\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003edetect angle bracket addresses in decoded words in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/390be2b4395ff46458ff7b8bf3d148d1e0997e0e\"\u003e390be2b\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003enormalize calendar attachment line endings in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/36edda70629074622a6b8d1529b2366ff2cfa71d\"\u003e36edda7\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003estrip header comments in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/5d877da9b700059f14318251083d62c9dd116c5a\"\u003e5d877da\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003etrim header whitespace in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/932441fc984b0c86804d55e504d5cd11c290b763\"\u003e932441f\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003etrim text around an extracted address in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/511a19482dca01c1225d2bc01ea33409ba9233ad\"\u003e511a194\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eunfold format=flowed text in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/237c7a98debf1bf9308e40b54a6d6662aba5cdf6\"\u003e237c7a9\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePerformance Improvements\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eskip decoder construction for charset labels TextDecoder cannot know (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/5407771692d0b989e9109a9edb3d1d33df62cd64\"\u003e5407771\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/postalsys/postal-mime/blob/master/CHANGELOG.md\"\u003epostal-mime's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/compare/v3.0.1...v4.0.0\"\u003e4.0.0\u003c/a\u003e (2026-09-26)\u003c/h2\u003e\n\u003ch3\u003e⚠ BREAKING CHANGES\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eNode.js 20 or newer is required.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAttachment.disposition\u003c/code\u003e is typed as \u003ccode\u003eAttachmentDisposition | null\u003c/code\u003e, which accepts any Content-Disposition token, instead of \u003ccode\u003e'attachment' | 'inline' | null\u003c/code\u003e. The parsed output is unchanged, but code that assigns the value to the narrower type has to widen it.\u003c/li\u003e\n\u003cli\u003ethe ES module entry point moved from src/postal-mime.js to dist/esm/postal-mime.js, so browser code that imported the file from node_modules directly has to use the new path. Consumers that import \u003ccode\u003epostal-mime\u003c/code\u003e by name are unaffected.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eFeatures\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003econvert to TypeScript and ship ES module and CommonJS builds (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/2559c820af2553d9166af586868ec636ea69e820\"\u003e2559c82\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003edeclare the CommonJS entry point with export = and ship source maps (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/84d11596d8fcf667de7805c1e46a98d7734786b1\"\u003e84d1159\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003etype the attachment disposition as the token the u003ca href=\"https://github.com/postalsys/postal-mime/commit/36edda70629074622a6b8d1529b2366ff2cfa71d\"\u003e36edda7\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003estrip header comments in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/5d877da9b700059f14318251083d62c9dd116c5a\"\u003e5d877da\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003etrim header whitespace in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/932441fc984b0c86804d55e504d5cd11c290b763\"\u003e932441f\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003etrim text around an extracted address in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/511a19482dca01c1225d2bc01ea33409ba9233ad\"\u003e511a194\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eunfold format=flowed text in linear time (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/237c7a98debf1bf9308e40b54a6d6662aba5cdf6\"\u003e237c7a9\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePerformance Improvements\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eskip decoder construction for charset labels TextDecoder cannot know (\u003ca href=\"https://github.com/postalsys/postal-mime/commit/5407771692d0b989e9109a9edb3d1d33df62cd64\"\u003e5407771\u003c/a\u003e), closes \u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/97\"\u003e#97\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/7800715106de7aebd7c6ac731b3bbf7c1d2c33e8\"\u003e\u003ccode\u003e7800715\u003c/code\u003e\u003c/a\u003e chore(master): release 4.0.0 (\u003ca href=\"https://redirect.github.com/postalsys/postal-mime/issues/99\"\u003e#99\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/ec42302b69eab79f50d2962bf2274039f43c6839\"\u003e\u003ccode\u003eec42302\u003c/code\u003e\u003c/a\u003e chore: update dependencies\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/408f345f21d409c3fd65f75564da85a7ae6a10f9\"\u003e\u003ccode\u003e408f345\u003c/code\u003e\u003c/a\u003e docs: describe the 4.0 upgrade path\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/21eaae6553102e955c7de01f74a0deb7022d5990\"\u003e\u003ccode\u003e21eaae6\u003c/code\u003e\u003c/a\u003e chore!: require Node.js 20 or newer\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/84d11596d8fcf667de7805c1e46a98d7734786b1\"\u003e\u003ccode\u003e84d1159\u003c/code\u003e\u003c/a\u003e feat: declare the CommonJS entry point with export = and ship source maps\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/4bb27965cb1c39981d1571c082b353085288df6c\"\u003e\u003ccode\u003e4bb2796\u003c/code\u003e\u003c/a\u003e feat: type the attachment disposition as the token the message carries\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/341b0f4e13f36db734f7de5b899c683fe0051a73\"\u003e\u003ccode\u003e341b0f4\u003c/code\u003e\u003c/a\u003e refactor: drop the getHex helper that only its tests used\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/postalsys/postal-mime/commit/d26d7769daf02ab51c8cc 44\n\nStacked on #32944: the first commit here is #32944's head `190d8a3304`, and this PR adds one commit on top. Once #32944 merges the diff reduces to that commit. This fixes the replay case #32944 named as out of scope (probe P2 in the #32909 review).\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Change\n\nRecord removal in `drainCutoverHolds` is fenced to the lease owner (`packages/cloud/services/gateway-webhook/src/cutover-hold.ts:255-258`). When a drainer settles a turn while a *different* replica owns the lease, the record survives. If that replica dies without draining, the next drainer acquires the lapsed lease, finds a live record, and redelivers a turn whose dedup ledger already reads `delivered`. The Cloud turn and the provider send run a second time.\n\nThe drainer now reads the dedup ledger after acquiring the lease and before the expiry check (`src/cutover-hold.ts:281-282`). Only a `held` ledger is redelivered. `holdWebhookForCutover` writes `held` with no TTL, so while a record exists the ledger leaves `held` only when a drainer settles the turn: `delivered` after a completed redelivery, or reopened (absent) after a non-retryable release. Any such value means the turn is settled, so the record is removed under the same owner fence and counted in a new `stale` statistic (`CutoverHoldDrainStats.stale`, `:173`), with an info log naming the key and the ledger value. The ordering matters: the check runs before the hold-budget expiry branch, because `release(held, \"expired\")` would otherwise reopen a `delivered` ledger for a settled turn.\n\nRisk: low. The only changed path is a record whose ledger is not `held` at drain time; every other outcome is unchanged. `stale` is additive on the stats object; the drain summary in `src/index.ts` now counts it in its non-empty check and logs it with the other counts, and the tests assert it.\n\nNot addressed: two live drainers running the same turn concurrently after a renewal failure. The ledger stays `held` until a turn settles, so this check cannot see that window; lease renewal is the guard for it.\n\n# Testing\n\nEnvironment: Bun 1.3.14 on this machine (the repository pins 1.4.2), Node 24.15.0, `@elizaos/core` resolved from source through `--conditions=eliza-source` (no `dist` in this checkout). Not CI parity. All runs from `packages/cloud/services/gateway-webhook`.\n\nNew test, `a hold settled while another replica owned the lease is not redelivered once that lease lapses` (`__tests__/cutover-hold.test.ts:486`): drives the real `handleWebhook` and `drainCutoverHolds` against the local `Bun.serve` Cloud stub and in-memory Redis. While the attested turn runs, the lease key is overwritten with another replica's token; after the first drain the lease is deleted and a second drain runs. It asserts that the record survives the first drain (fenced), that the second drain reports `stale: 1` and nothing else, one Cloud turn, one provider send, the record removed, and a `delivered` ledger. The six existing `toEqual` stats assertions gain `stale: 0`.\n\n| Control | Command | Result |\n| --- | --- | --- |\n| GREEN, file, head `c9da363082` | `bun test --conditions=eliza-source __tests__/cutover-hold.test.ts` | 10 pass, 0 fail |\n| GREEN, whole package (5 files), at `d7ab904d1a` (same code; the final commit only reflows one `logger.info` call for Biome) | `bun test --conditions=eliza-source` | 47 pass, 0 fail |\n| RED, the ledger check removed and the `stale` field kept | same file, `-t ow decides.\n\nReplaying a device's rows through the Cloud path on develop (sleep at 07:00, wake at 13:30, merged at 14:00):\n\n| Wake row | Local merge | Cloud merge on develop |\n| --- | --- | --- |\n| no meal forecast | `waking` | **`sleeping`**, `currentSleepStartedAt` 07:00 |\n| snapshot forecasts `breakfast` | `waking` | **`sleeping`**, `currentSleepStartedAt` 07:00 |\n\n# Change\n\n- **Contract:** `SyncLifeOpsScheduleObservationInput` (plugin-elizacloud) gains an optional `observedAt`, the time the device recorded that row.\n- **Serializer:** it moves into `schedule-state.ts` as `scheduleObservationSyncInput` and includes the row's `observedAt`. `RemindersDomain.serializeScheduleObservationForSync` delegates to it. The tests use the real serializer.\n- **Ingest:** `ingestScheduleObservations` normalizes the per-row `observedAt`. Before this change the field would have been dropped silently.\n- **`recordsFromSyncRequest`:** each row keeps its own `observedAt`. A missing value, or one after the batch's send time, falls back to the send time (the previous behavior), so a device clock cannot place a row in the future.\n- **`recordFromSyncInput`:** a synced row's `mealLabel` is only the label it was sent with. Real meal rows are always sent with an explicit label (`deriveLocalScheduleObservations`), and the snapshot still keeps `nextMealLabel`.\n\nOlder senders that omit the per-row time keep the current behavior. An older Cloud agent drops the unknown field during normalization.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (`4573712ebf`).\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\nThis used Ubuntu 24.04 (WSL2), Bun 1.4.2 and `bun install --frozen-lockfile` on develop `4573712ebf`.\n\nThe new tests are in `schedule-state-freshness.test.ts` (vitest). Each one builds the device's stored rows, serializes them with `scheduleObservationSyncInput`, ingests them with `recordsFromSyncRequest` as `device_sync` in one batch sent at `now`, and merges with `scope: \"cloud\"`:\n\n- *a synced batch keeps each row's own time, so replayed sleep does not beat the newer wake*: `waking`, `currentSleepStartedAt: null`, and the row times are preserved.\n- *a synced state row does not adopt its snapshot's meal forecast as its own label*: both rows have `mealLabel: null`, and the merge result is `waking`.\n- *an explicit meal row keeps its label through sync*.\n- *a row time after the batch send time falls back to the send time*.\n\n**Develop reproduction:** a throwaway test (not committed) serialized rows exactly as develop's `serializeScheduleObservationForSync` does and ran both scenarios against develop's `schedule-state.ts`:\n\n```\nREPRO-1 cloud: sleeping 2026-09-29T07:00:00.000Z\nREPRO-2 cloud: sleeping 2026-09-29T07:00:00.000Z\n   × develop: replayed sleep vs newer wake (no meal forecast)\n   × develop: wake row whose snapshot forecasts breakfast\n```\n\n| Run | Result |\n| --- | --- |\n| `schedule-state-freshness.test.ts`, this head | **12 pass** (8 existing + 4 new) |\n| `schedule-state.test.ts`, `schedule-sync-config.test.ts`, `schedule-insight.safe-sort.test.ts` | 10 pass |\n| `plugin-elizacloud` `lifeops-schedule-sync-client.test.ts` | 6 pass |\n| `plugin-elizacloud` `tsc --noEmit -p tsconfig.json` | pass |\n| `plugin-personal-assistant` `tsc --noEmit -p tsconfig.build.json` (after `plugin-elizacloud` `build:ts`, as `^build` orders it) | pass |\n| `biome check` on the changed files | clean |\n\n# Evidence Gate\n\n\u003c!-- evidence-head:26d3d0c8c7698ee2fa220bdd39dff1d5ae8d8cf4 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - schedule sync and merge logic; no rendered UI surface changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - schedule sync and merge logic; no rendered UI surface changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - no U c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Change\n\n1. **The validator returns a typed reason.** `validatePaymentAmount` (`packages/cloud/shared/src/lib/config/crypto.ts:229-265`) now returns `{ valid: true }` or `{ valid: false; reason; error }`. `reason` is one of `not_whole_cents`, `below_minimum` or `above_maximum`. The checks, their order and the `error` messages are unchanged. The existing callers only read `valid` and `error`, and they compile unchanged, including `direct-wallet-payments.ts:1468-1469`. That caller throws the message as a plain `Error` and never classified it.\n2. **The service maps reasons to codes through a table, not the message.** `AMOUNT_REJECTION_CODES` (`packages/cloud/shared/src/lib/services/crypto-payments.ts:66-70`) is checked with `satisfies Record\u003cPaymentAmountRejection, CryptoPaymentErrorCode\u003e`, so a new reason will not compile without a code. `not_whole_cents` maps to the new `AMOUNT_INVALID` (`:39`), `below_minimum` to `AMOUNT_TOO_SMALL`, and `above_maximum` to `AMOUNT_TOO_LARGE`. `createPayment` throws with the validator's message (`:329`). The old `|| \"Invalid amount\"` fallback could never be reached, because every rejection carries a message.\n3. **The route maps the new code to 400.** `packages/cloud/api/crypto/payments/route.ts:96-99` adds `AMOUNT_INVALID → 400 \"Amount must be a USD value in whole cents\"`. Without that entry the code would fall through to the 500 default (`:106-109`).\n\nConsumers checked with `git grep -n \"AMOUNT_TOO_LARGE\\|AMOUNT_TOO_SMALL\\|CryptoPaymentError\\|validatePaymentAmount\"` across `packages/` and `plugins/`. The route above is the only code that maps these codes. The billing UI (`packages/ui/src/cloud/billing/components/billing-tab.tsx:429`) and the `plugin-elizacloud` billing proxy (`plugins/plugin-elizacloud/src/routes/cloud-billing-routes.ts:730-742`) show or forward the `error` text and do not switch on codes, so neither needed a change. The direct-wallet route (`packages/cloud/api/crypto/direct-payments/route.ts:80-84`) returns the validator message as a 400, and that message is unchanged.\n\nRisk: low. Valid, too-small and too-large amounts get the same code, message, HTTP status and response body as before. The tests below assert the exact response bytes. The only change callers see is the response for an amount with more than two decimal places: 400 \"Amount must be a USD value in whole cents\" instead of 400 \"Amount too large\". `NaN` and `Infinity` now produce the `AMOUNT_INVALID` code, but they reach `createPayment` only from direct callers, because JSON cannot carry them.\n\n# Testing\n\nEnvironment: Bun 1.3.14 on this machine (the repository pins 1.4.2), Node 24.15.0. `@elizaos/core` and `@elizaos/plugin-sql` resolve from source through `--conditions=eliza-source`, because no `dist` is built in this checkout. This is not CI parity. The fix is one commit, `3049d16651`, on `origin/develop` `4573712ebf`.\n\nTests:\n\n- `packages/cloud/shared/src/lib/config/crypto.test.ts` (extended): the validator gives `not_whole_cents` for `10.005`, `NaN`, `Infinity` and `-Infinity`, `below_minimum` for `4.99`, `above_maximum` for `1000.01`, and exactly `{ valid: true }` for `5.01`.\n- `packages/cloud/api/__tests__/crypto-payment-amount-codes.test.ts` (new): drives the real route and the real `cryptoPaymentsService.createPayment`. Only session auth and the rate limiter are stubbed. `OXAPAY_MERCHANT_API_KEY` is a local placeholder, and `oxaPayService.createInvoice` is spied to throw and asserted never called. The service tests check `10.005`, `NaN` and `Infinity` → `AMOUNT_INVALID`, `4.99` → `AMOUNT_TOO_SMALL` and `1000.01` → `AMOUNT_TOO_LARGE`, each with its exact message. The route t ed as `retryable: false`: a 4xx, or `X-Eliza-Retryable: false`, as read by `readPersonalSharedFailureMetadata` (`packages/cloud/services/_common/src/personal-shared-failure.ts:100-102`, `:127-132`). Such a turn was sent to Cloud again on every drain for the one-hour hold budget, and then logged as a cutover expiry. The guard (`src/webhook-handler.ts:954-957`) now keeps a turn held only when Cloud returned a cutover hold, or when the failure is not classified as non-retryable. A non-retryable failure falls through to `settleBackgroundDeliveryFailure` (`:963`), the same path a first background delivery takes. That path logs `Background message processing failed` at error level. Because a pre-egress failure means no provider egress happened, it also reopens the dedup key (`:835-867`). This is the ledger contract that function documents for idempotent pre-egress failures, so a refused redelivery ends in the same state as a refused first delivery. Transport errors, 5xx responses and cutover holds stay in the durable queue, as #32909 intends.\n2. **A settled record is no longer kept because its lease lapsed.** `drainCutoverHolds` removed a delivered or released record only while the lease still held this drainer's token. Suppose renewal failed for a whole lease period and no other replica took the lease. The ledger already read `delivered`, but the record and index entry stayed, and the next drain ran the Cloud turn and the provider send again. The removal script (`src/cutover-hold.ts:247-260`) now refuses only when a *different* owner holds the lease. The existing tests `an expired drainer cannot mutate a replacement lease` and `a drainer releases only its own lease` still pass unchanged. The reschedule write (`:139`) keeps its strict token fence. With no lease, a `held` outcome is simply not stored, and the unchanged record is retried on the next drain.\n\nRisk: low. Only two paths change: the redelivery of a failure with `retryable: false`, and record removal when the lease key is absent. Every other outcome is unchanged. That covers cutover holds, transient failures, a lease owned by another replica, and expiry.\n\nNot addressed: a lease taken by another replica that dies without draining (probe P2 in the #32909 review). The first drainer still correctly declines to remove the record, and the record is replayed once that replica's lease lapses. Covering it would mean checking the dedup ledger before redelivery. It needs a live owner to steal the lease, which lease renewal is designed to prevent.\n\n# Testing\n\nEnvironment: Bun 1.3.14 on this machine (the repository pins 1.4.2), Node 24.15.0. `@elizaos/core` resolves from source through `--conditions=eliza-source` because no `dist` is built in this checkout. This is not CI parity. Prepared on the #32909 head `bc812ab321` as commit `332bb56054`, then rebased as the single commit `190d8a3304` onto `origin/develop` `4573712ebf`, which already contains #32909.\n\nThe tests are in `packages/cloud/services/gateway-webhook/__tests__/cutover-hold.test.ts`. They drive the real `handleWebhook`, `drainCutoverHolds`, `redeliverHeldWebhook` and `releaseExpiredHeldWebhook` against a local `Bun.serve` Cloud route and the in-memory Redis adapter. Only the Blooio provider API is substituted.\n\n- `a delivered hold whose lease lapsed with no new owner is not replayed`: the lease key is deleted while the attested turn runs. The test asserts 1 Cloud turn, 1 provider send, `delivered: 1` on the first drain, the record removed, all-zero stats on the next drain, and a `delivered` ledger.\n- `a held turn Cloud refuses as not retryable is released at once, not replayed for the hold budget`: Cloud answers 400. The test asserts `released: 1`, a reopened (null) ledger, the record removed, all-zero stats on a drain after the hold budget, 1 Cloud turn and 0 provider sends.\n\n1. GREEN at the rebased head `190d8a3304`, from `packages/cloud/services/gateway-webhook`: `bun test --conditions=eliza-source` → **46
