o charge, which contradicts the 30-day policy.\n\n# Change\n\n`closeReason`: for a `subscription_lapsed` clock, the fallback interval decides.\n\n- It returns `funding_restored` when the fallback is missing or has left `fallback_pending` / `shared_active`, as before.\n- While the fallback is still withdrawn it now returns `null` (keep open) instead of falling through to the runtime status.\n- `credits_exhausted` clocks are unchanged.\n\nDeletion is unchanged too. It still requires a `stopped` runtime with no lifecycle job and no active resume (`:400-401`), so a runtime that is still shutting down only receives the notices, which is correct because the plan has lapsed.\n\nThe file header now states the two close conditions separately.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (`4573712ebf`).\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\nThis used Ubuntu 24.04 (WSL2), Bun 1.4.2 and `bun install --frozen-lockfile` on develop `4573712ebf`.\n\nThe new cases are in `agent-funding-retention.pglite.test.ts`. They use the same PGlite database, real migrations (0480/0490/0501), real `ProvisioningJobService` and fake clock as the existing retention tests. There are two cases:\n- `shared_active` fallback with the runtime `running`;\n- `fallback_pending` fallback with the runtime `provisioning`.\n\nEach case:\n1. The first reconcile discovers the lapse and must leave the clock `retained`. **On develop it reports `{ discovered: 1, closed: 1 }`.**\n2. The suspend lands (runtime `stopped`) while the plan is still withdrawn, and the clock stays `retained`.\n3. The fallback moves to `recovery_pending`, and only then does the clock close as `funding_restored`.\n\n| Run | Result |\n| --- | --- |\n| `agent-funding-retention.pglite.test.ts`, develop `4573712ebf` source | 8 pass, **2 fail** (both new cases) |\n| Same file, this head | **10 pass, 0 fail** |\n| lement that creator is paid, through `recordAppScopedPaymentEarnings` or `redeemableEarningsService.addEarnings({ userId: payment.user_id, source: \"creator_revenue_share\" })` (`x402-payment-requests.ts:809-814`). The payer is only recorded as a wallet in `metadata.payer` (`:800`).\n- `refundAsCloudCredits` treats every `metadata.kind === \"x402_payment_request\"` row as the x402 rail (`crypto-payment-refunds.ts:81`). It requires `payment.organization_id === input.organizationId` (`:143-149`) and credits that organization (`:203`).\n- x402 top-ups never create `crypto_payments` rows (`topup-handler.ts` writes the ledger directly), so every x402 row this service can reach is a payment request.\n\n**Result:** an operator refund of an x402 payment request gives the payee Cloud credits on top of the earnings they already received, and the payer gets nothing. The existing test pinned this behavior: *\"x402 payments refund as credits to the owning organization only\"* refunds the x402 row to its owner org and expects success.\n\n# Change\n\n`refundAsCloudCredits` refuses the x402 rail with a new typed error, `CRYPTO_REFUND_X402_PAYER_UNBOUND`.\n\n- The check runs after the destination-policy check, so on-chain and fiat requests keep their existing error, and before any refund-state read or ledger write.\n- Crypto (wallet and OxaPay) refunds are unchanged.\n- `CRYPTO_REFUND_POLICY` and the top-up refund statement are unchanged. Refunds are still credits-only; x402 payment requests simply have no organization to credit yet.\n- The service header and the operator script's doc describe the refusal.\n- The now-unreachable x402 branch of the refund description is removed.\n\nThis is deliberately fail-closed. Refunding an x402 payer properly needs a payer-to-organization binding and a reversal of the creator's earnings in the same transaction. That is a product decision under #22968, not something this PR invents.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (`4573712ebf`).\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\nThis used Ubuntu 24.04 (WSL2), Bun 1.4.2 and `bun install --frozen-lockfile` on develop `4573712ebf`.\n\n`crypto-payment-refunds.pglite.test.ts` exercises the real refund service and credit ledger on PGlite. The old x402 test is replaced by *x402 payment requests are refused: the record belongs to the payee, not the payer*. For both the owning (payee) org and another org, the refund rejects with `CRYPTO_REFUND_X402_PAYER_UNBOUND`, no `credit_transactions` row is written, and the payee's balance stays 0.\n\n| Run | Result |\n| --- | --- |\n| Develop service, develop test | 4 pass (the x402 test asserts the payee is credited) |\n| Develop service, new test | 3 pass, **1 fail**: `Expected promise that rejects / Received promise that resolved` |\n| This head | **4 pass, 0 fail** |\n| `packages/cloud/shared` `tsc --noEmit` | pass |\n| `biome check` on the changed files | clean |\n\n# Evidence Gate\n\n\u003c!-- evidence-head:69436cfa94f0ca3974b1d64c8bac6c2ddba56de2 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - Cloud billing service change; no rendered UI surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - Cloud billing service change; no rendered UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - no UI flow; the operator refund path is exercised by the tests above.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs: develop reproduction and test outputs in Evidence Details.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend code path.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no agent/action/provider/prompt/model behavior changes.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Domain artifacts: `credit_transactions` rows and the payee organization's credit balance are asserted in the tests (see Evidence Details).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\n\u003cdetails\u003e\u003csummary\u003edevelop 4573712ebf service with the new test\u003c/summary\u003e\n\n```\n(pass) crypto and x402 refunds (#22968) \u003e on-chain and fiat refunds are refused before any ledger write\n(pass) crypto and x402 refunds (#22968) \u003e quoted but unsettled payments cannot mint refund credits\n(pass) crypto and x402 refunds (#22968) \u003e refunds are Cloud credits, capped at the paid USD and never the promo bonus\nExpected promise that rejects\nReceived promise that resolved: Promise { \u003cresolved\u003e }\n(fail) crypto and x402 refunds (#22968) \u003e x402 payment requests are refused: the record belongs to the payee, not the payer\n 3 pass\n 1 fail\n```\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eThis head\u003c/summary\u003e\n\n```\n$ bun test src/lib/services/crypto-payment-refunds.pglite.test.ts     (packages/cloud/shared)\n(pass) crypto and x402 refunds (#22968) \u003e on-chain and fiat refunds are refused before any ledger write\n(pass) crypto and x402 refunds (#22968) \u003e quoted but unsettled payments cannot mint refund credits\n(pass) crypto and x402 refunds (#22968) \u003e refunds are Cloud credits, capped at the paid USD and never the promo bonus\n(pass) crypto and x402 refunds (#22968) \u003e x402 payment requests are refused: the record belongs to the payee, not the payer\n 4 pass\n 0 fail\n$ tsc --noEmit (packages/cloud/shared)      exit 0\n$ biome check \u003cchanged files\u003e               No fixes applied.\n```\n\u003c/details\u003e\n\n## Known gaps / failures\n\n- `bun run verify` was not run in full on this host.\n- Operators lose the (incorrect) x402 payment-request refund path until a payer binding exists. A payer who needs a refund must be handled manually, as for any payment outside this service.\n- The review's non-blocking not 003e defect at the shared runner registration deadline. Once that startup deadline has elapsed, sends to not-yet-registered dynamic entity types fail immediately.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8319\"\u003e#8319\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/c6e8b20c27b08e94549a9431c38e867aa014b724\"\u003e\u003ccode\u003ec6e8b20\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Extend \u003ccode\u003eNetAddress.toCanonical\u003c/code\u003e to accept internet addresses. IPv4-mapped IPv6 addresses become IPv4 while retaining the port. Other addresses retain their identity and IPv6 scope metadata.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8317\"\u003e#8317\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/8d40572de3762d51b142cfff30e6927ef21e37a3\"\u003e\u003ccode\u003e8d40572\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tim-smart\"\u003e\u003ccode\u003e@​tim-smart\u003c/code\u003e\u003c/a\u003e! - Fix cluster workflows stalling after request resets.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8323\"\u003e#8323\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/1b21e0df6ab777d6a1664dfabdea88511f2d25d1\"\u003e\u003ccode\u003e1b21e0d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add validated multicast address refinements for IP and MAC addresses.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8310\"\u003e#8310\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/3b155e3e24e42b603d48dff5d3280715944998f0\"\u003e\u003ccode\u003e3b155e3\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/williamrobertson13\"\u003e\u003ccode\u003e@​williamrobertson13\u003c/code\u003e\u003c/a\u003e! - Fix memory leaks in \u003ccode\u003ePool.makeWithTTL\u003c/code\u003e with the usage strategy by releasing retired resources and consumed acquisition errors from the TTL queue.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8326\"\u003e#8326\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/895d94410f90c45546aec593730e5630f200ca1b\"\u003e\u003ccode\u003e895d944\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/lloydrichards\"\u003e\u003ccode\u003e@​lloydrichards\u003c/code\u003e\u003c/a\u003e! - Normalize identified MCP output schemas to object roots across protocol versions.\nSupport identified object schemas in MCP elicitation requests.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8318\"\u003e#8318\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/705fb6852ac24791352bd78889d57f07cbe949a9\"\u003e\u003ccode\u003e705fb68\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add \u003ccode\u003eQueue.shutdownUnsafe\u003c/code\u003e to synchronously discard buffered messages and settle pending queue operations from callbacks. Both \u003ccode\u003eQueue.shutdown\u003c/code\u003e and \u003ccode\u003eQueue.shutdownUnsafe\u003c/code\u003e return \u003ccode\u003efalse\u003c/code\u003e when the queue has already been shut down or completed; previously, \u003ccode\u003eQueue.shutdown\u003c/code\u003e always returned \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8325\"\u003e#8325\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/87912c014132648694015a5636177b2ba2bdeb2a\"\u003e\u003ccode\u003e87912c0\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add \u003ccode\u003eNetAddress.formatNativeHost\u003c/code\u003e and \u003ccode\u003eNetAddress.formatMulticastInterface\u003c/code\u003e with explicit platform and scope ID map parameters for native socket APIs.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8308\"\u003e#8308\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/106af64cf7117dfad53d3b11b61bb3d17d63bfca\"\u003e\u003ccode\u003e106af64\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tristanz\"\u003e\u003ccode\u003e@​tristanz\u003c/code\u003e\u003c/a\u003e! - Release savepoints after nested transactions succeed or successfully roll back in PostgreSQL, PGlite, MySQL, libSQL, and the Node, Bun, React Native, and WASM SQLite clients. This frees PostgreSQL transaction locks before the outer transaction completes.\u003c/p\u003e\n\u003cp\u003eCustom SQL clients can opt in through the new \u003ccode\u003ereleaseSavepoint\u003c/code\u003e option. Clients that omit it are unchanged.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8323\"\u003e#8323\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/1b21e0df6ab777d6a1664dfabdea88511f2d25d1\"\u003e\u003ccode\u003e1b21e0d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add generic branded NetAddress classifications and named validating schemas.\nSingleton address constants retain their base-family types; guards expose\nclassifications on demand. Operations that derive new address bits return only\nthe IPv4 or IPv6 family until callers revalidate the classification.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8305\"\u003e#8305\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/3d59ae6d5f9ff3e52cb6ed4a9f325320580218d5\"\u003e\u003ccode\u003e3d59ae6\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tim-smart\"\u003e\u003ccode\u003e@​tim-smart\u003c/code\u003e\u003c/a\u003e! - Make \u003ccode\u003ecriteria\u003c/code\u003e optional for \u003ccode\u003eDecision.probability\u003c/code\u003e. When supplied, \u003ccode\u003ecriteria\u003c/code\u003e still requires descriptions for both \u003ccode\u003efalse\u003c/code\u003e and \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eDecision.Probability.criteria\u003c/code\u003e is now optional, so consumers reading outcome descriptions (for example, \u003ccode\u003edecision.criteria.true\u003c/code\u003e) must first guard against \u003ccode\u003eundefined\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8329\"\u003e#8329\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/89c9a398412f1f5e7f9c6f697a1badd982bcd741\"\u003e\u003ccode\u003e89c9a39\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/tim-smart\"\u003e\u003ccode\u003e@​tim-smart\u003c/code\u003e\u003c/a\u003e! - Warn when conflicting cluster workflow definitions reuse a tag.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eeffect@4.0.0-rc.116\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/7908\"\u003e#7908\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/c19c63fb710422aaf00b8d923188aa2e52a6776f\"\u003e\u003ccode\u003ec19c63f\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/gcanti\"\u003e\u003ccode\u003e@​gcanti\u003c/code\u003e\u003c/a\u003e! - Add experimental JIT and AOT schema compilers that work through the existing\n\u003ccode\u003eSchemaParser\u003c/code\u003e APIs and share a decoder registry. Enable JIT globally with\n\u003ccode\u003eeffect/unstable/schema/SchemaJITCompiler/enable\u003c/code\u003e, selectively with\n\u003ccode\u003eSchemaJITCompiler.enable(ast)\u003c/code\u003e, or install generated AOT decoders without\nrequiring dynamic function construction. The new\n\u003ccode\u003eeffect/unstable/schema/SchemaAOTCompiler/Build\u003c/code\u003e entrypoint discovers direct\nSchema exports from explicit module loaders and writes a self-installing AOT\nmodule through Effect's \u003ccode\u003eFileSystem\u003c/code\u003e and \u003ccode\u003ePath\u003c/code\u003e services. Compiled decoders can\nprovide optional synchronous \u003ccode\u003edecode\u003c/code\u003e and \u003ccode\u003emake\u003c/code\u003e operations; normal\n\u003ccode\u003eSchemaParser\u003c/code\u003e calls consume them transparently and retain \u003ccode\u003edecodeEffect\u003c/code\u003e and\n\u003ccode\u003emakeEffect\u003c/code\u003e as the detailed fallbacks. AOT targets declare the operations to\nprepare, so generated modules contain only those operation families and use\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/Effect-TS/effect/blob/main/packages/effect/CHANGELOG.md\"\u003eeffect's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e4.0.0-rc.117\u003c/h2\u003e\n\u003ch3\u003ePatc irect.github.com/Effect-TS/effect/pull/8323\"\u003e#8323\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/1b21e0df6ab777d6a1664dfabdea88511f2d25d1\"\u003e\u003ccode\u003e1b21e0d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/fubhy\"\u003e\u003ccode\u003e@​fubhy\u003c/code\u003e\u003c/a\u003e! - Add validated multicast address refinements for IP and MAC addresses.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8310\"\u003e#8310\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/3b155e3e24e42b603d48dff5d3280715944998f0\"\u003e\u003ccode\u003e3b155e3\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/williamrobertson13\"\u003e\u003ccode\u003e@​williamrobertson13\u003c/code\u003e\u003c/a\u003e! - Fix memory leaks in \u003ccode\u003ePool.makeWithTTL\u003c/code\u003e with the usage strategy by releasing retired resources and consumed acquisition errors from the TTL queue.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8326\"\u003e#8326\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/895d94410f90c45546aec593730e5630f200ca1b\"\u003e\u003ccode\u003e895d944\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/lloydrichards\"\u003e\u003ccode\u003e@​lloydrichards\u003c/code\u003e\u003c/a\u003e! - Normalize identified MCP output schemas to object roots across protocol versions.\nSupport identified object schemas in MCP elicitation requests.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/Effect-TS/effect/pull/8318\"\u003e#8318\u003c/a\u003e \u003ca href=\"https://github.com/Effect-TS/effect/commit/705fb6852ac24791352bd78889d57f07cbe949a9\"\u003e\u003ccode\u003e705fb68\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com rsion (unless you reopen the PR or upgrade to it yourself)\n- `@dependabot ignore this dependency` will close this PR and stop Dependabot creating any more for this dependency (unless you reopen the PR or upgrade to it yourself)\n\n\n\u003c/details\u003e"])</script><script>self.__next_f.push([1,"30:T4427,"])</script><script>self.__next_f.push([1,"Bumps the codeql-actions group with 2 updates: [github/codeql-action/init](https://github.com/github/codeql-action) and [github/codeql-action/analyze](https://github.com/github/codeql-action).\n\nUpdates `github/codeql-action/init` from 4.38.1 to 4.38.2\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/github/codeql-action/releases\"\u003egithub/codeql-action/init's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.38.2\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.1\"\u003e2.27.1\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4160\"\u003e#4160\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/github/codeql-action/blob/main/CHANGELOG.md\"\u003egithub/codeql-action/init's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003eCodeQL Action Changelog\u003c/h1\u003e\n\u003cp\u003eSee the \u003ca href=\"https://github.com/github/codeql-action/releases\"\u003ereleases page\u003c/a\u003e for the relevant changes to the CodeQL CLI and language packs.\u003c/p\u003e\n\u003ch2\u003e[UNRELEASED]\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.38.2 - 24 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.1\"\u003e2.27.1\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4160\"\u003e#4160\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.38.1 - 18 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe CodeQL Action now has experimental support for CodeQL releases for which per-language bundles are available. Per-language bundles support analysis for a single language and are therefore smaller than the combined bundles that allow analysis for all supported languages. As a result, per-language bundles take up less space on disk and are faster to download. We expect to roll this change out to everyone in the coming weeks. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4146\"\u003e#4146\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.38.0 - 09 Sept 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOn GitHub-hosted runners, the CodeQL Action now deletes unused CodeQL bundles from the toolcache before downloading a different bundle, which frees up disk space for the analysis. We expect to roll this change out to everyone in September. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4124\"\u003e#4124\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe CodeQL Action now supports CodeQL releases that are compatible with Linux Arm64 and downloads the native \u003ccode\u003elinux-arm64\u003c/code\u003e CodeQL bundle when available. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4072\"\u003e#4072\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.27.0\"\u003e2.27.0\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4129\"\u003e#4129\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.9 - 26 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.4\"\u003e2.26.4\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4106\"\u003e#4106\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.8 - 21 Aug 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003ch2\u003e4.37.7 - 13 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.3\"\u003e2.26.3\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4085\"\u003e#4085\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.6 - 04 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eChanged the default filepath for the new remote file address format that was introduced in CodeQL Action 4.37.0 / 3.37.0 to \u003ccode\u003e.github/codeql-config.yml\u003c/code\u003e to align it with the suggested path that is used elsewhere. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4070\"\u003e#4070\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.5 - 03 Aug 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFixed a bug where a network error while streaming the download of the CodeQL bundle could terminate the \u003ccode\u003einit\u003c/code\u003e Action instead of falling back to downloading the bundle before extracting it. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4061\"\u003e#4061\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.4 - 29 Jul 2026\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThis version of the CodeQL Action adds support for the \u003ccode\u003etools\u003c/code\u003e input for the \u003ccode\u003ecodeql-action/init\u003c/code\u003e step to be specified using a \u003ccode\u003egithub-codeql-tools\u003c/code\u003e \u003ca href=\"https://docs.github.com/en/organizations/managing-organization-settings/managing-custom-properties-for-repositories-in-your-organization\"\u003erepository property\u003c/a\u003e. This feature will gradually be rolled out following the release of this version. Once rolled out, this allows for the CodeQL CLI version that is used in GitHub-managed workflows, such as Default Setup, to be set to a custom value. For example, customers who run into issues with rate limits when a new CodeQL CLI version is released can set the value to \u003ccode\u003etoolcache\u003c/code\u003e to always use the CodeQL CLI version that is available in the runner toolcache. For Advanced Setup workflows, the value provided for \u003ccode\u003etools\u003c/code\u003e in the workflow definition always takes precedence unless the value of the repository property starts with \u003ccode\u003e!\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4037\"\u003e#4037\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpdate default CodeQL bundle version to \u003ca href=\"https://github.com/github/codeql-action/releases/tag/codeql-bundle-v2.26.2\"\u003e2.26.2\u003c/a\u003e. \u003ca href=\"https://redirect.github.com/github/codeql-action/pull/4051\"\u003e#4051\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4.37.3 - 22 Jul 2026\u003c/h2\u003e\n\u003cp\u003eNo user facing changes.\u003c/p\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/github/codeql-action/commit/2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2\"\u003e\u003ccode\u003e2892aa5\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/github/co llation and preserve execution receipts\",\"author\":\"NubsCarson\",\"number\":32950,\"body\":\"$1a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T04:52:46Z\",\"mergedAt\":\"2026-10-01T11:36:15Z\",\"additions\":658,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs8AAAABFxMTDg\",\"title\":\"Reuse request-bound planner context for task extraction\",\"author\":\"NubsCarson\",\"number\":32938,\"body\":\"$1b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:15:58Z\",\"mergedAt\":\"2026-09-30T14:54:05Z\",\"additions\":616,\"deletions\":24},{\"id\":\"PR_kwDOMT5cIs8AAAABF05qLw\",\"title\":\"fix(cloud): keep retired agent inference markup off on publish and billing\",\"author\":\"fadhelcarlos\",\"number\":32951,\"body\":\"$1c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T04:53:54Z\",\"mergedAt\":\"2026-10-01T11:40:30Z\",\"additions\":591,\"deletions\":128},{\"id\":\"PR_kwDOMT5cIs8AAAABF8o-pw\",\"title\":\"Reduce redundant task context and hosted reply planning\",\"author\":\"NubsCarson\",\"number\":32972,\"body\":\"Successful internal task results could repeat the canonical persona in extractor input and generate an unbound reply-planner answer before the host’s receipt-bound evaluator.\\n\\nThe extractor separates only the trusted system prefix that exactly matches the live persona/role; dialogue, constraints, providers, receipts, repair and restoration remain intact. The hosted single-tool final-scope path now invokes semantic evaluation directly. Pre-tool prose cannot bypass that evaluation; queued work, pending dependencies and legacy standalone callers retain their existing paths.\\n\\nValidation: independent review; Core24, PA38 and Assistant132 focused tests; full combined verification/build. A two-packet, effect-free Qwen comparison removed513 input tokens (15,640→15,127) with valid plans on both sides. The reply-planner reduction is proved by no-I/O native/JSON/failure/legacy regression tests; fresh whole-chat timing remains pending. No queue batching, model-default change or new network call.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T17:54:37Z\",\"mergedAt\":\"2026-10-01T11:08:52Z\",\"additions\":478,\"deletions\":50},{\"id\":\"PR_kwDOMT5cIs8AAAABF83UBA\",\"title\":\"fix(core): preserve code indentation during assistant text normalization (#30590)\",\"author\":\"0xalydev\",\"number\":32974,\"body\":\"$1d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T18:17:44Z\",\"mergedAt\":\"2026-10-01T10:58:11Z\",\"additions\":396,\"deletions\":192},{\"id\":\"PR_kwDOMT5cIs8AAAABF5YXkQ\",\"title\":\"chore(deps-dev): bump the dev-dependencies group with 8 updates\",\"author\":\"dependabot\",\"number\":32966,\"body\":\"$1e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T12:49:54Z\",\"mergedAt\":\"2026-10-01T10:52:32Z\",\"additions\":365,\"deletions\":327},{\"id\":\"PR_kwDOMT5cIs8AAAABF9sGDw\",\"title\":\"Persist approved tool projections for reply recovery\",\"author\":\"NubsCarson\",\"number\":32975,\"body\":\"$1f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T19:41:56Z\",\"mergedAt\":\"2026-10-01T11:40:04Z\",\"additions\":327,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABF0T8bQ\",\"title\":\"fix(gateway): drop a cutover hold another drainer already settled\",\"author\":\"nothingxnowhere\",\"number\":32948,\"body\":\"$20\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T03:27:00Z\",\"mergedAt\":\"2026-10-01T10:06:55Z\",\"additions\":289,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs8AAAABF6Tlmg\",\"title\":\"fix(app): preserve repeated warm deep links during shell boot\",\"author\":\"lalalune\",\"number\":32970,\"body\":\"$21\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T14:14:06Z\",\"mergedAt\":\"2026-10-01T10:06:09Z\",\"additions\":277,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABF1BC9w\",\"title\":\"fix(lifeops): keep synced schedule rows' own times and labels in the Cloud merge\",\"author\":\"fadhelcarlos\",\"n
