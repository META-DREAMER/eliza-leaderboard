\nThree more serializers mark a value `\"[Circular]\"` whenever the same object was visited **anywhere earlier in the walk**, not only when it is an ancestor of the current value. Each keeps one `WeakSet` for the whole traversal and never removes an entry, so a graph that references one object from two places (a DAG) is rendered with the second reference replaced by the string. Same class as #25125 (logger), #30994 (JS runtime bridge), #30999 (settings debug).\n\n| Site | Shape | Consumers |\n|---|---|---|\n| `packages/core/src/runtime/json-output.ts` `stringifyForDiagnostics` | `JSON.stringify` replacer with a global `seen` | `trajectory-recorder.ts`, `trajectory-utils.ts`, `services/evaluator.ts`, experience evaluators, relationships provider. Recorded trajectories and evaluator diagnostics therefore show `\"[Circular]\"` for a repeated sub-object in a model response or tool result. |\n| `packages/ui/src/utils/tts-debug.ts` `serializeTtsDebugDetail` | same replacer shape | TTS debug log lines |\n| `plugins/plugin-personal-assistant/src/lifeops/redact-sensitive-data.ts` `redactValue` | recursive walker, `seen.add` without `delete` | currently exercised only by `truncate-suffix-reserve.test.ts` |\n\n## Reproduction (develop `822aba345b67`)\n\n```ts\nconst shared = { id: 1 };\nstringifyForDiagnostics({ a: shared, b: shared });\n// → {\"a\":{\"id\":1},\"b\":\"[Circular]\"}\n```\n\nThe same input through the other two helpers yields the same shape.\n\n## Expected\n\nOnly a reference back to an open ancestor is a cycle. For the two `JSON.stringify` replacers the ancestor path is recoverable from the replacer's `this` (the holder object): pop the stack until the top is the holder, then test membership. For the recursive walker, add before descending and delete in `finally`.\n\n\n## Consolidated scope — maintainer backlog review, 2026-09-14\n\nAlso owns #30999 (settings-debug shared references) and #31113 (log redaction shared references). These are the same ancestor-path versus globally visited-set defect, with distinct output contracts. Candidate PRs are #31005, #31002 and #31119; they are not approved by this consolidation. A coordinated implementation should avoid duplicating incompatible traversal logic, while retaining sink-specific secret redaction, explicit diagnostic preview limits and genuine cycle handling.\n\nAcceptance must include sibling aliases, repeated array entries, true cycles, nested Errors and secret-bearing values at the actual consumers. Check expansion cost on shared graphs. A diagnostic size guard must not silently truncate complete recorded/model-facing content; trace every consumer before calling an output a preview.\n\nThe JS runtime bridge data-conversion defect in #30994 stays separate: it changes returned values at a public execution boundary, rather than only diagnostics.\n\n\n## Logger consolidation and implementation rejection\n\nAlso owns #25125, the logger redaction shared-reference report (candidate #30887). Preserve logger-specific secret redaction and log-preview contracts; do not force logger and full trajectory/provider outputs into the same lossy serializer. #31005 adds a 50,000-object truncation marker to stringifyForDiagnostics even though core relationships provider context and recorded trajectories consume it. That implementation is rejected: the replacement must preserve complete model/recorded values or explicitly reject a real resource-boundary overflow without publishing a partial payload. Candidate #30887 requires independent sink review before reuse.\n"])</script><script>self.__next_f.push([1,"1e:T1547,"])</script><script>self.__next_f.push([1,"This change preserves recoverable agent state and exact provider ownership across payment suspension, funded resume, replacement and deletion retries. A failed provider acknowledgement stays retryable. Cleanup uses the captured container, physical host and lifecycle generation, and cannot release a replacement host’s capacity or cancel dele Canonical ownership and audit-family mapping\n\n| Audit family | Canonical owner | Adapters / compatibility paths | Contract evidence in this change |\n| --- | --- | --- | --- |\n| **C1 — runtime/config contracts** | `packages/core/src/contracts/{service-routing,first-run-options,cloud-topology,wallet}.ts` and `packages/core/src/runtime-env.ts` | Existing shared subpaths re-export the core implementations; consumers keep stable imports while executing one implementation | core/shared parity coverage plus broad core, shared, app-core, agent, UI, scenario, and example lanes |\n| **C2 — config schemas/defaults** | `packages/shared/src/config/zod-schema.core.ts` owns dependency-light input schemas | `packages/agent/src/config/zod-schema.core.ts` reuses shared schemas and applies runtime defaults via `materializeRuntimeModelDefinition` | shared schema corpus and agent config/first-run coverage |\n| **C3 — relationship graph** | Agent `KnowledgeGraphService` and `app_lifeops.life_entities` / `life_relationships_v2` remain canonical | `plugin-relationships` stops treating the retired `app_relationships` schema as an active second owner and adds a read-only `LegacyRelationshipsSchemaAuditService` | `plugins/plugin-relationships/test/legacy-schema-audit.test.ts`; live non-empty installations remain a migration gate, described below |\n| **C4 — local inference policy** | `packages/shared/src/local-inference/recommendation.ts` | UI and `plugin-local-inference` project host-specific capabilities/manifests into the shared policy; filesystem/download work remains in the plugin | UI/runtime parity matrix, plugin-local-inference package coverage, shared tests |\n| **C5 — copied native sources** | Standalone/native and integrated-fork ownership is declared in `plugins/plugin-local-inference/native/copied-source-ownership.json` | Integrated copies remain build inputs only where the ownership manifest permits them | `native-source-provenance.test.ts` verifies declared paths and hashes ties | shared normalization plus renderer and vision queue/frame correlation tests |\n| **H7 — gateway routing** | `packages/cloud/services/_common/src/hash-router.ts` owns EndpointSlice discovery, ring refresh, stale eviction, and target selection | Discord and webhook gateways inject HashRing construction, service credentials, and their logger | deterministic common hash-router tests plus both gateway adapter lanes |\n| **H8 — retries/deadlines** | `_common/src/retry.ts`, `_common/src/response-attempts.ts`, and `packages/shared/src/utils/deadline.ts` own retry timing, `Retry-After`, abort/deadline composition, and attempt lifecycle | provider HTTP, proxy fetch, provisioning, and connector paths retain named replay/status/auth policy | deterministic retry/response-attempt/deadline tests, including abort and unsafe replay boundaries |\n| **H9 — registry/marketplace** | `packages/registry/src/runtime-kernel.ts` owns wire decoding, normalized entries, cache freshness, search policy, and scoring | agent keeps filesystem/config/network adapters; core keeps install/clone facade | runtime-kernel tests plus agent/core registry suites |\n| **H10 — duplicate host controllers** | `packages/shared/src/host-use-cases.ts` owns background-task coalescing and shared pairing-code normalization | agent and app-core preserve auth, origin, rate-limit, persistence, and HTTP translation policy | shared use-case tests and `background-tasks-cross-host.test.ts` plus both host route suites |\n| **H11 — frontmatter** | `packages/core/src/markdown/frontmatter.ts` owns bounded YAML/frontmatter document parsing | skills, HookService, agent hook discovery, and skill-learning decode their domain metadata from the core result | adversarial core parser tests plus skills/hook discovery consumers |\n| **H12 — training/release pipelines** | `eliza1_staging_kernel.py` and `gguf_k_quant.py` own staging and K-quant mechanics | existing local/real staging commands and public quant wrapper filenames remain compatibility entrypoints with profile data only | staging-kernel tests, real-stager tests, and quant recipe smoke tests |\n\n## Additional consolidation and drift prevention\n\nThe same ownership rules are applied to medium-risk exact clones and meta-systems touched by the implementation:\n\n- AES-256-GCM token-at-rest behavior moves to the Node core utility, with finances/health compatibility exports and ciphertext/key-file/environment tests.\n- Integration observability becomes a shared event/span contract with agent/app-core policy adapters.\n- Voice settings share one UI controller while local/device and Cloud panels keep capability-specific rendering.\n- Real-runtime Vitest configuration, native Capacitor/Rollup scaffolding, template cleanup scripts, static assets, and nested workflow templates are generated or manifest-checked instead of hand-copied.\n- Cloud migration prefixes gain a total-order manifest and duplicate-prefix check without renaming historical migrations.\n- Provider and connector account plumbing gains authoring/conformance helpers while preserving provider/channel implementations.\n\n## Data migration, security, and compatibility\n\n### Relationships\n\nThis change does **not** guess that a retired data store is empty. The active graph remains `KnowledgeGraphService`; startup inventory reports whether legacy `app_relationships` tables exist and whether they contain rows. Empty legacy tables may be retired safely. A non-empty inventory is a hard migration decision: rows must be imported with identity, redirect, merge, and evidence preservation before the old schema can be dropped. No destructive DDL is introduced here.\n\n### LifeOps carve-outs\n\nThe common migration runner writes a durable `app_eliza_migrations.carve_out_receipts` record keyed by domain migration. It uses a holder token and recoverable lease, marks completion only after the domain callback succeeds, and releases its own lease on failure. Completed receipts prevent a later empty target table from being interpreted as “never migrated,” which is the stale-source resurrection failure this work is intended to close. Domain callbacks remain responsible for explicit columns, validation, repairs, and sensitive-field scrubbing.\n\n### Secrets and untrusted boundaries\n\n- Token encryption preserves the existing AES-256-GCM ciphertext and key discovery contract; adapters do not log plaintext, keys, or provider payloads.\n- MCP schemas and model-produced JSON are budgeted and validated in an isolated boundary; Cloud OAuth/tool visibility and local transport authorization remain host policies.\n- Registry URLs/wire records are normalized before use; registry cache fallback remains explicit rather than fabricating healthy data.\n- Native HTTP and capture contracts validate/normalize crossing data while preserving exact bytes, bodyless statuses, timestamps, dimensions, and formats.\n- Gateway discovery retains bounded stale-ring behavior and authenticated Kubernetes discovery; connector identity/auth and forwarded-host policy stay outside the generic hash kernel.\n- Retry code centralizes timing and disposal mechanics without granting replay permission to unsafe non-idempotent requests.\n\n## Rollback plan\n\nRollback is by ownership family, not by deleting user data:\n\n1. Revert an adapter to its prior implementation while leaving new shared kernels present; stable import paths and public wrappers are preserved for this purpose.\n2. Do not delete durable carve-out receipts during rollback. Their presence is the safety record that prevents stale legacy rows from being re-imported.\n3. Do not drop `app_relationships` on rollback or deployment. If the inventory reports rows, stop and run an evidence-preserving migration before any retirement change.\n4. Native integrated copies and public training wrapper commands remain available, so provenance/kernel adoption can be reverted without changing artifact names or ABI inputs.\n5. Cloud gateway/retry/MCP rollbacks retain connector-specific auth, OAuth, identity, and routing policy in the host adapters; no credential or tenancy migration is required.\n\n## Validation\n\nFinal implementation certificate: `8d941b808e46575cad0d2581d85b2e597b0fec23`, rebased on `origin/develop` `6c957b412dad0bd49659201dafd43c719aea2a0c` with verified ancestry and a clean worktree. Hosted gitleaks then identified three synthetic migration receipt fixtures; the repository-standard line-scoped allow annotations produced final PR head `cbafeb1a48807da2a6a7969d7324e61eebdcf10a`, which passes the exact hosted gitleaks command and the affected 4/4 test.\n\n- Root `lint`: **141/141** tasks.\n- Root `typecheck`: **233/233** tasks.\n- Root `build`: **132/132** tasks; view-bundle guard **22/22**.\n- Root `verify`: **376/376** tasks; focused/skipped audit scanned **11,316** test files with **0 focused** and **0 orphaned skips**.\n- Repository executable script tests: green.\n- App visual audit: **223/223** captures, **0 broken**, **0 needs-work**; OCR **208 verified / 12 needs-eye / 0 broken**.\n- App-core: **4,500 pass / 23 skip**, plus **74** Node-script and **24** Bun-script tests.\n- Agent: **757/757**.\n- Cloud Shared authoritative matrix: **327/327** batches; **11,898 pass / 163 skip / 0 fail**.\n- Orchestrator: **3,114 pass / 11 explicitly gated live skips**; live Cerebras coverage now requires the repository-wide explicit live-test opt-in.\n- Wallet: **418 pass / 1 live skip**, with zero unhandled LI.FI background requests.\n- Remaining non-cloud official package runner: the pre-wallet segment reached **99** package commands green; wallet passed after repair; the final **8/8** packages passed with **991 executed / 14 skipped**.\n- Focused readiness regression ran green three consecutive times; package-level scheduling, relationships, MCP, local inference, registry, native transport, Cloud gateway/retry, training, and generated-system-file suites are included in the package and root result icy.ts` — the pure split policy behind the container-billing cron. Covered rules:\n\n- earnings-first charging with credits covering only the remainder (partial split, credits-only, earnings-only)\n- the pay-as-you-go opt-out freezing earnings entirely — including excluding them from the insufficiency check\n- combined insufficiency returns `action: \"insufficient\"` with zero debits\n- the exact-availability boundary still bills (strict `\u003c` insufficiency)\n- a zero-cost day is a no-op bill, not insufficiency\n\n## What kind of change is this?\n\nTest-only coverage addition (no production change).\n\n## Coverage overlap record (per review finding 3)\n\n`packages/cloud/e2e/tests/monetized-app-loop.spec.ts` already calls `computeContainerBillingPlan` directly for two paths — earnings-only survival (balance 0, earnings ≥ cost → `billed`, `fromEarnings ≥ cost`) and fully-insufficient (balance 0, earnings 0 → `insufficient`). The cron route test (`packages/cloud/api/cron/container-billing/route.test.ts`) mocks the policy, so it does not own the pure-function contract. The incremental cases this suite adds, each preventing a realistic consumer regression at the cron boundary (`packages/cloud/api/cron/container-billing/route.ts`):\n\n| Case | Realistic regression it prevents |\n| --- | --- |\n| partial split (`fromEarnings` + `fromCredits` \u003e 0) | inverting to credits-first funding silently violates the documented earnings-first rule (\"what keeps an earning agent self-funding\", module header) and prematurely depletes the org credit balance that the cron's insufficiency warning and other charges depend on |\n| opt-out freeze (`payAsYouGoFromEarnings: false` → `fromEarnings: 0`) | an org owner's opt-out being ignored at /cloud/billing, converting redeemable earnings against their explicit setting |\n| opt-out excluded from insufficiency check | insufficiency computed with earnings the org opted out of, suppressing the 48-hour shutdown warning an org with zero credits is entitled to |\n| exact-availability boundary (`\u003c` not `\u003c=`) | an org with exactly enough combined funds being warned/suspended instead of billed |\n| zero-cost day | a free-tier/suspended container day emitting a spurious insufficiency warning |\n| full plan-field shape (`totalAvailable`, `earningsEligible`) | the returned policy contract (`ContainerBillingPlan`) that the cron route consumes drifting from the computed decision |\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/cloud/shared/src/lib/services/__tests__/container-billing-policy.test.ts` — deterministic pure-function suite, no harness.\n\n## Detailed testing steps\n\nAutomated tests are the deliverable; no manual steps.\n\n## Review findings addressed (review 5020682845)\n\n**Finding 1 — test evidence not reviewable / no RED control.** Exact-head commands, output, and exit statuses are inline in the Evidence Details section below, including a RED control with three realistic isolated policy mutations (credits-first funding, opt-out ignored, `\u003c` → `\u003c=`), each proven to fail the suite with the failing test names listed, plus a green revert control. No asserted-literal-only mutation was used.\n\n**Finding 2 — gates, branch prefix, issue linkage.** Full `bun run --cwd packages/cloud/shared test`, package lint, and typecheck lanes were run post-rebase at the exact head (transcripts below); root `bun run verify` was run with the two unrelated pre-existing failures reproduced verbatim on pristine `origin/develop` (Known gaps section). Branch renamed `test/…` → `chore/cover-container-billing-policy-2026-08-25` (allowed prefix). Linked issue: #28762. PR-template sections, OCR row, and known-gaps/CI status are completed in this body.\n\n**Finding 3 — overlap claim narrowed.** The Coverage overlap record section above records the e2e suite's existing direct coverage (earnin `utils/processing.ts`, `actions/mcp.ts`, `prompts.ts`). The only behavior change is on the MCP `call_tool` path when the server returns a spec-compliant errored `CallToolResult` (`isError: true`): that call now returns `ActionResult.success:false` instead of a fabricated success. The success path is unchanged (regression-tested). No public type is removed — `isError` was already declared in `types.ts` and `processing.ts`; this PR makes it actually consumed.\n\n# Background\n\n## What does this PR do?\n\n`CALL_MCP_TOOL` never read the SDK's `CallToolResult.isError` flag. When an MCP server returned a structured error result (`isError: true` with the error text in `content` — the spec-mandated way tools report execution failures), `processToolResult()` merged the error text into `toolOutput` indistinguishably from a success payload, and the action returned:\n\n```\n{ text: \"Successfully called tool: \u003cserver\u003e/\u003ctool\u003e\", values: { success: true, toolExecuted: true, ... }, success: true }\n```\n\nSo a tool that failed (upstream 500, invalid API key, …) was recorded as a **successful** tool execution and the agent narrated the error content to the user as if it were data. This violates the repo error policy (\"Do not catch and continue with fabricated success\"; \"Action/tool failures already return to the planner path\"). `isError` was declared in `types.ts` and `processing.ts` but read nowhere in the package.\n\nThe fix:\n\n- `processToolResult()` now returns `isError: result.isError === true` alongside `toolOutput`/attachments.\n- `handleCallTool()` branches on `isError`: an errored result returns a distinct `ActionResult` with `success:false`, `values.toolErrored:true`, `data.isError:true`, a typed `McpError(\"…TOOL_EXECUTION_ERROR\")`, and text `\"Tool \u003cserver\u003e/\u003ctool\u003e reported an error…\"` — never `\"Successfully called tool\"`.\n- The user is still informed: `handleToolResponse()` threads a `toolErrored` hint into the reasoning template so the model frames the outcome as a failure rather than presenting the error content as requested data.\n\n## What kind of change is this?\n\nBug fix (non-breaking; fixes fabricated success on the planner path).\n\n# Documentation changes needed?\n\nNo. Behavior is corrected to match the MCP spec and the repo error policy; no user-facing docs describe the previous (incorrect) behavior.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-mcp/src/utils/__tests__/processing.test.ts` (pure `processToolResult` error-signal cases) and the new `plugins/plugin-mcp/src/actions/__tests__/mcp-call-tool-error.test.ts` (real `mcpAction.handler` with a stub `McpService.callTool` returning `isError:true`).\n\n## Detailed testing steps\n\n```bash\ncd plugins/plugin-mcp\nnpx vitest run --config vitest.config.ts \\\n  src/utils/__tests__/processing.test.ts \\\n  src/actions/__tests__/mcp-call-tool-error.test.ts\n```\n\nThe action test asserts: errored result → `result.success === false`, `values.toolErrored === true`, `result.error instanceof Error`, text no longer matches `/Successfully called tool/`; success result → `result.success === true`, text still claims success; and that the reasoning prompt for an errored call contains the failure framing.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:1005fef1286c0dc15eda57fdb91020709bde5858 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no UI surface; change is in the plugin-mcp action/util layer (no rendered component).`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - no UI surface; change is in the plugin-mcp action/util layer (no rendered component).`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - non-UI backend action-result change; proven by focused unit tests below.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - non-UI backend change; the focused vitest run (11/11) proving the processToolResult-\u003ehandleCallTool isError path is inlined verbatim under Evidence Details. Attachment-release upload is not authorized for this fork identity (HTTP 404 on uploads.github.com).\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] `N/A - no frontend request/response involved.`\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] `N/A - no live-model behavior change. The reasoning model call is unchanged except for a deterministic template hint (toolErrored) whose presence is asserted in test; no new prompt/model contract requires a live trajectory. The model call is stubbed deterministically in the handler test.`\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - before/after reproduction (isError dropped -\u003e surfaced) plus grep proof are inlined verbatim under Evidence Details; pr-evidence release asset upload is not authorized for this fork identity (HTTP 404).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] `N/A - no rendered visual surface.`\n\n# Evidence Details\n\n## Real LLM-call trajectory\n\n`N/A - see llm-trajectory row above. No live-model contract change.`\n\n## Backend + frontend logs\n\nFocused test run (11 passed) against live package source via the plugin vitest config:\n\n\u003cdetails\u003e\u003csummary\u003evitest — processing.test.ts + mcp-call-tool-error.test.ts (verbose)\u003c/summary\u003e\n\n```\n ✓ src/utils/__tests__/processing.test.ts \u003e processToolResult error signal (#30037) \u003e surfaces isError=true from a spec-compliant errored CallToolResult\n ✓ src/utils/__tests__/processing.test.ts \u003e processToolResult error signal (#30037) \u003e reports isError=false for a normal successful result\n ✓ src/utils/__tests__/processing.test.ts \u003e processToolResult error signal (#30037) \u003e treats an explicit isError=false the same as an absent flag\n ✓ src/actions/__tests__/mcp-call-tool-error.test.ts \u003e MCP call_tool action — errored CallToolResult (#30037) \u003e returns success:false and drops the success narration when isError:true\n ✓
