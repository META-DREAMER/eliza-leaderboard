\n\n### 1. Sandbox Provider Abstraction\n- `SandboxProvider` interface + factory (`MILADY_SANDBOX_PROVIDER` env var)\n- `VercelSandboxProvider`: extracted from inline Vercel code (zero behavior change)\n- `DockerSandboxProvider`: full lifecycle via SSH to remote nodes\n\n### 2. Docker Infrastructure\n- **DockerSSHClient**: connection pooling keyed on `host:port`, command timeout\n- **DockerSandboxProvider**: container create/stop/health/runCommand, DB-backed port allocation (collision-free), health check polling (3s interval, 60s timeout), shell-escaped commands, full agentId container names\n- **DockerNodeManager**: DB-backed least-loaded placement, health checks, capacity sync\n\n### 3. Headscale VPN\n- **HeadscaleClient**: REST API client for Headscale control plane\n- **HeadscaleIntegration**: ephemeral pre-auth keys per container, VPN lifecycle, automatic cleanup\n\n### 4. Database (migration `0046_docker_nodes.sql`)\n- New `docker_nodes` table (node_id, hostname, capacity, health status, allocation tracking)\n- 6 new columns on `milady_sandboxes`: node_id, container_name, bridge_port, web_ui_port, headscale_ip, docker_image\n\n### 5. Admin API (7 routes, all `requireAdmin`)\n| Endpoint | Method | Description |\n|----------|--------|-------------|\n| `/admin/docker-nodes` | GET/POST | List/register nodes |\n| `/admin/docker-nodes/:id` | GET/PATCH/DELETE | Node CRUD |\n| `/admin/docker-nodes/:id/health-check` | POST | SSH health check |\n| `/admin/docker-containers` | GET | List running containers |\n| `/admin/docker-containers/audit` | POST | Ghost/orphan audit |\n| `/admin/docker-containers/:id/logs` | GET | Container logs |\n| `/admin/headscale` | GET | Mesh status |\n\n### 6. Admin UI\n- **Infrastructure dashboard** (1,284 lines): Overview + Nodes + Containers + Mesh tabs\n- **Milady sandboxes table**: Docker metadata, status badges, VPN IPs\n- **Agent detail page**: Docker info card, SSH access info\n- **Docker logs viewer**: search, copy, download, auto-scroll\n\n### 7. Documentation\n- `docs/INTEGRATION_MAP.md` (1,555 lines): auth, credits, sandbox lifecycle mapping\n- `docs/DOCKER_HEADSCALE_PLAN.md`: implementation plan\n- `docs/DOCKER_PROVISIONING_SUMMARY.md`: provisioning flow docs\n\n---\n\n## Code Review (from #375, all addressed)\n\nAll 12 findings from the automated review were fixed before rebasing:\n\n| # | Issue | Fix |\n|---|-------|-----|\n| 1 | In-memory registry loses state on restart | `resolveContainer()` hydrates from DB via `findBySandboxId()` |\n| 2 | DockerNodeManager bypassed | `create()` uses `getAvailableNode()` for least-loaded placement |\n| 3 | Port collision under concurrency | `allocatePort()` queries DB for used ports on target node |\n| 4 | Command injection in `runCommand()` | All args `shellQuote()`'d individually |\n| 5 | agentId unsanitized in shell | `validateAgentId()` before any shell interpolation |\n| 6 | Health check single-shot | Polls with 3s interval, 60s timeout |\n| 7 | Container name truncation collision | Uses full agentId |\n| 8 | Weakly typed metadata | Exported `DockerSandboxMetadata` interface |\n| 9 | Missing step 9 in comments | Fixed numbering |\n| 10 | SSH pool key collision | Keyed on `hostname:port` |\n| 11 | `parseDockerNodes()` re-parses every call | Module-level cache |\n| 12 | Docs at repo root | Moved to `docs/` |\n\n---\n\n## Configuration\n\n```env\n# Switch to Docker provider (default: vercel)\nMILADY_SANDBOX_PROVIDER=docker\nMILADY_DOCKER_NODES=node1:192.168.1.100:8,node2:192.168.1.101:8\nMILADY_SSH_KEY_PATH=/path/to/ssh/key\nMILADY_SSH_USER=root\n\n# Optional: Headscale VPN\nHEADSCALE_API_KEY=hskey-api-xxx\nHEADSCALE_API_URL=http://headscale:8081\nHEADSCALE_USER=milady\n```\n\n## Risk \u0026 Rollback\n\n- **Zero risk to existing Vercel path**: factory defaults to `vercel`, Docker code only loaded when configured\n- **Rollback**: remove `MILADY_SANDBOX_PROVIDER` env var\n- **Migration is additive**: new table + nullable columns, no data modifications\n- **No breaking API changes**: all existing routes work identically\n\n## Testing Checklist\n\n- [ ] Provision agent with `MILADY_SANDBOX_PROVIDER=vercel` (no regression)\n- [ ] Provision agent with `MILADY_SANDBOX_PROVIDER=docker`\n- [ ] Docker metadata persisted in DB\n- [ ] Bridge/stream/snapshot/restore work through provider\n- [ ] Agent deletion cleans up container + VPN\n- [ ] Admin API: nodes CRUD, container list/logs/audit, headscale status\n- [ ] Admin dashboard renders all tabs\n- [ ] Run migration `0046_docker_nodes.sql` on test DB\n- [ ] `tsc --noEmit` passes (2 pre-existing errors only)"])</script><script>self.__next_f.push([1,"15:T2344,"])</script><script>self.__next_f.push([1,"## Summary\n\nAdds a full Docker container + Headscale VPN infrastructure layer as an alternative sandbox provider for Milaidy agents. Instead of running agents in Vercel Sandboxes, operators can now deploy agents as Docker containers on remote VPS nodes with optional WireGuard mesh networking via Headscale.\n\n**34 files changed, ~8,200 lines added**\n\n---\n\n## Motivation\n\nVercel Sandboxes are convenient but limiting: no persistent filesystem, no SSH access, no custom networking, constrained resources. For agents that need a real VPS-like environment (CLI tools, persistent data, inter-agent communication), we need Docker containers on dedicated infrastructure.\n\nThis PR introduces a provider abstraction so both backends coexist cleanly, controlled by a single env var.\n\n---\n\n## Architecture\n\n```\n                    MILAIDY_SANDBOX_PROVIDER=docker\n                              │\nUser → Eliza Cloud API → SandboxProvider Factory\n                              │\n              ┌───────────────┼───────────────┐\n              ▼                               ▼\n     VercelSandboxProvider          DockerSandboxProvider\n     (existing behavior)                      │\n                                    ┌─────────┼─────────┐\n                                    ▼         ▼         ▼\n                               SSH Client  Node Mgr  Headscale\n                                    │         │         │\n                                    ▼         ▼         ▼\n                              Hetzner VPS  Placement  VPN Mesh\n                              (Docker)     Strategy   (WireGuard)\n```\n\n---\n\n## What's included\n\n### 1. Sandbox Provider Abstraction (`lib/services/sandbox-provider.ts`)\n\nExtracted a `SandboxProvider` interface from the existing Vercel-specific code:\n\n```typescript\ninterface SandboxProvider {\n  create(config: SandboxCreateConfig): Promise\u003cSandboxHandle\u003e;\n  stop(sandboxId: string): Promise\u003cvoid\u003e;\n  checkHealth(healthUrl: string): Promise\u003cboolean\u003e;\n  runCommand?(sandboxId: string, cmd: string): Promise\u003cstring\u003e;\n}\n```\n\nFactory function reads `MILAIDY_SANDBOX_PROVIDER` env var (`vercel` | `docker`), defaults to `vercel`. Existing Vercel code extracted into `VercelSandboxProvider` with zero behavior changes.\n\n### 2. Docker SSH Client (`lib/services/docker-ssh.ts`)\n\nSSH client with connection pooling for managing containers on remote nodes:\n- Connection pool with configurable max connections\n- Command execution with timeout support\n- Container lifecycle (create, stop, remove, inspect, logs)\n- Image management (pull, check)\n\n### 3. Docker Sandbox Provider (`lib/services/docker-sandbox-provider.ts`)\n\nFull `SandboxProvider` implementation for Docker:\n- Container creation on remote nodes via SSH\n- Port allocation: bridge (18790-19790), web UI (20000-25000)\n- Health check polling with configurable timeout\n- In-memory container registry with DB backing\n- Optional Headscale VPN integration (graceful degradation if not configured)\n- Metadata passthrough (node_id, container_name, ports, VPN IP, image)\n\n### 4. Node Manager (`lib/services/docker-node-manager.ts`)\n\nMulti-node management with smart placement:\n- Least-loaded allocation strategy\n- Periodic health checks\n- Capacity tracking and reporting\n- Node enable/disable for maintenance\n\n### 5. Headscale VPN Layer\n\n**Client** (`lib/services/headscale-client.ts`):\n- Full REST API client for Headscale control plane\n- Node management, pre-auth key generation, route handling, health checks\n\n**Integration** (`lib/services/headscale-integration.ts`):\n- Container VPN lifecycle: prepare → register → cleanup\n- Ephemeral pre-auth keys per container\n- VPN registration polling (60s timeout)\n- Automatic node cleanup on container stop\n\n### 6. Database Schema (`db/migrations/0034_docker_nodes.sql`)\n\nNew `docker_nodes` table:\n```sql\nCREATE TABLE docker_nodes (\n  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  node_id TEXT UNIQUE NOT NULL,\n  hostname TEXT NOT NULL,\n  ssh_port INTEGER DEFAULT 22,\n  capacity INTEGER DEFAULT 8,\n  enabled BOOLEAN DEFAULT true,\n  status TEXT DEFAULT 'unknown',\n  allocated_count INTEGER DEFAULT 0,\n  last_health_check TIMESTAMPTZ,\n  ssh_user TEXT DEFAULT 'root',\n  metadata JSONB DEFAULT '{}'\n);\n```\n\n6 new columns on `milaidy_sandboxes`: `node_id`, `container_name`, `bridge_port`, `web_ui_port`, `headscale_ip`, `docker_image`.\n\n### 7. Admin API Routes (`app/api/v1/admin/`)\n\n7 new route files behind `requireAdmin` auth:\n\n| Endpoint | Method | Description |\n|----------|--------|-------------|\n| `/admin/docker-nodes` | GET | List all nodes with capacity info |\n| `/admin/docker-nodes` | POST | Register a new node |\n| `/admin/docker-nodes/:id` | GET/PATCH/DELETE | Node CRUD |\n| `/admin/docker-nodes/:id/health-check` | POST | SSH health check |\n| `/admin/docker-containers` | GET | List running containers |\n| `/admin/docker-containers/audit` | POST | Ghost/orphan container audit |\n| `/admin/docker-containers/:id/logs` | GET | Fetch container logs |\n| `/admin/headscale` | GET | Mesh status, nodes, pre-auth keys |\n\n### 8. Admin Infrastructure Dashboard (`components/admin/infrastructure-dashboard.tsx`)\n\nFull admin UI (1,284 lines) with three tabs:\n- **Docker Nodes**: list, add, edit, delete, health check, capacity bars\n- **Containers**: list with status badges, log viewer, ghost audit\n- **Headscale**: mesh status, connected nodes, pre-auth keys, VPN IPs\n\n### 9. Enhanced Container Views\n\n- **`components/containers/milaidy-sandboxes-table.tsx`** (608 lines): New table component showing all sandboxes with provider type, docker metadata, status filtering\n- **`components/containers/docker-logs-viewer.tsx`** (259 lines): Real-time log viewer with auto-scroll, line count, tail controls\n- **`app/dashboard/containers/agents/[id]/page.tsx`** (532 lines): Agent detail page with overview, logs, actions\n- Sidebar updated with infrastructure nav items\n\n### 10. Documentation\n\n- `docs/INTEGRATION_MAP.md` (1,555 lines): Comprehensive mapping of auth, credits, sandbox lifecycle, API surface, and data model between ElizaCloud and milady-cloud\n- `DOCKER_HEADSCALE_PLAN.md`: Original implementation plan\n- `DOCKER_PROVISIONING_SUMMARY.md`: Provisioning flow documentation\n\n---\n\n## Provisioning flow (Docker)\n\n```\n1. Database setup     → Neon DB provisioned (same as Vercel path)\n2. VPN preparation    → Generate Headscale pre-auth key (optional)\n3. Container creation → SSH to least-loaded node, pull image, run container\n4. VPN registration   → Wait for container to join mesh (60s timeout)\n5. Health check       → Poll /health endpoint via provider\n6. State restore      → Push backup via bridge API (if exists)\n7. Persist metadata   → Store docker fields in milaidy_sandboxes\n8. Return handle      → bridgeUrl + healthUrl (VPN IP or node hostname)\n```\n\n---\n\n## Configuration\n\n### Required for Docker provider\n```env\nMILAIDY_SANDBOX_PROVIDER=docker\nMILAIDY_DOCKER_NODES=node1:192.168.1.100:8,node2:192.168.1.101:8\nMILAIDY_SSH_KEY_PATH=/path/to/ssh/key\nMILAIDY_SSH_USER=root\n```\n\n### Optional (Headscale VPN)\n```env\nHEADSCALE_API_KEY=hskey-api-xxx\nHEADSCALE_API_URL=http://headscale:8081\nHEADSCALE_USER=milaidy\n```\n\n### Switching providers\n```env\n# Use Vercel (default, no change needed)\nMILAIDY_SANDBOX_PROVIDER=vercel\n\n# Use Docker\nMILAIDY_SANDBOX_PROVIDER=docker\n```\n\n---\n\n## Testing checklist\n\n- [ ] Provision agent with `MILAIDY_SANDBOX_PROVIDER=vercel` (no regression)\n- [ ] Provision agent with `MILAIDY_SANDBOX_PROVIDER=docker`\n- [ ] Verify docker metadata persisted in DB (node_id, container_name, ports)\n- [ ] Bridge requests work via `/api/v1/milaidy/agents/:id/bridge`\n- [ ] Streaming works via `/api/v1/milaidy/agents/:id/stream`\n- [ ] Snapshot + restore roundtrip\n- [ ] Agent deletion cleans up container + VPN node\n- [ ] Test with Headscale enabled (VPN IPs used for bridge/health URLs)\n- [ ] Test without Headscale (fallback to node hostname)\n- [ ] Admin API: list/add/health-check docker nodes\n- [ ] Admin API: list containers, fetch logs, run audit\n- [ ] Admin API: headscale mesh status\n- [ ] Admin dashboard renders all three tabs\n- [ ] Run migration `0034_docker_nodes.sql` on test DB\n- [ ] `tsc --noEmit` passes (2 pre-existing errors unrelated to this PR)\n\n---\n\n## Pre-existing type errors (not from this PR)\n\n```\ncomponents/admin/admin-metrics-client.tsx — chart data type mismatch\ncomponents/builders/quick-create-dialog.tsx — missing prop\n```\n\nThese exist on `main` and are unrelated to this work.\n\n---\n\n## Risk \u0026 rollback\n\n- **Zero risk to existing Vercel path**: Provider factory defaults to `vercel`, Docker code is only loaded when explicitly configured\n- **Rollback**: Set `MILAIDY_SANDBOX_PROVIDER=vercel` (or remove the var). Docker code is never imported.\n- **Migration is additive**: New table + new nullable columns, no data modifications\n- **No breaking API changes**: All existing routes work identically"])</script><script>self.__next_f.push([1,"16:Td1c,"])</script><script>self.__next_f.push([1,"This pull request introduces performance optimizations and reliability improvements for action validation and multi-step processing in the cloud bootstrap plugin. The most significant changes include caching action validation results to avoid redundant computation, reducing retry counts and timeouts for faster failure handling, and updating agent instructions to encourage fewer iterations per task.\r\n\r\n**Performance and reliability improvements:**\r\n\r\n* Added a per-message cache for action validation results in `actions.ts`, significantly reducing redundant validation of actions during a single message processing cycle. Includes a cache invalidation function for use when new tools are registered. [[1]](diffhunk://#diff-1043c437446f42ad433555de27e72776dc407feedd0a41e5badfe43da2e5c3c5R31-R52) [[2]](diffhunk://#diff-1043c437446f42ad433555de27e72776dc407feedd0a41e5badfe43da2e5c3c5R77-R88) [[3]](diffhunk://#diff-149a006b2d70627fd4b73f8d8b75e1bf25bf170f90f14ec642417a11662a607cR970)\r\n* Lowered retry counts and timeouts for multi-step parsing and summary operations, and reduced the base/max delay for retries, resulting in faster error recovery and less waiting on failures. [[1]](diffhunk://#diff-149a006b2d70627fd4b73f8d8b75e1bf25bf170f90f14ec642417a11662a607cL51-R53) [[2]](diffhunk://#diff-149a006b2d70627fd4b73f8d8b75e1bf25bf170f90f14ec642417a11662a607cL729-R724) [[3]](diffhunk://#diff-149a006b2d70627fd4b73f8d8b75e1bf25bf170f90f14ec642417a11662a607cL1113-R1109) [[4]](diffhunk://#diff-50516c1ecf1f24da1ee22238877b5c294fb25685f26e62b0f5f94e65b89049eeL9-R9)\r\n\r\n**Codebase and logic simplification:**\r\n\r\n* Removed redundant waiting for MCP service initialization in `cloud-bootstrap-message-service.ts`, relying on runtime initialization to guarantee tool availability.\r\n\r\n**Agent behavior and instruction updates:**\r\n\r\n* Updated the multi-step agent template to emphasize immediate completion after task fulfillment and to minimize unnecessary action iterations.\n\n\u003c!-- CURSOR_SUMMARY --\u003e\n---\n\n\u003e [!NOTE]\n\u003e **Medium Risk**\n\u003e Touches core action discovery/validation and multi-step execution defaults (retries/timeouts), which can change tool availability timing and cause earlier failures if limits are too aggressive.\n\u003e \n\u003e **Overview**\n\u003e **Reduces per-message overhead in action prompting** by adding a per-`message.id` cache in the `ACTIONS` provider for validated actions and MCP Tier-2 tool counts, with a 2-minute TTL and an explicit `invalidateActionValidationCache()` hook.\n\u003e \n\u003e **Speeds up multi-step runs** by lowering retry backoff delays and reducing default parse/summary retries from `5` to `2`, removing the in-handler wait for MCP initialization (now assumed to happen during runtime creation), and invalidating the action-validation cache after successful `SEARCH_ACTIONS` tool registration.\n\u003e \n\u003e **Tightens MCP defaults** by switching the tool call fallback timeout to `DEFAULT_MCP_TIMEOUT_MS = 15000` (keeping the legacy constant as a deprecated alias), and adds unit tests covering the new caching/invalidation behavior and the updated retry/timeout defaults.\n\u003e \n\u003e \u003csup\u003eWritten by [Cursor Bugbot](https://cursor.com/dashboard?tab=bugbot) for commit cf25060073d3d0452c9520e64772b84e069ff1c0. This will update automatically on new commits. Configure [here](https://cursor.com/dashboard?tab=bugbot).\u003c/sup\u003e\n\u003c!-- /CURSOR_SUMMARY --\u003e"])</script><script>self.__next_f.push([1,"17:T7ad,"])</script><script>self.__next_f.push([1,"# Relates to\n\nNo existing issue.\n\n# Risks\n\nLow. Additive change only — new ref guard and two guard conditions added to an existing \\`useEffect\\`. No logic removed or restructured.\n\n# Background\n\n## What does this PR do?\n\nAfter an agent finishes responding, the chat textarea loses focus. The user has to click the input field manually before they can type their next message. This PR refocuses the input automatically when the agent finishes replying.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue)\n\n## Implementation notes\n\n- Adds \\`hasSentMessageRef\\` — a ref that is set to \\`true\\` the first time the user sends or retries a message. This prevents the \\`useEffect\\` from firing on mount (which would pop the virtual keyboard on mobile before the user has done anything).\n- The focus is only applied on non-mobile (\\`!chatState.isMobile\\`) to avoid the mobile virtual-keyboard anti-pattern of the keyboard appearing unexpectedly.\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n\\`packages/client/src/components/chat.tsx\\` — the \\`useEffect\\` around line 700 that syncs \\`inputDisabledRef\\`, and the two \\`updateChatState({ inputDisabled: true })\\` calls in \\`handleSendMessage\\` and \\`handleRetryMessage\\`.\n\n## Detailed testing steps\n\n**Desktop:**\n1. Start the elizaOS server and open the client at \\`localhost:3000\\`\n2. Open a DM chat with an agent\n3. Send a message and wait for the agent to reply\n4. Verify the text input is focused automatically after the reply — cursor is active, no click needed\n5. Verify the input is NOT auto-focused on initial page load (before sending anything)\n\n**Mobile / narrow viewport:**\n1. Open the client on a mobile device or resize the browser below 768px\n2. Send a message and wait for the agent to reply\n3. Verify the virtual keyboard does NOT pop up automatically after the reply"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-4xl\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-4 flex flex-col justify-between sm:flex-row\",\"children\":[[\"$\",\"$L12\",null,{\"currentInterval\":\"day\",\"currentDate\":\"2026-03-09\"}],[\"$\",\"$L13\",null,{\"metrics\":{\"date\":\"2026-03-09\",
