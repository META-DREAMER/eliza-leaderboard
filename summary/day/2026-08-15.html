d`\n\n# Sync with develop\n\n- [x] Based on the latest `origin/develop`; zero conflicts.\n- [x] Focused verification passes post-sync (5/5 module tests, packages/ui typecheck 0 errors, biome clean, `git diff --check` clean).\n\n# Risks\n\nLow. First-run conductor only. The deadline is an escape hatch, not a cancellation: the underlying login session is untouched, a sign-in completed after abandonment still lands via the existing auto-resume effect, and the attempt guard makes deadline-abandoned outcomes no-ops (the same settled-wave rule the deferred plugin registration watchdog documents) so a stale settle cannot mutate newer state or clobber the busy latch a newer attempt owns.\n\n# Background\n\n## What does this PR do?\n\nA cloud sign-in popup that dead-ends (raw JSON on the auth callback, #19255) or is simply abandoned never settles the provision promise: nothing rejects, the `.catch` never fires, and `first-run:cloud-login-waiting` hangs forever with no recovery action.\n\nThree pieces:\n\n1. `armCloudLoginWaitDeadline` (`packages/ui/src/first-run/cloud-login-wait-deadline.ts`): a 90 s deadline on the visible wait, cancelled when the flow settles first.\n2. `createAttemptGuard`: generation counter so outcomes of a deadline-abandoned attempt become no-ops and only the owning attempt releases the busy latch.\n3. On deadline the waiting turn is replaced with a notice that carries the sign-in choice block itself: live validation showed the original cloud-oauth turn is consumed by that point, so re-seeding by id no-ops and \"try again below\" would have no below.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNone.\n\n# Testing\n\n## Where should a reviewer start?\n\n1. `cloud-login-wait-deadline.ts` (~90 lines) and its 5 deterministic tests (deadline fires once, cancel-before, cancel idempotent after fire, guard staleness, guard invalidate).\n2. The wiring in `startCloudProvisionFlow` (`use-first-run-conductor.ts`): arm on seeding the waiting turn, cancel on settle, guarded then/catch/finally.\n\n```bash\nbun run --cwd packages/ui test -- src/first-run/cloud-login-wait-deadline.test.ts   # 5/5\nbun run --cwd packages/ui typecheck                                                 # 0 errors\n```\n\n## Detailed testing steps\n\nStart dev, click \"Sign in to Eliza Cloud\", then either let the popup dead-end on the #19255 callback error or simply ignore it. At 90 s the waiting turn converts to the recovery notice with a working sign-in button. Completing sign-in within the window cancels the deadline and proceeds normally.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed. `scripts/pr-evidence.mjs rows` sets this marker from the live PR head; rerun it after every push.\n\u003c!-- evidence-head:9f58740a64705f5b6838f6040a3c764d0c52ae84 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] Before screenshots: the indefinite \"Waiting for sign-in…\" hang against the same dead-ended callback (on #19255 and re-attached in a comment; row patched after upload).\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] After screenshots: at 90 s the same flow converts to the recovery notice with a working sign-in button (attached in a comment; row patched after upload).\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] Video walkthrough: `N/A - the before/after screenshots and the deterministic timer tests capture the behavior; the interesting part is a 90-second wait`.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs: `N/A - the change is entirely in the browser conversation layer; no backend path is touched, and the popup's cross-origin dead-end (the trigger) is already evidenced on #19255`.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] Frontend console and network logs: `N/A - no network behavior change; the deadline is a UI-state timer, fully covered by the deterministic tests`.\n\u003c!-- evidence-row:llm-trajectory /edge` `AgentRuntime`, `@elizaos/plugin-todos/edge`, and `createTodosSqlStore` over file-backed PGlite with direct Cerebras `gemma-4-31b`:\n\n- **7/7** provider exchanges returned HTTP 200.\n- Create applied, list read back the exact Todo, and replaying the same stable Telegram client ID returned the same Todo and receipt as `outcome=noop`, `replayed=true`.\n- Final database state was exactly one Todo and one mutation-ledger row.\n- Todo: `a6cf0af9-b08c-4e1a-ab48-e414981c933f`.\n- Mutation/commit: `45559b6f-aa44-4fc2-ad88-2065c19f967b`.\n- Idempotency key: `todos:v1:telegram:shared-todos:d4845d27:create-001:0`.\n- Request digest: `ba8b67e97790ea31afad3ecef70145794729a1b5e87a513da8bffae720f4e818`.\n- Every trajectory, raw model response, action result, backend log, and domain artifact was manually inspected. Exact-value and generic credential scans passed; no headers were captured.\n\n## Known release gates\n\n- Shaw (`lalalune`) merged the PR; post-merge `develop` CI and the canonical Cloud staging release must complete.\n- Canonical staging must run create/list/replay plus Shared-to-Dedicated cutover before production.\n- Cutover snapshots fail closed above 1,000 Todos, 4,096 mutation receipts, or 4 MiB. Accounts beyond those bounds remain on Shared; changing that policy requires a separate explicit data-retention decision.\n- No production deployment or connector cutover is authorized by this PR.\n\n## Database and rollback\n\n`0206_shared_todos.sql` and `0207_todo_mutation_ledger.sql` are additive and idempotent. Do not drop them during rollback; revert application code through a PR while retaining rows for recovery and audit.\n\n## Evidence Gate\n\n\u003c!-- evidence-head:db1701c3d336eaeb30a38083ad492888a98ba324 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered frontend source changed.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered frontend source changed.\n\u003c!-- evidence-row:walkthrough-vide up records the current DM watermark so old conversations are not replayed.\n\n# Background\n\n## What does this PR do?\n\nSingle-commit landing of #19464 with the review blockers repaired and the one-off production ops tooling stripped:\n\n- Restores the Eliza Cloud broker auth provider (`TWITTER_AUTH_MODE=broker`, OAuth 1.0a or OAuth 2.0 vended credentials) and adds an idempotent inbound DM polling loop that routes new X DMs through the agent message service and replies in the same conversation.\n- **DM pagination (review blocker):** each poll pages the DM event timeline until it reaches the durable cursor (continues until the durable cursor, with a 1,000-page fail-closed guard that never advances past unseen events), so bursts larger than one 50-event page are not silently dropped.\n- **Delivery settlement (review blocker):** reply delivery is tracked with a per-event settlement marker separate from inbound-memory existence; an explicit 4xx rejection is retryable, while an acceptance-unknown transport failure retains a durable no-replay tombstone because X provides no DM idempotency key.\n- **Token rotation (review blocker):** the broker OAuth2 path carries an `expires_at`/refresh-rotate contract — the Cloud token route refreshes expired (or expiry-unknown) tokens against X, rotates the stored secrets, and vends `expires_at`; the plugin provider honors `expires_at` and caps its cache TTL so broker-side rotation propagates without a restart.\n- Folds in the author's follow-up ownership fixes from the original branch: inbound DMs and mentions persist the canonical entity UUID as the X world owner via `reconcileTwitterWorld` (upsert on legacy runtimes), and DM connections use canonical user ids.\n- **Not included, deliberately:** the production canary job and DB-surgery scripts from the original branch (`.github/workflows/test.yml` x-agent-rollout job, `x-agent-diagnostic.yml`, `.github/scripts/x-identity-hotfix-deploy.sh`, hardcoded production agent ids in `agent-im --- | --- |\n| Local runtime + local inference | Local **Active** |\n| Local runtime + Cloud inference | Cloud **Active** |\n| Hosted Cloud runtime + Cloud inference | Cloud **Active** — same as the row above |\n| Hosted Cloud runtime + local inference | not modelled |\n\nCloud Overview compounded it, collapsing account session, runtime, and inference into \"Cloud is connected\" vs \"Local mode is active\" from `elizaCloudConnected` alone.\n\n## Change\n\n**Live inference source.** Cloud-proxy reports `elizacloud` only when a real `elizaOSCloud` `TEXT_SMALL` handler is registered. `resolveActiveChat` takes the runtime and omits `activeChat` when unsigned. Tiles separate serving (`current` → orange + `aria-current`) from inspecting (`selected` → quiet border + `aria-pressed`). The unsigned Cloud panel offers interactive **Sign in** instead of a no-op \"Use Eliza Cloud\"; Local gains a fallback banner. Model dropdowns no longer lock to Eliza Cloud unless connected.\n\n**Two axes.** New `resolveServingAxes` classifies runtime and inference independently, rendered as a labelled **Agent runtime** / **Chat inference** row pair above the tiles. The runtime axis prefers `deploymentRuntime` from `GET /api/runtime/mode` — the server's view of the persisted `deploymentTarget.runtime`, which already records hybrid as `local` — falling back to the startup-coordinator target and first-run/mobile pins while unresolved.\n\n`cloud-hybrid` / `elizacloud-hybrid` stay **local runtime + cloud inference**; a remote backend stays distinct from Cloud. The tiles remain the inference picker, so orange + **Active** still marks only the source actually answering chat. Cloud Overview now speaks about the account and points at Models \u0026 Providers.\n\n## Evidence\n\nVerified live in `/Applications/Eliza-dev.app` against a freshly synced renderer (`sync-desktop-renderer.mjs`), running on an isolated state dir so the existing install was untouched.\n\nServer state for the capture:\n\n```json\n{\"mode\":\"local\",\"deploymentRuntime\":\"local\",\"isRemoteController\":false}\n{\"state\":\"running\",\"model\":\"elizacloud\",\"cloud\":{\"connectionStatus\":\"disconnected\"}}\n```\n\nThat is exactly the previously-dishonest case: cloud-proxy configured, account signed out. Settings now renders:\n\n- **Agent runtime → This device** — \"The agent process runs on this device, so it stops when the app does.\"\n- **Chat inference → This device** — \"Eliza Cloud is selected but not signed in, so chat replies are computed locally until you sign in.\"\n- Tiles: Eliza Cloud *Not signed in* (quiet) · Local provider **Active** (orange)\n- Local panel banner: \"Answering chat because Eliza Cloud isn't signed in.\"\n\nBefore this PR the same state rendered Eliza Cloud as **Active** with no runtime row at all.\n\n### Checks\n\n- `packages/ui` — 629 tests pass (57 files), `tsc --noEmit` clean\n- `packages/agent` model-config + agent-model — 44 pass, 0 fail\n- `bun run check:i18n` — exit 0\n- `bun run verify` — 132/135 tasks pass\n\n`@elizaos/core#lint:check` fails, but it fails identically on a pristine `origin/develop` checkout (a formatter diff in `packages/core/src/runtime/__tests__/action-retrieval.test.ts` plus two lint rules) and touches no file in this PR. Left alone so this PR stays scoped.\n\n### Not covered\n\n- **Hosted Cloud runtime** rows (`cloud-runtime` / `both`) are covered by unit tests but not captured live — that needs a provisioned Cloud agent and a signed-in account.\n- Cloud Overview is `cloudOnly: true`, so its revised copy is test-covered but not captured live for the same reason.\n- Model dropdowns still *prefill* Eliza Cloud / Gemma 4 31B from persisted `config.env` (`resolveChatDraft`). They are unlocked and no longer claim to be serving, but the prefill itself is out of scope here.\n\nRefs #20045\n\n\u003c!-- evidence-head:446acc1ec2756fb6310f8fd923908f91db0c9b8c --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] ![before-screen ins the exact final full `pre-delete` backup for 30 days after a successful managed-agent deletion instead of losing it to `ON DELETE CASCADE`. It adds explicit organization, deleted-agent, deletion-attempt, and expiry metadata; leaves ordinary backups attached so they still cascade; keeps retained rows visible to restorability verification; and cleans expired inline and R2/S3 payloads in bounded provisioning-worker batches.\n\nThe reviewed repair also:\n\n- writes deletion intent before persisting the fresh capture, so the retained-backup timestamp predicate accepts it;\n- propagates every lifecycle-trigger revision through backup persistence, allocation release, and the final row-delete CAS;\n- binds the supported legacy-image no-snapshot waiver to deletion attempt, environment revision, sandbox ID, and the current bridge URL;\n- makes migration constraints safe when the provisioning worker's schema ensure runs before migration;\n- prevents a failed R2 candidate from starving later expired rows and accounts for terminal missing-key rows;\n- adds real PGlite coverage for stale revision refusal, post-trigger deletion, timestamp boundaries, and ensure-before-migrate replay.\n\nThe cleanup/migration hardening originated in [synapz-org/eliza#1](https://github.com/synapz-org/eliza/pull/1) by `hermesagent270-commits`; it was statically audited, incorporated, and refined for the repository error policy and log redaction.\n\n## Why this approach?\n\nThe repository already owns one backup row model, KMS path, R2 namespace, verifier, and cleanup boundary. Extending those contracts is cleaner and safer than introducing a parallel pre-deletion table or object store.\n\n# Documentation changes\n\n`packages/cloud/shared/docs/agent-backup.md` documents retention, tenant ownership, the typed unsupported-generation waiver, fail-closed behavior, and cleanup order.\n\n# Testing\n\nAll untrusted PR code was executed in a network-disabled, capability-dropped Lima/container boundary with pinned Bun 1.3.14 and Node 24.15.0.\n\nFocused proof on patch-identical commit `098b2af741847d6b162433524d1e2ae2527058f2`:\n\n```bash\nbun test packages/cloud/shared/src/db/agent-sandbox-pre-delete-recovery.test.ts\nbun test packages/cloud/shared/src/lib/services/__tests__/deletion-allocation-ownership.test.ts\nbun test packages/cloud/shared/src/db/repositories/agent-sandboxes.test.ts\nbun test packages/cloud/scripts/admin/daemons/provisioning-worker.pre-delete-backup-cleanup.test.ts\nbun test packages/cloud/shared/src/lib/services/eliza-sandbox.test.ts -t 'fail-closed pre-deletion capture|allocation release carries'\nbun test packages/cloud/shared/src/lib/services/eliza-sandbox.test.ts\nbun test packages/cloud/shared/src/lib/services/agent-backup-verifier.test.ts\nbun run --cwd packages/cloud/shared typecheck\nbun run --cwd packages/cloud/api typecheck\nbun run --cwd packages/cloud/shared lint:check\nbun run --cwd packages/cloud/shared check:tenant-scope\nbun run --cwd packages/cloud/shared db:check-migrations\n```\n\nAfter rebasing onto current `develop`, `git range-diff` reported all four commits patch-identical and `git diff --check` passed. Changed-file Biome also passed on exact head `cb291e161bfeff9c8743241a4f95cfea5b90fc42`. The rebased VM rerun was interrupted by the disposable VM exhausting memory during coverage instrumentation; hosted CI is the independent exact-head rerun.\n\n# Evidence Gate\n\nEvidence matches exact commit `cb291e161bfeff9c8743241a4f95cfea5b90fc42`.\n\u003c!-- evidence-head:cb291e161bfeff9c8743241a4f95cfea5b90fc42 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before full-page screenshots: N/A - backend-only schema, repository, worker, and lifecycle change with no rendered surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] After full-page screenshots: N/A - backend-only schema, repository, worker, and lifecycle change with no rendered surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n valuator model request, compaction, generic settlement reasoning, model-call persistence, summaries, rescue prompts, and repeat-correlation material. Those gaps are repaired on the contributor branch and the complete series is rebased onto current `develop`.\n\n# Design\n\n`packages/core/src/security/tool-diagnostics.ts` is the canonical boundary projector:\n\n- `composeToolDiagnosticRedactor` applies runtime-known-secret redaction first, then the shared credential-shape pass for CLI credential flags, URI userinfo, authorization headers, PEM blocks, and provider-token formats.\n- `projectToolDiagnosticValue` and `projectToolDiagnosticArgs` are non-mutating, cycle/depth bounded, fully mask credential-named values, preserve non-string primitives, and structurally share unchanged plain objects.\n- `projectModelCallDiagnosticValue` applies the same policy to a complete model-call record without corrupting JSON Schema semantics. Schema property/definition identifiers such as `token`, `apiKey`, and `secret` remain exact so recorded requests stay replayable; descriptions, defaults, examples, tool metadata, provider options, messages, results, and actual arguments remain scrubbed.\n- Operational correlation identity (`stepId`, call/run/room/message/trace ids, action identity, `llmCallId`) remains exact. Provider-attribution byte spans are dropped through the existing canonical fallback whenever projected prompt/message bytes change, so hashes and order survive without false offsets.\n- Raw execution is deliberately unchanged: `trajectory.plannedQueue` retains the exact validated call and the handler receives the exact raw parameters. Redaction occurs only when a copy leaves that ephemeral execution path.\n\n## Covered egress boundaries\n\n| Surface | Boundary |\n| --- | --- |\n| Planner queue/context/event copies | projected at copy/emit in `planner-loop.ts` |\n| Pending `onToolCallEnqueued` and streaming tool-call/tool-result observers | projected before callback/emit |\n| tes to the freshly linked account instead of re-entering onboarding for the 15s TTL. Failed attempts get status-specific replies instead of being swallowed as onboarding chatter; transport failures throw rather than fake a verdict.\n- New `identity_link_codes` table (migration `0208_identity_link_codes.sql` + journal entry), schema barrel export, router codegen re-run.\n\n## Not in scope\n\nThe transcript-handoff idempotency item from the issue is already fixed on develop (`onboarding-chat.ts` sends `idempotencyKey: onboarding-handoff:${session.id}`, with exactly-once retry tests) per the 2026-08 status comment on the issue.\n\n## Tests\n\n- `packages/cloud/services/gateway-webhook`: new `src/__tests__/identity-link.test.ts` (6 pass) — code extraction (incl. near-miss rejection), confirm call contract, negative-cache `del` on success and only on success, status-specific rejection replies, throw on 5xx. Full package suite: **149 pass / 0 fail**.\n- `packages/cloud/shared`: new `identity-link.integration.test.ts` on real PGlite (8 pass) — mint/supersede, replay → `already_used`, expiry (no bind), platform mismatch (code stays consumable), **cross-account confirm rejected** with victim's handle intact, phone normalization end-to-end, case/prefix tolerance. Adjacent `users-identity-link.integration.test.ts` still green (19 pass total across both).\n- Typecheck clean: `cloud/shared`, `cloud/api` (incl. worker-bundle check), `gateway-webhook`. Biome clean on all touched files.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- evidence-head:1ef7e69fd9b5472d627e189e28673014b3e0a506 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - backend identity-link and gateway control-path change; no visual surface changed\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - backend identity-link and gateway control-path change; no visual surface changed\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - iew, verification), `anthropic/claude-sonnet-5` (architecture mapping and implementation subagents), `anthropic/claude-haiku-4-5` (issue scouting subagent)\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `claude-code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `N/A - no contribution skill used`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Based on the latest `origin/develop` at branch time; zero conflicts.\n- [x] `bun run verify` passes (exit 0).\n\n# Risks\n\nLow-medium. The change is strictly additive: a third `mode=\"simulate\"` alongside `prepare`/`execute`, an optional `simulate`/`simulation` member on `WalletChainHandler`, and a widened `WalletRouterExecution.status` union. `prepare`/`dryRun` semantics are byte-for-byte unchanged (the pre-existing test locking that behavior is untouched and green). The riskiest surface — anything that signs or broadcasts — is exactly what simulation is proven never to touch: test spies throw on `sendTransaction`/`sendRawTransaction`/`confirmTransaction` and on `VersionedTransaction.prototype.sign`, and the simulate paths resolve only the wallet public key. The financial-confirmation gate and the post-confirmation mode-forcing share one predicate (`requiresWalletFinancialConfirmation`), so a simulate request can never be upgraded to `execute`.\n\n# Background\n\n## What does this PR do?\n\nImplements the typed, non-broadcasting Solana simulation mode #16613 asks for, replacing fabricated dry-run metadata with a real RPC simulation for Jupiter swaps and pump.fun buys:\n\n- **Before:** `WalletBackendService.routeWalletAction` returned a fabricated `status:\"prepared\"` object built from static per-handler capability metadata for every non-bridge `prepare`/`dryRun` request — no chain handler call, no transaction, no RPC, nothing a user could trust as a preview (the defect pinned by the 2026-07-23 triage comment on the issue).\n- **After:** `mode=\"simulate\"` builds the **exact same real, unsigned transaction the execute path would sign and send** — the Jupiter quote + swap-tx build and the PumpPortal trade-local build are factored into shared helpers (`fetchJupiterSwapTransaction`, `fetchPumpFunTransaction`) used verbatim by both execute and simulate, so simulation can never drift from what execute submits — and runs it through `connection.simulateTransaction({ sigVerify: false, replaceRecentBlockhash: true })`, returning a typed `WalletRouterSimulation` (`success`, `err`, `logs`, `unitsConsumed`, quote/build `summary`).\n- An RPC-reported revert is a **typed `success:false` result** with `err`/`logs` — never a thrown error, never fabricated success. Transport/build failures throw typed errors exactly like the execute paths.\n- Handlers opt in via `simulate()` + `simulation` capability metadata (Solana `swap` and `pump_fun_buy` today); every other handler/subaction combination returns a typed `SIMULATION_UNSUPPORTED` router failure — never a silent fallback to `execute()` or to the `prepare` echo.\n- Simulation needs only the wallet **public key**: it never resolves a signing keypair or a `WalletBackend` signer (pump.fun simulate resolves `getAddresses().solana`, which works even for backends that cannot sign locally), and skips the pump.fun browser page-open side effect.\n- `mode=simulate` skips the financial-confirmation gate (nothing signs or moves), documented in the gate's header, and the action's `mode` parameter docs state simulate cannot authorize or lead to broadcast.\n\n## What kind of change is this?\n\nFeature (non-breaking, additive change which adds functionality), resolving a fabricated-success defect.\n\n# Documentation changes needed?\n\nDone in this PR: `plugins/plugin-wallet/CLAUDE.md` (mode paragraph, handler extension recipe, pump.fun path), byte-identical `AGENTS.md`, and `README.md` mode summary. `bun run check:agents-claude` passes (153 pairs byte-identical).\n\n# d above.\n\n## Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `OpenAI/gpt-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Codex desktop`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/eliza@a28e5af88461026f26a1577f0218d24dfea3c1c7:packages/skills/skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: OpenAI / gpt-5\nClient / agent tooling: Codex desktop\nContribution skill revision: elizaOS/eliza@a28e5af88461026f26a1577f0218d24dfea3c1c7:packages/skills/skills/contribute-to-eliza\nAttribution status: self-reported\n— [codex]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5\",\"client\":\"Codex desktop\",\"skill_revision\":\"elizaOS/eliza@a28e5af88461026f26a1577f0218d24dfea3c1c7:packages/skills/skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"34:Ta84,"])</script><script>self.__next_f.push([1,"Fixes #16290\n\n## Problem\n\nThe root `postinstall` ran `packages/scripts/sync-artifacts.mjs`, which downloaded a ~1 GB stale snapshot from `elizaOS/eliza-archive`, extracted it **over the repository root** (rewriting tracked files with different bytes after a clean checkout), and **exited 0** after exhausted downloads, sha256 mismatches, or extraction failures — a checkout-wide source-integrity hazard hidden inside every `bun install`.\n\n## Change\n\n- **Removed** the `sync-artifacts.mjs` postinstall invocation and the `sync:artifacts` root script; deleted the script, `artifacts-manifest.json`, and its test. `install:light` becomes a plain `bun install` alias (there is no artifact sync left to skip).\n- **Added** `packages/scripts/fetch-archive-artifacts.mjs` — the explicit opt-in path for consumers that genuinely need a legacy fix fety half: serialize shared credential saves; fresh-worktree consumption evidence remains with the issue).\n\nAlso supersedes the stale-importer test repair in #19498 by carrying its exact surviving-consumer contract.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] Targets `develop` and is rebased onto `origin/develop@75b83886e585a80ab8a47b2024673832a4d3941e` with zero conflicts.\n- [x] `bun install --frozen-lockfile --ignore-scripts`, focused real-filesystem tests, Biome, and `bun run verify` pass on the exact head.\n- [x] The original implementation was mutation-tested and repaired before maintainer handoff.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: yes\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: xai/grok-4.6 and anthropic/claude-fable-5 (original implementation/evidence); openai/gpt-5.6-sol (maintainer adversarial review and repair)\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: Grok Build CLI, Claude Code, Codex\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: original `elizaOS/army@9040169c8355166375297ed18a8823bd8bf030c2:skills/contribute-to-eliza`; maintainer `elizaOS/eliza@75b83886e585a80ab8a47b2024673832a4d3941e:packages/skills/skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: self-reported\n\n# Sync with develop\n\n- [x] Rebased after repair onto current `origin/develop`; zero conflicts.\n- [x] Exact-head focused suite and root verification pass post-sync.\n\n# Risks\n\nLow-to-medium. The change is confined to the operator-side LifeOps credential helper and its real-filesystem tests. Writes wait at most five seconds for a sibling writer and fail rather than interleave.\n\nLock reclamation is deliberately fail-closed for live owners: age alone never steals a lock from a PID that still exists. Dead owners are reclaimed; malformed partial records require the existing ten-second stale window. Each owner also has a random token, so an old writer's cleanup cannot remove a replacement writer's lock. As with any PID-based local lock, immediate PID reuse can conservatively delay a write until timeout; it cannot admit two writers.\n\n# Background\n\n## What does this PR do?\n\n- Serializes the complete read-modify-rename transaction for each `~/.eliza/.env` or repo `.env` target.\n- Re-reads only after the lock is held, preventing lost updates across worktrees/processes.\n- Collapses every definition of a written key so last-wins dotenv parsing cannot resurrect a stale duplicate.\n- Preserves unrelated lines and trailing blank lines.\n- Uses randomized mode-600 temp files, removes uncommitted temp files on failure, and repairs the final mode to 600.\n- Binds locks to a live PID plus random owner token; cleanup removes only the exact record acquired.\n- Preserves both the primary write failure and a simultaneous lock-release failure.\n- Carries #19498's exact surviving-HITL-importer contract instead of silently skipping missing paths.\n\n### Maintainer repair\n\nThe submitted implementation reclaimed any lock whose mtime exceeded ten seconds and unconditionally unlinked the lock pathname during release. A live but delayed writer could therefore be stolen; when it resumed, its cleanup could delete the new writer's lock and admit a third writer. The submitted 22 tests all passed with that bug.\n\nThe repaired implementation checks owner liveness, adds a 128-bit owner token, conditionally removes only the observed record, and covers both failure directions with real child processes.\n\n## What kind of change is this?\n\nBug fix (non-breaking operator-tooling hardening).\n\n# Documentation changes needed?\n\nNo external documentation change. The module header documents the lock ownership contract.\n\n# Testing\n\n## Where should a reviewer start?\n\n`scripts/lifeops/env-layers.mjs` (`readLockOwner`  `max_agents` override), and the sandbox counted-status list gains an `export`.\n\n# Background\n\n## What does this PR do?\n\nAdds `GET /api/v1/billing/limits`: a read-only, organization-scoped snapshot of the ceilings the Cloud backend actually enforces, per #19777's acceptance criteria.\n\n- **Org derivation**: exclusively from `requireUserOrApiKeyWithOrg` — no client-supplied org id is read (pinned by a route test that passes `?organizationId=…` and proves every data source still sees the authenticated org). Viewers may read.\n- **One observation timestamp**; distinct items for Cloud characters, managed agent sandboxes, containers, apps, and storage — never one ambiguous \"agents\" total.\n- **Canonical helpers, not re-derived numbers**: the character ceiling is `getMaxCloudCharactersForOrg` — extracted from the create route so create-time enforcement and this snapshot cannot drift; the sandbox ceiling is the existing `getMaxNonTerminalAgentsForOrg`; the sandbox usage count mirrors `assertOrgAgentQuota`'s exact counted set (`QUOTA_COUNTED_STATUSES`, now exported, including `stopped`/`sleeping`, non-pool); containers use `containerQuotaService.checkQuota`; apps use `appsService.countByOrganization` + the same per-org ceiling the create assertion resolves (newly exposed read-only as `getMaxAppsPerOrg`).\n- **Sandbox output** reports `nonEagerCreateLimit` and `eagerManagedCreateLimit` separately (both from the canonical balance-tier helper; the eager path's credit gating stays with its route) and deliberately has **no `canCreate` boolean**.\n- **Storage**: exact decimal strings from the `org_storage_quota` bigints; a missing row maps only to the schema's exported default (5 GiB) with zero usage.\n- **Rate limits**: configured per-minute caps for completions and embeddings only (org tier + overrides via `getOrgTier`) — no usage claims, no remaining-request claims, no route-protection presets.\n- **Fail-visible**: every item names its server source and carries `available` / `at-limit` / `over-limit` / `unavailable`; an unreadable or corrupt source becomes `unavailable` with a reason (`error-policy:J4`), never a free-tier value, zero usage, or success-by-default. The org row failing marks only the balance-derived ceilings unavailable; sibling items still report.\n\n## What kind of change is this?\n\nFeature (non-breaking): one new read-only route + DTO; two behavior-preserving extractions.\n\n# Documentation changes needed?\n\nNo — the DTO module documents the contract in place; the follow-up UI card consumes it after independent review (per the issue's slicing).\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/cloud/shared/src/lib/services/account-limits-snapshot.ts` (contract + assembly), then the route wiring and the two test files.\n\n## Detailed testing steps\n\n```bash\ncd packages/cloud/shared \u0026\u0026 bun test --isolate src/lib/services/account-limits-snapshot.test.ts\ncd ../api \u0026\u0026 bun test __tests__/billing-limits-snapshot.test.ts\nbun run --cwd packages/cloud/shared typecheck\nbun run --cwd packages/cloud/api typecheck\nbun run --cwd packages/cloud/api codegen   # idempotent; route mounted at /api/v1/billing/limits\nbun run verify:cloud\n```\n\n# Evidence Gate\n\n\u003c!-- evidence-head:184ba4df9153a9a2221e5ef635a0ef8fee2f7708 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - new read-only backend route; no rendered UI surface changed (the UI card is an explicitly separate follow-up slice per the issue)\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - same as above\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - no interactive flow changed; the route contract is pinned by deterministic tests\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Full test + typecheck + cloud-lane transcript\n```text\n$ cd packages/cloud/shared \u0026\u0026 bun test --isolate src/lib/services/account-limits-snapshot.test.ts\n 10 pass / 0 fail — 43 expect() calls\n$ cd packages/cloud/api \u0026\u0026 bun test __tests__/billing-limits-snapshot.test.ts\n 3 pass / 0 fail — 11 expect() calls\n$ bun run --cwd packages/cloud/shared typecheck\nDone!\n$ bun run --cwd packages/cloud/api typecheck    # 0 errors (through the worker-bundle dry run)\n$ bun run --cwd packages/cloud/api codegen\n[codegen] wrote src/_router.generated.ts (672 mounted, 0 unconverted)\n$ bun run verify:cloud\n Tasks: 78 successful, 78 total\n```\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend or browser behavior changed\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no model, prompt, action, or provider behavior changed\n\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] The serialized snapshot itself (route test observation, mocked boundaries)\n```text\nGET /api/v1/billing/limits -\u003e 200\n{\n  \"success\": true,\n  \"data\": {\n    \"observedAt\": \"\u003cISO-8601\u003e\",\n    \"cloudCharacters\":   { \"source\": \"cloud-character-quota\", \"state\": \"available\", \"used\": 2, \"limit\": 100 },\n    \"agentSandboxes\":    { \"source\": \"agent-sandbox-quota\", \"state\": \"available\", \"used\": 2,\n                           \"nonEagerCreateLimit\": 100, \"eagerManagedCreateLimit\": 100 },\n    \"containers\":        { \"source\": \"container-quota\", \"state\": \"available\", \"used\": 0, \"limit\": 10 },\n    \"apps\":              { \"source\": \"apps-service\", \"state\": \"available\", \"used\": 1, \"limit\": 25 },\n    \"storage\":           { \"source\": \"org-storage-quota\", \"state\": \"available\", \"bytesUsed\": \"42\", \"bytesLimit\": \"1000\" },\n    \"inferenceRateLimits\": { \"source\": \"org-rate-limits\", \"state\": \"available\", \"completionsRpm\": 60, \"embeddingsRpm\": 120 }\n  }\n}\nTenant isolation: with ?organizationId=org-else, every source still received org-authed.\nAuth failure: 401 envelope, zero data sources touched.\n```\n\n\u003c!-- evidence-row:ocr-review - ing the code, from the evidence below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `claude-code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `N/A - no contribution skill used`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop`; zero conflicts.\n- [x] `bun run verify` passes post-sync.\n\n# Risks\n\n**Medium.** Touches packaging policy (which packages enter the runtime bundle) and one desktop renderer behaviour.\n\n- The bundle grows: `plugin-calendar`, `-inbox`, `-notes`, `-task-coordinator`, `-blocker`, `-goals`, `-phone`, `-reminders`, `-x` now ship. That is the point — the runtime already always-loads them — but it increases artifact size.\n- The transitive-walk change keeps hard `dependencies` of shipping packages. The original filter existed to stop optional plugin *peer* trees bloating the bundle (`@solana/codecs*` nested 8 levels) and tripping `assertTarSafeRuntimePaths`; that protection is preserved by scoping the drop to non-`required` edges only.\n- `plugin-inbox` is deliberately **not** added to `@elizaos/agent` dependencies — that would close `agent → plugin-inbox → app-core → agent`. Verified: it still reaches the bundle transitively.\n- The window-resize behaviour is desktop-only (`isElectrobunRuntime()` guarded) and web is unaffected.\n\n# Background\n\n## What does this PR do?\n\nMakes the packaged desktop app actually render its UI. Five defects, all the same shape — **a package ships without something it imports eagerly**:\n\n| # | Defect | Fix |\n|---|---|---|\n| 1 | Shell statically imports externalized `plugin-local-inference/voice-wake` → dies before any window exists | Lazy import from the packaged runtime dist, mirroring `importPermissionProbersModule` |\n| 2 | `isRuntimePluginPackage()` matches **any** scoped `plugin-*`, dropping `@octokit`/`@jimp`/`@milkdown` deps → agent crash-loops | Scope to `@elizaos/*` |\n| 3 | `MOBILE_VIEW_PLUGINS` are always loaded but never bundled | Add to the bundled baseline |\n| 4 | Transitive walk drops **hard** deps of shipping packages | Only drop non-`required` edges |\n| 5 | Chat overlay lays out at `y=-50` in a 140px window and is clipped away | Grow the window while the overlay is open |\n\n**3 and 4 are the direct cause of the blank UI:** the failed app-route tail pinned `/api/health` `startup.phase` at `\"degraded\"`, and the desktop boot gate advances only on `phase === \"running\"` — so the renderer's coordinator sat in `starting-runtime` and never mounted.\n\nTwo smaller fixes fall out of #2: prune `__image_snapshots__` (its generated basenames blow the tar-safe path limit) and exempt `viem/_cjs/actions/test`, whose pruning broke `plugin-wallet`.\n\n## What kind of change is this?\n\nBug fixes (non-breaking).\n\n# Documentation changes needed?\n\nNo. The intended behaviour is already documented in `packages/app-core/platforms/electrobun/docs/desktop-window-lifecycle.md`; this makes the implementation match it.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/ui/src/App.tsx` → `useChatOverlayWindowHeight`. That is the fix that turns a healthy-but-invisible app into a visible one. Then `runtime-package-manifest.ts` for the scope bug.\n\n## Detailed testing steps\n\n```bash\nbun install\nbun run --cwd packages/app-core/platforms/electrobun build\nrm -rf /Applications/Eliza-dev.app\nditto packages/app-core/platforms/electrobun/build/dev-macos-arm64/Eliza-dev.app /Applications/Eliza-dev.app\nopen -a /Applications/Eliza-dev.app\n```\n\nThen verify:\n1. `curl -s localhost:31337/api/health` → `startup.phase: \"ready\"`, `app-route-tail: \"complete\"`, `plugins.failed: 0`\n2. A thin bar appears bottom-centre of the screen (96×6px, 25% opacity — dockless by design)\n3. Click it → the chat overlay opens with composer, mic, screen-share and send controls\n4. Close it → the window returns to the 140px resting bar\n\nThree regression tests were each **verified to fail when their fix is reverted**, not just to pass:\n- `bundle-third-partys.test.ts` — scans all 134 shell sources for static imports of third-partyized packages\n- `runtime-package-manifest.test.ts` — the `@elizaos/*` scope boundary\n- `release-plugin-policy-view-plugins.test.ts` — always-loaded plugins ship, and the cycle exclusion holds\n\n# Evidence Gate\n\n\u003c!-- evidence-head:d7009cce79b4de7f0692dcc5f88e3fdaa39dda3b --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - the pre-fix surface renders nothing: the chat overlay lays out at y=-50 in a 140px window and is clipped entirely off-screen, and the resting window is transparent + click-through so a capture shows only the desktop behind it. The before state is evidenced as live DOM geometry in Evidence Details.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/19997-after-overlay.jpg)\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - transparent click-through always-on-top window; screen recording captures the desktop behind it, not the window. The full open/close cycle is captured as live window-bounds + DOM-rect measurements in Evidence Details, which directly evidence the off-screen-layout bug.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs below.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] Renderer console + DOM probes below.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] N/A - no agent, action, provider, prompt, or model behaviour changed. This is packaging policy plus one window-geometry effect.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Packaged-bundle contents below (the artifact this PR changes).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [ ] N/A - no rendered text changed; the diff adds no copy, styling, or layout to any component.\n\n# Evidence Details\n\n## Backend logs\n\n\u003cdetails\u003e\u003csummary\u003eBefore — agent crash-loop (5 attempts, then gives up)\u003c/summary\u003e\n\n```\n[Agent][stderr] [eliza] Failed to start CLI: ResolveMessage: Cannot find module\n  '@octokit/plugin-request-log' from '.../@octokit/rest/dist-src/index.js'\n[Agent] Child process exited unexpectedly with code 1 (pid: 30051)\n[Agent] Scheduling automatic restart after crash (attempt 3/5) in 4000ms\n[Agent] Child process exited with code 1 before becoming healthy\n```\n\n`~/.config/Eliza/startup-status.json`:\n```json\n{ \"state\": \"error\", \"phase\": \"startup_failed\",\n  \"lastError\": \"Child process exited with code 1 before becoming healthy\" }\n```\n\nAnd after that was fixed, still degraded:\n```\n[eliza] post-ready boot tail failed: Cannot find module '@elizaos/plugin-calendar'\n  from '.../@elizaos/plugin-personal-assistant/dist/routes/lifeops-routes.js'\n{\"startup\":{\"phase\":\"degraded\"},\"deferredBoot\":{\"phases\":{\"app-route-tail\":\"failed\"}}}\n```\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eAfter — healthy\u003c/summary\u003e\n\n```\nready: True | phase: ready | plugins: {'loaded': 27, 'failed': 0} | tail: complete\nCannot find module errors: 0\n```\n\nShell startup:\n```\n[Main] Starting Eliza (Electrobun)\n[WebGPU] Native Dawn runtime ready\n[Renderer] Static server on http://127.0.0.1:5174\n[Main] Dockless startup — pill only, Dock icon hidden at rest\n```\n\u003c/details\u003e\n\n## Frontend logs + DOM\n\nThe renderer's startup coordinator, before and after:\n\n```\nBEFORE: restoring-session → resolving-target → polling-backend → starting-runtime  [STUCK]\nAFTER:  restoring-session → resolving-target → polling-backend → starting-runtime\n                          → hydrating → ready\n```\n\n### Before\n\nOverlay laid out **above the top edge of the window** and clipped away:\n\n```json\n{\"winH\":140,\"overlay\":{\"y\":-50,\"h\":120,\"w\":1492},\"ovlVis\":\"visible\",\"ovlOpacity\":\"1\"}\n```\n\n`y: -50` with `winH: 140` — the entire chat surface renders outside the window. Note `visibility: visible` and `opacity: 1`: the DOM was correct and interactive the whole time, which is exactly why this presented as \"the app opened but nothing is there\".\n\n### After\n\nResting:\n```json\n{\"bounds\":{\"x\":0,\"y\":768,\"width\":1512,\"height\":140}}\n{\"winH\":140,\"overlayMounted\":false,\"phase\":\"idle\"}\n```\n\nOpen (one click on the pill):\n```json\n{\"bounds\":{\"x\":0,\"y\":88,\"width\":1512,\"height\":820}}\n{\"winH\":820,\"y\":480,\"h\":220,\"clipped\":false,\n \"controls\":[\"Close Eliza\",\"Eliza assistant\",\"Close assistant\",\n             \"Message Eliza\",\"Start voice input\",\"Show Eliza my screen\"]}\n```\n\nClosed again — returns to the resting bar:\n```json\n{\"bounds\":{\"x\":0,\"y\":768,\"width\":1512,\"height\":140}}\n{\"phase\":\"idle\",\"winH\":140,\"overlay\":false}\n```\n\nComposer accepts input:\n```json\n{\"value\":\"hello\",\"tag\":\"INPUT\"}\n```\n\nScreenshot of the opened overlay (close ×, mic, screen-share, send) is attached below.\n\n## Domain artifacts — packaged bundle\n\nThe artifact this PR changes:\n\n```\nBEFORE                          AFTER\n@octokit/plugin-request-log     MISSING   →   BUNDLED\n@octokit/plugin-paginate-rest   MISSING   →   BUNDLED\n@elizaos/plugin-calendar        MISSING   →   BUNDLED\n@elizaos/plugin-inbox           MISSING   →   BUNDLED  (transitively, no cycle)\n@elizaos/plugin-notes           MISSING   →   BUNDLED\n@elizaos/plugin-task-coordinator MISSING  →   BUNDLED\n@elizaos/plugin-blocker         MISSING   →   BUNDLED\n@elizaos/plugin-goals           MISSING   →   BUNDLED\n```\n\nPost-release exclusion list now contains **only** `@elizaos/*` packages — no exter les lowercase `think` tags. This misses:\n1. Mixed-case tags: `\u003cThink\u003e`, `\u003cTHINK\u003e`, `\u003cThInK\u003e`\n2. Other reasoning tags: `\u003creasoning\u003e`, `\u003creflection\u003e`, `\u003cthought\u003e`, `\u003cantthinking\u003e`\n3. Open-only tags (unclosed): `think...` without `\u003c/think\u003e`\n4. Whitespace variants: `\u003c think \u003e`, `\u003c /think \u003e`\n5. The evaluator's `thinking: \"off\"` is only a hint; models may still emit reasoning\n\n### The Fix\n\n- Made `stripReasoningArtifacts` delegate to `sanitizeOutboundText`\n- Extended the shared sanitizer to recognize mixed-case and whitespace\n  variants for all 8 tag families: `think`, `thinking`, `reasoning`,\n  `reflection`, `thought`, `antthinking`, `tool_call`, `function_call`\n- Preserved open-only removal and code-fence/inline-code protection\n- Added close-only recovery for all machine-syntax families\n- Sanitized evaluator `messageToUser` output even when `thinking: \"off\"`\n\n### Tests\n\n- `reasoning-tag-residue.test.ts`: Parameterized bun:test suite\n- `verify-reasoning-tags.mjs`: Dependency-free Node verification harness\n\n\u003c!-- gitarmy-claim:shabbydev --\u003e3a:T2eee,"])</script><script>self.__next_f.push([1,"# Relates to\n\nRelates to #14864 — this implements only the authenticated commitment regret-audit read-surface slice. Ingestion hooks, BRIEF/PRIORITIZE consumption, standing guarantees, and live-model scenarios remain open.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [x] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Contribution provenance\n\n\u0 rrent develop; exact-head cancellation/disclosure tests and diff validation pass, while hosted package/repository gates remain required.\n- [x] A reviewer can confirm the change from the attached focused test, PGLite,\n      latency, and live-model evidence.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: yes\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: openai/gpt-5.6-sol\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: codex\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: self-reported\n\n# Sync with develop\n\n- [x] Rebased onto `origin/develop` at `9a0120bd3927919e06ebd80a3aefaf83004b5a2b`; zero conflicts.\n- [x] Preserved Shaw's follow-up lifecycle-hardening commit and authorship.\n- [x] The current exact head is linear and range-diff/patch-ID identical to the reviewed five-commit series.\n\n# Risks\n\nMedium. This removes active provider-owned deadline behavior and the global\nprovider-deadline switch. The exported `Provider.timeoutMs`, `Provider.timeoutMode`, and telemetry\n`deadlineExceeded` fields are removed because they no longer describe a\nsupported runtime policy. Slow providers remain observable failures, and provider authors must\ncooperate with the execution signal for prompt resource cleanup. The runtime\nstill releases a canceled caller promptly when a provider does not cooperate,\nwhile preserving the merged #17604 coalesced-waiter rules.\n\n# Background\n\n## What does this PR do?\n\n- Removes provider-local wall-clock deadlines, timeout modes, degraded timeout\n  results, and `ELIZA_COMPOSE_PROVIDER_TIMEOUT_MS`.\n- Gives every shared provider execution a lifecycle-owned abort signal and\n  stops awaiting non-cooperative work when the last caller leaves or the\n  runtime stops, while keeping detached promises observed.\n- Prefers the message path's merged host/client owner signal over the raw room\n  signal and runs nested provider/model work under the shared execution signal,\n  so canceling the creator cannot terminate work still owned by another waiter.\n- Suppresses provider-internal model streaming while retaining that execution\n  signal, preventing private context-generation tokens from entering a caller's\n  visible reply stream.\n- Treats provider-originated `AbortError` and `TimeoutError` as ordinary\n  provider failures unless an owner signal actually aborted.\n- Rechecks owner cancellation before sensitive disclosure work and cache\n  mutation, preventing canceled work from populating state caches.\n- Removes the dead timeout declarations and reports the measured span ratio as\n  `providerSpanOverlap`, not misleading \"effective parallelism.\"\n\n## What kind of change is this?\n\nBug fix removing the obsolete deadline policy and its dead public declarations.\n\n# Documentation changes needed?\n\nYes. `packages/docs/runtime/providers.mdx` now documents lifecycle-owned\ncancellation, coalesced waiter semantics, runtime shutdown, and the absence of\nprovider-local deadlines or fabricated degraded timeout context.\n\n# Testing\n\n## Where should a reviewer start?\n\nStart with `packages/core/src/runtime.ts`, then the cancellation regressions in\n`packages/core/src/__tests__/compose-state-provider-execution.test.ts` and the\nlatency report contract in `packages/core/scripts/provider-latency-report.ts`.\n\n## Detailed testing steps\n\nRun with Bun 1.3.14 and Node 24.15.0:\n\n```bash\nbun test \\\n  packages/core/src/__tests__/compose-state-provider-execution.test.ts \\\n  packages/core/src/__tests__/compose-state-disclosure-gate.test.ts\nbun run --cwd packages/core typecheck\nbun run --cwd packages/agent typecheck\nbun run --cwd packages/core lint\nbun run --cwd packages/agent lint\nbun run --cwd packages/docs test quired before merge.\n## Maintainer history-only linearization at bc57f0d4ca4ac7d7170257d7ea84da6245b7bffc\n\nThe contributor merged `develop@6f18a97d5d32c8c2edc6fe4fbcf231e86e503ab5` into the PR, creating merge head `6ebc7bf5c0efc0db08f7d1797752e0d0da3e8888`. The maintainer replayed the existing five commits linearly on that exact base. `git range-diff` reports all five patches identical, and `git diff 6ebc7bf... bc57f0d...` is empty, so this correction changes history only.\n\nAI provider/model: openai / gpt-5.6-sol\nClient / agent tooling: codex\nContribution skill revision: elizaOS/eliza@51d235760e9d6e97853f9b07b430ba1925f2aee9:packages/skills/skills/contribute-to-eliza\nAttribution status: self-reported\n— [codex-review]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5.6-sol\",\"client\":\"codex\",\"skill_revision\":\"elizaOS/eliza@51d235760e9d6e97853f9b07b430ba1925f2aee9:packages/skills/skills/contribute-to-eliza\"} --\u003e\n\nAI provider/model: openai / gpt-5.6-sol\nClient / agent tooling: codex\nContribution skill revision: elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza\nCompute receipt: 29361173 project-attributed tokens (bounded; device-signed, locally reported)\nAttribution status: self-reported\n\u003c!-- elizaos-contribution-attribution:v2 {\"provider\":\"openai\",\"model\":\"gpt-5.6-sol\",\"client\":\"codex\",\"skill_revision\":\"elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"1\",\"run_id\":\"run_01KZX6V5SF1ZVBM0CSWWTCABV5\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-08-13T09:21:53.967Z\",\"completed_at\":\"2026-08-13T10:18:00.927Z\",\"skill_sha256\":\"7318f8392eba7a5888573a69ff936b0fe4496c501bf40bfebb339afc76c1d8d6\",\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"bounded\",\"input_tokens\":527341,\"output_tokens\":43816,\"cache_creation_tokens\":0,\"cache_read_tokens\" e fix keys on **shape** — *any read scoped to the user's notes* — instead of adding three more phrasings, because enumerating just moves the bug to the next wording a user invents. It also names the wrong destinations explicitly: documents, files and database do not index notes, so they answer \"nothing found\" rather than \"wrong tool\".\n\n## Design notes\n\n- `NOTES` wraps the **same** `NotesService` the view uses — one record, one store. No second persistence path.\n- `SAVED_NOTES` renders that same snapshot into turn context, so recall needs no memory write. Deliberately **not** mirroring note text into a memory record: that copy would survive an edit or a delete.\n\n## Evidence\n\n\u003c!-- evidence-head:20b989b97c3cfab31cabf27aff2b85091be0364c --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - no UI change; the views surface is untouched\n\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - no UI change; the views surface is untouched\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - chat-surface behavior; the observable change is which action runs\n\n\u003c!-- evidence-row:backend-logs --\u003e\nLive trajectory for \"search my notes for the wifi\" — 10 stages, and the actions that ran were documents/files/database, never NOTES:\n\n\u003cdetails\u003e\n\u003csummary\u003eobserved routing on the failing turn\u003c/summary\u003e\n\u003cpre\u003e\nstage1 candidateActionNames: [\"SEARCH_DOCUMENTS\"]\nstage1 contexts:            [\"documents\"]\nactions seen in trajectory:  ATTACH_TO_CHAT, CONTACT, DATABASE, DOCUMENT,\n                             EXPERIENCE, FILES, HANDLE_RESPONSE, IGNORE\noccurrences of \"NOTES\" in the whole trajectory: 0\ntool text: no notes found matching \"wifi\"\n\u003c/pre\u003e\n\u003c/details\u003e\n\nThe same agent had, minutes earlier, itself listed \"wifi router details\" among the user's saved notes — so the contradiction was visible to the user.\n\n\u003c!-- evidence-row:frontend-logs --\u003e\nN/A kes the root package-test orchestrator (`packages/scripts/run-all-tests.mjs`) fail closed on empty or unobserved tasks via an exactly-once, machine-readable result contract:\n\n- **Result ledger**: every resolved task produces exactly one record — `{label, packageName, relativeDir, scriptName, status: pass|skip|fail, observed, exitCode, signal, timedOut, durationMs, counts{tests, executed, failures, errors, skipped}, skipReason|failReason}` — printed as `[eliza-test] RESULT {...}` per task plus a `[eliza-test] RESULTS tasks=… pass=… fail=… skip=… excluded=… unobserved=…` summary, and written as JSON to `ELIZA_TEST_RESULTS_FILE` when set.\n- **Exactly-once enforcement**: a green run with a missing or duplicate record for any resolved task is a protocol violation → exit 3. (These invariants cannot be violated from outside the process, so a documented `ELIZA_TEST_FAULT_INJECT=duplicate-record|drop-record` knob exists solely for the deterministic fault-injection tests.)\n- **All-skipped guard**: under `--require-work`, a lane where every resolved task skipped exits 3 with a distinct diagnostic instead of relying only on the aggregate executed-tests floor.\n- **Timeout**: `TEST_TASK_TIMEOUT_MS` (0 = off, validated) bounds each child; a timed-out child is killed (SIGTERM, SIGKILL after 10s) and recorded as a **failure** with `timedOut: true`, never a skip — even if it exits 0 during the grace window.\n- **Explicit designed exclusions**: `--no-cloud` skips, empty-vitest-lane skips, and the pr-lane homepage e2e carve-out are recorded as `excluded` entries in both plan and run modes, mechanically distinct from passes.\n- **Failure reporting**: serial fail-fast now flows through the same recorded-failure exit boundary as the pooled path (label + reason), instead of an unhandled top-level rejection.\n\nUnobserved exit-0 wrappers keep their existing aggregate `--require-work` guard but are now individually marked `observed: false` in the ledger so downstream gates can reconcile - [x] A reviewer can confirm the change from the exact-head browser evidence attached below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `openai/gpt-5.6-sol`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Codex`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/eliza@6da03dd64ccbc643756fdfbc4250dc73b189be78:packages/skills/skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Rebased onto `c7a1d61345d3a24a34589dd0f62ffd0f628d0715`, the latest `origin/develop` at push time; zero conflicts.\n- [x] `bun run verify` passes post-sync on the canonical Node 24 / Bun 1.3.14 toolchain.\n\n# Risks\n\nLow. The change is limited to the billing-success route and its colocated component test. A keyed verification-attempt child remounts only when the effective request identity changes (authenticated user id, `session_id`, or normalized `from=settings` source). It does not change checkout creation, the verification API, balances, ledgers, provider calls, credentials, deployment, staging, or production resources.\n\n# Background\n\nThe fresh-mount truthfulness matrix merged in #20100, but React Router can reuse the mounted component when only search parameters change. A successful result for checkout session A could therefore remain visible after in-place navigation to unverified session B; the same stale-result risk existed when authenticated identity changed.\n\n## What does this PR do?\n\n- Keys a verification-attempt child to the authenticated user id, `session_id`, and normalized request source actually sent to the API. A committed key change mounts a fresh pending attempt; a concurrent render that is suspended and abandoned cannot mutate the committed attempt.\n- Keeps every mutable request/generation ref inside committed effects and callbacks; render performs no ref mutation.\n- Invalidates the old generation during effect cleanup/unmount, and requires both key and generation to match before a callback can settle state, so late A cannot overwrite B or update an unmounted attempt.\n- Uses a deliberately narrow runtime outcome discriminator: only a non-null object whose `success` field is exactly `true` is accepted. This is not complete DTO validation; null, primitive, malformed, and resolved-false 2xx payloads fail closed to `Payment Issue`.\n- Adds real-router and React Query-compatible callback regressions for missing→A, A→B, user A→B, success X→missing→X, logout/login as the same user, effective source changes, stale A completion after B, unmount cleanup, StrictMode, invalid runtime payloads, and an interrupted React 19 transition that renders the billing route before suspending, while retaining the original six states.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNo. This corrects existing billing-success behavior and does not alter a public API or documented workflow.\n\n# Testing\n\n## Where should a reviewer start?\n\nStart with `packages/ui/src/cloud/billing/BillingSuccessPage.test.tsx`, especially the suspended/interrupted transition, same-X re-entry, in-place session, identity, stale-completion, and malformed-payload cases. Then inspect the keyed child and effect-only generation fence in `BillingSuccessPage.tsx`.\n\n## Detailed testing steps\n\nExact Node `v24.15.0` / Bun `1.3.14` receipts:\n\n- Focused component regression: 20/20 passed.\n- Entire `src/cloud/billing` suite: 46/46 passed across 6 files.\n- UI TypeScript: `tsc --noEmit -p tsconfig.json` passed.\n- Targeted Biome check on both changed files passed.\n- `bun run audit:ui-determinism` passed with the existing baseline (`render-time=36`, `deferred=280`, `module=210`; no new finding).\n\nPost-sync canonical toolchain recei rest of the [#20045](https://github.com/elizaOS/eliza/issues/20045) gap table: **R3, R4, R5, U1, U2, U6**.\n\n## Root cause, restated\n\nThe issue named two sources of truth that never reconcile: config declares which capabilities route to Cloud, and a linked credential decides which of them can actually be served. #20124 made the *reported* provider honest. It did not join the two sources, so each surface was still left to re-derive that state on its own — or, in four places, not derive it at all.\n\n## R3 / R4 — one reconciliation instead of two unlinked gates\n\n`resolveElizaCloudTopology` now returns `servicesUnreconciled`: the Cloud-routed capabilities that cannot be served because nothing is linked. That is precisely the shared state the auto-enable gate (capability-only, no key) and the chat-brain registration gate (key required) lacked. The host logs a warning naming those capabilities at startup, so the silent fallback finally leaves a trace.\n\nIntent is preserved separately from capability — `services.inference` still reports what the routing entry says.\n\n## R5 — `routed`, distinct from `status`\n\n`GET /api/local-inference/active` gains `routed`. `status` answers *\"is a model loaded?\"*; `routed` answers *\"is local the path requests take?\"*. They diverge in exactly the state the issue reported: with cloud-proxy configured and no credential, local is the only provider that can serve while the model loads lazily, so the snapshot read `idle` while local was the active path. Absent rather than guessed when the config cannot be read.\n\n## U1 / U2 — reconciled at source\n\n`isCloudSelected` and `cloudCallsDisabled` are reconciled inside `useProviderSelection` rather than leaving every consumer to remember to qualify them with `elizaCloudConnected` — forgetting once is how the Cloud tile came to be marked current while local answered. Config intent stays available as `isCloudConfigured` for the surfaces that must show what was *chosen* rather than what is *serving*.\n\n## U6 — provider indicator on the chat surface\n\nNew `ServingProviderChip` in the composer, mounted on both `ChatView` and `ChatOverlay`. It reads the same reconciled axes as Settings, so the two cannot disagree, and renders nothing until the serving source is known — a chip that guesses is worse than no chip.\n\n## Also fixed: three red gates on develop\n\nAll three reproduce on `develop` with this branch's changes stashed. Fixed here rather than described as someone else's problem:\n\n- **`@elizaos/core#lint:check`** — a `String.raw` on an escape-free alternation, and a string concatenation in an attachment test. Mechanical; the regex keeps its exact pattern and the test its exact URL.\n- **`ChatOverlay.test.tsx`** — #20024 renamed the composer placeholders `\"Ask\"` → `\"Message\"` in the component without updating the two assertions pinning them. The component is the intent; the test now follows it.\n- **`useServingAxes`** — reading `startupCoordinator.target` unguarded crashed three `ChatView` render-window tests once the chip pulled the hook onto the chat surfaces, whose harnesses seed only the store slice they exercise.\n\n## Evidence\n\nAgainst the real modules, using the repro config from the issue verbatim, no Cloud account linked:\n\n```\nR5  GET /api/local-inference/active = {\"modelId\":null,\"loadedAt\":null,\"status\":\"idle\",\"routed\":true}\nR3/R4 services.inference (intent)   = true\nR3/R4 linked (capability)           = false\nR3/R4 servicesUnreconciled          = [\"inference\"]\nR3/R4 once linked, unreconciled     = []\n```\n\nU6 confirmed live in the packaged desktop app — renderer rebuilt from this branch (`eliza-renderer-build.json` pins commit `e3d80f5`), running against an isolated profile so the existing install was untouched. The composer shows **⛁ On device**, correctly reporting local while Cloud is configured-but-unsigned:\n\n![u6 chip](https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/20148-20125-u6-chip-desktop.jpg)\n\nSettings, from `audit:app` — desktop and mobile:\n\n![settings desktop](https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/20148-20125-audit-s-desk.jpg)\n![settings mobile](https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/20148-20125-audit-s-mob.jpg)\n\n[runtime log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/20148-20125-runtime.log) · [audit summary](https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/20148-20125-audit-summary.log)\n\n### Checks\n\n- **`bun run verify` — 351/351 tasks, exit 0** (first fully green run on this branch; the `@elizaos/core` lint failure that dogged #20124 is fixed here)\n- `packages/ui` — 4539 pass, 7 skipped, 0 fail\n- `packages/shared` / `plugin-local-inference` / `packages/agent` — 34 pass\n- `packages/core` — touched test 12 pass\n- `audit:app` — 219 passed, **broken=0 needs-work=0**, 216 views OCR-triaged\n- `tsc --noEmit` clean; `check:i18n` and `check:agents-claude` exit 0\n\n## Not exercised live\n\nThe backend halves (R3's startup warning, R5's `routed` over HTTP) are proven by unit tests and a direct run against the real modules, but **not** against the packaged desktop binary: `sync-desktop-renderer.mjs` only refreshes the renderer, so Eliza-dev's `eliza-dist` predates them. Re-running the issue's manual repro against a current build will still show the old `/api/status` and no `routed` field until the agent dist is rebuilt.\n\nHosted-Cloud runtime and Cloud Overview remain unit-tested only — both need a provisioned Cloud agent and a signed-in account.\n\nRefs #20045\n\n\u003c!-- evidence-head:40e7f5d62e51fde763bce0b40c08ff30e505b0be --\u003e\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/20148-pr20148-after-chat.png)\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] https://github.com/elizaOS/eliza/releases/download/pr-evidence-6/20148- velope parsing or reaches egress (#20069)\n$ git status\nOn branch fix/discord-thread-chunk\nnothing to commit, working tree clean\n```\n\n# Risks\n\nLow. Refactors `postToConnectorThread` to route through the shared outbound contract (dedupe, per-chunk persistence, partial-delivery reporting) instead of a second bare send loop. Previously only `lastSent` was kept and only the final chunk was persisted; if chunk 1 succeeded and later chunk failed the method threw as if nothing delivered, causing caller retry to duplicate. Now accepted prefix is persisted, `discord:outbound-partial-delivery` is reported, and the partial receipt is committed to the dedupe map so retries do not duplicate. Webhook identity (`username`/`avatarURL`/`threadId`) is preserved in the chunk loop. Short messages (single chunk) are unchanged.\n\n# Background\n\n## What does this PR do?\n\nRefactors `plugins/plugin-discord/service.ts:postToConnectorThread` from two bare `for (chunk of chunks) send` loops that kept only `lastSent` into the canonical delivery contract used by the normal `send` path:\n\n- `beginDiscordOutboundDelivery({ accountId, channelId: threadId, text })` reservation with `in_flight`/`duplicate` handling\n- ordered `chunkDiscordText(text)` chunks each `\u003c=2000` chars\n- per-chunk `try/catch`: push accepted to `sentMessages`, on later failure break and `reportError(\"discord:outbound-partial-delivery\", ...)` instead of throwing as zero-delivered\n- `createDiscordMessageMemoryOnce` for **each** accepted `Message` plus `buildDiscordSendReceipt` / `reservation.commit(deliveryKind, receipt)` (partial vs delivered)\n- webhook and bot fallback share the same loop; webhook `send({ content: chunk, threadId, username, avatarURL })` identity params are forwarded per chunk\n\nThis satisfies the REFACTOR_AND_LEAVE blocker: no second send loop, webhook identity preserved, partial delivery is recorded without duplication.\n\n## What kind of change is this?\n\nBug fixes (non-breaking chan ew catalog.\n\n**`plugins/plugin-personal-assistant/src/lifeops/scheduled-task/candidate-backstop.ts`**\n- `OWNER_ROUTINES`/`OWNER_REMINDERS` added to the backstop's action names (the fabricated-claim recovery path picks targets from this list), matcher extended for recurring cadences and past-tense \"scheduled\" claim shapes.\n\n**`packages/agent/src/api/chat-augmentation.ts`**\n- Keyword BM25 similarity is max-normalized within each result set (the best hit is ALWAYS 1.0), so the threshold was a relative rank cut, not a relevance gate. Injection now additionally requires ≥50% literal coverage of the query's meaningful (non-stopword) terms in the fragment; all-stopword queries never inject. Deliberately local to this boundary — `normalizeBm25Scores`/`tokenize` are untouched, so hybrid search's 0.6/0.4 blend is unchanged.\n\n## Deterministic tests (all per issue AC)\n\n- The exact push-up turn resolves `OWNER_ROUTINES` when registered and `{names:[],kind:null}` when not — never VIEWS.\n- \"3 times a day\", \"whats 17 times 23?\", \"i need to get the time for the meeting\" produce no candidate.\n- \"show my screen time\", \"whats my screen time\" (ack-promotion fence at live-regression :1170), \"list views\", bare \"settings\", \"move my settings to the right\" all keep their VIEWS routing.\n- Workout query vs seeded navigation FAQ: no injection; genuine \"how do i switch views?\" still injects.\n- Two fences that pinned the buggy behavior were deliberately rewritten as the issue's plan specifies.\n\n## Test results\n\n- `packages/core`: direct-action-heuristics 58 pass; message-routing-live-regression 69 pass; full `src/services/message` + stage1 lane 711 pass, 1 fail — **pre-existing** (`does not re-add generic inferred actions after an evaluator clears the candidate route`), reproduced identically on clean `develop` in the same environment via `git stash`.\n- `packages/agent`: chat-augmentation 17 pass, access-context 4 pass.\n- `plugin-personal-assistant`: new candidate-backstop suite 6 pass.\n- Typecheck: touched files clean in core/agent/PA (remaining package errors are pre-existing unbuilt-sibling-dep noise, unchanged by this PR).\n- Biome clean on all touched files.\n\n## Residual risk\n\nThe deterministic layer cannot forbid a MODEL-emitted VIEWS candidate (those escalate by design), and the VIEWS action's broad domain tags / routingHint prose (sibling scope, #17026/#17029 overlap) still influence live Stage-1 prompts — full live-trajectory proof of the transcript remains for the epic's live lane. Retrieval-side `CANDIDATE_ACTION_PARENT_ALIASES` OWNER_ prefix aliasing (action-retrieval.ts) is tracked on the issue and intentionally not bundled here.\n\nFixes #17028\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"53:Tfba,"])</script><script>self.__next_f.push([1,"## What\n\nClient-side remainder of #18814 (the server-side atomic settle/expire transitional core already landed in #19227; provider checkout-lifetime binding and webhook semantics remain with that PR's author per their follow-up note).\n\nOn the hosted public payment-request page (`packages/ui/src/cloud/public-pages/pages/payment/payment-request-page.tsx`):\n\n- **Generation-keyed, aborted loads** — each route load bumps a monotonic generation and carries an AbortController; a stale response (or error) for request A can no longer overwrite request B's amount, status, or hosted checkout URL, so a Pay click cannot redirect to the wrong request.\n- **Deadline-derived Pay eligibility** — `canPay` now requires an unpassed `expiresAt` in addition to a payable status; a timer re-evaluates eligibility exactly when the deadline passes so an open tab flips to Expired/disabled instead of staying payable.\n- **Pre-checkout revalidation** — clicking Pay refetches the request and only navigates when the fresh response is still payable, unexpired, and has a hosted URL; otherwise the page re-renders the authoritative forcement** (`packages/cloud/shared/src/lib/services/gateway-discord/dm-policy.ts`, wired into `event-router.ts` `handleMessageCreate`): every direct message (no `guild_id`) is gated before any character lookup or runtime creation. `disabled` admits nobody; `allowlist` admits owners + `dmAllowFrom`; `pairing` admits owners only (the gateway has no pairing flow); unset/`open` preserves the historical open-DM behavior so existing connections are unaffected.\n- **Cloud Discord Gateway Bot form** (`packages/ui/src/cloud/connectors/discord-gateway-connection.tsx`): DM Policy select and Allowed DM User IDs input on both the create and edit forms, with client-side snowflake validation (invalid lists are rejected with a toast, never silently persisted). Selecting Open omits the field, which clears the stored policy because the PATCH route replaces metadata wholesale.\n- **Docs**: new metadata fields documented in `packages/cloud/services/gateway-discord/README.md`, mapped to their agent-plugin equivalents (`ELIZA_DISCORD_OWNER_USER_IDS_JSON`, `DISCORD_DM_POLICY`, `DISCORD_ALLOW_FROM`).\n\nPer the reopen note on the issue: no UI control here is a no-op — the policy fields ship atomically with the router-side gate.\n\n## Tests\n\n- New `packages/cloud/shared/src/lib/services/gateway-discord/__tests__/dm-policy.test.ts`: real `isDmSenderAllowed` + real Zod schema, no mocks — policy/schema coverage for unset/open/disabled/pairing/allowlist, owner-array handling, empty-allowlist fail-closed, and snowflake-format rejection.\n- New `dm-policy-routing.test.ts`: exercises the real `routeDiscordEvent` boundary and proves denied senders stop before character/runtime creation while admitted owners continue into routing.\n- `bun test src/lib/services/gateway-discord/__tests__/` in `packages/cloud/shared`: **109 pass / 0 fail** (dm-policy, routing, event-router, schemas).\n- `bun run typecheck` in `packages/cloud/shared` and `packages/ui`: pass.\n- Biome check on touched files: clean.\n- e for narrowly creating the missing canonical wildcard certificate/DNS resources;\n- authenticates the selected scope in reviewed-plan metadata so apply must select the exact reviewed scope;\n- validates the decrypted saved plan before apply and rejects imports, updates, deletes, replacements, out-of-scope actions, and vacuous no-create plans;\n- derives post-apply refresh and state verification targets from the exact reviewed plan, preventing unrelated Pages drift from being written into remote state; and\n- preserves full live routing verification after apply.\n\nThe PR requires independent review before merge. The protected plan/apply and live infrastructure evidence listed below are post-merge operator gates; no apply is authorized by making this PR review-ready.\n\n## Why\n\nThe exact-current-main production plan in run 31912024590 correctly exposed unrelated legacy drift: 23 imports, 19 changes, and a forced tunnel-DNS replacement. Applying that full plan would violate #19627's additive-only safety boundary.\n\nTerraform `-target` alone is not an additive guarantee: a targeted resource may still plan an update, delete, or replacement, and an unscoped `terraform refresh` writes observations for unrelated resources into state. This stack closes both gaps mechanically before the protected apply boundary.\n\nThe exceptional scope permits only:\n\n- `cloudflare_certificate_pack.canonical_edge[...]` resources selected as new generations;\n- the current environment's `*.sites.eliza.app` or `*.sites-staging.eliza.app` wildcard DNS instances; and\n- `create` or `no-op` actions, with at least one actual creation and no Terraform import metadata.\n\nExisting managed-agent wildcard DNS, Pages bindings, legacy redirects, Railway tunnel records, canonical service records, every import, and every update/delete/replace action remain outside the scope. [Terraform plan JSON records imports independently as `change.importing`](https://developer.hashicorp.com/terraform/internals/json-format), so the validator rejects that field before treating `no-op` resources as inert.\n\n## Sync with develop\n\n- [x] Exact head: `0b8abb1690d21028de5bcd8c1ba429689e77f6ee`.\n- [x] Rebased conflict-free onto `origin/develop@6799165963a2457cc80cce47af6c5a2edb0672f4`.\n- [x] Range-diff confirms the original scope patch and additive-safety repair are patch-identical after rebase.\n- [x] No Terraform apply, deployment, environment approval, or external-state mutation was performed during review/handoff.\n\n## Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `openai/gpt-5.6-sol`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Codex Desktop`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/eliza@6799165963a2457cc80cce47af6c5a2edb0672f4:packages/skills/skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n## Risk and security boundary\n\nHigh-consequence but tightly scoped. The workflow can mutate protected Cloudflare infrastructure only after the existing environment approval and encrypted reviewed-plan handoff. The new pre-apply validator fails closed if the saved plan contains any actionable resource outside the two allowed families or any non-create action. Post-apply polling targets only addresses recovered from that validated saved plan; it never performs a whole-root refresh.\n\nFull convergence remains the default. This scope must not be used to conceal destructive drift, which remains visible in the separately reviewed full plan.\n\n## Exact-head validation\n\n- `bun test packages/scripts/__tests__/terraform-additive-plan-workflow.test.ts packages/scripts/__tests__/cloud-deploy-environment-contract.test.ts packages/cloud/infra/tests/terraform-static.test.ts` — `44` pass, `0` fail, `481` expectations.\n
