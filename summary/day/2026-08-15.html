ack:\n\n1. a completed tool's own undelivered `userFacingText` — the outcome the turn actually produced and the planner failed to relay;\n2. **silence**, when an action already delivered visible text through its own callback (a trailing ack would be a redundant, out-of-order second bubble);\n3. the ack, **only** when an action flagged `asyncHandoff` actually executed this turn — that work continues after the turn returns, so \"on it\" is honest and the real result arrives in a later message;\n4. otherwise a plain statement that the work produced nothing reportable.\n\nReuses the existing `asyncHandoff` gate (the same structural flag that licenses the Stage-1 pre-planner early ack) rather than adding a parallel mechanism. `candidateActionsIncludeAsyncHandoff` now serves both call sites, matched against canonical names and similes.\n\n## Evidence\n\n\u003c!-- evidence-head:3041d3097894d612a3d786ad06495f627e6e7708 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - Discord chat behavior; the observable form is message text, covered in the transcript evidence below\n\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - Discord chat behavior; covered by the real-pipeline tests below\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - no UI surface\n\n\u003c!-- evidence-row:backend-logs --\u003e\nLive occurrence shape from the deployment this was root-caused on (identifiers removed):\n\n\u003cdetails\u003e\n\u003csummary\u003eaddressed turn, real tool calls, terminal message is the pre-tool ack\u003c/summary\u003e\n\u003cpre\u003e\n[user asks for a concrete task]\nbot: on it.\n[several planner tool calls execute; turn ends]\n(no further message — no outcome, no failure)\n\u003c/pre\u003e\n\u003c/details\u003e\n\n\u003c!-- evidence-row:frontend-logs --\u003e\nN/A - no frontend surface in this change\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\nN/A - the fix runs after the model's final output is already empty; the decisive inputs are to eady have run — nothing live for `running` to describe), or when an `agent_delete` job is `in_progress` (teardown may be executing);\n- otherwise cancels the queued (never-claimed) `agent_delete` jobs and CASes the row back to `running`/`active` billing with every deletion-intent column cleared — `deletion_attempt_id`, `deletion_started_at`, and `deletion_allocation_counted` (withdrawing the release-at-commit slot marker per the #17185 double-free rule; a running row is scored counted by the periodic recount) — in the same transaction, so no window exists where a worker claims the job against a restored row;\n- CAS-guards on observed status + attempt id, so a concurrent ownership move fails closed instead of overwriting.\n\nTerminal-row deletion, the delete phases, and the reconciler are untouched: a restored row is simply `running` and no longer matches the re-enqueue sweep.\n\n## Tests\n\n- `bun test src/lib/services/eliza-sandbox.test.ts -t cancelAgentDeletion` (packages/cloud/shared): **6 pass / 0 fail** — cancel-and-restore atomicity (job cancel + intent-column clearing + billing reactivation asserted on rendered SQL), executing-job refusal, dead-bridge refusal, non-`deletion_pending` rows unchanged (incl. `deletion_failed`), missing-row refusal, ownership-CAS race.\n- Full suite `bun test src/lib/services/eliza-sandbox.test.ts`: **210 pass / 0 fail**.\n- Biome on touched files: clean. `bun run --cwd packages/cloud/shared typecheck`: fails with exactly one **pre-existing** error in `src/lib/eliza/agent-loader.ts` (messageExamples DTO drift), identical on clean `origin/develop` (verified via stash) and untouched by this diff.\n\n## Residual risk\n\n- No user-facing route calls `cancelAgentDeletion` yet — this PR delivers the reversibility primitive with its invariants; wiring a cancel endpoint/UI is a separate additive change.\n- The synchronous compat delete path (no job row) can still race a cancel between its phase-0 capture and phase-1 stamp; that race exists today for any concurrent delete pair and both sides remain individually fail-closed.\n\nFixes #18517\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"67:Tc34,"])</script><script>self.__next_f.push([1,"Closes #20027. Supersedes #20016.\n\nThe original cache lease cannot serialize the shipped Worker path: production and staging prefer Cloudflare KV, whose NX adapter is explicitly non-atomic and eventually consistent. This replacement moves the authority to a Durable Object keyed by organization + connection role.\n\nWhat changed:\n\n- `/api/v1/twitter/token` authenticates and validates the role, then delegates credential vending to the role-scoped coordinator.\n- The coordinator serializes complete broker operations across Worker isolates; the second request rereads the now-fresh stored tuple and does not refresh again.\n- A non-empty rotated refresh token is persisted before any fallible sibling secret write starts.\n- X token requests carry a 20-second abort deadline.\n- Local, staging, and production Worker configs bind the coordinator, with a registered Durable Object migration.\n- Public OAuth1/OAuth2/404 response shapes and least-privileged role default are preserved.\n\nExact-head validation:\n\n- Focused coordinator/route/deploy/service/client suites: PASS (65 tests, including one provider refresh across two serialized requests and partial-write survival)\n- `bun run --cwd packages/cloud/shared typecheck` — PASS\n- `bun run --cwd packages/cloud/api typecheck` — PASS\n- Production Worker dry-run: PASS; `TWITTER_OAUTH_REFRESH_COORDINATORS` resolved\n- Staging Worker dry-run: PASS; `TWITTER_OAUTH_REFRESH_COORDINATORS` resolved\n- Targeted Biome and `git diff --check` — PASS\n- Base root gates immediately before this change: lint 132/132, build 123/123 + view guard 19/19, typecheck 219/219\n\n## Contribution provenance\n\n- AI assistance: yes — architecture review, implementation, tests, and deployment-c er (which receives the same blob as `ELIZA_AGENT_CHARACTER_JSON`) landed on\n  the runtime's bare `defaultCharacterSystemTemplate`, because a user-chosen agent name matches\n  no bundled preset\n\nNet effect: **the desktop app gives you full Eliza, and the cloud gives you a stub.** The 9-preset\ncatalog in `packages/shared/src/character-presets.characters.ts` is never referenced anywhere in\n`packages/cloud`.\n\n## Fix\n\nSeed the shipped default preset (`CHARACTER_DEFINITIONS[0]`, \"eliza\") into `agent_config` at\ncreate time. That fixes all four readers at once — `projectSharedAgentCharacter`,\n`ElizaSandboxService.buildRuntimeBootstrapAgent`, `buildWarmClaimCharacterPayload`, and the\ncontainer's `applySandboxCharacterFromEnv` — and leaves the row carrying a real, editable\npersona for the character UI. No new character was authored; this reuses what already ships.\n\nShape decisions, dictated by those four readers and documented in the module header:\n\n- keys sit at the **top level** of `agent_config` (only the shared turn tolerates a nested\n  `{ character: {...} }`; the other three are flat-only)\n- `name` is deliberately **not** seeded — every reader prefers `agent_config.name` over the\n  `agent_name` column while `updateAgentProfile` renames only the column, so a seeded name\n  would win forever and strand the agent under its creation-time name\n- `{{name}}` tokens are preserved rather than expanded, matching how the presets ship so a\n  rename keeps propagating\n- `messageExamples` use the strict `{ examples: [...] }` group form, because the warm-claim\n  push validates against the strict CharacterSchema and silently drops the legacy form\n\n## Verification\n\n- `bun test --isolate src/lib/services/default-agent-character.test.ts` → **9 pass / 0 fail**\n- `bun test src/lib/services/eliza-sandbox.test.ts` → **207 pass / 0 fail** (204 on develop; +3 added)\n- `bun test --isolate src/lib/services/shared-runtime/` → **208 pass / 0 fail** (13 files)\n- warm-c overed by regression tests, including a live-wired case per plugin.\n\n# Background\n\n## What does this PR do?\n\nthe original submission fixed `readTimeoutMs`'s grammar (rejecting `parseInt`-style truncation) but review turned up three further gaps, all fixed here:\n\n1. **validation boundary was wrong for all five settings.** the three device timeouts (`ELIZA_DEVICE_LOAD_TIMEOUT_MS`/`GENERATE`/`EMBED`) were re-validated inline on every RPC call — a malformed value only surfaced on the first live `loadModel`/`generate`/`embed`/`unloadModel`/`formatChat` call, not when the bridge attached. the two bionic settings (`ELIZA_BIONIC_REQUEST_TIMEOUT_MS`, `ELIZA_BIONIC_PROBE_TIMEOUT_MS`) were the opposite problem: resolved as top-level `const` at module evaluation time, so a malformed value crashed the whole barrel import even when the device bridge feature was disabled entirely.\n\n   fixed by moving validation to the real activation boundary. the three device timeouts are now resolved once in `attachToHttpServer`, before any transport or device state exists, and cached on the `MobileDeviceBridge` instance (class fields carry safe defaults at declaration, only overwritten with validated values at attach); all five RPC methods read the cached instance field. the two bionic settings have no natural per-instance activation hook (module-level, not class-owned), so they became lazy memoized accessor functions resolved on first use instead of import-time constants.\n\n2. **`plugin-local-inference` has its own, independent `DeviceBridge` class** that reads the *same* `ELIZA_DEVICE_GENERATE_TIMEOUT_MS` env var with its own `Number.parseInt`-based parser at two call sites (`generate()`, `embed()`) — not the same code, a coincidentally-overlapping env var name, with looser accept behavior than the fixed `plugin-capacitor-bridge` parser (e.g. `\"600000oops\"` silently truncated instead of rejected). both plugins now share the same canonical-decimal-integer grammar and `[1, 2147483647]` bounds for this var, so the same input is accepted or rejected consistently regardless of which plugin reads it.\n\n3. **bare `Error`/no typed error** at the throw sites — both plugins now throw `ElizaError` (`code: \"INVALID_DEVICE_BRIDGE_TIMEOUT\"`, `context: { envKey, configured }`), matching this codebase's convention for domain/config failures.\n\n## What kind of change is this?\n\nbug fix (non-breaking change which fixes an issue)\n\n# Documentation changes needed?\n\nyes — done. both plugins' `CLAUDE.md`/`AGENTS.md` now document the real validated contract (grammar, bounds, `ElizaError` code, and activation timing). the two bionic settings were previously undocumented entirely.\n\n# Testing\n\n## Where should a reviewer start?\n\n- `plugins/plugin-capacitor-bridge/src/mobile-device-bridge-bootstrap.timeout-validation.test.ts` — proves attach itself rejects a malformed device timeout, before any transport or device state is created.\n- `plugins/plugin-capacitor-bridge/src/mobile-device-bridge-bootstrap.timeout-wiring.test.ts` — boots a real bridge + real WebSocket device connection, proves a live `generate()` call actually uses the configured (non-default) delay.\n- `plugins/plugin-local-inference/src/services/device-bridge-timeout.test.ts` — proves the independent `DeviceBridge` accepts/rejects the same inputs consistently, and that a live `generate()` call uses the configured delay, not the 60s default.\n\n## Detailed testing steps\n\n```text\n$ cd plugins/plugin-capacitor-bridge \u0026\u0026 bunx vitest run --config vitest.config.ts\nTest Files  20 passed (20)\n     Tests  127 passed | 2 skipped (129)\n\n$ cd plugins/plugin-local-inference \u0026\u0026 bunx vitest run --config vitest.config.ts src/services/device-bridge-timeout.test.ts\nTest Files  1 passed (1)\n     Tests  7 passed (7)\n\n$ bunx @biomejs/biome check \u003c5 changed source/test files\u003e\nChecked 5 files in 48ms. No fixes applied.\n\n$ bun run --cwd plugins/plugin-capacitor-bridge ty ry gate to only treat successful\\naction results as real work.\\n\\n### The Bug\\n\\nThe recovery gate (PR #20083) treated any non-empty `actionResults` array\\nas evidence that real work occurred. Failed actions therefore enabled the\\nacknowledgement fallback and could produce the misleading text\\n\\\"on it, working on that now.\\\"\\n\\n### The Fix\\n\\nChanged the check from `actionResults.length \u003e 0` to:\\n```typescript\\nactionResults.some((result) =\u003e result.success === true)\\n```\\n\\nThis matches the authoritative `success` field used elsewhere in\\n`message.ts` (e.g., media delivery already ignores results where\\n`success` is false).\\n\\n### Tests\\n\\n- `zero-delivery-recovery.test.ts`: Four-case bun:test suite (all failed,\\n  successful, empty, mixed results)\\n- `verify-zero-delivery.mjs`: Dependency-free Node verification harness\\n\\n\u003c!-- gitarmy-claim:shabbydev --\u003e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-15T23:16:11Z\",\"mergedAt\":null,\"additions\":631,\"deletions\":20},{\"id\":\"PR_kwDOMT5cIs7_iatW\",\"title\":\"fix(ui): keep auto top-up settings unavailable after load failure\",\"author\":\"standujar\",\"number\":20149,\"body\":\"$4d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-15T18:06:22Z\",\"mergedAt\":\"2026-08-16T06:56:18Z\",\"additions\":620,\"deletions\":85},{\"id\":\"PR_kwDOMT5cIs7_iXrM\",\"title\":\"fix: reconcile Cloud config intent with serving capability (#20045 R3/R4/R5, U1/U2/U6)\",\"author\":\"wtfsayo\",\"number\":20148,\"body\":\"$4e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-15T18:02:10Z\",\"mergedAt\":\"2026-08-15T20:51:36Z\",\"additions\":620,\"deletions\":33},{\"id\":\"PR_kwDOMT5cIs7_f4cz\",\"title\":\"fix(discord): chunk long thread messages to avoid 2000 char limit\",\"author\":\"byt61\",\"number\":20079,\"body\":\"$4f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-15T14:30:15Z\",\"mergedAt\":\"2026-08-15T18:43:06Z\",\"additions\":609,\"del
