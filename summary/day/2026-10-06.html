ntent.com/u/218490193?u=72baaae6caf868b5fcfe5dc4ec7fddcb82152d74\u0026v=4\",\"totalScore\":55.92572121281434,\"prScore\":51.92572121281434,\"issueScore\":4,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"domondi1\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/91575411?v=4\",\"totalScore\":49.33122295067163,\"prScore\":49.13122295067163,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0.2,\"summary\":null},{\"username\":\"seastone-houston\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/338405821?v=4\",\"totalScore\":33.60060050545395,\"prScore\":33.60060050545395,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"mashingaan\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/187997237?v=4\",\"totalScore\":19,\"prScore\":0,\"issueScore\":0,\"reviewScore\":19,\"commentScore\":0,\"summary\":null},{\"username\":\"greatcodeeer\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/3224374?u=d56a9778976761a0b0deb565a680273c102919cf\u0026v=4\",\"totalScore\":18.204692619390965,\"prScore\":18.204692619390965,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"moyaqoob\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/163942111?u=12817254d04f1eb8d60821acdafe4f4062912a47\u0026v=4\",\"totalScore\":17.198947636399186,\"prScore\":15.198947636399186,\"issueScore\":2,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"obukowhoowigho78-svg\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/289285968?u=d9e9df2f557b97397dc7eaa80deed2b5c2ecbc1a\u0026v=4\",\"totalScore\":5,\"prScore\":0,\"issueScore\":0,\"reviewScore\":5,\"commentScore\":0,\"summary\":null},{\"username\":\"OutstandingRetard\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/202385977?v=4\",\"totalScore\":5,\"prScore\":0,\"issueScore\":0,\"reviewScore\":5,\"commentScore\":0,\"summary\":null},{\"username\":\"CopperKoi\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/91732947?u=31aaece8627730e645b69f4a375e2ddeee00cd13\u0026v=4\",\"totalScore\":2,\"prScore\":0,\"issueScore\":2,\"reviewScore\":0,\"commentScore\":0,\"summary\":null}],\"focusAreas\":[{\"area\":\"cloud\",\"count\":133},{\"area\":\"ui\",\"count\":109},{\"area\":\"agent\",\"count\":61},{\"area\":\"plugins/plugin-personal-assistant\",\"count\":60},{\"area\":\"plugins/plugin-assistant\",\"count\":53},{\"area\":\"app\",\"count\":43},{\"area\":\"host\",\"count\":28},{\"area\":\"core\",\"count\":26},{\"area\":\"plugins/plugin-sql\",\"count\":19},{\"area\":\"plugins/plugin-wallet\",\"count\":19}],\"topIssues\":[{\"id\":\"I_kwDOMT5cIs8AAAABVKUROg\",\"title\":\"Inbox and X verify lose inbound X DMs behind the owner's replies\",\"author\":\"hermesagent270-commits\",\"number\":33926,\"repository\":\"elizaos/eliza\",\"body\":\"The LifeOps X DM cache holds outbound DMs alongside inbound ones. `readXInboundDms` and the inbox X DM fetch read the newest N rows and only then drop the outbound ones. As a result, the owner's recent replies hide inbound DMs from the inbox, and X verify under-reports inbound DMs.\\n\\n**Acceptance:**\\n- The direction is filtered before `LIMIT`.\\n- Tests cover a real-PGlite repository read and the inbox fetch.\\n\",\"createdAt\":\"2026-10-05T15:52:50Z\",\"closedAt\":\"2026-10-06T21:28:18Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABVWJQGw\",\"title\":\"listInbox answers \\\"No unread messages\\\" from an all-read cache without a live pull\",\"author\":\"lumix5\",\"number\":34125,\"repository\":\"elizaos/eliza\",\"body\":\"$14\",\"createdAt\":\"2026-10-06T11:18:21Z\",\"closedAt\":\"2026-10-06T21:19:17Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVUjkHQ\",\"title\":\"Follow-up: CVE IDs for the two fixed desktop security issues (#33034, #33036)\",\"author\":\"CopperKoi\",\"number\":34111,\"repository\":\"elizaos/eliza\",\"body\":\"$15\",\"createdAt\":\"2026-10-06T09:03:10Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVUOTTw\",\"title\":\"Goal check-in responses revert concurrent goal edits\",\"author\":\"hermesagent270-commits\",\"number\":34109,\"repository\":\"elizaos/eliza\",\"body\":\"Recording a goal check-in response writes the whole goal back from a read taken before the check-in task completes. A rename, status change, or review written in the meantime is reverted.\\n\\n**Acceptance:**\\n- Check-ins persist only their own fields.\\n- A real-runtime test covers a concurrent edit.\\n\",\"createdAt\":\"2026-10-06T08:34:33Z\",\"closedAt\":\"2026-10-06T21:19:20Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVT0IzA\",\"title\":\"Goal review reverts concurrent goal edits and check-ins\",\"author\":\"hermesagent270-commits\",\"number\":34104,\"repository\":\"elizaos/eliza\",\"body\":\"A goal review writes the whole goal row back from a snapshot taken before an LLM evaluation, or before a loop over every goal. Edits and check-ins written to the goal in the meantime are reverted: the title or status changes back, and new check-in log entries disappear.\\n\\n**Acceptance:**\\n- Reviews persist only their own fields.\\n- A real-database test covers a concurrent edit.\\n\",\"createdAt\":\"2026-10-06T07:59:11Z\",\"closedAt\":\"2026-10-06T21:23:35Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTzQUw\",\"title\":\"Pending approvals hidden behind newer device actions in /api/approvals\",\"author\":\"hermesagent270-commits\",\"number\":34102,\"repository\":\"elizaos/eliza\",\"body\":\"`GET /api/approvals` reads the newest `limit` pending approvals and only then removes device-action requests. When the newest rows are device actions, older pending approvals (for example a `send_email`) are cut off by the limit and never appear in the pending-actions panel.\\n\\n**Acceptance:**\\n- The exclusion runs in the query before the limit.\\n- A real-queue test covers it.\\n\",\"createdAt\":\"2026-10-06T07:57:54Z\",\"closedAt\":\"2026-10-06T21:31:40Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTiQYw\",\"title\":\"plugin-sql entity-graph jsonb writes surface raw 22P02/22P05 errors for NUL and lone surrogates\",\"author\":\"hermesagent270-commits\",\"number\":34097,\"repository\":\"elizaos/eliza\",\"body\":\"$16\",\"createdAt\":\"2026-10-06T07:33:43Z\",\"closedAt\":\"2026-10-06T21:24:54Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTacvQ\",\"title\":\"Database viewer pages repeat and skip rows when the sort column has ties\",\"author\":\"hermesagent270-commits\",\"number\":34096,\"repository\":\"elizaos/eliza\",\"body\":\"The database viewer's rows API pages with OFFSET over a sort column that can tie, or with no ORDER BY at all. As a result, pages repeat some rows and skip others: in a 120-row table sorted by a two-valued column, only 98 distinct rows are shown.\\n\\n**Acceptance:**\\n- Paging uses a total order (primary-key tie-break).\\n- A real-database test shows every row exactly once.\\n\",\"createdAt\":\"2026-10-06T07:22:27Z\",\"closedAt\":\"2026-10-06T21:24:56Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTXP-A\",\"title\":\"fix(plugin-sql): three jsonb writes bypass the shared sanitizer and surface raw 22P05/22P02 driver errors\",\"author\":\"nothingxnowhere\",\"number\":34093,\"repository\":\"elizaos/eliza\",\"body\":\"$17\",\"createdAt\":\"2026-10-06T07:17:57Z\",\"closedAt\":\"2026-10-06T21:24:59Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTTq2g\",\"title\":\"Lifeops graph PATCH routes revert concurrent identity and interaction updates\",\"author\":\"hermesagent270-commits\",\"number\":34092,\"repository\":\"elizaos/eliza\",\"body\":\"The lifeops entity and relationship PATCH routes read the record, wait for the request body, and then write back a merge of that earlier read. Identities, interactions, or a retirement recorded in the meantime are reverted: identity rows are deleted, `interactionCount` rolls back, and a retired edge returns as active.\\n\\n**Acceptance:**\\n- The routes read the body first.\\n- The merge-and-write runs in one store operation.\\n- Tests reproduce the concurrent write.\\n\",\"createdAt\":\"2026-10-06T07:12:50Z\",\"closedAt\":\"2026-10-06T21:25:01Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVTFHqg\",\"title\":\"SQLite adapter merges metadata on update, so keys can never be removed\",\"author\":\"hermesagent270-commits\",\"number\":34088,\"repository\":\"elizaos/eliza\",\"body\":\"The SQLite adapter merges provided metadata on `updateMemories` and `updateRelationships`, while plugin-sql replaces it. On SQLite no metadata key can ever be removed. For example, a recovered chat reply keeps its failure marker and keeps rendering as failed.\\n\\n**Acceptance:**\\n- Provided metadata replaces the stored object, as in plugin-sql.\\n- A real-SQLite test covers this.\\n\",\"createdAt\":\"2026-10-06T06:52:21Z\",\"closedAt\":\"2026-10-06T21:25:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSyJGA\",\"title\":\"MCP server discovery drops tools and resources after the first page\",\"author\":\"Guo-Yixin\",\"number\":34084,\"repository\":\"elizaos/eliza\",\"body\":\"### Problem\\r\\n\\r\\nOn develop `65621da3a424f8fcdce760db5c9c414117082e18`, `plugins/plugin-mcp/src/service.ts` requests only the first\\r\\nSDK page when listing tools, resources, and resource templates. A server returning\\r\\n`nextCursor` connects successfully but capabilities after that first page never\\r\\nreach the runtime MCP catalog/provider projection.\\r\\n\\r\\n### Reproduction and expected behavior\\r\\n\\r\\nA real stdio SDK server advertises one capability, an empty intermediate page with\\r\\na continuation cursor, and one final capability on each list. Registered\\r\\n`McpService` on an initialized SQLite runtime publishes only the first capability.\\r\\nIt should follow opaque cursors until `nextCursor` is absent and expose both.\\r\\nSingle-page and empty-catalog controls already pass on upstream.\\r\\n\\r\\nRegression evidence: 10 failures / 2 controls pass on upstream production code;\\r\\n12/12 pass with the scoped discovery fix. A PR with the real transport harness is\\r\\nprepared. No provider credentials or external MCP services are required.\\r\\n\",\"createdAt\":\"2026-10-06T06:22:32Z\",\"closedAt\":\"2026-10-06T21:27:58Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSSYKQ\",\"title\":\"Screen-time history buckets use the server's days, not the owner's\",\"author\":\"hermesagent270-commits\",\"number\":34081,\"repository\":\"elizaos/eliza\",\"body\":\"Screen-time history ranges (\\\"today\\\", \\\"this week\\\", and the daily buckets) use the server host's midnight, weekday, and dates. On a cloud host in UTC, an owner in another zone gets \\\"today\\\" starting at the wrong hour, a week starting on the UTC Sunday, and buckets on UTC days.\\n\\n**Acceptance:**\\n- History uses the owner's civil days, including across DST.\\n- Tests pin the ranges.\\n\",\"createdAt\":\"2026-10-06T05:26:52Z\",\"closedAt\":\"2026-10-06T21:28:00Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSOxGA\",\"title\":\"LIFE 'which one?' lists due times in the server's time zone\",\"author\":\"hermesagent270-commits\",\"number\":34079,\"repository\":\"elizaos/eliza\",\"body\":\"When LIFE complete or snooze asks \\\"which one?\\\" across several occurrences, it shows each due time in the server's zone. On a cloud host, a 07:00 Los Angeles dose is offered as 2:00 PM.\\n\\n**Acceptance:**\\n- Labels use the occurrence's own time zone.\\n- A test pins this.\\n\",\"createdAt\":\"2026-10-06T05:20:09Z\",\"closedAt\":\"2026-10-06T21:23:37Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSEGPg\",\"title\":\"Health summary window ends on the UTC date, missing the owner's today\",\"author\":\"hermesagent270-commits\",\"number\":34076,\"repository\":\"elizaos/eliza\",\"body\":\"The connector health summary window ends by default on the UTC date, while health samples are keyed by the provider's local day. Owners away from UTC miss \\\"today\\\" at some hours: the HEALTH action, the summary route, the provider, and connector sync all exclude it.\\n\\n**Acceptance:**\\n- The default window ends on the owner's local date.\\n- A test covers a non-UTC owner.\\n\",\"createdAt\":\"2026-10-06T04:59:22Z\",\"closedAt\":\"2026-10-06T21:23:39Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVSAW_w\",\"title\":\"SCREEN_TIME today reads the UTC day instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":34074,\"repository\":\"elizaos/eliza\",\"body\":\"`SCREEN_TIME` \\\"today\\\" computes the owner's local date, but the service reads that date over the UTC day. As a result:\\n- west of UTC, tonight's usage is missing and yesterday evening is counted;\\n- east of UTC in the morning, it reports \\\"no screen time\\\".\\n\\n**Acceptance:**\\n- The daily read covers the owner's civil day, DST included, when a zone is given.\\n- Tests pin the windows.\\n\",\"createdAt\":\"2026-10-06T04:51:43Z\",\"closedAt\":\"2026-10-06T21:28:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVR6Vow\",\"title\":\"Sent-email commitments get UTC-day due dates instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":34072,\"repository\":\"elizaos/eliza\",\"body\":\"Commitments extracted from approved sent email (\\\"I'll send it tomorrow\\\") get due dates computed on the UTC day at 17:00 UTC, not on the owner's local day. #32886 fixed only the meeting-transcript path.\\n\\n**Acceptance:**\\n- The sent-mail path resolves deadlines in the owner's time zone.\\n- A test covers a non-UTC owner.\\n\",\"createdAt\":\"2026-10-06T04:39:23Z\",\"closedAt\":\"2026-10-06T21:23:42Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRv4PQ\",\"title\":\"Inbox messages API returns nothing for a source behind a busier connector\",\"author\":\"hermesagent270-commits\",\"number\":34069,\"repository\":\"elizaos/eliza\",\"body\":\"`GET /api/inbox/messages` reads one global window of `limit * 3` rows, and only then filters by source, reactions, and empty text. A busier connector ahead of the requested source empties the result: `?sources=telegram` behind newer Discord traffic returns `[]`, and nothing in the response signals that it was truncated.\\n\\n**Acceptance:**\\n- The route pages until `limit` messages survive or history ends.\\n- A real-runtime route test covers this.\\n\",\"createdAt\":\"2026-10-06T04:18:38Z\",\"closedAt\":\"2026-10-06T05:25:48Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRrjwA\",\"title\":\"Entity resolution prompt lists room history newest-first\",\"author\":\"hermesagent270-commits\",\"number\":34067,\"repository\":\"elizaos/eliza\",\"body\":\"`findEntityByName` gives the model the room history newest-first for resolving pronouns and partial names. The latest mention therefore appears first, and \\\"send him the doc\\\" can resolve to an earlier-mentioned person.\\n\\n**Acceptance:**\\n- The resolution transcript is chronological.\\n- A real-runtime test pins the order.\\n\",\"createdAt\":\"2026-10-06T04:10:44Z\",\"closedAt\":\"2026-10-06T21:19:23Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRnclg\",\"title\":\"Limited cadence-overdue relationship list returns nothing while overdue contacts exist\",\"author\":\"hermesagent270-commits\",\"number\":34065,\"repository\":\"elizaos/eliza\",\"body\":\"`RelationshipStore.list` limits the read before it applies `cadenceOverdueAsOf` and `metadataMatch`. Overdue edges are the least recently updated ones, so a limited overdue query returns the freshest edges, filters all of them out, and answers empty while overdue contacts exist.\\n\\n**Acceptance:**\\n- The limit applies after the post-filters, on both the record and SQL paths.\\n- Tests cover both paths.\\n\",\"createdAt\":\"2026-10-06T04:02:23Z\",\"closedAt\":\"2026-10-06T21:25:07Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRayug\",\"title\":\"chunkMarkdownText emits empty code blocks when a fence's closing line has trailing whitespace or a longer marker\",\"author\":\"hermesagent270-commits\",\"number\":34062,\"repository\":\"elizaos/eliza\",\"body\":\"$18\",\"createdAt\":\"2026-10-06T03:35:51Z\",\"closedAt\":\"2026-10-06T21:28:06Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVRYUuA\",\"title\":\"Action and extraction prompts receive the conversation newest-first\",\"author\":\"hermesagent270-commits\",\"number\":34061,\"repository\":\"elizaos/eliza\",\"body\":\"`recentConversationTexts` returns stored room history newest-first. Every action prompt that renders it as the conversation therefore shows it backwards: the grounded reply's \\\"Complete conversation\\\", and the LifeOps task, goal, and draft extractors, and the calendar, health, and travel actions. Later corrections appear before the instructions they correct.\\n\\n**Acceptance:**\\n- The texts are chronological.\\n- A real-adapter test pins the order.\\n\",\"createdAt\":\"2026-10-06T03:30:43Z\",\"closedAt\":\"2026-10-06T21:19:29Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQ2rhg\",\"title\":\"Discord triage paging requests only limit messages per history read\",\"author\":\"hermesagent270-commits\",\"number\":34046,\"repository\":\"elizaos/eliza\",\"body\":\"Discord triage pages each channel until it yields `limit` non-agent messages (#33914), but each history read requests only `limit` messages. In agent-heavy channels, one `list_inbox` can then make hundreds of sequential Discord history requests.\\n\\n**Acceptance:**\\n- Each read requests a full 100-message page.\\n- Candidates are still counted against `limit`.\\n- A test pins the read count.\\n\",\"createdAt\":\"2026-10-06T02:26:16Z\",\"closedAt\":\"2026-10-06T21:28:08Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQtyXw\",\"title\":\"Agent's own messages keep the old name in prompts after a character rename\",\"author\":\"hermesagent270-commits\",\"number\":34040,\"repository\":\"elizaos/eliza\",\"body\":\"The agent's own entity keeps the character name it was created with. Renaming the agent (character editor, `CHARACTER` action, or first-run) updates the character and the agent row, but not the entity. Prompts label speakers with `entity.names[0]`, so the agent's own turns and its roster entry keep the old name, and a restart does not repair it.\\n\\n**Acceptance:**\\n- A rename persisted through `updateAgent` updates the agent entity.\\n- `initialize` repairs a stale entity.\\n- Real-runtime tests cover both.\\n\",\"createdAt\":\"2026-10-06T02:08:28Z\",\"closedAt\":\"2026-10-06T21:28:12Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQiaZw\",\"title\":\"CLOUD_ACCOUNT context goes stale after agent create/delete and account switch\",\"author\":\"hermesagent270-commits\",\"number\":34037,\"repository\":\"elizaos/eliza\",\"body\":\"The `CLOUD_ACCOUNT` snapshot (credits plus hosted agents) is not invalidated when hosted agents are created or shut down through the cloud routes. It also survives a sign-in to another organization on the same runtime. `elizacloud_credits` reuses that snapshot without checking its age.\\n\\n**Impact:** the planner narrates a stale agent list, and after an account switch it can show the previous organization's balance and agents labelled with the new organization's id.\\n\\n**Acceptance:**\\n- The routes invalidate the snapshot after a successful create or shutdown.\\n- A snapshot is never rendered for a different organization.\\n- The shared snapshot read honours the TTL.\\n\",\"createdAt\":\"2026-10-06T01:46:04Z\",\"closedAt\":\"2026-10-06T21:28:14Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVQchgA\",\"title\":\"Gmail triage list/search read only the first requested account\",\"author\":\"hermesagent270-commits\",\"number\":34034,\"repository\":\"elizaos/eliza\",\"body\":\"`GoogleGmailAdapter` declares multi-account support, but its list and search paths query only `worldIds[0]`. As a result, `MESSAGE triage` / `list_inbox` / `search_inbox` across several Gmail accounts silently omits every account after the first.\\n\\n**Acceptance:**\\n- Every requested account is queried.\\n- Results are merged newest-first before the limit.\\n- A test covers both list and search.\\n\",\"createdAt\":\"2026-10-06T01:33:48Z\",\"closedAt\":\"2026-10-06T21:30:33Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVKX3oQ\",\"title\":\"plugin-wallet x402: concurrent payments can exceed per-service daily budget (check and record span the on-chain transfer)\",\"author\":\"domondi1\",\"number\":33927,\"repository\":\"elizaos/eliza\",\"body\":\"$19\",\"createdAt\":\"2026-10-05T15:56:57Z\",\"closedAt\":\"2026-10-06T02:28:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVKPu1Q\",\"title\":\"Inbox chat fetch drops user messages behind the agent's own replies\",\"author\":\"cursor\",\"number\":33922,\"repository\":\"elizaos/eliza\",\"body\":\"`fetchChatMessages` in `@elizaos/plugin-inbox` reads the newest `limit * 3` memories and only then drops the agent's own replies and blank texts. When those rows fill the window, `MESSAGE` inbox chat / the aggregated chat feed returns fewer user messages than requested — or none — even though older user messages exist.\\n\\nThis is the stored-memory sibling of the Discord live triage window fixed in #33914. It does not reopen that issue: Discord paging is a different adapter.\\n\\n**Acceptance:**\\n- The caller's `limit` counts non-agent messages with text, paging older raw memories until that many candidates are collected or history ends.\\n- A store that ignores `offset` and repeats a page stops instead of looping.\\n- Blank texts do not consume a result slot.\",\"createdAt\":\"2026-10-05T15:47:39Z\",\"closedAt\":\"2026-10-06T21:28:21Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVKALHA\",\"title\":\"Inbox iMessage deep links ignore the chat id plugin-imessage stores\",\"author\":\"cursor\",\"number\":33912,\"repository\":\"elizaos/eliza\",\"body\":\"`buildIMessageLink` only reads room `handle`, `chatIdentifier`, and `chat_identifier`. `plugin-imessage` `ensureRoomExists` stores chat.db `chat_identifier` as room metadata `chatId` and `Room.channelId`, and never writes those three keys. Every iMessage inbox row therefore falls back to `/inbox`.\\n\\n1:1 identifiers are a phone or email, either bare (`+15551234567`, `person@icloud.com`) or wrapped (`iMessage;-;+15551234567`). Group ids (`chat…`, `iMessage;+;chat…`) have no public `imessage://` URL and must stay null.\\n\\n**Acceptance:**\\n- A 1:1 room whose `chatId` or `channelId` is `iMessage;-;+15551234567`, a bare E.164 number, or an email builds `imessage://…` with that address.\\n- A group room (`iMessage;+;chat123` or `chat839…`) still returns null.\\n- Existing `handle` / `chat_identifier` links are unchanged.\\n\\nAI assistance: yes. Provider/model: xAI / Grok 4.7. Client: Cursor cloud agent.\",\"createdAt\":\"2026-10-05T15:30:21Z\",\"closedAt\":\"2026-10-06T21:28:23Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABVJ0LMA\",\"title\":\"Inbox search on Discord/X filters only the newest N messages\",\"author\":\"hermesagent270-commits\",\"number\":33909,\"repository\":\"elizaos/eliza\",\"body\":\"`MESSAGE search_inbox` on connectors without native search (Discord, X DMs) lists the newest `limit + 1` messages and only then filters by content, sender, until, or tags. Matches older than that window are dropped, and the search receipt still reports the result as complete.\\n\\n**Acceptance:**\\n- The fallback lists without the result limit, filters, then limits.\\n- Tests cover both `BaseMessageAdapter` and `TriageService`.\\n\",\"createdAt\":\"2026-10-05T15:17:09Z\",\"closedAt\":\"2026-10-06T21:19:32Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABP_ZjDw\",\"title\":\"Android cloud APK build blocked by optional wallet browser analytics\",\"author\":\"lalalune\",\"number\":30844,\"repository\":\"elizaos/eliza\",\"body\":\"The Android cloud debug build fails on develop during the renderer audit. `bun run --cwd packages/app build:android:cloud:debug` rejects `navigator.serviceWorker` in the crypto vendor chunk. Coinbase/Base wallet SDK optional browser analytics embeds a script containing that capability, even though the Android cloud shell prohibits service-worker routing.\\n\\nAcceptance: compile optional wallet browser analytics out of Android cloud builds while preserving wallet providers and the unchanged routing audit; keep browser builds unchanged; build the actual debug APK and verify installation in the Android emulator. Include focused bundle regression coverage and report repository validation results.\\n\",\"createdAt\":\"2026-09-06T22:35:16Z\",\"closedAt\":\"2026-10-06T03:55:54Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABQr46xA\",\"title\":\"Four-phone rollout\",\"author\":\"lalalune\",\"number\":31025,\"repository\":\"elizaos/eliza\",\"body\":\"$1a\",\"createdAt\":\"2026-09-10T16:23:31Z\",\"closedAt\":\"2026-10-06T03:55:56Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABQr447Q\",\"title\":\"Assistant routines\",\"author\":\"lalalune\",\"number\":31022,\"repository\":\"elizaos/eliza\",\"body\":\"$1b\",\"createdAt\":\"2026-09-10T16:23:28Z\",\"closedAt\":\"2026-10-06T03:55:53Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABVeJaBg\",\"title\":\"plugin-discord: extracted URLs lose a balanced trailing \\\")\\\" (Wikipedia-style links are fetched truncated)\",\"author\":\"saltwire-dev\",\"number\":34186,\"repository\":\"elizaos/eliza\",\"body\":\"### Problem\\n\\n`cleanUrl` in `plugins/plugin-discord/utils.ts` (used by `extractUrls` for inbound link enrichment in `MessageManager`) strips every trailing `)` as if it were wrapping punctuation. A URL whose path legitimately ends in a balanced parenthesis is truncated:\\n\\n```ts\\nextractUrls(\\\"read https://en.wikipedia.org/wiki/Mercury_(planet) first\\\");\\n// =\u003e [\\\"https://en.wikipedia.org/wiki/Mercury_(planet\\\"]   (expected .../Mercury_(planet))\\n```\\n\\nThe same happens inside a markdown link, `[Mercury](https://en.wikipedia.org/wiki/Mercury_(planet))`. The truncated URL is what `MessageManager` fetches and attaches, so a user who posts a Wikipedia-style link gets the wrong page (or a 404) in the agent's context.\\n\\n### Expected\\n\\nStrip a trailing `)` only when it has no matching `(` inside the URL (the usual autolink rule). `(see https://example.com/a)` should still produce `https://example.com/a`.\\n\",\"createdAt\":\"2026-10-06T21:48:24Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABVeJZcA\",\"title\":\"plugin-calendar: describeRecurrence labels date-time UNTIL one day late in non-UTC zones\",\"author\":\"saltwire-dev\",\"number\":34185,\"repository\":\"elizaos/eliza\",\"body\":\"$1c\",\"createdAt\":\"2026-10-06T21:48:23Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABVd-1pA\",\"title\":\"fix(plugin-video): YouTube manual subtitles become raw JSON3 in the transcript (parsed as SRT)\",\"author\":\"saltwire-dev\",\"number\":34182,\"repository\":\"elizaos/eliza\",\"body\":\"$1d\",\"createdAt\":\"2026-10-06T21:31:48Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABVdw_4Q\",\"title\":\"plugin-pdf: parsePdfSpecDate overflows impossible calendar days (Feb 30 → March 1) into fake CreationDate/ModDate\",\"author\":\"saltwire-dev\",\"number\":34178,\"repository\":\"elizaos/eliza\",\"body\":\"$1e\",\"createdAt\":\"2026-10-06T21:11:15Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABVdfuOg\",\"title\":\"plugin-sql: searchEntitiesByName ignores its ordering contract and treats % / _ in the query as wildcards\",\"author\":\"saltwire-dev\",\"number\":34176,\"repository\":\"elizaos/eliza\",\"body\":\"$1f\",\"createdAt\":\"2026-10-06T20:46:43Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABVctv-A\",\"title\":\".catch not added in the services/registry-client-network.ts\",\"author\":\"moyaqoob\",\"number\":34168,\"repository\":\"elizaos/eliza\",\"body\":\"## Scope\\n\\n`packages/agent/src/services/registry-client-network.ts:342` has a bare\\n`indexResult.catch(() =\u003e {});`. The comment above it explains the intent\\n(preventing an unhandled rejection when the generated registry wins the race and\\nthe index attempt is never awaited), but the handler has no\\n`// error-policy:J\u003cN\u003e` tag.\\n\\nThe root `CLAUDE.md` requires every retained catch to carry a grep-able\\n`// error-policy:J\u003cN\u003e \u003creason\u003e` category. This one is the J5 case\\n(unhandled-rejection suppression). The same pattern is already tagged this way in\\n`api/conversation-connection-readiness.ts:501`, `api/accounts-routes.ts:162`\\nand `api/views-registry.ts:384`.\\n\\nChange: add the `error-policy:J5` tag to the existing comment, naming where the\\nsame rejection is observed (the fallback path that awaits `indexResult`).\\nNo behavior change.\",\"createdAt\":\"2026-10-06T19:38:54Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABVTrgHg\",\"title\":\"fix(cloud): keep zero-credit account management independent of agent boot\",\"author\":\"NubsCarson\",\"number\":34098,\"repository\":\"elizaos/eliza\",\"body\":\"$20\",\"createdAt\":\"2026-10-06T07:46:51Z\",\"closedAt\":null,\"state\":\"OPEN\",\"commentCount\":0}],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs8AAAABG0b3Aw\",\"title\":\"Promote reviewed develop fixes into staging\",\"author\":\"lalalune\",\"number\":34027,\"body\":\"$21\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T00:45:46Z\",\"mergedAt\":\"2026-10-06T15:34:08Z\",\"additions\":48332,\"deletions\":33362},{\"id\":\"PR_kwDOMT5cIs8AAAABG8IGIQ\",\"title\":\"fix(app): close pinned consumer staging dependencies\",\"author\":\"lalalune\",\"number\":34144,\"body\":\"$22\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T15:05:05Z\",\"mergedAt\":\"2026-10-06T15:08:55Z\",\"additions\":9488,\"deletions\":7285},{\"id\":\"PR_kwDOMT5cIs8AAAABHAAztQ\",\"title\":\"feat(app): qualify reviewed Android Clock handoffs\",\"author\":\"lalalune\",\"number\":34180,\"body\":\"Clock source and the controlled-host test repair remain in this draft. The reviewed non-Clock fixes are split into #34189 so they can land independently. Once that branch merges, this diff will contain only the Clock work and its test fixture repair. Original Clock ancestry is preserved from #34167.\\n\\nThe eight controlled-host browser cases, normal desktop/mobile Clock flow, 321 Java checks, and 218 app audit browser checks pass. Physical phone-flow acceptance and installed-alarm readback remain missing. An opened receipt is dispatch evidence, not proof of a saved or ringing alarm. This draft stays open until the original Clock acceptance gates are met.\\n\\nThe complete audit OCR step timed out under Bun; an unchanged Node-based OCR retry is running over the existing captures. MP4 recordings are saved locally; permission to upload them is pending. Full combined-root tests also found timeouts in unchanged restore and retention tests; no speculative restore optimization or timeout increase is included.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T21:16:29Z\",\"mergedAt\":null,\"additions\":9465,\"deletions\":429},{\"id\":\"PR_kwDOMT5cIs8AAAABG0sU7A\",\"title\":\"feat(app): serve authenticated self-hosted Cartesia voice sessions\",\"author\":\"NubsCarson\",\"number\":34030,\"body\":\"$23\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T01:22:47Z\",\"mergedAt\":\"2026-10-06T15:05:48Z\",\"additions\":9335,\"deletions\":7212},{\"id\":\"PR_kwDOMT5cIs8AAAABG-qHiA\",\"title\":\"feat(app): connect reviewed Android Clock handoffs\",\"author\":\"NubsCarson\",\"number\":34167,\"body\":\"$24\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T18:57:44Z\",\"mergedAt\":null,\"additions\":7952,\"deletions\":289},{\"id\":\"PR_kwDOMT5cIs8AAAABG0vGpg\",\"title\":\"fix(assistant): ground direct replies and narrow planner inputs\",\"author\":\"NubsCarson\",\"number\":34032,\"body\":\"$25\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T01:29:21Z\",\"mergedAt\":\"2026-10-06T14:58:39Z\",\"additions\":5272,\"deletions\":297},{\"id\":\"PR_kwDOMT5cIs8AAAABG0sXaQ\",\"title\":\"fix(briefs): preserve scoped sources and remove redundant work\",\"author\":\"NubsCarson\",\"number\":34031,\"body\":\"$26\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T01:22:51Z\",\"mergedAt\":\"2026-10-06T14:58:04Z\",\"additions\":4000,\"deletions\":155},{\"id\":\"PR_kwDOMT5cIs8AAAABHAZ_Bg\",\"title\":\"fix: land reviewed runtime and data correctness repairs\",\"author\":\"lalalune\",\"number\":34189,\"body\":\"$27\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T22:03:52Z\",\"mergedAt\":null,\"additions\":2160,\"deletions\":129},{\"id\":\"PR_kwDOMT5cIs8AAAABG1bVvw\",\"title\":\"fix(ui): remove Home Today cards and repair Once automations\",\"author\":\"NubsCarson\",\"number\":34059,\"body\":\"$28\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T03:13:54Z\",\"mergedAt\":\"2026-10-06T14:58:51Z\",\"additions\":1888,\"deletions\":1349},{\"id\":\"PR_kwDOMT5cIs8AAAABG0Ga1g\",\"title\":\"feat(cloud): resolve original invoice commercial terms\",\"author\":\"lalalune\",\"number\":34013,\"body\":\"$29\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T23:59:37Z\",\"mergedAt\":\"2026-10-06T00:24:37Z\",\"additions\":1103,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABG0U8rw\",\"title\":\"build(deps): bump the uv group across 3 directories with 3 updates\",\"author\":\"dependabot\",\"number\":34021,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T00:30:11Z\",\"mergedAt\":\"2026-10-06T00:42:52Z\",\"additions\":1030,\"deletions\":381},{\"id\":\"PR_kwDOMT5cIs8AAAABHAP8_A\",\"title\":\"test(android): support owned interruption and recovery phases\",\"author\":\"lalalune\",\"number\":34184,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T21:44:19Z\",\"mergedAt\":null,\"additions\":1022,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABGz1NNQ\",\"title\":\"refactor(cloud): consolidate shared behavior and flatten private modules\",\"author\":\"lalalune\",\"number\":34010,\"body\":\"$2c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T23:23:21Z\",\"mergedAt\":\"2026-10-06T00:21:14Z\",\"additions\":903,\"deletions\":1194},{\"id\":\"PR_kwDOMT5cIs8AAAABG9s9xQ\",\"title\":\"fix(personal-assistant): recover uncertain method selections without replay\",\"author\":\"lalalune\",\"number\":34161,\"body\":\"$2d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T17:25:28Z\",\"mergedAt\":\"2026-10-06T17:31:14Z\",\"additions\":813,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABG1KPZw\",\"title\":\"fix(cloud): complete x402 creator earnings on settle retry after a post-transfer failure\",\"author\":\"hermesagent270-commits\",\"number\":34047,\"body\":\"$2e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T02:35:39Z\",\"mergedAt\":\"2026-10-06T14:42:09Z\",\"additions\":783,\"deletions\":74},{\"id\":\"PR_kwDOMT5cIs8AAAABG9v53g\",\"title\":\"fix(personal-assistant): render morning Calendar events once in owner-local time\",\"author\":\"NubsCarson\",\"number\":34163,\"body\":\"$2f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T17:29:44Z\",\"mergedAt\":null,\"additions\":715,\"deletions\":48},{\"id\":\"PR_kwDOMT5cIs8AAAABG7sG8w\",\"title\":\"feat(cloud): calculate conserved original invoice funding plans\",\"author\":\"lalalune\",\"number\":34132,\"body\":\"$30\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T14:29:39Z\",\"mergedAt\":\"2026-10-06T14:42:23Z\",\"additions\":713,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABHAe6Ug\",\"title\":\"fix(app): preserve remote setup through backend outages\",\"author\":\"NubsCarson\",\"number\":34190,\"body\":\"$31\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T22:13:53Z\",\"mergedAt\":null,\"additions\":610,\"deletions\":71},{\"id\":\"PR_kwDOMT5cIs8AAAABHAmFxA\",\"title\":\"fix(reminders): preserve requested alert bodies through editing and delivery\",\"author\":\"NubsCarson\",\"number\":34191,\"body\":\"$32\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T22:28:50Z\",\"mergedAt\":null,\"additions\":596,\"deletions\":38},{\"id\":\"PR_kwDOMT5cIs8AAAABG9CwyQ\",\"title\":\"Promote reviewed wallet, invoice and Home qualification fixes\",\"author\":\"lalalune\",\"number\":34156,\"body\":\"Promote the reviewed follow-ups into staging: restored approved-wallet-draft spend accounting (#34152), read-only native invoice details and numeric precision checks (#34151/#34153), and the Home browser fixture repair (#34154). Preserve the production hotfix ancestry reconciliation from #34155.\\n\\nValidation: integrated root verification passed all 298 tasks and final audits at 1d5f0127f508; the subsequent invoice precision change passed all 52 native-host tests, and the fixture-only follow-up passed the complete Home browser qualification with desktop/mobile inspection. Wallet validation passed 493 tests plus typecheck; its lost-fix regression failed five cases before and passed all seven after.\\n\\nThis promotion does not authorize production deployment. Keep #33708 draft until exact-source hosted Cloud certification and its documented authority/effect gates pass.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T16:22:19Z\",\"mergedAt\":\"2026-10-06T16:22:46Z\",\"additions\":590,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs8AAAABG3zJaQ\",\"title\":\"fix(plugin-sql): reject unsupported jsonb text on the entity-graph writes before the bind\",\"author\":\"lumix5\",\"number\":34106,\"body\":\"$33\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T08:24:27Z\",\"mergedAt\":\"2026-10-06T14:38:32Z\",\"additions\":581,\"deletions\":14},{\"id\":\"PR_kwDOMT5cIs8AAAABGz41eA\",\"title\":\"refactor(ui): consolidate presentation helpers and remove unused registries\",\"author\":\"lalalune\",\"number\":34011,\"body\":\"$34\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-05T23:31:06Z\",\"mergedAt\":\"2026-10-06T00:21:17Z\",\"additions\":557,\"deletions\":752},{\"id\":\"PR_kwDOMT5cIs8AAAABG9Srxw\",\"title\":\"Promote reviewed shared speech lifecycle to staging\",\"author\":\"lalalune\",\"number\":34158,\"body\":\"Promote the reviewed shared progressive-speech lifecycle from #34157 into staging. The three-file delta adds optional stream attachment, cancellation fencing, explicit EOF completion and word-caption timing while preserving legacy clip playback.\\n\\nIndependent review passed all 15 lifecycle tests, UI typecheck in the canonical dependency checkout, and changed-file Biome. The author recorded the full UI suite and all 298 root verification tasks passing at fd28bba5b8162e78829f5b6d21cac2bd9b2cf246. Current hosted qualification remains pending. This does not authorize production promotion or billable Cloud certification.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T16:46:23Z\",\"mergedAt\":\"2026-10-06T16:46:31Z\",\"additions\":427,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABG9RaWA\",\"title\":\"feat(ui): share progressive speech playback lifecycle\",\"author\":\"lalalune\",\"number\":34157,\"body\":\"$35\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T16:44:29Z\",\"mergedAt\":\"2026-10-06T16:45:59Z\",\"additions\":427,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABG8o-ew\",\"title\":\"feat(cloud): expose read-only native invoice details\",\"author\":\"lalalune\",\"number\":34151,\"body\":\"$36\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T15:46:51Z\",\"mergedAt\":\"2026-10-06T15:49:58Z\",\"additions\":413,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABG3i2Yg\",\"title\":\"fix(plugin-sql): reject unstorable jsonb text before entity-graph writes\",\"author\":\"hermesagent270-commits\",\"number\":34100,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T07:57:14Z\",\"mergedAt\":\"2026-10-06T14:43:54Z\",\"additions\":409,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABG1EC5Q\",\"title\":\"fix(cloud): claim x402 payment requests before settling so concurrent authorizations cannot double-charge\",\"author\":\"hermesagent270-commits\",\"number\":34041,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T02:20:37Z\",\"mergedAt\":\"2026-10-06T14:42:11Z\",\"additions\":409,\"deletions\":14},{\"id\":\"PR_kwDOMT5cIs8AAAABG0K-mQ\",\"title\":\"fix(core): restore logger level validation and silent sinks\",\"author\":\"lalalune\",\"number\":34014,\"body\":\"LOG_LEVEL=silent/off/none still emitted logs, warning fell back to info, and verbose disagreed between the buffer and console. Restore the missing behavior from closed PR #31978 in the current logger owner, preserving the shared redactor. All file sinks stay closed under silent; invalid names receive one diagnostic and use info. Debug diagnostics use the same resolved, trimmed level.\\n\\nValidation: the original regression matrix fails 8 of 10 cases before the repair and passes afterward. Expanded logger, native ESM and redaction coverage passes 21 cases; core typecheck and all 305 core tests pass, as does scoped Biome. Root verification and hosted qualification remain pending.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T00:08:57Z\",\"mergedAt\":\"2026-10-06T00:21:32Z\",\"additions\":353,\"deletions\":23},{\"id\":\"PR_kwDOMT5cIs8AAAABG0Mz7w\",\"title\":\"fix(ota-trust): verify the runtime inventory the Android packager writes\",\"author\":\"lalalune\",\"number\":34015,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T00:12:49Z\",\"mergedAt\":\"2026-10-06T00:23:00Z\",\"additions\":346,\"deletions\":24},{\"id\":\"PR_kwDOMT5cIs8AAAABG3IwgQ\",\"title\":\"fix(lifeops): stop graph PATCH routes writing back a stale entity or edge\",\"author\":\"hermesagent270-commits\",\"number\":34091,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T07:12:48Z\",\"mergedAt\":\"2026-10-06T14:36:17Z\",\"additions\":309,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs8AAAABG0hudw\",\"title\":\"fix(inbox): spend the missed-only window only on messages that can qualify\",\"author\":\"lumix5\",\"number\":34028,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T00:58:58Z\",\"mergedAt\":\"2026-10-06T14:48:37Z\",\"additions\":297,\"deletions\":27},{\"id\":\"PR_kwDOMT5cIs8AAAABG-AFdQ\",\"title\":\"fix(runtime): request JSON extraction and target saved-fact history reads\",\"author\":\"NubsCarson\",\"number\":34164,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T17:53:49Z\",\"mergedAt\":null,\"additions\":296,\"deletions\":14},{\"id\":\"PR_kwDOMT5cIs8AAAABG7avSA\",\"title\":\"feat(plugin-wallet): identify each x402 payment attempt across callbacks; add onPaymentFailed\",\"author\":\"domondi1\",\"number\":34131,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T14:08:11Z\",\"mergedAt\":\"2026-10-06T14:42:18Z\",\"additions\":281,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABG2svLA\",\"title\":\"fix(mcp): discover every capability page before publishing servers\",\"author\":\"Guo-Yixin\",\"number\":34085,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T06:22:39Z\",\"mergedAt\":\"2026-10-06T14:37:13Z\",\"additions\":275,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABG-DyfQ\",\"title\":\"fix(personal-assistant): require host-selected guidance before method selection\",\"author\":\"lalalune\",\"number\":34165,\"body\":\"When a product requires visible guidance for selecting an existing payment method, a missing target or failed highlight now prevents selection before any click or selection record is written. The opt-in policy keeps product copy in the host and preserves existing behavior for other consumers.\\n\\nIf guidance disappears after a choice was offered, the failed selection pauses the task and settles cleanup. Explicit Resume advances to a fresh choice, so the already-consumed callback cannot strand the user. Authorization, stale-choice and abort checks prevent pausing a replacement task.\\n\\nValidation: root `bun run verify` passed at 193b8a865fb7d65c40c7012e09e3a6c3c3c4820a; focused policy and real runtime/SQLite route recovery tests passed. Full personal-assistant verification passed: 103 native-host tests plus 351 Vitest files, 3,325 passing tests and six existing skips. Native/provider acceptance is outside this source-level change.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T17:59:21Z\",\"mergedAt\":\"2026-10-06T21:03:50Z\",\"additions\":246,\"deletions\":13},{\"id\":\"PR_kwDOMT5cIs8AAAABG79qCw\",\"title\":\"feat(native-agent): share pending enrollment credential client\",\"author\":\"lalalune\",\"number\":34139,\"body\":\"$3f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T14:51:53Z\",\"mergedAt\":\"2026-10-06T14:59:11Z\",\"additions\":235,\"deletions\":135},{\"id\":\"PR_kwDOMT5cIs8AAAABG27-fA\",\"title\":\"fix(ui): surface stream action failures\",\"author\":\"hermesagent270-commits\",\"number\":34086,\"body\":\"$40\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T06:51:12Z\",\"mergedAt\":\"2026-10-06T14:54:39Z\",\"additions\":221,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABG-ONDQ\",\"title\":\"fix(browser): wait for exact profile before recovered task binding\",\"author\":\"lalalune\",\"number\":34166,\"body\":\"After an Android service restart, the host can become ready before its exact Chromium profile registers. Add a bounded, cancellable registration wait to NativeSocketBrowserTarget and use it before new configured task bindings. The wait sends no commands, rejects a different profile, and does not retry any dispatched request. Host close cancels it; account and profile authority are rechecked before binding. Revocation cleanup and ordinary commands do not wait.\\n\\nValidation: browser Vitest passed 343 tests (five existing skips); the separate remote-control suite passed 10 tests. Browser typecheck, 105 native-host tests and configured-host recovery tests pass. Root verification passed all 298 tasks and final audits. Native installation and consumer adoption remain separate gates.\\n\\nParent PR #34165 is merged after all five exact-head hosted checks passed. This PR is now based on develop and requires its own exact-head hosted qualification.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T18:15:20Z\",\"mergedAt\":\"2026-10-06T21:30:24Z\",\"additions\":206,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABG1MQcA\",\"title\":\"fix(agent): fill inbox limits after filtering\",\"author\":\"hermesagent270-commits\",\"number\":34048,\"body\":\"$41\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T02:39:51Z\",\"mergedAt\":\"2026-10-06T14:29:01Z\",\"additions\":203,\"deletions\":31},{\"id\":\"PR_kwDOMT5cIs8AAAABG58WYw\",\"title\":\"fix(cloud): render hosted account management without mounting the agent runtime\",\"author\":\"lumix5\",\"number\":34127,\"body\":\"$42\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T12:00:27Z\",\"mergedAt\":\"2026-10-06T14:38:52Z\",\"additions\":202,\"deletions\":13},{\"id\":\"PR_kwDOMT5cIs8AAAABG2GYtQ\",\"title\":\"fix(health): end the default health summary window on the owner's date\",\"author\":\"hermesagent270-commits\",\"number\":34075,\"body\":\"$43\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T04:59:19Z\",\"mergedAt\":\"2026-10-06T14:25:09Z\",\"additions\":195,\"deletions\":18},{\"id\":\"PR_kwDOMT5cIs8AAAABG11l6w\",\"title\":\"fix(inbox): page GET /api/inbox/messages until limit messages survive\",\"author\":\"hermesagent270-commits\",\"number\":34068,\"body\":\"$44\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T04:18:36Z\",\"mergedAt\":null,\"additions\":188,\"deletions\":72},{\"id\":\"PR_kwDOMT5cIs8AAAABHAGJzA\",\"title\":\"docs: require MVP scope and proof for contributions\",\"author\":\"lalalune\",\"number\":34181,\"body\":\"$45\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T21:26:02Z\",\"mergedAt\":\"2026-10-06T21:48:13Z\",\"additions\":181,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs8AAAABG01z3Q\",\"title\":\"fix(elizacloud): keep the CLOUD_ACCOUNT snapshot current with account changes\",\"author\":\"hermesagent270-commits\",\"number\":34036,\"body\":\"$46\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T01:46:02Z\",\"mergedAt\":\"2026-10-06T14:44:46Z\",\"additions\":181,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs8AAAABG3MRQQ\",\"title\":\"fix(plugin-sql): route the remaining jsonb writes through the sanitizer\",\"author\":\"nothingxnowhere\",\"number\":34094,\"body\":\"$47\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T07:18:44Z\",\"mergedAt\":\"2026-10-06T14:37:49Z\",\"additions\":177,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABG09Ikw\",\"title\":\"fix(cloud): keep confirmed x402 payment requests from being expired by a concurrent settle\",\"author\":\"hermesagent270-commits\",\"number\":34038,\"body\":\"$48\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T02:04:30Z\",\"mergedAt\":\"2026-10-06T14:42:12Z\",\"additions\":174,\"deletions\":14},{\"id\":\"PR_kwDOMT5cIs8AAAABG2-VOw\",\"title\":\"fix(slack): stop chunkSlackText sending empty code blocks\",\"author\":\"hermesagent270-commits\",\"number\":34089,\"body\":\"$49\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T06:55:30Z\",\"mergedAt\":\"2026-10-06T14:44:06Z\",\"additions\":173,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABHAKY_A\",\"title\":\"fix(plugin-video): parse YouTube manual subtitles from the SRT/WebVTT variant\",\"author\":\"saltwire-dev\",\"number\":34183,\"body\":\"$4a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T21:33:48Z\",\"mergedAt\":null,\"additions\":170,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs8AAAABG4Xkgw\",\"title\":\"fix(assistant): enforce the sinceMs floor on the listInbox cached path\",\"author\":\"lumix5\",\"number\":34112,\"body\":\"$4b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T09:21:46Z\",\"mergedAt\":\"2026-10-06T14:35:27Z\",\"additions\":165,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABG2U_pQ\",\"title\":\"fix(discord): never send empty code blocks when chunking fenced replies\",\"author\":\"hermesagent270-commits\",\"number\":34082,\"body\":\"$4c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T05:33:23Z\",\"mergedAt\":\"2026-10-06T14:29:06Z\",\"additions\":159,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABG3Oc1w\",\"title\":\"fix(database): page database viewer rows over a total order\",\"author\":\"hermesagent270-commits\",\"number\":34095,\"body\":\"$4d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T07:22:26Z\",\"mergedAt\":\"2026-10-06T14:48:43Z\",\"additions\":154,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABG8KTCw\",\"title\":\"fix: resolve integrated verification and consumer build conflicts\",\"author\":\"lalalune\",\"number\":34146,\"body\":\"The integrated PR batch exposed formatting/import failures and a required image URL reset effect flagged as an unused dependency. Apply the formatter/import fixes and document why both URL dependencies intentionally reset image failure state.\\n\\nThis branch also resolves the consumer-build closure conflict from #34144, preserving support for both legacy and current committed core layouts. All three consumer builder tests pass, including executable staged errors and DNS provenance/tamper validation. Full integrated verification and application capture audit are running.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T15:07:42Z\",\"mergedAt\":\"2026-10-06T15:08:58Z\",\"additions\":153,\"deletions\":73},{\"id\":\"PR_kwDOMT5cIs8AAAABG8qo3g\",\"title\":\"Restore approved-draft rolling spend accounting\",\"author\":\"lalalune\",\"number\":34152,\"body\":\"Approved wallet drafts did not enter the rolling spend window, allowing later checks to ignore previously approved amounts. Restore the lost #29567 behavior: reserve each approved draft once, leave repeated approval idempotent, and refuse to resurrect rejected drafts. The existing approval flag supplies the once-only guard without changing the exported draft shape.\\n\\nClosed-PR audit: #29567 was closed in favor of #29566, which GitHub cannot resolve in this repository. The current source still reproduced the defect. The original regression suite is retained: five failures before, seven passes after. The full wallet suite passes 493 tests (one existing skip); wallet typechecking and changed-file Biome checks pass. No real payment was executed.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T15:49:13Z\",\"mergedAt\":\"2026-10-06T15:49:31Z\",\"additions\":149,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABG2iW4A\",\"title\":\"fix(ui): surface rejected Stream view start/stop actions in the alert panel\",\"author\":\"lumix5\",\"number\":34083,\"body\":\"$4e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-06T06:02:37Z\",\"mergedAt\":\"2026-10-06T14:23:53Z\",\"additi
