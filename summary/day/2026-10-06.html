hanism/integration cases passed after adding the exclusive-UID refusal. Focused formatting/lint passes. Repository-wide verification passes all 298 tasks and subsequent audits at 628da596dcd9. Hosted checks remain pending. No installed Android or consumer recovery acceptance is claimed. The Senior Care native qualifier must adopt this API after review and still requires authorized account sign-in and its pinned custom browser.\n"])</script><script>self.__next_f.push([1,"2c:T642,"])</script><script>self.__next_f.push([1,"Cloud contained duplicate billing, signing, storage and route helpers alongside several singleton source folders. Consolidate those implementations at their existing domain owners and flatten private folders while preserving public entrypoints and runtime boundaries.\n\n- Flatten email, OAuth, bootstrap configuration, Redis queue and mock modules; combine the billing plugin/provider.\n- Share SDK SMS billing, checkout reconciliation, Steward signing/URL resolution, generated audio storage, advertising targeting, Calendar date parts, pricing fetch and Vast transport. Remove duplicate local backup comparators.\n- Remove the unused API local-inference edge, classify SQLite as test-only, and include the SDK plus the required core protocol export in the gateway's pruned Docker build context.\n\nValidation: SDK owner tests/typecheck/build; gateway 50 tests/typecheck/build; 12 focused billing/reconciliation tests; 9 media quota tests; 8 signing parity vectors; 780-route contract; 3,296-file owner lint; template body and migrated-path parity. The isolated gateway pruned install/bundle passes; Docker is unavailable locally.\n\nThe Worker bundle and frozen install also pass. Full Cloud tests and root verify are rerunning after integration with develop. Validation exposed a stale account-deletion inventory: classify the eight current billing entries by their existing resource/grant/financial ownership, refresh the reviewed digest, and test complete coverage plus rejection of unknown restrictive tables (8 tests, 307 assertions). Deletion operations remain unchanged. Final acceptance is pending.\n"])</script><script>self.__next_f.push([1,"2d:T542,When a saved-method click succeeds in the browser but its response is lost, the bill workflow cannot currently bind readback to the review that authorized that selection. Persist immutable task/owner/operation-bound selection evidence before dispatch and compose the existing task runtime's read-only reconciliation through an optional reviewed host policy. A failed or missing write prevents dispatch; reconciliation never repeats the click and selection records never count as payment attempts.\n\nConfigured hosts persist only their projected reconciliation evidence, with private permissions, before publishing a conclusive result. Biller matching, UI copy and product recovery routes remain consumer-owned. Hosts without a reconciliation policy do not advertise the capability.\n\nValidation: 100 native-host tests pass, including real SQLite reopen/owner isolation and real task-runtime/actuator readback with one click total; focused final storage/capability guards pass. Final root `bun run verify` passed all 298 tasks and post-build audits at ca550ad19ce3. Owning-package verification passed: 351 Vitest files, 3,325 tests passed and 6 existing skips. The final native-host suite passed all 100 tests; source checks are still running in hosted CI. No live provider, browser/device or consumer acceptance is claimed by this upstream change.\n2e:Tcbb,"])</script><script>self.__next_f.push([1,"Stacked on #34041, which is stacked on #34038. Review only the last commit, `c0d5d0e`.\n\n## Problem\n\nAfter the facilitator moves the payer's money on-chain, `X402PaymentRequestsService.settle()` marks the row `confirmed` and only then writes creator earnings, as separate non-transactional statements. On the app path that is four writes: `addPurchaseEarnings`, a `purchase_share` row, `apps.total_creator_earnings` and the redeemable credit.\n\nIf any of those writes throws (a connection reset, a failed statement), the row is already `confirmed`. Every retry hits the `status === \"confirmed\"` early return. Nothing reconciles x402 earnings, so the seller is never credited for money that arrived. A partial failure also leaves the four app projections disagreeing with each other.\n\n## Fix\n\n- **Confirm step:** the new `confirmSettlement` confirms the row, releases the settle claim, merges `{payer, settlement}` and sets `metadata.settlementPending = true`, all in one statement.\n- **`completeSettlement` (earnings and callbacks):**\n  - Records earnings, keyed by the payment ID.\n  - Then `clearSettlementPending` atomically clears the flag. Only the caller that clears it sends the `paid` callbacks.\n  - A retry, or a concurrent already-settled read, therefore completes the work without crediting twice or sending a second `paid` callback.\n- **Repair on retry:** `alreadySettled()` runs `completeSettlement` when the flag is set. Rows confirmed before this change have no flag and are never re-credited.\n- **App path:** now uses the repository's atomic, idempotent `addEarnings` → `applyCreatorMovement` pattern, the same one `app-credits` uses. It writes one redeemable ledger entry, then `app_earnings`, the `purchase_share` row and the `apps` aggregates in a single transaction keyed by that ledger ID.\n  - Platform revenue delta is `0`. x402 never booked platform revenue on `apps`, so this is unchanged.\n- **Non-app path:** `addEarnings` returning `success: false` (sub-unit dust) is logged instead of being silently ignored.\n\n## Evidence Gate\n\n| Check | Result |\n| --- | --- |\n| New tests on #34041 head `1cc8a4f` | 2 fail. After a one-off `addEarnings` failure, a retry leaves the creator's redeemable balance and ledger at **0** although $5 settled on-chain. After a projection failure, the old writes cannot detect or repair it |\n| Same file with this fix | 11/11 pass (credited exactly once, one `paid` callback, flag cleared, legacy confirmed rows not re-credited) |\n| Crypto PGlite and unit suites (late-paid, retired-miniapp, confirm-expired, malformed-json, amount-codes) + new | 39/39 pass |\n| `redeemable-earnings-fail-closed.test.ts` | 3/3 pass |\n| Biome on changed files | clean |\n| `tsc --noEmit` (cloud/shared, cloud/api) on changed files | no errors |\n\n\u003c!-- evidence-head:c0d5d0e6a1e057cc6ecf217764721cca3ebd7df1 --\u003e\n\nAI provider/model: anthropic / claude-opus-5.5\nClient / agent tooling: cursor\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5.5\",\"client\":\"cursor\",\"skill_revision\":\"N/A - ordinary GitHub contribution without optional run evidence\"} --\u003e\n"])</script><script>self.__next_f.push([1,"2f:T6bc,"])</script><script>self.__next_f.push([1,"Scheduled morning briefs now render source-bound Calendar events once in the owner's local time. Timed ranges show their date and timezone, preserving cross-day and DST offsets. All-day events retain their civil date, render as “all day,” and enter the correct owner's-day selection/counts rather than being shifted by UTC-midnight conversion.\n\nThe existing formatter, check-in queries and scheduler are reused. A single shared predicate applies timed instant windows and all-day half-open civil-date overlap consistently; changed-event counts reuse that SQL result. Duplicate highlights combine only with the same id, title, times, status and all-day classification. Changed/cancelled facts stay distinct. Optional typed fields preserve older saved-report fallback; stored raw Calendar values are unchanged.\n\nValidation: 92 owning formatter/extractor/check-in cases pass, including real PGlite producer coverage for Los Angeles, Kolkata, the New York 25-hour DST day, multi-day/e commit, `1cc8a4f`.\n\n## Problem\n\n`X402PaymentRequestsService.settle()` calls `x402FacilitatorService.settle()` with no claim on the request. Two settles carrying different valid authorizations (a double-click, or an x402 client retrying with a fresh nonce while the first call is still waiting up to 300s for the receipt) both reach the facilitator and both broadcast:\n\n- **Payer:** charged twice on-chain. The second transfer is untracked: `markAsConfirmed` overwrites the first `transaction_hash`.\n- **App-scoped requests:** `addPurchaseEarnings`, `apps.total_creator_earnings` and the `purchase_share` row each increment twice. Only the redeemable credit is deduplicated by `sourceId`.\n- **Expiry during an in-flight settle:** if the request lapses mid-settlement, a second settle takes the expiry branch, marks the row `expired` and fires an `\"expired\"` callback. The first settle then confirms it.\n\n## Fix\n\n- **`claimSettlement(id, until)`:** an atomic `UPDATE … WHERE status='pending' AND no active claim`. It writes `metadata.settleClaimedUntil`. settle takes the claim after validating the payload and before calling the facilitator. The lease is `maxTimeoutSeconds` (default 300) plus 60s.\n- **Claim not won:** if the row is confirmed, settle returns the idempotent `alreadySettled` response. If it is pending, settle returns `409 settlement_in_progress`. Otherwise it returns 410. No failure callback fires, because the request has not failed.\n- **Facilitator returns `success: false`:** the claim is released, so the payer can retry with a corrected authorization.\n- **Facilitator throws:** the claim is kept until it lapses. The transfer may already be broadcast (for example, a receipt timeout), so we never over-pay.\n- **`markAsExpired`:** also skips rows with an active claim. The expiry branch returns 409 instead of expiring under an in-flight settle.\n- **Success path:** the final metadata write (`{...metadata, payer, settlement}` from the pre-claim read) drops the claim key.\n- **No schema migration:** the claim lives in the existing `metadata` jsonb.\n\n## Evidence Gate\n\n| Check | Result |\n| --- | --- |\n| `x402-settle-expiry-race.pglite.test.ts` on #34038 head `d83555d` | 3 new tests fail: second authorization reaches the facilitator; lapsed in-flight request expired; retry after unknown-outcome error reaches the facilitator again |\n| Same file with this fix | 7/7 pass |\n| PGlite suites: x402 + `crypto-late-paid-settlement` + `crypto-retired-miniapp` | 13/13 pass |\n| Repository-mocking unit tests (`crypto-payment-confirm-expired`, `crypto-payments-malformed-json`, `crypto-payment-amount-codes`) | 22/22 pass |\n| Biome on changed files | clean |\n| `tsc --noEmit` (cloud/shared, cloud/api) on changed files | no errors |\n\n\u003c!-- evidence-head:1cc8a4f93c7e55642ed8bf7224d08161f9af55e7 --\u003e\n\nAI provider/model: anthropic / claude-opus-5.5\nClient / agent tooling: cursor\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5.5\",\"client\":\"cursor\",\"skill_revision\":\"N/A - ordinary GitHub contribution without optional run evidence\"} --\u003e\n"])</script><script>self.__next_f.push([1,"39:T129c,"])</script><script>self.__next_f.push([1,"## Bug\n\n`VerifyRuntimeArtifact` (`packages/os/native/ota-trust/apk_runtime.go`) reads `assets/runtime-payload.tsv`, an inventory path left over from a retired downstream layout. The shared Android packager, `stageAndroidRuntimeInventory` in `plugins/plugin-native-agent/native-host/android-runtime-inventory.mjs`, writes `assets/agent-runtime.inventory` instead, and `RuntimeBundleStore` reads that file on device. As a result, every real native-runtime APK fails with \"runtime inventory missing\". The tests only passed because their synthetic fixtures used the old name, and the shared test policy hardcoded a product-specific `senior-care-runtime-v1` header.\n\nFixing only the path does not make real APKs pass. I ran the verifier against the two real native-runtime release APKs from a downstream host (launcher and standalone, about 139 MB each). Both then failed with `unlisted runtime asset`, because the packager deliberately leaves two kinds of file under `assets/agent/` that are not in the inventory:\n- **Host-excluded directories** (`excludedAgentDirectories`, e.g. `models/`). The agent service reads these straight from APK assets.\n- **Original `.tar` / `.tar.gz` archives.** The packager re-addresses these as listed `runtime-blobs/\u003csha256\u003e.bin` entries. `RuntimeBundleStore` never extracts the original paths.\n\n## Fix\n\n- **Path.** The verifier now reads `assets/agent-runtime.inventory`. The packager exports this name as `ANDROID_RUNTIME_INVENTORY_ASSET`, and `RuntimeBundleStore` reads the same file.\n- **Header.** The header still comes from the host. `stageAndroidRuntimeInventory` takes a validated `format` (default `eliza-runtime-v1`), and the host passes that same value to the packager, to `RuntimeBundleStore` and as its policy's `runtimeInventoryHeader`. Nothing in the shared package names a product any more.\n- **Exclusions.** Host policy moves to **schema 2**, which adds a required `runtimeExcludedAgentDirectories`. It must match the packager's `excludedAgentDirectories`; each entry is a safe relative path, the list is unique, and it holds at most 64 entries. Schema-1 policies fail closed in both Go and `composeTrustSource`. An unlisted file under `assets/agent/\u003cdir\u003e/` is allowed only when `\u003cdir\u003e` is excluded. Unlisted `assets/runtime-blobs/*` entries are still always rejected.\n- **Archives.** An unlisted agent archive is allowed only if its packager destination (`\u003cname\u003e.tar.gz`, or `\u003cname\u003e.tar` + `.gz`) appears in the inventory as a blob destination. It is covered by the whole-APK digest.\n- locker. These are combined-source results, not fresh canonical runs on the split PR branches.\n\nThe combined backend was adopted with owner, history and domain preservation controls passing. Renderer27bf remains compatible because these seven changes are backend and tests only. Fresh live projection/certificate and Clock SHOW retests are active; their final acceptance is pending. Keep this PR in draft. No merge, promotion or deployment is included.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:dca1431986ad00319220024e5969d991dc61f857 --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] Before desktop/mobile images: N/A - this scope changes backend extraction/context, not UI code.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] After desktop/mobile images: N/A - this scope changes no UI code.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] Uploaded MP4 explainer/walkthrough: N/A - this scope changes no UI code.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] Sanitized matching-flow logs: public attachment missing.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] Frontend console/network evidence: N/A - backend extraction/context correction.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] Sanitized current real-model semantic retest: active and not yet accepted; public attachment pending.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] Sanitized saved-record/receipt evidence: public attachment missing.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [ ] Visual/OCR output: N/A - no changed rendered UI surface.\n\n## Known gaps\n\nPublic attachments above remain incomplete. Current live semantic retests are pending. Historical failures and source-specific results are retained. This draft does not claim universal latency, minimal input or production readiness. Existing pinned dependencies were reused; no new install or APK build was performed for these backend corrections.\n\n## Deployment\n\nKeep draft. No promotion, merge or production deployment.\n"])</script><script>self.__next_f.push([1,"3d:Tfa8,"])</script><script>self.__next_f.push([1,"# Relates to\n\nFollow-up to #33937. The built-in `X402BudgetTracker` caps per service and per day for one client. An agent runtime that wants a budget per agent, per room or per task has to keep it outside the client, through the payment callbacks. Today that can't be done correctly. `onBeforePayment` and `onPaymentComplete` share no identity, so concurrent payments can't be matched, and nothing fires when an approved payment fails. A hold taken in `onBeforePayment` therefore can't be released.\n\n# Change\n\n- `onBeforePayment(req, url, attempt)` and `onPaymentComplete(log, attempt)` receive `attempt = { paymentId }`, one id per payment attempt (`crypto.randomUUID()`).\n- New `onPaymentFailed(req, url, error, { paymentId, transferAttempted })`. It fires when a payment that `onBeforePayment` approved (or that ran without it) throws before completing. `transferAttempted` follows the client's existing rule: a submitted transfer may still land, so a cautious budget keeps its hold. A throwing callback doesn't hide the payment error.\n- `X402PaymentAttempt` is exported from `sdk/x402` and `sdk`.\n\nBackward compatible. Existing callbacks ignore the extra argument, and a declined `onBeforePayment` doesn't call `onPaymentFailed`. The internal tracker is unchanged.\n\n# Testing\n\nNew `plugins/plugin-wallet/src/sdk/x402/client.payment-attempt.test.ts`, 5 tests through `X402Client.fetch` with the mocked wallet-core used by the existing x402 tests:\n\n- The same `paymentId` reaches `onBeforePayment` and `onPaymentComplete`.\n- An approved payment that fails before any transfer is reported, with that id and `transferAttempted: false`.\n- A failed submitted transfer is reported with `transferAttempted: true`.\n- A declined payment isn't reported.\n- An external budget keyed by `paymentId`, under 6 concurrent payments with one failure, ends with nothing held, spend equal to the completed payments, and spend within its limit.\n\n```\nvitest run src/sdk/x402/   Tests 24 passed (24), 3 consecutive runs\n```\n\nThree of the new tests fail without the change. `biome check` (2.5.14) is clean on `src/sdk/x402/` and `src/sdk/index.ts`. Strict `tsc` on the changed files reports no errors.\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\n# Evidence Gate\n\nEvidence must match the reviewed commit. `packages/scripts/pr-evidence.ts rows`\nsets the marker from the live PR head; rerun after each push.\n\u003c!-- evidence-head:663ad08a41dc441a52c6f5d09826ffe8ac8c5269 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no UI surface; wallet SDK callbacks.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - no user flow change.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] N/A - tests drive the real `X402Client.fetch` path; output above.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - independent of the model; no agent, action, provider or prompt change.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] The external-budget test asserts held = 0 and spend = completed payments after concurrent payments with one failure.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\nThe tests are the evidence. The last one is the use case: a per-agent budget kept outside the client that stays exact under concurrency.\n\n## Known gaps / failures\n\nI ran vitest, biome and tsc on `plugins/plugin-wallet` in a minimal checkout, not the full `bun install` / `bun run verify`. The new test file matches the default t.\r\n\r\nDiff: **271 production/test lines**, plus 8 documentation lines and 2 dependency\r\nmetadata lines; six files, +275/-6. The testing dependency is development-only;\r\nthe lockfile only adds that workspace dependency. Prepared with Codex assistance.\r\n\r\n# Testing\r\n\r\nWindows, pinned Node 24.15.0 / Bun 1.4.2.\r\nFinal checked head: `d6689090a4beba33ab18b4bfc8140548d3d79c70`; freshly fetched base: `65621da3a424f8fcdce760db5c9c414117082e18`.\r\n\r\n| Command | Result |\r\n| --- | --- |\r\n| `bun install --frozen-lockfile` | exit 0 |\r\n| `bun run --cwd plugins/plugin-mcp test --reporter=default --reporter=json --outputFile.json=../../test-results/eliza-pr-mcp-discovery/review-validation/package.json` | exit 0 |\r\n| `bun run --cwd plugins/plugin-mcp typecheck` | exit 0 |\r\n| `bun run --cwd plugins/plugin-mcp lint:check` | exit 0 |\r\n| `git diff --check origin/develop...HEAD` | exit 0 |\r\n| `bun run verify` | exit 0 |\r\n| `bun --conditions eliza-source --env-file=test-results/eliza-pr-mcp-discovery/.env.deepseek test-results/eliza-pr-mcp-discovery/live-deepseek.ts` | exit 0; 3 real DeepSeek calls, last-page tool executed, SQLite readback passed |\r\n\r\nFull package: **23 files, 163 passed, 0 failed, 3 skipped**. The existing opt-in\r\nnpx/registry cases account for the skips; all **18 new real-stdio regressions** run\r\nunconditionally. They cover normal and empty catalogs, empty intermediate pages,\r\nrepeated/cyclic/sticky-empty cursors, later-page RPC failures, and endless cursors\r\non each list. Endless discovery rejects explicitly while a healthy sibling stays\r\nconnected and the service load resolves.\r\n\r\nThe original 12-case harness on upstream production produced 10 failed / 2 passed;\r\nits full baseline suite produced 147 passed / 10 failed / 3 skipped. The review's\r\nnew endless cases produced three 5-second timeouts at `4a225940` before the budget\r\nwas implemented; all 18 regressions then passed with the review patch. These are\r\nseparate comparisons, not a claim that the new 18-case harness ran on clean upstream.\r\n\r\nEnvironment: process-local npm registry override; Git GNU tools with `MSYS=noglob`\r\nand `TURBO_ENV_MODE=loose`. `ELIZA_SKIP_FUSED_INFERENCE_SETUP=1` skips the optional\r\nlocal inference backend. Live validation uses the real workspace text handlers,\r\nthe real RECENT_MESSAGES provider, the registered MCP plugin/action, and isolated\r\nSQLite persistence. Unsupported DeepSeek embeddings are not registered.\r\n\r\n- [x] Targets `develop` and has no conflicts with the latest fetched `origin/develop`.\r\n- [x] Ran `bun install` and `bun run verify` after syncing; record blockers below.\r\n- [x] Updated relevant documentation.\r\n\r\n# Evidence Gate\r\n\r\nEvidence must match the reviewed commit. `packages/scripts/pr-evidence.ts rows`\r\nsets the marker from the live PR head; rerun after each push.\r\n\u003c!-- evidence-head:d6689090a4beba33ab18b4bfc8140548d3d79c70 --\u003e\r\n\r\nKeep every row. Attach artifacts inline or write `N/A - \u003creason\u003e` where\r\ninapplicable. UI changes require desktop/mobile before-and-after screenshots,\r\na walkthrough, logs, and OCR review. Use MP4 videos and preferably JPG images.\r\nKeep generated artifacts out of source control.\r\n\r\n\u003c!-- evidence-row:before-screenshots --\u003e\r\n- [x] Before full-page screenshots are attached for every affected UI surface\r\n      (desktop and mobile), or marked `N/A - no rendered UI changed; service discovery only.`.\r\n\r\n\u003c!-- evidence-row:after-screenshots --\u003e\r\n- [x] After full-page screenshots are attached for every affected UI surface\r\n      (desktop and mobile), or marked `N/A - no rendered UI changed; service discovery only.`.\r\n\r\n\u003c!-- evidence-row:walkthrough-video --\u003e\r\n- [x] A video walkthrough of the complete user flow is attached, or marked\r\n      `N/A - no UI flow changed; the real stdio transport path is exercised below.`.\r\n\r\n\u003c!-- evide  until the TTL passes and one more turn runs. |\n| `POST /api/cloud/agents/:id/shutdown` (`client.deleteAgent`) | The deleted agent keeps being narrated as running. |\n| Sign-out, then sign-in to another org on the same runtime | The cache entry survives. The next turn renders the previous org's balance and agents, labelled with the new org's id (`render(..., auth.getOrganizationId())`). |\n| `elizacloud_credits` (`credit-balance.ts`) | Reuses the shared snapshot via `getCachedAccountSnapshot`, which has no age check at all. |\n\n# Change\n\n- **Agent create/shutdown routes** (`cloud-routes-autonomous.ts`): call `invalidateCloudAccountCache` after the upstream call succeeds. The cache key is now typed as the runtime object, so the route's `RuntimeLike` needs no cast.\n- **Org scoping** (`cloud-account.ts`): each snapshot records the organization it was fetched for. The provider and the shared read ignore a snapshot from any other organization. This covers every sign-in/sign-out path without having to thread invalidation through each one.\n- **Shared read TTL:** `getCachedAccountSnapshot` returns the snapshot only within its 60 s TTL.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (base `4f0416b29be`).\n- [x] Ran `bun run verify` after syncing; record blockers below.\n- [x] Updated relevant documentation (JSDoc).\n\nNew `__tests__/unit/cloud-account-freshness.test.ts` uses the existing real-SDK loopback cloud harness:\n\n- **Create/shutdown:** warm the provider (2 agents), then drive the real `handleCloudRoute` for agent create and shutdown through a loopback HTTP request. The next `get()` reflects 3 agents, then 2.\n- **Account switch:** warm the cache under `org-first`, then switch to `org-second` with a new balance. `CLOUD_ACCOUNT` renders `(org org-second): $3.50`, and `elizacloud_credits` no longer shows `$12.34`.\n\nThe harness `makeRuntime` gains an optional `organizationId` reader.\n\nResults:\n- Against develop's sources, both tests fail (`expected '… $12.34…' to contain '3 hosted agents'`; `'ElizaCloud credits: $12.34' not to contain '12.34'`).\n- The plugin-elizacloud suite passes 82 files / 771 tests.\n- `bun run verify` passes on this head: 298/298 Turbo typecheck/lint tasks plus every audit, exit 0.\n\n# Evidence Gate\n\nEvidence must match the reviewed commit. `packages/scripts/pr-evidence.ts rows`\nsets the marker from the live PR head; rerun after each push.\n\u003c!-- evidence-head:51f717edca175f536ed043d1d2c98b9f4e000355 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered UI surface changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered UI surface changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - provider cache only.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Route status codes and provider output before/after are pinned by the tests.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] The provider text the planner receives is asserted after each mutation. I did not record a live-model run.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] N/A - no persisted artifact.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\nSee Testing.\n\n## Known gaps / failures\n\n- I did not run a live Eliza Cloud account test.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"47:T4a71,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #34093\nRefs #33124\n\nThree jsonb writes in `plugins/plugin-sql/src/base.ts` skipped the shared sanitizer that #33124 extended to lone surrogates: the parent update when `publishMessageContentSegments` runs in replace mode, the head of `compareAndSwapMemoryPublication`, and `updateLogs`. A NUL or a lone UTF-16 surrogate in those writes reached PostgreSQL and failed with the raw `22P05` / `22P02` driver error. That error's message also carries the bound content. The matching create paths return typed codes instead. The public `runtime.replaceMessageMemoryContent` reaches the first write, and plugin-assistant calls it after attachment enrichment, incoming-hook rewrites and translation.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Change\n\n1. **Message content replacement.** In replace mode, `publishMessageContentSegments` now serializes the replacement parent with `serializeJsonb(content, { memoryContent: true })` (`base.ts:2128`). That is the policy `insertMemoryInTransaction` applies to a `messages` row in create mode. The update binds the result as `::jsonb` (`base.ts:2226`). The serialization runs first in the replace branch, before the row lock, the expected-content check and any segment delete or insert. Bad text is therefore refused with `SQL_JSON_UNSUPPORTED_NUL` / `SQL_JSON_UNSUPPORTED_SURROGATE` and nothing is written.\n2. **Atomic publication head.** `compareAndSwapMemoryPublication` serializes the head's content and metadata with the same table-based selection `insertMemoryInTransaction` uses: `serializeDocumentJsonb` for a `document_fragments` head, otherwise `serializeJsonb` with `memoryContent: true` and `documentText` set only for `documents`. Metadata goes through `serializeJsonb(metadata ?? {})` (`base.ts:7937-7944`). It replaces the two `JSON.stringify` calls. This runs before `withDatabase`, so no dependency row is staged, and PostgreSQL's `withRetry` does not retry a rejection that depends only on the input.\n3. **Log updates.** `updateLogs` binds a new body the way `log()` binds one: `JSON.stringify(sanitizeJsonObject(body))` cast to `jsonb` (`base.ts:7895`). NUL is stripped and lone surrogates become U+FFFD. The sanitized value has to be bound as text: `sanitizeJsonObject` builds null-prototype objects, and drizzle's `.set()` reads `Object.getPrototypeOf(value).constructor` on a plain value, which throws for those.\n\nBehaviour that follows from reusing the create-path policy:\n\n- An invalid replacement or head is refused before the conflict check. A call that is both invalid and stale now gets the typed error instead of `conflict`.\n- `updateLogs` also gets `log()`'s structural budget: depth 64, 10,000 nodes, 1 MiB serialized. A body that `log()` would refuse fails with `SQL_JSON_SANITIZE_UNBOUNDED`, and the stored body is unchanged. No production code in the repository passes a body to `updateLogs`; plugins reach it through `runtime.updateLogs`.\n\nNo schema, migration, route, or public type changes. Both `PgDatabaseAdapter` and `PgliteDatabaseAdapter` inherit these methods from `BaseDrizzleAdapter` and override none of them.\n\n# Testing\n\nEnvironment: Bun 1.3.14 on this machine (the repository pins 1.4.2), Node 24.15.0, `bun install --frozen-lockfile --ignore-scripts`. This is not CI parity. One commit, `55dcb5a3b8`, on `origin/develop` `65621da3a4`. The real suites ran on PGlite through an untracked local config, not committed: it merges `src/vitest.real.config.ts` with `resolve.conditions` and `ssr.resolve.conditions` set to `[\"eliza-source\"]`, and with `retry: 0`. A clean worktree has no built `@elizaos/core`, so the committed config cannot resolve it (`Failed to resolve entry for package \"@elizaos/core\"`). With only `resolve.conditions` set, Vitest 5 still failed to resolve it. Commands run from `plugins/plugin-sql/src`.\n\n| Control | Command | Result |\n| --- | --- | --- |\n| GREEN, memory | `bunx vitest run --config ../vitest.local-real.config.ts __tests__/integration/memory.real.test.ts` | 57 passed (57) |\n| GREEN, logs | same, `__tests__/integration/log.real.test.ts` | 14 passed (14) |\n| GREEN, publication suite | same, `__tests__/integration/message-content-segments.real.test.ts` | 2 passed (2) |\n| RED, memory, `base.ts` from `origin/develop` | `git checkout origin/develop -- plugins/plugin-sql/src/base.ts`, same command | 2 failed, 55 passed (57): the two new tests, raw `DrizzleQueryError` `22P02` |\n| RED, logs, `base.ts` from `origin/develop` | same | 1 failed, 13 passed (14): the new test, raw `22P05` |\n| Runtime API, develop | `runtime.replaceMessageMemoryContent(id, { text: \"x \\ud83d\" })` on real PGlite | `Failed query: update \"memories\" ...`, cause `22P02` `invalid input syntax for type json`, stored content unchanged |\n| Runtime API, head | same | `ElizaError` `SQL_JSON_UNSUPPORTED_SURROGATE`, stored content unchanged |\n| Package typecheck | `bun run --cwd plugins/plugin-sql typecheck` (tsc 7.0.2, 1418 files including `base.ts`) | exit 0 |\n| Test-file types | untracked tsconfig over the two changed test files, which the package typecheck excludes | 34 errors in develop's versions, the same 34 at head; none from the new code |\n| Biome 2.5.14, the 3 changed files | `node_modules/.bin/biome check \u003cfiles\u003e` | no diagnostics |\n| Repository gate | `bun run verify` | not run locally; see Known gaps |\n\nWhat the new tests check:\n\n- `memory.real.test.ts:336` runs `runtime.replaceMessageMemoryContent` with a lone high surrogate and a NUL in `text`, the same two in a nested `content.metadata` value, and a replacement over the 64 KiB inline limit with a lone surrogate in `thought`. That last one would stage segment rows before the parent update. Each call must fail with the typed code, leave the stored message `toEqual` its previous value, and leave the memory table holding only that message. An emoji replacement is then stored unchanged. The replace path writes only `content`, so the metadata case is the content's nested `metadata` object.\n- `memory.real.test.ts:367` runs `compareAndSwapMemoryPublication` with a fresh dependency on every call. It covers a lone surrogate and a NUL in head `content.text` and in a head metadata value, for both a first publication (insert) and a revision swap (update). Each call must fail with the typed code and leave the head and the full set of memory row ids unchanged. A revision swap with an emoji in content and metadata then publishes and reads back unchanged.\n- `log.real.test.ts:367` updates a stored log with NUL and lone high and low surrogates at the top level and one level deep. It reads back `{ status: \"done \\ufffd\", source: \"kept 🙂\", metadata: { text: \"ab\", reply: \"cut \\ufffd\" } }`. An over-depth body then fails with `SQL_JSON_SANITIZE_UNBOUNDED` and leaves that stored body unchanged.\n\n- [x] Targets `develop`. The branch is one commit on `origin/develop` `65621da3a4`, re-fetched before writing this, and has no conflicts.\n- [ ] `bun install` and `bun run verify` after syncing: `bun install --frozen-lockfile --ignore-scripts` ran. `bun run verify` was not run locally, because root turbo gates are off-limits on this 8 GB machine. The owning package's typecheck, the three affected real suites and Biome pass at head. Hosted CI is the authority for the full gate.\n- [x] Updated relevant documentation: no document describes these write paths. The headers of the two test files now name the surfaces they cover, and each changed write has a short comment naming the policy it shares.\n\n# Evidence Gate\n\nEvidence must match the reviewed commit. `packages/scripts/pr-evidence.ts rows`\nsets the marker from the live PR head; rerun after each push.\n\u003c!-- evidence-head:55dcb5a3b8b40048f0ba813cd26f6548d8dac7a5 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003 /script><script>self.__next_f.push([1,"# Relates to\n\n`chunkSlackText` (exported from `@elizaos/plugin-slack`, also used by `markdownToSlackMrkdwnChunks`) sends empty code blocks when a split lands next to a fence. Same class as #34062 / #34063 (core `chunkMarkdownText`) and #34082 (Discord `chunkDiscordText`); Slack has its own fence-parity chunker, so it needs its own fix.\n\nOn `develop`:\n\n- `chunkSlackText(\"Lead paragraph text.\\n\\n```\\nconst x = 1;\\n```\", 30)` → first message is ``\"Lead paragraph text.\\n\\n```\\n\\n```\"`` (empty block).\n- ``\"```\\n\" + \"a\"*20 + \"\\n\\n```\\nOutro.\"`` at 30 → second message is ``\"```\\n```\\nOutro.\"`` (the reopened fence closes immediately).\n- At small limits the break can cut through a ```` ``` ```` marker (``\"wwww\\n`\"`` + ``\"``\\nab...\"``), so the fence-parity state flips and prose after the block is wrapped in code.\n- At `maxChars` ≤ 9 inside a code block the reopened ```` ```\\n ```` uses the whole `maxChars - 4` budget (or the one remaining unit is half a surrogate pair), so the loop makes no progress and never returns. It grows memory until the process is killed.\n\nScope: nothing inside `plugin-slack` calls `chunkSlackText` (the service uses its own `splitMessage`), and the default limit is 40,000, so this is a correctness fix for the exported helper rather than a measured live-send bug.\n\n# Change\n\n`chunkSlackText` (`plugins/plugin-slack/src/formatting.ts`):\n\n1. **Opening side.** If the chunk's last fence opens a block with only whitespace after it, the chunk ends before that fence and the block starts in the next chunk. If only whitespace precedes the fence, that whitespace is skipped instead of being sent as its own message. If the chunk *starts* at the fence (the first chunk, or any reopened chunk), the whitespace is skipped and nothing is emitted for it; the block is then reopened, or its closer consumed, as in the next item.\n2. **Closing side.** After a split inside a block, if only w Service.getTranscript` parses the first `subtitles.en` variant that has a `url` as SRT. yt-dlp's YouTube extractor lists manual subtitles as `json3, srv1, srv2, srv3, ttml, srt, vtt`, so that first variant is `json3`. `parseSRT` then drops two lines of the JSON document and returns the rest as the transcript, so every YouTube video with manual English subtitles gets raw JSON as its transcript text.\r\n\r\n`parseSRT` also always drops the first two lines of each block. A WebVTT cue without an identifier loses its first text line. And because it splits only on `\\n\\n`, whitespace-only separators or bare-CR line endings let cue numbers and `--\u003e` timings leak into the text.\r\n\r\n## Fix\r\n\r\n- `manualSubtitleUrl()` prefers the `srt` variant, then `vtt`, then any variant with a url. That last fallback covers extractors that omit `ext` and keeps the #29564 behaviour of skipping url-less leading entries.\r\n- `parseSRT` normalizes `\\r\\n`/`\\r`, splits cues on blank or whitespace-only lines, and keeps only the lines after each block's `--\u003e` timing line. Blocks with no timing line (WEBVTT header, NOTE, STYLE) are dropped.\r\n- `YtDlpSubtitleTrack` gains the optional `ext` field yt-dlp already returns.\r\n\r\n## Tests\r\n\r\n- `repro-transcript.test.ts`: a YouTube-shaped variant list selects `fmt=srt` and yields `hello there`. A list without `srt` falls back to `vtt` and keeps cues that have no identifier.\r\n- `video.test.ts`: `parseSRT` keeps WebVTT cues without identifiers and splits on whitespace-only and bare-CR separators. The existing CRLF test still passes.\r\n\r\nOn develop the 4 new tests fail: the transcript is `\"events\": [ { \"tStartMs\": 1000, ... } ] }`, the first VTT cue is dropped, and timings leak. With the fix they pass.\r\n\r\n\u003cimg width=\"1665\" height=\"639\" alt=\"before\" src=\"https://github.com/user-attachments/assets/f1efc7cc-2bfb-4975-aa12-4ce3e27b944d\" /\u003e\r\n\u003cimg width=\"1331\" height=\"324\" alt=\"after\" src=\"ht d. A test pins this.\n\nCode content, the 2000-character limit, and fence balance are unchanged. Only whitespace-only fence remnants and redundant fence lines are removed.\n\nNot changed here: Slack's `chunkSlackText` has the same pattern; it is fixed separately in #34089. iMessage trims whitespace at chunk boundaries; that's a separate behavior.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [x] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [x] Updated relevant documentation. (N/A: internal chunking behavior.)\n\nResults:\n- Two new tests in `plugins/plugin-discord/__tests__/messaging-chunking.test.ts`:\n  - The 690-shape sweep at production defaults. Each chunk must stay within 2000 characters with balanced fences and no empty block; code lines must arrive intact and in order.\n  - 5 closing-side shapes (blank line before the closer, `\"``` \"`, `\"~~~  \"`, ```` \"`````\" ```` after ```` ````md ````, `\"```\\t\"` after `\"\\n \\n\"`) at `maxChars` 20..80. Each chunk must stay within the limit with balanced fences and no empty or whitespace-only block; the code must be preserved.\n  - An unterminated trailing opener (``\"x\"*50 + \"\\n\\n```ts\"`` at `maxChars` 20) sends no code block.\n  - An authored ```` ```\\n   \\n``` ```` block inside one chunk is kept byte-for-byte.\n  - `develop`: 7 cases fail. `4ecc5ddf` (first revision): 1 fails (the trailing opener). This branch: 21/21 pass.\n- Wide fuzz (26,136 cases: 6 fence styles × 4 pre-closer gaps × 3 body sizes × 3 widths × `maxChars` 20..140, two fences per text):\n\n  | | Empty blocks | Unclosed fences | Over-limit chunks | Lost content |\n  |---|---|---|---|---|\n  | `develop` | 5,791 | 0 | 0 | 0 |\n  | this branch | 0 | 0 | 0 | 0 |\n\n- `plugins/plugin-discord`: `bun run test` passes 104 files / 843 tests; `bun run typecheck` and Biome are clean.\n- `bun run verify` (pinned Node 24.15.0 / Bun 1.4.2): exit 0, full chain, at `4 seView` → `ElizaClient.getDatabaseRows`. It pages with `LIMIT … OFFSET …`, each page a separate query, over:\n- `ORDER BY \u003csort column\u003e \u003cdir\u003e` when a sort is chosen, with no tie-break;\n- no `ORDER BY` at all when unsorted.\n\nOn develop (base `65621da3a42`), a sort column with ties (a type, a status, a shared timestamp) is therefore not a total order. PostgreSQL may return tied rows in a different order for each page query, so rows are shown twice and others never. Unsorted pages follow heap order, which changes after `UPDATE`/`VACUUM`; `plugin-sql/src/base.ts` documents the same hazard for its own queries.\n\nExample: paging 120 rows sorted by a two-valued column, 25 per page, shows only 98 distinct rows.\n\n# Change\n\n- The route looks up the table's primary-key columns, using the same `information_schema.table_constraints`/`key_column_usage` join as `GET /api/database/tables`.\n- The order becomes `ORDER BY \u003csort\u003e \u003cdir\u003e, \u003cpk…\u003e \u003cdir\u003e`, or just the primary key when unsorted.\n- A table without a primary key falls back to its physical row id (`ctid`).\n- Sort validation, search, `total`, and the response shape are unchanged.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (base `65621da3a42`).\n- [x] Ran `bun run verify` after syncing; record blockers below.\n- [x] Updated relevant documentation (inline comment).\n\nNew `packages/agent/test/database-rows-paging.test.ts` runs on a real PGlite runtime and serves the real `handleDatabaseRoute` over HTTP:\n- It creates a 120-row table with a two-valued `kind` column, then updates some rows.\n- It pages 25 at a time, sorted by `kind` and unsorted.\n- Every id must appear exactly once.\n\nResults:\n- Against develop's route, the test fails: `expected 98 to be 120` distinct ids.\n- `bun run verify` passes on this head: 298/298 Turbo typecheck/lint tasks plus every audit, exit 0.\n\n# Evidence Gate\n\nEvidence must ma t the owner's day |\n\nDesktop installs, where the host zone is the owner's, are unaffected. #12995 moved these helpers from UTC to host-local, not to the owner's zone.\n\n# Change\n\n- Both helpers take an optional `timeZone`. With it, they compute that zone's civil days using plugin-health's `util/time` (`getZonedDateParts`, `buildUtcDateFromLocalParts`, `addDaysToLocalDate`, `getWeekdayForLocalDate`, `getLocalDateKey`), so 23- and 25-hour DST days are exact. Bucket labels format in that zone.\n- Without a zone they keep the host's days. That is the user's own zone when the helpers run in the app, so other callers are unchanged.\n- `getScreenTimeHistory` resolves the owner's zone (`resolveOwnerTimeZone`) and passes it to both helpers.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (base `65621da3a42`).\n- [x] Ran `bun run verify` after syncing; record blockers below.\n- [x] Updated relevant documentation (JSDoc).\n\nNew cases in `ranges.localdate.test.ts`, all with the host set to `TZ=UTC`:\n\n| Case | Expected |\n| --- | --- |\n| `today` at 16:00 PDT, owner in Los Angeles | Starts at `2026-10-06T07:00Z` |\n| `this-week` | Starts Sunday Oct 4 00:00 PDT |\n| History across the DST change | Buckets begin at `07:00Z` for Oct 31 and Nov 1, and at `08:00Z` for Nov 2 |\n\nResults:\n- Both new cases fail against develop's `ranges.ts`.\n- plugin-health `src/screen-time` passes 28/28, and the personal-assistant screen-time tests pass 7 files / 136.\n- `bun run verify` passes on this head: 298/298 Turbo typecheck/lint tasks plus every audit, exit 0.\n\nThis touches the same import block of `screentime-service.ts` as #34073. Whichever merges second will need a trivial rebase.\n\n# Evidence Gate\n\nEvidence must match the reviewed commit. `packages/scripts/pr-evidence.ts rows`\nsets the marker from the live PR head; rerun after each push.\n\u003c!-- evidence-head:a24ac8ab7ba7280316df1cef4589d2690225bd1e --\u003e\n\n\u003c!-- evid e\n\n- `getScreenTimeDaily` takes an optional `timeZone`. With it, the window is that zone's civil day: local midnight to the next local midnight, built with the PA's `buildUtcDateFromLocalParts` and `addDaysToLocalDate`, so 23- and 25-hour DST days are exact.\n- Without a zone it keeps the UTC day, so other callers are unchanged.\n- The action passes the `timeZone` it already resolves. The two forwarding declarations (`LifeOpsService`, the screen-time mixin) and the plugin-health `ScreenTimeActionService` interface gain the optional field.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop` (base `65621da3a42`).\n- [x] Ran `bun run verify` after syncing; record blockers below.\n- [x] Updated relevant documentation (JSDoc).\n\nNew `screentime-service.daily-window.test.ts` records the window `getScreenTimeDaily` reads:\n\n| Input | Window |\n| --- | --- |\n| Los Angeles, 2026-10-06 | `07:00Z` → `06:59:59.999Z` next day |\n| Los Angeles, 2026-11-01 (DST end) | A 25-hour window: `07:00Z` → `07:59:59.999Z` next day |\n| No zone | The UTC day |\n\n- The `screen-time.test.ts` action assertions now also pin the zone passed (`Asia/Tokyo`, `UTC`).\n- Against develop's service, both zoned cases fail.\n- The personal-assistant screen-time tests pass 8 files / 139 tests, and plugin-health passes 39 files / 222 tests.\n- `bun run verify` passes on this head: 298/298 Turbo typecheck/lint tasks plus every audit, exit 0.\n\n# Evidence Gate\n\nEvidence must match the reviewed commit. `packages/scripts/pr-evidence.ts rows`\nsets the marker from the live PR head; rerun after each push.\n\u003c!-- evidence-head:4dbddf526607e51c3c42843f5ee02f95e9472d96 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered UI surface changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered UI surface changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - query window only.\n\u003c!--  If it would still exceed `limit`, the regular path runs instead.\n- `findClosingFenceLine` only matches the line that actually closed the span: same marker character, marker length at least the opener's, and only spaces or tabs after it, matching `parseFenceSpans`. A fence that runs to EOF has no closing line and keeps the old path.\n- `\\r` is stripped before matching, so CRLF closers take the same path once #34057 lands.\n\nRevision 2 (`131759a7`) fixes the `limit + 1` overflow reported by @mtcow and @ss251 at `a6a4b96`. When the body ended in a blank line, the first version kept both newlines.\n\n# Testing\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [x] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [x] Updated relevant documentation. (N/A: internal chunking behavior; no docs describe it.)\n\nResults:\n- New `packages/core/test/markdown-chunk-fences.test.ts` sweeps limits 16..110 for 6 closing lines, each after one newline and after a blank line (12 cases, including the plain ```` ``` ```` control). For every chunk it asserts the limit holds, every fence is closed, and no code block is empty or whitespace-only; it also checks that all code content survives and that the trailing paragraph is emitted.\n  - `develop`: 11/12 fail.\n  - `a6a4b96`: 6/12 fail (`expected 17 to be less than or equal to 16`).\n  - this head: 12/12 pass.\n- Wide fuzz, 27,864 cases: 6 opener/closer pairs × 4 pre-closer gaps × 3 body sizes × 3 widths × limits 12..140, two fences per text.\n\n  | Revision | Over-limit chunks | Empty or whitespace-only blocks | Highest limit with an empty block | Unclosed fences | Lost content |\n  |---|---|---|---|---|---|\n  | `develop` | 0 | 2,579 | 95 | 282 | 0 |\n  | `a6a4b96` | 660 | 1,008 | 94 | 282 | 0 |\n  | this head | 0 | 72 | 12 | 282 | 0 |\n\n  The remaining empty blocks and all unclosed fences occur only at limit 12, the smallest tested, and are the same in every revision.
