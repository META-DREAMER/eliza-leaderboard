# Acceptance\n\n- An all-read cache triggers exactly one live pull; the returned unread view comes from the live result.\n- When the live pull also yields no unread, the explicit empty-inbox result is reported (now live-verified, and the adapter pull is observable).\n- Existing cached-unread and empty-cache behaviors are unchanged.\n- Tests cover both cases against the real action handler."])</script><script>self.__next_f.push([1,"15:T489,Hi @lalalune @lumix5,\n\nFirst off, genuine respect for this project — an open-source agentic OS with this\nbreadth (multi-platform desktop app, plugin runtime, agent API) is rare, and the\nengineering quality shows. Case in point: my security report got a fix PR within\nabout an hour, and both issues were verified with regression tests and closed\nwithin two days. That turnaround is among the best I've seen in open source.\n\nI'm the reporter of #33034 and #33036. Since both are already fixed on develop\n(#33040, #33142, #33169), I'm opening this only as a follow-up to a request I\nleft on both threads on Oct 4, which I suspect went unnoticed — quite\nunderstandable, since both were closed by then.\n\n## The request\n\nCould you help get CVE IDs assigned for these two vulnerabilities?\n\nFor context on why it matters: users running `@elizaos/app` ≤ 2.0.3-beta.7 are\nexposed to silent theft of the OWNER-level token / plaintext stored provider\nkeys by any website they visit. A published GHSA + CVE is how most users and\nscanners learn that a desktop update is security-critical, and it also records\nhow quickly you fixed it.\n\nThanks again for the fast fixes!\n16:T9d6,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n#34093 / #34094 route memory-content replacement, atomic-publication heads, and `updateLogs` through the jsonb sanitizer. The rest of the entity-graph writes in `plugins/plugin-sql/src/base.ts` still bind caller objects through drizzle's default `JSON.stringify` (or a hand-built `JSON.stringify(...)::jsonb`), with no check for text PostgreSQL jsonb cannot store. A NUL character or a lone UTF-16 surrogate (typically a truncated emoji) in entity, component, room, world, task, relationship, cache or agent data fails in the driver:\n\n- Some writes surface the raw `22P02` / `22P05` `DrizzleQueryError`.\n- Others wrap it in a generic `DB_*_FAILED`.\n\nThe memory path returns the typed `SQL_JSON_UNSUPPORTED_NUL` / `SQL_JSON_UNSUPPORTED_SURROGATE` instead. In both cases the drizzle `Failed query` message embeds the bound parameters, so the caller's data goes into any log that records the error.\n\n**To Reproduce**\n\nOn `origin/develop` `65621da3a4` (with #34094 applied), real PGlite via `createIsolatedTestDatabase`. Each write gets `{ note: \"x \\ud83d\" }` in its jsonb field:\n\n| Write | Result |\n|---|---|\n| `updateEntity` metadata | raw `22P02`, `Failed query: update \"entities\" …` |\n| `createComponent` data | raw `22P02`, `Failed query: insert into \"components\" …` |\n| `updateRoom` metadata | raw `22P02`, `Failed query: update \"rooms\" …` |\n| `updateWorld` metadata | raw `22P02`, `Failed query: update \"worlds\" …` |\n| `createTask` metadata | raw `22P02`, `Failed query: insert into \"tasks\" …` |\n| `createEntities` metadata | `DB_INSERT_FAILED` wrapping the raw error |\n| `createRelationship` metadata | `DB_INSERT_FAILED` wrapping the raw error |\n| `setCache` value | `DB_UPSERT_FAILED` wrapping the raw error |\n| `updateAgent` settings | `DB_UPDATE_FAILED` wrapping the raw error |\n\nOther sites with the same binding:\n- `createAgent`, `updateComponent`, `createRooms`, `updateRelationship`, `createWorld`, `updateTask`;\n- `compareAndSwapWorldMetadata`, `patchComponents`, `updatePendingTask`, `patchTaskMetadata`;\n- the cache compare-and-swap.\n\n**Expected behavior**\n\nThese writes reject unsupported text before the bind with the same typed `SQL_JSON_UNSUPPORTED_NUL` / `SQL_JSON_UNSUPPORTED_SURROGATE` errors, carrying no content.\n\nRouting them through `serializeJsonb` would also apply its 1 MiB / 10,000-node / depth-64 structural caps and cycle rewriting. That would add new hard limits to component, task and agent data that have none today, so the check should be text-only.\n"])</script><script>self.__next_f.push([1,"17:T24f9,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nThree jsonb writes in `plugins/plugin-sql/src/base.ts` bind caller text without the shared sanitizer in `plugins/plugin-sql/src/sanitize-json.ts`. A NUL character or a lone UTF-16 surrogate (half of a pair, typically a truncated emoji) reaches PostgreSQL and fails with the driver's raw `22P05` / `22P02` error. The matching create paths return a typed error instead: `SQL_JSON_UNSUPPORTED_NUL` / `SQL_JSON_UNSUPPORTED_SURROGATE` for memory rows, and for log bodies the NUL is stripped and the surrogate replaced with U+FFFD. #33124 added the lone-surrogate half of that policy to the sanitizer, but these three writes never call it.\n\n- `base.ts:2223`, `publishMessageContentSegments` in replace mode: `.set({ content: params.replacementContent })` passes the content object to drizzle, which binds `JSON.stringify(value)`. Create mode of the same method writes the parent through `insertMemoryInTransaction` (`base.ts:2122`), which applies the strict serializer to content and metadata (`base.ts:4672-4680`). The public `runtime.replaceMessageMemoryContent` (`packages/core/src/runtime.ts:5264`, `packages/core/src/runtime/data-mutations.ts:413-470`) reaches this branch. plugin-assistant calls it through `replaceStoredMessageContent` after attachment enrichment, after an incoming hook rewrites the text, and after translation (`plugins/plugin-assistant/src/services/message/processor.ts:526`, `:581`, `:1110`). Text under the 64 KiB inline limit stays in the parent row, so it reaches this write. Longer text goes to segment rows, which are already sanitized.\n- `base.ts:7978-7979`, `compareAndSwapMemoryPublication`: the head's content and metadata are bound as `JSON.stringify(...)` with a `::jsonb` cast. The dependencies of the same publication go through `insertMemoryInTransaction`.\n- `base.ts:7890`, `updateLogs`: `setValues.body = updates.body` binds the new body unsanitized. `log()` passes the body through `sanitizeJsonObject` first (`base.ts:4052`).\n\nThe raw error is also a worse failure to surface: drizzle's `Failed query` message embeds the bound parameters, so the whole content goes into any log that records the error. The typed errors carry no content.\n\n**To Reproduce**\n\nOn `origin/develop` `65621da3a4`, with Bun 1.3.14, Node 24.15.0 and `bun install --frozen-lockfile --ignore-scripts`. The probe uses a real PGlite adapter and the real `AgentRuntime` from `createIsolatedTestDatabase` (`plugins/plugin-sql/src/__tests__/test-helpers.ts`), and creates a room and an entity first:\n\n```ts\nawait adapter.createMemory({ id, agentId, entityId, roomId, content: { text: \"original\" }, metadata: { type: \"message\" } }, \"messages\");\nawait runtime.replaceMessageMemoryContent(id, { text: \"x \\ud83d\" });\nawait runtime.replaceMessageMemoryContent(id, { text: \"x \\u0000\" });\nawait adapter.compareAndSwapMemoryPublication({ head: { memory: { id: headId, agentId, entityId, roomId, content: { text: \"x \\ud83d\" }, metadata: { revision: \"r1\" } }, tableName: \"probe_heads\" }, dependencies: [], expectedRevision: null });\nawait adapter.compareAndSwapMemoryPublication({ /* same head */ content: { text: \"ok\" }, metadata: { revision: \"r1\", note: \"a\\u0000b\" } });\nawait adapter.log({ body: { reply: \"first\" }, entityId, roomId, type: \"probe\" });\nawait adapter.updateLogs([{ id: logId, updates: { body: { reply: \"done \\ud83d\", nested: { text: \"a\\u0000b\" } } } }]);\n```\n\nProbe output, verbatim (the error message is cut at 160 characters by the probe):\n\n```\nreplaceMessageMemoryContent text lone surrogate: THROWS Error | code=undefined | message=\"Failed query: update \\\"memories\\\" set \\\"content\\\" = $1 where \\\"memories\\\".\\\"id\\\" = $2 returning \\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\" | cause.name=error | cause.code=22P02 | cause.message=\"invalid input syntax for type json\"\nreplaceMessageMemoryContent text lone surrogate: stored content after = {\"text\":\"original\"}\nreplaceMessageMemoryContent text NUL: THROWS Error | code=undefined | message=\"Failed query: update \\\"memories\\\" set \\\"content\\\" = $1 where \\\"memories\\\".\\\"id\\\" = $2 returning \\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\" | cause.name=error | cause.code=22P05 | cause.message=\"unsupported Unicode escape sequence\"\nreplaceMessageMemoryContent text NUL: stored content after = {\"text\":\"original\"}\ncompareAndSwapMemoryPublication content lone surrogate: THROWS Error | code=undefined | message=\"Failed query: insert into \\\"memories\\\" (\\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\\\", \\\"world_id\\\", \\\"unique\\\", \\\"metadata\\\") values ($1, $\" | cause.name=error | cause.code=22P02 | cause.message=\"invalid input syntax for type json\"\ncompareAndSwapMemoryPublication content lone surrogate: stored rows after = 0\ncompareAndSwapMemoryPublication metadata NUL: THROWS Error | code=undefined | message=\"Failed query: insert into \\\"memories\\\" (\\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\\\", \\\"world_id\\\", \\\"unique\\\", \\\"metadata\\\") values ($1, $\" | cause.name=error | cause.code=22P05 | cause.message=\"unsupported Unicode escape sequence\"\ncompareAndSwapMemoryPublication metadata NUL: stored rows after = 0\nupdateLogs lone surrogate + NUL: THROWS Error | code=undefined | message=\"Failed query: update \\\"logs\\\" set \\\"body\\\" = $1 where (\\\"logs\\\".\\\"id\\\" = $2 and \\\"logs\\\".\\\"room_id\\\" in (select \\\"id\\\" from \\\"rooms\\\" where \\\"rooms\\\".\\\"agent_id\\\" = $3))\\nparams: {\\\"\" | cause.name=error | cause.code=22P02 | cause.message=\"invalid input syntax for type json\"\nupdateLogs: stored body after = {\"reply\":\"first\"}\n```\n\nThe complete error for the first call, as Vitest prints it (`runtime.replaceMessageMemoryContent(id, { text: \"x \\ud83d\" })`, real PGlite). The message ends with the bound parameters, which hold the content:\n\n```\nDrizzleQueryError {\n  \"message\": \"Failed query: update \\\"memories\\\" set \\\"content\\\" = $1 where \\\"memories\\\".\\\"id\\\" = $2 returning \\\"id\\\", \\\"type\\\", \\\"created_at\\\", \\\"content\\\", \\\"entity_id\\\", \\\"agent_id\\\", \\\"room_id\\\", \\\"world_id\\\", \\\"unique\\\", \\\"metadata\\\"\nparams: {\\\"text\\\":\\\"x \\\\ud83d\\\"},31809931-c3e8-4f75-8d43-491cf88ee69d\",\n  \"cause\": error {\n    \"message\": \"invalid input syntax for type json\",\n    \"code\": \"22P02\",\n    \"detail\": \"Unicode low surrogate must follow a high surrogate.\",\n```\n\n**Expected behavior**\n\nEach write applies the policy its create path already applies:\n\n- The replacement parent and the publication head reject with `ElizaError` `SQL_JSON_UNSUPPORTED_SURROGATE` or `SQL_JSON_UNSUPPORTED_NUL`, as `createMemory` does. Nothing is written: the parent is unchanged, and no segment or dependency row is staged.\n- `updateLogs` stores the body with NUL removed and lone surrogates replaced by U+FFFD, as `log()` does.\n- Well-formed surrogate pairs such as emoji are stored unchanged.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - storage-adapter behaviour with no rendered surface. The transcripts above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcripts.\n- [x] Backend logs and frontend console/network logs when relevant: the adapter's thrown errors and the stored rows are above. N/A for frontend: no frontend code is involved.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved. The probe calls the runtime API directly.\n- [x] Domain artifacts when relevant: the stored message content, publication row count and log body after each call are in the transcript.\n\n**Additional context**\n\n- Follow-up to #33124 (#33125), which taught the shared sanitizer to handle lone surrogates.\n- The two in-repo `compareAndSwapMemoryPublication` callers, `plugins/plugin-google-workspace/src/gmail-content-cache.ts:433` and `plugins/plugin-assistant/src/features/advanced-memory/session-summary-content-manifest.ts:505`, put `JSON.stringify(...)` output in `content.text`, which already escapes NUL and lone surrogates. They do not hit the raw error today. The gap is in the adapter method itself, and in the head's metadata values.\n- No in-repo caller passes a body to `updateLogs`. Plugins reach it through `runtime.updateLogs` (`packages/core/src/runtime.ts:4674`).\n- Out of scope here: other jsonb writes. #33124 noted that cache, component, entity and room metadata writes do not use this sanitizer either.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"18:T772,"])</script><script>self.__next_f.push([1,"`chunkMarkdownText` (`packages/core/src/markdown/chunk.ts`) can emit an empty code block, then reopen the fence in the next chunk, when a fenced block's closing line is longer than `indent + marker`. That covers trailing spaces or tabs (`\"``` \"`), a longer closing marker (```` ```` ```` closing ```` ``` ````), an indented closer (`\"  ```\"`), and `\"~~~ \"`. Every outbound text that goes through the markdown chunker is affected.\n\n## Reproduction (current `develop` `65621da3a42`, Bun 1.4.2)\n\n```ts\nimport { chunkMarkdownText } from \"@elizaos/core\";\nconst body = Array.from({ length: 10 }, (_, i) =\u003e `line ${i} value${\"x\".repeat(i % 4)}`);\nconst text = `Intro.\\n\\n\\`\\`\\`ts\\n${body.join(\"\\n\")}\\n\\`\\`\\` \\n\\nOutro paragraph.`;\nchunkMarkdownText(text, 16);\n// [..., \"```ts\\nline 9\\n```\", \"```ts\\n``` \\n\", \"Outro paragraph.\"]\n```\n\nAcross limits 16..110 with the same 10-line block, empty code-block chunks per closing line:\n\n| Closing line | `\"```\"` | `\"``` \"` | `\"```  \"` | `\"```\\t\"` | ```` \"````\" ```` | `\"~~~ \"` | `\"  ```\"` | `\"  ``` \"` | ```` \"``````   \" ```` |\n|---|---|---|---|---|---|---|---|---|---|\n| Empty blocks | 0 | 4 | 8 | 4 | 4 | 4 | 8 | 11 | 23 |\n\n## Cause\n\nWhen a split lands inside a fence, the chunker reserves room only for the synthetic closer `${indent}${marker}`. If the original closing line is longer, there are limits where the chunk fits the synthetic closer but not the real one. The cut then lands at the start of the real closing line, and the next chunk reopens the fence (`openLine + \"\\n\"`) just to close it again.\n\nOnce #34057 (CRLF fence recognition) merges, CRLF input hits the same path, because the `\\r` makes every CRLF closing line one character longer.\n\n## Expected\n\nWhen the cut leaves no fence content, close the fence in the current chunk and drop the original closing line. No chunk should be an empty code block, and code content and the chunk limit stay unchanged.\n"])</script><script>self.__next_f.push([1,"19:Tcb0,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nIn `plugins/plugin-wallet/src/sdk/x402/client.ts`, a payment is checked with `this.budget.checkBudget(service, amount)` (sync), then `await this.executePayment(selected)` (an on-chain transfer), and only afterwards recorded with `this.budget.recordPayment(log)`. `X402BudgetTracker` keeps `dailySpend` in memory and only updates it in `recordPayment`. So concurrent x402 requests to the same service can all pass the per-service `dailyLimit` check before any of them is recorded, and the agent spends past the configured service cap.\n\nScope, to be precise: the AgentWallet contract's on-chain spend policy (`setSpendPolicy` / `remainingBudget`) still bounds global spend when it's configured. What can be exceeded is the client-side per-service caps (`serviceBudgets[].dailyLimit`) and `globalDailyLimit` when no on-chain policy is set.\n\n**To Reproduce**\n\nA minimal script against the real `budget.ts` (at `f7a6b0fea5`) that mirrors the client's check → await → record order:\n\n```ts\nimport { X402BudgetTracker } from \"./budget.ts\";\nconst tracker = new X402BudgetTracker({\n  serviceBudgets: [{ service: \"api.example.com\", maxPerRequest: 1_000_000n, dailyLimit: 5_000_000n }], // $5/day\n});\nconst executePayment = () =\u003e new Promise\u003cvoid\u003e((r) =\u003e setTimeout(r, 50)); // stands in for the transfer\nasync function pay(i: number) {\n  if (!tracker.checkBudget(\"api.example.com\", 1_000_000n).allowed) return \"blocked\";\n  await executePayment();\n  tracker.recordPayment({ timestamp: Date.now(), service: \"api.example.com\", url: `https://api.example.com/${i}`,\n    amount: 1_000_000n, token: \"0x00…00\", recipient: \"0x00…01\", success: true } as any);\n  return \"paid\";\n}\nconst outcomes = await Promise.all(Array.from({ length: 10 }, (_, i) =\u003e pay(i)));\n```\n\nOutput (`bun run repro.ts`):\n\n```\n10 concurrent $1 payments against a $5/day service cap -\u003e paid=10, blocked=0, recorded spend=$10\nnext check after they settle: allowed=false (Would exceed daily limit 5000000 for api.example.com)\n```\n\n**Expected behavior**\n\nAt most 5 of the 10 payments proceed, and the rest are blocked before `executePayment` runs.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - not a visible bug; the reproduction output above is the evidence.\n\n**Evidence / reproduction proof**\n\n- [ ] MP4 recording or JPG screenshots: N/A - logic race, no UI.\n- [x] Logs: script output above.\n- [ ] Real-LLM trajectory: N/A - independent of the model.\n- [x] Domain artifacts: recorded spend $10 against a $5 service cap.\n\n**Additional context**\n\nA small fix that keeps the existing API: have `checkBudget` *reserve* the amount synchronously when it allows a payment (add it to a pending total that the daily checks include), then turn the reservation into spend in `recordPayment`, or release it if `executePayment` throws or fails. Because there's no `await` between the check and the hold, concurrent requests can't both pass against the same remaining budget. Totals would still be in memory, so restarts reset them; that seems acceptable as long as the on-chain policy is the hard limit.\n\nI'm happy to send that as a PR with a test based on the reproduction above. (I maintain Inferrail, where I fixed the same pattern.)\n"])</script><script>self.__next_f.push([1,"1a:T58c,"])</script><script>self.__next_f.push([1,"Install the tested release on four phones and verify the demo.\n\n## Detailed Description\n\n**Estimate:** 2 working days. **Needs:** accepted AOSP image, APK/SMS/call integration and offline routine delivery. Nubs owns rollout; Shaw supplies the tested image and rollback instructions.\n\n- Pin the accepted OS, APK and host revisions.\n- Provision four devices with separate identities and pairings.\n- Check cloud voice, SMS, agreed calls and offline-result recovery on every phone.\n- Record per-device results and one complete walkthrough.\n- Provide install, pairing, recovery and rollback instructions.\n\nThis starts after the image and integrations pass. It does not include new hardware bring-up or fleet-management software.\n\n- Close the jointly agreed P0/P1 list and attach per-device acceptance results.\n- Have a client engineer reproduce the build and deployment from delivered source and guides.\n- Nubs records an unedited three-minute demo covering the device experience and end-to-end pairing.\n- Deliver the source, build scripts and device/Alpha deployment guides. Carry final branded-release acceptance into #31034.\n\n**Done when:** all four phones pass the demo and another engineer can provision a device from the handoff.\n\nRun the affected package checks and required repository gates; attach real model/device/AWS evidence where applicable.\n\n[Project and schedule](https://github.com/orgs/elizaOS/projects/20)\n"])</script><script>self.__next_f.push([1,"1b:T6a2,"])</script><script>self.__next_f.push([1,"Run existing reminders, briefs and nudges on the hosted agent.\n\n## Detailed Description\n\n**Estimate:** 1 working day. **After:** https://github.com/elizaOS/eliza/issues/31021\n\n- Enable the selected existing routines with the owner’s timezone, schedules and connected accounts.\n- Reuse the existing scheduler and pack setup. Preserve pauses, deletions and duplicate-prevention keys.\n- Send results through durable history so they appear after the phone reconnects.\n- Verify edit, pause, cancel and \n## Repro\n\n```ts\ndescribeRecurrence(\n  [\"RRULE:FREQ=WEEKLY;UNTIL=20110617T065959Z\"],\n  \"America/Los_Angeles\",\n);\n// develop: \"weekly until Jun 17, 2011\"\n// expected: \"weekly until Jun 16, 2011\"\n```\n\n## Expected\n\nDate-time UNTIL labels use the event IANA timezone; date-only UNTIL stays on the stated calendar date.\n\n## Area\n\n`plugins/plugin-calendar/src/internal/recurrence.ts` — `describeRecurrence` / `formatUntilLabel`, call sites in `calendar-handler.ts`.\n1d:T596,"])</script><script>self.__next_f.push([1,"### Bug\n\n`VideoService.getTranscript` (`plugins/plugin-video/src/services/video.ts`) takes the first `subtitles.en` variant that has a `url` and always parses it with `parseSRT`.\n\nyt-dlp's YouTube extractor lists each manual subtitle language as variants in a fixed order: `json3, srv1, srv2, srv3, ttml, srt, vtt` (`_SUBTITLE_FORMATS` in `yt_dlp/extractor/youtube`). That makes the first usable variant `json3`, so for any YouTube video with manual English subtitles, `parseSRT` gets a JSON3 document. It drops the first two lines and joins the rest, and the transcript ends up as raw JSON:\n\n```\n\"events\": [ { \"tStartMs\": 1000, \"dDurationMs\": 3000, \"segs\": [ { \"utf8\": \"hello there\" } ] } ] }\n```\n\n`parseSRT` also breaks on WebVTT and on loosely formatted SRT:\n- It always drops the first two lines of each block, so a WebVTT cue without an identifier loses its first text line (single-line cues vanish).\n- It splits only on `\\n\\n`, so a whitespace-only separator line or bare-CR line endings merge cues, and the next cue's number and `--\u003e` timing leak into the transcript (`Hello world! 2 00:00:04,500 --\u003e 00:00:07,000 This is a test.`).\n\n### Expected\n\nManual subtitles produce the cue text only (`hello there`).\n\n### Repro\n\nMock yt-dlp info with `subtitles.en` = the YouTube variant list above, and return JSON3 for the `fmt=json3` URL and SRT for `fmt=srt`. `processVideo(...).text` comes back as JSON text, not the cue text.\n"])</script><script>self.__next_f.push([1,"1e:T483,### What happens\n`parsePdfSpecDate` (`plugins/plugin-pdf/services/pdf-date.ts`) clamps each `D:` field independently (month 1–12, day 1–31, …). Calendar-impossible combinations that still pass those ranges — February 30, April 31, February 29 outside a leap year — are handed to `Date.setUTCFullYear` / `setFullYear`, which overflow into the next month. `PdfService.getDocumentInfo` then surfaces that invented instant as `CreationDate` / `ModDate`.\n\nSo a corrupt or hand-edited PDF metadata date becomes a plausible-looking wrong date instead of being dropped (the contract already stated for unparseable `D:` strings).\n\n### Repro\n```ts\nparsePdfSpecDate(\"D:20240230120000Z\")\n// develop: 2024-03-01T12:00:00.000Z\n// expected: undefined\n\nparsePdfSpecDate(\"D:20240431120000Z\")\n// develop: 2024-05-01T12:00:00.000Z\n\nparsePdfSpecDate(\"D:20230229120000Z\")\n// develop: 2023-03-01T12:00:00.000Z\n```\n\n### Expected\nIf the declared wall-clock is not a real calendar day, return `undefined` so metadata omits the date. Keep the existing out-of-range clamp defaults (`D:20241340Z` → January 1). Real leap days (`D:20240229…`, year 0 Feb 29) stay valid.\n1f:T5b9,"])</script><script>self.__next_f.push([1,"`IDatabaseAdapter.searchEntitiesByName` documents a case-insensitive substring search whose results are \"ordered by relevance (exact matches first)\", capped at `limit`. The SQL adapter (`plugins/plugin-sql/src/base.ts`, `searchEntitiesByName`) doesn't do that:\n\n1. **No ORDER BY in either branch.** Both the empty-query Drizzle query and the substring `db.execute` query apply `LIMIT` with no `ORDER BY`. The page is whatever physical order the heap returns, so \"the first N entities\" depends on write history (imports, restores, row rewrites), not on the data.\n2. **No exact-match priority.** A query that exactly equals an entity's name can be cut off by `limit` in favour of older partial matches.\n3. **LIKE ified source exactly; the isolated update has no conflicts with checked develop `65621da3a424f8fcdce760db5c9c414117082e18`.\n\n\nA standalone reminder mentioning a phone no longer preloads calling/delegation tools merely because of the reminder message. The existing registered-owner and operation checks preserve explicit contexts, compound calls and discovery. The captured request is covered with real registered action families; 203 focused tests, assistant typecheck and full combined verification passed.\n"])</script><script>self.__next_f.push([1,"26:T152a,"])</script><script>self.__next_f.push([1,"Ordinary briefing requests could acquire sources the user never requested, make redundant model calls, and describe an off-time preview using the wrong local-day framing. This PR binds strictly recognized whole briefing requests to their admitted owner, composes once from complete evidence, and preserves the original request's dates, source scope, and authorization.\n\nThe final scope includes:\n\n- Required BRIEF operation on the outer native tool schema. Valid calls choose the operation up front; missing operations retain the existing family subplanner, while malformed operations fail before the handler. There is no global subplanner bypass or operation guessed from arbitrary text.\n- Existing connected-source defaults and owner-local daypart policy for ordinary requests, with named morning/evening kinds preserved. Explicit source/format requests, compounds, standalone calls, source failures, and recalibration authorization retain their contracts.\n- Complete grounding sent once to final composition, factual temporal-preview guidance, and impression accounting only after actual delivered completion. Cancellation, failure, early acknowledgments, and replay stay protected.\n- Caller-authorized definition rows shared within one brief assembly, avoiding discarded plan/occurrence/performance enrichment. Other consumers retain the enriched API. No new I/O or source-body omis o merge, promotion, or deployment is requested.\n"])</script><script>self.__next_f.push([1,"27:Tac3,"])</script><script>self.__next_f.push([1,"# Change\n\nFixes concrete defects found during the open PR and issue review. Calendar summaries keep all-day civil dates. Blocker status does not become stale after a late read. SOL transfers reject amounts that cannot be represented exactly before signer access. Branch caches remain separate for each credential. Empty workflow input stays empty. Entity search treats percent and underscore literally and returns exact matches first. PDF dates reject impossible days while keeping local daylight-saving behavior. Video transcripts use supported subtitle formats and retain the existing fallback sources.\n\nAlso includes targeted saved-fact history guidance, JSON extraction requests, normalized keyword matching, a retained-error policy comment, and the reviewed contribution guidance.\n\n# Relates to\n\nIntegrates original ancestry from #34162, #34163, #34164, #34171, #34172, #34173, #34174, #34175, #34177, #34179, #34181, and #34183. Resolves the source defects in #34168, #34176, #34178, and #34182 after merge.\n\nClock #34167 stays in draft because physical-phone acceptance is incomplete. Its source and UI test repair remain in #34180. Production promotion #33708 also stays separate.\n\n# Why this implementation\n\nUses the current parsers, caches, formatting helpers, scheduler inputs, and transport boundaries. Review repairs cover observed races and incorrect output. They do not add a new service or change ownership rules.\n\n# Testing\n\nUses Bun 1.4.2 and Node 24.15.0. The combined local integration passed repository verification (298 tasks), focused owner tests, and the app browser checks. This branch contains the same reviewed fix source, with Clock removed. Fresh verification and hosted checks for this exact branch are running.\n\nFocused results include Calendar 53, wallet 19, blocker 60, PDF 66, video 63 (4 existing skips ents (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2039\"\u003e#2039\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/a1c16ab3f07f354aa371c38f7b1b07ea7fd4c5c8\"\u003e\u003ccode\u003ea1c16ab\u003c/code\u003e\u003c/a\u003e Honour simple_templates everywhere in referenceFS (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2029\"\u003e#2029\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/85facaaf2659c8bbd031df24ead9aca36668c635\"\u003e\u003ccode\u003e85facaa\u003c/code\u003e\u003c/a\u003e Fix infinite recursion in expand_path when resolving paths with glob magic ch...\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/fsspec/filesystem_spec/compare/2026.3.0...2026.6.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `multidict` from 6.7.1 to 6.9.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/aio-libs/multidict/releases\"\u003emultidict's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.9.1\u003c/h2\u003e\n\u003ch2\u003eBug fixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed the C extension reading freed memory on free-threaded builds when a\nlist handed to :py:meth:\u003ccode\u003e~multidict.MultiDict.update\u003c/code\u003e,\n:py:meth:\u003ccode\u003e~multidict.MultiDict.extend\u003c/code\u003e, :py:meth:\u003ccode\u003e~multidict.MultiDict.merge\u003c/code\u003e\nor the :py:class:\u003ccode\u003e~multidict.MultiDict\u003c/code\u003e and :py:class:\u003ccode\u003e~multidict.CIMultiDict\u003c/code\u003e\nconstructors, a \u003ccode\u003e[key, value]\u003c/code\u003e item inside any iterable handed to them, or a\nlist tested with \u003ccode\u003ein\u003c/code\u003e against :py:meth:\u003ccode\u003e~multidict.MultiDict.items\u003c/code\u003e, is\nchanged by another thread; a call that catches the list shrinking under it\nnow raises :py:exc:\u003ccode\u003eRuntimeError\u003c/code\u003e -- by :user:\u003ccode\u003erodrigobnogueira\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1437\"\u003e#1437\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a data race on the free-threaded build where a retired hash table's\nreader count used relaxed atomics, letting a lock-free \u003ccode\u003eget()\u003c/code\u003e/\u003ccode\u003egetone()\u003c/code\u003e/\n\u003ccode\u003e__getitem__()\u003c/code\u003e read race a concurrent free of that table. The reader-exit\ndecrement and the drain's free check now use release/acquire ordering\ninstead -- by :user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1481\"\u003e#1481\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a free-threaded build bug where two threads calling \u003ccode\u003eupdate()\u003c/code\u003e,\n\u003ccode\u003emerge()\u003c/code\u003e, or \u003ccode\u003e__setitem__()\u003c/code\u003e on the same key at the same time could lose\nthe key entirely instead of just racing on which value wins. A decref of the\nreplaced value could transiently suspend the writer's critical section,\nletting a second writer for the same key observe the first writer's\nin-progress entry as absent and, once both settled, mistake it for a stale\nduplicate and delete it. Every such decref is now deferred until the writer\nhas released its critical section, so the window can no longer open.\n\u003ccode\u003esetdefault()\u003c/code\u003e had an unrelated instance of the same blind spot (it could\ninsert a duplicate rather than recognizing an in-flight key), fixed alongside\nit -- by :user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1483\"\u003e#1483\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a free-threaded build bug where \u003ccode\u003egetall()\u003c/code\u003e and the \u003ccode\u003eitems()\u003c/code\u003e/\n\u003ccode\u003ekeys()\u003c/code\u003e/\u003ccode\u003evalues()\u003c/code\u003e equality path could raise \u003ccode\u003eKeyError\u003c/code\u003e or report a\npresent, never-deleted key as missing. A concurrent \u003ccode\u003eupdate()\u003c/code\u003e/\u003ccode\u003eextend()\u003c/code\u003e/\n\u003ccode\u003e__setitem__()\u003c/code\u003e call can have its critical section transiently suspended\n(a decref triggering a blocking allocator call) while an entry is marked as\npart of its own bookkeeping; a reader landing in that window used to treat\nthe mark as \u0026quot;not found\u0026quot; instead of \u0026quot;still there, in flight\u0026quot; -- by\n:user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/aio-libs/multidict/blob/master/CHANGES.rst\"\u003emultidict's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e6.9.1\u003c/h1\u003e\n\u003cp\u003e\u003cem\u003e(2026-09-21)\u003c/em\u00 u003ccode\u003e0a1770c\u003c/code\u003e\u003c/a\u003e Release 6.9.1 (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1504\"\u003e#1504\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/d220522b54b1989c90a96aa50c42bb0264d46210\"\u003e\u003ccode\u003ed220522\u003c/code\u003e\u003c/a\u003e Upload release assets one at a time to avoid the secondary rate limit (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1503\"\u003e#1503\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/30cd596f945ed7b69f5502c693339224043eb9e9\"\u003e\u003ccode\u003e30cd596\u003c/code\u003e\u003c/a\u003e Stop a GIL-releasing \u003cstrong\u003edel\u003c/strong\u003e from segfaulting the standard C extension build ...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/d1c331ab2617299a1385fff29ef4da64e50bd071\"\u003e\u003ccode\u003ed1c331a\u003c/code\u003e\u003c/a\u003e Recheck the reader gate after taking the retired list (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1502\"\u003e#1502\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/b37f07c1a16122f95208936f2e58f55ea99cdbaf\"\u003e\u003ccode\u003eb37f07c\u003c/code\u003e\u003c/a\u003e Allocate deferred decrefs in fixed-size blocks (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1501\"\u003e#1501\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/563f667307c376744ca345802ca835f8b84ba947\"\u003e\u003ccode\u003e563f667\u003c/code\u003e\u003c/a\u003e Run CodSpeed benchmarks on Python 3.14 and loop the smallest ones (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1498\"\u003e#1498\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/157c87c6cecbeac0011b085e8f6c2496754c17e6\"\u003e\u003ccode\u003e157c87c\u003c/code\u003e\u003c/a\u003e Cancel superseded CI runs on pull requests (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1500\"\u003e#1500\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/d43adfe27f759a2810a900db73fc85ab3660e75b\"\u003e\u003ccode\u003ed43adfe\u003c/code\u003e\u003c/a\u003e Drop -I from the ASan test command so PYTHONMALLOC takes effect (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1499\"\u003e#1499\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/2a68472db036f199ecb1c1a0c66872eeb03a3135\"\u003e\u003ccode\u003e2a68472\u003c/code\u003e\u003c/a\u003e Stop items() iteration from reading a freed entry in CIMultiDict (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1496\"\u003e#1496\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/cd528d6d82dc1465042459b3cc143dc58c5ce6ab\"\u003e\u003ccode\u003ecd528d6\u003c/code\u003e\u003c/a\u003e Rename GHSA-54p9-h82j-f925 changelog fragment to the merged commit (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1495\"\u003e#1495\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/aio-libs/multidict/compare/v6.7.1...v6.9.1\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `werkzeug` from 3.1.8 to 3.1.9\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/pallets/werkzeug/releases\"\u003ewerkzeug's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e3.1.9\u003c/h2\u003e\n\u003cp\u003eThis is the Werkzeug 3.1.9 security fix release, which fixes security issues and bugs but does not otherwise change behavior and should not result in breaking changes compared to the latest feature release.\u003c/p\u003e\n\u003cp\u003ePyPI: \u003ca href=\"https://pypi.org/project/Werkzeug/3.1.9/\"\u003ehttps://pypi.org/project/Werkzeug/3.1.9/\u003c/a\u003e\nChanges: \u003ca href=\"https://werkzeug.palletsprojects.com/page/changes/#version-3-1-9\"\u003ehttps://werkzeug.palletsprojects.com/page/changes/#version-3-1-9\u003c/a\u003e\nMilestone: \u003ca href=\"https://github.com/pallets/werkzeug/milestone/46?closed=1\"\u003ehttps://github.com/pallets/werkzeug/milestone/46?closed=1\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esafe_join\u003c/code\u003e on Windows does not allow special devices names with empty ADS markers on NTFS. \u003ca href=\"https://github.com/pallets/werkzeug/security/advisories/GHSA-g6x2-hccm-hh4m\"\u003ehttps://github.com/pallets/werkzeug/security/advisories/GHSA-g6x2-hccm-hh4m\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eProfilerMiddleware\u003c/code\u003e uses \u003ccode\u003eprofiling.tracing\u003c/code\u003e on Python 3.15. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3207\"\u003e#3207\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003euri_to_iri\u003c/code\u003e and \u003ccode\u003eiri_to_uri\u003c/code\u003e preserve empty username, password, and port 0. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3189\"\u003e#3189\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_options_header\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3231\"\u003e#3231\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_etags\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3231\"\u003e#3231\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_cookie\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3231\"\u003e#3231\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eget_host\u003c/code\u003e also checks that the port is in the valid range. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3236\"\u003e#3236\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe \u003ccode\u003eint\u003c/code\u003e URL converter returns a 404 instead of 500 error when the value is longer than \u003ccode\u003esys.get_int_max_str_digits()\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3237\"\u003e#3237\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove debugger PIN generation from cgroup data inside Podman. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3245\"\u003e#3245\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAuthorization\u003c/code\u003e parsing \u003ccode\u003ebasic\u003c/code\u003e auth disallows non-base64 characters.  \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3248\"\u003e#3248\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapplication/x-www-form-urlencoded\u003c/code\u003e form data is no longer limited to \u003ccode\u003emax_form_memory_size\u003c/code\u003e, only \u003ccode\u003emax_content_length\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3251\"\u003e#3251\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLimitedStream.readinto\u003c/code\u003e does not resize the buffer when it reads less than the remaining size. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3253\"\u003e#3253\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eRules with 10 or more converters in a single part assign matched values correctly. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3254\"\u003e#3254\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe invalid \u003ccode\u003eRange\u003c/code\u003e suffix length \u003ccode\u003e-0\u003c/code\u003e is no longer accepted. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3255\"\u003e#3255\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/pallets/werkzeug/blob/main/CHANGES.rst\"\u003ewerkzeug's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eVersion 3.1.9\u003c/h2\u003e\n\u003cp\u003eReleased 2026-09-27\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esafe_join\u003c/code\u003e on Windows does not allow special devices names with empty ADS\nmarkers on NTFS. :ghsa:\u003ccode\u003eg6x2-hccm-hh4m\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eProfilerMiddleware\u003c/code\u003e uses \u003ccode\u003eprofiling.tracing\u003c/code\u003e on Python 3.15.\n:issue:\u003ccode\u003e3207\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003euri_to_iri\u003c/code\u003e and \u003ccode\u003eiri_to_uri\u003c/code\u003e preserve empty username, password, and\nport 0. :issue:\u003ccode\u003e3189\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_options_header\u003c/code\u003e. :pr:\u003ccode\u003e3231\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_etags\u003c/code\u003e. :pr:\u003ccode\u003e3231\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_cookie\u003c/code\u003e. :pr:\u003ccode\u003e3231\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eget_host\u003c/code\u003e also checks that the port is in the valid range. :pr:\u003ccode\u003e3236\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eThe \u003ccode\u003eint\u003c/code\u003e URL converter returns a 404 instead of 500 error when the value\nis longer than \u003ccode\u003esys.get_int_max_str_digits()\u003c/code\u003e. :issue:\u003ccode\u003e3237\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eImprove debugger PIN generation from cgroup data inside Podman.\n:issue:\u003ccode\u003e3245\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAuthorization\u003c/code\u003e parsing \u003ccode\u003ebasic\u003c/code\u003e auth disallows non-base64 characters.\n:pr:\u003ccode\u003e3248\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapplication/x-www-form-urlencoded\u003c/code\u003e form data is no longer limited to\n\u003ccode\u003emax_form_memory_size\u003c/code\u003e, only \u003ccode\u003emax_content_length\u003c/code\u003e. :pr:\u003ccode\u003e3251\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLimitedStream.readinto\u003c/code\u003e does not resize the buffer when it reads less\nthan the remaining size. :pr:\u003ccode\u003e3253\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eRules with 10 or more converters in a single part assign matched values\ncorrectly. :pr:\u003ccode\u003e3254\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eThe invalid \u003ccode\u003eRange\u003c/code\u003e suffix length \u003ccode\u003e-0\u003c/code\u003e is no longer accepted. :pr:\u003ccode\u003e3255\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/pallets/werkzeug/commit/6604c3b8784ecc7cf5ac0b7412d916989b4c7d45\"\u003e\u003ccode\u003e6604c3b\u003c/code\u003e\u003c/a\u003e release version 3.1.9\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/pallets/werkzeug/commit/a78b30ac0cafe53a4f252ffbf827bf6da7591341\"\u003e\u003ccode\u003ea78b30a\u003c/code\u003e\u003c/a\u003e update dependencies\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/pallets/werkzeug/commit/8d77320bcdf3a34941ec06dcf16b03c065cd21b6\"\u003e\u003ccode\u003e iew\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `fsspec` from 2026.4.0 to 2026.6.0\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/a2457004d03e0312f715f90f58873de5ab195a37\"\u003e\u003ccode\u003ea245700\u003c/code\u003e\u003c/a\u003e changelog (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2049\"\u003e#2049\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/652325d9b9459286a5b72c7e6228b061fb29827c\"\u003e\u003ccode\u003e652325d\u003c/code\u003e\u003c/a\u003e Fix async cat ranges on error (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2045\"\u003e#2045\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/073aac840748ab95bea39468306123268e316184\"\u003e\u003ccode\u003e073aac8\u003c/code\u003e\u003c/a\u003e Forward kwargs from cat_ranges to cat_file (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2044\"\u003e#2044\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/2818611ab2a197cb3d560d50be09fdb5fbff775d\"\u003e\u003ccode\u003e2818611\u003c/code\u003e\u003c/a\u003e FTP: preserve filenames containing whitespace in _mlsd2 (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2043\"\u003e#2043\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/c87938473cd5a25448385b3fb77481574595e353\"\u003e\u003ccode\u003ec879384\u003c/code\u003e\u003c/a\u003e Prevent attribute error by checking for 'forced' attribute before flushing ca...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/71b8a6b6b1c3dbb33fa5cb0c206a84b35164d035\"\u003e\u003ccode\u003e71b8a6b\u003c/code\u003e\u003c/a\u003e Reflect async _walk correctly (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2040\"\u003e#2040\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/5eec9f9353b8d517d296428441a84fa26e9a6438\"\u003e\u003ccode\u003e5eec9f9\u003c/code\u003e\u003c/a\u003e Fix: Omit \u003ccode\u003ethreading.get_ident()\u003c/code\u003e from cache token for async implementations ...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/86438783f93b1398ef245b92f0e6063b445b611c\"\u003e\u003ccode\u003e8643878\u003c/code\u003e\u003c/a\u003e Small safety improvements (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2039\"\u003e#2039\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/a1c16ab3f07f354aa371c38f7b1b07ea7fd4c5c8\"\u003e\u003ccode\u003ea1c16ab\u003c/code\u003e\u003c/a\u003e Honour simple_templates everywhere in referenceFS (\u003ca href=\"https://redirect.github.com/fsspec/filesystem_spec/issues/2029\"\u003e#2029\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/fsspec/filesystem_spec/commit/85facaaf2659c8bbd031df24ead9aca36668c635\"\u003e\u003ccode\u003e85facaa\u003c/code\u003e\u003c/a\u003e Fix infinite recursion in expand_path when resolving paths with glob magic ch...\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/fsspec/filesystem_spec/compare/2026.3.0...2026.6.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `multidict` from 6.7.1 to 6.9.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/aio-libs/multidict/releases\"\u003emultidict's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.9.1\u003c/h2\u003e\n\u003ch2\u003eBug fixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed the C extension reading freed memory on free-threaded builds when a\nlist handed to :py:meth:\u003ccode\u003e~multidict.MultiDict.update\u003c/code\u003e,\n:py:meth:\u003ccode\u003e~multidict.MultiDict.extend\u003c/code\u003e, :py:meth:\u003ccode\u003e~multidict.MultiDict.merge\u003c/code\u003e\nor the :py:class:\u003ccode\u003e~multidict.MultiDict\u003c/code\u003e and :py:class:\u003ccode\u003e~multidict.CIMultiDict\u003c/code\u003e\nconstructors, a \u003ccode\u003e[key, value]\u003c/code\u003e item inside any iterable handed to them, or a\nlist tested with \u003ccode\u003ein\u003c/code\u003e against :py:meth:\u003ccode\u003e~multidict.MultiDict.items\u003c/code\u003e, is\nchanged by another thread; a call that catches the list shrinking under it\nnow raises :py:exc:\u003ccode\u003eRuntimeError\u003c/code\u003e -- by :user:\u003ccode\u003erodrigobnogueira\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1437\"\u003e#1437\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a data race on the free-threaded build where a retired hash table's\nreader count used relaxed atomics, letting a lock-free \u003ccode\u003eget()\u003c/code\u003e/\u003ccode\u003egetone()\u003c/code\u003e/\n\u003ccode\u003e__getitem__()\u003c/code\u003e read race a concurrent free of that table. The reader-exit\ndecrement and the drain's free check now use release/acquire ordering\ninstead -- by :user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1481\"\u003e#1481\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a free-threaded build bug where two threads calling \u003ccode\u003eupdate()\u003c/code\u003e,\n\u003ccode\u003emerge()\u003c/code\u003e, or \u003ccode\u003e__setitem__()\u003c/code\u003e on the same key at the same time could lose\nthe key entirely instead of just racing on which value wins. A decref of the\nreplaced value could transiently suspend the writer's critical section,\nletting a second writer for the same key observe the first writer's\nin-progress entry as absent and, once both settled, mistake it for a stale\nduplicate and delete it. Every such decref is now deferred until the writer\nhas released its critical section, so the window can no longer open.\n\u003ccode\u003esetdefault()\u003c/code\u003e had an unrelated instance of the same blind spot (it could\ninsert a duplicate rather than recognizing an in-flight key), fixed alongside\nit -- by :user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1483\"\u003e#1483\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a free-threaded build bug where \u003ccode\u003egetall()\u003c/code\u003e and the \u003ccode\u003eitems()\u003c/code\u003e/\n\u003ccode\u003ekeys()\u003c/code\u003e/\u003ccode\u003evalues()\u003c/code\u003e equality path could raise \u003ccode\u003eKeyError\u003c/code\u003e or report a\npresent, never-deleted key as missing. A concurrent \u003ccode\u003eupdate()\u003c/code\u003e/\u003ccode\u003eextend()\u003c/code\u003e/\n\u003ccode\u003e__setitem__()\u003c/code\u003e call can have its critical section transiently suspended\n(a decref triggering a blocking allocator call) while an entry is marked as\npart of its own bookkeeping; a reader landing in that window used to treat\nthe mark as \u0026quot;not found\u0026quot; instead of \u0026quot;still there, in flight\u0026quot; -- by\n:user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/aio-libs/multidict/blob/master/CHANGES.rst\"\u003emultidict's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e6.9.1\u003c/h1\u003e\n\u003cp\u003e\u003cem\u003e(2026-09-21)\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003eBug fixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed the C extension reading freed memory on free-threaded builds when a\nlist handed to :py:meth:\u003ccode\u003e~multidict.MultiDict.update\u003c/code\u003e,\n:py:meth:\u003ccode\u003e~multidict.MultiDict.extend\u003c/code\u003e, :py:meth:\u003ccode\u003e~multidict.MultiDict.merge\u003c/code\u003e\nor the :py:class:\u003ccode\u003e~multidict.MultiDict\u003c/code\u003e and :py:class:\u003ccode\u003e~multidict.CIMultiDict\u003c/code\u003e\nconstructors, a \u003ccode\u003e[key, value]\u003c/code\u003e item inside any iterable handed to them, or a\nlist tested with \u003ccode\u003ein\u003c/code\u003e against :py:meth:\u003ccode\u003e~multidict.MultiDict.items\u003c/code\u003e, is\nchanged by another thread; a call that catches the list shrinking under it\nnow raises :py:exc:\u003ccode\u003eRuntimeError\u003c/code\u003e -- by :user:\u003ccode\u003erodrigobnogueira\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n:issue:\u003ccode\u003e1437\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a data race on the free-threaded build where a retired hash table's\nreader count used re ent, never-deleted key as missing. A concurrent \u003ccode\u003eupdate()\u003c/code\u003e/\u003ccode\u003eextend()\u003c/code\u003e/\n\u003ccode\u003e__setitem__()\u003c/code\u003e call can have its critical section transiently suspended\n(a decref triggering a blocking allocator call) while an entry is marked as\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/0a1770c7e69845c8ef2000b3707cd7f1917a6944\"\u003e\u003ccode\u003e0a1770c\u003c/code\u003e\u003c/a\u003e Release 6.9.1 (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1504\"\u003e#1504\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/d220522b54b1989c90a96aa50c42bb0264d46210\"\u003e\u003ccode\u003ed220522\u003c/code\u003e\u003c/a\u003e Upload release assets one at a time to avoid the secondary rate limit (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1503\"\u003e#1503\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/30cd596f945ed7b69f5502c693339224043eb9e9\"\u003e\u003ccode\u003e30cd596\u003c/code\u003e\u003c/a\u003e Stop a GIL-releasing \u003cstrong\u003edel\u003c/strong\u003e from segfaulting the standard C extension build ...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/d1c331ab2617299a1385fff29ef4da64e50bd071\"\u003e\u003ccode\u003ed1c331a\u003c/code\u003e\u003c/a\u003e Recheck the reader gate after taking the retired list (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1502\"\u003e#1502\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/b37f07c1a16122f9 003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/aio-libs/multidict/releases\"\u003emultidict's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.9.1\u003c/h2\u003e\n\u003ch2\u003eBug fixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed the C extension reading freed memory on free-threaded builds when a\nlist handed to :py:meth:\u003ccode\u003e~multidict.MultiDict.update\u003c/code\u003e,\n:py:meth:\u003ccode\u003e~multidict.MultiDict.extend\u003c/code\u003e, :py:meth:\u003ccode\u003e~multidict.MultiDict.merge\u003c/code\u003e\nor the :py:class:\u003ccode\u003e~multidict.MultiDict\u003c/code\u003e and :py:class:\u003ccode\u003e~multidict.CIMultiDict\u003c/code\u003e\nconstructors, a \u003ccode\u003e[key, value]\u003c/code\u003e item inside any iterable handed to them, or a\nlist tested with \u003ccode\u003ein\u003c/code\u003e against :py:meth:\u003ccode\u003e~multidict.MultiDict.items\u003c/code\u003e, is\nchanged by another thread; a call that catches the list shrinking under it\nnow raises :py:exc:\u003ccode\u003eRuntimeError\u003c/code\u003e -- by :user:\u003ccode\u003erodrigobnogueira\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1437\"\u003e#1437\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a data race on the free-threaded build where a retired hash table's\nreader count used relaxed atomics, letting a lock-free \u003ccode\u003eget()\u003c/code\u003e/\u003ccode\u003egetone()\u003c/code\u003e/\n\u003ccode\u003e__getitem__()\u003c/code\u003e read race a concurrent free of that table. The reader-exit\ndecrement and the drain's free check now use release/acquire ordering\ninstead -- by :user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1481\"\u003e#1481\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a free-threaded build bug where two threads calling \u003ccode\u003eupdate()\u003c/code\u003e,\n\u003ccode\u003emerge()\u003c/code\u003e, or \u003ccode\u003e__setitem__()\u003c/code\u003e on the same key at the same time could lose\nthe key entirely instead of just racing on which value wins. A decref of the\nreplaced value could transiently suspend the writer's critical section,\nletting a second writer for the same key observe the first writer's\nin-progress entry as absent and, once both settled, mistake it for a stale\nduplicate and delete it. Every such decref is now deferred until the writer\nhas released its critical section, so the window can no longer open.\n\u003ccode\u003esetdefault()\u003c/code\u003e had an unrelated instance of the same blind spot (it could\ninsert a duplicate rather than recognizing an in-flight key), fixed alongside\nit -- by :user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1483\"\u003e#1483\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFixed a free-threaded build bug where \u003ccode\u003egetall()\u003c/code\u003e and the \u003ccode\u003eitems()\u003c/code\u003e/\n\u003ccode\u003ekeys()\u003c/code\u003e/\u003ccode\u003evalues()\u003c/code\u003e equality path could raise \u003ccode\u003eKeyError\u003c/code\u003e or report a\npresent, never-deleted key as missing. A concurrent \u003ccode\u003eupdate()\u003c/code\u003e/\u003ccode\u003eextend()\u003c/code\u003e/\n\u003ccode\u003e__setitem__()\u003c/code\u003e call can have its critical section transiently suspended\n(a decref triggering a blocking allocator call) while an entry is marked as\npart of its own bookkeeping; a reader landing in that window used to treat\nthe mark as \u0026quot;not found\u0026quot; instead of \u0026quot;still there, in flight\u0026quot; -- by\n:user:\u003ccode\u003easvetlov\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/aio-libs/multidict/blob/master/CHANGES.rst\"\u003emultidict's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e6.9.1\u003c/h1\u003e\n\u003cp\u003e\u003cem\u003e(2026-09-21)\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003eBug fixes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFixed the C extension reading freed memory on free-threaded builds when a\nlist handed to :py:meth:\u003ccode\u003e~multidict.MultiDict.update\u003c/code\u003e,\n:py:meth:\u003ccode\u003e~multidict.MultiDict.extend\u003c/code\u003e, :py:meth:\u003ccode\u003e~multidict.MultiDict.merge\u003c/code\u003e\nor the :py:class:\u003ccode\u003e~multidict.MultiDict\u003c/code\u003e and :py:class:\u003ccode\u003e~multidict.CIMultiDict\u003c/code\u003e\nconstructors, a \u003ccode\u003e[key, value]\u003c/code\u003e item inside any iterable handed to them, or a\nlist tested with \u003ccode\u003ein\u003c/code\u003e against :py:meth:\u003ccode\u003e~multidict.MultiDict.items\u003c/code\u003e, is\nchanged by another thread; a call that catches the list shrinking under it\nnow raises :py:exc:\u003ccode\u003eRuntimeError\u003c/code\u003e -- by :user:\u003ccode\u003erodrigobnogueira\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRelated issues and pull requests on GitHub:\u003c/em\u003e\n:issue:\u003ccode\u003e143 github.com/aio-libs/multidict/issues/1502\"\u003e#1502\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/b37f07c1a16122f95208936f2e58f55ea99cdbaf\"\u003e\u003ccode\u003eb37f07c\u003c/code\u003e\u003c/a\u003e Allocate deferred decrefs in fixed-size blocks (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1501\"\u003e#1501\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/563f667307c376744ca345802ca835f8b84ba947\"\u003e\u003ccode\u003e563f667\u003c/code\u003e\u003c/a\u003e Run CodSpeed benchmarks on Python 3.14 and loop the smallest ones (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1498\"\u003e#1498\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/157c87c6cecbeac0011b085e8f6c2496754c17e6\"\u003e\u003ccode\u003e157c87c\u003c/code\u003e\u003c/a\u003e Cancel superseded CI runs on pull requests (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1500\"\u003e#1500\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/d43adfe27f759a2810a900db73fc85ab3660e75b\"\u003e\u003ccode\u003ed43adfe\u003c/code\u003e\u003c/a\u003e Drop -I from the ASan test command so PYTHONMALLOC takes effect (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1499\"\u003e#1499\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/2a68472db036f199ecb1c1a0c66872eeb03a3135\"\u003e\u003ccode\u003e2a68472\u003c/code\u003e\u003c/a\u003e Stop items() iteration from reading a freed entry in CIMultiDict (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1496\"\u003e#1496\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/aio-libs/multidict/commit/cd528d6d82dc1465042459b3cc143dc58c5ce6ab\"\u003e\u003ccode\u003ecd528d6\u003c/code\u003e\u003c/a\u003e Rename GHSA-54p9-h82j-f925 changelog fragment to the merged commit (\u003ca href=\"https://redirect.github.com/aio-libs/multidict/issues/1495\"\u003e#1495\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/aio-libs/multidict/compare/v6.7.1...v6.9.1\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `werkzeug` from 3.1.8 to 3.1.9\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/pallets/werkzeug/releases\"\u003ewerkzeug's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e3.1.9\u003c/h2\u003e\n\u003cp\u003eThis is the Werkzeug 3.1.9 security fix release, which fixes security issues and bugs but does not otherwise change behavior and should not result in breaking changes compared to the latest feature release.\u003c/p\u003e\n\u003cp\u003ePyPI: \u003ca href=\"https://pypi.org/project/Werkzeug/3.1.9/\"\u003ehttps://pypi.org/project/Werkzeug/3.1.9/\u003c/a\u003e\nChanges: \u003ca href=\"https://werkzeug.palletsprojects.com/page/changes/#version-3-1-9\"\u003ehttps://werkzeug.palletsprojects.com/page/changes/#version-3-1-9\u003c/a\u003e\nMilestone: \u003ca href=\"https://github.com/pallets/werkzeug/milestone/46?closed=1\"\u003ehttps://github.com/pallets/werkzeug/milestone/46?closed=1\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esafe_join\u003c/code\u003e on Windows does not allow special devices names with empty ADS markers on NTFS. \u003ca href=\"https://github.com/pallets/werkzeug/security/advisories/GHSA-g6x2-hccm-hh4m\"\u003ehttps://github.com/pallets/werkzeug/security/advisories/GHSA-g6x2-hccm-hh4m\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eProfilerMiddleware\u003c/code\u003e uses \u003ccode\u003eprofiling.tracing\u003c/code\u003e on Python 3.15. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3207\"\u003e#3207\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003euri_to_iri\u003c/code\u003e and \u003ccode\u003eiri_to_uri\u003c/code\u003e preserve empty username, password, and port 0. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3189\"\u003e#3189\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_options_header\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3231\"\u003e#3231\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_etags\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3231\"\u003e#3231\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove performance of \u003ccode\u003eparse_cookie\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3231\"\u003e#3231\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eget_host\u003c/code\u003e also checks that the port is in the valid range. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3236\"\u003e#3236\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe \u003ccode\u003eint\u003c/code\u003e URL converter returns a 404 instead of 500 error when the value is longer than \u003ccode\u003esys.get_int_max_str_digits()\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3237\"\u003e#3237\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eImprove debugger PIN generation from cgroup data inside Podman. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3245\"\u003e#3245\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAuthorization\u003c/code\u003e parsing \u003ccode\u003ebasic\u003c/code\u003e auth disallows non-base64 characters.  \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3248\"\u003e#3248\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapplication/x-www-form-urlencoded\u003c/code\u003e form data is no longer limited to \u003ccode\u003emax_form_memory_size\u003c/code\u003e, only \u003ccode\u003emax_content_length\u003c/code\u003e. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3251\"\u003e#3251\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLimitedStream.readinto\u003c/code\u003e does not resize the buffer when it reads less than the remaining size. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3253\"\u003e#3253\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eRules with 10 or more converters in a single part assign matched values correctly. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3254\"\u003e#3254\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThe invalid \u003ccode\u003eRange\u003c/code\u003e suffix length \u003ccode\u003e-0\u003c/code\u003e is no longer accepted. \u003ca href=\"https://redirect.github.com/pallets/werkzeug/issues/3255\"\u003e#3255\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/pallets/werkzeug/blob/main/CHANGES.rst\"\u003ewerkzeug's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eVersion 3.1.9\u003c/h2\u003e\n\u003cp\u003eReleased 2026-09-27\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esafe_join\u003c/code\u003e on Windows does not allow special devices names with empty ADS\nmarkers on NTFS. :ghsa:\u003ccode\u003eg6x2-hccm-hh4m\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eProfilerMiddleware\u003c/code\u003e uses \u003ccode\u003eprofiling.tracing\u003c/code\u003e on Python 3.15.\n:issue:\u003ccode\u003e3207\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003euri_to_iri\u003c/code\u003e and \u003ccode\u003eiri_to_ur
