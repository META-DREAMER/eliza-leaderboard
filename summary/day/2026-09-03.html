cker with API access\" cannot write security-sensitive variables. A key silently leaving it restores exactly that, and nothing in this package would notice.\n\n# The change\n\nTest-only, three additions to `blocked-env-keys.test.ts`.\n\n**Pin the tail by subtraction, not by a second copy of the list:**\n\n```ts\nconst agentSpecific = [...BLOCKED_ENV_KEYS]\n  .filter((key) =\u003e !BLOCKED_SPAWN_ENV_KEYS.has(key))\n  .sort();\nexpect(agentSpecific).toEqual([...13 names...]);\n```\n\nSubtracting core's set means the assertion keeps naming exactly *this* package's keys as core's list grows — it won't turn into a chore every time the spawn policy gains an entry. It is also two-directional: a silent **addition** fails it too (verified below), so growing the denylist stays a deliberate edit.\n\n**Assert the predicate, not the container.** `isBlockedEnvKey` is what the config and API gates actually call. Each of the thirteen gets a case there, in canonical, lowercase, and whitespace-padded spelling — the shapes a request body can supply. None of them sits inside a prefix family, so the exact-set branch is the only thing that can catch them.\n\n**Drive the collector.** `collectConfigEnvVars` is the startup path these keys must not survive. It filters in **two separate loops** — the explicit `env.vars` map and the loose string members of `env` itself — and both reach `process.env`, so the test feeds the whole tail through each.\n\n# One thing worth flagging from writing it\n\nMy first version of the collector test passed a flat record and got back `{}`, which looked like a pass at a glance. It wasn't: `collectConfigEnvVars` takes an `ElizaConfig` and returns `{}` immediately when `cfg.env` is absent, so the call never reached a guard. Wrapping it properly is also what surfaced the second loop.\n\n# Evidence\n\n`bunx vitest run src/config/blocked-env-keys.test.ts`: **26 passed** (was 11).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 11/11 | **26/26** |\n| drop `EVM_PRIVATE_KEY` | survives | **2 failed** |\n| drop `SOLANA_PRIVATE_KEY` | survives | **2 failed** |\n| drop `ELIZA_API_TOKEN` / `ELIZA_WALLET_EXPORT_TOKEN` / `ELIZA_TERMINAL_RUN_TOKEN` / `POSTGRES_URL` | survive | **2 failed** each |\n| drop `GITHUB_TOKEN` / `DATABASE_URL` | caught only in `env-vars` | **2 failed** here |\n| drop `STEWARD_API_KEY` (already spot-checked) | 1 failed | **5 failed** |\n| **add** an unexpected key to the set | survives | **1 failed** |\n| `key.trim().toUpperCase()` → `key.toUpperCase()` | 1 failed | **14 failed** |\n| `key.trim().toUpperCase()` → `key.trim()` | 2 failed | **15 failed** |\n\n**12/12 killed, was 2/12.** Siblings unchanged: `server-helpers-plugin` 15, `config-routes` 25, `env-vars` 30. Biome clean, `tsc --noEmit` clean. No source file is touched.\n\n# Two things I looked at and left alone\n\n- **`isBlockedEnvKey`'s `upper.length === 0` early return survives everything**, and it should: with it removed, `\"\"` still misses the exact set and `\"\".startsWith(prefix)` is false for all fourteen prefixes (none is empty), so the function returns `false` either way. It is an early-out, not a guard — no fixture can separate the two.\n- **`const blockedExact = [...BLOCKED_ENV_KEYS][0]` in `server-helpers-plugin.test.ts`** is the same indexing shape, but it is *not* the same problem: that test asks whether the plugin route rejects a blocked key, and any member is a fair representative because the route does not care which one it is. The list's contents are this file's responsibility, and that is where I put the assertion.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KDQV5NYTD8SM1D2F0CZC8C\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T10:41:24.149Z\",\"completed_at\":\"2026-09-03T10:49:36.908Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T10:41:24.359Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"6c243a7bd6ab3a509650def7608c55e70cfdc3bb13a5fbae8f671ae2a69b0a00\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"68d87ada-743f-4a1b-8a11-ab2fbe1cf93b\",\"object_id\":\"sha256:6c243a7bd6ab3a509650def7608c55e70cfdc3bb13a5fbae8f671ae2a69b0a00\",\"sha256\":\"6c243a7bd6ab3a509650def7608c55e70cfdc3bb13a5fbae8f671ae2a69b0a00\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"SmuAINh3bRuO2ih9lYJ20yqos3YWRNlRwKE8HEyFBUP5ERD3sXpKMMF5GEfw3sto7NCFSpNp-CF4kpfZ0dReCg\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"55:T16c9,"])</script><script>self.__next_f.push([1,"# What\n\n`packages/scripts` is **not a workspace package**. `listPackages()` returns 151 packages and it isn't one of them, so:\n\n- `run-all-tests.mjs` iterates workspace packages and never reaches it\n- `audit-test-lane-membership.mjs` — whose own docstring says it exists to catch *\"a maintained test file a script never runs at all\"* — accounts for **named workspace packages**, so it structurally cannot see the directory\n\nThe only CI coverage was six paths enumerated by hand in one `pr-static-smoke.yml` step. An audit over things that opted in can't see a thing that never opted in.\n\n# Measured, not estimated\n\n`packages/scripts` holds **177** test files. Exactly **9** are referenced by any workflow or root script. **168 run nowhere.**\n\n168 is too blunt a number to act on, so I narrowed to a principled predicate — a test whose *subject* is a CI contract, i.e. one that reads a `.github/workflows/` file:\n\n| | count |\n|---|---|\n| test files under `packages/scripts` reading a workflow | **58** |\n| of those, covered by a CI lane | 6 |\n| **running in no lane at all** | **52** |\n\nThose 52 include the three that guard how the protected Telegram deploy credentials resolve — the same ones #30397 currently breaks.\n\n# The change\n\nRun the directory instead of a hand-list, plus the one workflow-reading test that lives outside it (`packages/scripts/cloud/admin/repair-mobile-app-auth-registration.test.ts`).\n\nA wider list would just drift again, so the actual fix is a **fail-closed completeness guard** in `pr-static-smoke-workflow.test.ts`: walk `packages/scripts`, take every test file that reads `.github/workflows/`, and assert each is covered by that step — exactly or by directory prefix. **The marker is the subject, not the runner**, so a new workflow-contract test can't arrive dead wherever its author puts it.\n\n# Before proposing to add 159 files to CI, I ran them\n\n**1503 pass, 8 skip, 2 fail, 77s.**\n\nI chased the two failures rather than filing them:\n\n```\nbash: line 48: declare: -A: invalid option\n```\n\nThat's macOS **bash 3.2** lacking associative arrays. The `declare -A` lives in `deploy-gateway-webhook.yml`, and both that workflow and pr-static-smoke's `source-smoke` job run on `ubuntu-24.04` (bash 5). **Local artifact, not a repo defect** — I didn't file it, and I can't reproduce a bash 5 run from here, so flagging it as the one thing I couldn't verify. If it does surface on the runner, say so and I'll gate that file rather than leave the lane red.\n\n# Evidence\n\nThe exact command CI will now run:\n\n```\n1530 pass, 8 skip, 2 fail (both the bash 3.2 artifact) across 161 files — 75s\n```\n\n**Mutants against the guard — 4, all killed:**\n\n| mutant | result |\n|---|---|\n| revert the workflow to the six-file hand-list | 2 fail |\n| drop the one covered file outside `__tests__` | 1 fail |\n| widen the marker so it matches every file | 1 fail |\n| make the walk return nothing | **survived at first** |\n\nThe vacuity mutant survived because my \"not vacuous\" test asserted the step and one file's marker, but never that the walk *found* anything. Fixed by collecting what the walk finds and asserting \u003e40 files — that's the real anti-vacuity property, and it's killed now.\n\nOne pre-existing assertion legitimately broke: it pinned this test file by name in the step, which the directory now covers. Updated it to the directory with a pointer to the new completeness test, rather than deleting a check.\n\n`pr-static-smoke-workflow.test.ts` 8 pass, `actionlint` clean, `biome` clean.\n\n# Cost\n\nThe step goes from a handful of files to ~75s. That's the price of the 52 contract tests actually guarding something; if you'd rather keep the lane fast, the same guard works against a narrower command — the completeness property is independent of how wide the step is.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1JR2FXATTMNVY1MPG2J7DCZ\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T04:22:44.394Z\",\"completed_at\":\"2026-09-03T04:31:12.097Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T04:22:45.032Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"4fdc246a3427e7708e2f9796352e8e9b8b057f6466595e31d57d62e950b30a24\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"9fb2e62e-d9bb-458d-b4a2-7dbf0ce7c559\",\"object_id\":\"sha256:4fdc246a3427e7708e2f9796352e8e9b8b057f6466595e31d57d62e950b30a24\",\"sha256\":\"4fdc246a3427e7708e2f9796352e8e9b8b057f6466595e31d57d62e950b30a24\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"R31nermP5Ai778bsYXQgXdXOCEMVzGqupBksMNFicXDEQw2LvM8S30ZB-E4xdNveApwFJAKT2y57_TPe92M3Ag\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"56:T1569,"])</script><script>self.__next_f.push([1,"# What\n\n`isDevCloudEnvOwnedKey` decides which persisted environment fields the launcher owns — i.e. which values outrank config and vault state. It answers from an explicit 72-entry list **or** five `ELIZA*CLOUD_` prefixes.\n\nSampling the list, every deletion survives:\n\n| deleted entry | `eliza-cloud-config.test.ts` |\n|---|---|\n| `ELIZAOS_CLOUD_API_KEY`, `ELIZA_CLOUD_SESSION_TOKEN`, `ELIZACLOUD_TOKEN`, `ELIZAOS_CLOUD_EMBEDDING_API_KEY`, `ELIZA_CLOUD_AUTH_TOKEN`, `ELIZAOS_CLOUD_ENABLED`, `ELIZAOS_CLOUD_LARGE_MODEL`, `ELIZA_CLOUD_SANDBOX_TOKEN` | **60 pass / 0 fail**, each |\n\nThat looked like eight coverage gaps. It isn't — and the difference decides what to write, so I checked instead of assuming:\n\n```\ntotal: 72\nNOT covered by a prefix (9):\n  STEWARD_API_URL, STEWARD_TENANT_ID, STEWARD_AGENT_ID, ELIZA_STEWARD_AGENT_ID,\n  STEWARD_API_KEY, STEWARD_AGENT_TOKEN, STEWARD_TRADE_SESSION_ID,\n  STEWARD_HYPERLIQUID_TRADE_SESSION_ID, STEWARD_POLYMARKET_TRADE_SESSION_ID\n```\n\n**63 of the 72 entries are already matched by a prefix arm**, so deleting one genuinely changes nothing — they are redundant, not untested. The nine that are not prefix-matched are the Steward tuple, and for those the list is the only thing answering. Two of them, `STEWARD_API_KEY` and `STEWARD_AGENT_TOKEN`, are the fleet-scoped credentials that `blocked-env-keys.ts` also refuses to let config writes persist.\n\n# The change\n\nTest-only, one `describe` block, written against the derived subset rather than a copied list:\n\n- **The Steward tail is named exactly**, computed as \"list entries no prefix matches\". That makes the assertion self-maintaining: if a future entry is added that a prefix already covers, nothing changes; if one is added that isn't covered, this test names it.\n- **A row per list-answered key**, in canonical and lowercase spelling, since a persisted config key is whatever spelling was written.\n- **A row per prefix**, each using a name that is deliberately *not* in the list, so the family arms stay distinguishable from the exact arm.\n- **Negatives from the file's own comment** — `SMALL_MODEL` and `LARGE_MODEL` \"still belong to direct/local providers when the dev target is offline\", plus `OPENAI_API_KEY` and a bare `STEWARD`.\n- **The internal launcher markers**, which match a prefix shape but are excluded first so persisted config cannot fabricate them.\n\n# Evidence\n\n`bunx vitest run src/runtime/eliza-cloud-config.test.ts`: **82 passed** (was 60).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 60 / 0 | **82 / 0** |\n| delete `STEWARD_API_KEY` from the shared tuple | survives | **1 failed** |\n| delete `STEWARD_AGENT_TOKEN` | survives | **1 failed** |\n| delete `ELIZA_STEWARD_AGENT_ID` | survives | **1 failed** |\n| delete `STEWARD_TRADE_SESSION_ID` | survives | **1 failed** |\n| drop the `ELIZAOS_CLOUD_` prefix arm | survives | **1 failed** |\n| drop the internal-key exclusion | survives | **2 failed** |\n| drop `.toUpperCase()` in the predicate | survives | **9 failed** |\n\n**7/7 killed, was 0/7.** Biome clean, `tsc --noEmit` clean. No source file is touched.\n\n# What I deliberately did not do\n\nI did not add a row per prefix-covered entry. Sixty-three assertions that a prefix arm still works would restate one fact sixty-three times and would not fail for any change worth catching — the single per-prefix case above covers the same ground. The redundancy is worth knowing about, not worth asserting.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"S ```\nAccess-Control-Allow-Headers: Content-Type, Authorization, …, X-Server-Token, …, X-Eliza-Trace-Id, X-Server-Token\n```\n\n22 entries, 21 distinct. Browsers tolerate the repeat, so the impact is a malformed advertised header rather than a broken request — I'd rather say that plainly than inflate it.\n\n# Why nothing caught it\n\nThe preflight tests assert the response header against the constant that produced it:\n\n```ts\nexpect(res.headers.get(\"Access-Control-Allow-Headers\")).toBe(CORS_ALLOWED_HEADERS);\n```\n\nThat holds for *any* contents. A separate `toContain` test does name six headers by hand, which is real coverage — but it leaves the other fifteen, and neither form can see a duplicate.\n\nMeasured, rather than asserted:\n\n| mutant | against the existing suite |\n|---|---|\n| remove the duplicate `X-Server-Token` | **26/26 green — survives** |\n| replace `X-Eliza-CSRF` with `X-Attacker-Supplied` | **26/26 green — survives** |\n| delete `X-ElizaOS-Turn-Correlation` | 1 failed (the `toContain` test names it) |\n\nThe second row is the one that bothered me more than the duplicate: a header name could be silently changed to anything and the suite would not notice.\n\n# The change\n\n- Delete the duplicate entry. **One line of source.**\n- Add a `CORS_ALLOWED_HEADERS contents` block that asserts the *contents* rather than comparing the string to itself: no duplicates, the exact 21-name list in order, and the arity the tables are generated from.\n- Pin the **three dual-spelling pairs** (`X-Eliza-Token`/`X-ElizaOS-Token`, `X-Eliza-Client-Id`/`X-ElizaOS-Client-Id`, `X-Eliza-UI-Language`/`X-ElizaOS-UI-Language`). A dedicated agent serves clients of both vintages, and a legacy/canonical pair is exactly what a future cleanup prunes as an apparent duplicate — which is, after all, how this PR started.\n- Pin the five headers `packages/ui/src/api/client-base.ts` actually sends, so the allow-list can't drift out from under the client that depends on it.\n\n# Evidence\n\nEvery mutant executed at `754c012046`, one at a time. **7 of 7 die.**\n\n| mutant | result |\n|---|---|\n| control | **37 passed** |\n| reintroduce the duplicate | **3 failed** |\n| replace `X-Eliza-CSRF` with a bogus name | **1 failed** |\n| drop legacy `X-Eliza-Token` | 3 failed |\n| drop legacy `X-Eliza-UI-Language` | 3 failed |\n| drop `X-Eliza-Trace-Id` (the UI sends it) | 3 failed |\n| add an unlisted `X-New-Header` | 2 failed |\n| drop `X-Browser-Bridge-Companion-Id` | 2 failed |\n\n**Suites:** `test/api/server-helpers-auth.test.ts` → **37 passed** (was 26). Whole `test/api/` directory → **275 passed**, 15 files. `bun run --cwd packages/agent typecheck` → exit **0**. Biome on both changed files → clean.\n\n# Two divergences I checked and did NOT file\n\nThe same-named list in `packages/app-core/src/api/server-cors.ts` has 13 entries against this file's 21, and `packages/cloud/shared/src/lib/cors-constants.ts` carries a third, with a comment saying its client-id/UI-language block \"Mirrors the dedicated-agent allow-headers in `packages/agent/src/api/server-helpers-auth.ts`\". Both looked like drift. Neither is:\n\n- **app-core is a deliberate subset.** For the three headers with both a legacy and a canonical spelling it accepts only the canonical one; every single-spelling header it needs is present. The remainder it omits (`X-Server-Token`, `X-Waifu-Chat-Access-Token`, the two browser-companion ids, `X-Eliza-Trace-Id`) are agent-server surfaces app-core does not serve.\n- **`X-Eliza-Trace-Id` missing from app-core is correct.** This one I nearly filed. The UI sends it — but only under `isDedicatedCloudAgentBase(this.baseUrl)` (`client-base.ts:2900`), i.e. only to `\u003cagentId\u003e.cloud.eliza.app`, never to the local app-core server. An unconditional read of that call site would have produced a wrong bug report.\n\nI have not tried to unify the three lists. They serve three different origins with three different auth surfaces, and the cloud file's comment scopes its mirroring claim to a specific block rather than the whole list — so a shared constant would need a policy decision about which headers are genuinely common. That's a maintainer call, not something to encode in a drive-by.\n\n# Scope\n\nOne line of source, 80 lines of test. No behaviour change beyond the header value no longer repeating a name.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1M1TJPTC6QEEW16PDMC0JT3\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T16:32:25.306Z\",\"completed_at\":\"2026-09-03T16:37:55.851Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T16:32:25.506Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"e0666adf616c053cf1f517139cae737dca7ebee6e1b9911a44f430736e9ec1d7\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\ eeds-work=0`; OCR triage completed successfully\n"])</script><script>self.__next_f.push([1,"59:T48e,## Summary\n\nFixes #30291. `TrajectoriesService.getStats` narrowed all six lifetime `sum()` aggregates back to `::int`. Postgres returns `sum(integer)` as `bigint`, and with no time window the totals cross 2,147,483,647 on busy agents — the cast then raises `integer out of range` and `GET /api/trajectories/stats` 500s permanently. Drops the six casts; the existing `asNumber` cell reader already converts bigint/string cells once in TypeScript. `count(*)::int` and the `avg` narrowings stay (bounded by row values).\n\nCloses #30291.\n\n## Evidence (all observed locally at this head)\n\n- New `trajectory-stats-width.real.test.ts` (real PGlite, 3 rows x 800M): **fails pre-fix** with Postgres `22003` on the exact reported query, **passes post-fix** reporting 2,400,000,000 per aggregate.\n- Neighbors: `TrajectoriesService.test.ts` 13/13 pass. `trace-correlation-db.real.test.ts` shows 1 pre-existing failure also present on unmodified develop (verified via stash; fault-injection timing flake, untouched path).\n- `biome check` clean on both files; `packages/core` typecheck done.\n\nReviewed with Muse Code (Meta Muse Spark; exact model version not exposed in-session).5a:T16d6,"])</script><script>self.__next_f.push([1,"# What\n\nName-based redaction cannot help when a credential sits under a neutral key, so `redactSensitiveText` is the only net there. I ran fourteen realistic credential shapes through the **real** `redactLogArgs`, under the key `value`:\n\n| masked already | survived |\n| --- | --- |\n| GitHub PAT (classic + fine-grained), Slack bot token, AWS access key id, OpenAI key, Anthropic key, `Authorization: Bearer …`, postgres DSN, PEM private key, Stripe live key, Telegram bot token | **compact JWS**, **Discord webhook URL**, AWS secret access key |\n\n```\nLEAKED  jwt              eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1MSJ9.aBcDeFgHiJkLmNoPqRsTuVwXyZ012345\nLEAKED  discord webhook  https://discord.com/api/webhooks/123456789/AbCdEf-GhIjKlMnOpQrStUvWxYz\nLEAKED  aws secret key   wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n```\n\n# The two I added, and why they clear the bar this list sets\n\nThe existing patterns are a curated set of *unambiguous* shapes (`sk-`, `ghp_`, `xox[baprs]-`, `ya29.`, `1//`). Both additions meet the same standard:\n\n- **JWS** — always opens with the literal `eyJ` (base64url for `{\"`) and carries three base64url segments. With a floor on each segment there is essentially no false-positive surface, and a session JWT is exactly the thing echoed under a neutral key or inside a serialized provider error body.\n- **Discord / Slack incoming webhooks** — a complete post credential: whoever holds the URL can write to the channel, with no second factor. They carry no userinfo component, so the `://user@host` rule never reaches them, and they get logged whole as the failing request target. `packages/logger` already treats `webhook` as a credential *name* for this reason; this covers the *value* under any name.\n\n# The one I deliberately left out\n\nThe AWS secret access key is 40 unanchored base64 characters with no prefix. A pattern for it would mask hashes, ids, and ordinary base64 payloads. It stays out; naming it here so the gap is a decision rather than an oversight.\n\n# The repo told me about its second requirement\n\nAdding the patterns to core alone failed an existing test — `keeps the core and leaf logger credential-shape policies synchronized`, which compares the two lists for equality. Both patterns are mirrored into `packages/logger` so the lists stay identical.\n\n# Mutation matrix\n\n| mutant | result |\n| --- | --- |\n| remove the JWT pattern | **2 fail** — its own test + the parity test |\n| remove the Discord/Slack pattern | **2 fail** — its own test + the parity test |\n| drop the per-segment floors on the JWT pattern | **1 fail** — `leaves dotted and URL lookalikes intact` |\n\nThat third row needed work: dropping the floors initially failed *only* the parity test, which meant my lookalike list wasn't actually pinning the floor. I added the case that isolates it — `eyJ.a.b`, dotted and carrying the JWS prefix but with tiny segments. That's the assertion standing between this rule and one that masks ordinary identifiers.\n\n# No false positives\n\nEleven benign lookalikes verified untouched, including `a.b.c`, `eyJhbGciOiJIUzI1NiJ9` (a header with no signature), `com.example.app.Service`, `1.2.3-rc.1`, plain base64, an ISO timestamp, a Discord **channel** link, and `https://hooks.slack.com/docs`.\n\n# One note on the test fixture\n\nMy first push was rejected by GitHub push protection: the Slack fixture was a realistic literal webhook URL. That's the rule working correctly — and a fair demonstration of why this shape is worth masking. I assembled the fixture at runtime rather than weakening it or requesting a bypass, with a comment saying why.\n\n# Verification\n\n- `packages/core` `src/security` → **682 pass / 40 files**\n- `packages/logger` → **60 pass**\n- focused `redact.test.ts` → **66 pass**\n- `biome check` clean on all three touched files\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1JMQTFW143KBQRD6V9GXB4G\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T03:24:29.052Z\",\"completed_at\":\"2026-09-03T03:25:59.300Z\",\"skil on `develop`:\n\n| mutant | result |\n|---|---|\n| delete `\"CAPABILITY_ROUTER_URL\"` (only the plural sibling is tested) | **6 pass / 0 fail** |\n| `endsWith(`_${suffix}`)` → `endsWith(suffix)` — over-match | **6 pass / 0 fail** |\n| drop `.trim()` from the key normaliser | **6 pass / 0 fail** |\n| drop `.toUpperCase()` from the key normaliser | **6 pass / 0 fail** |\n\n`CAPABILITY_ROUTER_URL` is the sibling that differs from `CAPABILITY_ROUTER_URLS` by one character, and it is the singular one — the entry a reader would assume is covered because its neighbour is.\n\n# The change\n\nTest-only, one `describe` block.\n\n**A row per suffix, exercising both arms of the matcher.** The predicate is `upper === suffix || upper.endsWith(`_${suffix}`)`; the existing cases mostly use vendor-prefixed spellings, so the exact arm was thinly held. Each entry now arrives bare, under `ELIZA_`, and under `VITE_ACME_` in the same case, and the assertion is on the *whole* remaining key set rather than three `not.toHaveProperty` calls — so a new entry added to the list is pinned the moment its row is added.\n\n**The separator gets a case of its own.** Without the underscore, `LEGACYDEV_MODE`, `MYSKILLS_REGISTRY` and `XENABLE_SELF_EDIT` are deleted too. This is the direction that matters for a denylist applied to *stored* rows: over-matching silently strips configuration a customer already set, on every subsequent restart, with no error.\n\n**Normalisation is asserted from the caller's side.** The row is caller-authored JSON, so the key is whatever spelling the caller chose — `eliza_dev_auth_bypass`, `Eliza_Dev_Auth_Bypass`, `  ELIZA_DEV_AUTH_BYPASS  `, and a bare lowercase name. The guard already trims and uppercases for that reason; nothing held it there.\n\n# Evidence\n\n`bun test src/lib/services/remote-docker-runtime-mode.test.ts`: **25 pass / 0 fail** (was 6).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 6 / 0 | **25 / 0** |\n| delete `\"CAPABILITY_ROUTER_URL\"` | survives | **1 failed** |\n| `endsWith` without the underscore | survives | **1 failed** |\n| drop `.trim()` | survives | **1 failed** |\n| drop `.toUpperCase()` | survives | **3 failed** |\n| drop the `upper === suffix` arm | 2 failed | **17 failed** |\n| drop the `endsWith` arm | 3 failed | **20 failed** |\n| delete `\"DEV_MODE\"` | 1 failed | **2 failed** |\n\n**7/7 killed, was 3/7.** Biome clean, `tsc --noEmit` clean. No source file is touched, and the two `DockerSandboxProvider` cases that prove the create path actually calls this helper are unchanged.\n\n# On the two normalisation survivors\n\nI want to be accurate about these rather than overstate them. I could not demonstrate an end-to-end escalation from either: the agent-side readers look up exact, canonical names, so a surviving `dev_auth_bypass` or `  ELIZA_DEV_AUTH_BYPASS  ` would not be honoured by the code that consumes it today. They are defence-in-depth.\n\nThey are still worth pinning here, for the reason the file's own comment gives: this function is the funnel precisely because the surfaces upstream of it accept `environmentVars` with no denylist, and it is a filter over caller-chosen key spellings. `.trim()` and `.toUpperCase()` are deliberate normalisation steps, and a refactor that drops one currently costs nothing.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KJA71MATJMSX2S57XZE30T\", e 23-entry list the upload endpoint actually accepts — has no equivalent, and neither list has per-entry coverage. Measured on `develop`, against both this suite and the agent parity suite:\n\n| mutant | `shared` | `agent` parity |\n|---|---|---|\n| **append `\"text/html\"`** to the upload list | **7 / 0** | **10 / 10** |\n| append `\"image/svg+xml\"` to the image list | 6 / **1 fail** | 10 / 10 |\n| delete `image/gif` | **7 / 0** | **10 / 10** |\n| delete `image/webp`, `audio/aac`, `video/quicktime`, `text/csv`, `application/json` | **7 / 0** each | **10 / 10** each |\n| `MAX_CHAT_UPLOAD_ATTACHMENTS` 4 → 400 | **7 / 0** | **10 / 10** |\n| `MAX_CHAT_ATTACHMENT_NAME_LENGTH` 255 → 25500 | **7 / 0** | **10 / 10** |\n\nSo the guard the file's own header advertises — \"free of the phone-photo formats (HEIC/HEIF/SVG) the client must re-encode\" — stops at the image list, and two of the four bounds have nothing behind them.\n\n# On `text/html`, stated carefully\n\nThis allowlist is **not** the XSS boundary, and I want to be precise rather than alarming. `media-store.ts` serves anything outside `isInlineSafeMime` with `Content-Disposition: attachment`, `X-Content-Type-Options: nosniff` and `default-src 'none'; sandbox` — I read that path, and it holds for `text/html` today.\n\nThe reason it is still worth an assertion is that the two live in different packages and neither references the other. `chat-upload-limits.ts` is in `packages/shared`; the disposition rule is in `packages/agent`. This list should not start accepting active document types on the assumption that a layer it does not know about will always catch them.\n\n# The change\n\nTest-only:\n\n- **A row per entry in each list**, so a deletion names itself. The image rows also assert membership in the upload set, since the image list is spread into it and a divergence would mean a type the client sends as an image is refused on upload.\n- **Both lists named exactly**, plus a length check. `it.each` over an emptied array registers zero cases, so the tables above cannot notice a list being cleared — and naming the contents makes an *addition* deliberate too.\n- **Six active document types asserted absent** from the upload set (`text/html`, `application/xhtml+xml`, `image/svg+xml`, two JavaScript spellings, `application/xml`).\n- **The two unpinned bounds**, each with the reason it has that value: 4 is a per-message fan-out cap, 255 is the POSIX single-component limit that makes a stored name writable on the media volume.\n\n# Evidence\n\n`bun test src/chat-upload-limits.test.ts`: **43 pass / 0 fail** (was 7).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 7 / 0 | **43 / 0** |\n| append `\"text/html\"` | survives | **2 failed** |\n| append `\"image/svg+xml\"` | 1 failed | **3 failed** |\n| delete any of the six sampled entries | survives, each | **killed, each** |\n| `MAX_CHAT_UPLOAD_ATTACHMENTS` ×100 | survives | **1 failed** |\n| `MAX_CHAT_ATTACHMENT_NAME_LENGTH` ×100 | survives | **1 failed** |\n\n**9/9 killed, was 1/9.** Agent-side siblings unchanged (`chat-upload-limits.parity` + `media-store`: 84 passed). Biome clean. No source file is touched.\n\nThe two base64 ceilings already had coverage — `MAX_CHAT_IMAGE_BASE64_BYTES` fails this suite when widened and `MAX_CHAT_MEDIA_BASE64_BYTES` fails the agent parity suite — so I left them alone.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_versio lause conjunction, and **not one of the six clauses is pinned**. On `develop`, dropping any single clause leaves every related suite green:\n\n| mutant | `agent-backup-diff` | `agent-backup-verifier` | `agent-sandboxes` |\n|---|---|---|---|\n| drop `\"filesChanged\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"filesRemoved\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"configChanged\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"configRemoved\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"memoriesBaseCount\" in value` | 0 fail | 0 fail | 0 fail |\n| drop `\"memoriesAppended\" in value` | 0 fail | 0 fail | 0 fail |\n\nThe guard is pinned only in aggregate — inverting the whole predicate *is* caught (16 failures in the verifier suite). Every fixture in the repo carries all six keys, so nothing distinguishes a complete delta from a truncated one.\n\n# Why each clause is load-bearing\n\n`applyBackupDelta` reads all six fields unguarded. Executed against a base of three memories and a delta that should yield `[{id:1},{id:9}]`, dropping one field at a time:\n\n| missing field | result |\n|---|---|\n| `filesChanged` | `TypeError: Cannot convert undefined or null to object` |\n| `filesRemoved` | `TypeError: filesRemoved is not iterable` |\n| `configChanged` | `TypeError: Cannot convert undefined or null to object` |\n| `configRemoved` | `TypeError: configRemoved is not iterable` |\n| **`memoriesBaseCount`** | **no throw — `[{id:1},{id:2},{id:3},{id:9}]`** |\n| **`memoriesAppended`** | **no throw — `[{id:1},null]`** |\n\nFour fail loudly. The two memory clauses do not: `slice(0, undefined)` keeps the **whole** parent list, so a truncated delta silently resurrects history the parent had compacted away; `concat(undefined)` appends a hole that JSON-round-trips to `null`, so a restored agent gets a null memory entry. Those two are the clauses whose absence corrupts a restored agent rather than crashing the restore, and they were exactly as unprotected as the other four.\n\nThe guard is the only thing between a partial payload and that behaviour, which is why the clause it drops shouldn't be a free change.\n\n# The change\n\nTests only — no production change. One case per clause plus both directions of the discriminator:\n\n- a complete delta is recognized **and** rejected by `requireBackupStateData`;\n- a full state is recognized **and** rejected by `requireBackupDelta`;\n- `test.each` over the six keys: a delta missing that one key fails `isBackupDelta`, makes `requireBackupDelta` throw the id-bearing error, and is accepted by the other branch — so each clause is asserted on its own;\n- `in` tests key presence, not definedness. An explicitly `undefined` field still satisfies its clause today; pinned so that switching to a truthiness check becomes a deliberate change instead of an accident.\n\n# Evidence\n\n`bun test src/lib/services/agent-backup-diff.test.ts` → **42 pass / 0 fail** (was 33), 68 `expect()` calls.\n\nSame mutants, after:\n\n| mutant | before | after |\n|---|---|---|\n| drop `filesChanged` | 42 pass | **41 pass / 1 fail** |\n| drop `filesRemoved` | 42 pass | **41 pass / 1 fail** |\n| drop `configChanged` | 42 pass | **41 pass / 1 fail** |\n| drop `configRemoved` | 42 pass | **41 pass / 1 fail** |\n| drop `memoriesBaseCount` | 42 pass | **41 pass / 1 fail** |\n| drop `memoriesAppended` | 42 pass | **41 pass / 1 fail** |\n| invert the predicate | — | **33 pass / 9 fail** |\n| `\"memoriesAppended\" in value` → `!== undefined` | 42 pass | **41 pass / 1 fail** |\n\n**8 of 8 killed, from 0 of 8.**\n\nNeighbouring suites unchanged, run file by file:\n\n```\nagent-backup-diff.test.ts                     42 pass  0 fail\nagent-backup-diff.canonicalize-bound.test.ts   6 pass  0 fail\nagent-backup-diff.safe-sort.test.ts            3 pass  0 fail\nagent-backup-verifier.test.ts                 45 pass  0 fail\nagent-sandboxes.test.ts                       28 pass  0 fail\n```\n\n`bunx @biomejs/biome check` on the file  nothing was holding it there.\n\nA capitalised *entry* survives too (`\"admin\"` → `\"Admin\"` in the set): it can never match `normalized`, so it reads as protection while being dead weight.\n\n# The change\n\nThree tests appended, no source changes:\n\n- **`reserves exactly the documented set of route names`** — the membership itself, against an explicit sorted list, plus every entry lowercase.\n- **`refuses %s by name`** — a `test.each` over the set, so each name is its own case with its own label.\n- **`the reserved check is case-folded, not raw`** — every reachable entry in `UPPER` and `Title` spelling.\n\n# `me` is unreachable through this entry point, and the test says so\n\n`\"me\"` is two characters, so `USERNAME_MIN_LENGTH` answers first and the reserved branch never runs for it. Rather than dropping it from the table or asserting the wrong message, the case selects its expectation:\n\n```ts\nexpect(result.error).toMatch(reserved.length \u003c USERNAME_MIN_LENGTH ? /at least/ : /reserved/);\n```\n\nIt is not dead: `CharactersService.generateUniqueUsername` seeds the whole set into the taken-name set, so `\"me\"` still blocks a collision there. The explicit membership assertion is what pins it, since no `validateUsername` fixture can.\n\nThe case-fold test filters to reachable entries and asserts the filter is non-empty, so it can't silently degrade to zero cases.\n\n# Evidence\n\n`bun test src/lib/utils/agent-username.test.ts`: **29 pass / 0 fail**, 226 assertions (was 6 pass, 20 assertions).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 6 / 0 | **29 / 0** |\n| `has(normalized)` → `has(username)` | 6 / 0 — survives | **28 / 1** |\n| drop `\"admin\"` | 6 / 0 — survives | **27 / 1** |\n| drop `\"api\"`, `\"chat\"`, `\"login\"`, `\"settings\"`, `\"www\"`, `\"me\"`, `\"undefined\"` | survive | **27 / 1** each |\n| `\"admin\"` → `\"Admin\"` in the set | 6 / 0 — survives | **25 / 4** |\n| `if (RESERVED_USERNAMES.has(...))` → `if (false)` | 5 / 1 | **7 / 22** |\n\n**11/11 killed, was 0/11.** Biome clean, `tsc --noEmit` clean. The source file is untouched, so no sibling suite can be affected.\n\n# One mutant I did not chase\n\nDropping `.trim()` from the normalizer survives. It is subsumed: any untrimmed input still carries a space, and `USERNAME_PATTERN` rejects spaces, so the result is invalid either way — only the error *message* differs, and no caller branches on which message it is.\n\n# What I screened and did not file\n\nThe length and charset guards in the same file are already tight — `USERNAME_MIN_LENGTH` 3→1 and 3→5, `USERNAME_MAX_LENGTH` 30→10 and 30→300, both clause deletions, a loosened `USERNAME_PATTERN`, and dropping `.toLowerCase()` all fail the existing suite. The reserved list was the one guard in the file with no real coverage.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KD74P7QWN5RW92VQ741AKH\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T10:32:16.839Z\",\"completed_at\":\"2026-09-03T10:36:37.542Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sh  second net. Running the actual `redactLogArgs` over ten realistic payloads:\n\n| key | before |\n| --- | --- |\n| `sessionKey` | masked — `sk_` prefix |\n| `connectionString` | masked — URL userinfo |\n| `dsn` | masked — URL userinfo |\n| `OPENAI_KEY` | masked — `sk-` prefix |\n\nSo the honest finding is only the names whose values are **pattern-inert**:\n\n| key | value in the log, before this change |\n| --- | --- |\n| `jwt` | `eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1MSJ9.aBcDeFgHiJkLmNoPqRsTuVwXyZ012345` |\n| `cookie` | `session=9f2b7c1d4e6a8b0c; Path=/; HttpOnly` |\n| `bearer` | `AbCdEfGhIjKlMnOpQrStUvWxYz0123456789` |\n| `webhookUrl` | `https://discord.com/api/webhooks/123456789/AbCdEf-…` |\n\nAll four are masked by name in `packages/logger` **today** — including `webhook`, whose entry there carries the comment *\"A webhook URL is a full post credential (Discord/Slack)\"*. This adopts rules already shipped in this repo rather than inventing a policy.\n\nAfter: all four are `[REDACTED]`.\n\n# What I deliberately did not add\n\n`auth`, `session` and `dsn` are in the leaf logger's exact set and stay out of core's. This predicate also governs **non-log** call sites where those names are structural containers rather than secrets, and their credential-shaped values are already caught by `redactSensitiveText`. That reasoning is in the code comment so the remaining divergence reads as a decision, not an oversight.\n\n`primaryKey` also stays visible — the leaf logger masks it via a generic `[a-z]Key$` rule, and a database primary key is not a credential. That's the one divergence where I think core is right.\n\n# Mutation matrix\n\n| mutant | result |\n| --- | --- |\n| remove the `jwt\\|bearer\\|cookie` boundary rule | **1 fail** — `flags the credential names the leaf logger masks by name` |\n| remove the new substrings (`webhook`, `sessionkey`, `connectionstring`) | **1 fail** — same test |\n| widen the boundary to a bare substring match | **1 fail** — `keeps the boundary so ror: \"Refusing to delete: the agent's lifecycle generation moved after the pre-deletion capture; retry the delete.\" };\n}\n```\n\n**Replace that whole condition with `if (false)` and the suite is 276 pass, 0 fail.**\n\n# The two guards #30344 added are honestly covered — I checked those first\n\n| mutant | result |\n| --- | --- |\n| `options.stateLossAcknowledged` → `true` (every absent-bridge delete proceeds) | 1 failed — `a data-bearing error row with no reachable bridge fails closed` |\n| persist the waiver unconditionally (fabricate a `null` bridge URL into the row) | 1 failed — `prepareAgentDelete accepts an acknowledged absent-bridge generation without fabricating a persisted URL` |\n| **`if (!captureAuthority \\|\\| !snapshotCaptureStillCanonical(...))` → `if (false)`** | **276 pass — survives** |\n\nThe fence predates this PR. What changed is that it is now *load-bearing in a new way*: on the acknowledged absent-bridge path there is no capture and no persisted waiver URL, so the generation comparison is the only thing left.\n\n# Why the test named for it does not reach it\n\n`an acknowledged retry with no reachable bridge is fenced to that exact generation` mocks `prepareAgentDelete` wholesale:\n\n```ts\nconst prepare = spyOn(spyTarget, \"prepareAgentDelete\").mockResolvedValue({ ok: false, error: \"halted by test after capture phase\" });\n...\nexpect(prepare).toHaveBeenCalledWith(rec.id, rec.organization_id, \"user_request\", { ... });\n```\n\nThat asserts the *arguments handed to* the fence. The name describes the guard; the assertion describes the call site.\n\n# The change\n\nOne test that reaches the fence through the window that actually exists: the capture decision is made **before** the lifecycle lock, so a re-provision inside that window gives the agent a reachable bridge again. The record read under the lock carries a `bridge_url` and a bumped `environment_revision`, while `captureAuthority` is the old absent-bridge snapshot.\n\nDeleting on that \n```\n\nDelete that guard and the whole handoff-target suite stays green. Nothing reaches it.\n\n# Why nothing reaches it\n\nBoth existing shared-row cases send `webUiUrl: null`, so the record carries no dedicated URL at all and `hasDedicatedUrl` rejects it **two guards earlier** — the base is never classified. That is symmetric masking: with the shared-base guard deleted, `hasDedicatedUrl` still refuses those fixtures, so they cannot see the deletion.\n\n# The change\n\nOne test with a record that passes every earlier guard: `status: \"running\"`, `executionTier: \"dedicated\"`, and a `webUiUrl` that *is* the control-plane shared REST base. So `!agent`, `execution_tier`, `hasDedicatedUrl` and the status check all pass, `resolveCloudAgentApiBase` resolves to exactly the shape `isDirectCloudSharedAgentBase` matches, and the production host keeps `isLocalDedicatedProxy` false. The mock answers the whole switch path (detail, `/api/health`, `/messages`), so the guard is the only thing between the fixture and a completed switch.\n\nThis is the realistic shape, not a contrived one: a control plane that fills `webUiUrl` with the adapter route it already serves is how a record ends up dedicated-looking and shared-hosted at once.\n\n# Mutation matrix\n\nEach guard deleted from `client-cloud.ts` independently and reverted, against this head:\n\n| deleted guard | result |\n| --- | --- |\n| `isDirectCloudSharedAgentBase(base) \u0026\u0026 !isLocalDedicatedProxy` | **1 failed / 9 passed** — killed |\n| `if (!agent) return null;` | 10 passed |\n| `if (!hasDedicatedUrl) return null;` | 10 passed |\n| `if (agent.status \u0026\u0026 agent.status !== \"running\") return null;` | 10 passed |\n| `if (agent.execution_tier === \"shared\") return null;` | 10 passed |\n| `if (!dedicatedAgentId \u0026\u0026 sourceIsSharedAdapter) return null;` | 10 passed |\n\nExactly one guard, which is what makes it a pin rather than a coincidence. (The last two rows are the guards #30376 pins; this PR is deliberately disjoint from that one and touches a different case in the same file.)\n\n# One thing I checked and did not act on\n\n`hasDedicatedUrl` looks redundant with the shared-base guard — whenever it is false, the base derives from `agentId` + the resolved cloud base and is always shared-shaped, so the later guard would catch it anyway. It is not redundant: if `resolveDirectCloudAuthApiBase` returns an empty string the base is empty, `isDirectCloudSharedAgentBase(\"\")` is false, and `hasDedicatedUrl` is the only guard left. It stays reachable, and I did not fabricate that state just to pin it.\n\n# Test-only gate\n\n- **Realistic regression prevented:** reverting the shared-base guard lets the client \"switch\" the conversation onto the shared REST adapter, which hosts no dedicated runtime — user-visible as a dead post-handoff chat.\n- **Observing consumer:** `startCloudAgentHandoff` → `startCloudConversationHandoff`, whose `onSwitch` repoints the app at the returned base.\n- **Why existing coverage does not own it:** demonstrated by mutation above — the guard's deletion is invisible to every current test, because they are all stopped by `hasDedicatedUrl` first.\n\n# Verification\n\n- `packages/ui` `src/api/client-cloud-handoff-target.test.ts` → **10 passed** (was 9)\n- All 19 `packages/ui/src/api/client-cloud*.test.ts` files → **326 passed**, no failures — the new case does not disturb the sibling handoff suites\n- `biome check` clean on the touched file\n\nTest-only; no runtime source is touched. Follows from the guard sweep I posted in my review of #30376.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1JEK3CATYR1396FVYVRSQPF\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T01:37:02.858Z\",\"completed_at\":\"2026-09-03T01:37:44.704Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T01:37:03.149Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"739b0d9299ef6cab1d88f60ee15107ea27ed6d74b196d496aee6cd849ef549b3\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"8e25f5da-a3a0-4a20-8dc4-697cbb378009\",\"object_id\":\"sha256:739b0d9299ef6cab1d88f60ee15107ea27ed6d74b196d496aee6cd849ef549b3\",\"sha256\":\"739b0d9299ef6cab1d88f60ee15107ea27ed6d74b196d496aee6cd849ef549b3\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"3TBisFNQbM5_1aLRfBSHL83HyCkyuVPCHvMmjBD4vcJh4iQWdh-i0I4aloJYshCP1vt0bo-jq1zpmXRPf4ybDw\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"62:T65a,"])</script><script>self.__next_f.push([1,"Closes #30348\n\n## Problem\n\nA cold inference-admission Durable Object can return the exact machine-readable `rate_limit_unavailable` 503 with `Retry-After: 1`. The identical authenticated request succeeds immediately afterward, but plugin-elizacloud classified this as a terminal provider failure and fell back to `eliza-router`.\n\n## Change\n\nInclude only `{ success: false, code: \"rate_limit_unavailable\" }` in the existing bounded same-provider retry classifier. Arbitrary, upstream, non-JSON, and incomplete 503 bodies continue to fail over immediately. Buffered and streaming Cloud paths already share this classifier; both now have explicit regression coverage.\n\n## Evidence\n\n- Live authenticated production reproduction: first `chat/completions` request returned `503 rate_limit_unavailable`; identical second request returned 200.\n- `bunx vitest run plugins/plugin-elizacloud/__tests__/unit/text-warming-retry.test.ts`: 15/15 passed.\n- `bun run --cwd plugins/plugin-elizacloud test`: 631 passed, 5 skipped; dist packaging 5/5 passed.\n- `bun run --cwd plugins/plugin-elizacloud typecheck`: passed.\n- `bun run --cwd plugins/plugin-elizacloud build`: passed.\n- `bunx biome check` on both touched files: passed.\n- `NODE_OPTIONS=--max-old-space-size=8192 bun run verify`: passed, 376/376 workspace tasks plus repository audits.\n\n## Reviewer-visible behavior\n\nOn the first Cloud request after admission-gate idling, Eliza waits the server-declared bounded retry and remains on `elizaOSCloud` when the gate recovers, rather than immediately answering through the local router.\n\nNo UI surfaces changed; screenshots/video are N/A."])</script><script>self.__next_f.push([1,"63:T1374,"])</script><script>self.__next_f.push([1,"# What\n\n`MAX_TOOL_DIAGNOSTIC_DEPTH = 8` bounds the tool-diagnostic projector in `packages/core/src/security/`. It appears at five sites and decides two things: how far the projector will walk a tool payload, and how much nested tool data reaches a diagnostic log.\n\nIts value is not pinned. Moving it by one in either direction leaves the suite green:\n\n| mutant | `tool-diagnostics.test.ts` |\n|---|---|\n| `8` → `7` | **18 pass / 0 fail** |\n| `8` → `9` | **18 pass / 0 fail** |\n| `8` → `64` | 17 pass / 1 fail |\n| `8` → `1` | 13 pass / 5 fail |\n\nOnly the extremes are caught, by tests that happen to nest 18 levels deep for other reasons. Nothing sits at the boundary, so the specific number is currently a free variable — including upward, which widens what a hostile or runaway payload can push into a log.\n\n# The change\n\nTests only. A helper that nests exactly `n` objects around a leaf, plus a `maskDepth` walker that reports where `TOOL_DIAGNOSTIC_MASK` appears, and four cases:\n\n- **7 wrappers renders** — the deepest level inside the bound still carries its payload, and no mask appears;\n- **8 wrappers masks, at exactly depth 8** — asserted positionally, not just as \"the payload is gone\", so truncation is shown to be bounded rather than total;\n- **20 wrappers still masks at depth 8** — the bound does not drift with input size;\n- **the complete model-bound projection is unaffected** — `projectCompleteToolValueForModel` documents itself as being \"without diagnostic depth masking\", and is pinned against the same fixtures at 8 and 20 wrappers.\n\nThat last one is the pair I most wanted: the diagnostic projector and the complete projector differ *only* by this bound, so unifying them is an easy refactor to make by accident. With this test, doing so either starts truncating model input or stops truncating diagnostics, and both fail.\n\nI established the boundary by executing the projector rather than reading the comparison — `depth \u003e= MAX` is evaluated on the value's own depth, and the off-by-one is easy to get wrong from the source alone.\n\n# Evidence\n\n`bunx vitest run src/security/tool-diagnostics.test.ts` → **22 passed** (was 18).\n\n| mutant | before | after |\n|---|---|---|\n| `8` → `7` | 0 fail | **3 fail** |\n| `8` → `9` | 0 fail | **2 fail** |\n| `8` → `6` | — | **3 fail** |\n| `8` → `10` | — | **2 fail** |\n| `8` → `64` | 1 fail | **3 fail** |\n| `8` → `1` | 5 fail | **8 fail** |\n| `depth \u003e= MAX` → `depth \u003e MAX` | — | **2 fail** |\n\n**7 of 7 killed**, where ±1 in either direction previously had no detector.\n\n`bunx @biomejs/biome check` → clean (no reformatting needed). `bunx tsc --noEmit -p packages/core/tsconfig.json` → no errors in the file.\n\n# Context\n\nFound by sweeping for numeric guards compared against an `UPPER_SNAKE` constant whose name never appears in a test — the one-sided-threshold shape from #30410. Related: #30418–#30423 in the clause-isolation series.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KAWWYDRTPR3HMC5CWVBNCG\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T09:51:44.078Z\",\"completed_at\":\"2026-09-03T09:54:53.340Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T09:51:44.305Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"5fb1dd5668744c6af74d3cad579f211b3d2e924bbd4cf55df8a3f97eb9e8c276\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"b944cc08-3788-47e8-8dde-7afca03d4498\",\"object_id\":\"sha256:5fb1dd5668744c6af74d3cad579f211b3d2e924bbd4cf55df8a3f97eb9e8c276\",\"sha256\":\"5fb1dd5668744c6af74d3cad579f211b3d2e924bbd4cf55df8a3f97eb9e8c276\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"o6y2YUSsFcJFNu2wN4dl7z_MXKrrQBr6qbPm8lpwXZVPeV7ivh6dajBt5HbcQM9rO82oL2wzFRC_Bvl1gBINCg\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"64:T19b9,"])</script><script>self.__next_f.push([1,"# What\n\nThe two opaque exchange endpoints decide **400 `missing_code` vs. 401 `invalid_code`** on a shape gate, and almost none of that gate is pinned.\n\n`looksLikeSsoBridgeCode` and `looksLikeStagingSessionCode` are the same three clauses:\n\n```ts\ntypeof value === \"string\" \u0026\u0026\nvalue.startsWith(PREFIX) \u0026\u0026\nHEX_64_RE.test(value.slice(PREFIX.length))\n```\n\nA code that fails them never reaches the atomic `DELETE … RETURNING` claim and answers **400 `missing_code`**. A code that passes but no store knows answers **401 `invalid_code`**. That difference is the observable contract, and widening the gate collapses one into the other.\n\nI ran eight clause-level mutants across the two guards. **Seven survived.**\n\n| mutant | before |\n|---|---|\n| bridge: drop `startsWith(SSO_BRIDGE_CODE_PREFIX)` | killed |\n| bridge: drop the hex clause | **survived** |\n| bridge: `HEX_64_RE` accepts uppercase | **survived** |\n| bridge: `HEX_64_RE` accepts length 1–80 | **survived** |\n| QA: drop `startsWith(STAGING_SESSION_CODE_PREFIX)` | **survived** |\n| QA: drop the hex clause | **survived** |\n| QA: `HEX_64_RE` accepts uppercase | **survived** |\n| QA: `HEX_64_RE` accepts length 1–80 | **survived** |\n\n# Why the existing tests miss it\n\nTwo different masking shapes, one per suite.\n\n**The bridge suite had a fixture list, not a clause list.** `malformed / missing codes are rejected before any store lookup` loops over `[undefined, \"\", \"short\", `eac_${\"0\".repeat(64)}`, 42]`. The `eac_` case is a *wrong prefix with a correct body*, so it isolates the prefix clause — which is exactly why that one mutant died. There is no case with a *correct prefix and a wrong body*, so the hex clause is free to be anything.\n\n**The QA suite pinned one direction of a two-way separation.** `old SSO exchange cannot recognize or burn a versioned QA code` proves the legacy bridge refuses an `esqa_` code. The mirror — the QA exchange refusing an `esso_` code — was never written. `esso_` and `esqa_` are both five characters, so the prefix clause is the *only* thing separating the two code families, and it was unpinned in the direction that matters for the newer endpoint.\n\n# The change\n\nTests only, +59/-2 across the two existing suites.\n\n- **Bridge**: extend the fixture list to one case per clause — a staging-session code (same length, wrong prefix), a non-hex body, an uppercase-hex body, a 63-hex body, a 65-hex body — and assert the `missing_code` error code, not just the 400. Each fixture is labeled so a failure names itself.\n- **QA**: add the missing mirror (`the QA exchange cannot recognize a legacy SSO code either`) next to the test it mirrors, plus a per-clause loop of its own.\n\n# Deliberately not included\n\n`looksLikeOidcCode` and `looksLikeOidcRequestId` in `shared/src/lib/oidc/codes.ts` are the same shape and their clauses survive mutation too — but I could not find an observable difference, so pinning them would be pinning an implementation detail:\n\n- `looksLikeOidcCode` is reachable only from `consumeOidcAuthorizationCode`, where a malformed code and an unknown code both return `null` and the token endpoint collapses both to the same `invalid_grant`. That collapse is deliberate and already tested.\n- `looksLikeOidcRequestId` decides `named` in `authorize/route.ts`, which only controls whether a binding cookie that cannot exist is deleted. `resumeOidcAuthorizationRequest` returns `null` either way and the browser sees the same `Sign-in request expired` page.\n\nBoth are genuinely \"unpinned but same outcome\", which is not a gap. Recording it so the next sweep does not re-litigate it.\n\n# Evidence\n\nBaseline for the five suites that touch any of the four guards — `oidc-provider` (131), `sso-bridge` (17), `staging-session-exchange` (55), `db/repositories/oidc` (14), `oidc/request-binding` (8) — **225 pass / 0 fail**.\n\nAfter the change, `bun test __tests__/sso-bridge.test.ts __tests__/staging-session-exchange.test.ts` → **74 pass / 0 fail** (was 72).\n\nRe-ran every mutant against the new suites:\n\n| mutant | after |\n|---|---|\n| bridge: drop prefix clause | 2 fail |\n| bridge: drop hex clause | 1 fail |\n| bridge: hex accepts uppercase | 1 fail |\n| bridge: hex accepts length 1–80 | 1 fail |\n| QA: drop prefix clause | 2 fail |\n| QA: drop hex clause | 1 fail |\n| QA: hex accepts uppercase | 1 fail |\n| QA: hex accepts length 1–80 | 1 fail |\n\n**8 / 8 killed**, baseline restored green between each.\n\n`bunx @biomejs/biome check` on both files → no fixes applied. `bunx tsc --noEmit` in `packages/cloud/api` → exit 0.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdo -denied, or large payload that outruns the child's read), writing to the closed pipe emits `EPIPE` on `proc.stdin`. In Node an unhandled stream `error` becomes an `uncaughtException` that kills the agent process.\n\nThis plugin is auto-enabled on `darwin` and the ALARM action is a normal reachable path, so a recoverable IPC failure escalates to a full-process crash — an error-policy violation.\n\nFix: attach `proc.stdin.on(\"error\", () =\u003e {})` before `end()` (J6 best-effort teardown — the helper's exit code / stdout still surfaces the failure, so silently absorbing the pipe error is correct; the `close` handler below decides the result). Verified that `fork` already merged helper-timeout kill logic (#22023) — this is the remaining stdin-EPIPE gap.\n\n## Testing\n- **Red:** wrote probe `Writable` that emits `EPIPE` on `write` and tracked `process.on(\"uncaughtException\")` → without guard, 5 unhandled EPIPE errors counted in vitest (stack at `helper.ts:76`).\n- **Green:** with `proc.stdin.on(\"error\", () =\u003e {})`, added regression `it(\"does not throw unhandled EPIPE when stdin closes before payload drains\")` that fakes a `Writable` emitting `EPIPE` and asserts `runHelper` still resolves to `{success:true, alarms:[]}` with `unhandled === []`. Full `plugins/plugin-native-macosalarm` suite: **36 passed (4 files)** including 7 in `helper.test.ts`. `biome check` clean, `typecheck` clean.\n- Binary `bin/macosalarm-helper` unchanged (not in diff).\n\n```bash\nbun --cwd plugins/plugin-native-macosalarm test -- __tests__/helper.test.ts\n# Test Files  1 passed (1)\n# Tests  7 passed (7)\nbun run --cwd plugins/plugin-native-macosalarm test\n# Test Files  4 passed (4)\n# Tests  36 passed (36)\n```\n\n## Risks\nLow — two-line guard + J6 comment, no happy-path change. Only absorbs the already-fatal EPIPE that previously crashed the process. Existing timeout/kill and error handling unchanged.\n\n## Evidence Gate\n\u003c!-- evidence-head:0a2752638d3336f768ed4d852759cde2 isioning-worker.image-rollout.test.ts` |\n|---|---|\n| drop `summary !== null` | 5 pass / 1 fail |\n| drop `summary.attempted \u003e 0` | 5 pass / 1 fail |\n| drop `summary.failed === 0` | 5 pass / 1 fail |\n| **drop `summary.targetDigest !== null`** | **6 pass / 0 fail** |\n\nThe digest clause can be deleted entirely and the suite stays green.\n\n# Why it is masked\n\nThe existing fixture list has two undigested-adjacent cases, and neither isolates the clause:\n\n```ts\n{ attempted: 0, failed: 0, targetDigest: null }   // refused by the attempt clause anyway\n{ attempted: 0, failed: 0, targetDigest }         // isolates the attempt clause\n```\n\nThere is no `{ attempted \u003e 0, failed: 0, targetDigest: null }`, so nothing distinguishes \"refused because no node was attempted\" from \"refused because the digest never resolved.\"\n\n# Why the clause is load-bearing, not redundant\n\n`processPoolImageRolloutCycle` has its own `if (!targetDigest)` guard, so it is tempting to read the admission clause as belt-and-braces. It isn't, because of the line above that guard:\n\n```ts\nconst targetDigest =\n  resolvedTarget?.targetDigest ?? (await resolveImageDigest(configuredImage));\n```\n\nAn admitted summary carrying a null digest does not skip — it **re-resolves the digest from the mutable tag**, at a later moment than the pre-pull. That is exactly what the caller comment forbids:\n\n\u003e Never fall back to a mutable tag once this sweep knows the immutable target.\n\nSo with the clause gone, a sweep that pre-pulled nodes but never resolved a digest would authorize the rollout, and the rollout would then fence and replace warm-pool nodes against an image that may differ from whatever was pre-pulled — voiding the pre-pull's entire purpose.\n\n**This is not currently reachable**, and I want to be exact about that: `processPrePullImagesCycle` returns early with `{ attempted: 0, …, targetDigest: null }` when the digest does not resolve, so `attempted \u003e 0 \u0026\u0026 targetDigest === null` cannot be produced today, and it is the only producer of a `PrePullImagesSummary`. The clause is defence in depth against that ordering changing — a pre-pull that resolved the digest after contacting nodes, or a second producer, would make it live. Today, deleting it is a free change and nothing tells you it mattered.\n\n# The change\n\nTests only. The existing single test becomes a labelled case table with one entry per clause, plus the isolating case:\n\n```ts\n[\"the digest never resolved despite attempted nodes\",\n { attempted: 1, failed: 0, configuredImage, targetDigest: null }],\n```\n\nand one test recording *why* the clause exists — driving `processPoolImageRolloutCycle` with an undigested target and asserting it calls `resolveImageDigest` rather than refusing up front.\n\nI first wrote that rationale test with a digest-returning mock and it walked into the warm-pool manager and failed on unrelated deps; returning `null` takes the `skipped_no_digest` path and still proves the fallback fires, which is the whole point.\n\n# Evidence\n\n`bun test admin/daemons/provisioning-worker.image-rollout.test.ts` → **12 pass / 0 fail** (was 6), 55 `expect()` calls.\n\n| mutant | before | after |\n|---|---|---|\n| drop `summary !== null` | 1 fail | **1 fail** |\n| drop `summary.attempted \u003e 0` | 1 fail | **1 fail** |\n| drop `summary.failed === 0` | 1 fail | **1 fail** |\n| drop `summary.targetDigest !== null` | **0 fail** | **1 fail** |\n| `failed === 0` → `failed \u003e= 0` | — | **1 fail** |\n| `attempted \u003e 0` → `attempted \u003e= 0` | — | **1 fail** |\n\n**6 of 6 killed**, where the digest clause previously had no detector at all.\n\nEvery sibling suite in the package, run file by file:\n\n```\nprovisioning-worker-env-reconcile.test.ts               13 pass  0 fail\nprovisioning-worker.backup-verify.test.ts                2 pass  0 fail\nprovisioning-worker.deletion-reconcile.test.ts           8 pass  0 fail\nprovisioning-worker.image-rollout.test.ts               12 pass  0 fail\nprovisioning-worker.orphan-liveness-gate.test.ts         3 pass  0 fail\nprovisioning-worker.pool-health.test.ts                  4 pass  0 fail\nprovisioning-worker.pre-delete-backup-cleanup.test.ts    3 pass  0 fail\nprovisioning-worker.replenish.test.ts                    3 pass  0 fail\nprovisioning-worker.test.ts                             65 pass  0 fail\n```\n\n`bunx @biomejs/biome check` on the file → clean.\n\n# Context\n\nSame sweep as #30418, #30407 and #30410: multi-clause guards where one term has no fixture that isolates it.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1K817QDPA64AM3RS7Q4X1ZT\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T09:01:40.461Z\",\"completed_at\":\"2026-09-03T09:04:58.261Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T09:01:41.086Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"to `moderationViolations` comes from a left join (`userModerationStatus.totalViolations`), so it is genuinely `null` for a user with no moderation record — the overwhelmingly common case. Replacing that default with any number ≥ 5 denies every clean user, and today no test notices.\n\n# The change\n\nTests only, +46/-0, into the existing table.\n\nOne denial row — clean status, count at the threshold — which is the only fixture that can distinguish the comparison from its absence:\n\n```ts\n{\n  name: \"violation count at the threshold without a ban\",\n  rows: [{ ...activeStandingRow, moderationStatus: \"clean\", moderationViolations: 5 }],\n  reason: \"moderation_blocked\",\n},\n```\n\nAnd two allowed rows, in a small sibling loop, so the comparison is fixed from *below* as well — a denial-only table can always be satisfied by lowering the threshold:\n\n```ts\n{ name: \"one violation below the threshold\", moderationViolations: 4 },\n{ name: \"no recorded violation count\",       moderationViolations: null },\n```\n\n`4` is what makes `\u003e= 4` fail; `null` is what makes `?? 99` fail. Neither is reachable from the denial table, which is why they are a separate case rather than more rows in it.\n\n# Evidence\n\nBaseline on `3ce7195c8b`: `outbound-message-standing` 7 pass, `message-router` 19, `skills.money-guard` 7, `paid-route-standing` 8 — all clean, run file-by-file.\n\nAfter: `outbound-message-standing` **10 pass / 0 fail**; the other three unchanged.\n\nEvery mutant re-run against all four suites:\n\n| mutant | after |\n|---|---|\n| `\u003e= 5` → `\u003e= 6` | **1 failed** |\n| `\u003e= 5` → `\u003e= 4` | **1 failed** |\n| `\u003e= 5` → `\u003e 5` | **1 failed** |\n| delete the violations half | **1 failed** |\n| delete the `banned` half | **1 failed** |\n| `?? 0` → `?? 99` | **1 failed** |\n\n**6 / 6 killed**, up from 1 / 6, with the baseline restored green between each. No failure leaks into the other three suites, so the new fixtures are doing the work rathe ew`, `OK`) and printed which one fired.\n\n# The input that isolates the guard\n\nA row advertising a **public dedicated web UI** and `status: \"running\"`, so every URL-shaped check passes:\n\n```ts\ndata: {\n  id: \"dedicated-1\",\n  status: \"running\",\n  executionTier: \"shared\",\n  webUiUrl: \"https://dedicated-1.elizacloud.ai\",\n}\n```\n\n| implementation | marker | `onSwitch` |\n|---|---|---|\n| guard intact | `tier-shared` | not called |\n| guard disabled | `OK` | **called** |\n\nWith the guard removed the client migrates the conversation onto the shared row. That's the defect the check exists to prevent, demonstrated rather than asserted.\n\n# Evidence\n\nInstrumentation removed and `client-cloud.ts` restored from a pristine copy before writing the final test, so the diff is test-only: one file, **+40/-0**.\n\n| implementation | result |\n|---|---|\n| guard mutated to `if (false)` | **1 failed** / 9 passed — the failing test is exactly the new one |\n| guard intact | 92 passed across the 5 suites (up from 91) |\n\n`bunx @biomejs/biome check` → exit 0.\n`bunx tsc --noEmit -p tsconfig.json` → exit 0, zero errors.\n\n# Context\n\nFound while reviewing #30330; carried as an unfiled note until I could produce a test that actually fails without the guard. No production behaviour changes here — the guard already works, it just wasn't pinned.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2
