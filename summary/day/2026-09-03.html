 fingerprint. This pins the edges beside them.\n\n# Evidence\n\nMutating each guard to a no-op, against `admin-canary-image.test.ts` + `admin-agent-image-rollout.pglite.test.ts`:\n\n| mutant | before | after |\n|---|---|---|\n| `SHA256_DIGEST_RE`: drop the `$` anchor | **survived** | killed |\n| `UUID_RE`: drop the `$` anchor | **survived** | killed |\n| `targets.length \u003c 1` (empty list) | **survived** | killed |\n| duplicate key `org:agent` → `agent` | **survived** | killed |\n| `isAdminCanaryImageJobData`: drop the operation union | **survived** | killed |\n| `isAdminCanaryImageJobData`: drop the string-field check | **survived** | killed |\n| `decisionAt` `Number.isFinite(Date.parse(...))` → `false` | **survived** | killed |\n| `assertDemoSourceImage` repository check → `false` | **survived** | killed |\n| `targets.length \u003e MAX` | killed | killed |\n| duplicate-target `seen.has(key)` | killed | killed |\n| demo repository prefix check | killed | killed |\n| canonical early return in `…CanonicalOrDemoPair` | killed | killed |\n| demo-pair digest equality | killed | killed |\n| `requestId` regex → case-insensitive | killed | killed |\n| target \"must change the current image pair\" | killed | killed |\n| recovery-metadata all-or-nothing check | killed | killed |\n\n**8 new kills; 18 mutants, 8 of which survived before.** The three the suite already caught still die — the new cases don't stand in for the old ones. 56 → **74 passing**. `bun run --cwd packages/cloud/shared typecheck` → exit 0, biome clean.\n\n# The two anchors are the ones I'd read first\n\n`SHA256_DIGEST_RE` and `UUID_RE` are both end-anchored, and nothing said so. Drop either `$` and a value carrying trailing bytes validates on its prefix — `sha256:\u003c64 hex\u003e-extra` and `\u003cuuid\u003e\\n` both pass a guard whose entire job is to be exact. On a seam that pins an immutable image digest for a super-admin rollout, that is the specific way a fail-closed syntax check quietly stops being one. Both are now covered with a trailing-bytes and a trailing-newline case.\n\nThe duplicate key is the other one worth naming: it is `organizationId:agentId`, so the same agent id under two organizations is two legitimate targets. Keying on the agent id alone would reject a valid pair, and only a test with two orgs can tell the difference.\n\n# One ordering made load-bearing\n\nAt `assertDemoSourceImage`'s only call site (`eliza-sandbox.ts:11417`) it is immediately followed by `parseAdminCanaryDemoImage` on the same value, and **parse is the stricter of the two**:\n\n```\nghcr.io/elizaos/eliza-demo@sha256:aaa…      assertDemoSourceImage=true   parse=true\nghcr.io/elizaos/eliza-demo:v1@sha256:aaa…   assertDemoSourceImage=true   parse=false\nghcr.io/elizaos/eliza@sha256:aaa…           assertDemoSourceImage=false  parse=false\nghcr.io/evil/eliza-demo@sha256:aaa…         assertDemoSourceImage=false  parse=false\n```\n\nEverything the assert rejects, the parse also rejects; the tagged reference is refused only by the parse. I'd keep the assert — redundant defence on a super-admin seam is worth its cost, and it fails with the clearer message — but the ordering should be pinned rather than incidental, so the test asserts both halves and names which one refuses the tagged form.\n\n# Two survivors I did not pin, on purpose\n\n- **`assertCanonicalSourceImage` has no consumer.** `grep` across `packages` and `plugins` (excluding `dist` and the wrangler bundle) finds only its own definition. Writing a test would make a dead export look load-bearing; it's worth a maintainer's decision — delete it, or wire it in beside `assertDemoSourceImage` on the upgrade path, which is where its shape suggests it was meant to go.\n- **The exactness recheck in `parseAdminCanaryDemoImage` is unreachable.** `digest` is `image.slice(prefix.length)`, so `` `${DEMO}@${digest}` `` reconstructs `image` byte for byte; the comparison cannot be false. Harmless, but a test asserting it \"rejects\" something would be asserting nothing.\n\nI left both alone rather than manufacturing coverage for them.\n\n# Scope\n\nTest file only — no production code touched. Every guard here is correct as written; this makes them load-bearing.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1M7MJBDKR5SGH0XQVKG23AQ\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T18:13:59.789Z\",\"completed_at\":\"2026-09-03T18:15:28.004Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T18:14:00.609Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"24607b39df866316e5f656fb12f79e008dd8561a4ef6d419a41239eb162959b1\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"cf1a4123-b6f8-4089-9082-bf66f3864e1a\",\"object_id\":\"sha256:24607b39df866316e5f656fb12f79e008dd8561a4ef6d419a41239eb162959b1\",\"sha256\":\"24607b39df866316e5f656fb12f79e008dd8561a4ef6d419a41239eb162959b1\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"Lavpg1biHxXQifz0TvjLGHvpbwr6qP4LQtWV7EsOZ--tEJJ2r46nDFXtvtDXWGPDaJHWxnI2F-p_8PT-1T9QAA\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"3d:T923,"])</script><script>self.__next_f.push([1,"## Summary\n\n- retry fresh Steward binding activation once when the strong-revocation boundary reports its typed transient-unavailable error\n- remain fail-closed if the second attempt fails or if any other error occurs\n- preserve the already-committed canonical user, organization, and Steward identity so the existing-user path can repair activation on the next request\n- retain the existing rollback behavior for non-target initialization failures\n\nThis is a bounded repair for #18627. It addresses the freshly correlated intermittent Steward binding-activation failure during new-account sync. It does not close the issue's remaining WebKit magic-link, Google OAuth, stale-asset, or Agents-table acceptance criteria.\n\n## Evidence\n\n### Before\n\nA fresh AgentMail identity was tested against staging in headless Chromium while the staging Worker was tailed. Email verification succeeded, but the Steward session endpoint returned 500 and the UI showed `Could not sync Steward user`. The correlated Worker failure was `INFERENCE_CREDENTIAL_REVOCATION_UNAVAILABLE` after the identity projection had committed; the subsequent destructive cleanup was rejected by retention/FK policy.\n\n### After (local exact revision)\n\n- transient typed boundary failure: activation is attempted twice and succeeds\n- persistent typed boundary failure: the request still rejects after two attempts\n- committed identity state is preserved only for that exact failure, with the original error retained as the cause\n- non-target initialization failure still rolls back the user and organization\n- two independent adversarial reviews found no correctness, security, regression, or scope issues\n\n### Verification\n\n- `bun --config=/dev/null test packages/cloud/shared/src/lib/services/inference-auth-lifecycle.test.ts` — 27 passed\n- `bun --config=/dev/null test packages/cloud/shared/src/lib/steward-sync-default-provisioning.test.ts` — 8 passed\n- `bun run --cwd packages/cloud/shared typecheck` — passed\n- `bun run --cwd packages/cloud/shared lint` — passed\n- `bun run verify` — passed (376/376 Turbo tasks plus repository audit gates)\n\nExact-revision staging validation remains pending deployment. No deployment was performed as part of this PR.\n\n## UI evidence\n\nN/A — server-side authentication lifecycle repair; no UI files or rendered states changed.\n"])</script><script>self.__next_f.push([1,"3e:T1afd,"])</script><script>self.__next_f.push([1,"# What\n\n`hasExactAgentBackupRestorePrecreateQuarantine` is the gate that must hold before restore vault material leaves KMS authority — `bindAgentBackupVaultKeyGeneration` throws `AgentBackupCatalogConflictError(\"Restore vault lacks exact container-pending quarantine authority\")` when it fails.\n\nCounting the private `hasCommonAgentBackupRestoreQuarantineAuthority` it delegates to, it is a **23-clause conjunction**, and no test names it. What the PGlite suites do catch is a *fully inverted* predicate:\n\n| | quarantine | authority | operations |\n|---|---|---|---|\n| baseline | 18 pass / 0 fail | 31 pass / 0 fail | 27 pass / 0 fail |\n| `return (…)` → `return !(…)` | 18 / **0 fail** | 14 / **17 fail** | 20 / **7 fail** |\n\nWhat none of them catch is any **single** dropped clause. Every one of the 23 terms could be deleted with all three suites green:\n\n```\ndrop activation_phase === \"container_pending\"     -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_receipt === null                  -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_container_id === null             -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_node_id === null                  -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_boot_id === null                  -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_completed_at === null             -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_purpose === \"restore\"             -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop !activation_token_ciphertext.includes(NUL)   -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\ndrop activation_consent_head_backup_id === null   -\u003e auth 0 fail, ops 0 fail, quarantine 0 fail\n…\n```\n\nThe suites only ever present rows that satisfy every clause at once, so they prove the conjunction as a whole and nothing about its parts. Dropping `activation_container_id === null` — which is what stops a sandbox that already has a container from being handed fresh vault key material — is currently a free change.\n\n# The change\n\nTests only, one new file. A single fixture representing a pristine `container_pending` restore quarantine, then one case per clause that violates exactly that clause, grouped by what each group protects:\n\n- **binding identity** (8) — soft-deleted row, another attempt's activation, unpinned or drifted lifecycle revision, non-restore purpose, wrong backup, wrong manifest hash, wrong activation-token hash;\n- **token ciphertext** (5) — absent, non-string, empty, over the byte bound, NUL-bearing;\n- **consent columns** (3) — the three that belong to a different activation path;\n- **precreate exactness** (11) — phase moved on, receipt, receipt hash, container, node, image digest, boot id, published authority, funding revision, dispatch, completion.\n\nPlus both sides of the ciphertext bound: exactly `MAX_ACTIVATION_TOKEN_CIPHERTEXT_BYTES` is accepted, and the bound is counted in UTF-8 **bytes** — a two-byte character repeated to the code-unit limit is refused. A denial-only table can always be satisfied by loosening the bound, so it is pinned from above and below.\n\n# Evidence\n\n`bun test src/db/repositories/__tests__/agent-backup-restore-precreate-quarantine.test.ts` → **30 pass / 0 fail**.\n\nSame battery, after: **22 of the 23 clauses now fail the new suite when dropped** (29 pass / 1 fail each; the `typeof … === \"string\"` clause fails 2).\n\n**One survivor, and it should not block:** `activation_lifecycle_revision !== null` cannot be killed, because the clause immediately after it — `activation_lifecycle_revision === BigInt(sandbox.lifecycle_revision)` — is false for `null` regardless. `lifecycle_revision` is `.notNull().default(0)`, so `BigInt(...)` cannot throw and cannot yield `null`; the `!== null` term is genuinely subsumed. It reads as a useful narrowing hint, so I have not touched it — but no fixture can distinguish its presence from its absence, and I would rather say that than pad the suite with a case that looks like it covers the clause and doesn't.\n\nNeighbouring suites unchanged, run file by file (combined `bun test` invocations in `cloud/shared` have produced false reds):\n\n```\nagent-backup-restore-quarantine.pglite.test.ts        18 pass  0 fail\nagent-backup-restore-authority.pglite.test.ts         31 pass  0 fail\nagent-backup-restore-operations.pglite.test.ts        27 pass  0 fail\nagent-backup-restore-authority-binding.test.ts         2 pass  0 fail\nagent-backup-global-lock-order.test.ts                 6 pass  0 fail\n```\n\n`bunx @biomejs/biome check` → clean. `bunx tsc --noEmit -p packages/cloud/shared/tsconfig.json` → no errors in the new file.\n\n# Context\n\nSame sweep as #30418 and #30419: multi-clause guards proven in aggregate but not per term. This one is the largest and sits on the most sensitive gate of the three.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1K8KH07JVFNRBEMBYX5XSWG\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T09:11:39.784Z\",\"completed_at\":\"2026-09-03T09:20:43.435Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T09:11:40.554Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"b943fdb4fd0c95db63f371fa90f28b38fdb7a665b09a89c4f92f13751bc9ee07\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"70f0e6c1-caff-49ec-b8bd-dc16ac32b07f\",\"object_id\":\"sha256:b943fdb4fd0c95db63f371fa90f28b38fdb7a665b09a89c4f92f13751bc9ee07\",\"sha256\":\"b943fdb4fd0c95db63f371fa90f28b38fdb7a665b09a89c4f92f13751bc9ee07\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"2u8ldS4nPoE3DkqCt1IwW5JvUcxqroJ6ErjAG84lASPDzDtylD_dXcXA8xu6ItDpImgWFDyC6QT1tpyPBk2BCg\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"3f:T1b62,"])</script><script>self.__next_f.push([1,"# What\n\n`plugins/plugin-health/src/contracts/lifeops.ts` kept a **local 34-entry copy** of `LIFEOPS_AUDIT_EVENT_TYPES`. The canonical list in `packages/shared/src/contracts/personal-assistant.ts` has **44**. The copy was missing eleven event types:\n\n```\noccurrence_progress_recorded\nhousehold_role_bound            household_proposal_created\nhousehold_grant_issued          household_proposal_revised\nhousehold_grant_revoked         household_proposal_approved\nhousehold_proposal_invalidated  household_agreement_activated\nhousehold_export_read\n```\n\nThat is the entire household-governance block plus one occurrence event — and the copy's remaining order diverges too, since `occurrence_progress_recorded` is missing from the middle.\n\nThe same file already states the policy this violates, in its own header:\n\n\u003e The passive-signal source vocabulary is owned by `@elizaos/shared`; health imports and re-exports the canonical const/type/guard so its reliability tables and the PA telemetry mapper agree on one definition **instead of drifting copies**.\n\nSo the fix is to do for the audit-event vocabulary exactly what the file already does for the signal-source vocabulary, three lines above.\n\n# Why it was silent\n\nI traced every consumer of `LifeOpsAuditEventType` before deciding this mattered:\n\n| consumer | resolves to |\n|---|---|\n| `plugin-goals/src/db/goals-repository.ts:288` | `@elizaos/shared` |\n| `plugin-goals/src/goals-service.ts:146` | `@elizaos/shared` |\n| `plugin-personal-assistant/src/lifeops/service-mixin-core.ts:496` | `../contracts/index.js` → `export * from \"@elizaos/shared\"` |\n\n**Nothing imported the narrow copy.** All three go to the canonical 44-entry list, which is why the drift never produced a type error or a rejected event — and why it could sit there indefinitely.\n\nI want to be accurate about severity rather than dress this up: this was **not** a live defect. It was dead, divergent, exported contract code that would have become one the first time anything in health imported its own copy and tried to log a household event.\n\n# The change\n\n- Import `LIFEOPS_AUDIT_EVENT_TYPES` and `LifeOpsAuditEventType` from `@elizaos/shared`, alongside the signal-source vocabulary already imported there.\n- Re-export both from the existing re-export block.\n- Delete the 34-entry local array and its derived type.\n- Extend the header comment to name the audit-event vocabulary too, so the stated policy matches the code.\n\nNet **+8 / −42** in the source file. The public surface of `@elizaos/plugin-health` is unchanged in shape — both names are still exported — and the union only widens, so no existing producer or consumer can break. There are no in-repo exhaustive switches over the type (nothing imports health's copy at all).\n\n# Regression test\n\nNew file, `lifeops-audit-event-vocabulary.test.ts`, 14 tests. The assertion that matters is **identity, not deep equality**:\n\n```ts\nexpect(LIFEOPS_AUDIT_EVENT_TYPES).toBe(CANONICAL_AUDIT_EVENT_TYPES);\n```\n\nA reintroduced local array with identical contents satisfies `toEqual` and then drifts again on the next canonical edit. `toBe` is the only thing that says \"this is the canonical list, not a snapshot of it.\"\n\nThe eleven previously-missing types are also named individually, so the specific regression this file exists for is asserted by name rather than only by length — a future canonical addition changes the count but must not silently drop any of them.\n\n# Evidence\n\nExecuted at `01eec61dd9`.\n\n| mutant | result |\n|---|---|\n| control | **14 passed** |\n| reintroduce a local copy with **identical** contents | **1 failed** — the identity assertion |\n| re-narrow the export to the old two health-owned entries | **12 failed** |\n\n**Suites:** new file **14 passed**. Full `plugin-health` suite → **213 passed / 4 skipped**, 38 files. Consumer package `plugin-goals` → **74 passed / 1 skipped**.\n\n**Typecheck:** `plugin-health` exit **0**; `plugin-personal-assistant` exit **0**; `plugin-goals` exit **0**. Biome on both changed files → clean.\n\n# One note on conventions\n\nMy first draft imported from `bun:test` and failed `plugin-health`'s typecheck (`Cannot find module 'bun:test'`) — this package runs **vitest** (`\"test\": \"vitest run --config vitest.config.ts\"`), and my file was the only `bun:test` user in it. Switched to `vitest` and typed the `it.each` parameter explicitly to clear `TS7006`. Flagging it only because \"the tests pass\" and \"the package typechecks\" were two different questions here, and the first passed before the second did.\n\n# Related, not fixed here\n\n`LIFEOPS_AUDIT_EVENT_TYPES` had **zero** test references anywhere in the repo before this. It is one of roughly 68 exported LifeOps vocabulary lists in `personal-assistant.ts` with no test naming any member. I have not tried to pin them — that would be a large diff of low leverage, and most of those lists have no second copy to drift against. This PR covers the one that had actually drifted.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1M16XGABDENVFZFTXM1583K\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T16:2 it from a test:\n\n```\n$ grep -rln CONNECTOR_IDS packages/ plugins/ | grep -E 'test|spec'\n(no matches)\n```\n\nSo all 20 entries, and the core/local seam that composes them, could be changed for free.\n\n# Why this list in particular\n\n`packages/agent/src/config/schema.ts:1138` walks the registry to build the heartbeat-target help text:\n\n```ts\nfor (const id of CONNECTOR_IDS) {\n  const normalized = id.trim().toLowerCase();\n  if (!normalized || seen.has(normalized)) continue;\n  seen.add(normalized);\n  ordered.push(normalized);\n}\n```\n\nThree of those operations are **silent**. A duplicate entry, a case-variant of an existing entry, or an entry that trims to empty is absorbed by `continue` rather than reported — the connector just quietly stops appearing in the help text. The registry carries `telegram` alongside `telegramAccount` and `discord` alongside `discordLocal`, so case-variant collisions are a live hazard rather than a theoretical one.\n\nThe invariants that loop depends on were asserted nowhere. They are now asserted at the source, where a contributor editing the list will see them.\n\n# The change\n\nTest-only, one new file, +141 lines. No source change.\n\n- **The whole registry, named in order.** This is the assertion that catches a silent *addition*; per-entry cases cannot.\n- **An `it.each` per connector**, paired with an explicit arity assertion — a generated table over an empty list registers zero cases and reports green, so the table cannot stand alone.\n- **The seam pinned by subtraction.** `ELIZA_CORE_CONNECTOR_IDS` is not exported, so the core half is derived from the composed list rather than hand-copied:\n\n  ```ts\n  const local = new Set\u003cstring\u003e(ELIZA_LOCAL_CONNECTOR_IDS);\n  const coreHalf = CONNECTOR_IDS.filter((id) =\u003e !local.has(id));\n  const localHalf = CONNECTOR_IDS.filter((id) =\u003e local.has(id));\n  expect([...CONNECTOR_IDS]).toEqual([...coreHalf, ...localHalf]);\n  ```\n\n  That stays honest when a core connector is added, and still fails if a local one is promoted to core.\n- **The four consumer invariants**: no duplicates, no post-lowercase collisions, nothing normalizing to empty, no embedded whitespace — plus one test that replays the consumer's own normalize-and-dedupe loop and asserts no entry is lost.\n- **`ConnectorId`**, with a `@ts-expect-error` proving a non-member is not assignable. That directive is itself the assertion: typecheck fails if the type ever widens enough to accept `\"myspace\"`.\n\n# Evidence\n\nEvery mutant executed at `4b58d2b8f8`, one at a time. **28 of 28 die** (nothing survives).\n\n**All 20 entries, deleted individually** — 20/20 fail (was 0/20; there was no test):\n\n`bluebubbles` `telegram` `telegramAccount` `discord` `discordLocal` `slack` `twitter` `whatsapp` `imessage` `farcaster` `lens` `msteams` `feishu` `matrix` `nostr` `blooio` `twitch` `mattermost` `googlechat` → 4 failed each; `wechat` (via emptying `ELIZA_LOCAL_CONNECTOR_IDS`) → 4 failed.\n\n**Structural mutants, 8/8 killed:**\n\n| mutant | result |\n|---|---|\n| swap the seam order (`local` spread before `core`) | 2 failed |\n| drop the `...ELIZA_LOCAL_CONNECTOR_IDS` spread | 4 failed |\n| add `\"Telegram\"` (case-variant of an existing id) | **5 failed** |\n| add a second `\"telegram\"` (exact duplicate) | **6 failed** |\n| add `\"signal\"` (a plausible new connector) | 3 failed |\n| pad `\"imessage\"` to `\" imessage \"` | 4 failed |\n| blank an id to `\"\"` | 4 failed |\n| also list `\"imessage\"` as app-local | **7 failed** |\n\nThe three bolded rows are the ones that motivated the file: each is a change that today produces no test failure anywhere in the repo, and each silently drops a connector from the heartbeat-target help text at runtime.\n\n**Suites:** `bunx vitest run src/config/schema.test.ts` → **31 passed** (new file). Regression-checked both consumers: `packages/shared` `src/config/` → **282 passed**, `packages/agent` `src/config/` → **613 passed**.\n\n`bun run --cwd packages/shared typecheck` → `Done!`. Biome on the new file → clean (ran `--write` for import ordering and formatting only; `git status --porcelain` confirms the diff is this one file).\n\n# What I deliberately did not do\n\nI did not touch the source, and I did not add or reorder a connector. Every invariant here already holds — I verified each by executing it before writing the assertion, so none of these is a defect report. The point is that all 28 changes above are currently free, and the ones that matter most are silent at runtime rather than loud.\n\nI also did not assert anything about which connectors are *user-visible*. `client-types-config.ts:161` notes that a per-entry `visible` flag \"replaces `VISIBLE_CONNECTOR_IDS`\", so visibility is deliberately no longer a property of this list, and pinning it here would re-couple something that was decoupled on purpose.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KYX8A8XY4MT04TM03MC90A\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T15:41:27.240Z\",\"completed_at\":\"2026-09-03T15:46:22.641Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fd stop pruning `cloud.services.inference` | **survives** |\n| stop pruning `cloud.services.tts` | **survives** |\n| stop pruning `cloud.services.media` | **survives** |\n| stop pruning `cloud.services.embeddings` | **survives** |\n| stop pruning `cloud.services.rpc` | **survives** |\n| remove the `services` prune loop entirely | **survives** |\n| drop the empty-`services` collapse | **survives** |\n\n`LEGACY_CLOUD_SERVICE_KEYS` — a second, independent five-name list — had **no test naming any of its members**, and neither did `remoteApiBase` or `remoteAccessToken`.\n\n# The change\n\nTest-only, +135 lines to the existing migration suite. No source change.\n\n- **Each of the ten prune-list names isolated in its own case.** The loops `delete` one key at a time, so removing a single name leaves that field on disk while the other four still migrate — invisible to any assertion that checks the list in aggregate. Each case carries `enabled: false` so the `cloud` block survives the prune and can be compared exactly.\n- **Both generated tables paired with an explicit arity assertion**, since a table over an empty list registers zero cases and reports green.\n- **The two collapse steps separated.** An emptied `services` block is removed, and a `cloud` block emptied by *that* removal is removed in turn. Without the first, migration leaves `cloud: { services: {} }` behind — and `services` is not itself a legacy field, so nothing later prunes it. Also pinned: a `services` block holding an unrecognized flag survives carrying only that flag, and a `cloud` block holding an unrecognized field (`agentId`) is kept.\n\n# One correction worth recording\n\nMy first read of the `remoteAccessToken` survivor was that a missed prune would leave a credential behind after migration. I probed it before writing the assertion, and that framing is wrong: the token is **migrated**, to `deploymentTarget.remoteAccessToken`. So a missed prune is a **duplication**, not a retention — the same secret would sit in both the legacy and the modern location, in a file written back to disk.\n\nStill worth pinning, and the assertion follows the corrected shape rather than a scarier one:\n\n```ts\nexpect(config.cloud).toEqual({ enabled: false });\nexpect(config.deploymentTarget).toMatchObject({\n  remoteApiBase: \"https://legacy.example\",\n  remoteAccessToken: \"legacy-token\",\n});\nexpect(JSON.stringify(config).split(\"legacy-token\")).toHaveLength(2);\n```\n\nThe last line is the one that matters — it asserts the secret appears exactly once in the serialized result, which is what \"moved\" means and what a per-field check cannot express.\n\n# Evidence\n\nEvery mutant executed at `8ad809aa89`, one at a time, across the four shared suites that import this module (`first-run-options.migration`, `.connections`, `.routing`, `first-run-cerebras`).\n\n**13 of 13 now die**, up from 4 of 13:\n\n| mutant | before | after |\n|---|---|---|\n| stop pruning `remoteApiBase` | survived | **3 failed** |\n| stop pruning `remoteAccessToken` | survived | **3 failed** |\n| stop pruning `services.inference` | survived | **2 failed** |\n| stop pruning `services.tts` | survived | **4 failed** |\n| stop pruning `services.media` | survived | **2 failed** |\n| stop pruning `services.embeddings` | survived | **2 failed** |\n| stop pruning `services.rpc` | survived | **2 failed** |\n| remove the `services` prune loop | survived | **2 failed** |\n| drop the empty-`services` collapse | survived | **8 failed** |\n| stop pruning `provider` | 1 failed | 3 failed |\n| stop pruning `inferenceMode` | 2 failed | 4 failed |\n| stop pruning `runtime` | 1 failed | 3 failed |\n| drop the empty-`cloud` collapse | 1 failed | 2 failed |\n\nI also re-ran the mutant the original suite exists to stop — adding `\"enabled\"` to `LEGACY_CLOUD_ROUTING_KEYS` — and it now fails **17** tests instead of 4. The pre-existing guard is unaffected; it just has more company.\n\n**Suites:** the four importing suites → **74 passed** mmand lines, environment values, logs, identifiers, keys, or addresses.\n\nVerification:\n- `bun test packages/cloud/scripts/admin/managed-dedicated-mesh-state-diagnostic.test.ts`\n- Cloud shared typecheck\n- `actionlint .github/workflows/live-smoke.yml`\n- `bun run verify` (376/376 repository tasks; all remaining audits passed)\n\nLive acceptance will deploy this exact source to the staging provisioning worker and inspect only the already-failed, quiesced canary before cleanup.43:T19be,"])</script><script>self.__next_f.push([1,"# What\n\n`POST /api/plugins/:id/reveal` returns a stored secret to the caller. Two lists in `app-plugins-routes.ts` decide what comes back:\n\n```ts\nconst SENSITIVE_KEY_PREFIXES = [\"SOLANA_\", \"ETHEREUM_\", \"EVM_\", \"WALLET_\"];\nconst REVEALABLE_KEY_PREFIXES = [ /* 37 provider prefixes */ ...SENSITIVE_KEY_PREFIXES ];\n```\n\n`REVEALABLE_KEY_PREFIXES` decides whether a key may be read at all; `SENSITIVE_KEY_PREFIXES` decides whether reading it additionally demands `ensureCompatSensitiveRouteAuthorized` — the loopback/elevated check that exists, per the comment, \"to prevent accidental exposure through the general plugin config UI.\"\n\n**No test in this package reaches the reveal route.** Measured on `develop`:\n\n| mutant | `app-plugins-routes.test.ts` |\n|---|---|\n| `if (SENSITIVE_KEY_PREFIXES.some(...))` → `if (false)` — elevation never demanded | **39 passed** |\n| the allowlist check → `false` — every key revealable | **39 passed** |\n| delete `\"WALLET_\"` from the sensitive list | **39 passed** |\n\nDeleting the entire elevated-auth branch leaves the package green.\n\n# The change\n\nTest-only. One `describe` block, plus three mock adjustments so the route is reachable: `ensureCompatSensitiveRouteAuthorized` and the vault move into the hoisted `mocks` object (`sharedVault` was `{}`, which the route calls as a function).\n\nSix cases:\n\n- **A key outside the allowlist gets 403 and the vault is never touched** — ordering matters, or the allowlist is advisory.\n- **Each of the four sensitive prefixes demands the elevated check** (a case per prefix, so a deleted entry names itself).\n- **A refused elevation stops the read.** Asserted on the consequence — `vaultReveal` not called, no 200 carrying the value — rather than on the flag.\n- **An ordinary allowlisted key reveals without demanding elevation**, with the exact vault scope (`plugins:discord:reveal`).\n- **Both lists match case-insensitively.** If either branch stopped uppercasing, a lowercase wallet key would slip past the elevated check.\n- **The sensitive prefixes are a subset of the revealable ones.** Dropping the spread fails closed — wallet keys 403 instead of escalating — but it would silently retire the elevated path, and every assertion above would still pass on the 403. This case is what distinguishes the two.\n\n# Evidence\n\n`bunx vitest run src/api/app-plugins-routes.test.ts`: **51 passed** (was 39).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 39/39 | **51/51** |\n| elevation branch → `if (false)` | survives | **9 failed** |\n| elevation return value ignored | survives | **4 failed** |\n| allowlist check → `false` | survives | **1 failed** |\n| `key.toUpperCase()` → `key` | survives | **1 failed** |\n| `...SENSITIVE_KEY_PREFIXES` spread removed | survives | **6 failed** |\n| delete `\"WALLET_\"` from the sensitive list | survives | **2 failed** |\n| `startsWith(prefix)` → `=== prefix` (both gates) | survives | **9 failed** |\n\n**8/8 killed, was 0/8.** Sibling suites unchanged (`plugin-routes`, `bridge-plugin-settings`, `plugin-routes.encoding`: 38 passed). Biome clean, `tsc --noEmit` clean. No source file is touched.\n\nOne harness note: the outer `beforeEach` does not know about the new mocks, so call counts accumulated across the parameterised cases and the first run failed with \"expected 1 times, got 4\". The block clears them itself — worth flagging because the assertions here are *about* call counts, so a stale count is the failure mode that would matter.\n\n# An observation I'd rather raise than encode\n\nI pinned the behaviour as it stands and did not change either list. But the two tiers are drawn on prefixes, and some allowlisted prefixes are broad enough to cover keys this repo treats as high-value elsewhere:\n\n`ELIZA_` is revealable without elevation, and `packages/agent/src/config/blocked-env-keys.ts` lists `ELIZA_WALLET_EXPORT_TOKEN`, `ELIZA_API_TOKEN` and `ELIZA_TERMINAL_RUN_TOKEN` as secrets that must never be written through config. `DATABASE_`, `POSTGRES_`, `GITHUB_`, `AWS_` and `AZURE_` are in the same position (`DATABASE_URL`, `POSTGRES_URL`, `GITHUB_TOKEN` are all on that same blocklist).\n\nA wallet *export* token reads to me like the \"wallet private keys or other high-value secrets\" the elevated tier is described as protecting. Whether that means widening `SENSITIVE_KEY_PREFIXES`, or matching on exact keys rather than prefixes, is a policy call I don't think a test should make silently — so this PR asserts today's behaviour and leaves the question here. Happy to follow up either way.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KEA5B3A5CS7KXQ8FMW0D0Q\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T10:51:24.387Z\",\"completed_at\":\"2026-09-03T10:57:00.504Z\",\"skill_sha256\":\"2113430280ffe23a076b his head)\n\n- New `characters-search-pagination.pglite.test.ts` (real PGlite, 300 rows, 10 pages of 30 across all three branches): **fails pre-fix** 297/300 on every branch (exact issue transcript), **passes post-fix** 300/300 unique on all three.\n- Consumers (`route.ts`, `characters.ts` service) mock the repository or pass sort through; the tie-break only stabilizes previously-undefined within-tie order.\n- `biome check` clean on both files; `packages/cloud/shared` typecheck done.\n\nReviewed with Muse Code (Meta Muse Spark; exact model version not exposed in-session).45:Ta2b,"])</script><script>self.__next_f.push([1,"## Summary\n- route the personal Shared default model through the opt-in local OpenRouter-compatible mock so the upgrade trajectory records a real deterministic user/assistant transcript\n- expose the mock Dedicated runtime conversation surface at the canonical health-origin base, selecting the exact running sandbox by its non-serialized per-agent runtime token\n- keep connector delivery fixtures current with the required Blooio connector identity\n\nSupports #25076.\n\n## Regression protected\nDevelop Full run 33216110497 / Cloud stack job 99002198835 returned HTTP 200 for both Shared turns but persisted zero messages, so the Shared→Dedicated trajectory stopped before it exercised import/cutover. The Shared personal model is `gemma-4-31b`; without a direct Cerebras key it correctly resolves through OpenRouter, while the E2E fixture previously bound only OpenAI.\n\nAn unchanged local reproduction matched the hosted failure (`expected 4, received 0`). Enabling context echo alone stayed red. Binding the same loopback provider under the explicit OpenRouter fixture made all four turns persist and exposed a second mock contract mismatch: server-side cutover uses the Dedicated health origin, while the multiplexed test runtime only exposed sandbox-prefixed compat routes. The new exact-token root projection exercises that canonical contract without changing il** |\n| `MAX_REDIRECT_ALIASES_PER_CLIENT` 8 → 800 | **41 pass / 0 fail** |\n| `MAX_REDIRECT_URI_BYTES` ×100 | **41 pass / 0 fail** |\n| `CLAIM_NAME_RE` → unbounded length | **41 pass / 0 fail** |\n| `CLAIM_NAME_RE` → may start with a digit | **41 pass / 0 fail** |\n| `SHA256_HEX_RE` → any length | **41 pass / 0 fail** |\n| delete `\"auth_time\"` from `RESERVED_CLAIM_NAMES` | **41 pass / 0 fail** |\n\nThe last one is the one I'd most expect to be lost in a refactor. `auth_time` is neither in `OIDC_SUPPORTED_CLAIMS` nor emitted by the provider any more, so it reads as dead weight — and the comment directly above it exists to explain why it must stay (\"a fixed constant would assert one authentication instant for every user forever, which is the misrepresentation dropping the claim exists to avoid\"). A comment was the only thing holding it.\n\n# Why the alias limits looked covered but weren't\n\nThe suite has an oversize-overlay case. I assumed at first it was passing for the wrong reason and checked, because that changes what to write:\n\n```\noversize   THREW: OIDC_REDIRECT_URI_ALIASES exceeds its byte limit\n```\n\nIt does hit the right branch. The reason the ×1000 mutant survives is the assertion, not the fixture: the loop asserts `toThrow(/OIDC_REDIRECT_URI_ALIASES/)`, so with a larger limit the same input simply fails the *next* check down and still matches. The new cases assert the specific message per limit, which is what pins each bound to itself.\n\n# The change\n\nTest-only, one `describe` block:\n\n- **Secret hashes** — 63 and 65 characters and a non-hex 64 all rejected, with the valid 64 accepted alongside.\n- **Claim names** — both halves of `CLAIM_NAME_RE`, with the length asserted at its boundary (64 accepted, 65 rejected) rather than with an extreme, plus leading digit, leading underscore, and empty.\n- **`auth_time`** and a row for each of the five JWT envelope members (`nbf`, `jti`, `typ`, `scope`, `client_id`).\n- **TTL clamping** — above, below, at both limits, and the non-numeric default.\n- **Alias limits, one message each** — byte limit, 33 clients, 9 callbacks, oversized URI — plus an accepted-at-the-limit case (8 callbacks → 9 total redirect URIs), since a rejection is only meaningful against an accepted neighbour.\n\n# Evidence\n\n`bun test src/lib/oidc/clients.test.ts`: **52 pass / 0 fail** (was 41).\n\nEvery mutant in the table above now fails, **10/10 killed, was 0/10**, against a green control. Sibling OIDC suites unchanged: `claims` 55, `config` 21, `keys` 19. Biome clean, `tsc --noEmit` clean. No source file is touched.\n\n# One mutant I did not chase\n\nWidening `SHA256_HEX_RE` from `[0-9a-f]` to `[0-9a-fA-F]` survives, and it is unreachable rather than untested: `parseSecretHashes` runs `hash.trim().toLowerCase()` before the test, so no uppercase input can ever reach the regex. The length half of the same regex is genuinely load-bearing and is covered above.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KM183398BXXVQQPW4997MT\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T12:31:23.747Z\",\"completed_at\":\"2026-09-03T12:35:36.232Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba6 ing the fix\n\nRun 33726042851 at deployed SHA 3ce7195c8bf56d2dc37d94306115183af49b9fcc completed 22/22 direct and 22/22 gateway calls. Every staging gateway sample entered via ORD but executed at cf-placement=remote-FRA. Warm gateway p50/p95 regressed to 737.61/4123.02 ms while direct Cerebras was 89.86/284.13 ms. The standing cache read remained 3 ms p50; sequential middle/reserve/setup phases each rose to roughly 112-123 ms.\n\nProduction currently reports local-ORD, so removing Smart Placement preserves its observed caller-local execution while preventing the analyzer from moving this stateful mixed Worker remotely later. This PR does not deploy production; the normal production release remains gated by exact-SHA staging certification.\n\n## Verification\n\n- 21/21 focused tests across certification, auth probe, and Wrangler placement contract\n- Biome check on all changed scripts and tests\n- Wrangler staging dry-run\n- git diff --check\n- independent reviews incorporated: strict placement-header schema, parsed config invariant, shared documented local/remote colo validator\n\nAfter merge, deploy the exact SHA to staging and rerun the 44-call certification.\n\nOfficial platform guidance: https://developers.cloudflare.com/workers/configuration/placement/ and https://developers.cloudflare.com/durable-objects/reference/data-location/"])</script><script>self.__next_f.push([1,"48:T15d6,"])</script><script>self.__next_f.push([1,"# What\n\n`hetzner-fleet-routing-contract.mjs` cannot see a job that never opted in.\n\n```js\nif (\n  typeof node.value === \"string\" \u0026\u0026\n  (node.value.includes(\"HETZNER_FLEET_ONLINE\") ||\n    node.value.includes(\"hetzner-robot\"))\n) { routes.push(...) }\n```\n\nA job pinned to `[self-hosted, Linux, X64]` contains neither string, so it is never collected as a route, never counted, and never validated. **The audit checks the shape of selectors that already opted in; the absence of one is invisible to it.**\n\nThat is not hypothetical. #30379 had to hand-fix two provisioning-worker jobs hard-routed to the generic pool — and on the commit right before it, the audit was **16 pass, 0 fail**. Green on exactly the state being fixed.\n\nI proved the class stays invisible rather than asserting it. Temp repo root, two workflows — one canonical selector, one brand-new deploy job on a bare self-hosted list:\n\n```\nvalidateHetznerFleetRouting(root) -\u003e { files: 1, selectors: 1 }\n```\n\nNo failure, and the unguarded workflow is not even counted as a file. So the next new deploy workflow can reintroduce #30379's defect with the audit still green.\n\n# The change\n\n`collectUnguardedSelfHostedRoutes` walks the same document and fails any `jobs.\u003cid\u003e.runs-on` that is a **literal sequence of plain scalars** containing a `self-hosted` label:\n\n```\nbrand-new-deploy.yml:4 (jobs.deploy.runs-on): [self-hosted, Linux, X64] pins a\nself-hosted pool without the HETZNER_FLEET_ONLINE opt-in\n```\n\nScoping to a literal sequence is deliberate — it catches hand-pinned pools and leaves expression-valued routes to the existing selector checks, so `voice-live-e2e.yml`'s `vars`-overridable default and `prod-ops-runner.yml`'s `labels:` registration entry are untouched.\n\n# The exception it found, and why it is allowlisted rather than fixed\n\nRunning it against the real repo immediately surfaced a third case beyond #30379's two: `android-arm64-local-e2e.yml` routes a job to `[self-hosted, Linux, ARM64, android-device]`.\n\nThat one is legitimate. There is no GitHub-hosted runner with a physical handset attached, so failing it closed to `ubuntu-24.04` would not degrade — it would just break the lane. So there is a documented `PHYSICAL_DEVICE_LABELS` allowlist, **keyed on the hardware label rather than the workflow filename**, so the exception states its reason and does not silently cover a second unrelated job that happens to live in the same file later.\n\n# Verification\n\nValidator on develop:\n\n```\n elete any of the four `LOOPBACK_REDIRECT_ORIGINS` entries | **4 pass / 0 fail** |\n\nThe first one is the whole open-redirect guard for that function. Without it, `resolveSafeRedirectTarget(\"https://evil.example/steal\", \"https://app.eliza.ai\", \"/home\")` returns the attacker's URL, and the file's own header comment — \"a miss here lets an attacker bounce an authenticated user to a hostile site\" — describes exactly that.\n\n# The change\n\nTest-only, two `describe` blocks.\n\n**`resolveSafeRedirectTarget`** — same-origin accepted, then a table of seven refusals: a sibling host sharing a suffix (`evil-app.eliza.ai`), the same host on another scheme, the same host on another port, embedded credentials, a non-http scheme, a protocol-relative target, and an unparseable value. Plus the three empty inputs, and a relative path resolving against the base.\n\n**`resolveOAuthSuccessRedirectUrl`** — same-origin and allowlisted origins accepted; a refusal table covering an origin absent from the allowlist, an allowlisted host on another scheme, credentials smuggled onto an allowlisted origin, and a non-http scheme.\n\n**The `rejected` flag gets its own case.** Two branches return the fallback and only one is a refusal: `rejected` is what callers log on, so `null` in must stay `rejected: false` while a hostile absolute URL is `rejected: true`. Asserting only the `target` would let the flag be pinned to a constant — it survives the whole suite on `develop`.\n\n**The loopback wildcard is asserted in both directions.** `LOOPBACK_REDIRECT_ORIGINS` is expanded into `^http://localhost:.*$` by `isAllowedOrigin`, so the interesting case is not that `http://localhost:3000` is accepted but that `http://localhost.evil.example:3000` is **not**. Both loopback hosts are exercised on both schemes, so each of the four entries is individually named.\n\n# Evidence\n\n`bun test src/lib/security/redirect-validation.test.ts`: **23 pass / 0 fail** (was 4).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 4 / 0 | **23 / 0** |\n| `rST`: drop origin equality | survives | **4 failed** |\n| `rST`: drop the credentials check | survives | **1 failed** |\n| `rOSRU`: drop same-origin acceptance | survives | **1 failed** |\n| `rOSRU`: drop the scheme + credentials guard | survives | **1 failed** |\n| `rOSRU`: `rejected` always `false` | survives | **4 failed** |\n| drop `\"http://localhost:*\"` | survives | **1 failed** |\n| drop `\"http://127.0.0.1:*\"` | survives | **1 failed** |\n| drop `\"https://localhost:*\"` | survives | **1 failed** |\n| drop `\"https://127.0.0.1:*\"` | survives | **1 failed** |\n| `isSafeRelativeRedirectPath`: drop the `//` guard | 2 failed | **3 failed** |\n\n**11/11 killed, was 1/11.** Biome clean, `tsc --noEmit` clean. No source file is touched.\n\nWriting it caught one gap in my own first draft: the `https://127.0.0.1:*` entry still survived because the loopback case only used `https://localhost`. Running the deletion mutant per entry rather than on the array as a whole is what surfaced it.\n\n# One mutant I did not chase\n\nIn `resolveSafeRedirectTarget`, dropping `isHttpUrl(parsed)` on its own survives — and should. `new URL(\"javascript:alert(1)\").origin` is the string `\"null\"`, which can never equal a real `base.origin`, so the origin check already refuses every non-http scheme that parses. The two are not independent there. (In `isAllowedAbsoluteRedirectUrl` the scheme check is *not* redundant, because a `\"*\"` allowlist entry would otherwise accept anything — that path is covered by the existing test.)\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provi gate their `shouldRun` on it, and `preference-items.ts` does too. When it returns true, the turn goes to a structured-output model call whose results are written back into durable fact, relationship and identity memory.\n\nFive clauses. Four have no fixture:\n\n| mutant | `reflection-items.test.ts` | `preference-items.test.ts` |\n|---|---|---|\n| drop `options?.semanticSignal !== false` | 0 fail | 0 fail |\n| drop `message.content.text?.trim()` | 0 fail | 1 fail |\n| drop `message.entityId` | 0 fail | 0 fail |\n| drop `message.roomId` | 0 fail | 0 fail |\n| **drop `!isSyntheticConversationArtifactMemory(message)`** | **0 fail** | **0 fail** |\n\nCoverage is thin in aggregate as well: inverting the whole predicate fails **one** test, in `preference-items.test.ts`. `reflection-items.test.ts` — the suite for the file that defines the gate and for the three evaluators that consult it — does not notice at all.\n\nThe synthetic-artifact clause is the one I would least like to be free. It is what stops the runtime's own compaction records and conversation summaries from being mined as though a participant had said them, and the results of that mining are durable: facts, relationship edges and identity claims persisted back into memory. Deleting that clause today changes no test anywhere.\n\n# The change\n\nTests only, appended to the existing suite. One case per clause, plus the parts of the contract that are easy to break by accident:\n\n- an ordinary turn is admitted;\n- `semanticSignal: false` refuses, while `true` and an absent option both admit — the clause is `!== false`, not `=== true`, so \"no opinion\" means allowed;\n- empty text, whitespace-only text and absent `content.text` all refuse;\n- a turn with no author refuses; a turn with no room refuses;\n- synthetic artifacts refuse, asserted once per detection input, since `isSyntheticConversationArtifactMemory` has three independent ones: `metadata.source`, `metadata.tags`, and the text marker;\n- and the wiring: es `cache.test.ts` green on `develop`:\n\n| mutant | result |\n|---|---|\n| `TEXT_PRICING_FRESH_TTL_MS` 60s → 59s | **21 pass / 0 fail** |\n| `TEXT_PRICING_FRESH_TTL_MS` 60s → 120s | **21 pass / 0 fail** |\n| `TEXT_PRICING_HARD_TTL_SECONDS` 15m → 14m | **21 pass / 0 fail** |\n| `TEXT_PRICING_HARD_TTL_SECONDS` 15m → 60m | **21 pass / 0 fail** |\n| `ageMs \u003e= HARD` → `ageMs \u003e HARD` | **21 pass / 0 fail** |\n| `stale: ageMs \u003e= FRESH` → `\u003e FRESH` | **21 pass / 0 fail** |\n\nQuadrupling the hard TTL is a free change today. That band is how long a rate may be served after it stopped being refreshed, so widening it silently extends the window in which a caller is billed at a superseded price — the comment above `PERSISTED_PRICING_CACHE_TTL_MS` in this same file shows the team already reasons about exactly that trade-off.\n\n# The change\n\nTests only, appended to the existing suite. Both boundaries asserted from both sides, one millisecond apart, entirely through the public API — no reaching into module state:\n\n- **fresh boundary, by loader invocation** — at 59 999 ms the cached rates are returned and the loader is never called; at 60 000 ms the loader runs.\n- **fresh boundary, by background hydration** — through the worker (`cacheOnly`) path: a fresh read schedules nothing on `executionCtx.waitUntil`, a stale read schedules exactly one hydration.\n- **hard boundary, by the billed value itself** — seed the cache with one set of rates, then read at 899 999 ms and 900 000 ms with a loader that returns *different* rates. Inside the bound the old rates are served from cache; at the bound the entry is gone and the new rates come back. Only a reload can produce the new value, so the boundary is observable in the number the caller is billed at rather than in an internal flag.\n\nTime is controlled with `spyOn(Date, \"now\")`, and each age uses its own cache key — my first probe reused one key and the age-899 999 read re-cached the entry, which made the next pected.scope` | 18 pass / 0 fail |\n| drop `actual.roomId === expected.roomId` | 18 pass / 0 fail |\n| drop `actual.entityId === expected.entityId` | 18 pass / 0 fail |\n| drop `actual.scopedToEntityId === …` | 18 pass / 0 fail |\n| drop `actual.addedBy === …` | 18 pass / 0 fail |\n| drop `actual.revision === …` | 18 pass / 0 fail |\n| drop `actual.ingestionAttemptId === …` | 18 pass / 0 fail |\n| drop the `directGrantEntityIds` compare | 17 pass / 1 fail |\n| drop `actual.ingestionState === …` | 17 pass / 1 fail |\n\nThe whole predicate is covered by a single assertion with two denial cases, which are exactly the two clauses that die. `actual.revision` — the field a compare-and-swap exists to compare — is among the eight with no detector at all.\n\nCoverage is thin in aggregate too, not just per clause. Inverting the entire predicate fails **one** test in `document-list-query.test.ts` and **zero** in `inMemoryAdapter.test.ts` and `inMemoryAdapter.access-context.test.ts`, so the adapter's conflict path never observes it.\n\n# The change\n\nTests only. One fixture carrying every compared field, a snapshot taken from it, and one case per field that perturbs exactly that field:\n\n- the row stops reading as a document snapshot at all (`roomId` no longer a UUID);\n- scope, room, owning entity;\n- a direct grant added; the private-scope target; the recorded author;\n- the revision advanced;\n- a different ingestion attempt owns the row; the ingestion state advanced.\n\nPlus one property the type signature does not carry: `uuidArraysEqual` compares **index-wise**, so a reordered direct-grant list is a divergence. Rewriting it to set membership (`normalizedRight.includes(value)`) looks like a harmless simplification and now fails.\n\n# Evidence\n\n`bunx vitest run src/database/document-list-query.test.ts` → **30 passed** (was 18).\n\nSame battery, after:\n\n| mutant | before | after |\n|---|---|---|\n| drop `actual !== null` | 0 fail | **1 fail** |\n| drop `scope` | 0 fail sh([1,"51:T1cf3,"])</script><script>self.__next_f.push([1,"# What\n\n`launcher-curation.ts:99` states an invariant outright: `LAUNCHER_AOSP_ONLY_VIEW_IDS` is sourced from the canonical navigation list *\"so this launcher gate and the router-level `NATIVE_OS_VIEW_IDS` filter never drift.\"*\n\nOne direction of that claim was untested — and it is the direction with the worse failure mode.\n\n```\n$ grep -rln NATIVE_OS_VIEW_IDS packages/ | grep -E 'test|spec'\n(no matches)\n```\n\n`components/pages/launcher-curation.test.ts` is 931 lines and covers the launcher half properly. I checked that by mutation rather than by grep, and it holds up: deleting any of `phone`, `messages`, `contacts`, `camera`, or dropping `\"files\"` from the launcher list, each fails 3–4 tests. So this is **not** a zero-coverage file, and most of what a naive \"name every entry\" test would add is already there.\n\nThe gap is one specific mutation:\n\n| mutant | before |\n|---|---|\n| add `\"files\"` to `NATIVE_OS_VIEW_IDS` | **61 / 61 green — survives** |\n\n# Why that one matters\n\n`NATIVE_OS_VIEW_IDS` is a **router-level** filter, not a listing. `App.tsx:1668`:\n\n```ts\nif (\n  nativeOsSurfaceEnabled \u0026\u0026\n  (NATIVE_OS_VIEW_IDS as readonly string[]).includes(resolveBuiltinTabId(tab))\n) {\n  const nativeRegistration = listAppShellPages().find(/* … */);\n```\n\nMembership routes a tab through the plugin-owned native-OS renderer, with a legacy renderer as fallback. So it is a claim about *how a surface renders*, not where it appears.\n\n`files` is deliberately on the launcher list but **not** in that filter — per the docstring, `/apps/files` \"stays routable everywhere but is only surfaced as a launcher tile on the fork.\" Adding it to `NATIVE_OS_VIEW_IDS` sends `/apps/files` down the native-OS renderer path wherever that surface is enabled, while every launcher assertion stays green: `LAUNCHER_AOSP_ONLY_VIEW_IDS` still contains `files`, so the launcher tests cannot see the change at all.\n\nThat is the drift the existing tests structurally cannot catch — the launcher list is *derived from* the filter, so widening the filter widens the launcher list consistently and silently.\n\n# The change\n\nTest-only, +91 lines to the existing `navigation/index.test.ts`. No source change.\n\n- **`NATIVE_OS_VIEW_IDS` named exactly**, and `LAUNCHER_AOSP_ONLY_VIEW_IDS` asserted as `[...NATIVE_OS_VIEW_IDS, \"files\"]` — which pins the append position, not just the membership.\n- **The tail pinned by subtraction**, so a genuinely new native-OS surface needs no edit here, while promoting a launcher-only view into the router filter still fails:\n\n  ```ts\n  const nativeOs = new Set\u003cstring\u003e(NATIVE_OS_VIEW_IDS);\n  expect(LAUNCHER_AOSP_ONLY_VIEW_IDS.filter((id) =\u003e !nativeOs.has(id))).toEqual([\"files\"]);\n  expect(nativeOs.has(\"files\")).toBe(false);\n  ```\n\n- **The reason for the asymmetry, made concrete.** The native-OS surfaces are root-path shells; Files is an `/apps/` view:\n\n  ```ts\n  expect(NATIVE_OS_VIEW_IDS.map((id) =\u003e pathForTab(id)))\n    .toEqual([\"/phone\", \"/messages\", \"/contacts\", \"/camera\"]);\n  expect(pathForTab(\"files\")).toBe(\"/apps/files\");\n  ```\n\n  This is the assertion that explains *why* the two lists differ, rather than just recording that they do.\n\n- **No duplicates in either list** — the surviving mutant produces one, and it is worth failing on its own terms.\n- **An `it.each` proving no gated id is dead**: each is in `BUILTIN_ROUTE_IDS` and its `TAB_PATHS` entry agrees with `pathForTab`. Paired with an explicit arity assertion, because a generated table over an empty list registers zero cases and reports green.\n\n# Evidence\n\nEvery mutant executed at `f4ed4b8427`, one at a time, across **both** suites (`navigation/index.test.ts` + `launcher-curation.test.ts`). **9 of 9 die**, up from 8 of 9.\n\n| mutant | before | after |\n|---|---|---|\n| add `\"files\"` to `NATIVE_OS_VIEW_IDS` | 61/61 green — **survived** | **5 failed** |\n| delete `phone` | 4 failed | 7 failed |\n| delete `messages` | 4 failed | 7 failed |\n| delete `contacts` | 4 failed | 7 failed |\n| delete `camera` | 3 failed | 6 failed |\n| drop `\"files\"` from the launcher list | 3 failed | 6 failed |\n| put `\"files\"` first instead of last | not covered | 3 failed |\n| swap `phone`/`messages` order | not covered | 4 failed |\n| add `\"settings\"` to `NATIVE_OS_VIEW_IDS` | not covered | 12 failed |\n\nControl: **72 passed** across both files.\n\n**Suites:** `src/navigation/` → **38 passed** (`index.test.ts` 34, up from 23). `launcher-curation.test.ts` → **38 passed**, unchanged.\n\n`bun run --cwd packages/ui typecheck` → exit **0**. Biome on the changed file → clean first try, no `--write` needed. `git status --porcelain` confirms the diff is this one file.\n\n# What I deliberately did not do\n\nI did not add \"name every entry\" coverage for its own sake — the launcher suite already kills those mutants, and duplicating them here would be lines without leverage. The four order/duplicate/dead-id assertions are included because each kills a mutant nothing else caught; the exact-contents assertion is included because it is the only one that fails on a silent *addition*.\n\nI also did not touch `launcher-curation.test.ts`. Its half of the invariant is covered, and the router half belongs next to the constants it constrains.\n\nNo source change: `files` is correctly excluded from the filter today. This pins that decision before a refactor treats the two lists as interchangeable.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"m cess — is what supplies it:\n\n```ts\nfor (const [key, value] of Object.entries(processEnv)) {\n  if (devCloudAuthority \u0026\u0026 isDevCloudOwnedSkillEnvKey(key)) continue;   // ← this\n  if (value !== undefined \u0026\u0026 isInheritableSkillEnvKey(key)) result[key] = value;\n}\n```\n\nDeleting that `continue` leaves the suite at **13 pass / 0 fail**. So does removing the `.toUpperCase()` from `isDevCloudOwnedSkillEnvKey`.\n\n# Why it isn't redundant, which is the interesting part\n\nMy first instinct was that the skip is dead weight: the resolver loop underneath rewrites each of those keys anyway. I ran both variants across all five authorities to check rather than assume, and for the canonical spellings that is exactly right — identical output, every time:\n\n```\n                    ORIGINAL                          MUTANT\nstaging-default     API_KEY=\"\"                        API_KEY=\"\"\nstaging-explicit    API_KEY=\"AMBIENT-KEY\"             API_KEY=\"AMBIENT-KEY\"\nproduction          API_KEY=\"AMBIENT-KEY\"             API_KEY=\"AMBIENT-KEY\"\noffline             API_KEY=\"\"                        API_KEY=\"\"\nself-hosted         API_KEY=\"AMBIENT-KEY\"             API_KEY=\"AMBIENT-KEY\"\n```\n\nIt stops being redundant when the ambient variable is spelled in a different case. `isDevCloudOwnedSkillEnvKey` and `isInheritableSkillEnvKey` both uppercase before matching, but the resolver loop writes the **canonical** name — so an off-case ambient entry is inherited and never overwritten:\n\n```\nambient spelling          ORIGINAL                          MUTANT\nELIZAOS_CLOUD_API_KEY     [[\"ELIZAOS_CLOUD_API_KEY\",\"\"]]    [[\"ELIZAOS_CLOUD_API_KEY\",\"\"]]\nelizaos_cloud_api_key     [[\"ELIZAOS_CLOUD_API_KEY\",\"\"]]    [[\"elizaos_cloud_api_key\",\"AMBIENT-KEY\"],\n                                                             [\"ELIZAOS_CLOUD_API_KEY\",\"\"]]\nElizaos_Cloud_Api_Key     [[\"ELIZAOS_CLOUD_API_KEY\",\"\"]]    [[\"Elizaos_Cloud_Api_Key\",\"AMBIENT-KEY\"],\n                                                             [\"ELIZAOS_CLOUD_API_KEY\",\"\"]]\n```\n\nUnder `staging-default` — the authority whose whole point is that Cloud is deactivated — the child would get two variables: the neutralised canonical one, and the live credential under the ambient spelling. This is the same POSIX hazard the file already names and defends against on the *overlay* path (\"POSIX treats `GEMINI_API_KEY` and `Gemini_Api_Key` as two variables\"); the inherit path relies on this skip instead, and nothing held it there.\n\n# The change\n\nTest-only, one `describe` block:\n\n- **`staging-default` and `offline` deactivate rather than inherit** — both keys `\"\"`, and the ambient value appears nowhere in the result.\n- **`staging-explicit`, `production`, `self-hosted` pass the authority's value through** — so the block can't be satisfied by simply dropping everything.\n- **Two off-case spellings are refused**, asserting no key at all carries the ambient value rather than just checking the canonical name.\n- **No `ELIZA_DEV_SOURCE` means no authority** — the switch itself, or every non-dev deployment silently loses its cloud identity.\n\n# Evidence\n\n`bunx vitest run src/security/skill-execution-env.test.ts`: **21 passed** (was 13).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 13 / 0 | **21 / 0** |\n| drop the inherit-loop `continue` | **survives** | **2 failed** |\n| `isDevCloudOwnedSkillEnvKey` without `.toUpperCase()` | **survives** | **2 failed** |\n| drop the dev-cloud skip on the overlay loop | 4 failed | **4 failed** |\n| drop `\"ELIZA_CLOUD_URL\"` from the owned set | 2 failed | **4 failed** |\n| drop the authority resolver loop entirely | 4 failed | **11 failed** |\n\n**5/5 killed, was 3/5**, and the two that already died now die harder. Sibling suites in the same directory unchanged (35 passed). Biome clean, `tsc --noEmit` clean. No source file is touched.\n\n# Screened and not filed\n\nThe rest of this file is well covered: admitting a fleet-scoped key (`DATABASE_URL`) to the allowlist, dropping the case-fold in `isInheritableSkillEnvKey`, removing the overlay case-collision dedupe, and removing the empty-`PATH` refusal each already fail the existing suite. The dev-cloud exclusion was the one guard in it with nothing behind it.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KHR19QTHH579NZF8J1WNJW\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T11:51:24.727Z\",\"completed_at\":\"2026-09-03T11:55:59.704Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T11:51:25.333Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"45e889796da109bdcafc7dba45e2e0e29e7290729bf3e7e10aeced6be14a3429\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"5b2d8235-615 prefix-reached paths kept separate so the two arms of `isPublicTokenApiPath` stay distinguishable, plus five negatives — including `/api/v1/voice-models/catalog/private` and `/api/v1/chat/completions/admin`, the \"one segment further out\" siblings.\n\n**The catalog preflight's method normalisation.** `Access-Control-Request-Method` is caller-supplied and the gate uppercases it before comparing. The existing preflight cases send `\"GET\"` and `\"HEAD\"` verbatim, so removing that step costs nothing — and the consequence is precise: the request falls through to the general public policy, and the catalog preflight advertises `GET,POST,PUT,PATCH,DELETE,OPTIONS`, exactly what the comment above `readOnlyPublicCors` says must never be advertised or primed in the browser cache.\n\n# Two things I checked rather than assumed\n\n**I did not duplicate what was already there.** My first draft added a plain GET/HEAD preflight table for the catalog paths; the suite already has one (`\"allows only GET/HEAD preflight for both public subscription catalog paths\"`). Dropped it — the normalisation rows are the only new coverage there.\n\n**The `.trim()` in that gate is unreachable, and the test says so.** `requestedMethod?.trim().toUpperCase()` — removing only the `.trim()` leaves my suite green, which looked like a gap in my own test until I checked why:\n\n```\nnew Headers({ \"Access-Control-Request-Method\": \"  head  \" }).get(...)  →  \"head\"\nnew Request(url, { headers: { ... \"  get  \" } }).headers.get(...)      →  \"get\"\n```\n\nThe Headers API strips surrounding whitespace before the middleware ever reads the value, so that call cannot be reached through a request. The padded row is still there because it pins the observable behaviour, and the comment states plainly that it does not cover the `.trim()` line.\n\n# Evidence\n\n`bun test src/lib/cors/cloud-api-hono-cors.test.ts`: **52 pass / 0 fail** (was 27).\n\n| mutant | before | after |\n|---|---|---|\n| control (unmutated) | 27 / 0 | **52 / 0** |\n| delete each of the nine unnamed path entries | **all survive** | **killed, each** |\n| drop `.toUpperCase()` on the requested method | survives | **3 failed** |\n| drop the prefix arm of `isPublicTokenApiPath` | 4 failed | **4 failed** |\n| drop `.trim()` only | survives | survives — *unreachable, explained above* |\n\n**10/10 reachable mutants killed, was 1/10.** Biome clean, `tsc --noEmit` clean. No source file is touched.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KKETN1V0ZA6TYZMBYM4R8W\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T12:21:20.161Z\",\"completed_at\":\"2026-09-03T12:25:33.134Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T12:21:20.839Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"ef5871798301f4f656e2bd8ca6f079f1e5e8aa5b59b0cfad
