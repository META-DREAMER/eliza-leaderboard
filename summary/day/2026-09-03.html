nly API-key-to-browser-session bridge. It is a **ten-clause fail-closed disjunction**: the user row, its organization, and the Steward projection must all still agree with the signed binding, or the session is refused.\n\n```ts\nif (\n  !user || !user.is_active || user.is_anonymous || user.deleted_at !== null ||\n  (user.expires_at !== null \u0026\u0026 user.expires_at.getTime() \u003c= now.getTime()) ||\n  user.organization_id !== input.binding.organizationId ||\n  !user.organization || !user.organization.is_active ||\n  user.organization.id !== input.binding.organizationId ||\n  user.steward_user_id.trim() !== input.stewardUserId\n) return null;\n```\n\nEach clause is a separate way for a revoked, expired, deactivated or re-homed subject to keep a live browser session. Nothing covered any of them.\n\n# The change\n\nOne new file, 12 tests, **no mocks**. The real repository query runs against in-process PGlite with the **production Drizzle DDL** applied by `pushSchemaToTestDb`.\n\nMocks were the wrong tool here: `findWithOrganizationForWrite` uses drizzle's relational `with: { organization: true }`, so a hand-rolled minimal DDL would not match what the query actually selects. Pushing the real `users` and `organizations` definitions costs nothing and exercises the genuine join. A trailing loud guard fails the suite if PGlite never initializes, so the database cases cannot pass vacuously.\n\nEach clause is asserted on its own, plus:\n\n- **the expiry boundary in both directions** — `\u003c= now` means an expiry landing exactly on `now` is already spent, so `now`, `now+1ms` and `now-1ms` are all pinned, and a null expiry is checked against the year 2999;\n- **the `.trim()` on the stored Steward id** — a padded stored value matches its unpadded counterpart, while a padded *supplied* value does not (only the stored side is trimmed);\n- **`now` defaulting to the current time** when the caller omits it;\n- the deactivated-organization case **reactivates that same organization and re-runs**, so the rejection is attributable to `organization.is_active` alone rather than to anything else about the fixture.\n\n# Evidence\n\nTwelve clause mutants, **nine killed**:\n\n| mutant | result |\n|---|---|\n| drop `!user` | killed |\n| drop `!user.is_active` | killed |\n| drop `user.is_anonymous` | killed |\n| drop `user.deleted_at !== null` | killed |\n| drop the whole `expires_at` clause | killed (2 tests) |\n| weaken the boundary `\u003c=` → `\u003c` | killed |\n| drop `!user.organization.is_active` | killed |\n| drop the Steward id comparison | killed |\n| drop `.trim()` on the stored Steward id | killed |\n\nRuns: 12 pass / 0 fail. `src/lib/auth/` under `--isolate`: **190 tests across 21 files, 0 fail**. `bun run --cwd packages/cloud/shared typecheck` clean, `biome check` clean.\n\n# The three survivors are redundant by construction, not untested\n\nThree mutants survive, and I want to be explicit that I chased them rather than papering over them:\n\n- `user.organization_id !== binding.organizationId`\n- `!user.organization`\n- `user.organization.id !== binding.organizationId`\n\nDropping any **one** survives; dropping any **pair** is killed (verified for the first+third and first+second). They are mutually redundant, and the reason is the foreign key:\n\n- `organization_id` references `organizations.id`, so whenever the relation resolves, `user.organization.id` **is** `user.organization_id` — the first and third clauses cannot disagree;\n- inserting a user with a dangling `organization_id` is rejected by the database (I tried it), so `!user.organization` is reachable only when the column is `NULL` — and then the first clause has already fired.\n\nSo no test can isolate any one of these three; that is a property of the code and the schema, not a gap in the suite. **I did not write tests to chase them, and I am not proposing to delete any of them** — on a fail-closed auth gate the redundancy is cheap, and `!user.organization` additionally guards the `user.organization.id` dereference on the next line, which would otherwise throw on a null-organization user instead of returning `null`.\n\nIf you would rather have the redundancy documented in the source than rediscovered, a one-line comment on those three clauses would be the place; I left the code untouched since this is a test-only PR.\n\n# Scope\n\nTest-only; no production file is modified. Independent of #30462, which covers the *configuration* half of the same module in a separate file — no overlap and no conflict.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MJQ9TS1QA0N70GEMM4CMHC\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T21:27:43.705Z\",\"completed_at\":\"2026-09-03T21:28:30.001Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T21:27:44.506Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count g to the caller.\n\n# The fix\n\nAdd the `await`, mirroring `getTweetWhere`. Behaviour is unchanged for synchronous predicates.\n\nReverting only that keyword, with the new tests in place, fails exactly three:\n\n```\n× awaits an ASYNC predicate instead of keeping everything\n× honours an async predicate that rejects everything\n× propagates a rejected predicate rather than dropping the tweet\n\nTests  3 failed | 19 passed\n```\n\n# Tests\n\n`tweets-query.test.ts`, 23 tests, no network — every case drives an in-memory async iterable. None of these functions had any.\n\n**`nextTimelinePageCursor`** is the guard that stops a repeating provider cursor from looping forever. Covered: a terminal `undefined` and a terminal `\"\"` (falsy, so it must not be recorded and then re-reported as a repeat on the next page); an immediate repeat; and the **A → B → A cycle**, which a naive \"same as last cursor\" check would miss and which loops just as permanently. Also that the error carries `source` and `pageCount` for diagnosis, and that two concurrent runs stay independent through their own `Set`.\n\n**The query helpers**: partial-object matching across multiple keys, sync predicates, async predicates, empty-array vs `null` on no match, stream order preserved, and that `getTweetWhere` **stops consuming the stream** once it has a match (asserted by counting what the generator produced, not by inspecting the result).\n\nTwo behaviours pinned as decisions rather than accidents:\n\n- **`checkTweetMatches` compares strictly.** `\"0\" == 0` is true, so a `==` would let a numeric id from a caller match a string id from the API and silently widen the filter.\n- **An empty query object matches everything**, because `Object.keys({}).every(...)` is vacuously true.\n\n# Mutation testing: 12 mutants, 11 killed\n\nKilled: the `await` removed (and separately removed from `getTweetWhere`), the terminal-cursor guard removed and narrowed to `undefined`-only, the repeat guard removed, the cursor recorded before the guard rather than after, `pageCount` dropped from the error context, `every` → `some`, `===` → `==`, `null` → `undefined` on no match, and `getTweetWhere` collecting all matches instead of returning at the first.\n\n**One survivor, and it is provably equivalent.** Re-adding the refused cursor to `seenCursors` before throwing cannot be detected: the only way to reach that throw is for the cursor to *already* be in the Set, so the add is a no-op. No test can distinguish it.\n\n# Recorded, not changed\n\n`getLatestTweet(user, includeRetweets, max, auth)` passes the flag straight through as `{ isRetweet: includeRetweets }`. So `includeRetweets: true` selects **only retweets** rather than \"retweets as well\", and the `max === 1` shortcut returns the first tweet ignoring the flag entirely. That reads like a naming/semantics mismatch, but changing it would alter what existing callers get back — your call, not mine, so I left it alone and didn't write a test that would freeze it either way.\n\n# Evidence\n\n```\nbunx vitest run src/client/tweets-query.test.ts   → 23 pass\nbunx vitest run src/                              → 426 pass, 13 skipped across 43 files\nbunx tsc --noEmit                                 → clean\nbunx @biomejs/biome check                         → clean\n```\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MT089DNJYKBYGCQEXBN9BD\",\"projec me`), and the outcome is a guaranteed 401 either way.\n\nI found these while reviewing #30383 and named them there as the follow-up; this is that follow-up.\n\n# The change\n\nThe same remedy, deliberately not a variation on it: a small `MiddlewareHandler` ahead of the limiter on each route. The existing in-handler check stays — it still narrows `authHeader` for TypeScript, exactly as in the merged `user/me` fix.\n\nEach guard returns that route's **existing** 401 body verbatim (`success: false` + `error` + `code: \"UNAUTHORIZED\"`), so no response shape changes.\n\n# Why this costs no protection\n\nWorth stating on the guard itself rather than leaving the reviewer to check: `bootstrap-app.ts` mounts a global per-IP backstop on `\"*\"` at 600 req/min, explicitly *\"Registered before authMiddleware so unauthenticated routes are covered too.\"* A credential-less flood still meets a limiter before route dispatch. This removes a **distributed hop**, not a protection — which is the comment I put above each guard.\n\n# Mutation matrix\n\nSix mutants, each applied and reverted independently against the two new test files:\n\n| mutant | result |\n| --- | --- |\n| remove the guard — `identity-link/start` | **1 fail** — `missing Authorization returns 401 without consulting the distributed limiter` |\n| remove the guard — `user/phone` | **1 fail** — same test on that route |\n| move the guard *after* the limiter — `identity-link/start` | **1 fail** — same test |\n| move the guard *after* the limiter — `user/phone` | **1 fail** — same test |\n| remove `rateLimit` entirely — `identity-link/start` | **1 fail** — `an authenticated-shaped request still traverses the strict limiter` |\n| remove `rateLimit` entirely — `user/phone` | **1 fail** — the standard-limiter equivalent |\n\nEach kills exactly one test. The order-swap rows are the point: the pair pins **ordering in both directions**, not a status code. The last two rows stop the fix from quietly becoming \"no limiter at all\". der rather than by eyeball. The second one is a **cross-file** check: it ties `health-oauth.ts`'s branches to `health-provider-registry.ts`'s `capabilities` and `defaultScopes` lists, so registry drift in either direction fails the suite.\n\nAlso pinned: empty scopes derive nothing; unrecognised scopes derive nothing; adding a scope never *removes* a capability; results are deduplicated; and both accessors return copies rather than the shared registry arrays (a caller that sorts or splices the result must not mutate every later connector's spec).\n\n# Scope matching must stay exact\n\n```ts\nconst set = new Set(scopes);\n...\nif (set.has(\"activity:read\") || set.has(\"activity:read_all\")) { ... }\n```\n\nA refactor to `startsWith` or `includes` would let `activity:read_all_admin` or `daily-summary` unlock real health data. There's a test that feeds each provider its own scopes mangled three ways — `${scope}_extra`, `x-${scope}`, and uppercased — and requires an empty result.\n\n# One thing I looked at and deliberately did NOT change\n\nWithings maps **two** scopes to `health.sleep.read`:\n\n```ts\nif (set.has(\"user.activity\")) {\n  capabilities.push(\"health.activity.read\", \"health.sleep.read\");\n}\nif (set.has(\"user.sleepevents\")) capabilities.push(\"health.sleep.read\");\n```\n\nThat asymmetry looked like a possible over-grant, so I traced the sleep sync to `withingsPost(args.token, \"/v2/sleep\", …)` in `health-connectors.ts:1019`. **I could not determine from inside this repository which Withings scope that endpoint actually requires** — the vendor's docs are the authority and I can't verify them from here.\n\nChanging scope semantics on a guess would be the wrong move, so I pinned both mappings exactly as they stand and am flagging the question instead. If `user.activity` alone genuinely covers Withings sleep, this is correct as written and the test documents it. If it doesn't, the fix is one line plus one assertion. **Your call — you have the vendor context I don't.**\n\n# Mutation testing: 15 mutants, 14 killed\n\nSpanning both `health-oauth.ts` and `health-provider-registry.ts`:\n\n| mutant | result |\n|---|---|\n| strava requires *both* activity scopes instead of either | killed |\n| strava grants on the identity-only `read` scope | killed |\n| oura `daily` drops readiness | killed |\n| oura vitals requires both `heartrate` **and** `spo2` | killed |\n| oura `personal` maps to vitals instead of body | killed |\n| fitbit `activity` loses workouts | killed |\n| fitbit `weight` maps to vitals instead of body | killed |\n| withings `user.activity` loses sleep | killed |\n| withings `user.metrics` loses vitals | killed |\n| accessors return the registry array by reference | killed (×2) |\n| scope matching by prefix | killed |\n| registry: fitbit declares an extra capability | killed |\n| registry: fitbit drops its `sleep` default scope | killed |\n| oura `new Set(...)` dedup removed | **survived — redundant** |\n\n**The dedup survivor is genuine redundancy, not a coverage hole**, and I checked rather than assumed: oura's four push sites are guarded by mutually exclusive conditions pushing distinct capabilities, so no input can produce a duplicate. Same for the fitbit and withings branches. I'd **keep** them — they cost nothing and become load-bearing the moment a scope is added that overlaps an existing one. No test can kill them, and writing one would mean asserting an unreachable state.\n\n# Evidence\n\n```\nbunx vitest run test/health-oauth-scopes.test.ts   → 40 pass\nbunx vitest run test/ src/health-bridge/           → 75 pass, 4 skipped across 13 files\nbunx tsc --noEmit                                  → clean\nbunx @biomejs/biome check                          → clean\n```\n\nTests only — `git diff` touches no source file.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribut ript><script>self.__next_f.push([1,"33:T186e,"])</script><script>self.__next_f.push([1,"# What\n\nThree untested things in `inference-admission-gate.ts` decide how much money moves:\n\n- **`collectedInferenceCost`** — how much a finished request actually cost, given the lease estimate and an optional reconciliation;\n- **`inferenceSettlementAmounts`** — the split between what a real credit balance backed and what the gate consumed conservatively;\n- **`isInferenceAdmissionDispatchMarkError`** — whether a failure settles at **zero** because the Durable Object may already have committed the dispatch intent.\n\nThe file has no sibling test. Each of these has several branches that differ only in which of `actual`, `estimatedCostUsd`, `collectedAmount` and `reservedAmount` wins, so a single representative case would leave most of them free to change silently.\n\n# The change\n\nOne new file, 20 tests, **no mocks** — this surface is pure and reaches no database, cache or Durable Object.\n\nBranches asserted on their own:\n\n- **the estimate is a floor, never a ceiling** — the gate already consumed it, so an under-run cannot refund it (checked below, above and exactly at the estimate);\n- **the uncollected-overage path keeps that same floor** rather than trusting the debit;\n- **a reported `collectedAmount` wins** over both the estimate and the actual;\n- **`collectedAmount` of exactly `0` is honoured, not treated as absent** — the code tests `!== undefined` rather than truthiness, and a zero-collection replay must not fall through to the estimate;\n- **the reconciled-but-uncollected path is *not* floored by the estimate**, which is the one asymmetry in the function and is now pinned;\n- **the uncollected overage caps the balance-backed half at `reservedAmount`**, and clamps rather than inflates when the reservation exceeds what was consumed;\n- an invariant sweep over all six shapes: **balance-backed never exceeds gate-consumed**;\n- `finiteNonNegative` rejecting `NaN`, `Infinity` and negatives for both `actualCostUsd` and `collectedAmount`, while allowing a legitimate `0`.\n\nFor the cause walker: direct match, one- and two-deep `cause` chains, **the base `InferenceAdmissionGateUnavailableError` deliberately *not* matching** its subclass (otherwise every gate outage would settle as zero), non-errors, the depth limit at exactly 11 versus 12 hops, and a cyclic chain.\n\n# Evidence\n\nMutation-tested — **6 of 7 killed**:\n\n| mutant | result |\n|---|---|\n| no-reconciliation floor: `Math.max(actual, estimate)` → `actual` | killed (2) |\n| uncollected-overage floor: `Math.max` → `actual` | killed (2) |\n| `collectedAmount !== undefined` → truthiness | killed (2) |\n| settlement cap: `Math.min` → `Math.max` on `reservedAmount` | killed (3) |\n| `finiteNonNegative` stops rejecting negatives | killed (2) |\n| cause-walk depth `12` → `4` | killed |\n| **remove the cycle guard (`seen` set)** | **survived** |\n\nRuns: 20 pass / 0 fail. All `*inference-admission*` suites under `--isolate`: **232 tests across 21 files, 0 fail**. `bun run --cwd packages/cloud/shared typecheck` clean; `biome check` clean.\n\n# The one survivor, and why I did not write a test for it\n\nRemoving the `seen` set from `isInferenceAdmissionDispatchMarkError` changes no observable behaviour: the `depth \u003c 12` bound already terminates the walk, so a cyclic `cause` chain returns `false` either way and never hangs. The cycle guard is defence in depth against a future edit that raises or removes that bound — not an untested branch.\n\nSo there is nothing a test could assert that the depth limit does not already guarantee, and I would **keep the guard**: it is the thing that stays correct if the depth limit ever changes. Flagging it here so the survivor is not mistaken for a coverage hole later.\n\n# Scope\n\nTest-only; no production file is modified.\n\nSeparately, while sweeping for the fail-open pattern from #30469 I checked the other unguarded date comparisons in this package and they are all safe — `sql-membership.ts` validates `validUntil` with `Number.isFinite` on every write path, `container-stop-job-service.ts` requires a canonical ISO round-trip, and the `expires_at` comparisons all read a database `timestamp` column. No further fix is needed there; recording it so the ground stays covered.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MKQQHFAPDSWYFS9ABXZRF8\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T21:45:26.319Z\",\"completed_at\":\"2026-09-03T21:46:17.049Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T21:45:26.978Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"b8fd717e19af22036ed06898b8bbcf8b7bdd0ff149cf3d51c7a567542ece724c\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"4f7996bd-ff37-4638-bbae- ondition on its own. Highlights:\n\n- **scheme is an allowlist, not a `javascript:` denylist** — `http:`, `ftp:` and `data:` are all rejected, not just the obvious one;\n- **credentials in three shapes** — `user@`, `user:pass@`, and `:pass@`;\n- **a fragment is rejected**, and an empty `#` is not — a fragment never reaches the server, so anything depending on it is outside whatever the signature covers;\n- **an unparseable URL is a negotiation failure**, matching the `error-policy:J3` comment already in the source;\n- a `secret` block routes to `sensitive-request` **across two different profiles**, so the guarantee is shown to be profile-independent rather than incidental;\n- registry copy-on-read is checked by mutating a **nested** limit on the returned object, not just a top-level field.\n\n**7 of the 8 survivors above are now killed.**\n\n# The eighth cannot be isolated, and that is a property of the schema\n\n`if (!profile.limits.links.supported) return [\"links unsupported\"];` still survives, and I chased it rather than leaving it as an open question. `supportedLimit` **enforces** `maxUrlBytes === 0` whenever `links.supported` is false — a profile that says otherwise is rejected at normalization. So for every constructible profile with links unsupported, the byte cap `utf8Bytes(url) \u003e 0` already rejects any non-empty URL, and the early return can never be the deciding clause.\n\nIt is redundant, not untested. I would **keep it** — it is the check that stays correct if the byte-cap rule ever changes — and instead added a test pinning the normalizer invariant that makes it redundant, so the reasoning is executable rather than a comment.\n\n# A note on how I found this\n\nMy first pass used \"source file has no sibling `*.test.ts`\" to find untested modules, and it flagged `profiles.ts`. That was **wrong** — its coverage lives in `session-authority.test.ts`, under a different name. Measuring with mutants instead of filenames is what turned a bad lead into a real gap, and it is worth saying so plainly: the gap here is not \"this file is untested\", it is \"these specific conditions are not asserted\".\n\n# Verification\n\n- New suite: 13 pass / 0 fail.\n- Whole `messaging/interactions/` directory: **285 tests across 13 files, 0 fail**.\n- `bun run --cwd packages/core typecheck` clean; `biome check` clean.\n\nTest-only; no production file is modified.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MM3XGAEG14CDF06R3D8M5T\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T21:52:05.643Z\",\"completed_at\":\"2026-09-03T21:52:54.112Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T21:52:06.351Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"5659e37f9c459fb532aa3c477c9b8e0aaa96176873cc65f1e4121f74c97d1372\",\"trace_upload\":{\"authority\":\"https: rcent-encoded path (`/call%62ack`), and an explicit `:443` port;\n- **no wildcard** — see below;\n- plus: a `null`/empty `redirect_uri` must not fall back to \"the registered one\", and **every** registered callback matches, not just the first.\n\nFor the secret: the rotation window is asserted in both directions (old *and* new digest accepted, so the second listed hash is provably reachable), an absent secret is rejected without hashing, and the registry lowercases the stored digest while the presented secret is never case-folded.\n\nFor scopes: request order is preserved, duplicates collapse without reordering, unlisted scopes are dropped, and the result is proven to be a **subset of the request** rather than the full allowlist.\n\n# A test failure corrected my assumption, and the result is better\n\nI expected `redirect_uris: [\"*\"]` to register and then match only the literal `\"*\"`. It does not: **the registry refuses a bare `*` at parse time**, which is a stronger guarantee than the matcher merely being exact. I rewrote the test to assert what actually happens.\n\nA URL-shaped glob like `https://hub.example/*` *is* syntactically valid and does register, so there is a second case showing it still matches only itself and not the callbacks beneath it.\n\n# Evidence\n\nMutation-tested — **9 of 9 killed**:\n\n| mutant | result |\n|---|---|\n| exact match → `startsWith` prefix match | killed (2) |\n| exact match → case-insensitive compare | killed |\n| match only the first registered URI | killed |\n| a `null` redirect_uri falls through to allowed | killed |\n| an absent client secret is accepted | killed |\n| only the first secret hash is checked | killed |\n| `intersectScopes` returns the whole allowlist | killed (4) |\n| deduplication dropped | killed |\n| allowlist ignored entirely | killed |\n\nRuns: 17 pass / 0 fail. `src/lib/oidc/` under `--isolate`: **248 tests across 12 files, 0 fail**. `bun run --cwd packages/cloud/shared typecheck` clean; `biome check` clean.\n\n# What these tests do not prove\n\nThe constant-time property of `verifyOidcClientSecret` is **not** covered, and I checked rather than assuming. Rewriting `matched = true` as an early `return true` passes the whole suite — functionally identical, timing-wise not. So the loop's docstring claim (\"never leaks which one matched\") rests on review, not on this suite; a timing assertion would be flaky and I did not write a fake one. Flagging it so the coverage is not read as broader than it is.\n\n# Scope\n\nTest-only; no production file is modified.\n\nThis complements my open #30436, which covers registry **parsing** (`parseOidcClientEntry`, `getOidcClient`) in `clients.test.ts`. These are the runtime **authorization** functions, in a separate file — no overlap and no conflict between the two.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MMGPGJJ6V8T7RTA4T4DCHY\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T21:59:04.467Z\",\"completed_at\":\"2026-09-03T21:59:54.304Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\ a, b) =\u003e a.order - b.order)` | **survived** | killed |\n| `listExtraSettingsGroups()` → `[]` | **survived** | killed |\n| `settingsSectionLabel`: drop `defaultValue` | **survived** | killed |\n| `settingsSectionTitle`: drop `defaultValue` | **survived** | killed |\n| drop `.filter((entry) =\u003e entry.items.length \u003e 0)` | survived | **survived** — unreachable, see below |\n| the five `assertMetaCatalogParity` branches | survived | **survived** — see below |\n| drop the module-load `assertMetaCatalogParity()` call | survived | **survived** — see below |\n\n**All 13 survived before; 7 die now.** 434 → **448 passing** in the directory. `bun run --cwd packages/ui typecheck` → exit 0, biome clean.\n\n# The ones worth naming\n\n**\"Other\" is two behaviours, not one.** The comment promises a section with an unknown group \"is never dropped\". That needs both halves: the bucket is labelled the literal `\"Other\"` (not the raw group id, which would leak an internal token into the nav), and it sorts *last* via `FALLBACK_ORDER`. Mutating the label to `?? group` and the order to `?? 0` both survived, so the test asserts the label, the position, and that the section is still present in it.\n\n**The extra-group registry is why this function isn't a one-liner.** Replacing `listExtraSettingsGroups()` with `[]` survived — nothing exercised a registered group at all. The new case registers one at `order: 0.5` and asserts it lands *between* the first and second built-in groups, which is the interleaving the docstring describes and the only assertion that distinguishes \"consulted the registry\" from \"ignored it\".\n\n**`defaultValue` is what the user actually sees.** Both helpers pass `{ defaultValue: … }` to `t` so a missing translation renders English instead of a raw i18n key. A `t` stub that ignores its second argument looks identical from the return value, so the tests record the options argument, and one case uses a stub that honours `defaultValue` to show the fallback is what surfaces.\n\n# Six mutants I did not chase\n\nAll six are structurally unreachable from a test, not uncovered. Rather than write assertions that can't fail, here is why, and what would change it:\n\n**The empty-bucket filter cannot fire.** Every bucket is created as `[section]` and only ever `push`ed to, so `items.length` is never `0`. Executed across four inputs (empty, one, two-same-group, two-different-groups): **0 of 4** buckets had length 0. Harmless, but nothing can cover it.\n\n**The five parity branches, and the module-load call.** `assertMetaCatalogParity()` takes no arguments and reads `BUILTIN_SECTION_DEFINITIONS` and `SETTINGS_SECTION_META` directly, so a test cannot feed it divergent data — its failure paths are reachable only by editing the module's own constants. The parity data is currently in sync, so disabling any branch changes nothing observable.\n\nWhat I added instead is the focused test the docstring promises (`assertMetaCatalogParity()` does not throw on the shipped catalog) plus an **independent restatement** of the same invariant over `SETTINGS_SECTIONS` vs `SETTINGS_SECTION_META` — ids and order, then `defaultLabel`, `group` and `aliases` per id. That doesn't kill the mutants today, but it does mean a real drift fails as a readable diff of ids in a test run rather than as a thrown string during whatever imported the module at boot.\n\nIf you want those branches genuinely covered, the change is to extract the comparison as a pure `checkMetaCatalogParity(defs, meta)` and have the parameterless export call it. That is a production edit, so I have not made it here — happy to in a follow-up if you'd like it.\n\nEither way the docstring's \"(and is asserted by a focused test)\" is now true.\n\n# Scope\n\nNew test file only — no production code touched.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContr </script><script>self.__next_f.push([1,"37:T1845,"])</script><script>self.__next_f.push([1,"# What\n\nBoth wallet sign-in helpers gate a signed message on optional `Expiration Time` and `Not Before` fields:\n\n```ts\nif (parsed.expirationTime \u0026\u0026 parsed.expirationTime.getTime() \u003c= now) throw …\nif (parsed.notBefore \u0026\u0026 parsed.notBefore.getTime() \u003e now) throw …\n```\n\n`\u003c=` and `\u003e` are **false for NaN**. Neither helper checked whether the parsed date was valid, so a present-but-unparseable timestamp slipped straight through both guards:\n\n- a malformed **`Expiration Time`** made a signed message **never expire**;\n- a malformed **`Not Before`** made it **immediately valid**.\n\nThe value is inside the signed payload, so the signature is genuine — signature verification cannot catch this. The timestamp field is exactly the control that is supposed to bound how long a signed message stays usable.\n\n**SIWS already gets this right for `Issued At`**, which has an explicit NaN check and throws. `Expiration Time` and `Not Before` were parsed with a bare `new Date(...)` two lines below it and never checked.\n\n# Both mirrors were affected\n\nI checked the SIWE side rather than assuming viem sanitised it. `parseSiweMessage` returns a **truthy `Invalid Date`** for a malformed value:\n\n```\nfuture             expirationTime= valid\ngarbage            expirationTime= Invalid Date\ngarbage notBefore  notBefore= Invalid Date\n```\n\nSo the identical NaN comparison sits in `siwe-helpers.ts`. Fixing only SIWS would have left the same hole one file away, on a route that is just as reachable — which is why this PR touches both.\n\n# Evidence: the fail-open, demonstrated\n\nReal ed25519 signatures via `tweetnacl` over messages built by the repo's own `buildSiwsMessage`, through the real `validateAndConsumeSIWS`:\n\n| message | before this PR |\n|---|---|\n| no expiry | accepted |\n| past `Expiration Time` | rejected — *\"SIWS message has expired\"* |\n| future `Expiration Time` | accepted |\n| **`Expiration Time: not-a-date`** | **accepted** |\n| future `Not Before` | rejected — *\"not yet valid\"* |\n| **`Not Before: not-a-date`** | **accepted** |\n\n# The change\n\n- **SIWS** — optional timestamps go through a small helper that throws on an unparseable value, matching how `Issued At` is already handled.\n- **SIWE** — both fields are NaN-guarded before the window comparisons, with a dedicated `SIWE message timestamp is not a valid date` error naming which field.\n\nRejecting is the right direction rather than treating a bad value as absent: a message that carries an `Expiration Time` is *asserting* a bound, and silently discarding it is how the message ends up unbounded.\n\n# Verification\n\n- New suite: **11 tests, 0 fail** — both mirrors, real signatures on both sides (ed25519 via tweetnacl, secp256k1 via viem), including a plausible-looking but invalid calendar date (`2026-13-45T99:99:99Z`) rather than only obvious garbage.\n- **On unmodified `develop` the suite fails 5 of 11, across both mirrors.** The other 6 are controls that pass before *and* after, so valid behaviour is unchanged.\n- Mutation-tested the fix — all four killed:\n\n| mutant | result |\n|---|---|\n| drop the SIWS NaN check | killed (3) |\n| SIWS helper returns `undefined` instead of throwing | killed (3) |\n| drop the SIWE `expirationTime` guard | killed |\n| drop the SIWE `notBefore` guard | killed |\n\n- Existing `siws-helpers.security.test.ts` + `siwe-helpers.security.test.ts`: **9 pass / 0 fail**.\n- `src/lib/utils/` under `--isolate`: **358 tests across 55 files, 0 fail**.\n- `bun run --cwd packages/cloud/shared typecheck` clean; `biome check` clean.\n\n# Blast radius\n\nThree production callers: `api/auth/siws/verify`, `api/auth/siwe/verify`, and `api/users/me/wallet/attach`. A malformed timestamp becomes a rejection instead of a silent accept. Legitimate clients emit ISO-8601 through `buildSiwsMessage` or viem, so no valid sign-in changes — every control case in the suite confirms that.\n\nOne judgement call worth surfacing: an **empty** `Expiration Time:` line is still treated as absent rather than rejected, because the field is falsy at that point and an empty value asserts no bound. If you would rather that were also a hard error, it is a one-line change and I am happy to make it.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MK31BMRVA4K1EGJGNFBWW6\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T21:34:08.244Z\",\"completed_at\":\"2026-09-03T21:34:57.729Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T21:34:08.895Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"e14f9b7dbee95eb32b2cb41c9ff505eb5e46988576b8c253bd2474c1541fc46f\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\": g said so.\n\n# What the missing clauses actually cost\n\nNot a lenient parse. `fromSnapshot` immediately does `[...record.aliases]`, `record.identities.map(...)` and `[...record.evidence]`, so a shape that slips past the gate surfaces as a raw `TypeError` from the constructor rather than the structured `PseudonymMapIntegrityError` both call sites are written against — including `load`, which is catching it to report an invalid artifact.\n\n# Choices\n\n- Each per-field case asserts **its own message**, not just `PseudonymMapIntegrityError`. One clause standing in for another is then a failure rather than a pass — several of the survivors above are only visible that way.\n- Every list field is checked **twice**: not-an-array, and an array holding one wrong-typed element. Dropping only the `.some(...)` half leaves the first case green, so the pair is what pins the clause.\n- Tests call `assertValidSnapshot` **directly**. The existing block goes through `fromSnapshot`, which is the right shape for the headline invariants but means a clause can only be observed through a constructor that does its own work afterwards.\n- One ordering case (`reports the first offending cluster, not the last`), because the loop's early `throw` is the reason the error names a cluster id at all.\n\nI did not touch `assertValidSnapshot` itself — every clause in it is correct as written; this only makes them load-bearing. No production code changes.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b6 ed from the list silently stops that field crossing, and a name added lets new upstream data through.\n\nTwelve names, and **7 of them were never mentioned by a test**. Deleting an entry one at a time against the existing suite:\n\n| deleted entry | before |\n|---|---|\n| `userMessageId`, `failureKind`, `accountConnect`, `actionResults`, `usage` | killed |\n| `transcriptVisibility` | **survives** |\n| `agentName` | **survives** |\n| `assistantEphemeral` | **survives** |\n| `historyRefreshRequired` | **survives** |\n| `thought` | **survives** |\n| `noResponseReason` | **survives** |\n| `localInference` | **survives** |\n\nThe existing single `toEqual` names five fields and one dropped extra. That's a good assertion — it just leaves the other seven to be deleted for free. Each survivor is a field a consumer reads: `transcriptVisibility` gates `conversation-message-filter.ts:44`, `assistantEphemeral` drives the ephemeral branch in `useStreamingText.ts:234`, `historyRefreshRequired` triggers the refetch at `useChatSend.ts:2061`, `agentName` is parsed at `parsers.ts:31`, `localInference` flows through `useChatCallbacks.ts:108`, and `noResponseReason` is read by `voice-workbench-player.ts:358`.\n\n# The change\n\nTest-only, +178 lines to `chat-sse-frames.test.ts`. No source change.\n\n`DONE_METADATA_FIELDS` is not exported, so the list is pinned **behaviourally**, through the function callers actually use rather than by importing the constant.\n\nA `test.each` over all twelve names asserts each field round-trips on its own *and* is absent when upstream omits it. Because a generated table over an empty collection registers zero cases and still reports green, the exact key set is asserted separately — that assertion also catches a silent **addition**, which per-field cases cannot see:\n\n```ts\nexpect(Object.keys(normalizeChatSseDonePayload(payload, fallback)).sort()).toEqual(\n  [...DONE_METADATA_FIELD_CASES.map(([field]) =\u003e field), \"messageId\", \"text\", \"fullText\"].sort(),\n);\n```\n\n# Three edges I found while probing, all previously unpinned\n\n**An empty `fullText` must survive.** `typeof payload.fullText === \"string\"` is not stylistic — the ambient voice gate emits `{ fullText: \"\", noResponseReason: \"ignored\" }` to suppress a turn (`AMBIENT_GATE_PIXEL_VERIFICATION.md:55`). A truthiness check substitutes the accumulated text and un-suppresses it. Now pinned directly.\n\n**`Object.hasOwn` is the right guard, and the distinction is observable.** An upstream that sends `thought: undefined` has still *sent* it, and the key is forwarded with an `undefined` value. `payload[field] !== undefined` would drop it; plain truthiness would also drop `false` and `0`. All three are now distinguished, including cases for `assistantEphemeral: false`, `usage: 0` and `agentName: \"\"`.\n\n**The upstream `messageId` is trusted only when non-blank, and is not trimmed.** Each rejected shape gets its own case (whitespace-only, empty, non-string, `null`), with an accepted padded neighbour (`\" upstream \"` is trusted verbatim) so the cases discriminate rather than always falling back.\n\n# Evidence\n\nEvery mutant executed at `9be826b931`, one at a time.\n\n**All twelve entries, deleted individually:** 12/12 now fail (was 5/12).\n\n**Branch mutants, 8/8 killed:**\n\n| mutant | result |\n|---|---|\n| `Object.hasOwn(payload, field)` → `payload[field] !== undefined` | 1 fail |\n| `Object.hasOwn(payload, field)` → `payload[field]` | 4 fail |\n| `typeof payload.fullText === \"string\"` → `payload.fullText` | 1 fail |\n| `typeof payload.text === \"string\"` → `payload.text` | 1 fail |\n| drop the `upstreamMessageId.trim()` check | 2 fail |\n| `messageId` guard → plain truthiness | 2 fail |\n| return `upstreamMessageId.trim()` instead of the raw value | 1 fail |\n| seed `normalized` with `{ ...payload }` (bypass the allowlist) | 2 fail |\n\nThat last one is the one I most wanted to hold: it is the shape a well-meaning refactor takes, and it turns the allowlist into a no-op.\n\n**Suite:** `bun test src/lib/services/chat-sse-frames.test.ts` → **29 pass / 0 fail / 55 assertions** (was 4 / 0 / 6).\n\n`bun run --cwd packages/cloud/shared typecheck` → `Done!`. Biome on the changed file → clean (I ran `--write` for formatting only; the diff stays inside this one file).\n\n**Regressions checked in both trees:** `packages/ui/src/api/client-cloud-canonical-sse-replay.test.ts` → 2 pass. Running the whole `src/lib/services/shared-runtime/` directory reports 618 pass / 106 fail — **identical on `origin/develop`**, so that is pre-existing cross-contamination from running the directory in one invocation, not this change. Stated because a directory-level number is easy to misread as a regression.\n\n# What I deliberately did not do\n\nI did not add a test asserting a consumer for `thought`. It is in the allowlist and forwarded, but the only reference I could find in the UI is a type declaration comment at `useStreamingText.ts:86` — I could not demonstrate a live reader, so pinning one would encode a claim I cannot back. It is covered as a list member, nothing more.\n\nI also did not touch the source. Every finding here is a coverage gap, not a defect; the implementation does the right thing at each of the three edges, which is exactly why they were worth pinning before a refactor makes one of them wrong.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\": a rejected Kokoro request still reports its timings:\n\n```ts\nconst serverTiming = response.headers.get(\"Server-Timing\") ?? \"\";\nexpect(serverTiming).toContain(\"auth;dur=\");\nexpect(serverTiming).toContain(\"admission;dur=\");\n```\n\nThey passed then. `#30265` (*fuse generative credential and balance admission*) later converted the early `return Response.json(...)` sites into a deferred `pendingResponse`, so an unauthenticated caller can't learn the validation outcome. **That deferral is correct.** But it builds the `Response` *eagerly*, at the point of assignment — which is before `requireGenerativeRouteCaller` runs, and therefore before `timings.authMs` exists:\n\n```ts\npendingResponse = Response.json(… , { headers: buildTtsObservabilityHeaders(provider, timings) });   // authMs undefined\n…\ntimings.authMs = Date.now() - requestStart;\nif (pendingResponse) return pendingResponse;                                                          // too late\n```\n\n`buildTtsObservabilityHeaders` filters out undefined entries, so the list came out empty and the header was **omitted entirely**. Every deferred 4xx on this route silently lost `Server-Timing`. `#30362` did not touch this — I found it while baselining that PR's suites before mutating them.\n\nThe fix makes the pending response a thunk so the header is built at return time:\n\n```ts\nlet pendingResponse: (() =\u003e Response) | undefined;\n…\nif (pendingResponse) {\n  timings.admissionMs = Date.now() - admissionStart;\n  return pendingResponse();\n}\n```\n\n`admissionMs` is recorded deliberately rather than left absent: `#30265` fused admission *into* the auth call, so the post-auth admission phase really is empty for a deferred rejection. Reporting it as `0` keeps the `Server-Timing` shape identical on every path that reached admission, instead of making a rejection look like it skipped a phase it didn't skip. The rationale is in the code comment, not just here.\n\n# 2. The twelve tests that never ran (test fix)\n\n`cartesia-synthesis.test.ts` failed with `vi.unstubAllGlobals is not a function` — all 12, before any assertion.\n\nThis package's unit lane is `node test/run-unit-isolated.mjs`, which sweeps the whole package and spawns **`bun test` per file**, so this file is in the lane. Probing bun's `vitest` compat surface directly:\n\n| `vi.` member | present under bun |\n|---|---|\n| `fn`, `spyOn`, `restoreAllMocks`, `useFakeTimers`, `mock` | yes |\n| `stubGlobal`, `unstubAllGlobals` | **undefined** |\n\nOther `from \"vitest\"` importers in this package pass only because they never touch the missing two. Swapped for an explicit `globalThis.fetch` save/restore, so the same twelve assertions run under either runner. No assertion changed.\n\n# Evidence\n\nBoth halves are pinned by tests that **already existed** — so I mutation-tested my own fix rather than trusting the green run:\n\n| mutant | result |\n|---|---|\n| drop the `timings.admissionMs` record | **2 fail** |\n| restore the eager build at the provider-selection site (keeping the thunk wrapper) | **2 fail** |\n| unmutated | 0 fail |\n\nSuites, run one file per process the way the lane runs them:\n\n| suite | before | after |\n|---|---|---|\n| `route-provider-selection.test.ts` | 19 pass / 2 fail | **21 pass** |\n| `cartesia-synthesis.test.ts` | 0 pass / 12 fail | **12 pass** |\n| `kokoro-first-line-cache.test.ts` | 15 pass | 15 pass |\n| `provider-selection.test.ts` | 8 pass | 8 pass |\n| `route.json.test.ts` | 2 pass | 2 pass |\n\n`tsc --noEmit` reports nothing under `voice/tts`. `biome check` is clean (it reformatted the arrow bodies it introduced, which is most of the line count; the suites were re-run after formatting).\n\nOne note for reviewers: running several of these files in a **single** `bun test` invocation cross-contaminates module mocks and fails. That's pre-existing and is exactly why `run-unit-isolated.mjs` spawns one process per file — I verified each suite the same way the lane does.\n\n# Scope\n\nNo new tests. The two red tests that already existed are the regression test; adding a third would only restate what they already pin.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1JNG4QB91SYT27ZFN3JSBRD\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T03:37:45.963Z\",\"completed_at\":\"2026-09-03T03:40:54.989Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T03:37:46.788Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"877e361e325aaf364468dbe435f7b72d92f9edefaa32b05adfeb66d56fdbca16\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"12f4b518-9ce2-4559-9621-c5686b9a2eb0\",\"object_id\":\"sha256:877e361e325aaf364468dbe435f7b72d92f9edefaa32b05adfeb66d56fdbca16\",\"sha256\":\"877e361e325aaf364468dbe435f7b72d92f9edefaa32b05adfeb66d56fdbca16\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"8miMo7ZtjSG0WXPxMeGzYIxCGVBYrSqdtKWrQReel3uECqIKviSXFoqHXgS04NhSP9JgG9sHW-mtFoXymIJFDg\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"3b:T19ed,"])</script><script>self.__next_f.push([1,"# What\n\n`#30394` added the `runtime` process facts. I reviewed it and raised one gap; it merged at the reviewed head, so this implements the fix rather than re-arguing it.\n\n`observe()` returns `{ ok: false, output: \"\" }` for **every** failure, and `docker exec` fails outright whenever the container is not running — `created`, `exited`, `dead`, all states this diagnostic's own status enum expects.\n\n`classifyTailscaleStatus` gets a discriminator for free: an empty string can't parse, so it already reports `query: \"error\"`. The process and log classifiers can't — an empty string is *valid input* that yields all-`false`. So an unobserved container was published as five definite negatives:\n\n```\nclassifyRuntimeProcessState(\"\")\n-\u003e {\"pid1\":\"unknown\",\"agentProcessPresent\":false,\"entrypointProcessPresent\":false, …}\n```\n\nand the workflow rendered `private_mesh_runtime_agent_process=false`, `private_mesh_runtime_entrypoint_process=false` with nothing marking them unobserved. Those are exactly the two facts `#30394` exists to distinguish (\"an entrypoint blocked in `tailscale up` from an agent process that started but failed health\") — a failed exec silently answers *neither*, which is a third conclusion, and the wrong one.\n\n`pid1` doesn't rescue it: truncated output gives `pid1: \"other\"` with all booleans false, identical to a successful observation that matched nothing.\n\n# The change\n\n`withObservationQuery(observation, classify)` stamps the `success | error` shape `tailscale` already carries. `schemaVersion` → 3, and the live-smoke jq contract widened to match. `live-smoke.yml` is the only consumer, so the bump is self-contained.\n\n**`logs` is fixed too, deliberately.** `classifyContainerLogs` has the identical shape and the identical consequence — a failed `docker logs` publishes `agentStarted: false` as a definite negative. Fixing one while editing the file and leaving its twin would be worse than fixing both. The thesis is now uniform: every observation in this artifact reports whether it happened.\n\n# One thing worth flagging to maintainers\n\nMy first version put `query` before the spread and constrained the parameter with `query?: never`, so a classifier reporting its own `query` wouldn't compile. Then I checked whether that constraint is *enforced*, and it isn't:\n\n- `packages/cloud/scripts` has no `package.json` and no `tsconfig.json`\n- `packages/cloud/shared/tsconfig.json` includes only `src/**`\n\n**Nothing typechecks this directory.** My own `tsc --noEmit -p tsconfig.json` there had been silently vacuous — failing with `TS5058: The specified path does not exist`. A control experiment (append a definite type error, observe no report) is what caught it.\n\nSo I replaced the unenforceable compile-time constraint with a runtime one: spread first, `query` last, so the observation-level answer can't be shadowed, pinned by a test. That's a guarantee this repo can actually hold today. Whether `packages/cloud/scripts` should be typechecked at all is a separate call, and yours.\n\n# Evidence\n\n**Mutation table — 7 mutants, all killed:**\n\n| mutant | result |\n|---|---|\n| `query` always `\"success\"` | 3 fail |\n| `query` **before** the spread (shadowable) | 1 fail |\n| invert the ternary | 4 fail |\n| `logs` left unwrapped | 1 fail |\n| `runtime` left unwrapped | 1 fail |\n| workflow jq left at `schemaVersion == 2` | 1 fail |\n| workflow drops the `.runtime.query` enum | 1 fail |\n\nThe two call-site mutants **survived at first**. `run()` needs a live SSH client, so the code that assembles the artifact is unreachable from any test — the exact place the defect lives. I stopped trying to unit-test it and pinned the call sites against the source text instead, the style this package already uses for its shell and workflow assertions, plus a test tying the emitter's `schemaVersion` to the jq that has to accept it. A schema the emitter produces but the workflow rejects fails at canary time, not in CI.\n\n**The workflow contract, executed rather than eyeballed.** I extracted the jq program straight out of `live-smoke.yml` and built the artifact by calling the **real** classifiers, not a hand-written fixture:\n\n| input | verdict |\n|---|---|\n| failed observation (`query: \"error\"`) | accepted |\n| healthy observation (`query: \"success\"`) | accepted |\n| stale emitter still at `schemaVersion: 2` | **rejected** |\n| `runtime` block missing `query` | **rejected** |\n\n**Gates:** diagnostic suite **11 pass** (up from 5), `managed-dedicated-canary-workflow` 7 pass, `live-cloud-provision-smoke` 26 pass, `actionlint` clean on `live-smoke.yml`, `biome` clean.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1JPVV1MT4A273T4XVNEG8PB\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T04:01:37.844Z\",\"completed_at\":\"2026-09-03T04:06:55.540Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\
