l-closed attribution when an earlier ambiguous effect could explain a later restoration;\n- production rejection and explicit dormant-source audit coverage.\n\n# Current source\n\n- Exact head: `625058972d4f351ce4275954dbec7a3ce5038d34`.\n- Last fully validated base: `develop@f5a34d7e7422e7ed576fb98a9c6a9bbd6b3d1a45`.\n- `develop` has since advanced beyond that validated base. Because this candidate is Draft/dormant behind the external #29488 authority blocker, it is not being churn-rebased; the current base is tracked in #25025, and a fresh rebase, exact-head validation, hosted CI, and independent review are required before any Ready transition.\n- On its validated base, the first 13 commits remain range-diff equivalent across unrelated #30413, and the current 14th commit closes the review-confirmed live run-list timestamp boundary without adding a live caller.\n- The PR intentionally remains **Draft**.\n\n# Validation\n\nAt the exact head/base above:\n\n- journal + reconciler contracts: **111/111 PASS, 523 assertions**;\n- full repository verification: **376/376 tasks PASS**;\n- script audit/self-test and secret-leak audit/self-test: **PASS**;\n- Node syntax and `git diff --check`: **PASS**;\n- Biome: exit 0, advisory warnings only in the already-large new test/core files;\n- successive full-head reviews found malformed-envelope, duplicate-key, missing provider-field, moving-baseline, missing exact-source-terminal-readback, raw provider-ID output, and live exact-attempt/run-list timestamp gaps; the current head closes each with fail-closed negative tests that prove zero provider mutation;\n- independent full exact-head adversarial and security reviews of this head: **PASS, zero additional P0-P3**;\n- hosted exact-head [run 33729020538](https://github.com/elizaOS/eliza/actions/runs/33729020538): **5/5 PASS**.\n\nThe local, hosted, and independent-review evidence above all ran on this exact head.\n\n# Blocking security boundaries\n\nThe remaining blocking boundary is:\n\n- **P1 structural — issue comments cannot be authoritative.** Authentication detects edited records and visible forks, but reconstructing the head only from currently visible comments cannot distinguish a genuine clear state from a deleted/truncated authenticated tail or OPEN. #29488 must supply an append/CAS authority outside mutable comments, with deletion/force-update resistance, concurrency exclusion, staging isolation, recovery/rotation, readback, and negative canaries. Durable owner handoff: https://github.com/elizaOS/eliza/issues/29488#issuecomment-5520656842.\nThe correctable findings are closed in source: all previous-key graph work precedes the final exact rekey/current-`develop` authority boundary immediately before POST; GitHub/Railway failures are classified and redacted at source; all JSON authority inputs reject decoded duplicate object keys before native parsing; GraphQL success envelopes and required provider fields are fail-closed; every immutable baseline row must remain terminal; exact source-attempt and run-list retention bind GitHub's populated `updated_at` rather than its null `completed_at`; raw provider IDs are not written to stdout; Actions annotations are allowlisted and encode `%`, CR, and LF. Race, live-source-schema, malformed/duplicate-envelope, source substitution, transition-state, and secret/ID/body/argv/stderr/CRLF injection tests pass. Fresh full-head reviews passed with zero additional P0-P3.\n\nComments may remain a redacted mirror; they cannot be the sole head authority. Passing tests or CI do not waive any blocker.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:625058972d4f351ce4275954dbec7a3ce5038d34 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A — no rendered UI surface changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A — no rendered UI surface changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A — no customer-facing flow changes.\n\u003c!-- evidence-row:b otent retry for transient cold inference rate-admission failures, with a stable operation deadline that can never double-consume after receipt expiry\n\nIt supersedes #30365, #30380, and #30388 only to avoid three more base-advance/revalidation cycles. Their reviews and focused evidence remain linked here.\n\nCloses #30357\nCloses #30358\nCloses #30387\n\n## Evidence\n\n- Voice clone: 11 focused tests, 78 assertions; PGlite receipt/fence/concurrency tests; Cloud API typecheck; Biome\n- Outbound: standing 2/2, router 19/19, A2A 7/7, isolated Blooio 6/6; shared typecheck; Cloud API build\n- Rate admission: unit 50/50 (340 assertions), Miniflare 17/17 (69 assertions), full repository verify 376/376 plus audits\n- Independent rate review reproduced and then verified fixes for greater-than-64 interleaving, elapsed receipt expiry, lost acknowledgements, 200 replay, and 429 replay\n- Paid-boundary audit found no remaining active source-level bypass, duplicate standing-cache read, cache write/readback latency, unsafe public denial reason, or missing structured boundary logging\n\n## Runtime contract\n\nPaid/provider dispatch resolves standing before credentials or provider I/O. Warm standing uses exactly one cache read. A cache miss uses one authoritative SQL query and schedules one projection write without reading it back. Denials return a closed safe reason and emit detailed structured no-dispatch context. Post-dispatch ambiguity settles unknown or enters durable reconciliation rather than refunding work that may have been accepted."])</script><script>self.__next_f.push([1,"17:Ta2a,"])</script><script>self.__next_f.push([1,"## What changed\n\n- diagnose the exact failed Dedicated canary across its Docker process, Tailscale socket, Headscale REST inventory, tags, route, and active peer identity without exposing private addresses or credentials\n- select the unique canonical tailnet IPv4 from Headscale's unordered repeated address field instead of assuming address zero is IPv4\n- retain the exact observed Headscale node ID in the replacement cleanup locator before Docker/Headscale address binding, so a mismatch cannot strand an offline peer or poison the next deterministic-name provision\n- lock both behaviors with real integration/provider-path regressions\n\n## Why\n\nFresh signed-in Dedicated canary `33712952322` reached a running agent process and registered an exact tagged Headscale peer, but provisioning still reported missing ingress. Follow-up diagnostics proved the API/CLI peer existed and that its assigned peer address differed from the stale database observation. The provider then dropped the observed node ID when final address binding failed; Docker cleanup proceeded while the Headscale identity remained orphaned.\n\nHeadscale's v0.28 node contract exposes `ip_addresses` as a repeated field and does not promise IPv4-first ordering. Treating element zero as the routable IPv4 turns a valid IPv6-first registration into a false registration miss. The repaired selector accepts exactly one canonical CGNAT IPv4 and fails closed on zero or ambiguity.\n\nCloses the remaining registration-settlement and orphan-cleanup defects tracked in #29341.\n\n## Evidence\n\n- `bun test packages/cloud/shared/src/lib/services/headscale-integration.test.ts packages/cloud/shared/src/lib/services/__tests__/docker-sandbox-replacement-cleanup.test.ts`: 104 tests, 466 assertions, 0 failures\n- `bun run --cwd packages/cloud/shared typecheck`: pass\n- `bun run --cwd packages/cloud/shared lint`: pass\n- `bun run verify`: pass (376 Turbo tasks plus repository audit gates)\n- diagnostic runs: `33715419078`, `33715767150`, `33716302381`\n- exact stale-canary cleanup: `33716432757`, pass, `possibleOrphan=false`\n- exact-source staging worker deployment: `33716850524` (running at PR creation; merge remains gated on terminal result)\n\n## Scope / invariants\n\n- signed-in app/Cloud traffic remains `dedicated-always`; no Shared fallback was added\n- Shared remains limited to public or explicitly Shared ingress\n- warm pool remains protected-off so it cannot conceal cold-path behavior\n- tenant DB creation/migration remains fail-closed and was repeatedly ready in the failed canaries; this repair is at the Headscale settlement boundary\n"])</script><script>self.__next_f.push([1,"18:Ta3f,"])</script><script>self.__next_f.push([1,"Closes #30357\n\n## What changed\n- adds an organization/user-scoped durable `Idempotency-Key` fence before pricing, billing admission, uploads, or provider dispatch\n- hashes the complete canonical request (including each audio file) so same-payload retries replay safely and different-payload key reuse returns `409 idempotency_conflict`\n- stores the completed response for exact successful replay and returns the existing job on in-flight or reconciliation retries without duplicate billing/provider work\n- synchronously persists append-only ElevenLabs step receipts and the provider voice ID at each irreversible boundary\n- classifies ambiguous post-dispatch transport failures with `VoiceCloneSubmissionUnknownError extends ElizaError` (`VOICE_CLONE_SUBMISSION_UNKNOWN`, provider/step context, cause, severity)\n- preserves R2/sample/job evidence and conservatively calls `settleUnknown()` whenever provider acceptance is possible\n- exposes `reconciliation_required` jobs through the authenticated voice-jobs endpoint as an explicit manual recovery queue, including provider state, step, and voice locator\n- emits tenant/job/provider/step/state/voice-locator structured error context without request audio or API keys\n\n## Verification\n- `bun test packages/cloud/api/v1/voice/clone/route.standing.test.ts` — 7 pass, including different-payload conflict, timeout-after-acceptance same-key retry, and later-step failure\n- `bun test packages/cloud/api/elevenlabs/voices/jobs/route.reconciliation.test.ts` — 1 pass; proves reconciliation-required jobs remain public to the authenticated manual queue\n- `bun test packages/cloud/shared/src/db/repositories/__tests__/user-voices-provider-receipts.pglite.test.ts --coverage-reporter=lcov` — 2 pass against real PGlite; proves receipts and tenant-scoped atomic idempotency fencing\n- `bun run --cwd packages/cloud/shared typecheck` — pass\n- `bun run --cwd packages/cloud/api typecheck` — pass, including router contract and Worker dry-run bundle\n- `bun run --cwd packages/cloud/api build` — pass\n- package Biome checks, migration check, and `git diff --check` — pass\n- `bun run verify` — pass (376/376 Turbo tasks plus repository audits)\n\n## Evidence\n- Database artifact: real PGlite rows retain provider receipts, `elevenlabs_voice_id`, explicit reconciliation state, and one tenant-scoped job per idempotency key.\n- Live ElevenLabs mutation: N/A — intentionally not invoked from a PR test because clone creation is paid and irreversible; adversarial provider transport behavior is deterministic at the route boundary.\n- UI screenshots/video: N/A — no UI changes."])</script><script>self.__next_f.push([1,"19:T70d,"])</script><script>self.__next_f.push([1,"Closes #30386\n\n## Summary\n- persist the successful deployed browser chat trace, allowlisted `Server-Timing`, preforward breakdown, and SHA-256 provider request correlation in the uploaded staging receipt\n- capture the actual chat response origin and require it to equal the staging Dedicated reference binding API origin before evidence is written\n- require all Dedicated auth, ownership, routing, proxy-dispatch, and total timing metrics\n- emit one always-on, closed-schema warning only after authenticated ownership/routing completes for a valid traced chat request; unauthenticated 401/403 callers and non-chat probes emit nothing, while successful and warming post-auth attempts remain observable\n- preserve upstream timing/correlation headers and avoid nginx or agent-router changes\n\n## Verification\n- app correlation/evidence tests: 7 passed\n- Dedicated proxy unit tests: 56 passed\n- Pages authority, staging receipt, and deployed workflow tests: 27 passed\n- Cloud API typecheck, 708-route contract audit, and Worker dry-run: passed\n- app typecheck: passed\n- Biome check for all 10 touched files: passed\n- exact PR-range gitleaks scan: passed\n- `git show --check`: passed\n\nRegression coverage rejects mismatched response/reference origins, injected secret-shaped metric names, missing Dedicated metrics, shared or invalid runtime bindings, and unauthenticated traced 401/403 logging. It retains authenticated warming timing logs and proves the uploaded receipt carries the sanitized correlation envelope.\n\n## Live evidence boundary\nThe protected deployed Playwright run requires a deployed revision plus the protected staging access key and authenticated account. Browser evidence schema v3 and staging receipt v4 preserve the safe cross-provider join data needed for Cloudflare/Railway correlation."])</script><script>self.__next_f.push([1,"1a:T85a,"])</script><script>self.__next_f.push([1,"## Summary\n\n- track the actual provider invocation boundary for image generation, music, SFX, and priced FAL mutations\n- release reservations only when the durable dispatch receipt or another definitive pre-dispatch step fails\n- conservatively settle ambiguous provider, storage, persistence, transport, and non-2xx outcomes after dispatch while retaining durable admission receipts\n- persist completed music and SFX receipts before starting exact settlement or returning their success IDs\n- separately log primary exact-settlement and conservative-reconciliation failures without rejecting retained background tasks\n- add correlated structured settlement diagnostics without exposing provider credentials or request payloads\n- cover post-dispatch ambiguity, pre-dispatch receipt failures, receipt-write failures, and double-settlement failures behaviorally\n\n## Safety contract\n\n- successful known-cost work retains exact settlement\n- `settle(0)` is limited to failures b cannot be tokenized differently by JavaScript and PostgreSQL.\n\nBoth halves of that are one character away from being wrong, and nothing was holding them:\n\n- `asciiLower` is `/[A-Z]/g` rather than `toLowerCase()`. The tests pin **U+0130** (dotted capital I — the Turkish-locale hazard), **U+212A** (KELVIN SIGN, which `toLowerCase()` folds to a plain `k`), **U+FF21** (fullwidth A), plus accented Latin and Cyrillic. Each must survive *exactly as written*, and the test asserts the result differs from `value.toLowerCase()` — so swapping in `toLowerCase()` fails.\n- `DOCUMENT_SEARCH_SEPARATOR` is `/[ \\t\\r\\n\\f]+/` rather than `/\\s+/`. The tests confirm all five ASCII separators split, and that **NBSP, U+2028, U+2029, ideographic space, ZWSP and EM space do not** — because PostgreSQL wouldn't split on them either.\n- `user.name+tag@example.com`, `https://example.com/a/b?c=d#e` and `v1.2.3-rc.4` each stay a single token.\n\n# The comparator and the cursor have to agree\n\n`compareDocumentOrder` sorts newest-first and breaks a timestamp tie by **descending** lowercased id. `isAfterDocumentCursor` advances on a strictly *smaller* lowercased id. If those two ever disagree, paging silently skips a document or serves one twice — the kind of bug that shows up as a support ticket, not a test failure.\n\nSo beyond the direction and case-insensitivity cases, one test sorts a mixed batch and then asserts every adjacent pair satisfies the cursor's own advance predicate. It also checks antisymmetry across the batch.\n\n(One wrinkle worth noting for anyone extending this: `Math.sign(0)` and `-Math.sign(0)` are `+0` and `-0`, which `toBe` distinguishes. The antisymmetry assertion normalizes with `|| 0`.)\n\n# Mutation testing\n\n22 mutants of `document-list-query.ts`, each required to fail the suite. **22/22 killed, first round.**\n\n| area | mutants killed |\n|---|---|\n| tokenizer | ASCII fold widened to `toLowerCase()`; separator widened to `\\s+`; empty tokens no longer filter unter before its response was lost.\n\nThis PR:\n\n- assigns one UUID operation ID and one fail-closed validity deadline before the first internal call;\n- retries transport failures and 5xx once with the identical operation ID, deadline, stub, policy, and captured fixed-window start;\n- persists a time-bounded replay receipt atomically with the synchronous SQLite counter update and binds it to the policy plus deadline;\n- checks a matching receipt before deadline validation so a retained committed decision remains replayable;\n- rejects operation-ID reuse under different policy or deadline inputs with 409;\n- rejects a missing-receipt operation outside its validity window with 409 before incrementing; and\n- leaves definitive 429 decisions as single-attempt results.\n\nThe chat-completions route already overlaps this rate-limit round trip with independent cache-only preparation. Starting the separate balance lease before the rate-limit verdict would require compensating release behavior on 429 and remains outside this narrow repair.\n\n## What kind of change is this?\n\nBug fix (non-breaking internal reliability change).\n\n# Documentation changes needed?\n\nNo. This is an internal Worker-to-Durable-Object transport contract covered by source comments and regression tests.\n\n# Testing\n\n## Where should a reviewer start?\n\nStart with `packages/cloud/shared/src/lib/services/inference-admission-gate.ts` for the bounded client retry, then `packages/cloud/api/src/inference-admission-gate.ts` for receipt/deadline validation. Regression cases are in `packages/cloud/api/__tests__/inference-admission-gate.test.ts`.\n\n## Detailed testing steps\n\nExact PR head: `8cfc81007ba3c9c465dbaccf45d07adbaeec5740`\n\n- `bun --config=/dev/null test packages/cloud/api/__tests__/inference-admission-gate.test.ts` — 50 pass, 0 fail, 340 assertions.\n- `bun --config=/dev/null test packages/cloud/api/__tests__/inference-admission-gate.miniflare.test.ts` — 17 pass, 0 fail, 69 assertions.\n- `bun run --cwd packages/cloud/shared typecheck` — pass.\n- `bunx biome check packages/cloud/api packages/cloud/shared` — pass, 4,063 files checked.\n- `node --max-old-space-size=8192 node_modules/@typescript/typescript6/bin/tsc6 --noEmit -p packages/cloud/api/tsconfig.json` — pass.\n- `bun run verify` — pass; 376/376 Turbo tasks plus all repository audits.\n\nThe immediate lost-ack test commits the first counter update, discards its response, recreates the Durable Object over the same storage, and verifies the identical retry returns the original decision once. The adversarial delayed test processes more than 64 operations, advances beyond receipt TTL, recreates the Durable Object, and verifies the late identical retry is typed unavailable while persisted count remains 65 rather than 66. Separate tests bind receipts to both policy and deadline and verify expired receipts are pruned.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:8cfc81007ba3c9c465dbaccf45d07adbaeec5740 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - backend-only internal Durable Object transport; no UI surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - backend-only internal Durable Object transport; no UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - no interactive or rendered flow changed.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] N/A - deterministic injected 503 and acknowledgement-loss boundary tests exercise the incident; no deployment was authorized.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend code or network contract changed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no model, prompt, provider, or agent behavior changed.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] N/A - storage-backed tests inspect the persisted Durable Object counter and replay receipts directly.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\n## Real LLM-call trajectory\n\nN/A - no model, prompt, provider, or agent behavior changed.\n\n## Backend + frontend logs\n\nN/A - no production deployment was authorized. Deterministic Worker/DO boundary tests inject raw 503 and acknowledgement-ambiguous transport failures and inspect persisted state.\n\n## Screenshots (before / after) + video walkthrough\n\nN/A - backend-only internal transport change.\n\n## Audio / voice walkthrough\n\nN/A - no voice, transcript, TTS, or STT behavior changed.\n\n## Known gaps / failures\n\n- No staging or production request was issued because deployment was not in scope; the real Miniflare Durable Object suite and storage-backed unit tests cover the changed boundary locally.\n\n## Maintainer CI exception record\n\nN/A - no exception requested.\n"])</script><script>self.__next_f.push([1,"22:T1a29,"])</script><script>self.__next_f.push([1,"# What\n\n`RemoteTargetDesktopService.resumeEligibleLoopback` decides whether a desktop may resume acting as a **remote-control target** after a restart. Its docstring makes a fail-closed promise:\n\n\u003e Missing/corrupt credential or journal state never degrades into a fresh enrollment or an unpinned runner.\n\nNothing asserted it. The two suites in this directory cover the runner and the same-host integration path, not this decision. This adds 20 tests. No production change.\n\n# The decision table\n\n| vault | active sessions | staged sessions | outcome |\n|---|---|---|---|\n| not enrolled | ≥1 | — | **throws** |\n| not enrolled | 0 | — | `not_enrolled`, runner stopped |\n| enrolled | ≥1 | — | `active_authority`, runner **running** |\n| enrolled | 0 | ≥1 (unresolved) | `activation_recovery`, runner **running** |\n| enrolled | 0 | 0 | `no_active_authority`, runner stopped |\n\nThe throw is the one that matters. Returning `not_enrolled` there would look like a clean first run and invite a fresh enrollment, quietly orphaning a controller grant that is still live in the journal. That substitution is now a failing mutant.\n\nEvery clause of the active-authority filter is covered individually — not staged, not stopped, not revoked, not expired — including that **expiry is inclusive** (`expiresAt \u003e= now`), so a grant expiring exactly now still counts rather than dying a millisecond early on every restart.\n\nAnd `resumed: false` is asserted to also mean *not running*, via `service.status()`. A runner started on a \"no authority\" path would poll the relay for commands with nothing backing it.\n\n# I got the staged-activation contract wrong first, and the failures corrected me\n\nMy initial tests assumed a staged session simply yields `activation_recovery`. It doesn't. `resumeEligibleLoopback` calls `recoverStagedActivations()` **before** reading the decision, so the answer depends on what the relay says:\n\n| relay response to `commitActivation` | journal effect | resume outcome |\n|---|---|---|\n| success | session promoted to `active` | `active_authority` |\n| 404 / 409 / 410 (grant gone) | session **deleted** | `no_active_authority` |\n| 0 / 408 / 429 / 5xx (outage) | stays `staged` | `activation_recovery` |\n| anything else (e.g. 403) | — | **propagates** |\n\nSo **a relay outage is the only path to `activation_recovery`** — the runner comes up to keep retrying rather than either discarding a real grant or claiming authority it hasn't confirmed. That's a genuinely nice piece of design and it now has tests that say so. All four rows are asserted, including that a 403 is neither \"gone\" nor \"offline\" and must not be silently classified as either.\n\nAlso asserted: a stopped or revoked staged session is **never committed at all** (`commitActivation` not called), and recovery is skipped entirely when the vault isn't enrolled.\n\n# Mutation testing: 18 mutants, 18 killed\n\nAcross `remote-target-rpc.ts` and `remote-target-runner.ts`:\n\n- the fail-closed throw replaced with `not_enrolled`\n- each of the four active-filter clauses dropped individually\n- `expiresAt \u003e= now` → `\u003e`, and expiry ignored entirely\n- both staged-filter clauses dropped\n- `activation_recovery` relabelled `active_authority`\n- recovery run when not enrolled, and recovery skipped entirely\n- runner started on `no_active_authority` and on `not_enrolled`; runner *not* started on `active_authority`\n- `410` dropped from the gone set; `5xx` dropped from the transient set; the unclassified-error rethrow turned into `continue`\n- the staged commit filter ignoring `revokedAt`\n\nOne of these needed a second pass. \"Runner started on `no_active_authority`\" initially survived because I was only asserting that `claimNext` hadn't been called — too indirect. Switching to `service.status()` killed it and two more lifecycle mutants I added afterwards.\n\n# A red herring I checked before reporting\n\n`remote-target-runner.test.ts` shows **2 failures under a bare `bun test`** on unmodified `develop`. That is a wrong-runner artifact, not a defect: this directory has its own `vitest.electrobun.config.ts`, and under that config it is **39 pass / 0 fail**. Worth knowing if anyone else runs into it.\n\n# Evidence\n\n```\nbunx vitest run --config vitest.electrobun.config.ts src/remote-target-resume.test.ts\n  → 20 pass\n  with src/remote-target-runner.test.ts                → 59 pass across 2 files\nbun test src/remote-target-resume.test.ts              → 20 pass (green under both runners)\nbunx tsc --noEmit                                      → clean\nbunx @biomejs/biome check                              → clean\n```\n\nTests only — `git diff` touches no source file.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MSHMQFJ4SFDRFPZYMQQYC0\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T23:26:58.287Z\",\"completed_at\":\"2026-09-03T23:27:41.180Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T23:26:59.040Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"5f5b1ba2739cc75012f0457d8fb3b00869e0a776d8173a3d9460720ed7da1573\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"495c0977-5c5c-48d4-b0d8-b883e53e7e01\",\"object_id\":\"sha256:5f5b1ba2739cc75012f0457d8fb3b00869e0a776d8173a3d9460720ed7da1573\",\"sha256\":\"5f5b1ba2739cc75012f0457d8fb3b00869e0a776d8173a3d9460720ed7da1573\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"nmzBQtBDFsrM5Cm3uysozwJ5W_5_v8MG7GQR8dc92w43vyptcXpeuCOz-FKhZ4mJVGBKjFABjFl-1CWIcgTDAg\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"23:T1c10,"])</script><script>self.__next_f.push([1,"# What\n\n`siws-helpers.security.test.ts` covers one thing well: the uri/chainId binding, through `validateAndConsumeSIWS`. Nothing referenced **`parseSiwsMessage`** or **`validateSIWSMessage`** — the message parser and the signature validator that sit under it.\n\n# Evidence\n\nMutating each guard to a no-op, against the existing 4 tests:\n\n| mutant | before | after |\n|---|---|---|\n| **`if (!ok)` around `nacl.sign.detached.verify`** | **survived** | killed |\n| `pubkeyBytes.length !== 32` | **survived** | killed |\n| `signatureBytes.length !== 64` | **survived** | killed |\n| `parsed.domain !== expectedHost` | **survived** | killed |\n| expiration window check | **survived** | killed |\n| not-before window check | **survived** | killed |\n| `lines.length \u003c 7` | **survived** | killed |\n| header regex: drop the trailing `$` | **survived** | killed |\n| `SOLANA_ADDRESS_RE`: drop the trailing `$` | **survived** | killed |\n| `SOLANA_ADDRESS_RE.test(address)` → `false` | **survived** | killed |\n| required-field check → `false` | **survived** | killed |\n| `Number.isNaN(issuedAt.getTime())` → `false` | **survived** | killed |\n| statement heuristic `!line.includes(\":\")` → `true` | **survived** | killed |\n| `buildSiwsMessage`: `Version: 1` → `Version: 2` | **survived** | killed |\n| uri binding | killed | killed |\n| chainId binding | killed | killed |\n| header regex: drop the leading `^` | survived | **survived** — redundant, see below |\n\n**15 of 17 survived; 16 now die.** 4 → **36 passing**. `bun run --cwd packages/cloud/shared typecheck` → exit 0, biome clean.\n\nThe first row is the one I'd read first: **removing SIWS signature verification entirely broke nothing.** The existing tests all sign correctly, so `verify` returning `false` was never exercised. There are now three separate cases for it — a signature from a different keypair, a valid signature over different bytes, and a message tampered with after signing.\n\nSignatures throughout are real ed25519 over the real message bytes; nothing is stubbed, and this file needs no Redis at all.\n\n# Two parser behaviours worth pinning explicitly\n\n**The address pattern is anchored at both ends.** Drop the `$` and `\u003cvalid address\u003e!` parses as a valid address and is handed to `bs58.decode` as the signer identity. Also covered: a leading `0` (not in the base58 alphabet), a too-short string, a non-base58 alphabet, and an empty line.\n\n**A base58 string of the right shape can still decode to the wrong key length.** `bs58.encode(new Uint8Array(31).fill(255))` is 43 characters and passes the address pattern, so the explicit 32-byte check is doing separate work from the regex.\n\n**The statement heuristic is \"the line after the blank has no colon\".** A statement that legitimately contains a colon (`\"Sign in: to Eliza\"`) is therefore *not* read as a statement. That is the parser's actual behaviour, and the test records it as such rather than as an aspiration — so a future change to the heuristic is a visible decision with a failing test to update.\n\n# One thing I found and did not change\n\n`Expiration Time` and `Not Before` are parsed with `new Date(...)` and never checked for `NaN`. Both window comparisons are then false:\n\n```\n\"whenever\"  -\u003e getTime()=NaN   expired? (t \u003c= now): false   notYetValid? (t \u003e now): false\n```\n\nSo an **unparseable** expiry skips the window check rather than failing closed — unlike `Issued At`, which is explicitly rejected with `Number.isNaN` a few lines above.\n\nI did not change it, for two reasons. `siwe-helpers.ts` has the identical shape at its own `:159`/`:162`, so this is a shared design point across both sign-in paths rather than a SIWS-only slip — fixing one and not the other would be worse than fixing neither. And tightening a live auth window is a semantic change to authentication, which belongs in a deliberate PR of its own, not smuggled into a test-only one.\n\nWhat I did instead is pin the current behaviour with a test that says so in its name (`currently ignores an unparseable … rather than failing closed`). If you decide to add a NaN guard, that test fails and is the right place to record the new decision.\n\nPractical impact looks limited — the message is signed, the nonce is single-use, and `Issued At` is still validated — but a client can emit a message whose expiry is silently unenforceable, and nothing says that is intended.\n\n# One survivor left deliberately\n\nThe leading `^` in the header regex is redundant: `(.+?)` requires at least one character, so the leftmost match already begins at index 0. Executed across five header shapes — well-formed, prefixed, empty-domain, trailing-text, and no-domain — the captured domain was **identical in 5 of 5** with and without it. It is correct and worth keeping as documentation of intent; a test would be asserting a branch that cannot differ.\n\n# Suite note\n\n`bun test packages/cloud/shared/src/lib/utils/` reports 5 failures both with and without this file (347 → 379 tests, same 5 names). They are pre-existing logger-redaction failures on `origin/develop`, unrelated to SIWS.\n\n# Scope\n\nNew test file only — no production code touched.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1M9PRSDT3V4YKHF4S0F9JJN\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T18:50:09.069Z\",\"completed_at\":\"2026-09-03T18:51:29.345Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a21 , not a failed assertion — which makes the interesting cases the ones where two objects are jsonb-equal without being `===`, and the ones where they merely look equal.\n\n# Evidence\n\nMutating each guard to a no-op, against `roles.role-write-cas.test.ts`:\n\n| mutant | before | after |\n|---|---|---|\n| `Number.isSafeInteger(value) \u0026\u0026 value \u003e= 0` → `typeof value === \"number\"` | **survived** | killed |\n| drop `value \u003e= 0` | **survived** | killed |\n| collapse `malformed_revision` / `revision_mismatch` to one reason | **survived** | killed |\n| drop `delete incoming.roles` | **survived** | killed |\n| drop `delete incoming.roleSources` | **survived** | killed |\n| drop the `[REVISION_KEY]: storedRevision` pin | **survived** | killed |\n| `MAX_SAFE_INTEGER` exhaustion guard → `false` | **survived** | killed |\n| invalid-current-revision guard → `false` | **survived** | killed |\n| audit `Array.isArray(prior) ? prior : []` → `prior ?? []` | **survived** | killed |\n| drop the forced `0` in `initializeWorldMetadataRevision` | **survived** | killed |\n| drop the array length check | **survived** | killed |\n| drop the left-side `undefined` filter | **survived** | killed |\n| drop `leftKeys.length !== rightKeys.length` | **survived** | killed |\n| `Array.isArray(left) \u0026\u0026 Array.isArray(right)` → `false` | **survived** | killed |\n| `undefined` revision → `null` instead of `0` | killed | killed |\n| `storedRevision !== writerRevision` → `false` | killed | killed |\n\n**17 of 19 survived before; all 17 now die,** and the 2 the existing suites already caught still die. 12 → **54 passing** across both files. `packages/core` typechecks, biome clean, `bunx vitest run packages/core/src/database/` → 17 files, 148 passed.\n\n# The ones worth naming\n\n**The revision helpers' fail-closed signal was untyped.** `getWorldMetadataRevision` returns `null` for anything that isn't a non-negative safe integer, and callers turn that `null` into a thrown stale write. With only `typeof value === \"number\"` surviving, a float, a negative, an infinity or `NaN` would all have been used as a counter. Eight rejected shapes are now pinned, plus `MAX_SAFE_INTEGER` as an accepted one.\n\n**Both stale-write reasons are diagnoses, not decoration.** `revision_mismatch` means someone raced you; `malformed_revision` means the stored row itself is wrong. Collapsing them survived, so the tests now assert the `context` payload, not just that something threw.\n\n**The subset/superset case is what the key count exists for.** Every *left* key can be present and equal on the right while the right has more — so without comparing counts, `{a:1}` and `{a:1,b:2}` compare equal. On a CAS comparison that is precisely a lost update. Both directions are now asserted, along with `{}` against `{a:1}`.\n\n**`delete incoming.roles` matters only when the stored world has none.** The comment above it says an incoming owner-only projection built during message ingestion must never replace stored authority state. When stored *has* a role map, the restore spread below also protects it — so the case that isolates the delete is a stored world with no role map at all, for both `roles` and `roleSources`.\n\n# Two survivors left deliberately\n\nBoth are redundant rather than uncovered, and I'd rather say so than write a test that asserts nothing:\n\n- **The explicit `...(stored.roles === undefined ? {} : { roles: stored.roles })` restore.** `stored.roles` already arrives via `...stored`, and `...incoming` cannot override it because `incoming.roles` was just deleted. Executed across three incoming shapes (with roles, without roles, empty), the merged result is byte-identical with and without the clause.\n- **`Object.hasOwn(right, key)`.** Every surviving `leftKey` has a defined value (the filter above removed the rest), so a key absent from `right` yields `right[key] === undefined` and fails the recursive comparison anyway. Executed across eight object pairs — including same-count-different-keys, subset/superset, prototype-named keys and both-undefined — `hasOwn` changed the verdict in **0 of 8**.\n\nNeither is wrong, and both are cheap defence in depth on a lost-update path; I'd keep them. But a test \"covering\" them would be asserting a branch that cannot be reached, so I left them and named them here instead.\n\n# Scope\n\nNew test file only — no production code touched.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1M814QGPBARMAC7RT6039RY\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T18:20:51.824Z\",\"completed_at\":\"2026-09-03T18:22:01.494Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T18:20:52.463Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"7d48add59eb416e7955abd63d60e5269da451cda19e4b5812ae206a083ed0929\",\"trace_upload\":{\  — it would send a caller down a \"user refused\" path when the truth is a broken runtime. Meanwhile `updateDynamicRules` runs on startup paths, so a throw there would take down the service worker on a browser that doesn't expose `declarativeNetRequest`. Both mutants (making the request return `false`, making the rule update throw) now fail.\n\nEach test stubs `chrome` with only the surface that case needs, so an accidental reach for another API throws rather than quietly passing.\n\n# Three specifics worth calling out\n\n**The origin patterns are exact.** `hasAllUrlHostPermission` asks for `[\"https://*/*\", \"http://*/*\"]` — deliberately *not* `\u003call_urls\u003e`, which would additionally cover `file://` and `ftp://`. Substituting `\u003call_urls\u003e` is now a failing mutant.\n\n**A denied request is re-checked.** Chrome can answer `false` to `permissions.request` while the permission is in fact already held; both helpers fall back to the `contains` check. All four combinations are covered, including that **no** re-check happens when the request already succeeded (so an unnecessary second call can't creep in).\n\n**World separation is load-bearing.** `executeContentScriptFiles` injects `world: \"ISOLATED\"`; only `executeScriptInMainWorld` uses `\"MAIN\"`. Injecting a content-script file into MAIN would expose it to page JavaScript and to anything the page has already patched onto its own globals. Swapping either world is a failing mutant.\n\n# Mutation testing: 17 mutants, 17 killed\n\nNo survivors.\n\n- both fail-open mutants (`hasAllUrlHostPermission`, `isIncognitoAccessAllowed` returning `true` when unavailable)\n- `\u003call_urls\u003e` substituted for the explicit scheme pair\n- every `getGrantedOrigins` normalization step removed individually — type filter, trim, blank filter, sort\n- the post-denial re-check dropped, and separately made unconditional\n- `ISOLATED` → `MAIN`, and `MAIN` → `ISOLATED`\n- `results[0]` → last frame (an iframe result silently replacing the top frame's)\n- request-unavailable throw → `false`; scripting-unavailable throw → no-op\n- the two deliberate tolerant paths (`updateDynamicRules`, `getExtensionUrl`) turned into throws\n\nOne deliberate non-assertion: `getGrantedOrigins` **keeps duplicates**. The browser is the source of truth for that list, and silently collapsing it would hide a real duplicate-grant condition from a caller comparing sets. That's asserted as intended behaviour rather than left ambiguous.\n\n# Evidence\n\n```\nbunx vitest run src/webextension.permissions.test.ts   → 26 pass\nbunx vitest run src/                                   → 173 pass across 20 files\nbunx tsc --noEmit                                      → clean\nbunx @biomejs/biome check                              → clean\n```\n\nTests only — `git diff` touches no source file.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MS106HXRKCT8S44VS1D1BN\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T23:17:52.977Z\",\"completed_at\":\"2026-09-03T23:18:32.647Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d45 ated URL stays its own entry.** Reloading is a real navigation; collapsing it would desynchronize the index from the user's Back count.\n- **The array is replaced, not spliced in place.** Callers snapshot `history`; an in-place mutation would retroactively change a snapshot they already hold. That mutant is now a failing test.\n\n# The tab projection\n\n`cloneWebBrowserWorkspaceTabState` is an allowlist projection of nine fields. The runtime state it projects *from* also carries `dom` — a **live JSDOM window** — plus `history`, `historyIndex` and `loadedUrl`.\n\nA spread instead of an explicit field list would drag that window into serializable tab state, making it unserializable and pinning the whole document in memory. The test asserts the exact key set, that none of the four runtime fields survive, and that the result actually round-trips through `JSON.stringify`.\n\n# An assumption of mine that the tests corrected\n\nI first wrote a test asserting `type=\" radio \"` is accepted, on the strength of the guard's own `trim().toLowerCase()`. It's refused — and that's right. The DOM's `.type` IDL getter resolves an unrecognised keyword to `\"text\"`, so that element genuinely *is* a text input.\n\nI rewrote it as two tests: an uppercase `type=\"CHECKBOX\"` is accepted (the IDL getter lowercases recognised keywords), and a padded attribute is refused, with the assertion `expect(input.type).toBe(\"text\")` making the reason explicit. Worth knowing: **the guard's own `trim()`/`toLowerCase()` never changes the outcome for a real DOM** — it only matters for a hand-rolled element-like object. I've left it alone; it's harmless and the intent is clear.\n\n# Also pinned\n\n- **Both type-guards, in both directions.** `ensureBrowserWorkspaceCheckboxElement` rejects a text/submit/hidden input — which matters because a text input has a `.checked` property that silently accepts writes and does nothing, so a loose guard fails invisibly at runtime. It also rejects non-input tags carrying `type=\"checkbox\"`.\n- **Each guard names the subaction that asked**, across all six control subactions.\n- **`setBrowserWorkspaceControlValue` writes the `value` attribute, not just `.value`.** `.value` alone is invisible to `outerHTML`, so a page snapshot or re-parse would lose whatever the agent typed. It mirrors into `textContent` for a textarea (whose serialized content is its text node) and must *not* do so for a select — both directions asserted.\n\n# Mutation testing: 16 mutants, 16 killed\n\nNo survivors. Including: each accepted tag dropped from the control guard; the checkbox guard losing its tag check, losing `radio`, or accepting any type; the subaction dropped from both error messages; the `value` attribute not set; textarea mirroring removed, and applied to every control; the clone spreading the runtime object; the clone dropping a field; history append-only; history slice off by one; history mutated in place; and the index not advanced.\n\n# A hunt that found nothing, reported for completeness\n\nBefore this I re-ran the defect class from #30480 (`getTweetsWhere` dropping an `await`): swept for async callbacks passed to `.filter`/`.some`/`.every`/`.find` (zero hits), then extracted both function bodies for every exported singular/plural pair in the repo and diffed them for `await` asymmetry. Nineteen pairs don't delegate; the two flagged are the ordinary sync-singular/async-plural shape, not the bug. Clean negative.\n\n# Evidence\n\n```\nbunx vitest run src/workspace/browser-workspace-forms.test.ts   → 23 pass\nbunx vitest run src/workspace/                                  → 108 pass across 14 files\nbunx tsc --noEmit                                               → clean\nbunx @biomejs/biome check                                       → clean\n```\n\nTests only — `git diff` touches no source file.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient IXPjBg1jK1AgziYpCA\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"27:T683,"])</script><script>self.__next_f.push([1,"Closes #30246.\n\n## What changed\n\n- replaces four silent real-PostgreSQL rollback catches introduced by #29927\n- brings both client connections under the same protected lifecycle as proof and teardown\n- waits for partial/late connection settlement, never runs the proof after a connection failure, and still attempts both client closes\n- settles writer rollback before independently closing both clients\n- preserves the original proof/connection failure and aggregates ordered rollback/client-close failures\n- adds deterministic primary-only, teardown-only, combined-failure, and late-writer/observer-connect-failure regressions\n\n## Evidence — exact head `4d48b9fd5683498e13610abb948b97440d015919`\n\n- normally merged current `develop` `c5e7bab9c8a42f8bf3a3fd50530ae5f5dd08d655`, without conflict or force-push\n- PR delta remains exactly one PostgreSQL capacity test file (`+249/-24` vs `develop`)\n- local non-PostgreSQL lane: 4 pass, 5 expected skips, 0 fail\n- real PostgreSQL 16 via Colima: 9/9 pass, 28 expectations, 0 skip\n- `bun run --cwd packages/cloud/shared typecheck`: pass\n- Biome on the changed file: pass\n- `git diff --check`: pass\n- two independent exact-head audits: CLEAN; the prior partial-connect leak is closed and no scope outside #30246 was added\n- hosted [PR Static Smoke run 33799002255](https://github.com/elizaOS/eliza/actions/runs/33799002255): source static smoke, subscription authority PostgreSQL, billing replay, Windows security, and `All Tests Passed` all green at the exact head\n\nThe previously requested partial-connect, current-base, real-PostgreSQL, and hosted-CI gates are addressed. External exact-head re-review remains welcome.\n"])</script><script>self.__next_f.push([1,"28:T1a3e,"])</script><script>self.__next_f.push([1,"# What\n\n`usage_records.input_tokens` and `output_tokens` are `integer` columns, so Postgres types `sum()` over them as **bigint**. Eleven aggregates in `usage-records.ts` narrowed that result straight back to `::int`:\n\n```sql\ncoalesce(sum(\"input_tokens\"), 0)::int\n```\n\nOnce the summed total crosses 2,147,483,647 the cast raises `integer out of range` (SQLSTATE `22003`) and the query fails outright. Every date window on the affected methods is **optional**, so a call that omits one sums the organization's entire history — and from then on the failure is permanent rather than transient.\n\nFive methods are affected: `getStatsByOrganization`, `getUsageTimeSeries`, `getUsageByUser`, `getProviderBreakdown`, `getModelBreakdown`, plus all three query arms behind `getCostBreakdown`.\n\nSame class as #30291 / #30461, which fixed it for `TrajectoriesService.getStats`. I found this while reviewing that PR.\n\n# The change\n\n- The eleven token aggregates become `::bigint`.\n- Each is converted at the TypeScript boundary with `Number(...)`, which is the idiom this file already uses for its `::numeric` `totalCost` cells (`totalCost: Number(row.totalCost || 0)`). For the token totals I used `?? 0` rather than `|| 0`, because a bigint cell arrives as a **string** and `\"0\" || 0` evaluates to the string `\"0\"`.\n- `count(*)::int`, `count(*) filter (...)::int` and the `::numeric` / `::float` casts are untouched — those are bounded by row count, not by row values.\n\n# Evidence\n\nThe regression suite is real: the actual repository SQL runs against in-process PGlite using this package's existing pattern (`DATABASE_URL=pglite://memory`, dynamic import of `db/client` and the repository, hand-rolled minimal DDL including the two generated `canonical_*` columns the breakdowns group on, and a trailing loud guard so the database cases can never pass vacuously).\n\n**On unmodified `develop`, four of the suite's database cases fail with `22003`.** With the fix, 8 pass / 0 fail.\n\nMutation-tested by reverting each widened cast to `::int`, one at a time:\n\n| aggregate | result |\n|---|---|\n| `getStatsByOrganization` input / output | killed / killed |\n| `getUsageTimeSeries` input / output | killed / killed |\n| `getUsageByUser` input / output | killed / killed |\n| `getProviderBreakdown` combined | killed |\n| `getModelBreakdown` combined | killed |\n| `getCostBreakdown` model / provider / generic arms | killed / killed / killed |\n\n**11 of 11.** The first draft of the suite left `getModelBreakdown` and `getCostBreakdown` uncovered — two mutants survived and I added cases (including all four `getCostBreakdown` dimensions) until they didn't.\n\nOther checks: `packages/cloud/shared/src/db/repositories/` under `--isolate` → **1113 tests across 103 files, 0 fail**. Package typecheck clean. `biome check` clean.\n\n# A correction to something I said on #30461\n\nWhile reviewing that PR I told the author that `getUsageTimeSeries` was safe here \"because it always requires both dates, so it is bounded\". **That was wrong**, and this branch proves it: the ceiling is on the summed total, not on the time span, so any window wide enough to cover 2^31−1 tokens overflows identically. The test for it uses a two-hour window and fails on `develop` like the rest. A required window is not a bound.\n\n# What this suite cannot prove, stated plainly\n\nThe `Number(...)` conversions are **not** verified by the PGlite cases. I found this by mutation — removing them changed nothing — and then checked why rather than assuming the assertions were adequate:\n\n- PGlite returns a bigint cell as a JS `number`, so `typeof … === \"number\"` passes with or without the conversion.\n- node-postgres, which production actually runs, returns int8 as a **string** and int4 as a number.\n\nSo the conversions are required in production and structurally unverifiable in this harness. Rather than leave that as a comment I pinned the driver fact as an executable test:\n\n```ts\nexpect(typeof pgTypes.getTypeParser(20)(\"2400000000\")).toBe(\"string\");\nexpect(typeof pgTypes.getTypeParser(23)(\"42\")).toBe(\"number\");\n```\n\nThat keeps the *reason* those conversions exist runnable, and it fails if the driver's defaults ever change. It is still not the same as exercising the real path — if you would rather have that, it needs a Postgres-backed integration lane, which I did not add here.\n\nOne design note: `sql\u003cnumber\u003e` now describes a cell that arrives as a string before conversion. That inconsistency already exists in this file for `::numeric`, so I matched it rather than introducing a second convention in a bug-fix PR. Happy to retype these as `sql\u003cstring\u003e` in a follow-up if you'd prefer the type to be literal.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MG6GYE115BD3WZBT8DJ139\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T20:43:36.782Z\",\"completed_at\":\"2026-09-03T20:44:21.261Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T20:43:37.440Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"d2663703918d640c486d6384786c3044103222fff53f44b05a75d979b6cfb9f6\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"4c6e024d-8426-44f6-9721-ab9efffcdd1f\",\"object_id\":\"sha256:d2663703918d640c486d6384786c3044103222fff53f44b05a75d979b6cfb9f6\",\"sha256\":\"d2663703918d640c486d6384786c3044103222fff53f44b05a75d979b6cfb9f6\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"oybvT5WeSSN-5Ls2r-nQP-ZZ-fG66Z-AxXso8rmmt7EdareXlNHgV9yWqo2Kj_KTjX3z7zUozB3ITYmQUvYvDA\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"29:T1890,"])</script><script>self.__next_f.push([1,"# What\n\n`packages/cloud/shared/src/lib/storage/object-store.ts` is the gate that keeps a quarter-gigabyte failure dump out of a SQL text column, and it had **no tests**. Ten of its twenty-three exports were referenced by no test file in the repo.\n\nThis adds `object-store.inline-gate.test.ts` — 31 tests, mock-free; every case drives the real exports through `process.env`.\n\n# The claim worth asserting\n\n`byteLength` is **hand-rolled on purpose** — the comment says `TextEncoder.encode()` \"would transiently duplicate a 250 MB dump before the ceiling could reject or clamp it.\" That's the right call, but it means the counter is a second UTF-8 implementation, and its comment makes a specific claim:\n\n\u003e BMP code points and unpaired surrogates encode to three bytes; the latter matches TextEncoder's U+FFFD replacement behavior.\n\nSo the tests assert that claim **against `TextEncoder` itself**, not against hand-computed numbers: ASCII, Latin-1, Cyrillic, CJK, astral pairs, mixed widths, empty, a lone high surrogate, a lone low surrogate, a reversed pair, a high surrogate at the very end of the string (the `index + 1` off-by-one), and two adjacent surrogates of the same half.\n\n`byteLength` isn't exported. Rather than export it for testability, the tests recover its answer through the public surface — set the ceiling to 1024, pad the value past it, read `InlinePayloadTooLargeError.sizeBytes`, subtract the padding. No production change.\n\n# Mutation testing\n\nI mutated `object-store.ts` in 15 places and required each mutant to fail the suite. **15/15 killed.** Two rounds — the first round had three survivors, and each one taught me something:\n\n| survivor | why it lived | fix |\n|---|---|---|\n| pair-start upper bound `0xdbff` → `0xdfff` | a reversed `low+high` pair is `3+3` under both the original and the mutant | added `high+high` and `low+low`, which are 6 bytes originally and **4** under the mutants |\n| continuation lower bound `0xdc00` → `0xd800` | same reason | same case covers both halves |\n| `mode === \"inline\"` → a string that never matches | with nothing configured the function falls through to `storageConfigured() === false` **anyway**, so a broken inline branch was invisible | assert `inline` against *fully configured* storage, where the correct answer flips |\n\nThat third one is the one I'd flag to a reviewer: a `shouldUseObjectStorage` test written against an unconfigured environment proves nothing about the inline branch, because false is the answer either way.\n\nAlso killed: byte widths 1/2/3/4, the `1024`-byte env floor, `Math.floor` vs `ceil`, the `\u003e` vs `\u003e=` ceiling boundary, `=` in the segment alphabet, the `slice(0, 10)` UTC day, `SQL_HEAVY_PAYLOAD_STORAGE` winning over the legacy `HEAVY_PAYLOAD_STORAGE`, `r2`-without-a-bucket throwing instead of silently going inline, and the version filename segment.\n\n# Also pinned\n\n- **Bytes, not characters.** 400 astral characters are 1,600 UTF-8 bytes but only 800 UTF-16 units — a `.length` check would let that through the ceiling.\n- **The env floor.** `0`, `1023`, `-5000`, `not-a-number`, `NaN` and `Infinity` all fall back to 1 MiB; `1024` is honoured; `2048.9` floors to `2048`.\n- **The error contract**: `code`, `field`, `sizeBytes`, `maxInlineBytes`, and that the message names both the field and `SQL_HEAVY_PAYLOAD_STORAGE` so an operator knows the remedy.\n- **`safeSegment` as a path-separator barrier.** An organizationId of `../../other-org`, an objectId of `../../../etc/passwd`, a field of `a/b\\c` and a version of `v/1` still produce exactly **five** key segments. This is what keeps a hostile id from escaping its tenant prefix.\n- **The day segment is UTC**, asserted at `23:59:59.999Z` and `00:00:00.000Z` — a local-date key would move objects between days for half the world.\n\n# Evidence\n\n```\nbun test packages/cloud/shared/src/lib/storage/object-store.inline-gate.test.ts\n  → 31 pass / 0 fail\n\nbun test --isolate packages/cloud/shared/src/lib/storage/\n  → 79 pass / 0 fail across 7 files\n\nbun run --cwd packages/cloud/shared typecheck   → clean\nbunx @biomejs/biome check                       → clean\n```\n\n`object-store.ts` is byte-identical to `develop` after the mutation runs — `git diff` on it is empty. Tests only.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MN37V9VE7E0FXVS84JCHGF\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\  open outside staging;\n- **whether its signing key is dedicated** — `readStagingSessionSigningConfig` refuses a secret equal to `STEWARD_JWT_SECRET`, `STEWARD_SESSION_SECRET` or `ELIZA_SERVICE_JWT_SECRET`. The source comment explains why: that separation is the rollback boundary, so an older Steward-only verifier stays *cryptographically* unable to accept a QA token whose custom claims it cannot revalidate.\n\nNothing was pinning either.\n\n# The change\n\nOne new file, 33 tests, **no `mock.module` and no mocks of any kind**. This surface reaches no repository, so the module imports as-is — verified by probe before writing anything. That matters here: the sibling suites in this directory register process-global module mocks, and staying mock-free keeps this file out of that entirely.\n\nEach clause is asserted on its own rather than through one happy path:\n\n- **secret floor** — 31 rejected, 32 accepted, and length measured *after* trimming (`\"    \" + 31 chars + \"    \"` is 39 characters long and still rejected).\n- **key-id pattern** `/^staging-qa-v1-[A-Za-z0-9._-]{1,48}$/` — start anchor (`x-staging-qa-v1-…` rejected), end anchor, empty suffix rejected, 48 accepted / 49 rejected, and the punctuation set (`.`/`_`/`-` accepted; `/`, space, `:`, `+`, `%2f` rejected).\n- **dedication** — three separate cases, one per Steward secret, plus a fourth proving the comparison is made on trimmed values, plus a negative proving a merely shared *prefix* is not a collision.\n- **`isStagingSessionSigningConfigured`** — true/false, and a hostile env whose getter throws a `TypeError` proves the catch **re-throws** a non-configuration failure instead of silently reporting \"not configured\".\n- **enablement** — the happy path, then each of the four conjuncts flipped individually, then that the flag is the exact string `\"true\"` (not `\"TRUE\"`, `\"1\"`, `\"yes\"`, `\"on\"`, `\" true\"`).\n- **`StagingSessionEligibilityError`** — the `reason` is a structured field and the message stays generic, so it can be surfaced without disclosing which check rejected the subject.\n\n# Evidence\n\nMutation-tested against the gate. **16 mutants, 16 killed, 0 survivors:**\n\n| mutant | result |\n|---|---|\n| `secret.length \u003c 32` → `\u003c 0` | killed (3) |\n| drop the `!secret` presence check | killed (1) |\n| key-id regex: drop the `$` end anchor | killed (3) |\n| key-id regex: drop the `^` start anchor | killed (2) |\n| `{1,48}` → `{1,}` | killed (1) |\n| drop the `STEWARD_JWT_SECRET` comparison | killed (3) |\n| drop the `STEWARD_SESSION_SECRET` comparison | killed (2) |\n| drop the `ELIZA_SERVICE_JWT_SECRET` comparison | killed (2) |\n| compare collisions untrimmed | killed (1) |\n| collapse the `isConfigured` catch to an unconditional `return false` | killed (1) |\n| drop the `NODE_ENV === \"production\"` conjunct | killed (2) |\n| drop the `ENVIRONMENT === \"staging\"` conjunct | killed (2) |\n| drop the `STAGING_SESSION_EXCHANGE_ENABLED === \"true\"` conjunct | killed (2) |\n| drop the version conjunct | killed (2) |\n| `STAGING_SESSION_MAX_TTL_SECONDS` `60 * 60` → `60 * 61` | killed (1) |\n\nRuns:\n\n- new file alone → **33 pass / 0 fail**\n- `src/lib/auth/` under the runner's `--isolate` → **211 tests, 0 fail** (178 before this PR)\n- the package runner's **real ordinary batch 6** (computed via `buildTestBatches`, the batch these files actually land in), plus the new file → **165 pass / 0 fail**\n- `bun run --cwd packages/cloud/shared typecheck` → clean\n- `bunx @biomejs/biome check` → clean\n\n# What I did not cover, and why\n\nOnly the configuration gate. `validateStagingSessionBinding`, `loadExistingStagingSessionSubjectForMint` and `loadVerifiedStagingSessionUser` all reach `../../db/repositories`, so covering them means mocking that module — and in this directory that is a process-global `mock.module` registration. `loadVerifiedStagingSessionUser` in particular is a nine-clause fail-closed disjunction that deserves clause-by-clause tests; I left it for a follow-up rather than dragging a global mock into a file that currently needs none.\n\nOne thing worth flagging separately, found while working here and **not** changed by this PR: running `bun test packages/cloud/shared/src/lib/auth/` directly reports 14 failures, because `steward-client-cache-invalidation.test.ts` stubs `InMemoryLRUCache` with only a `delete()` method and that process-global registration wins over its sibling's complete stub. It is **not** a CI defect — `scripts/run-bun-tests.mjs` always passes `--isolate`, and I confirmed the real batch is green — but it does mean the obvious local command is misleading. Happy to open that separately if you want it addressed.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MDSHZZ9BVVXZ05D28WDH9Z\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T20:01:34.719Z\",\"completed_at\":\"2026-09-03T20:02:27.053Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T20:01:35.497Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"5ad438f1ef70eeec86a77b92ae08c6e57040235b32128c4cd7e49851f32df4e4\",\"trace_upload\":{\"authority\":\"https://api.slop.cash\",\"server_run_id\":\"c526159d-e067-4e28-910d-57a20d673a01\",\"object_id\":\"sha256:5ad438f1ef70eeec86a77b92ae08c6e57040235b32128c4cd7e49851f32df4e4\",\"sha256\":\"5ad438f1ef70eeec86a77b92ae08c6e57040235b32128c4cd7e49851f32df4e4\"},\"signature_algorithm\":\"ed25519\",\"device_public_key\":\"MCowBQYDK2VwAyEAQ4VxwVlmo7xGW8oMjbriZDR7aUEdM8QzYm7EPu2IZ-k\",\"device_key_id\":\"faebfacd1bd138c8d1c79df0405497e5a829d7f8df26b875f53140cb964cf089\",\"device_signature\":\"T0eUxKLsIJ7_TXa1aJNoQlLnNKNAmW56IzOCCHoISQJcRrEcTmUqcoPWrt-1WhxyjjO_SreL_YLBuKUhkDy7Dg\"}} --\u003e\n"])</script><script>self.__next_f.push([1,"2b:T1d5a,"])</script><script>self.__next_f.push([1,"# The defect\n\n`fetchWithTimeout` in `packages/agent/src/providers/media-provider.ts` spreads `init` and then overwrites `signal` with its own controller's:\n\n```ts\nconst controller = new AbortController();\nconst timer = setTimeout(() =\u003e controller.abort(), timeoutMs);\nreturn fetch(url, { ...init, signal: controller.signal })   // \u003c- init.signal discarded\n```\n\nA caller-supplied `AbortSignal` is silently dropped. A request the caller cancels **keeps running until the full timeout elapses** — 30s by default, 120s for audio, 300s for the Veo polling path.\n\nThis helper backs **every media provider in the file** — twenty-plus call sites across FAL, OpenAI, Google, xAI, Anthropic, ElevenLabs and Suno — and it had **no tests at all**. Neither did the fifteen provider classes; the two existing suites reference only the four factory functions.\n\n# The repo already knows the right shape\n\n`fetchWithTimeoutGuard` in `packages/agent/src/api/server-helpers-fetch.ts` — same package — chains the upstream signal properly, handling both the already-aborted case and a later abort. This change makes `fetchWithTimeout` mirror it:\n\n```ts\nconst upstreamSignal = init.signal;\nconst onUpstreamAbort = () =\u003e controller.abort();\n\nif (upstreamSignal) {\n  if (upstreamSignal.aborted) {\n    controller.abort();\n  } else {\n    upstreamSignal.addEventListener(\"abort\", onUpstreamAbort, { once: true });\n  }\n}\n\nconst timer = setTimeout(() =\u003e controller.abort(), timeoutMs);\nreturn fetch(url, { ...init, signal: controller.signal }).finally(() =\u003e {\n  clearTimeout(timer);\n  upstreamSignal?.removeEventListener(\"abort\", onUpstreamAbort);\n});\n```\n\n**No caller passes a signal today**, so this is a latent trap rather than an active outage, and behaviour is byte-identical when `init.signal` is undefined. I'm fixing it because the next caller to reach for cancellation would get silence, not an error.\n\nI deliberately did **not** adopt the guard's `TimeoutError` renaming — that would change what the providers' error boundary reports, which is beyond this fix.\n\n# Causal evidence\n\nRestoring `develop`'s implementation under the new suite fails three tests, and the mid-flight case takes the **full 30 seconds** — which is precisely the bug:\n\n```\n× honours a caller signal that is ALREADY aborted, without opening a request      5ms\n× honours a caller signal aborted MID-FLIGHT                                  30005ms\n× cancels well before the timeout would have fired                            30003ms\n\nTests  3 failed | 11 passed (14)\n```\n\n# Mutation testing: 8 mutants, 7 killed\n\n| mutant | result |\n|---|---|\n| already-aborted branch removed | killed |\n| upstream listener never attached | killed |\n| `clearTimeout` removed | killed |\n| timeout never armed | killed |\n| controller signal not passed to `fetch` | killed |\n| default `timeoutMs` changed | killed |\n| `removeEventListener` removed | killed |\n| `{ once: true }` dropped | **survived — redundant, see below** |\n\nThe listener-removal mutant only died after I made the leak *observable*. Asserting that `controller.abort()` doesn't throw was not enough: a stale listener aborting an already-settled controller is harmless. `getEventListeners(signal, \"abort\")` from `node:events` is what actually sees it, and the test now drives five sequential requests through one signal and asserts zero listeners remain.\n\n**The `{ once: true }` survivor is genuine redundancy, not a coverage hole.** If the listener fires, `once` removes it; if it never fires, the `finally` removes it. Either mechanism alone suffices, so no test can distinguish them. I'd keep both — the pair is what makes the \"reused signal\" case safe regardless of which way the race resolves.\n\n# The tests\n\n`media-provider.fetch.test.ts`, 14 tests, driven against a local HTTP server on an ephemeral port — the same approach `server-helpers-fetch.test.ts` uses for the sibling helper. No stubbed `fetch`, no network, no timing luck.\n\n- method, headers and body pass through unchanged\n- a **non-2xx response is not a failure** — the providers check `response.ok` themselves and read the error body, so rejecting here would hide their messages behind a generic network error\n- aborts once `timeoutMs` elapses; does **not** abort a request that finishes in time\n- the timer is cleared on success **and on failure** — `.finally` rather than `.then` is what makes the second one true, and a leaked timer in a long-lived agent accumulates one handle per provider call\n- the three caller-signal cases: already aborted (and the server is never reached), aborted mid-flight, and supplied-but-never-fired (which must still time out normally)\n- a caller abort resolves in well under the 30s timeout, proving it came from the caller and not the timer\n\nPlus three for `createMediaProviders`, which was also untested: it is **fail-fast and all-or-nothing** — the four factories are evaluated eagerly inside one object literal, so an unusable image slot aborts the bundle before audio, video or vision are constructed, and the image message is the one an operator actually sees.\n\n# Evidence\n\n```\nbunx vitest run packages/agent/src/providers/media-provider.fetch.test.ts   → 14 pass\n  with the existing media-provider suite                                    → 42 pass across 2 files\nbun run --cwd packages/agent typecheck                                      → clean\nbunx @biomejs/biome check                                                   → clean\n```\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MRBTHDWB0N6XQZQSXBWTJJ\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T23:06:19.053Z\",\"completed_at\":\"2026-09-03T23:07:01.268Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T23:06:19.794Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\ | **1 failed** (the defaults case now asserts the poll it is named for) |\n\n## Why the merged tests could not see the mutants\n\n- **Rank tiebreaker:** the #30330 test orders EMAIL (rank 1) ahead of MUSIC (rank 2) — but EMAIL also precedes MUSIC in the comparator's alphabetical fallback, so deleting the rank term leaves the expected order intact. The ranks now oppose alphabetical order, so only the tiebreaker can produce the asserted order.\n- **`execution_tier` guard:** the test written for it omitted `dedicatedAgentId`, so the shared-adapter short-circuit returned `null` first and the tier check never executed (attentionhead measured 0 executions across the suite). The repaired case passes `dedicatedAgentId` to bypass the short-circuit and answers the full switch path (detail, health, messages), so the tier check is the only thing between the fixture and a completed switch.\n- **Shared-adapter short-circuit:** previously masked symmetrically — with it deleted, the tier check still blocked the old fixture. The new case models the scenario the guard's own comment names: an older control plane that omits `executionTier`, with the switch path answerable, so the short-circuit is the only protection against an in-place switch.\n\n## Verification\n\n- `bun run --cwd packages/core test -- src/runtime/__tests__/action-tiering.test.ts` — 6/6 pass\n- `bun run --cwd packages/ui test -- src/api/client-cloud-handoff-target.test.ts` — 11/11 pass at `c1913b3fe9`\n- Each of the three mutants above re-applied at this head: exactly the intended test fails, nothing else\n- Package `typecheck` + `lint` for `packages/core` and `packages/ui`; root `bun run verify`\n- Full package lanes, with honest baselines: `packages/core` 11,398 passed with one external rate-limit flake (`evaluator-input-budget.test.ts`, passes 17/17 standalone at this head); `packages/ui` full lane shows 9 failing files in this environment, none touched by this diff — the same 4 fail identically on clean develop with this change stashed, and the other 5 are load-order flakes (fuzz/bench/navigation timing) that pass at baseline; `client-cloud-handoff-target.test.ts` itself passes 10/10\n\n## Test-only gate\n\n- **Realistic regression prevented:** reverting any of the three #30330 behaviour changes — retrieval order for equal-score parents, or either readiness-probe guard that stops a cloud handoff from \"switching\" onto a shared-tier runtime — currently leaves every suite green.\n- **Observing consumer:** the action surface ordering feeds tier-A parent selection in the runtime prompt loop; the readiness guards decide whether `startCloudAgentHandoff` switches the app onto a base that cannot host a dedicated runtime (user-visible as a dead post-handoff chat).\n- **Why existing coverage does not own it:** demonstrated by mutation above — the merged tests pass with the guarded lines deleted; the failure modes were documented publicly in the #30330 review and are reproduced, not asserted, here.\n\nRefs: #30330 (merged), attentionhead's review findings 1–2 there.\n\n\u003c!-- evidence-head:c1913b3fe9fec1067b54406c3134a6f00de18a5d --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before full-page screenshots: `N/A - test-only change; no rendered UI surface exists before or after.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] After full-page screenshots: `N/A - test-only change; no rendered UI surface exists before or after.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] Video walkthrough: `N/A - no user-facing flow changes; the deliverable is the mutation-kill matrix below.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs show the real suites at this head:\n\n```text\n$ bun run --cwd packages/core test -- src/runtime/__tests__/action-tiering.test.ts\n Test Files  1 passed (1)\n      Tests  6 passed (6)\n\n$ bun run --cwd packages/ui test -- src/api/client-cloud-handoff-target.test.ts\n Test Files  1 passed (1)\n      Tes
