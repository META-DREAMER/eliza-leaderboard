\n\n## What does this PR do?\n\n### ChatView.tsx\n\n- **`fetchOlder` dep array**: `conversationMessages` was a dep of `fetchOlder`\n  but changes on every streaming token, giving `fetchOlder` a new identity per\n  token and disturbing `useConversationRenderWindow`'s memoization. Fix: mirror\n  the value in `conversationMessagesRef`; read from the ref at call-time; remove\n  `conversationMessages` from deps.\n- **Stable composer callbacks**: `onAttachImage`, `onChatInputChange`, `onSend`,\n  and `onToggleAgentVoice` were inline arrows re-created on every render. These\n  are passed to `ChatComposer` which is memoized; the inline arrows bust the\n  memo on every render. Extracted as `useCallback` with correct deps.\n- **`chatAttachmentStripItems` useMemo**: `chatPendingImages.map(...)` computed a\n  fresh array object every render. Memoized against `chatPendingImages`.\n\n### LogsView.tsx\n\n- `logEntryKey` uses a template literal (was concatenating with `+` three times\n  per entry on every reconcile pass).\n\n### PluginsView.tsx\n\n- **`gameNarrow`**: was `window.matchMedia(\"(max-width: 600px)\").matches` called\n  raw on every render. Replaced with `useMediaQuery()` which uses\n  `useSyncExternalStore` for a reactive subscription — exactly one listener, zero\n  per-render `matchMedia` calls.\n- **`installProgressLabel`**, **`toggleSettings`**, **`handleParamChange`**,\n  **`handleInstallPlugin`**, **`handleUpdatePlugin`**, **`handleUninstallPlugin`**:\n  wrapped in `useCallback` with correct dep arrays so the plugin-manager panel\n  and install-flow components see stable prop identities.\n- **`settingsDialogPlugin`**: `useMemo` over `[pluginSettingsOpen, nonDbPlugins]`\n  to avoid recomputing the derived plugin object on every render.\n\n### StreamView.tsx\n\n- Merged two consecutive `useAppSelector` calls into one `useAppSelectorShallow`\n  to produce a single Redux subscription instead of two, halving the selector\n  overhead on every store update.\n\n## What kind of change is this?\n\nImprovements (performance — no behaviour change visible to the user)\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n- `packages/ui/src/components/pages/ChatView.tsx` — `conversationMessagesRef`, `handleAttachImage`, `handleSend`, `handleToggleAgentVoice`, `chatAttachmentStripItems`\n- `packages/ui/src/components/pages/PluginsView.tsx` — `gameNarrow`, `handleInstallPlugin`, `handleUninstallPlugin`, `settingsDialogPlugin`\n- `packages/ui/src/components/pages/StreamView.tsx` — `useAppSelectorShallow`\n\n## Detailed testing steps\n\n1. Open the Chat view and send several messages while streaming is in progress —\n   verify the attachment strip, composer input, and voice toggle remain responsive\n   with no visible glitch.\n2. Open the Plugins view on a narrow viewport (≤600 px) — verify the connector\n   layout adapts correctly. Install and uninstall a plugin — verify the\n   install-flow notice and settings dialog behave as before.\n3. Open the Stream view — verify the status bar reflects live agent state.\n4. Open the Logs view — verify existing log entries render correctly with the\n   template-literal key.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:8c1e3609586a84a762947d7645ea76c31845bdd9 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] ![before-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-3/18345-before-mobile-chat.png)\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-3/18345-after-desktop-chat.png)\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] https://github.com/elizaOS/eliza/releases/download/pr-evidence-3/18345-walkthrough-audit.webm\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - client-side only change.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] N/A ification contract.\"*\n\n## What changed\n\n- **New**: `.github/workflows/classify-paths.yml` — reusable workflow that runs checkout + setup-node + `ci-path-gate.mjs` with fleet-aware runner routing and exports all 10 lane outputs.\n- **Refactored**: ci.yml, dev-smoke.yml, scenario-pr.yml, docker-ci-smoke.yml — their `changes` job now calls the reusable workflow via `uses:` instead of inlining ~30 lines of checkout/node/gate steps.\n- **Left as-is**: test.yml — its `changes` job runs co-located fleet-aware contracts (turbo cache, i18n, alias-read guard) that are specific to its post-merge role and cannot be extracted.\n- **New contract test**: `ci-classifier-dedup-contract.test.ts` — prevents regression by verifying consumer workflows use the reusable workflow and the reusable workflow exports all lanes at both `workflow_call.outputs` and `jobs.classify.outputs`.\n- **Classifier self-skip fix (review round 2)**: added `.github/workflows/classify-paths.yml` to every CONFIGS rule set so a classifier-only diff triggers all consumer lanes — previously the centralized workflow path mapped to zero lanes, letting a routing/output change skip every test.\n- **Adversarial regression test**: `ci-path-gate.test.mjs` now includes a `classifier self-registration regression` suite proving a classifier-only diff triggers all four configs' lanes.\n\n## Design decisions\n\n1. **Runner routing**: PR events use `ubuntu-24.04` (SPOF guard #13617/#8501). Non-PR events (push, schedule, dispatch) use the fleet-aware conditional so self-hosted runners can serve the classifier when the fleet is online — matching the routing dev-smoke and scenario-pr previously used.\n2. **Windows command-coverage contract**: opt-in via `run_windows_contract` input so only ci.yml pays for it.\n3. **workflow_call.outputs**: all 10 lanes (server, client, plugins, desktop, zero_key, cloud, android_aab, dev_smoke, docker, run_scenario_pr) are declared at both the `workflow_call` level and the job level. Without e workflow\" (GitHub Actions cannot share a single job across separate workflow files).\n3. ✅ **Runner routing mismatch** — dev-smoke and scenario-pr handle non-PR events where the old classifier used self-hosted runners. Restored the fleet-aware conditional so non-PR events can still use self-hosted runners when the fleet is online.\n\n## Acceptance criteria (from issue)\n\n- ✅ **Exactly ONE classifier contract** (reusable workflow) consumed by the rest.\n- ✅ **ci-path-gate.mjs still used** — no behavioral change to path classification.\n- ✅ **GitHub-hosted for PRs** — classifier stays on `ubuntu-24.04` for PR events (SPOF guard intact).\n- ✅ **Fleet-drain toggle intact** — `HETZNER_FLEET_ONLINE` conditional retained for non-PR events.\n- ✅ **`workflow_call` entries preserved** — classify-paths.yml has `workflow_call` trigger; all consumers retain their existing `workflow_call` entries for the scheduled exhaustive lane (#12342).\n- ✅ **Classifier self-registration** — changes to `classify-paths.yml` now trigger all consumer lanes.\n\nRelates to #14051 (Tier B path-classifier dedup slice).\n\n---\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `zai/glm-5.2`, `openai/gpt-5.6-sol`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Hermes Agent`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/eliza@0d1d208a157707c121caf9785f006d25cc0f83a7:packages/skills/skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n— [hermes/t3rpz]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"zai\",\"model\":\"glm-5.2\",\"client\":\"Hermes Agent\",\"skill_revision\":\"elizaOS/eliza@0d1d208a157707c121caf9785f006d25cc0f83a7:packages/skills/skills/contribute-to-eliza\"} --\u003e\n\n\u003c!-- evidence-head:c7e3fafd48a12972945f07a91096ccf3de46e001 --\u003e\n\n ched suites pass after sync (106/106, transcript below).\n- [x] A reviewer can confirm the change from the evidence attached below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `N/A - no contribution skill was loaded for this change`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop`; zero conflicts.\n- [x] `bun test --isolate` across the three onboarding suites — 106 pass, 0 fail.\n\n# Risks\n\nMedium, because it changes an authorization outcome — in the direction the code\nalready intended.\n\nThe Durable Object keeps its HTTP 500. Nothing about the transport contract\nmoves. What changes is that a typed failure now carries `code`/`context` in the\nbody, and the reader rebuilds the `ElizaError` from it, so the HTTP route's\nexisting `switch` on the code reaches the branch it was written for.\n\nThe parse is deliberately strict: a body without a **string** `code` produces\nthe same untyped `Error` as today. Nothing invents a code, so no failure can be\npromoted into an authorization outcome it did not raise.\n\n# Background\n\n## What does this PR do?\n\n`runOnboardingChat` has two execution paths. Locally it runs in-process and the\ninner `ElizaError` propagates untouched. In a Worker it goes through the\n`ONBOARDING_SESSIONS` Durable Object stub — and that boundary was lossy in both\ndirections:\n\n- the coordinator flattened every inner failure to `{ error: message }`, 500;\n- `readCoordinatorResult` discarded even that and rejected with a bare\n  `new Error(\"onboarding session coordinator failed (500)\")`.\n\nSo in production — the only place the stub is actually crossed — the four typed\nbranches at the HTTP boundary were dead code. `assertConfirmedContinuation`\nraises `ONBOARDING_TRUSTED_CONTINUATION_INVALID` for a forged or unauthenticated\nconfirm; the caller saw an untyped 500 and answered `internal_error`. A refused\nauthorization was indistinguishable from a crash, to the user and to whoever\nreads the logs.\n\nTwo halves, one seam:\n\n- **coordinator**: serialize `code` and `context` alongside the message when the\n  inner failure `isElizaError`. Status stays 500 — the DO does not get to decide\n  the caller's HTTP outcome.\n- **reader**: `parseCoordinatorFailure` treats the body as untrusted transport\n  input. Unreadable body, non-object, missing `error` string, or absent `code`\n  all degrade to the status-only `Error` exactly as before. Only a real string\n  `code` produces a typed rejection.\n\nThe route already branched on the code and never on the status, so nothing\ndownstream needed to change.\n\n## What kind of change is this?\n\nBug fix — a typed authorization outcome silently downgraded to a 500 in Worker\ndeployments.\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n`readCoordinatorResult` / `parseCoordinatorFailure` in `onboarding-chat.ts`,\nthen the `catch` in `OnboardingSessionCoordinator`, then the three tests in\n`onboarding-chat-coordinator-typed-failure.test.ts`.\n\n## Detailed testing steps\n\n```bash\nbun test packages/cloud/api/__tests__/onboarding-chat-coordinator-typed-failure.test.ts\n```\n\nThe tests drive a real turn through a stub that behaves like the DO boundary\n(JSON in, JSON out, 500 on inner failure), so the assertion is on the status the\nHTTP route actually produces — not on an internal call.\n\nMutation-proved. Disabling the typed rebuild in the reader\n(`if (failure?.code)` -\u003e `if (false \u0026\u0026 failure?.code)`):\n\n```\n(fail)  Review addendum (maintainer lane)\n\nVerified against merged #17914: no conflict. That fix keeps mutation lookups\nunscoped when the planner omits `grantId`, so an unscoped lookup hits the\naggregated feed including every external source. Dropping a junk `calendarId`\nproduces the *same* unscoped aggregate — it cannot re-hide external events;\nkeeping the junk is what hides them. `grantId` handling is untouched, and\n`\"all\"` is a real service sentinel meaning *no filter*\n(`CalendarRepository.ts:404,458,516`), so mapping it to `undefined` is\nbehavior-preserving.\n\nTwo defects found and fixed on the branch:\n\n1. `plannerWindowInputProvided` keyed off the **raw** presence of\n   `timeMin`/`timeMax`/`llmPlan.timeMin`/`llmPlan.timeMax`, so a partial or\n   reversed window still took the `resolveCalendarWindow(..., forSearch=true)`\n   branch → 30-day default, instead of the omitted-window branch's\n   `buildWideLookupRange` (−365d … +5y). Net effect: update/delete-by-title for\n   an event two months out silently became \"not found\" — and the branch's own\n   tests pinned that with `toBe(30 * 24 * 60 * 60 * 1000)`. Now gated on the\n   normalized pair (`plannerWindowUsable`), and those two tests assert the wide\n   range they should have.\n2. The `runtime.reportError(\"calendar:action\", …)` block exists specifically so\n   an operator can see which planner input the service rejected (its comment\n   cites the live 2026-08-09 swallowed `\"mode must be one of …\"`). Reporting the\n   *sanitized* values rendered a placeholder id or reversed window as `\"unset\"`,\n   deleting the evidence for the exact input class these sanitizers absorb. Now\n   reports raw for diagnosis and `effectiveCalendarId` / `effectiveWindow` for\n   what actually ran.\n\n```\nplugin-calendar tests: 56 files passed / 2 skipped; 530 passed / 4 skipped\nplugin-calendar typecheck: PASS\ntargeted Biome: PASS\n```\n\nRemaining known limitation (not blocking): the placeholder set is a token\nblocklist, so `\"primary-calendar-id\"`, `\"\u003ccalendar_id\u003e\"`, `\"calendar-1\"` still\npass through. The strictly better rule — matching how `connectorGrantIdDetail`\nworks — is to validate the planner's `calendarId` against the discovered\ncalendar set and drop it when it names no known calendar. Worth a follow-up.\n\n# Evidence Gate\n\nEvidence matches the exact commit reviewed.\n\u003c!-- evidence-head:62995822b4f5ab6d99d04c54dd49916db5661375 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - backend/action normalization only; no rendered UI changed.\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - backend/action normalization only; no rendered UI changed.\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - backend/action normalization only; no rendered UI changed.\n\u003c!-- evidence-row:backend-logs --\u003e\n\u003cdetails\u003e\u003csummary\u003eExact-head local verification receipt\u003c/summary\u003e\n\n```text\nplugin-calendar tests: 56 passed / 2 skipped; 530 tests passed / 4 skipped\nplugin-calendar typecheck: PASS\ntargeted Biome: PASS\nplugin-calendar build (JS/views/types): PASS\ngit diff --check: PASS\n```\n\nThe focused action-path regressions use the strict CalendarService window contract: one-sided and reversed bounds throw if they escape normalization, while the candidate proves feed/search/trip/update/delete receive complete ordered pairs or complete defaults.\n\u003c/details\u003e\n\u003c!-- evidence-row:frontend-logs --\u003e\nN/A - no frontend path changed or executed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\nN/A - no live model or provider credentials were used in this repair lane. The exact-head deterministic action tests supply planner-shaped details and cover the affected routing boundary; no synthetic transcript is represented as live-model proof.\n\u003c!-- evidence-row:domain-artifacts --\u003e\nN/A - no real calendar/provider state was mutated. The exact-head tests verify normalized reques tive row whose registered service exposes `isHealthy()` and reports `false` is demoted to `isActive: false` with a visible validation warning. |\n| Neither status consults `runtime.getSetting()` nor `DiscordService.isHealthy()` | Both are now consulted. `DiscordService.isHealthy()` (plugins/plugin-discord/service.ts:1779) checks `_loginFailed` and `client.isReady()`, so a caught login failure or unreachable gateway reports unhealthy. |\n| Discord init catches login failure, so invalid/unreachable gateway can still show configured+active | An invalid token can still show `configured: true` (a value is set in `getSetting`), but the row is `isActive: false` with a warning — configured+active can no longer both be reported for a dead gateway. `POST /api/plugins/:id/test` also now consults the same health surface (422 + `success: false` when unhealthy) instead of unconditionally answering \"Plugin is loaded\". |\n\nThe health gate is generic (`runtime.getService(pluginId)` + duck-typed `isHealthy()`), so Discord gets it today and any connector that exposes the same probe inherits it without catalog changes.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The catalog/status contract this implements is the one #18713 specifies.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-registry/src/api/app-plugins-routes.test.ts` — the eleven cases added for this contract, especially:\n\n- `keeps a live runtime miss unset even when process.env has the token` — the review's first adversarial case: live `getSetting() === null` + `process.env.DISCORD_API_TOKEN` present ⇒ `isSet: false`, `configured: false`, required-field validation error present.\n- `keeps a live runtime miss unset even when config.env and the saved entry have tokens` — the review's second adversarial case: live miss + tokens in both `config.env` and `plug
