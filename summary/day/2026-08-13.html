nner;\n  - the claim document and real inbound message persist under distinct IDs;\n  - stale reclaim increments the CAS revision and changes the lease token;\n  - a fenced owner cannot commit a terminal transition.\n- `bun run check:agents-claude` — pass\n- Root `bun run verify` — pass: 350/350 Turbo tasks plus build/typecheck, dependency, secret, script-inventory, view-bundle, and focused-test audits.\n\nThe redacted live Meta sandbox round trip remains blocked by the existing expired Meta credential (OAuth 190/463). This PR must not claim that provider-visible proof until an authorized Meta operator rotates the token.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `zai/glm-5.2`, `openai/gpt-5.6-sol`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Hermes Agent`, `Codex Desktop`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `N/A - external lane (hermes-t3rpz)`; Codex GitHub review workflow\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Evidence Gate\n\n\u003c!-- evidence-head:f5a5dd980762bfae8a217fc2b71ee8d37878078a --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- N/A - backend connector service; no rendered UI surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- N/A - backend connector service; no rendered UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- N/A - non-interactive webhook/storage path; behavior is covered by real adapter tests.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [18892-pr18892-backend-v2.txt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-8/18892-pr18892-backend-v2.txt)\n\u003c!-- evidence-row:frontend-logs --\u003e\n- N/A - no frontend surface.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- N/A - claim/account routing occurs before and ] `bun run verify` passes post-sync → not run in this worktree; the exact substitute gates and the pre-existing unrelated failures are documented in **Known gaps / failures**.\n\n# Risks\n\n**Low–medium.** All changes are inside the cloud wake/provision wait in the typed client.\n\n- Failures that previously polled silently until the six-minute timeout now throw immediately as `CloudAgentWakeError`, including HTTP failures and resolved `{ success: false }` envelopes from resume, agent-detail reads, and job reads. Only status-less transport failures and explicit 500/502/504 infrastructure churn remain transient inside the bounded poll. Control-plane codes and `Retry-After` metadata survive both browser and native transports.\n- A fresh 202 create that reports a `jobId` now polls `/api/v1/jobs/:jobId` to terminal before the agent-detail wait. A backend that answers with a jobId but no job read endpoint would previously have been ignored; a transient job-read failure only ticks, and a create with no `jobId` (warm pool / sync create) is byte-identical to before.\n- `cause` is preserved on every typed error, so the join flow's `isCloudAgentGoneError` stale-binding recovery (404 + `agent_not_found`) continues to classify through the wrapper.\n\n# Background\n\n## What does this PR do?\n\nThe dedicated-agent wake wait (`waitForCloudAgentRunning`) swallowed every resume and status-read failure (`.catch(() =\u003e null)`), so auth expiry (401), credit exhaustion (402), a deleted agent row (404), lifecycle conflicts (409), and worker/capacity outages (503) all rendered as the same \"Starting your agent…\" spinner until a generic six-minute timeout. The fresh-create path also received the backend's provisioning `jobId` on the 202 response and hardcoded it away (`jobId: \"\"`), reducing a failed provision to that same opaque timeout instead of the job row's recorded failure reason.\n\nThis PR repairs the state machine at the API-client layer:\n\n- **`CloudAgentWakeError`** — typed error with `phase` (`resume` / `status-poll` / `provision-job` / `failed` / `timeout`), the HTTP `status` of the underlying control-plane failure, `retryAfter` (seconds, from the backend's Retry-After header or error body) when sent, `lastObservedStatus`, and the `agentId`/`jobId` operator-safe correlation ids. Timeout messages now name the last truthful status, elapsed time, and the agent id — never a fabricated healthy state.\n- **Terminal failures surface immediately** from resume, detail, and job operations, whether the adapter rejects or resolves a `{ success: false }` envelope. Status-less network errors and explicit 500/502/504 responses remain transient; every other HTTP status is returned to the join boundary with preserved control-plane code and `Retry-After` metadata.\n- **The fresh-create `jobId` is preserved** through `parseDirectCloudAgentCreateData` and `createCloudCompatAgent`, and `selectOrProvisionCloudAgent` follows the canonical job (`getCloudCompatJobStatus`, `/api/v1/jobs/:jobId`) to a terminal state via the new exported `waitForCloudProvisionJob` before binding — a failed provision surfaces the job's real reason (e.g. \"no provisioning worker available\") within one poll interval instead of six minutes of agent-detail polling.\n\nIssue acceptance coverage (client-state-machine items): typed phase/source exposure → public `CloudAgentWakeError.phase` + preserved `onProgress` vocabulary; jobId preserved and polled to terminal → `waitForCloudProvisionJob`; no swallowed rejected or resolved-failure resume/detail/job operations, with retry only for explicitly transient states → classifier + tests; truthful timeout with correlation id → timeout message carries last status, elapsed seconds, agent/job ids. The rendered-UI phase display, elapsed-time UI, safe sign-out escape, and real-staging E2E rows belong to the join page surface and gauss's acceptance lane and are **not** claimed here (see Known gaps).\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n- `packages/ui/src/api/client-cloud-wake-typed-errors.test.ts` — the new contract, both directions: each non-transient status throws typed immediately (with Retry-After carried from both transport error shapes), transient errors keep polling, a failed job surfaces its real reason with both correlation ids, and timeouts stay truthful.\n- `packages/ui/src/api/client-cloud.ts` — `CLOUD_WAKE_NON_TRANSIENT_STATUSES`, `CloudAgentWakeError`, `nonTransientWakeFailure`, `waitForCloudAgentRunning`, `waitForCloudProvisionJob`, and the create-branch hookup.\n\n## Detailed testing steps\n\nAutomated tests, all run at head `6699e53a656cd197e714b56b118f488cd6d84f19` after rebasing onto `4165571a`:\n\n```\n$ cd packages/ui \u0026\u0026 bunx vitest run \\\n+    src/api/client-cloud-wake-typed-errors.test.ts \\\n+    src/api/client-cloud-select-or-provision.test.ts \\\n+    src/api/client-cloud-connect-mock-cloud.test.ts \\\n+    src/api/client-cloud-web-join-base.test.ts \\\n+    src/api/client-cloud-direct-auth.test.ts \\\n+    src/api/client-cloud-provision-sandbox.test.ts \\\n+    src/cloud/join/lib/run-join-flow.test.ts --coverage.enabled=false\n Test Files  7 passed (7)\n      Tests  110 passed (110)\n```\n\nThe contract suite now covers rejected and resolved-failure envelopes, public barrel exposure, arbitrary terminal HTTP statuses, preservation of `agent_not_found`, real browser `Retry-After` header propagation, job failure correlation, transient polling, and truthful timeouts. Directly adjacent stale hostname fixtures introduced by the `eliza.app` domain consolidation were updated to the canonical origins.\n\n```\n$ bun run --cwd packages/ui typecheck\n# exit 0\n$ bun run --cwd packages/ui lint\nChecked 2946 files. No fixes applied.\n```\n\nA full `packages/ui` test run completed with 9,907 passing, 7 skipped, and 46 failures across 21 files. Those failures are current-base issues outside this change, predominantly stale `elizacloud.ai` expectations after #19078 plus unrelated view/action baselines; none are in the seven wake/join suites above.\n\nNot verified here: live staging `/join` runs (real Magic-Link auth is gated; gauss owns the real-browser acceptance on #18463), and the root `bun run verify` aggregate (see Known gaps).\n\n## Review follow-ups (second pass)\n\nThree defects found in review of the first pass are fixed here:\n\n1. **One deadline for the whole join.** `waitForCloudProvisionJob` and the `waitForCloudAgentRunning` that follows it each received the full `CLOUD_AGENT_WAKE_TIMEOUT_MS`, so a job completing at 5:59 handed a fresh six minutes to the status poll — up to twelve minutes, which is the literal complaint in #18463. `selectOrProvisionCloudAgent` now computes one deadline and passes the remaining budget to each wait.\n2. **408/429 are transient, and Retry-After is slept, not thrown.** `CLOUD_WAKE_TRANSIENT_STATUSES` treated every status outside 500/502/504 as terminal, so a single rate-limited or timed-out poll tick aborted an otherwise healthy join. 408 and 429 are now transient, and the `Retry-After` the classifier already extracted paces the next tick instead of decorating a thrown error.\n3. **The real `ElizaError`, not a guarded base.** `const WakeErrorBase = (ElizaError ?? Error)` was production code bending around a broken test stub: in the degraded mode `code`/`context` are dropped, so `isCloudAgentGoneError` returned false in fixture-e2e and true in production — the fixtures exercised a different class than users get. The `@elizaos/core` esbuild stub the `__e2e__` runners share now exports a real `ElizaError`, and `CloudAgentWakeError extends ElizaError` directly.\n\nNew coverage:\n\n- `client-cloud-wake-typed-errors.test.ts` — `CloudAgentWakeError` is an `ElizaError` carrying `code` + `context`; a 429 repare`/`execute`, an optional `simulate`/`simulation` member on `WalletChainHandler`, and a widened `WalletRouterExecution.status` union. `prepare`/`dryRun` semantics are byte-for-byte unchanged (the pre-existing test locking that behavior is untouched and green). The riskiest surface — anything that signs or broadcasts — is exactly what simulation is proven never to touch: test spies throw on `sendTransaction`/`sendRawTransaction`/`confirmTransaction` and on `VersionedTransaction.prototype.sign`, and the simulate paths resolve only the wallet public key. The financial-confirmation gate and the post-confirmation mode-forcing share one predicate (`requiresWalletFinancialConfirmation`), so a simulate request can never be upgraded to `execute`.\n\n# Background\n\n## What does this PR do?\n\nImplements the typed, non-broadcasting Solana simulation mode #16613 asks for, replacing fabricated dry-run metadata with a real RPC simulation for Jupiter swaps and pump.fun buys:\n\n- **Before:** `WalletBackendService.routeWalletAction` returned a fabricated `status:\"prepared\"` object built from static per-handler capability metadata for every non-bridge `prepare`/`dryRun` request — no chain handler call, no transaction, no RPC, nothing a user could trust as a preview (the defect pinned by the 2026-07-23 triage comment on the issue).\n- **After:** `mode=\"simulate\"` builds the **exact same real, unsigned transaction the execute path would sign and send** — the Jupiter quote + swap-tx build and the PumpPortal trade-local build are factored into shared helpers (`fetchJupiterSwapTransaction`, `fetchPumpFunTransaction`) used verbatim by both execute and simulate, so simulation can never drift from what execute submits — and runs it through `connection.simulateTransaction({ sigVerify: false, replaceRecentBlockhash: true })`, returning a typed `WalletRouterSimulation` (`success`, `err`, `logs`, `unitsConsumed`, quote/build `summary`).\n- An RPC-reported revert is a **typed `success:false` result** with `err`/`logs` — never a thrown error, never fabricated success. Transport/build failures throw typed errors exactly like the execute paths.\n- Handlers opt in via `simulate()` + `simulation` capability metadata (Solana `swap` and `pump_fun_buy` today); every other handler/subaction combination returns a typed `SIMULATION_UNSUPPORTED` router failure — never a silent fallback to `execute()` or to the `prepare` echo.\n- Simulation needs only the wallet **public key**: it never resolves a signing keypair or a `WalletBackend` signer (pump.fun simulate resolves `getAddresses().solana`, which works even for backends that cannot sign locally), and skips the pump.fun browser page-open side effect.\n- `mode=simulate` skips the financial-confirmation gate (nothing signs or moves), documented in the gate's header, and the action's `mode` parameter docs state simulate cannot authorize or lead to broadcast.\n\n## What kind of change is this?\n\nFeature (non-breaking, additive change which adds functionality), resolving a fabricated-success defect.\n\n# Documentation changes needed?\n\nDone in this PR: `plugins/plugin-wallet/CLAUDE.md` (mode paragraph, handler extension recipe, pump.fun path), byte-identical `AGENTS.md`, and `README.md` mode summary. `bun run check:agents-claude` passes (153 pairs byte-identical).\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-wallet/src/types/wallet-router.ts` (the new mode/types), then `services/wallet-backend-service.ts` (the simulate branch that replaces the fabrication for this mode), then `chains/registry.ts` (shared builders + `simulateSolanaSwap`/`simulatePumpFunBuy`), then the hard-invariant tests in `chains/__tests__/solana-simulation.test.ts`.\n\n## Detailed testing steps\n\n1. `cd plugins/plugin-wallet \u0026\u0026 bunx vitest run src/chains/__tests__/wallet-router.test.ts src/chains/__tests__/solana-simulation.test.ts src/security/__tests__/wallet-financial-confirmation.test.ts` → 31/31 pass.\n2. `bun run --cwd plugins/plugin-wallet test` (full package) → 286 passed, 1 pre-existing skip, 0 failed.\n3. `bun run --cwd plugins/plugin-wallet typecheck` (both tsconfigs) → clean.\n4. `bunx biome check` on all 9 touched source/test files and `bun run --cwd plugins/plugin-wallet lint:check` → clean.\n5. `bun run check:agents-claude` → PASS.\n6. `bun run verify` at repo root → exit 0.\n\n**Review follow-up (head 66c8715596)** — all findings from the 2026-08-13 review are repaired on this head, red-control first (4 failing tests against the prior head): (P1) `SolanaService` now fails closed on `mode=\"simulate\"` at every direct entry (`transfer`, `swap`, `executeWalletRouterAction`) instead of falling through to sign-and-send; (P2) read-only simulation can no longer generate/persist a wallet key — `resolveSimulationPublicKey` uses a new non-generating lookup and fails typed when no key exists, and the Jupiter builder takes the public key as a parameter so simulate structurally cannot reach `getWalletKey`'s auto-provisioning; (P2) `WalletRouterSimulation` now carries typed route legs plus requested/effective slippage bps, asserted for both venues; plus non-SOL input-mint coverage, the test-header invariant reword, and the compute-units phrasing fix. Branch rebased onto `develop@15c8bc849f`.\n\n**Exact-head P1 repair (head 66c8715596)** — dynamic Jupiter swaps now report the validated venue-applied `dynamicSlippageReport.slippageBps` from the swap-build response; quote slippage remains the effective value for fixed-slippage requests. The adversarial regression supplies deliberately different quote/report values (100/12) and asserts 12, while a fixed-slippage regression confirms quote behavior. No live evidence claim is added; the existing #19242/#19249 production-host blocker remains.\n\n**Red-control evidence** — the implementation subagent reverted all five production source files to their exact pre-implementation text (byte-verified), kept the new tests, and ran h `releaseReservation()`, which releases through the DO.\n- Non-blocking fix: 4xx client errors (not just 401/403) now release the reservation.\n\n### Blocking fix #2 — Title/body overclaim\n\n- Changed `Fixes #13115` → `Relates to #13115` (the issue stays open)\n- Corrected the title from \"atomic\" to \"via Durable Object\" — honest about the mechanism\n- Updated the file header docblock to describe the DO-backed architecture and the fallback path clearly\n\n### Non-blocking fix — Error response handling\n\nExtended reservation release to all 4xx responses (not just 401/403), so a 404/429/etc. does not needlessly hold the budget.\n\n## Tests\n\nAdded three new tests in the `Cross-isolate atomic egress quota (Durable Object path)` describe block:\n1. **Sequential commits — no lost update**: Two isolates each stream 5 bytes against a 20-byte budget; the committed total must reach exactly 10, and a third request for 15 bytes must be rejected.\n2. **Overlapping reservations — cross-isolate mutual exclusion**: Two concurrent requests against a 10-byte budget; exactly one succeeds and one is rejected before upstream fetch.\n3. **Sequential exhaustion**: Four 5-byte downloads exhaust a 20-byte budget exactly; fifth request is 429.\n\nThe test fake simulates cross-isolate shared storage by having multiple stub instances (simulating separate isolates) read/write the same backing store — proving the state-sharing invariant the old KV path violated.\n\n## Verification\n\n- Typecheck: clean on all changed files (`bunx tsc --noEmit` on cloud/api and cloud/shared)\n- Biome: clean on all 5 changed files\n- Existing tests preserved (they exercise the fallback path)\n\n```\n$ bun test packages/cloud/api/src/__tests__/hf-proxy-egress-quota.test.ts\nbun test v1.2.22\n\nCross-isolate atomic egress quota (Durable Object path):\n  Sequential commits — no lost update [PASS]\n  Overlapping reservations — cross-isolate mutual exclusion [PASS]\n  Sequential exhaustion [PASS]\n\n3 pass\n0 fail\n6 expect() calls\n\n$ bunx tsc --noEmit --project packages/cloud/api/tsconfig.json\n$ bunx @biomejs/biome check packages/cloud/api/src/hf-proxy-egress-gate.ts packages/cloud/api/src/route.ts packages/cloud/api/src/cloud-worker-env.ts packages/cloud/api/wrangler.toml packages/cloud/api/src/index.ts\nChecked 5 files in 12ms. No fixes applied.\n```\n\n\u003c!-- evidence-head:1924c5de4eee1eb3d7898cfc2d328d50e021b93a --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - cloud Durable Object infrastructure, no UI surface\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - cloud Durable Object infrastructure, no UI surface\n\u003c!-- evidence-row:walkthrough-video --\u003e\nN/A - cloud Durable Object infrastructure, no UI surface\n\u003c!-- evidence-row:backend-logs --\u003e\n```\n$ bun test packages/cloud/api/src/__tests__/hf-proxy-egress-quota.test.ts\nbun test v1.2.22\n\nCross-isolate atomic egress quota (Durable Object path):\n  Sequential commits — no lost update [PASS]\n  Overlapping reservations — cross-isolate mutual exclusion [PASS]\n  Sequential exhaustion [PASS]\n\n3 pass\n0 fail\n6 expect() calls\n\n$ bunx tsc --noEmit --project packages/cloud/api/tsconfig.json\n$ bunx @biomejs/biome check packages/cloud/api/src/hf-proxy-egress-gate.ts packages/cloud/api/src/route.ts packages/cloud/api/src/cloud-worker-env.ts packages/cloud/api/wrangler.toml packages/cloud/api/src/index.ts\nChecked 5 files in 12ms. No fixes applied.\n```\n\u003c!-- evidence-row:frontend-logs --\u003e\nN/A - cloud Durable Object infrastructure, no frontend\n\u003c!-- evidence-row:llm-trajectory --\u003e\nN/A - no model/trajectory changes (Durable Object quota enforcement, no LLM involvement)\n\u003c!-- evidence-row:domain-artifacts --\u003e\nN/A - cloud infrastructure hardening, no domain artifacts\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: yes\n\u003c!-- attribution-row:models --\u003e\n- AI provider/model: zai/glm-5.2\n\u003c!-- attribution-row:client --\u003e\n- Client / agent tooling: Hermes Agent\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill revision: N/A - no repository contribution skill used for this Durable Object quota enforcement\n\u003c!-- attribution-row:status --\u003e\n- Attribution status: self-reported\n\n— [hermes/t3rpz]\n"])</script><script>self.__next_f.push([1,"29:T5871,"])</script><script>self.__next_f.push([1,"# Fixes\n\nRelates to https://github.com/elizaOS/eliza/issues/18045 (kept open: the deployed staging create → first-send proof remains tracked by #18045; this PR delivers the independently mergeable client slice) — the **client slice** completing the first-shared-agent-turn warming contract. The server/API slice (stable machine codes, `Retry-After: 1`, durable `clientMessageId` claim/replay, narrowed e2e classifier) merged in #19078; this PR covers the client-side items that comment left open: bounded warming absorption in the send path and the terminal `insufficient_credits` mapping.\n\nShipped here, per the issue's \"Expected behavior\":\n\n- **The original send stays pending while the client absorbs only the structured warming responses.** The absorption lives at the request choke point (`ElizaClient.rawRequest`), so every browser consumer of the shared chat surfaces — messages REST, messages/stream, and the recovery/replay paths that route through it — gets the same behavior: a `503` whose body carries `code: agent_cache_warming` or `code: shared_runtime_cache_warming` waits the advertised `Retry-After` (clamped 250 ms–5 s) and re-issues the **byte-identical request**, so the same `clientMessageId` rides every retry and lands in #19078's idempotent claim/replay boundary. Budget: 4 re-issues **and** a ~5 s total-elapsed deadline across all warming waits (`WARMING_TOTAL_BUDGET_MS`) — an oversized `Retry-After` gets its wait clamped to the remaining budget instead of stretching to attempts × max-delay — matching the issue's \"four attempts / roughly five seconds\". The first warming wait also surfaces the existing `waking` turn status instead of stalled dots.\n\n**Review response (changes-requested, 2026-08-13):** `rawRequest` is now ONE bounded classification loop — every response, first attempt or any retry, re-enters the same 401/202/warming classifier, so the states compose in any order: a 202 that follows an absorbed warming 503 runs the full resume contract (no placeholder \"success\"), a 401 mid-sequence still gets its one refresh, and the refreshed token is written back so every later re-issue (warming or resume) carries it. The 402 classification `useChatSend` consumes moved out of `/join` into a domain-neutral `packages/ui/src/api/credit-gate-error.ts`; `/join` keeps only the welcome-bonus interpretation as a wrapper over that canonical classifier.\n- **The first non-warming response is surfaced immediately** — the loop exits on the first response that is not a named warming 503, success or failure.\n- **A generic/unstructured 503 is not retried** (`inference_unavailable`, cache outage, code-less 503s stay real failures), **and a 402 is never retried**.\n- **A terminal `code: insufficient_credits` JSON 402 now renders the existing out-of-credits turn** (banner + \"Add credits\" CTA, no Retry chip) instead of falling through `useChatSend` as a generic `provider_issue` Retry turn that re-hits the empty balance. The classifier is the same fail-closed 402 walk the /join surface uses (`describeJoinCreditGateError`), and the turn shows the server's own message.\n- **E2E covering the warm-up never becoming user-visible failures:** a new real-browser e2e (`test:warming-absorption-e2e`) mounts the production `useChatSend` → `streamChatEndpoint` → `rawRequest` pipeline + ChatOverlay with the server simulated at the transport boundary, replays the issue's exact staging sequence (`agent_cache_warming` 503 → `shared_runtime_cache_warming` 503 → streamed reply), and asserts the send stays pending with no Retry chip and no error notice until the reply lands — then asserts the 402 renders terminally.\n\nReachability: this is the production first-shared-agent-chat path — the user-visible new-user QA flow the issue reproduces on staging. The absorption sits in the shared browser client, so the deployed runtime's named warming codes from #19078 are consumed by exactly this code.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts — two product commits on `develop@b6d73a186ce`; the overlapping permission-fixture repair was omitted because #19201 is already merged.\n- [x] Focused package gates were run after sync (transcripts below). Root `bun run verify` was not run on this machine (multi-hour matrix); recorded in **Known gaps** — hosted CI covers it.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `claude-code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Rebased onto `origin/develop@b6d73a186ce`; zero conflicts; both product commits are patch-identical by `git range-diff`.\n- [ ] `bun run verify` post-sync: not run on this machine — see **Known gaps / failures**.\n\n# Risks\n\n**Low.** The warming loop triggers only on a `503` whose parsed body carries one of the two named codes — a shape no other server response uses — and is bounded ull pipeline.\n\n## Detailed testing steps\n\n```bash\nbun run --cwd packages/ui test src/api/client-base-warming-retry.test.ts src/api/client-base-resume.test.ts src/api/credit-gate-error.test.ts src/cloud/join/lib/join-credit-gate-error.test.ts src/state/useChatSend.test.tsx\nbun run --cwd packages/ui test:warming-absorption-e2e   # headless Chromium, screenshots + video\nbun run --cwd packages/ui typecheck\n```\n\n\u003cdetails\u003e\n\u003csummary\u003eFocused unit/component transcript (exact head 0f57c4ea)\u003c/summary\u003e\n\n```\n Test Files  5 passed (5)\n      Tests  116 passed (116)\n   Start at  14:11:47\n   Duration  14.47s\n```\n\n(includes the new #19186 CR suite — warming → 202 → 200 resume contract, warming → 401 → refreshed-token 200, 401 → warming with the refreshed token on the warming re-issue, abort during the post-warming 202 wait, the Retry-After clamp matrix `missing / \"1\" / \"0.25\" / \"-1\" / \"nope\" / \"\"`, and the oversized-Retry-After total-elapsed-budget cap — plus the new domain-neutral `credit-gate-error` unit file and the unchanged join wrapper suite.)\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eReal-browser e2e transcript (exact head 0f57c4ea)\u003c/summary\u003e\n\n```\n✓ optimistic user bubble renders on send\n✓ no Retry chip while the warming barriers are being absorbed\n  📸 01-pending-through-warming-503s.png\n✓ user bubble delivered exactly once (same clientMessageId across retries)\n✓ first non-warming response is the turn's reply\n✓ the warm-up never became a user-visible failure (#18045)\n✓ no error notice was raised for the absorbed warm-up\n  📸 02-reply-after-absorption.png\n✓ insufficient_credits renders terminal (no Retry chip that re-hits the empty balance)\n✓ the user bubble survives the 402\n  📸 03-credits-gate-terminal.png\n✓ no page errors (got: )\n  🎬 warming-absorption.webm\n\nPASS\n```\n\n\u003c/details\u003e\n\n# Evidence Gate\n\nSummary index (details and rendered media in the rows er-supplied **`clientMessageId` now enters a coordinator-owned durable claim/replay/conflict boundary** (per the exact-head review): the conversation Durable Object claims the key in transactional storage BEFORE any admission or provider dispatch and persists the terminal result BEFORE the response can leave the coordinator. A same-key retry (a lost response) **replays the stored result — no second admission, provider dispatch, reservation, or charge** — and a reused key with different text is rejected as a structured non-retryable `409 client_message_conflict` on every shared surface. Client-keyed turns also derive **deterministic billing identities** (`requestId`, `idempotencyKey`) from the key, so even a crash-and-retry re-execution replays one debit identity at the admission gate instead of opening a second charge. The id still becomes the bridge RPC id, so `turnMessageIds` stays stable too.\n- The cache-outage 503 gets the distinct code `agent_cache_unavailable`, and the e2e warming classifier (`isSharedRuntimeWarming`) now matches **only** the two named warming codes — a generic retryable 503 (`inference_unavailable`, cache outage, missing Worker binding) is a real failure again, not warming.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`) — two commits on `develop@9d54a097`.\n- [x] Focused package gates were run after sync (transcripts below). Root `bun run verify` was not run on this machine (multi-hour matrix); recorded in **Known gaps** — hosted CI covers it.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models -- ing identities), and tightens the e2e warming classifier so generic 503s are no longer classified as warming.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The contract is documented in-code where the codes are emitted and classified.\n\n# Testing\n\n## Where should a reviewer start?\n\n- `packages/cloud/shared/src/lib/services/shared-runtime/resolve-shared-agent.ts` — the authorization-scope barrier now returns `code: \"agent_cache_warming\"` + `retryAfterSeconds: 1`, and the outage path returns `code: \"agent_cache_unavailable\"`.\n- `packages/cloud/shared/src/lib/services/shared-runtime/shared-runtime-chat.ts` — the claim boundary (`SharedTurnClaimStore`, `claimSharedTurn`) runs before `admitTurn`; `admitTurn` derives deterministic `requestId`/`idempotencyKey` from the claim key; `complete` persists the terminal result after the durable history merge and before the response/done frame.\n- `packages/cloud/api/src/shared-runtime-conversation.ts` — the Durable Object owns the bounded claim ledger in transactional storage and translates conflicts to a structured 409.\n- `packages/cloud/api/__tests__/shared-agent-turn-idempotency.test.ts` — the real route → coordinator → Durable Object → chat service proof: cold create → first send → retry.\n- `packages/cloud/shared/src/lib/services/shared-runtime/shared-rest-adapter.ts` and `canonical-scoped-stream.ts` — caller-supplied `clientMessageId` becomes the bridge RPC id and the `params.clientMessageId` claim marker.\n- `packages/cloud/e2e/src/helpers/shared-runtime.ts` — `isSharedRuntimeWarming` matches only the two named codes; `shared-runtime.test.ts` beside it is the focused classifier suite.\n- The five route files render the code + `Retry-After` header on their 503s.\n\n## Detailed testing steps\n\nAutomated tests cover the contract:\n\n- Warming 503s carry `Retry-After` + t u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `claude-code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Rebased/merged onto the latest `origin/develop` (`a3ab08f382`); zero conflicts.\n- [ ] `bun run verify` passes post-sync, or the exact unrelated blocker is\n      documented in **Known gaps / failures** below. (Focused package gates run instead; documented below.)\n\n# Risks\n\n**Medium, deliberate.** With no durable writer available at all (a runtime where the store service failed to register AND no vault service exists), connector OAuth completion now fails closed with an actionable error instead of silently recording a connected account whose token dies at the next restart. Nothing loses the ability to connect: the store service now registers **unconditionally** — host vault when a durable bridge exists, state-dir PGlite vault otherwise — so hostless/standalone/Cloud boots gain a durable writer rather than losing the volatile one. On a headless host with neither OS keychain nor `ELIZA_VAULT_PASSPHRASE`, the vault write fails with `MasterKeyUnavailableError` (fail closed, actionable) rather than storing tokens that vanish on restart. Affected surfaces: OAuth credential persistence in plugin-google-workspace, plugin-github, plugin-slack, plugin-x, and plugin-calendar (Microsoft).\n\n# Background\n\n## What does this PR do?\n\nInstalls a durable connector credential writer on standalone/Cloud boot, using the durable pieces already in-repo, then deletes the volatile SECRETS writer from every connector's credential persistence path:\n\n- `ConnectorCredentialStoreService` (`packages/agent/src/services/connector-credential-store.ts`) now registers **unconditionally** (`packages/agent/src/runtime/eliza.ts`). It is backed by the host vault (`AgentHostBridge.sharedVault()`) when an embedding host installed a durable bridge, and otherwise by a state-dir PGlite vault (`createVault()` from `@elizaos/vault`, rooted at `ELIZA_STATE_DIR`) that the service opens itself. One vault per process (PGlite is single-writer). No topology flags — no `ELIZA_CLOUD_PROVISIONED` read, no `ELIZA_REQUIRE_DURABLE_CONNECTOR_CREDENTIALS`, no `volatile` opt-in, no per-plugin policy.\n- The `SECRETS` writer is removed from `resolveVaultWriters` in plugin-google-workspace, plugin-github, plugin-slack, and plugin-x, and from the Microsoft secret-backend/writer candidates in plugin-calendar — all five divergent copies in this same PR. `SECRETS` remains a **read-side** probe for refs written by older builds. With no durable writer available, `persistConnectorCredentialRefs` fails closed unconditionally: no ref recorded, no account marked connected.\n- `ConnectorAccountManager.completeOAuth` (`packages/core/src/connectors/account-manager.ts`) now persists a **terminal `failed` flow** when provider completion throws after the one-time state was consumed (review 4932167167 P1). The catch is scoped to the provider-completion call only — `upsertAccount` and the success-path `updateOAuthFlow` stay outside it, so a later account/success-state storage failure cannot relabel an already-connected account. The rethrow is a typed `ElizaError` (`code: CONNECTOR_OAUTH_COMPLETION_FAILED`, provider/flowId context, original failure on `cause`). Per review 4932872821 P1, the failed-state write is now required to return a **non-null** failed record: a `null` result and a throwing write are both treated as persistence failure, wrapped with the provider failure in one typed `ElizaError` (`code: CONNECTOR_OAUTH_FAILURE_STATE_PERSISTENCE_FAILED`, provider/flowId context) whose `cause` is the `AggregateError` — a bare `AggregateError` is never the thrown type. The **persisted public flow message is generic** (\"start the flow again\"); raw provider exception text stays on the thrown error's cause chain, never in the stored row. The `eliza.ts` store-start warning no longer claims a non-durable fallback — writes fail closed until the store is restored.\n- **Cloud durability contract (review 4932872821 P1):** `DockerSandboxProvider` (`packages/cloud/shared/src/lib/services/docker-sandbox-provider.ts`) now injects `ELIZA_STATE_DIR=/root/.eliza` — the `${volumePath}/eliza` bind mount, the same mount `PGLITE_DATA_DIR` and the pre-seeded `eliza.json` already live on — so the state-dir PGlite vault lands on the persistent agent volume instead of `/root/.local/state/eliza` in the container's writable layer. The per-launch `crypto.randomUUID()` `ELIZA_VAULT_PASSPHRASE` is replaced with a **stable per-agent master key**: read-or-created once at `${volumePath}/.vault-passphrase` (0600, 64 hex chars from `/dev/urandom` generated **on the node** — never derived from agent/org identifiers, never transiting a shell argument), so a replacement container over the same volume derives the same key and decrypts the vault it inherits. A caller-supplied `ELIZA_VAULT_PASSPHRASE` or `ELIZA_STATE_DIR` still wins; the read-or-create **fails closed** on an unusable persisted key rather than minting a fresh per-launch key. This covers existing (claimed) agent rows with no control-plane migration — the key lives with the volume the replacement flow already reattaches.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The behavior contract lives in the file headers of the touched modules and the regression tests.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/agent/test/connector-credential-durable.integration.test.ts` — the write → **real OS process restart** → read e2e over the real standalone entrypoint. Each phase spawns `startElizaProcess` (the same boot `bin.js start` runs) as a separate `bun` process sharing only a temp `ELIZA_STATE_DIR`; the restart is a genuinely new OS process. Runtime, plugin resolution, PGlite-backed plugin-sql adapter, the state-dir PGlite vault, and SQL ref storage are all real; nothing on the persistence path is stubbed and no Google HTTP endpoint is touched (no token-endpoint override of any kind).\n\nThe child fixture reads the token to persist through `runtime.getSetting(\"DURABLE_TOKEN_VALUE\")` — never `process.env` — and fails closed if the setting is absent. The parent seeds it into the state dir's `eliza.json` agent settings, the same channel as the Google client config, because `runtime.getSetting` deliberately never reads `process.env`. Spawn-env `GOOGLE_CLIENT_*` remains only for plugin selection (`shouldLoadGoogleWorkspace`), a documented collector seam.\n\nThen `plugins/plugin-google-workspace/src/connector-account-provider.writer-reject.test.ts` — the review-4932167167 P1 regression at the real manager→provider boundary: real `ConnectorAccountManager`, real Google provider, real `InMemoryDatabaseAdapter`; only the Google token-endpoint HTTP response is stubbed (successful exchange, so the failure under test is the writer). The registered durable store's `putSecret()` rejects; the first `completeOAuth` surfaces the typed error (`CONNECTOR_OAUTH_COMPLETION_FAILED`; the raw writer message rides `cause`, and the public message is generic) and the stored flow is terminal `failed` with the generic public message — not `pending`/errorless, and not raw provider text; the second completion with the same state hits the consumed-state guard. The two new review-4932872821 regressions live next to `completeOAuth` in `packages/core/src/connectors/account-manager.test.ts`: a throwing failed-state write and a null-returning one both produce the typed persistence-failure `ElizaError` (AggregateError as cause only).\n\nThen `plugins/plugin-google-workspace/src/connector-credential-refs.test.ts` — the fail-closed regression: with only the in-memory SECRETS service present, persistence rejects, no token material lands in SECRETS, and no ref is recorded.\n\n## Detailed testing steps\n\n```bash\n# durable write → real process restart → read, hostless AND ELIZA_CLOUD_PROVISIONED=1\nbunx vitest run --config packages/scripts/vitest/integration.config.ts \\\n  --coverage.enabled=false packages/agent/test/connector-credential-durable.integration.test.ts\n\n# P1 failed-flow regression: rejecting durable writer → terminal failed flow + consumed state\ncd plugins/plugin-google-workspace \u0026\u0026 bunx vitest run src/connector-account-provider.writer-reject.test.ts\n\n# completeOAuth unit coverage in core, incl. the review-4932872821 fail-state regressions\ncd packages/core \u0026\u0026 bunx vitest run src/connectors/account-manager.test.ts src/connectors/oauth-role.test.ts\n\n# provider stable-key lifecycle (real /bin/sh + real temp volumes; the exact SSH command)\ncd packages/cloud/shared \u0026\u0026 bun test src/lib/services/docker-sandbox-utils.test.ts\n\n# fail-closed + round-trip regressions\ncd plugins/plugin-google-workspace \u0026\u0026 bunx vitest run src/connector-credential-refs.test.ts\ncd plugins/plugin-github \u0026\u0026 bunx vitest run src/connector-credential-refs.test.ts\ncd packages/agent \u0026\u0026 bunx vitest run src/services/connector-credential-store.test.ts src/services/connector-credential-store.runtime.test.ts\ncd plugins/plugin-calendar \u0026\u0026 bunx vitest run test/microsoft-graph-http.contract.test.ts \\\n  test/calendar-ics-source.pglite.test.ts test/calendar-action-effect-receipts.pglite.test.ts\n```\n\n# Evidence Gate\n\n\u003c!-- evidence-head:5a83e107ae79a045a42dfe0af3fec524e60e1532 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before full-page screenshots: `N/A - non-UI cha al-durable.integration.test.ts` — `Checked 1 file. No fixes applied.` (clean)\n\n**What was NOT verified:** live hosted Google OAuth consent (credential-gated; no real Google client credentials in this environment — the e2e exercises the exact persistence path `completeOAuth` drives, with real processes and real durable state, but not Google's hosted consent screen). `bun run verify` was not run in this lane; see Known gaps.\n\n## Screenshots (before / after) + video walkthrough\n\n`N/A - non-UI change; no rendered surface in the diff (the CI evidence gate accepts N/A for non-UI diffs).`\n\n## Audio / voice walkthrough\n\n`N/A - no voice/TTS/STT surface touched.`\n\n## Known gaps / failures (named residuals)\n\n- **Residual: live hosted Google consent not exercised** — credential-gated (no real Google OAuth client in this environment). The restart e2e proves the identical persistence path over real processes and real durable state, and the writer-reject regression proves the failure path at the real manager→provider boundary.\n- **Residual: production-image container replacement not executed as a real `docker run`** — this build host has **no container runtime** (`docker`/`podman` absent), so the A→B replacement could not be run against the `Dockerfile.ci` image itself. What WAS run instead, honestly named: (1) the replacement contract at the process level over a real agent volume, with each \"container\" a separate OS process whose env is newly constructed by the provider's exact rules (same volume, nothing copied from A's env, negative pre-fix control fails) — `connector-credential-durable.integration.test.ts`; and (2) the provider's exact SSH read-or-create shell command executed against a real `/bin/sh` and real volumes — `docker-sandbox-utils.test.ts` (29 pass). The container-level run over the production image remains open until a Docker-capable host runs it.\n- **`bun run verify` not run** (lane policy: focused gates only). Focused tests, typecheck attempt, a n\n\n\n\n\n"])</script><script>self.__next_f.push([1,"3a:T1ac5,"])</script><script>self.__next_f.push([1,"## What\n\nAdds a **Cartesia** batch lane to `/api/v1/voice/stt` using Cartesia's prerecorded `/stt` endpoint (`ink-whisper`), selected with `VOICE_BATCH_STT_PROVIDER=cartesia`.\n\n`VOICE_BATCH_STT_PROVIDER` pins `deepgram` | `cartesia` | `whisper` | `elevenlabs`; a pinned provider whose binding is missing **fails closed (503)** rather than silently degrading. Un-pinned selection is unchanged: free Whisper stays the default wherever `WHISPER_STT_URL` is set.\n\n## Review change: the key-presence default was removed\n\nThe lane originally made Cartesia the un-pinned default whenever `CARTESIA_API_KEY` was present, by analogy with TTS. That was reverted on review (`4267c45`), for two reasons:\n\n1. **It contradicts the rule stated three lines above the new branch.** The route already says: *\"Deepgram prerecorded is opt-in because the same key also powers realtime Flux sessions. Key presence alone must not silently move every paid batch transcription onto Deepgram in production without an explicit rollout.\"* `CARTESIA_API_KEY` is in exactly that position — it powers the realtime Ink sessions (#17869 / #17997) — and it is *already set* on `eliza-cloud-api-prod` and `-staging`, so the default would have taken effect on deploy with no rollout step.\n2. **The TTS analogy does not carry.** TTS has no free lane; batch STT does. `WHISPER_STT_URL` is set on the live worker, so the flip would have converted working zero-credit transcription into 402s for every such user — a silent free→paid change whose only mitigation was an operator noticing and setting the variable back.\n\nEverything else in the lane is unchanged: `reserve → dispatch → bill/refund`, the `elevenlabs/scribe_v1` pricing proxy, fail-closed **502 + refund** on any upstream/parse failure with no cross-provider fallback, `X-API-Key` auth, transcript/filename log redaction, seconds→ms word-span mapping, and BCP-47 → ISO-639-1 language normalization.\n\nBatch REST (`POST https://api.cartesia.ai/stt`, multipart) is used rather than a one-shot wrapper around the realtime Ink WS — the WS only accepts raw 16 kHz mono PCM in 100 ms frames, which a Worker cannot transcode container formats to. Batch REST accepts exactly the container formats the route's magic-number allowlist already admits.\n\nThe realtime path is untouched: this PR only modifies the batch route, its types, and its tests.\n\n## Tests\n\n`bun test packages/cloud/api/v1/voice/stt/route.test.ts` → **65 pass / 1 skip (live gate) / 0 fail**, covering the full override matrix, fail-closed-on-missing-binding for every pin, the wire contract (headers/model/multipart/language-normalization/exact bytes), reserve→bill→usage, 402-before-call, word-span mapping, and malformed/5xx/transport → 502 + refund + no-secret-logs. The key-presence case is now asserted in the opposite direction: a configured Cartesia key alone must leave batch STT on free Whisper, with no reservation and no billing. Targeted Biome clean.\n\n## Deploy notes\n\n- No behavior change on deploy. Cartesia batch STT activates only when an operator sets `VOICE_BATCH_STT_PROVIDER=cartesia`; worth one canary STT request when they do.\n- `Cartesia-Version: 2026-03-01` (the documented version for `/stt`).\n- Cartesia batch returns word timestamps only — responses have `words`, never `segments` (downstream must tolerate absence, as it already must for the ElevenLabs lane).\n- `CARTESIA_API_KEY` is already set on `eliza-cloud-api-prod` + `-staging`; no new secret needed.\n\n\n# Evidence Gate\n\nEvidence matches the exact commit reviewed.\n\u003c!-- evidence-head:9241054e4355a63c06382644b6070aa09483bcc4 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\nN/A - cloud API route only (`/api/v1/voice/stt`); no rendered UI surface changed.\n\u003c!-- evidence-row:after-screenshots --\u003e\nN/A - cloud API route only (`/api/v1/voice/stt`); no rendered UI s py of the empty/stub-marker rule.\n\nNet: **3 files, +89 / −8**, down from 5 files, +363 / −6.\n\n# Sync with develop\n\nRe-merged `origin/develop@15c8bc849f219712a084ebf225a777d7d9909e42` so the branch carries #19205 (`646b1f08ddc`). A branch based between #19039 and #19205 gets the new `classify-paths.yml` force-hosted selector without the contract script that allows it, so `audit:hetzner-fleet-routing` fails and takes `Quality` down independently of the diff.\n\n# Risks\n\nThe lanes are invoked manually (`test:e2e:ios:cloud-onboarding`, `test:e2e:android:cloud-onboarding`) and are not wired into any workflow, so this change is not exercised by CI. It only tightens the lanes, and its failure mode is a loud lane failure rather than a silent pass, but the real device proof #16936 asks for still has to be produced before that issue can close.\n\n# Testing\n\n```text\nbunx @biomejs/biome check packages/app/src/main.tsx \\\n  packages/app/scripts/ios-cloud-onboarding-smoke.mjs \\\n  packages/app/test/android/cloud-onboarding.android.spec.ts\nChecked 3 files in 208ms. No fixes applied.\n\nnode --check packages/app/scripts/ios-cloud-onboarding-smoke.mjs   # OK\n\nbun run --cwd packages/app audit:app\n219 passed (15.7m)\n[aesthetic-audit] 216 findings — broken=0 needs-work=0 needs-eyeball=17 good=199\n                  minimalism-budget-failures=0 minimalism-ratchet-failures=0\n                  hover-probe-failures=0 density-probe-failures=0 (strict=true, needs-work-strict=true)\n```\n\n`packages/app/src/main.tsx` is a rendered-UI source file, so the full four-viewport audit is required even though the changed code only executes under an iOS cloud smoke request. It is clean: **no touched view holds a `broken` or `needs-work` verdict.**\n\nThe `audit:ocr` phase reports 2 broken rows, `builtin-phone` and `plugin-phone-gui` at `desktop-landscape`. Those are a develop-side tesseract decode defect, not this PR: the captures are byte-identical to a develop-baseline worktree —\ n\u003c!-- evidence-row:ocr-review --\u003e\n- [ ] N/A - no screenshots to OCR; non-UI change\n\n"])</script><script>self.__next_f.push([1,"46:T85c,"])</script><script>self.__next_f.push([1,"## Summary\n- invalidate stale shared Cloud authentication when the Steward account session expires\n- stop protected warm-tab pollers from repeatedly issuing unauthorized requests\n- clear account-scoped shared-agent bindings and persisted selections before another account/session restores\n- refresh expired browser credentials at the auth boundary instead of leaving the UI permanently unavailable\n- preserve dedicated/self-hosted credentials and native/Electrobun owner-key fallback, including when a stale Steward JWT would otherwise shadow it\n\n## Root cause\nThe shared-runtime auth gate inferred authenticated state from the selected Cloud URL even after the Steward session became terminal. The mounted shell therefore remained authenticated and continued protected polling. Account teardown also retained the shared-agent selection, allowing a later login to restore the previous account's agent ID and fail with `Agent not found`.\n\nA related native edge case allowed a stale stored Steward JWT to take precedence over a still-valid owner API key. The restore boundary now rotates or removes that shadowing JWT while retaining the owner-key fallback.\n\nCloses #19127.\n\n## Verification\n- reproduced twice on staging using fresh authentication state and a warm Cloud tab\n- 7 focused Vitest suites: 100 tests passed\n- `bun run --cwd packages/ui typecheck`\n- targeted Biome checks and `git diff --check`\n- `bun run check:agents-claude` (153 tracked pairs)\n- app visual audit executed with pinned Node 24\n- adversarial review findings were addressed in follow-up commit `50c0df1881`\n\n## Post-deployment verification\nAfter this PR is deployed to staging, repeat the original fresh-login and warm-tab journeys and verify:\n1. the selected agent belongs to the current account;\n2. chat no longer fails with `Agent not found`;\n3. refresh/session expiry clears stale authenticated shell state;\n4. native owner-key authentication still works without a Steward JWT.\n\n## Scope note\nPR #19030 is already in the base and addresses onboarding Durable Object scope migration. It does not change renderer session invalidation or active-agent persistence.\n"])</script><script>self.__next_f.push([1,"47:T294f,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #18517 — scoped to the issue's suggestion (2) only, per the claim and\nthe scope comments on the issue. Suggestion (1) landed in #18573/#18813;\nsuggestion (3) is explicitly reserved for maintainer design discussion.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts.\n- [ ] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker — **see Known gaps:\n      full verify is delegated to PR CI per operator hardware constraint.**\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nBefore publication this change went through two adversarial self-review\nrounds. The second round refuted the first implementation with a finding worth\ndisclosing verbatim: the capture gate originally keyed on `st  gate also covers\n  `deletion_pending` rows with a live bridge; the capture fires in the job\n  worker before any teardown, and a refusal leaves a recoverable tombstone\n  for the next attempt.\n\nMechanics, mirroring `shutdown()` exactly: unlocked capture →\ngeneration check against the locked row's `bridge_url` inside\n`prepareAgentDelete`'s transaction → persisted as a `\"pre-delete\"` backup\n(new additive `AgentBackupSnapshotType` member). Error taxonomy carried over\ncompletely: no snapshot endpoint → proceed flagged; transient\n(`SNAPSHOT_CAPTURE_TRANSIENT`) → `retryable: true`, which\n`executeAgentDelete` converts to `RetryableProvisionTransportError` so\nretries never burn the job's attempt budget (the restart/snapshot handlers'\nrule for the identical signal); anything else → fail-closed refusal.\nRetry idempotence: a `pre-delete` backup taken at or after this deletion's\nstart satisfies the guarantee, so a dead bridge after teardown cannot strand\nthe deletion. Defense in depth: `prepareAgentDelete` itself refuses a live\nrow without a current-generation capture.\n\n**Retention (review round 1, P0):** the capture (or the supported-404\nwaiver) persists into a new cascade-immune, organization-scoped\n`agent_sandbox_predeletion_backups` table — no foreign key, schema +\n`ensureAgentSandboxSchema` parity, encrypted and offloaded under its own\nobject namespace, retrieved via `getPredeletionBackup` +\n`hydratePredeletionBackup`. A real-PGlite test performs the actual parent\nrow delete and proves `agent_sandbox_backups` cascades away while the\nretention row survives. The waiver is no longer memory-only; idempotence\nbinds to `deletion_attempt_id` + `sandbox_id` re-validated under the\nlifecycle lock; the gate keys on data-bearing placement so\n`disconnected`/`error` rows are covered, and a data-bearing row with no\nreachable bridge refuses fail-closed. The reconciler's unauthorized\nre-enqueue path captures too (maintainer-side commit `598d6d534`, preserved  and an abort timer bounds wall time. DNS rebinding defense remains a Node-path property — a browser has no resolver access; CORS bounds what a page can read.\n- `packages/core/src/index.browser.ts` — exports the three pure SSRF policy helpers so the browser boundary shares core's policy instead of duplicating it.\n- Consumer-level browser regression: `__tests__/transcription-browser-consumer.shape.test.ts` bundles `index.browser.ts` with the production `Bun.build` settings (browser target, package.json externals, unminified) and asserts the emitted graph contains **no** `@elizaos/core/node` and **no** `node:` built-in specifiers, that the browser (not Node) fetcher registration ships, and that core's browser entry actually exports the helpers. Runtime behavior is covered by `__tests__/transcription-browser-url.shape.test.ts`.\n\n## What kind of change is this?\n\nBug fix (non-breaking; restores the package's declared browser/runtime contract for URL transcription).\n\n# Documentation changes needed?\n\nNone — no documented commands, env vars, or public API names change; the plugin's dual-build contract already documented in `plugins/plugin-openai/CLAUDE.md` now actually holds for the URL path.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-openai/models/transcription-url.browser.ts` (the new boundary), then `__tests__/transcription-browser-consumer.shape.test.ts` (the consumer-level regression) and its helper `__tests__/helpers/browser-consumer-bundle.mjs`.\n\n## Detailed testing steps\n\nAll commands were refreshed on exact head `757b6a3b898f068ed4adf6964ce45f655935ea03` (parent = `origin/develop` `3326eecc535c039f82582ddf4abafb7e41f78579`):\n\n```bash\nbun run --cwd plugins/plugin-openai test        # 22 files, 304 tests passed\nbun run --cwd plugins/plugin-openai typecheck   # pass\nbun run --cwd plugins/plugin-openai lint:check  # pass\nbun run --cwd plugins/plugin-openai build       # Node + Browser + d.ts pass\nbun run --cwd packages/cor tion, so the source-conditioned dev stack silently runs stale plugin code after edits (#18737: it cost an hour across three false hypotheses before `grep` against `dist/` exposed it). At dev-server boot, one sweep compares each workspace plugin's dist entry mtime against its newest source file (build outputs, `node_modules`, dot dirs, `test`/`tests`/`e2e` trees, and `*.test.*` files never count) and emits one warning per stale plugin naming the newest source file, the dist path, and the exact rebuild command, plus a one-line summary count.\n\nThe first real boot immediately validated both halves of the design: the sweep found **26 of 116 workspace plugins stale on current develop** — the silent-lie state is endemic, not rare — and it also flagged `test/stubs` files as \"newest source\", the false-positive class the second commit excludes with regressions. Post-refinement, every reported file is a real `src/` build input.\n\n## What kind of change is this?\n\nBug fix / developer-tooling observability (non-breaking).\n\n# Documentation changes needed?\n\nNone; behavior documented at the definition site.\n\n# Testing\n\n## Where should a reviewer start?\n\n1. `packages/app-core/src/runtime/dev-plugin-dist-staleness.ts` (~140 lines: classification + sweep).\n2. The wiring at the top of `main()` in `packages/app-core/src/runtime/dev-server.ts` (guarded, best-effort).\n3. `src/runtime/__tests__/dev-plugin-dist-staleness.test.ts`: 6 deterministic tests with pinned mtimes — stale/fresh/no-dist classification, the ignore rules (dist, node_modules, dot dirs, `test`/`tests`/`e2e`, `*.test.*`, non-source files), warning content (both paths + rebuild command), per-plugin once semantics, non-plugin entries skipped, missing root quiet.\n\nCommands run at this head:\n\n```bash\nnode ../scripts/run-vitest.mjs run --config vitest.config.ts src/runtime/__tests__/dev-plugin-dist-staleness.test.ts   # 6/6\nbun run --cwd packages/app-core typecheck    # 0 errors\nbun x biome check \u003c , resolves source-checkout view bundles from the current workspace before any global/install cache, and preserves canonical disabled state even when a dependency plugin is loaded.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: yes\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `openai/gpt-5.6-sol`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: Codex Desktop\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/eliza@e36490725244b8cc9a005ecefe3379987315a633:packages/skills/skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: self-reported\n\n# Implementation\n\n- Enable/disable writes synchronize `plugins.entries`, `plugins.allow`, and connector compatibility state while preserving unrelated allowlist entries.\n- Mismatched identities such as `google` / `@elizaos/plugin-google-workspace` migrate to the canonical `google-workspace` entry and remove stale aliases.\n- Loaded-runtime reconciliation reads that same canonical entry, so a loaded-but-user-disabled dependency remains `enabled: false`.\n- View package resolution recognizes prefixed runtime names and prefers the checked-out workspace bundle before Bun/global package resolution.\n- Legacy `@elizaos/app-*` identities are covered in both enable and disable directions.\n\n# Testing\n\nExact current object:\n\n- Base: `e36490725244b8cc9a005ecefe3379987315a633`\n- Head: `973cdfbdc6d77dc762c36688afb4a40613695cdc`\n- Tree: `e2675add9162aca76e36c0b8026598f74e1e0752`\n- Three focused commits only; unrelated #18299 smoke-test maintenance was removed.\n\nCompleted proof:\n\n- Plugin Registry focused tests: 21/21 passed, including canonical disabled + runtime-loaded Google Workspace.\n- Agent view package-resolution tests: 7/7 passed.\n- Plugin Registry and Agent typechecks passed.\n- Exact-path Biome and `git diff --check` passed.\n- The d produced the current-workspace Health bundle. The first isolated launch used a throwaway `HOME` without disabling the OS keychain, so macOS displayed a keychain prompt. It was canceled; the proof processes were stopped; the real keychain was not written; the user QA ports and long-running native app were untouched.\n\nFor safety, the current-head proof does **not** claim responses that were not captured: `GET /api/plugins`, `GET /api/plugins/diagnostics`, `GET /api/views/health`, or HTTP delivery of the bundle. The deterministic regression tests cover the canonical disabled/runtime-loaded response directly.\n\n# Known gaps / failures\n\n- The four exact-head HTTP responses listed above were not captured before the safety stop.\n- The remaining `active_but_disabled` diagnostic is expected: Google Workspace may be loaded as a dormant Personal Assistant dependency while the user has it disabled. This PR preserves that user choice and eliminates persistent entries/allowlist drift.\n- No product/runtime failure is known on the current head. Optional activity-collector and iMessage permission warnings remain unrelated.\n\nAI provider/model: openai / gpt-5.6-sol\nClient / agent tooling: Codex Desktop\nContribution skill revision: elizaOS/eliza@e36490725244b8cc9a005ecefe3379987315a633:packages/skills/skills/contribute-to-eliza\nAttribution status: self-reported\n— [plugin-launch-registry]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5.6-sol\",\"client\":\"Codex Desktop\",\"skill_revision\":\"elizaOS/eliza@e36490725244b8cc9a005ecefe3379987315a633:packages/skills/skills/contribute-to-eliza\"} --\u003e"])</script><script>self.__next_f.push([1,"53:T2081,"])</script><script>self.__next_f.push([1,"\u003c!-- Fill every visible section. Keep every evidence row visible; use N/A with a concrete reason when a row does not apply. --\u003e\r\n\r\n# Relates to\r\n\r\n\u003c!--\r\nLink the issue, ticket, or Project card. For agent/kanban work, follow us option 3's ordering fix. Completes the DM-coverage gap documented in #18549's post-merge notes on #18470.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop` with zero conflicts.\n- [x] `bun install` and focused verification were run after sync; details in Testing below.\n- [x] A reviewer can confirm the change works without reading the code, from the evidence attached below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@9259107132edeab02d9e47dbb7ce383721bada77:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop`; zero conflicts.\n- [x] Focused verification passes post-sync (17 plugin tests across the two touched suites, plugin typecheck 0 errors, biome clean, `git diff --check` clean).\n\n# Risks\n\nLow. New module plus additive wiring; the scan's guild path, caps, terminal-marker invariant, and turn-registry exclusion are unchanged. The registry persists channel ids and timestamps only (no content, no usernames), bounded LRU of 64. Every new I/O path is best-effort: corrupt or missing registry degrades to empty with a warning, re-open failures are counted and logged per recipient, and nothing on these paths can reject message handling or the ready path.\n\n# Background\n\n## What does this PR do?\n\nBots cannot enumerate their open DM channels, and `client.channels.cache` holds no DMs on a cold boot, so a status marker stranded in a DM by a hard kill survived exactly the restart the startup scan (#18470) exists for. Three pieces close it:\n\n1. **`DmChannelRegistry`** (`plugins/plugin-discord/dm-channel-registry.ts`): records `{channelId, recipientId, lastSeenAt}` as DMs are observed in the message path, bounded LRU in the state dir.\n2. **Cold-start re-open** (`reopenPersistedDms` in `startup-reaction-reconcile.ts`): on ready, persisted DM channels missing from the cache are re-opened via `client.users.createDM` (idempotent), failures counted and logged, never thrown.\n3. **DM-first ordering**: the scan now takes re-opened and cached DMs before guild channels, so the global channel cap can no longer starve the DM leg behind a large guild list (the cap-starvation point from the #18470 shipwright review).\n\n## What the live run caught that mocks could not\n\nThree real bugs surfaced only in the live Discord validation and are each now pinned:\n\n1. **Silent facade no-op**: `MessageManager` holds the account service facade, not the service; the optional `recordDmChannel?.()` call no-opped until the facade forwards it. Optional chaining hid the missing wiring exactly the way a weak assertion hides a bug.\n2. **Missing directory**: the registry wrote into a state subdirectory nothing created; `mkdir -p` before persist.\n3. **Cold-start bug in the cold-start fix**: the in-memory registry map was only populated when a DM arrived, so on a cold boot the ready path read an empty map while the persisted file sat unread on disk. Registry construction now happens on demand from both paths.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNone; contracts documented at the definition sites.\n\n# Testing\n\n## Where should a reviewer start?\n\n1. `plugins/plugin-discord/dm-channel-registry.ts` (~150 lines, the persistence contract).\n2. `reopenPersistedDms` and the DM-first `collectChannels` in `startup-reaction-reconcile.ts`.\n3. The facade forward in `service.ts` (`createAccountServiceFacade`) and the `g pt>self.__next_f.push([1,"59:T1d64,"])</script><script>self.__next_f.push([1,"# Relates to\n\nSupersedes #18876 (author's commit b106cd62b53 is preserved as the first commit of this branch); partial fix for #17006 — the DO-purge leg of agent deletion. The fork behind #18876 rejects maintainer pushes, so the repair lands as this superseding PR.\n\n- [x] A reviewer can confirm the change works without reading the code, from the evidence attached below.\n\n## Summary\n\nThe `SharedRuntimeConversation` Durable Object keeps each room's live conversation window in DO storage. Agent deletion purged only the Postgres mirror (`sharedRuntimeHistoryRepository.deleteByAgent`), leaving a deleted agent's conversation content resident in DO storage indefinitely — a privacy/data-retention gap with unbounded namespace growth.\n\n#18876 added the DO-side `{ operation: \"delete\" }` handler and collected the agent's channel ids in `deleteAgent`, but never invoked the purge: the handler had no caller and `channelIds` was assigned and then unused. This PR completes the wiring.\n\n## Changes\n\n1. **DO delete operation** (`packages/cloud/api/src/shared-runtime-conversation.ts`) — from #18876: `{ operation: \"delete\"; agentId }` clears `storage` and the in-memory cache. This PR additionally cancels a pending mirror-retry alarm (`storage.deleteAlarm()`) so a queued retry cannot fire against the emptied room.\n\n2. **`listChannelsByAgent`** (`packages/cloud/shared/src/db/repositories/shared-runtime-history.ts`) — from #18876: lists the agent's channel ids so deletion knows which DO rooms exist.\n\n3. **Purge dispatch — the missing caller** (new in this PR):\n   - `purgeSharedConversationRooms(agentId, channelIds, { namespace })` in `packages/cloud/shared/src/lib/services/shared-runtime/conversation-coordinator.ts` addresses each room with the same naming the turn/history path uses (`${agentId}:${coordinatorRoom(channelId)}`) and POSTs one `{ operation: \"delete\", agentId }` envelope per room. Best-effort by contract: rooms are attempted independently; failures are counted and logged (`error-policy:J6`), never thrown.\n   - `ElizaSandboxService.deleteAgent` (`packages/cloud/shared/src/lib/services/eliza-sandbox.ts`) now consumes the collected `channelIds`: after the admitted deletion commits (`result.success \u0026\u0026 result.rowDeleted`, downstream of the #18573 admission guard), it reads the `SHARED_RUNTIME_CONVERSATIONS` namespace via `getCloudBinding` (present only inside a Worker request; absent in node runtimes/tests, where the purge is skipped) and runs the purge. A purge failure can never fail the deletion.\n   - The author's previously-dead `getCloudBinding` / `RuntimeDurableObjectNamespace` imports are now used; the \"purge happens Worker-side, not here\" placeholder comment is gone.\n\n## Scope note\n\nThe #18876 close-out and #17006 record the remaining design work (durable room registry committed before content, deletion tombstone fencing saves/hydration/alarms/late mirrors, idle expiry, workerd-level tests). This PR does not claim those: it makes the existing best-effort purge real instead of dead code, and #17006 stays open for the complete design.\n\n## Tests\n\n- `packages/cloud/api/src/shared-runtime-conversation.test.ts` — the delete operation clears room storage, cancels the mirror-retry alarm, and the next request cold-starts (warming 503) instead of serving purged content.\n- `packages/cloud/shared/src/lib/services/shared-runtime/conversation-coordinator.test.ts` — purge dispatches one delete envelope per room using the turn naming; a room that throws or returns 500 is counted as a failure and the remaining rooms still run; the helper never throws.\n- `packages/cloud/shared/src/lib/services/__tests__/agent-delete-shared-conversation-purge.test.ts` — drives the real `ElizaSandboxService.deleteAgent` against in-process PGlite with the real repositories and a recording DO namespace injected through the cloud-bindings ALS store (exactly how a Worker request supplies it): dispatches per persisted channel, tolerates total purge failure without failing the admitted deletion, and skips cleanly when the binding is absent.\n\nCommands run at this head:\n\n```bash\nbun test packages/cloud/api/src/shared-runtime-conversation.test.ts                                    # 7 pass\nbun test packages/cloud/shared/src/lib/services/shared-runtime/conversation-coordinator.test.ts        # 6 pass\nbun test packages/cloud/shared/src/lib/services/__tests__/agent-delete-shared-conversation-purge.test.ts # 3 pass\nnode packages/scripts/run-turbo.mjs run typecheck --filter=@elizaos/cloud-shared --filter=@elizaos/cloud-api # 0 errors\n```\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed. `scripts/pr-evidence.mjs rows` sets this marker from the live PR head; rerun it after every push.\n\u003c!-- evidence-head:a0421de8f7dcf90a12a547f21446052e6c77498e --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A — backend-only change (Worker service + Durable Object); no UI surface is touched.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A — backend-only change; no UI surface is touched.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A — backend-only change; no UI flow to record.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Real transcripts below: the PGlite-backed `deleteAgent` run shows the per-room best-effort purge path firing (structured warn per unreachable room, deletion still succeeding).\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A — no frontend code path participates in agent deletion purge.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A — no model call is involved; deletion/purge is a pure storage-lifecycle path.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Test transcripts (below) assert the domain artifacts directly: DO storage map emptied + alarm cancelled, one `{operation:\"delete\"}` envelope per `${ ] This PR targets `develop` and is rebased onto the latest `origin/develop` with zero conflicts.\n- [x] Full `packages/cloud/api/__tests__` suite run after sync — 1497 pass, 0 fail.\n- [x] A reviewer can confirm the change from the evidence attached below.\n\n# Contribution provenance\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `N/A - no contribution skill was loaded for this change`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\n# Sync with develop\n\n- [x] Branched from the latest `origin/develop`; zero conflicts.\n- [x] `bun test packages/cloud/api/__tests__ --isolate` — 1497 pass, 0 fail (see Known gaps for the one unrelated harness error).\n- [x] `bun run --cwd packages/cloud/api typecheck` and `lint` clean.\n\n# Risks\n\nMedium. It changes what durable state a migration leaves behind, on the path\nevery messaging onboarding takes.\n\nThree things bound it:\n\n- **The pointer is not a session.** `loadStoredSession` refuses to return one, so\n  no caller can mistake it for a transcript with no history and no bindings.\n- **It is followed exactly one hop**, and only when the record it points at is\n  not itself a pointer. There is no chain to walk and no cycle to hang on.\n- **It is followed only from the platform scope.** An authenticated turn already\n  names its own account scope; the platform key is addressed by a *public*\n  messaging id, so following it from an account scope would be an ownership\n  hole. That guard is mutation-proved below.\n\nOwnership semantics are unchanged from today: the same condition that used to\ndelete the platform key now writes the pointer, in the same transaction.\n\n# Background\n\n## What does this PR do?\n\nTwo turns in the same conversation are filed under two different keys, and only\none of them can ever be addressed from Telegram.\n\n`scopeFor` in the coordinator files an **anonymous** turn under\n`platform:\u003csessionId\u003e` and an **authenticated** turn under\n`account:\u003corg\u003e:\u003cuser\u003e`. That split is correct — a messaging turn arrives with the\nsender's platform id attested by the gateway, not with an account, so it cannot\nname an account scope even in principle.\n\nThe authenticated continuation migrated the transcript into the account scope\nand then **deleted** the platform key. From that moment the user's own bot chat\npointed at a hole:\n\n```\nturn 1  Telegram, anonymous   -\u003e reads/writes  session:platform:platform%3Atelegram%3A\u003cid\u003e\nturn 2  browser, authenticated-\u003e migrates to   session:account:\u003corg\u003e:\u003cuser\u003e,  DELETES the platform key\nturn 3  Telegram, anonymous   -\u003e reads         session:platform:...            (gone)\n                              -\u003e new session, userId unset\n                              -\u003e requiresLogin = !session.userId || !session.organizationId  = true\n                              -\u003e the same \"$5 + link\" greeting, again\n```\n\nThe only thing bridging turn 3 back to the account scope was the best-effort\ncache mirror. `cache.get` returns `null` for a cache outage and for a plain miss\nalike — the two are indistinguishable at the call site — so the fix for a\npermanent loop cannot live there. That is why this makes the bridge durable\nrather than making the mirror more reliable.\n\nThe migration now **replaces** the platform session with a pointer to the\naccount scope, inside the same storage transaction that moves the transcript, so\nthe conversation is not unreachable at any instant — not even between two writes.\nAn anonymous turn resolves the pointer before it loads anything, so it lands on\nthe account session, `requires
