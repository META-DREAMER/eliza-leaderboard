It has **not been supplied/configured**, so health flags are **not proof of a real model reply**.\n- Transfer of source and built dependencies to the runtime host is in progress at handoff. No persistent Alpha service or TEE deployment has been started there. Treat staging as unverified until the transfer and integrity check finish.\n\n### Self-hosted configuration learned during prep\n\nThe default production UI initially offered the cloud route. The verified self-hosted path used:\n\n```sh\n# At web build time:\nVITE_ELIZA_ENABLE_RUNTIME_CHOOSER=1 bun run --cwd packages/app build:web\n\n# For the loopback-only builder smoke test:\nELIZA_API_BIND=127.0.0.1\nELIZA_API_PORT=47842\nELIZA_PORT=47842\nELIZA_EXTERNAL_BASE_URL=http://127.0.0.1:47842\nELIZA_SKIP_LOCAL_EMBEDDING_WARMUP=1\nELIZA_SKIP_LOCAL_VOICE_WARMUP=1\n```\n\nUse a separate persistent `ELIZA_STATE_DIR`. Leave `ELIZA_FORCE_INJECT_TOKEN` unset. The loopback URL and warmup skips are smoke-test settings, not the final deployment contract. Private access details and logs stay outside this public issue.\n\n## Plan for Shaw\n\n1. **Confirm the dstack target and packaging.** Choose the supported TEE platform, image/build recipe, and networking/storage interfaces; pin the source and final image digest. Reconcile #31018's original Nitro/NSM/KMS plan with the actual dstack architecture rather than assuming they are interchangeable.\n2. **Configure the separate agent securely.** Inject its own Cerebras credential through the approved secret channel. Select model and embedding configuration explicitly; define external speech providers before voice testing. No VPS key reuse, secrets in Git, or Google Workspace integration for this agent.\n3. **Deploy and harden.** Configure persistent state/database, secret delivery and rotation, outbound provider access, authenticated ingress, restart policy, and rollback. Preserve existing enclaves/services. Implement and verify real attestation according to the selected dstack platform.\n4. **Publish the endpoint/auth contract** needed by phone pairing: agent/account binding, authorized routing, and supported client access. Coordinate with #31021; make the hosted agent available for #31022.\n5. **Run acceptance below** and attach evidence before marking deployment complete.\n\n## Acceptance / still open\n\n- [ ] Runtime staging verified; reproducible image and persistent service/deployment recorded.\n- [ ] Real Cerebras request/reply with trajectory evidence, plus provider-failure behavior.\n- [ ] Restart preserves agent identity and conversation/state; backup/restore and rollback checked.\n- [ ] Authenticated endpoint works; unauthorized access is rejected.\n- [ ] Actual TEE deployment and attestation policy verified, including rejection behavior.\n- [ ] Cold/warm startup and idle/active resource usage measured.\n- [ ] Phone pairing and voice tested through real clients, not just HTTP health probes.\n\n## Related work and schedule\n\nDeployment is scheduled **Sep 14–17**; routines #31022 follow **Sep 18–21**, and pairing #31021 **Sep 22–25**. Flag any dstack dependency that changes these dates.\n\nTrajectories #17030 still need acceptance evidence and closeout. Developer viewer, context/token, memory, routing, storage, and recovery work is tracked separately in #31014, #31055, #31320, #31321, and #31324. Those review branches are **not implied to be included in this pinned Alpha checkout**, and local test results are not AWS/TEE acceptance. Keep those changes gated separately rather than expanding this deployment handoff into a migration or unreviewed merge.\n"])</script><script>self.__next_f.push([1,"15:Tf27,"])</script><script>self.__next_f.push([1,"Status September14: merged to staging as `23c4e07617edd16687988252abcc86cc5bb26bef` (tree-identical to candidatee440c38d599). Current payment replay, PostgreSQL and Windows checks passed; the broad static job was still running at merge. Both final candidate trees passed373/373 local verification e was used, without force/admin override; branch API reported no enforced required checks. Staging canonical migrations and provisioning-worker deployment succeeded in run34857365447, with exact host revision and live services verified. Cloud app/API release34857796314 is running; production rollout and live prepaid acceptance remain open.\n\nDedicated runtime previously relied on later billing to discover exhausted credit, leaving compute exposed to unpaid operation after worker or billing failures. This change reserves funds before Dedicated allocation/start, binds each reservation to the exact Docker instance, and enforces expiry with a host-local guard. Unused funds are refunded only after a durable stop receipt; funding history survives agent deletion.\n\nRelated to #31280. **Source is merged; production acceptance remains pending.**\n\n- Integrate prepaid funding with provisioning readiness, renewal, subscription cancellation/expiry, retained resume, sleep, restart, deletion and failed-claim cleanup. Cash-only renewal denial preserves the existing paid window; account/subscription revocation stops immediately.\n- Bind a fresh backup to the exact committed provider stop before removing compute. Removal retries verify that backup, preserve refund idempotency and reject stale lifecycle generations. A concurrent funded top-up preserves runtime.\n- Reject customer Docker creates without funded-start authority, including test organizations and image replacements. Rejected image upgrades/downgrades preserve the existing agent. When both spare-capacity floors are zero, permit draining the last eligible empty managed server while protecting occupied, retained, young and operator-managed nodes.\n- Propose USD0.15/hour and a USD0.30 minimum per successful start, with ccx13/capacity-one sizing for newly autoscaled Dedicated nodes. Carry the minimum across hourly renewals, account for it separately from metered usage and charge no minimum for never-ready attempts. Existing sks (Turbo3m49.35s, final exit0).\n- All378 canonical migrations through0394 apply and replay both on fresh PostgreSQL and an isolated saved-production snapshot. The saved-copy rehearsal preserved176 users,100 agent records,207005 credit transactions and the organization balance checksum, with zero orphan leases. Temporary container/data/tunnel removed; backup retained. PostgreSQL18.6/vector0.8.6 and no-owner/no-privileges restore do not establish exact production-version or ACL restoration parity.\n- Funding/retirement: five pinned-SSH/Docker scenarios106 assertions,33 actual PostgreSQL funding tests343 assertions,83 PGlite funding/recovery tests730 assertions,32 scheduler tests205 assertions and49 activation API tests pass across the documented candidate revisions. These include worker failure, failed restore/removal, rollback, retries, concurrent top-up and stale lifecycle cleanup. Transport/runtime-bootstrap fixtures are explicit; they are not hosted browser acceptance.\n- Provider and image lifecycle:173 tests1425 assertions. Final-empty-node cleanup:48 tests218 assertions. The prior hosted revision passed payment replay, subscription PostgreSQL and Windows security; exact-head hosted checks remain required.\n\nRelease work still open: coordinate the canonical migrations0387-0394 with API/app/control-plane rollout; drain/reconcile old workers and in-flight operations before switching queue contracts. Keep warm pooling and automatic image replacement off. Personal connector delivery now refuses to start stopped/sleeping Dedicated agents and directs the owner to app price review (HTTP428, no automatic retry). Trusted service-key operational endpoints retain their service authorization and funded-provider checks; their compatibility is separate from user-facing app admission. Complete finite unpaid retained-data policy, recovery of already-stopped runtimes without a proven fresh backup, adoption of the two existing acceptance agents, and actual Google signup/chat/lossless sleep-restore/local Bun/mobile acceptance. No universal profit guarantee or completed launch is claimed. Shared-agent product work and Telegram are excluded; workload accounting still protects Shared resources.\n\nThe large generated diff is mainly Drizzle schema snapshots. Eight append-only migrations0387-0394 are included; no historical applied migration is edited.\n"])</script><script>self.__next_f.push([1,"17:T270d,"])</script><script>self.__next_f.push([1,"# Relates to\n\nPart of #24594 — node-loss recovery, phase 1 (durable foundation only).\n\nThis PR does **not** close #24594. It delivers the persistent records, locks,\nauthority references, exact capacity reservation, and recovery-idempotency\nfoundation. Automatic failover is not enabled anywhere.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [x] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased/merged onto the latest `origin/develop`; zero conflicts.\n- [x] `bun run verify` passes post-sync: 373/373 turbo tasks, exit 0.\n\n# Risks\n\n**High, contained by the hard-off gate.** Two reasons: the repository gains a new\nschema (two migrations, six tables and six guard triggers), and the two active\nproduction container-create paths change how they reserve node capacity.\n\nThe hard-off gate contains only the automatic failover path. It does not disable\nordinary container creation, which is exactly where this PR changes existing\nbehaviour, so that part must be reviewed on its own merits rather than assumed\ninert.\n\n- The migrations are additive and unregistered by anything: no route, worker, or\n  cron reads the six new tables.\n- `DockerSandboxProvider` and `HetznerContainersClient` now reserve a slot with a\n  compare-and-set bound to the exact node occurrence instead of a blind increment\n  by node handle. This is the only behaviour change in existing production code:\n  a node cordoned, replaced, re-attested, or filled between selection and\n  reservation is now refused rather than used.\n- Rollback now releases the same occurrence it reserved; a refused release is\n  logged as needing a recount instead of silently decrementing a same-named node.\n\n# Background\n\n## What does this PR do?\n\nAdds the durable foundation for recovering Agents when a node occurrence stops\nanswering:\n\n- **Fault records and evidence** — `agent_node_failure_events`, keyed to one\n  immutable node occurrence, plus append-only `agent_node_failure_signals`. The\n  verdict is `triggered`, not `confirmed`: corroboration starts recovery work, it\n  does not establish that a node is dead.\n- **Declared independence** — observers are a controlled enumeration, each signal\n  records the independence class and policy version it was collected under, and a\n  database constraint pins the source-to-class mapping. Two probes down one\n  network path cannot corroborate each other.\n- **Frozen fault scene** — `agent_node_failure_candidates` is written inside the\n  transaction that cordons the node, from the activation publications that\n  actually authorize each Agent on that occurrence.\n- **Processing state and concurrency** — `agent_failover_operations` (executor\n  lease with a rotating generation and DB-clock horizon, frozen source authority,\n  referenced restore authority, cutover identity bundle) and\n  `agent_failover_step_attempts` (append-only progress journal).\n- **Guards** — steps advance one at a time, an interrupted attempt must be\n  reconciled before its step runs again, a superseded executor cannot settle\n  anything, and a committed cutover cannot be cancelled or failed.\n\n`packages/cloud/shared/docs/agent-failover-contract.md` states what is proven and\nwhat is explicitly deferred.\n\n## What kind of change is this?\n\nFeature (non-breaking; the new surface is unused and the failover switch is hard\noff).\n\n## Why are we doing this?\n\nMoving an Agent between nodes must not produce two live instances, a blank Agent\npresented as recovered, or two copies of one recovery. Those failures are worse\nthan downtime, so the durable state machine and its guards land first and\nseparately, with the automated behaviour behind a switch that cannot be turned on.\n\n# Documentation changes needed?\n\nMy changes require a change to the project documentation: this PR adds\n`packages/cloud/shared/docs/agent-failover-contract.md`, which records the\ncontracts, the proof boundary, and the open decisions.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/cloud/shared/docs/agent-failover-contract.md` for the contracts, then\n`packages/cloud/shared/src/db/migrations/0387_agent_failover_guards.sql` for what\nthe database refuses.\n\n## Detailed testing steps\n\nRun the following commands:\n\n```bash\n# Durable state contracts and the migration/schema parity gate\nbun test packages/cloud/shared/src/db/repositories/__tests__/agent-failover.pglite.test.ts\nbun test packages/cloud/shared/src/db/repositories/__tests__/agent-failover-migration-parity.pglite.test.ts\n# Exact-occurrence placement reservation\nbun test packages/cloud/shared/src/db/repositories/__tests__/docker-node-exact-reservation.pglite.test.ts\n# Both create paths\nbun test packages/cloud/shared/src/lib/services/containers/hetzner-client/client.error-policy.test.ts\nbun test packages/cloud/shared/src/lib/services/__tests__/docker-sandbox-replacement-cleanup.test.ts\n# Multi-session concurrency on real PostgreSQL (local image avoids a registry pull)\nAPPS_TENANT_DB_EPHEMERAL=1 APPS_TENANT_DB_TEST_IMAGE=pgvector/pgvector:pg16 \\\n  bun test packages/cloud/shared/src/db/repositories/__tests__/agent-failover-postgres.integration.test.ts\n```\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\n- [x] Before full-page screenshots — `N/A - no UI change; no file under\n      packages/app or packages/ui is touched.`\n- [x] After full-page screenshots — `N/A - no UI change.`\n- [x] Video walkthrough — `N/A - no UI change and no user flow; the change is a\n      database authority layer plus placement reservation.`\n- [x] Backend logs — No deployed failover runtime capture applies because\n      automatic failover remains disabled. Backend behavior for the two active\n      placement paths is exercised by the attached focused test output, including\n      reservation refusal, pre-create failure, post-create cleanup, retained\n      capacity on ambiguous cleanup, and exact release.\n- [x] Frontend console and network logs — `N/A - no UI or HTTP surface.`\n- [x] Real-LLM trajectory — `N/A - no agent, action, provider, prompt, or model\n      change.`\n- [x] Domain artifacts — attached below: migration-enforced refusals and\n      real-PostgreSQL concurrency results.\n- [x] OCR visual-text review — `N/A - no rendered visual surface.`\n\n### Domain artifacts\n\nDatabase-level refusals, asserted by the guards rather than by repository\nconvention:\n\n```\n# packages/cloud/shared/src/db/repositories/__tests__/agent-failover.pglite.test.ts\n(pass) a reconciled-continued cutover clears the same authority bar as a success\n(pass) the identity bundle is frozen before the publication exists\n(pass) an unrecorded reserved attempt cannot be skipped on the way to terminal\n(pass) a failover cannot go terminal before its slot is provably back\n(pass) an event cannot be withdrawn while an operation still needs to release capacity\n 44 pass, 0 fail\n```\n\n```\n# real PostgreSQL, independent sessions\n(pass) hands one operation to exactly one of two racing workers\n(pass) refuses to displace a live lease under real sessions\n(pass) rotates the fence exactly once when two workers race an expired lease\n(pass) admits only one step attempt when the winning worker is duplicated\n(pass) refuses a settlement presented by a superseded session\n(pass) cordons and freezes exactly one agent set under concurrent freezes\n(pass) never counts target capacity itself\n(pass) replays both migrations and installs every guard\n 8 pass, 0 fail\n```\n\n```\n# placement reservation, both create paths\nclient.error-policy.test.ts                         24 pass, 0 fail\ndocker-sandbox-replacement-cleanup.test.ts          68 pass, 0 fail\ndocker-sandbox-exact-restore.test.ts                21 pass, 0 fail\ndocker-node-exact-reservation.pglite.test.ts         8 pass, 0 fail\n```\n\n# Known gaps / failures\n\n1. **`bun install --frozen-lockfile` exits non-zero in this environment, before\n   any change in this PR.** Dependency resolution succeeds and `bun.lock` is\n   untouched, but the `postinstall` step fails building the fused-inference\n   native library:\n\n   ```\n   Embedding Metal library (compiled metallib + eliza-shipped kernels)\n   error: cannot execute tool 'metal' due to missing Metal Toolchain;\n          use: xcodebuild -downloadComponent MetalToolchain\n   [stage-desktop-fused-lib] ERROR: cmake exited 2\n   error: postinstall script from \"eliza\" exited with 1\n   ```\n\n   Reproduced identically on Bun 1.4.0 and on the pinned Bun 1.3.14, so it is a\n   missing local Xcode component, not this change. `bun run verify` passes on\n   both.\n\n2. **The switch stays hard off.** `AGENT_BACKUP_RESTORE_FAILOVER_ENABLED=1`\n   still throws in\n   `agent-backup-restore-coordinator-runtime.ts`; there is no new environment\n   variable, configuration entry, background caller, cron entry, worker wiring,\n   deployment, or autoscaling on this path. Its gate test passes.\n\n3. **Deferred to the wiring and enablement phase, not claimed here:**\n   - enforcing the authority at the three business boundaries (inbound message,\n     state write, outbound send). Recording an authority chain is not isolation;\n     nothing in this PR rejects a stale instance at a boundary.\n   - the explicit recovery flow integration, node drain/cordon orchestration, and\n     cleanup of the old container.\n   - the seal-and-import protocol for shared-mode data written during the outage.\n   - staging failover rehearsal with RTO/RPO evidence, and the full fault\n     injection matrix.\n\n4. **Validation environment.** Suites were run on an isolated Bun 1.3.14\n   (`/tmp/bun-1.3.14`, absolute path only); the machine's default Bun remains\n   1.4.0 and was not modified.\n"])</script><script>self.__next_f.push([1,"18:T120c,"])</script><script>self.__next_f.push([1,"Owners could revoke family access through internal guards but had no reviewed deletion and recovery flow. This adds an owner-only Family Operations panel and HTTP routes that bind confirmation to the complete reviewed snapshot, journal primary deletion atomically, and resume interrupted private-file cleanup. Backup capture and restore share a durable generation authority so retired snapshots cannot restore revoked content.\n\nRelated to #31180. This implementation ends at an explicit `backup_pending` state. Physical archive removal and the complete Bettina export/delete acceptance remain open; this PR must not close that issue.\n\nValidation:\n\n- Rebased without conflicts onto develop `5c1d581d437878f31cda5eb2dcd6d2764c98430b`; pinned installation and full root verify passed at `d646221190c3e5f55e1356509969e16d1184a017`.\n- Final change `0c47d0aa68cfa987e030c95a7109b850854ac3e5` only corrects the README to describe this behavior. Full root verification also passed at this exact PR head, including all package tasks and final repository audits.\n- Fresh desktop/mobile browser flow passed at d646, including stale-review rejection, interrupted primary cleanup, durable status recovery, and 44px controls. All eight state c ll sites: `packages/core/src/services/message/processor.ts` (structured-failure gate) and `plugins/plugin-discord/messages.ts` (`sendFailureReply`).\n\n## Detailed testing steps\n\n```sh\nbun install --frozen-lockfile\n# core\nbunx vitest run --config packages/core/vitest.config.ts \\\n  packages/core/src/__tests__/failure-reply-policy.test.ts \\\n  packages/core/src/services/message.runtime-failure-suppression.test.ts\nbunx vitest run --config packages/core/vitest.config.ts packages/core/src/services\n# discord\ncd plugins/plugin-discord \u0026\u0026 bunx vitest run\n```\n\nBidirectional proof (same new test files copied onto a clean `357084b3092` worktree, fix absent):\n\n| suite | clean develop | this head |\n|---|---|---|\n| plugin-discord full (`bunx vitest run`) | 6 failed / 869 passed (875), 2 files | 875 passed (875), 100 files |\n| plugin-discord `__tests__/failure-reply-policy.test.ts` | 5 failed / 3 passed | 8 passed |\n| plugin-discord `test/messages-group-coordination-pglite.test.ts` | 1 failed / 9 passed | 10 passed |\n| core `message.runtime-failure-suppression.test.ts` | 4 failed / 16 passed | 20 passed |\n| core `__tests__/failure-reply-policy.test.ts` | n/a (new module) | 15 passed |\n| core `packages/core/src/services` sweep + touched runtime tests | not run | 1864 passed (1864), 107 files |\n\nThe 3 passing-on-baseline cases in the new Discord file are the legacy-behavior pins (DM keeps reply, `all` keeps reply); the 5 failing ones are exactly the suppression cases. Three existing core tests that pin failure-reply TEXT on an addressed group turn (`message.character-failure-templates`, `message.context-overflow-reply`, `message.credit-exhaustion-reply`) opt into `FAILURE_REPLY_POLICY=all` so they keep exercising the template path; the existing pglite \"fences the provider-error reply\" test does the same.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:530c1b3832c514e63c98d39f3f1471cb0c645153 --\u003e\n\u003c!-- evidence-row:before-screenshots --\u0 -time scheduling path, the anchor-registration path, the policy-change dismiss/recreate path, or the deletion/ended-event dismiss path (all still covered by the pre-existing suite, which stays green).\n\n# Background\n\n## What does this PR do?\n\nFixes a lost-idempotency / double-fire bug in calendar meeting auto-join.\n\n`reconcileEvent` decided whether an event's approval/join task already existed by inspecting **only LIVE tasks** (`scheduled | fired | acknowledged`). Once a one-shot task reached a terminal state (`completed | skipped | expired | failed`) it was treated as absent and recreated on the next periodic calendar feed sync — repeatedly, within the same event window:\n\n- **ask policy:** after the owner approves (approval → `completed`, gated join fires), the next sync schedules a **new** approval task, re-prompting the owner to approve a meeting they already approved — once per sync until the event ends.\n- **all policy:** after the join task completes (agent already joined), a mid-meeting sync schedules a **new** join anchored at `start − 1min`, which is now in the past → due immediately → the agent **re-joins** the same meeting.\n\nThe fix gates (re)creation on `existingForMode` — tasks for this event under the current policy mode in **any non-dismissed** state, not just live ones — so a terminal one-shot task is not resurrected within its window. The `live`/`stale` set still drives the policy-change dismiss/recreate path, and only `dismissed` (the state reserved for tasks we intentionally retired: policy change, deletion, ended event) counts as absent, so a genuine later policy switch can still recreate under the new mode.\n\n```diff\n-  const current = live.filter((task) =\u003e taskMode(task) === policy);\n+  const existingForMode = existing.filter(\n+    (task) =\u003e taskMode(task) === policy \u0026\u0026 task.state.status !== \"dismissed\",\n+  );\n   // ...find approval/join in existingForMode (not `current`) before scheduling\n```\n\n## What r\n      scheduled tasks, wallet/on-chain output, generated files, audio, etc.), or\r\n      marked `N/A - \u003creason\u003e`.\r\n\u003c!-- evidence-row:ocr-review --\u003e\r\n- [ ] OCR visual-text review output is attached for UI changes, or marked\r\n      `N/A - \u003creason\u003e` when the change has no rendered visual surface.\r\n\r\n# Evidence Details\r\n\r\n## Real LLM-call trajectory\r\n\r\nFor agent/action/provider/prompt/model changes, use a real live-model run, not\r\nthe deterministic proxy. Produce with:\r\n\r\n```bash\r\n  packages/scenario-runner/bin/eliza-scenarios run \u003cscenario\u003e --report \u003cout.json\u003e\r\n```\r\n\r\nLink the JSON report, run viewer, native jsonl, or write `N/A - \u003creason\u003e`.\r\n\r\n## Backend + frontend logs\r\n\r\nBackend: structured logger lines ([ClassName] …) showing the code path firing end to end.\r\nFrontend: console + network trace showing the request/response and state change.\r\nPaste here inline (wrap long output in a `\u003cdetails\u003e` block), or write\r\n`N/A - \u003creason\u003e`.\r\n\r\n## Screenshots (before / after) + video walkthrough\r\n\r\nFull-page before AND after screenshots are required for any UI change. Include a\r\nvideo click-through of the flow.\r\n\r\n```bash\r\n  bun run evidence:doctor                 (check capture tools; prints fixes for any missing)\r\n  bun run test:e2e:record                 (general E2E recordings)\r\n  bun run test:matrix:review              (capture into one verified evidence bundle)\r\n  bun run evidence:review:no-open -- --bundle=evidence/runs/\u003crun-id\u003e\r\n                                          (re-open the exact matrix run)\r\n  bun run --cwd packages/app audit:app    (app + cloud UI — REQUIRED for UI changes)\r\n```\r\n\r\nThe matrix command creates and verifies one named bundle, then passes that\r\nexact run to the reviewer. Do not replace the `--bundle` path with raw producer\r\ndirectories; `--source` is only for explicit archived/ad-hoc compatibility.\r\n\r\nA UI-touching diff (rendered `.tsx`/`.css`/`.svg` under `packages/app`,\r\n`packages/ui`, `apps/app`, …) MUST attach real screenshot/video/OCR artifacts —\r\nthe CI evidence gate rejects `N/A` on those rows for such diffs, label or not.\r\nIf a capture tool is missing, `evidence:doctor` prints the install command;\r\ninstall it rather than marking evidence `N/A`.\r\n\r\n### Before\r\n\r\n### After\r\n\r\n### Walkthrough video\r\n\r\nOr write `N/A - \u003creason\u003e`.\r\n\r\n## Audio / voice walkthrough\r\n\r\nFor voice / transcript / TTS / STT / omnivoice changes, attach captured audio of\r\nthe real round-trip plus a narrated walkthrough. Or write `N/A - \u003creason\u003e`.\r\n\r\n## Known gaps / failures\r\n\r\nList any command failure, missing artifact, unavailable device, unavailable live\r\nservice, or evidence row marked N/A. Include the exact reason and why it is not a\r\nblocker for this PR.\r\n\r\n## Maintainer CI exception record\r\n\r\nWrite `N/A - no exception requested` unless a maintainer is invoking the narrow\r\n[Maintainer CI exception](../CONTRIBUTING.md#maintainer-ci-exception). When it\r\napplies, preserve every field below and link the exact evidence.\r\n\r\n- PR head SHA: `N/A - no exception requested`\r\n- Validated `origin/develop` SHA: `N/A - no exception requested`\r\n- Live ruleset readback and named bypass eligibility:\r\n  `N/A - no exception requested`\r\n- Queued or failing checks and run URLs: `N/A - no exception requested`\r\n- Infrastructure-only or unrelated-failure proof: `N/A - no exception requested`\r\n- Exact-head commands, exit status, and artifacts: `N/A - no exception requested`\r\n- Exact-head security, secret-scan, and provenance results:\r\n  `N/A - no exception requested`\r\n- Conflict-free and affected-path failure attestation:\r\n  `N/A - no exception requested`\r\n- Independent approving reviewer: `N/A - no exception requested`\r\n- Bypass authorizer: `N/A - no exception requested`\r\n- Merge method: `N/A - no exception requested`\r\n- Rollback owner: `N/A - no exception requested`\r\n- Post-merge `develop` validation: `N/A - no exception requested`\r\n\r\n\u003c!-- If there is anything about the deployment, please make a note. --\u003e\r\n\u003c!--\r\n# Deploy Notes\r\n--\u003e\r\n\r\n\u003c!--  Copy and paste command line output. --\u003e\r\n\u003c!--\r\n## Database changes\r\n--\u003e\r\n\r\n\u003c!--  Please specify deploy instructions if there is something more than the automated steps. --\u003e\r\n\u003c!--\r\n## Deployment instructions\r\n--\u003e\r\n\r\n\u003c!-- If you are on Discord, please join https://discord.gg/ai16z and state your Discord username here for the contributor role and join us in #development-feed --\u003e\r\n\u003c!--\r\n## Discord username\r\n\r\n--\u003e\r\n"])</script><script>self.__next_f.push([1,"1e:T1010e,"])</script><script>self.__next_f.push([1,"Bumps the dev-dependencies group with 29 updates in the / directory:\n\n| Package | From | To |\n| --- | --- | --- |\n| [@biomejs/biome](https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome) | `2.5.8` | `2.5.13` |\n| [@playwright/test](https://github.com/microsoft/playwright) | `1.62.1` | `1.63.0` |\n| [@testing-library/react](https://github.com/testing-library/react-testing-library) | `16.3.2` | `16.3.3` |\n| [@types/bun](https://github.com/DefinitelyTyped/DefinitelyTyped/tree/HEAD/types/bun) | `1.3.14` | `1.4.2` |\n| [@vitejs/plugin-react](https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react) | `6.0.5` | `6.1.1` |\n| [@vitest/coverage-v8](https://github.com/vitest-dev/vitest/tree/HEAD/packages/coverage-v8) | `4.1.10` | `5.0.0` |\n| [bun-types](https://github.com/oven-sh/bun/tree/HEAD/packages/bun-types) | `1.3.14` | `1.4.2` |\n| [fast-check](https://github.com/dubzzz/fast-check/tree/HEAD/packages/fast-check) | `4.9.0` | `4.10.0` |\n| [knip](https://github.com/webpro-nl/knip/tree/HEAD/packages/knip) | `6.32.2` | `6.35.1` |\n| [lerna](https://github.com/lerna/lerna/tree/HEAD/packages/lerna) | `10.0.0` | `10.0.1` |\n| [playwright](https://github.com/microsoft/playwright) | `1.62.1` | `1.63.0` |\n| [react-test-renderer](https://github.com/react/react/tree/HEAD/packages/react-test-renderer) | `19.2.8` | `19.3.0` |\n| [@types/react-test-renderer](https://github.com/DefinitelyTyped/DefinitelyTyped/tree/HEAD/types/react-test-renderer) | `19.1.0` | `19.3.0` |\n| [turbo](https://github.com/vercel/turborepo) | `2.10.10` | `2.10.12` |\n| [vite](https://github.com/vitejs/vite/tree/HEAD/packages/vite) | `8.2.1` | `8.3.0` |\n| [vitest](https://github.com/vitest-dev/vitest/tree/HEAD/packages/vitest) | `4.1.10` | `5.0.0` |\n| [verdaccio](https://github.com/verdaccio/verdaccio) | `6.9.2` | `6.10.3` |\n| [@types/pg](https://github.com/DefinitelyTyped/DefinitelyTyped/tree/HEAD/types/pg) | `8.21.0` | `8.23.1` |\n| [@capacitor/cli](https://github.com/ionic-team/capacitor) | `8.5.0` | `8.5.1` |\n| [@storybook/addon-a11y](https://github.com/storybookjs/storybook/tree/HEAD/code/addons/a11y) | `10.5.8` | `10.6.0` |\n| [@storybook/addon-docs](https://github.com/storybookjs/storybook/tree/HEAD/code/addons/docs) | `10.5.8` | `10.6.0` |\n| [@storybook/addon-themes](https://github.com/storybookjs/storybook/tree/HEAD/code/addons/themes) | `10.5.8` | `10.6.0` |\n| [@storybook/react](https://github.com/storybookjs/storybook/tree/HEAD/code/renderers/react) | `10.5.8` | `10.6.0` |\n| [@storybook/react-vite](https://github.com/storybookjs/storybook/tree/HEAD/code/frameworks/react-vite) | `10.5.8` | `10.6.0` |\n| [@testing-library/user-event](https://github.com/testing-library/user-event) | `14.6.4` | `14.6.7` |\n| [storybook](https://github.com/storybookjs/storybook/tree/HEAD/code/core) | `10.5.8` | `10.6.0` |\n| [@types/ssh2](https://github.com/DefinitelyTyped/DefinitelyTyped/tree/HEAD/types/ssh2) | `1.15.5` | `1.15.6` |\n| [@typescript-eslint/parser](https://github.com/typescript-eslint/typescript-eslint/tree/HEAD/packages/parser) | `8.67.0` | `8.70.0` |\n| [rollup](https://github.com/rollup/rollup) | `4.62.4` | `4.63.1` |\n\n\nUpdates `@biomejs/biome` from 2.5.8 to 2.5.13\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/biomejs/biome/releases\"\u003e@​biomejs/biome's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eBiome CLI v2.5.13\u003c/h2\u003e\n\u003ch2\u003e2.5.13\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11379\"\u003e#11379\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/07a0073c1e1b1de323292968b8988cc6f79ec5c7\"\u003e\u003ccode\u003e07a0073\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Netail\"\u003e\u003ccode\u003e@​Netail\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-layered-styles/\"\u003e\u003ccode\u003euseLayeredStyles\u003c/code\u003e\u003c/a\u003e, which enforces that style rules are defined within a cascade layer and import rules to import its styles into a cascade layer.\u003c/p\u003e\n\u003cpre lang=\"css\"\u003e\u003ccode\u003e/* Invalid */\n@import 'foo.css';\n\u003cp\u003e.my-style {\ncolor: red;\n}\u003c/p\u003e\n\u003cp\u003e/* Valid */\n\u003ca href=\"https://github.com/import\"\u003e\u003ccode\u003e@​import\u003c/code\u003e\u003c/a\u003e 'foo.css' layer(base);\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/layer\"\u003e\u003ccode\u003e@​layer\u003c/code\u003e\u003c/a\u003e base {\n.my-style {\ncolor: red;\n}\n}\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11667\"\u003e#11667\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/e997900c3eaf9d5efaf1ca12a067a962e1a04d0b\"\u003e\u003ccode\u003ee997900\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/devtechedge\"\u003e\u003ccode\u003e@​devtechedge\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-better-dom-traversing\"\u003e\u003ccode\u003euseBetterDomTraversing\u003c/code\u003e\u003c/a\u003e, which prefers \u003ccode\u003e.firstChild\u003c/code\u003e, \u003ccode\u003e.firstElementChild\u003c/code\u003e, \u003ccode\u003e.closest()\u003c/code\u003e, and merged \u003ccode\u003e.querySelector()\u003c/code\u003e calls over positional DOM traversal.\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eelement.childNodes[0];\nelement.children[0];\nelement.parentElement.parentElement;\nelement.querySelector(\u0026quot;a\u0026quot;).querySelector(\u0026quot;b\u0026quot;);\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11620\"\u003e#11620\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/20e513af6fb0127854f4eb5cb9edee0f20d1b543\"\u003e\u003ccode\u003e20e513a\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/jakeleventhal\"\u003e\u003ccode\u003e@​jakeleventhal\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11610\"\u003e#11610\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11611\"\u003e#11611\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11612\"\u003e#11612\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11615\"\u003e#11615\u003c/a\u003e, and \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11616\"\u003e#11616\u003c/a\u003e: Biome no longer fully infers an imported generic declaration just to apply its type arguments, restoring type-aware lint performance for large libraries such as Zod. This improves \u003ca href=\"https://biomejs.dev/linter/rules/use-regexp-exec\"\u003e\u003ccode\u003euseRegexpExec\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://biomejs.dev/linter/rules/no-floating-promises\"\u003e\u003ccode\u003enoFloatingPromises\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://biomejs.dev/linter/rules/no-misused-promises\"\u003e\u003ccode\u003enoMisusedPromises\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://biomejs.dev/linter/rules/use-nullish-coalescing\"\u003e\u003ccode\u003euseNullishCoalescing\u003c/code\u003e\u003c/a\u003e, and \u003ca href=\"https://biomejs.dev/linter/rules/no-unsafe-plus-operands\"\u003e\u003ccode\u003enoUnsafePlusOperands\u003c/code\u003e\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11657\"\u003e#11657\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/e32204014687469e6c6f3684d32caf56311cc118\"\u003e\u003ccode\u003ee322040\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/ematipico\"\u003e\u003ccode\u003e@​ematipico\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/7495\"\u003e#7495\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/no-useless-constructor/\"\u003e\u003ccode\u003enoUselessConstructor\u003c/code\u003e\u003c/a\u003e now ignores TypeScript constructors that forward at least one argument to \u003ccode\u003esuper\u003c/code\u003e, preserving constructors that narrow the subclass's accepted parameter types. The exemption also applies when the parent and child signatures are identical; JavaScript and zero-argument forwarding behavior are unchanged.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11670\"\u003e#11670\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/4969ee1d73b48615f46f024539cfdb847f07064d\"\u003e\u003ccode\u003e4969ee1\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/ematipico\"\u003e\u003ccode\u003e@​ematipico\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/7076\"\u003e#7076\u003c/a\u003e: \u003ca href=\"https://biomejs.dev/linter/rules/use-aria-props-for-role\"\u003e\u003ccode\u003euseAriaPropsForRole\u003c/code\u003e\u003c/a\u003e and \u003ca href=\"https://biomejs.dev/linter/rules/use-focusable-interactive\"\u003e\u003ccode\u003euseFocusableInteractive\u003c/code\u003e\u003c/a\u003e no longer report non-focusable elements with \u003ccode\u003erole=\u0026quot;separator\u0026quot;\u003c/code\u003e. A separator with an explicit \u003ccode\u003etabIndex\u003c/code\u003e or \u003ccode\u003etabindex\u003c/code\u003e still requires \u003ccode\u003earia-valuenow\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11627\"\u003e#11627\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/23aad6df8f71bd9b134633c43d2334771687d10d\"\u003e\u003ccode\u003e23aad6d\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/ematipico\"\u003e\u003ccode\u003e@​ematipico\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/6571\"\u003e#6571\u003c/a\u003e so Grit plugins can capture and inspect multiple named import specifiers.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11631\"\u003e#11631\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/00dbd3a30489617d5bb55466006ac9977612a23b\"\u003e\u003ccode\u003e00dbd3a\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/ematipico\"\u003e\u003ccode\u003e@​ematipico\u003c/code\u003e\u003c/a\u003e! - Reduced unnecessary type inference when type-aware lint rules inspect members of namespace imports from libraries such as Zod. Fixed type inference so blanket re-exports do not expose default exports.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11628\"\u003e#11628\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/a2f8ff7a1eb01f5c91e7154937e17f761863e3bc\"\u003e\u003ccode\u003ea2f8ff7\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/no-xor-as-exponentiation/\"\u003e\u003ccode\u003enoXorAsExponentiation\u003c/code\u003e\u003c/a\u003e, which reports the bitwise XOR operator \u003ccode\u003e^\u003c/code\u003e between two decimal integer literals, where the exponentiation operator \u003ccode\u003e**\u003c/code\u003e was likely intended.\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003econst kibibyte = 2 ^ 10; // 8, not 1024\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/biomejs/biome/blob/main/packages/@biomejs/biome/CHANGELOG.md\"\u003e@​biomejs/biome's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.5.13\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11379\"\u003e#11379\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/07a0073c1e1b1de323292968b8988cc6f79ec5c7\"\u003e\u003ccode\u003e07a0073\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Netail\"\u003e\u003ccode\u003e@​Netail\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-layered-styles/\"\u003e\u003ccode\u003euseLayeredStyles\u003c/code\u003e\u003c/a\u003e, which enforces that style rules are defined within a cascade layer and import rules to import its styles into a cascade layer.\u003c/p\u003e\n\u003cpre lang=\"css\"\u003e\u003ccode\u003e/* Invalid */\n@import 'foo.css';\n\u003cp\u003e.my-style {\ncolor: red;\n}\u003c/p\u003e\n\u003cp\u003e/* Valid */\n\u003ca href=\"https://github.com/import\"\u003e\u003ccode\u003e@​import\u003c/code\u003e\u003c/a\u003e 'foo.css' layer(base);\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/layer\"\u003e\u003ccode\u003e@​layer\u003c/code\u003e\u003c/a\u003e base {\n.my-style {\ncolor: red;\n}\n}\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11667\"\u003e#11667\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/e997900c3eaf9d5efaf1ca12a067a962e1a04d0b\"\u003e\u003ccode\u003ee997900\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/devtechedge\"\u003e\u003ccode\u003e@​devtechedge\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-better-dom-traversing\"\u003e\u003ccode\u003euseBetterDomTraversing\u003c/code\u003e\u003c/a\u003e, which prefers \u003ccode\u003e.firstChild\u003c/code\u003e, \u003ccode\u003e.firstElementChild\u003c/code\u003e, \u003ccode\u003e.closest()\u003c/code\u003e, and merged \u003ccode\u003e.querySelector()\u003c/code\u003e calls over positional DOM traversal.\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eelement.childNodes[0];\nelement.children[0];\nelement.parentElement.parentElement;\nelement.querySelector(\u0026quot;a\u0026quot;).querySelector(\u0026quot;b\u0026quot;);\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11620\"\u003e#11620\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/20e513af6fb0127854f4eb5cb9edee0f20d1b543\"\u003e\u003ccode\u003e20e513a\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/jakeleventhal\"\u003e\u003ccode\u003e@​jakeleventhal\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11610\"\u003e#11610\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11611\"\u003e#11611\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11612\"\u003e#11612\u003c/a\u003e, \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11615\"\u003e#11615\u003c/a\u003e, and \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11616\"\u003e#11616\u003c/a\u003e: Biome no longer fully infers an imported generic declaration just to apply its type arguments, restoring type-aware lint performance for large libraries such as Zod. This improves \u003ca href=\"https://biomejs.dev/linter/rules/use-regexp-exec\"\u003e\u003ccode\u003euseRegexpExec\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://biomejs.dev/linter/rules/no-floating-promises\"\u003e\u003ccode\u003enoFloatingPromises\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://biomejs.dev/linter/rules/no-misused-promises\"\u003e\u003ccode\u003enoMisusedPromises\u003c/code\u003e\u003c/a\u003e, \u003ca href=\"https://biomejs.dev/linter/rules/use-nullish-coalescing\"\u003e\u003ccode\u003euseNullishCoalescing\u003c/code\u003e\u003c/a\u003e, and \u003ca href=\"https://biomejs.dev/linter/rules/no-unsafe-plus-operands\"\u003e\u003ccode\u003enoUnsafePlusOperands\u003c/code\u003e\u003c/a\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11657\"\u003e#11657\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/co li\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/0a31d7c4e1f6cc1b3e08af4aef2ad4b97f6b4f1c\"\u003e\u003ccode\u003e0a31d7c\u003c/code\u003e\u003c/a\u003e ci: release (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11530\"\u003e#11530\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/a20f44a3eb2086e65a6d8077eb89ab81f4d73130\"\u003e\u003ccode\u003ea20f44a\u003c/code\u003e\u003c/a\u003e feat: noBunModules (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11597\"\u003e#11597\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/biomejs/biome/commits/@biomejs/biome@2.5.13/packages/@biomejs/biome\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@playwright/test` from 1.62.1 to 1.63.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/microsoft/playwright/releases\"\u003e@​playwright/test's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev1.63.0\u003c/h2\u003e\n\u003ch2\u003e🔒 Test locks\u003c/h2\u003e\n\u003cp\u003eTests that access a shared resource — an external service, a global account setting — can now declare a named \u003ccode\u003elock\u003c/code\u003e.\nTests that share a lock name never run concurrently, across files, workers and \u003ca href=\"https://playwright.dev/docs/test-projects\"\u003eprojects\u003c/a\u003e, while\neverything else keeps running in parallel:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003etest('update user settings', { lock: 'user-settings' }, async ({ page }) =\u0026gt; {\r\n  // never runs at the same time as other tests holding 'user-settings'\r\n});\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eA test can hold multiple locks, and \u003ca href=\"https://playwright.dev/docs/api/class-test#test-describe\"\u003etest.describe()\u003c/a\u003e accepts a \u003ccode\u003elock\u003c/code\u003e for the whole group.\nLearn more about \u003ca href=\"https://playwright.dev/docs/test-parallel#test-locks\"\u003etest locks\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e🪟 Locate across frames\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://playwright.dev/docs/api/class-page#page-frame-locator\"\u003epage.frameLocator()\u003c/a\u003e and \u003ca href=\"https://playwright.dev/docs/api/class-frame#frame-frame-locator\"\u003eframe.frameLocator()\u003c/a\u003e called without a selector search in any frame of the\nsubtree, so you no longer need to locate the iframe first:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003e// Finds the button in any frame on the page.\r\nawait page.frameLocator().getByRole('button').click();\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe rest of the locator resolves inside a single frame, just like a regular locator, and an error is thrown when it\nmatches elements in several frames.\u003c/p\u003e\n\u003ch2\u003e👁️ Visible-only locators\u003c/h2\u003e\n\u003cp\u003eNew \u003ca href=\"https://playwright.dev/docs/api/class-locator#locator-visible\"\u003elocator.visible()\u003c/a\u003e returns a locator that matches only visible elements. It is the recommended\nreplacement for the \u003ccode\u003e:visible\u003c/code\u003e CSS pseudo-class:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eawait page.locator('button').visible().click();\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e🧾 Step params and subtitles\u003c/h2\u003e\n\u003cp\u003eSteps now carry structured data for reporters. Playwright API steps report the target locator and call arguments,\nand \u003ca href=\"https://playwright.dev/docs/api/class-test#test-step\"\u003etest.step()\u003c/a\u003e accepts \u003ccode\u003esubtitle\u003c/code\u003e and \u003ccode\u003eparams\u003c/code\u003e options for your own steps:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eawait test.step('Login', async () =\u0026gt; {\r\n  // ...\r\n}, { subtitle: 'as admin', params: { user: 'admin' } });\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReporters receive them via \u003ca href=\"https://playwright.dev/docs/api/class-teststep#test-step-subtitle\"\u003etestStep.subtitle\u003c/a\u003e and \u003ca href=\"https://playwright.dev/docs/api/class-teststep#test-step-params\"\u003etestStep.params\u003c/a\u003e. For Playwright API\u003c/p\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/1b025d7e20a026371cd5f98ba0cdce48892737c8\"\u003e\u003ccode\u003e1b025d7\u003c/code\u003e\u003c/a\u003e chore: mark v1.63.0 (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42569\"\u003e#42569\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/0b9956d2247ce88399c3c46a22c1cc0526acb340\"\u003e\u003ccode\u003e0b9956d\u003c/code\u003e\u003c/a\u003e cherry-pick(\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42568\"\u003e#42568\u003c/a\u003e): docs(test): mark test.step subtitle option as since v1.63\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/13dbf102b88305ed96b7791a7843246cd75d4dae\"\u003e\u003ccode\u003e13dbf10\u003c/code\u003e\u003c/a\u003e cherry-pick(\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42552\"\u003e#42552\u003c/a\u003e): docs: release notes for v1.63\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/e93b64ed6f9cf6ac2cc8cb13ad01514b406a7142\"\u003e\u003ccode\u003ee93b64e\u003c/code\u003e\u003c/a\u003e cherry-pick(\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42566\"\u003e#42566\u003c/a\u003e): feat(test): add subtitle option to test.step (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42567\"\u003e#42567\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/2b7a5f2ea1cea04b549c5378498c1b16b6bc6a6f\"\u003e\u003ccode\u003e2b7a5f2\u003c/code\u003e\u003c/a\u003e test: response.body() for content-encoding:identity (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42537\"\u003e#42537\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/648a67c7c1261eefe4113cba2d586417d5e3f2f2\"\u003e\u003ccode\u003e648a67c\u003c/code\u003e\u003c/a\u003e fix(mcp): create parent directories for explicitly named files (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42540\"\u003e#42540\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/7894f5653e7f253c17aa1638c19f63e0d54d5e0e\"\u003e\u003ccode\u003e7894f56\u003c/code\u003e\u003c/a\u003e docs(mcp): clarify how tool file names are resolved (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42538\"\u003e#42538\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/52900a1b99ca51011526afcaf8981970cc1a521a\"\u003e\u003ccode\u003e52900a1\u003c/code\u003e\u003c/a\u003e devops: restore npm publishing from GitHub Actions (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42550\"\u003e#42550\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/8c47f596edebd2460895a5953f2ea67f8b884001\"\u003e\u003ccode\u003e8c47f59\u003c/code\u003e\u003c/a\u003e docs(csharp): fix nonexistent method names in guide examples (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42507\"\u003e#42507\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/bd6e552a63f8cf9b0da0216f392b8e63a08bf1d2\"\u003e\u003ccode\u003ebd6e552\u003c/code\u003e\u003c/a\u003e chore(video): emit frames with real timestamps, drop frame number quantizatio...\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/microsoft/playwright/compare/v1.62.1...v1.63.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@testing-library/react` from 16.3.2 to 16.3.3\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/testing-library/react-testing-library/releases\"\u003e@​testing-library/react's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev16.3.3\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/compare/v16.3.2...v16.3.3\"\u003e16.3.3\u003c/a\u003e (2026-08-27)\u003c/h2\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eAvoid act() re-entrant when dispatching events (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1468\"\u003e#1468\u003c/a\u003e) (\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e20ce75f\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e\u003ccode\u003e20ce75f\u003c/code\u003e\u003c/a\u003e fix: Avoid act() re-entrant when dispatching events (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1468\"\u003e#1468\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/be9d81d91314c9f0bafaa363f70b409b4b31989c\"\u003e\u003ccode\u003ebe9d81d\u003c/code\u003e\u003c/a\u003e docs: fix typos in comments and types (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1446\"\u003e#1446\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/testing-library/react-testing-library/compare/v16.3.2...v16.3.3\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@types/bun` from 1.3.14 to 1.4.2\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/DefinitelyTyped/DefinitelyTyped/commits/HEAD/types/bun\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@vitejs/plugin-react` from 6.0.5 to 6.1.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/releases\"\u003e@​vitejs/plugin-react's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eplugin-react@6.1.1\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003eplugin-react@6.1.0\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/blob/main/packages/plugin-react/CHANGELOG.md\"\u003e@​vitejs/plugin-react's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.1.1 (2026-08-28)\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003e6.1.0 (2026-08-19)\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/04cac5020e349f452d76c5a4f6d788ad4b38930a\"\u003e\u003ccode\u003e04cac50\u003c/code\u003e\u003c/a\u003e release: plugin-react@6.1.1 (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/ 026lt;/div\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed an apostrophe or quote in the text of a JSX element inside an Astro expression ending the expression early, such as \u003ccode\u003e{items.map((i) =\u0026gt; \u0026lt;li\u0026gt;it's {i}\u0026lt;/li\u0026gt;)}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed the children of a \u003ccode\u003e\u0026lt;script\u0026gt;\u003c/code\u003e or \u003ccode\u003e\u0026lt;style\u0026gt;\u003c/code\u003e inside an Astro expression being read as JSX. Their contents are text, so braces and comparisons no longer have to be escaped.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{cond \u0026amp;\u0026amp; \u0026lt;style\u0026gt;a { color: red }\u0026lt;/style\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;script\u0026gt;let x = {a: 1};\u0026lt;/script\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Added support for template literal attribute values inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;C data-x=`t${x}` /\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed unquoted attribute values being rejected inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;a class=foo maxlength=255 href=/about\u0026gt;go\u0026lt;/a\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a template literal nested inside \u003ccode\u003e${}\u003c/code\u003e breaking the rest of an Astro file, such as \u003ccode\u003econst href = `/blog${page === 0 ? '' : `/${page + 1}`}`;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a quote inside a regex character class breaking the rest of an Astro file, such as \u003ccode\u003econst unsafe = /[/\u0026quot;]/;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11508\"\u003e#11508\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/54f3a2ea2765c80df11d04e47cd8da0354f5f7ca\"\u003e\u003ccode\u003e54f3a2e\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-flat-math-min-max/\"\u003e\u003ccode\u003euseFlatMathMinMax\u003c/code\u003e\u003c/a\u003e. Because \u003ccode\u003eMath.min()\u003c/code\u003e and \u003ccode\u003eMath.max()\u003c/code\u003e accept any number of arguments, the rule reports unnecessary nested calls to the same method:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eMath.max(Math.max(a, b), c);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe fix flattens this expression to \u003ccode\u003eMath.max(a, b, c)\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/biomejs/biome/blob/main/packages/@biomejs/biome/CHANGELOG.md\"\u003e@​biomejs/biome's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.5.12\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c e in the text of a JSX element inside an Astro expression ending the expression early, such as \u003ccode\u003e{items.map((i) =\u0026gt; \u0026lt;li\u0026gt;it's {i}\u0026lt;/li\u0026gt;)}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed the children of a \u003ccode\u003e\u0026lt;script\u0026gt;\u003c/code\u003e or \u003ccode\u003e\u0026lt;style\u0026gt;\u003c/code\u003e inside an Astro expression being read as JSX. Their contents are text, so braces and comparisons no longer have to be escaped.\u003c/p\u003e\n\u003cpre lang=\"astro\"\u003e\u003ccode\u003e{cond \u0026amp;\u0026amp; \u0026lt;style\u0026gt;a { color: red }\u0026lt;/style\u0026gt;}\n{cond \u0026amp;\u0026amp; \u0026lt;script\u0026gt;let x = {a: 1};\u0026lt;/script\u0026gt;}\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Added support for template literal attribute values inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;C data-x=`t${x}` /\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed unquoted attribute values being rejected inside an Astro expression, such as \u003ccode\u003e{x \u0026amp;\u0026amp; \u0026lt;a class=foo maxlength=255 href=/about\u0026gt;go\u0026lt;/a\u0026gt;}\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a template literal nested inside \u003ccode\u003e${}\u003c/code\u003e breaking the rest of an Astro file, such as \u003ccode\u003econst href = `/blog${page === 0 ? '' : `/${page + 1}`}`;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11440\"\u003e#11440\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/b88f1ea368c727ff8ebeddcaf9448f6ddc7c4878\"\u003e\u003ccode\u003eb88f1ea\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Princesseuh\"\u003e\u003ccode\u003e@​Princesseuh\u003c/code\u003e\u003c/a\u003e! - Fixed a quote inside a regex character class breaking the rest of an Astro file, such as \u003ccode\u003econst unsafe = /[/\u0026quot;]/;\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11508\"\u003e#11508\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/54f3a2ea2765c80df11d04e47cd8da0354f5f7ca\"\u003e\u003ccode\u003e54f3a2e\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/dyc3\"\u003e\u003ccode\u003e@​dyc3\u003c/code\u003e\u003c/a\u003e! - Added the nursery rule \u003ca href=\"https://biomejs.dev/linter/rules/use-flat-math-min-max/\"\u003e\u003ccode\u003euseFlatMathMinMax\u003c/code\u003e\u003c/a\u003e. Because \u003ccode\u003eMath.min()\u003c/code\u003e and \u003ccode\u003eMath.max()\u003c/code\u003e accept any number of arguments, the rule reports unnecessary nested calls to the same method:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eMath.max(Math.max(a, b), c);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe fix flattens this expression to \u003ccode\u003eMath.max(a, b, c)\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/biomejs/biome/pull/11585\"\u003e#11585\u003c/a\u003e \u003ca href=\"https://github.com/biomejs/biome/commit/c5c8315cc2174b52834513d4c01edd09341e46cd\"\u003e\u003ccode\u003ec5c8315\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/Netail\"\u003e\u003ccode\u003e@​Netail\u003c/code\u003e\u003c/a\u003e! - Fixed \u003ca href=\"https://redirect.github.com/biomejs/biome/issues/11475\"\u003e#11475\u003c/a\u003e: \u003ccode\u003enoUnresolvedImports\u003c/code\u003e no longer reports Bun runtime built-in modules (\u003ccode\u003ebun\u003c/code\u003e, \u003ccode\u003ebun:bundle\u003c/code\u003e, \u003ccode\u003ebun:ffi\u003c/code\u003e, \u003ccode\u003ebun:jsc\u003c/code\u003e, \u003ccode\u003ebun:sqlite\u003c/code\u003e, \u003ccode\u003ebun:test\u003c/code\u003e).\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/0a31d7c4e1f6cc1b3e08af4aef2ad4b97f6b4f1c\"\u003e\u003ccode ef=\"https://github.com/biomejs/biome/commit/1d6210b8ef6a2d2d83ea16e6fb95c124fd370690\"\u003e\u003ccode\u003e1d6210b\u003c/code\u003e\u003c/a\u003e feat(lint/js): add \u003ccode\u003enoUnmodifiedLoopCondition\u003c/code\u003e (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11491\"\u003e#11491\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/2d559316e00764b0843d3d483d4a093fb566de57\"\u003e\u003ccode\u003e2d55931\u003c/code\u003e\u003c/a\u003e feat(js_analyze): added a React naming convention rule (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11554\"\u003e#11554\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/ee69e0e8a90e6231a3b208cda4b3e65ad8b2006a\"\u003e\u003ccode\u003eee69e0e\u003c/code\u003e\u003c/a\u003e fix(schema): domains (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11565\"\u003e#11565\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/biomejs/biome/commit/f5d7896f7115a2d57962471f6d7abfafddb07918\"\u003e\u003ccode\u003ef5d7896\u003c/code\u003e\u003c/a\u003e feat(lint/js): add \u003ccode\u003enoInvalidFileInputAccept\u003c/code\u003e (\u003ca href=\"https://github.com/biomejs/biome/tree/HEAD/packages/@biomejs/biome/issues/11497\"\u003e#11497\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/biomejs/biome/commits/@biomejs/biome@2.5.12/packages/@biomejs/biome\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@playwright/test` from 1.62.1 to 1.63.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/microsoft/playwright/releases\"\u003e@​playwright/test's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev1.63.0\u003c/h2\u003e\n\u003ch2\u003e🔒 Test locks\u003c/h2\u003e\n\u003cp\u003eTests that access a shared resource — an external service, a global account setting — can now declare a named \u003ccode\u003elock\u003c/code\u003e.\nTests that share a lock name never run concurrently, across files, workers and \u003ca href=\"https://playwright.dev/docs/test-projects\"\u003eprojects\u003c/a\u003e, while\neverything else keeps running in parallel:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003etest('update user settings', { lock: 'user-settings' }, async ({ page }) =\u0026gt; {\r\n  // never runs at the same time as other tests holding 'user-settings'\r\n});\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eA test can hold multiple locks, and \u003ca href=\"https://playwright.dev/docs/api/class-test#test-describe\"\u003etest.describe()\u003c/a\u003e accepts a \u003ccode\u003elock\u003c/code\u003e for the whole group.\nLearn more about \u003ca href=\"https://playwright.dev/docs/test-parallel#test-locks\"\u003etest locks\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e🪟 Locate across frames\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://playwright.dev/docs/api/class-page#page-frame-locator\"\u003epage.frameLocator()\u003c/a\u003e and \u003ca href=\"https://playwright.dev/docs/api/class-frame#frame-frame-locator\"\u003eframe.frameLocator()\u003c/a\u003e called without a selector search in any frame of the\nsubtree, so you no longer need to locate the iframe first:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003e// Finds the button in any frame on the page.\r\nawait page.frameLocator().getByRole('button').click();\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe rest of the locator resolves inside a single frame, just like a regular locator, and an error is thrown when it\nmatches elements in several frames.\u003c/p\u003e\n\u003ch2\u003e👁️ Visible-only locators\u003c/h2\u003e\n\u003cp\u003eNew \u003ca href=\"https://playwright.dev/docs/api/class-locator#locator-visible\"\u003elocator.visible()\u003c/a\u003e returns a locator that matches only visible elements. It is the recommended\nreplacement for the \u003ccode\u003e:visible\u003c/code\u003e CSS pseudo-class:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eawait page.locator('button').visible().click();\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e🧾 Step params and subtitles\u003c/h2\u003e\n\u003cp\u003eSteps now carry structured data for reporters. Playwright API steps report the target locator and call arguments,\nand \u003ca href=\"https://playwright.dev/docs/api/class-test#test-step\"\u003etest.step()\u003c/a\u003e accepts \u003ccode\u003esubtitle\u003c/code\u003e and \u003ccode\u003eparams\u003c/code\u003e options for your own steps:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eawait test.step('Login', async () =\u0026gt; {\r\n  // ...\r\n}, { subtitle: 'as admin', params: { user: 'admin' } });\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReporters receive them via \u003ca href=\"https://playwright.dev/docs/api/class-teststep#test-step-subtitle\"\u003etestStep.subtitle\u003c/a\u003e and \u003ca href=\"https://playwright.dev/docs/api/class-teststep#test-step-params\"\u003etestStep.params\u003c/a\u003e. For Playwright API\u003c/p\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/1b025d7e20a026371cd5f98ba0cdce48892737c8\"\u003e\u003ccode\u003e1b025d7\u003c/code\u003e\u003c/a\u003e chore: mark v1.63.0 (\u003ca href=\"https://redirect.github.com/microsoft/playwright/issues/42569\"\u003e#42569\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/microsoft/playwright/commit/0b9956d2247ce88399c
