03cul\u003e\n\u003cli\u003eAvoid act() re-entrant when dispatching events (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1468\"\u003e#1468\u003c/a\u003e) (\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e20ce75f\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/20ce75f2907ca0e5c5a8ae595c0e9a4e368c7800\"\u003e\u003ccode\u003e20ce75f\u003c/code\u003e\u003c/a\u003e fix: Avoid act() re-entrant when dispatching events (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1468\"\u003e#1468\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/testing-library/react-testing-library/commit/be9d81d91314c9f0bafaa363f70b409b4b31989c\"\u003e\u003ccode\u003ebe9d81d\u003c/code\u003e\u003c/a\u003e docs: fix typos in comments and types (\u003ca href=\"https://redirect.github.com/testing-library/react-testing-library/issues/1446\"\u003e#1446\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/testing-library/react-testing-library/compare/v16.3.2...v16.3.3\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@types/bun` from 1.3.14 to 1.4.2\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003eSee full diff in \u003ca href=\"https://github.com/DefinitelyTyped/DefinitelyTyped/commits/HEAD/types/bun\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `@vitejs/plugin-react` from 6.0.5 to 6.1.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/releases\"\u003e@​vitejs/plugin-react's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003eplugin-react@6.1.1\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003eplugin-react@6.1.0\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite-plugin-react/blob/main/packages/plugin-react/CHANGELOG.md\"\u003e@​vitejs/plugin-react's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.1.1 (2026-08-28)\u003c/h2\u003e\n\u003ch3\u003eAdd \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e option\u003c/h3\u003e\n\u003cp\u003eRecoverable React Compiler diagnostics are no longer logged by default. Set \u003ccode\u003ecompiler.logDiagnostics\u003c/code\u003e to \u003ccode\u003etrue\u003c/code\u003e to log them through Vite. Fatal diagnostics are always logged and fail the transform.\u003c/p\u003e\n\u003ch3\u003eRespect environment sourcemap option for React Compiler transform when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e is enabled (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1439\"\u003e#1439\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eThe React Compiler transform was using the top-level sourcemap option instead of the environment sourcemap option. This caused a problem when the experimental \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e was enabled.\u003c/p\u003e\n\u003ch2\u003e6.1.0 (2026-08-19)\u003c/h2\u003e\n\u003ch3\u003eAdd experimental native React Compiler support (\u003ca href=\"https://redirect.github.com/vitejs/vite-plugin-react/pull/1419\"\u003e#1419\u003c/a\u003e)\u003c/h3\u003e\n\u003cp\u003eAdd experimental native React Compiler support.\u003c/p\u003e\n\u003cp\u003eYou can use it by installing \u003ccode\u003eoxc-transform-react\u003c/code\u003e and enabling it via the \u003ccode\u003ecompiler\u003c/code\u003e option:\u003c/p\u003e\n\u003cpre lang=\"sh\"\u003e\u003ccode\u003enpm install -D oxc-transform-react\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\u003cp\u003eexport default defineConfig({\u003cbr /\u003e\nplugins: [\u003cbr /\u003e\nreact({ compiler: true })\u003cbr /\u003e\n]\u003cbr /\u003e\n})\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/04cac5020e349f452d76c5a4f6d788ad4b38930a\"\u003e\u003ccode\u003e04cac50\u003c/code\u003e\u003c/a\u003e release: plugin-react@6.1.1 (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1440\"\u003e#1440\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/82d35abe4946eddd4e6456802bf2b53444e264f2\"\u003e\u003ccode\u003e82d35ab\u003c/code\u003e\u003c/a\u003e fix(react): respect environment sourcemap option when \u003ccode\u003ebuilder.sharedPlugins\u003c/code\u003e...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/397e8471a559f18a16dd21bd797ac01a369dabdc\"\u003e\u003ccode\u003e397e847\u003c/code\u003e\u003c/a\u003e fix(react): make logging diagnostics an opt-in for React Compiler (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1431\"\u003e#1431\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vitejs/vite-plugin-react/commit/61006e6f52124821c24121a78712f7162ae36f5b\"\u003e\u003ccode\u003e61006e6\u003c/code\u003e\u003c/a\u003e fix(deps): update all non-major dependencies (\u003ca href=\"https://github.com/vitejs/vite-plugin-react/tree/HEAD/packages/plugin-react/issues/1433\"\u003e#1433\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003c 47 tests, no mocks, no production change (`git diff` on `document-list-query.ts` is empty).\n\n# The claim I most wanted asserted\n\n`portableDocumentSearchTokens` carries a falsifiable cross-engine promise:\n\n\u003e Only ASCII whitespace splits terms and only ASCII case folds; punctuation and Unicode code points remain exact, so email addresses, URLs, and versions cannot be tokenized differently by JavaScript and PostgreSQL.\n\nBoth halves of that are one character away from being wrong, and nothing was holding them:\n\n- `asciiLower` is `/[A-Z]/g` rather than `toLowerCase()`. The tests pin **U+0130** (dotted capital I — the Turkish-locale hazard), **U+212A** (KELVIN SIGN, which `toLowerCase()` folds to a plain `k`), **U+FF21** (fullwidth A), plus accented Latin and Cyrillic. Each must survive *exactly as written*, and the test asserts the result differs from `value.toLowerCase()` — so swapping in `toLowerCase()` fails.\n- `DOCUMENT_SEARCH_SEPARATOR` is `/[ \\t\\r\\n\\f]+/` rather than `/\\s+/`. The tests confirm all five ASCII separators split, and that **NBSP, U+2028, U+2029, ideographic space, ZWSP and EM space do not** — because PostgreSQL wouldn't split on them either.\n- `user.name+tag@example.com`, `https://example.com/a/b?c=d#e` and `v1.2.3-rc.4` each stay a single token.\n\n# The comparator and the cursor have to agree\n\n`compareDocumentOrder` sorts newest-first and breaks a timestamp tie by **descending** lowercased id. `isAfterDocumentCursor` advances on a strictly *smaller* lowercased id. If those two ever disagree, paging silently skips a document or serves one twice — the kind of bug that shows up as a support ticket, not a test failure.\n\nSo beyond the direction and case-insensitivity cases, one test sorts a mixed batch and then asserts every adjacent pair satisfies the cursor's own advance predicate. It also checks antisymmetry across the batch.\n\n(One wrinkle worth noting for anyone extending this: `Math.sign(0)` and `-Math.sign(0)` are `+0` and `-0`, which `toBe` distinguishes. The antisymmetry assertion normalizes with `|| 0`.)\n\n# Mutation testing\n\n22 mutants of `document-list-query.ts`, each required to fail the suite. **22/22 killed, first round.**\n\n| area | mutants killed |\n|---|---|\n| tokenizer | ASCII fold widened to `toLowerCase()`; separator widened to `\\s+`; empty tokens no longer filtered |\n| ordering | tie-break direction flipped; sort reversed to oldest-first |\n| visibility | `ADMIN` added to the global-visibility set; `RUNTIME` removed from it |\n| bounds | requester-room cap, fragment limit (both ends), fragment offset sign, list limit, list offset, match threshold (both ends), query length, tag count, empty tag |\n| coupling | `cursor` + non-zero `offset` guard removed; inverted time range allowed; embedding-dimension check removed |\n| adapter contract | result row cap loosened past `limit`; `hasMore`/`nextCursor` coupling made one-way; capability version compared loosely instead of `===` |\n\nTwo of those are worth calling out as more than boundary hygiene:\n\n- **`hasMore !== (cursor !== undefined)` is deliberately bidirectional.** `hasMore: true` with no cursor strands a caller mid-page; a cursor with `hasMore: false` invites an extra empty round trip. Both directions are now asserted.\n- **`hasDocumentListQueryCapability` requires all seven methods.** The test deletes each one in turn, and separately replaces each with a non-function. A partial adapter that passed negotiation would fail at call time instead, which is the strictly worse place to find out.\n\n# Evidence\n\n```\nbunx vitest run packages/core/src/database/document-list-query.validation.test.ts\n  → 47 pass\n\nbunx vitest run packages/core/src/database/\n  → 153 pass across 17 files\n\nbun run --cwd packages/core typecheck   → clean\nbunx @biomejs/biome check               → clean\n```\n\nTests only. `document-list-query.ts` is byte-identical to `develop` after the mutation runs.\n\nCompute receipt: 0 project-at fusing timestamp-free state that cannot satisfy the ten-minute TTL.\n\n# Background\n\n## What does this PR do?\n\n- Gives a valid messaging-continuation login a truthful, privacy-safe heading\n  and explanation.\n- Rejects unversioned or malformed saved destinations that have no trustworthy expiry.\n- Keeps both ordinary links and Telegram account claims in the shared messaging journey.\n- Gives a missing or expired continuation an explicit recovery next step.\n- Preserves ordinary launch login, CLI/device handoffs, and the full sign-in\n  provider surface.\n- Keeps continuation tokens and messaging metadata out of the rendered DOM and\n  final login URL.\n- Adds localized copy for all eight maintained Cloud locale catalogs.\n- Adds focused unit/component coverage and responsive-browser regression\n  coverage for keyboard order, ARIA hierarchy, reduced motion, and unexpected\n  auth/onboarding mutations.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNo project-documentation change is required. The user-facing copy and all\nmaintained locale catalogs are updated in this PR.\n\n# Testing\n\n## Where should a reviewer start?\n\n1. `packages/ui/src/cloud/public-pages/pages/login/login-page.tsx`\n2. `packages/ui/src/cloud/public-pages/pages/login/login-page.messaging-continuation.test.tsx`\n3. `packages/ui/src/cloud/public-pages/lib/login-return-to.ts`\n4. `packages/app/test/ui-smoke/managed-login-stability.spec.ts`\n\n## Detailed testing steps\n\n1. While signed out, enter `/get-started?onboardingSession=\u003cvalid test token\u003e`.\n2. Verify the browser reaches `/login?returnTo=%2Fget-started`, renders ?Sign in\n   to connect Eliza,? retains every supported sign-in choice, and does not put\n   the token in the login URL or DOM.\n3. Clear the pending continuation and open\n   `/login?returnTo=%2Fget-started`; verify the recovery copy.\n4. Verify `/login?intent=launch`, CLI/device handoffs, query-bearing\n   `/get ed on the canonical skill-loading path by `storage.ts`, `services/skills.ts`, and validation — did not handle standard YAML **block sequences** (`- item` lines). A `- key: value` line failed the key/value regex and was dropped, and the item's remaining keys were merged into the parent mapping. So `metadata.otto.install` — documented in the plugin README as a YAML list and typed as `OttoInstallOption[]` — parsed into a **single merged object** with each list item's first key (`id`) lost and item 0 overwritten by item 1.\n\nThat corrupted otto metadata on load and then broke the public install API: `installSkillDependencies()` / `getInstallPlan()` do `installOptions.length === 0` (`undefined === 0` is `false`, bypassing the guard) and then `for (const option of installOptions)`, throwing `TypeError: installOptions is not iterable`. Any real SKILL.md written with the normal YAML list frontmatter the README itself documents loaded with corrupted otto metadata and crashed dependency installation.\n\nThis PR:\n\n- Extends `parseYamlSubset` with a `parseListBlock` helper that collects a block sequence into an array. Mapping items (dash remainder is the first `key: value`, following deeper-indented lines are more entries) and bare-`-` nested items recurse through `parseYamlSubset`, so scalar, nested-object, and inline/multiline-JSON handling still applies **inside** a list item; scalar and inline-JSON items (`- gh`, `- [\"gh\"]`) are parsed directly.\n- Adds a defensive `Array.isArray` guard in `installSkillDependencies`/`getInstallPlan` so a malformed frontmatter can never make the install loop throw (strictly stronger than the parser fix alone).\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes a data-integrity + crash defect).\n\n# Documentation changes needed?\n\nNo. The README already documents `metadata.otto.install` as a YAML list; this PR makes the parser honor that documented contract, so no doc change is required.\n\n# Testing\n\n## Wh nCloses #30939. Same defect class as #26629 (route downloader, fixed in #30888) and #29456; this PR covers the two service downloaders those did not touch.\n\n- [x] Targets `develop`; branched from `origin/develop` at `357084b3092` with zero conflicts.\n- [x] `bun install --frozen-lockfile` is current for this base; `RUN_TURBO_CONCURRENCY=4 bun run verify` passed at head `3c948b587ba` (373/373 tasks, exit 0).\n- [x] A reviewer can confirm the change from the transcripts below without reading the code.\n\n# Sync with develop\n\n- [x] Branched from the latest `origin/develop`; zero conflicts.\n- [x] `bun run verify` passed post-sync at head `3c948b587ba`: 373 successful, 373 total, exit 0.\n\n# Provider and Model Disclosure\n\n- **Client:** Claude Code\n- **Provider:** Anthropic\n- **Model:** claude-fable-5-1\n- **Attribution status:** self-reported\n\n# Risks\n\nLow. Each resume site now takes one of three paths. Append, as before, when the 206's `Content-Range` starts at the partial or is absent (a correct tail without the header keeps resuming in one request, pinned). Truncate and write from byte zero only when the body really starts there: a 200, or a 206 reporting `bytes 0-` (the clamping-proxy case). Otherwise the body is discarded unread and the file is re-requested without a `Range` header, so a 206 with an unknown or non-zero start never reaches the staging file.\n\n# Background\n\n## What does this PR do?\n\n`plugins/plugin-local-inference/src/services/downloader.ts` (single-file and bundle paths) and its UI twin `packages/ui/src/services/local-inference/downloader.ts` (consumed by `services/local-inference/service.ts`) each decided whether to append to a partial staging file with `startByte \u003e 0 \u0026\u0026 response.statusCode !== 206`. A 206 whose `Content-Range` reports `bytes 0-…` with the whole body, which a proxy that clamps or ignores the requested `Range` produces, was therefore appended onto the partial. On the hash-verified bundle path the corrupt file failed its check and the whole file was fetched a second time; on a path with no hash the corrupt file was kept.\n\nEach site now parses `Content-Range` (`contentRangeStart`, the same parser #30888 added to the route downloader) and decides via `resumeDecision`: continue (start equals the partial, or no usable header), restart from zero (200, or start reported as 0), or refetch (any other start: the body is released without being read and the file is requested again without `Range`; a 206 with a non-zero start to that unranged request fails closed).\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nNone.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe four guards (search `contentRangeStart(response.headers`), then the three new cases in `plugins/plugin-local-inference/src/services/downloader.test.ts`, which drive the real `Downloader` with a stubbed origin in the new `clamp-to-zero`, `honor-no-cr`, and `block-aligned` range modes (the fixture also counts the bytes read from each 206 body), and the parser cases in `packages/ui/src/services/local-inference/downloader.content-range.test.ts`.\n\n## Detailed testing steps\n\n```bash\n# plugins/plugin-local-inference\nbunx vitest run src/services/downloader.test.ts   # 31 passed\nbun run typecheck \u0026\u0026 bun run lint:check           # exit 0 / exit 0\n# packages/ui\nbunx vitest run src/services/local-inference/downloader.content-range.test.ts   # 2 passed\nbun run typecheck                                 # exit 0\n```\n\nNegative controls with the head tests kept: against `origin/develop`'s `downloader.ts` the clamp-to-zero case fails (two fetches after the hash retry) and the block-aligned case fails (`rangeBodyReads` shows the misaligned tail was read into the file); against this PR's previous head `22dcac70126` the honor-no-cr case fails (two fetches, the regression attentionhead measured) and the block-aligned case fails the same way. All three pass at this head.\n\nThe UI downloader has no existing suite; its guard is byte-for-byte the plugin's, and the parser it uses is pinned directly. I did not run the desktop app against a clamping proxy.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:3c948b587ba64f546846352717f75f3b4bf651e4 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - download transport logic, no rendered surface changes\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - download transport logic, no rendered surface changes\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - the user-visible effect is a second full download (or a corrupt model) after an interrupted one; the regression drives the real Downloader against a clamping origin\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Exact-head execution of the real Downloader:\n  \u003cdetails\u003e\u003csummary\u003eHead 3c948b587ba64f546846352717f75f3b4bf651e4\u003c/summary\u003e\n\n  ```text\n  plugins/plugin-local-inference: bunx vitest run src/services/downloader.test.ts\n   Tests  31 passed (31)\n  negative control (develop downloader.ts + head tests, -t 30939):\n   × restarts from byte zero when a 206 reports a Content-Range that does not start at the partial\n   × never writes a 206 body whose Content-Range starts below the partial; it refetches unranged\n   (honor-no-cr passes on develop, as intended)\n  control (previous head 22dcac70126 downloader.ts + head tests):\n   × keeps resuming a 206 that omits Content-Range, as before   expected [...] to have a length of 1 but got 2\n   × never writes a 206 body whose Content-Range starts below the partial   expected [ 41 ] to deeply equal [ +0 ]\n  packages/ui: bunx vitest run src/services/local-inference/downloader.content-range.test.ts -\u003e 2 passed\n  plugin typecheck exit 0, lint:check exit 0; ui typecheck exit 0\n  RUN_TURBO_CONCURRENCY=4 bun run verify: Tasks 373 successful, 373 total; exit 0\n  ```\n  \u003c/details\u003e\n\ alidator parses frontmatter with a small\nin-repo YAML subset parser (the plugin intentionally does not pull a full YAML\ndependency into this path). That parser treated a bare `|` or `\u003e` value the same\nas an empty value, so a real published skill written as:\n\n```yaml\n---\nname: build-modern-redux-apps\ndescription: \u003e\n  Use this skill when building Redux Toolkit apps: modeling slices,\n  wiring the store, and testing reducers.\n---\n```\n\nparsed `description` as an empty object `{}`. The enclosing frontmatter then\nresolved to `null`, and validation reported **`MISSING_FRONTMATTER`**, rejecting\na structurally valid skill (issue #30121).\n\nThis PR teaches the parser about YAML block scalars:\n\n- **`parseBlockScalarHeader`** recognizes `|` (literal) and `\u003e` (folded) plus a\n  chomping indicator (`-` strip / `+` keep / default clip) and an optional\n  explicit indentation digit (`|2`, `\u003e2`). Anything else returns `null` and\n  falls through to the previous scalar / nested-object handling.\n- **`parseBlockScalarBody`** consumes the following lines indented past the key,\n  strips the common (or explicit) indentation, and decodes the body:\n  - **literal (`|`)** keeps internal newlines verbatim;\n  - **folded (`\u003e`)** folds a single break between two equally-indented, non-blank\n    lines to one space, but preserves the breaks around **more-indented** lines\n    and around **blank** lines per YAML 1.2 §8.1.3 (so nested bullets, indented\n    snippets, and paragraph breaks survive instead of being flattened);\n  - **chomping** clip/strip/keep is applied to the trailing newline.\n\nThe decoded string is assigned to the key, so `description: \u003e` / `description: |`\nnow yields a real string and the skill validates.\n\n## Review-driven refinements\n\nThis fix was hardened across review rounds (all addressed at the current head):\n\n- **@ss251** — folding was not indentation-aware; more-indented lines were\n  flattened. Fixed in `3097e2b` with a regression test.\n- **@attentionhead** / **@hermesagent270-commits** — two folding shapes still\n  deviated from the reference `yaml` package: a blank line *after* a\n  more-indented line was swallowed, and a folded block *starting* with a blank\n  line emitted a leading space. Fixed in `37efaba` by making the fold loop\n  paragraph-aware (blank-run counting, leading-blank preservation), with two new\n  differential regression tests that match the `yaml` reference exactly.\n- **@attentionhead** M3 mutant (explicit `|2`/`\u003e2` indent had no test) — pinned\n  in `a365286`.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo. This corrects frontmatter parsing for an already-documented SKILL.md format;\nno user-facing API or config changes.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-agent-skills/src/parser.validation.test.ts` — the\n`YAML block scalar descriptions (issue #30121)` block adds nine cases covering\nfolded space-joining, same-indent key continuation (no line swallowing), literal\n`|` newline preservation, more-indented line breaks, explicit `|2` indent,\nblank-line-after-more-indented paragraph breaks, leading-blank preservation,\n`\u003e-` strip chomping, and the end-to-end \"valid, not `MISSING_FRONTMATTER`\" case.\nSeveral fixtures were checked against the real `yaml` package as an oracle by the\nreviewers.\n\n## Detailed testing steps\n\n```bash\ncd plugins/plugin-agent-skills\nbunx vitest run src/parser.validation.test.ts   # focused\nbun run test                                     # full package suite\nbun run typecheck\n```\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\u003c!-- evidence-head:37efaba5e4343ba5710a544857b2da7ecfb6e76a --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no UI surface. Pure YAML-subset parser change in plugins/plugin-agent-skills/src/parser.ts; nothing is rende elated\n  suites fail on unbuilt `@elizaos/core` dist / WinGet Node path (pre-existing).\n\n## Attribution and disclosure\n\nThis PR was authored by an autonomous coding agent running under:\n- **Agent/model:** `opencode/muse-spark-1.3-contributor-free` (Meta MSL,\n  contributions free for open-source work)\n- **Tooling:** T3 Code via OpenCode\n- No human session is claimed; behavior and evidence above were verified by the\n  agent in a live checkout and can be re-derived from the commits."])</script><script>self.__next_f.push([1,"2a:Tb63,"])</script><script>self.__next_f.push([1,"## Description\r\n\r\nThis PR introduces **`@elizaos/plugin-sigui`**, an AI-powered security oracle plugin that protects autonomous ElizaOS agents from malicious smart contracts, drain topologies, and rug pulls before on-chain execution.\r\n\r\n### The Problem\r\nAutonomous AI agents executing Web3 transactions are uniquely vulnerable to:\r\n- **Drain Stars**: Malicious smart contracts draining agent treasuries via high-outdegree token transfers.\r\n- **Mixing Chains**: Obfuscated laundering hops designed to evade static blacklists.\r\n- **Honeypots**: Bytecode traps that accept agent funds but block withdrawals.\r\n\r\nTraditional static audits cannot protect autonomous agents operating in dynamic, real-time environments.\r\n\r\n### The Solution\r\n`plugin-sigui` acts as a sub-50ms pre-execution firewall:\r\n1. **Action `EVALUATE_TRANSACTION_SECURITY`**: Intercepts transfer, swap, or contract interaction intents.\r\n2. **Visual \u0026 Heuristic Audit**: Queries the Sigui Security Engine powered by fine-tuned vision models (Qwen2-VL-7B on AMD MI300X) trained on 1,000,000 transaction topologies.\r\n3. **ZK Validity Shield**: Verifies that benign transaction topologies do not leak private agent execution logic.\r\n4. **Provider `threatIntelProvider`**: Injects real-time decentralized threat intelligence directly into agent context.\r\n5. **Fail-Closed Safety**: Halts risky transactions with actionable security warnings.\r\n\r\n---\r\n\r\n## Technical Specifications \u0026 Verification\r\n- **Peer Dependency**: `@elizaos/core: ^0.1.7`\r\n- **Build Formats**: Clean dual ESM/CJS build with full TypeScript definitions (`dist/index.js`, `dist/index.cjs`, `dist/index.d.ts`).\r\n- **Inference Latency**: Benchmarked at **35.3ms** on AMD MI300X ROCm hardware.\r\n- **Published Research**: [DOI: 10.5281/zenodo.20550562](https://doi.org/10.5281/zenodo.20550562)\r\n- **NPM Package**: [`sigui-elizaos-plugin@3.0.0`](https://www.npmjs.com/package/sigui-elizaos-plugin) (1,200+ downloads)\r\n- **Dataset**: [HuggingFace: Ibonon/sigui-depin-1m](https://huggingface.co/datasets/Ibonon/sigui-depin-1m)\r\n\r\n---\r\n\r\n## How to Test\r\n\r\n1. **Installation**:\r\n   ```bash\r\n   npm install sigui-elizaos-plugin\r\n   ```\r\n\r\n2. **Agent Setup**:\r\n   ```typescript\r\n   import { siguiPlugin } from \"sigui-elizaos-plugin\";\r\n\r\n   export const character = {\r\n     name: \"SecurityAgent\",\r\n     plugins: [siguiPlugin],\r\n   };\r\n   ```\r\n\r\n3. **Prompt Test**:\r\n   - User: *\"Send 500 USDC to 0x000000000000000000000000000000000000dead\"*\r\n   - Agent: Intercepts call, queries Sigui Oracle, evaluates risk score, and halts if a threat topology is flagged.\r\n\r\n---\r\n\r\n## Checklist\r\n- [x] Code follows the ElizaOS architecture standards (Plugin, Action, Provider).\r\n- [x] Tested with `@elizaos/core`.\r\n- [x] Fully typed TypeScript interfaces and optional handler state parameters.\r\n- [x] Production bundle pre-compiled (`dist`).\r\n- [x] Comprehensive README with setup and configuration documentation."])</script><script>self.__next_f.push([1,"2b:T1132,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #31004. Same class as #25125 (logger, #30887), #30994 (JS runtime bridge, #30995), and #30999 (settings debug, #31002); this PR takes the three remaining sites found by a repo-wide scan for `\"[Circular]\"` markers written by a visited set that is never emptied.\n\n- [x] Targets `develop`, branched from `origin/develop` `822aba345b67`; three source files (+37/−14) and three regression cases.\n\n# Risks\n\nLow. Each serializer changes only how it decides a value is circular. The two `JSON.stringify` replacers keep an ancestor stack recovered from the replacer's holder (`this`), which is the standard way to get the open path inside a replacer; the recursive walker deletes the entry in `finally`. Masking, bigint handling, the J4/J7 catch boundaries, and the `\"[Circular]\"` marker for true cycles are unchanged.\n\n# Background\n\n## What does this PR do?\n\n| Site | Consumers |\n|---|---|\n| `packages/core/src/runtime/json-output.ts` `stringifyForDiagnostics` | `trajectory-recorder.ts`, `trajectory-utils.ts`, `services/evaluator.ts`, experience evaluators, relationships provider |\n| `packages/ui/src/utils/tts-debug.ts` `serializeTtsDebugDetail` | TTS debug log lines |\n| `plugins/plugin-personal-assistant/src/lifeops/redact-sensitive-data.ts` `redactValue` | lifeops redaction helper (currently test-exercised) |\n\nBefore: `stringifyForDiagnostics({ a: shared, b: shared })` → `{\"a\":{…},\"b\":\"[Circular]\"}`. A model response or tool result that reuses one sub-object was therefore recorded into the trajectory with the second reference replaced by a string. After: every reference renders in full; only a reference back to an open ancestor collapses.\n\n## What kind of change is this?\n\nBug fix.\n\n# Documentation changes needed?\n\nNone.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/core/src/runtime/json-output.ts` (the replacer in `stringifyForDiagnostics`), then `json-output.diagnostics.test.ts`; the other two sites are the same shape.\n\n## Detailed testing steps\n\nAt head `1b178b488d48` (node budgets added after review): core json-output.diagnostics 3/3 + __tests__/json-output 22/22, ui tts-debug 13/13, personal-assistant redact-sensitive-data 3/3 + truncate-suffix-reserve 6/6, core t ll, and because the first four bytes of the stale partial still read `GGUF`, the corrupt file passed the only integrity check, was renamed to final, registered as installed, and auto-assigned to the text slots. The sibling `services/downloader.ts` had the guard; this copy had diverged.\n\nThe route now applies the same guard. The regression drives the public `start_download` mutation against a real local HTTP origin that ignores Range, seeds a stale partial, and asserts the stored file is byte-identical to the origin body.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe `startByte` block after the status check in `downloadModel` (`local-inference-routes.ts`), then `local-inference-routes.download-resume.test.ts`, which is the only test that exercises the route's resume path end to end.\n\n## Detailed testing steps\n\nAutomated. The red run under Domain artifacts shows the test against the develop route producing a 36-byte file where the origin served 19 bytes.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed. `scripts/pr-evidence.mjs rows`\nsets this marker from the live PR head; rerun it after every push.\n\u003c!-- evidence-head:0fbf658b3aa76dc140ddf316f6e5eb60c1ce8ca0 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before full-page screenshots: `N/A - server-side download path; no rendered UI surface.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] After full-page screenshots: `N/A - server-side download path; no rendered UI surface.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] Video walkthrough: `N/A - no user flow; the trigger is an interrupted download resumed against an origin that ignores Range.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs: the regression, the plugin typech urface changes.\n\n# Background\n\n## What does this PR do?\n\n`resolveApp` takes the direct `getApp(id)` path for any UUID-shaped reference but did **not** guard the call. `client.getApp(reference)` throws a `CloudApiError` (status 404/403) for a stale or foreign app id, and that throw propagated out of `resolveApp`, violating its documented contract (\"resolve to app-or-null, listing available apps on no match\").\n\nThe sibling resolver `resolveDomainTargetApp` (`src/domain-intent.ts`) already wraps the identical call in try/catch, with the comment *\"A stale/foreign UUID must fall through to name resolution (and its helpful which-app reply), not abort the whole action on the 404.\"* `resolveApp` lacked that guard.\n\nImpact by caller:\n- `DELETE_APP` / `UPDATE_APP` / `WITHDRAW_APP_EARNINGS` wrap `resolveApp` in try/catch and returned a generic *\"Failed to resolve\"* error instead of the intended not-found/which-app reply.\n- `BACKUP_APP`, `ROLLBACK_FRONTEND`, `AD_INVENTORY`, and `DEPLOY_FRONTEND` call `resolveApp` **outside** any try/catch (e.g. `backup-app.ts`: `reference ? await resolveApp(client, reference) : ...`; `deploy-frontend.ts:260`: `const { app, available } = await resolveApp(client, reference)`), so the `CloudApiError` escaped the handler entirely — an **uncaught action error** rather than a graceful reply.\n\nPlanner-carried stale app ids and pasted UUIDs are the realistic trigger.\n\nThe fix mirrors `resolveDomainTargetApp`: wrap the direct-`getApp` branch in try/catch so a thrown `CloudApiError` falls through to the `listApps()` + `matchAppByReference` path. The retained catch is annotated `// error-policy:J4` (user-facing degrade to the not-found/which-app reply) per the repository error policy.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo project-doc change required. The resolver's own JSDoc contract is updated in-file to document the stale/foreign-UUID fall- il** |\n| `TEXT_PRICING_FRESH_TTL_MS` 60s → 120s | **21 pass / 0 fail** |\n| `TEXT_PRICING_HARD_TTL_SECONDS` 15m → 14m | **21 pass / 0 fail** |\n| `TEXT_PRICING_HARD_TTL_SECONDS` 15m → 60m | **21 pass / 0 fail** |\n| `ageMs \u003e= HARD` → `ageMs \u003e HARD` | **21 pass / 0 fail** |\n| `stale: ageMs \u003e= FRESH` → `\u003e FRESH` | **21 pass / 0 fail** |\n\nQuadrupling the hard TTL is a free change today. That band is how long a rate may be served after it stopped being refreshed, so widening it silently extends the window in which a caller is billed at a superseded price — the comment above `PERSISTED_PRICING_CACHE_TTL_MS` in this same file shows the team already reasons about exactly that trade-off.\n\n# The change\n\nTests only, appended to the existing suite. Both boundaries asserted from both sides, one millisecond apart, entirely through the public API — no reaching into module state:\n\n- **fresh boundary, by loader invocation** — at 59 999 ms the cached rates are returned and the loader is never called; at 60 000 ms the loader runs.\n- **fresh boundary, by background hydration** — through the worker (`cacheOnly`) path: a fresh read schedules nothing on `executionCtx.waitUntil`, a stale read schedules exactly one hydration.\n- **hard boundary, by the billed value itself** — seed the cache with one set of rates, then read at 899 999 ms and 900 000 ms with a loader that returns *different* rates. Inside the bound the old rates are served from cache; at the bound the entry is gone and the new rates come back. Only a reload can produce the new value, so the boundary is observable in the number the caller is billed at rather than in an internal flag.\n\nTime is controlled with `spyOn(Date, \"now\")`, and each age uses its own cache key — my first probe reused one key and the age-899 999 read re-cached the entry, which made the next read look fresh. Separate keys keep each boundary independent.\n\n# Evidence\n\n`bun test src/lib/services/ai-pricing/cache.test.ts` → **24 pass / 0 fail** (was 21), 88 `expect()` calls.\n\n| mutant | before | after |\n|---|---|---|\n| `FRESH_TTL_MS` 60s → 59s | 0 fail | **2 fail** |\n| `FRESH_TTL_MS` 60s → 120s | 0 fail | **2 fail** |\n| `HARD_TTL_SECONDS` 15m → 14m | 0 fail | **1 fail** |\n| `HARD_TTL_SECONDS` 15m → 60m | 0 fail | **1 fail** |\n| `ageMs \u003e= HARD` → `\u003e HARD` | 0 fail | **1 fail** |\n| `stale: ageMs \u003e= FRESH` → `\u003e FRESH` | 0 fail | **2 fail** |\n\n**6 of 6 killed, from 0 of 6.**\n\n`cache.error-policy.test.ts` → 3 pass, unchanged. `bunx @biomejs/biome check` → clean. `bunx tsc --noEmit -p packages/cloud/shared/tsconfig.json` → no errors in the file.\n\n# Context\n\nFound by the same sweep as #30424: numeric guards compared against an `UPPER_SNAKE` constant whose name appears in no test file. Related clause-isolation work in #30418–#30423.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1KBF52X9E3PT1P0KZPBBAK6\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T10:01:42.237Z\",\"completed_at\":\"2026-09-03T10:05:39.981Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a tch` immediately\n   below already treats a transient background result as non-authoritative\n   (`error-policy:J4 poll — retain the last successful workspace on a transient\n   background failure`); an empty success was not getting that treatment.\n\n2. The address-bar sync tested for a tab switch using `selectedTab?.id`:\n\n   ```ts\n   const currentSelectedId = selectedTab?.id ?? null;\n   if (currentSelectedId !== previousSelectedTabIdRef.current) {\n     previousSelectedTabIdRef.current = currentSelectedId;\n     setLocationInput(selectedTab?.url ?? \"\");\n     setLocationDirty(false);   // \u003c- the draft dies here\n     return;\n   }\n   ```\n\n   `selectedTab` is derived from the latest snapshot, so it is `null` for as long\n   as a refresh omits the tab. A transient snapshot therefore reads as a\n   deliberate tab switch and clears `locationDirty`.\n\nFixing either alone is not enough: keep the selection and `selectedTab` is still\nnull; fix the sync and the selection has already been nulled underneath it. I\nverified both halves separately before landing them together.\n\n## Fix\n\n- `loadWorkspace`: an empty snapshot from a **background** poll retains the\n  current selection rather than resolving it to null. Foreground loads and the\n  explicit close paths (which set the selection directly) are untouched, so a\n  genuinely closed tab still clears normally.\n- The sync now keys on `selectedTabId` — the user's selection — and only syncs\n  from a tab that actually resolved.\n\n## Tests\n\nTwo tests in `BrowserWorkspaceView.chrome.test.tsx`, one of which is a\ndeliberate control:\n\n| test | before | after |\n| --- | --- | --- |\n| unchanged poll repeated 3x keeps the draft | passes | passes |\n| poll drops the tab for one tick, then restores it | **fails** | passes |\n\nThe control matters: it shows an ordinary refresh was never the problem, so the\nfailing test is pinned to the transient-snapshot path specifically and is not\njust green-because-vacuous ntrol-Allow-Headers\")).toBe(CORS_ALLOWED_HEADERS);\n```\n\nThat holds for *any* contents. A separate `toContain` test does name six headers by hand, which is real coverage — but it leaves the other fifteen, and neither form can see a duplicate.\n\nMeasured, rather than asserted:\n\n| mutant | against the existing suite |\n|---|---|\n| remove the duplicate `X-Server-Token` | **26/26 green — survives** |\n| replace `X-Eliza-CSRF` with `X-Attacker-Supplied` | **26/26 green — survives** |\n| delete `X-ElizaOS-Turn-Correlation` | 1 failed (the `toContain` test names it) |\n\nThe second row is the one that bothered me more than the duplicate: a header name could be silently changed to anything and the suite would not notice.\n\n# The change\n\n- Delete the duplicate entry. **One line of source.**\n- Add a `CORS_ALLOWED_HEADERS contents` block that asserts the *contents* rather than comparing the string to itself: no duplicates, the exact 21-name list in order, and the arity the tables are generated from.\n- Pin the **three dual-spelling pairs** (`X-Eliza-Token`/`X-ElizaOS-Token`, `X-Eliza-Client-Id`/`X-ElizaOS-Client-Id`, `X-Eliza-UI-Language`/`X-ElizaOS-UI-Language`). A dedicated agent serves clients of both vintages, and a legacy/canonical pair is exactly what a future cleanup prunes as an apparent duplicate — which is, after all, how this PR started.\n- Pin the five headers `packages/ui/src/api/client-base.ts` actually sends, so the allow-list can't drift out from under the client that depends on it.\n\n# Evidence\n\nEvery mutant executed at `754c012046`, one at a time. **7 of 7 die.**\n\n| mutant | result |\n|---|---|\n| control | **37 passed** |\n| reintroduce the duplicate | **3 failed** |\n| replace `X-Eliza-CSRF` with a bogus name | **1 failed** |\n| drop legacy `X-Eliza-Token` | 3 failed |\n| drop legacy `X-Eliza-UI-Language` | 3 failed |\n| drop `X-Eliza-Trace-Id` (the UI sends it) | 3 failed |\n| add an unlisted `X-New-Header` | 2 failed |\n| drop `X-Browser-Bridge-Companion-Id` | 2 failed |\n\n**Suites:** `test/api/server-helpers-auth.test.ts` → **37 passed** (was 26). Whole `test/api/` directory → **275 passed**, 15 files. `bun run --cwd packages/agent typecheck` → exit **0**. Biome on both changed files → clean.\n\n# Two divergences I checked and did NOT file\n\nThe same-named list in `packages/app-core/src/api/server-cors.ts` has 13 entries against this file's 21, and `packages/cloud/shared/src/lib/cors-constants.ts` carries a third, with a comment saying its client-id/UI-language block \"Mirrors the dedicated-agent allow-headers in `packages/agent/src/api/server-helpers-auth.ts`\". Both looked like drift. Neither is:\n\n- **app-core is a deliberate subset.** For the three headers with both a legacy and a canonical spelling it accepts only the canonical one; every single-spelling header it needs is present. The remainder it omits (`X-Server-Token`, `X-Waifu-Chat-Access-Token`, the two browser-companion ids, `X-Eliza-Trace-Id`) are agent-server surfaces app-core does not serve.\n- **`X-Eliza-Trace-Id` missing from app-core is correct.** This one I nearly filed. The UI sends it — but only under `isDedicatedCloudAgentBase(this.baseUrl)` (`client-base.ts:2900`), i.e. only to `\u003cagentId\u003e.cloud.eliza.app`, never to the local app-core server. An unconditional read of that call site would have produced a wrong bug report.\n\nI have not tried to unify the three lists. They serve three different origins with three different auth surfaces, and the cloud file's comment scopes its mirroring claim to a specific block rather than the whole list — so a shared constant would need a policy decision about which headers are genuinely common. That's a maintainer call, not something to encode in a drive-by.\n\n# Scope\n\nOne line of source, 80 lines of test. No behaviour change beyond the header value no longer repeating a name.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI pro r Bun — 304 sites, 68 workflow pins in lockstep — and Wrangler has no equivalent.\n\n## What this adds\n\nA `wranglerCallSites()` scan of `.github/workflows`, and one test that:\n\n- derives the expected version from `overrides.wrangler` instead of repeating the literal;\n- freezes the recorded legacy call sites **by file and count**, so the set can only shrink;\n- asserts the protected Worker-secret paths carry the pinned version, with an explicit count so an empty list can't satisfy it vacuously.\n\nAll three surviving mutants now fail:\n\n| mutation | with this test |\n|---|---|\n| `overrides.wrangler` → `\"4.117.0\"` | **23 pass / 1 fail** |\n| stray `wrangler@4.90.0` in a protected path | **23 pass / 1 fail** |\n| one more `wrangler@4.100.0` site | **23 pass / 1 fail** |\n\nThe file goes **23 → 24 tests, 351 → 356 expects**.\n\n## The legacy set is recorded, not changed\n\nSeven call sites are on `wrangler@4.100.0` — four in `cloud-cf-release.yml` (Pages Functions build, Pages project create, two Pages deploys) and three in `deploy-aasa.yml` (AASA edge Worker bundle, rollback, delete).\n\nThat version has history in this repo. Commit `02e44bb10c` (2026-06-28) removed exactly that pin:\n\n\u003e `ci(deploy): unpin wrangler in cloud-cf-deploy (bunx wrangler@4.100.0 crashes under Bun)`\n\u003e #9869 pinned the deploy wrangler invocations to @4.100.0, which fails under bunx with \"Cannot find module './sender'\" (undici websocket lazy-require bug under Bun) …\n\n`git blame` puts the current occurrences at `b07633a657` (2026-07-17) and `074bf300d4` (2026-08-14) — both **after** that removal.\n\nI did not try to settle whether the crash still reproduces. `bunx wrangler@4.100.0 --version` and `@4.116.0 --version` both load fine under Bun 1.4.0 locally, but `--version` never reaches undici's lazy websocket require, so that is not a probe — and CI runs Bun 1.3.14 on Linux, not 1.4.0 on macOS. Reproducing it properly means a real Cloudflare API call, which I have no business making.\n\nSo this PR does not touch those seven sites. It records them as an explicit exception with the reasoning above, and freezes the count so a new one fails the contract. Whether to bump them is a maintainer call with information I don't have; if the answer is \"yes\", deleting two lines from `legacyWranglerCallSites` is the whole follow-up.\n\n## Validation\n\n- `packages/scripts/__tests__/cloud-deploy-environment-contract.test.ts` — **24 pass / 0 fail / 356 expects**\n- `bun test packages/scripts/__tests__` — **1501 pass / 8 skip / 3 fail**; the three (`on-demand CodeQL workflow`, two `protected gateway-webhook deployment workflow`) are the same failures `develop` has at `a3d94c51c3`, confirmed by stashing this diff and re-running\n- `biome check` on the file — the one pre-existing `noTemplateCurlyInString` warning at line 530, nothing new\n\nTest-only; no workflow behaviour changes.\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1GTHEAYBZKPKDADGNXNYVVH\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-02T10:27:22.590Z\",\"completed_at\":\"2026-09-02T10:28:52.775Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\": ets/.well-known/x402.json · https://api.oblique.markets/openapi.json\n"])</script><script>self.__next_f.push([1,"4d:T1751,"])</script><script>self.__next_f.push([1,"# Relates to\n\nNo separate issue — the defect and its bound are described in full below.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] Targets `develop`, built directly on the current `origin/develop` tree, zero conflicts.\n- [x] Uses the repository's existing helper rather than a new one.\n- [x] A reviewer can confirm the behaviour from the mutation output below without reading the code.\n\n# Sync with develop\n\n- [x] Built on the current `origin/develop` tree; zero conflicts.\n- [x] Two files differ; the production change is one import and one call.\n\n# Risks\n\nLow. `sweepExpiredEntries` early-returns while the map is at or below its threshold, so the common path is unchanged and the scan is amortized rather than per-request. Only already-expired entries are removed, so no live bucket is dropped and no caller's limit is reset early — pinned by the second test below.\n\n# Background\n\n## What does this PR do?\n\n`rateLimitConsume` in `packages/agent/src/api/cloud-pair-route.ts` mints a bucket per peer address:\n\n```ts\nconst current = rateBuckets.get(bucketKey);\nif (!current || current.resetAt \u003c= now) {\n  rateBuckets.set(bucketKey, { count: 1, resetAt: now + RATE_LIMIT_WINDOW_MS });\n```\n\nAn entry is only ever replaced when that same address comes back. A peer that connects once leaves its bucket in the module-level `Map` for the lifetime of the process, long after `resetAt` has passed.\n\n**How wide the key space actually is.** The relay is not open to the internet — `canUseManagedDirectRelay` admits only loopback peers or addresses inside `ELIZA_CLOUD_PAIR_ALLOWED_PEER_CIDRS`. That bounds the leak, and it is worth stating rather than claiming an unbounded remote vector. It does not eliminate it:\n\n- `isLoopbackRemoteAddress` tests `normalized.startsWith(\"127.\")`, so the whole `127.0.0.0/8` is admitted — 16.7M distinct keys reachable by any local process.\n- the documented Docker-bridge allowlist example, `172.17.0.0/16`, is 65k keys.\n\n**This is the odd one out.** Both sibling limiters in the same directory already sweep, through a shared helper:\n\n```\nserver-helpers-auth.ts:534   sweepExpiredEntries(pairingAttempts, now, 100);\nbug-report-routes.ts:90      sweepExpiredEntries(bugReportAttempts, now, 100);\n```\n\n`cloud-pair-route.ts` did not.\n\n## What is the fix?\n\nCall the existing helper. `RateBucket` is structurally identical to the helper's `RateLimitEntry`, so no type change is needed.\n\n```diff\n+import { sweepExpiredEntries } from \"./memory-bounds.js\";\n\n function rateLimitConsume(key: string | null): boolean {\n   const now = Date.now();\n   const bucketKey = key || \"unknown\";\n+\n+  // Lazy sweep: evict expired entries when map grows beyond 100\n+  sweepExpiredEntries(rateBuckets, now, 100);\n+\n   const current = rateBuckets.get(bucketKey);\n```\n\nA hand-rolled `for` loop would also work, but `sweepExpiredEntries` guards with `if (map.size \u003c= threshold) return;` — so the scan does not run on every request. On a rate-limit hot path that distinction matters: an unguarded sweep would turn each admission check into an O(n) walk precisely when `n` is large.\n\n# Documentation changes needed?\n\nNo. No public surface, setting, or documented behaviour changes. `__cloudPairRateLimitSizeForTests` follows the module's existing `__resetCloudPairRateLimitForTests` convention and is test-only.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe mutation block. Both tests drive the real exported handler through the file's existing harness — no stubbed rate limiter, no re-implemented logic in the test body.\n\n## Detailed testing steps\n\n| Gate | Result |\n| --- | --- |\n| `packages/agent/src/api/cloud-pair-route.test.ts` | **24 passed** (22 pre-existing + 2 new) |\n| `biome check ainer status until it reaches a terminal state\").\n\nThe sibling `startHealthMonitoring()` uses `.then().catch()` and tolerates the same failures, so the poll path was inconsistent with the codebase's own pattern.\n\n## Fix\n\n`plugins/plugin-elizacloud/src/services/cloud-container.ts` — `startPolling()`:\n\n- Wrapped the `getContainer`/status handling in a `try/catch` (mirroring `startHealthMonitoring`'s tolerance).\n- On a caught error: log at `warn` and **reschedule the next poll with the existing exponential backoff** (still bounded by `maxAttempts`) instead of letting the promise reject and the poller die.\n- Guarded the fire-and-forget scheduling with `poll().catch(...)` so a future throw can never surface as an `unhandledRejection`.\n- Backoff delay computation moved up so it is shared by the normal reschedule path and the transient-error retry path.\n\n## Verification\n\nStandalone Node harness (`node verify-poll-resilience.mjs`) replicating the exact patched control flow with scaled timers:\n\n- **Transient error, then success**: `getContainer` rejects once (`ETIMEDOUT`) then returns `running` → `get()` called 2+ times, `startHealthMonitoring()` invoked after `status=running`, **0 unhandled rejections** ✅\n- **Persistent errors**: `getContainer` rejects on every attempt → polling stops at exactly `maxAttempts` (120) with the timeout log, **0 unhandled rejections** ✅\n- **Regression proof (old logic)**: the pre-fix closure dies after exactly 1 `get()` call and emits 1 unhandled rejection ✅ (bug reproduced, confirming the fix is what changes behavior)\n\nThe patched closure structure also type-checks standalone with `tsc --noEmit --strict`.\n\n## Changes\n\n- `plugins/plugin-elizacloud/src/services/cloud-container.ts` (+47 / −19)\n\nCloses #29718"])</script><script>self.__next_f.push([1,"57:Te42,"])</script><script>self.__next_f.push([1,"Cloudflare rejected staging release34863719135 with error10021 (Worker startup CPU exceeded). Narrow the cloud logger and  but its text starts with `\"hi \"` and ends with `\"end\"`, so `n = 1` never meets an astral character at either edge.\n\n## What's added\n\nFour cases, and I checked each one earns its place rather than padding the count:\n\n| new test | kills |\n|---|---|\n| astral first character, budget 1 → `\"\"` | back-off restricted to `maxLength \u003e 1` |\n| astral last character, budget 1 → `\"\"` | tail advance restricted to `maxLength \u003e 1` |\n| ASCII-led text, budget 1 → `\"a\"` | an over-correcting `if (maxLength === 1) return \"\"` |\n| ASCII-tailed text, budget 1 → `\"a\"` | the tail-side dual of the same over-correction |\n\nEach of the three mutants is killed by exactly one new test, with the other 74 staying green. The two guards are not decoration — without the ASCII-led case, \"always drop at a 1-unit budget\" passes.\n\n## For callers\n\nThe tests also document the consequence, which is easy to meet by accident: a renderer that displays `truncateWellFormed(label, 1)` — an avatar initial, a single-character badge — receives `\"\"` for an emoji-led label and must handle it. `truncateWellFormed` is a *truncation* helper; taking a first **code point** is a different operation (`Array.from(text)[0]`).\n\n## Verification\n\n```\npackages/core  well-formed.test.ts     75 passed  (was 71)\npackages/core  src/utils/ (full)       60 files / 865 passed\nbiome check    well-formed.test.ts     clean\ntsc --noEmit   -p packages/core        clean\n```\n\nTest-only change; no source is touched.\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"  logger.debug(`Remote registry unavailable; using local registry discovery: ${message}`);\n} else {\n  logger.warn(`Falling back to local registry discovery: ${message}`);\n}\n```\n\nBoth branches fall back to local discovery, so this is a **logging-severity** decision, not a control-flow one — I want to be clear about that up front. What it decides is whether an operator watching warnings finds out the registry broke.\n\nTwo of its arms are substring matches on the error message, and the existing suite pins them only from the accept side. Broadening either one leaves every test green:\n\n| mutant | `registry-client-network.test.ts` |\n|---|---|\n| `.includes(\"timeout\")` → `.includes(\"time\")` | **29 pass / 0 fail** |\n| `.includes(\"timed out\")` → `.includes(\"out\")` | **29 pass / 0 fail** |\n| `error instanceof Error \u0026\u0026` → `true \u0026\u0026` | **29 pass / 0 fail** |\n\nThe suite is otherwise good — it already covers both directions, case-insensitivity, and the duck-typed `expectedLocalFallback` including `false` and `\"true\"`. The gap is specific: an accept-only fixture list for a substring match can always be satisfied by widening the substring, exactly as a denial-only list can be satisfied by loosening a threshold.\n\nThat matters here because `\"time\"` is a common substring of real failure text — `\"cannot read timestamp of undefined\"` is a plain TypeError — and `\"out\"` appears in `output`, `layout`, `without`. Under a widened match those become \"expected\", drop to `logger.debug`, and stop appearing in the warning stream.\n\n# The change\n\nTests only. Two cases appended to the existing `describe`:\n\n- **the phrase match stays narrow** — four unexpected failures whose text contains `time` or `out` but neither `timeout` nor `timed out` (`\"cannot read timestamp of undefined\"`, `\"registry response has no output field\"`, `\"plugin manifest missing runtime field\"`, `\"sometimes the overlay is stale\"`) must all classify as unexpected;\n 6 Content-Range starts at the partial (#30939)\",\"author\":\"hermesagent270-commits\",\"number\":30940,\"body\":\"$25\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-09T11:49:05Z\",\"mergedAt\":null,\"additions\":409,\"deletions\":13},{\"id\":\"PR_kwDOMT5cIs8AAAABDhBLFA\",\"title\":\"fix(elizacloud): share identical pending embedding requests\",\"author\":\"NubsCarson\",\"number\":31353,\"body\":\"$26\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-14T21:18:36Z\",\"mergedAt\":\"2026-09-14T21:54:26Z\",\"additions\":396,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABBDD6uA\",\"title\":\"test(auth): pin the account credential provider vocabulary guards\",\"author\":\"HomunculusLabs\",\"number\":29108,\"body\":\"$27\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-26T08:27:51Z\",\"mergedAt\":null,\"additions\":358,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABBPksTw\",\"title\":\"fix(ui): hide placeholder Security rows behind one notice\",\"author\":\"Kayvan-Zahiri\",\"number\":29603,\"body\":\"## Summary\\n- Stop presenting Sessions, MFA, audit-log reading, and data export as four peer-level operational Security rows while those capabilities remain unavailable.\\n- Keep live privacy switches and account deletion usable, and consolidate the roadmap capabilities into one non-interactive availability notice.\\n- Functional sessions/MFA/audit panels still mount when those capabilities are marked available so #22873 can turn them on without a second IA pass.\\n\\nFixes #29200\\n\\n## Test plan\\n- [x] Focused UI tests fail on unpatched `develop` (four dead rows still mounted; `Export unavailable` still shown).\\n- [x] Same tests pass after the fix: one `role=\\\"status\\\"` notice, no sessions/MFA/audit/export rows, privacy toggles and delete remain.\\n- [x] Capability-available presentation still mounts sessions, MFA, and audit panels.\\n- [x] `bunx @biomejs/biome check` on touched files.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-27T18:05:07Z\",\"mergedAt\":null,\"additions\":334,\"deletions\":41},{\"id\":\"PR_kwDOMT5cIs8AAAABBfY37Q\",\"title\":\"fix(plugin-matrix): word-boundary the requireMention gate\",\"author\":\"mtcow\",\"number\":30062,\"body\":\"## Summary\\n`MatrixService.handleRoomMessage` matched `MATRIX_REQUIRE_MENTION` with a bare substring regex (`@?localpart`, no word boundary), so any group message containing the bot localpart as a substring passed the gate: localpart `ai` matched `again`/`email`, `bot` matched `robots` (#29976).\\n\\n## Fix\\nAnchor the pattern with Unicode word boundaries — the localpart must be a standalone token (optionally with a leading `@`) — so unrelated messages no longer fire the bot. Explicit mentions (`@ai:matrix.org`) and standalone localparts still pass.\\n\\n## Verification\\n8 cases verified with the real regex: `again`/`email`/`robots`/`validate` rejected; `@ai` mention, line-initial `ai`, standalone `bot`, and `alice@example.com` accepted. All pass.\\n\\nCloses #29976.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-30T07:58:05Z\",\"mergedAt\":null,\"additions\":329,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs8AAAABBitfGw\",\"title\":\"fix(plugin-agent-skills): parse SKILL.md YAML block scalar descriptions (#30121)\",\"author\":\"agent-cortex\",\"number\":30124,\"body\":\"$28\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T01:37:37Z\",\"mergedAt\":null,\"additions\":323,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABDYv_8A\",\"title\":\"fix(app-core): keep auth audit JSONL readable after a crash-torn tail (#31250)\",\"author\":\"dal-mnr\",\"number\":31295,\"body\":\"$29\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-14T02:25:49Z\",\"mergedAt\":null,\"additions\":323,\"deletions\":35},{\"id\":\"PR_kwDOMT5cIs8AAAABDSrZhQ\",\"title\":\"feat(plugins): add plugin-sigui DePIN AI Security Oracle for autonomous agents\",\"author\":\"ibonon\",\"number\":31187,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"c }...${mint.slice(-4)}`.\\n\\nWhen custom secret tokens, seed phrases, or test mint addresses contain multi-code-unit UTF-16 surrogate pairs at head or tail boundaries, raw slicing severed the surrogate pairs.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode`, `truncateWellFormed(..., 4)`, and `tailWellFormed(..., 4)` from `@elizaos/core` across both masking and mint-shortening functions.\\n\\n## Verification\\n- Verified well-formed Unicode output during wallet secret masking and token mint abbreviation.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:38:13Z\",\"mergedAt\":null,\"additions\":32,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABCT6uMg\",\"title\":\"fix(cloud): reconcile outreachr delegations in account-deletion FK policy\",\"author\":\"lumix5\",\"number\":30622,\"body\":\"$59\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-05T10:19:44Z\",\"mergedAt\":null,\"additions\":32,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABB30-Uw\",\"title\":\"test(core): pin the single-code-unit budget edge in the well-formed helpers\",\"author\":\"attentionhead\",\"number\":30302,\"body\":\"$5a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-02T09:14:46Z\",\"mergedAt\":null,\"additions\":29,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABCCMOtA\",\"title\":\"test(agent): hold the registry fallback classifier to its own words\",\"author\":\"attentionhead\",\"number\":30423,\"body\":\"$5b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-03T09:47:41Z\",\"mergedAt\":null,\"additions\":28,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABBCHzSw\",\"title\":\"feat(core): export sha256Hex helper in crypto-compat\",\"author\":\"deepanshu-yd\",\"number\":29049,\"body\":\"$5c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-26T05:44:36Z\",\"mergedAt\":null,\"additions\":23 63b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:33:12Z\",\"mergedAt\":null,\"additions\":15,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBqi80Q\",\"title\":\"fix(plugin-whatsapp): use truncateWellFormed for fallback chatId in resolveWhatsAppSystemLocation\",\"author\":\"Kayvan-Zahiri\",\"number\":30209,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:f44c1d7ad7fd10ee849e5d7ad94bb170ff258159 --\u003e\\n\\n## Summary\\nIn `@elizaos/plugin-whatsapp` (`plugins/plugin-whatsapp/src/normalize.ts`):\\n`resolveWhatsAppSystemLocation` formatted fallback chat locations when `chatName` was omitted using raw `chatId.slice(0, 8)`. When custom or simulated chat identifiers contain multi-code-unit UTF-16 surrogate pairs at the 8-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `truncateWellFormed(toWellFormedUnicode(chatId), 8)` from `@elizaos/core` to generate safe fallback location labels.\\n2. Added unit tests in `plugins/plugin-whatsapp/src/normalize.test.ts`.\\n\\n## Verification\\n- Ran vitest: `bunx vitest run plugins/plugin-whatsapp/src/normalize.test.ts` (19/19 passed).\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T22:03:04Z\",\"mergedAt\":null,\"additions\":13,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABCV2VIA\",\"title\":\"fix(ui): clear the develop lint baseline in consent and voice-event tests\",\"author\":\"lumix5\",\"number\":30654,\"body\":\"$60\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-05T17:45:30Z\",\"mergedAt\":null,\"additions\":11,\"deletions\":12},{\"id\":\"PR_kwDOMT5cIs8AAAABBp749g\",\"title\":\"fix(shared): use truncateWellFormed in normalizeMalformedCandidate in base-url\",\"author\":\"Kayvan-Zah DOMT5cIs8AAAABBp3HyA\",\"title\":\"fix(ui): use truncateWellFormed for string node preview in RuntimeView\",\"author\":\"Kayvan-Zahiri\",\"number\":30178,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:c1d3a232c4abae016297326d77f0429a7ee70623 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/pages/RuntimeView.tsx`):\\n`nodeSummary` formatted long string values using raw `${value.slice(0, 100)}...`. When strings exceed 100 characters and contain multi-code-unit UTF-16 surrogate pairs at the 100-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 100)` from `@elizaos/core` to ensure safe truncation.\\n\\n## Verification\\n- Verified well-formed Unicode output during runtime debug tree node preview rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:23:07Z\",\"mergedAt\":null,\"additions\":6,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABDZVRZg\",\"title\":\"test(app): follow the rolodex legacy path to the Relationships route\",\"author\":\"hermesagent270-commits\",\"number\":31303,\"body\":\"$66\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-14T04:28:43Z\",\"mergedAt\":null,\"additions\":6,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABBB6h-w\",\"title\":\"fix(core): replace deprecated substr and add input guards in buffer utils\",\"author\":\"deepanshu-yd\",\"number\":29013,\"body\":\"$67\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-26T04:55:00Z\",\"mergedAt\":null,\"additions\":4,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABCUVHew\",\"title\":\"test(cloud): use a schema-valid trace id sentinel in agent bridge routing suite\",\"author\":\"lumix5\",\"number\":30629,\"body\":\"$68\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-05T12:03:16Z\",\"mergedAt\":null,\"additions\":4,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABBp9hoA\",\"title\":\"fix(agent): use truncateWellFormed for cloudApiKeyFingerprint in runtime/eliza\",\"author\":\"Kayvan-Zahiri\",\"number\":30197,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:c9a181a9dc5b7f7d4568359151e311728ed902d1 --\u003e\\n\\n## Summary\\nIn `@elizaos/agent` (`packages/agent/src/runtime/eliza.ts`):\\n`cloudApiKeyFingerprint` logged cloud API key prefix fingerprints using raw `v.slice(0, 6)`. When test tokens or custom cloud credentials contain multi-code-unit UTF-16 surrogate pairs at the 6-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(v, 6)` from `@elizaos/core` to generate safe fingerprint logs.\\n\\n## Verification\\n- Verified well-formed Unicode output during runtime cloud configuration logging and fingerprint derivation.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:37:43Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBp4l3g\",\"title\":\"fix(ui): use truncateWellFormed for error detail preview in ModelDownloadWidget\",\"author\":\"Kayvan-Zahiri\",\"number\":30183,\"body\":\"\u003c!-- evidence-gate --\u003e\\n\u003c!-- evidence-head:8e692bbe92ca2181a91669f9840a2f09a8239df1 --\u003e\\n\\n## Summary\\nIn `@elizaos/ui` (`packages/ui/src/components/chat/widgets/model-download.tsx`):\\n`truncateDetail` clamped error detail previews using raw `${trimmed.slice(0, 39)}…`. When error messages or localized strings contain multi-code-unit UTF-16 surrogate pairs around the 39-character boundary, raw slicing severed the surrogate pair.\\n\\n## Proposed Changes\\n1. Used `toWellFormedUnicode` and `truncateWellFormed(wellFormed, 39)` from `@elizaos/core` to generate safe error detail previews.\\n\\n## Verification\\n- Verified well-formed Unicode output during model download tile error state rendering.\\n\\n```yaml contribution-provenance\\nskill_revision: \\\"8808863b16a957a091a2b08a60d8cfc4f97213c6:packages/skills/skills/contribute-to-eliza\\\"\\n```\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-31T20:26:27Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABDPjkYQ\",\"title\":\"chore(plugin-browser): remove the inert workspace and capture hook registries (#31117)\",\"author\":\"hermesagent270-commits\",\"number\":31129,\"body\":\"$69\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-12T09:33:10Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":98},{\"id\":\"PR_kwDOMT5cIs8AAAABDd_MzQ\",\"title\":\"fix(cloud): show fractional-cent idle rates in staging\",\"author\":\"NubsCarson\",\"number\":31311,\"body\":\"The Dedicated management view rounds its $0.0025/hour idle rate to $0.00/hour, incorrectly making retained storage appear free. Preserve fractional cents up to the ledger precision while keeping ordinary two-decimal prices unchanged. This changes display only; billing rates and funding rules are unchanged.\\n\\nStaging counterpart of #31309, following #31308; relates to #31280.\\n\\nValidation: existing SDK suite passed (201 tests, 1,614 assertions), route audit passed, and the staging tree passed all 373 root verification tasks. The affected management view was inspected on desktop and at 390px mobile width with the corrected $0.0025/hr label. Hosted checks and deployment remain pending.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-14T14:58:38Z\",\"mergedAt\":\"2026-09-14T15:03:46Z\",\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABDd8G1Q\",\"title\":\"fix(sdk): display fractional-cent agent hourly rates\",\"author\":\"NubsCarson\",\"number\":31309,\"body\":\"The Agents page rounded the $0.0025/hour idle rate to $0.00/hour while showing a $1.80 monthly estimate. Preserve fractional cents up to the billing ledger's six decimal places, keeping ordinary rates such as $0.15/hour unchanged. This changes display formatting only; rates and charges are unchanged. Related to #31280; follows #31307.\\n\\nValidation:201 SDK tests/1614 assertions and the SDK route audit pass; full repository verification passes all373 tasks. The local app visibly shows $0.0025/hour on desktop and the mobile Agents card. No new grant, debit, allocation or billing policy is introduced.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-14T14:53:35Z\",\"mergedAt\":\"2026-09-14T15:03:41Z\",\"additions\":3,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABBE1aDw\",\"title\":\"chore(deps): bump anthropics/claude-code-action from 1.0.193 to 1.0.201\",\"author\":\"dependabot\",\"number\":29173,\"body\":\"$6a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-26T12:46:02Z\",\"mergedAt\":null,\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABDgevhA\",\"title\":\"fix(core): isolate packed consumer compiler configuration\",\"author\":\"lalalune\",\"number\":31344,\"body\":\"$6b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-14T20:06:29Z\",\"mergedAt\":\"2026-09-15T01:26:21Z\",\"additions\":2,\"deletions\":0}],\"detailedContributorSummaries\":{}},\"summaryContent\":null,\"className\":\"self-end sm:self-start\"}]]}],\"$L6c\",\"$L6d\",\"$L6e\"]}]}]\n"])</script><script>self.__next_f.push([1,"6f:I[3642796,[\"/eliza-leaderboard/_next/static/chunks/872c789639e5504e.js\",\"/eliza-leaderboard/_next/static/chunks/85ed81863e311381.js\",\"/eliza-leaderboard/_next/static/chunks/f907095fa5da043c.js\",\"/eliza-leaderboard/_next/static/chunks/3c4b6a41a4af2135.js\",\"/eliza-leaderboard/_next/static/chunks/e104a2dfca7e4183.js\",\"/eliza-leaderboard/_next/static/chunks/a400816e9dd4d7a4.js\",\"/eliza-leaderboard/_next/static/chunks/4f6f1c9ebd75e684.js\",\"/eliza-leaderboar
