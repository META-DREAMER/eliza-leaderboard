register(id)` (or `unregisterMany`) method on `ContextRegistry`, or a constructor/character-level option to seed a reduced definition set (e.g. `Character.contexts?: { exclude?: AgentContext[] }` consulted in `listAvailableContextsForRole`), so a non-LifeOps deployment can drop irrelevant contexts without patching core.\n\n**Describe alternatives you've considered**\n\n- Regex-stripping the rendered catalog lines out of the prompt in a `pre_model` pipeline hook — works, but fragile (breaks silently if `formatAvailableContextsForPrompt`'s line format changes) and duplicates the id list outside the registry.\n- Reaching into `ContextRegistry`'s private `#definitions` field — not viable, it's a genuine private class field.\n\n**Additional context**\n\nConfirmed still open on `develop` as of this writing — `ContextRegistry` (`packages/core/src/runtime/context-registry.ts`) is unchanged from our vendored pin (`184a4cc8`): `register`/`registerMany`/`tryRegister`/`tryRegisterMany`/`listAvailable` only, no removal path."])</script><script>self.__next_f.push([1,"15:T135f,"])</script><script>self.__next_f.push([1,"Record model calls, context choices and tool results for each app-chat turn.\n\n## Detailed Description\n\n### Project / Coordination\n\n- Project board: https://github.com/orgs/elizaOS/projects/15\n- Parent tracker or epic: #17022\n- Coordination Discussion: https://github.com/elizaOS/eliza/discussions/14292\n- Suggested lane tag: `chat-trajectory-proof`\n\n### Alpha Phone allocation\n\nOwner: Nubs. September 11; one working day including the Alpha-relevant review/fixes below. Consolidates #30291 and #30734 without adding days or making batching a required deliverable.\n\n- Reproduce the stats-width report on the current stats path. #30291 records a real database overflow at lifetime totals above 2^31-1; it is not evidence that current develop is still broken. Review existing #30292/#30461 before changing code. If still reproducible, preserve wide aggregate totals and verify the real endpoint beyond the boundary.\n- Measure recorder overhead in a representative app-chat trajectory. #30734 reports repeated writes, but does not establish their contribution to end-to-end latency. Batch only if current measurements justify it; otherwise leave persistence unchanged and record that result.\n- Any batching must preserve every record, ID, timestamp, parent/ordinal link, owner ordering, write barriers, capture/completion order, errors and flush/lifecycle behavior. Prove record equivalence with a real database and report transaction reduction separately from user-visible latency.\n\nThe required outcome is complete, usable chat trajectories. No standalone stats-hardening project or speculative persistence rewrite is added. Original reports retain their reproduction history.\n\n### Scope\n\nMake ordinary app-chat trajectories record the decisions needed to diagnose routing, context, and false-success failures.\n\nThe reported bad-turn trajectory showed `providerAccessCount:36` but `llmCallCount:0`, even though Stage 1 and the planner necessarily used configured models. The persisted trajectory therefore could not answer:\n\n- what Stage 1 received and returned;\n- which contexts/intents/candidate actions were selected;\n- which model/provider handled Stage 1 and planning;\n- which actions/tools were exposed, called, and returned;\n- why VIEWS won over an owner routine;\n- whether the final reply had a matching mutation receipt.\n\nScenario-runner file trajectories have richer stage data; bring the real app/database trajectory path up to the same diagnostic standard without leaking secrets or unbounded private context.\n\nRecord structured stages for message handling, retrieval, planning, tool/action calls and results, evaluation/final reply, and effect receipts. Include model/provider identity, latency/token usage, context/provider attribution hashes, candidate/retrieval scores, and redaction metadata. Errors in trajectory writing are diagnostics (`J7`): warn and `runtime.reportError`, never kill the user turn.\n\nLikely areas:\n\n- core message-service trajectory hooks\n- agent/app trajectory database writer and API\n- Trajectories app view/projection\n- native JSONL/export/redaction tests\n- scenario/app parity tests\n\n### Acceptance Criteria\n\n- [ ] A fresh app-chat turn records nonzero model-call stages for Stage 1/planner/evaluator calls that actually occur.\n- [ ] The trajectory shows selected contexts/intents/candidates, retrieval ranks, exposed tools, tool/action inputs/results, final reply, and matching effect receipt.\n- [ ] Model/provider identity, timing, token/cost fields, cache metadata, and failure state are accurate.\n- [ ] Provider context is attributed and bounded; secrets, credentials, and private content follow existing redaction/privacy rules.\n- [ ] A trajectory write failure warns and reports an error under J7 without fabricating success or breaking the user response.\n- [ ] The Trajectories view/API can inspect the exact workout turn end to end and distinguish VIEWS output from a routine mutation.\n- [ ] App-chat, scenario-runner, and native JSONL schemas have tested semantic parity for the shared stages.\n- [ ] Regression tests cover simple reply, multi-tool success, preview/no-save, tool failure, missing capability, and final receipt rejection.\n\n### Evidence Plan\n\n- [ ] Screenshots or recording: Trajectories view walking through the exact workout turn.\n- [ ] Logs: recorder stage lifecycle, redaction counts, write failure/reportError path.\n- [ ] Real-LLM trajectories: exact before/after transcript with visible Stage 1, planner, OWNER_ROUTINES, result, and final receipt.\n- [ ] Domain artifacts: trajectory DB rows/API JSON plus native JSONL/privacy attestation.\n- [ ] CI or local commands: core/agent/app trajectory tests, export/privacy tests, live scenario, app visual audit if the view changes, and `bun run verify`.\n\n### Claim / Status Notes\n\nBefore working, comment `CLAIMING: app chat trajectory observability` with your lane tag, add this issue to Project 15, set `Status = Claimed`, and set `Claimed by`.\n"])</script><script>self.__next_f.push([1,"16:T8ec,"])</script><script>self.__next_f.push([1,"**Status**\nConfirmed on current tree. `fa9d46be53` (\"refactor bigtime\", 2026-09-23) deleted `plugins/plugin-cli-inference` (the Codex `codex exec` text handler, formerly plugin-codex-cli); neither directory exists now. Nothing registers a `codex-cli` TEXT_SMALL/TEXT_LARGE handler, yet `openai-subscription` is still presented and persisted as a runtime chat backend:\n- `packages/core/src/contracts/first-run-options.ts:131,230,244` (first-run provider union / `SUBSCRIPTION_PROVIDER_SELECTIONS`), and `:730` treats it as the one subscription that needs no additional runtime provider.\n- `packages/ui/src/components/settings/useProviderEntries.ts:276-284` lists it; `ProviderSwitcher.tsx:514-517,587-589` treats it as the only subscription that can drive runtime inference.\n- `packages/ui/src/first-run/first-run-config.ts:150-158` and `packages/agent/src/api/provider-switch-config.ts:678-681,986-1000` write `linkedAccounts` + a direct `llmText` route `backend: openai-subscription` and `model.primary`.\n- `packages/agent/src/api/model-config-routes.ts:677-697` `resolveActiveChat` requires `hasTextHandlerRegistered(runtime, \"codex-cli\")`, which can never be true, so selecting it yields no active chat (users get a dead chat after setup).\n- Stale references: `packages/scripts/release-cohort.json:44` still lists `@elizaos/plugin-codex-cli`; `packages/app/platforms/electrobun/src/subscription-rpc.ts:15`.\n\n**Remaining work**\n- Decide: restore a Codex text handler, or stop offering `openai-subscription` as a chat backend (keep it only as a coding-agent/orchestrator credential, like anthropic-subscription).\n- If removing: drop it from chat-capable first-run/Settings selections, `requiresAdditionalRuntimeProvider`, provider-switch `runtimeApplicable`, and the `resolveActiveChat` branch; migrate persisted `llmText.backend=openai-subscription` configs to an explicit \"choose a provider\" state.\n- Remove `@elizaos/plugin-codex-cli` from release-cohort.json.\n\n**Effort**\nS-M, ~1-2 days.\n\n**Risks**\nExisting users with this route persisted need a visible migration, not silent fallback; orchestrator Codex coding agents (`plugin-agent-orchestrator/src/services/task-agent-frameworks.ts:796,1092,1324`) must keep working.\n\n**Scope changes**\nNone.\n\n\n_Found during backlog triage._\n"])</script><script>self.__next_f.push([1,"17:Td15,"])</script><script>self.__next_f.push([1,"Promote `develop` to `staging`. The current candidate is `0805aecdc2356b2d06d475917dbc08e7bfcadd00`. Develop Full has passed; promotion PR validation and agent-image reconciliation are still running. Keep this PR unmerged until the remaining exact-head checks finish and it receives a fresh independent approval.\n\nThe develop CI repairs address the missing billing translation, Calendar planner fixture shape, paid-plan billing snapshot expectations, cloud cache/mock setup, and a duplicate Capacitor mock export. The final duplicate-key correction landed in `0805aecdc235`; #32869 was closed because that same fix had landed independently. These corrections restore the intended checks without removing tests or weakening failure gates.\n\nCurrent-head validation:\n\n- Local install and `bun run verify`: success on this exact commit, 287/287 Turbo tasks and repository audits; tracked working tree clean.\n\n- Develop Full: https://github.com/elizaOS/eliza/actions/runs/36355095266 — success, including All Tests Passed, Complete manifest, and the reconciliation handoff. The downloaded expected/observed/results manifests were inspected and passed the repository's `verifyCompleteManifest` verifier locally; all four surface rows name this exact commit.\n- Promotion PR validation: https://github.com/elizaOS/eliza/actions/runs/36355102117 — in progress.\n- Agent image: https://github.com/elizaOS/eliza/actions/runs/36356566902 — in progress for this exact commit.\n- Durable reconciliation: https://github.com/elizaOS/eliza/actions/runs/36356503224 — in progress.\n\nSupporting repair evidence: full manual CI passed on `15936604af7ede350f9a7d63733ddd9b4d6e2329` at https://github.com/elizaOS/eliza/actions/runs/36353637542. That head also passed local `bun run verify` (287/287 Turbo tasks plus repository audits) and all six Android cloud-auth regression tests. The recorded evidence is https://github.com/elizaOS/eliza/pull/32869#issuecomment-5860334250. These repair-head results do not replace the current-head runs above.\n\nThe prior full run at `42236ac49869e8ddec373969cc22a8bda2e41c09` passed every test job but failed Quality on `lint/suspicious/noDuplicateObjectKeys`: https://github.com/elizaOS/eliza/actions/runs/36351770799. The duplicate was hidden behind Biome's diagnostic limit; the existing `audit-design.ts` warning was not the failure.\n\nPrior integration work in #32816 reconciled staging ancestry and fixed ambiguous memory deletion; #32828 preserved benchmark corpus and patch bytes during whitespace admission. Their earlier passing results do not qualify the current promotion head.\n\nFinal acceptance: inspect the live PR head and terminal hosted checks immediately before merge, require the independent approval enforced by the staging ruleset, and validate the resulting staging commit afterward. This PR prepares staging promotion only; it does not authorize merging staging into main.\n\nOutstanding updater blocker: the training Dependabot run https://github.com/elizaOS/eliza/actions/runs/36278709464 remains failed because the requested dependency upgrade conflicts with the supported training-backend dependency range. Resolution was reproduced against the current training manifest. No constraint override or disabled check has been introduced; this remains unresolved separately from the passing Develop Full run.\n"])</script><script>self.__next_f.push([1,"18:T16bf,"])</script><script>self.__next_f.push([1,"# Relates to\n\nAction tasks loaded unrelated schemas, sometimes finished without requested readback, and rebuilt avoidable prompt context. Simple arithmetic could unnecessarily enter evaluation. Paused work could lose its original domain when the response handler returned a simple reply.\n\n# Change\n\nKeep the response handler focused on contexts and intents. Use task-scoped `DISCOVER_ACTIONS`, operation-specific schemas, canonical tool ordering, stable evaluator instructions and instruction-aware cache affinity. Document verification/reference codes no longer infer programming work. Complete authorized source text and receipts remain intact.\n\nContinue against every requested outcome, with prerequisite barriers, verified receipts, explicit additional-budget resume, fresh authorization and cancellation. Saved schemas are not reused. Ambiguous effects are parked rather than replayed. Preserve external continuation-worker fixes. Completed simple answers stay on the one-call path.\n\nPreserve exact FILE bytes and final-line-ending evidence. A scoped native object envelope addresses observed Cerebras Qwen argument boundary loss while retaining native schemas, validation, cancellation and canonical hooks. Other providers and handler/evaluator transport are unchanged. Distinguish document identifiers from integrity metadata in evaluation.\n\n# Testing\n\nCurrent candidate: `ce005a06184a4e8c643bc92b33614259a7a02c77`; integrates develop through `93406451`.\n\n- Owning integration qualification: **465 tests passed** across evaluator (85), discovery (82), Cloud usage (123), navigation (59), and contextual retrieval (116).\n- Final follow-up: **71 routing tests**, **59 navigation tests**, full assistant and agent typechecks, and scoped Biome passed. Exact file I/O with empty model contexts no longer adds coding-task hints; explicit coding, delegation and mixed source refactoring remain preserved.\n- Both preserved eight-task cohorts at `6de0cc10`: **8/8 passed each**, with exact bytes, readbacks and requested replies. First: 29 foreground calls, 131,984 input / 63,488 cached / 68,496 fresh (48.10%). Warm repeat: 31 calls, 150,765 input / 90,112 cached / 60,653 fresh (59.77%). All 12 continuation comparisons retained complete evidence and stable system/tool/schema prefixes. These are separate unpaired observations, not a causal speedup or universal cache target.\n- Text and synthetic PCM STT→agent→TTS at `6de0cc10` passed with one handler call and one user/assistant pair each; 2,455 input / 2,048 cached (83.4%). Physical microphone/speaker acceptance is not claimed.\n- Fresh final-head HTML and two-file acceptance: **2/2 passed** with exact bytes, readbacks and replies. Eight foreground calls reported 40,634 input / 22,528 cached / 18,106 fresh (55.44%); both continuation comparisons preserved complete prefixes. All three planner calls used the same five tools and 7,691 schema bytes. Live handlers chose files directly; the empty-context repair is verified by regression tests.\n- Fresh final-head text and synthetic PCM voice: **passed**; one handler call and one user/assistant pair each, 2,455 input / 2,048 cached (83.4%).\n- Hosted exact-head checks: **all passed**. Clean-head `bun run verify`: **passed**, 284/284 package tasks; final audits scanned 7,082 test files with no focused tests or orphaned skips. Source remained clean and unchanged throughout. The earlier `6de0cc10` failure and superseded root run remain recorded; neither is labeled a pass.\n\nDeterministic registered messaging schemas shrink from 23,627 to 10,487 bytes for generic messaging, and 13,973 to 2,274 bytes for inbox search. Full schemas and authorized catalog discovery remain available. Five effect-free live probes selected suitable calls; connector effects were not executed.\n\nThe preserved historical study has all 30 pairs and failures. On 15 common successful pairs with complete usage, calls fell 92→56 and fresh input 296,288→114,140 (61.5% less); weighted cache share was 57.8%→58.8%. Historical acceptance is confounded by provider/client/admission failures and is not final-head reliability evidence.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:ce005a06184a4e8c643bc92b33614259a7a02c77 --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no product UI changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no product UI changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - backend runtime changes; synthetic task acceptance recorded separately.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [Exact-head hosted checks passed](https://github.com/elizaOS/eliza/actions/runs/36369061161); [clean-head root verification and synthetic acceptance evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend behavior change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] [Final and preserved cohort usage, prefix and context evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [Exact-byte/readback task acceptance and final text/PCM parity](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no product rendered surface changes.\n\n# Evidence Details\n\nComplete prompts, wire requests/responses and failed diagnostics remain private local artifacts; public evidence contains synthetic acceptance and allowlisted metrics only. No deployment, physical voice acceptance, universal cache target or distributed exactly-once guarantee is claimed. Outcome interpretation remains model-dependent. Whole-revision historical comparisons include develop changes and do not isolate every gain to one patch.\n"])</script><script>self.__next_f.push([1,"19:T1abc,"])</script><script>self.__next_f.push([1,"Fixes and ports across the connector, search, MCP and wallet plugins. One commit per issue.\n\n## #32027: outbound `data:` and media-store attachments (Discord, Telegram, Slack)\nFixes #32027. Ported from closed #32032 (credit @hermesagent270-commits).\n\n- Adds `resolveOutboundAttachmentBytes` to core. It handles each kind of URL as follows:\n  - `data:` URLs are decoded in process, with a size cap.\n  - Canonical `/api/media/...` handles use the runtime's local fetch.\n  - http(s) URLs go through the SSRF-guarded fetcher.\n  - Filesystem paths and other schemes are rejected without reading disk.\n- Telegram, Discord and Slack now upload the resolved bytes.\n- Logs and delivery evidence carry only a scheme/host/path summary. The base64 payload no longer appears in the Telegram error.\n- If a Telegram attachment fails, the text reply is still sent.\n- Behavior change: Telegram no longer reads local file paths passed as attachment URLs. Treating a model-supplied path as a file on disk was the bug.\n\n## #32026: bounded Discord attachment cache\nFixes #32026. Ported from #32032.\n\n- The cache is now keyed by the stable attachment id instead of the signed CDN URL.\n- It holds at most 64 entries (LRU) with a 2-minute TTL.\n- Extracted transcript text is no longer kept in the cache.\n\n## #31464: per-account Discord disconnect (partial, `Refs`)\n`deleteAccount` used to be a no-op. It now works as follows:\n\n1. **Persist a disabled policy first.** It goes in the runtime cache, keyed by account id and a SHA-256 fingerprint of the token. The token itself is never stored.\n2. **Disconnect the account.** `DiscordService.disconnectAccount`:\n   - blocks new messages for that account only;\n   - drains its admitted turns, within the existing shutdown-drain timeout;\n   - tears down its client, login retry, debouncer, managers and audio sinks.\n3. **Siblings are unaffected.** Other accounts keep running, and the default alias moves to a remaining account.\n4. **Failures are retryable.** A teardown failure throws before the manager deletes its row, and a retry repeats the teardown.\n5. **Restart honors the policy.** After a restart, the service skips the disabled token and the provider stops listing it. Configuring a new token under the same id counts as a replacement and runs normally.\n\nRemaining, outside this plugin:\n- Removing the token from character settings or env. The host's settings owner has to do this; the plugin cannot write it.\n- The issue's gating of all-channel onboarding completion, which belongs to the onboarding flow.\n\n## #31789: typed keyless web-search failures (+ #31785 SSE binding)\nFixes #31789.\n\n- `searchKeylessWeb` now returns `undefined` only when a search succeeds with zero hits.\n- Every provider failure throws `KeylessWebSearchUnavailableError`, with:\n  - a reason: `rate_limited`, `http_error`, `timeout`, `network`, `aborted`, `malformed_response`, `response_too_large`, `unsupported_content_type` or `provider_error`;\n  - the HTTP status and `Retry-After`;\n  - no query text or provider payload in the message.\n- The search takes a caller `AbortSignal` and never dispatches after cancellation.\n- The MCP response parser now handles SSE strictly (#31785):\n  - it parses complete SSE events, including multi-line and unspaced `data:` fields;\n  - it ignores notifications and responses to other request ids;\n  - identical replays are collapsed, and conflicting or missing responses are rejected.\n- Callers updated: the agent `WEB_SEARCH` action, the edge runner, coding-tools and the cloud keyless search. A provider outage is now reported as unavailable, not as \"no results\" / `no_match`.\n\n## #29650: platform-filtered MCP tool discovery\nFixes #29650.\n\n- `Tier2ToolIndex.search` now ranks the whole index, filters by platform, and only then applies offset and limit.\n- It returns the total match count, and `SEARCH_ACTIONS` reports `totalMatches` and `hasMore`.\n\n## #29930: EVM relative swap sizing (money path)\nFixes #29930. Reworked from conflicting #29933 (credit @agent-cortex).\n\n- Half / max / percent are now sized from the balance of the token being sold:\n  - **ERC-20:** the token's on-chain `balanceOf` and `decimals`. Symbols resolve through Li.Fi, the same way `SwapAction` does. `max` spends the full balance.\n  - **Native asset:** the native balance, and `max` keeps the 10% gas reserve.\n- All math uses bigint raw units, so large, dust and high-precision balances are never rounded through floats.\n- A failed balance read, an unconfigured chain or a zero result throws `INVALID_PARAMS`. The code never falls back to another token's balance.\n\n## #31110: Solana RPC failure shown as $0\nFixes #31110. Ported from conflicting #31127 (credit @hermesagent270-commits).\n\n- The token-account and SOL balance reads now throw `ElizaError`:\n  - `SOLANA_RPC_UNAVAILABLE` for an RPC failure;\n  - `SOLANA_RPC_RATE_LIMITED` after 3 backed-off attempts on 429. The old code retried 429 without limit.\n- `updateWalletData` no longer caches an empty portfolio when a read fails, so the last known value stays.\n- A failed first refresh no longer makes the configured wallet look absent.\n- The wallet routes answer 503 with the typed code.\n\n## #30151: web wake word matched as a substring\nFixes #30151. Ported from closed #30152 (credit @agent-cortex).\n\n- The trigger must now be a standalone token, so \"elizabeth\" no longer fires \"eliza\".\n- The boundary rule is relaxed for scripts written without spaces (CJK, Thai and similar).\n\n## Verification\nEach package's tests, typecheck and lint were run.\n\n| Package | Tests | Typecheck | Lint |\n|---|---|---|---|\n| `plugins/plugin-native-swabble` | 60/60 pass | pass | pass |\n| `plugins/plugin-wallet` | swap-amount-mode 20/20, `service.rpc-errors` 7/7 | pass (`tsconfig` + `tsconfig.ui`) | biome clean on changed files |\n| `packages/core` | `media/outbound.test.ts` 10/10 | pass | pass |\n| `plugins/plugin-discord` | full suite: 102 files, 825 tests pass | pass | pass |\n| `plugins/plugin-telegram` | `messageManager` + outbound-media 51/51 | pass | pass (6 existing warnings) |\n| `plugins/plugin-slack` | outbound-attachments 8/8 | pass | pass |\n| `plugins/plugin-web-search` | full suite 53/53 | pass | pass |\n| `plugins/plugin-coding-tools` | `web-search.test.ts` 10/10 | pass | pass |\n| `packages/agent` | — | pass | pass |\n| `packages/cloud/shared` | `bun test .../bm25-index.test.ts` 3/3 | pass | pass |\n\nRoot `verify` pieces run: `ensure-plugin-test-conventions --check`, `audit-test-lane-membership`, `audit-focused-skipped-tests` and `core/scripts/verify-package.ts` all pass. The full turbo `typecheck lint:check` across the repo was not run.\n\nTelegram and Slack typecheck against core's built `dist`, so core has to be rebuilt (`bun run build` in `packages/core`) before those two typecheck.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"1a:T24ef,"])</script><script>self.__next_f.push([1,"Cloud sign-in and session, the agent health surface, the X connector callback, and Cloud UI fixes. There is one commit per issue. Partial issues use `Refs`, and their remaining work is listed below.\n\n## #31531: mobile pricing page scroll\nFixes #31531\n\n`PricingPage` now has its own `h-[100dvh] overflow-y-auto` scroll region, like the other public pages. The app root clips overflow, which left the renewal disclosure and the **Open billing** link out of reach at 390x844. The cloud-surfaces audit (`pricing mobile`/`desktop`) now uses real mouse-wheel input until Open billing is inside the viewport. It does not use `scrollIntoView`, because that can also scroll an overflow-hidden root.\n\n## #29593: X OAuth callback fails closed\nFixes #29593\n\nThis ports the source changes from #29601 (credit: kzahiri1, standujar). A shared `x-identity` rule (a non-empty user id and username) now gates the callback success redirect and proof, owner identity linking, the OAuth2 token-exchange identity, and the catalog projection.\n- If the identity is missing, the redirect carries only `twitter_error=provider_identity_verification_failed`. The catalog lists the connection as `error` instead of `active` with `\"unknown\"`, and the credentials stay recoverable through `getToken`.\n- Raw provider diagnostics no longer reach redirect URLs or logs.\n- #29601's unit suites were not ported. They target test files that were retired on develop.\n\n## #29283: cold deep links behind the private-registration gate\nFixes #29283\n\nThis ports #29602. Individually registered `cloud`/`admin` routes now go through the same barrier as the `/cloud/*` wildcard: pending, then the designed unavailable screen with retry, then ready. Public routes, the session gate and the apex redirect order are unchanged.\n\nThe existing hosted-management test now installs a resolved private load, because every managed route comes from that load. Cold deep links in a real browser are also covered by the cloud-surfaces audit route table.\n\n## #30228: canRespond reflects Cloud model availability\nFixes #30228\n\n`CloudModelRegistryService` now evaluates the effective TEXT_SMALL/TEXT_LARGE ids against its cached, non-billable `/models` catalog. It returns a typed readiness: `available`, `unknown`, or `model_not_available` with `MODEL_NOT_AVAILABLE`, the config key and the model id.\n- The read is synchronous and makes no inference call. A stale catalog schedules one bounded background refresh, with a 30-minute TTL and a 60-second retry after a failure.\n- `computeCanRespond` returns false only when the catalog positively says a model is not listed **and** Eliza Cloud is the only registered provider for that model type. A catalog outage stays `unknown` and never gates chat.\n- `/api/status`, `/api/health` and the WS status events now carry `modelReadiness`. The chat composer names the invalid setting instead of asking the owner to set up a provider.\n\n## #22552: first-turn cache warming (partial)\nRefs #22552\n- Opening a Shared conversation (`GET .../api/conversations`) now schedules, under `waitUntil`, the prewarm the first turn needs. Personal Shared warms its rate-limit gate and its conversation object. Sandbox-backed shared agents run the provision-time legs.\n- The keepwarm cron now warms each recently active Personal Shared room through a new `listRecentlyActiveRooms` read (bounded and sequential), using the same start-empty semantics as the turns themselves. It previously skipped these identities entirely.\n- The turn path still fails closed with the retryable 503. Nothing absorbs or awaits hydration.\n\n**Remaining:**\n- The keepwarm cron cannot warm the organization-scoped rate-limit gate for rowless `personal:\u003cuuid\u003e` identities. The id is a one-way hash, and `shared_runtime_history` has no organization column, so fixing this needs a schema or owner decision. Session start covers it for app opens.\n- The #27685 transcript-anchor loss has no proven root cause. It needs the receipt and history-phase diagnostics plus a staging run.\n- The 503-rate and time-to-first-reply re-measurement, with a pre-stated n, needs staging.\n\n## #30806: inference admission latency (partial)\nRefs #30806\n- Done: aged API-key cache hits on the deferred-credential path (paid Worker routes) now schedule the same coalesced, retained background refresh as the standalone path (#30722). Previously they fell off the 60-second TTL into a cold authoritative request.\n- Already fixed on develop:\n  - #30860: skip-mode distributed memo writes (#30909 merged).\n  - #30718: admission hydration now reads balance and revision in the single policy statement, so there is no separate balance SELECT.\n\n**Remaining:**\n- #30865 / #30914 (drop the affiliate settlement readback) is in `credits.ts`, which the billing branch owns, so it was not ported.\n- #30724: fold the key and user/org lookups into one primary read. This needs a repository join that preserves the identity shaping in `findUserWithOrganizationById`, plus a real-DB test.\n- #30715: move subscription-funded admission off `reserveSynchronously` onto an allowance-aware Durable Object authority. This is a billing design change and needs the billing owner.\n- #30796: enable `INFERENCE_STRONG_REVOCATION_ENABLED` in production after a staging allow/deny/revoke canary, through a normal release.\n- Local Worker-to-Cerebras trace, and staging cold/warm/aged timing.\n\n## #29918: coherent sign-in and recovery (partial)\nRefs #29918\n\nRe-landed from the closed draft #30920 (credit: standujar):\n- The hosted OAuth redirect always returns to the launching origin. Previews used to bounce to `staging.eliza.app`, where the origin-local PKCE verifier could not be consumed.\n- Bootstrap recovery screen accessibility (contrast, focus treatment, 44px Start over) with its full-app spec.\n\n**Remaining:**\n- The rest of #30920 is about 24k lines of owned session authority and desktop/native persistence. It depends on its own large first commit and was not re-landed. The post-confirmation session revalidation (c3b3a941) depends on that commit's options plumbing.\n- The `/join` error-surface logout failure is not reproduced in code. A likely suspect is that `signOutFromSsoBridgedHost` skips the server logout on hosts outside `ELIZA_CLOUD_DIRECT_API_BY_HOST`. It needs the failing staging trace.\n- #16921 (one durable owner activation turn plus persisted first goal) is not implemented. It needs an owner decision on eligibility and migration for established agents. It also needs a single owner across the shared Durable Object and dedicated runtimes, and it conflicts with the current \"never fabricate assistant turns\" greeting policy in `conversation-routes.ts`.\n- The per-method desktop/mobile matrix needs staging.\n\n## #16420: native iOS Cloud authentication (partial)\nRefs #16420\n- New `ElizaCloudAuthSessionPlugin` (App target, registered in `ElizaBridgeViewController`, added to the Xcode project). It runs `ASWebAuthenticationSession` with the claimed HTTPS callback `https://eliza.app/auth/callback` on iOS 17.4+. The login hosts are an allowlist, and the callback host and path are fixed natively. One session owns a sign-in at a time.\n- `ios-cloud-auth.ts` reuses the shared mobile PKCE client (S256, config, token, ACK) with an in-memory verifier. It joins concurrent attempts and never replays a consumed code.\n- The credential is written before the ACK into the Steward token store, which the storage bridge already backs with the Keychain.\n- `useCloudState` takes the native path on iOS and keeps the device-code fallback when it is unavailable.\n\n**Remaining (needs Xcode signing, a device, and a deploy):**\n- Confirm the `eliza.app` AASA covers `webcredentials` and `/auth/callback` for the signed team and bundle.\n- Enable the mobile app-auth config routes in staging and production.\n- Make store builds Cloud-only by default.\n- Clean-install device runs on iOS and Android.\n- Decide on iOS 16.0–17.4. The deployment target is 16.0 and HTTPS callbacks need 17.4, so those devices keep the device-code fallback.\n\n## Verification\n- `plugins/plugin-elizacloud`: `bunx vitest run __tests__/cloud-model-readiness.test.ts`: 5/5 pass (real HTTP catalog server). `bun run typecheck`: pass.\n- `packages/agent`: `bun run typecheck`: pass.\n- `packages/ui`: `bun run typecheck`: pass.\n  - `src/cloud/shell/CloudRouterShell.private-registration`: 15/15.\n  - `CloudRouterShell.root-route`: pass.\n  - `src/cloud/public-pages/pages/login/steward-login-section.oauth-launch`: 22/22.\n  - `src/ios-cloud`: 5/5.\n- `packages/cloud/shared`: `tsc --noEmit`: pass. `bun test src/db/repositories/shared-runtime-history-merge.integration.test.ts` (PGlite): 3/3.\n- `packages/cloud/api`: `tsc --noEmit`: pass. The router-contract and worker-bundle dry-run were not run because disk was tight, and no routes were added.\n- Swift: `ElizaCloudAuthSessionPlugin.swift` typechecks against the iPhoneSimulator 26.4 SDK (`-target arm64-apple-ios16.0-simulator`) with a stub Capacitor module. It has not had a full Xcode build.\n- Biome check is clean on every touched file.\n- Not run to completion: the Playwright audit-cloud `pricing` spec and the bootstrap-accessibility spec. The live-stack renderer build timed out on this machine (`renderer-build process-timed-out`, a shared, heavily loaded host). Both specs still need CI or a local run, plus the app visual audit at desktop and mobile sizes.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"1b:T22b1,"])</script><script>self.__next_f.push([1,"Backlog fixes across `packages/agent`, `packages/core`, `plugins/plugin-sql` (plus the two `plugin-assistant` seams the audience renewal needs). One commit per issue.\n\n## #32016: agent export secrets (Fixes #32016)\nThe maintainer closed #32028 because a migration bundle is meant to carry credentials, and asked for a secrets-free export to be **opt-in** instead. So this PR does that:\n- The default bundle still carries `secrets` / `settings.secrets`, protected by the bundle password. The module header now says so, where it used to imply they were excluded.\n- `POST /api/agent/export` accepts `excludeSecrets: true` (core contract, route, UI client). That option strips both containers from the agent record and from the runtime character. A non-object `settings` gets a typed `AGENT_EXPORT_INVALID_SETTINGS` error.\n- Import is unchanged. A default bundle restores the credentials it carries.\n- Test: `test/agent-transfer-secrets.test.ts` runs on real PGlite. It checks that a default bundle round-trips `settings.secrets`, and that a credential-free bundle has no secret in the decrypted payload or on the imported agent.\n\n## #31952: atomic content-addressed media writer (Fixes #31952)\nPorted from #31973 and cut down as the maintainer asked:\n- Persist, restore and the pin ledger now share one write-temp-then-rename helper.\n- If a file already exists under a content hash but its size differs from the payload, it is rewritten.\n- Dropped from the original PR: the extra fsync, the GC sweep and the logging.\n- Test: `test/media-store-atomic-persistence.test.ts` runs on the real filesystem. It covers repair on persist, repair on restore, idempotent re-persist, and a failed rename that leaves no partial file. It fails 4/5 on develop and passes with the fix.\n- Not done: the #30019 sub-item (the plugin-meetings duplicate writer) is outside this PR's scope.\n\n## #31953: WebSocket fan-out backpressure (Fixes #31953)\nPorted from #31974.\n- A peer's queued bytes are the transport buffer plus frames waiting on host admission.\n- A peer above the soft limit keeps getting every frame for a grace period. If it still hasn't drained, it is terminated. Above the hard limit it is terminated at once.\n- Frames are never skipped on a live socket. The client sees the termination and replays from the event buffer when it reconnects.\n- A ping/pong sweep prunes peers that stop answering.\n- Note for review: #31974 was closed because of a general concern about caps. This version never drops frames silently; the only failure mode is an observable disconnect followed by replay.\n- Test: `test/event-hub-backpressure.test.ts` uses a real `ws` server and clients. A stalled peer is bounded and terminated while a healthy peer gets all 2000 frames. A peer that stops answering pings is pruned.\n\n## #31239: trade-mode write failure (Fixes #31239)\nPorted from #31259.\n- A failed `saveElizaConfig` restores the previous in-memory shape, including removing a `features` object or mode key the handler itself created.\n- The route then answers a structured 500 instead of `ok: true`.\n- Test: `test/trade-mode-persistence-http.test.ts` drives the handler over loopback HTTP with the real config writer, with the config path blocked by a directory.\n\n## #31004: shared references treated as cycles (Refs #31004)\n- `stringifyForDiagnostics` (core) and the JS runtime bridge marshaller now track only the open ancestor path. True cycles are still marked, and nothing is truncated.\n- The scheduling DAG validation site was already fixed by #30932, and that PR has tests.\n- Tests: `packages/core/src/runtime/json-output.diagnostics.test.ts` and `packages/agent/test/js-runtime-bridge-shared-refs.test.ts`, which runs the real host-node bridge.\n- Tracker items outside this area are still open: `ui` tts-debug, `plugin-personal-assistant` redact-sensitive-data, and logger #25125.\n\n## #31251: shared registries and ElizaError identity (Fixes #31251)\n- `ElizaError` now carries a `Symbol.for` brand on its prototype and a `Symbol.hasInstance` that checks it. That makes `instanceof`, `isElizaError` and `toElizaError` pass-through work across bundled copies.\n- Subclasses keep normal prototype `instanceof`, and look-alike plain objects are still rejected.\n- The OCR registry (#31254) and the local-inference vision augmenter (#31257) were already fixed on develop.\n- Test: `packages/core/src/errors.identity.test.ts` loads a second module instance and checks recognition in both directions.\n\n## #31881: owner-private audience renewal during long turns (Fixes #31881)\nThe 5-minute TTL is unchanged. What's new:\n- **Turn lease.** The message turn (plugin-assistant `turn-lifetime.ts`) opens a lease with `beginTrustedDeliveryAudienceTurn`. The lease is bound to the runtime, to this turn's evidence binding, and to its merged cancellation signal. It closes when processing settles.\n- **Renewal.** Expired evidence is re-derived from current authority:\n  - Canonical rooms re-read the room kind, the owner and the full participant census.\n  - API evidence renews only through a host-supplied fresh principal check.\n- **What renewal must match.** It succeeds only if actor, agent, room, destination kind, owner and census are all unchanged. Sensitive-disclosure bookkeeping carries over.\n- **When renewal is refused.** After completion or cancellation, for a different runtime, and for evidence that was already expired when the turn began.\n- **Where it runs.** Inside revalidation, before the planner's exposure gates, and before owner-gated tool execution.\n- Test: `packages/core/src/security/trusted-delivery-audience.renewal.test.ts` (14 cases) advances the clock past the TTL. It covers a long turn succeeding and each invalidation case.\n- Not done:\n  - `chat-routes.ts` does not yet pass `revalidatePrincipal` to `attestAuthenticatedApiDeliveryAudience`, so authenticated-API turns still expire at 5 minutes. That needs a host-side fresh session or token check.\n  - The `live-note-to-calendar-stale-source` scenario was not re-run (needs a live provider).\n\n## #30825: actionable local backup size failures (Refs #30825)\n- `POST /api/backups` maps `AgentSnapshotBudgetExceededError` to a 413. The response carries `code`, `stage`, `unit`, `observed`, `limit` and `retryable: false`, plus a message the settings dialog shows as-is. It exposes no paths or DB diagnostics.\n- Unexpected failures still return the generic 500.\n- The file-count refusal now has its own `file count` stage.\n- Test: `test/backup-capture-http.test.ts` gains a case against the real HTTP server and PGlite. A sparse 200 MiB media file gets a 413 with no state-dir path in the body; once it is removed, the backup succeeds.\n- Not done: streaming local backups through capture-v2, which is the L-sized part. Also no native-dialog capture.\n\n## #29069: plugin-sql metadata filter (Fixes #29069)\n`getMemories` now applies the same `metadata @\u003e :filter::jsonb` predicate that `countMemories` already uses.\n- **Why containment (#29074) and not per-key equality (#29735):** it is what `countMemories` already ships, the maintainer asked for both methods to stay on it, and switching count to equality would change existing callers.\n- Test: `memory-metadata-filter.real.test.ts` runs on real PGlite. It covers scalar, multi-key, nested objects in any key order, no match, empty filter and absent filter, with get and count agreeing. It fails 5/7 on develop.\n\n## #30881: complete authorized context (Fixes #30881)\n- `recent-conversations` always inlines the complete authorized cross-room bodies. A recall action now only appends a room index.\n- The provider no longer declares `overflowText`, so an estimated budget cannot swap the bodies for a body-free manifest.\n- The planner half is already satisfied: `pipeline.ts` runs no dispatch-budget preflight.\n- Test: `test/recent-conversations-complete-context.test.ts` runs on real PGlite with an attested owner DM. Bodies are inline with and without a recall action; before this change, the recall-action case had no bodies.\n\n## Verification\n- `packages/agent`: `bunx vitest run` on each new or extended test file above: all pass. `bun run typecheck`: pass. `biome check` on changed files: clean. The package's 36 existing warnings are all in files this PR doesn't touch.\n- `packages/core`: `bun run typecheck`: pass. `biome check ./src`: clean. Full suite `node ../scripts/run-vitest.ts run`: 751 passed / 2 skipped. 5 files failed to import because of a vite SSR transform-cache ENOENT caused by concurrent worktree runs; rerun on their own, they pass 111/111.\n- `plugins/plugin-sql`: `bun run typecheck`: pass. `vitest --config vitest.real.config.ts memory-metadata-filter.real.test.ts`: 7/7.\n- `plugins/plugin-assistant`: `bun run typecheck`: pass. The delivery-audience attestation and egress-audience suites: 10/10.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"1c:T2204,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCompletion evaluation currently shares the response-handler model slot, so changing its model also changes unrelated stages. This adds an optional evaluator-only selection without changing default stage models.\n\n# Change\n\n`ELIZA_EVALUATOR_MODEL` requests a provider model for completion evaluation only. An explicit nonblank evaluator argument wins; per-agent settings precede the documented environment fallback. Blank/nonstring runtime settings preserve the existing slot. Selection, including absence, remains fixed during restoration and is resolved afresh for a new invocation.\n\nBoth message-pipeline evaluator paths forward the host's bound settings/model metadata. Response handling, planning, extraction and background model selections remain unchanged. A per-call override does not borrow context/output limits belonging to another registered model; unknown capacity remains diagnostic and complete input is preserved. Actual served-model metadata remains authoritative if an adapter ignores the request or falls back.\n\nDefault off: no profile or model configuration is changed by this PR. The pinned develop base already includes the merged restoration/settled-scope work. This PR's diff is evaluator-only selection and its supporting budget, facade, documentation and tests, plus the mechanical Health CI dependency described below; it does not duplicate those merged fixes.\n\n# Testing\n\n- 47 assistant evaluator/model/pipeline/restoration and new planner reasoning/coding-continuation tests passed after merging pinned develop eb157cac476.\n- 17 core override-budget/provider-fallback tests passed.\n- 44 real-SDK HTTP serialization tests, including the new Qwen reasoning-replay wire cases, passed with fixture responses and no external model calls.\n- Core, assistant and OpenAI plugin typechecks passed; changed-file Biome and diff checks passed.\n- [x] Targets `develop`, based on pinned `eb157cac4767dfc0268f6995e09de109d8468ff8`, with no conflicts at preparation.\n- [ ] New-head full repository CI passed after including the Health de red in **20-40ms**. `strace` of a turn showed the lease blocking on ~17 keychain child processes (fd read of the base64 key) back-to-back before the embedding HTTP call was even issued — the span wraps the lease, so the redundant key work is charged to the embedding.\n\n## Fix\n\nMemoize the resolved key per `service/account` for the process lifetime.\n\n- The value already lives in process memory for the duration of every vault/credential op; the cache is keyed by the same `service/account` tuple the resolver reads.\n- **Security posture unchanged:** no key is ever fabricated, failures are never cached (transient keychain/passphrase errors still retry on the next call), and the `ELIZA_VAULT_PASSPHRASE` length guard still runs before the cache lookup.\n- Adds a test-only `resetLoadDefaultMasterKeySyncCache()`.\n\n## Test\n\n`packages/auth/test/master-key-sync-cache.test.ts` asserts reference identity across a 17-call fan-out (simulating a `listAccounts()` decode loop):\n\n- **Fails on clean develop:** un-memoized resolver returns a fresh `Buffer` per call → `expect(key).toBe(first)` fails.\n- **Passes with the memo:** one resolution serves the whole fan-out.\n\nThe test tolerates the absence of the reset helper (falls back to a no-op) so the *behavioral* identity assertion is the bidirectional signal, not the new API symbol.\n\nExisting `keychain-process.test.ts` (7 tests) still passes.\n\n---\n\nClient / agent tooling: Sol\n"])</script><script>self.__next_f.push([1,"25:T1a90,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #31004 — original scope: shared-reference handling across diagnostic serializers and redactors.\n\n# Change\n\n`stringifyForDiagnostics` (`packages/core/src/runtime/json-output.ts`),\n`serializeTtsDebugDetail` (`packages/ui/src/utils/tts-debug.ts`), and\n`redactValue` (`plugins/plugin-personal-assistant/src/lifeops/redact-sensitive-data.ts`)\neach tracked **every object ever visited** in a single, never-pruned set. So any\nvalue d.\n- Concurrency/paused/manual invariants are owned by the fire API itself (`fireWithResult`'s atomic claim); this change only switches which existing endpoint the button calls.\n\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"nvidia\",\"model\":\"z-ai/glm-5.3\",\"client\":\"Hermes Agent\",\"skill_revision\":\"local:slop-eliza/skills/slop-cash-contribute\"} --\u003e"])</script><script>self.__next_f.push([1,"27:T2ee7,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #29213\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop` with zero conflicts.\n- [x] `bun install` was run after sync; focused package gates (test, typecheck, lint) pass. `bun run verify` was not run to completion on this constrained device — see **Known gaps / failures**.\n- [x] A reviewer can confirm the change works without reading the code, from the before/after test evidence below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop` (`958196206a`); zero conflicts.\n- [x] Focused package checks pass post-sync; full `bun run verify` blocker documented in **Known gaps / failures**.\n\n# Risks\n\nLow. The change is confined to one file (`plugins/plugin-native-agent/src/web.ts`), a Capacitor plugin **web fallback** used only when no native iOS/Android bridge is registered. It adds three `!res.ok` guards that mirror the pre-existing `chat()` guard; the success paths are unchanged (proven by regression tests). No public type changes — `AgentStatus` already declares `state: 'error'` and `error: string | null`.\n\n# Background\n\n## What does this PR do?\n\nThe Capacitor Agent web fallback (`AgentWeb`) did **not** check `res.ok` in `start()`, `getStatus()`, or `stop()`. The agent HTTP server deliberately answers lifecycle/status failures with core `writeJsonError`'s `{ error: message }` body and a 4xx/5xx status (`packages/agent/src/api/agent-lifecycle-routes.ts`):\n\n- `POST /api/agent/start` → `503` \"Agent runtime is not available and this server cannot boot one on demand\" when the host cannot boot; or `500` with the reported state flipped to `\"error\"` on a failed boot.\n\nBecause the web fallback blindly parsed and returned the body, callers received a **malformed `AgentStatus`** missing the required `state`/`agentName`/`port`/`startedAt` fields:\n\n- `start()` did `return data.status ?? data`, so on error it returned `{ error }` (no `state`).\n- `getStatus()` and `stop()` did `return res.json()` directly, returning the raw `{ error }` body.\n\nThe server's designed `\"error\"` / not-bootable state was silently discarded, violating the repo DTO/error policy (a failed producer must yield an explicit error/unavailable state, not healthy-looking/partial data). This is an internal inconsistency: `chat()` in the same file already checks `res.ok` and throws.\n\n**User-facing impact:** consumers cast the result to `AgentStatus` and read `.state`. `packages/app/src/main.tsx` `initializeAgent()` dispatches `AGENT_READY_EVENT` with the status, and `packages/ui/src/api/client-agent.ts` casts `Agent.start()`/`Agent.getStatus()` to `AgentStatus` and branches on `.state === \"running\"`. When a local-agent boot returns 503/500, the missing `.state` makes a failed boot surface as an unrecognizable status rather than the intended `error` state.\n\n### Fix\n\nIn `web.ts`, added `res.ok` handling to the three methods (mirroring `chat()`):\n\n- `start()` / `getStatus()`: when `!res.ok`, read the JSON body's `error` (falling back to `statusText`) and return a well-formed `{ state: 'error', agentName: null, port: null, startedAt: null, error: \u003cmessage\u003e }`.\n- `stop()`: when `!res.ok`, return `{ ok: false }` instead of the raw error body.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The behavior now matches the documented `AgentStatus` contract in `src/definitions.ts`.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-native-agent/src/web.test.ts` — five added cases lock out the malformed-DTO regression, each asserting `.state`/`.ok` explicitly. Run:\n\n```bash\nbun run --cwd plugins/plugin-native-agent test\n```\n\n## Detailed testing steps\n\n1. **Before (fix reverted):** the four new error-path cases fail — `stop()` returns `{ error: 'stop failed' }` instead of `{ ok: false }`, and `start()`/`getStatus()` resolve without a `.state`.\n2. **After (fix applied):** all 27 cases pass. `start()`/`getStatus()` on 503/500 resolve to `{ state: 'error', ..., error: \u003cserver message\u003e }`; `stop()` on 500 resolves to `{ ok: false }`; a missing JSON `error` field falls back to `statusText`; and the 200 success paths still return the parsed status.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:455b58000fa03319c51df1cf3c1ee9ad3b6ca9a3 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no UI surface. This is a Capacitor plugin web fallback (TypeScript HTTP client); no rendered .tsx/.css changed.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - no UI surface (see above).`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - no user-facing UI flow; the change is a data-shape fix in an HTTP client method, proven by the before/after unit-test evidence below.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] `N/A - the fixed code is a client-side web fallback, not a backend service; the server error path it consumes is already covered in packages/agent. Reachability into the consuming path is traced in Background.`\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] AFTER (fix applied) request/response + state-change proof for each `AgentWeb` client method — the web fallback consumes the server's HTTP response and returns the corrected `AgentStatus`:\n\n\u003cdetails\u003e\n\u003csummary\u003efrontend-logs: AgentWeb request/response + state change (fix applied)\u003c/summary\u003e\n\n```\n=== AFTER: fix applied; command: bun x vitest run src/web.test.ts --reporter=verbose ===\n src/web.test.ts \u003e AgentWeb fallback \u003e returns an error AgentStatus when start() gets a 503 the server cannot boot\n   request:  POST /api/agent/start  response: 503 { error: \"...cannot boot one on demand\" }\n   returns:  { state: 'error', agentName: null, port: null, startedAt: null, error: '...cannot boot one on demand' }\n src/web.test.ts \u003e AgentWeb fallback \u003e returns an error AgentStatus when getStatus() gets a 500 error body\n   request:  GET /api/status  response: 500 { error: \"boom\" }\n   returns:  { state: 'error', agentName: null, port: null, startedAt: null, error: 'boom' }\n src/web.test.ts \u003e AgentWeb fallback \u003e reports stop() failure as { ok: false } instead of the raw error body\n   request:  POST /api/agent/stop  response: 500 { error: \"stop failed\" }\n   returns:  { ok: false }\n src/web.test.ts \u003e AgentWeb fallback \u003e returns the parsed status on a successful start() and getStatus()\n   request:  POST /api/agent/start  response: 200 { status: {...} }  returns: parsed running status (unchanged)\n Test Files  1 passed (1)\n      Tests  27 passed (27)\n```\n\n\u003c/details\u003e\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] `N/A - no agent/action/provider/prompt/model change; this is a lifecycle HTTP-status handling fix.`\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Failing-then-passing reproduction (the domain artifact): the four error-path cases fail before the fix, then pass after it.\n\n\u003cdetails\u003e\n\u003csummary\u003edomain-artifacts: failing-then-passing reproduction output\u003c/summary\u003e\n\n```\n=== BEFORE: web.ts reverted to pre-fix (HEAD~1); command: bun x vitest run src/web.test.ts ===\n     x returns an error AgentStatus when start() gets a 503 the server cannot boot\n     x returns an error AgentStatus when getStatus() gets a 500 error body\n     x falls back to statusText when an error response has no JSON error field\n     x reports stop() failure as { ok: false } instead of the raw error body\nAssertionError: expected { Object (error) } to deeply equal { state: 'error', ...(4) }\nAssertionError: expected { error: 'boom' } to deeply equal { state: 'error', ...(4) }\nAssertionError: promise rejected \"Error: not json\" instead of resolving\nAssertionError: expected { error: 'stop failed' } to deeply equal { ok: false }\n Test Files  1 failed (1)\n      Tests  4 failed | 23 passed (27)\n\n=== AFTER: fix applied; command: bun x vitest run src/web.test.ts ===\n Test Files  1 passed (1)\n      Tests  27 passed (27)\n```\n\n\u003c/details\u003e\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] `N/A - no rendered visual surface.`\n\n# Evidence Details\n\n## Real LLM-call trajectory\n\n`N/A - no agent/action/provider/prompt/model change.`\n\n## Backend + frontend logs\n\nBefore/after focused test run for `plugins/plugin-native-agent/src/web.test.ts`.\n\n\u003cdetails\u003e\n\u003csummary\u003eBEFORE — fix reverted (4 error-path cases fail)\u003c/summary\u003e\n\n```\n ❯ src/web.test.ts (27 tests | 4 failed) 178ms\n     × returns an error AgentStatus when start() gets a 503 the server cannot boot\n     × returns an error AgentStatus when getStatus() gets a 500 error body\n     × falls back to statusText when an error response has no JSON error field\n     × reports stop() failure as { ok: false } instead of the raw error body\nAssertionError: expected { error: 'stop failed' } to deeply equal { ok: false }\n+   \"error\": \"stop failed\",\n Test Files  1 failed (1)\n      Tests  4 failed | 23 passed (27)\n```\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eAFTER — fix applied (all 27 pass)\u003c/summary\u003e\n\n```\n ✓ src/web.test.ts \u003e AgentWeb fallback \u003e returns an error AgentStatus when start() gets a 503 the server cannot boot\n ✓ src/web.test.ts \u003e AgentWeb fallback \u003e returns an error AgentStatus when getStatus() gets a 500 error body\n ✓ src/web.test.ts \u003e AgentWeb fallback \u003e falls back to statusText when an error response has no JSON error field\n ✓ src/web.test.ts \u003e AgentWeb fallback \u003e reports stop() failure as { ok: false } instead of the raw error body\n ✓ src/web.test.ts \u003e AgentWeb fallback \u003e returns the parsed status on a successful start() and getStatus()\n Test Files  1 passed (1)\n      Tests  27 passed (27)\n```\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003etypecheck + lint (green)\u003c/summary\u003e\n\n```\n$ tsc --noEmit -p tsconfig.json\n$ bunx @biomejs/biome check .\nChecked 7 files in 110ms. No fixes applied.\n```\n\n\u003c/details\u003e\n\n## Screenshots (before / after) + video walkthrough\n\n### Before\n\n`N/A - no UI surface.`\n\n### After\n\n`N/A - no UI surface.`\n\n### Walkthrough video\n\n`N/A - no UI surface; data-shape fix proven by before/after unit tests above.`\n\n## Audio / voice walkthrough\n\n`N/A - no voice/transcript/TTS/STT change.`\n\n## Known gaps / failures\n\n- Full `bun run verify` was not run to completion. This is a 6900-package Bun monorepo on a constrained Raspberry Pi device; `bun install` required `--minimum-release-age=0` to bypass a repo-unrelated dependency release-age gate. The change is one self-contained TypeScript file with no cross-package surface change, so the owning package's `test`, `typecheck`, and `lint:check` gates (all green above) are the authoritative checks for this diff.\n\n## Maintainer CI exception record\n\n- PR head SHA: `N/A - no exception requested`\n- Validated `origin/develop` SHA: `N/A - no exception requested`\n- Live ruleset readback and named bypass eligibility: `N/A - no exception requested`\n- Queued or failing checks and run URLs: `N/A - no exception requested`\n- Infrastructure-only or unrelated-failure
