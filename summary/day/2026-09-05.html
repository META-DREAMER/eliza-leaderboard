lobally is not justified without path evidence.\n- Existing behavioral tests cover temporary-ID promotion and remainder deduplication in `useVoiceChat.bidirectional.test.tsx:198–245`, and streaming/final promotion in `useVoiceChat.tts-playback.test.tsx:415`. Those use controlled playback, not real acoustic acceptance. The playback implementation checks cancellation generation before and after decode (`voice-chat-audio-playback.ts:65–67`); preserve those guards.\n\n### Ordered implementation work\n\n1. **Nubs / product voice owner: establish the failing trace.** Extend canonical VoiceScenario/workbench coverage with the exact reported reply, a one-word tail, punctuation-free reply, slow tokens, and a final frame whose text is identical to the last stream frame. Tie text-arrival and audio events to session/turn/message/segment IDs; record final text arrival, phrase submission, provider dispatch, first received PCM, actual previous playback end, actual next playback start, EOS and final drain. Keep payload-free operational timing logs and separately controlled complete trajectories for evidence.\n2. **UI + realtime owner: classify the dominant delay.** For non-realtime output, distinguish text accumulation delay from serial synthesis and decode delay. For realtime Talk, trace `voice-session-client.ts`, `voice-session-playback.ts` and server EOS/phrase continuation through the actual Sonic path; do not change the disabled watcher as the sole fix. Native mobile branches through TalkMode (`useVoiceChat.ts:2410`) and requires its own timing boundary rather than treating JS dispatch as first audible PCM.\n3. **Implement only the measured fix.** If serial synthesis dominates, prepare the next complete segment while current audio plays and commit prepared audio in original order, with bounded concurrent work/backpressure that never drops text. If word fragmentation dominates, retain the incomplete lexical tail and flush it losslessly on final/EOS; preserve ordered offsets and explicit reconciliation for non-prefix final text. If EOS/drain dominates, correct that lifecycle directly. Any lookahead/batching policy must preserve first-audio responsiveness and natural prosody; do not switch every response to final-only playback as an unmeasured workaround.\n4. **Make cancellation and completion structural.** Carry immutable turn/generation/segment ownership through preparation, fetch, decode, scheduling and drain. Interruption cancels the old generation; stale completion cannot enqueue into the next turn. Mark final playback completion only after the last audio frame drains. Handle synthesis failures as visible typed boundary errors, not silence reported as success.\n5. **Coordinate overlapping work before editing.** #29492 owns realtime duplex/handoff/crossfade; reconcile exact current head/path overlap and retain its audible acceptance gate. #30680 owns short phrase eligibility and cache identity, while #30356 owns provider dispatch/settlement and duplicate warm requests. Share timing and call-count instrumentation. #28214 remains the tracing/evidence dependency and #26722 owns PSTN lifecycle differences.\n\n### Verification and acceptance receipts\n\n- Add consumer-boundary regressions with a controllable token stream and real queue logic: partial final word, one-word final segment, whitespace/Unicode/decimal/abbreviation boundaries, multiple clauses, rewritten final text, temporary-ID promotion, identical final frame, cancellation during preparation/decode/playback, next turn, provider error, and queued backpressure. Assert complete speakable content exactly once in order, request counts, stale-audio exclusion and final-drain timing. Helper-only threshold tests are insufficient.\n- Run affected UI and local-inference focused suites through their package Vitest harnesses, then owning package tests/typecheck/read-only lint, shared/cloud gates if touched, root `bun run verify`, and `bun run --cwd packages/app audit:app` for affected shared UI. Missing dependencies in this research checkout are not test failures; no suite pass is claimed here.\n- Capture before/after real provider audio and human listening on browser/cloud and desktop/local independently, with exact installed/deployed SHA, provider settings, raw timing receipt and p50/p95 boundary gaps over repeated cold/warm runs. Agree the acceptable gap/prosody budget from baseline before tuning; do not fabricate a universal threshold. Include complete untruncated text/trajectory, audio, applicable desktop/mobile captures, console/network/backend logs, and MP4 in the canonical verified evidence bundle. Mobile paths require real supported-device proof if modified; otherwise explicitly identify them as untested.\n- Close only after the reproduced trailing delay is eliminated without omitted, repeated or clipped words and with clean interruption and subsequent-turn playback. Existing source features and draft PR checks alone cannot satisfy this.\n\nPlanning: retain 2–4 person-days as a provisional research range; re-estimate after step 1 identifies whether one path or both realtime and buffered playback require changes. No implementation ownership claim or board-status change is made by this audit.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent deep review: #30679\n\nAudited `b676280384b15df54204276e34bb8740db26936f`. Three concrete counterexamples refine the original buffering plan; no audio/device run was performed.\n\n### P1 — A corrected final frame can be silently discarded while marked final (reproduced)\n\nExecuted `/tmp/guardian-project19-deep-review/probe-30679.ts` with Bun. It extracts the unchanged production `queueAssistantSpeech` callback and real text-boundary/remainder helpers; collaborators capture tasks instead of playing audio. For the same message ID:\n\n1. Streaming frame `The available option is red.` queues that sentence.\n2. Final frame `Actually, the available option is blue.` queues **nothing**.\n3. State records `latestSpeakable` as the corrected final, `queuedSpeakablePrefix` as the stale red sentence, and `finalQueued:true`.\n\n[remainderAfter](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/voice/voice-chat-playback.ts#L185-L207) returns empty when prior text is not a prefix/interior substring; the [consumer](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L2816-L2829) treats that as no remaining speech and marks completion. The original plan must specify a non-monotonic stream contract, not only buffer sizes. Do not blindly replay the full final (duplicates already spoken words); distinguish queued-but-unplayed text, actual played content, and replacement/correction events. Reject unsupported rewrites explicitly or deliver a deliberate corrected utterance with clear ownership.\n\nSecond actual probe: `Hello there.` → final `Note: Hello there. More.` queues only `Hello there.` and `More.`. Interior-substring recovery drops `Note:` but records the whole final as queued. Remove silent interior matching; acceptance must compare the actual delivered text sequence against the authorized append/revision contract.\n\nThese are deterministic boundary counterexamples, not proof that every production provider rewrites text. Current shell [provisional-frame suppression](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/components/shell/useShellVoiceOutput.ts#L175-L186) specifically protects one known wholesale-replacement path and must remain. Other callers, direct hook use, and non-provisional replacement still require a defined contract.\n\n### P2 — Monotonic text alone does not make chunk boundaries pronounceable (reproduced)\n\nActual callback probe: partial `I am checking the international` followed by final `I am checking the internationalization settings.` queues two independent requests: `I am checking the international` and `ization settings.`. The [threshold branch](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L2831-L2842) sends the entire partial string once it exceeds 24 characters, even when the final word may still be streaming. The debounce flush has the same unresolved trailing-word problem at lines 2669–2706. This is an exact request segmentation defect; no specific acoustic measurement is claimed.\n\nAmend prefetch work to retain an unfinished lexical suffix until a stable delimiter or final event, with language-aware handling where spaces are not word boundaries. A timer does not prove word completion. Preserve all characters and ordering; do not use a maximum-length truncation to repair prosody. Test token streams split inside words, Unicode graphemes, decimal numbers, abbreviations and URLs, then inspect real spoken continuity on supported targets.\n\n### P2 — Latency improvement must separate synthesis scheduling from playback completion\n\nThe [worker](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L2382-L2532) awaits each provider's full speak operation. [Decoded playback](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/voice/voice-chat-audio-playback.ts#L130-L168) resolves on completion/timeout. Thus a later clip is synthesized only after earlier playback finishes on the buffered local/ElevenLabs path; faster segmentation alone cannot hide that synthesis interval. Implement bounded prefetch with one ordered playback owner and cancelable generation. Bound retained audio bytes/concurrency, not text completeness.\n\n### Examined protections, ownership and acceptance amendments\n\nDecoded playback checks generation both before and after asynchronous decode (`voice-chat-audio-playback.ts` lines 65–67); do not allege a missing decode cancellation guard. `cancelPlayback` increments generation, clears queue, aborts active fetch, and completes the playback waiter; retain all four when prefetch adds multiple requests. Reject late prefetched audio for old generations and test cancellation during synthesis, decode, and playback. Provider failure already fails closed. Coordinate the queue configuration/key race with #30680 so prefetch cannot synthesize one voice and label/cache another.\n\nThe shell message watcher explicitly exits for Cartesia realtime (`useShellVoiceOutput.ts` lines 147–151). This report's buffered-path findings must not be presented as a diagnosis of realtime Sonic. Live GitHub inspection confirms #29492 remains OPEN/DRAFT at `b209c79fe2ac1bde176204f078834f9352b8395c`; reusing its work requires exact-head review, not assuming it is merged. HEAD's #30723 changes native HTTP stream metadata validation; it does not repair these queue/text boundaries.\n\nRequire evidence for the exact target/provider reproducing the user's symptom: full authorized text vs queued/synthesized/played intervals, first-audio time, inter-clip silence, final-frame arrival, cancellation outcome, and subjective playback review. Pure task-capture probes above establish text loss/splitting but cannot establish acoustic latency or native playback success.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n\n\n\u003c!-- sprint1-human-listening-evidence --\u003e\n### Human listening evidence — 2026-09-06\n\nThe requesting user listened to the before/after live Kokoro recordings and answered: **“Sounds complete and natural.”** This confirms the listening criterion for those recordings only. The recordings exercise the buffered playback hook through Chromium and the real local TTS backend; they do not establish ASR ingress, native-device behavior, other providers, or a controlled cold/warm latency comparison.\n\nExact reviewed audio SHA-256 values:\n- Before: `0f1ccd5afd1af99d5fc0c46266405c63d653ed902f116c6fc5efb327e687717c`\n- After: `f2ccd43118f311246ad074ac2ed4d2b15039a3fb5a13d16bcc0c89279ee12f6b`\n\nThe subsequent actual app-shell check exposed a missing error propagation path. Commit `dcd4a4ad0b` now surfaces speech failure and clears it after successful replay. Desktop and mobile recovery captures were inspected. Focused validation passed: 233 shell tests, 40 playback/shell tests, and UI typecheck. Full final gates, remotely accessible media, and independent review remain outstanding; this issue stays in progress.\n\n\n\u003c!-- sprint1-long-reply-followup-20260906 --\u003e\n### Independent long-reply finding and repair in progress\n\nThe human listening acceptance above applies to the exact short recordings. A separate live navigation test exposed a longer reply ending mid-sentence: 180 words of generated text produced 22.6 seconds of Kokoro audio, and independent ASR found only 87 spoken words. The standalone scheduler passed the entire reply as one phrase; the native Kokoro tokenizer silently retained only its first 510 phoneme tokens.\n\nThe repair preflights every segment of the complete utterance before synthesis, splits at word boundaries while preserving ordered text, rejects an indivisible oversized word before emitting a prefix, and sends the same checked IPA to the native ABI v14+ IPA entry. Old libraries without that entry and exhausted audio allocations return explicit errors. Cancellation prevents later segment dispatch.\n\nThe exact captured reply now produces 43.875 seconds of real Kokoro audio (SHA-256 `4f335c87ec0087d0c33a79f92df4c94ff26d6c2e279a6ba42bb5eb080f2806ab`). Independent native CPU Qwen3-ASR 0.6B transcription covered every feature section and the exact final sentence, “Tell me what you want to write down first.” Minor ASR wording and punctuation differences remain. The full inference suite passed 2,916 tests across 282 files plus 60 native harness tests; 19 tests were explicitly skipped. Typecheck and lint passed. Independent review then found a separator-only suffix could produce empty IPA after a valid prefix; follow-up `9564979b97` rejects it during complete preflight, with 29 focused tests passing. Follow-up independent review found no remaining actionable defect and independently passed all 29 boundary tests plus the installed-phonemizer adversarial probe. Final root validation remains pending. This is recorded-audio proof, not microphone or all-provider acceptance.\n\nThe shell failure/retry recording, desktop/mobile captures, exact human-reviewed clips, and actual application audio are [attached inline](https://github.com/elizaOS/eliza/issues/30679#issuecomment-5557739959). The native macOS file picker resolved the browser upload failure without changing extension permissions. The MP4 uses explanatory narration; actual application speech is attached separately.\n\n\nThe complete repaired long reply is available as [the original 43.875-second WAV](https://github.com/user-attachments/files/31876611/long-reply-complete.wav), SHA-256 `4f335c87ec0087d0c33a79f92df4c94ff26d6c2e279a6ba42bb5eb080f2806ab`. Its independent ASR reaches the final sentence quoted above; the requesting user's earlier listening approval applies only to the two short clips. The implementation is now rebased without changes to the affected UI/native-inference source onto `cd821540d7`; current branch head `9743eb1a4cb94a0f3d14020675e4365f5121c2b0`.\n\n\n## Final reviewed evidence — 2026-09-06\n\n### Voice evidence log and OCR receipts\n\nHistorical full-app recovery capture: dcd4a4ad0b80a1381e998eed6dc6e5ec11427b5c. Collection checkout: 9743eb1a4cb94a0f3d14020675e4365f5121c2b0; collection does not change capture provenance.\n\n\u003cdetails\u003e\u003csummary\u003eFrontend console, network, and playback receipt\u003c/summary\u003e\n\nThe controlled first local TTS request returned 503. The renderer reported voice.tts-failed-closed and preserved an explicit failure. Retry returned 200. Audio start/end events record one 11.525-second clip. The complete sanitized console/network/event logs are retained.\n\n```text\n404 /api/lifeops/todos — 2 response(s)\n404 /api/lifeops/goals — 2 response(s)\n404 /api/connectors/google/accounts — 1 response(s)\n503 /api/tts/local-inference — 1 response(s)\n503 /api/coding-agents — 1 response(s)\n503 /api/orchestrator/status — 1 response(s)\n503 /api/orchestrator/tasks — 1 response(s)\n200 /api/tts/local-inference — 1 response(s)\n200 /api/voice/playback-frames — 48 response(s)\nRendererDiagnostic: voice.tts-failed-closed\nLocal inference TTS 503: Controlled provider outage for visible recovery proof\nAudio start 10254.100 ms; ended 21775.800 ms; decoded duration 11.525 s\n```\n\nOther 404/503 responses above are retained observations, not asserted repaired by this PR.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eBackend receipt and limitations\u003c/summary\u003e\n\nCurrent runtime log snapshot records the API listening on 127.0.0.1:30678. It also records no AI provider loaded, a missing Birdeye credential/service, and scheduled dispatch rendering failures. This backend log is not proof of live model generation or a clean full runtime. Historic backend-live.json independently records four successful real Kokoro responses (200; 138044 or 218444 bytes); original short-clip revision is unknown. Browser network receipt supplies the successful full-app retry response.\n\nComplete sanitized current and historical runtime logs are retained with original/sanitized SHA-256 hashes and secret-scan receipts.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eExisting app OCR receipt\u003c/summary\u003e\n\n216 entries: 204 verified, 0 broken, 12 needs-eyeball, 0 regressions. These are archived results, not a new current-head audit. Exact capture SHA is not encoded in the OCR JSON.\n\n- builtin-camera: 4 viewports; semantic OCR exemption — The camera is an AOSP-native surface, so the browser audit intentionally renders the unavailable-view boundary.\n- plugin-cockpit-gui: 4 viewports; semantic OCR exemption — The Cockpit GUI has no remote bundle in the hermetic browser audit, so the unavailable-view boundary is the only observable surface.\n- plugin-lifeops-live-test-gui: 4 viewports; semantic OCR exemption — The LifeOps live-test GUI has no remote bundle in the hermetic browser audit, so the view-registry fallback is the only observable surface.\n\nAll 12 exceptions remain unavailable browser surfaces; they are not native-device pass receipts. Full exception texts and source hash are in ocr-receipt.json.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eFresh OCR over the actual product captures\u003c/summary\u003e\n\nCanonical AppleVision OCR at analysis revision 9743eb1a4cb94a0f3d14020675e4365f5121c2b0 recognized all four historical full-app JPGs, each hash-bound to its dcd4a4ad0b80a1381e998eed6dc6e5ec11427b5c capture revision. Both failure views include “on-device voice unavailable”; both recovered views omit that indicator. All four preserve the garden reply ending “water.” Confidence ranges 0.977–1.0. These extracted words support the visible state review; they do not establish audio quality.\n\nFresh baseline desktop/mobile JPGs captured from cfbb00467b0c7b44425345ee3990d550676be9d7 use the same 9743 backend. Both lack the visible failure indicator after a controlled browser-local TTS503, per root capture receipt and independent image inspection. Canonical OCR is retained in baseline-ocr.json.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eFinal current-head failure and retry receipt\u003c/summary\u003e\n\nUI and backend revision: 9743eb1a4cb94a0f3d14020675e4365f5121c2b0. The normal local backend uses the documented ELIZA_KOKORO_MODEL_DIR pointing to installed Kokoro artifacts. A controlled browser-local first TTS503 produces the visible “on-device voice unavailable” indicator on desktop and mobile. Actual native Kokoro retry returns200; current-playback.json records started:1 and ended:1, and the final desktop/mobile images show the indicator cleared with the complete garden reply still visible. These are actual full-app captures, independently inspected, with canonical OCR and hashes retained.\n\nThe earlier restarted runtime lacked the model-directory configuration and returned502 on retry. That failed attempt remains under runtime-diagnostics/missing-model-*; it was repaired by restoring configuration, not by a code change. The successful configured-runtime log is separate from the earlier startup log. This capture replays a persisted reply and does not establish a new live-model turn, microphone capture, physical device playback, or other TTS providers.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eCanonical bundle integrity and exact current-head transport excerpt\u003c/summary\u003e\n\n```text\nUI/backend: 9743eb1a4cb94a0f3d14020675e4365f5121c2b0\n/api/tts/local-inference: 503 (controlled first attempt)\n/api/tts/local-inference: 200 (actual native Kokoro retry)\nAudioBufferSource: started=1, ended=1\nCanonical bundle: 20260906-083258-9743eb1-cpu\nCanonical integrity: 46 artifacts verified / 46, zero issues\nManifest SHA-256: c4692ef3025049d7ac0ef51165998ab7528ed246c840396918eb6fe543bb55e7\nCanonical review: exit0; 10 screenshots, 2 videos, 11 logs, 0 trajectories\nCanonical review OCR: tesseract.js, 10 succeeded, 0 failures\n```\n\nThe bundle is an explicitly selected archival collection, not a newly executed test matrix. Its metadata commit identifies the collection code; the hashed per-artifact inventory records each capture revision separately. Unknown original short-clip revisions remain unknown. Integrity and dashboard generation do not certify all-platform acceptance. Configured secrets were scanned before public preparation, with no residual matches.\n\u003c/details\u003e\n\nPublic archive: [30679-evidence-bundle.tar.gz](https://github.com/use the room with sunlight.” matched the complete SSE terminal, rendered message, and native TTS request. Kokoro returned HTTP 200 and an original 8.85-second WAV; the browser source started and ended normally. User message `f23952ba-de7a-04ec-8e11-b70ced7addf9`, assistant `910f1fca-b3c2-4741-baeb-8f2903e87067`.\n- **Stop and next turn:** a fresh lake reply produced 24.475 seconds of original Kokoro audio. The actual message Stop button disconnected all outputs from the active source during the observed gesture, before the next submission. That source was never reconnected during the remainder of the capture. A distinct source played the subsequent live reply, “The silver sailboat slides across the water with its sails full on the breeze.” and ended naturally after its 5.65-second buffer. Both complete model replies match their SSE/TTS payloads and WAV hashes.\n- **Independent review:** full canonical model recordings were joined to both graph-capture user/assistant IDs. Five actual browser-served JavaScript bodies and their source-map contents match the pinned source, including the playback helper. Desktop/mobile results and sampled video frames were visually inspected. MP4 walkthroughs are visual-only; original TTS WAVs are separate and are not represented as captured physical speaker output.\n\n\u003cdetails\u003e\u003csummary\u003eObserved Stop ordering and preserved failed attempts\u003c/summary\u003e\n\nBrowser performance clock, milliseconds:\n\n```text\nStop gesture start: 16600.0\nFirst source disconnect-all-outputs: 16643.4\nStop gesture end: 16720.4\nNext submit start: 16816.1\nNext distinct source start: 20162.4\nFirst source reconnects after Stop: none observed\nNext source: natural ended event, no stop request\n```\n\nThe first capture observer failed to read the completed SSE body after Chromium released it; the model reply was actually rendered. The revised observer preserves complete bytes by cloning the actual response without replacing it. A subsequent Stop observer incorrectly required a source stop/end event. The real implementation resolves its active playback task, disconnects the source/analyser and clears the source reference before the later stop branch. Thus the earlier observation did not demonstrate audible overlap. The fresh graph observer records successful native connect/disconnect calls while delegating the original calls unchanged. It confirms actual output disconnection; it does not measure physical silence. Both failed observation attempts remain preserved rather than being relabelled as passes. No product change was justified by that observer failure.\n\u003c/details\u003e\n\n**Remaining acceptance:** these are explicit per-message manual-final playback checks. Typed turns in this shell do not exercise automatic voice-origin streaming, because that path requires a voice-origin turn. Cloud/ElevenLabs buffered playback, microphone/native-device playback, physical output and corresponding interruption/stream-drain evidence remain unverified. Provider usage and these functional captures do not establish a latency or cache improvement. Known unrelated startup/network failures remain in the logs. The dedicated backend was shut down cleanly after capture; the existing UI server was preserved. The requesting user's “Sounds complete and natural” confirmation remains scoped to the original two short clips, not these fresh replies or the long recording. This issue remains open.\n\n[Download the complete original evidence archive](https://github.com/user-attachments/files/31886902/30679-live-model-manual-and-graph-20260906-complete.tar.gz). Canonical integrity and extracted-archive verification passed **138/138 artifacts**, with zero issues. Archive: **16,051,304 bytes**, SHA-256 `c4fccc27ed9c7eabcf24b2687f9718daaf1a7dcb05505b665802ea3aecbc6ea4`; manifest SHA-256 `25900392b1d80721dd52db4e8c939df27ab8408da0b57feea8d943b52a31ea40`. Configured-secret/private-key scanning found zero matches across 140 finalized files, all original inputs remained unchanged, and authenticated remote readback matches the archive. This explicit collection includes full model recordings, original audio, visual MP4s/JPGs, transport/playback/source receipts, backend logs, independent review and both failed observation attempts. It is unsigned and is not a newly executed test matrix.\n\n\n\u003c!-- sprint1-auto-voice-asr-prerequisites-20260906 --\u003e\n### Automatic voice capture and ASR prerequisites — 2026-09-06\n\nThe automatic shell capture is being strengthened before execution. Source review required message-to-task-to-encoded-audio-to-buffer-to-source identity, complete ordered spoken segments, exactly one successful persisted terminal event, rejection of ephemeral/history-refresh outcomes, accounting for every actual audio source, and a cancellation boundary measured from the actual DOM click. Diagnostic callbacks remain opt-in and preserve full text and bytes; their CPU/allocation cost means they are not an uninfluenced latency probe. A successful source-start call does not prove physical audibility. These amendments have source review, not completed live validation.\n\nThe currently inspected public e2b/e4b bundle manifests are staging artifacts with failed text/ASR evaluations and only an ASR projector. Normal activation rejects failed text evaluation; normal local ASR readiness also requires the non-projector ASR model. Parsing a staging manifest, or having Kokoro speech output and an embedding model installed, does not qualify microphone transcription. No qualified local ASR installation was identified in this inspected catalog; this is not a claim about every possible external installation.\n\nThe supported alternative under investigation is the normal authenticated Cloud ASR path: the real microphone capture must produce a successful transcription, then the shell must dispatch VOICE_DM with the actual cloud voice-source metadata. Credential presence or a sign-in page is insufficient. No authenticated live Cloud transcription receipt has been recorded for this new capture.\n\nBefore claiming this acceptance: run the focused observer tests and package/repository gates, attest served UI and backend source, capture real automatic natural playback and cancellation followed by a successful next turn, inspect complete transcripts/audio/graph evidence, and retain separate installed-native and affected cloud-provider receipts. Cached audio without prior origin evidence must remain unqualified. The user's earlier “Sounds complete and natural” remains approval of the two identified short clips only.\n\nSource references: [e2b manifest](https://huggingface.co/elizaos/eliza-1/resolve/main/bundles/e2b/eliza-1.manifest.json), [e4b manifest](https://huggingface.co/elizaos/eliza-1/resolve/main/bundles/e4b/eliza-1.manifest.json), [activation policy](https://github.com/elizaOS/eliza/blob/c2d55bf5e460055c19fb0c8bdfe217e4f1b2c8d8/plugins/plugin-local-inference/src/services/active-model.ts), [ASR file/provenance contract](https://github.com/elizaOS/eliza/blob/c2d55bf5e460055c19fb0c8bdfe217e4f1b2c8d8/plugins/plugin-local-inference/src/services/asr-provenance.ts).\n"])</script><script>self.__next_f.push([1,"1f:Tfbc,"])</script><script>self.__next_f.push([1,"## Problem\n\nEliza app subscriptions and subscriptions sold by hosted apps need independent customers, entitlements, trials, invoices, and infrastructure funding. The current organization-wide subscription model and product-specific hosted-app bridge cannot provide that contract. Customers must be able to use and buy a hosted app without buying an Eliza app subscription.\n\n## Implementation scope\n\nExtend the existing subscription authority, command journal, event receipts, and allowance ledger into one generic service. Retain Cloud organizations as infrastructure cost accounts. Give app customers a distinct app-scoped billing account, merchant binding, immutable product/plan revision, subscription, entitlement, and usage allowance. All currently eligible Cloud-managed plans receive a seven-day first trial. Reuse app registration, consent, credentials, and revocation.\n\nThe Eliza app and Outreachr must consume the generic APIs. Product branding, plan names/prices, workspace business rules, and deployed registration data belong in the respective app, not in Cloud runtime special cases. First-party products may share a merchant while retaining separate customer records; third-party merchants use an account-scoped Stripe Connect adapter.\n\n## Acceptance\n\n- [ ] Existing subscription commands/revisions/fences are extended, not replaced by a parallel lifecycle authority.\n- [ ] App, merchant/environment, subscriber billing account, and infrastructure payer ownership are enforced at database and API boundaries.\n- [ ] One base subscription per app billing account/product family; plan changes preserve subscription and trial identity.\n- [ ] Seven-day trial claims cannot reset through duplicate checkout, plan changes, cancellation, or workspace recreation. Trial allowance is noncash and distinct from paid-invoice allowance.\n- [ ] Production trial, checkout, portal, update, cancellation, webhook, reconciliation, and deletion flows use durable commands and an atomic lifecycle finalizer. Late workers cannot restore obsolete access.\n- [ ] One-time payment fulfillment and existing infrastructure funding remain correct; app revenue never becomes a customer's global Cloud credit balance.\n- [ ] Merchant-scoped customer, price, invoice, portal and refund flows work for first-party and connected-account products, including test/live isolation and the pinned Stripe API version.\n- [ ] Generic SDK and HTTP APIs support registration/catalog, trial, subscription/entitlement status, checkout/portal, seats, invoices, and usage.\n- [ ] Eliza buyer billing, developer app billing configuration, and a separate hosted-app consumer use the same contract.\n- [ ] Existing provider identities, cash balances, trial dates, grants, and invoices survive staged migration; historical organization records are classified by original contract, not silently relabeled as Eliza app subscribers.\n- [ ] Product-specific hosted-app runtime routes, environment variables, and implementation are removed after coordinated consumer cutover; immutable historical migrations and adoption proof remain intact.\n- [ ] Real PostgreSQL migration/concurrency tests, three-app isolation, zero-personal-credit buyer flow, restart/failure injection, signed Stripe sandbox lifecycle/Test Clock tests, and desktop/mobile browser review prove the behavior.\n- [ ] Owning package tests/typecheck/lint, root verification, applicable app audit/evidence, exact-head hosted checks, independent review, and post-merge readback pass.\n\n## Evidence and delivery\n\nThe implementing task owns the coordinated integration branch and merge sequence. Independent lanes own database/finalization, provider contracts, and app registration/consumer surfaces. Each lane retains exact source revisions and distinguishes controlled provider probes from live sandbox evidence. Source changes do not operate production billing resources. Pricing and platform-fee changes are outside this scope.\n\nCLAIMING: generic app subscription implementation and integration verification.\n"])</script><script>self.__next_f.push([1,"20:T81c,"])</script><script>self.__next_f.push([1,"The approved cloud production plan requires billing-suspended agents to resume automatically when funded entitlement returns, without waiting for the owner to visit the agent. The inspected proxy/pairing routes provide request-triggered resume. The credit-increase path invalidates caches, and the billing sweep selects billable states rather than provider-confirmed suspensions. No refill-triggered lifecycle caller was found in the inspected source.\n\nImplement convergence using the existing provisioning jobs and agent_compute_stop_intents, which already distinguish billing_request from user_request. Do not add a competing scheduler or infer desired running state from inactivity.\n\nAcceptance:\n- A provider-confirmed billing suspension becomes eligible after authoritative funded entitlement returns, including valid credit/grant funding, without a browser request or a particular webhook delivery order.\n- Reuse the same logical agent and verified retained state through the existing recovery path. An unavailable backup remains a visible recovery failure.\n- Manual stops, deletion/cancellation fences, non-current generations and in-flight replacements do not become resume candidates. A later user stop wins over an older billing suspension.\n- Discovery, job admission and execution recheck current primary-database lifecycle and funding authority. Repeated scans and concurrent refill events create at most one applicable lifecycle job.\n- A daemon crash between credit commit and job creation is repaired by reconciliation; no fabricated completion from enqueue alone.\n- Test duplicate/out-of-order events, refills during shutdown, stale candidate discovery, manual-stop precedence, deletion, insufficient funding and real state continuity. Verify the final database, runtime and provider state before production rollout.\n\nCoordinate with ownership/deletion issue #23098 and state-preserving recovery #30697. This issue is part of the approved production plan; it does not authorize changing the agreed payment-only suspension policy or destructive retention expiry.\n"])</script><script>self.__next_f.push([1,"21:T778,"])</script><script>self.__next_f.push([1,"Ordinary ElizaSandboxService.provision can return success without applying a known backup after key/decryption errors, restore HTTP failures, a custom-image missing restore endpoint, or null reconstruction. Some of these paths also prune the stored backup chain. The current provision path publishes user rows as running before restoring state, which opens the proxy readiness gate w ible for management, never authoritative.\n- **Store** (`CapabilityGrantStore.ts`): validated create, version-checked update, idempotent revoke — each mutation and its global `capability_epoch` bump commit in ONE transaction; a missing epoch singleton rolls the mutation back instead of fabricating progress. Uncapped live-grant reads filtered (expiry `\u003e now`, non-revoked) in SQL. Concurrent-safe promise-memoized DDL bootstrap.\n- **Decision path** (`authorizeCapability.ts`): fixed evaluation order — validate (fail closed) → explicit deny grants → allow grants (constraints intersected: numeric min, typed scalar array intersection, structural equality; incompatible → deny) → role-tier composition hook → deny `NO_MATCHING_GRANT` (no implicit allow). No decision cache, so revocation is effective before the next call returns by construction. Every decision attempts exactly one audit row (id generated up front); audit failures are reported through an injected `onAuditFailure` hook (J7; wire to `runtime.reportError` at the boundary) and can never block or flip a decision. Audit rows carry categorical/sanitized fields only — raw malformed values and driver errors never enter the log.\n- **Enforcement inventory** (`capability-boundary-inventory.ts`): 12 privileged boundaries (message send/read, device, fs read/write, PTy, git, media read/write, provider invoke, admin API, coding environments) with per-boundary status; the shape is test-validated. Completeness against future repo boundaries is a human-review obligation until the slice-2 classifier.\n- Exported node-only from `index.node.ts` (SQL-bound; browser/edge untouched).\n\n## Test evidence\n\n`bun run --cwd packages/core test` scope: **41/41 passing** real-PGlite tests in `CapabilityGrantStore.test.ts` (default vitest lane; PGlite disk data dirs, real Drizzle queries, no mocks of the system under test):\n\n- Self-migration from an empty database; concurrent first calls share one bootstrap\n- Restart survival: handle closed, fresh handle opened on the SAME disk dir — grants (and deny grants) created under the first handle remain authoritative; epoch identical\n- Revocation visible to the very next decision; expiry boundary `expiresAt \u003c= now` never matches\n- Deny-wins over simultaneous allows and over the role tier; role tier never rescues a deny; broken resolver degrades to deny\n- Fail-closed: malformed subject/capability/agentId/resource/worldId → `INVALID_REQUEST`; store down → `STORE_UNAVAILABLE`; no grant → `NO_MATCHING_GRANT`\n- Audit: per-decision rows, categorical details (raw values withheld), 512-char resource truncation, failure reported through the hook, throwing reporter cannot abort any decision path\n- Optimistic-version conflicts; partial unique index (world-aware via nil-uuid coalescing) blocks duplicate active policies and frees on revoke; identical policies legal in distinct worlds and alongside global\n- Typed constraint intersection incl. non-scalar arrays → incompatible; nearest expiry across multiple allows\n- Quarantine of legacy rows with malformed selector/issuer/capability/subject/effect/provenance\n- Mutation rollback when the epoch singleton is missing (zero grant rows survive)\n- Boundary inventory shape validation\n\nTypecheck clean (`bun run --cwd packages/core typecheck`), Biome clean, `bun run --cwd packages/core build` succeeds and the built barrel exports `authorizeCapability` + store API (verified by import probe against the built output).\n\n## Review evidence\n\nIndependently reviewed by a second agent (RepoPrompt CE, gpt-5.6-sol) over the full embedded diff across **5 rounds**: 16 must-fix findings raised, all fixed with direct test coverage — including removal of a 500-row live-grant cap that could break deny-wins, audit sanitization + injected failure reporting, selector charset grammar, transactional epoch bumps with rollback, promise-memoized concurrent migration, world-aware uniqueness, typed/structural constraint semantics, and forced-invocation reporter tests. Final round passed all six checklist areas; the sole residual (a header wording nit) is fixed in 87a4f61.\n\n## Out of scope (follow-up slices, per the issue)\n\nBoundary-by-boundary enforcement wiring, Settings UI explain surface, management API + natural-language grant path, approval flows, role→capability floor mapping, PostgreSQL-lane CI evidence, disposition of legacy in-memory elevations/delegations.\n\nCloses #23102 (slice 1 of the tracked follow-ups).\n\n\u003c!-- evidence-head:87a4f61e3cb76ee03effd03de8c357bc4f923451 --\u003e\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- [ ] N/A - inline transcript above (no artifact upload; fork lacks pr-evidence release access)\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - core-only durable grant store + authorizeCapability decision path; no UI surface touched\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - core-only durable grant store + authorizeCapability decision path; no UI surface touched\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - backend-only change, no user-visible surface to demonstrate\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] N/A - no frontend package touched; packages/core only\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] N/A - no model, provider, prompt, or trajectory-recording path changed; authorization store + decision logic only\n\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - boundary inventory checked in as real test (inventory shape validation, cited in body); no external domain artifact produced\n\nAI provider/model: zai / glm-5.3\nClient / agent tooling: Hermes Agent\nContribution skill revision: elizaOS/eliza@2bca2475c434e3b57d1b84753087fc73309094ab:packages/skills/skills/contribute-to-eliza\nAttribution status: self-reported\n— [hermes-t3rpz]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"zai\",\"model\":\"glm-5.3\",\"client\":\"Hermes Agent\",\ 1,"On `develop`, a caller cannot trust complete-retrieval traversal. A document request whose vector recall is empty still comes back carrying keyword-corpus rows that never matched the query. A `plugin-inmemorydb` traversal keeps re-serving page one and then rejects a healthy source. A growing-prefix PII walk aborts a stable source with `ElizaError: PII context memories source changed during traversal`.\n\nThose are the failure classes @lalalune reproduced in #25150. Verbatim:\n\n\u003e 1. Hybrid document search can add irrelevant keyword-corpus rows when vector results are empty or sparse.\n\u003e 2. The first-party plugin-inmemorydb adapter does not honor the widened stable offset contract, so complete traversal repeats the first page and rejects healthy sources.\n\u003e 3. Growing-prefix PII traversal reranks each prefix with BM25, so a stable source can appear unstable as corpus statistics change.\n\u003e 4. Deterministic overlapping document pages can pass double-scan equality while duplicating one row and omitting another.\n\u003e 5. Requiring two whole-corpus scans to match rejects ordinary concurrent prepends/appends instead of traversing a stable keyset snapshot.\n\nRefs #25150. **This PR does not close it.** It reproduces all five classes as failing tests and makes them pass, but a CHANGES_REQUESTED review found six defects — four P1 — in the fix itself, and none of them are fixed yet. The per-item dispositions are below; every one is conceded. I am keeping the PR open with the blockers enumerated rather than re-requesting review.\n\n## Exact head\n\nEvery claim in this body is about head **`d4b8d5a75be3913cdbb0158f1141d6fdd7eb81b2`** (single commit `fix(core): stabilize complete retrieval paging`, parent `f2ccf2555d18d9ec768c3ace447f595799c44ed0`).\n\nWhere evidence was gathered at the older head `9197af578e64a9196f271523398d5c7f3b643ac6` and has not been re-run since the rebase, the section says so explicitly.\n\n`develop` has moved again since the rebase: `gh api repos/elizaOS/eliza/compare/develop...d4b8d5a` reports `{\"ahead_by\":1,\"behind_by\":6,\"status\":\"diverged\"}` against `develop` = `7d55350499f4aed3f6c4e8da4b9ab266692182a4`. GitHub still reports `mergeable: true`, `mergeable_state: unstable`. Another rebase is owed before re-review.\n\n## Reproduction\n\nCommands are repo-root relative. Run each pair to see the class fail, then pass.\n\n### 1, 4, 5 — document relevance, page integrity, concurrent mutation\n\n```bash\ncd packages/core\nbunx vitest run src/features/documents/__tests__/issue-25150-adversarial.test.ts\n```\n\nBefore (pre-fix tree, captured before the commit in this PR was applied):\n\n```text\n ❯ src/features/documents/__tests__/issue-25150-adversarial.test.ts (5 tests | 5 failed) 88ms\nAssertionError: expected [ { …(6) }, { …(6) }, { …(6) } ] to deeply equal []\nAssertionError: expected [ …(4) ] to deeply equal [ Array(1) ]\nAssertionError: promise resolved \"[ { …(6) }, { …(6) }, …(1998) ]\" instead of rejecting\n      Tests  5 failed (5)\n```\n\nExit status 1. The first assertion is class 1 (disjoint keyword corpus admitted with empty vector recall), the second is class 4 (overlap duplicates one row and omits another), the third is class 5 (a concurrent append is not rejected as it should be, or a stable snapshot is not traversed).\n\nThe file now holds 8 cases: `does not inject a query-disjoint keyword corpus when vector recall is empty`, `keeps a sparse semantic hit without adding disjoint corpus rows`, `rejects deterministic overlap instead of duplicating one row and omitting another`, `rejects a deterministic missing page even when repeated scans agree`, `rejects a reordered continuation page`, `rejects an adapter that ignores the continuation cursor`, `rejects a nonterminal page that makes no progress`, `traverses the original keyset snapshot when a concurrent append prepends a row`.\n\n### 3 — growing-prefix PII rerank\n\n```bash\ncd packages/core\nbunx vitest run src/security/issue-25150-runtime-adversarial.test.ts\n```\n\nBefore (pre-fix tree):\n\n```text\n ❯ src/security/issue-25150-runtime-adversarial.test.ts (2 tests | 2 failed) 12ms\n FAIL  src/security/issue-25150-runtime-adversarial.test.ts \u003e issue #25150 real-runtime PII retrieval \u003e does not rerank incompatible growing prefixes\nElizaError: PII context memories source changed during traversal\n      Tests  2 failed (2)\n```\n\nExit status 1.\n\n### 2 — plugin-inmemorydb ignores the paging contract\n\n```bash\ncd plugins/plugin-inmemorydb\nbunx vitest run --config vitest.config.ts issue-25150-adversarial.test.ts\n```\n\nBefore (pre-fix tree):\n\n```text\n ❯ issue-25150-adversarial.test.ts (1 test | 1 failed) 9ms\nAssertionError: expected '50000000-0000-4000-8000-000000000003' to be '50000000-0000-4000-8000-000000000004' // Object.is equality\n      Tests  1 failed (1)\n```\n\nExit status 1 — the adapter re-served the first page instead of continuing.\n\n### Real-SQL keyset vectors\n\n```bash\ncd plugins/plugin-sql\nenv -u POSTGRES_URL VITEST_LANE=post-merge bunx vitest run \\\n  --config src/vitest.real.config.ts \\\n  src/__tests__/integration/issue-25150-retrieval-keyset.real.test.ts\n```\n\nBefore (pre-fix tree):\n\n```text\n ❯ __tests__/integration/issue-25150-retrieval-keyset.real.test.ts (4 tests | 3 failed) 1803ms\nAssertionError: promise resolved \"[ { …(11) }, { …(11) } ]\" instead of rejecting\n      Tests  3 failed | 1 passed (4)\n```\n\nExit status 1.\n\n## After, at head `d4b8d5a`\n\nThe most recent focused run recorded at this exact head is the one posted in [the rebase comment on this PR](https://github.com/elizaOS/eliza/pull/28336#issuecomment-5413441343), from a network-denied macOS sandbox:\n\n```text\n✓ src/security/issue-25150-runtime-adversarial.test.ts (4 tests) 64ms\n✓ src/features/documents/__tests__/issue-25150-adversarial.test.ts (8 tests) 34ms\n✓ src/database/issue-25150-stable-retrieval.test.ts (1 test) 4ms\n\n Test Files  3 passed (3)\n      Tests  13 passed (13)\n```\n\n```text\n✓ issue-25150-adversarial.test.ts (1 test) 10ms\n\n Test Files  1 passed (1)\n      Tests  1 passed (1)\n```\n\n```text\n✓ src/__tests__/integration/issue-25150-retrieval-keyset.real.test.ts \u003e issue #25150 ranked retrieval keyset (real SQL) \u003e orders tied semantic scores by createdAt and UUID and continues exactly once 22ms\n✓ src/__tests__/integration/issue-25150-retrieval-keyset.real.test.ts \u003e issue #25150 ranked retrieval keyset (real SQL) \u003e keeps an in-progress traversal stable when a newer best match is appended 14ms\n✓ src/__tests__/integration/issue-25150-retrieval-keyset.real.test.ts \u003e issue #25150 ranked retrieval keyset (real SQL) \u003e returns an actionable conflict when the traversed source mutates 12ms\n✓ src/__tests__/integration/issue-25150-retrieval-keyset.real.test.ts \u003e issue #25150 ranked retrieval keyset (real SQL) \u003e uses the real vector operator for the same semantic vectors 13ms\n\n Test Files  1 passed (1)\n      Tests  4 passed (4)\n```\n\nFormatting and typecheck at the same head, candidate vs. untouched-`origin/develop` control:\n\n```text\nChecked 18 files in 269ms. No fixes applied.\nCANDIDATE_CORE_TSC_STATUS=0\nCANDIDATE_INMEMORYDB_TSC_STATUS=0\nCANDIDATE_SQL_TSC_STATUS=0\nCONTROL_CORE_TSC_STATUS=0\nCONTROL_INMEMORYDB_TSC_STATUS=0\nCONTROL_SQL_TSC_STATUS=0\n```\n\n**Not re-run at `d4b8d5a`.** The following were last executed at the stale head `9197af5` and are not being claimed for the current head: the dedicated PostgreSQL 18 lane (`POSTGRES_URL=…/eliza_issue_25150`), the existing-suite regression run (`search.test.ts`, `pii-context-pack.test.ts`, `inMemoryAdapter.search-memories.test.ts`), the package builds and lints, and root `bun run verify`. They will be re-run and re-posted with the next push.\n\n## Hosted CI at `d4b8d5a` — currently red\n\nThe previous body claimed three green checks. That was true of `9197af5` and is **not** true of the current head. REST readback for `d4b8d5a` ([run 32871718815](https://github.com/elizaOS/eliza/actions/runs/32871718815)):\n\n| Check | Conclusion |\n| --- | --- |\n| All Tests Passed | **failure** (step `Require source and Windows security lanes`) |\n| Source static smoke | **cancelled** (step `Build affected workspace closure`) |\n| Browser bridge Windows security / windows-security-contract | success |\n\nThe run's own conclusion is `cancelled`. `Source static smoke` did not complete, so the aggregate gate had no source lane to require and failed. This needs a re-run on a fresh rebase; I am not asserting the failure is unrelated until I have seen it complete.\n\nSeparately, and agreeing with the reviewer: PR Static Smoke does not execute the focused or real-SQL lanes at all, so even a green `All Tests Passed` would not have validated the retrieval claims above. Only the pasted local runs do.\n\n## Review findings — per-item disposition\n\nAgainst [`startrack3r`'s CHANGES_REQUESTED review](https://github.com/elizaOS/eliza/pull/28336#pullrequestreview-5016829589) (static review of `9197af5`). I re-read each cited location at `d4b8d5a`. **All six still stand. All six are conceded. None are fixed.**\n\n**1. [P1] RLS principal is bound to a result filter — CONCEDED, OPEN.** `plugins/plugin-sql/src/base.ts:4043` still reads `return this.withEntityContext(params.entityId ?? null, async (tx) =\u003e {` inside `searchMemoriesPage`, while `params.entityId` is applied separately as a row filter at the `eq(memoryTable.entityId, params.entityId)` condition. The requester principal is `params.accessContext?.requesterEntityId`. Under PostgreSQL RLS this makes a row filter drive `current_entity_id()`, and an omitted filter supplies no principal at all. The reviewer is also right that the existing real-SQL test uses one UUID for both roles and therefore cannot catch it. Fix owed: bind `withEntityContext` to the validated requester with an explicit absent-context policy, plus real-Postgres cases where requester A filters entity B and where the context is missing or empty.\n\n**2. [P1] Shared in-memory storage is not agent-isolated — CONCEDED, OPEN.** `plugins/plugin-inmemorydb/adapter.ts:1375` `searchMemoriesPage` filters on `tableName`, `roomId`, `worldId`, `entityId`, and `unique`, with no `memory.agentId === this.agentId` predicate. The plugin shares one `MemoryStorage` across adapters and the dimension rebuild loads every stored agent into the index, and the PII path calls this without an `AccessContext`. Another agent's rows can therefore reach the result, the count, and the snapshot fingerprint. Fix owed: enforce the agent boundary in both the stable and legacy paths, scope index rebuild per agent, and test two adapters sharing one storage across a rebuild.\n\n**3. [P1] This is not storage-level keyset paging — CONCEDED, OPEN, and it is the acceptance criterion.** Confirmed at head: `searchMemoriesPage` issues `.orderBy(asc(distance), desc(memoryTable.createdAt), desc(memoryTable.id))` with no cursor predicate and no `LIMIT`, then filters, maps, and hands the complete ordered corpus to `createStableRetrievalPage`, which slices and fingerprints it in JavaScript. The two document queries do the same. Every page is O(N) transfer, sort, and hash; a traversal is O(N × pages). The prior body disclosed this as a \"tradeoff\" in *Scope and risk* while ticking the adapter-keyset acceptance box in the same document — that contradiction is withdrawn and the box is now unticked. Fix owed: push the exclusive `(score, createdAt, id)` continuation and the snapshot fence into each adapter query with `LIMIT pageSize + 1`, plus query-shape and large-corpus assertions.\n\n**4. [P1] Torn in-memory storage/index state — CONCEDED, OPEN.** I confirmed at head that `searchMemoriesPage` guards only with `withDocumentMutationLock`, which chains on `documentMutationTail` (`plugins/plugin-inmemorydb/adapter.ts:872`). The reviewer's point stands: ordinary create/update/delete write storage and the vector index as separate awaited operations outside that tail, and clearing an embedding leaves the HNSW node behind — I have not independently re-derived that second half. A page can rank against stale vector state, return a differently-shaped stored row, and still mint a snapshot over it. Fix owed: serialize those mutations against stable reads (or publish an atomic immutable snapshot), drop the index node when an embedding is cleared, and add forced-interleaving regressions.\n\n**5. Backward-compatibility regressions — CONCEDED, OPEN, both halves.** (a) `plugins/plugin-inmemorydb/adapter.ts:1320` still has `const threshold = params.match_threshold ?? -1;` on the legacy `searchMemories` path, changing the omitted-threshold default from `0.5` and handing existing callers low- and negative-similarity rows. Restoring `0.5` with tests for omitted / explicit `0` / explicit `-1` is owed. (b) `packages/core/src/types/runtime.ts:644,647` declare `searchMemoriesPage` and `rerankMemories` as required `IAgentRuntime` members while the runtime feature-detects them as optional — that breaks structurally typed third-party runtimes. Owed: model them as optional or versioned capability members, or move them to an extended interface.\n\n**6. Stable-helper cross-adapter gaps — CONCEDED, OPEN.** Confirmed at head in `packages/core/src/database/stable-retrieval.ts`: `buildSnapshot` compares `key.id \u003e upperId` as a raw case-sensitive string while the canonical adapter comparator lowercases to match PostgreSQL, and `fingerprint()` hashes only `id`, `createdAt`, `similarity`, `content`, `embedding`, `metadata`, `roomId`, `worldId`, `entityId` — so a mutation to a returned field it omits, such as `unique`, passes the old snapshot unchanged. Owed: canonicalize UUID comparison and duplicate identity, fingerprint the complete canonical returned row, and add parity/mutation tests.\n\n**7. Overstated end-to-end claim — CONCEDED and corrected here.** The reviewer is right that the projection case is not the real end-to-end path the previous body advertised. `packages/core/src/security/issue-25150-runtime-adversarial.test.ts:124` constructs a real `DocumentService`, but the adapter beneath it is `queryDocumentFragments: vi.fn(async () =\u003e fragments)` over 1,205 synthetic rows, with a mocked runtime around it. It proves the projection seam does not silently truncate; it does not prove a real DocumentService → storage → planner path. The \"real `DocumentService` → projection → `AgentRuntime` dispatch\" wording is withdrawn.\n\n**8. Evidence-row markers — FIXED.** All seven mandatory evidence-row markers plus the OCR row were missing from the previous body and are restored below, and the evidence-head marker now carries `d4b8d5a`.\n\n**9. Rebase onto live `develop` — PARTIALLY DONE.** Rebased onto `f2ccf25` at `d4b8d5a`, preserving both sides of the `plugin-inmemorydb` conflict with #28112 (`const limit = params.count ?? params.limit;` from develop, `const threshold = params.match_threshold ?? -1;` from this PR — and per finding 5 that second line is itself owed a revert). `develop` has since advanced 6 commits; another rebase is owed.\n\n## Acceptance status against #25150\n\nHonest mapping. Nothing is ticked that the rest of this body contradicts.\n\n- [x] Add current-develop real-service/adversarial tests for all five cases and prove each expected-success path — 13 focused core tests, 1 in-memory adapter test, 4 real-SQL tests, each failing on the pre-fix tree and passing at `d4b8d5a`.\n- [x] Preserve relevance: query-disjoint rows never enter model context merely because a complete source traversal exists — the empty-vector and sparse-vector disjoint-corpus cases pass.\n- [ ] **Not met.** Every first-party adapter implements the same stable ordered keyset/cursor contract — the *cursor semantics* are enforced and ignored cursors are rejected, but per finding 3 the SQL adapters do not issue a keyset query; they materialize the full co thetic API boundary evidence, not live Cloudflare proof.\n\n```text\nnode --test packages/cloud/scripts/cloudflare-inference-trace-evidence.test.mjs packages/cloud/scripts/cloud-latency-certification.test.mjs packages/cloud/scripts/latency-certification-provenance.test.mjs\ntests 26; pass 26; fail 0\nCovered: zero sampling, complete and incomplete traces, cursor pagination,\nrepeated/empty/mixed-trace page rejection, private-field exclusion,\ntransport failure sanitization, raw-file cleanup, credential failure,\nlate ingestion, full-window sliced graph assembly and conflicting duplicates.\n```\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend request or response contract changed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no model request or provider-dispatch behavior changed; the existing paired benchmark is unchanged.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Parser output and private-directory lifecycle inspected through executed boundary tests.\n\n```text\nIngress ORD with Worker span SJC emits ingressColo=ORD and workerColo=SJC.\nMissing Worker region yields inconclusive sampling rather than inferred placement.\nRaw capture directory is mode 0700 and absent after both success and failure.\n```\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no pixels or visual surface changed.\n\n## Remaining acceptance\n\nAfter source review and normal merge, run the protected workflow on an exact staging deployment. Inspect the sanitized artifact and any failure category. Sampling absence is inconclusive. Do not change placement or admission topology based only on this collector's unit tests; require actual per-hop observations first.\n\n## External boundary references\n\n- [Cloudflare telemetry query API](https://developers.cloudflare.com/api/resources/workers/subresources/observability/subresources/telemetry/methods/query/): ad-hoc queries, event cursors, metadata duration units and Worker execution-model field  single-shot.\n\n2. **Generation-safe exchange and recovery**\n   - Consumes state/verifier once and ignores late results from superseded route generations.\n   - Prevents stale exchanges from publishing a token or navigating.\n   - Serializes token publication and server-cookie synchronization so the newest valid exchange wins.\n   - Makes cookie synchronization abortable and bounded to 10 seconds.\n   - Orders logout/account-switch teardown with exchange finalization and prevents any session POST from starting after a concurrent logout.\n   - Recovers from rejected bridge redirects instead of leaving the app or join page on a permanent spinner.\n\nThe same-realm browser contract is covered. Cross-tab/cross-realm coordination is not claimed; the generation queue, abort controller, and logout epoch are module-local.\n\n# Review guide\n\nStart with:\n\n- `packages/ui/src/cloud/sso-bridge/SsoBridgeRoute.tsx`\n- `packages/ui/src/cloud/sso-bridge/sso-bridge.ts`\n- `packages/shared/src/steward-session-client/index.ts`\n- Their adjacent tests\n\nImportant invariants:\n\n- Before the guarded persistence commit point, a superseded exchange writes and emits nothing.\n- Once a valid persistence begins, later valid generations are ordered after it and the newest one wins.\n- A stale generation never navigates.\n- Logout wins over an exchange still waiting on persistence or cookie synchronization.\n- The burn endpoint remains destruction-only and exposes no validity oracle.\n\n# Exact-head validation\n\nAt `843138140667ec17de5b05aeb7dd9a2f24601d62`:\n\n- Shared session client: **22/22**\n- UI SSO/app-mode/join suites: **86/86**\n- Cloud API SSO route: **19/19, 99 assertions**\n- Typechecks: shared, UI, and app pass\n- Biome on all 10 follow-up files: pass\n- `git diff --check`: pass\n- Root `bun run verify`: **376/376 tasks**\n- Independent security review: PASS\n- Independent adversarial bug/lifecycle review: PASS\n\nThe four broader rowless AppModeEntryRoute failures seen during exploration reproduce unchanged on the clean predecessor head and are not caused by this PR.\n\n# Evidence\n\nThe existing visual/log artifacts were captured for predecessor head `adb5a33e01589031529fae31e9e169abd55678cf` and cover the unchanged abandoned-code custody flow. The added exchange/logout fixes are non-visual and are evidenced on the exact current head by the deterministic concurrency suites and full verification receipt above.\n\n\u003c!-- evidence-head:adb5a33e01589031529fae31e9e169abd55678cf --\u003e\n\n- [Before contact sheet](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30243-before-desktop-mobile.jpg)\n- [After contact sheet](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30243-after-desktop-mobile.jpg)\n- [SSO custody walkthrough](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30243-sso-custody-walkthrough.mp4)\n- [Backend burn contract](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30243-backend-burn-contract.log)\n- [Frontend lifecycle events](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30243-frontend-lifecycle-events.json)\n- [Code lifecycle proof](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30243-code-lifecycle-proof.json)\n- [OCR review](https://github.com/elizaOS/eliza/releases/download/pr-evidence-11/30243-ocr-review.txt)\n\nNo model, prompt, provider, agent behavior, voice, transcript, TTS, or STT behavior changes.\n\n# Known environment note\n\nA normal dependency install reaches an optional native postinstall that requires Apple's Metal Toolchain, which is not installed on this Mac. The locked dependency graph remained unchanged, the affected packages built and typechecked, and the complete root verification passed.\n\n# Deploy notes\n\nThe API burn route must be available before clients rely on it. Normal same-repository deployment order is compatible: old clients do not call it, while new clients treat burn as best-effort and retain the safe login fallback."])</script><script>self.__next_f.push([1,"43:Tb67,"])</script><script>self.__next_f.push([1,"## Summary\nCloses #30610\nFollow-up to #30605 (which established `@elizaos/shared/db/raw-sql` for `plugin-finances`, `plugin-health`, `plugin-personal-assistant`, and `plugin-scheduling`).\n\nConsolidates the remaining 11 custom raw-SQL row parsers, value encoders, and transaction delegators across domain stores to use the canonical `@elizaos/shared/db/raw-sql` primitives:\n1. **`plugins/plugin-goals`** (`src/db/sql.ts`, `src/services/migration.ts`)\n2. **`plugins/plugin-inbox`** (`src/db/sql.ts`, `src/inbox/migration.ts`)\n3. **`plugins/plugin-calendar`** (`src/internal/sql.ts`, `src/service/migration.ts`)\n4. **`plugins/plugin-reminders`** (`src/services/migration.ts`)\n5. **`packages/agent`** (`src/services/approval/sql.ts`, `src/services/knowledge-graph/sql.ts`, `src/services/pendant-session/repository.ts`, `src/api/connector-account-routes.ts`)\n\n### Key Improvements:\n- **Strict result validation:** All stores reject malformed database execution results (`null`, `undefined`, non-array `{ rows }`, sparse/invalid rows) throwing `RawSqlError` with code `SQL_RESULT_INVALID`, rather than returning fake empty arrays `[]` or silently dropping bad rows.\n- **Deduplication:** Removed ~950 lines of duplicate row-parsing and encoder logic across plugins and agent packages.\n- **Contract \u0026 unit tests added:**\n  - Added real DB / PGlite contract test suites: `plugins/plugin-goals/src/db/sql-contract.test.ts`, `plugins/plugin-inbox/src/db/sql-contract.test.ts`, and `plugins/plugin-calendar/src/internal/sql-contract.test.ts` verifying malformed adapter result rejection, transaction rollback, and row extraction parity.\n  - Added `packages/shared/src/db/raw-sql.test.ts` exercising 100% of `@elizaos/shared/db/raw-sql` primitives.\n- **Documentation:** Synchronized `CLAUDE.md` and `AGENTS.md` guidelines in touched plugins.\n\n## Ver ence-admission-gate.ts`)**:\n   - Added `dispatch?: boolean` and `preProviderCancellationToken?: string` to `LeaseRequest` and `AuthorizedLeaseRequest`.\n   - In `this.lease()`, atomically persist the lease with `phase: \"dispatched\"`, `preProviderCancellationToken`, and updated alarm/ledger in one commit when `dispatch: true`.\n   - Handled duplicate/replay: if already leased/dispatched, safely update expiry and return `dispatched: true, duplicate: true` without double debit.\n   - Preserved pre-provider release capability: `/release` allows releasing a dispatched lease if and only if the valid `preProviderCancellationToken` matches.\n\n2. **Client Service (`packages/cloud/shared/src/lib/services/inference-admission-gate.ts`)**:\n   - Added `dispatch?: boolean` to `acquireInferenceAdmissionLease`. Generates `preProviderCancellationToken` and sends it with `dispatch: true`.\n   - Updated `markInferenceAdmissionLeaseDispatched`: consumes `preProviderCancellationToken` when already dispatched (zero network round-trip).\n   - Updated `releaseInferenceAdmissionLease` \u0026 `settleInferenceAdmissionLease`: allows zero-settlement release using `preProviderCancellationToken` if upstream aborted before provider call.\n\n3. **Organization Admission (`packages/cloud/shared/src/lib/services/organization-inference-admission.ts`)**:\n   - Added `dispatch?: boolean` to `OrganizationInferenceAdmissionParams` and forwarded to `acquireInferenceAdmissionLease`.\n\n4. **Completions Route (`packages/cloud/api/v1/chat/completions/route.ts`)**:\n   - Passed `dispatch: true` to `admitOrganizationInference` so the initial admission gate combines lease + dispatch before calling the upstream provider.\n\n---\n\n## Verification\n- **Unit Tests**: Added 2 test cases in `packages/cloud/api/__tests__/inference-admission-gate.test.ts` verifying atomic combined lease + dispatch, idempotent replay, mismatched token refusal, and token-based release. (52/52 pass)\n- **Integration Tests**: Verified ollment or an unpinned runner.\n\nNothing asserted it. The two suites in this directory cover the runner and the same-host integration path, not this decision. This adds 20 tests. No production change.\n\n# The decision table\n\n| vault | active sessions | staged sessions | outcome |\n|---|---|---|---|\n| not enrolled | ≥1 | — | **throws** |\n| not enrolled | 0 | — | `not_enrolled`, runner stopped |\n| enrolled | ≥1 | — | `active_authority`, runner **running** |\n| enrolled | 0 | ≥1 (unresolved) | `activation_recovery`, runner **running** |\n| enrolled | 0 | 0 | `no_active_authority`, runner stopped |\n\nThe throw is the one that matters. Returning `not_enrolled` there would look like a clean first run and invite a fresh enrollment, quietly orphaning a controller grant that is still live in the journal. That substitution is now a failing mutant.\n\nEvery clause of the active-authority filter is covered individually — not staged, not stopped, not revoked, not expired — including that **expiry is inclusive** (`expiresAt \u003e= now`), so a grant expiring exactly now still counts rather than dying a millisecond early on every restart.\n\nAnd `resumed: false` is asserted to also mean *not running*, via `service.status()`. A runner started on a \"no authority\" path would poll the relay for commands with nothing backing it.\n\n# I got the staged-activation contract wrong first, and the failures corrected me\n\nMy initial tests assumed a staged session simply yields `activation_recovery`. It doesn't. `resumeEligibleLoopback` calls `recoverStagedActivations()` **before** reading the decision, so the answer depends on what the relay says:\n\n| relay response to `commitActivation` | journal effect | resume outcome |\n|---|---|---|\n| success | session promoted to `active` | `active_authority` |\n| 404 / 409 / 410 (grant gone) | session **deleted** | `no_active_authority` |\n| 0 / 408 / 429 / 5xx (outage) | stays `staged` | `activation_recovery` |\n| anything else (e.g. 403) | — | **propagates** |\n\nSo **a relay outage is the only path to `activation_recovery`** — the runner comes up to keep retrying rather than either discarding a real grant or claiming authority it hasn't confirmed. That's a genuinely nice piece of design and it now has tests that say so. All four rows are asserted, including that a 403 is neither \"gone\" nor \"offline\" and must not be silently classified as either.\n\nAlso asserted: a stopped or revoked staged session is **never committed at all** (`commitActivation` not called), and recovery is skipped entirely when the vault isn't enrolled.\n\n# Mutation testing: 18 mutants, 18 killed\n\nAcross `remote-target-rpc.ts` and `remote-target-runner.ts`:\n\n- the fail-closed throw replaced with `not_enrolled`\n- each of the four active-filter clauses dropped individually\n- `expiresAt \u003e= now` → `\u003e`, and expiry ignored entirely\n- both staged-filter clauses dropped\n- `activation_recovery` relabelled `active_authority`\n- recovery run when not enrolled, and recovery skipped entirely\n- runner started on `no_active_authority` and on `not_enrolled`; runner *not* started on `active_authority`\n- `410` dropped from the gone set; `5xx` dropped from the transient set; the unclassified-error rethrow turned into `continue`\n- the staged commit filter ignoring `revokedAt`\n\nOne of these needed a second pass. \"Runner started on `no_active_authority`\" initially survived because I was only asserting that `claimNext` hadn't been called — too indirect. Switching to `service.status()` killed it and two more lifecycle mutants I added afterwards.\n\n# A red herring I checked before reporting\n\n`remote-target-runner.test.ts` shows **2 failures under a bare `bun test`** on unmodified `develop`. That is a wrong-runner artifact, not a defect: this directory has its own `vitest.electrobun.config.ts`, and under that config it is **39 pass / 0 fail**. Worth knowing if anyone else runs into it.\n\n# Evidence\n\n```\nbunx vitest ru `_startAgent()`. Because `_startAgent()` was skipped, the native loopback session handshake (`primeDesktopSessionAuth`) and subsequent renderer reload (`reloadRendererAfterDesktopSessionPrime`) never executed for external development runtimes like `bun run dev:desktop --cloud-target=offline`. As a result, no `eliza_session` or `eliza_csrf` cookies were installed into the Electrobun webview cookie jar, causing subsequent renderer requests (such as `POST /api/first-run`, notifications, and model configurations) to return 401 Unauthorized.\n\n## Changes\n1. **Export loopback validator**:\n   - Export `isLoopbackBase` from `packages/app-core/platforms/electrobun/src/native/auth-bridge.ts`.\n2. **Invoke agent lifecycle for external runtimes**:\n   - In `main()`, invoke `_startAgent()` when `rt.mode === \"external\" || rt.mode === \"local\"`.\n3. **Initialize loopback external runtime session**:\n   - In `_startAgent()`, check whether `externalApiBase` is a loopback address using `isLoopbackBase(externalApiBase)`.\n   - For external loopback runtimes, resolve `rendererBase` (accounting for Vite/dev-server loopback origin), prime the session via `primeDesktopSessionAuth(externalApiBase, rendererBase)`, publish the renderer-facing API base and token, set agent ready, and reload the renderer via `reloadRendererAfterDesktopSessionPrime`.\n4. **Preserve remote runtime isolation \u0026 fail-closed invariants**:\n   - Remote (non-loopback) external runtimes are strictly excluded from local session priming and never receive locally minted authority.\n   - Failed handshakes fail closed, leaving the renderer in the standard unauthenticated/login state.\n5. **Unit test coverage**:\n   - Added tests in `desktop-session-prime.test.ts` verifying:\n     - External loopback runtime primes authority across both API base and dev-server renderer origin.\n     - Remote external runtimes are distinguished and excluded by `isLoopbackBase`.\n     - Failed handshake produces no cookies and fails op-level `thinking` parameter before forwarding the\nrequest to `api.anthropic.com`. `stripThinkingParameters` removed\n`\"thinking\":{...}` but only consumed a **leading** comma. When `thinking` is the\n**first** key of the top-level object there is no leading comma, so the trailing\ncomma was left behind, producing malformed JSON such as `{,\"system\":...}`.\nAnthropic rejects that body with `400 invalid JSON`, silently breaking every\nextended-thinking request whose serialization happens to place `thinking` first.\n\nThis occurs in production whenever the request already carries a `system` array\n(array form, used for prompt caching) **and** `metadata` (user_id): neither the\nbilling nor the metadata injector prepends a key ahead of `thinking`, so it\nstays the first key and the corruption reaches the wire.\n\nThe strip now consumes the leading comma when present, and otherwise (first key)\nconsumes the trailing comma, so removal never leaves a dangling separator\nregardless of the parameter's position.\n\nFollowing static review, the strip was hardened so it never emits malformed\nJSON on any raw client body, not just minified ones: the leading-comma check\nnow skips insignificant whitespace (so a pretty-printed body with `thinking`\nas the last key no longer leaves a trailing comma), and the value boundary is\nbrace-matched with string/escape tracking via `findMatchingObjectEnd` instead\nof the first `}` (so a nested object under `thinking` or a `}` inside a string\nvalue no longer ends removal early and orphans syntax). Three raw-wire\nregression cases cover these shapes and fail against the prior source. This is\na deliberate, documented divergence from `proxy.js` v2.2.3's string operations,\nnoted in the module header so it is not reconciled away as drift.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. Behavior is\
