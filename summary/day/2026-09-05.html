it five lines apart and differ by one keyword:\n\n```ts\n// getTweetWhere\nconst matches = isCallback ? await query(tweet) : checkTweetMatches(tweet, query);\n\n// getTweetsWhere\nconst matches = isCallback ? query(tweet) : checkTweetMatches(tweet, query);\n//                           ^^^^^^^^^^^^ no await\n```\n\n`TweetQuery` explicitly permits an async predicate:\n\n```ts\nexport type TweetQuery =\n  | Partial\u003cTweet\u003e\n  | ((tweet: Tweet) =\u003e boolean | Promise\u003cboolean\u003e);\n```\n\nAn unawaited Promise is **always truthy**, so `getTweetsWhere` with an async predicate returns *every* tweet. A filter that silently filters nothing. This is public API — `client.getTweetsWhere` is documented with a usage example in `client.ts`.\n\nI proved it by running it rather than reading it. Three tweets, an async predicate matching two:\n\n```\ngetTweetsWhere → 1,2,3     ← all of them\ngetTweetWhere  → 1         ← correct\n```\n\nA **rejected** predicate was worse: the rejected Promise is still truthy, so the tweet was kept as a match and the rejection became an unhandled promise rejection instead of surfacing to the caller.\n\n# The fix\n\nAdd the `await`, mirroring `getTweetWhere`. Behaviour is unchanged for synchronous predicates.\n\nReverting only that keyword, with the new tests in place, fails exactly three:\n\n```\n× awaits an ASYNC predicate instead of keeping everything\n× honours an async predicate that rejects everything\n× propagates a rejected predicate rather than dropping the tweet\n\nTests  3 failed | 19 passed\n```\n\n# Tests\n\n`tweets-query.test.ts`, 23 tests, no network — every case drives an in-memory async iterable. None of these functions had any.\n\n**`nextTimelinePageCursor`** is the guard that stops a repeating provider cursor from looping forever. Covered: a terminal `undefined` and a terminal `\"\"` (falsy, so it must not be recorded and then re-reported as a repeat on the next page); an immediate repeat; and the **A → B → A cycle**, which a naive \"same as last cursor\" check would miss and which loops just as permanently. Also that the error carries `source` and `pageCount` for diagnosis, and that two concurrent runs stay independent through their own `Set`.\n\n**The query helpers**: partial-object matching across multiple keys, sync predicates, async predicates, empty-array vs `null` on no match, stream order preserved, and that `getTweetWhere` **stops consuming the stream** once it has a match (asserted by counting what the generator produced, not by inspecting the result).\n\nTwo behaviours pinned as decisions rather than accidents:\n\n- **`checkTweetMatches` compares strictly.** `\"0\" == 0` is true, so a `==` would let a numeric id from a caller match a string id from the API and silently widen the filter.\n- **An empty query object matches everything**, because `Object.keys({}).every(...)` is vacuously true.\n\n# Mutation testing: 12 mutants, 11 killed\n\nKilled: the `await` removed (and separately removed from `getTweetWhere`), the terminal-cursor guard removed and narrowed to `undefined`-only, the repeat guard removed, the cursor recorded before the guard rather than after, `pageCount` dropped from the error context, `every` → `some`, `===` → `==`, `null` → `undefined` on no match, and `getTweetWhere` collecting all matches instead of returning at the first.\n\n**One survivor, and it is provably equivalent.** Re-adding the refused cursor to `seenCursors` before throwing cannot be detected: the only way to reach that throw is for the cursor to *already* be in the Set, so the add is a no-op. No test can distinguish it.\n\n# Recorded, not changed\n\n`getLatestTweet(user, includeRetweets, max, auth)` passes the flag straight through as `{ isRetweet: includeRetweets }`. So `includeRetweets: true` selects **only retweets** rather than \"retweets as well\", and the `max === 1` shortcut returns the first tweet ignoring the flag entirely. That reads like a naming/semantics mismatch, but changing it would alter what existing callers get back — your call, not mine, so I left it alone and didn't write a test that would freeze it either way.\n\n# Evidence\n\n```\nbunx vitest run src/client/tweets-query.test.ts   → 23 pass\nbunx vitest run src/                              → 426 pass, 13 skipped across 43 files\nbunx tsc --noEmit                                 → clean\nbunx @biomejs/biome check                         → clean\n```\n\nCompute receipt: 0 project-attributed tokens (unavailable; device-signed, locally reported)\nAI provider/model: anthropic / claude-opus-5\nClient / agent tooling: claude-code\nContribution skill revision: SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\nAttribution status: self-reported\n— [claude-code-eliza]\n\u003c!-- slop-contribution-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5\",\"client\":\"claude-code\",\"skill_revision\":\"SlopDotCash/slopdotcash@2744eb9bd27513b5c5081b61cf5d17494a583061:skills/contribute-to-eliza\",\"run\":{\"schema_version\":\"2\",\"run_id\":\"run_01M1MT089DNJYKBYGCQEXBN9BD\",\"project\":\"eliza\",\"repository\":\"elizaOS/eliza\",\"started_at\":\"2026-09-03T23:34:57.069Z\",\"completed_at\":\"2026-09-03T23:35:35.113Z\",\"skill_sha256\":\"2113430280ffe23a076bfd6a215e2547964a82f5f01779584fc6f1e4892e8809\",\"policy_acknowledgement\":{\"policy_revision\":\"2026-08-18.1\",\"license_sha256\":\"d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d\",\"inbound_terms_sha256\":\"15fdc92698fd2fdffef86bfd629f65bc588f02983fb9535bba0a5172d4569469\",\"prize_rules_sha256\":null,\"acknowledged_at\":\"2026-09-03T23:34:57.759Z\"},\"usage\":{\"source\":\"ccusage-session-v20\",\"confidence\":\"unavailable\",\"input_tokens\":0,\"output_tokens\":0,\"cache_creation_tokens\":0,\"cache_read_tokens\":0,\"total_tokens\":0,\"cost_micro_usd\":\"0\",\"session_count\":0},\"trajectory_sha256\":\"a6df46b9336f5187b78a039155eaf606d7674e54136518bab6e88efb1c54eb ate\n- `advanceWorldMetadataRevision` — invalid / exhausted / no-mutation\n- `getWorldMetadataRevision` — absent-default-0, fail-closed on malformed\n- `appendWorldMetadataRoleAudit` — init, append, deep-clone, no aliasing\n- `worldMetadataValueEquals` — jsonb semantics (key order irrelevant, `undefined` absent, strict types)\n- `initializeWorldMetadataRevision` — normalizes to 0\n\n## Verification\nScratch Vitest sandbox against the **real** source: **26/26 pass**.\nSabotage-run proves the tests are load-bearing (each mutation breaks the suite):\n- removing the stale-write guard → **1 test fails**\n- removing the `leftKeys.length` equality check → **1 test fails**\n- weakening the malformed-revision fail-closed → **3 tests fail**\n\nBiome `check` clean (lint gate passed).\n\n## Risks / Known gaps\n- No DB/IO integration test (these are pure-value helpers; the adapter wiring in\n  `inMemoryAdapter.ts` is not exercised here).\n- Vitest run in a scratch sandbox; full `bun run --cwd packages/core test` CI is\n  the authoritative gate and hasn't been run on this host (bun unavailable).\n\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"nvidia\",\"model\":\"deepseek-ai/deepseek-v4-flash-0731\",\"client\":\"Hermes Agent\",\"skill_revision\":\"local:slop-eliza/skills/slop-cash-contribute\"} --\u003e"])</script><script>self.__next_f.push([1,"69:T26c0,"])</script><script>self.__next_f.push([1,"# Relates to\n\nCloses #28952\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop` with zero conflicts.\n- [x] `bun install` was run after sync; focused package gates pass (see Known gaps for the repo-wide `verify` note).\n- [x] A reviewer can confirm the change works from the failing-before / passing-after test evidence below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop` (`3763af0215`); zero conflicts.\n- [x] Focused package `test` + `typecheck` + `lint:check` pass post-sync. Repo-wide `bun run verify` not run — see **Known gaps**.\n\n# Risks\n\nLow. The change is confined to one browser file (`plugins/plugin-native-screencapture/src/web.ts`) in a Capacitor plugin. It adds a synchronous re-entrancy latch and a `finally` around the existing `startRecording` setup body; no public API, type, or option shape changes. The existing J2 rollback path is preserved. All 22 pre-existing unit tests still pass unchanged.\n\n# Background\n\n## What does this PR do?\n\n`ScreenCaptureWeb.startRecording()` guards against concurrent recording with `if (this.isRecording) throw new Error(\"Recording already in progress\")`, but `this.isRecording` was only set to `true` **after** the first `await getDisplayMedia(...)`. Two concurrent invocations (or a rapid double-click through the public plugin API) both cleared the guard, both opened the OS screen-share picker, and both acquired display `MediaStream`s. The second call overwrote `this.mediaStream`, orphaning the first stream:\n\n- The first stream's tracks were never `.stop()`'d, so the OS \"you are sharing your screen\" indicator stayed lit and capture kept running until GC — a resource and privacy leak.\n- Both `MediaRecorder`s targeted the shared `this.recordedChunks` buffer, so the orphaned first recorder could corrupt the second recording's data.\n\nThe guard's explicit intent to serialize recording was defeated. Prior fleet fixes (#22036 mic-denied leak, #22361 pause-duration) hardened this file but left the entry race unaddressed.\n\n**Fix:** latch a synchronous `starting` flag at the very top of `startRecording`, before any `await`, and clear it in a `finally` that wraps the whole setup body. The guard now checks `this.isRecording || this.starting`, closing the in-flight window. On success `isRecording` is `true` and keeps guarding; on the option-validation throw or the existing J2 rollback rethrow, `isRecording` is back to `false` and the `finally` releases the latch so a subsequent legitimate start still works.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes a resource/privacy leak and data-corruption race).\n\n# Documentation changes needed?\n\nNo. Behavior of the public `startRecording` contract is unchanged for correct single-call usage; only the previously-undefined concurrent-call behavior is now the documented \"Recording already in progress\" rejection the guard always intended.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-native-screencapture/src/web.test.ts` — two new tests exercise the real `startRecording` contract through the existing fake `getDisplayMedia` / `MediaRecorder` / track doubles (no real browser APIs):\n\n1. **Two concurrent `startRecording()` calls** — asserts exactly one rejects with `/already in progress/`, `getDisplayMedia` is called exactly once, only one `MediaRecorder` is constructed, and the single acquired track is not orphaned (not stopped while recording, then stopped on `stopRecording`).\n2. **Latch clears after a failed start** — a mic-denied failure runs the J2 rollback; a subsequent `startRecording()` must succeed (proving the `finally` released the `starting` latch rather than wedging the plugin).\n\n## Detailed testing steps\n\n```bash\nbun install --minimum-release-age=0   # global bunfig sets a 7-day min release age; override for CI parity\nbun run --cwd plugins/plugin-native-screencapture test        # 24 passed (22 existing + 2 new)\nbun run --cwd plugins/plugin-native-screencapture typecheck   # clean\nbun run --cwd plugins/plugin-native-screencapture lint:check  # clean\n```\n\n**Failing-before proof:** running only the fix in `web.ts` reverted (tests present), the concurrent-start test fails with `expected [] to have a length of 1 but got +0` — i.e. **zero** rejections and **both** calls acquired a display stream. With the fix, `getDisplayMedia` call count drops 2 → 1 and the second call rejects. See inline logs below.\n  rely on, but none of its four exported functions has a direct test. This PR adds a colocated, deterministic suite pinning those contracts. No production code changes.\n\n## Why this contract matters (shipped consumers)\n\n- **`validateQueryEntitiesPagination` / `validateTaskQueryPagination`** are the only rejection path for malformed `limit`/`offset` input at `AgentRuntime.queryEntities` / `AgentRuntime.getTasks` (`runtime.ts`), `InMemoryDatabaseAdapter`, `plugin-sql/src/base.ts`, and `plugin-inmemorydb/adapter.ts`. A regression would let garbage pagination through to every adapter.\n- **`compareMemoryIds`** drives keyset cursor decisions in the agent memory browse API (`packages/agent/src/api/memory-routes.ts`, `/api/memory`), the iOS capacitor bridge, and in-memory adapter ordering. It matches PostgreSQL `uuid` ordering (case-normalized) — a regression here silently skips or repeats rows at keyset boundaries.\n- **`compareTasksForQuery`** is the sort behind every `InMemoryDatabaseAdapter.getTasks` and `plugin-inmemorydb` result (`(created_at, id)` ascending, undefined-last).\n\nNo test file anywhere imports `validateTaskQueryPagination`, `validateQueryEntitiesPagination`, or `compareTasksForQuery` today; `compareMemoryIds` is only used as a harness helper in the browse-pagination route test, never asserted directly.\n\n## What the tests pin\n\n- **Validators (8 tests):** accept `undefined`/`0`, throw a boundary-prefixed `RangeError` (`queryEntities`/`getTasks`) on negative, fractional, `NaN`, `Infinity`, and non-integer values — and do not confuse the two boundaries.\n- **`compareMemoryIds` (4 tests):** PostgreSQL-uuid order in both directions, mixed-case forms of the same id equal, ordering across the case boundary, reflexivity/antisymmetry.\n- **`compareTasksForQuery` (4 tests):** earlier `createdAt` first, id tie-break, undefined `createdAt` last, case-normalized id tie-break.\n\n## Validation\n\n- `vitest run packages/core/src/database.pagination-contract.tes ),\n);\n```\n\nThe `conversation-updated` payload reaches this sort through an unchecked `data.conversation as Conversation` cast, so a malformed `updatedAt` arrives as-is. `new Date(\"\").getTime()` is `NaN`, and a comparator that returns `NaN` leaves `Array.sort`'s ordering **undefined** — not merely wrong. In practice the invalid conversation pins to the top of the sidebar, above conversations the user just received messages in, and sending new messages does not dislodge it because comparisons against it never resolve. The issue's executed reproduction shows valid neighbours (`updated`, `older`) also displaced relative to each other.\n\nBoth sites now share one total comparator:\n\n```ts\nfunction byUpdatedAtDesc(left: Conversation, right: Conversation): number {\n  const leftUpdatedAt = Date.parse(left.updatedAt);\n  const rightUpdatedAt = Date.parse(right.updatedAt);\n  if (!Number.isFinite(leftUpdatedAt)) {\n    if (Number.isFinite(rightUpdatedAt)) return 1;\n    return left.id \u003c right.id ? -1 : left.id \u003e right.id ? 1 : 0;\n  }\n  if (!Number.isFinite(rightUpdatedAt)) return -1;\n  return rightUpdatedAt - leftUpdatedAt;\n}\n```\n\nUnparseable stamps sort last; two unparseable stamps tie-break on `id` so the result is deterministic rather than traversal-dependent (a hardening beyond the issue's sketch, which returned `0` there); valid pairs keep newest-first. `Number.isFinite` rather than `isNaN`, because an `Infinity` stamp degenerates the ordering identically.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nNo.\n\n# Testing\n\n## Where should a reviewer start?\n\n`startup-phase-hydrate.conversation-sort.test.ts`. It drives the **real exported `bindReadyPhase`** through its registered WebSocket handlers — the comparator is never re-implemented in the test — and asserts the *valid* conversations reach their true positions, per the issue's acceptance criteria.\n\n## Detaile nge is one shared comparator replacing two inline ones.\n\n# Risks\n\nLow and strictly narrowing. Every conversation whose `updatedAt` parses keeps exactly its current position relative to other valid conversations. Only entries that previously produced `NaN` change placement, and they move to the end instead of corrupting the ordering of everything else.\n\n# Background\n\n## What does this PR do?\n\n`bindReadyPhase` re-sorts the conversation list in two WebSocket handlers, and both compared `updatedAt` by bare subtraction:\n\n```ts\n// line 922, \"proactive-message\"\n// line 955, \"conversation-updated\"\nu.sort(\n  (a, b) =\u003e new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime(),\n);\n```\n\n`new Date(\"\").getTime()` is `NaN`, and `NaN - x` is `NaN`. A comparator returning `NaN` is neither negative, zero, nor positive, so the ordering contract is not merely wrong — it is **undefined**. The surviving order depends on the engine's traversal, and conversations that are themselves valid move relative to one another because of a neighbour they were never meaningfully compared against.\n\n**The user-visible result.** This list is the app's sidebar, rendered in the order the sort produces. One conversation with an unparseable `updatedAt` pins itself to the top and stays there, above conversations the user just received a message in. Sending a new message does not dislodge it, because the comparison against it never resolves.\n\n**Reachability.** Both sites are bound to live WebSocket events inside the real exported `bindReadyPhase`. The `conversation-updated` handler takes its payload straight off the wire with an unchecked cast:\n\n```ts\nconst conv = data.conversation as Conversation;\n```\n\nNothing validates `updatedAt` between the wire and the comparator.\n\n## What is the fix?\n\nOne comparator, shared by both sites so they cannot drift, following the convention this repository already uses for exactly this hazard:\n\n```ts\nfunction compareConversationsByRecency(\n  left: Conversation,\n  right: Conversation,\n): number {\n  const leftUpdatedAt = new Date(left.updatedAt).getTime();\n  const rightUpdatedAt = new Date(right.updatedAt).getTime();\n  const safeLeft = Number.isFinite(leftUpdatedAt) ? leftUpdatedAt : 0;\n  const safeRight = Number.isFinite(rightUpdatedAt) ? rightUpdatedAt : 0;\n  return safeRight - safeLeft || left.id.localeCompare(right.id);\n}\n```\n\n**This is not a new convention.** Two existing modules already resolve non-finite timestamps to epoch `0` and then tie-break on id:\n\n- `packages/ui/src/state/bounded-view-lru.ts` — `const safeAt = Number.isFinite(at) ? at : 0; ... return a \u003c b ? -1 : a \u003e b ? 1 : 0;`, with dedicated coverage in `bounded-view-lru.safe-sort.test.ts`.\n- `packages/agent/src/api/conversation-sort.ts` — `compareConversationsByRecency`, whose header states that `updatedAt` reaches it \"from persisted rows and untrusted `PATCH` payloads, so a malformed `updatedAt` string ... can produce `NaN`\".\n\nMatching them rather than inventing a third semantic is deliberate. The `id` tie-break is the part a \"just avoid `NaN`\" fix would miss: two conversations sharing a timestamp previously depended on sort stability for their order, and the third test below pins that.\n\nExtracting the comparator rather than fixing each site inline is also deliberate — the defect was already duplicated once in this file, and a shared comparator is what stops it being duplicated again.\n\n# Documentation changes needed?\n\nNo. No public surface, export, setting, or documented behaviour changes.\n\n# Testing\n\n## Where should a reviewer start?\n\nThe mutation block. Both tests drive the real exported `bindReadyPhase` through the WebSocket handlers it actually registers — no re-implemented comparator in the test body — and they cover **both** defective sites.\n\n## Detailed testing steps\n\n| Gate | Result |\n| --- | --- |\n| `startup-phase-hydrate.conversation-order.test.ts` | **3 passed** |\n| `src/state/startup-phase` (16 suites) | **108 tests passed, 0 failed** |\n| `biome check` (repository-pinned 2.5.8) | `No fixes applied.` |\n| production diff vs `develop` | `+23/-8` — one shared comparator replacing two inline ones |\n\nMutation resistance — running the new tests against **develop's own unpatched file**:\n\n```\n× keeps a conversation with an unparseable updatedAt from pinning itself above a newly updated one\n  AssertionError: expected [ 'invalid', 'updated', 'older' ] to deeply equal [ 'updated', 'older', 'invalid' ]\n\n× moves the conversation a proactive message arrived in to the top past an unparseable updatedAt\n  AssertionError: expected [ 'invalid', 'target', 'newest' ] to deeply equal [ 'target', 'newest', 'invalid' ]\n\n× breaks a tie on id so equal updatedAt values keep a deterministic order\n  AssertionError: expected [ 'b-conv', 'a-conv' ] to deeply equal [ 'a-conv', 'b-conv' ]\n\n Tests  3 failed (3)\n```\n\nThe invalid entry holds first place in the first two cases. In the first, `updated` and `older` are displaced too — which is the point: the malformed entry does not merely land in the wrong place, it disturbs entries that are themselves perfectly valid.\n\n**Pre-existing failures, stated plainly.** In the `src/state/startup-phase` run, 10 of 16 test *files* fail to import with `Failed to resolve import \"@elizaos/capacitor-secure-store\" from \"src/bridge/storage-bridge.ts\"`. That is a local workspace-build artifact, not a behavioural failure: **zero tests fail**, and the identical run against develop's unpatched file fails **11** files. The one-file delta is exactly this PR's new suite, which fails without the fix and passes with it.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:c8f70b3ccc97c44ab8d330eb8bbc69b8d7c9b116 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] Before screenshots `N/A - the observable artifact is the conversation array order, asserted directly against the real bindReadyPhase os/eliza\",\"createdAt\":\"2026-08-29T07:30:19Z\",\"mergedAt\":null,\"additions\":378,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABCIMsOw\",\"title\":\"test(app-core): pin the remote-target resume authority decision\",\"author\":\"attentionhead\",\"number\":30479,\"body\":\"$59\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-03T23:28:09Z\",\"mergedAt\":null,\"additions\":372,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABBffwIA\",\"title\":\"fix(cloud): prove exact server absence after Hetzner DELETE 204\",\"author\":\"mtcow\",\"number\":30069,\"body\":\"## Summary\\nHetzner documents `DELETE /servers/{id}` as returning HTTP 204. The client accepted 204 as plain success without proving the exact target is gone, so a still-present server (e.g. deletion raced by a recreate) was reported deleted (#30017).\\n\\n## Fix\\nAfter `DELETE` (204), perform an exact by-id `GET` readback:\\n- **404** → deletion confirmed, report success;\\n- **server still present** → fail closed (`server_still_exists`, 409);\\n- **readback transport failure** → propagate.\\n\\n## Verification\\nMock-request harness across 3 cases: 204+404 success, 204+still-present rejection, 204+readback error propagation — all pass.\\n\\nCloses #30017.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-30T08:39:42Z\",\"mergedAt\":null,\"additions\":353,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs8AAAABA4AoOw\",\"title\":\"fix(cloud): stub browser-workspace routes on shared agents to avoid 404 error banner\",\"author\":\"odilitime\",\"number\":28072,\"body\":\"$5a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-25T01:18:47Z\",\"mergedAt\":null,\"additions\":322,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABBZGXYw\",\"title\":\"fix(core): preserve deterministic scenario envelope boundaries\",\"author\":\"NubsCarson\",\"number\":29794,\"body\":\"$5b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-08-28T22:04:31Z\",\"mergedAt\":null,\"additions\":321,\"deletions\":18},{\"id\":\"
