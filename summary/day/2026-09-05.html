n credits at lines 393–403. The active Shared caller returns exactly this platform variant at shared-runtime-chat.ts568. This is correct present platform-funding behavior, but the proposed “supply admission” step is incomplete for a durable free allowance: a reserve-only callback has no guaranteed lifecycle hooks for settle/release/unknown acceptance.\n\nAmend Step 3/4 with a separate unit-admission lifecycle composed into the canonical executor, or extend the platform variant with an explicit quota admission whose units and semantics cannot be confused with USD credit settlement. Wire before-dispatch receipt, successful consumption, confirmed no-dispatch release and uncertain-provider reconciliation through every exit, including artifact persistence and safety failures. Preserve the invariant that platform images never debit organization purchased credits. Do not relabel free work as `organization` merely to activate existing money hooks.\n\nThe existing image tests at lines 146–160 already assert platform funding makes no organization settlement; other tests cover organization dispatch-receipt failure and unknown settlement. Extend those real executor-boundary cases with actual quota persistence and independent account-credit readback. Keep commit-before-return behavior: billing reconciliation failure after committed artifact must not advertise generation failure and invite regeneration. Public proof needs the provider artifact and quota receipt, not just a callback counter.\n\n### P1 reliability requirement — Turn replay is useful but insufficient as durable media-operation identity\n\n[The actual coordinator](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/cloud/api/src/shared-runtime-conversation.ts#L1115) replays completed same-key turns and reclaims matching pending turns for re-execution. It passes this store to active chat handling. [Chat](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/cloud/shared/src/lib/services/shared-runtime/shared-runtime-chat.ts#L1367) checks replay before admission/provider work; streaming does the same at 1587. This disconfirms any blanket assertion that ordinary retries always regenerate media.\n\nHowever, [the claim store retention](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/cloud/api/src/shared-runtime-conversation.ts#L267) keeps at most 32 claims and applies a 256,000-byte aggregate budget; its source explicitly says eviction becomes fresh execution. Pending claims have no terminal result and are intentionally retried. Meanwhile image operation identity uses turn key plus action ordinal (shared-runtime-chat.ts416–420,556), video identity is constructed after dispatch (486–489), and the current platform branch has no operation-level replay lookup. Thus neither successful short-window turn replay nor deterministic billing identities proves exactly-once media dispatch across a crash before turn completion, changed action sequence on recovery, or replay beyond retention. This is a source-derived lifecycle risk, not a demonstrated live duplicate provider charge.\n\nSafe executable evidence: under pinned Bun 1.3.14, extracted and transpiled the **actual** pure `boundTurnClaims` function in memory and supplied 33 distinct completed claims. Result: `{input:33,retained:32,firstClaimRetained:false,lastClaimRetained:true}`. No repository module was edited, no provider called, and this establishes retention behavior only. The real claim caller above establishes what absence means.\n\nAmend the durable media operation key to include stable logical action identity plus canonical request digest, bound to actor/account/period as appropriate. Do not rely on a rerun planner reproducing ordinal N with identical arguments. Same operation/digest replays the existing artifact/receipt; mismatched replay conflicts; pending/unknown provider acceptance reconciles without blind redispatch. Keep this operation record under the existing billing/domain authority independently of the short turn-result cache. Do not solve identity retention by truncating or summarizing conversation/model context.\n\nAcceptance adds crash after provider acceptance but before generation-row/turn completion, completed-turn normal replay, evicted-turn replay, changed planned action ordering/arguments, and delivery retry after artifact creation. Assert one logical consumption and no purchased-credit debit; assert actual provider dispatch/receipt counts where the provider contract supports them. A valid duplicate-delivery suppression result alone is not duplicate-generation proof.\n\n### Scrutinized dependencies and execution limits\n\n- #25146 fallback must remain an isolated interval: no Dedicated memories/files or paid-only resource access during Shared, with authorized interval handback on recovery. #30688 supplies free Calendar/Notes ports. These free CRUD/draft operations and billing/system/recovery messages must not inherit the paid workflow gate or disappear when media quota is exhausted.\n- #30638 supplies subscriber account authority; #23094 supplies the common entitlement/admission decision. Merchant organization balance and provider configuration are not subscriber quota authority. Free units, duration/resolution weighting, reset/carryover and unknown-provider consumption remain product decisions; this review does not invent them.\n- The focused canonical image test command could not load its harness: `bun test packages/cloud/shared/src/lib/services/image-generation.test.ts` stopped on missing `hono/http-exception` before assertions. This is an unavailable dependency, not a failed source behavior test. No install/build was performed. The retention probe above executed successfully and is reported separately; neither constitutes live image/video acceptance.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n"])</script><script>self.__next_f.push([1,"18:T40ba,"])</script><script>self.__next_f.push([1,"## Missing capability\nRead-only source review found Shared runtime injects media/reminders/todos but no Calendar or Notes operation; its capability catalog and wall explicitly require a personal workspace for these DB/API-only features. No live regression is claimed.\n\n## Scope\nChild of #20615 and #23111. Add edge-compatible ports calling canonical Calendar/Notes domain operations and records; project truthful capability and view state from actual connected services. Calendar CRUD remains available on the free tier without a Dedicated runtime. Preserve existing free todo/checklist records; persistent workflow/task execution and coding are separate paid capabilities.\n\n## Acceptance\n- Free account creates, reads, updates and deletes Calendar/Notes records from normal app chat and the view sees the same backing state; no Dedicated provisioning.\n- Real account authorization, idempotent replay, disconnected OAuth, time zones/DST, empty/error, recurrence and concurrent editing exercise the owning boundaries.\n- Media quota exhaustion does not disable Calendar CRUD.\n- Secure reconnect remains secure link-out; unavailable account is not described as paid-workspace requirement.\n- Live model trajectories, inspected domain records and desktop/mobile evidence prove actual behavior; owning package and root gates pass.\n\n## Plan\n4–6 person-days; Shaw proposed lead, preserve existing parent assignees. Dependencies: canonical operation mapping and entitlement contract. No deployment or production mutation included in this issue draft.\n\nReview all registered actions against edge compatibility, required privileges and storage/compute needs; preserve current web search, media and free todo capabilities and enable additional safe DB/API operations through existing canonical ports where supported. Calendar and Notes are the confirmed first missing ports; other concrete gaps remain in #20615 with estimates rather than disappearing from the scope. “Basically free forever” means no subscription prerequisite for core Calendar/Notes CRUD, with transparent baseline service/abuse limits rather than an unlimited-resource promise. System billing notices remain available regardless of paid task execution eligibility.\n\n\nProject 19 Sprint 3 (October 3–16, 2026) **scope candidate**, not a capacity-committed completion date. Estimated effort includes focused implementation and evidence; research did not execute live billing, connector messages or product scenarios. See the project README for prioritization and over-capacity scope.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n## Current-source audit and implementation plan — 2026-09-06\n\nBaseline: `8fea4f94c29c7712ce3caf303e3350150622d048`. The missing Shared Calendar/Notes capability is confirmed by source; no hosted account or live-model CRUD run was performed.\n\n### Existing owners and verified gaps\n\n- [Shared execution authority](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/run-shared-agent-turn.ts#L174-L201) injects trusted channel/account context, Todos store, reminder runner, push and media ports. Calendar/Notes ports are absent. [Plugin assembly](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/shared-eliza-runtime.ts#L269-L318) derives capability flags from injected plugins and enables those actions; extend this owner rather than construct a second runtime.\n- [The capability catalog](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/shared-capability-catalog.ts#L96-L139) puts Calendar and persistent Notes in PERSONAL_CAPABILITIES, later projected as needs_workspace/requiredTier personal. The capability wall also denies both as absent. Adding action implementations without changing both projections would leave contradictory upgrade/refusal behavior.\n- [Shared Todos already uses the canonical plugin SQL store](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/shared-todos.ts#L1-L50) with server-derived stable storage scope and a durable cutover mutation ledger. This is a useful boundary pattern, not a reason to fork Todo records or reuse a user's raw logical identity as a SQL tenant key.\n- Notes is **not currently a DB-only service**. [NotesStore](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-notes/src/store.ts#L1-L75) persists an agent-scoped JSON document through Node filesystem APIs and an in-process write barrier. NotesService owns validation, lookup, mutations and committed snapshots; it imports that concrete store. Directly importing the full Notes plugin into Workerd is not the missing-port fix. An edge-safe operation/storage boundary or authenticated canonical API is required, preserving existing local state.\n- [CalendarService](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-calendar/src/service/CalendarService.ts#L1-L90) owns local/Google/Microsoft/Apple/ICS operations and imports native/provider integration surfaces. CalendarRepository owns app_calendar SQL. The full plugin is not demonstrated edge-compatible merely because its records use SQL. Preserve local free Calendar CRUD separately from optional connected-account/native capabilities.\n- The current public plugin manifests do not expose Calendar/Notes edge entrypoints analogous to Todos. Existing Shared edge/Miniflare tests exercise the current injected capabilities, not these missing ports.\n\n### Detailed implementation sequence\n\n1. **Pin the canonical user-visible records and caller path.** Trace normal app-chat authority through shared-runtime-chat into execution ports and the actual Calendar/Notes view APIs. Define one server-resolved account/agent scope used by both. Prove a free account has no Dedicated runtime and reproduce the current upgrade/refusal for a safe create/read request. Record actual storage location, not only model wording.\n2. **Choose narrow edge ports at the domain owner.** Extract or expose storage-neutral Calendar/Notes operations with typed request/result/error and injected persistence/connector authority. Preserve NotesService validation, lookup ambiguity, revision/clear semantics and committed snapshots; retain its filesystem adapter for existing local agents. Add an authenticated API adapter only if it invokes the same canonical operations without provisioning Dedicated. Do not add independent Cloud CRUD logic, a parallel note schema with divergent semantics, or duplicate Calendar provider clients.\n3. **Implement durable Shared adapters.** Bind request-scoped Cloud DB/API access using trusted tenant/account identity, with migrations and transactional concurrency where needed. An in-process JSON write barrier is insufficient across Workers. Persist operation idempotency and conflict/version checks; duplicate request replay must return the same outcome without duplicating notes/events. Define retry after ambiguous transport failure and deletion tombstone/cutover behavior so tier changes/restarts cannot resurrect deleted records. Existing local Notes documents remain intact; any storage migration needs explicit compatibility/readback proof.\n4. **Wire actual injected capability and entitlement state.** Add ports to RunSharedAgentTurnInput, edge plugin assembly and request-scoped hosting setup. Derive available/unavailable/needs-connection from the service actually injected. Remove Calendar/Notes from unconditional personal-workspace routing when their free canonical port exists, and update capability wall/handoff/provider/UI consistently. A disconnected optional provider must offer secure reconnect, not an upgrade to a workspace. Do not weaken paid workflow/coding eligibility or existing free Todos/reminders.\n5. **Isolate resource policy.** Calendar/Notes core CRUD has no subscription or Dedicated prerequisite. Media credits/quota and paid execution are separate decisions. Preserve transparent storage/abuse limits as explicit typed limits; do not fabricate unlimited resources or route quota failures to paid provisioning. System billing notices must remain deliverable independently of paid task execution. Prove model/media failure cannot silently disable already-available CRUD capabilities.\n6. **Connect views to the same records.** Use the canonical view/API client contracts and notifications/refresh mechanism for Shared scope. A chat write followed by view read and a view write followed by chat read must see the same committed revision/entity. Keep cross-account and group-room access denied through trusted authority, including forged IDs and changed membership. Join #25146 explicitly: classify record ownership/provenance so eligible free Calendar/Notes records remain available, while no Shared API adapter, view lookup or chat provider can expose Dedicated-only records, protected memory, pre-upgrade archives or restored pointers during fallback. A common schema or account link does not grant cross-tier access. Test fallback denial for Dedicated-only records alongside uninterrupted access to eligible free records, including Notes storage migration and recovery. Secrets/OAuth tokens stay outside ordinary chat/voice.\n7. **Preserve Calendar semantics.** Exercise built-in free events without OAuth; separately enable provider-backed operations only with valid account scope. Reuse existing timezone/all-day/recurrence and this-event/series/this-and-following behavior, source conflict and durable mutation receipts. Handle disconnected OAuth and native Apple calendars as capability availability boundaries, not generic DB success. Do not move all recurrence/provider logic into a Worker wrapper.\n8. **Reconcile the parent capability inventory.** Enumerate actual registered actions against edge import compatibility, storage, privilege and compute requirements. Keep Calendar/Notes as this issue's delivered first ports; document other concrete API-only opportunities and remaining paid/native boundaries under #20615 with estimates. Re-estimate the 4–6 days if Notes persistence extraction or multi-target record migration expands beyond the port slice.\n\n### Behavioral validation and evidence\n\n- In a real Workerd/Miniflare request environment with real persistent storage, execute create/read/update/delete via normal action planning and the view API; restart the worker and read back committed records. A Node-only unit test cannot certify edge import/runtime compatibility.\n- Verify free account/no Dedicated, media exhaustion, paid task denial, free Todo preservation, disconnected/reconnected provider, unavailable DB, duplicate replay, concurrent editing, cross-tenant/group denial, stale revision, cancellation and ambiguous transport retry. For Notes include ambiguous title deletion/clear revision; for Calendar include DST, all-day boundaries, recurring edit scope and provider partial failure.\n- Run affected plugin/Cloud shared/API tests, typecheck/lint, edge bundle/import checks, relevant Miniflare tests and root verify. Migrations need actual before/after row readbacks and restart/cutover preservation, not schema introspection tests.\n- Capture live free-account chat/model inputs/outputs, effect receipts and actual Notes/Calendar records with matching desktop/mobile views, MP4 and frontend/backend logs in a verified evidence bundle. Run app audit for shared UI changes. Keep native/provider acceptance separately blocked until its supported account/device is exercised; no deployment or production mutation is included in this planning audit.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent adversarial review — Shared Calendar/Notes\n\nBaseline `b676280384b15df54204276e34bb8740db26936f`; live issue, Notes guide/README, store, CRUD/action and earlier plan read. No hosted CRUD or storage migration executed.\n\n### P1 — Content deduplication is not a cross-tier migration identity\n\n[Notes create](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-notes/src/service.ts#L283) defines replay by noteContentKey rather than operation identity. [Update](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-notes/src/service.ts#L339) removes other records matching either the previous or resulting content key and returns consolidated IDs. The existing single-agent store intentionally owns this behavior. A Shared migration which merges eligible free notes with Dedicated-derived notes, then reuses that content key, can collapse records with distinct provenance/retention authority. Identical text is not proof of identical authority or original identity.\n\nAmendment: define ownership/provenance filtering before lookup, deduplication, mutation and rendering; never let a common content key cross that boundary. Preserve original record IDs plus migration identity mapping/tombstones; do not flatten protected Dedicated history into the eligible Free namespace. Make same-content semantics explicit within one authorized collection. Acceptance: identical content in eligible and ineligible stores; only eligible rows participate in Shared read/update/delete and cutover, protected rows stay unchanged, and restart/fallback does not resurrect or merge them. This is an unsafe-migration counterexample to prevent, not a demonstrated deployed cross-tier exposure. Detailed authorization remains server derived.\n\n### P2 — Replayed create is currently a new revision but its effect receipt says fresh\n\nThe store [transact](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-notes/src/store.ts#L202) always increments revision and writes, including createNoteWithCommit's content-replay branch. That branch suppresses the state-updated event. The action then exposes replayed in data, but [committed receipt](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-notes/src/action.ts#L87) hardcodes idempotency.key=null/replayed=false and uses a new timestamp receipt ID. Thus a replay can change clear-confirmation revision without notification and report inconsistent replay semantics to the planner/evidence system. These are source-proven current contracts; the intended content-idempotent behavior is already explicit in service code.\n\nAmendment: introduce durable request-key replay in the canonical operation result and return the original committed revision/receipt for exact replay. Define no-op content dedup distinctly from request replay. Store transactions need an explicit unchanged outcome if no revision should advance; any revision that does advance must be reflected consistently to clients. Feed the real operation result into effect receipts instead of regenerating fresh identity. Test duplicate requests before/after restart, concurrent create with same/different content, clear confirmation followed only by replay, and actual emitted snapshot/receipt parity. Retain the existing clear expectedRevision check inside the storage transaction; do not move it into an API precheck.\n\n### P2 — Update and deletion compatibility must survive storage extraction\n\nCurrent Notes update uses whole-content replacement and consolidation, not a field-merge/CAS patch contract. The previous plan's generic \"conflict/version checks\" needs a declared API migration: adding expectedRevision must not silently break existing view/action callers, and retaining unconditional last-writer-wins must not be advertised as conflict-safe. Introduce explicit versioned operation inputs or an adapter preserving old semantics; migrate UI and action callers together. Test concurrent view edit and chat edit against real persistent Shared storage, ambiguous lookup after another writer changes content, delete/retry, and lost response recovery.\n\nThis review does not duplicate the earlier Calendar provider/recurrence plan. Calendar source is still a separate domain owner; Notes extraction must not borrow its schema or scheduler. Existing OWNER gating protects the per-agent local store; a Shared port needs the server-resolved account identity because runtime/agent membership alone is not a storage tenancy contract.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n"])</script><script>self.__next_f.push([1,"19:T4aee,"])</script><script>self.__next_f.push([1,"## Problem and consumer outcome\n\nThe runtime can consume versioned optimized prompts through `OptimizedPromptService`, including view-context and LifeOps consumers, but the producer paths cited by historical GEPA work are absent from this checkout: `plugins/plugin-training` contains assets without a manifest or optimizer source. A developer currently cannot rely on those historical commands to produce and validate a new Qwen 3.8 artifact.\n\nDeliver one supported, reproducible path from complete dynamic runtime trajectories to a versioned candidate artifact, held-out evaluation, explicit promotion, runtime consumption, and rollback. The result should improve one concrete user behavior—prefer the view-context/action-selection decision once its registry and scenarios are ready—not merely optimize an isolated static prompt.\n\nThis is a producer-discovery/restoration and single-pilot issue. Historical #8795 is closed, and #9429, #9543 and #11901 are merged. Reuse their applicable design and locate any supported replacement before restoring or moving code. Planning has not executed GEPA or claimed a model-quality improvement.\n\n## Bounded delivery\n\n- Identify the current supported GEPA producer, dependencies and invocation. If it was removed with no replacement, restore the narrow producer seam in the current owning workspace; document the executable path and verify its manifest/exports instead of reviving a whole retired plugin.\n- Use the existing typed `OptimizedPromptService` artifact, version/MAC, refresh, and rollback contracts. Do not create a parallel artifact store or training subsystem.\n- Build an adapter for one selected task that runs the real runtime with varying user requests, view/catalog state and relevant provider context. Treat those dynamic values as complete immutable evaluation inputs; optimize only declared instruction/template/description parameters.\n- Bind target evaluation to Cerebras `qwen-3.8-27b`, recording exact endpoint/model configuration, provider-supported limits, dataset hashes, runtime revision, optimizer version/config and candidate lineage. The proposer model may differ but must be identified.\n- Split training, validation and untouched test cases by scenario family and entity/time variations. Feed evaluator scores and diagnostic failures into GEPA, then validate the selected candidate against the original baseline on the held-out real behavior.\n- Promote one candidate only if it demonstrates a measured benefit without violating hard behavior invariants. If no candidate qualifies within the pilot, deliver the working producer and truthful failure analysis while leaving the baseline active; do not fabricate optimization success.\n\n## Acceptance criteria\n\n- One documented command exercises the supported producer and writes a valid candidate artifact that the real target consumer loads; evidence shows the artifact was used in the actual model request.\n- Evaluation covers correct action/arguments and resulting view or persisted mutation receipts, plus ambiguity, unavailable capability and conversational failure behavior relevant to the chosen task. Action-name matching and mock success are gepa-ai.github.io/gepa/blog/2026/02/18/introducing-optimize-anything/\n- GEPA paper: https://arxiv.org/abs/2507.19457\n- Current Cerebras model catalog: https://inference-docs.cerebras.ai/models/overview\n- Current public model metadata: https://api.cerebras.ai/public/v1/models\n- Prompt caching: https://inference-docs.cerebras.ai/capabilities/prompt-caching — measure actual cache behavior; cached input remains billed at the standard input rate, so cache hits alone are not a monetary-savings claim.\n\n\n\u003c!-- guardian-sprints-2026-09 --\u003e\n## Project 19 sprint allocation — 2026-09-05\n\n[Guardian MVP](https://github.com/orgs/elizaOS/projects/19), Sprint 2; owner @lalalune; complexity **High**. Plan **3 person-days**, research range 3–5; scheduled **2026-09-29 → 2026-10-01**. Estimates include focused validation; no live tests or implementation completion are claimed by this planning update. Assignment is planning ownership, not an active-work claim.\n\nSee the scoped acceptance and evidence requirements above. Dependencies and capacity are recorded in the Project 19 README; longer estimates consume reserve or require re-planning, never skipped verification.\n\nLive action-selection prerequisite: #30683. Three days is the bounded pilot allocation; producer restoration may require the five-day high end, in which case promotion/rollout remains explicitly pending.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n## Critical implementation audit — 2026-09-06\n\nSource baseline: `8fea4f94c29c7712ce3caf303e3350150622d048`. This is producer/consumer discovery and implementation planning; no GEPA run, model improvement or promotion has occurred.\n\n### Current source findings\n\n- `plugins/plugin-training` contains an asset and no executable producer or package manifest in this checkout. Repository source search found GEPA consumer hooks and historical references, not a supported optimizer invocation. However, `packages/training` **does have a Python project**: [its manifest](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/training/pyproject.toml#L1) describes Eliza-1 fine-tuning and does not declare GEPA. Absence of package.json alone is not absence of a maintained training project. Its [locked-target guide](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/training/CLAUDE.md#L11) is specific to Eliza-1; do not repoint that training pipeline at Qwen or revive the retired plugin wholesale. Producer ownership must be settled explicitly.\n- [The artifact type](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/optimized-prompt.ts#L207) has task/prompt/baseline/scores/dataset/lineage and optional promotionDecision, but **no model/config binding fields**. [setPrompt](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/optimized-prompt.ts#L681) validates and activates a version; it is not a candidate-only staging call or a held-out promotion gate. The issue's desired provenance and gated promotion are additional work, not guarantees already supplied by the type. Reuse its MAC/version/refresh/rollback machinery.\n- [The suggested consumer](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/evaluators/view-context.ts#L145) is a post-turn contextual view evaluator, explicitly separate from direct VIEWS navigation. Its prompt appends user text to the optimized instruction; its schema enumerates CONTEXT_VIEWS and its eligibility uses an activity regex. It is not yet evidence of a complete dynamic view-registry/action-selection pilot. Changing prompt text cannot repair an unavailable view or a turn excluded before inference. Coordinate the actual consumer and dataset with #30683 and the view-registry owner.\n- [Few-shot rendering](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/optimized-prompt-resolver.ts#L67) extracts a tagged user section from recorded input, and demonstration injection does not render `example.input.system`. Complete dynamic trajectory records therefore cannot simply be placed in fewShotExamples and assumed to reach inference unchanged. For this instruction-only pilot, keep evaluation inputs external and complete; if demonstrations are needed, fix and prove their consumer serialization first.\n\n### Detailed bounded pilot plan\n\n1. **Choose one executable owner and pin dependencies.** Check current tracked manifests/entrypoints and the historical merged producer commits for a supported replacement. If none exists, add a narrow offline optimizer command in an agreed current workspace with a pinned GEPA dependency and documented interpreter/runtime bridge, without importing the Eliza-1 weight-training stack. Pin the chosen upstream API revision: [current optimize_anything documentation](https://gepa-ai.github.io/gepa/api/optimize_anything/optimize_anything/) provides candidate/evaluator, training/validation/test sets and explicit evaluation/token budgets. Do not implement an old signature from historical prose.\n2. **Specify the exact optimization target.** Pick contextual view inference only after its registry and scenarios are ready, or explicitly select another already executable consumer. Freeze complete user/context/catalog/history/tool inputs and optimize only the declared instruction field. Identify the real TEXT_SMALL/evaluator or planner model boundary actually consuming it; bind target evaluation to verified Cerebras `qwen-3.8-27b` endpoint/config and record proposer separately. Direct VIEWS selection and contextual evaluation are different tasks; don't report one as evidence for the other.\n3. **Build a reproducible runtime adapter.** Launch the real isolated runtime per evaluation case, inject only the candidate instruction and return score plus diagnostic trajectory/effect receipts. Hash complete immutable inputs; split by scenario family and entity/time variations before optimization. Include ambiguous requests, unavailable/unauthorized capabilities, no-navigation cases and misleading context. Keep the untouched test set unavailable to optimization/reflection. Explicitly reject unsupported complete inputs at the provider boundary instead of clipping them. Infrastructure/model errors are inconclusive experiment failures, not low behavior scores.\n4. **Separate candidate evaluation from activation.** Persist experiment candidates and lineage as evidence, not by calling production setPrompt. Evaluate baseline/candidate with the same seeds/cases/settings and predeclare hard invariants plus the selection criterion. Preserve complete raw metrics and account for held-out calls beyond the optimization budget. Report behavior first, then latency/token/cache results; no improvement is an acceptable measured outcome.\n5. **Add provenance and promotion binding.** Extend the canonical artifact contract additively, or agree an authenticated canonical provenance reference, for runtime/optimizer revisions, endpoint/model/settings, dataset hashes and evaluation/promotion identity. Enforce compatible target configuration when loading/consuming; define backward compatibility for older artifacts. Do not assume optional promotionDecision authorizes activation. After review of a qualifying report, activate through existing setPrompt/MAC/version handling; test a consumer model request for the exact selected artifact identity and full dynamic suffix.\n6. **Prove rollback and failure paths.** Verify baseline → candidate activation → refresh/restart consumption → rollback to original prompt in an actual consumer request. Cover invalid/mismatched artifacts, unavailable integrity key, malformed candidate, interrupted producer and non-qualifying evaluation while baseline remains active. Run core service/resolver tests plus producer and selected consumer tests/typecheck/lint/root verify. Inspect actual resulting view or persisted receipt and the canonical evidence bundle; app audit applies if UI changes.\n\nDependencies and capacity: #17072/#17030 provide complete comparable traces; #30683 and the selected registry provide valid behavior cases. Three days is the bounded pilot allocation, not a guaranteed producer restoration, model-binding migration and successful quality lift. If restoration or registry work consumes the five-day upper estimate, keep promotion/rollout pending explicitly. No all-action rollout, online user-prompt rewriting or broad model fine-tuning belongs in this issue.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent adversarial review — GEPA pilot\n\nBaseline `b676280384b15df54204276e34bb8740db26936f`; live issue and original plan read. No optimization/provider run or promotion performed.\n\n### P1 — Reproduced judge-input corruption must be fixed before measuring a lift\n\n[judgeTextWithLlm](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/scenario-runner/src/judge.ts#L107) builds its prompt with sequential String.replace calls using untrusted strings as replacement strings. A safe Bun1.3.14 probe loaded the actual JUDGE_PROMPT_TEMPLATE from source and executed the exact assembly expression (no model call):\n\n- Candidate `literal $\u0026 content` became `literal {candidate} content`; the complete original candidate was absent. JavaScript replacement metacharacters change data.\n- Rubric `must preserve {candidate} token` caused the candidate to be inserted into the rubric, leaving the actual candidate section as `{candidate}`. The second replacement matches newly inserted rubric content.\n\nThis is reproduced prompt-assembly behavior, not a full judge integration test. A GEPA adapter inheriting this evaluator can optimize scores for altered inputs. Amendment: construct labeled fields without sequential placeholder rescanning, with literal insertion (e.g. direct interpolation of separate immutable sections). Preserve complete candidate/rubric bytes. Add tests through the actual judge request boundary for `$\u0026`, `$'`, backticks, dollar-backtick replacement sequences, placeholder-looking text and Unicode; assert complete values reach the model in their intended sections. A callback replacement alone fixes dollar expansion but still leaves the nested-placeholder collision if replacements are sequential.\n\n### P1 — Parallel candidate evaluation requires process/side-effect isolation\n\n[Runtime factory](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/scenario-runner/src/runtime-factory.ts#L870) writes provider configuration and PGLITE_DATA_DIR into process.env during async setup; simulated mode disables the scheduler, provider-qualified mode does not inherit that same disable. Cleanup restores saved global values. Two overlapping factories can observe/restore each other's state. A temp PGlite directory therefore does not prove full runtime isolation. [Optimized prompt storage](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/optimized-prompt.ts#L238) defaults under the process state directory; a candidate accidentally sent through setPrompt changes the live prompt store.\n\nAmendment: run each candidate/case in an isolated child process with explicit state/DB/artifact paths, target provider config, ephemeral identities and admitted action set. Verify all effectful connectors/native/filesystem/plugin clients point to isolated supported targets before starting. Use read-only contextual classification cases where possible, and an isolated renderer for navigation evidence. Do not disable the consumer under test merely to achieve isolation. Test parallel baseline/candidate jobs with distinct sentinels and outputs, intentional worker failure, and parent environment/store unchanged. A provider-qualified run is not permission to mutate a user's connected accounts. This is a source-backed isolation requirement, not an observed external mutation.\n\n### P2 — Artifact validation must preserve trustworthy experiment data\n\n[Artifact parser](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/optimized-prompt.ts#L404) checks score/baselineScore/datasetSize by typeof number only and skips malformed lineage entries. NaN/Infinity pass the in-memory number check, but JSON.stringify persists them as null; setPrompt can activate the accepted in-memory artifact while restart rejects its stored form. Negative/fractional datasetSize and invalid generatedAt strings also pass these checks. Do not let a failed/inconclusive evaluation become an authenticated but unusable artifact. Require finite scores, declared scale, nonnegative/integer counts and complete validated lineage; malformed mandatory provenance must be rejected, not silently filtered. Exercise set→persist→refresh equality, including nonfinite metrics and interrupted evaluations.\n\n[Resolver](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/optimized-prompt-resolver.ts#L46) substitutes the selected prompt without comparing artifact.baseline to the current baseline. Bind the new pilot artifact to target baseline/config hashes and reject mismatches, or an unrelated later baseline change can silently retain an older optimized instruction. Existing task identity/MAC checks are useful but not baseline compatibility.\n\nResearch coverage: actual consumer eligibility/navigation processor, resolver, artifact parse/write/refresh boundary, scenario factory and judge. Existing few-shot omission remains covered by the earlier plan. No runnable full dependency closure or provider evaluation was available; source-expression probe above is the only executed behavioral evidence.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n"])</script><script>self.__next_f.push([1,"1a:T4f88,"])</script><script>self.__next_f.push([1,"## Problem and consumer outcome\n\nA user must be able to ask for an app capability in ordinary language and receive the correct action, arguments, and resulting effect. Core already ranks the complete authorized action catalog through exact hints, regex, keywords, BM25, embedding tie-breaking, and context weighting. This work establishes an end-to-end Qwen 3.8 path from that existing retrieval surface to correct execution, then repairs failures reproduced by that path. It is not an action inventory or per-file coverage project.\n\nRead-only planning found that `packages/core/src/runtime/__tests__/action-retrieval-measurement.test.ts` exercises deterministic catalog mechanics. It does not by itself establish live-model selection and real effect correctness. No live experiment or new routing defect is claimed by this issue.\n\n## Bounded delivery\n\n- Reuse the real message handler, retrieval measurement, planner, and domain actions. Select a practical cross-domain corpus spanning view navigation, calendar/todos, and one additional installed capability, with registered parent/child names and persisted outcomes.\n- Exercise ambiguous aliases (including view versus application launch), paraphrases, longer compound requests, negation and quoted commands, unavailable/unauthorized capabilities, and a later-ranked action. Coordinate the view registry work so dynamic view metadata is the source of truth.\n- Bind evaluation to Cerebras `qwen-3.8-27b`; record the actual endpoint/model configuration and account-supported context limits. Run the baseline before changing ranking, aliases, descriptions, schema examples, or stage weights. Repair only observed consumer-visible failures within this bounded scope and rerun the same paths.\n- Preserve complete authorized catalog availability, full action descriptions/examples, dynamic provider data, and history. Retrieval may reorder, but must not discard definitions or use top-k removal, truncation, summaries, or compaction. Reject a request whole at an actual provider boundary when necessary.\n\n## Acceptance criteria\n\n- A fresh live-model run records selected contexts/candidates, per-stage retrieval rankings, exposed actions, selected parent/child and arguments, actual action results, and final response under one trajectory identity.\n- Navigation is proven by the resulting view; mutations are proven by matching persisted resource/operation receipts. Unrelated successful tools, previews, or an action-name match alone do not count as success.\n- Ambiguous or unavailable requests produce an accurate conversational clarification or unavailable response without unrelated side effects.\n- A held-out paraphrase slice demonstrates the selected configuration's behavior. Report failures and uncertainty explicitly; no completion claim from aggregate ranking metrics alone.\n- Every routing change has a reproduced before case and a real after result; no issue/PR is created merely for an uncovered action or unchanged inventory row.\n- Preserve complete model-facing content and demonstrate the real size-boundary rejection behavior where relevant.\n\n## Dependencies and coordination\n\nOwner: @NubsCarson; reviewer: @lalalune. Estimate: 2–3 engineering person-days, Sprint 2. Depends on #17072's shared baseline/cache/trace seam and the dynamic view-registry work. Reuse #17030 trajectory schema work; coordinate single-request completion with #24299 rather than implementing another planner loop. Do not treat document retrieval #25150 as action-search ownership.\n\n## Validation and evidence\n\nUse the existing scenario runtime and inspect real domain results. Attach exact revision, complete privacy-safe model request/output and tool-result trajectories, receipt artifacts, retrieval/usage/timing data, relevant package tests/typecheck/lint and root `bun run verify`. If UI changes are necessary, include desktop/mobile captures and the required app audit/evidence bundle. This issue records planned validation, not experiments already run.\n\n## Sources\n\n- Current model catalog: https://inference-docs.cerebras.ai/models/overview\n- Current public model metadata: https://api.cerebras.ai/public/v1/models\n- Model page: https://inference-docs.cerebras.ai/models/qwen-3.8-27b\n- Comparative tool design: https://www.anthropic.com/engineering/advanced-tool-use — use schema examples and search-assisted selection as research input; deferred-definition omission is incompatible with this repository's full-catalog contract.\n\n\n\u003c!-- guardian-sprints-2026-09 --\u003e\n## Project 19 sprint allocation — 2026-09-05\n\n[Guardian MVP](https://github.com/orgs/elizaOS/projects/19), Sprint 2; owner @NubsCarson; complexity **Medium**. Plan **2 person-days**, research range 2–3; scheduled **2026-09-21 → 2026-09-22**. Estimates include focused validation; no live tests or implementation completion are claimed by this planning update. Assignment is planning ownership, not an active-work claim.\n\nSee the scoped acceptance and evidence requirements above. Dependencies and capacity are recorded in the Project 19 README; longer estimates consume reserve or require re-planning, never skipped verification.\n\nDynamic navigation dependency: #30682; sustained-run coordination: #24299.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n\u003c!-- guardian-project19-source-audit-2026-09-06 --\u003e\n## Critical source audit and implementation plan — 2026-09-06\n\nAudited develop snapshot `8fea4f94c29c7712ce3caf303e3350150622d048`. Read the live issue, core/app-control/scenario-runner guides and manifests, retrieval callers, execution and evidence paths. No paid model call, account entitlement check, scenario execution or product effect was performed. The missing deliverable is a correlated live-model-to-real-effect evaluation and fixes to its reproduced failures; no new ranking defect is asserted from source alone.\n\n### What exists, what needs work, and misleading shortcuts to avoid\n\n- **Production retrieval measurement already exists.** [message.ts:3993–4102](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/message.ts#L3993) constructs the authorized catalog (including exact authorized child identities), invokes `retrieveActions`, tiers its complete results, and records a `toolSearch` trajectory stage with query, candidates, hints, stage scores and exposed tiers. Set `ELIZA_RETRIEVAL_MEASUREMENT=1` for per-stage scores and fused rankings. Build on this seam rather than writing a disconnected benchmark that never reaches production selection.\n- The core [retriever](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/runtime/action-retrieval.ts#L536) ranks the complete catalog; old `topK`/candidate-limit fields are compatibility inputs, not permission to suppress definitions. Authorization exclusion is deliberate and separate from relevance ordering. Existing measurement tests establish rank mechanics, not Qwen action choice or user-visible success.\n- **Qwen is not the checkout's default Cerebras model.** [service-routing.ts:66](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/contracts/service-routing.ts#L66) defaults to `gemma-4-31b`. The [live-provider selector](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/testing/live-provider.ts#L290) supports Cerebras through the OpenAI-compatible adapter when it selects `CEREBRAS_API_KEY`; other present credentials or model env overrides can change that choice. Pin and verify the actual acting provider/model at every model boundary, not only the judge. Explicit `--provider openai` is not a Cerebras identity claim: the scenario preflight checks exact credentials and resolved provider (`runtime-factory.ts:439–487`). Resolve a supported isolated configuration and fail on unexpected identity; do not rename credentials or silently fall back merely to get a green run.\n- **Primary-source model check, 2026-09-06:** the [Cerebras public models endpoint](https://api.cerebras.ai/public/v1/models) lists `qwen-3.8-27b`, tools/function calling/structured output, `max_context_length=65536` and `max_completion_tokens=32768`. These public values do not establish this account's entitlement or combined request budget. The [model documentation page](https://inference-docs.cerebras.ai/models/qwen-3.8-27b) was reachable but returned little body content to this read, so the JSON metadata is the evidence for those limits. Capture refreshed metadata and effective account response at execution; do not promise older context claims or use truncation to fit.\n- **The canonical runner has useful but different evidence levels.** [Message turns](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/scenario-runner/src/executor.ts#L1949) call `runtime.messageService.handleMessage`; direct action turns call `action.handler` (`:2127`) and cannot prove model selection. Action-result assertions inspect captured result payloads, which can support diagnostics but cannot prove persisted effects or a rendered view independently. Scenario plugin scoping intentionally removes only foreign batch-declared actions; declare the same installed authorized capability set for each evaluation case so the later-ranked/large-catalog tests are honest.\n- **Production qualification is not a CLI label.** The [in-process executor](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/scenario-runner/src/executor.ts#L2850) explicitly rejects `provider-qualified` because it cannot establish authenticated production ingress or an independent signed observer. Reuse `src/provider-qualified/` controller registry, manifests, operation bindings and trajectory verification where production connector evidence is claimed. An in-process live-Qwen test remains useful runtime integration evidence, but must be labeled accordingly. Recording can be disabled by operator env; verify the trajectory files actually exist and contain complete correlated stages instead of assuming the default opt-in suffices.\n\n### Ordered implementation plan\n\n1. **Nubs + core/scenario owner: preflight one reproducible evaluation environment.** Freeze installed code/provider plugin versions, acting model and endpoint, native-tools versus text-planner mode, all effective model/env settings (redacted), plugin set, authorized roles, locale/time zone, action-catalog hash and dynamic view registry version. Verify required real services and exact effect observers. Make credentials, missing tools, provider mismatch, missing traces and unsupported account limits explicit preflight failures. Keep the judge separate from the acting Qwen model and use hard effect checks as the authority.\n2. **Author a bounded baseline corpus in the existing scenario schema.** Use message turns spanning navigation, calendar/todo and one installed third capability. Include explicit and paraphrased requests, dynamic view names and ambiguous APP/VIEWS aliases, negation/quoted instructions, compound requests, clarification, unavailable/unauthorized capability and a deliberately later-ranked action. Seed isolated real domain records; preserve the full authorized catalog and descriptions/examples/history. Split training/debug and held-out paraphrases before tuning. Record expected effect IDs/properties or explicit no-effect conditions, not merely expected action names.\n3. **Join the existing measurement and execution traces.** Under one trajectory identity collect Stage 1 selected contexts/hints, catalog identity, complete toolSearch rankings, actual planner-exposed definitions, selected parent/child/arguments, action results, evaluator decisions and final reply. Attach provider request/response IDs, token usage and timings. Ensure asynchronous trace persistence is drained before hashing the run. Distinguish normalized lookup names from exact native tool identities so a child authorization regression cannot be hidden by normalization.\n4. **Observe the real effect through the appropriate boundary.** For navigation, require an authenticated intended-renderer receipt plus the resulting displayed view, not a loopback HTTP success alone. For mutations, read back the resource from its owning service/store using returned IDs, verify requested properties and operation correlation, and assert no duplicate/unrelated effect. For connector effects, use existing external qualification/observer machinery and recipient/provider receipts; do not claim provider certification from a PGLite-only run. Negative cases need observation of no effect over the relevant execution interval.\n5. **Run baseline before making routing changes.** Classify failures by parsing/schema, provider configuration, registry metadata, retrieval ordering, planner selection, action validation, effect execution, observation or final-response honesty. Repair only a reproduced failure and its owning seam. #30682 owns dynamic view metadata/aliases; #17072 owns shared baseline/cache/trace work; #17030 owns trajectory schemas; #24299 owns sustained completion. Reuse those owners and avoid a second planner or document-search ownership under #25150.\n6. **Rerun exact failures and held-out cases.** Preserve baseline corpus/config hashes and record each intervention. Report per-case failures, intended and actual effects, latency/cost/usage and uncertainty alongside aggregates. A successful unrelated tool or correct parent with wrong child/arguments is failure. If no defect reproduces, deliver the full evidence and coverage limits; do not invent a code change to satisfy an inventory task.\n\n### Verification and exit criteria\n\n- Add behavioral regressions at the changed seam only: full catalog availability including later-ranked entries, authorized child identity isolation, correct alias-to-effect routing, compound completion, clarification without side effects, exact persisted effect readback and final-response accuracy. Tests that mirror constants, rank lists or mocked action success do not close this issue.\n- Exercise the actual provider hard-size rejection with the complete request and an actionable failure, without truncating definitions, examples, history, provider output or trajectory. Any simulated boundary test must be labeled distinct from live account behavior.\n- Run focused core/scenario-runner/domain tests, affected package typechecks and lint, root `bun run verify`, and app audit plus desktop/mobile evidence if UI changes occur. Use the canonical verified evidence bundle with exact source, corpus/config/trajectory hashes, complete privacy-safe inputs/results, provider metadata, effect receipts and before/after case results. No tests or runtime success are claimed by this audit.\n- Completion requires a fresh Qwen run proving correct user-visible effects and a held-out slice, with every changed routing behavior backed by a before failure and after success. Missing model access, observer/controller readiness or supported renderer remains an explicit gate.\n\nEstimate: retain 2–3 engineering days provisionally only if #17072/#17030 evidence seams and the required effect observers are ready. External qualification and dynamic-navigation repair can expand the scope; re-estimate those dependencies rather than spending the budget on a ranking-only report.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent adversarial review — 2026-09-06\n\nRe-reviewed current develop `b676280384b15df54204276e34bb8740db26936f`, the live issue and the first audit, complete retrieval scoring/measurement and planner-surface callers, scenario execution/profile checks and action interception. This is additional source evidence and amendments, not a live Qwen success claim.\n\n### P2 — The proposed analysis must distinguish three different rankings\n\n[The retriever](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/runtime/action-retrieval.ts#L680) combines normalized relevance and context boosts, applies a message-evidence tie-break to saturated hint cohorts, then assigns **one-based** final result ranks at lines 790–804. Its measurement `fusedTopK` at lines 830–845 instead orders raw RRF scores; it is a diagnostic intermediate, not the final context-adjusted result order. [The production trace serializer](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L4078) writes the final results with `rank: idx`, **zero-based**, while embedding the one-based fused ranking beside them. This is a verified static contract discrepancy. It does not establish a wrong chosen action or a ranking algorithm bug.\n\nAmend the evidence implementation before calculating reciprocal rank, later-ranked action success or before/after deltas: specify rank basis and stage provenance; normalize existing trace versions deliberately; use actual final exposed planner order for the final-retrieval metric and label RRF-only diagnostics separately. Preserve exact authorized tool identity when joining normalized parent names. Test the real trace-to-analyzer boundary using a context/hint case where final order differs from raw RRF and a first-ranked action whose serialized rank is zero. Prevent division-by-zero or mislabeled rank metrics; do not “repair” useful final ordering to match a diagnostic list.\n\n### P2 — Absent toolSearch does not invariably mean lost evidence\n\n[buildV5PlannerActionSurface](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L3982) explicitly returns the full action surface before retrieval when `forceFullSurface` is true or actions are empty. The [actual planner caller](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L9985) uses coding mode for this flag. Deterministic action paths also need classification; the #30682/#23111 navigation shortcut can preempt model tool selection, and subsequent action authority/validation gates still apply. Running a live model somewhere in a case does not prove it selected the effect-producing action.\n\nAmend the run schema with selection mode and retrieval disposition (`executed`, intentional full-surface bypass, deterministic path, or failed/missing), plus the exact planner/model boundary that selected each action. Do not force retrieval on an intentionally full-surface path just to fill an evidence table; that would change the measured behavior. For the required Qwen selection cohort, assert that Qwen's actual response selected the intended tool/arguments; report shortcut navigation separately. Preserve all authorized definitions and full context in either path.\n\n### Disconfirmation and remaining gates\n\n- The authorized child filter at message.ts3993–4012 uses exact native identities, which contradicts an assumption that normalization itself discloses denied child definitions. No such defect was established here.\n- The `toolSearch` write is explicitly asynchronous and reports failure (message.ts4066–4118). Require recorder drain and final persisted-stage inspection as already planned; successful action execution alone does not ensure evidence completion.\n- [The executor](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/scenario-runner/src/executor.ts#L3160) synthesizes a REPLY only in the **simulated** profile when no action was captured and text exists, marking `source: synthesized-reply`. Do not allege this fabricates live action proof. Continue requiring independent effect observation rather than treating intercepted callback output as persistence.\n- The provider-qualified rejection and direct-action versus message-turn distinction in the first audit remain correct. No paid/provider call was made, and no real ranking failure was reproduced. The safe navigation matcher probes documented in #30682 are classifier evidence only. Completion remains a pinned live acting-Qwen run with correlated selection, effect, and held-out results, after evidence semantics above are made explicit.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n"])</script><script>self.__next_f.push([1,"1b:T6833,"])</script><script>self.__next_f.push([1,"## Problem and observed evidence\n\nA dynamically registered plugin view can appear in the live view catalog and command palette, but its navigation aliases cannot be supplied to the backend exact-command matcher through the view declaration. This prevents plugins from contributing the same deterministic navigation vocabulary as built-in views without editing a central static list.\n\nRead-only source inspection on 2026-09-05 found:\n- `packages/shared/src/views/view-command-matcher.ts` builds matching from static `VIEW_NOUNS` / `VIEW_PRIORITY` and exports static `MATCHER_VIEW_IDS`.\n- `plugins/plugin-app-control/src/evaluators/view-command-routing.ts` resolves commands from message text and registered actions, without consuming the registered view inventory.\n- `packages/core/src/types/plugin.ts` exposes view tags and context/action hints but no navigation-specific alias contract.\n- `packages/ui/src/chat/index.ts` already derives plugin palette entries from live registered views.\n\nThis is a source-backed missing extension capability, not a claimed live production regression. Implementation starts by reproducing the missing path against a real registered temporary plugin view.\n\n## Scope\n\nAdd additive navigation alias metadata to the canonical view declaration/registry and use the authorized registered catalog to resolve exact standalone commands. Preserve existing multilingual built-in vocabulary, plugin lifecycle invalidation, visibility/role rules, and the existing model-authored continuation after navigation. Resolve alias collisions explicitly rather than selecting the first registration.\n\nParent work: #23110. Preserve #29670's UI-only immediate-navigation scope; its optimistic navigation plus unchanged normal turn is already implemented and must not be rebuilt here. Contextual or compound-request planning remains tracked in #23111. Do not broaden this issue into a general navigation redesign or add a parallel registry.\n\n## Acceptance criteria\n\n- [ ] A temporary registered plugin view with a localized alias is reached through a normal app-chat command such as “take me to \u003calias\u003e” without editing any central matcher list.\n- [ ] “open”, “go to”, “take me to”, and “can you show me my” resolve the same authorized target from the shared catalog; existing supported-language built-in forms continue working.\n- [ ] Register, update, and unload invalidate resolver data: removed aliases cannot route, and changes are reflected without a process restart.\n- [ ] Ambiguous aliases produce a disambiguation outcome; unavailable, hidden, or unauthorized destinations never navigate through the fast path.\n- [ ] Client and backend agree on the target and produce one effective navigation; unrelated clients do not navigate.\n- [ ] The complete original request still enters the normal model turn; the reply is model-authored and based on actual navigation outcome. No canned completion, dropped request text, or duplicate acknowledgment.\n- [ ] Negation, quoted navigation instructions, and compound requests do not silently consume or override other user work; compound handling remains model-owned.\n\n## Validation and evidence\n\nExercise the real view-registration, resolver, action, and app navigation boundaries. Capture live-model input/output and tool results showing the dynamic target and navigation outcome. Include before/after desktop and mobile screenshots, a short MP4 walkthrough, frontend console/network and backend logs, and the canonical verified evidence bundle. Existing exact-command handler fixtures alone are insufficient proof because they supply the target directly.\n\nRun affected package tests/typecheck/lint, relevant app audit and root `bun run verify`; inspect the real artifacts. Do not add metadata-existence tests as a substitute for behavior.\n\n## Sprint plan\n\nProject: https://github.com/orgs/elizaOS/projects/19\nProposed owner: @NubsCarson; Shaw reviews the shared contract.\nSprint 1: 3 person-days planned (3–4 person-days estimate).\nDepends on the authoritative view inventory baseline in #23110. Registration/catalog plumbing is the uncertainty; re-estimate if the target matrix exposes additional owners. Contextual same-turn navigation is separately planned under #23111 for Shaw in Sprint 2.\n\n\n\u003c!-- guardian-sprints-2026-09 --\u003e\n## Project 19 sprint allocation — 2026-09-05\n\n[Guardian MVP](https://github.com/orgs/elizaOS/projects/19), Sprint 1; owner @NubsCarson; complexity **Medium**. Plan **3 person-days**, research range 3–4; scheduled **2026-09-16 → 2026-09-18**. Estimates include focused validation; no live tests or implementation completion are claimed by this planning update. Assignment is planning ownership, not an active-work claim.\n\nSee the scoped acceptance and evidence requirements above. Dependencies and capacity are recorded in the Project 19 README; longer estimates consume reserve or require re-planning, never skipped verification.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n## Current-source audit and implementation plan — 2026-09-06\n\nBaseline: `8fea4f94c29c7712ce3caf303e3350150622d048`. Source and live issue review; no implementation or live navigation certification is claimed.\n\n### What exists and what is missing\n\n- The missing extension seam is confirmed. [ViewDeclaration](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/types/plugin.ts#L907-L979) exposes ID, label, tags, action/context hints and eligibility metadata, but no navigation-specific localized aliases. Tags are search hints; treating all tags as exact commands would accidentally broaden behavior.\n- [The shared matcher](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/shared/src/views/view-command-matcher.ts#L1231-L1336) compiles static nouns/priority. [Backend routing](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/evaluators/view-command-routing.ts#L11-L42) sees only message text and registered action names, not the live catalog.\n- Dynamic views can already be navigated by ID/label: [runViewsShow](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/actions/views-show.ts#L582-L645) reads live views and resolves the target; the palette derives entries from the live registry. The missing capability is deterministic exact localized aliases supplied by plugin registration, not all dynamic navigation.\n- #29670 is still open on GitHub, but [resolveOptimisticNavigationExecution](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/chat/slash-menu.ts#L598-L631) and its ChatOverlay call near line 4476 exist. Preserve the client switch plus normal original-text send; do not rebuild that feature.\n- The exact response-handler evaluator already injects `VIEWS show`, and the action independently invokes the static matcher during target resolution. Changing only the evaluator or the palette leaves competing resolution paths. Existing originating-client/completed-action handoff and deduplication in [views-routes](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/agent/src/api/views-routes.ts#L1087-L1110) should remain the delivery owner.\n\n### Concrete gaps and execution uncertainties\n\n1. The canonical declaration and resolver API cannot carry the requested aliases. This is source-backed missing functionality; no live production regression was reproduced.\n2. Direct empty-array registration preserves previous entries at the helper boundary, but both production plugin reload wrappers unload/unregister before registration. Do not classify ordinary reload as broken or block aliases on this hypothetical repair. Verify normal reload behavior and identify an actual direct replacement caller before changing that helper contract; the independent review below records the disconfirming evidence.\n\n### Ordered implementation\n\n1. **Reproduce the actual extension boundary.** Register a temporary plugin with a real mountable GUI view and localized alias absent from built-in lists. Demonstrate working palette/ID navigation and the missing deterministic alias through normal app chat. Capture complete input, selected action and routed target. A fixture that supplies the target directly does not reproduce this problem.\n2. **Add one additive canonical contract.** Add typed locale/alias metadata to core ViewDeclaration; document normalization, duplicate behavior and backwards compatibility. Propagate through existing registry/API/UI types and inventory parsing. Keep existing built-in vocabulary in its shared owner initially, exposed through the same resolver input so all supported-language behavior survives without a mass rewrite.\n3. **Create one shared pure resolution function.** Separate anchored standalone-command grammar from eligible catalog lookup. Return a discriminated no-match, unique target or ambiguity result. Normalize Unicode/case/whitespace consistently, escape alias regex characters, and preserve –4 day range after the temporary-plugin reproduction and supported-target matrix; contextual compound planning stays in #23111.\n\n### Behavioral acceptance and evidence\n\n- Exercise real registry → catalog → resolver → VIEWS action → route → mounted UI. Cover localized aliases, all requested English forms, supported built-in languages, two-view collisions, built-in/plugin collisions, register/update/unload, stale revisions and last-view removal. Assert actual routed target and outcomes rather than copied metadata or static counts.\n- Exercise hidden developer/preview/internal views, unavailable bundles, unsupported platforms and denied roles. Excluded targets must neither navigate nor leak into disambiguation suggestions; revalidate after eligibility changes during a turn.\n- Cover negation, quoted navigation text, unrelated long requests and compound work. Verify complete original input reaches the normal model turn and the final model-authored response reflects actual navigation success/failure.\n- Extend the real boundary suites: view-command-matcher, view-command-shortcut, views-registry and relevant navigation-delivery route tests; UI slash-menu, rendered ChatOverlay and useChatSend tests. Add one temporary-plugin integration instead of another exact-handler fixture supplying the expected target.\n- Run affected core/shared/agent/plugin-app-control/UI tests, typecheck and lint, then root `bun run verify`. Run `bun run --cwd packages/app audit:app` and inspect affected desktop/mobile states. Publish before/after captures, MP4, console/network/backend logs and complete live-model trajectories in the verified evidence bundle. Restricted store builds cannot dynamically install arbitrary plugins: exercise the equivalent prebuilt declaration path and mark inapplicable dynamic-install evidence explicitly.\n- This audit used pinned Node 24.15.0 and Bun 1.3.14. Related inventory execution stopped because this checkout lacks `typescript`; no installs, builds, live model calls or app tests were performed. These source findings do not replace acceptance execution.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent adversarial review #30682 — 2026-09-06\n\nSource `b676280384b15df54204276e34bb8740db26936f`, Bun 1.3.14. Reviewed full shared matcher, response-handler shortcut, action target resolver and client optimistic wrapper. No model/navigation effect executed.\n\n## P1 — Existing “exact” matcher recognizes quoted/metalinguistic instructions; freeze this before extending aliases\n\nExecuted the real dependency-light module with `bun -e`, importing packages/shared/src/views/view-command-matcher.ts. Exact results:\n\n- `Please quote the phrase open calendar in my note` → `calendar`\n- `What does open settings mean?` → `settings`\n- `Open calendar and create a meeting tomorrow` → `calendar`\n- negative control `Do not open calendar` → null\n- unregistered noun `open observatory` → null\n\nCause: COMPILED has unanchored verb/noun branches, despite matcher comments describing precise explicit commands ([packages/shared/src/views/view-command-matcher.ts:1231](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/shared/src/views/view-command-matcher.ts#L1231)). Negation protects the explicit negative control but does not make the grammar standalone. The actual response-handler caller performs no additional exactness gate ([plugins/plugin-app-control/src/evaluators/view-command-routing.ts:36](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-app-control/src/evaluators/view-command-routing.ts#L36)); its evaluator clears existing candidate/parent hints and sets a deterministic VIEWS call ([plugins/plugin-app-control/src/evaluators/view-command-shortcut.ts:54](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-app-control/src/evaluators/view-command-shortcut.ts#L54)). This gives a concrete route from a mention to a proposed unintended navigation. Live runtime effect is not claimed.\n\nAmendment: make standalone grammar vs quoted/embedded navigation an explicit first deliverable, before supplying any new aliases. Preserve full original text to normal planning when no unique anchored command exists. Add behavioral negative cases above and compound cases to actual evaluator/action/renderer integration, not only resolver tests. Dynamic alias expansion must not inherit the old unanchored pattern. Validate all existing supported-language forms against the grammar; do not “fix” it by dropping multilingual phrases.\n\n## P2 — Registry refresh concern has important disconfirming caller evidence\n\nThe prior plan suggested empty-view replacement may leave stale entries. Both production reload wrappers unload/unregister first (plugin-lifecycle.ts:934–940 and 1243–1248). Reclassify as direct-helper behavior requiring a bypass caller, not a proven normal plugin reload defect. Run the ordinary reload regression before assigning repair work. #23110 deep review contains full evidence.\n\n## Acceptance missing from alias-only tests\n\nThe client optimistic resolver deliberately tries local built-ins before server commands (slash-menu.ts:609–627). A server ambiguity result cannot be assumed to prevent a client effect that already happened. Test built-in/plugin collisions through both client and server with the same eligible catalog/revision, and assert neither side navigates on ambiguity. This is an architecture test requirement, not a claimed current dynamic-alias incident because alias metadata does not yet exist.\n\nHarness limit: importing the full viewCommandShortcutEvaluator for execution failed on missing core generated validation-keyword-data.ts. No installation/generation was performed. Real matcher probe succeeded; evaluator effects are static caller evidence.\n\nFurther disconfirming caller checks: downstream routing can still terminate ignored/stopped/addressed-to-other turns (message.ts:9549–9580); direct-action rules have explicit candidate-replacement exceptions (message.ts:4910–4936); and deterministic dispatch rechecks role/context/private-action/arguments/account/validate through the canonical executor (message.ts:10265–10291). The later general candidate inference at 9691 is suppressed when candidateActionsClearedByEvaluators is true, but it is not the only gate. Therefore this review proves a wrong proposed deterministic navigation and a context-loss risk, not guaranteed final navigation or bypass of authorization. Full exact-turn integration is required to determine the final outcome for each probe.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n\n\n\u003c!-- sprint1-30682-current-navigation-reconciliation --\u003e\n### Current navigation prerequisite and remaining acceptance plan\n\nThe navigation prerequisite [PR #30770](https://github.com/elizaOS/eliza/pull/30770) merged into `develop` as `f7a8a24eef292cf1b73f71b11e1ca3b795b21ade` on 2026-09-06. Its reviewed head was `cdd6ee99dc076c405364302c515f5662b30be7f1`; the seven cited navigation files are unchanged in the merge. The standalone grammar and same-turn contextual planning fixes are implemented prerequisites, not remaining repair requests. This issue remains open: localized plugin-declared navigation aliases are still absent from the canonical view declaration and static exact-command resolver. Implement that additive catalog-backed extension and retain the detailed acceptance scenarios below; the merged prerequisite does not establish live dynamic-alias or full-issue acceptance.\n\n## Replace stale implementation work with current acceptance\n\nThe earlier b676 deep-review grammar finding is addressed in S2: [view-command-matcher.ts:1256](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/packages/shared/src/views/view-command-matcher.ts#L1256) builds standalone anchored command patterns. Do not reproduce old unanchored probes as current failures. The new [view-context-planning.ts:73](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/evaluators/view-context-planning.ts#L73) selects contextual navigation before planning, reads a live authorized catalog, carries the complete request, and adds navigation to the existing candidate/context rather than clearing domain work. [view-context-planning.ts:142](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/evaluators/view-context-planning.ts#L142) explicitly preserves each original operation and distinct per-step navigation targets. Actor/turn-scoped constraints and cancellation checks exist in navigation-execution.ts and views-show.ts. The old post-response autonomous navigation architecture should not be proposed again.\n\nThese are source prerequisites, not proof that a live model completes a compound request or that a voice user sees/hears the correct result. Existing UI-button/navigation receipts cannot substitute for actual normal utterance → classifier → planner → navigation/domain effects → final answer evidence.\n\n## Residual contract and evidence requirements\n\n**1. Separate accepted transport from actual visible destination.** [views-show.ts:845](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/actions/views-show.ts#L845) promotes completed-action success when the delivery flag is true. The host route [views-routes.ts:1314](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/packages/agent/src/api/views-routes.ts#L1314) derives that flag from targeted WebSocket send count, not a renderer commit acknowledgement. The renderer [completed-action-navigation.ts:65](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/pa
