ckages/ui/src/completed-action-navigation.ts#L65) separately checks handled handoff IDs and user navigation epoch; a late or unhandled frame can legitimately fail to produce the destination even after successful socket send. Therefore `delivered` here establishes a transport handoff, not by itself an opened/interactive view. Require correlated handoff ID, renderer route commit and visible target/error state before making a completed-switch acceptance claim. For missing/disconnected renderer, preserve accepted/not-delivered distinctions and truthful final wording. If product semantics require an authoritative backend completion receipt, add an actual renderer acknowledgement contract rather than relabeling socket send count.\n\n**2. Dynamic catalog refresh exists; atomic catalog-to-dispatch validity remains a separate requirement.** [views-show.ts:673](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/actions/views-show.ts#L673) rereads the catalog per execution, so a stale process-wide catalog cache is not an established current defect. It checks cancellation after that read and after optional role resolution, and rechecks the selected view's captured availability/role at [views-show.ts:767](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/actions/views-show.ts#L767). The request at [views-show.ts:831](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/actions/views-show.ts#L831) does not carry the observed catalog generation. A plugin or target can change between selection/read and dispatch, especially during awaited role resolution. Acceptance must change/remove/restrict/re-register the selected view at that boundary and verify the authoritative dispatch resolves the current eligible identity, or rejects explicitly, without rendering an old path or claiming the old destination. This is a time-of-use boundary requiring proof, not an assertion that caller authorization is globally absent. Catalog omissions are intentionally caller-scoped and must not reveal whether a hidden view globally exists.\n\n**3. One effective navigation is narrower than one action invocation.** Stable handoff IDs [views-show.ts:811](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/actions/views-show.ts#L811) bind actor, room, message, client, step and target; renderer dedupe already handles socket/final fallback. Preserve those protections. They do not establish backend mutation/event dedupe across repeated execution: replaying the same step can still issue another POST, while changing the step ID creates a new logical handoff. Exercise socket-first, final-first, duplicate frames, interrupted stream/reconnect, and deliberate user navigation between paths. Count effective renderer transitions separately from backend current-view/event updates and domain side effects. Avoid adding a parallel client optimistic path that races the action receipt.\n\n**4. Compound work needs effect-level proof, not prompt wording.** The contextual evaluator adds instructions preserving domain operations; that is necessary but insufficient acceptance. Use normal utterances such as opening Calendar then creating the requested draft, or opening Notes then recording exact content. Inspect the same complete turn for both the navigation step and the owning domain result, persisted record/content, and one truthful final answer. A navigation success must never turn a domain error into success or end the turn before domain work. Repeat with an optional navigation failure: independently authorized server-backed work should still finish and its outcome remain visible.\n\n**5. Ambiguity, denial and negation must survive every consumer.** [views-show.ts:752](https://github.com/elizaOS/eliza/blob/cdd6ee99dc076c405364302c515f5662b30be7f1/plugins/plugin-app-control/src/actions/views-show.ts#L752) returns an ambiguous outcome before dispatch; contextual selection maps ambiguity/forbidden intent separately. Test a builtin/plugin label collision, unavailable target, multilingual negation, quoted command, and compound request through real planning and the actual renderer. Neither local optimistic resolution nor model-generated planner arguments may override the trusted constraint. Clarification must preserve the full original task and target alternatives without treating a role-filtered omission as global nonexistence.\n\n## Evidence packet and realistic completion rule\n\nRecord current source/build/served-process identity, complete model inputs/outputs, authorized catalog and role context, exact turn/actor/client/step/handoff IDs, transport responses, real renderer route/visible state, domain persisted rows, final stored message, and frontend/backend logs. For voice, capture actual transcript, control event, audio start/end and listen to final wording; text fixtures are not audio proof. Include desktop/mobile normal-app captures and verified canonical bundle. Keep UI prerequisite proof, deterministic integration tests and live model/voice outcomes separately labeled.\n\nThis review does not request duplicate S2 source work or claim whole-issue completion. The source changes should be accepted only under their actual tested scope; the residual scenarios above require explicit evidence or narrowly assigned implementation when a concrete failed boundary is reproduced.\n\n\n\u003c!-- sprint1-30682-current-navigation-reconciliation:end --\u003e\n"])</script><script>self.__next_f.push([1,"1c:T7c77,"])</script><script>self.__next_f.push([1,"## Concrete gap\nComplex requests and slow in-turn actions should receive a brief natural acknowledgement before completion. [packages/core/src/services/message.ts:4794](https://github.com/elizaOS/eliza/blob/06963a19b01c3720aedcf77c77434936e8654270/packages/core/src/services/message.ts#L4794) recognizes only actions marked `asyncHandoff`; [packages/core/src/services/message.ts:14700](https://github.com/elizaOS/eliza/blob/06963a19b01c3720aedcf77c77434936e8654270/packages/core/src/services/message.ts#L14700) explicitly suppresses the early voice reply for synchronous work. This source-confirmed policy is narrower than the requested behavior; this research has not measured current acknowledgement latency in a live session.\n\nExtend the canonical early-response mechanism with a typed decision for progress acknowledgement. Avoid separate canned delivery callbacks in each action.\n\n## Acceptance\n- A slow synchronous retrieval or multi-action request receives one conversational acknowledgement before completion and a truthful substantive outcome afterward; a fast direct answer avoids unnecessary filler.\n- View-navigation acknowledgement reflects the actual navigation receipt and preserves the main response's awareness of the completed switch.\n- An acknowledgement never claims the action completed, replaces the final result, or terminates a multi-action run.\n- STOP/IGNORE, ambient speech, canceled turns, and duplicate stream/final promotion produce no stale or duplicate acknowledgement.\n- Failures receive conversational, actionable wording while preserving the typed error and complete trajectory.\n- Measure time to acknowledgement separately from time to substantive text/audio so early filler cannot conceal unchanged task latency.\n\n## Coordination and evidence\nCoordinate with [#29670](https://github.com/elizaOS/eliza/issues/29670) for immediate navigation and [#17027](https://github.com/elizaOS/eliza/issues/17027) for receipt-backed completion claims. Reuse [#16079](https://github.com/elizaOS/eliza/issues/16079) timing and the short-phrase caching work; consult Nubs on voice delivery and [#29492](https://github.com/elizaOS/eliza/pull/29492) overlap.\n\nExercise the real runtime with live-model chat and voice cases, inspect complete trajectories and action receipts, and listen to the resulting acknowledgement/final audio. Include adversarial cancellation/deduplication tests, exact-SHA logs, and the canonical verified evidence bundle. Run owning-package checks, root verify, and applicable app audit.\n\nEstimate: 2–3 person-days; Shaw (`lalalune`), with Nubs voice review. Linked source was clean at the inspected HEAD; other shared-working-tree edits were preserved.\n\n\u003c!-- guardian-sprints-2026-09 --\u003e\n## Project 19 sprint allocation — 2026-09-05\n\n[Guardian MVP](https://github.com/orgs/elizaOS/projects/19), Sprint 1; owner @lalalune; complexity **Medium**. Plan **2 person-days**, research range 2–3; scheduled **2026-09-16 → 2026-09-17**. Estimates include focused validation; no live tests or implementation completion are claimed by this planning update. Assignment is planning ownership, not an active-work claim.\n\nSee the scoped acceptance and evidence requirements above. Dependencies and capacity are recorded in the Project 19 README; longer estimates consume reserve or require re-planning, never skipped verification.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n## Critical implementation audit — 2026-09-06\n\nSource baseline: `8fea4f94c29c7712ce3caf303e3350150622d048` (`develop` snapshot). Research included current source, regression coverage and live linked-PR status; no live chat/audio test or implementation completion is claimed.\n\n### Existing behavior and concrete gaps\n\n- [candidateActionsIncludeAsyncHandoff](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/message.ts#L4795) explicitly permits the early acknowledgement only for registered async-handoff actions (including simile matching). [Delivery construction](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/message.ts#L14698) only installs that early delivery callback on voice channels and rejects synchronous candidates. Therefore a blanket removal of the async check would neither implement ordinary text acknowledgement nor distinguish fast and slow synchronous work.\n- The [canonical Stage-1 producer](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/message.ts#L9702) already checks addressing/RESPOND eligibility, blocks ungrounded completion claims, respects a consumer's explicit false delivery result, and keeps actual delivery bookkeeping. [The consumer](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/message.ts#L14730) checks current response ownership and abort state before persistence/delivery. Reuse these gates.\n- [Planner context](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/services/message.ts#L10165) records that the early reply was actually delivered so the final answer can avoid repeating it. This is the correct seam for navigation receipts and progress awareness; do not bypass it with action-specific canned callbacks.\n- [Existing behavioral tests](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/core/src/__tests__/voice-text-delivery-parity.test.ts#L252) deliberately require a synchronous tool turn to have no pre-planner filler and preserve async-handoff acknowledgement. This is an intentional policy change, not removal of dead code. Update the slow-work case while retaining a fast synchronous single-answer control.\n- #29492 remains **OPEN**, head `b209c79fe2ac1bde176204f078834f9352b8395c` at research time. Its full-duplex browser work cannot be treated as landed delivery behavior. Coordinate with its owner and recheck the live head before touching shared voice code.\n\n### Detailed implementation sequence\n\n1. **Define a typed acknowledgement policy.** Add a narrow internal decision carrying eligibility/reason, originating turn/response identity and delivery status. Distinguish fast answer, in-turn progress and async handoff without routing from acknowledgement prose. Determine slow-work eligibility from explicit action capability/planner intent or actual pending work; document the initial policy and configurable timing owner. Avoid a new model call solely to decide whether to say filler. A candidate action hint is not proof that work started or completed.\n2. **Generalize canonical delivery.** Route eligible text and voice progress through the existing response-handler producer, pipeline hooks, audience/egress checks, memory/event persistence and HandlerCallback. Preserve exactly-once acknowledgement per turn and keep final response ownership separate. If a delayed acknowledgement is used, bind its timer to the turn AbortSignal/response lease and clear it on final delivery, STOP, IGNORE, cancellation or supersession. Recheck ownership after awaited hooks and immediately before external emission so an intervening cancel cannot release stale output. Treat transport failure as failure, not as delivered acknowledgement.\n3. **Preserve truthful continuation.** Keep acknowledgement language prospective and nonterminal. Do not reuse a model-predicted applied effect as a receipt. Feed only actual delivery and verified navigation/action receipts back into planner context; preserve outstanding actions after any early reply. Coordinate #29670 navigation receipts and #17027 grounded completion. Failure wording should explain what failed and a useful next step while retaining typed errors and complete action/model trajectory. An early ack must never suppress the owed final failure.\n4. **Connect timing without inflating success.** Use #16079's shared trace contract to record acknowledgement decision/delivery, first substantive text, first substantive audio and final completion separately. Correlate one turn across text and voice; label cached short-phrase audio and its source without introducing another delivery path. Consult Nubs on voice pacing and interruptions.\n5. **Behavioral regressions.** Extend the real message-service harness: fast direct answer and fast synchronous retrieval (no filler); genuinely pending synchronous retrieval and sequential multi-action work (one ack then correct complete outcome); async handoff (existing behavior); verified/rejected navigation; failure after ack; duplicate stream/final promotion; transport rejection; cancellation before decision, during hooks, during audio and immediately before completion; newer same-room turn; concurrent independent rooms; STOP/IGNORE and ambient/group speech. Assert user-visible deliveries, outstanding action completion and state/receipt consistency, not helper flags or exact canned text.\n6. **Live acceptance and evidence.** Run live-model ordinary chat and actual supported voice transport with slow retrieval, multi-action success/failure, navigation and barge-in. Inspect complete trajectories and receipts, listen to acknowledgement/final audio and inspect UI for duplicate bubbles. Record exact app/runtime/provider SHA/settings and separate acknowledgement versus substantive timing. Run core tests/typecheck/lint/root verify and affected host/voice suites; if UI/shared UI changes reach app, run app audit and inspect desktop/mobile captures. Publish the verified evidence bundle inline; green unit tests alone are not voice acceptance.\n\nScope/dependencies: core owns policy and delivery; #29670/#17027 supply effect/receipt contracts, #16079 owns correlation, and #29492/Nubs own overlapping voice acceptance. The 2–3 day estimate is a narrow core-policy estimate; unresolved transport races or changes to the open full-duplex branch require explicit replanning rather than skipping the live evidence stage.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent deep review: #30681\n\nAudited `b676280384b15df54204276e34bb8740db26936f`. This is an implementation-plan amendment, not implementation or end-to-end acceptance.\n\n### P1 — Existing early delivery can outlive the turn that authorized it (reproduced)\n\nThe [early-reply consumer](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L14731-L14800) checks response ownership and abort only before awaiting the outgoing hook, trusted-audience enforcement, persistence, and MESSAGE_SENT delivery. A newer turn or cancellation while the first hook is pending is never checked before the transport callback. Expanding this path to synchronous work or text without repairing it expands an existing stale-delivery race.\n\nExecuted `bun /tmp/guardian-project19-deep-review/probe-30681.ts` against a source-extracted, unchanged production closure, using Bun's TypeScript transpiler and controlled collaborators. Results:\n\n- Abort before entering: `false`, no side effects (the existing guard works).\n- Abort in the awaited outgoing hook: `true`; persistence → sent event → callback all execute.\n- New response ID installed in that hook: same stale persistence/event/callback sequence.\n- Normal control: same successful sequence with the original owner.\n\nThis isolates real control flow; it does not claim a running runtime, transport, or audible reproduction. The harness does not replace the consumer under test but controls external hooks/transport. Add a real MessageService regression using a deferred outgoing hook and a competing turn; prove the old acknowledgment does not reach the connector or browser. Check ownership/abort again after awaited preparation and immediately before dispatch. Define the dispatch linearization boundary; a check after dispatch cannot revoke already delivered output. Do not cancel all earlier responses when `keepExistingResponses` explicitly permits them; cancellation remains independent.\n\n### P2 — Delivery bookkeeping is committed before transport success (reproduced)\n\nThe same [consumer](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L14788-L14800) persists the memory, emits MESSAGE_SENT, and populates `earlyReplyMessages`/`persistedEarlyReplyIds` before awaiting the transport. Controlled callback rejection produced `delivery failed`, while one early reply remained recorded and the sent event had already fired. [emitMessageSent](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L16708-L16719) really emits the event; this is not merely a function with a misleading name. [Failure handling](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L14982-L15004) treats the populated collection as `hasDeliveredEarlyReply`.\n\nAmend the plan to distinguish pending/delivered/failed/ambiguous delivery rather than adding another boolean. Persist-before-send may be necessary for stable IDs; retain that requirement while moving the **delivered** receipt and sent event to an authoritative transport outcome. A rejected callback may mean failure before send or ambiguous failure after acceptance: do not automatically retry and duplicate a message. Test both connector failure boundaries, sent-event listener failure, and restoration of a pending record after a process restart. `HandlerCallback` returning an empty array is not proven failure; define and consume its actual delivery contract before changing semantics.\n\n### P2 — The planner is told the proposal, not necessarily the delivered acknowledgment (source-verified)\n\nThe [producer](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L9770-L9815) passes PII-restored text to a callback returning only boolean/void; outgoing hooks and audience enforcement may further transform content. The [planner continuation](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L10169-L10186) instead records the producer's `earlyReplyText` as the already sent visible reply. The callback cannot return authoritative delivered text. This establishes a contract mismatch, not proof that every configured hook changes a reply.\n\nReturn a typed accepted delivery receipt containing actual visible content and delivery ID; feed that complete content to the planner's non-repetition context. Exercise an outgoing hook that changes the acknowledgment and verify the next planner input matches the actual transport payload exactly, including restored PII. Do not summarize, cap, or independently reconstruct it.\n\n### Examined protections and scope correction\n\nRead the Stage-1 evaluator/producer, consumer, candidate matcher, planner continuation, and failure bookkeeping. Existing RESPOND/addressing checks, receipt-based egress rejection, action-owned early-reply suppression, effect-grounding, trusted-audience enforcement, pre-entry abort/response checks, canonical speaker identity, and RECENT_MESSAGES refresh must survive. [Candidate matching](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/core/src/services/message.ts#L4805-L4827) recognizes canonical action names and similes but only requires one `asyncHandoff` candidate. It does not establish that the eventual planner tool is available/authorized; actual tool resolution occurs later. This is a reason to bind the proposed slow-work acknowledgment to actual routing/authority, not evidence that candidate matching itself grants tool execution.\n\nDeliver the cancellation/receipt repairs first, then extend the typed slow-work policy. Acknowledgment policy tests alone cannot establish cancellation correctness or truthful delivered history. Dependency installation, full test runner, live model, connector delivery, and audio were not executed.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n\n\n---\n\n\u003c!-- guardian-project19-source-plan-30681-2026-09-06:start --\u003e\n## Current implementation boundaries and delivery plan\n\nSource reviewed at `b02573194a1083dbe4401211a931af5679d4d764`. This is an implementation plan, not a live acknowledgement or audio measurement.\n\nThe canonical early-response path already has a [typed event](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L1862), but its [delivery callback returns only boolean or void](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L8653). The [producer](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L9736) checks addressing, RESPOND eligibility and grounded wording. Its actual [consumer](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L14698) is installed only for voice and allows only async-handoff candidates. Slow synchronous work and ordinary text acknowledgements therefore require an explicit policy extension; removing the async check alone would also add filler to fast work.\n\nThree delivery defects should be repaired before broadening that policy:\n\n- Ownership and cancellation are checked before awaited outgoing hooks and audience enforcement. The [consumer](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L14735) needs another check after preparation and immediately before transport dispatch, so a superseded or canceled turn cannot send a stale acknowledgement. Preserve the explicit `keepExistingResponses` behavior independently of cancellation.\n- The early path [persists the message, emits MESSAGE_SENT and records its ID before awaiting the transport](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L14787). A callback failure can leave delivery bookkeeping claiming success. The [final-response path](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L15399) already separates persistence from transport outcome and emits the sent event after transport succeeds; reuse that distinction. A persisted row is not a delivery receipt, and an ambiguous transport failure must not trigger a blind duplicate retry.\n- The [planner continuation](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.ts#L10165) records the proposed acknowledgement, although PII restoration, hooks and audience enforcement can change the actual payload. Return the complete accepted text and stable delivery ID from the consumer, then use that authoritative content for planner context and duplicate suppression.\n\n### Ordered implementation\n\n1. Define a narrow canonical early-delivery result covering skipped, accepted, failed and ambiguous outcomes, with accepted message identity and complete visible content. Keep persistence status distinct. Trace the existing `HandlerCallback` consumers before changing their public contract; an empty returned array alone is not established proof of failed delivery.\n2. Repair the early consumer's cancellation boundary, transport ordering and planner readback. Extend the real MessageService delivery tests, including the existing [failed-callback sent-event regression](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/core/src/services/message.turn-delivery-floor.test.ts#L318), rather than testing an isolated replacement callback.\n3. Add a typed progress decision tied to actual permitted routing or selected work. Distinguish slow synchronous retrieval and multi-action execution from fast direct answers. Use one per-turn acknowledgement identity through canonical text/voice delivery; do not add canned callbacks to individual actions. Candidate matching alone is not proof that the eventual action is available or authorized.\n4. Preserve final-response ownership. An acknowledgement cannot mark a multi-action turn complete, replace a tool result, or imply an applied effect. Use actual [navigation state and freshness](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/agent/src/api/views-routes.ts#L341) for a completed switch, and ensure the planner sees the settled navigation result. Coordinate with the pending S2 conditional retry-consent reply work so preserving an actionable final reply is not mistaken for duplicate acknowledgement suppression.\n5. Carry acknowledgement identity through stream/final promotion and voice scheduling. Preserve the HTTP [append-only stream versus final-response check](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/agent/src/api/chat-routes.ts#L4269); do not prepend untracked acknowledgement text that later makes the authoritative final transcript diverge. Record acknowledgement and substantive-response timings separately.\n\n### Behavioral acceptance and evidence\n\n- A real slow retrieval and a sequential multi-action turn each deliver one natural acknowledgement before completion, then a truthful substantive result. Fast direct answers have no filler. Failed actions retain their typed errors and receive actionable conversational wording.\n- A deferred outgoing hook followed by STOP, cancellation or a competing turn cannot dispatch the old acknowledgement. IGNORE and ambient speech remain silent. Exercise both normal replacement and explicit `keepExistingResponses` policies.\n- A hook that changes acknowledgement text produces identical accepted transport content and subsequent complete planner context. Stream/final promotion does not create a second message or repeat audio.\n- Callback rejection before acceptance produces no sent claim; ambiguous acceptance is recorded distinctly without automatic duplicate delivery. Persistence, event-listener and transport failures remain inspectable. Test restart recovery if pending delivery records are introduced.\n- Successful navigation acknowledgement agrees with its actual receipt; rejected navigation never claims a completed switch. The final answer retains the result and any remaining work.\n- Record time to acknowledgement text/audio, time to substantive text/audio and final completion separately. Inspect full live-model trajectories, action/delivery receipts, final stored messages and actual audio. Listen to the acknowledgement/final sequence. Produce the applicable full-app desktop/mobile captures, recording, backend/frontend logs and a canonical verified bundle with exact source provenance.\n\nRun owning-package checks and root verification; run the app audit when the implementation changes the rendered app. Source-level tests, deterministic transport responses and an early first token do not establish live voice correctness or reduced substantive latency.\n\n\u003c!-- guardian-project19-source-plan-30681-2026-09-06:end --\u003e\n\n\n\u003c!-- sprint1-cancellation-delivery-deeper-review --\u003e\n# 30681 cancellation and acknowledgement follow-up\n\nRead-only review of cached origin/develop `9d2352808c152090a06563026bc8ba7f8b3b399a`. Its message.ts blob `bd15ab0f6b53ef1ac9eca4b87ab77757efcdcf72` exactly matches the inspected integrated checkout HEAD930e0a. File SHA256 `b7dbb41307ad1988334ffa6e76c6272f55b3fe96b4775a745b5a09fa946de2a1`. Live issue body saved in `30681-followup-live.json`. No source edits, tests, provider requests, or timing/audio claims. Cached develop was not freshly fetched by this review; root owns integration refs.\n\n## Findings and necessary plan amendments\n\n**P1 — broadened acknowledgement policy must also change terminal recovery ownership.** The existing appendix correctly asks for a substantive final outcome but does not identify the recovery condition that would defeat it. [message.ts:2420](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L2420) recovers only when no early reply was sent, planned text exists, an action supplies userFacingText, or an action failed. Thus an accepted early acknowledgement plus successful synchronous work, empty final text, and no action-owned visible text produces `recover:false`. [message.ts:11068](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L11068) explicitly justifies this asymmetry by the current async-handoff restriction. This is an existing deliberate policy, not a newly proven production failure in synchronous acknowledgement delivery (that delivery is currently suppressed). Removing that restriction alone creates the counterexample. Carry a typed completion owner (`this turn` versus `registered later relay`) into recovery and require a final outcome for synchronous work; candidate asyncHandoff metadata is not proof that the selected action actually created a relay. Acceptance must cover a candidate handoff that resolves instead to successful synchronous work and a handoff that reports success without a registered final-delivery owner. Do not manufacture a completed message merely from success booleans.\n\n**P1 — the final simple-delivery path is an ordering reference, not a fully safe cancellation template.** The appendix's comparison is valid specifically for MESSAGE_SENT after callback success. However [message.ts:15193](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L15193) checks current-response ownership before awaited audience enforcement and outgoing hooks; [message.ts:15322](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L15322) performs another awaited audience pass, then dispatches at [message.ts:15354](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L15354) without a local renewed ownership/abort check. A competing turn or cancellation during those awaits can reach a supplied callback in the generic core path. A transport may independently reject it, so this is not proof that every HTTP/voice transport actually sends stale bytes. The implementation should use a shared final eligibility fence immediately before each acknowledgement/final dispatch, preserving explicit `keepExistingResponses` and effect-preserving supersession rules rather than treating all old responses alike. Acceptance should defer hooks independently for acknowledgement and final answer and inspect callback invocation as well as transport cancellation, persisted records, and terminal reason.\n\n**P1 — acknowledgement event/persistence awaits are additional cancellation and delivery-failure windows.** The previously identified early path remains unchanged: [message.ts:14747](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L14747) checks abort before hooks, [message.ts:14788](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L14788) persists, emits MESSAGE_SENT, pushes the memory and records its ID, then invokes transport. This means an event listener can block delivery after a durable row exists; callback failure can leave sent claims and early-memory bookkeeping. The outer error handler [message.ts:14917](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L14917) rethrows a known cancellation but cannot retract any earlier persistence/event. Add deferred persistence and deferred MESSAGE_SENT listeners to the acceptance matrix, not just outgoing hooks. Separate accepted transport state from persisted state and emit the sent claim only under the designated transport contract. After an ambiguous send, reuse the same logical acknowledgement ID and reconcile; do not generate a fresh UUID on blind retry.\n\n**P2 — exact accepted content is required for both recovery and duplicate checks.** [message.ts:9751](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L9751) restores PII only on the emitted event, while [message.ts:10173](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L10173) inserts the pre-restoration proposed text in planner context. Hooks/audience enforcement can further transform payload. [message.ts:10940](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L10940) compares the final response against that proposed text. The existing appendix accurately identifies this; acceptance should include both (a) actual accepted text that the final model repeats and (b) materially new final content sharing the acknowledgement prefix. Only the first is a duplicate. No item/context truncation or lexical prefix suppression should replace a stable message/role identity.\n\n## Existing protections to retain\n\n- [message.ts:9736](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L9736) gates early reply on RESPOND and addressing; [message.ts:14700](https://github.com/elizaOS/eliza/blob/9d2352808c152090a06563026bc8ba7f8b3b399a/packages/core/src/services/message.ts#L14700) restricts the actual consumer to voice async-handoff candidates. This is why synchronous/text acknowledgement remains missing rather than already implemented.\n- Early egress rejects ungrounded completion claims; final egress validates grounded effect claims separately.\n- Final simple delivery uses Promise.allSettled for callback/persistence, emits MESSAGE_SENT only after callback resolves, and preserves both failures. Do not regress that while introducing typed acceptance.\n- Recovery explicitly preserves deliberate STOP/IGNORE/suppressPlannerReply silence and existing delivered media. One acknowledgement plus one final answer is a per-logical-turn contract, not a requirement to speak after STOP or duplicate an action's already delivered substantive result.\n- No navigation producer or consumer changes were examined or proposed here; S2 navigation ownership stays separate.\n\n## Minimal additional acceptance sequences\n\n1. Slow synchronous multi-action turn: ack accepted; all tools succeed; planner final empty. Must retain a truthful completion/error outcome rather than silently relying on an async relay that was never registered.\n2. Ack preparation or persistence paused; cancellation arrives; resume. No new transport dispatch after the cancellation fence, no false sent claim; retained durable data explicitly classified.\n3. Ack accepted; final preparation paused; replacement arrives. Respect normal supersession versus intentional retained-result policy; no stale extra speech.\n4. Transport accepted but callback completion becomes ambiguous; retry/reconnect. At most one logical acknowledgement and no duplicate audio, with ambiguity exposed rather than assumed failure.\n5. Hook changes complete acknowledgement text; planner receives exact accepted content and the stable identity; a later materially new final answer remains deliverable.\n\nThese are source-backed implementation and test requirements. They do not establish live acknowledgement latency, voice dispatch correctness, or complete issue acceptance.\n"])</script><script>self.__next_f.push([1,"1d:T873d,"])</script><script>self.__next_f.push([1,"## Concrete gap\nThe requested product policy is to cache reusable acknowledgements/opening phrases of at most five words. [packages/ui/src/voice/voice-chat-playback.ts:24](https://github.com/elizaOS/eliza/blob/06963a19b01c3720aedcf77c77434936e8654270/packages/ui/src/voice/voice-chat-playback.ts#L24) ignores input length and permits every non-remainder segment. The local [plugins/plugin-local-inference/src/services/voice/phrase-cache.ts:113](https://github.com/elizaOS/eliza/blob/06963a19b01c3720aedcf77c77434936e8654270/plugins/plugin-local-inference/src/services/voice/phrase-cache.ts#L113) permits nine whitespace-delimited words by default. Existing byte/LRU limits do not enforce phrase eligibility. This is source-confirmed behavior; no live cost or latency reduction has been measured yet.\n\n## Acceptance\n- Apply a documented, shared five-word eligibility contract to cache insertion and reuse on affected voice paths, including a short opening phrase within a longer complete reply.\n- Playing the same eligible phrase twice avoids a second provider synthesis. Six-plus-word speech remains complete, is synthesized normally, and is not cached. Never truncate speech to make it eligible.\n- Provider, voice, model, and synthesis-setting changes cannot replay incompatible cached audio; cancellation cannot replay stale audio.\n- Verify appropriate short continuation/remainder behavior instead of excluding all remainder segments solely by segment label.\n- Record hit/miss, provider dispatch count, retained bytes, and measured first-audio latency for cold/warm cases without logging private speech text.\n\n## Overlap and proof\nCoordinate with [#30356](https://github.com/elizaOS/eliza/issues/30356), which owns duplicate cache-warm synthesis and settlement. Share call-count evidence rather than introducing a second unmetered warmup. Respect playback changes in [#29492](https://github.com/elizaOS/eliza/pull/29492).\n\nTests must exercise synthesis/cache/playback boundaries, not just assert a five-word constant. Capture and inspect real audio and exact-SHA provider-call evidence demonstrating cache reuse, complete uncached output, cancellation, and voice changes. Use the canonical evidence bundle, owning-package tests/typecheck/lint, root verify, and applicable app audit.\n\nEstimate: 1.5–2.5 person-days; Nubs. Linked files were clean at the inspected HEAD; other shared-working-tree edits were preserved.\n\n\u003c!-- guardian-sprints-2026-09 --\u003e\n## Project 19 sprint allocation — 2026-09-05\n\n[Guardian MVP](https://github.com/orgs/elizaOS/projects/19), Sprint 1; owner @NubsCarson; complexity **Medium**. Plan **2 person-days**, research range 1.5–2.5; scheduled **2026-09-11 → 2026-09-14**. Estimates include focused validation; no live tests or implementation completion are claimed by this planning update. Assignment is planning ownership, not an active-work claim.\n\nSee the scoped acceptance and evidence requirements above. Dependencies and capacity are recorded in the Project 19 README; longer estimates consume reserve or require re-planning, never skipped verification.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n\u003c!-- guardian-project19-source-audit-2026-09-06 --\u003e\n## Critical source audit and implementation plan — 2026-09-06\n\nAudited develop snapshot: `8fea4f94c29c7712ce3caf303e3350150622d048`. Source/caller/test audit plus a tiny dependency-free Bun 1.3.14 behavior probe; no provider synthesis or acoustic acceptance was performed. Live issue #30356 remains open; draft #29492 remains OPEN/draft at `b209c79fe2ac1bde176204f078834f9352b8395c`.\n\n### Confirmed gaps and existing building blocks\n\n1. **The UI eligibility defect is still present.** [shouldCacheGeneratedSpeech, lines 24–29](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/voice/voice-chat-playback.ts#L24) ignores text and caches every non-remainder segment. This predicate is used by ElevenLabs, cloud and local TTS playback. Existing `sentence-streaming.test.ts:70` explicitly expects long-response caching and exclusion of short remainders; `useVoiceChat.playback-grace.test.tsx:384,465,510` tests reuse but its purportedly short strings exceed five words. Update these behavioral expectations instead of adding only a five-word constant assertion.\n2. **Local caches are not all nine-word caches.** [PhraseCache, lines 96–140](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-local-inference/src/services/voice/phrase-cache.ts#L96) allows nine whitespace-delimited words by default, with an overridable limit. Separately, [shared firstSentenceSnip](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/shared/src/voice/first-sentence-snip.ts#L291) uses a ten-word contract, and [CloudFirstLineCacheService](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/tts-first-line-cache.ts#L274) duplicates ten locally. Local disk insertion uses the shared ten-word limit (`first-line-cache.ts:487–494`). **Executed probe:** inserting `one two three four five six.` into the real source `PhraseCache` returned true, `get` returned the entry, and `firstSentenceSnip` returned wordCount 6. This confirms policy failure without claiming audible synthesis.\n3. **Identity isolation needs repair, not only length policy.** [UI keys, lines 574–608](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/hooks/useVoiceChat.ts#L574) key local/cloud audio by provider label plus normalized text only. The process-wide cache survives hook instances, so a changed server-selected voice/model/settings can reuse incompatible audio. ElevenLabs includes those settings, but rounds numbers to two decimals while the request sends original values (`useVoiceChat.ts:1599–1607`), allowing distinct settings to collide. Explicit task cache keys also bypass recomputing eligibility/identity at synthesis. These are source-confirmed missing identity distinctions; audible wrong-voice replay was not performed.\n4. **Some safeguards already exist.** UI audio has byte-bounded LRU; local PhraseCache has entry/sample bounds and seed insertion passes through `put`; local scheduler direct synthesis limits reuse to its configured voice ID (`scheduler.ts:319`); disk/cloud caches include provider/voice/revision/settings/codec identity. Reuse and strengthen these mechanisms, rather than adding another cache.\n5. **Short opening within a long response remains incomplete.** [Cloud route lines 517–523](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/api/v1/voice/tts/route.ts#L517) intentionally serves only whole-input MP3 hits to avoid codec concatenation hazards. Kokoro is similarly whole-input and feature-gated (`route.ts:352–368`). A generic local wrapper can extract opening sentences, but searches found production exports and tests rather than a confirmed production registration using that wrapper. Its [miss population](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-local-inference/src/services/voice/wrap-with-first-line-cache.ts#L183) invokes the inner synthesizer again (`:245`); do not introduce it as an unmetered shortcut. #30356 owns dispatch/settlement and duplicate population review.\n\n### Ordered implementation work and ownership\n\n1. **Shared/UI/local/cloud owners agree one cache-only policy.** Put eligibility and word counting in the browser-safe shared voice contract; document Unicode, contractions, hyphens, numbers, punctuation-only input and languages without whitespace. Reuse the existing Unicode-aware `wordCount` where appropriate, documenting its segmentation semantics instead of pretending it provides universal linguistic word boundaries. Require 1–5 words on the actual complete phrase. Preserve complete six-plus-word speech and complete model context; never slice a reply down to five words.\n2. **Enforce at all affected entry/reuse boundaries.** Apply the shared predicate to UI reads/writes (including supplied task keys), PhraseCache `put/get/has/seed`, local disk cache and cloud manifest insertion/reuse. Audit configurable local limits so a larger value cannot bypass product policy. Recompute eligibility from actual text rather than trusting supplied metadata. Version the cache algorithm/key or reject old six-plus-word entries at read so previously persisted audio cannot keep violating policy. Keep byte/TTL/LRU policies independent of eligibility.\n3. **Make synthesis identity immutable and complete.** Snapshot provider, resolved voice/revision, model, exact effective settings, sample rate, codec, route/account scope where relevant, and text interpretation policy for each queued task. Hash canonical settings without lossy rounding. The UI must obtain authoritative server-selected identity/revision, or bypass client reuse when that identity is unavailable. Do not fabricate a default identity. On config change, old async synthesis may not populate or play under a new identity. Preserve generation checks around fetch/decode/playback and use the same identity for cache lookup and provider dispatch.\n4. **Support eligible openings without breaking full replies.** Coordinate with #30679 on segment boundaries: reuse a naturally complete short opening and synthesize its entire ordered remainder. Do not split every response at five words simply to gain cache hits. Where compressed audio cannot be concatenated safely, decode/schedule separate complete clips or use an already supported PCM streaming boundary; preserve sample rate, EOS, prosody and final drain. For a whole-input cache miss, retain the bytes from the paid synthesis directly. For long-input opening extraction, use a proved single-dispatch segmentation path; any additional provider call must be intentionally authorized, accounted and owned with #30356, never background-unmetered warming.\n5. **Add payload-free observability.** Report policy version, eligibility reason, hit/miss, scope-safe identity hash, retained bytes, provider dispatch count and first actual audio timing per turn/segment. Keep private phrase text out of new diagnostics; the generic wrapper's error log currently interpolates phrase text (`wrap-with-first-line-cache.ts:263`) and should be repaired if that path is brought into scope. Distinguish a local hit from a cloud/server hit so request counts are meaningful.\n\n### Behavioral validation and evidence\n\n- Exercise actual synthesis/cache/playback boundaries for an eligible phrase twice (one provider synthesis), exactly five versus six words (six words always synthesized in full and never retained/reused), short remainder, punctuation-free eligible utterance, an eligible opening followed by a long reply, Unicode/contractions/numbers, empty audio, provider failure and cache eviction. Assert complete spoken content/order as well as provider calls; reject duplicate warming and stale-generation replay.\n- Use different distinguishable PCM fixtures for provider/voice/model/settings changes, including two settings that round to the same two-decimal value. Test two hook instances, different backend identity revisions, cancellation during body-read/decode, old persisted cache entries, seed paths and untrusted metadata. Use a real temporary local cache store and the existing cloud service/route harness for persistence boundaries; mocked successful cache calls alone are insufficient.\n- Extend existing `sentence-streaming`, `playback-grace`, `phrase-cache`, `voice.test`, first-sentence-snip, local first-line-cache/wrapper and cloud voice TTS/cache suites. Run package tests/typecheck/read-only lint for each modified owner, root verify and applicable app audit. No full suite was run in this research checkout because its dependency harness is absent; the small source probe is the only execution claim.\n- Capture real cold/warm audio and exact-SHA provider dispatch evidence for each changed browser/cloud and desktop/local path: eligible reuse, complete uncached six-plus-word reply, opening/remainder continuity, interruption and voice switch. Report retained bytes and first-audio distributions, then human-listen for voice identity, missing/repeated words and prosody. Use canonical VoiceScenario/workbench and verified evidence bundles with complete trajectories, applicable UI captures/video and backend/frontend logs. Native/mobile or realtime paths that bypass these caches must be identified rather than counted as covered.\n\nPlanning: the original 1.5–2.5 person-day estimate covers a narrow eligibility patch, but complete acceptance spans UI identity and shared/local/cloud cache policy plus safe opening/remainder playback. Re-estimate jointly with #30679 and #30356 after their owners agree the single-dispatch contract. Do not call a two-line threshold change complete for the current acceptance criteria.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent deep review: #30680\n\nSource revision: `b676280384b15df54204276e34bb8740db26936f`. The original 1–5-word policy gap remains; repairing eligibility alone leaves incorrect audio identity and a queue-time race.\n\n### P1 — Queued ElevenLabs key can bypass the currently selected provider on non-native playback (reproduced at cache-selection boundary)\n\n[Queueing](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L2681-L2703) attaches an ElevenLabs key using the current configuration. [Queue execution](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L2382-L2392) independently reads the latest provider/configuration. Both [local](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L2054-L2067) and [cloud](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L1818-L1831) prioritize `task.cacheKey` without checking its provider or identity. Thus an enqueued task for voice A, held behind playback, can execute after switching to local and reuse ElevenLabs A bytes. On a miss, local synthesis is stored under the old ElevenLabs key at lines 2102–2103. Changing only ElevenLabs voice has the analogous old-key/new-voice mismatch.\n\nExecuted `bun /tmp/guardian-project19-deep-review/probe-30680.ts`: source-extracted unchanged key builders plus the production local cache-selection prefix. A local task supplied the real ElevenLabs key for “Hello” returned `cached:true` and the bytes held under that ElevenLabs key. This proves the bypass in cache selection, not audio playback or a rendered settings interaction. Configuration is assigned to `voiceConfigRef.current` on every render at lines 442–443; the hook has no config-change cancellation effect guarding this queue boundary.\n\nScope correction from independent caller review: this cache-key bypass is on the non-native/Web Audio branches. [Capacitor native execution](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L2415-L2462) routes through TalkMode and continues before these local/cloud cache lookups. Do not report this particular bypass as reproduced on native iOS/Android. Native configuration behavior needs its own adapter evidence.\n\nAmend implementation: choose one explicit policy—immutable synthesis descriptor captured with each task, or cancellation/requeue under a new voice generation on settings changes. Derive keys from that same descriptor at lookup **and** insertion. Remove raw caller-key precedence or validate it against the descriptor; checking only provider label misses voice/model/settings changes. Test with a blocked first clip, queued second clip, provider switch, then release. Assert no bytes from the old provider are played by the new provider and no new-provider bytes enter the old key. Include a cache miss, not only hit.\n\n### P2 — Text/setting normalization creates collisions despite different synthesis requests (reproduced)\n\nThe [key builders](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L574-L608) normalize case/NFKC and round settings to two decimals; the [ElevenLabs request](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/hooks/useVoiceChat.ts#L1599-L1610) sends original text and unrounded settings. The source-extracted builder probe confirms `US` and `us` collide, as do speed `1.001` and `1.004`. The local endpoint likewise receives original text at lines 2080–2087. Therefore cache equality is weaker than request equality. No provider call was made and no specific pronunciation difference is claimed; the defect is reusing an answer for an unequal synthesis request.\n\nUse an exact canonical **request** representation: preserve case and distinctions the synthesizer receives, or normalize once before both synthesis and key generation. Do not fix the hash while retaining a different synthesis payload. Parent independently reproduced the analogous actual `PhraseCache` case collision; its [scheduler](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-local-inference/src/services/voice/scheduler.ts#L300-L375) uses the original text for backend synthesis. Acceptance should cover acronyms/case, compatibility characters, fractional settings, voice identity and output format with distinct provider requests; avoid assuming an audible difference merely from key inequality.\n\n### Examined protections and corrections\n\nThe UI cache is [bounded by bytes and entries with LRU promotion](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/voice/voice-chat-types.ts#L405-L433); “unbounded cache” would be false. The queued provider branches fail closed instead of silently falling back after a configured engine fails; the stale-key bug bypasses this protection before any provider request. Local scheduler direct synthesis explicitly bypasses phrase-cache use for a per-request voice override whose ID differs from the preset, and a current test at `voice.test.ts` covers override isolation. Do not describe every direct local voice override as unsafe. Its constructor retains a readonly preset reference and original voice ID; a live same-ID model/settings mutation has **not** been established and should not be asserted as a reproduced defect without tracing a real mutator.\n\nPolicy repair still needs consistent eligibility on lookup, population, seeds and supplied keys, with long text synthesized completely. The new mandatory acceptance above covers identity/time-of-use, which a 5-word/6-word table alone misses. No dependencies installed, device/audio actions, paid calls, or full Vitest suite executed.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n\n\n---\n\n\u003c!-- guardian-project19-source-plan-30680-2026-09-06:start --\u003e\n\u003c!-- guardian-project19-current-cache-plan-2026-09-06:start --\u003e\n## Current implementation plan — five-word speech caching\n\nReviewed source: `b02573194a1083dbe4401211a931af5679d4d764`. This is a source and caller review, not a provider-call, acoustic, latency, or completion receipt.\n\n### Implemented foundations\n\n- Buffered UI playback already captures each task's voice configuration, prepares the next segment through the same provider functions, and checks generation and cancellation before and after preparation and decoding. Oversized decoded lookahead is retained as encoded audio until playback without another synthesis request. Preserve these safeguards. [Buffered preparation and playback](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/ui/src/hooks/useVoiceChat.ts#L2270)\n- The UI has one process-wide audio cache with byte and entry limits. Local voice scheduling has an existing phrase cache; disk and cloud first-line caches already distinguish provider, voice revision, codec, sample rate, and synthesis settings. Extend these owners rather than introducing another cache. [UI audio cache](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/ui/src/voice/voice-chat-types.ts#L398), [local disk identity](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/plugins/plugin-local-inference/src/services/voice/first-line-cache.ts#L71)\n- Cloud TTS populates eligible compressed audio from the already-produced provider stream. Its whole-input restriction avoids unsafe prefix/remainder concatenation. Kokoro caching is separately feature-gated. Preserve provider selection and billing settlement. [Cloud population](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/cloud/api/v1/voice/tts/route.ts#L864), [Kokoro eligibility](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/cloud/api/v1/voice/tts/route.ts#L352)\n\n### Remaining source-confirmed gaps\n\n1. UI eligibility ignores the text and caches every non-remainder segment. Local `PhraseCache` defaults to nine whitespace-delimited words; shared first-sentence extraction and the cloud service permit ten. Short remainders are excluded by label even when their content should qualify. [UI predicate](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/ui/src/voice/voice-chat-playback.ts#L25), [phrase cache](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/plugins/plugin-local-inference/src/services/voice/phrase-cache.ts#L105), [shared sentence policy](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/shared/src/voice/first-sentence-snip.ts#L291)\n2. Insertion checks alone cannot enforce the policy. Existing disk/cloud retrieval can return previously stored longer entries; disk insertion accepts an optional supplied word count, and cloud insertion trusts its supplied count. Explicit UI task cache keys also bypass recomputing eligibility. Count the actual text and enforce eligibility on both insertion and reuse. [Disk reads](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/plugins/plugin-local-inference/src/services/voice/first-line-cache.ts#L420), [disk insertion](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/plugins/plugin-local-inference/src/services/voice/first-line-cache.ts#L490), [cloud reads and insertion](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/cloud/shared/src/lib/services/tts-first-line-cache.ts#L293)\n3. UI local/cloud keys contain only provider label and normalized text. ElevenLabs keys round numeric settings to two decimal places while synthesis uses the original settings. Capturing configuration per task does not repair these cache-key collisions or identify server-selected defaults. [UI key construction](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/packages/ui/src/hooks/useVoiceChat.ts#L608)\n4. The exported local first-line wrapper performs full synthesis and then separate prefix population on a miss. No non-test invocation of that wrapper was found in this snapshot; this is an integration seam, not evidence of a deployed duplicate-call path. Coordinate its population and in-flight ownership with #30356 before wiring or modifying it. [Wrapper and population](https://github.com/elizaOS/eliza/blob/b02573194a1083dbe4401211a931af5679d4d764/plugins/plugin-local-inference/src/services/voice/wrap-with-first-line-cache.ts#L134)\n\n### Ordered implementation\n\n1. **Shared eligibility contract:** implement one documented one-to-five-word predicate using the existing shared Unicode-aware counting conventions. Define empty text, punctuation, contractions, and unspaced-language behavior. Apply it to UI, local phrase seeds/live insertion, disk, and cloud insertion and retrieval. Reject caller-supplied count mismatches. Existing longer entries must miss after the policy change; use existing versioning or invalidation mechanisms. Never truncate a phrase, reply, or remainder to obtain eligibility.\n2. **Exact synthesis identity:** derive keys from the effective provider, model, voice/revision, exact synthesis settings, codec/sample rate, and relevant runtime/account endpoint identity. Resolve server-selected defaults through the existing configuration or response contract; unavailable identity means bypassing reuse. Avoid normalization that merges text the synthesizer would pronounce differently. Apply the same identity checks to explicit task keys and lookahead preparation.\n3. **Complete ordered playback:** use the existing lossless segmentation to cache a complete eligible opening phrase within a longer reply, then synthesize and play the complete remainder in order. A six-plus-word segment must remain complete and uncached. Permit eligible short continuations based on content, not segment label. Do not split arbitrary prose at five words merely to manufacture cache hits. Retain backend whole-input misses where the consumer cannot safely assemble audio; do not concatenate incompatible compressed streams.\n4. **Cancellation and concurrency:** preserve generation checks, immutable task configuration, fetch aborts, and stale-result rejection. Only complete successful audio may enter a cache. Exercise cancellation after a hit, during synthesis, during prefetch, and immediately before a new turn. If #30356 introduces shared in-flight synthesis, its existing owner must distinguish cancellation of one consumer from settlement of the shared producer. No hidden warmup dispatches or duplicate caches.\n5. **Observability:** add non-content hit/miss and eligibility reasons, provider dispatch counts, retained bytes, and cold/warm first-audio timing at existing owners. A UI cache hit suppresses a backend request; a backend cache hit suppresses provider synthesis. Report these separately, without private speech text or credentials. Byte reuse alone does not establish measured cost savings.\n\n### Acceptance and evidence\n\n| Boundary | Required observable result |\n| --- | --- |\n| Buffered UI hook, provider transport, and playback | Repeat an exact eligible phrase and a short final remainder; verify no second provider synthesis and complete audible playback. Play an eligible opener followed by a long remainder and verify ordered, lossless speech. Six-plus-word segments must dispatch normally and remain uncached. |\n| Cache identity | Prime audio, then change provider, model, voice/revision, codec/settings, and runtime/account endpoint. Include two ElevenLabs settings differing by less than `0.01`. Incompatible bytes must not replay. |\n| Cancellation | Cancel cached playback, synthesis, and lookahead; immediately begin a new turn. No stale playback, partial-audio insertion, or old completion clearing the new queue. |\n| Local scheduler and persisted caches | Exercise five/six-word seeds, live insertion, restored legacy entries, incorrect supplied counts, voice-preset changes, and existing sample/byte limits. Verify actual backend call counts and complete long-text input. |\n| Cloud route and storage | Exercise short whole-input hits, long-input misses, feature-disabled/bypass paths, voice/settings/scope separation, and population failures. Verify provider dispatch and billing settlement separately. Real DB/object-store execution is required for end-to-end claims. |\n| Native and realtime bypasses | Preserve existing TalkMode, browser speech synthesis, and realtime behavior. They do not expose the buffered bytes used by this UI cache; do not claim cache coverage or add a parallel cache merely to fill a matrix row. |\n\nRun the owning package tests, typechecks and lint, root `bun run verify`, and applicable app audit. Record normal-app cold/warm playback with a real configured provider at the final source revision, inspect complete audio, and attach provider-call counts and timing without speech/key leakage. Include applicable desktop/mobile captures and the canonical verified evidence bundle. Deterministic cache tests, a successful HTTP response, and direct scheduler invocation must remain distinct from live provider and product playback proof.\n\nImplementation ownership should follow the existing shared/UI, local voice, and cloud cache boundaries, with #30356 coordinating population and settlement. Completion requires the observable acceptance above, not a changed constant or a cache inventory alone.\n\u003c!-- guardian-project19-current-cache-plan-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-source-plan-30680-2026-09-06:end --\u003e\n\n\n\u003c!-- sprint1-cache-current-reevaluation-20260906 --\u003e\n# Independent #30680 plan reevaluation\n\nRead-only review against develop40c8daddb0, with merged9743 voice work present. Verified inspected UI hook/playback, local voice subtree and cloud route/cache blobs are unchanged between40c8 and current689d checkout. No tests, providers, acoustic capture, edits or PR operations. Prior appendix at b025 is largely sound; no basis to narrow acceptance to changing a five-word constant.\n\n## Concrete additions needed\n\n1. **UI cache admission currently precedes both cancellation revalidation and successful audio decoding.** useVoiceChat.ts:1791-1795 (ElevenLabs),1986-1987 (cloud),2042-2044 (local) inserts response bytes immediately after arrayBuffer. prepareBufferedSpeech only checks generation/abort after the provider helper returns (2308), then decodes at2316. Consequently a nonempty HTTP200 body that decodeAudioData rejects remains in the shared byte cache, and a later repeat can reuse the same bad entry without another synthesis. Likewise a resolved body followed by cancellation can be inserted before the outer stale check. The existing post-decode checks correctly prevent stale playback; they do not establish valid cache admission. Amend step4 and acceptance: delay/promote admission only after complete usable decode plus current generation, or quarantine/evict failed candidates at the existing cache owner. Test HTTP200 nonaudio/truncated encoded response and repeat request: invalid bytes must not become a persistent cache hit. Add cancellation between body resolution and decode settlement. Do not demand two syntheses to validate a single entry, and do not infer complete speech semantics merely from decodability.\n\n2. **Native mobile bypass is stronger than a provider-choice matrix suggests.** At useVoiceChat.ts:2515-2550, any Capacitor native platform enters TalkMode before the cloud/ElevenLabs/local buffered branches, passes useLocalInferenceTts:true, and continues on success. It can fall back to ElizaPlayVoice if the method is unavailable; errors fail closed. Existing playback telemetry stamps provider:'browser',cached:false even for native local inference. The appendix correctly excludes native from UI-byte-cache coverage, but add explicit run classification: selected voice config is not evidence that native used that buffered provider; use actual TalkMode/ElizaPlayVoice/native backend receipt and classify misleading generic telemetry separately. Do not count native repeated utterances as UI-cache misses or evidence of cloud/provider dispatch reduction. Browser speechSynthesis and realtime remain separate bypass owners.\n\n3. **Direct local filler reads need explicit identity/eligibility acceptance, not only scheduler tests.** engine-bridge.ts:1714-1723 playFirstAudioFiller reads PhraseCache and writes PCM straight to the ring buffer; the live turn-controller calls this on speech-start (turn-controller.ts:276,368). It bypasses scheduler.synthesizeText's explicit voiceId equality check (scheduler.ts:319) and ordinary dispatch telemetry. Runtime preset is normally fixed, so this is not a demonstrated live wrong-voice defect. However changing eligibility/seed restoration or allowing configurable/shared cache identity must cover this actual consumer as well as synthesizeText, dispatchPhrase and prewarmPhrases. Assert filler cache misses do not trigger hidden provider warming; seeded/retained audio uses the current voice/backend/sample identity. Keep filler speech distinct from the user's full requested reply and do not measure its masking timestamp as substantive reply first-audio.\n\n## Counterevidence and preserved plan boundaries\n\n- The local disk wrapper remains an exported seam with no non-test caller discovered; do not describe its separate miss-prefix population as a currently deployed duplicate request. Active local HTTP synthesis instead reaches engine/bridge synthesizeTextToWav→scheduler.synthesizeText; streaming voice reaches dispatchPhrase. Neither justifies creating another cache.\n- Cloud actual population at route.ts:864-904 requires the whole input and tees the existing provider stream. An older nearby comment at498 still says long messages populate in background, but the executable condition disproves it. The appendix's whole-input restriction is correct; do not implement prefix concatenation from that stale comment.\n- Shared wordCount is Unicode regex-aware (first-sentence-snip.ts:243), while PhraseCache is whitespace-delimited. Unspaced-script semantics still need an explicit policy decision; regex “one word” does not impose an audio/byte limit. Preserve independent resource bounds, and never trim source speech to hit either eligibility or memory limits.\n- Text identity changes must cover all tiers, not just ElevenLabs numeric rounding: UI normalizeCacheText lowercases/NFKC, local canonicalizePhraseText lowercases, shared normalizeSnip lowercases/NFC. Examples where case changes pronunciation must miss under the chosen exact-synthesis identity. Step2 already requires this; make cross-tier case/Unicode fixtures explicit rather than claiming existing normalized keys are acoustically equivalent.\n- Scope-aware cloud storage/provider selection and billing settlement must remain intact. Cached bytes, HTTP200, selected provider labels and timestamps do not independently prove audible completion or cost reduction.\n\nDisposition: retain full existing implementation/real-evidence plan, incorporate the three concrete caller/acceptance additions above. No new general cache, no hidden prewarming, no truncation, no claim of completed #30680 behavior.\n"])</script><script>self.__next_f.push([1,"1e:T9b9d,"])</script><script>self.__next_f.push([1,"## Problem and scope\nThe user reports the final word or section arriving separately after the rest of a spoken response. Source inspection identifies a relevant segmentation/playback boundary, but this research has not reproduced the audible defect or measured its root cause.\n\n[packages/ui/src/hooks/useVoiceChat.ts:2670](https://github.com/elizaOS/eliza/blob/06963a19b01c3720aedcf77c77434936e8654270/packages/ui/src/hooks/useVoiceChat.ts#L2670) queues unsent prefixes and final remainders; playback is serialized. [packages/ui/src/voice/voice-chat-types.ts:388](https://github.com/elizaOS/eliza/blob/06963a19b01c3720aedcf77c77434936e8654270/packages/ui/src/voice/voice-chat-types.ts#L388) configures first/later chunk thresholds and debounce. The local [plugins/plugin-local-inference/src/services/voice/phrase-chunker.ts:47](https://github.com/elizaOS/eliza/blob/06963a19b01c3720aedcf77c77434936e8654270/plugins/plugin-local-inference/src/services/voice/phrase-chunker.ts#L47) already supports timer and final flushes. Investigate the active product path before changing these policies.\n\n## Acceptance\n- Reproduce the reported symptom on the actual configured provider and capture final text arrival, synthesis dispatch/first PCM, previous clip end, next clip start, and final playback completion.\n- Preserve every speakable token exactly once and in order across a one-word tail, punctuation-free ending, slow token arrival, multiple clauses, Unicode/numbers, stream-to-final message promotion, interruption, and the next turn.\n- Fix the measured cause and demonstrate before/after gap measurements plus human-listened natural speech; do not trade reduced delay for clipped words or degraded prosody.\n- Verify browser/cloud and desktop/local paths separately where affected; explicitly identify any untested path.\n\n## Existing work and evidence\nCoordinate with Nubs's draft [#29492](https://github.com/elizaOS/eliza/pull/29492), which owns duplex/handoff/crossfade and still requires real audible acceptance. Reuse tracing under [#28214](https://github.com/elizaOS/eliza/issues/28214); distinguish PSTN lifecycle failures in [#26722](https://github.com/elizaOS/eliza/issues/26722). Use the canonical VoiceScenario/workbench rather than a new harness. Inspect real audio, provider/transport logs, and complete model trajectories in a verified evidence bundle, tied to installed/deployed SHA. Run owning-package checks, root verify, and applicable app audit. A mock-only green is not acoustic proof.\n\nEstimate: 2–4 person-days; Nubs. Linked files were clean at the inspected HEAD; other shared-working-tree edits were preserved.\n\n\u003c!-- guardian-sprints-2026-09 --\u003e\n## Project 19 sprint allocation — 2026-09-05\n\n[Guardian MVP](https://github.com/orgs/elizaOS/projects/19), Sprint 1; owner @NubsCarson; complexity **High**. Plan **3 person-days**, research range 2–4; scheduled **2026-09-08 → 2026-09-10**. Estimates include focused validation; no live tests or implementation completion are claimed by this planning update. Assignment is planning ownership, not an active-work claim.\n\nSee the scoped acceptance and evidence requirements above. Dependencies and capacity are recorded in the Project 19 README; longer estimates consume reserve or require re-planning, never skipped verification.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n\u003c!-- guardian-project19-source-audit-2026-09-06 --\u003e\n## Critical source audit and implementation plan — 2026-09-06\n\nAudited develop snapshot: `8fea4f94c29c7712ce3caf303e3350150622d048`. This is a source/caller/test review, not a reproduced acoustic failure or a completion claim. No dependency installation, provider request, microphone capture, or audio playback was performed. Issue body/comments and draft #29492 were read live; the latter is OPEN and draft at `b209c79fe2ac1bde176204f078834f9352b8395c`, with genuine audible overlap acceptance still pending.\n\n### What already exists and what is actually missing\n\n- **There are distinct active product paths.** [useShellVoiceOutput, lines 107–151](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/components/shell/useShellVoiceOutput.ts#L107) explicitly disables the message-to-TTS watcher when Cartesia realtime is enabled because Sonic already streams audio. The old issue's `useVoiceChat` links are relevant to non-realtime output and explicit playback, but are not evidence that this code causes a realtime Talk symptom. Record the real mode, endpoint, selected provider/model/voice, device, and installed SHA before implementing a fix.\n- **Legacy output does queue a final remainder.** [queueAssistantSpeech, lines 2805–2876](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/hooks/useVoiceChat.ts#L2805) tracks the submitted prefix, promotes temporary message IDs, flushes final text, and debounces incomplete text. The [24/88 character thresholds and 170 ms debounce](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/voice/voice-chat-types.ts#L387) are present, not missing functionality.\n- **Source-confirmed latency mechanism, acoustic attribution unverified:** [the queue worker](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/hooks/useVoiceChat.ts#L2381) serially awaits each provider's speak operation. For local and ElevenLabs paths, fetching the entire response, decoding, and playback completion are inside that operation ([ElevenLabs lines 1767–1774](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/hooks/useVoiceChat.ts#L1767), [local lines 2101–2107](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/hooks/useVoiceChat.ts#L2101)). A queued next clip therefore starts its synthesis after prior playback finishes; the resulting gap includes network/synthesis/decode latency. Whether that is the reported final-word symptom needs timestamps and listening.\n- **Segmentation risks to reproduce:** threshold and debounce flushes can submit the current text without a complete word or sentence boundary. A subsequently arriving suffix can become a separate TTS utterance. The [remainder helper](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/ui/src/voice/voice-chat-playback.ts#L196) accepts case-insensitive/interior matches and returns an empty string when a submitted prefix is no longer found. Audit final text reconciliation and Unicode normalization explicitly; do not assume arbitrary final rewrites are lossless prefix extensions.\n- **Existing local support must be reused:** [scheduler final flushing](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-local-inference/src/services/voice/scheduler.ts#L287) and [timer-driven flushing](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-local-inference/src/services/voice/scheduler.ts#L894) already exist. Adding another chunker or reducing a timeout g
