arrative comments into current build ownership and consumer constraints.\n\n## Evidence plan\nReal Bun/esbuild fixture builds, failing-operation results, and imported emitted runtime values; affected real plugin builds; shared build regression suites and root verify. Screenshots/video, native hardware and live-model calls are N/A for deterministic build orchestration; emitted prompt text fidelity is exercised directly through compilation.\n\nImplementation follows the consolidated plugin cleanup reports.\n"])</script><script>self.__next_f.push([1,"15:T7aea,"])</script><script>self.__next_f.push([1,"## Product gap and Sprint 3 scope\n\nSupport one coherent update experience across iOS, Google Play Android, direct Android and elizaOS AOSP: discover → explain → download → verify → schedule/apply → restart/reboot → health confirmation → recover. Users and operators need truthful supported rollback controls, and maintainers need one release identity and policy model rather than independent update checkers. Classify which changes must ship through stores and which may be delivered as permitted content/configuration or OTA. This is a missing end-to-end capability, not a claim that all current update paths are broken.\n\nSprint 3 candidate October 3–16, 2026. **High complexity; 12 nominal person-days, range 8–18+**, split Shaw 7 (contracts/release/AOSP integration) and Nubs 5 (mobile UX/data boundary/device evidence). These are provisional implementation plus certification estimates; physical-target qualification, store review elapsed time and newly discovered hardware defects are additional dependencies, not assumed complete. Adding this item raises Sprint 3 from 48 to **60 candidate person-days** against 20 gross / approximately 16 practical capacity. Do not promise the full campaign within one sprint.\n\n## Existing owners and implementation to reuse\n\n- `packages/app-core/src/services/app-updates/update-policy.ts` already owns app distribution channels, authorities and UI snapshots: App Store, Play, sideload, AOSP image, desktop and web. Extend this contract with platform adapters and content/app/OS component state; do not create another UI authority. Existing mobile policies have no manual check/apply affordance. Connected-agent updates remain a distinct component, not an implicit mobile binary updater.\n- `.github/workflows/store-mobile-publish.yml` already binds AAB/IPA builds to the finalized canonical source SHA/tag, uses store preflights and Fastlane. Consolidate shared manifest/provenance, readiness and evidence around it; preserve platform signing/install implementations. Upload, review, store availability, installed version and healthy activation are separate states.\n- Merged PR #24265 removed two unreachable Android OTA checkers (closed #24249). Do not revive those copies. Coordinate open updater snapshot PR #30535 and mobile/model UX issue #30651; neither owns the full update lifecycle.\n- AOSP lives in **elizaOS/os**, not this monorepo. Reuse its `publish-aosp-update-manifest.yml`, Android installer/recovery contracts and current target/source locks. The current manifest workflow publishes image artifact metadata; that alone is not an on-device transactional OTA engine. Its recovery document explicitly leaves rollback to release-owner procedures. Integrate with native Android update_engine / boot-control and existing release tooling, not a generic JavaScript OS flasher.\n- Coordinate https://github.com/elizaOS/os/issues/15 for physical qualification. Its historical issue text predates current Android README/target work: current docs describe Pixel 9a and generated Pixel 11 Pro inputs but keep installer eligibility gated by real build/boot/rollback evidence. Inspect current manifests and evidence rather than treating old issue prose or a product name as verified support.\n\n## Distribution and rollback decision matrix\n\n| Channel/component | Update mechanism | Recovery contract |\n|---|---|---|\n| iOS App Store native shell, embedded runtime, bridges and entitlements | Reviewed App Store binary; TestFlight is a test lane, not a permanent alternate updater | Halt/pause rollout where available, mitigate with permitted configuration, submit a corrective higher version; no promise of reverting installed binaries through App Store |\n| Google Play Android native shell/runtime/DEX/JAR/SO | Play delivery, optionally official immediate/flexible in-app update UX | Halt staged rollout and publish a corrective higher version; do not promise installed-device downgrade |\n| Direct/sideload Android | Signed package through authorized PackageInstaller/user-consent path; distinguish managed-device authority | Only explicitly supported package/data-compatible recovery; signature/version/platform restrictions still apply, no silent install promise |\n| iOS non-store builds | Explicit signing/provisioning/distribution lane and its permitted installer | Do not treat sideload, enterprise or regional distribution as unrestricted OTA or broad product authorization |\n| Owned AOSP device OS and privileged package | Exact-target signed system OTA and approved privileged package channel where supported | Automatic failed-boot fallback and authorized operator recovery are distinct; qualify slot/snapshot state, shared partitions, bootloader/firmware anti-rollback and data compatibility |\n| Permitted content/configuration | Versioned validated data consumed by already-shipped capabilities | Atomic activation with known-good data version and cache/offline fallback; cannot override native security, billing or platform privileges |\n\nApple 2.5.2 restricts downloaded code changing features; 2.3.1 prohibits hidden/undocumented functionality. Guideline 4.7 offers a specific path for qualifying mini apps/chatbots/plugins, with additional review, native API, privacy, index and age requirements. It is not blanket permission to replace the app's JavaScript bundle. Google Play prohibits self-updating native executables outside Play; its interpreter/WebView exception remains subject to all policies. Classify actual behavior and native reach, not file extensions. Any exceptional hosted-software lane needs a documented review decision before activation.\n\n## Data-driven simplification\n\nInventory candidate payloads with owner, schema, interpreter, native/API reach, privileges, binary dependency and review impact. Good initial candidates are release notes, editorial/help content, server-backed records, existing UI copy/assets, and configuration selecting already reviewed behavior. Declarative forms/layouts are candidates only within fixed shipped components/actions and explicit validation; new native capabilities, permissions, arbitrary expressions, eval, downloadable runtime/plugin code or hidden feature activation do not become harmless by being called JSON. Prompt/skill/model changes need classification too: server prompts are separate from updating a local executable; tool permissions and subscription authority remain server/native enforced. Full authorized prompt context must remain complete.\n\nDeliver one bounded real data migration selected from the inventory, with identical intended behavior, backwards-compatible schema, min/max supported client contract, authentication/integrity, atomic activation, offline last-known-good content and tested revert. Leave the remaining named migration candidates prioritized and estimated; do not imply all code should become a configuration language. Remove proven duplicate loaders/checkers only after caller migration and parity evidence. Keep useful responsibility/consumer/invariant comments; preserve generated/vendor files and comment-only/guide parity gates.\n\n## Shared release contract and full UX\n\nReuse a versioned release envelope with component kind (app/content/OS/agent), distribution authority, app/package identity, source SHA, artifact digest/size/signature and key ID, target SKU/ABI/OS, native bridge/runtime/data schema compatibility, channel/cohort, release notes, required restart and recovery eligibility. Keep platform installers behind typed adapters; one user-facing state projection, not one universal installer. Signed rollback authorization must not disable replay/downgrade protection. Include key rotation/revocation, stale manifests, wrong-target rejection, minimum supported version and audit receipts.\n\nExpose current and available component versions, check time/failure, download size/network/battery/storage requirements, progress, pause/retry where actually supported, install later, restart/reboot consent, success and recovery result. Protect unsaved edits, active calls, agent turns, tasks and queued connector deliveries; drain/checkpoint through canonical owners and avoid replaying side effects. Store unavailable/offline/review pending must not look up to date. Settings, update prompts and operator controls render the same authoritative state. Required update gates must retain actionable recovery and avoid locking out billing cancellation/data access unnecessarily.\n\nFor AOSP: stage exact compatible full/incremental payloads, verify before switching, use update_engine status and boot health confirmation, retain recovery artifacts, and distinguish pre-merge rollback from post-merge recovery. Virtual A/B snapshot merge can invalidate simplistic slot-switch assumptions. Rollback protection may forbid an older OS/firmware even on hardware we own. Where historical binary rollback is invalid, provide a signed forward recovery release restoring behavior at a valid security version. Never claim arbitrary firmware reversal or undo database/user-data writes by changing boot slots. Use compatible migrations or an explicit backup/restore plan; explain any wipe/data-loss requirement before consent. Qualify boot-loop/offline physical recovery independently from the running app.\n\n## Observable acceptance\n\n1. Publish the change-classification inventory and platform decision matrix with current official policy citations and a maintained review checklist. Demonstrate native-change → store lane; permitted content → data lane; incompatible/unknown/review-required → explicit rejection/decision, including malicious configuration trying to escape shipped capabilities.\n2. On real iOS and Play-installed Android test accounts/devices, demonstrate available update, dismissal/defer, interruption/resume, store transition, installed-version readback and relaunch health with records preserved. Verify store remediation flow; a stopped rollout is not rollback of already installed copies. Do not claim store acceptance from a local IPA/APK or simulator.\n3. On a named supported AOSP target, install N→N+1, reboot/health commit, exercise a failed candidate and authorized recovery. Inject network loss, low battery/storage, reboot/power interruption at safe controlled checkpoints, digest/signature/target mismatch, stale replay, duplicate requests, failed postinstall and boot-loop. Inspect boot/slot/snapshot/AVB/update_engine state. Cover data migration and Shared/Dedicated/connector continuity. Cuttlefish complements physical proof, never substitutes for it.\n4. Revert the selected data payload and prove schema/client compatibility and real UI/domain results, including offline startup and corrupted cache. Exercise supported Android sideload path separately from Play and privilege-only AOSP path.\n5. Retain exact tested artifacts, signatures/provenance, provider/store status, device fingerprint and versions, before/after desktop/mobile screenshots where applicable, MP4, frontend/network/backend/native logs and real model/domain receipts. Run package tests/typecheck/lint, root verify, app audit and canonical evidence review; meaningful redesigns require five visual cycles. No touched broken/needs-work views, invented success or unlisted hardware claim. Record blocked targets explicitly.\n\n## Official references (reviewed September 5, 2026)\n\n- Apple review: https://developer.apple.com/app-store/review/guidelines/\n- Apple cannot revert previous App Store version: https://developer.apple.com/help/app-store-connect/update-your-app/create-a-new-version\n- Apple phased releases: https://developer.apple.com/help/app-store-connect/update-your-app/release-a-version-update-in-phases\n- Google Play code/update policy: https://support.google.com/googleplay/android-developer/answer/9888379\n- Play in-app updates: https://developer.android.com/guide/playcore/in-app-updates\n- AOSP A/B: https://source.android.com/docs/core/ota/ab\n- Virtual A/B and merge: https://source.android.com/docs/core/ota/virtual_ab and https://source.android.com/docs/core/ota/virtual_ab/implement\n- Verified Boot and rollback protection: https://source.android.com/docs/security/features/verifiedboot/avb\n\nDependencies: #30125 consolidation, #24104 QA, Sprint 3 billing/routing continuity where updates interrupt those flows, and elizaOS/os hardware qualification. This planning pass changed no source or device, ran no release/flash/payment operation and did not certify store compliance or OTA readiness.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n## Current-source, cross-repository and policy audit — 2026-09-06\n\nApplication source: `elizaOS/eliza@8fea4f94c29c7712ce3caf303e3350150622d048`. OS source inspected remotely through GitHub API: `elizaOS/os@52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc` (develop). No clone, image build, release upload, store mutation, device connection or flashing was performed. This addition refines the already-detailed lifecycle plan with current source gaps and implementation order.\n\n### What the current owners actually provide\n\n- [update-policy.ts](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/app-core/src/services/app-updates/update-policy.ts#L50-L95) is a pure distribution-policy/current-version projection, not an update transaction engine. Mobile branches have no manual check/apply affordance. ApplicationUpdateSnapshot has no available release, verification, staging, health-confirmation or recovery state. Extend this owner with typed component state and platform adapters instead of treating the current labels as a completed updater.\n- [getApplicationUpdateSnapshot](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/app-core/src/services/app-updates/update-policy.ts#L325-L351) combines current native info and policy only. ReleaseCenterView currently has a separate desktop-updater snapshot and connected-agent status. The missing reconciliation is component identity/state across these existing owners, not one universal installer.\n- [store-mobile-publish.yml](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/.github/workflows/store-mobile-publish.yml#L76-L94) binds builds to the finalized source/tag; its platform jobs retain store preflight/Fastlane publication. Reuse it for store artifacts and provenance. Upload does not prove review, availability, installation or successful activation.\n- [#24265](https://github.com/elizaOS/eliza/pull/24265) is merged; do not restore removed unreachable OTA checkers. [#30535](https://github.com/elizaOS/eliza/pull/30535) remains OPEN at `3a7f2fd68c6a9b55057a4acf3278d22a81dcbfd2`, limited to the release-notes URL snapshot. Reconcile its live diff before touching ReleaseCenter/updater snapshots; neither that change nor #30651 supplies the mobile/AOSP transaction lifecycle.\n\n### Concrete OS-side gaps and target limits\n\n1. [The current AOSP update-manifest workflow](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/.github/workflows/publish-aosp-update-manifest.yml) derives target identity from filename patterns, including generic pixel-arm64 and a filename-derived fallback, then emits hash/size/download URL, a hard-coded minimum Android version and release metadata. It does not include exact SKU/source-lock lineage, signed-envelope/key identity, OTA payload/base compatibility or boot-health transaction state. It is artifact discovery, not a safe on-device update contract. Replace filename inference with canonical release/target data before this becomes an activation input.\n2. [The installer manifest schema](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/packages/os/android/installer/manifests/android-release-manifest.schema.json) is a different contract: release ID/fingerprint, named devices, slot/dynamic-partition/rollback declarations and partition image artifacts. It is not interchangeable with the workflow's zip-discovery manifest. Define one canonical release identity and explicit adapters; do not make either consumer guess which schema it received.\n3. [hardware-targets.json](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/packages/os/android/hardware-targets.json) marks Pixel 9a, Pixel 11 Pro and Light Phone III installer-ineligible. Pixel 9a records missing retained physical flash/post-boot proof and an ASR artifact prerequisite; Pixel 11 Pro records unverified build/kernel/vendor/physical/rollback evidence. These are current recorded gates, not a new physical-device audit. No named production-supported phone can be inferred from product files.\n4. The [current Android README](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/packages/os/android/README.md#L148-L217) has progressed beyond os#15's historical Android 16/no-Pixel-project description: Pixel 9a has a separate Android 15 source/vendor lock, while Pixel 11 Pro uses pinned generated Android 17 inputs and initially a stock extracted kernel. The latter remains blocked on resolved-project manifest/provenance and full physical qualification. Keep os#15 open for evidence; do not redo source work based only on its old prose.\n5. [The OS application source lock](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/packages/os/release/eliza-source.lock.json) pins `d69ac857580678824025ba9dcd453b15fce4b3cb`, not the application SHA audited here. A future combined acceptance claim must bind the actual consumed app commit and built APK/runtime to the OS candidate, not simply say both repos use develop.\n6. [Recovery documentation](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/packages/os/android/installer/docs/recovery-rollback.md) explicitly leaves rollback to the release owner. Its slot-switch examples depend on known-good compatible contents and warn about shared partitions. They are not an automatic update_engine/Virtual A/B recovery implementation. The current OS open-PR listing was empty at inspection; recheck before assigning the cross-repo adapter work.\n\n### Official policy recheck\n\n- Apple's current rules still constrain downloaded functionality-changing code; qualifying 4.7 software has separate review, native-API, consent, indexing and age obligations. Treat permissibility as payload behavior/native reach, not a JSON/JavaScript extension. [App Review Guidelines, 2.5.2 and 4.7](https://developer.apple.com/app-store/review/guidelines/). App Store remediation requires a newly submitted version rather than reverting to a previous version. [Apple version guidance](https://developer.apple.com/help/app-store-connect/update-your-app/create-a-new-version).\n- The old Google policy URL failed to load in this audit; the current official [Device and network abuse page](https://support.google.com/googleplay/android-developer/answer/16559646?hl=en-GB) preserves the Play-only self-update/native executable restriction and interpreter exception subject to policy. Official [in-app updates](https://developer.android.com/guide/playcore/in-app-updates) provides immediate/flexible Play UX; it is not sideload authority.\n- [Virtual A/B implementation](https://source.android.com/docs/core/ota/virtual_ab/implement) exposes merge/cancel states and constraints; [Verified Boot](https://source.android.com/docs/security/features/verifiedboot/avb) includes rollback protection. A generic previous-slot button cannot promise restoration after snapshot merge or firmware/data incompatibility. These readings support the issue's decision matrix; they do not certify a particular submitted app or device image.\n\n### Ordered implementation with reviewable outputs\n\n1. **Pin release identity and qualified scope first.** Name the initial iOS, Play Android, direct Android and AOSP targets/build identities; keep unsupported targets unavailable. Resolve app/OS source-lock lineage, installed package/certificate identity, actual artifact provenance and real-device availability. Publish a dependency/effort split before committing the full 12 nominal days; source/hardware readiness and store elapsed time are independent gates.\n2. **Define component release/state contracts in the existing owner.** Add versioned app/content/OS/agent identity, authority and applicable phases: unknown/checking/unavailable/available/downloading/verified/staged/awaiting-consent/applying/restarting/health-pending/healthy/recovery-required. Unsupported actions must carry a reason, not a false current state. Keep platform-specific status/eligibility and errors typed; ReleaseCenter/settings/prompts render the same projection.\n3. **Unify release provenance with explicit adapters.** In the OS repo, derive update discovery from validated release manifest/target locks rather than artifact filenames. Bind source commits, precise SKU/ABI/platform/base version, digest/size/signature/key ID, compatibility and recovery eligibility. Preserve store workflow source binding in the app repo. Sign/verify release envelopes and enforce stale/replay/key-rotation/target/schema constraints before offering activation. Do not add OS release jobs back to the app monorepo.\n4. **Deliver store/direct adapters independently.** Implement Play immediate/flexible interaction via the official API; iOS opens the correct supported store/distribution lane and observes installed version on relaunch. Direct Android uses supported signed-package installation with its real user/managed-device authority. Represent review-pending/offline/store unavailable distinctly. Preserve unsaved work and active calls/turns; do not fake pause/resume/install controls a platform API does not support.\n5. **Implement one bounded permitted-data migration.** Initial candidate: release notes/help metadata already consumed by the release UI, after the #30535 URL contract is reconciled. Classify its schema/interpreter/native reach, validate compatible clients and authenticated/signed integrity, stage atomically, retain offline last-known-good data and prove a real revert. This establishes the data lane without downloading replacement app code or implementing an expression language. Keep other payload candidates named and estimated.\n6. **Build AOSP transactions only on the qualified native boundary.** Reuse update_engine/boot-control and exact-target payload tooling; separate full/incremental payload compatibility, staging, reboot consent, slot/snapshot state and health commit. Bind health to the actual booted fingerprint/runtime and required services. Preserve known-good recovery artifacts. Distinguish pre-merge failed-boot fallback, post-merge forward recovery and operator-assisted factory restore; never undo data writes by claiming a slot switch does so. Cross-repo os#15 qualification remains required before end-user eligibility.\n7. **Protect workload/data continuity.** Define canonical drain/checkpoint/resume calls for active agent turns, calls, scheduled tasks and queued connector delivery. Persist update intent and operation receipts so restart cannot replay external side effects. Version database/native bridge contracts and define forward/backward-compatible migration or explicit backup/restore requirements. Billing cancellation/data access should remain actionable during required-update states where technically possible.\n8. **Certify each delivered lane, then remove obsolete paths.** Run contract/adapter tests plus real iOS store test, Play-installed Android, direct installer and named AOSP update/recovery scenarios. Retain intermediate failed attempts and exact payload identities. Only remove old loader/checker branches after their callers and recovery behavior migrate. Keep unknown hardware/store results explicitly blocked and carry remaining work beyond the sprint rather than compressing certification into a green UI snapshot.\n\n### Required observable evidence beyond current tests\n\n- Existing policy tests prove static channel decisions; add actual adapter transitions and process/reboot persistence, interrupted download, bad signature/hash/target/base version, stale/replayed manifest, duplicate apply and missing-health cases. Observe real installed version/fingerprint and preserved data after relaunch.\n- For AOSP retain update_engine, slot, snapshot merge, AVB and boot-health readbacks for N→N+1 plus failed-candidate recovery. Exercise network/storage/battery failures and controlled interruption only on authorized recoverable lab devices. Cuttlefish complements, never replaces physical proof. Store rollout halt is not an installed-device downgrade.\n- Demonstrate data payload corruption rejection/offline startup/revert and a prohibited functionality-changing payload classification. Record model/domain/connector continuity and separate update/generation/delivery receipts where relevant.\n- Publish tested artifacts/digests/provenance, before/after UI/native captures, MP4 and complete frontend/network/backend/native logs in the verified evidence bundle. Run owning app/OS package gates and root verify; app UI work needs app audit and five cycles for meaningful redesign. No install, update, payment, policy approval or hardware support is certified by this planning pass.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent adversarial review — mobile and OS update authority\n\nApp baseline `b676280384b15df54204276e34bb8740db26936f`; OS develop independently re-fetched as `52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc`. Read live issue and freshly fetched OS update workflow/installer schema; primary Apple, Play and Virtual A/B rules re-opened. No installation, reboot, signing, store submission or physical recovery tested.\n\n### P1 — Current display policy is not trusted native installation authority\n\n[getApplicationUpdateSnapshot](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/app-core/src/services/app-updates/update-policy.ts#L325) uses the renderer build variant and isElizaOS; [isElizaOS](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/shared/src/platform/eliza-os.ts#L22) uses navigator.userAgent. This is suitable for current display routing but cannot authorize new privileged AOSP update operations. The resolver also accepts native as an input without using it to establish privilege. Merely attaching an install/apply action to an android-aosp policy row would mistake a presentation hint for device authority. No such updater mutation is present today; this is an integration constraint before adding one.\n\nAmendment: native/platform adapter independently attests installed package/certificate, image/target identity, supported update facility and actual caller authorization for each operation. The UI submits an intended component/release; privileged code recomputes eligibility from trusted installed/native state and verified manifest. User-agent/build-label disagreement becomes unavailable with a reason. Test browser-provided platform labels, missing native bridge, ordinary Play-installed app on an AOSP-like user agent, and genuine qualified OS image. A renderer flag must never create an installer permission.\n\n### P2 — Unknown native/check state must not turn into a current/eligible component\n\n[readNativeAppInfo](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/app-core/src/services/app-updates/update-policy.ts#L307) catches all failures and returns null; the snapshot substitutes unknown version/null ID while still deriving its normal channel. [Agent snapshot mapping](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/app-core/src/services/app-updates/update-policy.ts#L271) maps no error and updateAvailable=false to Current even if latestVersion/lastCheckAt are absent. These are source-proven display contracts. They become unsafe readiness evidence if the new update transaction treats the same objects as authoritative.\n\nAmendment: preserve explicit native-info/check errors and unknown/unverified states, with timestamps and installed component identity. Current requires a completed applicable check against that exact installed version; updateAvailable=false alone is not proof. Test bridge failure, first launch before any check, offline last-known result for a different installed version, and a successful store handoff with installation still pending. Admission must not use UI labels as health completion.\n\n### P1 — Recovery controls need state-specific native guards, not a universal rollback action\n\nThe OS [zip-discovery workflow](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/.github/workflows/publish-aosp-update-manifest.yml#L76) still yields filename-based targets and basic metadata; [installer schema](https://github.com/elizaOS/os/blob/52df5cc1304f95fd89cd4ad6a608bfeb74d5c5bc/packages/os/android/installer/manifests/android-release-manifest.schema.json#L182) describes rollback metadata but does not supply live snapshot merge state. The earlier plan's adapter split remains necessary; neither object can authorize recovery by itself.\n\nFresh official [Virtual A/B guidance](https://source.android.com/docs/core/ota/virtual_ab/implement) requires set_active to abort during MERGING and prohibits particular erase/wipe operations while SNAPSHOTTED or MERGING; snapshot cancellation also depends on lock state. Crucially, its full-flash cancellation flow is not a generic recipe for a one-off slot switch or wipe. Amendment: read native merge/slot/lock state immediately before each recovery transition, reject stale UI intent, and expose only the operation permitted in that state. Test UI offers recovery, device enters merge before confirmation, then native rejects/reprojects it; do not bypass platform guards to make the test pass. Preserve post-merge forward recovery as a different operation from pre-merge fallback.\n\n### Policy qualification amendments\n\nApple 2.5.2's limited educational-code exception is not a general app-updater exception. Section4.7 allows specified software categories subject to obligations;4.7.2 requires prior Apple permission to expose native APIs,4.7.3 requires explicit per-instance consent for data/privacy sharing, and4.7.4 requires software indexing/universal links. A payload called JSON, prompt or plugin has no automatic exemption. [Apple rules](https://developer.apple.com/app-store/review/guidelines/).\n\nGoogle's interpreter exception concerns interpreted/VM code with indirect Android API access; Play self-update and downloaded native executable restrictions remain. Document which exact lane/payload qualifies, while retaining all other policy requirements. [Play rule](https://support.google.com/googleplay/android-developer/answer/16559646?hl=en). These are policy readings, not a determination that this app or a new OTA payload has store approval.\n\nKeep the first permitted-data proof narrow. Do not broaden release-notes metadata into an expression/native-capability language under the same signature/schema. Acceptance must bind actual parser behavior/native reach and compatible client schema, not extension or MIME type. Store, direct APK, content and OS transactions retain separate authority and health evidence even when one UI presents them.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n"])</script><script>self.__next_f.push([1,"16:T5395,"])</script><script>self.__next_f.push([1,"## Missing capability and Sprint 3 scope\n\nThis is a scoped child of #23111; coordinate #23105 for actual connector delivery evidence. Estimate 3–5 person-days, High complexity, @lalalune with @NubsCarson connector review. This adds capability-aware presentation to the prior contextual-navigation work; it does not repeat the Sprint 2 view registry or promise the full connector matrix.\n\nCurrent source findings: `views.ts:99` implements a connector-source denylist whose unknown sources retain view behavior; `view-command-routing.ts` checks only registration of VIEWS before forcing navigation; `view-context.ts` similarly checks action registration, then directly navigates through loopback; `current-view.ts` can describe local renderer state without establishing that this conversation has that visual surface. These independently answer the same presentation question. `view-delivery.ts` distinguishes realtime transport and view client identity, but a voice transport flag is not evidence of a connected screen. No live failure reproduction is claimed by this planning update.\n\nDeliver one typed conversation delivery/presentation capability decision used consistently by shortcuts, contextual inference, provider context and execution. Phone/audio-only sessions with no connected visual app must not switch a local view or claim the user can see it. App voice with a connected authorized screen may navigate normally. Preserve domain tools and image generation when usable; voice must not become a blanket ban on visual-content creation. Retain complete authorized action definitions/context and expose typed applicability reasons; do not hide tools by arbitrary top-k or prompt udit and implementation plan — 2026-09-06\n\nAudited develop `8fea4f94c29c7712ce3caf303e3350150622d048`; reviewed live #23111/#23105 and the app-control, agent, core and local-media source paths. Both parent/dependency issues remain open. No real call, connector send, image generation or renderer interaction was performed. This remains the scoped Sprint 3 child, not completion of the universal connector matrix.\n\n### Existing behavior and concrete gaps\n\n- **View eligibility is source-name based and fail-open.** [views.ts:99–205](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/actions/views.ts#L99) denies a known external-connector set, preserves unknown ordinary sources, and treats originless sub-agent relays as viewless. Audio-only/phone identity is not positive proof of an attached screen. This is a source-confirmed policy gap; no audible phone-navigation failure was reproduced.\n- **The same decision is independently bypassed elsewhere.** [view-command-routing.ts:27–44](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/evaluators/view-command-routing.ts#L27) checks registered VIEWS and matches text. [view-context.ts:87–126](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/evaluators/view-context.ts#L87) performs direct loopback navigation after querying global views/current state, without a conversation-bound visual capability. `current-view.ts:60–75` describes global renderer state as the user's current view. Checking only the main VIEWS action will leave those paths inconsistent.\n- **Routing identity and transport already have seams but are not capability proof.** [view-delivery.ts:8–35](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-app-control/src/actions/view-delivery.ts#L8) reads a syntactically valid `viewClientId` and a realtime-voice transport marker. [conversation-routes.ts:430–466](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/agent/src/api/conversation-routes.ts#L430) attaches request-scoped renderer identity from headers. A string or historical metadata must not substitute for current authorized renderer ownership and connectivity.\n- **Navigation delivery modes have different owners.** The route deliberately skips server broadcast/state commit for `delivery: originating-client` and returns preparation success; realtime owns that control-channel delivery. The 409 no-recipient guard belongs to the non-caller-owned targeted dispatch path, not the caller-owned handoff. Completed-action delivery has separate targeting/fallback semantics. Preserve the deliberate no-broadcast realtime contract, and trace the actual handoff/application receipt before claiming a view was displayed. The independent review below supersedes the earlier claim that originating-client mode itself returns 409 on disconnect.\n- **Media generation is callable already; delivery success is a separate question.** [GENERATE_MEDIA](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/plugins/plugin-local-inference/src/actions/generate-media.ts#L481) dispatches IMAGE/TTS, builds attachments, invokes an optional callback and returns generation success with attachment data. It does not establish a recipient-side send receipt. Do not disable generation just because a session lacks a screen, or label generation success as delivered success.\n- **Canonical persistence is not missing wholesale.** The agent [media-runtime hook](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/agent/src/api/media-runtime.ts#L119) persists inline generated attachments before delivery and attempts SSRF-guarded remote rehosting. [media-store.ts:378](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/agent/src/api/media-store.ts#L378) owns content-addressed byte storage. Prove this hook is installed on the selected runtime and that its canonical attachment reaches the actual connector. A provider URL or attachment field alone is not proof of canonical storage or recipient retrieval.\n\n### Ordered implementation plan\n\n1. **Shared/core + host/connector owners: define one typed presentation decision.** Bind a request-scoped capability record to authenticated actor, conversation, connector session, allowed output kinds and current renderer ownership/generation. Represent attached/authorized visual continuation, text/media/link delivery, audio output, unavailable/unknown and reason explicitly. Produce it at trusted ingress/session boundaries; user text, source-name strings and replayed historical metadata cannot grant a screen or destination. Share the contract in a runtime-safe package and consume existing identity/interaction authority rather than creating a parallel permission system.\n2. **Apply it consistently before inference and again before effect dispatch.** Make explicit shortcuts, #23111's contextual navigation, current-view provider, VIEWS mode applicability and the host navigation route use the same decision. Keep the complete authorized action catalog; present typed inapplicability reasons for screen-only operations rather than arbitrary omission. Domain actions, image generation and usable read operations stay callable. Unknown/no-screen conversations get zero navigation effect; app voice with a confirmed attached screen remains supported. Revalidate current renderer generation/connection after model latency and before committing navigation.\n3. **Finish the canonical navigation path jointly with #23111/#30682.** Contextual navigation must execute through the same VIEWS/domain result path and produce its own receipt, not a hidden post-response loopback. Target exactly the requesting authorized renderer, handle disconnect as unavailable/continuation, and do not broad-broadcast to another local screen. Preserve completed-action deduplication, idempotency and realtime handoff. A final response may claim a displayed view only with appropriate applied/acknowledged evidence.\n4. **Separate generation, persistence and delivery outcomes.** Retain IMAGE domain execution and canonical `Media`; ensure complete bytes are stored through the existing host media service and remotely fetched only through SSRF guards. Pass the artifact to the current authorized conversation's supported delivery adapter. Return distinct generated/stored/sent-or-failed outcomes with artifact and operation identities. Integrate existing connector receipts (for scheduled sends, `DispatchResult`/`DispatchReceipt` already distinguish transport success, provider receipt and unknown acceptance); do not invent a second connector dispatch stack. `ok: true`, optional callback completion and HTTP 200 are insufficient for the delivered claim.\n5. **Make fallback conversational and destination-bound.** If the current session supports a real retrievable attachment or link, deliver it there and speak a concise confirmation after the receipt. Do not read a long raw URL as the only handoff. If it has no such channel, report generation availability/state and request an authorized destination; never infer SMS/email/recipient. Generation success plus connector rejection remains partial completion, with safe recovery that reuses the artifact and does not repeat a paid generation. Unknown post-dispatch acceptance must not trigger a blind duplicate send.\n6. **Correlate evidence.** Under the existing #17030 trajectory identity record effective capability decision/reason and revision, chosen path, model/action inputs/results, canonical artifact hash, renderer receipt, connector receipt and final reply. Keep operational logs payload-free; keep complete privacy-safe evidence in the verified bundle. #23105 owns recipient byte verification and transformations, #23111 owns domain/presentation parity, #30683 owns real action-selection evaluation, and #30679/#29492 own voice playback/duplex behavior.\n\n### Verification and acceptance\n\n- Exercise actual shortcut/evaluator/provider/action/route boundaries with audio-only phone, connected app voice, disconnected app voice, unknown source, valid/missing/foreign renderer identity, origin-preserving and originless relay, late disconnect and stale capability replay. Assert zero unintended navigation/broadcast and preserved domain effects, not merely a boolean helper result.\n- Exercise image generation through the installed media hook and real canonical store, then adapter results for successful delivery, no destination, unsupported MIME, revoked membership, connector rejection, accepted-but-unknown response and retry. Verify stored bytes/hash, exactly-once generation, no duplicate send, truthful partial completion and no fabricated recipient. Add hard tests that a generation receipt cannot satisfy delivery acceptance and a sent frame cannot stand in for applied navigation.\n- Reuse `view-delivery`, `views-switching`, `view-context`, current-view and conversation-stream tests, media-runtime/store integration tests and the existing connector qualification harness. Run affected package tests/typecheck/lint, root verify and required app audit/evidence for UI changes. No suite pass is claimed here.\n- Capture one real supported audio-only/phone run with no navigation, the same app-voice request on an attached screen with actual view evidence, loss of that screen, and a real image delivered through one authorized supported connector with recipient retrieval/hash verification. Include a calendar/domain operation without navigation, complete trajectories, exact installed/deployed SHA and settings, voice recording/listening, desktop/mobile captures where affected, logs and MP4. Report untested connectors and devices explicitly; one connector does not certify the matrix.\n\nPlanning remains 3–5 person-days conditional on #23111 navigation and #23105's chosen connector observer being usable. Ratify the bounded connector/device slice before implementation; the universal parent scope does not fit this child estimate.\n\u003c!-- guardian-project19-source-audit-2026-09-06:end --\u003e\n\n\u003c!-- guardian-project19-adversarial-2026-09-06:start --\u003e\n## Independent deep review: #30690\n\nAudited `b676280384b15df54204276e34bb8740db26936f`; live issue/dependencies, view action/evaluator/route, realtime bridge/session/UI control path, generation handler and media-persistence hook reviewed. No phone call, renderer interaction, generated image, paid provider call or connector send occurred.\n\n### P1 — Delivery rejection is mislabeled generation failure and drops the successful artifact from the result (reproduced)\n\n[GENERATE_MEDIA](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-local-inference/src/actions/generate-media.ts#L481-L548) wraps generation, attachment shaping and the delivery callback in one `try`. If the callback throws after successful generation, the catch reports `Image generation failed`, calls the same callback again with that error text, and returns failure without the generated attachment identity/URL. If the callback rejects again, the handler itself throws rather than returning its intended typed failure.\n\nExecuted `/tmp/guardian-project19-deep-review/probe-30690.ts`: unchanged source-extracted full handler, actual image-result parsing/attachment shaping, explicit existing detector seam and controlled model/transport collaborators. One model return produced a synthetic three-byte image fixture; no actual image generation or decoding was claimed.\n\n- Callback rejects once: exactly one generation, two callback attempts; second says `Image generation failed: connector rejected attachment`; returned failure omits successful artifact.\n- Callback always rejects: one generation, two callback attempts, uncaught delivery error.\n- Normal control: one generation, one artifact callback, success with artifact identity/URL.\n\nThe prior plan's “generation success/send failure is partial” is therefore a concrete code repair, not merely missing end-to-end proof. Separate generation/persistence from delivery scopes; retain the canonical artifact and generation receipt in an explicit partial result even if sending fails. Route delivery diagnostics through a boundary that does not blindly call the same failed transport. Retrying delivery must reuse the artifact, not invoke the model again. For ambiguous after-send failure, reconcile the connector's receipt before another send. Test both failure-before-acceptance and failure-after-acceptance, persistence failure, optional callback absence, and recovery after restart. Do not claim the synthetic bytes prove real media validity or successful canonical storage.\n\n### P1 — Contextual navigation bypass is reproduced at the actual processor boundary\n\nThe same probe executes the unchanged [contextual navigation processor](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-app-control/src/evaluators/view-context.ts#L87-L133) with a Telegram-sourced message and model-selected registered calendar. It calls `navigate('calendar', {path:'/calendar', viewType:'gui'})` and returns success, with no requesting client or capability data. This contrasts with [messageHasNoViewSurface](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/plugins/plugin-app-control/src/actions/views.ts#L202-L206), which recognizes Telegram as viewless. The evaluator's `shouldRun` checks action registration, response state and activity text—not that denylist or a connected screen.\n\nThis is processor/dispatch proof using controlled loopback collaborators, not a real phone-to-desktop effect. Fix the shared decision at this actual execution boundary as well as tool applicability. Capture a trusted conversation/session capability and recheck its current renderer generation after the classifier/list/current awaits. No-screen/unknown turns should preserve the domain operation while yielding no navigation effect. A policy helper test without this processor path would miss the bypass.\n\n### Required correction: realtime originating-client handling is deliberately prepared, not delivered, by the navigate route\n\nThe first audit's late-disconnect description overgeneralized the 409 guard. [callerOwnedDelivery](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/agent/src/api/views-routes.ts#L1161-L1164) includes `originating-client`. The [dispatch condition](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/agent/src/api/views-routes.ts#L1272-L1282) excludes that mode entirely; it returns `ok:true` without global state commit or WebSocket dispatch. The [existing test](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/agent/src/api/views-routes.navigate-broadcast.test.ts#L153-L168) explicitly expects this. The 409 path belongs to targeted, non-caller-owned delivery; do not describe it as checking a realtime screen.\n\nTraced the intended continuation: [terminal SSE parsing](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/cloud/shared/src/lib/voice-session/eliza-sse-bridge.ts#L682-L729) extracts one successful VIEWS/APP handoff; [voice session](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/cloud/api/v1/voice/session/lib/session.ts#L1693-L1712) checks current turn/aborted state and emits `navigate_view`; the [shell](https://github.com/elizaOS/eliza/blob/b676280384b15df54204276e34bb8740db26936f/packages/ui/src/components/shell/useShellController.ts#L557-L568) dispatches local navigation. This confirms a real ownership path exists. Preserve deliberate no-broadcast behavior; replacing it with global broadcast would introduce the wrong-screen problem the issue is intended to prevent.\n\nMissing acceptance is an actual applied/rejected acknowledgment from that authorized screen, bound to session/turn/renderer generation. `ok:true` at the preparatory route, an action result, and sending `navigate_view` are distinct from applying the view. Exercise no visual consumer, disconnect after preparation, delayed control frame after turn change, and renderer rejection. Retain the server's existing stale-turn check and the UI client's connection-generation checks; do not present those protections as absent. The SSE parser also fails closed on multiple successful navigation results rather than guessing ordering; maintain that behavior until an explicit ordered presentation contract exists.\n\n### Media/context boundaries and closure\n\nThe installed media hook mutates inline attachments into canonical stored URLs before normal delivery/persistence and marks failed remote rehosting as ephemeral. Do not add another store or assume every URL is durable. The new partial-result flow must retain the **post-persistence** canonical artifact and its delivery state, not a stale pre-hook URL or generic generated-success string. Preserve all authorized domain tools and complete model context; no screen is an applicability restriction on presentation, not an image-generation ban.\n\nBun source probes passed without dependencies or external actions. Real phone/app-voice, renderer receipt and recipient artifact retrieval remain required, with separate generation/storage/navigation/delivery identities. One live connector proves its own lane only; the universal matrix remains with #23105/#23111 and the provider owners.\n\u003c!-- guardian-project19-adversarial-2026-09-06:end --\u003e\n"])</script><script>self.__next_f.push([1,"17:T55c7,"])</script><script>self.__next_f.push([1,"## Missing capability\nPersonal Shared already generates platform-funded images/videos through a strict rate limit. Source review found no image/video per-period allowance in the entitlement projection: request rate is not a durable free-generation budget. This is a policy/capability extension, not a claim of a live abuse defect.\n\n## Scope\nChild of #23094; consume #23091 canonical lifecycle and keep existing #27177/#28315 media implementation. Define versioned free image/video allowances, reset/consumption/refund semantics, and paid workflow/task execution/coding eligibility in the authoritative server projection. Exact free generation quantities must be recorded as owner policy before enforcing them; no amount is inferred from this planning request. Calendar CRUD remains free independent of media allowance. A stored todo/checklist or draft is distinct from executing an autonomous workflow.\n\n## Acceptance\n- Atomic allowance reservation before provider dispatch; replay/concurrency count once and failures reconcile under declared policy.\n- Limits, remaining quota, reset and typed unavailable state match action/API/UI projections across plan changes and cache versions.\n- Exhausted media allowance gives a conversational recovery/reset explanation; complete Calendar/Notes DB operations remain available.\n- Paid compute execute/start/resume uses the same current entitlement result; expired/unknown/grace distinctions are preserved.\n- Existing images/video continue using canonical generation and backing provider receipts; video duration/resolution costs are represented honestly.\n- Real ledger/route/provider evidence, full-stack boundary tests, package/root gates; no mock-only completion claim.\n\n## Plan\n3–5 person-days; Nubs proposed integration lead with Shaw policy review. Preserve existing parent assignees. Coordinate isolated fallback in #25146; do not copy Dedicated memory into Shared.\n\nCover anonymous → sign-in → free → trial → paid → exhausted/past-due flows through the same server decisions. Free account creation does not require a card; entering the Dedicated seven-day trial does. Sign-in/upgrade must return to the originating request/conversation and require fresh authorization before any changed or expired side effect; never replay a paid operation twice. Cover image and video generation on every maintained supported connector including hosted iMessage, proving media retrieval at the intended destination. Required product-policy values remain explicitly unratified until recorded; implementation may not silently set them to zero or unlimited.\n\n\nProject 19 Sprint 3 (October 3–16, 2026) **scope candidate**, not a capacity-committed completion date. Estimated effort includes focused implementation and evidence; research did not execute live billing, connector messages or product scenarios. See the project README for prioritization and over-capacity scope.\n\n\u003c!-- guardian-project19-source-audit-2026-09-06:start --\u003e\n\u003c!-- guardian-project19-source-audit-2026-09-06 --\u003e\n## Critical source audit and implementation plan — 2026-09-06\n\nAudited develop `8fea4f94c29c7712ce3caf303e3350150622d048`, live #23094/#27177/#28315, entitlement/funding persistence and Personal Shared generation/capability callers. Those issues remain open. No provider request, ledger mutation, connector send or allowance policy was executed or ratified by this audit. Exact free quantities, reset rules, refund/consumption semantics and paid execution policy remain required owner decisions; absence of policy must not become zero or unlimited silently.\n\n### Existing implementation and concrete integration gaps\n\n- **Platform-funded generation exists in the active Shared path.** [shared-runtime-chat.ts:418–450](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/shared-runtime-chat.ts#L418) exposes `canGenerateMedia` based on provider configuration and enforces a strict request rate before generation. It does not reserve a durable per-period image/video allowance. Strict RPM is a burst-control mechanism, not an allowance ledger.\n- **Image generation already uses the canonical cloud service.** [lines 539–568](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/shared-runtime-chat.ts#L539) call `executeImageGeneration` with stable turn/action identity and `admit: { kind: \"platform\" }`. The [canonical service](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/image-generation.ts#L314) has an admission seam and records platform costs without settling organization credits. Reuse this ownership; charging organization cash merely to implement a free quota would change the current funding contract.\n- **Video has a different active path requiring the same admission.** [lines 452–525](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/shared-runtime-chat.ts#L452) resolves Seedance parameters, checks content safety, invokes the provider, then persists the generation row and request ID as platform-funded. The deterministic generation ID is formed after provider generation; a repeated ID alone does not prove provider dispatch deduplication. Add a durable pre-dispatch operation/reservation seam shared with image, not just a post-result decrement. Current duration/resolution cost math in `personal-shared-seedance.ts` is a source estimate, not measured invoice reconciliation; preserve that distinction and validate model/pricing version at implementation.\n- **The persisted entitlement projection has no media or execution entitlement fields.** [organization-entitlements.ts](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/db/schemas/organization-entitlements.ts#L30) contains RPMs, resource ceilings, lifecycle and source/catalog revisions. [Derivation](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/db/repositories/subscription-entitlements.ts#L80) supports free/active/grace/past_due/unpaid but not the new generic trial lifecycle. It is the foundation, not evidence that media or paid execute/start/resume is enforced.\n- **Existing paid allowance is not a free media counter.** [subscription-allowance-periods.ts](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/db/schemas/subscription-allowance-periods.ts#L27) requires paid subscription/invoice authority and stores fixed-six USD amounts. `subscription-funding.ts` already has transaction-owned reserve/settle/release behavior and source conservation. Reuse its transactional/idempotency discipline, but do not invent a paid invoice for a free user or conflate generation units with purchased dollars.\n- **Capability presentation is static/configuration-based today.** Shared [media availability](https://github.com/elizaOS/eliza/blob/8fea4f94c29c7712ce3caf303e3350150622d048/packages/cloud/shared/src/lib/services/shared-runtime/shared-capability-catalog.ts#L260) uses `flags.media` and describes image generation; it does not expose separate image/video remaining/reset/exhausted states. Calendar/Notes still have Dedicated/runtime capability walls in this source. #30688 must supply their free DB ports; this issue must preserve those operations without falsely marking unimplemented ports available. A stored todo/draft is not autonomous paid execution.\n\n### Ordered implementation plan\n\n1. **Ratify versioned policy and identity ownership.** Record free image/video quantities or unit budgets, period anchor/timezone, carryover, anonymous eligibility, account convergence, accepted-provider-work consumption, safety rejection, cancellation, provider-unknown and delivery-failure treatment. Specify supported duration/resolution/audio units and whether a costly video consumes weighted units. Define paid workflow/coding execute/start/resume versus free CRUD/drafts. Bind app subscriber/account authority through #30638 independently from merchant/infrastructure organization billing; a buyer must not need provider-organization admin privileges.\n2. **Extend the authoritative projection and schema with explicit applicability.** Under #23091/#23094, add policy/catalog revision, source subscription/account identity, image/video quota units, remaining/reserved/settled/reset and paid execution capability with typed reason/availability/effective time. Include free/trial/paid/grace/exhausted/past-due/expired/unknown states as defined by policy. Readers consume committed projections and authoritative time; they must not rebuild from raw balance or provider configuration. Publish matching safe SDK/action/UI DTOs without provider/account secrets.\n3. **Add a durable free-media admission/operation ledger within the existing billing authority.** Reserve before any provider side effect in one transaction with current entitlement revision, period, actor/tenant, logical operation ID, canonical request digest and cost/unit estimate. Exact retries return the same operation; mismatched replays conflict. Under concurrency, use disjoint accounting categories: available units + outstanding reservations + settled consumption = granted units + approved adjustments for the period. Releases and settlements move units exactly once. Do not retrofit USD paid-period tables with fake invoice IDs. Use migrations and the existing billing lock order, primary clock and transactional repository conventions; the billing owner decides whether this is a generalized allowance source or a domain-specific unit ledger under that authority.\n4. **Wire both provider paths and reconcile honestly.** Supply admission to canonical image generation and the active video branch, including text-to-video and trusted attachment-backed image-to-video. Record dispatch intent/provider request ID before acknowledging successful execution where the provider contract permits; reconcile unknown acceptance conservatively. Release only under ratified policy, never automatically refund merely because the downstream connector failed after successful generation. Persist canonical artifact and provider cost evidence; a retry of delivery reuses the artifact and operation. Keep platform funding separate from user credits and keep strict rate limiting alongside the period allowance.\n5. **Enforce paid execution at the real action/job/resource boundary.** All execute/start/resume variants, including continuation, retry and Dedicated recovery, consume the same fresh capability/revision and ratified funding policy; a UI paywall alone is insufficient. Preserve Calendar/Notes/todo CRUD and draft planning when media is exhausted or execution is unavailable. Distinguish unavailable infrastructure from unpaid entitlement; do not switch data/memory into another Shared identity. #25146 owns isolated fallback and #23098 owns resource lifecycle. Billing/system notices and recovery/sign-in assistance remain deliverable independently of paid workflow execution gates.\n6. **Make quota recovery a resumable authorized handoff.** Project exact remaining/reset and reason to Shared capability provider, action results, API and Billing UI (#23095/#23096). Free account creation needs no card; Dedicated trial entry follows #30638's card-required policy. Sign-in/upgrade returns to the originating conversation/request with a durable operation reference, validates fresh actor/scope and unchanged request digest/expiry, then requests renewed authorization where needed. Never auto-replay an expired/changed paid operation or duplicate generation after a successful-but-unobserved response.\n7. **Bind generated media to current authorized delivery.** Coordinate #30690 and #23105: canonical artifact storage, connector capability, per-part send receipts and recipient retrieval are separate from quota consumption. Preserve #27177/#28315's real media action/grounding/schema path. A model's apology without a failed tool receipt is not provider failure; generated success with failed delivery is partial completion.\n\n### Verification and real acceptance\n\n- Real database tests must prove one reservation/provider intent under concurrent same-operation retries, independent operations at exhaustion, period reset, plan change, stale cache hydration, expired entitlement, source/account convergence and restart. Verify conservation and exact policy units; a counter mock or constant assertion is insufficient. Denied/unratified admission makes no provider call and returns explicit reason.\n- Boundary tests cover image/video parameters, provider rejection before dispatch, unknown acceptance, artifact-store failure, late success, safety review, settlement failure, connector failure, retry and consumed-unit correction under approved policy. Use distinguishable real persistence/receipt IDs and verify provider dispatch counts and purchased-credit invariance on platform-funded work.\n- Exercise anonymous → sign-in → free → trial → paid → exhausted/past-due through the same action/API/UI projection, including no-card free signup, no duplicate trial, and return-to-origin authorization. Validate Calendar/Notes CRUD and stored todos remain free and available when their backing ports exist; paid workflow execution stays gated. Test stale decision/cache revision against actual execute/start/resume, not only displayed limits.\n- Reuse shared-runtime-chat/media/Seedance/image-generation, entitlement derivation, funding/persistence and capability catalog/wall suites, adding focused real consumer regressions. Run changed shared/API/SDK/core/UI package tests/typecheck/lint, root verify and app audit where affected. No suite or live result is claimed here.\n- Run exact-SHA staged provider-backed image and video generation and controlled delivery across every maintained
