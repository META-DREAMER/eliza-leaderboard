y).\n- The access LIST is already complete: while a trajectory step records, provider-cache reuse is disabled so every requested provider re-executes (`runtime.ts:4149-4164`) — capture fidelity is not the problem, record shape is.\n- Everything else per call is already captured (full prompt, messages, tools, usage, costUsd — `runtime/trajectory-recorder.ts`; DB twin `trajectory-types.ts:85`), and judge rewards ride into datasets (`metadata.judge_score`, #8795).\n\n## Proposed\n\n1. Extend the provider-access record with `{ sha256, tokenCount, position, spanStart, spanEnd }` (text itself optional/hash-first to keep privacy-filter semantics; spans reference the recorded prompt string of the consuming call).\n2. Stamp `providerOrder` (and the applied selection set) onto each `RecordedModelCall`/`TrajectoryLlmCallRecord` produced from that composeState.\n3. Tokenizer pass at record time (same tokenizer family the batcher uses) for per-provider `tokenCount`; roll into a per-provider cost ledger derivable from existing `costUsd`.\n4. Composition-aware replay groundwork: with spans + order persisted, a replay harness can re-render candidate (selection, order, template, budget) configs against recorded provider state — the inner loop for the GEPA-over-dynamic-context issue; `packages/scripts/trajectory.ts` gains a `providers` view (per-provider tokens/cost per call).\n5. Keep the recording gate semantics unchanged (`runtime/trajectory-gate.ts`); size impact bounded by hash-first storage.\n\n## Acceptance criteria + evidence bar\n\n- A live recorded trajectory (scenario-runner, real model, read by hand) shows per-provider `{sha256, tokenCount, position, spanStart, spanEnd}` on each LLM call, and slicing the recorded prompt by the spans reproduces each provider's text exactly (round-trip test).\n- `trajectory.ts` prints a per-provider token/cost table for a real trajectory; provider set + order reconstructable from the record alone (fixture test over a multi-provider compose).\n- No behavior change when trajectory logging is off; privacy filter still strips provider text where required (hash retained).\n\n## Out of scope\n\nThe optimizer/genome work and the ablation runner (parent GEPA issue); report rendering (reports issue); DB schema migrations beyond the trajectory record shape.\n"])</script><script>self.__next_f.push([1,"15:Tb2a,"])</script><script>self.__next_f.push([1,"Part of #14878\n\n## Problem\n\nParent: [her-tasks] Executive/creative agent task catalog (family 4). The corpus has zero creative-output scenarios (no draft/essay/naming/deck task anywhere in `plugins/plugin-personal-assistant/test/scenarios/`; lifeops-bench mail.py covers triage, not composition-as-craft). Two capabilities are missing for the Samantha-as-collaborator register: (1) a voice-memo -\u003e transcript -\u003e structured-draft pipeline that preserves affect (\"keep the anger in the second one\"), and (2) owner-voice fidelity (\"my voice, not consultant voice\", \"sound like me on a good day\").\n\n## Current state (refs)\n\n- Media plumbing exists: content-addressed store (`packages/agent/src/api/media-store.ts`), SEARCH_KNOWLEDGE media-format facets (`packages/agent/src/actions/knowledge.ts:341-356`), whisper STT via plugin-local-inference. Not composed into memo-\u003eessay.\n- Owner-voice ground truth exists but is unused for style: sent mail, prior essays/threads in knowledge, OwnerFactStore. Nothing builds a style profile or conditions drafting on it.\n- Multi-turn iterative critique works mechanically (planner loop, multi-turn scenarios supported by scenario-runner) — untested for creative persistence; Tier-A riff/critique tasks in the parent cover that without new capability.\n- Optimization hook: a `creative_draft` OptimizedPromptTask slot would let DSPy/GEPA artifacts tune drafting per-owner later (`packages/core/src/services/optimized-prompt.ts:67-108` pattern).\n\n## Proposed\n\n1. Memo-\u003eessay pipeline: ingest audio memos (store + STT + knowledge index with per-memo affect notes), then a composition flow that drafts against the transcripts, preserving per-memo tone directives; output lands as a document artifact, iterable in-thread.\n2. Owner-voice profile: build a style card from owner-authored corpus (sent mail, prior essays) — diction, cadence, stance markers — injected as a provider when a task requests \"my voice\"; refreshed as corpus grows.\n3. Iteration contract: revisions operate on the standing draft artifact (not regenerate-from-scratch), tracking owner vetoes across turns.\n4. Judged voice-fidelity eval: judge compares candidate vs owner-corpus exemplars vs a deliberately generic baseline; scenario passes only when the candidate is closer to the exemplars.\n\n## Acceptance criteria + evidence bar\n\n- Live scenarios: (a) two seeded voice memos (one angry) -\u003e essay retaining the seeded arguments and the anger in the mapped section, verified by judge rubric; (b) Series B narrative + launch thread scored closer to seeded owner exemplars than to the generic baseline; (c) multi-turn revision preserves prior accepted edits.\n- Draft artifacts, style card, and trajectories inspected by hand.\n\n## Out of scope\n\nTTS/voice output; fine-tuning weights on owner text (APOLLO lane); image/deck rendering (narrative text only).\n"])</script><script>self.__next_f.push([1,"16:T1851,"])</script><script>self.__next_f.push([1,"Part of the corpus PII scrub pipeline (multimodal foundation) — and a standalone knowledge-hub improvement.\n\n## Problem\n\nTranscripts already mirror into knowledge and are chunked/embedded like documents, but the mirror is `transcriptPlainText()` (`packages/shared/src/transcripts.ts`), which STRIPS all timing; fragments inherit `transcriptId`/`audioUrl` but have no per-fragment time range. Consequences:\n\n- A search hit cannot seek the stored audio — the player opens at t=0.\n- The PII pipeline cannot map a text-PII span found in a fragment back to an audio timestamp span, which `[pii] Audio redaction` requires.\n- **Live data-loss bug (prerequisite):** voice-session WAVs are invisible to the media GC. `transcriptKnowledgePayload` sets ONLY `metadata.audioUrl` (`plugins/plugin-local-inference/src/services/voice/transcript-knowledge.ts:66`) while `collectReferencedMedia` scans only `content.attachments[].url`/`thumbnailUrl` + `metadata.mediaUrl` (`packages/agent/src/api/media-runtime.ts:161-193`), so the WAV is swept after the 1h grace on the next daily `MEDIA_GC`. `meeting-transcript-writer.ts:425-432` documents this exact hazard and sets BOTH keys; the voice-session path does not. Timestamps into deleted audio are meaningless.\n\nProducer fidelity today: local fused eliza-1-asr ABI v12 gives per-word ms spans (`asrTranscribeTimed`, `plugins/plugin-local-inference/src/services/voice/ffi-bindings.ts:395/918/2193`); meeting segments carry `words: []` because the seam is the locked string-only `ModelType.TRANSCRIPTION` (`plugins/plugin-meetings/src/pipeline/transcriber.ts` header documents why); the cloud STT route parses only `{text}` and discards all timestamps (`packages/cloud/api/v1/voice/stt/route.ts`).\n\n## Architecture\n\n1. **Pre-chunked ingest seam:** optional `fragments?: Array\u003c{text, metadata: {segmentIds, startMs, endMs, speakerLabels}}\u003e` input on `DocumentService.addDocument` (`packages/core/src/features/documents/service.ts:645`) / `processFragmentsSynchronously` (`packages/core/src/features/documents/document-processor.ts:95`). `fragmentMetadata` already spreads document metadata, so per-fragment `startMs`/`endMs` rides jsonb metadata — zero schema/table change.\n2. **Producers chunk on segment boundaries:** `transcriptKnowledgePayload` (`plugin-local-inference/src/services/voice/transcript-knowledge.ts`) and `plugins/plugin-meetings/src/transcripts/meeting-transcript-writer.ts` build ~chunk-size groups from `Transcript.segments` they already hold — never splitting inside a segment.\n3. **Project anchors through search:** `/api/documents/search` result mapping (`plugins/plugin-documents/src/routes.ts:785`) adds `transcriptId`, `startMs`, `endMs` next to `documentId`/`position`; same for the `documents` action=search formatter (`packages/core/src/features/documents/actions.ts`) so agent-facing hits carry anchors.\n4. **Deep-link playback:** `packages/ui/src/components/pages/documents-detail.tsx` / TranscriptPlayer accept an initial seek (`?t=\u003cms\u003e` or prop); `flattenTranscriptWords`/`activeWordIndex` already exist — only the entry offset is missing.\n5. **GC fix (prerequisite):** set `metadata.mediaUrl = audioUrl` in `transcriptKnowledgePayload` (matching the meeting writer) AND/OR make `collectReferencedMedia` also collect `metadata.audioUrl`.\n6. **Producer fidelity (second priority within this issue):**\n   - Meetings word timings: expose timed ASR as a real runtime seam — a service or additive typed model registration in plugin-local-inference wrapping `transcribePcmTimed`/`asrTranscribeTimed` — so plugin-meetings' `AsrBackend` can return `words[]` when the fused v12 lib serves. Do NOT widen the locked `ModelType.TRANSCRIPTION` ⇒ string contract; add a parallel typed surface.\n   - Cloud STT timestamps: `packages/cloud/api/v1/voice/stt/route.ts` requests `response_format=verbose_json` (+ `timestamp_granularities` where the deployed faster-whisper supports it), parses segments/words, and returns them in the DTO alongside `transcript`.\n7. **Edits stay correct for free:** `TranscriptService.update` already deletes + re-adds the mirror; segment-boundary chunking re-derives anchors from patched segments.\n8. **Documented caveat, not fixed here:** v12 word timings are duration-proportional char-weighted, not forced alignment — sufficient for seek/highlight anchors; `validateAsrWordTimings` (`packages/shared/src/transcripts.ts`) remains the producer gate.\n\n## Acceptance criteria\n\n- Fragment rows for a mirrored transcript carry `startMs`/`endMs`/`segmentIds`; boundaries never split a segment (unit + integration against real fixture audio — `plugins/plugin-local-inference/native/audio-fixtures/freeman.wav`, harness pattern `asr-timed.real.test.ts`).\n- `/api/documents/search` and the `documents` action return `transcriptId` + `startMs` + `endMs`; UI evidence: MP4 walkthrough — search a word, click the hit, the player opens mid-audio at the anchor and the word is audible.\n- **GC regression test:** seeded voice-session transcript + WAV → run the referenced-set computation → WAV survives; the test FAILS on current develop behavior.\n- Meetings: with the fused v12 lib present, meeting segments carry `words[]` (`*.real.test.ts` lane, skipped-never-faked when the lib/bundle is absent); cloud STT DTO carries segments/words (live contract test precedent: `packages/cloud/api/__tests__/voice-kokoro-whisper-live.test.ts`).\n- Transcript edit → re-mirror recomputes anchors (test patches a segment, asserts new fragment ranges).\n- Evidence inline in the PR: fragment row dumps, search JSON, deep-link playback video, GC logs (`PR_EVIDENCE.md`).\n\n## Out of scope\n\nThe PII scrub itself; audio muting (`[pii] Audio redaction`); any second file store or files/refcount table (#8876); whisper.cpp resurrection (retired — fused eliza-1-asr only); widening `ModelType.TRANSCRIPTION`.\n\n## Pipeline integration\n\nThis is the multimodal pipeline's text↔time bridge: the LLM-pass finds PII in fragment text; fragment anchors + word timings convert verdicts to timestamp spans consumed by `[pii] Audio redaction`. Fragments are documents, so the corpus enumeration and `pii:\u003csha256\u003e:v\u003cruleset\u003e` idempotency layers apply unchanged.\n"])</script><script>self.__next_f.push([1,"17:T1809,"])</script><script>self.__next_f.push([1,"Part of the corpus PII scrub pipeline — extends it to audio. Depends on `[pii] Transcript fragments with time anchors` (anchors + the audioUrl GC fix).\n\n## Problem\n\nText scrubbing leaves PII audible in stored recordings (voice sessions, meetings). Needed: word-timestamp-aligned muting/bleeping that preserves duration (so every transcript anchor stays valid), a redacted variant stored as a second content-addressed object — original for OWNER/ADMIN, redacted for everyone else, composing with the permissioning epic — and a re-transcribe-verify loop proving the PII is actually inaudible.\n\n## Architecture\n\n- **Span production:** timed ASR per-word `{text, startMs, endMs}` via `eliza_inference_asr_transcribe_timed` (ABI v12 — `plugins/plugin-local-inference/src/services/voice/ffi-bindings.ts:395/918/1515/2193`, `timedAsrSupported()` gate; real-audio contract test `asr-timed.real.test.ts`). Text-PII verdicts from the LLM-pass over anchored transcript fragments merge onto word spans → `[{startMs, endMs}]` with padding. Pseudonym labels for spans come from the corpus map (`[pii] Context-retrieval pass`) so audio and text redaction agree on identity.\n- **Mute op (empirically verified on ffmpeg 8.1.1):** `ffmpeg -i in -af \"volume=0:enable='between(t,S1,E1)+between(t,S2,E2)+...'\" -c:a \u003ccodec\u003e out` — spans compose by summing `between()` terms. Bleep variant: `-f lavfi -i \"sine=f=1000\"` + `filter_complex` `amix duration=first`. Measured: WAV → exact duration, −91 dB true silence in span; OGG/opus → exact; M4A/AAC → +1 trailing encoder frame — assert duration with ±(1024/sampleRate)s tolerance or normalize through WAV. Sample count within the stream never changes, so span coordinates remain valid in the redacted variant.\n- **Runtime capability:** ffmpeg is desktop/server-only (`packages/agent/src/runtime/core-plugins.ts:168`, `packages/core/src/runtime-env.ts:410` — iOS/Android/workers have none); probe like `whichBin('ffmpeg')` in `plugins/plugin-local-inference/src/services/voice/mic-source.ts`. The voice pipeline's native format is 16 kHz mono PCM16 WAV (`ASR_SAMPLE_RATE`), so pure-TS PCM sample zeroing covers WAV with no ffmpeg at all; ffmpeg is the lane for lossy formats. Hosted option: a `media-redact` Railway sibling of `packages/cloud/services/voice-whisper-stt` (same Dockerfile/railway.toml/live-test pattern) — workerd cannot run ffmpeg, cloud-api may only orchestrate.\n- **Storage (#8876-clean):** redacted bytes → `persistMediaBytes` (`packages/agent/src/api/media-store.ts:291`) → new sha256 object at `${STATE_DIR}/media/\u003csha256'\u003e.\u003cext\u003e`, served at `/api/media/\u003csha256'\u003e.\u003cext\u003e`. No new store, no files table, no fileId. Additive optional `Media` field only (sanctioned by the additive-widening block at `packages/core/src/types/primitives.ts:243-249`), e.g. `redactedOf?: string` (source sha) or `variant?: \"redacted\"`.\n- **Permissioning (composes with the epic):** media bytes are served pre-auth — the sha256 is the capability — so enforcement lives at REFERENCE DISTRIBUTION, not the serve path: the transcript/document DTO carries the ORIGINAL sha URL only for `Role.OWNER`/`ADMIN` (`packages/core/src/types/environment.ts:43-51`; `packages/agent/src/api/boundary-role-resolver.ts`), the redacted sha for everyone else; the original hash must never enter non-privileged message records/context. GC: `gcUnreferencedMedia` (`media-store.ts:503`) keeps each variant alive only while referenced.\n- **Re-transcribe-verify loop:** redacted bytes → `runtime.useModel(ModelType.TRANSCRIPTION, {audio, transcriptionPurpose: \"interim\"})` (`TranscriptionParams`, `packages/core/src/types/model.ts:940-952`; local handler = fused eliza-1-asr; `AsrUnavailableError` ⇒ the verify step FAILS, never a vacuous pass) → assert (a) every PII token ABSENT — exact + normalized fuzzy match, NOT transcript equality (Whisper-family models hallucinate filler over silence), and (b) sentinel non-PII words still PRESENT (over-mute guard). Cloud variant: POST the redacted file to voice-whisper-stt `/v1/audio/transcriptions`.\n- Text-side precedent: trajectory redaction (`packages/agent/src/runtime/trajectory-internals.ts:1304` `redactTrajectoryParams`).\n\n## Acceptance criteria\n\n- E2E on real audio: fixture WAV (freeman.wav or a purpose-recorded fixture with planted PII) → spans → mute AND bleep variants across wav/ogg/m4a; per-codec duration assertions; `volumedetect` proves ≤ −85 dB in muted windows.\n- **Redacted-audio artifact opened and LISTENED to by a human** — attach the redacted audio inline in the PR (MP4) with a note of what was heard. Hard evidence gate.\n- Re-transcribe-verify test in the `*.real.test.ts` lane (skipped-never-faked when `ELIZA_INFERENCE_LIBRARY`/`ELIZA_ASR_BUNDLE` absent): PII absent, sentinels present; a deliberately broken run (one span omitted) FAILS the verify.\n- Role test: OWNER DTO carries the original URL; USER/GUEST DTO carries only the redacted URL; a scan proves the original sha never appears in non-privileged room records.\n- GC test: both variants referenced → both survive; original dereferenced (retention state flipped) → original collected, redacted survives.\n- Idempotency: same input sha + same spans + same ruleset version ⇒ identical output sha; the pipeline done-marker makes re-runs no-ops.\n- Constrained-runtime behavior: without ffmpeg, WAV redaction still works (pure-TS zeroing) and lossy-format redaction fails observably (typed error via `runtime.reportError`), never silently skipped.\n\n## Out of scope\n\nVideo/image redaction; live/streaming redaction; any files/refcount table (#8876); serve-path auth changes (the capability model stands); forced-alignment ASR upgrades (char-weighted timing is the documented baseline).\n\n## Pipeline integration\n\nExtends the corpus pipeline to multimodal: LLM-pass verdicts (with corpus-consistent pseudonym labels from the context pass) become timestamp spans via the transcript-anchor issue; execution rides `[pii] Async scrub job rails` and the shared `pii:\u003csha256\u003e:v\u003cruleset\u003e` idempotency layer; the variant swap is the audio analog of the text write-back stage.\n"])</script><script>self.__next_f.push([1,"18:Tb41,"])</script><script>self.__next_f.push([1,"## Problem\nTranscripts are private-by-default at write (`scope 'owner-private'` default, `plugin-local-inference/src/routes/transcripts-routes.ts:95`) but there is no agent-driven way to redact or share one, and edit-in-place is proven wrong: `TranscriptViewerOverlay` edits persist via updateMemory but never touch the chat-message text copy or the immutable audio — redaction MUST be variant-based.\n\n## Current state\n- Storage: transcripts = memories rows, `tableName 'transcripts'`, `content.transcript` JSON (`transcript-store.ts:24-27`); `plugin-meetings` writer byte-compatible (golden test).\n- Contract: `packages/shared/src/transcripts.ts` — `TranscriptScope:51-56`; consent/policy/permission vocabularies (`TRANSCRIPT_CONSENT_STATES:110-118` etc.) exist but are UNWIRED (grep-clean in plugin-meetings).\n- Redaction primitives: `redact.ts`, `secret-swap.ts`, `pii-pseudonymizer.ts` + `entity-recognizer.ts` (`packages/core/src/security/`); export-variant precedent `TrajectoriesService.redactTrajectoryPrompts` (`TrajectoriesService.ts:2528-2537`).\n- Roster: `MeetingSession.participants` (`packages/shared/src/meetings.ts:101-114`).\n\n## Proposed change\n1. Agent actions (roleGated via `satisfiesRoleGate`, AccessContext-checked via `hasRoleAccess` `roles.ts:979`):\n   - `REDACT_TRANSCRIPT` (minRole USER on own scope, ADMIN for others'): generates a redacted VARIANT — pipeline over segments+text: detectPii + entity recognizers + PseudonymSession (deterministic per transcript); variant stored as new transcript-linked record + (if exported) new media object with new sha256; original untouched; redacted DTO **withholds audioUrl** (audio never redacted in v1).\n   - `SHARE_TRANSCRIPT` (grant per PERM-ACL: person or room-snapshot; mode full|redacted).\n   - **Admin ask→redact-for-all**: ADMIN in the meeting room asks the agent → redacted variant becomes the disclosed version for every non-privileged grant; OWNER/ADMIN retain full.\n2. Persist consent state at capture (`TRANSCRIPT_CONSENT_STATES` recorded from the meeting flow) — storage only; enforcement out of scope.\n3. Wire the marker retirement path: share/download/delete unified with the Files surface per #8876 AD-completeness(2) (`TRANSCRIPT_MARKER` round-trip at `TranscriptViewerOverlay.tsx:54` slated for retirement) — do the transcript-share part here, full unification tracked in #8876 follow-ups.\n\n## Acceptance criteria\n- Live-LLM scenario: meeting transcript captured → participant asks agent to share → agent shares redacted to USER, full to ADMIN — trajectory evidence attached and read.\n- Variant determinism test (same transcript → same surrogates); original + chat copy + audio byte-identical after redaction.\n- Actions respect roleGate; denied attempts audit-logged.\n\n## Out of scope\nAudio waveform redaction, consent ENFORCEMENT, UI (PERM-UX).\n\n\nPart of #14747 and #14749"])</script><script>self.__next_f.push([1,"19:Ta46,"])</script><script>self.__next_f.push([1,"## Goal\nShip per-viewer access control for shared artifacts (transcripts first) designed INSIDE the #8876 attachments doctrine: reference-layer ACL, capability URLs untouched, redacted variants as separate media objects. Answers #8876 open question 4 (the ONE authz predicate) and resolves the AD11 role conflict.\n\n## Non-negotiable constraints (from doctrine research)\n- ONE content-addressed store (`packages/agent/src/api/media-store.ts`, `${STATE_DIR}/media/\u003csha256\u003e.\u003cext\u003e`); pre-auth serve is LOAD-BEARING (AD4a: 'the hash is the capability'; native in-process handlers `handleMediaRouteRequest:747-808` carry no session).\n- AD1: no files/file_references table, no fileId on Media, no refcount engine; `ContentType` frozen append-only.\n- GC reference set = `content.attachments[].url` / `thumbnailUrl` / `metadata.mediaUrl` only (`collectReferencedMedia`, `packages/agent/src/api/media-runtime.ts:161-195` ish setting up your dedicated agent…\"* → **Retry setup** (re-dispatches the handoff supervisor)\n   - missing local model was already covered in-chat by the model-status conductor (**Download now** / **Use Eliza Cloud instead**) — unchanged.\n   Controls ride a reserved `__boot_recovery__:` value prefix consumed by the send funnel (never reaches the server); the card updates in place, returns its controls after an action settles (no dead-end \"Reconnecting…\" states), removes itself the moment the agent is healthy, and never renders during onboarding (first-run conductor owns that screen) or the no-provider state (the transcript's no-provider gate owns it).\n\n**4. No chat suggestions anywhere.** The FTU welcome dashboard widget (greeting + \"try saying…\" chips), the resting composer suggestion strip, `usePromptSuggestions`, and the now-consumerless `POST /api/suggestions` server route are all deleted. The agent is proactive; canned prompts are gone.\n\n**5. Onboarding is truly full-screen, then settles to half.** The content-sizing seam that shrank the pinned onboarding sheet is removed — onboarding owns the whole screen. On the completion edge the sheet **springs FULL → HALF** (was: collapse) in step with the opaque-backdrop fade, so the home appears behind the top half while the conversation stays in hand.\n\n**6. Cloud-only onboarding confirmed unchanged** — the runtime chooser stays default-off everywhere (`first-run-runtime-flag.ts`), sign-in to Eliza Cloud is the single path.\n\n## Tests\n- NEW `use-boot-recovery-conductor.test.ts` — 11 cases: stall threshold, signed-out vs unresponsive ordering, onboarding/no-provider gating, removal on recovery, handoff card + retry dispatch, re-login/restart control flows incl. failure cards, reserved-prefix consumption.\n- `ContinuousChatOverlay.test.tsx` — no-pill-ever + no-suggestions-ever regression tests replace the old banner grace-gate suite.\n- `cloud-agent-lifecycle.spec.ts` — handoff test reworked to the real surfaces: home tile tracks migrating→switched; failure asserts the in-chat card and clicks `choice-__boot_recovery__:retry-handoff`.\n- Onboarding e2e helpers: `expectOnboardingSettleToHalf` asserts `data-detent=\"half\"` on the completion edge across all onboarding lanes.\n- e2e-runner scripts/stubs purged of the deleted hook (all pass `node --check`).\n\nPre-existing on develop tip (verified on a clean `origin/develop` worktree, NOT from this change): `widget-coverage` floor 26 vs 25, and 3 `typing-dots` TurnStatus tests — tracked separately.\n\n## Evidence\n- [ ] Playwright: onboarding-cloud-only + cloud-agent-lifecycle + onboarding-to-home lanes (chromium) — attached below\n- [ ] Screenshots: onboarding full-screen, post-completion half detent (desktop + mobile viewport)\n- [ ] Video: completion edge full→half animation\n- [ ] In-chat boot-recovery card render (signed-out + handoff-failed states)\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"1f:Tc53,"])</script><script>self.__next_f.push([1,"## Notification shade rework\n\nReworks the home notification surface per product direction. Six changes:\n\n1. **No card chrome.** The inbox floats on the shade's surface — no fill, no border, no blur of its own (`HOME_GLASS_CLASS` dropped from `NotificationsHomeCenter`).\n2. **Bulk clear-all removed.** The header trash button is gone; notifications are dismissed one at a time.\n3. **Pointer-idiomatic per-row dismiss.** A mouse reveals an **X on hover/focus**; touch **throws the row left or right** past a threshold to dismiss (springs back below it).\n4. **Gesture inverted.** The shade now **drops DOWN** from a top hint — or from a **downward drag anywhere** on the home when scrolled to top — and **drags UP to hide**. This is the inverse of the chat sheet, which rises from the bottom.\n5. **Pull-down collapses chat.** Revealing the shade fires a new `CHAT_COLLAPSE_EVENT`, wired into `ContinuousChatOverlay` (`goT arded (never stash / never lose work) and ride along in this diff. The notification rework is the top commit `feat(ui): rework notification shade …`. Review that commit in isolation, or split the WIP out before merge if a narrower PR is wanted.\n"])</script><script>self.__next_f.push([1,"20:T2923,"])</script><script>self.__next_f.push([1,"Operator-lane tooling for #11632 (LifeOps live validation). Everything agent-resolvable in #11632 was already green; this PR ships the surfaces the HUMAN lane needs:\n\n- `bun run lifeops:hitl` — loopback credential-intake dashboard (pops up): a row per connector family, atomic whitelisted `.env` writes (masked last-4, never echoed), **live fetch probes** per family (Telegram getMe, Discord users/@me, Slack auth.test, X OAuth1-signed users/me, WhatsApp graph, Twilio, Signal, model endpoints, health providers, Plaid/PayPal sandboxes), OAuth link-outs to the real app flows\n- `node scripts/lifeops/run-11632-live-lanes.mjs` — ordered live-lane driver; tees the exact artifacts the status collector greps; SKIP-with-reason for missing creds; refuses to mark a lane live-proven if its live describes skipped; `--dry-run` / `--lane=N`\n- `lifeops-live` group registered in the generic HITL runner (scripts/hitl, closes the #14381 inventory gap for #11632)\n- runbooks repointed off the retired `.github/issue-evidence` path to `reports/lifeops-live-validation/` + inline evidence per PR_EVIDENCE.md\n\n**Verified live (in this session):** Cerebras model probe green (3 models listed via real GET /v1/models); X probe honest-403 (app-only bearer forbidden for users/me, dashboard exposes the TWITTER_ACCESS_TOKEN(+_SECRET) inputs the operator must fill); adversarial secret-leak sweep: 0 occurrences of 29 .env values \u003e8 chars across 18 output artifacts; atomic .env upsert verified byte-identical-restore.\n\n**Codex follow-up:** tightened X lane readiness to the OAuth 1.0a tuple that plugin-x's live test helper actually requires, and fixed the backg NNECTOR_PATHS` registry, `scripts/lifeops/connector-paths.mjs`), each with its own env slots, availability verdict, live probe, freshness badge, and — where possible — a one-click acquisition. Feature issues: #14791 (auth-path matrix), #14792 (one-click logins), #14794 (evidence ledger + freshness), #14795 (OWNER/AGENT slots), #14799 (free-probe catalog).\n\n**Features**\n\n- **Layered env resolution** (`scripts/lifeops/env-layers.mjs`): `process.env` \u003e worktree `.env` \u003e **main-checkout `.env`** (git-discovered via `rev-parse --git-common-dir`, linked worktrees only) \u003e `~/.eliza/.env`. Every field renders its winning source layer badge; the header prints all four resolved file paths. The dashboard never mutates `process.env`, so badges stay truthful after saves.\n- **Saves** default to `~/.eliza/.env` (created on demand, atomic tmp+rename, mode 600 — survives worktree churn) with a per-save toggle for the repo `.env`. Writes are allowlisted to the 68 registry env names; `WRITE_ALIASES` keeps divergent spellings in sync (`ELIZAOS_CLOUD_API_KEY`↔`ELIZA_CLOUD_API_KEY`, `ELIZA_WHATSAPP_*`↔`WHATSAPP_*`). POSTs are loopback-only + same-origin + per-process session token.\n- **One-clicks:** GitHub token reuse from the `gh` CLI keyring (server-side, saved masked), headless SIWE login against real Eliza Cloud (`scripts/cloud/siwe-test-login.mjs`), `signal-cli link` pairing-URI emission, and deep-links into the app's own OAuth flows.\n- **OWNER/AGENT identity slots** (matrix states 2/3/6): `github.pat` carries real env slots (`GITHUB_USER_PAT`/`GITHUB_AGENT_PAT` + `ELIZA_E2E_*` fallbacks, `rolesVia: env-slots`); Google/X roles ride OAuth `metadata.requestedRole` or separate real accounts per the owner-agent matrix doc §3 (`rolesVia` encodes which).\n- **Committed evidence ledger** `docs/testing/hitl-ledger.json` (`scripts/lifeops/hitl-ledger.mjs`): per path `{pathId, lastSuccessAt, lastRunAt, lane, commit, counts:{passed,failed,skipped}}`, stable-sorted, atomic mpile guards like the foundation).\n- `src/certify/keys.ts` — node:crypto Ed25519 keygen, SPKI-DER sha256 fingerprints (first 16 hex), signing-key ingress (`ELIZA_CERT_SIGNING_KEY` PEM or base64-wrapped PEM, or `--key-file`). Nothing here writes or logs a private key.\n- `src/certify/rollup.ts` — mechanical draft verdicts from lane `result.json` counters, `analysis.json` expectation failures, and caller-declared requirements (honest-skip: skipped/absent lanes fail unless marked optional-with-reason, then draft as `waived` carrying the reason).\n- `src/certify/sign.ts` — `signCertification` / `verifyCertification` with distinct typed failure codes; the report lists **all** detectable failures, never first-failure-only.\n- `src/certify/cli.ts` + package scripts — `certify:keygen | rollup | sign | verify`.\n- `.github/certification/` — trust-model README (base-branch key rule, rotation, break-glass) written explicitly for #14547 to implement. The public-key PEM is deliberately NOT in this PR: the key custodian lands the production key in a dedicated reviewed PR (merging it is the act of trusting the key).\n\n## Certification schema (`schema: 1`)\n\n```ts\n{\n  schema: 1,\n  bundleSha: string,      // sha256 hex of the bundle's manifest.json bytes\n  commit: string,         // full 40-hex sha — short shas rejected\n  branch: string,\n  baseRef: string,\n  tier: 'cpu' | 'gpu' | 'full',\n  verdicts: [{ subject, verdict: 'pass'|'fail'|'waived',\n               evidence: string[] /* bundle-relative */, notes? }],\n  reviewer: { kind: 'agent'|'human', id, model? },\n  createdAt: string, expiresAt?: string,\n  signature: { alg: 'ed25519', publicKeyFingerprint, value /* base64, 64 bytes */ }\n}\n```\n\nSignature = Ed25519 over `canonicalJsonBytes(payload-without-signature)` (sorted keys, no whitespace, one trailing newline — the foundation's canonical form). Parsing is **strict**: unknown top-level fields, unknown verdict values, absolute/traversal evidence paths, duplicate subjects, empty verdict arrays, and `waived` without non-empty notes are all rejected. Forward compat is a `schema` bump, never silent tolerance.\n\n## Threat model (summary — full text in `.github/certification/README.md`)\n\n- **The gate MUST read the public key from the BASE branch (`main`), never the PR head** — otherwise one PR swaps key + self-signed cert together. Key rotation = a reviewed PR replacing the pem; merging it is the act of trusting the new key.\n- A valid signature proves a keyholder signed these verdicts over this manifest for this commit. `bundleSha` binds the manifest; the foundation's `metaSha256` binds `meta.json` (commit/branch/tier source) transitively — forging provenance after signing surfaces as `bundle-tampered`.\n- It does **not** prove diligence; the reviewer identity is inside the signed payload for exactly that reason, and the gate should surface it in the check summary.\n- `wrong-key` (different keypair) is distinguished from `bad-signature` (altered payload); forging the trusted fingerprint on a foreign signature moves the failure to `bad-signature` — the crypto check still holds (tested).\n- Break-glass is **not a code path**: admin bypass of the required check, visible in the GitHub audit log. There is deliberately no flag or env var that skips signature checks.\n- `certify:sign` refuses to sign a bundle that fails integrity verification, and the verifier hard-errors (rather than reporting \"cert invalid\") on a misconfigured trusted key so an attacker cannot induce a misleading outcome.\n\n## Verify contract for #14547\n\n```bash\nbun run --cwd packages/evidence certify:verify -- \\\n  --cert \u003ccertification.json\u003e \\\n  --pubkey \u003cBASE-branch\u003e/.github/certification/certification-public-key.pem \\\n  --expected-commit \u003cpr-head-sha\u003e --max-age-hours 72 --required-tier full \\\n  [--bundle \u003cdir\u003e] --json\n```\n\nExit `0` iff valid, `1` otherwise. `--json` prints the full `CertificationVerifyReport` on stdout: `{ ok, failures: [{code, message, context}], payload?, certification?, bundle? }` with codes `schema-invalid | unsigned | bad-signature | wrong-key | stale | commit-mismatch | bundle-tampered | verdict-failures | tier-insufficient`.\n\n## Evidence (PR_EVIDENCE.md)\n\n### Full test output — 156/156 (97 foundation kept green + 59 new), real Ed25519 keys, real bundles, no mocked crypto\n\n\u003cdetails\u003e\u003csummary\u003ebun run --cwd packages/evidence test — 11 files, 156 tests passed\u003c/summary\u003e\n\n```\n RUN  v4.1.5 packages/evidence\n\n ✓ src/certify/keys.test.ts        (11 tests)  fingerprint algorithm locked against fixed fixture;\n                                               env PEM / base64-wrapped / key-file ingress; no key echo in errors\n ✓ src/certify/schema.test.ts      (14 tests)  strictness: unknown fields, unknown verdicts, traversal\n                                               evidence paths, waived-without-notes, dup subjects, short shas\n ✓ src/certify/rollup.test.ts      (10 tests)  honest-skip semantics, unparseable reporters fail,\n                                               analysis expectation failures, required artifacts\n ✓ src/certify/sign.test.ts        (18 tests)  round-trip + full tamper matrix (below)\n ✓ src/certify/cli.test.ts          (4 tests)  keygen privacy, usage errors, sign-refuses-tampered-bundle,\n                                               execFile end-to-end keygen→rollup→sign→verify→tamper→red\n ✓ foundation suite (schema, canonical, bundle, provenance, ingest, cli) — all green\n\n Tamper matrix (each case fails with ITS code; combined tampering reports ALL codes together):\n ✓ bad-signature: any payload byte altered after signing\n ✓ bad-signature + verdict-failures: a pass verdict flipped to fail\n ✓ bundle-tampered: manifest edited after signing\n ✓ bundle-tampered: an artifact swapped out from under the manifest\n ✓ wrong-key: re-signed with a different keypair\n ✓ bad-signature: attacker forges the trusted fingerprint but not the signature\n ✓ stale: createdAt beyond max-age and expiresAt in the past\n ✓ commit-mismatch: certification for a different commit\n ✓ tier-insufficient: cpu cert against a full-tier requirement\n ✓ verdict-failures: a signed failing verdict is still a failing certification\n ✓ schema-invalid: waived-without-notes signed by hand cannot verify clean\n ✓ schema-invalid: unknown top-level field injection breaks the parse\n ✓ schema-invalid: evidence path traversal in a hand-signed certification\n ✓ unsigned: signature field missing entirely\n ✓ schema-invalid: unreadable and non-JSON certification files\n ✓ reports ALL failures together when tampering is combined\n ✓ throws (not reports) on a misconfigured trusted public key\n\n Test Files  11 passed (11)\n      Tests  156 passed (156)\n   Duration  937ms\n```\n\nAlso green: `bunx tsgo --noEmit -p tsconfig.json` (package typecheck), `bunx @biomejs/biome check src ../../.github/certification`, `bun run audit:error-policy-ratchet` (\"no new fallback-slop in touched files\").\n\n\u003c/details\u003e\n\n### Domain artifact — real CLI transcript: keygen → bundle → rollup → sign → verify → tamper → verify-fails\n\n\u003cdetails\u003e\u003csummary\u003eFull pipeline against a real fixture repo (throwaway demo key)\u003c/summary\u003e\n\n```console\n$ bun run certify:keygen -- --print-private-key --pubkey-out demo-pub.pem\npublic key written: .../demo-pub.pem\nWARNING: private key follows on stdout. Store it as the ELIZA_CERT_SIGNING_KEY secret; never commit it, never write it to disk.\n-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEA/tMMejkpK2OKpuscOb5KwU7KhPsZfIAwXtFM70k1baY=\n-----END PUBLIC KEY-----\nfingerprint: 3955d54306d3c948\n[throwaway demo private key omitted]\n\n$ bun run bundle:create -- --tier cpu --repo-root fixture --out runs\nbundle 20260706-012435-1a6b668-cpu\n  commit 1a6b668b503871246d2c88cf28b94ff2fdc3e6a4 (feat/14546-demo) runner=local tier=cpu\n  e2e-recordings           ingested  1\n  playwright-test-results  ingested  1\n  artifacts: 2\n  sha256:    84bf606212a989c3d6b5718052bd89833cd2899852a71b504c88066e582e3648\n\n$ bun run certify:rollup -- --bundle runs/20260706-012435-1a6b668-cpu --out verdicts.json\nsubjects: 1 (pass=1 fail=0 waived=0); lanes=1 analyses=0\n# verdicts.json: {\"schema\":1,\"verdicts\":[{\"subject\":\"lane:e2e\",\"verdict\":\"pass\",\n#   \"evidence\":[\"lanes/e2e/result.json\"],\"notes\":\"passed=42 failed=0 skipped=0\"}], ...}\n\n$ ELIZA_CERT_SIGNING_KEY=\u003cbase64-wrapped PEM\u003e bun run certify:sign -- \\\n    --bundle runs/20260706-012435-1a6b668-cpu --verdicts verdicts.json \\\n    --reviewer-id shaw --reviewer-kind human --base-ref develop\ncertification written: .../certification.json\n  commit 1a6b668b5038... (feat/14546-demo → develop) tier=cpu\n  verdicts: 1 (pass=1 fail=0 waived=0)\n  reviewer: human:shaw\n  key fingerprint: 3955d54306d3c948\n\n$ bun run certify:verify -- --cert .../certification.json --bundle ... --pubkey demo-pub.pem \\\n    --expected-commit 1a6b668b503871246d2c88cf28b94ff2fdc3e6a4 --max-age-hours 72 --required-tier cpu --json\n{ \"ok\": true, \"failures\": [], ... \"bundle\": { \"ok\": true, \"verifiedCount\": 2 } }   # exit 0\n\n# tamper: forge the lane result inside the bundle\n$ echo '{\"passed\": 999, \"failed\": 0, \"skipped\": 0}' \u003e .../lanes/e2e/result.json\n$ bun run certify:verify -- --cert ... --bundle ... --pubkey demo-pub.pem --expected-commit 1a6b668...\n  bundle-tampered: bundle integrity check failed: size-mismatch:lanes/e2e/result.json\n  FAILED                                                                           # exit 1\n\n# wrong key: verify against the repo-committed PROJECT key instead of the demo key\n$ bun run certify:verify -- --cert ... --pubkey .github/certification/certification-public-key.pem\n  wrong-key: certification was signed by a different key (fingerprint 3955d54306d3c948, trusted key is 3ac9e3e625a9ed2f)\n  FAILED metric) are ported with behaviour preserved and real tests added; the missing cheap heuristics from the issue are implemented.\n\n\u003e **Stacked on #14589** (foundation, merged to develop) and its post-review hardening commit on `feat/14552-evidence-bundle` (merged in here). Mark ready + rebase once that hardening lands on develop. All **97 foundation tests stay green** alongside the **39 new analyzer tests** (136 total).\n\n## Analyzers\n\n| name | tier | consumes (kinds) | output |\n| --- | --- | --- | --- |\n| `ocr.tesseract` | cpu | screenshot, keyframe | `{ engine, text, words, confidence }` (ported; `skipped-missing-tool` when tesseract absent) |\n| `ocr.unlimited` | gpu | screenshot, keyframe | same shape via OpenAI-compatible `llama-server` (Baidu Unlimited-OCR, #14543); endpoint `ELIZA_GPU_VISION_URL`, `skipped-missing-tool` when unset/unreachable |\n| `color.palette` | cpu | screenshot, keyframe | dominant-k quantized swatches `{ hex, rgb, fraction }` (ported) |\n| `color.corners` | cpu | screenshot, keyframe | 4-corner + centre swatches `{ position, rgb, hex, bucket }` — wrong-theme / dark-mode bleed |\n| `brand.rules` | cpu | screenshot, keyframe | blue/orange/neutral fractions + brand verdict (orange-accent-only, no-blue) (ported) |\n| `diff.change` | cpu | screenshot, keyframe | size-agnostic change fraction + bbox (ported); baseline via `ctx.baselineResolver` |\n| `diff.region` | cpu | screenshot, keyframe | pixelmatch -\u003e clustered changed-region bboxes `[{x,y,w,h,fraction}]` + per-region change/static assertions |\n| `hash.perceptual` | cpu | screenshot, keyframe | 64-bit DCT pHash + Hamming/same-screen utils (no new dep — computed on sharp raw) |\n| `tree.aria` | cpu | html-tree | node count + normalized snapshot; pure `normalize`/`diff`/`prune` exports (no Playwright dep) |\n| `video.keyframes` | cpu | video | ffmpeg scene-cut + first/last frames -\u003e emits `keyframe` artifacts under `video/keyframes/\u003cslug\u003e/`; image analyzers then fan over them |\n\n**Engine indirection** (`OcrEngine = { id, available(), recognize() }`) lets one analyzer body serve tesseract, the gpu `unlimited` client, and `apple-vision`. The **Apple Vision** helper (`packages/app/scripts/ocr-vision.swift`, PR #14490) is merged in develop and wrapped as `AppleVisionOcrEngine` (macOS + swift, stdin NDJSON); it is exported but not yet in the default registry pending the consumer-migration follow-up (#14470).\n\n**New dep:** `pixelmatch@^7` (was already a transitive dep). `sharp@^0.34.5` (repo-standard) added explicitly. Both appended to `package.json` without reordering existing keys.\n\n## Evidence\n\n### Full package test output (136 passed = 97 foundation + 39 analyzers)\n\n\u003cdetails\u003e\u003csummary\u003ebun run --cwd packages/evidence test\u003c/summary\u003e\n\n```\n Test Files  14 passed (14)\n      Tests  136 passed (136)\n```\n\nFoundation (untouched): schema/canonical/bundle/provenance/ingest/cli = 97. Analyzers = 39.\n\u003c/details\u003e\n\n### Optional tools that executed locally\n\nBoth optional external tools **actually ran** in this environment (not skipped):\n\n- **tesseract 5.5.2** — `ocr.tesseract` recovered rendered text from a synthetic text-PNG (176 ms, real recognition).\n- **ffmpeg 8.1.1** — `video.keyframes` extracted scene-cut + first/last frames from a two-scene video generated in-test (125 ms + 132 ms), and the runner integration test ran the full keyframe fan-out (411 ms).\n\nThe GPU `ocr.unlimited` client is tested against a **local stub HTTP server** asserting the OpenAI-compatible request shape (model, temperature 0, base64 image data URL) + response parsing — the real-model path is the gpu lane's live test (#14543), N/A here.\n\n\u003cdetails\u003e\u003csummary\u003eanalyzer test list (real tools tagged by duration)\u003c/summary\u003e\n\n```\n ✓ ocr.tesseract \u003e reads rendered text ... 176ms          (real tesseract)\n ✓ video.keyframes \u003e extracts first + last (+ scene) ... 1 } ], \"verdict\": \"pass\" } },\n    \"diff.change\": { \"status\": \"ran\", \"durationMs\": 5, \"data\": { \"changed_fraction\": 0.0413, \"changed_bbox\": [89,83,166,108], \"grid\": [256,192] } },\n    \"diff.region\": { \"status\": \"ran\", \"durationMs\": 12, \"data\": { \"changed_fraction\": 0.04, \"grid\": [400,300], \"regions\": [ { \"x\": 0.325, \"y\": 0.4333, \"w\": 0.325, \"h\": 0.1333, \"fraction\": 0.04 } ], \"assertions\": [] } },\n    \"hash.perceptual\": { \"status\": \"ran\", \"durationMs\": 5, \"data\": { \"phash\": \"9999666699996666\" } }\n  }\n}\n```\n\nThe `diff.region` box (x 0.325, y 0.433, w 0.325) lands exactly where the 120x40 accent was composited at (140, 130) on a 400x300 frame — verified, not hand-authored. `ocr.unlimited` records `skipped-tier` honestly on a cpu run.\n\u003c/details\u003e\n\n### Verification\n\n| gate | result |\n| --- | --- |\n| `bun run --cwd packages/evidence test` | 136 passed (97 foundation + 39 analyzers) |\n| `bun run --cwd packages/evidence typecheck` (`tsgo`) | clean |\n| `bunx @biomejs/biome check packages/evidence` | clean |\n| `bun run audit:error-policy-ratchet` | no new empty-catch / server-console in touched files |\n\n### Evidence rows N/A\n\n- **Frontend screenshots / video walkthrough** — N/A: this is a pure library (no UI surface). Rendered proof is the `analysis.json` above.\n- **Real-LLM trajectories** — N/A: no agent/action/prompt/model behaviour changed. The GPU vision-model path is the gpu lane's live test (#14543).\n- **Per-platform native capture** — N/A: node library, exercised on the CI matrix via vitest.\n\n## Ownership\n\nOwns `packages/evidence/src/analyzers/**` (new) + analyzer test fixtures; additive-only edits to `src/index.ts` (appended analyzer exports) and `package.json` (appended `pixelmatch`, `sharp`). Did not touch schema.ts / bundle.ts / canonical.ts / provenance.ts / ingest.ts / cli.ts (foundation-owned) beyond taking the hardening branch's versions in the merge, or anything under `packages/app/**` or `scripts/**`.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nCo-Authored-By: Claude Fable 5 \u003cnoreply@anthropic.com\u003e"])</script><script>self.__next_f.push([1,"25:T1f50,"])</script><script>self.__next_f.push([1,"Part of #14541. Closes #14544. **Stacked on #14589 (`feat/14552-evidence-bundle`)** — mark ready + rebase onto `develop` after that merges. The diff below is scoped against the foundation branch.\n\n## What \u0026 why\n\nAgent-invoked **VLM screenshot Q\u0026A** in `packages/evidence`: a reviewing agent (claude/codex) generates targeted questions about a screenshot and gets **structured** answers back — the semantic layer (blue-fraction, OCR, diff regions) can't answer \"is the Send button clipped?\" or \"is this the designed empty state or a blank panel?\". Answers land in `qa.json` beside the pixels with full model + token-usage provenance so the certify reviewer (#14546) folds them into verdicts.\n\nRuns **standalone in minimal containers** — no dependency on `@elizaos/*` plugin packages. Talks to the model APIs by direct `fetch` (the plugin conventions were read for the wire shapes, not imported).\n\n### Design points\n- **One request per image carrying ALL questions** — image tokens paid once; response forced to strict JSON `{answers:[{id,answer,confidence,details}]}`.\n- **Strict parsing, no regex rescue.** A non-conforming response throws `VISION_RESPONSE_INVALID`; exactly **one** corrective retry is spent (and counted in `provenance.retries`) before failing typed. Never a fabricated answer.\n- **NOT_CONFIGURED is a typed failure, never a default.** No key / base URL / explicit backend ⇒ `VISION_NOT_CONFIGURED` (keyless-env contract: explicit skip, never invented answers).\n- **Downscale longest edge → 1568px** via sharp before base64 (Anthropic downsamples past that anyway); original + sent dimensions recorded.\n- **Content-addressed cache** at `\u003cbundle|cwd\u003e/.vision-qa-cache/\u003csha256(image)\u003e/\u003csha256(model+backend+questions-canonical)\u003e.json` using the foundation's `canonicalJson` for the query key; `--no-cache` bypass; corrupt entry ⇒ miss.\n\n### Backends (one interface, `VisionBackendClient`)\n\n| Backend | Transport | Model default | Image | Key |\n| --- | --- | --- | --- | --- |\n| `anthropic` | Messages `/v1/messages` | `claude-opus-4-8` | base64 block | `ANTHROPIC_API_KEY` |\n| `openai` | chat.completions | `gpt-5.5` | `image_url` data-URI + `response_format: json_object` | `OPENAI_API_KEY` |\n| `local` | chat.completions @ `ELIZA_VISION_QA_BASE_URL` | `qwen3-vl` | `image_url` data-URI | none (llama-server) |\n\n`ELIZA_VISION_QA_BACKEND` ∈ `anthropic|openai|local`; default `anthropic` when key present, else `local` when base URL set, else NOT_CONFIGURED.\n\n### Deliverables\n- `askAboutImage(imagePath, questions, opts)` + `askBatch(entries, opts)` (inline p-limit, dependency-free; a per-entry failure rejects the batch — no silent drops). Anthropic Message-Batches API left as a documented seam, no stub.\n- `suggestQuestions(analysis, {viewName?, expectations?})` — pure/deterministic; turns blue-over-threshold, large diff regions, and OCR dev-strings into targeted question drafts with stable ids.\n- `writeQaRecord(bundle, subjectBundlePath, questions, askResult)` → kind `qa`, placed via `bundlePath` beside the subject (`visual/…/x.png` → `visual/…/x.qa.json`).\n- CLI: `bun run --cwd packages/evidence vision-qa -- ask \u003cimage\u003e -q \"…\" [--context analysis.json] [--backend …] [--json]` — `--context` runs `suggestQuestions` and merges ahead of `-q`.\n\n### Foundation contract (absorbed the #14589 review-hardening)\nRebased onto `c902a6a5fe6` (symlink-aware verify, `metaSha256` provenance binding, strict-canonical objects). Impact confirmed: `writeQaRecord` builds plain-object/ISO-string records (`canonicalJson` no longer accepts Date/Map/class instances — pinned by a test), copies via `addArtifact` (no symlinks), and my `qa-record` test's `verifyBundle` still passes clean under the new verify.\n\n## Evidence\n\n### Deterministic tests — 66 pass, 1 skipped (live)\n\n\u003cdetails\u003e\u003csummary\u003epackages/evidence · vision-qa suite (verbose)\u003c/summary\u003e\n\n```\nTest Files  9 passed | 1 skipped (10)\n     Tests  66 passed | 1 skipped (67)\n\nbackends.test.ts  — request-shape (exact JSON body, image block) + strict-parse rejection (both backends)\nask.test.ts       — LOCAL STUB HTTP server: structured answers, retry accounting, cache hit/miss/bypass,\n                    transport-error surfacing, downscale dimensions, dup-id / empty-list guards\nconfig.test.ts    — backend resolution order + NOT_CONFIGURED (fully controlled env)\ncache.test.ts     — canonical query hash (stable under key reorder), round-trip, corrupt→miss\nimage.test.ts     — downscale math (all orientations, no-upscale, exact-cap) + real-PNG prep + typed decode failure\nsuggest.test.ts   — 3 synthetic analysis fixtures (clean/anomalous/OCR-dirty) + determinism + camelCase\nqa-record.test.ts — beside-subject placement, kind 'qa', verifyBundle clean, canonical-serializable pin\ncli.test.ts       — table + --json output, --context merge, usage/error exit codes (stub server)\nbatch.test.ts     — input-order preservation, concurrency-limit honored, per-entry failure rejects batch\n```\n\u003c/details\u003e\n\nFull package suite green (foundation + vision-qa): **163 pass | 1 skipped**. `typecheck` clean, `biome check src` clean, `audit:error-policy-ratchet` → \"no new fallback-slop in touched files\".\n\n### Real-LLM live trajectory — **N/A (no key in this environment)**\n\n`vision-qa.live.test.ts` renders a fixture PNG (orange \"Send\" button beside a blank panel) and asks 3 questions against the **real** Anthropic vision model. This environment exposes only `ANTHROPIC_BASE_URL` (no `ANTHROPIC_API_KEY`), so the suite **self-skipped honestly** — it did not run and no answers were fabricated. It is **registe text\": \"sia Welcome to Eliza. How can | help you today?\\nChat\\nDocuments\\nDatabase\\nFiles\\nSettings\\nMessage Eliza... | et\",\n    \"words\": 19,\n    \"confidence\": null\n  }\n}\n```\n\nSample ARIA snapshot from the send-message walkthrough:\n\n```yaml\n- navigation:\n  - heading \"Eliza\" [level=1]\n  - button \"Chat\"\n  - button \"Documents\"\n  - button \"Database\"\n  - button \"Files\"\n  - button \"Settings\"\n- main:\n  - text: \"Welcome to Eliza. How can I help you today? What is the weather today? Got it — I received: What is the weather today?\"\n  - textbox \"Message input\":\n    - /placeholder: Message Eliza…\n  - button \"Send message\": Send\n```\n\nThe actual MP4s/keyframes are local generated artifacts and are reproducible from the command above. Per repo evidence policy, they are not committed into the repository; manual drag-drop to the PR remains available if maintainers want inline binaries before undrafting.\n\n## Verification\n\n- `bun run --cwd packages/evidence test` -\u003e 35 files passed, 1 skipped; 307 tests passed, 1 skipped.\n- `bun run --cwd packages/evidence typecheck` -\u003e passed.\n- `bun run --cwd packages/evidence lint` -\u003e passed.\n- `bun run audit:error-policy-ratchet` -\u003e no new fallback-slop in touched production files.\n- `git diff --check` -\u003e passed.\n- `bun run --cwd packages/evidence video:walkthrough -- --def all --bundle /tmp/eliza-video-pr14629-84180de51c-ocr` -\u003e produced element, feature, and walkthrough videos with manifest artifacts.\n- `bun run --cwd packages/evidence bundle:verify -- /tmp/eliza-video-pr14629-84180de51c-ocr` -\u003e 33 artifacts verified, 0 issues.\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] Before screenshots `N/A - new evidence infrastructure; no product UI surface changed`.\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] After screenshots `Generated as bundle keyframes/screenshots under /tmp/eliza-video-pr14629-84180de51c-ocr; sample OC keys sorted (UTF-16 code-unit order), arrays in caller order, no whitespace, UTF-8, exactly one trailing newline (part of the signed bytes). Non-representable values (NaN/Infinity/bigint/function/undefined-in-array) throw instead of degrading to `null`.\n- **`src/bundle.ts` — builder + verifier.** `createBundle` opens `evidence/runs/\u003cutc yyyymmdd-hhmmss\u003e-\u003cshortsha\u003e-\u003ctier\u003e/`; `addArtifact` hardlinks (same volume) or copies (EXDEV fallback, annotated J4), hashes **as stored**, and places by a deterministic kind→family mapping (`lanes/\u003clane\u003e/…`, `visual/\u003csource\u003e/…`, `video/…`, `trajectories/…`, `html-trees/…`, `misc/\u003csource\u003e/…`) with a `bundlePath` escape hatch for wave-2 analyzers to sit `analysis.json`/`qa.json` beside pixels. `finalize()` sorts artifacts by path and writes canonical `manifest.json` + `meta.json`, returning `manifestSha256` (the value certification signs). `verifyBundle(dir)` re-hashes everything and reports `missing` / `size-mismatch` / `hash-mismatch` / `unlisted` findings. Clock and runId are injectable → byte-stable manifests are testable. Bundle paths are NFC-normalized at ingress (macOS NFD vs linux NFC). `finalize()` writes+hashes `meta.json` first and embeds `manifest.metaSha256`, binding provenance into the signed envelope; `verifyBundle` is lstat-based and additionally reports `symlink` (symlinked artifact = mutable after signing; symlinked dir = unswept external tree) and `meta-mismatch` findings.\n- **`src/provenance.ts`.** Commit/branch via `git rev-parse` (execFile, fails loud with a typed error outside a repo — no fabricated provenance); runner from `ELIZA_EVIDENCE_RUNNER` ∈ local|vast|ci (invalid value throws instead of downgrading), inferred `ci` from `CI` env, default `local`; env fingerprint is a small allowlist (node/bun versions, platform, arch, tier, TEST_LANE) — full env is never captured.\n- **`src/ingest.ts` — 7 silo ingestors, producers untouched.** e2e-recordings, iability2\u003e0.98`, `inet_down\u003e500`, sort `dph+`, `dph\u003c=--max-dph`) → create from `ghcr.io/elizaos/certification-gpu:latest` → onstart clones the repo @ `--sha` and runs `bundle:create → certify:rollup → certify:sign` → poll `actual_status` (`exited`/`unknown`/`offline` debounced, stuck-`loading` cap, hard `--timeout-minutes`) → pull the signed cert via instance logs → **DESTROY in `finally`** (never stop; 3 retries; loud instance-id banner + exit 12 if destroy fails) |\n| `scripts/vast/run-certification.test.mjs` | 36 unit tests over the pure pieces (offer filter/sort, onstart assembly + 16 KB guard, poll state machine, budget guards, secret redaction, auth-error classification) — `bun run test:vast` |\n| `scripts/vast/local-certify.mjs` | One-command local fallback: same chain, same signed output; `--no-sign` stops after rollup for hand review |\n| `scripts/vast/README.md` | Runbook: local fallback, costs, kill-path table (one distinct exit code per kill path) |\n| `docker/certification/Dockerfile.gpu` | Bakes CUDA `llama-server` (pinned llama.cpp `b8525`, the `scripts/gpu-vision` minimum), sha256-pinned OCR/VLM models via the repo's `setup.mjs --with-vlm`, Node 24, Bun 1.3.14, Playwright Chromium + deps, tesseract, ffmpeg — everything the 16 KB onstart cannot carry |\n| `.github/workflows/certification-image.yml` | `workflow_dispatch` + develop-push path trigger; GHCR push via `GITHUB_TOKEN` (`packages: write`); tags `latest` + `sha-\u003cshort\u003e` |\n| `.github/workflows/certification-vast.yml` | `workflow_dispatch` (sha/tier/max_dph/max_attempts/timeout inputs) + nightly cron gated on `vars.ELIZA_VAST_CERT_ENABLED == 'true'`; **no `pull_request` trigger**; secrets exposed only to the single run step; any failure goes red with a \"local certification required: `node scripts/vast/local-certify.mjs --tier full`\" summary |\n\n## Design points\n\n- **Secrets discipline:** `ELIZA_CERT_SIGNING_KEY` + optional `CERT_PUSH_CMD` travel only in the create-payload env (docker `-e`), never in the onstart text, logs, or `--dry-run` output (unit-tested). The onstart is printable and safe.\n- **Budget guards:** `--max-dph` (server-side `lte` + client-side re-check), `--max-attempts` across offers cheapest-first; retries fire only on host-side failures (stuck loading / instance lost / create rejected), never on chain failures or timeouts. Worst case per dispatch: `0.60 × 3 × 2h = $3.60`; each run logs its estimated spend.\n- **Live-API verification without spend:** vast rejects a dead key with **HTTP 404 + `{\"error\":\"auth_error\"}`** (not 401), and search offers is `PUT /search/asks/` with a `{q: ...}` body (`select_cols: [\"*\"]` is rejected by the current API). Both discovered against the live API and encoded + unit-tested; the dead-key kill path is verified live below.\n- **Results without storage:** the signed `certification.json` is emitted between log markers and recovered from the pulled instance logs, so a run is useful even before `ELIZA_CERT_PUSH_CMD` (R2/S3) is configured; the full bundle push stays env-driven.\n\n## Evidence\n\n### Unit tests (`bun run test:vast`)\n\n```\nℹ tests 36\nℹ suites 12\nℹ pass 36\nℹ fail 0\nℹ cancelled 0\nℹ skipped 0\nℹ todo 0\n```\n\n### Dead-key kill path — LIVE vast API (search only, zero spend)\n\n```\n$ VAST_API_KEY=deadbeef ELIZA_CERT_SIGNING_KEY=pem node scripts/vast/run-certification.mjs --sha b7247c66c7a5 --max-attempts 1\n[cert-run] vast API key rejected (HTTP 404, auth_error) — dead or unscoped VAST_API_KEY\nexit code: 3\n```\n\n### Other kill paths (unit-tested state machine + arg guards)\n\n```\n$ node scripts/vast/run-certification.mjs --sha b7247c66            # no keys\n[cert-run] no vast.ai API key: pass --api-key or set VAST_API_KEY   → exit 2\n$ node scripts/vast/run-certification.mjs --sha zzz --dry-run       → exit 2\nstuck-loading / instance-lost debounce / run-timeout / exited-without-marker /\nonstart-failure-marker / destroy-failure → EXIT 7/9/8/10/10/12 (see poll state\nmachine tests in run-certification.test.mjs)\n```\n\n### Dry-run transcript (zero API calls, zero secrets)\n\n\u003cdetails\u003e\u003csummary\u003e\u003ccode\u003enode scripts/vast/run-certification.mjs --sha b7247c66... --dry-run\u003c/code\u003e (full output)\u003c/summary\u003e\n\n```\n[cert-run] DRY RUN — no API calls will be made\n{\n  \"api\": {\n    \"base\": \"https://console.vast.ai/api/v0\",\n    \"searchEndpoint\": \"PUT /search/asks/\",\n    \"createEndpoint\": \"PUT /asks/{offer_id}/\",\n    \"pollEndpoint\": \"GET /instances/{instance_id}/\",\n    \"logsEndpoint\": \"PUT /instances/request_logs/{instance_id}/\",\n    \"destroyEndpoint\": \"DELETE /instances/{instance_id}/\"\n  },\n  \"query\": {\n    \"gpu_name\": {\n      \"eq\": \"RTX 4090\"\n    },\n    \"num_gpus\": {\n      \"eq\": 1\n    },\n    \"verified\": {\n      \"eq\": true\n    },\n    \"rentable\": {\n      \"eq\": true\n    },\n    \"reliability2\": {\n      \"gt\": 0.98\n    },\n    \"inet_down\": {\n      \"gt\": 500\n    },\n    \"dph_total\": {\n      \"lte\": 0.6\n    },\n    \"type\": \"ask\",\n    \"order\": [\n      [\n        \"dph_total\",\n        \"asc\"\n      ]\n    ]\n  },\n  \"clientSideFilters\": {\n    \"maxDph\": 0.6,\n    \"minReliability\": 0.98,\n    \"minInetDown\": 500,\n    \"numGpus\": 1\n  },\n  \"budget\": {\n    \"maxDph\": 0.6,\n    \"maxAttempts\": 3,\n    \"timeoutMinutes\": 120,\n    \"worstCaseUsd\": 3.6\n  },\n  \"createPayload\": {\n    \"client_id\": \"me\",\n    \"image\": \"ghcr.io/elizaos/certification-gpu:latest\",\n    \"env\": {\n      \"ELIZA_EVIDENCE_RUNNER\": \"\u003credacted\u003e\"\n    },\n    \"onstart\": \"\u003c1925 bytes, printed below\u003e\",\n    \"runtype\": \"ssh\",\n    \"disk\": 80,\n    \"label\": \"eliza-certification-b7247c66c7a5\"\n  },\n  \"poll\": {\n    \"intervalSeconds\": 15,\n    \"timeoutMinutes\": 120,\n    \"loadingTimeoutMinutes\": 20,\n    \"terminalStatuses\": [\n      \"exited\",\n      \"offline evidence/runs/*/ 2\u003e/dev/null | head -1)\"\n[ -n \"$BUNDLE_DIR\" ] || fail bundle-dir\nBUNDLE_DIR=\"${BUNDLE_DIR%/}\"\nbun run --cwd packages/evidence certify:rollup -- --bundle \"$BUNDLE_DIR\" --out \"$BUNDLE_DIR/verdicts.json\" || fail rollup\nbun run --cwd packages/evidence certify:sign -- --bundle \"$BUNDLE_DIR\" --verdicts \"$BUNDLE_DIR/verdicts.json\" --reviewer-id 'vast-certification-runner' --reviewer-kind agent || fail sign\necho \"-----BEGIN ELIZA CERTIFICATION JSON-----\"\ncat \"$BUNDLE_DIR/certification.json\" || fail cert-read\necho \"\"\necho \"-----END ELIZA CERTIFICATION JSON-----\"\nif [ -n \"${CERT_PUSH_CMD:-}\" ]; then\n  export CERT_BUNDLE_DIR=\"$BUNDLE_DIR\"\n  export CERT_FILE=\"$BUNDLE_DIR/certification.json\"\n  bash -c \"$CERT_PUSH_CMD\" || fail push\nelse\n  echo \"[cert-run] no CERT_PUSH_CMD configured; bundle stays on the instance (certification travels via logs)\"\nfi\necho \"ELIZA-CERT-RUN-SUCCESS\"\n\n\n```\n\n\u003c/details\u003e\n\n### Gates\n\n- `bunx @biomejs/biome check scripts/vast/` → exit 0\n- `node packages/scripts/error-policy-ratchet.mjs` → \"no new fallback-slop in touched files\"\n- both workflows parse (yaml.safe_load)\n\n## Evidence rows — owner-gated items (N/A with reason)\n\n| Row | Status |\n| --- | --- |\n| Real vast instance end-to-end run (search→create→run→pull→destroy) with costs logged | **N/A — owner-gated:** requires the `VAST_API_KEY` repo secret (real billing). The workflow + `--dry-run` + the live dead-key run above are the pre-key proof; first dispatch after the secret lands is the acceptance run. |\n| GHCR image build/publish | **N/A — CI-verified:** no local docker daemon on this machine (`docker info` fails); `certification-image.yml` builds it on dispatch. The Dockerfile reuses the repo's pinned action SHAs and the in-repo `scripts/gpu-vision/setup.mjs` (sha256-verified model bake). |\n| Real-LLM trajectories | N/A — no agent/prompt/model behavior change; this is CI/scripts infrastructure. |\n| UI `drainAfterMs`.\n- **`src/queue/analysis-merge.ts`** — atomic read-modify-write of `analysis.json` (temp + rename), so a reader never sees a torn document while results stream in.\n- **`src/analyzers/executor.ts`** — the `AnalyzerExecutor` seam extracted from the runner (`InlineExecutor` is the default; runner behaviour unchanged). **`src/queue/executor.ts`** — `QueueExecutor` routes gpu-tier analyzers through the queue and delegates cpu/above-tier ones inline; honest `skipped-missing-tool` when no worker attaches.\n- **CLI**: `evidence:gpu-queue` (`worker` + `enqueue`).\n\n**Honest degradation everywhere:** a down service produces `skipped-missing-tool` records carrying the reason — never a fabricated empty transcript. `EvidenceError`, J-annotated catches, prose headers, no `console` in lib.\n\n## Executor wiring\n\nThe runner's per-analyzer call site now goes through `options.executor ?? INLINE_EXECUTOR`. Default runs are byte-identical to before. Passing `new QueueExecutor(queue)` offloads gpu-tier analyzers to the shared worker instead of loading a model per image; cpu-tier analyzers and above-tier ones keep their inline semantics (including the correct `skipped-tier` record).\n\n## Evidence\n\n**Full package suite green** (`bun run --cwd packages/evidence test`): 375 passed / 1 skipped (baseline 343 → **+32** new queue tests). Typecheck + lint clean. `audit:error-policy-ratchet`: no new fallback-slop.\n\n\u003cdetails\u003e\u003csummary\u003eQueue test suite — 32/32 (verbose)\u003c/summary\u003e\n\n```\n✓ state.test.ts \u003e parseJob \u003e accepts a well-formed job\n✓ state.test.ts \u003e parseJob \u003e rejects non-JSON with a typed invalid error, not a default\n✓ state.test.ts \u003e parseJob \u003e rejects an unsafe id (path-traversal characters)\n✓ state.test.ts \u003e parseJob \u003e lists every missing field at once\n✓ state.test.ts \u003e parseJob \u003e rejects an artifact kind that carries no pixels\n✓ state.test.ts \u003e claimOrder \u003e returns o wen3-VL. `hf` CLI when present, direct HTTPS resolve URLs otherwise. |\n| `scripts/gpu-vision/serve.mjs` | Launch/stop resident `llama-server` (`--mmproj`, `-c 8192`, `--parallel N`, free port or `ELIZA_GPU_VISION_PORT`); `/health` readiness gate with child-exit race; serve.json written only after readiness; pid-identity check (ps comm) before trusting/killing recorded pids; optional `--verify` blob re-hash; llama.cpp ≥ b8525 (DeepSeek-OCR) version gate; `--vlm` serves Qwen3-VL as a second keyed instance. |\n| `scripts/gpu-vision/smoke.mjs` | Real E2E: renders a fixture PNG (sharp SVG→PNG) with known text, POSTs to `/v1/chat/completions` at temp 0 (bounded by AbortSignal), asserts the strings come back. `--start` = setup → serve → smoke → stop (stop always runs via try/finally). |\n| `scripts/gpu-vision/lib.mjs` | Pure logic: model pins, lockfile reconcile, version-gate boundary, size floor, port/arg helpers, readiness poller with per-probe abort. |\n| `scripts/gpu-vision/gpu-vision.test.mjs` | 16 unit tests (`node --test`). |\n| `scripts/gpu-vision/models.lock.json` | sha256/size/URL pins recorded from the real downloads. |\n| `scripts/gpu-vision/README.md` | VRAM/RAM, Metal/CUDA, MLX pointer, registry endpoint+prompt contract, bbox-normalization note. |\n| `package.json` | one line: `test:gpu-vision` root script, mirroring the existing `test:evidence-review` (the way `scripts/\u003cfamily\u003e/*.test.mjs` suites are made runnable in this repo). |\n| `turbo.json` | declares `ELIZA_GPU_VISION_CACHE` / `ELIZA_GPU_VISION_PORT` in `globalEnv` (biome env-var lint + correct turbo cache keys). |\n\nNo other root wiring — the operational scripts are invoked directly by path (documented in the README).\n\n## Served endpoint contract (for the analyzer-integration task)\n\n- **Endpoint:** `POST http://127.0.0.1:\u003cport\u003e/v1/chat/completions` (OpenAI-compatible). Discovery order: the per-model entry in `~/.cache/eliza/gpu-vision/serve.json` (respects `ELIZA_GPU_VISION_CACHE`; written only after `/health` answered, so an entry always points at a server that became ready), falling back to a validated `ELIZA_GPU_VISION_PORT`.\n- **Request:** one user message, `content: [{type:\"text\", text: OCR_PROMPT}, {type:\"image_url\", image_url:{url:\"data:image/png;base64,…\"}}]`, `temperature: 0`. `OCR_PROMPT` is exported from `lib.mjs` so the registry uses the exact same grounding prompt.\n- **Output normalization (consumers must handle):** Unlimited-OCR decorates each transcribed line with grounding markers of its own accord — `title [x1, y1, x2, y2]TEXT`. This is model behavior, **not** something `OCR_PROMPT` asks for. Strip/normalize the `\u003ctag\u003e [bbox]` decorations (or treat them as layout metadata) before exact-matching text.\n- **Doctrine:** one resident server drains a queue via `--parallel N` slots; no per-job loads. No service reachable → record `skipped-tier` honestly (registry's job, not this PR's).\n\n## Verification (REAL — M4 Max, macOS Metal, `llama.cpp` b9870 via `brew install llama.cpp`)\n\nEverything below was actually run on this machine, not mocked.\n\n\u003cdetails\u003e\u003csummary\u003eReal model download + sha256 pins (setup.mjs)\u003c/summary\u003e\n\n```\n[gpu-vision] Baidu Unlimited-OCR (DeepSeek-OCR 3B, Q4_K_M)\n  pin   Unlimited-OCR-Q4_K_M.gguf sha256=c8461bded976eac709a33f6b26e1414efcd2124a203f2ee93ee984a4c9e9265b (1.82 GiB)\n  pin   mmproj-Unlimited-OCR-F16.gguf sha256=4f28c295e1fcf67a97488e356f2b4372da4702b77fdfad0fa138b5821325743c (774.3 MiB)\n[gpu-vision] Qwen3-VL-4B-Instruct (Q4_K_M)\n  pin   Qwen3VL-4B-Instruct-Q4_K_M.gguf sha256=66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a (2.33 GiB)\n  pin   mmproj-Qwen3VL-4B-Instruct-F16.gguf sha256=256f3a43bd4205ffef48d6b92715e1e70b5b0e9aef06522584967513a9985331 (797.4 MiB)\n[gpu-vision] done. total on disk: 5.68 GiB across 2 set(s).\n```\n\nRe-run is idempotent (`skip … present, sha256 verified`). A corrupted cached file fails loud with `sha256 mismatch` and exit 1 — verified with a deliberately clobbered copy.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eReal OCR smoke test — Unlimited-OCR (smoke.mjs)\u003c/summary\u003e\n\n```\n[gpu-vision] target: http://127.0.0.1:61414 (Baidu Unlimited-OCR (DeepSeek-OCR 3B, Q4_K_M))\n[gpu-vision] fixture: 21596 byte PNG, expecting 3 lines\n\n[gpu-vision] transcription (737 ms):\ntitle [50, 128, 595, 262]ELIZA VISION LANE\ntitle [48, 377, 562, 521]OCR-CODE-4F2A9\ntitle [50, 632, 573, 776]unlimited ocr smoke\n\n[gpu-vision] tokens: prompt=303 completion=69 total=372\n[gpu-vision] latency: 737 ms\n\n[gpu-vision] SMOKE PASSED — all expected strings transcribed.\n```\n\nExpected strings `ELIZA VISION LANE`, `OCR-CODE-4F2A9`, `unlimited ocr smoke` — all transcribed exactly, including the arbitrary code. The `title [x1, y1, x2, y2]` grounding markers are **the model's own output convention — `OCR_PROMPT` does not request them**; consumers must normalize the bbox decorations before exact-matching (the smoke's lowercase/whitespace-collapse + substring check tolerates them). **Warm latency ~260–730 ms** (first request per slot is slower — cold KV warmup); server-side eval ~546 tok/s prompt, ~405 tok/s generation.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eReal VLM smoke test — Qwen3-VL-4B-Instruct (serve.mjs --vlm + smoke.mjs --vlm)\u003c/summary\u003e\n\n```\n[gpu-vision] target: http://127.0.0.1:60847 (Qwen3-VL-4B-Instruct (Q4_K_M))\n[gpu-vision] transcription (807 ms):\nELIZA VISION LANE\nOCR-CODE-4F2A9\nunlimited ocr smoke\n[gpu-vision] tokens: prompt=346 completion=24 total=370\n[gpu-vision] latency: 807 ms\n[gpu-vision] SMOKE PASSED — all expected strings transcribed.\n```\n\nThe `--vlm` path serves as a second `serve.json` entry keyed `vlm`, alongside `ocr`.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eBackend structured logs (llama-server, Metal)\u003c/summary\u003e\n\n```\nsrv load_model: loading model 'Unlimited-OCR-Q4_K_M.gguf'\nsrv load_model: loaded multimodal model, 'mmproj-Unlimited-OCR-F16.gguf'\nsrv load_model: initializing, n_slots = 2, n_ctx_slot = 4096, kv_unified = 'false'\nsrv llama_server: listening on http://127.0.0.1:61414\nslot print_timing: prompt eval time = 555.03 ms / 303 tokens ( 545.92 tokens/s)\nslot print_timing:        eval time = 170.44 ms /  69 tokens ( 404.84 tokens/s)\n```\n\n`n_slots = 2` = `--parallel 2`; ctx 8192 split into 4096/slot. Repeat requests reuse the prompt cache (LCP sim = 1.000).\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eUnit tests + lint + syntax\u003c/summary\u003e\n\n```\n$ bun run test:gpu-vision      -\u003e tests 16, pass 16, fail 0\n$ bunx @biomejs/biome check scripts/gpu-vision   -\u003e exit 0, zero warnings\n$ node --check scripts/gpu-vision/*.mjs           -\u003e all OK\n```\n\nCovers lockfile reconcile (incl. fail-loud mismatch), the version-gate boundary (b8524 rejected / b8525 accepted / garbage throws), port validation (never `:NaN`), the torn-download size floor, the setup skip-path wiring (a present-but-wrong blob still fails the sha256 gate — delete-the-call-fails-this-test), and the readiness poller against real in-process HTTP stubs (fail-first-then-200, timeout, and accepts-but-never-responds abort).\n\u003c/details\u003e\n\n### Review round (Fable F1–F12) — all applied, re-verified for real\n\n- **F1 pid recycling:** `--stop` and the already-running check verify the recorded pid is actually a llama-server (`ps -p \u003cpid\u003e -o comm=`) before trusting it; stale entries are discarded with a note, never signaled. *Real test:* planted a `sleep` process's pid in serve.json → `--stop` reported \"not a llama-server (pid recycled)\" and left the process untouched.\n- **F2 orphan cleanup:** a child that fails readiness is SIGTERMed before the launcher exits; `smoke --start` runs serve inside try/finally so stop always fires.\n- **F3 crash race + late state write:** child exit races th e with a time range, and gives it a real corpus to test against:\n\n1. **`since`/`until` time-range on `searchMessages`** (contract → all three DB adapters → route → client). Applied in the store *with* the match predicate, **before** ranking + LIMIT/OFFSET, so a \"one year ago\" window never truncates recall.\n2. **Backdated message-corpus seeder** (`packages/agent/src/api/message-corpus.ts`) — generates ~1 year of realistic conversations/messages/derived-facts with real backdated `createdAt`, landed through the runtime as real `web-conv-*` web-chat rooms (the exact shape `restoreConversationsFromDb` scans for).\n3. **Dev-only seed endpoint** `POST /api/conversations/dev/seed-messages` (404 in production) with a bounded, strict, validated request schema.\n4. **CLI** `bun run seed:messages` (`packages/scripts/seed-message-corpus.mjs`) for manual demo prep — POSTs the dev endpoint, then proves a \"9 months ago\" window is honored by the store.\n\n## No partial pipeline\n\nAll three implementations of the `IDatabaseAdapter.searchMessages` contract honor the window:\n\n- `packages/core/src/database/inMemoryAdapter.ts`\n- `plugins/plugin-inmemorydb/adapter.ts` (also backs `plugin-localdb`, which wraps it)\n- `plugins/plugin-sql/src/base.ts` (both the FTS/trigram branch and the ILIKE fallback branch share the `created_at` range conditions)\n\nThe in-memory path and the SQL path share one window-predicate semantics via `withinCreatedAtWindow` (`packages/core/src/search.ts`): when a bound is set, a row without a numeric `createdAt` is excluded.\n\n## Validation\n\n`since`/`until` are validated at the route: garbage / empty / malformed-ISO -\u003e **400**; `since \u003e until` -\u003e **400**; epoch-ms integer or ISO 8601 accepted. A garbage bound is never a silently-ignored filter.\n\n## Evidence\n\n- **Real-LLM trajectories** - N/A. No agent/action/prompt/model behavior changes; this is store + route + a dev seeder.\n- **Frontend screenshots/video** - N/A. No UI change beyond the existing search client gaining optional params.\n- **Backend logs** - the seed route emits `[ConversationSearch] seeded backdated message corpus`; search emits `[ConversationSearch] FTS message search completed` with `since`/`until` context.\n- **Domain artifacts** - the seeder writes real backdated `messages` + `facts` rows; the tests read them back through the real store and assert on their `createdAt`.\n\n### Tests (real adapter, real ranker, real window filter - no mock of the thing under test)\n\n`message-corpus-search.test.ts` drives the **real `InMemoryDatabaseAdapter`** (imported from in-tree core source so the current window filter is under test, not a stale dist build) fed by the **real `generateMessageCorpus` + `seedMessageCorpus`**:\n\n\u003cdetails\u003e\n\u003csummary\u003ebunx vitest run (3 files, 27 tests)\u003c/summary\u003e\n\n```\n✓ message-corpus-search.test.ts \u003e seeds a real backdated corpus spanning more than a year\n✓ message-corpus-search.test.ts \u003e corpus-wide recall: search reaches back past a year for a real keyword\n✓ message-corpus-search.test.ts \u003e until= narrows to older messages; every hit is within the window\n✓ message-corpus-search.test.ts \u003e since= narrows to newer messages; every hit is within the window\n✓ message-corpus-search.test.ts \u003e since+until brackets an inner window derived from the real hit spread\n✓ message-corpus-search.test.ts \u003e pagination is stable: disjoint offset pages tile the full result set\n✓ message-corpus-search.test.ts \u003e a window entirely after the corpus returns nothing (never a fabricated hit)\n\n✓ conversation-message-search.test.ts (14 tests: adds since/until 400-validation, since\u003euntil 400,\n    valid epoch-ms + ISO 8601 accepted, deterministic window-narrowing)\n\n✓ conversation-seed-messages-route.test.ts \u003e returns 404 in production\n✓ conversation-seed-messages-route.test.ts \u003e rejects an out-of-bounds request body with 400\n✓ conversation-seed-messages-route.test.ts \u003e rejects an unknown field (strict schema) with 400\n✓ conversation-seed-messages-route.test.ts \u003e rejects a non-integer count with 400\n✓ conversation-seed-messages-route.test.ts \u003e seeds a real backdated corpus and registers the conversations in state\n✓ conversation-seed-messages-route.test.ts \u003e returns 503 when the runtime is not available\n\n Test Files  3 passed (3)\n      Tests  27 passed (27)\n```\n\u003c/details\u003e\n\n### Verify\n\n- `bunx biome check \u003ctouched files\u003e` -\u003e clean.\n- `bun run --cwd packages/agent typecheck` -\u003e no errors in touched files (4 pre-existing `TS2688` \"cannot find type def\" for `bun`/`node`/`react`/`react-dom` are worktree node_modules-resolution noise, not from this change).\n- `bun run audit:error-policy-ratchet` -\u003e `no new fallback-slop in touched files`.\n\n## Notes / residual\n\n- The end-to-end test imports the core adapter via a relative in-tree path because `@elizaos/core` resolves to a **stale dist** in shared worktrees; importing source guarantees the window filter under test is the current code. The real runtime path is identical (`runtime.searchMessages` is a straight passthrough to `adapter.searchMessages`).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\n## Evidence Matrix\n\u003c!-- evidence-row:before-screenshots --\u003e\n- Before screenshots: N/A - backend/store/API/client-param change plus dev seeder; no rendered UI component changed.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- After screenshots: N/A - backend/store/API/client-param change plus dev seeder; no rendered UI component changed.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- Walkthrough video: N/A - no user-facing UI flow changed in this PR; the relevant walkthrough is the seeded corpus/search CLI and API logs.\n\u003c!-- evidence-row:backend-logs --\u003e\n- Backend logs: N/A - no live server was run in this local pass; tests exercise the route
