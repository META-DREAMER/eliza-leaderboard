o coverage change only; no rendered UI component changed.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- After screenshots: N/A - orchestrator action/scenario coverage change only; no rendered UI component changed.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- Walkthrough video: N/A - no browser/mobile UI flow changed; the relevant walkthrough artifact is the scenario run report.\n\u003c!-- evidence-row:backend-logs --\u003e\n- Backend logs: N/A - no live service run is attached in this local body; scenario execution logs should be attached when the portfolio/failure-isolation runs execute in CI or a credentialed runner.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- Frontend console/network logs: N/A - no frontend runtime path changed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- Real-LLM trajectory: N/A - not captured in this local shell; if TASKS action planning semantics changed, attach a live scenario trajectory before treating the PR as MVP-ready.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- Domain artifacts: N/A - no production task records were generated in this local pass; the expected artifacts are scenario reports showing 3-project task creation/progress/verification/completion and failure isolation.\n\n## Stronger Follow-Up Proof\nAttach the scenario runner JSON/report artifacts for both new scenarios, including the project/task IDs produced, failure/cancel isolation evidence, and final task states for every project.\n"])</script><script>self.__next_f.push([1,"36:T2ec5,"])</script><script>self.__next_f.push([1,"## Summary\n\nImplements the design brief in #14675 (LifeOps architecture review, adversarially verified): a **passive preference extraction evaluator** — the missing conversational writer for the personality behavior machinery. A user who says *\"ugh, that was way too long\"*, *\"stop using emojis\"*, or *\"I prefer morning check-ins\"* in passing now gets durable behavior change with **zero explicit input**.\n\n**What it extracts** (one strict-JSON-schema post-turn model call, LLM-decides — no keyword matching):\n- **Agent behavior** — reply length/tone/formality → `set_trait` ops into the PersonalityStore slot with `source: \"agent_inferred\"`\n- **Standing style rules** with no trait mapping (\"no emojis\", \"one question at a time\") → `add_directive` (lexical dedupe at the shared 0.42 threshold, FIFO-capped by the store)\n- **Views/UI, content, timing, interaction patterns** (theme, background, \"morning check-ins\", \"reads slowly, wants time to think\") → `add_preference_fact`: durable `category: \"preference\"` rows in the **existing facts table** (no new store — CLAUDE.md ban respected), same rows the FACTS provider (and #14829's interaction-preference lane) reads\n\n**How it becomes behavior** (zero new providers): `userPersonalityProvider` already injects slot traits + directives into every prompt, and verbosity is already hard-enforced in the reply callback. `renderSlot` now annotates `agent_inferred` slots with a provenance line so the model can explain/offer to undo. Preference facts surface through the FACTS provider exactly like fact-extractor rows.\n\n**Safety invariants:**\n- Inference **never overwrites an explicitly-set trait** (slot source `user`/`admin`) — explicit beats inferred, at any confidence\n- Trait gates read the **pre-run slot snapshot**, so one inferred write can't flip slot provenance and unlock overwriting an explicit trait in the same run\n- `reply_gate` is **unrepresentable** in the op schema (silencing the agent off an inferred signal is a hazard; stays PERSONALITY-action-only)\n- Global scope is never written; slot ops gate at confidence ≥ 0.8; retraction only undoes inference\n- Every slot write goes through `applyTrait`/`addDirective` → existing audit trail; PERSONALITY show_state/audit can inspect and clear\n\n**Architecture mirrors the fact evaluator exactly**: sibling `preference-items.ts` + `preferenceExtractor.schema.ts` (tolerant op-by-op parse, strict-structured-output-safe wire schema, caps in code not on the wire), new `REFLECTION_PREFERENCES: 105` priority (facts=100 stays owner of generic claims), registered via `advancedEvaluators` + the `relationships` native feature like `reflectionItems`. On runtimes without the PersonalityStore (advanced capabilities off), the prompt stops advertising slot ops, the fact lane still works, and drops are counted in the processor result.\n\nCloses #14675\n\n## Verification\n\n- `bun x vitest run` — preference-items.test.ts (**19 tests**), reflection-items.test.ts (strict-schema walker now covers the new evaluator), all personality suites, evaluator service: **94 passed / 0 failed**\n- `pr-deterministic` scenario `deterministic-preference-extraction` (zero-turn, keyless, real runtime boot): **passed** — registration → write policy → real PersonalityStore slot → real facts-table row → `userPersonalityPreferences` prompt render, all asserted through the real runtime\n- `bun run --cwd packages/core typecheck` — passed\n- `bunx biome check` on all touched files — passed\n- `bun run audit:error-policy-ratchet` — no new fallback-slop in touched files\n- `git diff --check` — passed\n\n## Live-LLM trajectory (real model, real prompt, real stores)\n\nA live Claude model was driven through the evaluator's **real** `prompt()` and wire schema on a synthetic 4-turn conversation, output parsed by the **real** `parsePreferenceOutputTolerant`, ops applied by the **real** processor against a **real PersonalityStore** and facts table, then re-rendered by the **real** `userPersonalityProvider`:\n\n- complaint *\"ugh, that was way too long again\"* → `set_trait verbosity=terse` (conf 0.95) → slot `verbosity: \"terse\", source: \"agent_inferred\"`\n- *\"stop using emojis, it reads weird\"* → directive `\"Do not use emojis in replies\"`\n- *\"I really like the dark background\"* + *\"check-ins in the morning, I read slowly\"* → 2 durable `preference` fact rows (`source: \"preference_extractor\"`, keywords intact)\n- next-turn provider render includes the `[PERSONALITY for THIS user]` block **with the inferred-provenance line**\n\n\u003cdetails\u003e\u003csummary\u003eFull live run: prompt → model output → parsed ops → store state → next-turn prompt render\u003c/summary\u003e\n\n```\n=== REAL EVALUATOR PROMPT ===\nFind preferences the user expressed about how TestAgent should behave or how they want to interact. Passive signals count: complaints (\"ugh, way too long\" -\u003e set_trait verbosity=terse), asides, repeated corrections — not just direct requests.\n\nOps:\n- set_trait: reply style that clearly maps to a closed trait value. verbosity: terse|normal|verbose. tone: warm|neutral|direct|cold. formality: casual|professional|formal.\n- add_directive: standing reply-style rule with no trait mapping (\"no emojis\", \"one question at a time\", \"don't stack messages\"). Short imperative text, max 200 chars.\n- retract_trait: the user pushes back on an inferred trait shown below.\n- add_preference_fact: preferences that are knowledge rather than reply style — views/UI (theme, background, widgets), content, timing (\"morning check-ins\", \"quiet hours after 10pm\"), interaction patterns (\"prefers chat over views\", \"reads slowly, wants time to think\"). claim + 3-8 lowercase retrieval keywords.\n\nRules:\n- Only the speaker's own expressed preferences. Not the agent's suggestions, not hypotheticals, not third parties.\n- confidence 0-1, honest; slot ops below 0.8 are discarded.\n- No preference expressed -\u003e {\"ops\":[]}.\n- Never emit anything about muting, ignoring, or when TestAgent may reply.\n\nCurrent personality for this user:\n(none set)\n\nKnown preferences already stored:\n(none)\n\nRecent messages:\n- Eliza: Here's a detailed breakdown of your week ahead... (long reply)\n- Sam: ugh, that was way too long again. just give me the short version. also stop using emojis, it reads weird\n- Eliza: Got it — short version: 3 meetings, 2 deadlines.\n- Sam: better. btw I really like the dark background in the app, keep it that way. and I'd rather get check-ins in the morning, I read slowly in the evenings\n\n=== LIVE MODEL OUTPUT ===\n{\"ops\":[{\"op\":\"set_trait\",\"trait\":\"verbosity\",\"value\":\"terse\",\"confidence\":0.95,\"evidence\":\"ugh, that was way too long again. just give me the short version\"},{\"op\":\"add_directive\",\"text\":\"Do not use emojis in replies\",\"confidence\":0.95,\"evidence\":\"stop using emojis, it reads weird\"},{\"op\":\"add_preference_fact\",\"claim\":\"prefers dark background/theme in the app\",\"keywords\":[\"dark\",\"background\",\"theme\",\"app\",\"display\",\"ui\"],\"confidence\":0.9,\"evidence\":\"I really like the dark background in the app, keep it that way\"},{\"op\":\"add_preference_fact\",\"claim\":\"prefers check-ins in the morning, reads slowly in the evenings\",\"keywords\":[\"morning\",\"check-in\",\"evening\",\"timing\",\"schedule\",\"reading\"],\"confidence\":0.85,\"evidence\":\"I'd rather get check-ins in the morning, I read slowly in the evenings\"}]}\n\n=== PARSED OPS ===\n[\n  {\n    \"op\": \"set_trait\",\n    \"trait\": \"verbosity\",\n    \"value\": \"terse\",\n    \"confidence\": 0.95,\n    \"evidence\": \"ugh, that was way too long again. just give me the short version\"\n  },\n  {\n    \"op\": \"add_directive\",\n    \"text\": \"Do not use emojis in replies\",\n    \"confidence\": 0.95,\n    \"evidence\": \"stop using emojis, it reads weird\"\n  },\n  {\n    \"op\": \"add_preference_fact\",\n    \"claim\": \"prefers dark background/theme in the app\",\n    \"keywords\": [\n      \"dark\",\n      \"background\",\n      \"theme\",\n      \"app\",\n      \"display\",\n      \"ui\"\n    ],\n    \"confidence\": 0.9,\n    \"evidence\": \"I really like the dark background in the app, keep it that way\"\n  },\n  {\n    \"op\": \"add_preference_fact\",\n    \"claim\": \"prefers check-ins in the morning, reads slowly in the evenings\",\n hours`, `--key-file`, `--cert-out`.\n\n### Honesty is structural, not advisory\n\n- The mechanical rollup drafts every **lane fail / skipped lane / analyzer expectation failure** as a non-pass verdict.\n- A reviewer may **waive** such a subject (waivers require notes, which survive into the signed cert) but may **never flip a mechanically non-pass subject to `pass`** — rejected at merge time (`CERTIFY_FALSE_PASS`), the same hole the #14547 gate's completeness check closes.\n- The run **self-verifies**; `overallVerdict` is `red` whenever the produced cert would fail the gate. **A red run still writes the truthful (failing) certification** rather than fabricating a green one. Exit code: 0 iff green, 1 if red.\n\nAlso: `evidence:certify` root script + `certify` package script (resolves the `check-docs` reference at `unified-evidence-harness.md:87`), and a read-only `EvidenceBundle.artifacts` getter so the analyzer step can enumerate work before `finalize` seals the manifest.\n\n## Evidence — real signed cert produced + verified\n\nBuilt a tiny fixture bundle (`lanes/server` + `lanes/ui` passing), generated a real Ed25519 demo key, and ran the shipped CLI end-to-end.\n\n\u003cdetails\u003e\u003csummary\u003e\u003cb\u003eGREEN: evidence:certify → offline certify:verify\u003c/b\u003e\u003c/summary\u003e\n\n```\n########## evidence:certify  (GREEN) ##########\ncertifying existing bundle 20260706-120000-abcdef0-cpu (tier=cpu)\ncertification GREEN — /tmp/demo-cert.json\n\n  bundle:   /tmp/certify-demo-runs/20260706-120000-abcdef0-cpu\n  manifest: 6667c79d5c4d3282ff442432a48ad3807d1f074cd88dcba63487dac152495f82\n  cert:     /tmp/demo-cert.json\n  verdict:  GREEN\n== exit 0 ==\n\n########## certify:verify  (offline, trusted pubkey) ##########\ncertification /tmp/demo-cert.json\n  commit abcdef0123456789abcdef0123456789abcdef01 (feat/demo → develop) tier=cpu\n  reviewer agent:shaw-agent (claude-fable-5)\n  verdicts: 3  createdAt: 2026-07-06T07:53:55.373Z\n  VERIFIED\n== exit 0 ==\n```\nThe cert signed by the orchestrator verifies with the **independent** `certify:verify` path the CI gate uses.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003e\u003cb\u003eRED + tamper + false-pass guard\u003c/b\u003e\u003c/summary\u003e\n\n```\n########## TAMPER: flip a lane result under the signed manifest ##########\n  bundle-tampered: bundle integrity check failed: hash-mismatch:lanes/server/result.json\n  FAILED\n== exit 1 (tamper caught) ==\n\n########## RED PATH: failing lane, no waiver ##########\ncertification RED — /tmp/red-cert.json\n  failures: verdict-failures\n  verdict-failures: 1 failing verdict(s): lane:server\n== certify exit 1 (cert still written truthfully) ==\n--- the red cert records the fail honestly ---\n[{\"subject\":\"lane:server\",\"verdict\":\"fail\",\"evidence\":[\"lanes/server/result.json\"],\"notes\":\"passed=3 failed=2 skipped=0\"}]\n\n########## FALSE-PASS GUARD: reviewer tries to flip fail-\u003epass ##########\nerror [CERTIFY_FALSE_PASS]: reviewer cannot mark mechanically fail subject 'lane:server' as pass; waive it with notes instead\n== exit 1 (refused) ==\n```\n\u003c/details\u003e\n\n## Tests — real bundles, real Ed25519 keys, no mocked crypto\n\n`orchestrate.test.ts` (12 tests): green **fresh-bundle** path (real throwaway git repo for provenance + scripted matrix lane), green **pre-built** path, reviewer **waive** of a failing lane, **red** verdict path, **false-pass** refusal, **post-sign tamper** detection (re-verified with the shipped `verifyCertification`), reviewer-merge completeness, and the **CLI** subcommand exit codes (0 green / 1 red). Every green assertion re-verifies the cert from disk.\n\n\u003cdetails\u003e\u003csummary\u003e\u003cb\u003ebun run --cwd packages/evidence test\u003c/b\u003e\u003c/summary\u003e\n\n```\n Test Files  38 passed | 1 skipped (39)\n      Tests  355 passed | 1 skipped (356)\n```\n(1 skipped = `vision-qa.live.test.ts`, needs a live VLM key.)\n\nOrchestrator file alone: thful red cert writing, tamper detection, and false-pass refusal.\n\n"])</script><script>self.__next_f.push([1,"39:T11b4,"])</script><script>self.__next_f.push([1,"Part of #14547 and epic #14541. This PR adds the develop-to-main certification verification gate; it should not be treated as fully operational until the trusted public key lands from a custodian-generated keypair and main branch protection requires `verify-certification`.\n\n## Summary\n\n- Adds `.github/workflows/certification-verify.yml`.\n- `verify-certification` runs on non-draft PRs targeting `main` and reads the trusted Ed25519 public key from the base branch, never the PR head.\n- Promotion branches must commit `certification.json` at repo root and the signed evidence bundle at `evidence/bundle/`; the job always passes `--bundle evidence/bundle` to `certify:verify` so artifact integrity, mechanical rollup completeness, and signed evidence-path membership are re-derived from the committed bundle.\n- Adds `scripts/certification/check-commit-drift.mjs` so a certification commit must equal the PR head or be an ancestor with only docs/template drift plus signed certification artifacts. Source, workflow, policy, or config drift forces recertification.\n- Adds `render-check-summary.mjs` for human-readable gate summaries and annotations.\n- Adds `selftest.mjs`, which exercises the real CLIs: keygen -\u003e bundle -\u003e rollup -\u003e sign -\u003e verify -\u003e tamper checks.\n- Documents branch-protection wiring, bootstrap, remediation, and break-glass behavior in `.github/certification/README.md`.\n\n## Current boundary\n\n- #14650 is blocked/draft because its private key was described as having transited agent reports/session transcript. A clean custodian-generated keypair is still required before the gate can be trusted on `main`.\n- This PR targets `develop`, so the main-only `verify-certification` job is expected to skip here. The relevant CI job for this PR is `certification-verify-selftest`.\n- anner at the dedicated action — **no duplication** |\n| `route` | **permissions** (`shell` toggle) | drives the section's own backend endpoint `PUT /api/permissions/shell` — the SAME endpoint the on-screen control calls |\n| `readonly` | runtime, security | pure diagnostics; refuses to \"write\" |\n| `unwired` | voice, capabilities, apps, remote-plugins, wallet-rpc, updates, advanced, app-permissions | honest, stated-reason deferral (see \"Scope\" below) |\n\n## How to confirm it works (no code reading)\n\n### 1. Unit tests — param routing, validation, backend dispatch (31 tests)\n```\nbun run --cwd plugins/plugin-app-control test settings.test.ts\n ✓ src/actions/settings.test.ts (31 tests)\n   ✓ parseBooleanValue parses on/off/enable/disable/…\n   ✓ resolveSectionId resolves ids + aliases (perms→permissions, model→ai-model)\n   ✓ registry completeness: has an entry for every built-in settings section\n   ✓ set permissions shell off → PUT /api/permissions/shell { enabled:false }\n   ✓ surfaces a backend failure instead of fabricating success\n   ✓ rejects a non-boolean value without calling the route\n   ✓ points a delegated section at its dedicated action without writing (ai-model→MODEL_SWITCH)\n   ✓ refuses read-only (runtime) and unwired (updates) sections\n Test Files  1 passed (1)   Tests  31 passed (31)\n```\n\n### 2. Real retrieval→tiering pipeline — SETTINGS is discoverable, not agent-fill (6 tests)\nDrives the actual `retrieveActions → tierActionResults` the planner uses, over the real SETTINGS metadata:\n```\nbun run --cwd plugins/plugin-app-control test settings-routing.test.ts\n ✓ surfaces SETTINGS for \"turn off shell access\" / \"disable shell\" / \"what settings can you change\" / \"change the permissions setting\"\n ✓ admits SETTINGS under the settings and general context gates\n ✓ keeps MODEL_SWITCH ahead for model requests so SETTINGS does not shadow it\n Test Files  1 passed (1)   Tests  6 passed (6)\n```\n\n### 3. Live-model scenario (Cerebras gpt-oss-120b) — attempted, currently RED\n`test/scenarios/settings-shell-toggle.scenario.ts` (lane `live-only`) is the acceptance contract: a natural \"disable shell access\" turn must select `SETTINGS` and drive `PUT /api/permissions/shell { enabled:false }` (captured via the in-process loopback).\n\nResult on a live run: the weak model routed the turn to `VIEWS`/`CHARACTER`/`SKILL` and did **not** select the brand-new `SETTINGS` action:\n```\n| settings-shell-toggle | failed | ... | no selected action in [SETTINGS]. Called: SKILL,SKILL,CHARACTER,SKILL,VIEWS |\n```\nThis is the same **Stage-1 candidate-generation tuning** curve every new action climbs (cf. the BACKGROUND #11360 saga — it took committed misroute trajectories + retrieval-score thresholds to make a live model reliably pick it). The scenario is committed as the target contract + tuning harness. The **deterministic real-pipeline test (#2)** is the shipped green proof that SETTINGS is on the planner surface once Stage-1 proposes a settings-write candidate; the **unit tests (#1)** prove the handler correctly drives the section's real backend route.\n\n## Scope (precise deferral)\nOf the issue's gap sections, only **`permissions`** has a verified clean single-value backend write route (`PUT /api/permissions/shell`), so it is the one `route`-owned section shipped. The others are marked `unwired` with a stated reason rather than faked — each needs bespoke backend work out of scope for one clean PR: `updates` (async job surface), `advanced` (destructive backup/reset, needs confirmation UX), `wallet-rpc`/`remote-plugins`/`app-permissions` (structured multi-value configs), `voice`/`capabilities`/`apps` (owned by other surfaces). The registry makes each deferral explicit and machine-readable.\n\n## Not done here\n- Wiring on-screen controls to the same use case (view/action twins) beyond the registry declaration — client-side follow-up.\n- Live-model routing tuning so a weak model reliably selects SETTINGS (tracked; harness is committed).\n\nEvidence note: no UI pixels changed (server-side action only), so screenshots/MP4 are N/A for this PR; the human-verifiable proof is the pasted test output above."])</script><script>self.__next_f.push([1,"3b:Te84,"])</script><script>self.__next_f.push([1,"Closes #15132 — the app's persisted dedicated-agent credential can belong to the OLD container after a container upgrade, so every agent-subdomain call 401s even while the user's Eliza Cloud/Steward session is still valid. Without repair, cloud users can dead-end at the agent-internal password wall after a rotation.\n\n## What ships\n- `/pair` relay gains popup-free JSON mode (`Accept: application/json` / `?format=json`) with mapped error codes and trusted-origin CORS echo; the existing HTML popup path is preserved.\n- Shared 202 + Retry-After pairing poll extracted from `open-web-ui` so popup login and programmatic repair use the same mint loop.\n- `repairDedicatedAgentCredential()`: on dedicated-agent 401 with a usable Steward session, mint a pairing token on the control plane, exchange it through JSON `/pair`, then persist the fresh token into the live client, boot-config handoff, sessionStorage pair key, and persisted active-server record.\n- Wired repair into `useAuthStatus`, `startup-phase-runtime`, and `startup-phase-poll` so auth readiness and boot readiness stop disagreeing after container token rotation.\n- Review follow-up: scoped the repair cache/single-flight by agent base, cleared the relay timeout on all fetch paths, and regenerated `packages/docs/action-catalog.md` so the view-action ratchet passes on current develop.\n\n## Verification\n- `bun run --cwd packages/ui test src/cloud/repair-agent-credential.test.ts src/hooks/useAuthStatus.repair.test.ts src/state/startup-phase-runtime.test.ts src/state/startup-phase-poll.test.ts` — 4 files / 68 tests passed.\n- `bun run --cwd packages/app-core test src/api/cloud-pair-route.test.ts` — 21 tests passed.\n- `node packages/scrip ctor-account OAuth intent (`client.startConnectorAccountOAuth`) and opens the returned **https-only** authorization URL; a bounded status-poll then flips the card to connected (collapse-on-connect follows the real server status — no fabricated success). Discord's desktop-app mode gets a one-click `authorizeDiscordLocal` pairing. A visible **\"use an API key / local setup instead\"** toggle is always one click away from OAuth.\n\n### #14730 — first-run channel picker fails honest\n- New `ConnectorChannelInspector` reads **live** `ConnectorRegistry` status: in-process channels (`in_app`/`push`) are connected; connector-backed channels reflect `contribution.status()` (`ok`→connected, `disconnected`→disconnected, `degraded`/unregistered/throwing-probe→**`unknown`**). `validateChannel` gains a tri-state `connection` field and never fabricates a \"disconnected\" it did not observe. A throwing probe surfaces via `runtime.reportError` (J7) and answers `unknown`. `validateChannel`/`finalizeCustomizeAnswers` are now async.\n\n### In-chat background widget (follow-on)\n- New `[BACKGROUND]` inline marker → `BackgroundWidget` renders `BackgroundSettingsControls variant=\"filmstrip\"` inside `ChatWidgetShell`, so \"change my background\" yields a live wallpaper picker in chat. The `BACKGROUND` action gains an `op=pick` last-resort plan (a generic change/choose/customize intent with no concrete target); concrete color/preset/upload requests still win. Registered on both chat surfaces via the shared inline registry; `WIDGET_MATRIX.md` + both registry gates updated.\n\n## Evidence\n\n| Type | Status |\n|---|---|\n| Unit / contract tests | done — see below (135 tests) |\n| Scoped typecheck (touched pkgs) | done — my files clean; only 2 pre-existing PA errors + env `@types/node,webxr` resolution unrelated to this change |\n| Biome | done — exit 0 on all touched production files |\n| `audit:error-policy-ratchet` | done — \"no new fallback-slop in touched files\" |\n| Real-LLM trajector d`/`trigger`/`completionCheck`/`pipeline`/`metadata.noReplyPolicy`) — no `promptInstructions`-driven behavior.\n\n## Lane note (honest)\n\nStructural scenarios 1–3 pass **keyless** under the deterministic proxy *and* **live** against Cerebras, but are marked `live-only` (not `pr-deterministic`) because the pinned strict PR corpus currently cannot render scheduled dispatches under `SCENARIO_LLM_PROXY_STRICT=1`: `dispatch-render.ts` calls `useModel(TEXT_LARGE)` on every fire with no registered strict fixture, so the task never reaches `fired`. This is a **pre-existing develop-side gap** — the existing verified `lowact-quiet-streak-softens-next-nudge` fails strict on develop tip for the same reason — and is independent of these proofs.\n\n## Finding (scenario 6)\n\nThe bill-reminder flow is **not robustly plain-worded for a non-technical user**. The reminder *is* created, but the `SCHEDULED_TASKS` confirmation intermittently leaks internal jargon to the owner (`ISO-8601`, \"the trigger type is missing\", \"prompt instructions\", raw task ids) when the model fumbles the action args — and sometimes fails to schedule at all. Root cause is the action surfacing model-facing schema guidance/errors as user copy; that's a separate product defect, out of scope for this verification PR, surfaced here as the honest verification result.\n\n---\n\n## Evidence\n\n\u003e No UI/native/audio surface — this is scenario-only test authoring.\n\u003e Screenshots · video · client console/network · per-platform capture · audio: **N/A** (no user-facing surface changed).\n\u003e Trajectories + scheduled-task domain artifacts below, from **live Cerebras `gpt-oss-120b`** and keyless deterministic runs (`TZ=UTC`). API key redacted.\n\n\u003cdetails\u003e\n\u003csummary\u003eScenario 1 — scheduled-task state-log transitions (fire → timeout → retry → expired, with timestamps)\u003c/summary\u003e\n\n```\n2026-07-08 08:00:00Z  fired      once_due                  (morning check-in fires)\n2026-07-08 09:00:00Z  scheduled  no_reply_retry_1          (no answer in the hour -\u003e single retry armed, +24h)\n2026-07-09 09:01:00Z  fired      scheduled_override_due    (the retry fires at the promised instant)\n2026-07-09 10:01:00Z  expired    no_reply_checkin_expired  (still no answer -\u003e terminal expiry, never a third nag)\n```\n\nPersisted `metadata.noReplyState` read back off the real store (`GET /api/lifeops/scheduled-tasks`):\n\n```\nafter 1st timeout:  status=scheduled  {retryCount:1, lastTimedOutAt:2026-07-08T09:01Z, nextRetryAt:2026-07-09T09:01Z}   # armed, not terminal\nafter 2nd timeout:  status=expired    {retryCount:1, terminalReason:\"no_reply_checkin_expired\", terminalOutcome:\"expired\"} # single retry only\n```\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eScenario 2 — acknowledged != completed (cross-agent invariant 6), persisted store\u003c/summary\u003e\n\n```\nafter fire        :  parent=fired        onComplete child=absent\nafter acknowledge :  parent=acknowledged onComplete child=absent   # acknowledged is non-terminal; onComplete did NOT fire\nafter complete    :  parent=completed    onComplete child=PRESENT  # true completion fires pipeline.onComplete\n```\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eScenario 3 — quiet-user watcher trips + softens (persisted store)\u003c/summary\u003e\n\nThree unanswered mornings drive real fire+expire ticks, laying a genuine `checkin/expired` streak. The fourth check-in times out and the watcher's structural consumer softens its ladder:\n\n```\nfourth check-in:  status=expired\n  metadata.noReplyState = {\n    quietStreakSoftened: true,\n    quietStreakDays: 3,\n    appliedReminderIntensity: \"minimal\",\n    retryCount: 0,                      # softened ladder drops the retry -- back off, don't chase\n    terminalOutcome: \"expired\"\n  }\n```\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eScenario 4 — answered check-in, live trajectory + judge (PASS 2/2)\u003c/summary\u003e\n\nHer turn (persona-as-data): a warm, rambling, apologetic morning answer — sore knee on the stairs, grandchildren visited, worried she's \"bothering\" the assistant.\n\nJudge (Cerebras `gpt-oss-120b`): **PASS** both runs — reply is plain, adult-to-adult, no infantilizing, no therapy roleplay, no tech jargon, no checklist, no crisis framing.\n\nFinding recorded in the catalog: an earlier rubric that *required* warm engagement with her news scored 0.00–0.40 — the default scenario agent's warmth on a neutral rambling update is inconsistent; this scenario grades the achievable readability/safety bar the issue names.\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eScenario 5 — missed-checkin follow-up, live trajectory + judge (PASS 2/2)\u003c/summary\u003e\n\nHer turn: resurfaces the next day apologizing for missing the check-in (\"I must have dozed off … I don't mean to be a nuisance\").\n\nAgent reply (verbatim): `No worries at all! Let me know if there's anything you need help with.`\n\nJudge: **PASS** both runs — warm and guilt-free, no \"you missed/didn't answer\", no streak/scolding framing, no infantilizing, no therapy, no crisis framing.\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003eScenario 6 — bill-due reminder plain words, live trajectory + judge (FLAKY ~50%, the finding)\u003c/summary\u003e\n\nHer turn: rambling mention that the electric bill is due on the 28th, worries about \"red letters\", asks for help not forgetting.\n\nRun 1 — **PASS**, clean plain reply (verbatim):\n`I've set a reminder for your electric bill, due on July 28. This will keep you from missing the payment.`\n\nRun 2 — **FAIL 0.00**, jargon leak (verbatim, truncated):\n`I couldn't schedule the task because the trigger type is missing. … To set a one-time task, please provide the date and time in ISO-8601 format, such as 2026-07-03T17:00:00-0…`\n\nAn earlier run also produced: `… I've scheduled the reminder task st_mr8y66ke_ the core task scheduler, never blocks boot, registered in the basic-capabilities bundle.\n- **Escalation through the merged seam** (`scrubWithEscalation`, #14980): tier-0 deterministic detectors run first (free, no model call); only residue candidates hit the `PII_SCRUB` model with `priority: \"background\"` so the scrub never preempts an interactive turn. The seam's fail-closed contract is inherited, not re-implemented.\n- **Content-addressed done-markers** keyed `pii:\u003csha256(content)\u003e:v\u003crulesetVersion\u003e` (exactly the issue's spec) in the DB-backed runtime cache. Crash-and-rerun resumes with zero cursor state: the marker IS the resume state.\n\n## Idempotency / crash-resume contract\n\n- Re-scrub of **unchanged** content under the **same** ruleset is a no-op (zero model calls), checked both **pre-enqueue** and again **at drain time** (covers the double-enqueue race).\n- A content edit (new sha) OR a ruleset bump (new `v\u003c...\u003e`) produces a new key, so genuinely-changed content is re-scrubbed rather than incorrectly skipped.\n- An empty `rulesetVersion` is **refused** (no version-collapsed namespace that could let a stale-ruleset scrub read as current).\n- The marker is written **only after** a successful scrub. A seam throw (no model for residue / fabricated result / model error) never writes a marker, so the item is retried; on retry exhaustion it emits `PII_SCRUB_FAILED` + `runtime.reportError` (`RECENT_ERRORS` provider + owner escalation) and the content stays quarantined (**fail-closed**).\n- The marker stores only auditable metadata (contentHash, rulesetVersion, modelId, tier0Only, completedAt) — **never the raw content or any raw PII**.\n\n## Scope\n\n**In:** LOCAL-lane rails only — the service, the content-hash marker layer, the `PII_SCRUB_*` events, and basic-capabilities registration.\n\n**Out (later slices / sibling issues):** the CLOUD lane (`routing`/`resolve`/`jobsRepository`/Redis+cron fan-out), local-model registration + `* es the constants, and the stub-server test asserts the request carries exactly the pinned prompt.\n- `parseGroundingDecorations()` splits `title [x1,y1,x2,y2]` lines into structured `{ text, box }` regions and strips the coordinate tails from the transcript before it reaches any comparison. An invalid bbox (x2\u003cx1, y2\u003cy1, implausibly large) is **not** treated as a decoration — the line passes through verbatim rather than fabricating a region (this is the region-coordinate validation on the OCR side). `OcrData` gains `regions: OcrGroundedRegion[] | null` (null = engine doesn't ground, matching the `confidence` convention).\n- Endpoint resolution order: explicit `baseUrl` option → `ELIZA_GPU_VISION_URL` → the `ocr` entry of serve.mjs's `serve.json` (path mirrors lib.mjs's `cacheDir()`, injectable for tests). Missing/corrupt/invalid records each degrade to an honest `skipped-missing-tool` reason pointing at `serve.mjs` — never a fabricated endpoint.\n- `joinUrl()` appends request paths to the base URL's own path, so `http://host/vision` keeps its prefix (asserted against a stub that 404s anything outside `/vision/*`).\n\n```\n✓ UNLIMITED_OCR_PROMPT drift guard \u003e is byte-identical to scripts/gpu-vision/lib.mjs OCR_PROMPT\n✓ parseGroundingDecorations \u003e splits `title [x1,y1,x2,y2]` lines into cleaned text plus regions\n✓ parseGroundingDecorations \u003e passes through lines whose bbox is invalid instead of fabricating a region\n✓ ocr.unlimited \u003e sends the pinned prompt and parses a completion\n✓ ocr.unlimited \u003e strips grounding decorations into structured regions\n✓ ocr.unlimited \u003e preserves a base URL path prefix when joining request paths\n✓ ocr.unlimited \u003e serve.json endpoint discovery \u003e discovers the endpoint from serve.mjs's serve.json record\n✓ ocr.unlimited \u003e serve.json endpoint discovery \u003e is unavailable with a pointer at serve.mjs when no serve.json exists\n✓ ocr.unlimited \u003e serve.json endpoint discovery \u003e treats a corrupt serve.json as endpoint-unknown, never a fabricated endpoint\n✓ ocr.unlimited \u003e serve.json endpoint discovery \u003e rejects a serve.json ocr entry with an invalid port\n```\n\n## (3) MED — tree.aria line grammar: named containers and inline text leaves\n\n`packages/evidence/src/analyzers/aria.ts`\n\n**Before:** `- navigation \"Main\":` failed the name regex (trailing colon) and fell through to the role-only branch, producing the garbage role `navigation \"Main\"`; `- text: Welcome back` became role `text: Welcome back`. Real Playwright `ariaSnapshot()` output was mangled into nonsense nodes that then poisoned normalize/diff.\n\n**After:** one line grammar covering `role \"Name\" [attr]`, `role \"Name\":` (named container), `role:`, `text: content` (raw, unquoted text leaf), and `role \"Name\": content` (single-text-child element — normalizes identically to the indented `- text:` form). A quoted name shields internal colons (`- button \"Save: draft\"`). Text leaves round-trip in Playwright's unquoted `text:` form, and normalize is idempotent over the new shapes:\n\n```\n✓ parseAriaSnapshot \u003e parses a named container line (role + name + trailing colon)\n✓ parseAriaSnapshot \u003e parses a named container with attributes before the colon\n✓ parseAriaSnapshot \u003e parses inline text leaves verbatim\n✓ parseAriaSnapshot \u003e wraps `role: inline content` as a text child, equal to the indented form\n✓ parseAriaSnapshot \u003e does not mistake a colon inside a quoted name for a container marker\n✓ normalizeAriaSnapshot \u003e is idempotent over named containers and text leaves\n```\n\n## (4) LOW batch\n\n- **error-policy annotations** — the availability-probe catches in `engines.ts` (tesseract/swift `--version`, gpu health, serve.json read) now carry `// error-policy:J3/J4/J5` annotations with the observer named; the swallowed-stdin-EPIPE case documents where the rejection IS observed (the `close` handler).\n- **fileURLToPath** — `resolveAppleVisionScript()` used `new URL(import.meta.url).pathname` for a filesystem join (breaks on Windows drive letters / percent-encoded paths); now `fileURLToPath`.\n- **`as unknown as` cast removed** — `fetch as unknown as FetchLike` is now a plain `?? fetch` assignment; the `FetchLike` shape is structurally satisfied by global fetch, verified by typecheck.\n- **region coordinate validation** — `evaluateRegionExpectations` (`diff.ts`) validates the caller-supplied normalized boxes (finite, `0\u003c=x,y`, `w,h\u003e0`, `x+w\u003c=1`, `y+h\u003c=1`) and throws typed `REGION_EXPECTATION_INVALID` instead of silently sampling out-of-frame pixels and returning a confidently wrong pass/fail: `✓ rejects malformed region expectations instead of sampling garbage`, `✓ fails the analyzer (never a wrong pass) on an out-of-range expectation`.\n- **slugForVideo collision** — `video/a/b.mp4` and `video/a-b.mp4` both squashed to `video-a-b-mp4`, letting two videos write keyframes into one directory; a short sha256 of the exact bundle path is appended: `✓ never collides for distinct paths that squash to the same slug`.\n- **runner failed-path test** — `✓ records a throwing analyzer as failed with its message, isolated from the rest` proves a throw becomes an honest `failed` record (message + duration, no data) while sibling analyzers still run.\n\nAlso: `vitest.config.ts` `testTimeout` raised to 120s for this package — its integration tests run real tesseract/ffmpeg subprocesses whose wall-clock depends on host load, and the 5s default was flaking files this branch never touched (`src/video/normalize.test.ts`, `src/video/ingest.test.ts`).\n\n## Evidence\n\nFull suite, typecheck, lint, and the diff-scoped error-policy ratchet on the final tree:\n\n```\n$ bun run --cwd packages/evidence test\n Test Files  37 passed | 1 skipped (38)\n      Tests  343 passed | 1 skipped (344)\n\n$ bun run --cwd packages/evidence typecheck   # tsgo --noEmit — clean\n$ bun run --cwd packages/evidence lin n — it would 503/401 and fail closed to silence. Now the default resolves against **what the runtime can actually do right now**:\n\n```\nexplicit user choice (always wins)\n  -\u003e Kokoro on-device (local-inference, when its engine is staged)\n  -\u003e Kokoro via Eliza Cloud (eliza-cloud, when a voice session exists)\n  -\u003e ElevenLabs (only when a key is configured — never a silent default)\n  -\u003e browser SpeechSynthesis (terminal fallback)\n```\n\n- **`resolveDefaultTtsProvider`** (`packages/ui/src/voice/voice-provider-defaults.ts`) — pure resolver over the platform preference + a `VoiceCapabilitySnapshot`; always returns a runnable provider.\n- **`useResolvedTtsDefault`** (`packages/ui/src/hooks/useResolvedTtsDefault.ts`) — React wrapper. Probes on-device readiness (`GET /api/tts/local-inference/status`) only on desktop/mobile-local; upgrades to on-device Kokoro once confirmed. Never pins a backend it can't confirm.\n- **`GET /api/tts/local-inference/status`** (`plugins/plugin-local-inference/src/routes/local-inference-tts-route.ts`) — new readiness probe mirroring the ASR one. `{ ready, provider }`; `ready` iff a TEXT_TO_SPEECH handler is registered. A failing/unreachable probe reads as **not ready** (fail-closed), so the default falls through explicitly.\n- **`useVoiceConfig`** seeds the resolved provider (recomputed every load, **never persisted** — an explicit choice always wins). **`VoiceConfigView`** surfaces the resolved \"Device default: Kokoro (…)\" and keeps the picker fully switchable.\n- Agent-server + lazy-route path gates for `/api/tts/local-inference` widened to `startsWith` so the `/status` subpath reaches the handler (matches the ASR gate).\n\nNo silent fabrication: a failing backend still surfaces the existing observable `ttsError` and fail-closed behavior (#12253) — this change only affects which provider is chosen *by default*, not error handling of an explicitly-chosen one.\n\n### STT — native OS recognizer preferred on iOS/Android\n\nInvestigated the TalkMode Capacitor plugin: the iOS `TalkModePlugin.swift` **already implements the full SFSpeechRecognizer path** (`startRecognition` -\u003e `AVAudioEngine` tap -\u003e `recognitionTask` with partial results -\u003e `handleTranscript`/`finalizeTranscript` emitting the `transcript` event with `isFinal`, plus silence monitoring + permission handling), and Android has `ElizaVoiceNative`. The hook-free `voice-capture-factory` already prefers native TalkMode on **both** platforms ahead of the local-inference probe. This PR adds a test that **locks that preference** for the exact failure mode the arch notes flag (on mobile the local-inference ASR assets aren't staged; the probe can report ready then 502 at `stop()` with no fallback — so TalkMode must win even when `asrProvider: \"local-inference\"` is explicitly requested).\n\n### Evidence\n\n| Evidence | Status |\n| --- | --- |\n| Deterministic tests (provider-order matrix + error path) | see below |\n| iOS TalkMode Swift bridge-contract tests | `swift test` passes on this host (3/3) |\n| Real-LLM trajectories | N/A — no agent/action/prompt/model change; client provider-selection + a readiness route |\n| Full iOS TalkModePlugin build (SFSpeechRecognizer + Capacitor) | N/A in this shell — needs `xcodebuild` in the iOS app; command below |\n| Frontend video / before-after screenshots | N/A in this shell — no browser/simulator; the settings \"Device default\" label + picker are covered by `VoiceConfigView.test.tsx` |\n| Backend logs / domain artifacts | N/A — TTS status route is unit-covered; no new agent-side side effects |\n\n\u003cdetails\u003e\n\u003csummary\u003eDeterministic test output\u003c/summary\u003e\n\n```\n# packages/ui — resolver + probe + hook\nsrc/voice/voice-provider-defaults.test.ts .... 18 passed  (pickDefaultVoiceProvider + resolveDefaultTtsProvider full matrix)\nsrc/hooks/useResolvedTtsDefault.test.tsx .....  8 passed  (per-platform chain, probe gating, async upgrade)\nsrc/voice/l Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"4f:T16ca,"])</script><script>self.__next_f.push([1,"## Summary\n\nFixes #15132, after a dedicated cloud agent's container is upgraded (blue/green recreate, fleet-upgrade #15101), the browser's persisted agent credential belongs to the OLD container. Every agent-subdomain call then 401s and `App.tsx`'s top-level auth gate rendered the agent runtime's internal \"Sign in with your password\" wall, a credential no cloud user possesses, stranding users who have a perfectly valid cloud session at an unsatisfiable prompt. Terminal dead-end.\n\nThis adds a **recovery-billing proxy** at the auth gate. On a `remote_auth_required` 401 for a cloud-managed dedicated agent **with a valid cloud session**, the client transparently re-runs the pairing/token-swap exchange (POST agents pairing-token then the agent `/pair` relay, the same flow first-pairing and \"Open Web UI\" use) in the current window, refreshing the persisted agent credential and landing back on `/` re-paired. The internal password wall now renders **only** when there is NO cloud session (self-hosted direct access), exactly as intended.\n\n## Dead-end mechanism\n\n`packages/ui/src/App.tsx` (auth gate, previously ~line 2629): `authState.phase === \"unauthenticated\"` unconditionally rendered `\u003cLoginView\u003e` (the password wall) even when the app was pointed at a cloud-managed dedicated agent whose stale container credential 401'd post-upgrade. `useAuthStatus` publishes `unauthenticated` on the agent-subdomain 401; nothing consulted the still-valid cloud session to re-pair.\n\n## Recovery path implemented\n\n- `packages/ui/src/state/agent-session-recovery.ts`, pure routing decision. Re-pairs ONLY when: reason is `remote_auth_required` (rejected session, not `remote_password_not_configured`), the active runtime is cloud-managed, a cloud session token exists, and no attempt has run this cycle. Otherwise `show-wall`.\n- `packages/ui/src/state/agent-session-recovery-runner.ts`, polls the cloud pairing-token endpoint (202 warm-up aware) and navigates the current window to the `/pair` relay (which pins the fresh credential + redirects to `/`). Refuses non-http redirect targets.\n- `packages/ui/src/hooks/useAgentSessionRecovery.ts`, bridges the auth gate to the decision + runner; one-attempt guard prevents re-pair/401 loops.\n- `packages/ui/src/App.tsx`, while recovering, holds the `\u003cStartupScreen\u003e` surface instead of flashing the wall; drops to the wall if recovery can't proceed.\n\n## ⚠️ AUTH-ADJACENT, human review requested\n\nThis touches the auth/session gate. It does **not** weaken or bypass the password wall:\n\n- Recovery fires only when a **valid cloud session** exists to re-pair from. No cloud session → wall stands.\n- The **server still gates** the pairing-token mint; any 401/403 from it falls back to the wall (no navigation).\n- `remote_password_not_configured` keeps its actionable setup wall (re-pairing cannot manufacture an owner password).\n- One-attempt guard prevents infinite re-pair/401 loops.\n- Runner navigates only to absolute http(s) targets from the authenticated cloud response.\n\nPlease review the routing/UX recovery logic, not as a new auth system, no new auth surfaces were added; it reuses the existing first-pairing exchange.\n\n## Evidence\n\n| Check | Result |\n| --- | --- |\n| New unit tests | 18 passed (`agent-session-recovery.test.ts` 8, `agent-session-recovery-runner.test.ts` 6, `useAgentSessionRecovery.test.tsx` 4) |\n| Failing-test-first | Decision + dead-end→recovering state-transition tests written before impl |\n| Typecheck | `tsc --noEmit -p packages/ui/tsconfig.json` clean for changed files |\n| Forbidden files | none touched (vite.config / index.html / turbo.json / bun.lock) |\n| Codex review | exceeded 100s with no output; self-review performed (added redirect-URL safety guard as a result) |\n\n## Test output\n\n```\n✓ src/state/agent-sessi .push([1,"53:T118f,"])</script><script>self.__next_f.push([1,"## Root cause\n\nThe flagship ADHD **\"Today\"** home card (`packages/ui/src/components/chat/widgets/todo.tsx`) read the app store's `workbench.todos` **directly** — the AGENT's work checklist. `WorkbenchTodo` has no `dueDate`, so the spec's Today resident (NOTIFICATIONS-WIDGETS-SYSTEM.md §B.3: *\"up to 3 items due/overdue today, checkbox affordance, tap toggles done\"*) could not be built on it. The card was a **store-reader for the wrong store**, and showed the agent's chores instead of the owner's due/overdue todos.\n\nThe owner's todos (with `dueDate`) already live behind `GET /api/lifeops/todos` — a projection of the shared scheduled-task spine — but only the routed `TodosView` consumed them. The home card had no read path to them.\n\n## Fix — one canonical read path, card becomes a pure renderer\n\nNew read model **`today-todos-data.ts`** (dependency-light, mirrors the sibling `goals-attention-data.ts`):\n\n- validates the untrusted `GET /api/lifeops/todos` wire at the boundary into the typed **`TodayTodo`** DTO (drops null/undated/malformed records — a glance is only about *due*),\n- selects the **due/overdue-today** slice (`dueOrOverdueToday`), sorted most-overdue-first,\n- completes a row through the canonical **`POST /api/lifeops/occurrences/:id/complete`** write.\n\n`todo.tsx` now **dispatches by slot**:\n- **home** → `TodayHomeCard`, a pure render over the DTO (checkbox affordance, overdue in the accent color, **optimistic completion with rollback**, header opens the routed todos view). It never touches a store.\n- **chat sidebar** → the agent's workbench checklist (a legitimately different domain read) is preserved unchanged.\n\nThe merged at-risk-goal row (§E item 5) and the home-attention weighting are preserved; the overdue count now drives the `reminder` weight (an at-risk goal still outranks it with `escalation`). `now` is sampled inside the load/poll callbacks — never `Date.now()` in render — so renders stay deterministic (passes `audit:ui-determinism`).\n\n## Architecture alignment\n\n- **Client displays, never computes / read model returns a typed DTO** — the card reads DTO fields; all selection/derivation lives in the read model.\n- **DTO fields required by default** — `TodayTodo.dueDate` is non-nullable; undated records are dropped at the boundary, not carried as `null`.\n- **Error policy J4** — a failed glance fetch returns `null` so the card keeps last-good (never fabricates empty); a failed completion write rolls the optimistic row back rather than silently dropping it.\n- **Sparse-home doctrine** — the card self-hides when nothing is due/overdue and no goal is urgent.\n- `view-action-ratchet` and `audit:ui-determinism` both pass for the touched files.\n\n## Evidence\n\n**Real-path tests (30 passing)** — drive the actual fetch → parse → filter → render → complete path; each fails without the fix.\n\n\u003cdetails\u003e\u003csummary\u003eTest run\u003c/summary\u003e\n\n```\ntoday-todos-data.test.ts (15) — parseTodayTodos, dueOrOverdueToday (today-window + overdue sort + end-of-day boundary),\n  isOverdue/overdueCount, fetchTodayTodos (GET + throw on 5xx), completeTodayTodo (encoded POST + reject on failure),\n  loadTodayTodosForGlance (auth gate / limited-base gate / J4 null / happy path), todosEqual\n\ntodo.test.tsx (15) — sidebar workbench behavior preserved; home slot:\n  ✓ renders the OWNER's due/overdue todos, not the agent workbench (#14734)\n  ✓ self-hides when nothing is due/overdue and there is no urgent goal\n  ✓ tapping a row completes it through the occurrence-complete write and it disappears\n  ✓ restores the row when the completion write fails (J4 rollback)\n  ✓ an overdue todo publishes the reminder attention weight\n  ✓ tapping the header opens the routed todos view\n  ✓ spanClassName / at-risk goal / needs-attention goal (§E item 5) preserved\n\nTest Files  2 passed (2)   Tests  30 passed (30)\n```\n\u003c/details\u003e\n\n- o raw SQL)\n\n**Forward path — one shared entity per agent** (`sub-agent-router.ts`):\n- The derivation becomes `agentId:acpx:sub-agent:shared` (memoized; the `:shared` suffix can't collide with any legacy per-session id). Fixed name `sub-agents`, static `{ sub_agent: { shared: true } }` metadata — deliberately **no per-session data, ever**: per-session identity is already fully carried by every router memory (`content.metadata.subAgentSessionId` / label / event / status / agentType / workdir plus the `[sub-agent: \u003clabel\u003e (\u003ctype\u003e) — \u003cevent\u003e]` text header), and the in-repo session resolvers (`tasks.ts` completion follow-up paths) read memory metadata, never the entity. The per-event idempotent create is kept (adapter-side conflict-do-nothing → self-heals if an operator deletes the row).\n- Because the derivation is per **event**, from the moment this deploys no event can ever post under a per-session entity again — including in-flight sessions. Every legacy per-session entity is stale **by definition**: no liveness heuristic, no terminal-event hooks, no TTL.\n\n**Migration — participants unlink, not delete** (`sweepLegacySubAgentParticipants`):\n- One-shot per room per process (memoized, FIFO-bounded like the router's other per-session tracking; a failed sweep surfaces via `runtime.reportError` and drops the memo so the next event in that room retries — idempotent by construction).\n- Classification is **structural**: the creation-time `metadata[sub_agent].subAgentSessionId` marker the router stamped on every per-session entity — never name matching. The shared entity (`{ shared: true }`, no sessionId) and humans can't classify as stale.\n- `getEntitiesForRoom` → one batch `runtime.deleteParticipants`. The room read is a participants→entities join on **every** adapter (plugin-sql, plugin-inmemorydb, core inMemoryAdapter), so unlinking hides legacy entities from **all** room consumers at once. Nothing FKs participants — zero cascade risk. The entity rows stay as dormant FK anchors: `memories.entity_id` stays valid, and historical transcripts keep their per-task display names (recentMessages backfills authors via `getEntityById`, which reads the entities table directly, not the join).\n- Two invocation legs: the session's **first event of any kind** (a fresh spawn streams output immediately, so the polluted room heals on the next spawn, not the next completion) and the delivery fan-out (covers task/worktree swarm rooms).\n\n## Documented residuals (accepted)\n\n- Rooms with stale entities that never see another sub-agent event are never swept; their pollution stays bounded by #15091's cap.\n- ~850 dormant entity rows remain in the entities table, **bounded forever**. Operators must NOT hand-delete them without re-pointing memories first (plugin-sql cascade destroys transcripts) — stated in the sweep's doc comment.\n- `searchEntitiesByName` could still surface dormant rows on substring match — latent (no production callers found), bounded.\n- Facts/reflection extracted from router posts attach to the single shared entity — a bounded smear (previously unbounded).\n- The shared entity's name is frozen at first creation per DB (conflict-do-nothing); cosmetic.\n\n## Tests (all REAL — no mock standing in for the thing under test)\n\n**Router unit suite** (`__tests__/unit/sub-agent-entity-lifecycle.test.ts`, deterministic harness): two sessions → one shared entity id across createEntity/addParticipant/memory.entityId with distinct per-memory `subAgentSessionId`s; sweep unlinks exactly the marker-bearing entities (humans, the shared entity, and an unmarked `sub-agent:`-named imposter survive) and memoizes; spawn-time heal on a non-inject `message` event; `deleteParticipants` failure → `reportError` + memo drop + successful retry; marker-classifier edge cases.\n\n**Real-PGlite integration** (`plugin-sql/src/__tests__/integration/sub-agent-entity-unlink.real.test.ts`, real isolated DB via `createIsolatedTestDatabase`): unlink hides legacy entities from `getEntitiesForRooms` while transcripts and entity rows survive with their original names; 10 completion cycles of the shared-entity sequence grow the table by exactly **one** entity and **one** participant; and the hazard pin — `deleteEntity` cascades transcripts, proving why the sweep must unlink, not delete.\n\n**plugin-inmemorydb adapter-contract twin** (`participant-unlink.test.ts`, real adapter + storage): same unlink-without-delete semantics on the in-memory backend.\n\nAlso updated: the router test harnesses' runtime doubles now carry `getEntitiesForRoom`/`deleteParticipants`/`reportError` (required members of `IAgentRuntime` the router now exercises).\n\n```\nplugin-agent-orchestrator __tests__/unit/sub-agent-entity-lifecycle.test.ts + sub-agent-router.test.ts: 94 passed (94)\nrouter-adjacent suite (16 files): 157 passed, 1 pre-existing env failure (TRACE_ENV, proven identical on pristine origin/develop)\nplugin-sql sub-agent-entity-unlink.real.test.ts: 3 passed (3)\nplugin-inmemorydb participant-unlink.test.ts: 1 passed (1)\ntypecheck plugin-agent-orchestrator: clean; biome: clean on all touched files\n```\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n## Evidence\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before screenshots: N/A - backend-only plugin service change (sub-agent event routing); no UI surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] After screenshots: N/A - backend-only plugin service change; no UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] Walkthrough video: N/A - no user-visible flow; behavior is DB entity/participant lifecycle. Real-database before/after capture: https://github.com/elizaOS/eliza/pull/15115#issuecomment-4896573224\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs: real-PGlite 861-entity live-room mirror — before/after `getEntitiesForRoom` reads, one-batch unlink timing, transcript sur eview\n- Ran `codex review --uncommitted`; first pass flagged the pre-self-hide cap starvation and needs-attention fallback. Fixed both. Second pass exceeded 100s and was killed, so I performed a self-review on the partial trace and added the MutationObserver cap reapplier + interval enabled gate.\n\nRefs #14560\n\n[sol-orch]"])</script><script>self.__next_f.push([1,"61:T23c2,"])</script><script>self.__next_f.push([1,"Follow-up to the merged **#14629** (video-evidence lane, #14545). The PR merged before its planned adversarial review ran (reviewer session died); that review was posted post-merge and flagged 8 failure-path defects plus 3 minor robustness gaps. This PR fixes all of them, each with a test that provokes the exact failure mode.\n\nReview comment being addressed: https://github.com/elizaOS/eliza/pull/14629#issuecomment-4889632718\n\nAll paths below are `packages/evidence/` relative. Fixes concentrate on the failure/retry paths the merged lane never exercised: evidence destroyed on failure, `--bundle` dir poisoned on retry, stale-video pick, a browser-leak window, and a fixture-server crash.\n\n---\n\n### Finding 1 — A failed walkthrough destroyed its own failure evidence\n`src/video/cli.ts`. The driver finalizes the recording in a `finally` so \"a failed run leaves a diagnosable recording\", but the CLI's scratch-cleanup `finally` ran on the error path too and `rm -rf`'d the scratch (recording + screenshots + steps log).\n\n- **Before:** scratch cleaned unconditionally in `finally`.\n- **After:** scratch is removed **only on success**; on failure the raw recording is preserved and its path is printed (`walkthrough scratch preserved for diagnosis: …`), then the original error rethrows to the J1 boundary.\n\n### Finding 2 — Failed runs poisoned `--bundle` (BUNDLE_DIR_EXISTS on retry)\n`src/video/cli.ts`. `openBundle` created the dir before validation/run, so any failure left an empty, manifest-less dir and every retry died with `BUNDLE_DIR_EXISTS`.\n\n- **Before:** dir created first; failures left it behind.\n- **After:** argv + definitions validated **before** the dir is created; on mid-run failure the unfinalized (manifest-less) dir is removed at a J6 teardown, so a retry hits the real error again, not `BUNDLE_DIR_EXISTS`. A genuinely pre-existing dir is still a typed `BUNDLE_DIR_EXISTS` and is never deleted (sealed single-writer contract). Header corrected: bundles are fresh, not \"reused\".\n\n### Finding 3 — `findVideoFile` picked `files[0]` → could ingest a stale recording\n`src/video/driver.ts`. A reused `--out/.video` dir accumulates one webm per run; readdir-order pick could ship the previous run's video as this run's evidence.\n\n- **Before:** `return path.join(videoDir, files[0])`.\n- **After:** `.video` is cleared before the run; `findVideoFile` picks **newest by mtime** (name tie-break) so the result is unambiguously this run's recording.\n\n### Finding 4 — Browser leak / original error masked in driver teardown\n`src/video/driver.ts`. `newContext`/`newPage` ran outside the guarded region (leaked chromium on e.g. full-disk `recordVideo` setup), and a throwing `context.close()` in `finally` skipped `browser.close()` and masked the step error.\n\n- **Before:** setup outside `try`; `context.close()` then `browser.close()` in one `finally`.\n- **After:** all setup inside the guard; context and browser closed **independently**; the first/step error is carried in a `failure` cell and always wins — a secondary close rejection only surfaces when the run itself succeeded.\n\n### Finding 5 — Uncaught `URIError` crashed the fixture server (`GET /%`)\n`src/video/fixture-server.ts`. `decodeURIComponent` on a malformed path threw out of the request handler and killed the process mid-walkthrough.\n\n- **Before:** `const urlPath = decodeURIComponent(...)` unguarded.\n- **After:** J3 try/catch → `400 bad request`; the server keeps serving.\n\n### Finding 6 — Suite flaked under default parallelism (vitest 5000ms)\n`src/analyzers/runner.test.ts`, `src/video/ingest.test.ts`. ffmpeg transcode + keyframe fan-out overran vitest's 5s default under parallel load (two clean full runs failed the same 2 files).\n\n- **After:** explicit `120_000` budget on the ffmpeg-heavy integration tests, matching the driver suite.\n\n### Finding 7 — Tests hardcoded PATH `ffmpeg` while gating on `videoToolsAvailable()`\n`src/video/normalize.test.ts`, `src/video/ingest.test.ts`, `src/analyzers/runner.test.ts`. The availability gate accepts env/bundled binaries, but clip generation exec'd bare `\"ffmpeg\"` → on a bundled-only machine the suites ran and failed at generation instead of skipping.\n\n- **After:** clips are generated with the **same** binary the gate resolves (`resolveFfmpegBinary()` / `resolveFfprobeBinary()`), so a bundled-only host skips honestly.\n\n### Finding 8 — `goto` scheme hole (file:/javascript:/data:)\n`src/video/driver.ts` + `src/video/walkthrough-schema.ts`. Only `^https?://` was treated as absolute; `file:///…`/`javascript:…` passed schema and reached `page.goto` unchanged (would screenshot local files / run script into a bundle).\n\n- **After:** non-http(s) schemes are rejected at **both** schema validation (`WALKTHROUGH_URL_SCHEME` message) and driver execution (typed `WALKTHROUGH_URL_SCHEME` after resolution); an unparseable target is a typed `WALKTHROUGH_URL_INVALID` (J3), never a raw `TypeError`.\n\n### Minor items (also fixed)\n- **Remux dropped extra streams:** `src/video/normalize.ts` remux now uses `-map 0 -map -0:s?` so a second audio track survives (subtitles dropped to match the transcode path).\n- **Double-indexed screenshot names:** `src/video/walkthroughs.ts` used driver basenames as-is (no more `00-03-hover-send.png`).\n- **`waitFor`/`scroll` with both selector and value:** schema now rejects it instead of the driver silently ignoring the value.\n\n---\n\n### Verification\n\nFull `packages/evidence` suite green after rebasing onto current `develop`, real system ffmpeg 7.1, real headless chromium:\n\n```text\n$ bun run --cwd packages/evidence test\n Test Files  37 passed | 1 skipped (38)\n      Tests  359 passed | 1 skipped (360)\n```\n\nPer-finding test tails (failure modes provoked):\n\n```text\n# Findings 1 \u0026 2 — cli.test.ts (real chromium)\n✓ bundle poisoning on failed runs \u003e removes the unfinalized --bundle dir when ingest fails, so a retry is not blocked\n✓ bundle poisoning on failed runs \u003e does not create the --bundle dir when the walkthrough definition is invalid\n✓ bundle poisoning on failed runs \u003e reports a typed BUNDLE_DIR_EXISTS for a pre-existing --bundle dir (sealed, no reuse)\n✓ walkthrough failure path (real chromium) \u003e preserves the scratch as failure evidence, unpoisons the bundle, and retries clean  4583ms\n\n# Findings 3, 4, 8 — driver.test.ts (injected structural browser)\n✓ teardown and recording selection \u003e picks this run's recording, never a stale one left in .video\n✓ teardown and recording selection \u003e closes the browser when context creation fails\n✓ teardown and recording selection \u003e surfaces the step error, not a context.close rejection, and still closes the browser\n✓ teardown and recording selection \u003e surfaces a context.close rejection when the steps themselves succeeded\n✓ teardown and recording selection \u003e rejects a goto that resolves to a non-http(s) URL before it reaches the page\n✓ teardown and recording selection \u003e rejects a relative goto against a non-http(s) baseUrl\n\n# Finding 5 — fixture-server.test.ts\n✓ serveFixture \u003e answers malformed percent-encoding with 400 and keeps serving\n\n# Finding 8 (schema side) — walkthrough-schema.test.ts\n✓ rejects goto targets with non-http(s) schemes\n✓ accepts http(s) and relative goto targets\n✓ rejects a non-http(s) baseUrl\n✓ rejects waitFor and scroll steps carrying both selector and value\n\n# Minor (remux stream preservation) — normalize.test.ts\n✓ normalizeVideo (ffmpeg present) \u003e remux keeps every non-subtitle stream (both audio tracks survive)  659ms\n```\n\nGates: `bun run --cwd packages/evidence test` (full suite green), `typecheck` (tsgo, clean), `lint` (biome, clean).\n\nDoctrine: fail-fast preserved; new catches carry `// error-policy:J3/J4/J6` annotations; no `console` in library code (CLI stdout/stderr is the product); prose headers updated to describe the sealed-bundle + preserved-scratch contract.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n## Evidence Rows\n\n\u003c!-- evidence-row:before-screenshots --\u003e N/A - headless evidence video tooling; no product UI/native/browser surface changed.\n\u003c!-- evidence-row:after-screenshots --\u003e N/A - headless evidence video tooling; no product UI/native/browser surface changed.\n\u003c!-- evidence-row:walkthrough-video --\u003e N/A - this changes the walkthrough recorder itself rather than a product flow; real Chromium failure-path tests and transcripts above prove preserved recordings and clean retry behavior.\n\u003c!-- evidence-row:backend-logs --\u003e N/A - no app backend route/provider/action/service path changed; CLI stderr/stdout transcripts above cover the process boundary.\n\u003c!-- evidence-row:frontend-logs --\u003e N/A - no frontend/browser app session changed; Playwright fixture coverage is represented by the package tests above.\n\u003c!-- evidence-row:llm-trajectory --\u003e N/A - no agent, prompt, planner, model, or live-LLM behavior changed.\n\u003c!-- evidence-row:domain-artifacts --\u003e N/A - no product domain state changes; the relevant evidence artifacts are the preserved scratch recording, generated manifest, normalized video/keyframes, and analysis paths proven by the tests/transcripts above.\n"])</script><script>self.__next_f.push([1,"62:T179a,"])</script><script>self.__next_f.push([1,"Post-merge follow-up to **#15006** (squash-merged as `372a87d1`). Fixes the four defects from the adversarial review — https://github.com/elizaOS/eliza/pull/15006#issuecomment-4890489268 — that landed with the merge.\n\n## Defects fixed\n\n### 1. BLOCKER — permanent drain latch (liveness)\n`processJob` short-circuited a drained job to a blind skip and only ever called `onServiceOk()` *after* running an analyzer, so one sustained outage latched `draining=true` forever and every future job skipped even after the GPU service recovered — a broken pipeline masked as honest state.\n\nFix: drain mode no longer short-circuits. The worker runs the analyzer whose cheap availability probe (a fast-failing `/health` GET) re-contacts the service; a service that recovered after the latch set is detected, the latch clears, and the job is analyzed for real. This mirrors the recovery re-probe in the already-merged `docker/certification/queue-worker.mjs` (#14549).\n\nTests (`worker.test.ts`): a `processJob` unit test (draining state + reachable service → `completed`, latch cleared) and an end-to-end `runQueueWorker` test where `/health` is down on the first probe (latches drain) then recovers → the next job is **processed**, not skipped forever.\n\n### 2. BLOCKER/dedup — parallel queue drift\n`state.ts` and `docker/certification/queue-lib.mjs` (#14549) share a filesystem-queue kernel but had already drifted (defect 1 was the first drift).\n\n**Architecture decision: keep both, guard with a parity/contract test — do NOT force a shared runtime module.** The two queues are genuinely different: different job *shapes* (this queue's `analyzerId`+`analysisPath` merged into `analysis.json` vs the container queue's OpenAI `model`+`request` proxied to the resident llama-server) and different runtime *layers* (this TS package vs plain Node running in the compose GPU profile against a **read-only** repo mount, before the workspace is guaranteed installed/built). A physically-shared runtime module is fragile in both directions — a workspace-TS import can't resolve in that container, and a docker-owned import is wrong for a published package.\n\nInstead, `parity.test.ts` imports **both** real modules and asserts the shared kernel agrees — the four dir names, the backpressure cap + drain window, FIFO claim order, id generation, and the `unreachable→drain→reset` state machine, transition for transition — so they can never silently diverge again. `state.ts`'s header documents the layering. A new `docker/certification/queue-lib.d.mts` types the cross-layer import (no `any`).\n\n### 3. BLOCKER/acceptance — `QueueExecutor` unwired\nNothing set `AnalyzeOptions.executor`, so `evidence:certify --tier gpu` still ran gpu analyzers inline — the #14543 acceptance (\"via a resident worker\") was unmet.\n\nFix: `evidence:certify --tier gpu|full --gpu-queue \u003cdir\u003e` now routes gpu-tier analyzers through a `QueueExecutor` (enqueue → resident worker → poll result), sharing one model load; cpu analyzers still run inline, and with no worker the gpu analyzers **honestly skip** (`skipped-missing-tool` naming the missing worker), never a fabrication. Built on the merged orchestrator (#15004).\n\nTests (`orchestrate.test.ts`): a real fresh-bundle certify at `--tier gpu` with a screenshot ingested and a concurrent stub worker → the OCR result lands via the queue; the no-worker path → honest skip, and the run still produces a signed cert. Plus a `resolveGpuQueueExecutor` unit test (executor only at gpu/full with a root).\n\n### 4. SHOULD-FIX — lost-update race in `analysis-merge.ts`\nCross-process read-modify-write of `analysis.json`: temp+rename is atomic per write but not per update, so two workers merging two analyzers for one subject dropped a result.\n\nFix: the whole read-modify-write runs under a per-subject `O_EXCL` lockfile (bounded retry + staleness break-in so a crashed holder self-heals). Test (`analysis-merge.test.ts`): **10 real OS processes** merge 10 distinct analyzers into one `analysis.json` at once — all 10 survive. (Confirmed the unlocked version loses ~half.)\n\n## Evidence\n\nFull `packages/evidence` the gate is mandated at each — one implementation, two invocation points, not per-site string edits:\n\n1. **`AgentRuntime.sendMessageToTarget`** (`packages/core/src/runtime.ts`) — the connector-transport chokepoint. This one seam auto-covers escalation, scheduled dispatch, task-agent routing, knowledge answers, and any raw error string routed to a connector.\n2. **`routeAutonomyTextToUser`** (`packages/agent/src/api/server-helpers-swarm.ts`) — the in-app WebSocket proactive relay, which writes to DB + broadcasts directly (it does not pass through `sendMessageToTarget`), so it carries its own gate call. Dedupe now keys on the final delivered text.\n\nProvenance is a single `Content.agentVoiced` flag (`packages/core/src/types/primitives.ts`). Text that is **already** the agent's composed voice passes through untouched — no double-voice, no latency:\n\n- normal model replies are never gated (they use the `HandlerCallback` connector path, not `sendMessageToTarget`),\n- the owner's own manually-typed inbox reply is marked `agentVoiced: true` (`voice-policy:V2` — a real person's words, never rephrased),\n- swarm-synthesis sends and sub-agent routing are marked `agentVoiced: true` (`voice-policy:V3` — already model-voiced; re-voicing risks altering exact values).\n\n### Fail-open (`voice-policy:V1`)\n\nThe gate is a cosmetic pass over already-final text, so a rephrase outage delivers the **original** text unchanged and `runtime.reportError`s — it never blocks a real user message. Blank model output is treated as a failure the same way. Dropping a real message is strictly worse than delivering one raw literal once with the outage surfaced. Cached per-agent by input hash (FNV-1a, no `node:crypto` so the module stays browser/edge-safe) so a repeated literal rephrases once.\n\n### Regression guard\n\n`bun run audit:voice-policy-ratchet` — diff-scoped, same shape as the error-policy ratchet. For each production file the branch touches, it fails iff the file's count of unannotated agent-voiced reply literals rises vs the merge-base. AST-based (TypeScript), immune to develop drift, no-op on develop. Escape hatch: `// voice-policy:V\u003cN\u003e \u003creason\u003e`.\n\n### Live before/after — real model (Cerebras `gpt-oss-120b`)\n\nDrove the real `ensureAgentVoice` end-to-end. Persona: \"Nova\", a warm plainspoken assistant.\n\n**Case 1 — raw error string**\nBefore: `Error: ECONNREFUSED 127.0.0.1:5432 — failed to connect to postgres pool after 3 retries (task-agent-message-routing)`\nAfter: *\"I got an ECONNREFUSED error when trying to reach 127.0.0.1:5432 … the Postgres pool didn't connect after 3 retries (task-agent-message-routing).\"*\n\n**Case 2 — hardcoded template**\nBefore: `You have 3 new messages and 2 pending approvals in your inbox at /app/inbox. Next reminder fires at 14:30.`\nAfter: *\"Hey, you've got 3 new messages and 2 pending approvals in /app/inbox. Your next reminder is set for 14:30.\"* — **4/4 exact values preserved**, em-dash clean.\n\nAdversarial paths, same live run:\n\n- **Case 3 — already `agentVoiced:true`:** model **not called** (verified `liveCalls` unchanged), text returned unchanged. No double-voice, no latency on the voiced path.\n- **Case 4 — rephrase outage:** input `Your payment of $250.00 to invoice INV-4471 was declined.` delivered **identical**, `agentVoiced` unset, non-empty, `reportError(scope=voice-gate)` fired.\n- **Case 5 — blank model output:** delivered original unchanged + `reportError`.\n\nTotal live model calls across all 5 cases: **2** (only the two non-voiced, non-failing cases hit the model).\n\n### Tests\n\n- `packages/core/src/services/message/voice-gate.test.ts` — 8 branch tests. **8/8 pass.**\n- `packages/scripts/__tests__/voice-policy-ratchet.test.ts` — AST classifier contract. **7/7 pass.**\n- Ratchet `--self-test` passes; a planted hardcoded literal in a touched file correctly fails the ratchet (exit 1); reverted.\n- `packages/core` typecheck clean.\n\n### Evidence checklist\n\n- Real-LLM trajectory: **✅** live Cerebras run above (literal-in → persona-voiced-out, values preserved, fail-open verified).\n- Backend logs: **✅** `[reportError] scope=voice-gate` shown on the two failure cases.\n- UI screenshots / video: **N/A** — no UI surface; runtime last-mile text transform.\n- Domain artifacts: **N/A** — no new DB rows/schema; adds one optional `Content.agentVoiced` provenance flag.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"6b:T1079,"])</script><script>self.__next_f.push([1,"## Summary\n- Registers planned G1/G2/H1/H2/I1/I2/J1/K1 LifeOps persona-pack catalogs with both `lifeops-bench` and `scenario-runner` surfaces represented.\n- Adds the `jordan_coparent` benchmark persona and exports the planned relationship expansion persona tuple separately from executable persona scenarios.\n- Updates the catalog coverage gate, authoring rules, and MVP persona research doc so G-K authoring inherits the no-therapy and #12780 never-assert-988 constraints.\n\nCloses #14753\nPart of #14747\n\n## Required Evidence Rows\n\u003c!-- evidence-row:before-screenshots --\u003e\n- N/A - catalog ledgers, Python benchmark persona metadata, and docs only; no app-rendered surface existed before this change.\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- N/A - catalog ledgers, Python benchmark persona metadata, and docs only; no app-rendered surface exists after this change.\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- N/A - no UI or native workflow changed; the executable verification path is the catalog/persona checker output below.\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- N/A - no server runtime path changed; this PR only registers planned catalog metadata and benchmark persona/docs.\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- N/A - no frontend runtime path changed; this PR only registers planned catalog metadata and benchmark persona/docs.\n\n\u003c!-- evidence-row: ry prior fix failed (proven root cause)\n\nEvery prior PR (#14067/#14184/#14224/#14293/#14411/#14539/#14996) pinned the fixed-layer reclaim to:\n\n```css\nbottom: calc(-1 * max(0px, 100lvh - 100dvh))\n```\n\nThis bets that `100lvh` (large viewport) exceeds `100dvh` (dynamic viewport) by the collapse delta. **On this device it doesn't.** The app `body` is `position: fixed`, which collapses the ICB for its `position: fixed` descendants to the LAYOUT (small) viewport. When that ICB has collapsed, the CSS length engine resolves **both** `lvh` and `dvh` against the same collapsed box, so `100lvh - 100dvh === 0` — **every reclaim is a no-op**. The CSS units can't see the true screen height from inside the collapsed fixed-body box.\n\nThat's why the strip survived 5 CSS-only fixes AND their tests: the tests only re-asserted the calc **string** was present in the source, never the measured result.\n\n## The fix: measure the real gap in JS\n\nNew `packages/ui/src/platform/standalone-bottom-reclaim.ts`:\n- Measures `trueHeight (visualViewport.height + offsetTop, or innerHeight) − layoutHeight (documentElement.clientHeight)`\n- Writes it to `--standalone-bottom-reclaim` on `:root`\n- Re-measures on `visualViewport` resize/scroll + `orientationchange` (rAF-coalesced, idempotent install, disposes on re-install / clear)\n- Standalone/native-gated; on web/desktop/Android the measured gap is **0** → true no-op, no listeners attached\n\nAll six reclaim sites now use `calc(-1 * var(--standalone-bottom-reclaim, 0px))` (shared `STANDALONE_BOTTOM_RECLAIM_OFFSET` constant): `ImageBackground`, `ShaderBackground`, `ProgrammableShaderBackground`, App `app-safe-area-floor`, and the `ContinuousChatOverlay` composer (rest state only — keyboard-lift path untouched).\n\nAlso **removes the cosmetic warm-ember bottom-floor gradient** from `ImageBackground` — it only existed to disguise the strip under the useless CSS-unit reclaim; with the measured reclaim the wallpaper's own pixels reach the true bottom (lock-screen style).\n\n## Tests pin the MEASURED gap (not a string)\n\n`standalone-bottom-reclaim.test.ts` reproduces the collapsed geometry (layout `873` / true `932`) and asserts:\n- `measureStandaloneBottomGap()` === `59`\n- === `0` on non-collapsed (web/desktop/Android) surfaces — regression guard\n- never negative when the keyboard shrinks the visual viewport\n- clamped on absurd transient (mid-rotation) deltas\n- the applied `--standalone-bottom-reclaim` var === `59px` (would be `0` under the old CSS-unit calc — the exact failing-on-device case)\n- idempotent install / no duplicate listeners\n\nUpdated `AppBackground.test.tsx` + `standalone-pwa-lockdown.test.ts` to assert the measured var (and the absence of the dead CSS-unit calc as a value + the removed cosmetic floor).\n\n## Correctness notes\n- **No regression on web/desktop/Android:** measured gap is exactly 0 → reclaim is `calc(-1 * 0px)` === 0.\n- **Bottom taps reach chat:** every reclaimed layer (`app-safe-area-floor`, wallpapers) is `pointer-events-none` at `z-[-1]`; the strip was `#root` bg paint, never a pointer capture.\n- **Did NOT touch** index.html / vite.config.ts / turbo.json / bun.lock. No new raw hex, no new backdrop-blur.\n\n## Test results\n- `standalone-bottom-reclaim.test.ts`: 11/11 ✓\n- `standalone-pwa-lockdown.test.ts` + `AppBackground.test.tsx` + `init.test.ts`: 50/50 ✓\n- `ContinuousChatOverlay.test.tsx`: 157/157 ✓\n- biome check: clean\n\nCodex review exceeded the 100s cap → self-reviewed (added idempotent-install guard + test as a result).\n\n**Do NOT self-merge — orch pixel-verifies on device first.**"])</script><script>self.__next_f.push([1,"70:T1e37,"])</script><script>self.__next_f.push([1,"# Relates to\n\nFollow-up to #14437 and the MVP visual QA/project work. Relates to compact chat / hosted-view visual verification on the MVP board.\n\nDefinition of Done: full standard in [`PR_EVIDENCE.md`](../PR_EVIDENCE.md).\n\n- [x] This PR targets `develop` and is rebased onto l
