gent; \"help\" boosted anything), and any mail containing \"newsletter\"/\"unsubscribe\" from a non-close contact was auto-labeled spam→skip. The fabricated labels were then surfaced to the model as pre-baked verdicts.\n\n**Fix.** The engine now attaches only typed structural facts the model cannot cheaply derive from text — relationship-derived `contactWeight` (via RelationshipsService), `userRepliedInThread`, `scoredAt` — and `rankScored` orders by recency with contact weight as tie-break. The `MESSAGE` actions (`triageMessages`, `listInbox`, `searchMessages`) surface raw snippets plus these signals (`receivedAtMs`, `isRead`, `contactWeight`, `userRepliedInThread`) and no `priority`/`suggestedAction` fields, so the model reading the ActionResult decides urgency and next action. `TriagePriority`/`SuggestedAction` types are deleted from `@elizaos/core`. `brief.ts` (personal assistant) no longer maps keyword-derived priority into briefing urgency — the compose model judges from the snippet.\n\n**Deleted:** `URGENCY_KEYWORDS`, `SPAM_KEYWORDS`, `findUrgencyKeywords`, `looksLikeSpam`, `scoreToPriority`, `priorityToAction`, priority bump/floor ladder, recency floors, `PRIORITY_RANK` sort, `messageUrgency` (brief.ts).\n**Kept:** contact-weight resolution (structural), store/adapter plumbing, action registration.\n\n## #14717 — reminder owner replies classified by regex tables\n\n**Root cause.** `plugins/plugin-personal-assistant/src/lifeops/service-helpers-reminder.ts` resolved reminder state from four substring-matching regex tables + title-token-overlap binding, and consulted the existing LLM classifier (`classifyReminderOwnerResponseSemantically`, which already builds a full prompt with title/adjacency/binding context) **only when the regexes matched nothing**. So `\\bskip\\b` matched \"no, don't skip it\" → skipped; `\\bdone\\b` + title overlap matched \"the dentist appointment isn't done yet, ping me tomorrow\" → completed — silent wrong state transitions, English-only.\n\n**Fix.** Composition inverted: the semantic (LLM) classifier is primary. The only deterministic path left is an exact-match fast-path (`classifyExactReminderReply`) that fires when the **entire** normalized reply is a bare resolution word or bare duration — exactly the strings the in-app reminder chat choices submit (`done` / `10 minutes` / `skip`, see `appendReminderChatChoices`) — gated on prompt adjacency + `allowStandaloneResolution`. Keyless lanes keep working through it. Without a usable model verdict the reply stays `unrelated` (reason `no_semantic_verdict`) — degraded detection is honest; a keyword guess that flips reminder state is not. A throwing injected classifier now propagates instead of being silently swallowed (the production classifier already returns `null` on model/parse failure).\n\n**Deleted:** `SNOOZE/SKIP/COMPLETE/ACKNOWLEDGE_RESPONSE_PATTERNS`, `matchesAnyPattern`, `tokenizeReminderText` + `TITLE_STOP_WORDS` + `responseReferencesReminder` (title-token binding heuristic), `isStandaloneResolutionResponse`, `isResponseBoundToReminder`, `parseReminderSnoozeRequestFromText` (text sniffer), the fabricated confidence constants (0.86/0.82/0.74/0.35…), the swallowing `catch` in the composer, and the now-producerless `semantic_error` classifier source.\n**Kept:** prompt-adjacency window, duration→preset normalization (feeds the fast-path), the semantic prompt/parse layer (unchanged), `decideReminderReviewTransition` and all downstream acknowledgement wiring (untouched per the parallel checkin lane).\n\n## Tests (fail without the fix — verified both ways)\n\n- `packages/core/src/features/messaging/triage/__tests__/triage-engine.test.ts` — 5 tests: keyword-stuffed older message no longer outranks newer neutral; a \"newsletter…unsubscribe\" promo gets **no** priority/suggestedAction/urgencyKeywords fields; recency ties break by contact weight (family 1.0 vs default); `userRepliedInThread` surfaces; MESSAGE action DTO carries raw snippet + structural signals and no fabricated labels. **Ran against the pre-fix engine: 4/5 fail** (tie-break test passes on both, as intended).\n- `plugins/plugin-personal-assistant/test/reminder-owner-response-classifier.test.ts` — 9 tests: negated/keyword-bearing sentences reach the stubbed semantic seam and its verdict wins; bare `done`/`30m`/`2 hours`/`not now` resolve deterministically without a model; fast-path refuses non-adjacent and standalone-disallowed replies; honest `no_semantic_verdict` when no model; throwing classifier propagates; **model-boundary test stubs `runtime.useModel` and asserts the real prompt carries the reply text, reminder title, and `allowStandaloneResolution`**, and that the structured verdict (incl. `snoozeMinutes` → `{minutes:45}`) parses; unparseable model output returns `null`, never a fabricated verdict. **Ran against the pre-fix classifier: 5/9 fail.**\n- `test/reminder-helpers.test.ts` updated: the chat-choice payload test now targets `classifyExactReminderReply` (same exact payloads the CHOICE block emits).\n\n```\npackages/core triage suite:            5 files, 18 tests — green\ncore advanced-capabilities:            21 files, 158 tests — green\ncore action-retrieval:                 15 tests — green\nPA reminder suites (helpers+new):      2 files, 15 tests — green\nPA brief suites (4 files):             31 passed, 5 skipped — green\nPA decomposition-integration:          6 tests — green\nplugin-inbox inbox-action:             23 tests — green (LLM triage seam untouched)\nplugin-google/signal/inbox typecheck:  green (triage-adapter consumers compile)\nbun run audit:error-policy-ratchet:    no new fallback-slop in touched files\nbiome:                                 clean on all touched files\n```\n\n**Full PA unit lane (1264 tests):** 1240 passed, 17 failed in 11 files — every failure verified **pre-existing** by re-running the same files at the pristine merge-base in an identical environment: 16 fail there byte-identically (e.g. `travel_rec ute`): forwards a captured WAV as multipart `audio` to `\u003ccloud-base\u003e/voice/stt` — the same upstream the server-side transcription model uses (`transcription.ts` `postApiV1VoiceSttRaw`). Mirrors `/api/tts/cloud` exactly: same base-URL / api-key resolution, same www/apex candidate fan-out, and the **fail-loud** contract (401 when no cloud key, 502 when the upstream is unreachable).\n- **New shared `resolveCloudSttCandidateUrls`** (next to `resolveCloudTtsCandidateUrls`).\n- **New client `transcribeCloudWav`** POSTs the recorded WAV to the proxy and returns the transcript (throws on non-2xx / empty).\n- **`resolveBackendKind`** now routes `eliza-cloud`/`openai` to a new `cloud` backend: it records the same WAV as the local path (`startLocalAsrRecorder`), POSTs it to `/api/asr/cloud`, and emits the cloud transcript as the final segment. Browser SpeechRecognition remains **only** where WAV capture is genuinely unsupported (no `getUserMedia`/`AudioContext`).\n- Cloud STT failure surfaces a distinguishable **error** state — no silent downgrade to a browser-final transcript (fail-fast doctrine).\n- Docs aligned to reality: `voice-provider-defaults.ts` layering caveat + `STT_SELECTION.md` decision table.\n\nCloses #14372\n\n## Verification\n\n\u003cdetails\u003e\u003csummary\u003eClient + factory unit tests (vitest, jsdom) — 16 pass\u003c/summary\u003e\n\n```\n$ cd packages/ui \u0026\u0026 vitest run src/voice/voice-capture-factory.test.ts src/voice/local-asr-transcribe.test.ts\n Test Files  2 passed (2)\n      Tests  16 passed (16)\n```\nCovers: `eliza-cloud` -\u003e cloud POST path (not Web Speech), `openai` -\u003e cloud, cloud-STT failure -\u003e error state (no browser downgrade), browser fallback ONLY when WAV capture unsupported, and the `transcribeCloudWav` POST payload shape (raw `audio/wav` body to `/api/asr/cloud`, trimmed transcript, fail-loud on non-2xx / empty, abort-signal forwarding).\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eAg irmed` anchor, check-in `kind` |\n| `first-run-customize-walk-seeds-first-reminder` | customize (5 questions) | full walk incl. the **conditional relationships question** (fires only because `follow-ups` is selected) → default pack seeded, anchored to the answered morning window, preferred name persisted |\n| `first-run-abandon-resume-no-data-loss` | resume | answer Q1+Q2, abandon, resume on a fresh service instance → **advances to the first unanswered question, no re-asking** → first reminder seeded, anchored to the pre-abandon answer |\n| `first-run-channel-fallback-to-in-app` | channel fallback | an unconnected channel → recorded with `fallbackToInApp: true`, warning surfaced, `(fallback)` completion message, pack still seeded |\n\nNew files: 4 `.scenario.ts` + one shared helper (`_helpers/first-run-onboarding.ts`). No first-run behavior or question wording changed.\n\n## Why / how it works\n\nFirst-run is **conductor-driven, not model-invocable** — there is no planner action the model can select to seed it; the affordance only reaches the model through `firstRunProvider`. So each scenario **splits the proof**:\n\n- **Live message turns** exercise the model with the onboarding affordance surfaced (recorded trajectory = the \"walk the user through\" evidence). The seed step restores fresh `pending` state, since `createScenarioRuntime` force-marks first-run `complete`.\n- A **custom final check owns pass/fail** by driving the real `FirstRunService` through the **production scheduled-task runner** — the same seam the in-chat conductor uses — then asserting `app_lifeops.life_scheduled_tasks` via `LifeOpsRepository`. This is the DOMAIN artifact (\"outcome, not routing\"), never chat text.\n\nThe conversational layer is deliberately **not** judged: because first-run isn't model-driven, the improvised replies vary widely run-to-run (see trajectories below), so gating on them would be flaky and would not prove the contract. The deterministic domain check is the contract.\n\nCloses #14353\n\n## Acceptance criteria\n\n- [x] 4+ scenarios covering fast-start, full customize, resume-after-abandon, and channel-fallback — **authored + verified live**.\n- [x] Final checks assert seeded `ScheduledTask` records (ids from `DEFAULT_PACK_IDEMPOTENCY_KEYS`) with anchors **derived from the answered wake time** — outcome, not routing.\n- [x] Resume scenario proves no re-asking of already-answered questions (fresh `FirstRunService` resumes at `categories`).\n- [x] No changes to question wording or first-run behavior.\n\n\u003e Note on record-ids: `FirstRunService.runDefaultsPath`/`runCustomizePath` seed the **first-run defaults pack** (`buildDefaultsPack` → `DEFAULT_PACK_IDEMPOTENCY_KEYS`, cron-anchored to the wake time), which is the code path onboarding actually exercises — asserted here. The separately-seeded `daily-rhythm` pack (boot seeder / spine registry) is disabled in the scenario runtime and is out of scope for these onboarding paths.\n\n## Evidence — real live-model run (Cerebras `gpt-oss-120b` via the openai provider), on the `develop` base\n\nAll four pass; each `custom` domain check returned `undefined` (= pass) against the real scheduled-task store.\n\n```\nPASSED | first-run-fast-start-seeds-first-reminder     | 44100ms | domain-check: PASS\nPASSED | first-run-customize-walk-seeds-first-reminder | 13404ms | domain-check: PASS\nPASSED | first-run-abandon-resume-no-data-loss         |  8202ms | domain-check: PASS\nPASSED | first-run-channel-fallback-to-in-app          | 14197ms | domain-check: PASS\n```\n\nRun command (per-scenario isolation, no LLM proxy):\n```\nbun --conditions eliza-source --tsconfig-override ../../tsconfig.json src/cli.ts \\\n  run ../../plugins/plugin-personal-assistant/test/scenarios \\\n  --scenario \u003cid\u003e --report \u003cout\u003e.json --run-dir \u003cout\u003e\n```\n\n\u003cdetails\u003e\u003csummary\u003eLive model trajectories (verbatim — why the conversational layer isn't judged)\u003c/summary\u003e\n\n```\n### fast-start\nuser[asks to be set up fast] -\u003e \"Welcome! I'll take care of the basics so you can start using me right away. I'll enable the sensible-default settings, set up any required initial configuration...\"\nuser[answers wake time]      -\u003e \"Got it--your typical wake-up time is around 6:30 am. Would you like me to set an alarm for that time or create a morning routine for you?\"\n\n### customize\nuser[chooses to customize]   -\u003e \"Sure! Here's a quick guide to customizing your setup instead of using the default options: 1. Identify What You Want to Change...\"\nuser[supplies preferences]   -\u003e \"I couldn't schedule the task because the trigger type is missing...\"   \u003c- model has no first-run action; improvises\n\n### abandon/resume\nuser[starts then pulled away]-\u003e \"I ran ENTITY and got a result, but I couldn't format the details cleanly here. On it.\"\nuser[returns to finish]      -\u003e \"Welcome back, Riley! We're all set with your name, time zone (America/Chicago), and morning hours (7 am-noon). What's next?\"\n\n### channel fallback\nuser[unconnected channel]    -\u003e \"I can't schedule that task yet; I need promptInstructions describing what the task should actually do...\"\n```\n\nThese are genuine live outputs — variable and sometimes off, precisely because onboarding is not model-driven. Pass/fail therefore rests on the domain checks, not these replies.\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eDomain-artifact assertions (what the custom checks verify against the real store)\u003c/summary\u003e\n\nThe helper drives `FirstRunService` with `getScheduledTaskRunner(...)` (production runner) and reads back via `LifeOpsRepository.listScheduledTasks(agentId, { source: \"first_run\" })`:\n\n- **fast-start** (`\"6:30am\"` -\u003e `06:30`): gm trigger is `cron` `\"30 6 * * *\"` (derived from the answered wake time); gn `\"0 22 * * *\"`; morning brief `relative_to_anchor` `anchorKey: \"wake.confirmed\"`; check-in `kind === \"checkin\"`.\n- **customize**: awaiting-question order `preferredName -\u003e timezoneAndWindows -\u003e categories -\u003e channel -\u003e relationships` (Q5 fires only with `follow-ups`); preferred name persisted; pack anchored to morning-window start `06:30`.\n- **abandon/resume**: after Q1+Q2 the record is `in_progress` with `partialAnswers.preferredName === \"Riley\"`; a fresh `FirstRunService` with no input resumes at `categories` (not `preferredName`); name survives to completion; pack anchored to `07:00`.\n- **channel fallback**: `validateChannel(\"telegram\", runtime).fallbackToInApp === true` with a fallback warning; the customize result carries a fallback warning + `(fallback)` completion message; pack still seeded.\n\u003c/details\u003e\n\n## PR_EVIDENCE\n\n| Evidence | Status |\n| --- | --- |\n| Real-LLM trajectories | done — live Cerebras run, 4/4 pass — excerpts inline above |\n| Backend structured logs | done — `[PLUGIN:SQL]` migrations, `[eliza-scenarios] passed`, `[Migration]` in run output |\n| Domain artifacts | done — seeded `ScheduledTask` rows asserted in `app_lifeops.life_scheduled_tasks` (the custom checks) |\n| Before/after screenshots + video | N/A — scenario-runner test-authoring change; no UI surface added or modified |\n| Per-platform (native/mobile/desktop) capture | N/A — no native/UI change |\n| Audio walkthrough | N/A — no voice/TTS/STT change |\n\nScoped verify: `bunx biome check` clean on all 5 changed files. (Repo-wide `scenario-runner typecheck` surfaces only pre-existing `@elizaos/shared/*` subpath resolution errors in `plugin-local-inference`, unrelated to these files.)\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-4xl\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-4 flex flex-col justify-be
