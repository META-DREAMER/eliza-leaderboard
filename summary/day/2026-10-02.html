":\"2026-10-02T19:20:39Z\",\"additions\":408,\"deletions\":12},{\"id\":\"PR_kwDOMT5cIs8AAAABGIw0xg\",\"title\":\"fix(openai): drop strict-wire omitted-optional nulls before action validation\",\"author\":\"lumix5\",\"number\":33000,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T16:51:48Z\",\"mergedAt\":\"2026-10-02T03:31:26Z\",\"additions\":402,\"deletions\":59},{\"id\":\"PR_kwDOMT5cIs8AAAABGU7Ysg\",\"title\":\"fix(cloud): support independently registered native app auth clients\",\"author\":\"lalalune\",\"number\":33087,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T17:44:02Z\",\"mergedAt\":\"2026-10-03T22:13:56Z\",\"additions\":356,\"deletions\":9},{\"id\":\"PR_kwDOMT5cIs8AAAABGGPClg\",\"title\":\"fix(testing): allow bounded scenario sandbox teardown\",\"author\":\"lalalune\",\"number\":32998,\"body\":\"$2c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T13:16:22Z\",\"mergedAt\":\"2026-10-02T03:30:58Z\",\"additions\":340,\"deletions\":119},{\"id\":\"PR_kwDOMT5cIs8AAAABGUhNrg\",\"title\":\"fix(core): tear down chat pre-handlers and response-handler evaluators on plugin unload\",\"author\":\"greatcodeeer\",\"number\":33083,\"body\":\"$2d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T16:57:41Z\",\"mergedAt\":\"2026-10-04T02:29:05Z\",\"additions\":297,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGTtoGA\",\"title\":\"fix(agent): restore an evicted conversation from its room on lookup\",\"author\":\"Prabhat1308\",\"number\":33074,\"body\":\"$2e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:30:59Z\",\"mergedAt\":\"2026-10-04T02:34:15Z\",\"additions\":279,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs8AAAABGK-2gA\",\"title\":\"fix(openai): restore provider-null omitted optionals on strict native tools\",\"author\":\"lumix5\",\"number\":33004,\"body\":\"$2f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T20:21:51Z\",\"mergedAt\":\"2026-10-02T00:50:11Z\",\"additions\":278,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGPbnIQ\",\"title\":\"fix(agent): require confirmed plugin mutation acknowledgements\",\"author\":\"lumix5\",\"number\":33033,\"body\":\"Plugin configuration saves, toggles, and disconnects could report success after an HTTP 200 containing HTML, an empty object, or an error object. These operations now require a positive boolean acknowledgement and reject contradictory negatives. Telegram account cancellation uses its actual connector/idle-state response; a connected state does not acknowledge a disconnect.\\n\\nValidation: normal frozen install passed at the preceding same-dependency commit. Actual action-handler regressions reproduced four configure failures, then four toggle/disconnect failures before the fixes. Final owning action tests passed (14 tests across two files), the actual plugin-management HTTP producer tests passed (5 tests), and root verification passed all 284 tasks plus audits with Bun 1.4.2 and Node 24.15.0. Fetch-stub action tests qualify response handling, not a live connector disconnect.\\n\\nFinal reviewed commit: `cba7a1fddb04962d5e218fdfdc3dbb4e29fe5787`.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T07:22:17Z\",\"mergedAt\":\"2026-10-02T08:19:16Z\",\"additions\":270,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABGTwAuQ\",\"title\":\"feat(ui): explain unavailable task choices instead of disabling them\",\"author\":\"lalalune\",\"number\":33075,\"body\":\"$30\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:34:39Z\",\"mergedAt\":\"2026-10-02T21:16:09Z\",\"additions\":260,\"deletions\":16},{\"id\":\"PR_kwDOMT5cIs8AAAABGQNiWQ\",\"title\":\"fix(agent): reject retired tool restrictions before boot\",\"author\":\"lalalune\",\"number\":33041,\"body\":\"Configured tool restrictions were accepted and advertised even though the runtime tool-policy implementation has been retired. Reject these settings at schema validation, disk load/save, and explicit runtime overrides before boot or environment hydration. Hide the retired controls in settings. Unrestricted full profiles and empty historical policy lists remain compatible. Existing restrictive configurations must remove these unsupported settings and use supported action authority.\\n\\nValidation: reproduced ignored restrictions against the original schema and actual disk boundaries; 19 targeted tests passed across three files, including nested connector policies, unchanged files on rejected saves, and runtime override refusal. Normal frozen installation and root verification passed (284 tasks plus repository audits).\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T09:01:22Z\",\"mergedAt\":\"2026-10-02T09:23:01Z\",\"additions\":240,\"deletions\":16},{\"id\":\"PR_kwDOMT5cIs8AAAABGT5gyA\",\"title\":\"fix(agent,app): remove stored provider API keys from the vault on agent reset\",\"author\":\"Prabhat1308\",\"number\":33079,\"body\":\"$31\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:50:09Z\",\"mergedAt\":\"2026-10-04T02:34:07Z\",\"additions\":231,\"deletions\":20},{\"id\":\"PR_kwDOMT5cIs8AAAABGTs8ZA\",\"title\":\"fix(agent): expose enumerable React exports from mobile stubs\",\"author\":\"lalalune\",\"number\":33072,\"body\":\"$32\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:29:56Z\",\"mergedAt\":\"2026-10-02T21:16:03Z\",\"additions\":227,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGPLB4A\",\"title\":\"fix(core): reject invalid wallet network in update-request builder instead of routing to mainnet\",\"author\":\"lumix5\",\"number\":33027,\"body\":\"$33\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T06:44:29Z\",\"mergedAt\":\"2026-10-02T07:37:42Z\",\"additions\":223,\"deletions\":13},{\"id\":\"PR_kwDOMT5cIs8AAAABGXSECw\",\"title\":\"Retain registered routes for unresolved tool plans\",\"author\":\"NubsCarson\",\"number\":33099,\"body\":\"A turn that requires tool work can reach planning without a usable model action hint. Seed only the route resolved from the existing registered operation contract, retaining admission checks and no-action boundaries for quoted, fenced and withdrawn requests.\\n\\nValidation: owning routing/history suites (307 tests across three selected files passed), assistant typecheck/lint and full verification on the scoped latest-develop candidate. Earlier isolated routing evidence remains local; integrated live QA is pending. This PR stays draft.\\n\\n\\nPlanner discovery now requires an equivalent operation to support all requested behavior, including delivery destination. It removes the unsupported example that treated a generic trigger as equivalent to an owner reminder; a failed call does not authorize a different effect. Eleven default/custom prompt-path tests and assistant typecheck pass. This corrects contradictory guidance; it does not claim that model judgment is universally reliable.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:15:29Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":214,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABGU9uzg\",\"title\":\"fix(documents): keep identical uploads from different users and scopes separate\",\"author\":\"Prabhat1308\",\"number\":33089,\"body\":\"$34\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T17:48:07Z\",\"mergedAt\":\"2026-10-04T02:34:42Z\",\"additions\":212,\"deletions\":18},{\"id\":\"PR_kwDOMT5cIs8AAAABGXdsbg\",\"title\":\"fix(lifeops): classify each owner reply to a delivered reminder once\",\"author\":\"fadhelcarlos\",\"number\":33107,\"body\":\"$35\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:42:47Z\",\"mergedAt\":null,\"additions\":191,\"deletions\":12},{\"id\":\"PR_kwDOMT5cIs8AAAABGQW3OQ\",\"title\":\"fix(desktop): consolidate strict renderer Host validation before dispatch\",\"author\":\"lumix5\",\"number\":33043,\"body\":\"$36\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T09:18:16Z\",\"mergedAt\":\"2026-10-02T09:55:50Z\",\"additions\":190,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABGM65kQ\",\"title\":\"feat(plugins): add @elizaos/plugin-aeterna for MEV-protected execution on Base\",\"author\":\"DIABLOX23\",\"number\":33005,\"body\":\"### Summary\\r\\nAdds `@elizaos/plugin-aeterna` (powered by `@netswap_protocol/agent-wallet`) as an official execution plugin for autonomous agents operating on Base Mainnet.\\r\\n\\r\\n### Problem\\r\\nDefault agent swap actions that broadcast directly to public mempools via raw viem/ethers are consistently targeted by searcher bots, leaking 1% to 3% in sandwich slippage and burning gas on reverted transactions.\\r\\n\\r\\n### Solution\\r\\nThe Aeterna plugin provides:\\r\\n- **0% Sandwich Slippage:** Pre-execution intent batch netting and private solver routing.\\r\\n- **Pre-execution Simulation:** Prevents wasted gas on reverted swaps.\\r\\n- **Drop-in Actions:** Adds `EXECUTE_PROTECTED_SWAP` and `REBALANCE_AGENT_PORTFOLIO` directly to Eliza character configs.\\r\\n\\r\\n### Testing \u0026 Verification\\r\\n- Clean TypeScript types \u0026 NodeNext builds.\\r\\n- Published \u0026 tested on NPM: `npm install @netswap_protocol/agent-wallet`\\r\\n- Architecture \u0026 Router: https://github.com/DIABLOX23/netswap-bot\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T00:22:33Z\",\"mergedAt\":null,\"additions\":189,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGTVEgA\",\"title\":\"fix(cloud): credit OxaPay invoices confirmed paid after the local expiry\",\"author\":\"Prabhat1308\",\"number\":33052,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T14:52:38Z\",\"mergedAt\":\"2026-10-04T02:36:15Z\",\"additions\":187,\"deletions\":13},{\"id\":\"PR_kwDOMT5cIs8AAAABGOu8UQ\",\"title\":\"fix(app): preserve private Steward credential checkpoints atomically\",\"author\":\"lalalune\",\"number\":33021,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T05:34:41Z\",\"mergedAt\":\"2026-10-02T06:11:14Z\",\"additions\":171,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGTfq3w\",\"title\":\"fix(agent): stop counting the local-inference router as a text provider in canRespond\",\"author\":\"nothingxnowhere\",\"number\":33061,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:09:05Z\",\"mergedAt\":\"2026-10-04T02:34:28Z\",\"additions\":169,\"deletions\":22},{\"id\":\"PR_kwDOMT5cIs8AAAABGTblug\",\"title\":\"fix(assistant): scope per-user preference reset and limit to the requesting user\",\"author\":\"Prabhat1308\",\"number\":33057,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:02:43Z\",\"mergedAt\":\"2026-10-04T02:34:32Z\",\"additions\":169,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGTmsuQ\",\"title\":\"fix(cloud): settle /api/v1/chat holds when the model stops on length or content filter\",\"author\":\"Prabhat1308\",\"number\":33067,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:19:57Z\",\"mergedAt\":\"2026-10-04T02:34:22Z\",\"additions\":166,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABGX2IiA\",\"title\":\"fix(orchestrator): keep GitLab subgroup paths when normalizing repositories\",\"author\":\"hermesagent270-commits\",\"number\":33108,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T23:43:53Z\",\"mergedAt\":\"2026-10-04T02:34:53Z\",\"additions\":161,\"deletions\":24},{\"id\":\"PR_kwDOMT5cIs8AAAABGVFxxw\",\"title\":\"fix(cloud): reject malformed Google disconnect bodies before bulk removal\",\"author\":\"OutstandingRetard\",\"number\":33090,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T18:02:09Z\",\"mergedAt\":\"2026-10-04T02:25:39Z\",\"additions\":152,\"deletions\":9},{\"id\":\"PR_kwDOMT5cIs8AAAABGPNhkQ\",\"title\":\"fix(agent): require explicit remote-intake acceptance for bug reports\",\"author\":\"lumix5\",\"number\":33030,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T06:50:32Z\",\"mergedAt\":\"2026-10-02T07:20:34Z\",\"additions\":152,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABGFsfzw\",\"title\":\"test(app,ui): verify report artifacts and settle async fixtures\",\"author\":\"lalalune\",\"number\":32994,\"body\":\"$3f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T12:25:49Z\",\"mergedAt\":\"2026-10-02T04:22:30Z\",\"additions\":145,\"deletions\":47},{\"id\":\"PR_kwDOMT5cIs8AAAABGTqPoA\",\"title\":\"fix(cloud): honor the health-check unhealthy threshold and keep the sweep running\",\"author\":\"Prabhat1308\",\"number\":33071,\"body\":\"$40\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:25:37Z\",\"mergedAt\":null,\"additions\":143,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs8AAAABGXZDrw\",\"title\":\"fix(workflow): register the hosted digest routes /status advertises\",\"author\":\"fadhelcarlos\",\"number\":33104,\"body\":\"$41\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:31:41Z\",\"mergedAt\":\"2026-10-03T21:59:45Z\",\"additions\":142,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGTYKeA\",\"title\":\"fix(ui): persist pinned tabs and Anthropic OAuth state through the shell channel\",\"author\":\"Prabhat1308\",\"number\":33053,\"body\":\"$42\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T14:57:13Z\",\"mergedAt\":\"2026-10-04T02:51:39Z\",\"additions\":141,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs8AAAABGOlhjw\",\"title\":\"fix(agent): reject invalid wallet network values instead of routing to mainnet\",\"author\":\"lumix5\",\"number\":33020,\"body\":\"$43\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T05:08:44Z\",\"mergedAt\":\"2026-10-02T05:48:33Z\",\"additions\":136,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGU4HZQ\",\"title\":\"fix(local-inference): verify and uninstall through the service from the agent-mounted routes\",\"author\":\"Prabhat1308\",\"number\":33085,\"body\":\"$44\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T17:38:11Z\",\"mergedAt\":\"2026-10-04T02:44:35Z\",\"additions\":135,\"deletions\":57},{\"id\":\"PR_kwDOMT5cIs8AAAABGTaStA\",\"title\":\"fix(cloud-scripts): load Cloud services through the package export in operator scripts\",\"author\":\"nothingxnowhere\",\"number\":33056,\"body\":\"$45\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:00:38Z\",\"mergedAt\":\"2026-10-04T02:34:35Z\",\"additions\":127,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs8AAAABGPTbZw\",\"title\":\"fix(wallet): reject invalid network in config-update parser instead of silent ignore\",\"author\":\"lumix5\",\"number\":33031,\"body\":\"$46\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T07:04:24Z\",\"mergedAt\":\"2026-10-02T07:34:28Z\",\"additions\":125,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABGQEexw\",\"title\":\"fix(desktop): stop serving wildcard CORS from the renderer static server\",\"author\":\"lumix5\",\"number\":33040,\"body\":\"$47\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T08:44:27Z\",\"mergedAt\":\"2026-10-02T09:06:22Z\",\"additions\":116,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs8AAAABGTKGBw\",\"title\":\"fix(cloud): reject malformed Docker-node drain bodies\",\"author\":\"hermesagent270-commits\",\"number\":33051,\"body\":\"$48\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T14:35:35Z\",\"mergedAt\":\"2026-10-04T02:29:20Z\",\"additions\":114,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABGQpwEA\",\"title\":\"fix(agent): reject retired policies in injected and restored characters\",\"author\":\"lalalune\",\"number\":33044,\"body\":\"Character JSON and restored characters could carry retired `settings.toolProfile` or `settings.tools` restrictions into the runtime even though the tool-policy service has been removed. The previous config guard covered `tools` policies but missed this historical character shape.\\n\\nReuse the same rejection rule for character settings on disk load/save, injected character overrides before mutation, character construction, and the actual restore boot path. Unrestricted `full` profiles, empty historical lists, and unrelated plugin settings remain accepted.\\n\\nValidation: four new admission regressions failed before the repair. The final owning suites passed 25 tests across two files, including disk preservation and injected-character preservation. Normal frozen installation and all 284 root verification tasks plus final audits passed before publication.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T09:53:06Z\",\"mergedAt\":\"2026-10-02T10:19:16Z\",\"additions\":113,\"deletions\":19},{\"id\":\"PR_kwDOMT5cIs8AAAABGNrljg\",\"title\":\"fix(ci): keep stability evidence ledgers parent-owned\",\"author\":\"lumix5\",\"number\":33017,\"body\":\"$49\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T02:28:08Z\",\"mergedAt\":\"2026-10-02T04:01:03Z\",\"additions\":112,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGVGwGA\",\"title\":\"fix(core): reject non-UUID ownership.ownerId when resolving the owner entity\",\"author\":\"greatcodeeer\",\"number\":33091,\"body\":\"$4a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T18:03:51Z\",\"mergedAt\":\"2026-10-04T02:25:36Z\",\"additions\":109,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABGQVDIQ\",\"title\":\"fix(desktop): reject untrusted renderer hosts before HTML and API dispatch\",\"author\":\"lalalune\",\"number\":33042,\"body\":\"$4b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T09:14:58Z\",\"mergedAt\":\"2026-10-02T09:38:55Z\",\"additions\":109,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABGP1yng\",\"title\":\"fix(cloud): bind stored agent environment envelopes to their organization\",\"author\":\"lalalune\",\"number\":33039,\"body\":\"$4c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T08:15:36Z\",\"mergedAt\":\"2026-10-02T08:39:15Z\",\"additions\":108,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs8AAAABGPCwmA\",\"title\":\"fix(cloud): consume active API key identity once during rotation\",\"author\":\"lalalune\",\"number\":33022,\"body\":\"$4d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T06:24:55Z\",\"mergedAt\":\"2026-10-02T06:50:56Z\",\"additions\":104,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGU77sA\",\"title\":\"fix(orchestrator): don't report killed ACP turns as task_complete\",\"author\":\"Prabhat1308\",\"number\":33088,\"body\":\"$4e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T17:45:02Z\",\"mergedAt\":\"2026-10-04T02:34:40Z\",\"additions\":96,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGVQaxQ\",\"title\":\"fix(core,plugins): match ```json5 fences before ```json in model-output parsers\",\"author\":\"greatcodeeer\",\"number\":33093,\"body\":\"$4f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T18:20:43Z\",\"mergedAt\":null,\"additions\":94,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABGPvCKw\",\"title\":\"fix(cloud): bind partial PII inspections to declared inputs\",\"author\":\"lalalune\",\"number\":33037,\"body\":\"A declared-candidate PII job with no candidates could mark content done, causing a later job for the same content and ruleset to skip newly declared candidates. Partial inspection markers now include a hash of the exact candidates and context. Legacy content-only partial markers cannot satisfy new requests; full-content inspection still satisfies weaker requests. Marker rows retain no raw candidate/context data.\\n\\nValidation: the actual drain regression reproduced a skipped new-candidate inspection. Eleven owning drain/executor tests passed, including identical-request resume, stronger-scope reuse, changed context and legacy-marker rejection. Normal frozen installation and committed root verification (284 tasks plus final audits) passed at `b6b2a2293877ab1454aecb739cab6fe37d875015` with unchanged source. Tests use in-memory repository doubles and do not claim hosted database acceptance.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T08:02:12Z\",\"mergedAt\":\"2026-10-02T08:27:08Z\",\"additions\":93,\"deletions\":24},{\"id\":\"PR_kwDOMT5cIs8AAAABGUhPXQ\",\"title\":\"fix(core): report mode-dispatched handlers that return success:false as failed\",\"author\":\"greatcodeeer\",\"number\":33084,\"body\":\"$50\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T16:57:44Z\",\"mergedAt\":\"2026-10-04T02:29:01Z\",\"additions\":86,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGTerMQ\",\"title\":\"fix(core): stop a host wake from re-running a one-shot task during a timer tick\",\"author\":\"Prabhat1308\",\"number\":33058,\"body\":\"$51\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T15:07:35Z\",\"mergedAt\":\"2026-10-04T02:29:17Z\",\"additions\":84,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABGGD3yA\",\"title\":\"test(ui): settle browser and async fixture contracts\",\"author\":\"lalalune\",\"number\":32997,\"body\":\"$52\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T13:00:37Z\",\"mergedAt\":\"2026-10-02T03:55:35Z\",\"additions\":78,\"deletions\":9},{\"id\":\"PR_kwDOMT5cIs8AAAABGXYBJQ\",\"title\":\"fix(personal-assistant): express an indefinite BLOCK by omission, not null\",\"author\":\"fadhelcarlos\",\"number\":33103,\"body\":\"$53\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:29:11Z\",\"mergedAt\":\"2026-10-04T02:25:30Z\",\"additions\":78,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGJ83QQ\",\"title\":\"chore(deps): bump the uv group across 2 directories with 2 updates\",\"author\":\"dependabot\",\"number\":33003,\"body\":\"$54\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-01T18:44:29Z\",\"mergedAt\":\"2026-10-02T00:48:59Z\",\"additions\":74,\"deletions\":26},{\"id\":\"PR_kwDOMT5cIs8AAAABGPIxlg\",\"title\":\"ci: add opt-in exact-source Windows workflow acceptance\",\"author\":\"lalalune\",\"number\":33025,\"body\":\"Adds a disabled-by-default Windows workflow acceptance job to Core Platform Tests. Maintainers ca
