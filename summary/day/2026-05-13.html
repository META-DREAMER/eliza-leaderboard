2dfca7e4183.js\",\"/eliza-leaderboard/_next/static/chunks/a400816e9dd4d7a4.js\",\"/eliza-leaderboard/_next/static/chunks/4f6f1c9ebd75e684.js\",\"/eliza-leaderboard/_next/static/chunks/2d734ad4b9b36e9e.js\"],\"LlmCopyButton\"]\n14:T1908,"])</script><script>self.__next_f.push([1,"## Summary\n\nWhen pairing a Qwen3.6-style body (Sliding Window Attention, hybrid SWA + full pattern) with a community DFlash drafter and `--spec-type dflash`, this fork silently disables speculative decoding because the SWA-based KV cache can't do partial sequence removal:\n\n```\ncommon_speculative_is_compat: the target context does not support partial sequence removal\nsrv    load_model: speculative decoding not supported by this context\n```\n\nThe server then runs as plain body-only inference — **no draft tokens are ever generated** — but does not surface this in the API response or in any post-load summary line. Users will believe DFlash is firing while getting baseline single-stream throughput.\n\nAffects every SWA-based body that has a community DFlash drafter today:\n\n- `Qwen/Qwen3.6-27B` + `spiritbuun/Qwen3.6-27B-DFlash-GGUF/dflash-draft-3.6-*.gguf`\n- `Qwen/Qwen3.6-35B-A3B` + `z-lab/Qwen3.6-35B-A3B-DFlash`\n- `google/gemma-4-31B-it` + `z-lab/gemma-4-31B-it-DFlash`\n- Future Eliza-1-27b once Shaw publishes the distilled drafter (the upstream `Qwen/Qwen3.6-27B` body has the same `attention.sliding_window` field, see manifest at `packages/shared/src/local-inference/catalog.ts`)\n\n## Why this matters for the eliza recommender\n\n`packages/shared/src/local-inference/catalog.ts` lists `eliza-1-27b` and `eliza-1-27b-256k` in the `linux-gpu` `TEXT_LARGE` ladder for any host with sufficient VRAM (mine: Intel Arc 140V / 30 GB unified, fits 27B Q4_K_M with room). Once the planned Qwen3.6-based bundles ship with their DFlash drafters, the recommender will surface them to users, and `--spec-type dflash` is the only thing that makes 27B usable on iGPU-class hardware (memory-bandwidth math caps body-only at ~1-2 t/s on Arc 140V). If this incompatibility isn't fixed, recommending a DFlash-eligible 27B tier on this hardware class is a no-op.\n\n## Repro\n\nThis fork at `d629a3768` (current `milady/main` HEAD), Vulkan build via the existing `linux-x64-vulkan` target (PR #7626 glslc fix applied). All artifacts public on HF.\n\n```bash\n# Body\nhuggingface-cli download unsloth/Qwen3.6-27B-GGUF Qwen3.6-27B-Q4_K_M.gguf\n# Drafter (DFlash)\nhuggingface-cli download spiritbuun/Qwen3.6-27B-DFlash-GGUF dflash-draft-3.6-q4_k_m.gguf\n# (Q8_0 drafter has the same issue — this is not a drafter-quant problem)\n\nLD_LIBRARY_PATH=~/.eliza/local-inference/bin/dflash/linux-x64-vulkan \\\n~/.eliza/local-inference/bin/dflash/linux-x64-vulkan/llama-server \\\n  -m Qwen3.6-27B-Q4_K_M.gguf \\\n  -md dflash-draft-3.6-q4_k_m.gguf \\\n  --spec-type dflash \\\n  -ngl 99 -ngld 99 \\\n  -np 1 -c 4096 -cd 256 \\\n  -fa on -b 256 -ub 64 \\\n  --jinja --reasoning-budget 0 \\\n  --host 127.0.0.1 --port 31551\n```\n\nServer log:\n\n```\nprint_info: arch                  = dflash-draft\nload_tensors: offloaded 6/6 layers to GPU\ncommon_speculative_is_compat: the target context does not support partial sequence removal\nsrv    load_model: speculative decoding not supported by this context\nsrv          init: init: chat template, thinking = 0\nmain: server is listening on http://127.0.0.1:31551\nmain: starting the main loop...\n```\n\nNote how the drafter loads correctly with the canonical `arch = dflash-draft` and 6/6 layers offloaded, but the spec-decode is then disabled — yet the server bootstraps and serves requests as if everything is fine.\n\nGeneration works, just without speculation: a chat completion returns the right text but the `timings` object has no `n_drafted` / `n_accept` (and `n_predicted_per_second` is body-only single-stream throughput).\n\n## Where the check fires\n\n`common_speculative_is_compat` in `common/speculative.cpp` (or the equivalent file in this fork). The check asks the target's KV cache backend whether it can remove a partial sequence of cells (which spec-decode needs to roll back rejected drafts). The Qwen3.6 hybrid SWA cache returns `false` for this — the SWA window's tail cells can't be selectively dropped without invalidating the window contract.\n\nThe `spiritbuun/buun-llama-cpp` fork (which the spiritbuun drafter README points at) has SWA support for the DFlash drafter landed in commit `b9d01582b` (SD-073 per their README). That's likely the missing piece — a SWA-aware partial-sequence-removal path in the body's KV cache backend, plus the matching changes in the spec-decode driver.\n\n## Suggested fixes (any subset)\n\n1. **Loud failure at load time:** if `--spec-type dflash` is passed with `-md \u003cdrafter\u003e` but the body's context returns `is_compat=false`, abort with a clear error message instead of silently falling through. Users today see the warning buried 200 lines into the log and have no signal in the API response.\n\n2. **Surface in the runtime API:** add a `spec_decode_active: bool` field to the `/health` and `/v1/models/\u003cid\u003e` responses so callers (the eliza runtime, the model picker) can show \"speculative decoding disabled — fall back\" instead of pretending DFlash is firing.\n\n3. **Port the SWA partial-sequence-removal path** from `spiritbuun/buun-llama-cpp` (commit b9d01582b or whatever lineage). This is the real fix — without it, every Qwen3.6 / gemma-4 DFlash bundle is dead on arrival in this fork.\n\n4. **Catalog gate:** in `packages/shared/src/local-inference/catalog.ts`, mark Qwen3.6 / gemma-4 tiers with `kernelCaps.unsupported: [\"spec-decode-on-swa-body\"]` until (3) lands. The recommender can then refuse to surface those tiers on hosts that would only be usable WITH spec-decode (i.e., iGPU-class).\n\n## Related\n\n- #7626 — glslc fix (required to build the Vulkan binary that reproduces this)\n- #7628 — `linux-x64-sycl` target (parallel work)\n- #7629 — Qwen3.5/3.6 drafter publication gap (this PR's premise was \"use community drafter while waiting\"; the SWA gate then blocks the community drafter too)\n- #7631 — M-RoPE position validation in spec-decode (different gate, same class of \"spec-decode silently doesn't work on modern Qwen architectures\")\n- #7633 — RFC for openvino runtime kernel\n- #7634 — linux-x64-openvino target\n\n## Note\n\nI do not have a CUDA host. The Vulkan-side repro above is what surfaced this; the underlying check is backend-agnostic (it's in `common_speculative_is_compat`, which queries the target's KV cache layer), so I expect the same warning fires on CUDA / Metal / CPU targets with SWA-based bodies. Happy to verify if a maintainer wants confirmation.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"15:T1781,"])</script><script>self.__next_f.push([1,"## Summary\n\n`Qwen2.5-14B-Instruct Q4_K_M` (~8.5 GB) runs at **1.15 t/s tg** on Intel Arc 140V iGPU via Shaw's Vulkan + W4-B kernels — only ~22% of the LPDDR5X bandwidth ceiling, vs 63-87% on the other Llama / Qwen3-family Q4_K_M models I tested with the **same Vulkan build, same drivers, same `-ngl 99 -c 2048` invocation**.\n\n**n=1 caveat upfront**: I have only tested *Qwen2.5-14B-Instruct Q4_K_M* in the 14B param class on this hardware. The cliff may be Qwen2.5-14B-specific (head-dim / GQA-factor / tile-alignment) rather than a general \"14B param-class\" issue. A second 14B (Phi-4-14B, Mistral-Nemo-12B) would tell us which. I'm filing it now because the gap is large enough to be worth investigating even at n=1, and the diagnostic ask is the same either way.\n\n## Bandwidth ceiling derivation\n\nFor a memory-bandwidth-bound decoder (the steady-state regime on integrated GPUs with Q4_K_M weights), every token needs ~one full pass of the weight bytes. So:\n\n```\nceiling_t_per_s ≈ sustained_bandwidth_GB_per_s / weights_GB\n```\n\nFor Lunar Lake on-package LPDDR5X-8533:\n- Theoretical peak: 8533 MT/s × 16 B/transfer = 136.5 GB/s\n- Sustained iGPU-effective (after refresh, CPU-shared, page traffic): **~75 GB/s** (Intel-published ~67 GB/s sustained; rounded up slightly for cool-laptop, fresh-server best case)\n\nSo the ceiling-t/s column below is `75 / weights_GB`. The measured t/s is `timings.predicted_per_second` from `/v1/chat/completions`. Efficiency is `measured / ceiling`.\n\n## Bench (cool laptop, no contention, same prompt, fresh server per row)\n\n| Model | Q4_K_M weights | 75 GB/s ceiling | Measured tg | Efficiency |\n|---|---|---|---|---|\n| Llama-3.2-3B-Instruct | 1.9 GB | 39.5 t/s | 20.0 t/s | **51%** |\n| Llama-3.1-8B-Instruct | 4.9 GB | 15.3 t/s | 5.7 t/s | **37%** |\n| Llama-3.1-8B-Instruct Q3_K_M | 3.8 GB | 19.7 t/s | 6.3 t/s | 32% |\n| **Qwen2.5-14B-Instruct** | **8.5 GB** | **8.8 t/s** | **1.15 t/s** | **13%** |\n| Qwen3.6-27B Q4_K_M (body-only, DFlash disabled) | 16 GB | 4.7 t/s | 1.15 t/s | 25% |\n\n(Earlier draft of this issue used a more optimistic 50% sustained-headroom assumption that bumped the column to a \"60-87% efficiency\" framing. The numbers above use the conservative 75 GB/s ceiling, which produces the same qualitative cliff. Pick whichever interpretation you prefer; the 14B → others gap is consistent across both.)\n\nThe cleanest cliff is **3B → 8B → 14B = 51% → 37% → 13%**. The 27B suffers from the SWA spec-decode gate too ([#7635](https://github.com/elizaOS/eliza/issues/7635)) which masks its true efficiency, so it is excluded from the cliff trend.\n\n## Repro\n\nSame `linux-x64-vulkan` build via `packages/app-core/scripts/build-llama-cpp-dflash.mjs`:\n\n```bash\nLD_LIBRARY_PATH=~/.eliza/local-inference/bin/dflash/linux-x64-vulkan \\\n~/.eliza/local-inference/bin/dflash/linux-x64-vulkan/llama-server \\\n  -m \u003cmodel\u003e.gguf \\\n  -ngl 99 -c 2048 --host 127.0.0.1 --port 31xxx\n```\n\nCapture `timings.predicted_per_second` from `/v1/chat/completions`.\n\n## Why this matters\n\nThis is the difference between \"Qwen2.5-14B is the obvious next quality step from Llama-3.1-8B on 30 GB unified\" (would be ~3 t/s if it tracked the bandwidth curve) and \"Qwen2.5-14B is actively unusable\" (1.15 t/s is below human-perceptible chat rate). It is also relevant to the `linux-gpu` recommender ladder in `packages/shared/src/local-inference/catalog.ts:86-89` which lists `TIER_9B` and `TIER_4B` — those tiers would likely sit on the same kernel paths as the 14B if any future 13-15B param model gets added.\n\n## Hypothesis (untested)\n\nQwen2.5-14B has a specific combo of params that may trigger a sub-optimal kernel selection in `ggml-vulkan`'s `ggml_vk_mul_mat` dispatch:\n- `n_head = 40` (not a power of 2)\n- `n_head_kv = 8` (GQA factor 5, unusual)\n- `n_embd = 5120`\n- Hidden size that may not align to coopmat tile boundaries (Arc 140V uses KHR_coopmat with specific tile sizes)\n\nShaw's W4-B Vulkan kernels (`turbo3`, `qjl_full`, `polarquant`) target Qwen3.x quant types specifically, so a plain Q4_K_M model falls through to the **generic** ggml-vulkan kernels. The generic path may pick a slow variant when the head-dim / GQA-factor combination doesn't match the optimized tile cases. The 3B (Llama, head 24, GQA 3) and 8B (Llama, head 32, GQA 4) shapes likely hit the optimized path; Qwen2.5-14B's shape may not.\n\n## Diagnostic asks\n\n1. Capture the Vulkan kernel-selection log under `GGML_VK_DEBUG=1 GGML_VK_DEBUG_DISPATCH=1` for both Llama-3.1-8B and Qwen2.5-14B running the same prompt. Diff the kernel names invoked. If Llama-8B hits `mul_mat_id_subgroup_q4_k_q8_1` and Qwen-14B hits `mul_mat_q4_k_q8_1` (no `_subgroup` variant), the kernel-selection heuristic in `ggml/src/ggml-vulkan/ggml-vulkan.cpp` is biased toward Llama-shaped models.\n\n2. Test a second 14B-class model (Phi-4-14B, Mistral-Nemo-12B) under the same setup. If it sits closer to the 8B efficiency, the cliff is Qwen2.5-specific. If it also drops to ~13%, it is a 14B-param-class kernel-selection issue.\n\n3. Check if `--n-cpu-moe` or moving a few layers to CPU would be faster — i.e., the Vulkan kernel is slower than AVX-VNNI for these op sizes.\n\n## Related\n\n- [#7634](https://github.com/elizaOS/eliza/pull/7634) — full bench dataset for this hardware class\n- [#7635](https://github.com/elizaOS/eliza/issues/7635) — SWA-on-27B spec-decode failure (different root cause; relevant because 27B's efficiency in the table above is also bandwidth-related)\n- [#7636](https://github.com/elizaOS/eliza/issues/7636) — Shaw-merge tracker; some Vulkan kernels may have been touched by the upstream merge\n\n## Test environment\n\n- Intel Core Ultra 7 258V (Lunar Lake), Arc 140V iGPU (Xe2, KHR_coopmat / XMX)\n- 30 GB LPDDR5X-8533 unified\n- Vulkan 1.3.295, glslc shaderc 2026.1-1+b1, ANV driver\n- Submodule HEAD: `d629a3768` (`milady/main`) + my 5 fix commits on `nubs/swa-spec-decode-probe-fallback` (none of them touch Vulkan kernels)\n- Cool laptop (73-75 °C), no concurrent processes, fresh server start per row\n"])</script><script>self.__next_f.push([1,"16:T237d,"])</script><script>self.__next_f.push([1,"## Summary\n\nAdds a Linux x64 OpenVINO build target to `packages/app-core/scripts/build-llama-cpp-dflash.mjs` and bumps the llama.cpp submodule to `elizaOS/llama.cpp#1` (which cherry-picks ggml-org/llama.cpp's OpenVINO backend).\n\nResult: a single `llama-server` / `llama-cli` binary that runs GGUF models on **the Intel CPU, the Intel iGPU/dGPU, OR the Intel NPU** with runtime device selection via `GGML_OPENVINO_DEVICE={CPU,GPU,NPU,GPU.0,GPU.1}`.\n\n## Motivation\n\nThis is the only llama.cpp path that targets the Intel NPU (Lunar Lake AI Boost ~48 TOPS, Meteor Lake NCE, Arrow Lake, Panther Lake). NPU inference draws ~2-3 W vs ~15-25 W for the iGPU on the same model — a step-change for any battery-bound use case and the canonical setup for voice agents (Whisper on NPU + LLM on iGPU concurrently).\n\nDistinct from `linux-x64-sycl` (#7628):\n- SYCL covers Intel CPU + iGPU, but **not the NPU**.\n- OpenVINO covers CPU + iGPU + NPU through one runtime.\n\nThe W4-B custom kernels (`turbo3` / `turbo4` / `turbo3_tcq` / `qjl_full` / `polarquant` / `dflash`) have no OpenVINO backend in this fork today (CUDA / Vulkan / Metal / CPU only), so this target runs plain GGML ops translated to OpenVINO compute graphs. The kernel-patches dispatch in `patchAllKernels()` correctly no-ops for `backend === \"openvino\"`.\n\n## Changes (build script)\n\n- `SUPPORTED_TARGETS` gains `\"linux-x64-openvino\"` with a comment block detailing target hardware, runtime device selection, and why kernel patches do not apply yet.\n- `cmakeFlagsForTarget` grows a `backend === \"openvino\"` branch that:\n  - sets `-DGGML_OPENVINO=ON`\n  - forwards `OpenVINO_DIR` / `INTEL_OPENVINO_DIR` from the environment as `-DOpenVINO_DIR=${INSTALLDIR}/runtime/cmake` (CMake's default `find_package(OpenVINO)` search misses the tarball-install layout)\n- `GGML_OPENVINO` joins the `offByDefault` list so non-OpenVINO targets explicitly disable it (parity with METAL / CUDA / HIP / VULKAN).\n- `targetCompatibility` returns a graceful \"no OpenVINO_DIR / INTEL_OPENVINO_DIR\" skip when the operator forgot to source `setupvars.sh`, instead of crashing inside CMake.\n- The `TODO ANCHORS` comment grows an `OPENVINO-AGENT TODO` line for future kernel work.\n\n## Changes (submodule)\n\n- `packages/inference/llama.cpp` bumps from `a61c93aaa5` (v1.2.0-eliza) to `bafc862bf` on `elizaOS/llama.cpp#nubs/openvino-backend-import`. Range adds three upstream commits (`53281e98d` + `1ebe824a0` + `bafc862bf`) cherry-picked cleanly. Companion PR: [elizaOS/llama.cpp#1](https://github.com/elizaOS/llama.cpp/pull/1).\n\n## Verification\n\nDispatch path:\n\n```\n$ node packages/app-core/scripts/build-llama-cpp-dflash.mjs --target linux-x64-openvino --jobs 1\n[dflash-build] target linux-x64-openvino is not buildable: no OpenVINO_DIR / INTEL_OPENVINO_DIR — source /opt/intel/openvino_\u003cver\u003e/setupvars.sh first\n```\n\nBuild (Linux x64 + Lunar Lake host, OpenVINO 2026.1.0 tarball under `~/.local/openvino_2026/`):\n\n```bash\nsource ~/.local/openvino_2026/setupvars.sh\nELIZA_DFLASH_CMAKE_FLAGS=\"-DOpenCL_INCLUDE_DIR=$HOME/.local/include -DOpenCL_LIBRARY=$HOME/.local/lib/libOpenCL.so\" \\\nnode packages/app-core/scripts/build-llama-cpp-dflash.mjs --target linux-x64-openvino --jobs 8\n```\n\nOutput: `libggml-openvino.so` (33 MB) + the standard llama-cli / llama-server / llama-speculative-simple / llama-mtmd-cli set in `~/.eliza/local-inference/bin/dflash/linux-x64-openvino/`.\n\nEnd-to-end test results (Llama-3.1-8B-Instruct Q4_K_M on Intel Core Ultra 7 258V / Arc 140V / 48 TOPS NPU) being captured now; will land as a follow-up comment.\n\n## Runtime requirements\n\n- OpenVINO Runtime 2026.1.x — install via:\n  - **Apt:** `apt install openvino-2026.x` from `https://apt.repos.intel.com/openvino`\n  - **Tarball:** download `openvino_toolkit_ubuntu24_2026.x.x.x_x86_64.tgz` from `https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.1/linux/`, extract under `/opt/intel/openvino_\u003cver\u003e/` or `~/.local/openvino_\u003cver\u003e/`, source `setupvars.sh`.\n- OpenCL ICD loader + Khronos OpenCL-Headers + OpenCL-CLHPP (OpenVINO's iGPU plugin links `OpenCL::OpenCL` even for CPU/NPU device builds; can't opt out at the cmake level today):\n  - **Apt:** `apt install opencl-headers ocl-icd-opencl-dev intel-opencl-icd`\n  - **Manual:** extract Khronos `OpenCL-Headers` + `OpenCL-CLHPP` releases under a prefix and pass `-DOpenCL_INCLUDE_DIR=...` / `-DOpenCL_LIBRARY=...` via `ELIZA_DFLASH_CMAKE_FLAGS`\n\n## Related\n\n- [elizaOS/llama.cpp#1](https://github.com/elizaOS/llama.cpp/pull/1) — submodule companion PR\n- #7626 — glslc absolute-path fix\n- #7628 — `linux-x64-sycl` target (parallel Intel CPU/iGPU path, no NPU)\n- #7630 — submodule bump to v1.2.0-eliza (base for this branch)\n\n## Out of scope\n\n- Real W4-B kernel ports to OpenVINO.\n- Eliza/Milady runtime wiring — `LocalRuntimeKernel` enum extension + hardware  before returning, so CMake receives an absolute path and the shader-gen step actually invokes glslc:\n\n\\`\\`\\`diff\n function findGlslc(ndk) {\n-  if (has(\"glslc\")) return \"glslc\";\n+  if (has(\"glslc\")) {\n+    // Resolve to absolute path. CMake interprets the bare string \"glslc\"\n+    // as a relative FILEPATH against the source dir, which silently breaks\n+    // vulkan-shaders-gen on Linux hosts where glslc lives at /usr/bin/glslc.\n+    try {\n+      const out = spawnSync(\"which\", [\"glslc\"], { encoding: \"utf8\" }).stdout?.trim();\n+      if (out) return out;\n+    } catch {}\n+    return \"glslc\";\n+  }\n   if (ndk) { ... }\n\\`\\`\\`\n\nAndroid NDK path is unaffected — it already returns an absolute path via \\`path.join(ndk, \"shader-tools\", host, \"glslc\")\\`. The fallback \\`return \"glslc\"\\` keeps existing behavior on hosts where \\`which\\` fails for any reason.\n\n## Verification\n\nOn Intel Core Ultra 7 258V (Lunar Lake) with Arc Graphics 140V iGPU, after the fix, \\`linux-x64-vulkan\\` build produces **2,203 SPV blobs** and a working \\`llama-server\\`. The Vulkan runtime correctly detects the GPU with KHR_coopmat / XMX matrix cores active:\n\n\\`\\`\\`\nggml_vulkan: Found 1 Vulkan devices:\nggml_vulkan: 0 = Intel(R) Graphics (LNL) (Intel open-source Mesa driver) | uma: 1 | fp16: 1 | bf16: 1 | warp size: 32 | shared memory: 49152 | int dot: 1 | matrix cores: KHR_coopmat\n\\`\\`\\`\n\n\\`llama-bench\\` on Llama-3.1-8B-Instruct Q4_K_M (all 33 layers offloaded to Vulkan):\n\n\\`\\`\\`\n| model                          |       size |     params | backend    | ngl | threads |            test |                  t/s |\n| ------------------------------ | ---------: | ---------: | ---------- | --: | ------: | --------------: | -------------------: |\n| llama 8B Q4_K - Medium         |   4.58 GiB |     8.03 B | Vulkan     |  99 |       8 |            pp64 |        172.93 ± 5.23 |\n| llama 8B Q4_K - Medium         |   4.58 GiB |     8.03 B | Vulkan     |  99 |       8 |            tg32 |          5.73 ± 3.48 |\n\\`\\`\\`\n\nvs CPU baseline on the same machine (\\`linux-x64-cpu\\` target): 1.42 t/s prompt eval, 0.60 t/s decode — so this fix unlocks ~121× prompt-eval speedup and ~9.5× decode speedup. Tool-calling end-to-end via \\`/v1/chat/completions\\` also verified working (Llama-3.1's \\`\u003c|python_tag|\u003e\\` parser path).\n\n## Test plan\n\n- [x] Rebuilt \\`linux-x64-vulkan\\` target on a host where the previous build had failed → succeeds now\n- [x] \\`Vulkan_GLSLC_EXECUTABLE\\` in CMakeCache.txt is \\`/usr/bin/glslc\\` (was \\`/llama.cpp/glslc\\`)\n- [x] 2,203 SPV files generated in \\`vulkan-shaders.spv/\\` (was 0)\n- [x] \\`llama-server\\` boots, all layers offload to GPU, KHR_coopmat active\n- [x] Functional: chat completes, tool calls parsed correctly\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR fixes a silent build failure on Linux when building the `linux-x64-vulkan` target: `findGlslc` was returning the bare string `\"glslc\"` which CMake stores as a relative `FILEPATH` resolved against the llama.cpp source directory, causing `vulkan-shaders-gen` to produce zero `.spv` files and a broken `libggml-vulkan.so`. The fix shells out to `which` to resolve the absolute path before returning it to CMake.\n\n- **`findGlslc` patched** to call `spawnSync(\"which\", [\"glslc\"])` and return the absolute path (e.g. `/usr/bin/glslc`) when found; falls back to the bare `\"glslc\"` string on systems where `which` is unavailable (Windows, minimal containers), preserving prior behavior on those hosts.\n- **NDK and null paths unaffected** — the Android NDK branch already constructs an absolute path via `path.join`, and the `return null` path is unchanged.\n\n\u003ch3\u003eConfidence Score: 4/5\u003c/h3\u003e\n\nSafe to merge — the change is narrow, targets a well-understood CMake path-re in.\n\npackages/inference/llama.cpp — the two WIP commits (42947fe7, b084d780) within the bumped range deserve scrutiny before this pin is used in a CUDA build.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/inference/llama.cpp | Submodule gitlink bumped from 9bb0884390 to a61c93aaa5 (v1.2.0-eliza); 8 upstream commits in range including the load-bearing QJL/PolarQuant flash_attn_ext fix, two new FFI entry points, and two explicitly-WIP commits (CUDA fused-attn checkpoint + omnivoice-ffi dirty refactor) that are gated behind platform-specific defines but are build-tested only on CUDA. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    A[\"v1.1.0-eliza pin\\n(9bb0884390)\"] --\u003e B[\"cb700767\\nllama-graph: dequantize\\nQJL1_256 K / Q4_POLAR V → F16\\nbefore flash_attn_ext\"]\n    B --\u003e C[\"b084d780\\nwip(omnivoice-ffi)\\npre-existing dirty refactor\"]\n    C --\u003e D[\"e32a7bf2 / 3b9ecc7b\\nserver-task: task_prefill_plan\\n+ forced-token fast-forward\"]\n    D --\u003e E[\"42947fe7\\nchore: checkpoint WIP\\nCUDA fused-attn-qjl-tbq\\n(#ifdef GGML_CUDA_FUSED_ATTN_QJL)\"]\n    E --\u003e F[\"a50cb7c4\\nffi: eliza_inference_set_verifier_callback\\n+ emit helper\"]\n    F --\u003e G[\"a61c93aa\\nffi(asr-stream): real buffered streaming\\n+ vocab-gated capability probe\"]\n    G --\u003e H[\"v1.2.0-eliza tag\\na61c93aaa5\"]\n\n    style B fill:#d4edda,stroke:#28a745\n    style E fill:#fff3cd,stroke:#ffc107\n    style C fill:#fff3cd,stroke:#ffc107\n    style H fill:#cce5ff,stroke:#004085\n```\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"chore(inference): bump packages/inferenc...\"](https://github.com/elizaos/eliza/commit/2c1c29018387909303311fd06d5766e1c8bdd66c) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=31865625)\u003c/sub\u003e\n\n\u003e Greptile also left **1 inline commen
