../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [ ] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased/merged onto the latest `origin/develop`; zero conflicts\n      (`ebc808e3a67fb941e29153d89fc896524d32fe3c`).\n- [ ] `bun run verify` passes post-sync, or the exact unrelated blocker is\n      documented in **Known gaps / failures** below.\n\n# Risks\n\nLow. The cache-key *format* changes, so provider prompt caches are invalidated\nonce per stable prefix (a one-time cache miss). No public API, schema, message\ncontent, or user-visible surface changes. Cerebras workflow affinity and the\n`eliza.prefixHash` sidecar are untouched.\n\n# Background\n\n## What does this PR do?\n\n`buildPromptCacheKey` emitted `` `v5:${prefixHash}` `` and capped the result at\n1024 characters. The canonical `prefixHash` is a 64-character SHA-256 hex digest,\nso every generated `prompt_cache_key` was 67 characters. OpenRouter's Azure\nupstream rejects `prompt_cache_key` longer than 64 characters with HTTP 400\n(`maximum 64 characters, received 67`), which prevented a model reply during\nonboarding.\n\nThe key is now a fixed-width digest of the complete prefix hash: re-hashing the\ninput keeps every input bit influential (so prefix hashes that differ only near\nthe end stay distinct) while the emitted key is exactly 64 characters. The\n`eliza.prefixHash` / `promptSegments` sidecar and the Cerebras\n`eliza-workflow-v1:\u003cdigest\u003e` affinity key are unchanged.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a c
