city in \u003ccode\u003eBytesMut::put\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/794\"\u003e#794\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eChange \u003ccode\u003eBytesMut::remaining_mut\u003c/code\u003e to use \u003ccode\u003eisize::MAX\u003c/code\u003e instead of \u003ccode\u003eusize::MAX\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/795\"\u003e#795\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eInternal changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eGuarantee address in \u003ccode\u003eslice()\u003c/code\u003e for empty slices. (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/780\"\u003e#780\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eRename \u003ccode\u003eVtable::to_*\u003c/code\u003e -\u0026gt; \u003ccode\u003eVtable::into_*\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/776\"\u003e#776\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eFix latest clippy warnings (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/787\"\u003e#787\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eIgnore \u003ccode\u003eBytesMut::freeze\u003c/code\u003e doctest on wasm (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/790\"\u003e#790\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eMove \u003ccode\u003edrop_fn\u003c/code\u003e of \u003ccode\u003efrom_owner\u003c/code\u003e into vtable (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/801\"\u003e#801\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/tokio-rs/bytes/blob/master/CHANGELOG.md\"\u003ebytes's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch1\u003e1.11.1 (February 3rd, 2026)\u003c/h1\u003e\n\u003cul\u003e\n\u003c "https://redirect.github.com/tokio-rs/bytes/issues/801\"\u003e#801\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/4b53a29eb26716592ef2f00f925ef58ccb182e61\"\u003e\u003ccode\u003e4b53a29\u003c/code\u003e\u003c/a\u003e Tweak BytesMut::remaining_mut (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/795\"\u003e#795\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/016fdbdc7a95f6764186dacfcaeef94d77e89cd1\"\u003e\u003ccode\u003e016fdbd\u003c/code\u003e\u003c/a\u003e Reserve capacity in BytesMut::put (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/794\"\u003e#794\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/ef7f25736cfe48db5b42f2aa3225cace4126d2ac\"\u003e\u003ccode\u003eef7f257\u003c/code\u003e\u003c/a\u003e Specialize BytesMut::put::\u0026lt;Bytes\u0026gt; (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/793\"\u003e#793\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/8b4f54d0f317724bfeab29232f8a9333b3d8625e\"\u003e\u003ccode\u003e8b4f54d\u003c/code\u003e\u003c/a\u003e Ignore BytesMut::freeze doctest on wasm (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/790\"\u003e#790\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/16132ad2593402aa7dbd882b0ce22a40bfacfd96\"\u003e\u003ccode\u003e16132ad\u003c/code\u003e\u003c/a\u003e Fix latest clippy warnings (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/787\"\u003e#787\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/tokio-rs/bytes/compare/v1.10.1...v1.11.1\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `quinn-proto` from 0.11.13 to 0.11.14\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/quinn-rs/quinn/releases\"\u003equinn-proto's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003equinn-proto 0.11.14\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/jxs\"\u003e\u003ccode\u003e@​jxs\u003c/code\u003e\u003c/a\u003e reported a denial of service issue in quinn-proto 5 days ago:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/security/advisories/GHSA-6xvm-j4wr-6v98\"\u003ehttps://github.com/quinn-rs/quinn/security/advisories/GHSA-6xvm-j4wr-6v98\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWe coordinated with them to release this version to patch the issue. Unfortunately the maintainers missed these issues during code review and we did not have enough fuzzing coverage -- we regret the oversight and have added an additional fuzzing target.\u003c/p\u003e\n\u003cp\u003eOrganizations that want to participate in coordinated disclosure can contact us privately to discuss terms.\u003c/p\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFix over-permissive proto dependency edge by \u003ca href=\"https://github.com/Ralith\"\u003e\u003ccode\u003e@​Ralith\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/quinn-rs/quinn/pull/2385\"\u003equinn-rs/quinn#2385\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e0.11.x: avoid unwrapping VarInt decoding during parameter parsing by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/quinn-rs/quinn/pull/2559\"\u003equinn-rs/quinn#2559\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/2c315aa7f9c2a6c1db87f8f51f40623a427c78fd\"\u003e\u003ccode\u003e2c315aa\u003c/code\u003e\u003c/a\u003e proto: bump version to 0.11.14\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/8ad47f431e7deb82c08b09c2e33ef85aa88fd212\"\u003e\u003ccode\u003e8ad47f4\u003c/code\u003e\u003c/a\u003e Use newer rustls-pki-types PEM parser API\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/c81c0289abe30d8437ccbf9b6304e2bc9c707cea\"\u003e\u003ccode\u003ec81c028\u003c/code\u003e\u003c/a\u003e ci: fix workflow syntax\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/0050172969f7e69e136c433181330da7790d8d73\"\u003e\u003ccode\u003e0050172\u003c/code\u003e\u003c/a\u003e ci: pin wasm-bindgen-cli version\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/8a6f82c58d1c565eab78f986e614223e6ed76a85\"\u003e\u003ccode\u003e8a6f82c\u003c/code\u003e\u003c/a\u003e Take semver-compatible dependency updates\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/e52db4ad8df0f9720e7b0e32ecc0e48c9a93de0f\"\u003e\u003ccode\u003ee52db4a\u003c/code\u003e\u003c/a\u003e Apply suggestions from clippy 1.91\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/6df7275c582ca9b7225e0ccf9f9871a55eb73155\"\u003e\u003ccode\u003e6df7275\u003c/code\u003e\u003c/a\u003e chore: Fix \u003ccode\u003eunnecessary_unwrap\u003c/code\u003e clippy\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/c8eefa07e087b06d8f2b78ff262ce8ac952994f1\"\u003e\u003ccode\u003ec8eefa0\u003c/code\u003e\u003c/a\u003e proto: avoid unwrapping varint decoding during parameters parsing\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/9723a977754c8662001b0fef97aab8f3ddf1df92\"\u003e\u003ccode\u003e9723a97\u003c/code\u003e\u003c/a\u003e fuzz: add fuzzing target for parsing transport parameters\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/eaf0ef30252cef4acec21f150427e604cd4271c9\"\u003e\u003ccode\u003eeaf0ef3\u003c/code\u003e\u003c/a\u003e Fix over-permissive proto dependency edge (\u003ca href=\"https://redirect.github.com/quinn-rs/quinn/issues/2385\"\u003e#2385\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/quinn-rs/quinn/compare/quinn-proto-0.11.13...quinn-proto-0.11.14\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `rustls-webpki` from 0.103.4 to 0.103.10\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/rustls/webpki/releases\"\u003erustls-webpki's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e0.103.10\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eCorrect selection of candidate CRLs by Distribution Point and Issuing Distribution Point\u003c/strong\u003e. If a certificate had more than one \u003ccode\u003edistributionPoint\u003c/code\u003e, then only the first \u003ccode\u003edistributionPoint\u003c/code\u003e would be considered against each CRL's \u003ccode\u003eIssuingDistributionPoint\u003c/code\u003e \u003ccode\u003edistributionPoint\u003c/code\u003e, and then the certificate's subsequent \u003ccode\u003edistributionPoint\u003c/code\u003es would be ignored.\u003c/p\u003e\n\u003cp\u003eThe impact was that correct provided CRLs would not be consulted to check revocation. With \u003ccode\u003eUnknownStatusPolicy::Deny\u003c/code\u003e (the default) this would lead to incorrect but safe \u003ccode\u003eError::UnknownRevocationStatus\u003c/code\u003e. With \u003ccode\u003eUnknownStatusPolicy::Allow\u003c/code\u003e this would lead to inappropriate acceptance of revoked certificates.\u003c/p\u003e\n\u003cp\u003eThis vulnerability is thought to be of limited impact. This is because both the certificate and CRL are signed -- an attacker would need to compromise a trusted issuing authority to trigger this bug.  An attacker with such capabilities could likely bypass revocation checking through other more impactful means (such as publishing a valid, empty CRL.)\u003c/p\u003e\n\u003cp\u003eMore likely, this bug would be latent in normal use, and an attacker could leverage faulty revocation checking to continue using a revoked credential.\u003c/p\u003e\n\u003cp\u003eThis vulnerability is identified by \u003ca href=\"https://github.com/rustls/webpki/security/advisories/GHSA-pwjx-qhcg-rvj4\"\u003eGHSA-pwjx-qhcg-rvj4\u003c/a\u003e. Thank you to \u003ca href=\"https://github.com/1seal\"\u003e\u003ccode\u003e@​1seal\u003c/code\u003e\u003c/a\u003e for the report.\u003c/p\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFreshen up rel-0.103 by \u003ca href=\"https://github.com/ctz\"\u003e\u003ccode\u003e@​ctz\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/455\"\u003erustls/webpki#455\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003ePrepare 0.103.10 by \u003ca href=\"https://github.com/ctz\"\u003e\u003ccode\u003e@​ctz\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/458\"\u003erustls/webpki#458\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/rustls/webpki/compare/v/0.103.9...v/0.103.10\"\u003ehttps://github.com/rustls/webpki/compare/v/0.103.9...v/0.103.10\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e0.103.9\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e[backport] ci: avoid denying warnings on nightly toolchains by \u003ca href=\"https://github.com/alex\"\u003e\u003ccode\u003e@​alex\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/437\"\u003erustls/webpki#437\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eBackport lifetime change and bump version for release by \u003ca href=\"https://github.com/alex\"\u003e\u003ccode\u003e@​alex\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/436\"\u003erustls/webpki#436\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e0.103.8\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ebackport valid_uri_names (\u003ca href=\"https://redirect.github.com/rustls/webpki/issues/404\"\u003e#404\u003c/a\u003e) to rel-0.103 by \u003ca href=\"https://github.com/alex\"\u003e\u003ccode\u003e@​alex\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/408\"\u003erustls/webpki#408\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/rustls/webpki/compare/v/0.103.7...v/0.103.8\"\u003ehttps://github.com/rustls/webpki/compare/v/0.103.7...v/0.103.8\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e0.103.7\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNew feature\u003c/strong\u003e: Add \u003ccode\u003eKeyPurposeId::to_decoded_oid()\u003c/code\u003e to help external \u003ccode\u003eExtendedKeyUsageValidator\u003c/code\u003es fill \u003ccode\u003eRequiredEkuNotFoundContext::present\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eWarn on unnameable types by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/387\"\u003erustls/webpki#387\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eExpose KeyPurposeId::to_decoded_oid() by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/385\"\u003erustls/webpki#385\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFix --cfg docsrs uses by \u003ca href=\"https://github.com/ctz\"\u003e\u003ccode\u003e@​ctz\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/390\"\u003erustls/webpki#390\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/rustls/webpki/compare/v/0.103.6...v/0.103.7\"\u003ehttps://github.com/rustls/webpki/compare/v/0.103.6...v/0.103.7\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e0.103.6\u003c/h2\u003e\n\u003cp\u003eThe extensible EKU validation released as part of 0.103.5 was actually not usable due to missing type exports, and contained a regression where empty ExtendedKeyUsage extensions would not trigger an error. Both issues are fixed in this release.\u003c/p\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eExport more types to enable ExtendedKeyUsageValidator implementations by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/381\"\u003erustls/webpki#381\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eError on empty EKU extensions by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/382\"\u003erustls/webpki#382\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/rustls/webpki/commit/348ce01c01cf8ce21199090c98853992c9c047a8\"\u003e\u003ccode\u003e348ce01\ 003e\n\nYou can trigger Dependabot actions by commenting on this PR:\n- `@dependabot rebase` will rebase this PR\n- `@dependabot recreate` will recreate this PR, overwriting any edits that have been made to it\n- `@dependabot show \u003cdependency name\u003e ignore conditions` will show all of the ignore conditions of the specified dependency\n- `@dependabot ignore \u003cdependency name\u003e major version` will close this group update PR and stop Dependabot creating any more for the specific dependency's major version (unless you unignore this specific dependency's major version or upgrade to it yourself)\n- `@dependabot ignore \u003cdependency name\u003e minor version` will close this group update PR and stop Dependabot creating any more for the specific dependency's minor version (unless you unignore this specific dependency's minor version or upgrade to it yourself)\n- `@dependabot ignore \u003cdependency name\u003e` will close this group update PR and stop Dependabot creating any more for the specific dependency (unless you unignore this specific dependency or upgrade to it yourself)\n- `@dependabot unignore \u003cdependency name\u003e` will remove all of the ignore conditions of the specified dependency\n- `@dependabot unignore \u003cdependency name\u003e \u003cignore condition\u003e` will remove the ignore condition of the specified dependency and ignore conditions\nYou can disable automated security fix PRs for this repo from the [Security Alerts page](https://github.com/elizaOS/eliza/network/alerts).\n\n\u003c/details\u003e\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis is a Dependabot-generated dependency bump PR that updates three Rust crates across two workspace directories (`packages/computeruse` and `packages/rust`), addressing two security advisories and one integer overflow bug fix.\n\n**Key changes:**\n- `bytes` 1.10.1 → 1.11.1 (in `packages/computeruse`): Fixes an integer overflow in `BytesMut::reserve`. The `Cargo.toml` minimum version constraint is correspondingly tightened from `\"1.5\"` to `\"1.11\"` to guarantee this fix is always resolved.\n- `quinn-proto` 0.11.13 → 0.11.14 (in `packages/computeruse`): Patches a Denial-of-Service vulnerability ([GHSA-6xvm-j4wr-6v98](https://github.com/quinn-rs/quinn/security/advisories/GHSA-6xvm-j4wr-6v98)) caused by an unwrap panic during malformed VarInt transport parameter parsing.\n- `rustls-webpki` 0.103.4 → 0.103.10 (in `packages/computeruse`): Patches an incorrect CRL revocation check ([GHSA-pwjx-qhcg-rvj4](https://github.com/rustls/webpki/security/advisories/GHSA-pwjx-qhcg-rvj4)) where only the first distribution point was evaluated against the CRL's Issuing Distribution Point, potentially allowing revoked certificates to be accepted when `UnknownStatusPolicy::Allow` is set.\n- `bytes` 1.11.0 → 1.11.1 (in `packages/rust`): Same integer overflow fix as above.\n\n\u003ch3\u003eConfidence Score: 5/5\u003c/h3\u003e\n\n- This PR is safe to merge — it is a routine Dependabot security/bug-fix dependency bump with no logic changes.\n- All changes are confined to Cargo lock files and a single version constraint in a Cargo.toml. The updates address two published security advisories (GHSA-6xvm-j4wr-6v98 and GHSA-pwjx-qhcg-rvj4) and one integer overflow bug in bytes. No application code was modified. The updated checksums in the lock files match the published crate versions. The Cargo.toml constraint tightening from \"1.5\" to \"1.11\" is correct and intentional — it ensures the minimum resolved version always includes the integer overflow fix.\n- No files require special attention.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/computeruse/Cargo.lock | Lock file updated with three dependency bumps: bytes 1.10.1→1.11.1 (integer overflow fix), quinn-proto 0.11.13→0.11.14 (DoS security fix GHSA-6xvm-j4wr-6v98), and rustls-webpki 0.103.4→0.103.10 (CRL revocation security fix GHSA-pwjx-qhcg-rvj4). Checksums updated correctly. |\n| packages/computeruse/crates/computeruse-cli/Cargo.toml | bytes version constraint tightened from \"1.5\" (\u003e=1.5.0, \u003c2.0.0) to \"1.11\" (\u003e=1.11.0, \u003c2.0.0) to ensure the integer overflow fix in BytesMut::reserve is always included. |\n| packages/rust/Cargo.lock | Lock file updated with bytes 1.11.0→1.11.1 bump. Checksum updated correctly. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    A[Dependabot PR #6633] --\u003e B[packages/computeruse]\n    A --\u003e C[packages/rust]\n\n    B --\u003e D[Cargo.toml\\nbytes: 1.5 → 1.11]\n    B --\u003e E[Cargo.lock\\n3 packages updated]\n\n    E --\u003e F[bytes\\n1.10.1 → 1.11.1\\nFix: integer overflow in BytesMut::reserve]\n    E --\u003e G[quinn-proto\\n0.11.13 → 0.11.14\\nSecurity: GHSA-6xvm-j4wr-6v98\\nDoS via malformed transport params]\n    E --\u003e H[rustls-webpki\\n0.103.4 → 0.103.10\\nSecurity: GHSA-pwjx-qhcg-rvj4\\nIncorrect CRL revocation checking]\n\n    C --\u003e I[Cargo.lock\\n1 package updated]\n    I --\u003e J[bytes\\n1.11.0 → 1.11.1\\nFix: integer overflow in BytesMut::reserve]\n\n    style G fill:#ff9999\n    style H fill:#ff9999\n    style F fill:#ffcc99\n    style J fill:#ffcc99\n```\n\n\u003csub\u003eLast reviewed commit: [\"chore(deps): bump th...\"](https://github.com/elizaos/eliza/commit/4e7ddad90e75f6a7ea82a73a158fdbc788777b33)\u003c/sub\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-4xl\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-4 flex flex-col justify-between sm:flex-row\",\"children\":[[\"$\",\"$L12\",null,{\"currentInterval\":\"day\",\"currentDate\":\"2026-03-20\"}],[\"$\",\"$L13\",null,{\"metrics\":{\"date\":\"2026-03-20\",\"i
