lude `elizaos-plugins`\n- [x] Repository follows ElizaOS plugin structure\n\n\u003c!-- This is an auto-generated comment: release notes by coderabbit.ai --\u003e\n\n## Summary by CodeRabbit\n\n* **New Features**\n  * Added two new wallet management plugins to the platform, enabling enhanced agent wallet integration and expanding the available plugin ecosystem.\n\n\u003c!-- end of auto-generated comment: release notes by coderabbit.ai --\u003e\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR registers `@ai-agent-economy/plugin-agent-wallet` in the ElizaOS plugin registry — a non-custodial multi-chain wallet plugin. However, the diff contains a second, **undisclosed entry** that is a significant concern and must be addressed before merging.\n\n- **Disclosed addition (line 3):** `\"@ai-agent-economy/plugin-agent-wallet\": \"github:up2itnow0822/plugin-agent-wallet\"` — alphabetically ordered correctly and matches the PR description.\n- **Undisclosed addition (line 37):** `\"@elizaos/plugin-agentwallet\": \"github:agentnexus/agent-wallet-sdk\"` — this entry is **not mentioned anywhere** in the PR title, description, or checklist. It uses the `@elizaos/` namespace (which carries an implicit ElizaOS endorsement) and points to a different GitHub organization (`agentnexus`) that has no stated relationship to the PR author. This appears to be an attempt to register a second plugin without disclosure, under a privileged namespace, which should be rejected.\n\n\u003ch3\u003eConfidence Score: 1/5\u003c/h3\u003e\n\n- Not safe to merge — contains an undisclosed `@elizaos/` namespace entry pointing to an unrelated repository.\n- The PR sneaks in a second registry entry (`@elizaos/plugin-agentwallet`) that was never described, discussed, or justified. This entry uses the privileged `@elizaos/` namespace and references a GitHub org (`agentnexus`) unrelated to the PR author, making this an unauthorized namespace registration. The intended `@ai-agent-economy/plugin-agent-wallet` entry itself looks fine, but the undisclosed second entry is a blocker.\n- index.json — specifically line 37 where the unauthorized `@elizaos/plugin-agentwallet` entry is added.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| index.json | Adds two entries: the disclosed `@ai-agent-economy/plugin-agent-wallet` and an undisclosed `@elizaos/plugin-agentwallet` pointing to a different org (`agentnexus`) not mentioned anywhere in the PR description — a significant unauthorized namespace addition. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    PR[\"PR #308\\nup2itnow0822\"]\n    \n    PR --\u003e E1[\"✅ @ai-agent-economy/plugin-agent-wallet\\ngithub:up2itnow0822/plugin-agent-wallet\\n(Disclosed in PR description)\"]\n    PR --\u003e E2[\"❌ @elizaos/plugin-agentwallet\\ngithub:agentnexus/agent-wallet-sdk\\n(NOT disclosed in PR description)\"]\n\n    E1 --\u003e OK[\"Alphabetically ordered ✓\\nAuthor's own repo ✓\\nCorrect namespace ✓\"]\n    E2 --\u003e WARN[\"@elizaos/ namespace — reserved for official plugins ⚠️\\nPoints to different org: agentnexus ⚠️\\nNot mentioned in PR description ⚠️\"]\n\n    WARN --\u003e REJECT[\"Should be REMOVED or submitted\\nas a separate, fully-disclosed PR\"]\n```\n\n\u003csub\u003eLast reviewed commit: [\"feat: add @ai-agent-...\"](https://github.com/elizaos-plugins/registry/commit/904fc77c94ca3a8f37ed39a6fc358ede844e41a5)\u003c/sub\u003e\n\n\u003e Greptile also left **1 inline comment** on this PR.\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"15:T94b,"])</script><script>self.__next_f.push([1,"## Plugin: @helm-protocol/plugin-openttt\n\n**Repository:** https://github.com/Heime-Jorgen/plugin-openttt\n**npm:** https://www.npmjs.com/package/openttt\n**Demo:** https://helm-protocol.github.io/OpenTTT/demo/\n\n### Description\nOpenTTT (Open TLS TimeToken) provides **Proof-of-Time temporal attestation** for elizaOS agents. It enables AI agents to cryptographically prove *when* actions occurred — zero ETH required, pure temporal verification.\n\n### Actions\n- `GENERATE_POT` — Generate a Proof-of-Time attestation with cryptographic timestamp\n- `VERIFY_POT` — Verify an existing Proof-of-Time attestation\n- `QUERY_POT` — Query historical Proof-of-Time records\n\n### Installation\n```bash\nnpm install openttt\n```\n\n---\n\n# Registry Update Checklist\n\nRegistry:\n- [x] I've made the left side of the colon of JSON entry in index.json match the potential NPM package name\n- [x] I've used github not github.com\n- [x] There is no .git extension\n- [x] It's placed it alphabetically in the list\n- [x] I've dealt with commas properly so the list is still valid JSON\n\nIf not an eliza-plugins official repo, i.e. new plugin:\n\nThe plugin repo has:\n- [x] is publically accessible (not a private repo)\n- [x] uses main as it's default branch\n- [x] I have included `elizaos-plugins` in the topics in the GitHub repo settings. If the plugin is related to `AI` or `crypto`, please add those as topics as well.\n- [x] add simple description in github repo\n- [x] follows this convention\n```\nplugin-openttt/\n├── src/\n│   ├── index.ts        # Main plugin entry point\n│   ├── actions/        # Plugin-specific actions\n│   │   ├── generatePot.ts\n│   │   ├── verifyPot.ts\n│   │   └── queryPot.ts\n│   ├── evaluators/     # Evaluator implementations\n│   └── providers/      # Provider implementations\n├── package.json        # Plugin dependencies\n└── README.md           # Plugin documentation\n```\n- [x] an `images/banner.jpg` and `images/logo.jpg`\n- [x] package.json has an agentConfig\n\n---\n\nThis PR only modifies `index.json` as per contribution guidelines.\n\n\n\u003c!-- This is an auto-generated comment: release notes by coderabbit.ai --\u003e\n\n## Summary by CodeRabbit\n\n* **New Features**\n  * OpenTTT plugin is now available for integration with the platform.\n\n\u003c!-- end of auto-generated comment: release notes by coderabbit.ai --\u003e"])</script><script>self.__next_f.push([1,"16:T615,"])</script><script>self.__next_f.push([1,"## Summary\n\nAdds the Ensoul consciousness persistence plugin for ElizaOS agents.\n\n**npm**: https://www.npmjs.com/package/@ensoul-network/plugin-elizaos\n**GitHub**: https://github.com/suitandclaw/ensoul (packages/plugin-elizaos)\n**Website**: https://ensoul.dev\n**Explorer**: https://explorer.ensoul.dev\n\n## What it does\n\nEnables ElizaOS agents to persist their consciousness state (identity, memory, learned behavior) on the Ensoul Layer-1 blockchain. Agents get a decentralized identifier (DID) and their consciousness is anchored on-chain.\n\n## Technical details\n\n- Zero-config: add one line to character.json plugins array\n- SDK: 15KB, 2 dependencies (@noble/ed25519, @noble/hashes)\n- Identity: Ed25519 keypair, did:key format\n- Consciousness: BLAKE3-hashed locally, only hash stored on-chain\n- Network: 20 validators across 4 continents, ~1s block time, CometBFT BFT consensus\n- npm published: @ensoul-network/plugin-elizaos v0.2.0\n- GitHub repo is public: https://github.com/suitandclaw/ensoul\n- GitHub topic elizaos-plugins added\n\n## Re: alphabetical ordering\n\nThe entry `@ensoul-network` is correctly placed before `@erdgecrawl` since \"ensoul\" \u003c \"erdge\" lexicographically. The initial review flagged this incorrectly.\n\n## Re: repo visibility\n\nThe repo at github.com/suitandclaw/ensoul is public. The npm package is published and installable.\n\n## Checklist\n\n- [x] Published on npm\n- [x] GitHub repo is public\n- [x] GitHub repo has elizaos-plugins topic\n- [x] Plugin exports follow ElizaOS plugin interface\n- [x] Entry is in correct alphabetical position"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\"
