sueScore\":0,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"CW1118\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/10785496?u=a85087eb6c9b2fad886f9f33fd120a28d79f02d6\u0026v=4\",\"totalScore\":33.89182029811062,\"prScore\":33.89182029811062,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"greatcodeeer\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/3224374?u=d56a9778976761a0b0deb565a680273c102919cf\u0026v=4\",\"totalScore\":33.76120011569356,\"prScore\":33.76120011569356,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"saltwire-dev\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/320742915?v=4\",\"totalScore\":32.75085950651685,\"prScore\":30.750859506516854,\"issueScore\":2,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"kenjohnscreates\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/144142574?u=c390be2e863f5d8704e0d596e116ddebb1629dd6\u0026v=4\",\"totalScore\":16.266299746576628,\"prScore\":16.266299746576628,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0,\"summary\":null},{\"username\":\"OutstandingRetard\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/202385977?v=4\",\"totalScore\":5,\"prScore\":0,\"issueScore\":0,\"reviewScore\":5,\"commentScore\":0,\"summary\":null}],\"focusAreas\":[{\"area\":\"cloud\",\"count\":596},{\"area\":\"agent\",\"count\":550},{\"area\":\"app\",\"count\":423},{\"area\":\"os\",\"count\":139},{\"area\":\"plugins/plugin-personal-assistant\",\"count\":123},{\"area\":\"ui\",\"count\":117},{\"area\":\"benchmarks\",\"count\":106},{\"area\":\"plugins/plugin-native-agent\",\"count\":103},{\"area\":\".github/workflows\",\"count\":72},{\"area\":\"auth\",\"count\":69}],\"topIssues\":[{\"id\":\"I_kwDOMT5cIs8AAAABTu33KQ\",\"title\":\"Investigate evaluator overhead between independent read actions\",\"author\":\"NubsCarson\",\"number\":32900,\"repository\":\"elizaos/eliza\",\"body\":\"$14\",\"createdAt\":\"2026-09-28T18:15:24Z\",\"closedAt\":\"2026-10-04T03:54:36Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABUjo_Zg\",\"title\":\"[Security] Desktop: DNS rebinding through the renderer proxy gives any website credential-free OWNER-level reads of the agent API (including plaintext stored API keys)\",\"author\":\"CopperKoi\",\"number\":33036,\"repository\":\"elizaos/eliza\",\"body\":\"$15\",\"createdAt\":\"2026-10-02T07:50:56Z\",\"closedAt\":\"2026-10-04T03:12:28Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABUjeMRw\",\"title\":\"[Security] Desktop: any website can steal the OWNER-level agent API token — renderer serves CORS `*` and embeds the token in the index HTML\",\"author\":\"CopperKoi\",\"number\":33034,\"repository\":\"elizaos/eliza\",\"body\":\"$16\",\"createdAt\":\"2026-10-02T07:32:58Z\",\"closedAt\":\"2026-10-04T03:12:26Z\",\"state\":\"CLOSED\",\"commentCount\":2},{\"id\":\"I_kwDOMT5cIs8AAAABQr414g\",\"title\":\"Nitro deployment\",\"author\":\"lalalune\",\"number\":31018,\"repository\":\"elizaos/eliza\",\"body\":\"$17\",\"createdAt\":\"2026-09-10T16:23:24Z\",\"closedAt\":\"2026-10-04T04:51:31Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUzNB7g\",\"title\":\"Steer token-address queries return unrelated wallet vaults\",\"author\":\"hermesagent270-commits\",\"number\":33208,\"repository\":\"elizaos/eliza\",\"body\":\"$18\",\"createdAt\":\"2026-10-03T15:09:58Z\",\"closedAt\":\"2026-10-04T03:11:54Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUzMNoQ\",\"title\":\"KNOWLEDGE_GRAPH set_relationship adds a duplicate edge on every restatement\",\"author\":\"hermesagent270-commits\",\"number\":33207,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`KNOWLEDGE_GRAPH set_relationship` (`plugins/plugin-relationships/src/actions/entity.ts`) calls `RelationshipStore.upsert` without a `relationshipId`, and the store creates a new id whenever one is missing. Restating a relationship (\\\"Pat is my manager\\\" twice) therefore adds a second active edge instead of updating the first, and the relationships API and viewer show duplicates.\\n\\n**Expected**\\n\\nRestating an edge updates the existing active `(from, to, type)` edge.\\n\\nFix: #33206\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T15:08:18Z\",\"closedAt\":\"2026-10-04T03:11:56Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUzAuNg\",\"title\":\"elizaOS Cloud buffered text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33204,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nelizaOS Cloud's buffered text requests (`generateNativeChatCompletion` → `/chat/completions`, and `/responses`, in `plugins/plugin-elizacloud/src/models/text.ts`) don't pass `GenerateTextParams.signal` to `requestRaw`, and the warming-503 backoff sleeps without it. A stopped turn's buffered request runs to the client timeout, plus the warming ladder, while holding the shared native-chat concurrency permit. The streaming and embeddings paths already forward the signal.\\n\\n**Expected**\\n\\nCancelling a turn aborts its buffered Cloud request and ends any warming backoff.\\n\\nFix: #33203\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:44:26Z\",\"closedAt\":\"2026-10-04T03:11:58Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUy--Mg\",\"title\":\"Anthropic text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33202,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe Anthropic text handler (`plugins/plugin-anthropic/models/text.ts`) never passes `GenerateTextParams.signal` to the AI SDK request, so stopping a chat turn does not cancel the Anthropic request. It keeps generating, and is billed, up to `maxOutputTokens`. `executeWithRetry` also treats `AbortError` as retryable, so a cancelled request would be re-sent three more times.\\n\\nOpenAI and the elizaOS Cloud stream path forward the signal.\\n\\n**Expected**\\n\\nA cancelled turn aborts the Anthropic request once and does not retry it.\\n\\nFix: #33201\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:40:51Z\",\"closedAt\":\"2026-10-04T03:12:00Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUy2pCQ\",\"title\":\"Telegram personal-account search matches the untrimmed query\",\"author\":\"hermesagent270-commits\",\"number\":33198,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe personal Telegram account's `searchConnectorMessages` (`plugins/plugin-telegram/src/account-client-service.ts`) checks `params.query.trim()` for blankness but matches the untrimmed query, so `\\\" invoice \\\"` finds only messages containing the word with spaces on both sides. The bot-side Telegram search and the Slack and Discord searches trim first.\\n\\n**Expected**\\n\\nA padded query matches the same messages as the trimmed one.\\n\\nFix: #33197\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:22:49Z\",\"closedAt\":\"2026-10-04T00:07:52Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUy09_g\",\"title\":\"X connector reports an empty inbox when the DM fetch fails\",\"author\":\"hermesagent270-commits\",\"number\":33196,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.fetchConnectorMessages` and `listRecentConnectorTargets` (`plugins/plugin-x/src/services/x.service.ts`) catch a DM fetch failure (expired token, rate limit), report it, and return `[]`. An X outage therefore reads as an empty inbox. The LifeOps X read delegate returns `handled` with no DMs instead of `unavailable`, and the MESSAGE action sees no recent DM partners. The code comment itself says the failure must not read as an empty inbox.\\n\\n**Expected**\\n\\nThe failure propagates to the callers' existing error boundaries, as it does for the Discord, Slack and Telegram connectors.\\n\\nFix: #33195\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:19:14Z\",\"closedAt\":\"2026-10-04T03:12:03Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyzUzw\",\"title\":\"Form undo reverts an older change after a field's first answer\",\"author\":\"hermesagent270-commits\",\"number\":33194,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nIn `@elizaos/plugin-form`, `FormService.updateField` records an undo entry only when the field already had a value, so a field's first answer is never in `session.history`. `undoLastChange` then reverts an older change, or does nothing.\\n\\n**Reproduction**\\n\\nA form with `name` and `email` (`allowUndo` is the default): set `name=Bob`, correct to `name=Rob`, set `email=a@b.co`, then undo. `name` goes back to `Bob` and `email` stays filled. Undo right after a single first answer returns `null`.\\n\\n**Expected**\\n\\nUndo reverts the most recent change: here it clears `email` and leaves `name` as `Rob`.\\n\\nFix: #33193\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:14:59Z\",\"closedAt\":\"2026-10-04T03:12:07Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyxDWQ\",\"title\":\"X connector attributes the account's own DMs to another user\",\"author\":\"hermesagent270-commits\",\"number\":33192,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.buildXDirectMessageMemory` (`plugins/plugin-x/src/services/x.service.ts`) compares `senderId` (an X numeric user id) with `runtime.agentId` (a UUID) to decide whether a DM is the account's own. That comparison is never true. The account's own outbound DMs are stored as memories from a synthetic `x:user:\u003cown id\u003e` entity with `fromBot: false`, so the X message connector shows the agent's own replies as if another user wrote them.\\n\\n`listRecentDirectMessages` already marks own DMs with `isInbound: false`, but the builder only copies that into `metadata.x`.\\n\\n**Expected**\\n\\nOwn DMs have `entityId === runtime.agentId` and `fromBot: true`.\\n\\nFix: #33191\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:09:56Z\",\"closedAt\":\"2026-10-04T03:12:10Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyr3kg\",\"title\":\"CONTACT follow-up confirmations use the host timezone instead of the owner's\",\"author\":\"hermesagent270-commits\",\"number\":33190,\"repository\":\"elizaos/eliza\",\"body\":\"$19\",\"createdAt\":\"2026-10-03T13:58:58Z\",\"closedAt\":\"2026-10-04T03:12:12Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyqsDQ\",\"title\":\"fix(cloud): an explicit-but-unknown Google disconnect connectionId silently revokes a different connection\",\"author\":\"OutstandingRetard\",\"number\":33189,\"repository\":\"elizaos/eliza\",\"body\":\"$1a\",\"createdAt\":\"2026-10-03T13:56:32Z\",\"closedAt\":\"2026-10-04T03:12:14Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUyc0sg\",\"title\":\"fix(scripts): install-time Bun pin guard must validate the installer runtime and describe its post-resolution failure\",\"author\":\"lumix5\",\"number\":33187,\"repository\":\"elizaos/eliza\",\"body\":\"$1b\",\"createdAt\":\"2026-10-03T13:26:15Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUxO8DA\",\"title\":\"Reminder dispatch and fallback bodies use the host timezone instead of the owner's\",\"author\":\"lumix5\",\"number\":33172,\"repository\":\"elizaos/eliza\",\"body\":\"$1c\",\"createdAt\":\"2026-10-03T10:29:35Z\",\"closedAt\":\"2026-10-04T03:12:25Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUwxa0A\",\"title\":\"Gmail replies can leave the original conversation thread\",\"author\":\"hermesagent270-commits\",\"number\":33165,\"repository\":\"elizaos/eliza\",\"body\":\"$1d\",\"createdAt\":\"2026-10-03T09:18:38Z\",\"closedAt\":\"2026-10-04T03:12:27Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUwVxWw\",\"title\":\"LIFE cadence summaries use host timezone and can delete the wrong reminder\",\"author\":\"hermesagent270-commits\",\"number\":33155,\"repository\":\"elizaos/eliza\",\"body\":\"$1e\",\"createdAt\":\"2026-10-03T08:11:04Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUvwkLw\",\"title\":\"PERSONAL_ASSISTANT sign_document approvals always fail with DOCUMENT_REQUEST_NOT_FOUND\",\"author\":\"hermesagent270-commits\",\"number\":33145,\"repository\":\"elizaos/eliza\",\"body\":\"$1f\",\"createdAt\":\"2026-10-03T06:27:06Z\",\"closedAt\":\"2026-10-04T03:12:31Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUubNlw\",\"title\":\"fix(cloud): keep failed affiliate session claims retryable\",\"author\":\"hermesagent270-commits\",\"number\":33126,\"repository\":\"elizaos/eliza\",\"body\":\"$20\",\"createdAt\":\"2026-10-03T02:27:23Z\",\"closedAt\":\"2026-10-04T03:12:33Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUuLX2Q\",\"title\":\"plugin-sql jsonb writes fail with raw PostgreSQL errors on lone UTF-16 surrogates\",\"author\":\"hermesagent270-commits\",\"number\":33125,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe plugin-sql jsonb sanitizer handles NUL but not lone UTF-16 surrogates (e.g. a truncated emoji `\\\"hi \\\\ud83d\\\"`), which PostgreSQL jsonb also rejects. Memory writes fail with a raw `invalid input syntax for type json` instead of a typed error, and a log body containing one fails the whole insert.\\n\\nReproduced on develop `811c3fac48` with the real PGlite adapter (createMemory text/metadata and log).\\n\\n## Acceptance\\n\\n- Strict writes reject lone surrogates with a typed error (as for NUL), leaving no partial row.\\n- Lenient sanitization (log bodies) replaces them with U+FFFD (as it strips NUL).\\n\\nFix: #33124\\n\",\"createdAt\":\"2026-10-03T01:45:12Z\",\"closedAt\":\"2026-10-04T03:12:35Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUuH4Qg\",\"title\":\"LIFE \\\"calendar today\\\" uses the host's midnight instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":33123,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nLIFE `query_calendar_today` builds \\\"today\\\" from the host clock's midnight plus 24 h and passes the host zone, ignoring the owner's timezone fact. On a UTC or shared server, an owner in New York asking at 21:00 gets tomorrow's events; DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48`: at `2026-10-03T01:00Z` (21:00 Oct 2 in New York), a `TZ=UTC` host queries `2026-10-03T00:00Z..2026-10-04T00:00Z` instead of `2026-10-02T04:00Z..2026-10-03T04:00Z`.\\n\\n## Acceptance\\n\\n- The calendar-today window is the owner's local day in their zone (23/25 h on DST days), independent of the host zone.\\n\\nFix: #33122\\n\",\"createdAt\":\"2026-10-03T01:35:21Z\",\"closedAt\":\"2026-10-04T03:12:37Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUuFC2g\",\"title\":\"queryEntities pagination skips and repeats entities across writes\",\"author\":\"hermesagent270-commits\",\"number\":33120,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`queryEntities` (plugin-sql `base.ts`) pages with `limit`/`offset` and no `ORDER BY`. Rows come back in physical order, which an `UPDATE` rewrites, so paging across a write skips an entity and serves another twice. plugin-form's `getRestorableSessions` pages this way and can drop a live session from restore.\\n\\nReproduced on develop `811c3fac48` on real PGlite: four entities paged with `limit: 1` across an `updateEntity` serve `e0, e2, e3, e0`.\\n\\n## Acceptance\\n\\n- Pages are totally ordered; each entity is served exactly once across a concurrent update.\\n\\nFix: #33119\\n\",\"createdAt\":\"2026-10-03T01:27:10Z\",\"closedAt\":\"2026-10-04T03:12:38Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUt--tg\",\"title\":\"Quiet-hours gate refires an hour off on DST nights\",\"author\":\"hermesagent270-commits\",\"number\":33118,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe `quiet_hours` gate defers by a wall-clock minute count (`until.offsetMinutes`), so a DST change inside the window shifts the refire: with quiet hours 22:00–07:00, a task deferred at 22:30 refires at 08:00 after spring-forward (New York, London), at 06:00 (still quiet) after fall-back, and at 07:30 in Lord Howe.\\n\\nReproduced on develop `811c3fac48` with the real gate.\\n\\n## Acceptance\\n\\n- Deferral targets the window's end instant in the owner's zone (`until.atIso`), 07:00 local on DST nights.\\n\\nFix: #33117\\n\",\"createdAt\":\"2026-10-03T01:10:32Z\",\"closedAt\":\"2026-10-04T03:12:40Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUt7WRA\",\"title\":\"GENERATE_MEDIA rejects the voice, genre, instrumental, quality, style, and negativePrompt it supports\",\"author\":\"hermesagent270-commits\",\"number\":33116,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`GENERATE_MEDIA` forwards `quality`, `style`, `negativePrompt`, `instrumental`, `genre`, and `voice` to the media service, but none is declared in the action's `parameters`. Core `validateToolArgs` rejects undeclared arguments, so a planner call can never choose a TTS voice, instrumental music or a genre, or image quality/style/negative prompt.\\n\\nReproduced on develop `811c3fac48` with the real `validateToolArgs`: `{ mediaType: \\\"audio\\\", audioKind: \\\"tts\\\", prompt, voice: \\\"nova\\\" }` → `Unexpected argument 'voice'`.\\n\\n## Acceptance\\n\\n- The six controls are declared (with the enums `buildRequest` accepts) and reach the media service from a validated planner call.\\n\\nFix: #33115\\n\",\"createdAt\":\"2026-10-03T01:00:41Z\",\"closedAt\":\"2026-10-04T03:12:42Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUtvzUQ\",\"title\":\"plugin-sql getLogs returns and deletes other agents' logs in a shared database\",\"author\":\"hermesagent270-commits\",\"number\":33113,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nIn a database shared by several agents, `getLogs` (plugin-sql `base.ts`) returns every agent's logs whenever no `roomId` is passed, because the `logs` table has no agent column and the query has no room/agent join. `deleteLogs`/`updateLogs` act on any id. Agent export therefore includes other agents' logs, and the logs-retention sweep and inference-timing pruner delete other agents' rows.\\n\\nReproduced on develop `811c3fac48` with two real `PgliteDatabaseAdapter`s on one PGlite database: `A.getLogs({ type: \\\"inference_timing\\\" })` returns B's log too.\\n\\n## Acceptance\\n\\n- `getLogs` returns only logs in the calling agent's rooms (as `getAgentRunSummaries` already does).\\n- `deleteLogs`/`updateLogs` cannot touch another agent's rows.\\n- Export pagination is stable.\\n\\nFix: #33112\\n\",\"createdAt\":\"2026-10-03T00:30:58Z\",\"closedAt\":\"2026-10-04T03:12:44Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUtq-2w\",\"title\":\"Google Fit health summaries use UTC days instead of the owner's local day\",\"author\":\"hermesagent270-commits\",\"number\":33111,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe health bridge documents day keys as calendar days in `HealthBridgeConfig.timeZone` (#31248/#31264), but the Google Fit backend aggregates `${date}T00:00Z` + 24 h, enumerates sleep days in UTC, and `getHealthDailySummary(date)` passes no zone. Every owner outside UTC gets Google Fit steps, sleep, heart rate, and calories for the wrong window every day, and DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48` (real `getDailySummary`, `fetch` stubbed): Asia/Kolkata 2026-10-02 is aggregated 05:30–05:30 IST; America/New_York 2026-03-08 is aggregated 3/7 19:00 EST – 3/8 20:00 EDT.\\n\\n## Acceptance\\n\\n- Google Fit day windows are local midnight to local midnight in the owner's zone (23/25 h on DST days).\\n- Sleep series use the owner's local days.\\n- The daily-summary path receives the owner's zone, like the trend path.\\n\\nFix: #33110\\n\",\"createdAt\":\"2026-10-03T00:19:03Z\",\"closedAt\":\"2026-10-04T03:12:45Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUtcGkg\",\"title\":\"Orchestrator rewrites GitLab subgroup repository URLs to the parent group\",\"author\":\"hermesagent270-commits\",\"number\":33109,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`normalizeRepositoryInput` in `plugins/plugin-agent-orchestrator/src/services/repo-input.ts` keeps only two path segments, so `https://gitlab.com/group/subgroup/project` becomes `https://gitlab.com/group/subgroup.git`, which can never be a repository (GitLab namespaces cannot hold a project and a subgroup with the same path). The TASKS action's text extractor also captures only two segments. Every coding task for a GitLab subgroup project therefore fails to clone.\\n\\nReproduced on develop `811c3fac48`: `https://gitlab.com/gitlab-org/charts/gitlab` normalizes to `https://gitlab.com/gitlab-org/charts.git`, and `git ls-remote` on that URL fails, while `…/charts/gitlab.git` lists branches.\\n\\n## Acceptance\\n\\n- GitLab URLs keep the full namespace path up to the `/-/` page separator (and legacy page routes).\\n- GitHub and Bitbucket keep `owner/repo`; existing forms normalize as before.\\n- Output still passes `assertSafeGitRemote`.\\n\\nFix: #33108\\n\",\"createdAt\":\"2026-10-02T23:44:09Z\",\"closedAt\":\"2026-10-04T03:12:47Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUogUog\",\"title\":\"fix(cloud): reject malformed Google disconnect bodies before bulk removal\",\"author\":\"hermesagent270-commits\",\"number\":33073,\"repository\":\"elizaos/eliza\",\"body\":\"$21\",\"createdAt\":\"2026-10-02T15:30:21Z\",\"closedAt\":\"2026-10-04T03:12:49Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUocKRQ\",\"title\":\"fix(cloud): reject malformed JSON before optional-body mutations\",\"author\":\"hermesagent270-commits\",\"number\":33070,\"repository\":\"elizaos/eliza\",\"body\":\"$22\",\"createdAt\":\"2026-10-02T15:24:46Z\",\"closedAt\":\"2026-10-04T03:12:51Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoWsMQ\",\"title\":\"crypto refunds: a malformed or reused refund key is reported as CRYPTO_REFUND_INVALID_AMOUNT\",\"author\":\"nothingxnowhere\",\"number\":33065,\"repository\":\"elizaos/eliza\",\"body\":\"$23\",\"createdAt\":\"2026-10-02T15:17:29Z\",\"closedAt\":\"2026-10-04T03:12:52Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoQdlA\",\"title\":\"LOGS delete and RUNTIME reload_config report success on unacknowledged responses\",\"author\":\"hermesagent270-commits\",\"number\":33062,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nTwo agent actions report success on a 2xx response that does not carry the route's acknowledgement (the defect 6beb04b5c1 fixed for PLUGIN configure):\\n\\n- LOGS `delete` (`packages/agent/src/actions/logs.ts`): `resp.json().catch(() =\u003e ({}))` and a defaulted `cleared` make a proxy page, `{}`, or `{\\\"cleared\\\":\\\"lots\\\"}` report \\\"Cleared 0 log entries.\\\" with `success: true`.\\n- RUNTIME `reload_config` (`packages/agent/src/actions/runtime.ts`): `{}` or `{\\\"reloaded\\\":false}` reports \\\"No hot-reloadable fields changed.\\\" with `success: true`.\\n\\nReproduced on develop `27dec7b0c3` with the real handlers and a stubbed fetch.\\n\\n## Acceptance\\n\\n- Each op fails with its `*_FAILED` code unless the body matches its route: `{ cleared: \u003cnon-negative integer\u003e }` and `{ reloaded: true, applied: string[], requiresRestart: string[] }`.\\n- Genuine acknowledgements behave as before.\\n\\nFix: #33060\\n\",\"createdAt\":\"2026-10-02T15:09:36Z\",\"closedAt\":\"2026-10-04T03:12:54Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoPLRQ\",\"title\":\"agent status: canRespond is true on a runtime whose only text handler is the local-inference router\",\"author\":\"nothingxnowhere\",\"number\":33059,\"repository\":\"elizaos/eliza\",\"body\":\"$24\",\"createdAt\":\"2026-10-02T15:07:58Z\",\"closedAt\":\"2026-10-04T03:12:56Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUoIk5w\",\"title\":\"cloud operator scripts: refund, promote-admin and set-billing-email cannot start (unresolvable @/ imports)\",\"author\":\"nothingxnowhere\",\"number\":33054,\"repository\":\"elizaos/eliza\",\"body\":\"$25\",\"createdAt\":\"2026-10-02T14:59:17Z\",\"closedAt\":\"2026-10-04T03:12:59Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUnqlJw\",\"title\":\"fix(cloud): reject malformed Docker-node drain bodies before mutation\",\"author\":\"hermesagent270-commits\",\"number\":33050,\"repository\":\"elizaos/eliza\",\"body\":\"$26\",\"createdAt\":\"2026-10-02T14:19:59Z\",\"closedAt\":\"2026-10-04T03:13:01Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUnkNmA\",\"title\":\"Log redaction clones print a Symbol.toPrimitive line on every object under Bun\",\"author\":\"hermesagent270-commits\",\"number\":33049,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nSince #32957, every plain and Map/Set clone produced by `packages/core/src/security/log-redaction.ts` carries an own non-enumerable `Symbol.toPrimitive`. Bun's console prints non-enumerable symbol keys, so under Bun every object passed as a trailing log argument shows `[Symbol(Symbol.toPrimitive)]: [Function: value]` once per nesting level:\\n\\n```\\n Info       probe-console-symbol {\\n  [Symbol(Symbol.toPrimitive)]: [Function: value],\\n  owner: {\\n    [Symbol(Symbol.toPrimitive)]: [Function: value],\\n    id: \\\"u1\\\",\\n  },\\n```\\n\\nReproduced on develop `27dec7b0c3` with `logger.info(\\\"probe-console-symbol\\\", { owner: { id: \\\"u1\\\" } })` under Bun 1.4.2; Node 24 prints the same clone without it.\\n\\n## Acceptance\\n\\n- Clones without a shadowing `toString` own no symbol keys and print cleanly under Bun.\\n- #32957's coercion protection still holds for clones that own a non-callable `toString` (and for Error clones).\\n\\nFix: #33048\\n\",\"createdAt\":\"2026-10-02T14:11:25Z\",\"closedAt\":\"2026-10-04T03:12:24Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUlGbSg\",\"title\":\"Log redaction marks shared (non-cyclic) references as [Circular]\",\"author\":\"hermesagent270-commits\",\"number\":33046,\"repository\":\"elizaos/eliza\",\"body\":\"$27\",\"createdAt\":\"2026-10-02T10:18:38Z\",\"closedAt\":\"2026-10-04T03:13:02Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU-xG9A\",\"title\":\"plugin-blocker: website block misses the www host for co.uk-style domains and for www-named requests (site stays reachable)\",\"author\":\"saltwire-dev\",\"number\":33544,\"repository\":\"elizaos/eliza\",\"body\":\"$28\",\"createdAt\":\"2026-10-04T20:23:07Z\",\"closedAt\":\"2026-10-05T13:46:15Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8rR-Q\",\"title\":\"All-day ICS events from feeds east of UTC show a day early\",\"author\":\"hermesagent270-commits\",\"number\":33500,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nAll-day events from ICS feeds in time zones east of UTC show a day early in the calendar. The ICS parser stores `DTSTART;VALUE=DATE` at local midnight in the feed's zone (Berlin 2026-03-08 → `2026-03-07T23:00Z`). The calendar views place all-day events by the date part of `startAt`, the UTC-midnight encoding Google all-day events use.\\n\\n**Expected**\\n\\nAn all-day ICS event appears on its own date in every time zone.\\n\\nFix: #33499\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:42:20Z\",\"closedAt\":\"2026-10-04T18:58:53Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8mHBQ\",\"title\":\"Agent export duplicates logs written while the export runs\",\"author\":\"hermesagent270-commits\",\"number\":33498,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nAgent export with `includeLogs` reads logs in newest-first offset pages of 500. Logs the running agent writes during the export shift later pages, so a row is exported twice and the bundle doesn't match the table at any instant. After import, the restored agent has a duplicate log. In a real two-runtime reproduction, 600 logs plus one write during the export restore as 601.\\n\\n**Expected**\\n\\nThe export carries one consistent log snapshot, as the log retention sweep already reads its inventory in one query.\\n\\nFix: #33497\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:31:25Z\",\"closedAt\":\"2026-10-04T18:58:49Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8dSSA\",\"title\":\"FOLLOW_UPS labels same-day follow-ups as tomorrow\",\"author\":\"hermesagent270-commits\",\"number\":33496,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`FOLLOW_UPS` labels upcoming follow-ups with `Math.ceil` of elapsed days, so \\\"(today)\\\" is effectively never shown. A follow-up later the same day reads \\\"(tomorrow)\\\", and one two calendar days away can read \\\"(in 3 days)\\\". The planner is told a same-day follow-up is tomorrow.\\n\\n**Expected**\\n\\nLabels count calendar days in the owner's zone.\\n\\nFix: #33495\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:11:58Z\",\"closedAt\":\"2026-10-04T18:58:46Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8Ys6w\",\"title\":\"Moving a one-time goal after its check-in fired never schedules a new check-in\",\"author\":\"hermesagent270-commits\",\"number\":33494,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nA goal with a one-time (`once`) cadence gets a single check-in at `dueAt`. After that check-in has fired, moving the goal to a new date (`update_goal` or `PUT /api/lifeops/goals/:id`) edits the finished task in place, because once check-ins share the fixed key `goals:checkin:\u003cgoalId\u003e:once`. A finished once task never fires again, so no check-in arrives for the new date, while the sync logs it as edited.\\n\\n**Expected**\\n\\nMoving a once goal schedules a check-in at the new date.\\n\\nFix: #33493\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T15:02:47Z\",\"closedAt\":\"2026-10-04T18:58:43Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8R-MQ\",\"title\":\"GITHUB_PR list by repo and author only checks the newest 100 PRs\",\"author\":\"hermesagent270-commits\",\"number\":33492,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`GITHUB_PR` `op: \\\"list\\\"` with both `repo` and `author` fetches one REST page of 100 PRs and filters it by author client-side. In a repo with more than 100 PRs in that state, an author whose PRs are older than the newest 100 gets \\\"Found 0 pull request(s)\\\" as a successful result. The unscoped list already filters by author server-side through search.\\n\\n**Expected**\\n\\nEvery PR by that author in the repo and state is found.\\n\\nFix: #33491\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T14:50:51Z\",\"closedAt\":\"2026-10-04T18:58:39Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU8D9Vg\",\"title\":\"REPLY_CONTEXT repeats the room transcript when replying to an older message\",\"author\":\"hermesagent270-commits\",\"number\":33489,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nWhen an incoming message replies to an older message, `REPLY_CONTEXT` dedupes its surrounding window against only the newest `getConversationLength()` rows (default 100). `RECENT_MESSAGES` renders every retained room row. In a room longer than the conversation length, a reply to an older message re-renders every older row under \\\"Surrounding messages … older than the recent transcript above\\\", repeating up to the whole transcript in the prompt and mislabelling it.\\n\\n**Expected**\\n\\nREPLY_CONTEXT dedupes against the same complete window RECENT_MESSAGES renders, adding only the replied-to line.\\n\\nFix: #33488\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T14:20:25Z\",\"closedAt\":\"2026-10-04T18:58:36Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU7-a9w\",\"title\":\"BROWSER reports success when closing a tab id that is not open (web mode)\",\"author\":\"hermesagent270-commits\",\"number\":33486,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nIn web mode, the browser workspace's `close` and `tab close` commands return `{ closed: false }` for a tab id that isn't open, and the BROWSER action reports that as success. The agent then tells the user a tab was closed when nothing happened, for example with a tab id left over from before a restart. Desktop mode, the other web subactions and the HTTP tab route all report `tab_not_found` for an unknown id.\\n\\n**Expected**\\n\\nClosing an unknown tab id fails with `tab_not_found`.\\n\\nFix: #33485\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-04T14:07:45Z\",\"closedAt\":\"2026-10-04T18:58:32Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU5W9XA\",\"title\":\"personal-assistant ENTITY set_relationship adds a duplicate edge each time a relationship is restated\",\"author\":\"hermesagent270-commits\",\"number\":33352,\"repository\":\"elizaos/eliza\",\"body\":\"`plugins/plugin-personal-assistant/src/actions/entity.ts` `set_relationship` calls `relationshipStore.upsert` without a `relationshipId`, and the store keys upserts by `relationshipId`, so restating the same `(from, to, type)` creates another active edge each time.\\n\\nRepro (real PGlite, `relationships.integration.test.ts`): run `ENTITY set_relationship { toEntityId, relationshipType: \\\"manages\\\" }` twice → `relationshipStore.list({ toEntityId, type: \\\"manages\\\" })` returns 2 edges.\\n\\n#33206 fixed the same defect in plugin-relationships with a separate `list` + `upsert`, which still races under concurrent restatements.\\n\\nFix PR: #33336\",\"createdAt\":\"2026-10-04T07:42:30Z\",\"closedAt\":\"2026-10-04T08:22:08Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABU3_MxA\",\"title\":\"fix(auth): a corrupted saved pending sign-in reports 502 \\\"Cloud service unavailable\\\" instead of the designed account-recovery state\",\"author\":\"lumix5\",\"number\":33282,\"repository\":\"elizaos/eliza\",\"body\":\"$29\",\"createdAt\":\"2026-10-04T03:22:19Z\",\"closedAt\":\"2026-10-04T08:01:57Z\",\"state\":\"CLOSED\",\"commentCount\":1}],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs8AAAABGiUiEw\",\"title\":\"Promote reviewed runtime integration to staging\",\"author\":\"lalalune\",\"number\":33420,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T10:20:27Z\",\"mergedAt\":\"2026-10-04T10:33:44Z\",\"additions\":274920,\"deletions\":297170},{\"id\":\"PR_kwDOMT5cIs8AAAABGhq-CA\",\"title\":\"fix: integrate core app UI and testing ownership refactors\",\"author\":\"lalalune\",\"number\":33377,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T08:19:05Z\",\"mergedAt\":\"2026-10-04T10:17:58Z\",\"additions\":140658,\"deletions\":159823},{\"id\":\"PR_kwDOMT5cIs8AAAABGgogWg\",\"title\":\"Promote current runtime and device clients to staging\",\"author\":\"lalalune\",\"number\":33299,\"body\":\"$2c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:16:28Z\",\"mergedAt\":\"2026-10-04T04:21:18Z\",\"additions\":77901,\"deletions\":1148},{\"id\":\"PR_kwDOMT5cIs8AAAABGhoBcg\",\"title\":\"refactor(core)!: separate kernel, host and domain ownership\",\"author\":\"lalalune\",\"number\":33368,\"body\":\"$2d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T08:10:08Z\",\"mergedAt\":\"2026-10-04T10:18:01Z\",\"additions\":71878,\"deletions\":76765},{\"id\":\"PR_kwDOMT5cIs8AAAABGf8Eqw\",\"title\":\"feat(os): share native OTA trust engine with compiled host policy\",\"author\":\"lalalune\",\"number\":33251,\"body\":\"$2e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:35:26Z\",\"mergedAt\":\"2026-10-04T02:36:10Z\",\"additions\":48936,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGhwYsg\",\"title\":\"Consolidate testing fixtures and integrate leased API scenario worlds\",\"author\":\"lalalune\",\"number\":33386,\"body\":\"$2f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T08:36:47Z\",\"mergedAt\":\"2026-10-04T10:18:01Z\",\"additions\":44894,\"deletions\":53363},{\"id\":\"PR_kwDOMT5cIs8AAAABGhTb5g\",\"title\":\"Integrate reviewed agent, auth, benchmark, billing and native changes\",\"author\":\"lalalune\",\"number\":33333,\"body\":\"$30\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:01:11Z\",\"mergedAt\":\"2026-10-04T07:19:35Z\",\"additions\":38948,\"deletions\":39103},{\"id\":\"PR_kwDOMT5cIs8AAAABGgDbfA\",\"title\":\"Promote reviewed shared Android platform and current runtime to sta "mergedAt\":\"2026-10-04T07:35:50Z\",\"additions\":15468,\"deletions\":17188},{\"id\":\"PR_kwDOMT5cIs8AAAABGhbsnQ\",\"title\":\"Integrate Cloud ownership and reviewed cancellation confirmation\",\"author\":\"lalalune\",\"number\":33345,\"body\":\"$34\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:29:14Z\",\"mergedAt\":\"2026-10-04T07:34:29Z\",\"additions\":15365,\"deletions\":17151},{\"id\":\"PR_kwDOMT5cIs8AAAABGhaKUA\",\"title\":\"refactor(cloud): consolidate contracts, runtime ownership, and test tooling\",\"author\":\"lalalune\",\"number\":33341,\"body\":\"$35\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:23:22Z\",\"mergedAt\":\"2026-10-04T07:34:31Z\",\"additions\":14145,\"deletions\":16975},{\"id\":\"PR_kwDOMT5cIs8AAAABGguD1Q\",\"title\":\"refactor(agent): consolidate domain ownership and preserve failure receipts\",\"author\":\"lalalune\",\"number\":33310,\"body\":\"$36\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:39:35Z\",\"mergedAt\":\"2026-10-04T07:19:37Z\",\"additions\":14097,\"deletions\":12327},{\"id\":\"PR_kwDOMT5cIs8AAAABGguS9g\",\"title\":\"refactor(training): consolidate pipelines and retire broken experiments\",\"author\":\"lalalune\",\"number\":33311,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:40:28Z\",\"mergedAt\":\"2026-10-04T07:01:09Z\",\"additions\":10551,\"deletions\":22568},{\"id\":\"PR_kwDOMT5cIs8AAAABGlQxsQ\",\"title\":\"Promote reviewed runtime and workflow fixes to staging\",\"author\":\"lalalune\",\"number\":33507,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T18:40:40Z\",\"mergedAt\":\"2026-10-04T18:52:21Z\",\"additions\":6871,\"deletions\":1021},{\"id\":\"PR_kwDOMT5cIs8AAAABGgvnKA\",\"title\":\"refactor(auth): consolidate services, delivery, and package ownership\",\"author\":\"lalalune\",\"number\":33313,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:45:36Z\",\"mergedAt\":\"2026-10-04T07:19:37Z\",\"additions\":6681,\"deletions\":8797},{\"id\":\"PR_kwDOMT5cIs8AAAABGgqEZg\",\"title\":\"Add crypto terminal: live markets, paper trading, price alerts, token safety\",\"author\":\"jlhawkins541\",\"number\":33303,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:22:50Z\",\"mergedAt\":null,\"additions\":6511,\"deletions\":35},{\"id\":\"PR_kwDOMT5cIs8AAAABGf4Rlw\",\"title\":\"feat(agent): share native gateway and runtime host mechanisms\",\"author\":\"lalalune\",\"number\":33250,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:21:37Z\",\"mergedAt\":\"2026-10-04T02:44:52Z\",\"additions\":5975,\"deletions\":26},{\"id\":\"PR_kwDOMT5cIs8AAAABGl1j2Q\",\"title\":\"Promote reviewed runtime, billing and benchmark repairs to staging\",\"author\":\"lalalune\",\"number\":33541,\"body\":\"Promote the reviewed develop batch through d77085d53c85 to staging. This includes agent cleanup with restored persisted-schedule migration, OTA preparation and source tooling, original invoice attribution, benchmark evidence/scoring cleanup with sparse-label and Python 3.11 fixes, shared domain similarity and hosted WebView tooling, and workflow fixture repairs.\\n\\nThe merge is conflict-free and its tree is identical to the reviewed develop head. Targeted runtime/storage, PostgreSQL, browser and native-host contracts passed across the reviewed PRs; the shared hosted-fixture run passed 90 tests. Consolidated repository verification is running on candidate 299951609cfe40bca29fcc47bea1d61745685962. Four benchmark campaign tests are being rechecked after installing the declared CI dependencies; no current full-green claim is made. No AOSP boot, live provider, production OTA or physical-device qualification is implied.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:17:04Z\",\"mergedAt\":\"2026-10-04T20:17:32Z\",\"additions\":5729,\"deletions\":5444},{\"id\":\"PR_kwDOMT5cIs8AAAABGgmbsA\",\"title\":\"Upstream host-configured Maps, Files and Notes clients\",\"author\":\"lalalune\",\"number\":33295,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:08:40Z\",\"mergedAt\":\"2026-10-04T04:17:46Z\",\"additions\":5442,\"deletions\":30},{\"id\":\"PR_kwDOMT5cIs8AAAABGmL0Ug\",\"title\":\"fix(knowledge): keep story declarations out of runtime source\",\"author\":\"lalalune\",\"number\":33558,\"body\":\"The Knowledge declaration build included Storybook files that import UI implementation files. With `tsc6 --noCheck` and the plugin's narrow `rootDir`, this emitted declarations into `packages/ui/src`, making an otherwise successful clean resident installation fail immutable-source verification.\\n\\nExclude `.stories.ts` and `.stories.tsx` consistently with neighboring plugins. A real compiler regression fixture reproduces `csrf-cookie.d.ts` pollution before this change and passes afterward; the Alpha Phone consumer retains this regression test. Full clean consumer preparation is running.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:12:22Z\",\"mergedAt\":null,\"additions\":5142,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGgWZvw\",\"title\":\"feat(personal-assistant): share owner-bound bill host orchestration\",\"author\":\"lalalune\",\"number\":33281,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:13:47Z\",\"mergedAt\":\"2026-10-04T03:45:36Z\",\"additions\":4872,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABGhvFzA\",\"title\":\"refactor(app): consolidate ownership and retire legacy scaffolding\",\"author\":\"lalalune\",\"number\":33384,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T08:32:23Z\",\"mergedAt\":\"2026-10-04T10:15:35Z\",\"additions\":4347,\"deletions\":12460},{\"id\":\"PR_kwDOMT5cIs8AAAABGmTKBg\",\"title\":\"Consolidate OS tooling and remove superseded implementation paths\",\"author\":\"lalalune\",\"number\":33561,\"body\":\"$3f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:32:23Z\",\"mergedAt\":\"2026-10-05T04:36:15Z\",\"additions\":3914,\"deletions\":22172},{\"id\":\"PR_kwDOMT5cIs8AAAABGl9twQ\",\"title\":\"Promote Android reminder background I/O to consumer staging\",\"author\":\"lalalune\",\"number\":33548,\"body\":\"Promote elizaOS/eliza#33547's Android reminder tap background-I/O fix to consumer staging. The candidate starts at AlphaPhone's reviewed 49a9773564073bd8feae8bad71fade371fccdb4f source pin and adds only this change, so the consumer can adopt it without unrelated runtime changes.\\n\\nThe reminder package contents match the develop candidate. Package tests/typecheck/lint and Android fixture builds pass there; all three real independent emulator tests pass, covering slow-store UI responsiveness, permission/CRUD bridge behavior and engine isolation. Full develop-root verification passes all 298 tasks and repository audits after the unrelated develop assertion fix in #33549. AlphaPhone's encrypted-store/PendingIntent upgrade qualification and adoption remain separate work.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:36:26Z\",\"mergedAt\":\"2026-10-04T20:43:31Z\",\"additions\":3303,\"deletions\":29},{\"id\":\"PR_kwDOMT5cIs8AAAABGlxYww\",\"title\":\"Promote shared hosted WebView provisioning to consumer staging\",\"author\":\"lalalune\",\"number\":33539,\"body\":\"Promote the shared hosted WebView provisioner from #33538 to consumer staging. The candidate is based on Alpha's current reviewed d6de9d8317f60f381643640f8a98d12328ab51dd pin and adds only the shared provisioner, archive extractor, tests/fixture and documentation. Consumers may pin this reviewed candidate commit without unrelated runtime changes.\\n\\nThe helper content is identical to the develop candidate, where 65 focused tests and Biome checks pass. All 65 focused staging tests pass. Full develop-root verification passes all 297 tasks and repository audits. The change preserves strict fixture/provider admission and adds explicit host configuration plus optimization-independent archive validation. No fresh hosted emulator or runtime-feature acceptance is claimed.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:05:41Z\",\"mergedAt\":\"2026-10-04T20:15:27Z\",\"additions\":3168,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGlweQQ\",\"title\":\"Share pinned hosted WebView provisioning across consumer apps\",\"author\":\"lalalune\",\"number\":33538,\"body\":\"$40\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:03:21Z\",\"mergedAt\":\"2026-10-04T20:15:04Z\",\"additions\":3168,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGgUq6w\",\"title\":\"feat(os): share OTA release verification, authorization and admission\",\"author\":\"lalalune\",\"number\":33278,\"body\":\"$41\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:06:59Z\",\"mergedAt\":null,\"additions\":2888,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGlrtAA\",\"title\":\"fix(benchmarks): preserve evidence and simplify harness contracts\",\"author\":\"lalalune\",\"number\":33532,\"body\":\"$42\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:50:23Z\",\"mergedAt\":\"2026-10-04T20:01:44Z\",\"additions\":2795,\"deletions\":3121},{\"id\":\"PR_kwDOMT5cIs8AAAABGlTsYA\",\"title\":\"Integrate reviewed upgrade quotes and develop regression fixes\",\"author\":\"lalalune\",\"number\":33508,\"body\":\"$43\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T18:47:57Z\",\"mergedAt\":\"2026-10-04T18:50:22Z\",\"additions\":2774,\"deletions\":234},{\"id\":\"PR_kwDOMT5cIs8AAAABGmJOGA\",\"title\":\"refactor(app): retire legacy paths and consolidate package ownership\",\"author\":\"lalalune\",\"number\":33554,\"body\":\"$44\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:05:01Z\",\"mergedAt\":\"2026-10-05T02:33:37Z\",\"additions\":2652,\"deletions\":7093},{\"id\":\"PR_kwDOMT5cIs8AAAABGgMN-A\",\"title\":\"feat(app): share native consumer gateway and Cloud adapters\",\"author\":\"lalalune\",\"number\":33266,\"body\":\"$45\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T02:34:51Z\",\"mergedAt\":null,\"additions\":2609,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABGlNrFQ\",\"title\":\"feat(cloud): add organization upgrade reviews and confirmation journal\",\"author\":\"lalalune\",\"number\":33506,\"body\":\"$46\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T18:33:19Z\",\"mergedAt\":\"2026-10-04T18:50:24Z\",\"additions\":2553,\"deletions\":196},{\"id\":\"PR_kwDOMT5cIs8AAAABGmXlmA\",\"title\":\"refactor(ui): consolidate APIs, contracts, and state ownership\",\"author\":\"lalalune\",\"number\":33566,\"body\":\"UI consumers currently depend on forwarding modules, retired routes and duplicated state. This consolidates public JavaScript APIs at the package root, moves internal imports to their owners, removes dead modules, and migrates app and plugin consumers together.\\n\\nThe coordinated contract changes preserve explicit view visibility and XR modality, require server-authoritative auth roles, use canonical device status, and remove the UI hardware-classification fallback. Conversation visibility follows explicit scope rather than titles; persistence failures stay visible; shared dialog focus and render telemetry replace duplicate implementations.\\n\\nValidation is in progress. Focused UI boundary tests (46) and remote-view decoder tests (2) pass; UI lint has no errors. Full UI tests, remaining owning-package checks, packed API validation, app desktop/mobile visual audit, and repository verification are still pending. This PR remains a draft until those checks are complete.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:45:03Z\",\"mergedAt\":\"2026-10-05T01:17:38Z\",\"additions\":2447,\"deletions\":9608},{\"id\":\"PR_kwDOMT5cIs8AAAABGhggOw\",\"title\":\"Preserve navigation and Calendar reads while trimming completed reply context\",\"author\":\"NubsCarson\",\"number\":33358,\"body\":\"$47\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:47:02Z\",\"mergedAt\":\"2026-10-04T08:04:45Z\",\"additions\":2373,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs8AAAABGgdDXQ\",\"title\":\"feat(app): share consent-bound research collector and task trace hosts\",\"author\":\"lalalune\",\"number\":33290,\"body\":\"$48\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:39:47Z\",\"mergedAt\":\"2026-10-04T04:29:37Z\",\"additions\":2346,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGmHCkA\",\"title\":\"Promote reviewed upgrade and browser fixes to staging\",\"author\":\"lalalune\",\"number\":33551,\"body\":\"Promote the reviewed develop batch to staging, including atomic paid-upgrade completion, website blocking fixes, browser consumer preparation and recorded benchmark deadlines. The merge is conflict-free and its tree matches develop f9ddff7c876a.\\n\\nValidation: the previous staging candidate passed root `bun run verify` (298 tasks). This delta passed 16 PostgreSQL finalization tests, 44 billing component tests, 17 website-blocking engine tests, and 3 browser consumer filesystem/subprocess tests. Full hosted verification of this combined head remains pending.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:58:49Z\",\"mergedAt\":\"2026-10-04T20:59:02Z\",\"additions\":1998,\"deletions\":128},{\"id\":\"PR_kwDOMT5cIs8AAAABGhgxNA\",\"title\":\"Keep reminder alerts and owner brief facts accurate\",\"author\":\"NubsCarson\",\"number\":33359,\"body\":\"$49\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:47:55Z\",\"mergedAt\":\"2026-10-04T08:04:45Z\",\"additions\":1932,\"deletions\":212},{\"id\":\"PR_kwDOMT5cIs8AAAABGlr7Rg\",\"title\":\"Promote shared consumer source and Android fixture tooling\",\"author\":\"lalalune\",\"number\":33533,\"body\":\"Promote the consumer source verifier (#33529) and hosted Android fixture helpers (#33530) to staging. The candidate is based on Alpha's current reviewed pin, 4c7cc7038b6e77581bd81468cba1b45374deec6c, so consumers may adopt the published candidate commit without unrelated runtime changes.\\n\\nAll 34 focused source-integrity and hosted-fixture tests pass on this candidate. Source-verifier full upstream verification passed 297 tasks and final audits; the combined fixture branch also passed all 297 root verification tasks and final audits. No fresh hosted-emulator qualification is claimed. The candidate changes only shared build helpers, tests, fixtures, consumer typecheck coverage and documentation.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:50:53Z\",\"mergedAt\":\"2026-10-04T19:52:29Z\",\"additions\":1816,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABGl3T9Q\",\"title\":\"feat(cloud): atomically finalize paid organization upgrades\",\"author\":\"lalalune\",\"number\":33542,\"body\":\"$4a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:21:51Z\",\"mergedAt\":\"2026-10-04T20:25:47Z\",\"additions\":1592,\"deletions\":121},{\"id\":\"PR_kwDOMT5cIs8AAAABGlZ5qA\",\"title\":\"Promote reviewed follow-ups and repair staging fixture checks\",\"author\":\"lalalune\",\"number\":33513,\"body\":\"Promote reviewed develop `25f096252940` to staging. The promotion tree matches develop and preserves the original PR commits.\\n\\nIncludes the task-pipeline browser fixture import repair, owner-connected morning brief selection, shared browser address parser, and organization upgrade execution fencing and paid-invoice observations. Cloud changes do not execute provider charges or publish allowance. The additive dispatch migration prevents an expired persisted lease from being renewed in the same dispatch write.\\n\\nValidation: 31 browser plugin tests plus TypeScript/Rollup build, 54 morning brief tests, 32 PostgreSQL upgrade/cancellation tests and 19 invoice tests passed. Task-pipeline desktop/mobile browser assertions passed. Root verification is running on this promotion head; staging hosted failures are being checked before merge.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:04:54Z\",\"mergedAt\":\"2026-10-04T19:05:58Z\",\"additions\":1572,\"deletions\":56},{\"id\":\"PR_kwDOMT5cIs8AAAABGf_aAQ\",\"title\":\"feat(auth): share native Cloud service and document adapters\",\"author\":\"lalalune\",\"number\":33255,\"body\":\"$4b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:47:21Z\",\"mergedAt\":\"2026-10-04T02:47:50Z\",\"additions\":1527,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABGf9mkQ\",\"title\":\"Share external Android speech tooling and native adapter contracts\",\"author\":\"lalalune\",\"number\":33253,\"body\":\"$4c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:41:24Z\",\"mergedAt\":\"2026-10-04T02:02:19Z\",\"additions\":1516,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs8AAAABGlppcg\",\"title\":\"Share disposable Android CI fixture admission and diagnostics\",\"author\":\"lalalune\",\"number\":33530,\"body\":\"Move reusable disposable Android CI fixture admission and diagnostics from Alpha into app platform tooling. Hosts inject ADB execution and retain orchestration/output paths. Preserve the restrictive GitHub-hosted emulator-5554/AVD-test/user0 admission, unsecured keyguard readback, fresh network fixture checks, exact API35 x86_64 boot topology, bounded retries and privacy-conscious diagnostics. Admission failures use a named HostedFixtureError. This does not broaden the set of devices that may be mutated.\\n\\nValidation: all 29 captured-state and fake-ADB refusal/recovery tests pass. Changed-file Biome checks pass. All four suites are discovered by the maintained Node script lane. Full upstream verification passed all 297 tasks and final audits; these fixture tests are not a claim of a fresh hosted emulator qualification run.\\n\\nConsumer adoption will replace the four local helper implementations with pinned imports and run the existing provider orchestration tests against them.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T19:45:43Z\",\"mergedAt\":\"2026-10-04T19:52:13Z\",\"additions\":1512,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGf-RcA\",\"title\":\"feat(os): build and qualify shared Chromium protection for consumers\",\"author\":\"lalalune\",\"number\":33254,\"body\":\"$4d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T01:43:54Z\",\"mergedAt\":\"2026-10-04T01:57:04Z\",\"additions\":1462,\"deletions\":154},{\"id\":\"PR_kwDOMT5cIs8AAAABGgTehg\",\"title\":\"feat(app): compose thin task and document hosts with shared Cloud services\",\"author\":\"lalalune\",\"number\":33275,\"body\":\"$4e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:03:11Z\",\"mergedAt\":\"2026-10-04T03:45:30Z\",\"additions\":1451,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs8AAAABGgn5BA\",\"title\":\"fix(os): consolidate installer contracts and remove unused assets\",\"author\":\"lalalune\",\"number\":33297,\"body\":\"$4f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T04:13:53Z\",\"mergedAt\":\"2026-10-04T04:30:17Z\",\"additions\":1352,\"deletions\":736},{\"id\":\"PR_kwDOMT5cIs8AAAABGmQaUw\",\"title\":\"feat(cloud): reconcile original upgrades without redispatch\",\"author\":\"lalalune\",\"number\":33559,\"body\":\"$50\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:24:34Z\",\"mergedAt\":\"2026-10-04T21:40:39Z\",\"additions\":1276,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGiHyfg\",\"title\":\"feat(auth): support private native Google account linking and personal reauthentication\",\"author\":\"lalalune\",\"number\":33402,\"body\":\"$51\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T09:46:52Z\",\"mergedAt\":\"2026-10-04T09:59:09Z\",\"additions\":1260,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs8AAAABGhfihg\",\"title\":\"Complete lalalune review fixes and Cloud billing fixture alignment\",\"author\":\"lalalune\",\"number\":33355,\"body\":\"$52\",\"repository\":\"el only subscription renewal review\",\"author\":\"lalalune\",\"number\":33334,\"body\":\"$62\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T07:01:16Z\",\"mergedAt\":\"2026-10-04T07:19:37Z\",\"additions\":657,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABGmv4LA\",\"title\":\"Fix reminder routing, recovered creation replies and duplicate delivery\",\"author\":\"NubsCarson\",\"number\":33585,\"body\":\"$63\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T22:56:42Z\",\"mergedAt\":\"2026-10-04T23:02:55Z\",\"additions\":648,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs8AAAABGgDYzg\",\"title\":\"feat(cloud): in-app (embedded) and shared-link subscription checkout\",\"author\":\"lalalune\",\"number\":33259,\"body\":\"$64\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T02:02:57Z\",\"mergedAt\":\"2026-10-04T02:56:03Z\",\"additions\":614,\"deletions\":38},{\"id\":\"PR_kwDOMT5cIs8AAAABGgHCog\",\"title\":\"feat(auth): in-memory billing authority for native host enrollment\",\"author\":\"lalalune\",\"number\":33261,\"body\":\"$65\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T02:15:42Z\",\"mergedAt\":\"2026-10-04T02:34:03Z\",\"additions\":599,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs8AAAABGRUSGw\",\"title\":\"fix(scripts): fail installs whose installer or postinstall Bun is not the repository pin\",\"author\":\"lumix5\",\"number\":33047,\"body\":\"$66\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T11:16:04Z\",\"mergedAt\":null,\"additions\":590,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGYXsgw\",\"title\":\"fix(cloud): reject malformed JSON before optional-body mutations\",\"author\":\"hermesagent270-commits\",\"number\":33121,\"body\":\"$67\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T01:28:06Z\",\"mergedAt\":\"2026-10-04T02:25:11Z\",\"additions\":576,\"deletions\":35},{\"id\":\"PR_kwDOMT5cIs8AAAABGiFoJQ\",\"title\":\"chore(staging): adopt read-only token capability diagnostic\",\"author\":\"lalalune\",\"number\":33400,\"body\":\"Adopt the exact three reviewed files from merged #33396 (306a8a18f83578bc098a37b1b9572aface212167) onto the current staging tree. The existing protected token identity preflight gains a separate default-false permission metadata report. It reuses the verified token identity and protected account selector; denied or incomplete metadata remains unknown. Closed receipts contain counts/status only. No token, resource policy, provider errors, role changes, model requests or deployment effects are introduced.\\n\\nValidation: exact three-file byte/tree comparison; no unrelated staging workflow changes; actionlint passed. Canonical seven real HTTP/process tests, strict standalone typecheck and all required hosted gates passed. Staging-specific checks and source admission are still required before the single read-only diagnostic run. This does not certify full develop promotion or effective Worker permissions.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T09:40:44Z\",\"mergedAt\":\"2026-10-04T09:48:23Z\",\"additions\":574,\"deletions\":36},{\"id\":\"PR_kwDOMT5cIs8AAAABGiCB_w\",\"title\":\"fix(cloud): inspect protected token policy metadata safely\",\"author\":\"lalalune\",\"number\":33396,\"body\":\"$68\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T09:31:26Z\",\"mergedAt\":\"2026-10-04T09:36:39Z\",\"additions\":574,\"deletions\":36},{\"id\":\"PR_kwDOMT5cIs8AAAABGmdlYA\",\"title\":\"feat(cloud): retain authenticated historical upgrade target evidence\",\"author\":\"lalalune\",\"number\":33573,\"body\":\"$69\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T22:02:18Z\",\"mergedAt\":\"2026-10-04T22:28:43Z\",\"additions\":571,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABGgbG5w\",\"title\":\"feat(native-agent): share OTA preparation, storage, clock and health IPC\",\"author\":\"lalalune\",\"number\":33287,\"body\":\"$6a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T03:33:02Z\",\"mergedAt\":null,\"additions\":565,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGmyJ2g\",\"title\":\"fix(cloud): retain authenticated upgrade target deliveries\",\"author\":\"lalalune\",\"number\":33586,\"body\":\"$6b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T23:03:29Z\",\"mergedAt\":\"2026-10-04T23:13:29Z\",\"additions\":560,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs8AAAABGmXn7A\",\"title\":\"feat(ui): share microphone capture and speech pause observation\",\"author\":\"lalalune\",\"number\":33567,\"body\":\"$6c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:45:10Z\",\"mergedAt\":\"2026-10-04T22:00:07Z\",\"additions\":537,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABGnBmwQ\",\"title\":\"Share host-configured runtime JSON client\",\"author\":\"lalalune\",\"number\":33597,\"body\":\"$6d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T23:51:45Z\",\"mergedAt\":\"2026-10-05T00:05:13Z\",\"additions\":525,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABGYBpRQ\",\"title\":\"fix(health): bound Google Fit days on the owner's local calendar day\",\"author\":\"hermesagent270-commits\",\"number\":33110,\"body\":\"$6e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T00:16:57Z\",\"mergedAt\":\"2026-10-04T02:25:27Z\",\"additions\":498,\"deletions\":113},{\"id\":\"PR_kwDOMT5cIs8AAAABGQ3DyQ\",\"title\":\"fix(core): make log redaction faithful and bounded\",\"author\":\"hermesagent270-commits\",\"number\":33045,\"body\":\"$6f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T10:18:21Z\",\"mergedAt\":\"2026-10-04T02:29:24Z\",\"additions\":495,\"deletions\":39},{\"id\":\"PR_kwDOMT5cIs8AAAABGmJiPg\",\"title\":\"Promote source-integrity and task-lifecycle repairs\",\"author\":\"lalalune\",\"number\":33555,\"body\":\"Promote the knowledge declaration build repair and reviewed task-lifecycle client to staging. Knowledge declarations no longer escape into UI source during normal installation. The lifecycle client includes reset/epoch regression fixes and its public build entry.\\n\\nValidation: TypeScript compiler emit produced zero out-of-directory files after the knowledge fix; 10 lifecycle tests and strict leaf typecheck pass. The preceding staging commit c1ce42d passed full root verify. This merge is conflict-free and matches develop exactly; hosted combined checks remain pending.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T21:05:52Z\",\"mergedAt\":\"2026-10-04T21:06:05Z\",\"additions\":493,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABGmHY3w\",\"title\":\"feat(ui): share authoritative task lifecycle projection\",\"author\":\"lalalune\",\"number\":33552,\"body\":\"$70\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-04T20:59:49Z\",\"mergedAt\":\"2026-10-04T21:05:18Z\",\"additions\":486,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGmvA-w\",\"title\":\"Share bounded runtime asset loading and presence checks\",\"author\":\"lalalune\",\"number\":33584,\"body\":\"Move APK asset reading and presence checks into the native runtime package. `RuntimeAssets.read` bounds allocation while reading and closes every source; `RuntimeBundleStore.prepareFromAsset` applies its existing 2 MiB inventory limit before loading the inventory, then uses the existing immutable bundle verification path. Hosts keep asset/library names, paths, format and policy. Presence is only an availability hint.\\n\\nFourteen new portable checks cover read limits, close behavior, zero-byte reads, missing assets/libraries and oversized/invalid inventory rejection before filesystem output. Existing bundle success/recovery tests exercise the new loader. Owning native-host suite and changed-runner Biome are qualified locally; root verify remains limited by missing sparse UI locales. Consumer Android build and installed bundle-binding qualification are tracked separately.\\n\\nBased on pending task-evidence candidate #33583. No UI or product identity moved.\\n\",\"repository\":\"elizaos/el
