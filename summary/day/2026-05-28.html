rong on my end.\" and the user couldn't tell it was throttling.\n\n**Fix:** `isRateLimitError` detection in `generateFailureReplyText`; when every model slot fails on a 429, the failure reply says the provider is rate-limiting and to retry shortly (overridable via `character.templates.rateLimitedReply`).\n\n## Tests\n- `prompts.test.js` pins the new moderation-rule clauses.\n- `failure-reply-prompt.test.ts` pins the rate-limit detector across the live incident shape, common phrasings, and negative cases.\n- Live-verified on the Milady bot: \"what was the actual error?\" now → \"I don't see any error in the recent messages I can see.\" (no fabricated moderation); \"why did you refuse?\" → first-person.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR addresses two live honesty regressions observed in Milady (Cerebras gpt-oss-120b) Discord trajectories: the model fabricating a content-moderation system to explain its own refusals, and the failure-reply path emitting an opaque generic message when every model slot hits a provider 429.\n\n- **Prompt rule** (`packages/prompts/src/index.ts`): Adds a `messageHandlerTemplate` rule that forbids attributing a refusal to a non-existent moderation system, content filter, or \\\"usage policies,\\\" forcing first-person ownership of any decline and explicitly calling out the \\\"why did you refuse / what was the error?\\\" follow-up case.\n- **Rate-limit detection** (`packages/core/src/services/message.ts`): Introduces `isRateLimitError` and a `rateLimited` variant of `FailureReplyAttempt`; when every fallback model slot fails with a 429, `buildStructuredFailureReply` now emits a character-overridable \\\"rate-limiting, try again shortly\\\" reply instead of the generic transient-failure message. Both fixes are covered by new pinned tests.\n\n\u003ch3\u003eConfidence Score: 4/5\u003c/h3\u003e\n\nSafe to merge; changes are additive and well-tested. The one logic edge case (mixed 429 + non-429 failures reporting as rate-limited) is unlikely in practice and no worse than the current generic fallback.\n\nThe rate-limit detection loop marks sawRateLimit to true on the first 429 regardless of how subsequent model slots fail, so a mixed-failure run (one slot rate-limited, others network-errored) reports rate-limiting even though retrying won't resolve the other errors. This doesn't affect the common all-429 case that motivated the fix.\n\npackages/core/src/services/message.ts — specifically the sawRateLimit flag semantics in generateFailureReplyText for mixed-error scenarios.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/core/src/services/message.ts | Adds isRateLimitError helper and rateLimited FailureReplyAttempt variant; logic is correct but sawRateLimit fires on the first 429 seen even if subsequent model slots fail for unrelated reasons, leading to a potentially misleading reply in mixed-error scenarios. |\n| packages/prompts/src/index.ts | Adds anti-fabrication rule for content-moderation systems to messageHandlerTemplate; copy is precise, well-scoped, and consistent with the existing training-cutoff and phantom-action rules already in the template. |\n| packages/core/src/services/__tests__/failure-reply-prompt.test.ts | Adds isRateLimitError test suite covering the live incident shape, common phrasings, negative cases, and non-Error inputs; coverage is thorough. |\n| packages/prompts/test/prompts.test.js | Pins five specific clauses from the new moderation-fabrication rule with regex assertions; test approach is consistent with adjacent rule tests in the same file. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    A[Main generation fails] --\u003e B[buildStructuredFailureReply]\n    B --\u003e C{hasTextGenerationHandler?}\n    C -- No --\u003e D[buildNoModelProviderReply]\n    C -- Yes --\u003e E[generateFailureReplyText\\ntry 4 model slots]\n    E --\u003e F{Model slot succeeds?}\n    F -- Yes --\u003e G[kind: text, value: reply]\n    F -- No: NoModelProviderConfiguredError --\u003e H[kind: noProvider]\n    F -- No: isRateLimitError = true --\u003e I[sawRateLimit = true\\nlog warning, try next slot]\n    F -- No: other error --\u003e J[log warning, try next slot]\n    I --\u003e K{More slots?}\n    J --\u003e K\n    K -- Yes --\u003e F\n    K -- No --\u003e L{sawRateLimit?}\n    L -- Yes --\u003e M[kind: rateLimited]\n    L -- No --\u003e N[kind: text, value: empty]\n    G --\u003e O[buildStructuredFailureReply\\nresolution]\n    H --\u003e D\n    M --\u003e P{rateLimitedReply\\ntemplate?}\n    N --\u003e Q{transientFailureReply\\ntemplate?}\n    P -- Yes --\u003e R[character template reply]\n    P -- No --\u003e S[hardcoded rate-limit message]\n    Q -- Yes --\u003e T[character template reply]\n    Q -- No --\u003e U[hardcoded generic message]\n```\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"fix(core/prompts): forbid fabricated mod...\"](https://github.com/elizaos/eliza/commit/fe098330385bb962131f9b7f13c3495eb8e2a755) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=34466237)\u003c/sub\u003e\n\n\u003e Greptile also left **1 inline comment** on this PR.\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"15:T15ec,"])</script><script>self.__next_f.push([1,"Tell the agent a durable fact (\"my dog's name is Jeff\") and it should save it to facts memory and recall it later from memory — not just answer while the source message is still in the recent window. Deep-scanning two-turn Milady tests (`tj-80ba4e3920d7bd` / `tj-87ea55b515d769`) found two breaks in the pipeline:\n\n## 1. Facts never persisted\nStage 1 extracted the fact correctly and the validate model returned a proper tool call — but the args were under `input` (AI SDK v5 / Cerebras gpt-oss-120b shape) while `extractText` in `facts-and-relationships.ts` only read `arguments`. Result: empty parse, `kept=0`, `written=0` — every fact silently dropped.\n\n**Fix:** read `arguments ?? args ?? input ?? params` (mirrors the accessor in `services/message.ts`). Verified live: `written.facts` went 0 → 1, store confirmed `facts:2`.\n\n## 2. Facts never retrieved\nEven once persisted, recall failed after the source message scrolled out of `RECENT_MESSAGES`: the FACTS provider is `dynamic` and was absent from `CORE_RESPONSE_STATE_PROVIDERS`, so Stage 1 (where simple-path recall is answered) never composed it. The Stage 1 exclusion comment already documented the intent to keep FACTS rendered — the provider was just never added to the compose list. FACTS is cache-stable (refreshes only when the store changes) so it doesn't churn the prefix cache.\n\n## Tests\n- `facts-and-relationships.test.ts` pins the `input`/`args`/`params` tool-arg shapes.\n- Existing Stage 1 provider-list assertions still pass.\n- Live-verified: \"my dog's name is Jeff\" → later → \"Your dog's name is Jeff.\"; a fresh fact survived a 16-message flood and was recalled from the FACTS provider with the source message gone from the window.\n\nPairs with the durable-recall ranking fallback in a follow-up PR.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR fixes two independent breaks in the facts persistence-and-recall pipeline: a silent fact-drop caused by reading the wrong field name on AI SDK v5 / Cerebras tool-call shapes, and missing recall caused by the FACTS dynamic provider being absent from the Stage 1 composition list.\n\n- **`facts-and-relationships.ts`**: `extractText` now reads `tool.arguments ?? tool.args ?? tool.input ?? tool.params` to handle divergent tool-call shapes across model providers/SDK versions. Before this fix, facts were extracted and validated but then silently dropped because `tool.arguments` was undefined on AI SDK v5 responses.\n- **`message.ts`**: `\"FACTS\"` is added to `CORE_RESPONSE_STATE_PROVIDERS` so the FACTS dynamic provider is always composed for response context. Without it, persisted facts were never retrieved once the source message left the `RECENT_MESSAGES` window.\n- **Tests**: Two new regression tests pin the `input`, `args`, and `params` tool-arg shapes to catch future silent breakage at the parse layer.\n\n\u003ch3\u003eConfidence Score: 5/5\u003c/h3\u003e\n\nBoth changes are targeted, well-commented, and consistent with patterns already used elsewhere in the codebase; the risk of regression is low.\n\nThe tool-arg accessor change is a straightforward fallback chain that degrades gracefully — if none of the four keys are present the old empty-string path is preserved. Adding FACTS to the provider list is additive and cache-stable, so it won't affect runs where no facts have been stored. The test additions directly cover the previously-broken code paths.\n\nNo files require special attention; both changed files are narrow and well-tested by the accompanying test additions.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/core/src/runtime/facts-and-relationships.ts | Extends extractText to read tool-call args from arguments ?? args ?? input ?? params, fixing silent fact-drop when AI SDK v5 / Cerebras returns args under input |\n| packages/core/src/services/message.ts | Adds FACTS to CORE_RESPONSE_STATE_PROVIDERS so the dynamic FACTS provider is composed for Stage 1 response context, enabling durable fact recall after source message scrolls out of RECENT_MESSAGES |\n| packages/core/src/runtime/__tests__/facts-and-relationships.test.ts | Adds regression tests pinning the input, args, and params tool-call arg shapes to prevent future silent regressions on the facts pipeline |\n\n\u003c/details\u003e\n\n\u003ch3\u003eSequence Diagram\u003c/h3\u003e\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant S1 as Stage 1 (simple-path)\n    participant FP as FACTS Provider\n    participant FAR as facts-and-relationships stage\n    participant M as Memory Store\n\n    U-\u003e\u003eS1: \"My dog's name is Jeff\"\n    S1-\u003e\u003eFP: compose context (FACTS in CORE_RESPONSE_STATE_PROVIDERS)\n    FP-\u003e\u003eM: fetch stored facts\n    M--\u003e\u003eFP: (none yet)\n    S1-\u003e\u003eFAR: trigger extraction\n    FAR-\u003e\u003eFAR: validate model → tool call (args under input)\n    Note over FAR: extractText reads arguments ?? args ?? input ?? params\n    FAR-\u003e\u003eM: persist fact \"my dog's name is Jeff\"\n    S1--\u003e\u003eU: \"Got it!\"\n\n    Note over U,M: Later turn — source message scrolled out of RECENT_MESSAGES\n\n    U-\u003e\u003eS1: \"What's my dog's name?\"\n    S1-\u003e\u003eFP: compose context (FACTS now included)\n    FP-\u003e\u003eM: fetch stored facts\n    M--\u003e\u003eFP: [\"my dog's name is Jeff\"]\n    FP--\u003e\u003eS1: FACTS block with stored fact\n    S1--\u003e\u003eU: \"Your dog's name is Jeff.\"\n```\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"fix(core/facts): persist + recall durabl...\"](https://github.com/elizaos/eliza/commit/435db9a8e06799b479f1a588cd13b591873cc7db) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=34466367)\u003c/sub\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"16:T158e,"])</script><script>self.__next_f.push([1,"## Summary\n- The provisioner ran `docker create --network containers-isolated` on the target node assuming the network already existed. It didn't always: cloud-init `node-bootstrap.ts` creates it, but **only for Hetzner Cloud autoscaled nodes**. Hetzner Robot cores (and any node whose network was pruned out-of-band) never run that bootstrap → `docker create` fails with an opaque `network containers-isolated not found`, the agent never starts, and the provisioner retries forever with no auto-heal.\n- Adds an idempotent, race-safe `docker network inspect || create --driver bridge || inspect` run on the node right **before** container creation, so the provisioner self-heals that drift. Extracted as `buildEnsureNetworkCmd` (mirrors the canonical `node-bootstrap.ts` pattern) with unit tests.\n\n## Why\nFound live this session: a real user agent was stuck in a permanent provision/crash loop because it landed on a core that was missing `containers-isolated` (a Robot core never covered by cloud-init). Creating the network by hand fixed it immediately — this makes the fix automatic and durable.\n\nThe third `inspect` clause handles the create-create race when two provisions hit the same node at once: the loser's `create` errors (`already exists`), the re-`inspect` confirms the winner's network, and the command still exits 0.\n\n## Test plan\n- [x] `bun test docker-ensure-network.test.ts` — 4/4 (exact command, 3-clause race-safety, plain bridge / no implicit subnet, shell-escaping).\n- [x] `biome check` clean on all 3 files.\n- [x] `typecheck` clean for the changed files.\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR fixes a production issue where agents on Hetzner Robot cores got stuck in a permanent provision loop because the `containers-isolated` Docker network was missing — Robot cores don't run the cloud-init `node-bootstrap.ts` that creates it. The fix adds an idempotent `inspect || create || inspect` shell command executed over SSH before `docker create`, letting the provisioner self-heal that drift automatically.\n\n- **`docker-sandbox-utils.ts`**: Adds `buildEnsureNetworkCmd`, a pure function that emits the three-clause race-safe shell command, reusing the existing `shellQuote` helper.\n- **`docker-sandbox-provider.ts`**: Calls `buildEnsureNetworkCmd(DOCKER_NETWORK)` via `ssh.exec` immediately before `docker create --network`, so the network is guaranteed present on the target node.\n- **`docker-ensure-network.test.ts`**: Four unit tests covering the exact command shape, race-safety clause count, absence of `--subnet`, and correct single-quote shell escaping.\n\n\u003ch3\u003eConfidence Score: 4/5\u003c/h3\u003e\n\nSafe to merge — the change is a targeted self-heal injected at a single well-understood point in the provision flow, with no effect on the happy path when the network already exists.\n\nThe three-clause idempotent pattern is correct and the shell escaping is verified by tests. The one thing worth noting is that stderr is suppressed on the final `inspect`, so if both the create and the re-inspect fail (daemon issue, permission error, etc.), the provisioner log will only show a generic exit-code failure with no Docker error detail — making unusual failure modes harder to diagnose.\n\nThe suppressed stderr on the last `docker network inspect` in `docker-sandbox-utils.ts` is the only line worth revisiting.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/cloud-shared/src/lib/services/docker-sandbox-utils.ts | Adds `buildEnsureNetworkCmd` — a pure, well-documented function with correct shell quoting; no issues found. |\n| packages/cloud-shared/src/lib/services/docker-sandbox-provider.ts | Adds one `ssh.exec` call before container creation; all error paths propagate correctly, though stderr suppression on the final `inspect` can obscure the root cause when the ensure command fails. |\n| packages/cloud-shared/src/lib/services/__tests__/docker-ensure-network.test.ts | Four targeted unit tests covering command shape, race-safety, `--driver bridge` only, and single-quote escaping — all correct. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eSequence Diagram\u003c/h3\u003e\n\n```mermaid\nsequenceDiagram\n    participant P as Provisioner\n    participant SSH as SSH (target node)\n    participant D as Docker daemon\n\n    P-\u003e\u003eSSH: buildEnsureNetworkCmd(DOCKER_NETWORK)\n    SSH-\u003e\u003eD: docker network inspect 'containers-isolated'\n    alt network exists\n        D--\u003e\u003eSSH: 0 (exit)\n        SSH--\u003e\u003eP: success (done)\n    else network missing\n        D--\u003e\u003eSSH: 1 (not found, stderr suppressed)\n        SSH-\u003e\u003eD: docker network create --driver bridge 'containers-isolated'\n        alt create succeeds\n            D--\u003e\u003eSSH: 0 (created)\n            SSH--\u003e\u003eP: success (done)\n        else concurrent create race (already exists)\n            D--\u003e\u003eSSH: 1 (stderr suppressed)\n            SSH-\u003e\u003eD: docker network inspect 'containers-isolated'\n            D--\u003e\u003eSSH: 0 (winner's network confirmed)\n            SSH--\u003e\u003eP: success (done)\n        end\n    end\n\n    P-\u003e\u003eSSH: docker create --network 'containers-isolated' ...\n    SSH-\u003e\u003eD: docker create\n    D--\u003e\u003eSSH: container ID\n    SSH--\u003e\u003eP: containerId\n    P-\u003e\u003eSSH: docker start container\n```\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"fix(cloud): ensure the agent bridge netw...\"](https://github.com/elizaos/eliza/commit/27dadf9c9b03a1e5d9b29f8e6b9c92b12486056f) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=34151742)\u003c/sub\u003e\n\n\u003e Greptile also left **1 inline comment** on this PR.\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"17:T1270,"])</script><script>self.__next_f.push([1,"Completes the persist+recall fix (pairs with the FACTS-provider PR). With facts now persisted and the provider composed into Stage 1, recall still failed: \"my car's name is Bertha\" was stored (verified `facts:2`, retrievable by `getMemories(roomId)`) but asking \"what's my car's name?\" returned \"No facts available.\" (`tj-8e3d5c79321002`).\n\n**Root cause:** the FACTS provider ranks the candidate pool by BM25 keyword relevance against the current message and drops anything scoring 0. For a direct recall question the score is 0 — no stemming maps \"cars\" → \"car\", and the only shared term \"name\" has ~0 IDF across a small fact pool — so a durable fact the user is literally asking about gets filtered out.\n\n**Fix:** durable facts are identity-level claims and few in number. When relevance ranking surfaces none, fall back to the most recent durable facts (bounded to `TOP_PER_KIND` so the prompt never floods). Keyword ranking is unchanged when it does match, so query-targeted retrieval still narrows results.\n\n## Tests\n- `facts.test.ts` pins the fallback (durable fact surfaces on a non-matching recall query) and confirms the existing keyword-narrowing behavior is preserved.\n- Live-verified: \"what is my car's name again?\" (stored 20 min + 30 messages earlier) → \"Your car's name is Bertha.\"\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nAdds a recency-based fallback in the FACTS provider so that durable facts are surfaced when BM25 keyword scoring returns zero results — fixing a live regression where \"my car's name is Bertha\" was stored but \"what's my car's name?\" returned \"No facts available.\"\n\n- **`facts.ts`**: When `rankByKeywordScore` produces zero durable facts but candidates exist, the fallback sorts all `durableCandidates` by effective timestamp (newest first) and slices to `TOP_PER_KIND` (6). The BM25 path is unchanged when it does match.\n- **`facts.test.ts`**: Adds a regression test for the Bertha/recall scenario and preserves the existing keyword-narrowing test, confirming the fallback does not activate when BM25 returns results.\n\n\u003ch3\u003eConfidence Score: 3/5\u003c/h3\u003e\n\nThe fallback solves the reported regression but introduces a boundary condition: users with more than 6 stored durable facts can still lose older facts from recall, silently, once they pass the cap.\n\nThe recency-based fallback is bounded by TOP_PER_KIND=6, which is the same cap applied to the BM25 path. For users who accumulate more than 6 durable facts over time, the oldest fact relevant to a query can still be omitted — the exact failure mode the PR is fixing. The fix reliably closes the regression for the narrow scenario described but makes an unenforced assumption about fact count that degrades silently in production.\n\nThe core logic change in facts.ts — specifically the TOP_PER_KIND cap inside the fallback branch — deserves a second look to decide whether the fallback path warrants a higher or uncapped limit.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/core/src/features/advanced-capabilities/providers/facts.ts | Adds a recency-based fallback when BM25 returns zero durable facts; the logic is correct for the narrow case but the TOP_PER_KIND=6 cap means the relevant fact can still be missed for users with \u003e 6 stored durable facts |\n| packages/core/src/features/advanced-capabilities/providers/facts.test.ts | Adds a regression test that pins the Bertha/recall scenario and verifies the fallback; existing keyword-narrowing test is preserved and still guards against false positives |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    A[Query arrives] --\u003e B[Build BM25 queryText]\n    B --\u003e C[Fetch roomFacts + entityFacts]\n    C --\u003e D[dedupeById]\n    D --\u003e E[partitionByKind: durable / current]\n    E --\u003e F[rankByKeywordScore durable]\n    F --\u003e G{durableFacts.length == 0\\nAND durableCandidates.length \u003e 0?}\n    G -- No: BM25 matched --\u003e H[slice to TOP_PER_KIND=6]\n    G -- Yes: BM25 missed all --\u003e I[Sort durableCandidates by recency\\nslice to TOP_PER_KIND=6]\n    H --\u003e J[rankByKeywordScore current slice to TOP_PER_KIND]\n    I --\u003e J\n    J --\u003e K{allFacts.length == 0?}\n    K -- Yes --\u003e L[Return No facts available.]\n    K -- No --\u003e M[Format and return durable + current sections]\n```\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"fix(core/facts-provider): surface durabl...\"](https://github.com/elizaos/eliza/commit/1aa66e81dfc5648b122284fada8ddd74eadb6564) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=34466422)\u003c/sub\u003e\n\n\u003e Greptile also left **2 inline comments** on this PR.\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"18:T1069,"])</script><script>self.__next_f.push([1,"Live regression from Milady Discord on 2026-05-28 (`tj-70a488a154fa31`): user asked\n\n\u003e \"i told you my favorite color is teal, what's my favorite color?\"\n\nand the bot replied \"I don't see any mention of your favorite color in the recent messages, so I don't know what it is.\" — even though \"teal\" is stated in that very message.\n\n**Root cause:** the visible-context recall exception (#7952) directs the model to scan the `prior_message` blocks and, if the token isn't found there, say \"I don't see X.\" When the asserted fact lives in the *current* message the model over-applied that honesty escape and ignored the inline answer.\n\n**Fix:** the `current_turn_boundary` rule now tells the model to read the final `message:user` itself before declaring it can't find something, and only fall back to \"I don't see X\" when the token appears in neither the current message nor the visible prior blocks. Kept tight so the compact direct-message prompt stays within its size budget.\n\n## Tests\n- `message-runtime-stage1.test.ts` pins the new clause; existing recall-exception assertions updated.\n- Live-verified: \"my favorite color is teal, what's my favorite color?\" → \"Your favorite color is teal.\"; \"my name is Sam, what is my name?\" → \"Your name is Sam.\"\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR fixes a live regression where the bot incorrectly applied the \"I don't see X\" honesty escape to facts the user stated *within the same message* they asked about, because the existing recall exception only directed the model to scan `prior_message` blocks.\n\n- **`message.ts`**: Two sentences added to the `current_turn_boundary` instruction string, telling the model to read the final `message:user` itself before declaring it cannot find something, and to answer inline when the user states and asks about a fact in the same turn.\n- **`message-runtime-stage1.test.ts`**: Existing recall-exception assertion updated to match the new wording; a new test case added that pins the three key sub-strings of the new clause.\n\n\u003ch3\u003eConfidence Score: 5/5\u003c/h3\u003e\n\nSafe to merge — the change is a minimal, well-scoped addition to a single instruction string with no side effects on other code paths.\n\nThe fix touches exactly one instruction string in message.ts and only alters model behavior in the narrow case where a user states a fact and asks about it in the same message. The existing scan prior_message blocks and say so plainly branches are preserved; only the ordering and fallback condition were tightened. Regression coverage for the original recall-exception behaviour is retained.\n\nNo files require special attention.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/core/src/services/message.ts | Single-line edit to the `current_turn_boundary` instruction string: two sentences added to tell the model to check the final `message:user` itself before applying the \"I don't see X\" fallback. |\n| packages/core/src/__tests__/message-runtime-stage1.test.ts | Existing recall-exception assertion updated to reflect the new wording; new test added that asserts the three key sub-strings of the added instruction are present in `message.ts`. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    A[\"Final message:user received\"] --\u003e B{Is it a recall question?}\n    B -- No --\u003e C[\"Execute / answer the final message:user directly\"]\n    B -- Yes --\u003e D[\"Scan prior_message blocks (visible context)\"]\n    D --\u003e E{Token found in current message?}\n    E -- Yes --\u003e F[\"Answer from current message directly\"]\n    E -- No --\u003e G{Token found in prior_message blocks?}\n    G -- Yes --\u003e H[\"Answer from visible prior_message blocks\"]\n    G -- No --\u003e I[\"Respond: 'I don't see X in the recent messages I can see'\"]\n\n    style F fill:#90ee90\n    style I fill:#ffcccb\n```\n\n\u003csub\u003eReviews (2): Last reviewed commit: [\"fix(core/message): answer facts stated i...\"](https://github.com/elizaos/eliza/commit/b7d80976fb7c95cc2016c849889c967d803f6fe7) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=34466300)\u003c/sub\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-4xl\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-4 flex flex-col justify-between sm:flex-row\",\"children\":[[\"$\",\"$L12\",null,{\"currentInterval\":\"day\",\"currentDate\":\"2026-05-28\"}],[\"$\",\"$L13\",null,{\"metrics\":{\"date\":\"2026-05-28\",\"interval\":{\"intervalStart\":\"$D2026-05-28T00:00:00.000Z\",\"intervalEnd\":\"$D2026-05-29T00:00:00.000Z\",\"intervalType\":\"day\"},\"pullRequests\":{\"new\":4,\"merged\":0,\"total\":4},\"issues\":{\"new\":0,\"closed\":0,\"total\":0},\"activeContributors\":2,\"codeChanges\":{\"additions\":0,\"deletions\":0,\"files\":0,\"commitCount\":4},\"topContributors\":[{\"username\":\"NubsCarson\",\"avatarUrl\":\"https://avatars.githubuse
