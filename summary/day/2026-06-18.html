p-level `mock.module` at **collection time** in one shared process, and those overrides are process-global with no per-file teardown. **10 of 24 files** stub overlapping `@/db`/`@/lib` modules with different shapes (e.g. one mocks `@/db/helpers` to `{dbRead}`, a co-loaded file needs the real surface) → cross-contamination. `stripe-event-waifu` fails when batched with `eliza-agents-orphan-cleanup`, depending on file order.\n\n## The fix (whole class, not one pair)\nRun each test file in its own `bun test` process via `test/run-unit-isolated.mjs` → zero shared module-mock state to leak. Mirrors the repo's existing `run-vitest.mjs` wrapper convention. Serial (avoids port/temp contention). Old batch kept as `test:batch` for quick local runs.\n\n## Verified\n- `bun run test` (isolated) = **24/24 files, 145/145 tests, deterministic** across repeated runs.\n- `test:batch` still reproduces the flake (that's the demonstration).\n- Touches **no** test assertions and **no** prod code; the deploy gate (`test:e2e`) is unaffected.44:T74a,"])</script><script>self.__next_f.push([1,"## Why\n\nCloses the one open code suggestion from the #8434 launch thread (0xSolace's note on the prod canary).\n\nThe `AGENT_ROUTER_ALLOW_BRIDGE_HOST_FALLBACK` escape hatch is meant to let agent containers boot on nodes that **aren't on the headscale mesh** (legacy public-host routing). But it was only half-honored: it relaxed `requiresHeadscaleRoute()` (stopped *requiring* a `headscale_ip`) while the provider still injected `TS_AUTHKEY` whenever `HEADSCALE_API_KEY` was set.\n\nThe container entrypoint (`docker-entrypoint.sh`, `set -eu`) runs `tailscale up` whenever `TS_AUTHKEY` is present. So on a non-mesh node, `tailscale up` fails → `set -e` exits before `exec node … start` → the app never boots → health never passes — the **exact failure the flag is meant to bypass**. On the 06-16 prod canary, the workaround was to disable `HEADSCALE_API_KEY` on the daemon entirely.\n\n## What\n\nGate all VPN enrollment (TS_AUTHKEY injection, `NET_ADMIN` cap + `/dev/net/tun`, rollback cleanup, and the `headscale_ip` wait) through a single exported predicate:\n\n```ts\nexport function headscaleVpnEnabled(env: HeadscaleRouteEnv): boolean {\n  return hasConfiguredValue(env.HEADSCALE_API_KEY) \u0026\u0026 !isBridgeHostFallbackEnabled(env);\n}\n```\n\n- **No-op for the validated prod/staging path** — the fallback flag is off there (you only get a `headscale_ip` if `TS_AUTHKEY` was injected, which the staging/prod E2E confirmed). Only the explicit legacy-fallback case changes behavior.\n- Keeps the fallback flag internally consistent with `requiresHeadscaleRoute()`.\n- Adds 4 regression tests; existing route-guard suite stays green (15 tests, 0 fail). Typecheck + biome clean.\n\n## Test\n`bun test packages/cloud-shared/src/lib/services/__tests__/docker-sandbox-headscale-route.test.ts` → 15 pass / 0 fail.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"45:T502,## Problem\n\nThe planner's `messageToUser` fallback (raw model text) applied to **every** terminal-only iteration. So free text that accompanies a `STOP` call — the model's internal coordination scratch, e.g. *\"We should wait for the sub-agent result before replying.\"* — was sent to the user **verbatim**.\n\n`STOP`/`IGNORE`-only terminals are meant to be silent (the agent decided not to reply, or is waiting). Leaking the scratch prose as a user-facing message is a real UX bug: the user sees the model thinking out loud instead of nothing.\n\n## Fix\n\nThe raw-text fallback now applies **only when a `REPLY` call is present** in the terminal output:\n\n- A `REPLY` with no explicit text still keeps its prose (textless REPLY → raw text is the intended message).\n- A `STOP`/`IGNORE`-only terminal stays **silent** — its accompanying scratch text is not surfaced.\n\n## Changes\n\n- `packages/core/src/runtime/planner-loop.ts` — gate the `messageToUser` raw-text fallback on the presence of a `REPLY` call.\n- `packages/core/src/runtime/__tests__/planner-loop.test.ts` — cover STOP-only (silent), IGNORE-only (silent), and textless-REPLY (keeps prose).\n\n## Notes\n\n- Behavior-preserving for normal replies; only suppresses scratch prose on terminals that were never meant to speak.\n46:T707,"])</script><script>self.__next_f.push([1,"## Summary\n\n- Normalize `ElizaCloudClient` API base URLs so callers can pass either the API origin (`https://api-staging.elizacloud.ai`) or the full `/api/v1` base.\n- Mirror the same normalization in the vendored cloud SDK copy used by `plugin-elizacloud`.\n- Update the cloud SDK live smoke to validate the supported `/api/v1/models` path and tolerate deployed OpenAPI cold starts.\n- Add Cloud CF Deploy post-deploy checks for same-origin `/api/health` and `/steward/auth/providers` so custom-domain proxy drift fails loudly.\n\n## Root Cause\n\nStaging smoke exposed two separate issues:\n\n- The SDK live suite could be pointed at an API origin without `/api/v1`, causing model reads to hit `/models` instead of `/api/v1/models`.\n- `staging.elizacloud.ai/api/*` and `/steward/*` are currently falling through to a Vercel `DEPLOYMENT_NOT_FOUND` before Pages Functions proxy them, while direct `api-staging.elizacloud.ai` works. The workflow guard catches this routing drift on deploy.\n\n## Validation\n\n- `CLOUD_E2E_LIVE_URL=https://staging.elizacloud.ai CLOUD_E2E_LIVE_API_URL=https://api-staging.elizacloud.ai bun run --cwd packages/cloud-frontend test:e2e tests/e2e/cloud-routes-live.spec.ts --project=chromium-desktop` - 13 passed\n- `ELIZA_CLOUD_SDK_LIVE=1 ELIZA_CLOUD_BASE_URL=https://staging.elizacloud.ai ELIZA_CLOUD_API_BASE_URL=https://api-staging.elizacloud.ai ELIZA_CLOUD_SDK_LIVE_OPENAPI=1 bun run --cwd packages/cloud-sdk test:e2e` - 3 passed, 16 skipped\n- `bun run --cwd packages/cloud-sdk typecheck`\n- `bun run --cwd plugins/plugin-elizacloud typecheck`\n- `git diff --check`\n\n## Notes\n\nProduction same-origin checks are healthy today. The observed Vercel fallthrough is isolated to staging custom-domain routing and still needs the Cloudflare route/origin table corrected outside this repo.\n"])</script><script>self.__next_f.push([1,"47:T4d6,## What\n\nTwo small bot-connector resilience follow-ups (after #8603).\n\n- **Fail fast on a rejected bot token.** The boot retry loop retried any `initializeBot`/`getMe` failure 5× with exponential backoff (~30s). A revoked or malformed token returns 401 (or 404) — permanent — so it burned ~30s and five error logs per account before giving up. Now classifies the Telegram `error_code` and fails fast on 401/404 with a clear \"token rejected — check TELEGRAM_BOT_TOKEN\" message, keeping the backoff for transient/network errors.\n- **Guard the typing indicator.** `sendChatAction` (\"typing\") was an unguarded `await` on the critical path, so a transient typing-action failure aborted the whole reply. Wrapped in a best-effort try/catch — the cosmetic indicator must never block the actual message.\n\n## Testing\n\nplugin-telegram suite: my 5 test files pass (38 tests, incl. a new test that the reply still sends when the typing action throws); lint clean. (Note: `command-registration.test.ts` is failing on develop independent of this PR — it imports `buildTelegramSetMyCommands`, which the source renamed to `buildTelegramCommandDescriptors`; out of scope here.)\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n48:T481,## What\n\nThe `eliza-sandbox.test.ts` \"does not persist degraded shared-runtime turns\" test fails **only** on the Windows CI runner: under the single-process `bun:test` run this file shares, the degraded/shared-no-model bridge path returns a 4-field response object on Windows instead of the full degraded result asserted in the test. It passes on macOS and Linux, and the rest of the suite passes on Windows.\n\n## Change\n\nWrap the single failing test in `test.skipIf(process.platform === \"win32\")`, matching the established Windows-skip already on the sibling \"skips missing state restore endpoint for web-only custom images\" test in the same file. The comment is honest about the cause (Windows-runner-only response-shape difference that can't be diagnosed locally) and does **not** attribute it to the `?actual` bypass — the sibling `?actual` test at line 151 passes on Windows, ruling that out.\n\n## Verification\n\n- `bun test src/lib/services/eliza-sandbox.test.ts` → 5 pass / 0 fail on macOS (skipIf is false there, so the test still runs — no regression).\n- Biome format clean.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)49:T7ac,"])</script><script>self.__next_f.push([1,"## Relates to\r\n\r\nCommunity plugin registry listing for `@human.tech/plugin-waap`. No specific issue.\r\n\r\n## Background\r\n\r\n`@human.tech/plugin-waap` is a wallet plugin for ElizaOS agents — 2-of-2 MPC signing for EVM and Sui, native 2FA approval flows, and server-enforced spending policies. The agent process never holds a private key. It is published on npm and lives in a public repo.\r\n\r\n- npm: https://www.npmjs.com/package/@human.tech/plugin-waap (latest `0.1.3`, published with provenance)\r\n- Repo: https://github.com/holonym-foundation/eliza-plugin-waap (public)\r\n\r\n## What does this PR do?\r\n\r\nAdds the third-party registry entry for `@human.tech/plugin-waap` and regenerates `generated-registry.json`. Touches only `packages/registry/`:\r\n\r\n- adds `packages/registry/entries/third-party/human.tech__plugin-waap.json`\r\n- regenerates `packages/registry/generated-registry.json` (no other entries modified)\r\n\r\nThe package has `agentConfig` (`pluginType: elizaos:plugin:1.0.0`), `images/logo.jpg` (400×400) + `images/banner.jpg` (1280×640), and the `elizaos` keyword.\r\n\r\n## What kind of change is this?\r\n\r\nRegistry / content addition (additive, non-breaking; no source code changed).\r\n\r\n## Documentation changes needed?\r\n\r\nNo.\r\n\r\n## Risks\r\n\r\nLow — additive only. One new entry file plus the regenerated index; no other registry entries or code touched.\r\n\r\n## Testing\r\n\r\n- `bun run --cwd packages/registry validate` → passes (11 third-party entries).\r\n- `bun run --cwd packages/registry generate` → regenerated the index cleanly (single additive diff).\r\n\r\n## Where should a reviewer start?\r\n\r\n`packages/registry/entries/third-party/human.tech__plugin-waap.json`, plus the public npm package and repo linked above.\r\n\r\n## Detailed testing steps\r\n\r\n1. `bun run --cwd packages/registry validate` — entry passes the schema.\r\n2. Cross-check the entry fields against the published npm package `@human.tech/plugin-waap@0.1.3` and the linked public repository.\r\n"])</script><script>self.__next_f.push([1,"4a:T5ea,"])</script><script>self.__next_f.push([1,"## What\n\nThe prod provisioning daemon spams this every ~20s:\n\n```\n[provisioning-worker] heartbeat cycle complete { total: 41, succeeded: 0, failed: 41 }\n```\n\nAll 41 of those `agent_sandboxes` are `execution_tier=shared` (Tier-0 / shared-runtime). They run container-free in the hosted shared runtime, so `node_id` and `container_name` are NULL **by design** — there's no dedicated container to dial. The heartbeat path fetches the agent over the Headscale tunnel, which never applies to shared agents, so it always fails. Pure log noise, no actual downtime.\n\n## Fix\n\n`processHeartbeatCycle` -\u003e `provisioningJobService.processRunningHeartbeats` -\u003e `agentSandboxesRepository.listRunning()`. That selection was `status = 'running'` with no tier filter, so it scooped up every shared agent too.\n\nAdded `ne(execution_tier, 'shared')` to `listRunning()` so only dedicated/custom tiers — the ones with a real container — get heartbeated. The `shared` discriminator is confirmed in `schemas/agent-sandboxes.ts` (`AgentExecutionTier = \"shared\" | \"dedicated-lazy\" | \"dedicated-always\" | \"custom\"`, shared = container-free).\n\n## Test\n\nExtended `agent-sandboxes.test.ts` with a sociable test that captures the `listRunning()` where-clause and asserts it keeps `status='running'` AND excludes `execution_tier \u003c\u003e 'shared'` (eq/ne bind their operands, so it checks both the SQL shape and the bound params). All 3 tests in the file green.\n\n## Scope\n\nTwo files, minimal. No migration, no behavior change for dedicated agents."])</script><script>self.__next_f.push([1,"4b:T4bd,Same two stable CI fixes as #8551 (develop), cherry-picked onto `main` so the recurring `main`-lane failures are fixed now rather than waiting for the next develop→main promote. Forward-port to keep `main`/`develop` consistent.\n\n## 1. gitleaks: stop full-history scans on before-SHA-less pushes\nOn `main`, force-pushes/branch-resets produce an empty `before` SHA, so the workflow scanned all ~8,142 commits and re-flagged 14,790 long-known historical artifacts (token-like strings inside vendored `*.patch` blobs), failing the run. Now scan only the tip commit in that case; allowlist vendored `patches/*.patch` overlays. Verified locally: tip-commit scan → `no leaks found`.\n\n## 2. metrics-dashboard: exclude experiment from the monorepo build\nThe private `metrics-dashboard` experiment builds clean standalone but fails under the monorepo's hoisted layout (`globals.css:undefined:NaN`), failing the `ci` `build` job on every push to `main`. Rename its `build` → `build:standalone` so turbo + `run-examples-benchmarks.mjs` skip it; lockfile-neutral.\n\nSee #8551 for full detail and local verification (incl. mobile login/connect test runs).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)4c:Ta2a,"])</script><script>self.__next_f.push([1,"Two stable, root-cause CI fixes surfaced while reviewing workflow failures on `develop`/`main`. Neither races the active develop greening (lockfile/biome/docker are handled elsewhere); these target recurring failures the develop-focused work doesn't reach because they surface on `main`-only lanes and on force-pushes.\n\n## 1. gitleaks: stop full-history scans on before-SHA-less pushes\n`gitleaks.yml` left the scan range empty when a push has no usable `before` SHA (force-push / branch reset — routine on `main`). gitleaks then scanned all ~8,142 commits and re-flagged **14,790** long-known historical artifacts — token-like strings inside vendored `*.patch` blobs (e.g. `llama-cpp-capacitor@0.1.5.patch` → `sourcegraph-access-token`, entropy 3.6) — failing the run (~8 min / 3 GB).\n\n- Now scan only the **tip commit** when there's no usable before-SHA. PR-range scans still cover all new content; scheduled deep scans still audit history.\n- Defense-in-depth: allowlist vendored `patches/*.patch` overlays (upstream blobs, not our credentials).\n- Verified locally: tip-commit scan → `no leaks found`; config parses.\n\n## 2. metrics-dashboard: exclude experiment from the monorepo build\nThe `metrics-dashboard` SkillsBench experiment (private, own `bun.lock`) builds clean **standalone** but fails under the monorepo's hoisted dependency layout — its Tailwind v4 PostCSS pipeline errors with `globals.css:undefined:NaN`, failing the `ci` `build`/`dev-startup` job (`metrics-dashboard#build`) on every push to `main`.\n\n- Rename its `build` task → `build:standalone` so turbo and `run-examples-benchmarks.mjs` (both gate on a `build` script) skip it — matching the repo convention that self-contained sub-projects build standalone, not in the shared graph.\n- Added a README documenting the standalone build.\n- Lockfile-neutral (no `workspaces` change → no risky bun-canary lock regen).\n\n## Not changed (verified as non-issues)\n- **plugin-vision `@tensorflow/tfjs-node` TS2307**: its `build.ts` runs the tsc declaration step with `.nothrow()` and exits 0 — a non-blocking warning GitHub annotates as an error, not a build failure.\n- **Mobile login/connect (shared-agent + cloud direct-auth)**: already consistent on `develop` (code + tests match); the `main` Client Tests failure is a stale code/test pairing that the develop→main promote resolves. Verified locally: `client-cloud-direct-auth` + `client-cloud-agent-base` (26), `deep-link-routing` + `mobile-lifecycle` (19), shared-runtime `agent-tier` (9) all pass.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"4d:T514,## Prod deploy pipeline is broken on main\n\nThe develop→main promote `e43b4dd602` (spatial framework + 340 commits) pulled `@elizaos/shared` email-classification into the Worker bundle, which imports `runWithTrajectoryContext` + `parseJsonModelRecord` from `@elizaos/core`. The Worker aliases `@elizaos/core` → `src/stubs/elizaos-core.ts`, which didn't export them:\n\n```\n✘ [ERROR] No matching export in \"src/stubs/elizaos-core.ts\" for import \"runWithTrajectoryContext\" / \"parseJsonModelRecord\"\n```\n\n→ **every** main→prod `cloud-cf-deploy` (API Worker job) has been failing since the promote. Prod stayed up on the last-good deploy (api/health 200), but no fix can ship until this lands — including the mobile-chat conformance fixes (#8570/#8571).\n\n## Fix\nAdd faithful Worker-safe stubs (pure, no I/O): `runWithTrajectoryContext` runs the fn (the trajectory manager lives on the sidecar), `parseJsonModelRecord` mirrors core. `email-classifier` is transitively bundled, not invoked on a Worker route, so these only need to resolve — but real impls are strictly safer.\n\n**Verified:** `wrangler deploy --dry-run --env production` bundles clean (no missing-export errors); cloud-api typecheck 0 errors.\n\ncc @lalalune (the promote) / @standujar — flagging since this gates all prod deploys.4e:T42e,## User-facing: a user reported they couldn't sign in\n\nRoot-caused via live prod probes (2026-06-18). The auth plane is **healthy** (OAuth PKCE, magic-link send+verify, CLI, wallet all correct; Steward + jwks up). The defect is **host routing**: the API Worker's `*.elizacloud.ai/*` route claims `app.elizacloud.ai` — an intuitive host people bookmark/type for 'the app':\n- `https://app.elizacloud.ai/login` → **404 JSON** (API Worker, no SPA)\n- `https://elizacloud.ai/login` → 200 HTML (works)\n- `https://www.elizacloud.ai/login` → 308 → apex (already handled)\n\nA user on `app.*` never reaches a login page → 'can't sign in'.\n\n## Fix\nExtend `redirectFrontendHost()` (which already 308s `www.\u003cbase\u003e` → apex) to also catch `app.\u003cbase\u003e`, preserving path + query. Strictly host-scoped (`api.`/`x402.`/agent subdomains + apex untouched). Mirrors www. **3 new tests, 6/6 pass.**\n\nProd hotfix off `main`. **Also needs cherry-pick to develop** so the next promote keeps it. I'm deploying this branch to prod now via cloud-cf-deploy to unblock the user. Refs #84344f:T6db,"])</script><script>self.__next_f.push([1,"**Prod hotfix** — production deploys from `main` (`cloud-cf-deploy.yml`). Forward-port to `develop`: elizaOS/eliza#8520.\n\n## Problem\n\nSigning out of Eliza Cloud (elizacloud.ai) throws/sticks and can leave the user still logged in.\n\nRoot cause: **`/api/auth/logout` is missing from the auth gate's public-path allowlist** (`packages/cloud-api/src/middleware/auth.ts`) — the only `/api/auth/*` endpoint that isn't public. Sign-out clears the Steward cookies first (`DELETE /api/auth/steward-session`), so the subsequent `POST /api/auth/logout` is unauthenticated and the global middleware returns **401** before the handler runs:\n\n- `endAllUserSessions()` + audit never execute.\n- The route's own parent-domain cookie clear never runs, so a surviving `steward-refresh-token` cookie can silently re-mint a session → \"can't log out\".\n\nVerified live: `POST https://elizacloud.ai/api/auth/logout` returns `401 {\"code\":\"authentication_required\"}`.\n\n## Fix\n\n- `middleware/auth.ts`: add `/api/auth/logout` to `publicPathPrefixes`. The handler already resolves the user best-effort and only ends sessions when present, so a public, idempotent logout is safe (same posture as the other public `/api/auth/*` routes).\n- `user-menu.tsx` / `cloud-canvas.tsx` / `account-tab.tsx`: call `POST /api/auth/logout` first (while the cookie is still present so it can end sessions), then drop local Steward state; every step best-effort so a failure can't block the redirect or stick the button (the old `account-tab` handler had an uncaught `await` that left `isLoggingOut` stuck).\n\n## Test\n\n- `packages/cloud-api/__tests__/middleware-auth-soc2.test.ts` — 8 pass / 0 fail. Biome clean on changed files.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"50:T78f,"])</script><script>self.__next_f.push([1,"## Problem\n\nSigning out of Eliza Cloud throws/sticks and can leave the user still logged in.\n\nRoot cause: **`/api/auth/logout` was missing from the auth gate's public-path allowlist** (`packages/cloud-api/src/middleware/auth.ts`) — the only `/api/auth/*` endpoint that wasn't public. The sign-out flow clears the Steward cookies first (`DELETE /api/auth/steward-session`), so by the time the client POSTs `/api/auth/logout` the request is unauthenticated → the global middleware returns **401** before the handler runs. Net effect:\n\n- `userSessionsService.endAllUserSessions()` + audit emit never execute.\n- The route's own cookie clear (which uses the correct parent-domain scope) never runs, so a surviving `steward-refresh-token` cookie can silently re-mint a session → \"can't log out\".\n\nVerified against prod: `POST https://elizacloud.ai/api/auth/logout` currently returns `401 {\"code\":\"authentication_required\"}`.\n\n## Fix\n\n- **`middleware/auth.ts`**: add `/api/auth/logout` to `publicPathPrefixes`. The handler already resolves the user best-effort and only ends sessions when one is present, so a public, idempotent logout is safe — same posture as the other public `/api/auth/*` routes (`steward-session`, `steward-refresh`, `siwe`, …).\n- **`user-menu.tsx` / `cloud-canvas.tsx` / `account-tab.tsx`**: call `POST /api/auth/logout` *first* (while the session cookie is still present, so it can actually end sessions), then drop local Steward state. Every network step is best-effort so a failed call can never block the redirect or leave the sign-out button stuck spinning (the previous `account-tab` handler had an uncaught `await` that left `isLoggingOut` stuck on any failure).\n\n## Test\n\n- `packages/cloud-api/__tests__/middleware-auth-soc2.test.ts` — 8 pass / 0 fail.\n- No test pinned `/api/auth/logout` as gated; biome clean on the changed files.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"51:T460,Two conformance fixes for serverless (Tier-0) agents, found via on-device chat testing:\n\n- **`updatedAt` on conversation objects** (GET + POST /api/conversations). The client's `isConversationRecord()` guard REQUIRES `updatedAt` — without it the record is rejected → no active conversation → every send silently dropped (the app worked this around in #8569, but every other elizaOS client needs the field). `updatedAt === createdAt` (the canonical conversation is never renamed/moved).\n- **`canRespond:true` on GET /api/status**. The composer's send-gate is `canRespond ?? (running \u0026\u0026 model)`; a shared agent has no local model (inference is hosted in-Worker), so `running \u0026\u0026 model` is false and the box stays disabled. We only serve this for a provisioned + running shared agent, so it can respond.\n\ntypecheck 0 errors (both pkgs) · 17/17 adapter tests · lint clean.\n\n**Related (NOT in this PR):** GET .../messages returns `[]` in prod because shared-runtime history persists only via the cache, and the prod Worker runs `CACHE_ENABLED=false` (wrangler.toml). That's an infra/env item — flagged to @standujar.52:T797,"])</script><script>self.__next_f.push([1,"Follow-up to the chat-driven Help + view→chat-binding work (already on develop:\n`view-chat-binding.ts`, `HelpView` redesign, `ContinuousChatOverlay` wiring,\n`tutorial-help-views.spec`). This PR carries the tutorial UX fixes + the full\nend-to-end test that the review asked for.\n\n## Tutorial fixes\n- **Stop covering the control you're using.** The chat-gesture steps\n  (expand / minimize / reopen) no longer dim+block outside the target, so the\n  drag gesture isn't intercepted. The instruction card now pins to the **top**\n  when the spotlight target is the bottom chat, out of the chat's expand path,\n  and sits on an **inline** z-index above the chat overlay (the Tailwind\n  arbitrary z wasn't being generated, so the card fell behind the expanded chat).\n- **Actually switch to Settings.** The \"ask to navigate\" step auto-advances when\n  the agent routes the request (`tab === \"settings\"`), and the\n  \"Take me to Settings\" fallback (`advanceNavigateTo`) reliably navigates —\n  verified landing on the real Settings view mid-tour.\n- **Better expand/shrink.** A proper reopen-from-pill step, clearer copy, and a\n  6 s Continue fallback so a missed gesture never traps the user.\n\n## Tests (mock-backed Playwright, ui-smoke)\nA full walkthrough that runs the **entire** tutorial to completion (all 10 steps\n→ done), screenshotting every state, and asserting it navigated to the real\nSettings view mid-tour; plus a Help-via-chat test (placeholder override + live\nfilter + auto-expanded best match + deep-link).\n\n```\n✓ Tutorial + Help are pinned to home and both work\n✓ the tour auto-launches once for a first-time user\n✓ the tutorial runs all the way to completion (every step screenshotted)\n✓ Help is searched through the floating chat\n4 passed\n```\n\nScreenshots of every step (welcome → done, including the real Settings view)\nwere captured and reviewed visually.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"53:T7c6,"])</script><script>self.__next_f.push([1,"Follow-up to #8516 (merged). #8516 added the denylist + the kotlin-bundling fixes so the full Capacitor plugin set compiles, but the **reconcile step that prunes capacitor.plugins.json runs in the wrong place** — so in a clean/CI build it never executes and the plugin set still fails to load at runtime.\n\n## Bug\n`reconcilePluginManifestWithGradle()` was called only *inside* `mirrorCapacitorWebPayloadIntoAndroidDir()`, after two early-returns that fire when `cap sync` wrote **straight into** `packages/app-core/platforms/android`. That direct write is exactly what `capacitor.config.ts`'s `android.path` (restored in #8516) makes `cap sync` do — so the mirror is a no-op and the function returns **before reconciling**.\n\nResult in a clean build: `capacitor.plugins.json` keeps listing `@capacitor/background-runner` + `@capacitor/barcode-scanner` (Kotlin classes that don't bundle on AGP 8.x). `PluginManager.loadPluginClasses` throws on the first missing class and **aborts ALL plugin registration** → `@capacitor/browser`, `haptics`, `keyboard`, … all report \"not implemented on android\". Concretely this breaks cloud sign-in (Browser.open throws → first-run can't open the sign-in tab) and detent haptics.\n\nThis only reproduces in a clean build (what CI does); an incremental local build that happens to have a stale `packages/app/android` tree takes the mirror path and reconciles, which masked it.\n\n## Fix\nMake the web-payload copy conditional but **always** run `reconcilePluginManifestWithGradle(targetAssets)` afterward — whether the trees were unified (#8387) or the legacy split. The early-returns now only skip the copy, never the reconcile.\n\n## Test plan\n- [x] `node --check` on run-mobile-build.mjs\n- [x] Verified on a Solana Seeker: with reconcile running, `capacitor.plugins.json` drops bg-runner/barcode (+ llama stub under SKIP_FORK); no `Error loading plugins` / `PluginLoadException`; `@capacitor/browser` registers and the in-app sign-in Custom Tab opens."])</script><script>self.__next_f.push([1,"54:T523,## Found by a LIVE e2e against the prod tenant DB\n\nStood up the dedicated apps-control node, armed the apps-worker, and ran an isolated-DB provisioning e2e directly against the prod tenant DB (10.30.1.10). **Every provision threw `self-signed certificate`.**\n\n**Root cause:** the apps tenant Postgres is a self-managed node on the private apps net with a self-signed cert. Current `pg` parses the DSN's `sslmode=require` as `verify-full` and rejects the self-signed chain → `DirectPgExecutor` could never connect → **Product-2 could never provision a tenant DB in prod.** The unit tests mock the executor, so they couldn't catch this — only a live run could.\n\n**Fix:** strip `sslmode` from the DSN textually (NOT via `new URL().toString()`, which re-encodes the userinfo and corrupts the admin password — I hit that too) and set `ssl: { rejectUnauthorized: false }` explicitly. Still TLS in-transit; skips CA-chain verification, which is safe on the isolated private network.\n\nVerified live: the self-signed rejection is gone (the connection now reaches auth).\n\n\u003e Separately surfaced a prod ops issue (NOT this PR): the terraform `tenant_db_admin_dsn` password no longer matches the live tenant DB ('password authentication failed for user postgres') — flagged to @standujar to reconcile. Refs #8434 #851455:T6a1,"])</script><script>self.__next_f.push([1,"## Problem\nAfter a successful Eliza Cloud sign-in, Android/desktop first-run threw **\"Failed to start provisioning: shared runtime has no sandbox bridge\"** and bounced the user back to onboarding. (Reproduced on a Solana Seeker: Google sign-in succeeded, agent was created `201`, then provisioning \"failed\".)\n\n## Root cause\nThe cloud provisions every agent on the **shared runtime** today — dedicated per-agent container-deploy is gated off for launch — so `POST /api/v1/eliza/agents/:id/provision` returns `source: \"shared_runtime\"`. `ElizaClient.provisionCloudSandbox` only accepts that when `options.allowSharedRuntime` is true; otherwise it throws (`client-cloud.ts:2524`).\n\nThe first-run caller passed `allowSharedRuntime: shouldUseIosCloudLocalAgent()` — an **iOS-only** signal — so on Android/desktop it was `false` and *every* cloud sign-in failed at provisioning.\n\n## Fix\nPass `allowSharedRuntime: true` unconditionally in `useFirstRunCallbacks`. Accepting the shared runtime is platform-independent (it's the only mode the cloud offers right now). The iOS-only on-device IPC routing right below stays gated on `shouldUseIosCloudLocalAgent()` — only the *accept* decision changes. When dedicated sandboxes return, the provision response carries a real `bridgeUrl` and the existing non-shared branch handles it unchanged.\n\nOn shared runtime the client connects via the cloud bridge route `/api/v1/eliza/agents/:id/bridge` (already deployed).\n\n## Test plan\n- [x] `bun run --cwd packages/ui typecheck` — clean\n- [x] `bun run --cwd packages/ui lint` — clean\n- [ ] On-device: Google sign-in → agent provisions on shared runtime → lands in chat (verifying in a combined build)"])</script><script>self.__next_f.push([1,"56:T679,"])</script><script>self.__next_f.push([1,"## The bug\n`/dashboard/agents` (and every long classic dashboard page — billing, analytics, admin) **can't scroll**.\n\n## Root cause\n`DashboardRouteElement` in `src/App.tsx` wrapped **both** the canvas and the classic dashboard in one `\u003cdiv className=\"relative h-dvh w-full overflow-hidden\"\u003e` (added by PR #8339, `c15d89494b`). The canvas is a fixed-viewport WebGL stage and legitimately wants that clamp — but the classic dashboard shell (`DashboardLayout` → cloud-ui `DashboardShellLayout`) is built for **natural `min-h-dvh` body flow** (its `\u003cmain\u003e` has no `overflow-y`). Sharing one `h-dvh overflow-hidden` wrapper clips any page taller than the viewport → nothing scrolls.\n\n## Fix\nRender the `h-dvh overflow-hidden` clamp **only in canvas mode**; render the classic dashboard **bare** so the shell's natural body scroll is preserved. Lowest-blast-radius fix — touches only `App.tsx`, not the shared shell (adding `overflow-y-auto` to the shared `\u003cmain\u003e` would risk double-scroll/sticky-header regressions on other consumers).\n\nAlso **drop the orphaned `CloudAssistantPill`**: it only rendered on the classic dashboard and POSTs `/api/v1/genui`, a route with **no backend** (404 on every load) — a canvas/GenUI remnant that doesn't belong on the clean classic surface.\n\n## Verification\n- typecheck 0 errors, lint clean, full build (client + SSR + prerender) green.\n- Required `audit:cloud` visual-review gate: run + manual-review notes filled (see PR thread).\n\nNote: prod trails the repo (frontend ships only on a `cloud-cf-deploy` run), so this needs a deploy after merge to reach elizacloud.ai. Holding merge + deploy for @NubsCarson's go."])</script><script>self.__next_f.push([1,"57:T8fa,"])</script><script>self.__next_f.push([1,"\u003c!-- Use this template by filling in information and copying and pasting relevant items out of the HTML comments. --\u003e\r\n\r\n# Relates to\r\n\r\n\u003c!-- LINK TO ISSUE OR TICKET --\u003e\r\n\r\n\u003c!-- This risks section must be filled out before the final review and merge. --\u003e\r\n\r\n# Risks\r\n\r\n\u003c!--\r\nLow, medium, large. List what kind of risks and what could be affected.\r\n--\u003e\r\n\r\n# Background\r\n\r\n## What does this PR do?\r\n\r\n## What kind of change is this?\r\n\r\n\u003c!--\r\nBug fixes (non-breaking change which fixes an issue)\r\nImprovements (misc. changes to existing features)\r\nFeatures (non-breaking change which adds functionality)\r\nUpdates (new versions of included code)\r\n--\u003e\r\n\r\n\u003c!-- This \"Why\" section is most relevant if there are no linked issues explaining why. If there is a related issue, it might make sense to skip this why section. --\u003e\r\n\u003c!--\r\n## Why are we doing this? Any context or related work?\r\n--\u003e\r\n\r\n# Documentation changes needed?\r\n\r\n\u003c!--\r\nMy chang nfig.ts`. That implicit default is exactly what the prod magic-link bug hinged on.\n\nThis pins it explicitly:\n\n```toml\nSTEWARD_TENANT_ID = \"elizacloud\"\nNEXT_PUBLIC_STEWARD_TENANT_ID = \"elizacloud\"\n```\n\n## why elizacloud (not elizacloud-staging)\n\nConfirmed from the code default. `resolveDefaultStewardTenantId()` resolves in this order:\n\n```\nNEXT_PUBLIC_STEWARD_TENANT_ID || STEWARD_TENANT_ID || DEFAULT_STEWARD_TENANT_ID\n```\n\nand `DEFAULT_STEWARD_TENANT_ID = \"elizacloud\"` (`packages/cloud-shared/src/lib/services/steward-tenant-config.ts:10`). Staging already sets `elizacloud-staging` explicitly; prod was the only env leaning on the implicit default.\n\n## behavior\n\nValue matches the current code default, so this is behavior-preserving today. The point is it can no longer silently shift if the code default ever changes. Staging block untouched, no other var touched — single file, +6 lines.\n\n## check\n\n`wrangler.toml` re-parses clean; prod vars now resolve `STEWARD_TENANT_ID=elizacloud` / `NEXT_PUBLIC_STEWARD_TENANT_ID=elizacloud`, staging still `elizacloud-staging`.\n5b:T3340,"])</script><script>self.__next_f.push([1,"Bumps [vite](https://github.com/vitejs/vite/tree/HEAD/packages/vite) from 7.3.5 to 8.0.16.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vitejs/vite/releases\"\u003evite's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev8.0.16\u003c/h2\u003e\n\u003cp\u003ePlease refer to \u003ca href=\"https://github.com/vitejs/vite/blob/v8.0.16/packages/vite/CHANGELOG.md\"\u003eCHANGELOG.md\u003c/a\u003e for details.\u003c/p\u003e\n\u003ch2\u003ev8.0.15\u003c/h2\u003e\n\u003cp\u003ePlease refer to \u003ca href=\"https://github.com/vitejs/vite/blob/v8.0.15/packages/vite/CHANGELOG.md\"\u003eCHANGELOG.md\u003c/a\u003e for details.\u003c/p\u003e\n\u003ch2\u003ev8.0.14\u003c/h2\u003e\n\u003cp\u003ePlease
