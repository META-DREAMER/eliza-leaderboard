a\":{\"actionName\":\"VIEWS\",\"viewId\":\"help\",\"action\":\"split-view\"}},\n \"toolCallsExecuted\":1,\"toolCallFailures\":0}\n```\n\nPlanner action surface for the turn (`tierAParents:[\"VIEWS\"]`, `REPLY` omitted):\n\n```\nmode=tiered candidateActions=[\"VIEWS\"] tierAParents=[\"VIEWS\"]\nomittedParentNamesPreview=[...,\"REPLY\",...]\n```\n\nResult on Discord: **no message is sent** — `VIEWS` only navigates the desktop dashboard, which a Discord-only user never sees.\n\nContrast: an unambiguous text question (`\"what is 2+2, are you online?\"`) correctly replies via the fast path (`\"Two plus two is four, and yes I'm online.\"`), so the pipeline is healthy — this is specifically about `VIEWS` being offered/selected on text connectors.\n\n## Root cause\n\n`plugins/plugin-app-control/src/actions/views.ts` — read-mode `validate()` returns `true` unconditionally:\n\n```ts\n// Read modes are visible to all users.\nreturn true;\n```\n\nThere is no check for whether the message's connector has a live view surface for that user. So `VIEWS` is always a planner candidate, even on a pure text deployment where the action can only ever be a no-op for the asker.\n\n## Why it matters\n\n`VIEWS` selected as the **sole/terminal** action on a text-connector turn is a silent non-answer. The runtime records `verifiedUserFacing: true` (because the desktop got a view), so it looks like a successful turn while the chat user received nothing.\n\n## Nuance (why this isn't a one-line gate)\n\nThere's a legitimate desktop-companion case: an owner chatting via Discord may *also* have the desktop dashboard open, so navigating their view is meaningful. The framework can't easily know \"is this user looking at a view surface right now.\" So the fix isn't simply `return false` for text connectors.\n\n## Proposed approaches (for discussion)\n\n1. **Gate on a real view-surface signal** — `VIEWS.validate()` returns `false` unless the runtime can confirm an attached view surface for the session (dashboard/desktop client connected), rather than assuming one exists.\n2. **Never let `VIEWS` be terminal on a text connector** — when the chosen action is `VIEWS` and the message arrived via a text connector, require it to be paired with a `REPLY` (the view nav becomes a side effect, the text answer is still delivered).\n3. **Connector-capability tiering** — exclude desktop-only actions (`VIEWS`, `CLOSE_VIEW`, `CLOSE_ALL_VIEWS`, `HOMESCREEN`) from the planner action surface for connectors that declare no view capability.\n\nApproach 2 is the most behavior-preserving (keeps view-switching where a surface exists, guarantees the chat user always gets an answer). Happy to implement whichever direction maintainers prefer.\n\n## Environment\n\n- Live self-hosted agent on `develop` @ `36f7877267`, Discord + Matrix connectors, `plugin-app-control` loaded.\n- Reproduced 2026-06-18.\n"])</script><script>self.__next_f.push([1,"15:T8fa,"])</script><script>self.__next_f.push([1,"\u003c!-- Use this template by filling in information and copying and pasting relevant items out of the HTML comments. --\u003e\r\n\r\n# Relates to\r\n\r\n\u003c!-- LINK TO ISSUE OR TICKET --\u003e\r\n\r\n\u003c!-- This risks section must be filled out before the final review and merge. --\u003e\r\n\r\n# Risks\r\n\r\n\u003c!--\r\nLow, medium, large. List what kind of risks and what could be affected.\r\n--\u003e\r\n\r\n# Background\r\n\r\n## What does this PR do?\r\n\r\n## What kind of change is this?\r\n\r\n\u003c!--\r\nBug fixes (non-breaking change which fixes an issue)\r\nImprovements (misc. changes to existing features)\r\nFeatures (non-breaking change which adds functionality)\r\nUpdates (new versions of included code)\r\n--\u003e\r\n\r\n\u003c!-- This \"Why\" section is most relevant if there are no linked issues explaining why. If there is a related issue, it might make sense to skip this why section. --\u003e\r\n\u003c!--\r\n## Why are we doing this? Any context or related work?\r\n--\u003e\r\n e public Matrix identifiers as plain settings, not redacted secrets.** Homeserver URL, user/room/device ids, the verify-allowlist, and behaviour flags are public — only the access token / password / accounts-JSON stay secret. (A public id placed in secrets gets blanked out of all output, e.g. a rendered room name.)\n\n## Testing\n\n- Unit tests added/updated: secret↔settings boundary, crypto-store snapshot round-trip, connector role derivation, crypto-init hardening (typecheck + build + tests green).\n- Verified end-to-end on a Continuwuity homeserver: a cross-signed device decrypts a strict-isolation (`OnlySignedDevicesIsolationMode`) sender's message, and a non-cross-signed control does **not** — confirming cross-signing is the causal unlock.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"1f:T84e,"])</script><script>self.__next_f.push([1,"Two new views pinned to the home screen (**Tutorial first**, **Help** next) so anyone can learn how Eliza's UI works and find answers when confused.\n\n## Tutorial — interactive guided tour (text + voice)\n- A persistent **spotlight overlay** (a portal that survives navigation — it sends the user to Settings and back) that points a **breathing orange glow** at the exact next control and **blocks every other one** (a dim backdrop with a hole only at the target = the \"block wrong action\" gate).\n- **Checks each action and auto-advances** the instant the user does it right — chat open/expand/minimize via DOM detents, view switches via the current tab. Every step also has a **timed Continue fallback** so a missed detection never traps the user.\n- **Voice mode** narrates each step via the browser speech API; spoken commands go through the real chat mic and the tour detects the outcome. One-tap voice/text toggle.\n- Steps: welcome → open chat → expand → minimize → switch view by typing → see Settings → switch by voice → find Help → done. Launched from the home tile (re-runnable any time).\n\n## Help — searchable FAQ / knowledge base\n- 30 entries across 9 categories: what Eliza is, the chat, navigation, models + local inference, privacy/topology, voice, connectors, Eliza Cloud, capabilities, troubleshooting.\n- Client-side fuzzy search + category filter; each answer can **deep-link** straight to the relevant tab / Settings section, or launch the tour.\n\n## Wiring \u0026 verification\n- `HOME_TILES` (the live home screen — note `home-grid-apps.ts` is dead code), App.tsx `directViews` + lazy views + the global `TutorialOverlay` mount, `BuiltinTab` + `TAB_PATHS`.\n- Typecheck clean (ui). Home/nav unit tests pass (10). **Mock-backed Playwright e2e passes** (`tutorial-help-views`): tiles pinned (Tutorial first), launcher → Start → spotlight card \"Step 1 of…\", skip works, Help searches + deep-links.\n\nFollow-ups (not blocking): register as builtin views for Views-catalog discoverability; optional auto-launch on first run.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"20:Tbc9,"])</script><script>self.__next_f.push([1,"Attacks 5 still-open, in-flight issues. Each fix was investigated against current code first (several originally-reported leaks were already merged via #8401/#8427/#8328/#8322/#8394 and left alone), then implemented in disjoint file scopes. **Rebased cleanly onto `develop` — 6 commits, 14 files, conflict-free.**\n\n## Commits\n- **fix(android) #8387** (`191dfe1eeb`) — clean-tree `build:android` shipped web-less APKs (`ERR_CONNECTION_REFUSED` on device). Develop already had the `mirrorCapacitorWebPayloadIntoAndroidDir` helper in **one** of four android targets and **no** APK audit; this extends the mirror to all 4 sync targets and adds a **positive APK audit** (assert `assets/public/index.html` + `capacitor.config.json` are packaged) so a web-less APK can't ship silently. Integrates with develop's `reconcilePluginManifestWithGradle` step (preserved).\n- **fix(cloud-billing) #8342** (`0924fc2cd8` + test `2e0e1a7531`) — (A) suspended containers were never `docker stop`ped (`--restart unless-stopped` + Worker-can't-SSH) → unbounded free compute; add a `CONTAINER_STOP` provisioning job (Worker enqueues, daemon stops, volume preserved + slot freed) mirroring `APP_DB_DEPROVISION`, plus the `JOB_TYPES` count-lock test bump. (F) `docker create` set `--memory` but no `--cpus`; add `--cpus = cpu/1024` (ECS-style units, floored 0.1) and fix `APP_CONTAINER_DEFAULTS.cpu 1→1024`. B/C/D/E were already merged.\n- **feat(orchestrator) #8124** (`421c6e0506`) — make the orchestrator always behave like `/goal`: when a task with acceptance criteria reaches `validating`, auto-run the existing small-model `verifyGoalCompletion()`. Pass → done; fail → corrective follow-up citing missing criteria, capped at 3 then `waiting_on_user`. Flag `ELIZA_ORCHESTRATOR_AUTO_GOAL_VERIFY` (default on); zero model calls without criteria.\n- **ci(benchmarks) #7836** (`3c001db19c`) — `workflow_dispatch` `hyperliquid-bench-live.yml` consuming `HL_PRIVATE_KEY`, running `validate-runtime-gates` then `hyperliquid_bench` across eliza/hermes/openclaw with `--no-demo` (scorer rejects demo); **skips green without the secret**. Plus testnet docs. Rest is operator-only.\n- **fix(cloud-infra) #8321** (`571ccaa5ef`) — widen docker `default-address-pools` to `10.100.0.0/16` size 24 (256 nets/node, collision-free) in app-node cloud-init; the stock pool exhausts at ~31 `--internal` bridges/node.\n\n## Verification\ntypecheck clean (cloud-shared / cloud-api / plugin-agent-orchestrator), biome clean, orchestrator auto-goal-verify 9/9, JOB_TYPES + provisioning suites green, android `node --check`, YAML/JSON validated. Full CI runs on this PR (conflict-free).\n\n## Issues with no code work (verified, reported only)\n- **#8434** Cloud 10-user launch tracker — operator-only (terraform cutover, staging E2E); all code PRs merged.\n- **#7770** OTA release credentials — workflows already tor test` (rooms-route: 5/5)\n- `bun run --cwd plugins/plugin-local-inference test` (phrase-chunker 10/10,\n  ram-budget-cache 4/4, voice suite 52/52) — all green on the source branch.\n\n\u003e Note: the CoreML Kokoro work from the slice was intentionally **excluded** —\n\u003e develop already carries a more advanced diagnosis (har_source-dead → SineGen\n\u003e cumsum, not iSTFT), so re-landing it would regress develop.\n"])</script><script>self.__next_f.push([1,"22:Tae3,"])</script><script>self.__next_f.push([1,"## Problem\nOn mobile/desktop, signing into Eliza Cloud could strand the app on **\"Backend Unreachable\"** and silently **create a new cloud agent on every sign-in** (one user accumulated 11). Root cause: after direct cloud login the client base was left at the agent‑id‑less control‑plane collection URL (`…/api/v1/eliza/agents`), so every `/api/*` resolved to `…/agents/api/…` and 404'd; and first‑run always provisioned a brand‑new agent instead of reusing one. There was also no in‑app way to see/switch/manage cloud agents.\n\n## Fix\n- **`client-cloud`**: `selectOrProvisionCloudAgent()` — reuse an existing cloud agent (`getCloudCompatAgents`) or create+name a first one; always bind a **valid per‑agent base**. Hardened `resolveCloudAgentApiBase` to derive the per‑agent base from the agent id when the server URL is the id‑less collection, while leaving raw dedicated bridges untouched.\n- **`cloud-agent-base`**: `buildCloudSharedAgentApiBase`, `isCloudAgentsCollectionBase`, `isElizaCloudControlPlaneAgentlessBase` (+ unit tests).\n- **first‑run** (`use-first-run-controller`, `useFirstRunCallbacks`): reuse‑or‑create + persist `cloud:\u003cagentId\u003e` so the next boot restores the same agent. (Builds on @lalalune's `18718004f7` — keeps the stable‑id key, with the reuse path on top.)\n- **`persistence`**: never persist the id‑less collection base as a concrete `apiBase`.\n- **`startup-phase-restore`**: self‑heal a bad/id‑less persisted base by re‑deriving from `cloud:\u003cagentId\u003e`.\n- **`startup-phase-poll`**: an agentless cloud base routes to agent selection, not \"Backend Unreachable\".\n- **settings**: new **\"Agents\"** section (`CloudAgentsSection`) — list / switch / create+name / delete cloud agents in‑app (registered via the pluggable settings registry, so the canonical section catalog/tests are untouched).\n\n## Tier note\nCloud agents are created as **shared (Tier‑0)** for now — the only tier reachable from the app today. The app is **dedicated‑ready** (it already prefers a dedicated agent's public `web_ui_url`); enabling dedicated end‑to‑end is cloud‑side work (deploy the per‑agent subdomain ingress + fix `headscale_ip` registration) tracked on #8434.\n\n## Validation\n- **On‑device (Android, Seeker):** sign‑in → agent → chat works (message round‑trips + persists); no agent churn; the previously‑stuck \"Backend Unreachable\" state now recovers to onboarding; the Agents manager list/switch/create→shared/delete all work with no boot‑hang.\n- `bun run --cwd packages/ui typecheck` ✅, `biome` ✅, **56 unit/controller tests pass** (incl. new `client-cloud-agent-base` cases + updated first‑run controller specs).\n\nCloses the mobile cloud sign‑in gap from the (now‑closed) #8340 line of work."])</script><script>self.__next_f.push([1,"23:T65e,"])</script><script>self.__next_f.push([1,"## What\n\nConnector-awareness and account-policy improvements for the MESSAGE action.\n\n- **`list_connections` operation.** A connector-agnostic roster of every messaging platform the agent is connected to, with per-platform room counts, derived from the live connector registry (`computeConnectionRoster`, shared with any caller). Lets the agent answer \"where am I connected / what chats exist?\" across platforms instead of confabulating about platforms it can't see.\n- **Owner-binding send gate.** A MESSAGE send through an `OWNER` account on the `owner_binding` gate now requires a verified binding (`OWNER_BINDING_REQUIRED` otherwise) — so \"act as the user\" can't fire until the user has proven the account is theirs. Agent-owned (`open`-gate) accounts and source-only routes pass straight through with no added friction.\n- **`evaluatePolicy` fix.** For an explicit `accountId` it read `storage.getAccount` directly, silently missing provider-registered accounts (connectors that expose accounts via `registerProvider` rather than persisting them), so a policy could never resolve them. Now uses the manager-level `getAccount`, consistent with `listAccounts`.\n- **Inline the connector-context render helpers** back into `platformContext` (single consumer; they were never duplicated across files).\n\n## Testing\n\nUnit tests added/updated and green: `list_connections` roster + source-fallback dedup + bounds; the owner-binding gate (blocked-unverified / allowed-verified / agent-never-gated); `evaluatePolicy` provider-account resolution. Core typecheck clean.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"24:T411,Cherry-picks **#8527** (the shared-runtime REST chat adapter — the mobile chat blocker) onto `main` so it's **live on prod**, not just staging.\n\n**Why this is needed:** #8527 merged to develop at 04:04, *after* the 03:10 develop→main promote — so it missed it and was NOT on prod. (A 401 probe is ambiguous — the global auth gate returns the identical `Unauthorized` body for real *and* nonexistent routes — so it can look deployed when it isn't.) Without this, the next Android app build would point the REST chat client at an adapter that doesn't exist on prod → chat 404s.\n\nPure cherry-pick of #8527 (additive: 3 new shared-tier-scoped routes + `webUiUrl` in the shared create/provision responses + the adapter use-case + the public history reader). codegen regenerated clean on main's base (579 mounted, 0 unconverted, no diff), typecheck clean. **Deployed to prod now via cloud-cf-deploy (env=production)** to make it live ahead of the app build.\n\nMerge to `main` to stop git drift (it's already deploying). Refs #8527 #843425:T795,"])</script><script>self.__next_f.push([1,"## The real mobile chat blocker (found by the Seeker device test)\n\nAfter #8522 the app accepts `source:shared_runtime` + provisions the agent (status:running), but **create/provision returned no reachable URL**, and a shared agent runs **in-Worker with no agent server** — only the JSON-RPC bridge, **no `/api/*` REST surface**. The mobile chat client speaks REST (`/api/conversations`, `/api/conversations/:id/messages`) → nothing to target → can't chat. (`resolvePublicWebUiUrl` even returns `null` for shared by design.)\n\n## Fix — a server-side REST adapter (clients unchanged, platform-agnostic)\nMaps the agent-server conversation REST contract onto the existing proven shared primitives (bridge `message.send` + its billing + KV turn-history):\n- **cloud-shared:** `shared-rest-adapter.ts` use-case + `ElizaSandboxService.getSharedConversationHistory()`.\n- **cloud-api routes** under `.../agents/:id/api/`: `health`, `conversations` (GET list / POST create — **one canonical conversation per agent**, id===agentId===roomId, so no index needed), `conversations/:id/messages` (GET history / POST send→bridge→reply). Shared-tier + org-scoped.\n- **Return `webUiUrl = \u003corigin\u003e/api/v1/eliza/agents/:id`** from the shared create + provision branches (no trailing `/api` — the client appends `/api/*`; verified against `rawRequestUrl()=base+path` and the dedicated webUiUrl root shape, which would otherwise double).\n- **client-cloud.ts:** shared provision returns that webUiUrl → `resolveCloudAgentApiBase()` points the REST client at the adapter; bridgeUrl stays as JSON-RPC fallback.\n\n## Tested\nAdapter mapping unit tests 7/7 (canonical conversation, history→REST, send→bridge with roomId, error surface). typecheck + biome clean (cloud-shared/cloud-api/ui). codegen mounted all 3 routes.\n\nShips via `@elizaos/ui` (Android Capacitor build) + the Worker. Land on develop → verify chat on staging → promote. Refs #8434"])</script><script>self.__next_f.push([1,"26:T8ea,"])</script><script>self.__next_f.push([1,"Stop hard-gating the whole UI on full agent readiness. The shell paints as soon as the backend is reached and the agent boot is underway; the agent's ability to respond **fades in behind a live UI** instead of a ~2s full-screen loader. Turns the ~2s runtime boot from dead waiting into overlapped, perceived-instant startup.\n\n## What changed\n\n**P0 — live shell + capability signal**\n- `canRespond` on `/api/health` + `/api/status` (runtime live AND running AND a TEXT handler — distinct from `ready`, which is true even for stopped/no-provider).\n- `isShellPaintable(phase)` + `deriveAgentReady(agentStatus)` selectors; cloud-shared agents report `canRespond:true`.\n- `App.tsx` mounts the live shell + chat overlay when paintable; `StartupScreen` only for pre-shell phases (restore/poll/first-run/pairing/error). Auth gate runs in the paintable window; runtime-dependent effects + overlay apps stay gated on full `ready`.\n\n**P1 — usable warming composer**\n- Composer is editable during warmup (`\"waking up…\"`), not read-only `\"connecting…\"`. Sends go straight through `sendChatText`, so the optimistic user bubble + typing indicator show instantly and the reply streams when capability lands.\n- `ChatView` no longer hard-locks the composer while starting; only a genuinely missing inference provider locks it.\n\n**P2 — server holds the turn (never dropped)**\n- `runtime-ready-gate.ts`: a small, unit-tested gate resolved at the `updateRuntime` \"capability online\" moment.\n- The stream + non-stream `/messages` handlers HOLD a turn through the warming window (early API bind → runtime ready, ~2s, capped 30s) only while `agentState` is starting/restarting; a genuinely stopped agent still 503s fast.\n\n## Verification\n- Typecheck clean (ui + agent).\n- Tests: runtime-ready-gate (4), useShellController (3), ContinuousChatOverlay (42), startup-coordinator + selectors (13) — pass.\n- Not yet done: app-boot visual check of the warming→live transition, and the optional `ChatView` per-message `enterOnMount` fade (the ambient overlay already fades each turn).\n\nDecisions locked with the user: static greeting (capability fades in), optimistic bubble + typing indicator on early send, full P0+P1+P2 scope.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"27:T749,"])</script><script>self.__next_f.push([1,"## Two real-device mobile-chat blockers for shared-runtime (Tier-0) agents\n\nVerified on a Solana Seeker against prod `api.elizacloud.ai`; root-caused against source + live prod.\n\n### 1. Shared agents weren't answering — '… hit a temporary error'\n`runSharedAgentTurn` had its **own private Cerebras-direct client** and sent the agent's `character.model` **verbatim** to `api.cerebras.ai`, which only knows the bare ids `gpt-oss-120b` / `zai-glm-4.7`. An agent seeded with the catalog's recommended `openai/gpt-oss-120b:nitro` → Cerebras 404 → `generateText` throws → degraded fallback. (`glm-4.7` shorthand → 404 + unpriceable → HTTP 500.) Same class as #8450, in a second never-fixed path.\n\n**Fix:** route the turn through the canonical `getLanguageModel()` — the same router `/api/v1/chat/completions` uses. Bare Cerebras ids → Cerebras; everything else → BitRouter. Shared agents now support exactly the models the platform does, with **no bespoke provider client**.\n\n### 2. The mobile app never booted into chat — shell endpoints 404'd\nThe startup-coordinator's **first gate** is `GET /api/status` (must report `state:running` before first-run is even checked). Shared agents served none of the shell endpoints. Adds `GET /api/status`; the catch-all already serves `first-run/status`, `first-run`, `views`, `config`. `/api/views` now honors `?viewType=` (non-`gui` surfaces return an empty list).\n\n### Tests / checks\n- New coverage: `status`, `viewType` filtering, shell defaults; degraded-path test clears the full provider-key set.\n- `typecheck` (cloud-shared + cloud-api) 0 errors; `lint` clean; codegen idempotent — splat `:*{.+}` mounts **last**, after conversations/health/identity/wallet.\n\nPairs with app-side #8529 (targets the adapter base, treats shell-endpoint 404s as first-run-complete). Closes the last mobile-chat blockers."])</script><script>self.__next_f.push([1,"28:T1711,"])</script><script>self.__next_f.push([1,"## What \u0026 why\n\nThe headscale-on-control-plane cutover was, until now, partly **manual on the box** — so a clean CP rebuild (`terraform apply` + the arm workflow) would *not* bring headscale back to a working state. That's a DR gap. This PR closes it for the 3 things that weren't codified.\n\nThe `arm-headscale-control-plane` workflow + `.mjs` already codified: headscale `server_url`/`listen_addr`, the committed ACL install, the daemon `.env.local` headscale keys, and the `agent`/`tunnel` users. The 3 missing pieces — and now reproducible from IaC:\n\n1. **Cloudflare DNS record** `headscale[-staging].elizacloud.ai` → CP ipv4 (`proxied=false`).\n2. **nginx vhost + Let's Encrypt cert** on the CP fronting that hostname → `127.0.0.1:\u003cheadscale-port\u003e`.\n3. **`cp-\u003cenv\u003e-router` tailscale self-enrollment** (`tag:eliza-proxy`) so the daemon can reach agent `tag:agent` `100.64.x` IPs.\n\n## Now reproducible from IaC\n\n| Piece | Where it's codified | Notes |\n|---|---|---|\n| Public headscale DNS record | `terraform/hetzner/control-plane/main.tf` (`cloudflare_dns_record.headscale`) | `proxied=false`, `ttl=300`. New `headscale_hostname` tfvar drives the per-env FQDN. |\n| nginx vhost (no-http2, Upgrade passthrough, 86400s timeouts) | `arm-headscale-control-plane.mjs` | Byte-for-byte the proven-good live staging/prod vhost, templated for env hostname + port. |\n| Let's Encrypt cert + renewal | `arm-headscale-control-plane.mjs` | `certbot certonly --nginx` (idempotent); renewal via certbot's own `certbot.timer`. |\n| `cp-\u003cenv\u003e-router` enrollment | `arm-headscale-control-plane.mjs` | Mints a 1h `tunnel`-user preauth key tagged `tag:eliza-proxy`, runs `tailscale up`. Skips if already enrolled. |\n\nEverything is **idempotent**: a re-arm / re-apply on an already-converged CP is a no-op. Existing staging+prod arm runs keep working unchanged (the new env var `CERTBOT_EMAIL` is optional and falls back to `ops@elizalabs.ai`; the cp-router hostname is auto-derived from the public URL).\n\n## Insertion-point decisions (and why)\n\n- **DNS → Terraform.** Lowest-risk, cleanest: a sibling of the existing `cloudflare_dns_record.control_plane`, same CP ipv4, different stable hostname. I added an explicit `headscale_hostname` tfvar rather than deriving from `var.environment`, because the convention is *not* a simple `headscale-\u003cenvironment\u003e`: prod **drops** the suffix (`headscale.elizacloud.ai`) while staging keeps it (`headscale-staging.elizacloud.ai`). Kept the same `ignore_changes = [content]` cutover-decoupling as the sibling record so a replacement-CP apply can't atomically flip the A record before the new box's headscale is armed + healthy.\n- **nginx + cert → the arm `.mjs`, NOT cloud-init.** Cert issuance is inherently **post-DNS and post-boot**: certbot's HTTP-01 needs the `headscale.*` A record to already resolve to the box, which isn't guaranteed at first-boot (DNS may not have propagated, and certbot would hard-fail). The arm workflow runs *after* the VM is up and the DNS record exists, is already the \"converge headscale\" step, and already has the public hostname + listen port in scope. cloud-init is the wrong home. Used `certbot certonly` (obtain-only) rather than `--nginx` install so the final vhost stays fully deterministic in-repo instead of being rewritten by certbot.\n- **cp-router → the arm `.mjs`.** Needs headscale running + the `tunnel` user, both of which the arm script already ensures earlier in the same run. headscale v0.28's `preauthkeys create -u` takes a **numeric user id**, not a username, so the script resolves `tunnel`→id from `users list -o json` (the task's suggested `--user tunnel` would fail on v0.28 — verified live on the staging CP).\n\n## Validation done\n\n- `terraform fmt -check` + `terraform validate` clean on the touched module (no apply).\n- `node --check` on the `.mjs`; `--dry-run` output piped through `bash -n` (staging + prod + skip-flags variants) — all valid bash.\n- The nginx vhost, listen ports (staging `:8080` / prod `:8081`), `cp-\u003cenv\u003e-router` hostname, `tag:eliza-proxy` ownership, certbot `nginx` authenticator + active `certbot.timer`, and headscale v0.28 `preauthkeys` syntax were all read **live off the staging CP** and matched.\n\n## ⚠️ DR test still needed (not done in this PR)\n\nThis is correctness-first; the real proof is a throwaway-CP rebuild. A reviewer/operator should:\n\n- [ ] Stand up a **throwaway CP** from the control-plane TF (new Hetzner project or scratch VM) with `headscale_hostname` set.\n- [ ] `terraform apply` → confirm `cloudflare_dns_record.headscale` creates and `headscale.*` resolves to the new CP ipv4 (`proxied=false`).\n- [ ] Run `arm-headscale-control-plane.yml` against it and verify, on the box:\n  - [ ] `/etc/nginx/conf.d/headscale.conf` exists, `nginx -t` passes, and `curl -sf https://\u003cheadscale-host\u003e/health` returns green **through nginx** (not just loopback `:8080/8081`).\n  - [ ] `/etc/letsencrypt/live/\u003cheadscale-host\u003e/fullchain.pem` exists and `certbot.timer` is active.\n  - [ ] `tailscale status` shows `cp-\u003cenv\u003e-router` with `tag:eliza-proxy`; `sudo headscale nodes list` shows it enrolled under the `tunnel` user.\n  - [ ] A **re-run** of the arm workflow is a clean no-op (cert not re-issued, cp-router not re-enrolled).\n- [ ] Confirm `certbot certonly --nginx` HTTP-01 actually succeeds end-to-end on a fresh box (the one path provable only on a real rebuild — locally we could only verify the generated script + the live already-issued cert).\n- [ ] Decide whether to add a post-cutover check that the daemon can reach an agent `100.64.x` IP via the cp-router (would catch an ACL/tag regression).\n\n## Out of scope\n\n- Multi-CP HA for headscale (the DNS record binds to CP `\"1\"`; an HA topology needs an LB/floating-IP strategy).\n- headscale state copy (db.sqlite/noise key) on CP replacement — already documented in the module README's \"replacing a CP\" runbook."])</script><script>self.__next_f.push([1,"29:T8fa,"])</script><script>self.__next_f.push([1,"\u003c!-- Use this template by filling in information and copying and pasting relevant items out of the HTML comments. --\u003e\r\n\r\n# Relates to\r\n\r\n\u003c!-- LINK TO ISSUE OR TICKET --\u003e\r\n\r\n\u003c!-- This risks section must be filled out before the final review and merge. --\u003e\r\n\r\n# Risks\r\n\r\n\u003c!--\r\nLow, medium, large. List what kind of risks and what could be affected.\r\n--\u003e\r\n\r\n# Background\r\n\r\n## What does this PR do?\r\n\r\n## What kind of change is this?\r\n\r\n\u003c!--\r\nBug fixes (non-breaking change which fixes an issue)\r\nImprovements (misc. changes to existing features)\r\nFeatures (non-breaking change which adds functionality)\r\nUpdates (new versions of included code)\r\n--\u003e\r\n\r\n\u003c!-- This \"Why\" section is most relevant if there are no linked issues explaining why. If there is a related issue, it might make sense to skip this why section. --\u003e\r\n\u003c!--\r\n## Why are we doing this? Any context or related work?\r\n--\u003e\r\n\r\n# Documentation changes needed?\r\n\r\n\u003c!--\r\nMy changes do not require a change to the project documentation.\r\nMy changes require a change to the project documentation.\r\nIf documentation change is needed: I have updated the documentation accordingly.\r\n--\u003e\r\n\r\n\u003c!-- Please show how you tested the PR. This will really help if the PR needs to be retested and probably help the PR get merged quicker. --\u003e\r\n\r\n# Testing\r\n\r\n## Where should a reviewer start?\r\n\r\n## Detailed testing steps\r\n\r\n\u003c!--\r\nNone: Automated tests are acceptable.\r\n--\u003e\r\n\r\n\u003c!--\r\n- As [anon/admin], go to [link]\r\n  - [do action]\r\n  - verify [result]\r\n--\u003e\r\n\r\n\u003c!-- If there is a UI change, please include before and after screenshots or videos. This will speed up PRs being merged. It is extra nice to annotate screenshots with arrows or boxes pointing out the differences. --\u003e\r\n\u003c!--\r\n## Screenshots\r\n### Before\r\n### After\r\n--\u003e\r\n\r\n\u003c!-- If there is anything about the deployment, please make a note. --\u003e\r\n\u003c!--\r\n# Deploy Notes\r\n--\u003e\r\n\r\n\u003c!--  Copy and paste command line output. --\u003e\r\n\u003c!--\r\n## Database changes\r\n--\u003e\r\n\r\n\u003c!--  Please specify deploy instructions if there is something more than the automated steps. --\u003e\r\n\u003c!--\r\n## Deployment instructions\r\n--\u003e\r\n\r\n\u003c!-- If you are on Discord, please join https://discord.gg/ai16z and state your Discord username here for the contributor role and join us in #development-feed --\u003e\r\n\u003c!--\r\n## Discord username\r\n\r\n--\u003e\r\n"])</script><script>self.__next_f.push([1,"2a:T865,"])</script><script>self.__next_f.push([1,"## \"Her\"-style bidirectional voice — chat button + conversational onboarding\n\nBuilt on current `develop` (onboarding is already consolidated to the single\nbranded `CompactOnboarding`; the voice machinery in `useFirstRunController` was\nintact). Two commits:\n\n### 1. Chat voice button (`ContinuousChatOverlay`)\n- **Tap the mic** → hands-free bidirectional conversation. The agent speaks its\n  replies aloud and the mic re-opens after each one (tap again to end).\n- **Press-and-hold** → push-to-talk dictation. The transcript fills the composer\n  draft (no send, no spoken reply) for review before sending.\n\nExtends the existing shell-controller voice path (no second `useVoiceChat` mic\nowner): `startCapture(intent: \"converse\" | \"dictate\")`, a `handsFree` state with a\ndebounced re-listen loop, `toggleHandsFree` (unlocks audio on enable; stops mic +\nspeech on disable), and a `setDictationSink` wired to the composer draft.\n`useShellVoiceOutput` now exports `stopSpeaking`.\n\n### 2. Conversational onboarding (`CompactOnboarding`)\n- Opt-in **\"Talk to set up\"** on the orange/white first-run card requests the mic\n  and starts a spoken, hands-free setup: Eliza speaks each question\n  (`onPromptReady`) and the user answers by voice (`applyVoiceTranscript` sets the\n  runtime + advances). Tap cards still work; a pulsing orb + live transcript show\n  the listening/speaking state. Opting in persists\n  `eliza:voice:continuous-chat-mode=vad-gated` so voice carries into chat.\n\nReuses existing machinery — `voice`/`microphone`/`onPromptReady`/`stopVoice`,\n`use-microphone-permission`, `onboarding-voice-lines` (the `runtime`/`remote` line\nIDs already match the steps). No new voice engine.\n\n### Verification\nBuilt in an isolated worktree off `origin/develop` (the active feature branch's\nworking tree was being reset by concurrent processes), so it was **not locally\ntypechecked** — relying on CI for typecheck/lint/tests. Manual voice verification\n(tap=converse loop, hold=dictate-to-draft, opt-in conversational onboarding) is\nbest on a darwin host with the local voice stack.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"2b:T9c7,"])</script><script>self.__next_f.push([1,"## Problem\n\nWhen `plugin-openai` runs against **Cerebras** (or any OpenAI-compatible endpoint that serves text models only), the media capabilities are still registered and point at that endpoint. Cerebras 400s/404s on vision chat completions, `/audio/transcriptions`, `/audio/speech`, and `/images/generations`. So every image attachment, transcription, or TTS request fails — e.g. an agent on a Cerebras base URL returns **HTTP 400 on every image** a user sends, instead of degrading gracefully.\n\nThe embedding path already handles this (`shouldUseLocalEmbeddingFallback` in `models/embedding.ts`), but `IMAGE`, `IMAGE_DESCRIPTION`, `TRANSCRIPTION`, and `TEXT_TO_SPEECH` were registered unconditionally from the static `models` map.\n\n## Fix\n\nRegister the four media models from `init()` via `registerMediaModels(runtime)` instead of the static map, and **skip them in Cerebras mode** unless an explicit per-capability **base-URL** override points the capability at an endpoint that actually serves it (e.g. `OPENAI_IMAGE_DESCRIPTION_BASE_URL`). This mirrors the existing embedding gate.\n\nImportant subtlety: only the **base URL** counts. `OPENAI_IMAGE_DESCRIPTION_API_KEY` alone does **not** keep the capability registered, because `getImageDescriptionBaseURL()` falls back to `getBaseURL()` — i.e. straight back at Cerebras. An API key with no base URL would just fail again.\n\nWith no handler registered, downstream consumers take their graceful-skip path instead of failing — e.g. `plugin-discord`'s `isImageDescriptionEnabled()` skips image description rather than erroring on every attachment.\n\n## Changes\n\n- `plugins/plugin-openai/index.ts` — `registerMediaModels()` + `hasExplicitCapabilityOverride()`; media models move out of the static `models` map and register conditionally from `init()`.\n- `plugins/plugin-openai/__tests__/cerebras-capability-gating.shape.test.ts` — new: asserts which capabilities register in Cerebras mode, with and without per-capability base-URL overrides.\n- `plugins/plugin-discord/__tests__/attachments.test.ts` — adds coverage for the graceful-skip path when no `IMAGE_DESCRIPTION` handler is registered.\n\n## Notes\n\n- General: applies to any text-only OpenAI-compatible endpoint, not just Cerebras.\n- Behavior-preserving for standard OpenAI deployments — when the base URL serves these capabilities, all four register exactly as before.\n- Verified live: an agent on a Cerebras base URL now degrades gracefully on image attachments instead of 400-ing.\n"])</script><script>self.__next_f.push([1,"2c:T781,"])</script><script>self.__next_f.push([1,"Re-skins the first-run `CompactOnboarding` for a normie-friendly first run, **keeping develop's exact controller logic and the 3-way runtime choice** (cloud / local / remote) — same `useFirstRunController`, same `chooseCloud/chooseLocal/chooseRemote`, same testids and states. Only the presentation changes.\n\n### Before → after\ndevelop shows three equal jargon cards (*Eliza Cloud* / *Remote server* / *Local models*). This gives a first-timer a clear hierarchy and zero jargon:\n\n- **Primary — \"Start now\"** (Sparkles, *Easiest*) → cloud. \"The easy way — we set everything up for you.\"\n- **Secondary — \"Keep it on this phone\"** (ShieldCheck) → local. \"Works offline and stays completely private.\"\n- **Tertiary — \"Advanced setup\"** (Settings2), a quiet demoted link → remote.\n- Cloud sign-in handoff is now an **\"Almost there\"** card (MailCheck) that sets the leaves-the-app-and-comes-back expectation.\n- Friendly one-time-download hint via the controller's `localRuntimeAvailable`, in plain words.\n- Subtle, `prefers-reduced-motion`-safe entrance + press feedback.\n\n(See `01-mobile-choose.png` from the e2e harness for the result.)\n\n### Compatibility\n- **All testids preserved** (`onboarding-option-cloud/local/remote`, `onboarding-cloud-open-signin`, `onboarding-remote-connect`, `onboarding-toast`), so the cloud/remote/local flows and the screenshot e2e harness are unchanged.\n- Supersedes the cosmetic text-trim in `8f3962a6aa` (this is a full re-skin); reinstates the one-time-download hint as friendly copy rather than the removed technical note.\n\n### Test plan\n- [x] `bun run --cwd packages/ui test -- CompactOnboarding` — 9/9 pass (assertions updated to new copy).\n- [x] `bun run --cwd packages/ui typecheck` — clean.\n- [x] `bun run --cwd packages/ui lint` (biome) — clean.\n- [x] `bun run --cwd packages/ui test:onboarding-e2e` — 17 screenshots, all option cards detected, 0 page errors."])</script><script>self.__next_f.push([1,"2d:T5d3,"])</script><script>self.__next_f.push([1,"Enriches the **wired** connector-catalog (`getConnectorCommands` → `/api/commands` → GUI/TUI/Discord/Telegram) — not the dead `serializeCommands` path (which has zero consumers).\n\n## Fixes\n- **2 dead deep-links**: `knowledge` `/knowledge`→`/character/documents`, `plugins` `/plugins`→`/apps/plugins` (canonical `@elizaos/ui` `TAB_PATHS`). On Discord/Telegram these were 404 links.\n\n## Adds\n- 8 real nav destinations (chat, character, wallet→inventory, automations, tasks, skills, logs, database) + 2 GUI/TUI-only client commands (clear, fullscreen).\n- `tab`/`viewId`/`section` routing hints (deterministic GUI routing) + typed `ClientCommandAction` on `ConnectorCommandTarget`.\n- `getConnectorCommands(surface)` now uses its arg to filter client commands off chat connectors (the documented-but-unimplemented intent).\n- Agent `/api/commands` `mapTarget` passes the hints + `clientAction` through.\n- `connector-catalog.test.ts` covering nav set, path correctness, routing hints, per-surface filtering.\n\n## Verified\n- plugin-commands: build + **23/23 tests**\n- plugin-discord: typecheck 0 + **101/101 tests**\n- agent: `commands-routes.ts` typecheck **0 errors**\n\n## Note\nThe 10 `plugin-telegram/command-registration.test.ts` failures + the 1 `DynamicViewLoader.tsx` `plugin-health` error are **pre-existing on develop** (telegram = a half-landed refactor where the test imports `buildTelegramSetMyCommands`/`buildNavigateReply` the source doesn't export), unrelated to this change."])</script><script>self.__next_f.push([1,"2e:T96b,"])</script><script>self.__next_f.push([1,"## What\n\nFixes verified, user-visible bugs in the Telegram **bot** (telegraf) connector. The inbound polling path is already resilient (telegraf honors `retry_after`/5xx on receive) and is left untouched; this hardens the outbound + parsing paths it doesn't cover.\n\n**Correctness (ship-broken today):**\n- **Broken markdown links** — `utils.ts` the link regex was literal math-markup placeholder text, so it never matched `[text](url)` and every link rendered as escaped raw `\\[text\\]\\(url\\)`. Replaced with `/\\[([^\\]]+)\\]\\(([^)]+)\\)/g`.\n- **Reactions misrecorded** — a reaction's glyph lives on `.emoji`, but both reads used `.type`, so every emoji reaction recorded the literal string `\"emoji\"` instead of the glyph. Narrowed on the discriminant; dropped the wrong casts.\n- **DM replies skipped formatting** — DM responses sent raw text with no markdown conversion, `parse_mode`, or inline interactions (group replies got all three). Routed DM through `sendMessageInChunks` via a ctx shim targeting the user's chat.\n\n**Resilience:**\n- **Silent reply loss on transient errors** — outbound sends had no 429/parse-failure handling, so a single 429 or MarkdownV2 400 was caught and turned into an empty result: the user got nothing while the turn \"succeeded.\" Added one `sendWithRetry` helper — honors the server `retry_after` on 429 (capped retries) and falls back to plain text on a MarkdownV2 400 so the user gets unformatted content instead of silence; 403 and other errors propagate. Unit-tested.\n\n**Security:**\n- **Allowlist over-authorization** — `TELEGRAM_ALLOWED_CHATS` was `JSON.parse`'d then `.includes`'d with no array check, so a bare JSON string made it a *substring* match (chat `-100` matched inside `-1001234567`), failing **open**. Now validates it's an array and fails closed.\n\n**Hygiene:** removed the unused exported `splitMessage` (dead duplicate) and the dead `environment.ts`.\n\n## Testing\n\nplugin-telegram suite: my 5 test files pass (37 tests, incl. 3 new resilience tests for 429-retry / plain-text fallback / no-retry-on-403); lint clean. (Note: the unrelated `command-registration.test.ts` is failing on develop independent of this PR — it imports a `buildTelegramSetMyCommands` that the source renamed to `buildTelegramCommandDescriptors`; out of scope here.) Found via an adversarially-verified review.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"2f:T7cb,"])</script><script>self.__next_f.push([1,"## Problem\n\nWhen attachment processing fails (no `ffprobe`, a vision endpoint 400s, etc.), the failure prose is stored in the attachment's `description` field with an **empty `text`**. But both render sites — the `ATTACHMENTS` provider and `formatMessages` (the `RECENT_MESSAGES` history) — advertised *\"available via ATTACHMENT action=read\"* for **any truthy `text || description`**.\n\nThe `read` action filters exactly those placeholder/failure descriptions, so the hint was **unsatisfiable**: the model is told it can read content that the read action then refuses. On 2026-06-10 this drove a forced-tool `IGNORE` loop into `TrajectoryLimitExceeded` — the agent kept trying to satisfy a read hint that could never succeed.\n\n## Fix\n\nKey both read hints on `attachment.text` — the canonical readable-content field — instead of `text || description`. A failure-prose-only attachment (empty `text`) no longer advertises a read it can't fulfill.\n\n**Images are the documented exception** in the provider: the `read` action re-describes an image at read time via the `IMAGE_DESCRIPTION` model, so a registered image-description model keeps the read satisfiable even without stored text. That branch is preserved.\n\n## Changes\n\n- `packages/core/src/features/basic-capabilities/providers/attachments.ts` — gate the provider hint on `text` (image exception preserved).\n- `packages/core/src/utils.ts` — same gate in `formatMessages` (history render site).\n- `packages/core/src/features/basic-capabilities/providers/attachments.test.ts` + `packages/core/src/__tests__/messages-format.test.ts` — cover failure-prose, empty-text, and image-exception cases.\n\n## Notes\n\n- Pairs with #8614: that PR stops the vision-endpoint 400 at the source (don't register a vision model the endpoint can't serve); this PR stops the *downstream* unsatisfiable-read loop when an attachment ends up with no readable text for any reason.\n- Behavior-preserving for attachments that actually have readable `text`.\n"])</script><script>self.__next_f.push([1,"30:T7b8,"])</script><script>self.__next_f.push([1,"## What\n\nGives the Telegram connector the same account-role model as the owner-binding gate expects, so a personal agent can have its **own bot identity** and act **through the user's own Telegram account** without conflating the two.\n\nToday `connector-account-provider.ts` surfaces every account as `role: AGENT` / `accessGate: open` and passes `externalId: undefined` — so the core owner-binding gate (which matches a verified binding by `externalId`) could never resolve one, and the user's account would be indistinguishable from the bot.\n\n- A **bot-token** account stays an `AGENT` account on the `open` gate (acting as the bot is frictionless).\n- A configured **personal block** (an MTProto user identity, signalled by a phone or saved session that isn't explicitly disabled) is surfaced as a separate `OWNER` account on the `owner_binding` gate, with a stable `externalId` (`tg-user:\u003cphone\u003e`) so the gate can match the binding the existing `/eliza_pair` flow already creates. A config declaring both yields two distinct accounts (`\u003cid\u003e` and `\u003cid\u003e:personal`).\n\nThe bot service's account list (`listEnabledTelegramAccounts`, which needs a bot token to long-poll) is deliberately left untouched — personal accounts are enumerated separately so a phone-only account never reaches the Telegraf path.\n\n## Scope\n\nThis is the **role model only**. The live MTProto connector that actually reads/sends as the user (re-instantiating a persistent `TelegramClient` from the saved session and registering it as a `MessageConnector`) is a follow-up — it requires a real authenticated session to build and verify.\n\n## Testing\n\nNew `connector-account-provider.test.ts`: bot → `AGENT`/open; personal → `OWNER`/`owner_binding` with the stable `externalId`; both → two distinct accounts; disabled / credential-less personal ignored. Full plugin-telegram suite green (33 tests), strict typecheck + biome clean.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"31:T61f,"])</script><script>self.__next_f.push([1,"A screenshot-driven verification pass of the Tutorial (#8538) surfaced two real bugs; this fixes them. **Manually reviewed 14 captured screenshots** confirming the home tiles, launcher, spotlight glow, Help, voice mode, and auto-launch all render correctly.\n\n## Bugs fixed\n1. **`meet-chat` auto-skipped and taught nothing.** The chat starts in the *peek* detent (composer bar visible, no `chat-pill` element), so `chatOpen \u0026\u0026 !chatPilled` was already true — the step instantly showed \"Nice, you got it ✓\" and the spotlight had no target (it pointed at the absent pill). Reworked the chat steps to the **real detents**: meet-chat (informational, spotlight on the composer) → expand → minimize-to-pill → **new \"reopen from the pill\"** step. Each step now targets a present element and teaches a genuine action. *(Before/after screenshots: step 2 went from an instant auto-skip to a real \"This is your chat\" card with the glow on the composer.)*\n2. **Manual-continue fallbacks didn't navigate.** \"Take me to Settings\" / \"Skip voice\" just advanced the step, stranding the user on the next step's screen. Added `advanceNavigateTo` so the fallback performs the navigation it was demonstrating, then advances. Auto-detected success is unchanged.\n\n## Verification\n- UI typecheck clean.\n- New mock-backed Playwright walkthrough spec captures + (manually) verifies 14 screenshots of the full flow, with a regression assertion that meet-chat no longer auto-skips.\n- All 4 tutorial/help e2e tests pass.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"32:T42c,Models the API offers (e.g. `openai/gpt-5.5`, `anthropic/claude-haiku-4.5`, `x-ai/grok-4.20`, `openai/gpt-5-mini`) returned **HTTP 500 \"Pricing unavailable\"** when used — reproduced live against prod — because BitRouter's catalog returns no priced row for them and they aren't in `FORCED_BITROUTER_PRICING`.\n\n**Fix:** a live **OpenRouter** pricing fallback (`providers/openrouter.ts`, public `/api/v1/models`, no auth — the same source the existing `gpt-oss-120b` forced row cites). It's appended to the BitRouter gateway result as **low-priority (-1)** language rows, so a live BitRouter price or a FORCED row (priority 0) always wins — OpenRouter only fills models BitRouter doesn't price. Image/embedding/audio excluded (dedicated paths). Fetch is **non-fatal** (returns [] if OpenRouter is unreachable). Real per-token prices, refreshed live — not a stale hand-maintained snapshot.\n\nPinned by `openrouter-fallback.test.ts` (4 tests: mapping, exclusions, parse, non-fatal). 3 files, +185.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)33:T846,"])</script><script>self.__next_f.push([1,"## Audit follow-ups to #8514 (apps-control plane)\n\nAfter #8514 merged I ran an adversarial self-audit of it. It found two real gaps — fixed here.\n\n### 1. Surface failed `APP_DEPLOY` (HIGH, user-facing)\nRollout hazard: if the apps-worker is armed **before** the main control-plane daemon is pinned to `PROVISIONING_JOB_LANES=agent`, the unpinned main daemon (fail-open → all 18 types) keeps claiming `APP_DEPLOY` rows it can't run. On that host the apps backend isn't armed, so `getAppDeployRunner()` throws \"runner not configured\"; after `max_attempts` the job flips to `failed`. But the post-failure status-repair only special-cased `AGENT_PROVISION`/`AGENT_DELETE`, so a failed `APP_DEPLOY` left the app **stuck in `building` with no surfaced error**.\n\nFix: add the symmetric `APP_DEPLOY` branch → set `deployment_status = 'failed'` so the UI shows a real error instead of hanging. This is defense-in-depth; the correct rollout still pins the main daemon to `agent` **before** arming apps (documented in the daemon header + the arm workflow), but now a botched order is *visible*, not silent.\n\n### 2. Cover the lane seam (I'd said \"tested everywhere\" — only the resolver was)\n- **`provisioning-jobs-lanes.test.ts`** — proves `processPendingJobs({ jobTypes })` claims **and** stale-recovers **only** that lane (apps-only never an agent type; agent-only never an apps type; default = all 18). Guards against a future refactor silently dropping the `recoverStaleJobs(jobTypes)` scoping (which would let one lane's daemon reset the other lane's stale rows).\n- **`apps-provisioning-worker.test.ts`** — `readAppsWorkerConfig` parsing + the arm-gate **closed** path (`APPS_DEPLOY_ENABLED != '1'` → idle), the inert-by-default safety the daemon's docs lean on. (Exported `armAppsDeployBackend` for it.)\n\n### 3. Daemon robustness (low)\nHardened the apps daemon's `unhandledRejection` handler with a stderr fallback so a deps-import rejection can't swallow the original reason.\n\n**26 tests pass** (17 resolver + 3 lane-seam + 6 daemon). Inert-by-default, backward-compatible — same as #8514.\n\nRefs #8514 #8434\n"])</script><script>self.__next_f.push([1,"34:T107e,"])</script><script>self.__next_f.push([1,"## What\n\nPrep for migrating the cloud cache+DB off Upstash/Neon onto **Railway** (TCP Redis + Postgres). Two cloud consumers still assumed **Upstash REST** and would break — or silently degrade — against a `REDIS_URL`-only (Railway TCP) deploy. This PR fixes both and adds coverage. **No infra is cut over by this PR**; it only makes the code Railway-ready so the cutover is a config flip.\n\n## Changes\n\n### 1. `credit-events` — accept TCP `REDIS_URL` (correctness)\n`CreditEventEmitter.shouldUseRedis()` gated on `KV_REST_API_URL \u0026\u0026 KV_REST_API_TOKEN` only. On a Railway deploy that sets `REDIS_URL` (and no `KV_REST_*`), it silently fell back to a **single-process in-memory `EventEmitter`**, breaking multi-instance credit-update propagation.\n\n- Added `hasRedisConfig(env?)` to `lib/cache/redis-factory.ts` — mirrors `buildRedisClient()`'s resolution (`MOCK_REDIS` / `REDIS_URL` / Upstash REST / Upstash alias), so callers gate on the same condition the factory builds on.\n- `credit-events.ts` now gates on `hasRedisConfig()`. The underlying `redisCreditEventEmitter` already used `buildRedisClient()` (REDIS_URL-aware); this aligns the gate with it.\n\n### 2. `gateway-discord` — speak TCP to Railway Redis\nFailover/leader-election used the `@upstash/redis` REST client, which cannot talk to Railway's TCP Redis. With `REDIS_URL` aliased to a `redis://` URL, the old constructor tried to build an Upstash REST client from a TCP URL — broken.\n\n- `mock-redis.ts` → `redis-adapter.ts`: the existing `ioredis`-backed, Upstash-shaped adapter is generalized to wrap **either** the in-memory `ioredis-mock` (`createMockRedis()`) **or** a real `ioredis` client (`createNativeRedis(url)`, `lazyConnect`).\n- `gateway-manager.ts` constructor now prefers a `redis(s)://` `REDIS_URL` → native TCP adapter, before the Upstash REST fallback. Call sites unchanged (same `get/set{ex,nx}/setex/del/expire/sadd/srem/smembers` surface; `set` returns `\"OK\"`/`null` exactly as the leader-election code compares).\n- Adds `ioredis` dependency (already used by sibling `gateway-webhook`).\n\n### 3. `cloud-shared` DB client — opt-in TLS no-verify for self-signed managed Postgres\nRailway terminates its **public TCP proxy with a self-signed cert**. The remote-TLS policy (`enforceTlsForRemote`, SOC2 CC6.7) hardcoded `rejectUnauthorized: true`, so the production `createConnection` path fails with `SELF_SIGNED_CERT_IN_CHAIN` against Railway (Neon used valid public-CA certs, so this only surfaces at cutover). pg 8.21 also treats `sslmode=require` as `verify-full`, so even `?sslmode=require` fails.\n\n- `DATABASE_SSL_NO_VERIFY=true` **or** `?sslmode=no-verify` keeps TLS (encrypted) but skips CA verification. **Defaults unchanged** — strict verification stays on; `sslmode=disable`/`allow` is still rejected outright (no plaintext). Encryption-in-transit (CC6.7) is preserved; only CA verification is relaxed, and only when the operator opts in for the known endpoint.\n- Verified end-to-end against an 8 GB Neon→Railway restored copy: the production path (pg + drizzle, reads / typed select / DDL+DML / tx-rollback) passes **7/7** with the flag and **fails closed** without it.\n\n## Tests\n- `redis-factory-mock.test.ts`: new `hasRedisConfig` cases (TCP `REDIS_URL` true; half-configured Upstash false; aliases; mock).\n- `gateway-discord` `redis-adapter.test.ts`: existing mock round-trip retained + `createNativeRedis` constructs without eager connect. **56/56 pass.**\n- `client-tls.test.ts`: `shouldSkipTlsVerification` env/URL matrix (**4/4**).\n- Verified end-to-end against **live Railway Redis + an 8 GB Neon→Railway restored copy**: SocketRedis TCP round-trip (4/4) and the full pg/drizzle path (7/7). Row parity Neon↔Railway: 284/284 tables, drizzle journal @137 identical.\n\n## Not in this PR (tracked for the cutover)\n- Worker DB path (`worker-neon-http.ts`) `pg`-over-`nodejs_compat` / Hyperdrive validation; deleting the dead Neon-HTTP branch + `@neondatabase/serverless`/`ws` deps after cutover.\n- `sandbox-registry` (agent + app-core) and opt-in `mcp` schema-cache Upstash-REST consumers.\n- Stale Upstash comments in `cloud-api/wrangler.toml`.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"35:T6fc,"])</script><script>self.__next_f.push([1,"## Last cloud-side gaps for in-app mobile chat (shared-runtime / Tier-0 agents)\n\nFound on a real Solana Seeker; verified field-for-field against the app's client code + live prod.\n\n### `GET /api/auth/me` 404'd → app stuck on StartupFailureView\nThe app's `authMe()` (ui/src/api/auth-client.ts) maps any non-2xx/401 to `{ok:false, status:503}` → `server_unavailable` → never reaches chat. The caller is already an authed API key (`resolveSharedAgent` validated it), so we report that authed **machine identity** in the agent-server bearer shape — `{identity,session,access}`, matching `AuthIdentity`/`AuthSessionInfo`/`AuthAccessInfo` exactly.\n\n### `GET /api/character` 404'd\nReturns `{character, agentName}` (the `getCharacter()` wire shape). Reuses the **same** `findRunningSandbox` + `buildSharedRuntimeCharacter` the bridge `message.send` turn uses (new public `getSharedRuntimeCharacter` accessor) — so `/api/character` is exactly what the agent answers as. Empty-object fallback when unresolved.\n\n### `GET /api/config` now advertises `{websocket:false}`\nA stateless in-Worker shared agent has **no WebSocket** (per-turn streaming is the SSE `/stream` endpoint; send works over REST). This is the clean cloud-side half of the realtime fix: a client that honors it skips the doomed WS reconnect loop + 'Lost backend connection' overlay that otherwise covers a working chat. **No Worker WebSocket is built** — architecturally wrong (nothing to push between turns). The app half (skip the WS for a shared base, exactly as it already does for local-agent IPC bases) is owned by the UI side.\n\n### Checks\ntypecheck 0 errors (both pkgs) · 17/17 adapter tests (4 new) · lint clean · codegen idempotent (no new mount) · catch-all stays honestly scoped (unknown paths still 404)."])</script><script>self.__next_f.push([1,"36:Te19,"])</script><script>self.__next_f.push([1,"Three self-contained Android prod-readiness fixes, split out of the overlay-motion work so they merge independently of the in-flight chat-sheet UI (no overlap with `ContinuousChatOverlay`/onboarding files shaw is tuning).\n\n## 1. Restore `android.path` so `cap sync` ships the full plugin set (#8387)\n\n`cap sync` wrote a full project to `packages/app/android` while gradle builds `packages/app-core/platforms/android` off a **stale committed** `capacitor.settings.gradle` — so native plugins (`@capacitor/browser`, `haptics`, `push-notifications`, …) silently never compiled and were pruned from the manifest. That's why **cloud sign-in (`Browser.open`) was a no-op** and detent haptics did nothing.\n\n- `capacitor.config.ts`: point `android.path` at `../app-core/platforms/android` so `cap sync` regenerates the full plugin set **in place** every build.\n- `run-mobile-build.mjs`: `ensureBunRuntimeRegistered()` re-appends `elizaos-capacitor-bun-runtime` after each `cap sync` (cap sync drops it; the on-device Bun agent needs it).\n\n## 2. Make the full plugin set actually LOAD at runtime\n\nAfter #1 the plugins compiled (APK +100 MB) but Capacitor still logged `E Capacitor: Error loading plugins` and **every** plugin reported \"not implemented on android\". Root cause: `PluginManager.loadPluginClasses` throws on the **first** plugin whose class isn't on the dex and aborts the whole load — so one bad plugin kills the entire set. 8 classes were in `capacitor.plugins.json` but missing from the dex, both for Kotlin-bundling reasons:\n\n- **6 of our own native plugins** (system, phone, wifi, contacts, messages, appblocker) never applied `org.jetbrains.kotlin.android`. On AGP 8.x the built-in kotlinc compiles `.kt` but does **not** bundle the `.class` into the library AAR. Apply the Kotlin plugin (+ matching `jvmTarget`) in each `android/build.gradle`, exactly as the working plugins (camera) do.\n- **`@capacitor/background-runner` + `@capacitor/barcode-scanner`** have the same upstream bug but live in `node_modules` (not committable) and aren't needed on Android (background work = WorkManager/`ElizaWorkScheduler`; barcode = companion-pairing only). Drop them from `capacitor.plugins.json` in the manifest reconciler.\n\n**Result (verified on a Solana Seeker):** no more `Error loading plugins`; all 6 native classes on the dex; `@capacitor/browser` registers → **cloud sign-in's in-app Custom Tab opens immediately on \"Start now\"** (the \"Open the sign-in page\" fallback screen only appeared because `Browser.open` was throwing); haptics + keyboard work.\n\n## 3. Don't cold-ask for notifications during first-run onboarding\n\nOn a stock phone a fresh install has no persisted runtime mode, so `shouldAutoStart()` returns true (agent auto-starts so the dashboard isn't stranded) and `MainActivity` fired the `POST_NOTIFICATIONS` dialog **during onboarding, before any choice**. Add `ElizaAgentService.hasCommittedRuntimeChoice()` (branded device, or an explicitly-persisted `mobile-runtime-mode`) and only ask once that's true. The FGS still runs; its notification is just suppressed until a mode is committed.\n\n## Test plan\n- [x] On-device build (`build:android`) succeeds; APK installs on a Seeker.\n- [x] Cold first-run: no notification dialog; lands on the onboarding card.\n- [x] `capacitor.plugins.json` is reconciled to the 26 plugins whose classes are on the dex; no `Error loading plugins` / `PluginLoadException` in logcat.\n- [x] \"Start now\" → in-app Custom Tab opens the real `elizacloud.ai` CLI-auth page immediately (no second screen).\n- [x] `run-mobile-build.mjs` passes `node --check`."])</script><script>self.__next_f.push([1,"37:T869,"])</script><script>self.__next_f.push([1,"## Why\n\n`main` carries the new `navigation-commands.ts` + rewritten `connector-catalog.ts` (the universal slash-command catalog) which reference a registry/types API that `registry.ts`/`types.ts` never gained. Result: `@elizaos/plugin-commands#build` exits 2, so `bun run build:core` — the cloud deploy's **\"Build linked elizaOS workspaces\"** step — fails and **every production deploy off `main` is blocked** (including the already-merged dashboard scroll fix #8598 and all the recent cloud-backend work, which are sitting on `main` unable to ship).\n\n`develop` is *not* affected — it still has the older self-consistent `connector-catalog.ts` and no `navigation-commands.ts`, so it builds. This break is specific to `main`'s newer files.\n\n## What\n\nCompletes the API the already-landed files expect, using the package's own tests (`__tests__/catalog.test.ts`, `__tests__/connector-commands.test.ts`) as the spec.\n\n**`types.ts`**\n- `\"navigation\"` added to `CommandCategory`\n- `CommandSurface` = `\"gui\" | \"tui\" | \"discord\" | \"telegram\"`\n- `CommandTarget` = `agent | navigate | client` — declarative per-surface handling\n- `CommandArgDefinition.dynamicChoices`; `surfaces` / `target` / `icon` on `CommandDefinition`\n\n**`registry.ts`**\n- merge `NAVIGATION_COMMANDS` into the per-runtime store in `initForRuntime`\n- `getCommandsForSurface(surface)` — filter enabled cmds by surface\n- `serializeCommand` / `serializeCommands(surface?)` — wire-safe JSON (drops fn-valued `choices`, defaults `target`→`agent`, fills required booleans)\n- `/new` marked as a client `new-conversation` command\n\n## Verification\n- `bun run build:core` → **52/52 tasks successful** (plugin-commands built fresh, \"Build complete!\")\n- `plugins/plugin-commands` build **0 errs** · typecheck **0 errs** · **42/42 tests pass**\n- consumers typecheck clean: `plugin-discord` 0 · `plugin-telegram` 0\n\n## Note for the squash\n`develop` will need this same 2-file completion *whenever it adopts the new `connector-catalog.ts` + `navigation-commands.ts`* (currently it doesn't). Folding that into the in-flight catalog squash is the clean way to keep develop↔main convergent."])</script><script>self.__next_f.push([1,"38:T568,"])</script><script>self.__next_f.push([1,"## Summary\n- enables the Cloud API Worker cache in default, staging, and production Wrangler vars\n- pins the Worker cache backend to `redis-rest` so it uses `KV_REST_API_URL` / `KV_REST_API_TOKEN` instead of a cross-request socket client\n- adds a focused regression test proving Worker bindings initialize the Upstash REST adapter and persist the shared-runtime history key with the environment prefix\n- types `CACHE_BACKEND` on the Worker bindings interface\n\n## Why\nShared-runtime chat history is stored through the generic cache client under keys like `shared-runtime:\u003cagentId\u003e:\u003cconversationId\u003e:history:v1`. With `CACHE_ENABLED=false`, `GET .../messages` can only return an empty transcript even after a successful turn because `cache.set` silently no-ops. The old disable reason was about Cloudflare Worker cross-request I/O isolation for a module-level socket singleton; forcing `CACHE_BACKEND=redis-rest` avoids that socket path and uses Upstash over fetch instead.\n\n## Validation\n- `bun run --cwd packages/cloud-shared test src/lib/cache/__tests__/client-worker-rest.test.ts src/lib/cache/__tests__/client-mock.test.ts`\n- `bunx @biomejs/biome check packages/cloud-api/wrangler.toml packages/cloud-shared/src/types/cloud-worker-env.ts packages/cloud-shared/src/lib/cache/__tests__/client-worker-rest.test.ts`\n- `bun run --cwd packages/cloud-shared typecheck`\n- `git diff --check`"])</script><script>self.__next_f.push([1,"39:T799,"])</script><script>self.__next_f.push([1,"Extends the view→chat-binding pattern (introduced for Help) to **every page view that had its own in-page search box**. When one of these views is active it takes over the floating chat composer — overriding the placeholder and receiving the live draft via `onQuery` — so a single, consistent surface drives search instead of a per-view input box.\n\n## Migrated (8) — in-page search input removed, binding registered, filtering kept\n`ViewCatalog` · `LogsView` · `MemoryViewerView` · `MediaGalleryView` · `PluginsView` · `skill-detail-panel` (skills list) · `RelationshipsWorkspaceView` · `DocumentsView`\n\n## Deliberately NOT migrated (a single global chat binding doesn't fit)\n- **SecretsView** — its only text input is the add-secret *form*, not a list filter.\n- **ElizaOsAppsView** — three independently-routed AOSP page views (Phone/Messages/Contacts), each with its own search context.\n- **skill-marketplace** — its keyword search lives inside a transient Install **Dialog**, not an in-shell list.\n\n## Preserved everywhere\nForm fields and dropdown/select filters are untouched: level/source/tag/scope/platform filters, the file-upload input, add-secret, view-id, and github-url fields.\n\n## Verification\n- `packages/ui` typecheck: **clean** (zero errors in the migrated files).\n- Biome: **clean** on all 9 changed files.\n- Each migration was **adversarially reviewed** by an independent agent (binding stability/no re-registration loop, onQuery wired to the original setter, input fully removed, filtering intact, other inputs preserved, no unused imports).\n- Updated the plugins e2e (`apps-builtin-pages-interactions.spec.ts`) to drive search through the chat composer (the `plugins-search` testid is gone); the chat-driven-search pattern itself is already e2e-proven by the Help walkthrough.\n\nNet −84 lines (search boxes replaced by compact bindings).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"3a:T8ed,"])</script><script>self.__next_f.push([1,"Follow-up UX pass (after the chat-search migrations in #8597/#8599) driven by a full UX audit of every migrated view.\n\n## The problem\nWhen a view's search box moved to the floating chat, **nothing told the user where search went**. Worse: when the chat collapses to a pill, even the composer placeholder (\"Search plugins…\") is hidden — so users were left hunting for a search box that no longer exists.\n\n## The fix\nNew shared **`composites/chat-search-hint.tsx`** — a small, always-visible, **query-aware** hint that lives in the view's *own* header (so it survives the pill state):\n- idle → \"Search {noun} by typing in the chat.\"\n- active → \"Showing {noun} for '{query}'\"\n\nAdded to all 14 search views (Logs, Trajectories, Heartbeats, Runtime, Database, MediaGallery, Skills, Memory, Plugins, ViewCatalog, Documents, skill-detail, Relationships), replacing the earlier ad-hoc/English-only hints in ViewCatalog + Documents with the consistent, localized one (`common.chatSearchHint` / `common.chatSearchActive`). The query-aware variant also fixes RuntimeView's \"sections silently vanished\" confusion.\n\n## Audit cleanup folded in\n- Finished #8599's incomplete Relationships cleanup — removed the **phantom** `relationships-search`/`relationships-clear-search` agent-surface registrations + dead `onSearchChange`/`onSearchClear` props.\n- Cleaned skill-detail-panel's **orphaned** `plugins-game-list-search` wrapper.\n- Specific-ified generic placeholders: `\"Search...\"` → `\"Search trajectories…\"`, `\"Search\"` → `\"Search people…\"`, added the heartbeats ellipsis.\n- Dropped the orphaned `mediagalleryview.SearchActive` i18n key.\n\n## Scope decision (from the audit)\n**No further views migrated** — every remaining view is a correct keep: forms route through the agent's natural-language actions; SQL/code editors stay in-view; SecretsView must never stream credentials to the chat; and the AOSP Contacts/Phone views keep their expected native in-app search bars.\n\n## Verification\nTypecheck clean, biome clean, SkillsView unit 5/5, e2e **8/8** (apps-builtin-pages-interactions — trajectories/database/runtime/relationships load + filter with the hints). Each view's polish was adversarially reviewed.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"3b:T662,"])</script><script>self.__next_f.push([1,"## Shared agents had no durable chat history\n\nShared (Tier-0) agents stored conversation history **only** in the request cache, which is **disabled on the prod Worker** (`CACHE_ENABLED=false`, no KV backend) → `cache.set` was a silent no-op. Live symptoms: `GET .../messages` always returned `[]`, the conversation visually wiped ~5s after each send, and the agent had **no cross-turn memory** (verified: \"remember teal\" → \"I don't know\").\n\n## Fix — move history to Postgres (the Worker already uses it)\n- New **isolated** table `shared_runtime_history(agent_id, channel_id, messages jsonb, updated_at)`, one row per (agent, channel), upserted with the capped list. Kept **separate** from the encrypted/billed `conversations` tables (the chat-completions product) so the lightweight shared tier stays decoupled, as designed.\n- `loadSharedRuntimeHistory`/`saveSharedRuntimeHistory` use the repository instead of the cache (drops the dead cache key + TTL).\n- `jsonbParam()` binding for the Neon serverless driver.\n\n## Migration / sequencing\nMigration **0146** is additive + idempotent (`CREATE TABLE IF NOT EXISTS`). **Already applied to the prod Neon DB out of band** (the table exists *before* this code deploys, so the Worker never queries a missing table). Prod + staging share the same Neon instance, so one apply covers both. cc @standujar — single additive table, touches nothing existing.\n\n## Checks\ntypecheck 0 errors · 27/27 shared-runtime + billing tests (the billing test now spies the repo instead of the cache). This makes item 3 (history persistence) fixed in code, independent of the `CACHE_ENABLED` infra flag."])</script><script>self.__next_f.push([1,"3c:T4ab,Post-launch deep-scan cleanup of the recently-shipped shared-runtime/mobile-chat code. **No behavior change except one correctness fix** (health leaf). From a 5-rules audit of our own code:\n\n- **rule 2 (no duplicate functions):** extract the `resolveSharedAgent` auth+org+tier gate — triplicated across the `[...path]`, `conversations`, and `messages` route leaves — into one `lib/services/shared-runtime/resolve-shared-agent.ts`. Route the **health** leaf through it too (it previously returned `{status:ok}` for ANY agentId, even foreign/non-shared; now it 404s like its siblings).\n- **rule 3 (no single-use types):** inline the single-use `SharedRest*` return types (Status/AuthMe/Character/SendResult) + `SharedTurnRole`; un-export the internal-only `SharedRestViewRegistration`.\n- **dead code:** drop unused tier helpers (`isSharedEligible`, `tierRequiresContainer`) + their tests; trim 4 never-read `cache*` fields from `SharedAgentTurnUsage`.\n- **slop:** collapse the back-to-back inverted `if(!degraded)`/`if(degraded)` branch in the bridge into one if/else (same behavior).\n\ntypecheck 0 errors (both pkgs); codegen unchanged; cloud-shared shared-runtime + billing 25/25; lint clean.3d:T5fc,"])</script><script>self.__next_f.push([1,"## Summary\nIn-app chat against a serverless / shared-runtime Cloud agent **silently drops every send** — no user bubble, no network POST. Found via on-device (Seeker) testing + logcat.\n\n## Root cause\nThe Cloud REST adapter returns conversation objects as `{id,title,roomId,createdAt}` — **without `updatedAt`**. The shared `isConversationRecord` guard requires the full standard shape (incl. `updatedAt`), so for these agents:\n- `GET /api/conversations` filters to an empty list → no active conversation, and\n- `createConversation`'s result is rejected (throws),\n\nwhich makes `runQueuedChatSend` hit its `catch { return }` and drop the turn before the optimistic bubble or the message POST.\n\n## Fix\nNormalize at the API client boundary: default `updatedAt` to `createdAt` (a never-updated conversation legitimately has them equal) in `listConversations` and `createConversation`. Clean DTO completion, not a server-specific special case; a server-provided `updatedAt` is preserved untouched. Adds regression tests.\n\n## Verification\n- On Seeker (cloud agent): before → send dropped (0 `POST /messages`); after → user bubble renders + `POST /messages → 200` fires.\n- `packages/ui` typecheck clean for this change (pre-existing `src/spatial/tui` errors are an unbuilt `@elizaos/tui` dep, unrelated); 3 new regression tests pass.\n\n## Note for cloud\nCloud adapters should also emit `updatedAt` on conversation objects for full conformance with every elizaOS client (web/desktop/CLI); this PR keeps the app correct regardless."])</script><script>self.__next_f.push([1,"3e:T7a7,"])</script><script>self.__next_f.push([1,"App-side half of getting mobile cloud chat working end-to-end. Follow-up to #8527 (REST chat adapter). Verified on a Solana Seeker.\n\nAfter Google sign-in the agent provisions on the shared runtime, but chat never loaded. Two app-side bugs:\n\n### 1. Wrong base — onboarding pointed the client at `/bridge`, not the REST adapter\nThe onboarding \"Start now\" path (`use-first-run-controller.ts`) set the client base to `provisionedAgent.bridgeUrl` (`.../agents/\u003cid\u003e/bridge` — the JSON-RPC bridge), so **every** REST `/api/*` call 404'd. #8527 returns `webUiUrl` = the REST adapter base (`.../agents/\u003cid\u003e`) where the chat surface is actually served, and `useFirstRunCallbacks` already used `resolveCloudAgentApiBase()` to prefer it — but the controller path (the one onboarding actually uses) was never updated. Now it uses `resolveCloudAgentApiBase({bridgeUrl, webUiUrl})` too.\n\n### 2. First-run 404 was fatal\nA Tier-0 shared agent has no agent server, so the adapter base 404s `/api/first-run*` (it serves only conversations/messages/health). `startup-phase-poll` treated that as `BACKEND_NOT_FOUND` and bounced to onboarding. Added `isDirectCloudSharedAgentBase()` (matches the adapter base **and** the legacy `/bridge` base); at both first-run 404 sites it's now treated as first-run-complete → `BACKEND_REACHED` → startup proceeds to chat. (`/api/views` already degrades to `[]` on 404.)\n\n### Still needed (cloud-api follow-up to #8527, separate)\nFull chat needs the shared-runtime REST adapter to also synthesize the app's remaining shell endpoints — `/api/first-run`, `/api/first-run/status`, `/api/views`, `/api/config` (currently 404). This PR is the app-side half (correct base + non-fatal first-run); the adapter completeness is cloud-side.\n\n### Test plan\n- [x] `bun run --cwd packages/ui typecheck` + `lint` clean\n- [x] On-device: onboarding → Google → provision → client now targets `.../agents/\u003cid\u003e/api/*` (the adapter), not `/bridge`"])</script><script>self.__next_f.push([1,"3f:Tdda,"])</script><script>self.__next_f.push([1,"## What\n\nA full sweep over the cloud/infra docs so they stop lying about how the stack actually runs. Started as the \"headscale is on the CP, CP VMs are x86\" fix and grew into a clean docs base covering every stale infra claim I could find.\n\nAll docs-only (+ one Terraform prose comment). Verified live 2026-06-17/18.\n\n## Ground truth the docs now reflect\n\n1. **headscale (agent-launch path) runs on the Hetzner control-plane VMs**, not Railway — loopback API (staging `127.0.0.1:8080`, prod `127.0.0.1:8081`), nginx + Let's Encrypt out front, public DNS `headscale[-staging].elizacloud.ai` is an A-record to the CP. The Railway headscale runtime (Dockerfile / railway.toml / config.yaml / entrypoint.sh + `cloud-headscale.yml`) was deleted 2026-06-17; only `acl.hujson` remains. Railway stays only for the customer **tunnel-proxy** path.\n2. **Both control-plane VMs are x86 `cpx32`** (4 vCPU / 8 GB, ~€11/mo) — NOT `cax21`/ARM. Prod CP is `eliza-production-1` (env-suffixed), not the legacy `eliza-1`.\n3. **Data-plane node naming**: dedicated robot nodes are `eliza-core-{env}-N` in the `docker_nodes` table (the authoritative source; `CONTAINERS_DOCKER_NODES` env only seeds when empty); `eliza-core-\u003chex\u003e` is the autoscaler burst-node form. Old `milady-core-*` names are retired.\n4. **Cloud Postgres = Neon, ONE shared DB per env** (prod `ep-wild-smoke`, staging `ep-wild-dawn`); Steward is an embedded `steward` schema in that same DB. Per-agent Neon branches are legacy/retired.\n5. **Apps data plane** = separate Hetzner project; one live staging apps node today; prod apps node not yet live.\n6. **Eliza Cloud agents run as Docker containers on Hetzner robot nodes** (or shared-runtime Tier-0, container-free) — not AWS ECS.\n\n## Files\n\n- `cloud/terraform/hetzner/ARCHITECTURE.md` — x86/cpx32 fix; dropped the retired milady-core drain runbook + \"ARM notes\"; naming table now splits dedicated `eliza-core-{env}-N` from autoscaled `eliza-core-\u003chex\u003e`; multi-project layout fixed (ccx33→cpx32, only the live staging apps node).\n- `control-plane/README.md` — cax21/ARM cost line gone; adopt-existing-VM rename target is `eliza-production-1`.\n- `control-plane/variables.tf` + `production.tfvars.example` — prose now says both CPs run x86 cpx32; ARM is a possible future, not current state.\n- `cloud-infra/README.md` + `cloud/terraform/README.md` — headscale split off Railway; Neon shared-DB topology spelled out.\n- `cloud-infra/AGENTS.md` + `CLAUDE.md` — node-naming nuance, two per-env CPs, headscale-off-Railway pointer.\n- `cloud-infra/cloud/RAILWAY.md` — headscale row moved to the CP VM; Railway section scoped to tunnel-proxy.\n- `cloud-services/headscale/DEPLOY.md` — cut the decommissioned Headscale-on-Railway deploy section; DNS is an A-record to the CP; kept the tunnel-proxy-on-Railway steps.\n- `docs/deployment.mdx` — Eliza Cloud = Hetzner Docker nodes, not AWS ECS (intro + heading).\n- `cloud-shared/docs/CLOUD_ONBOARDING_PROVISIONING_REVIEW.md` — per-agent Neon branch provisioning flagged as legacy (shared-DB cutover).\n\n## Left as-is (on purpose)\n\n- `tunnel-proxy/README.md`, `headscale/README.md`, `apps-data-plane/README.md`, `AWS_RETIREMENT.md` — already correct / Railway here is the legit customer-tunnel path.\n- `main.tf` / `bootstrap.yaml.tftpl` cax21 mentions — accurate cross-arch facts (ForceNew warning, swap headroom), not the false \"prod runs cax21\" claim.\n- vast-pyworker `eliza-1` hits — that's the eliza-1 LLM model, not the CP VM.\n\n`terraform fmt` clean; docs link/nav tests pass."])</script><script>self.__next_f.push([1
