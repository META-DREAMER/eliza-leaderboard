gh the canonical `getLanguageModel()` (Cerebras for bare ids, BitRouter for everything else) so shared agents actually answer, and adds `GET /api/status` + `?viewType=` honoring so the mobile app boots into chat. typecheck + lint clean, tests added.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T05:51:27Z\",\"mergedAt\":\"2026-06-18T05:51:34Z\",\"additions\":351,\"deletions\":50},{\"id\":\"PR_kwDOMT5cIs7ny-MN\",\"title\":\"fix(cloud): shared agents answer (canonical model router) + boot the mobile shell\",\"author\":\"NubsCarson\",\"number\":8531,\"body\":\"$27\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T05:50:33Z\",\"mergedAt\":\"2026-06-18T05:50:45Z\",\"additions\":351,\"deletions\":50},{\"id\":\"PR_kwDOMT5cIs7n-mJy\",\"title\":\"feat(cloud-infra): codify headscale-on-CP cutover into IaC\",\"author\":\"standujar\",\"number\":8565,\"body\":\"$28\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T14:04:57Z\",\"mergedAt\":\"2026-06-18T19:01:23Z\",\"additions\":346,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7oGApb\",\"title\":\"Shaw/her voice dev\",\"author\":\"lalalune\",\"number\":8594,\"body\":\"$29\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T19:18:27Z\",\"mergedAt\":\"2026-06-18T19:30:34Z\",\"additions\":290,\"deletions\":71},{\"id\":\"PR_kwDOMT5cIs7oDhxL\",\"title\":\"feat(voice): Her-style bidirectional voice — chat button + conversational onboarding\",\"author\":\"lalalune\",\"number\":8581,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T17:20:55Z\",\"mergedAt\":\"2026-06-18T17:37:37Z\",\"additions\":271,\"deletions\":58},{\"id\":\"PR_kwDOMT5cIs7oKoEu\",\"title\":\"fix(plugin-openai): gate media model registration on endpoint capability\",\"author\":\"NubsCarson\",\"number\":8614,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:40:44Z\",\"mergedAt\":\"2026-06-18T23:46:14Z\",\"additions\":234,\"deletions\":28},{\"id\":\"PR_kwDOMT5cIs7nur4b\",\"title\":\"feat(ui): warm, jargon-free first-run onboarding\",\"author\":\"NubsCarson\",\"number\":8518,\"body\":\"$2c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T01:02:48Z\",\"mergedAt\":\"2026-06-18T03:07:23Z\",\"additions\":232,\"deletions\":176},{\"id\":\"PR_kwDOMT5cIs7oKEOg\",\"title\":\"feat(plugin-commands): complete + correct the slash-command navigation catalog\",\"author\":\"NubsCarson\",\"number\":8607,\"body\":\"$2d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T22:58:48Z\",\"mergedAt\":\"2026-06-18T23:30:23Z\",\"additions\":228,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs7oIOq3\",\"title\":\"plugin-telegram: harden the bot connector (markdown links, reactions, DM formatting, 429 resilience, allowlist)\",\"author\":\"NubsCarson\",\"number\":8603,\"body\":\"$2e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T21:10:15Z\",\"mergedAt\":\"2026-06-18T22:03:47Z\",\"additions\":206,\"deletions\":112},{\"id\":\"PR_kwDOMT5cIs7oKqMU\",\"title\":\"fix(core): gate attachment read hints on stored text, not failure prose\",\"author\":\"NubsCarson\",\"number\":8616,\"body\":\"$2f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:43:18Z\",\"mergedAt\":\"2026-06-18T23:46:49Z\",\"additions\":202,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs7oE6m-\",\"title\":\"plugin-telegram: derive connector role from a personal user identity\",\"author\":\"NubsCarson\",\"number\":8589,\"body\":\"$30\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T18:25:56Z\",\"mergedAt\":\"2026-06-18T18:57:18Z\",\"additions\":200,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs7n5_og\",\"title\":\"fix(ui/tutorial): peek-aware chat steps + manual-continue navigation\",\"author\":\"lalalune\",\"number\":8550,\"body\":\"$31\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T10:58:12Z\",\"mergedAt\":null,\"additions\":192,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs7n4Huj\",\"title\":\"fix(cloud-api): reconcile pricing catalog via OpenRouter fallback (no 500)\",\"author\":\"lalalune\",\"number\":8537,\"body\":\"$32\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T09:43:05Z\",\"mergedAt\":\"2026-06-18T10:04:48Z\",\"additions\":188,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7nuS4L\",\"title\":\"fix(apps): surface failed APP_DEPLOY + cover the lane seam (audit follow-ups to #8514)\",\"author\":\"NubsCarson\",\"number\":8515,\"body\":\"$33\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T00:33:43Z\",\"mergedAt\":\"2026-06-18T02:54:17Z\",\"additions\":185,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7oIOU2\",\"title\":\"feat(cloud): make cache + DB Railway-ready (Upstash→TCP Redis, Neon→Railway Postgres TLS)\",\"author\":\"lalalune\",\"number\":8602,\"body\":\"$34\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T21:09:59Z\",\"mergedAt\":\"2026-06-18T23:36:04Z\",\"additions\":179,\"deletions\":41},{\"id\":\"PR_kwDOMT5cIs7n3GfG\",\"title\":\"fix(cloud-api): payout-status resilience — unblock token redemption (no 500)\",\"author\":\"lalalune\",\"number\":8536,\"body\":\"Lands the final piece of the cloud-apps monetization work (the other 8 commits — Monetization→Apps rename, x402 image-gen example app, x402-earnings test, image-503 fix, redemption logging, clone-ur-crush Tailwind v4 fix, app_billing doc, operator runbook — are already on develop).\\n\\n**Root cause:** `PayoutStatusService.getStatus()` derived the EVM wallet (`privateKeyToAccount`) and built each network's RPC client with no try/catch, so a single malformed payout key or one unconfigured-RPC network threw out of `getStatus()` and **500'd the entire token-redemption flow** (quote + status + execute) — found live by executing a real redemption. Now every per-network/per-wallet failure degrades to `not_configured` and `getStatus()` never throws. Pinned by `payout-status-resilience.test.ts`.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T09:03:32Z\",\"mergedAt\":\"2026-06-18T09:25:09Z\",\"additions\":177,\"deletions\":33},{\"id\":\"PR_kwDOMT5cIs7oKpbJ\",\"title\":\"feat(ui): rename cloud agents in-app (Settings → Agents)\",\"author\":\"NubsCarson\",\"number\":8615,\"body\":\"Builds on #8608 (`PATCH /api/v1/eliza/agents/:id` — rename + edit in place) and #8609 (the in-app agent manager).\\n\\n- **`client-cloud`**: `updateCloudCompatAgent(agentId, { agentName?, agentConfig? })` → PATCHes the agent (same direct/native/fetch fallback shape as `deleteCloudCompatAgent`).\\n- **`CloudAgentsSection`**: a pencil action per agent opens an **inline rename** field (Enter saves, Esc cancels); on save it PATCHes and updates the list in place.\\n\\nCompletes the manage/edit story: list / switch / create+name / **rename** / delete. The client method also accepts `agentConfig`, so an in-app **system-prompt editor** is a small follow-up on the same endpoint.\\n\\ntypecheck + biome + ui tests green. Follows the proven manager pattern (delete/create already verified on-device).\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:42:23Z\",\"mergedAt\":\"2026-06-18T23:42:39Z\",\"additions\":163,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7n5NI0\",\"title\":\"fix(cloud): shared agents serve /api/auth/me + /api/character + declare no-websocket\",\"author\":\"NubsCarson\",\"number\":8545,\"body\":\"Develop sync of #8543 (merged to main for prod). Adds /api/auth/me (authed machine identity, exact app shape), /api/character (the character the shared turn answers as, via getSharedRuntimeCharacter), and {websocket:false} in /api/config so the app skips the doomed WS for shared bases. No Worker WS built. Test file reconciled onto develop's mock.module pattern; 17/17 pass, typecheck 0 errors, lint clean.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T10:25:44Z\",\"mergedAt\":\"2026-06-18T10:25:53Z\",\"additions\":154,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs7n5EOx\",\"title\":\"fix(cloud): shared agents serve /api/auth/me + /api/character + declare no-websocket\",\"author\":\"NubsCarson\",\"number\":8543,\"body\":\"$35\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T10:20:36Z\",\"mergedAt\":\"2026-06-18T10:20:46Z\",\"additions\":153,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs7nuTbn\",\"title\":\"fix(android): ship the full Capacitor plugin set that actually loads (#8387) + stop the first-run notification nag\",\"author\":\"NubsCarson\",\"number\":8516,\"body\":\"$36\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T00:34:28Z\",\"mergedAt\":\"2026-06-18T03:07:20Z\",\"additions\":148,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oIIvV\",\"title\":\"fix(plugin-commands): complete connector-catalog API so build:core passes (unblocks prod deploy)\",\"author\":\"NubsCarson\",\"number\":8600,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T21:05:24Z\",\"mergedAt\":\"2026-06-18T21:06:34Z\",\"additions\":144,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7oDOui\",\"title\":\"fix(cloud): enable Worker cache via Upstash REST\",\"author\":\"odilitime\",\"number\":8578,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T17:06:43Z\",\"mergedAt\":\"2026-06-18T19:01:28Z\",\"additions\":140,\"deletions\":9},{\"id\":\"PR_kwDOMT5cIs7oGec4\",\"title\":\"feat(ui): make the floating chat the search box across page views\",\"author\":\"lalalune\",\"number\":8597,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T19:40:11Z\",\"mergedAt\":\"2026-06-18T19:44:20Z\",\"additions\":138,\"deletions\":222},{\"id\":\"PR_kwDOMT5cIs7oIWt8\",\"title\":\"feat(ui): discoverable chat-driven search — in-view hint across all search views\",\"author\":\"lalalune\",\"number\":8605,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T21:17:17Z\",\"mergedAt\":\"2026-06-18T22:03:40Z\",\"additions\":137,\"deletions\":44},{\"id\":\"PR_kwDOMT5cIs7oCl3n\",\"title\":\"fix(cloud): persist shared-runtime chat history in Postgres (durable, cache-independent)\",\"author\":\"NubsCarson\",\"number\":8576,\"body\":\"Prod ship of #8575 (also on develop). Shared agents stored chat history only in the request cache, which is disabled on the prod Worker (`CACHE_ENABLED=false`) → history never persisted + no cross-turn memory. Moves it to an isolated Postgres table (`shared_runtime_history`), independent of the cache flag. Migration 0146 (additive `CREATE TABLE IF NOT EXISTS`) **already applied to the prod Neon DB out of band**, so the table exists before this deploys. typecheck 0 errors, 27/27 tests. cc @standujar.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T16:35:26Z\",\"mergedAt\":\"2026-06-18T16:35:29Z\",\"additions\":127,\"deletions\":23},{\"id\":\"PR_kwDOMT5cIs7oCk5Y\",\"title\":\"fix(cloud): persist shared-runtime chat history in Postgres (durable, cache-independent)\",\"author\":\"NubsCarson\",\"number\":8575,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T16:34:46Z\",\"mergedAt\":\"2026-06-18T16:35:01Z\",\"additions\":127,\"deletions\":23},{\"id\":\"PR_kwDOMT5cIs7oEZa1\",\"title\":\"chore(cloud): tighten shared-runtime mobile-chat code to the 5 clean-code rules\",\"author\":\"NubsCarson\",\"number\":8586,\"body\":\"Prod ship of #8584 (also on develop). Dedup the triplicated `resolveSharedAgent` into one shared module (+ route the health leaf through it so it 404s for foreign agents instead of returning ok), inline single-use `SharedRest*` types, drop dead tier helpers + unused usage fields, collapse an inverted degraded branch. **No behavior change except the health-leaf correctness fix.** typecheck 0 errors, codegen unchanged, 25/25 shared-runtime+billing tests, lint clean. Net -88 LOC.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T18:01:55Z\",\"mergedAt\":\"2026-06-18T18:01:58Z\",\"additions\":126,\"deletions\":214},{\"id\":\"PR_kwDOMT5cIs7oEMYv\",\"title\":\"chore(cloud): tighten shared-runtime mobile-chat code to the 5 clean-code rules\",\"author\":\"NubsCarson\",\"number\":8584,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T17:52:10Z\",\"mergedAt\":\"2026-06-18T17:52:13Z\",\"additions\":126,\"deletions\":214},{\"id\":\"PR_kwDOMT5cIs7oBDkX\",\"title\":\"fix(ui): default conversation updatedAt so Cloud chat sends aren't dropped\",\"author\":\"NubsCarson\",\"number\":8569,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T15:31:53Z\",\"mergedAt\":null,\"additions\":122,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7nyTcE\",\"title\":\"fix(cloud): first-run targets the shared-agent REST adapter base + tolerates its shell 404s (follow-up to #8527)\",\"author\":\"NubsCarson\",\"number\":8529,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T05:12:05Z\",\"mergedAt\":\"2026-06-18T07:31:24Z\",\"additions\":120,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs7n902O\",\"title\":\"docs(infra): clean docs base — match the cloud docs to the verified live infra\",\"author\":\"standujar\",\"number\":8560,\"body\":\"$3f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:38:36Z\",\"mergedAt\":\"2026-06-18T17:59:39Z\",\"additions\":119,\"deletions\":134},{\"id\":\"PR_kwDOMT5cIs7nrdqF\",\"title\":\"ci: reduce Linux build cache disk I/O\",\"author\":\"odilitime\",\"number\":8513,\"body\":\"## Summary\\n\\n- Remove the forced `--no-cache` flag from the root `build:core` script.\\n- Remove the forced `--no-cache` flag from the root `build:server` script.\\n- Enable remote-only Turborepo cache for the self-hosted Linux Cloud CF deploy jobs with `TURBO_CACHE=remote:rw`.\\n\\n## Why\\n\\nStaging Linux runners can reuse Turbo cache automatically when these scripts do not explicitly disable it. The Cloud CF deploy jobs run `build:core` on the self-hosted Hetzner runner, so remote-only Turbo cache avoids writing local `.turbo` cache artifacts while still allowing remote cache hits/uploads.\\n\\nTogether these should reduce repeated build work and disk I/O on the staging machine.\\n\\n## Validation\\n\\n- `bun -e \\\"JSON.parse(await Bun.file('package.json').text()); console.log('package.json ok')\\\"`\\n- `ruby -e \\\"require 'yaml'; YAML.load_file('.github/workflows/cloud-cf-deploy.yml'); puts 'cloud-cf-deploy.yml ok'\\\"`\\n- `TURBO_CACHE=remote:rw bun run build:core --dry-run=json`\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T21:37:02Z\",\"mergedAt\":\"2026-06-18T08:07:24Z\",\"additions\":111,\"deletions\":38},{\"id\":\"PR_kwDOMT5cIs7n5kNS\",\"title\":\"refactor(facewear): finish hearwear→facewear rename, remove consolidation guard\",\"author\":\"lalalune\",\"number\":8546,\"body\":\"$40\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T10:40:24Z\",\"mergedAt\":\"2026-06-18T10:40:36Z\",\"additions\":106,\"deletions\":628},{\"id\":\"PR_kwDOMT5cIs7oA3H4\",\"title\":\"chore(deps): bump pypdf from 6.13.0 to 6.13.3 in /packages/benchmarks/OSWorld in the uv group across 1 directory\",\"author\":\"dependabot\",\"number\":8568,\"body\":\"$41\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T15:23:45Z\",\"mergedAt\":\"2026-06-18T17:23:23Z\",\"additions\":105,\"deletions\":115},{\"id\":\"PR_kwDOMT5cIs7n5ydW\",\"title\":\"fix(ui): skip websocket for shared cloud agents\",\"author\":\"odilitime\",\"number\":8549,\"body\":\"## Summary\\n- Treat direct shared-runtime Cloud agent bases as REST/SSE-only in the UI API client.\\n- Reuse the existing synthetic connected state instead of attempting /ws for those bases.\\n- Add regression coverage for current shared adapter bases, legacy bridge bases, and normal HTTP agent WebSockets.\\n\\n## Why\\nShared-runtime agents run in the Cloud Worker. They now expose REST chat endpoints and /api/config advertises websocket:false, but the UI client still derived wss://api.elizacloud.ai/ws from the adapter base. After reconnect attempts failed, the shell showed ConnectionLostOverlay even though REST chat could work.\\n\\n## Validation\\n- bun run --cwd packages/ui test -- client-base-websocket.test.ts\\n- bunx @biomejs/biome check packages/ui/src/api/client-base.ts packages/ui/src/api/client-base-websocket.test.ts\\n- git diff --check\\n\\nNote: bun run --cwd packages/ui typecheck currently fails on develop due existing src/spatial/tui imports for @elizaos/tui, unrelated to this change.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T10:49:12Z\",\"mergedAt\":\"2026-06-18T19:01:18Z\",\"additions\":102,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7oKQOw\",\"title\":\"feat(cloud-api): PATCH /agents/:id — rename + in-place edit\",\"author\":\"NubsCarson\",\"number\":8608,\"body\":\"Adds in-place agent edit (the app had no rename endpoint; `PATCH /agents/:id` was lifecycle-only).\\n\\nA PATCH body **without** `action` is an edit: `{ agentName?, agentConfig? }`.\\n- `elizaSandboxService.updateAgentProfile` — `findByIdAndOrgForWrite` → set `agent_name` and/or **merge** `agent_config` (partial edit never drops keys) → `repository.update`.\\n- Route branches on `action` presence; lifecycle path unchanged; `editAgentSchema` (name 1-100, config object, ≥1 required).\\n- Shared + dedicated. Name edits apply immediately; dedicated container config edits apply on next provision/restart.\\n\\nCloses the rename ask in `ELIZA_CLOUD_DEDICATED_AGENT_ENABLEMENT_SPEC.md`. Typecheck: cloud-shared 0 / cloud-api route 0.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:11:17Z\",\"mergedAt\":\"2026-06-18T23:30:15Z\",\"additions\":90,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oG4cr\",\"title\":\"feat(ui): chat-driven search for the remaining views (sidebars + standalone)\",\"author\":\"lalalune\",\"number\":8599,\"body\":\"$42\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T19:59:19Z\",\"mergedAt\":\"2026-06-18T20:34:43Z\",\"additions\":86,\"deletions\":167},{\"id\":\"PR_kwDOMT5cIs7oElzU\",\"title\":\"test(cloud-api): run unit tests process-per-file to kill mock.module cross-contamination\",\"author\":\"NubsCarson\",\"number\":8588,\"body\":\"Main sync of #8587. Runs each cloud-api unit test file in its own bun process (test/run-unit-isolated.mjs) so collection-time mock.module overrides can't cross-contaminate (the stripe-waifu / orphan-cleanup order-dependent flake). 24/24 files, 145/145 tests, deterministic. No prod code, no test-assertion changes; deploy gate (test:e2e) unaffected.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T18:10:39Z\",\"mergedAt\":\"2026-06-18T18:10:42Z\",\"additions\":74,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oElOT\",\"title\":\"test(cloud-api): run unit tests process-per-file to kill mock.module cross-contamination\",\"author\":\"NubsCarson\",\"number\":8587,\"body\":\"$43\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T18:10:13Z\",\"mergedAt\":\"2026-06-18T18:10:17Z\",\"additions\":74,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oC859\",\"title\":\"fix(ci): resolve 4 failures the develop→main promote exposed\",\"author\":\"lalalune\",\"number\":8577,\"body\":\"The develop→main promote ran develop's full CI lanes to completion (they never complete on develop itself due to concurrency-cancellation), exposing 4 real failures present on develop:\\n- **Client Tests**: packages/ui spatial tests import @elizaos/tui (loaded '0 test') → build tui before test:client.\\n- **Build Agent Image** boot crash: @elizaos/ui barrel statically imported native-only @capacitor/{keyboard,haptics,preferences} (pulled into the Node agent via plugin-inbox) → dynamic-import them at their isNative-guarded call sites (mobile behavior preserved).\\n- **gitleaks**: public token addresses in cloud-frontend e2e specs → allowlist tests/e2e/*.spec.\\n- **Quality + frozen lanes**: setup-bun-workspace hard-failed on bun-canary bun.lock reserialization → restore the committed lock after fallback.\\n\\nVerified: ui+tui build clean, spatial 43/43, gitleaks clean, no static @capacitor non-core imports remain in dist.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T16:53:26Z\",\"mergedAt\":\"2026-06-18T16:53:29Z\",\"additions\":70,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs7npyGF\",\"title\":\"fix(cloud): honor bridge-host fallback when injecting TS_AUTHKEY\",\"author\":\"lalalune\",\"number\":8504,\"body\":\"$44\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:11:25Z\",\"mergedAt\":\"2026-06-18T07:31:19Z\",\"additions\":62,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oKtX3\",\"title\":\"fix(core): never surface scratch prose from a STOP-only planner terminal\",\"author\":\"NubsCarson\",\"number\":8617,\"body\":\"$45\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:47:25Z\",\"mergedAt\":\"2026-06-18T23:49:39Z\",\"additions\":61,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7nPMUy\",\"title\":\"fix(cloud): harden staging proxy and SDK live smoke\",\"author\":\"odilitime\",\"number\":8462,\"body\":\"$46\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-16T23:35:44Z\",\"mergedAt\":\"2026-06-18T07:31:22Z\",\"additions\":60,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7oJPLD\",\"title\":\"plugin-telegram: fail fast on a rejected bot token + guard the typing action\",\"author\":\"NubsCarson\",\"number\":8606,\"body\":\"$47\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T22:09:55Z\",\"mergedAt\":\"2026-06-18T22:22:09Z\",\"additions\":57,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oKZVV\",\"title\":\"test(cloud-shared): skip Windows-only degraded shared-runtime turn assertion\",\"author\":\"lalalune\",\"number\":8610,\"body\":\"$48\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:21:20Z\",\"mergedAt\":\"2026-06-18T23:21:30Z\",\"additions\":55,\"deletions\":45},{\"id\":\"PR_kwDOMT5cIs7oCiSE\",\"title\":\"registry: add @human.tech/plugin-waap (third-party)\",\"author\":\"Muzzamil1\",\"number\":8574,\"body\":\"$49\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T16:33:02Z\",\"mergedAt\":\"2026-06-18T17:58:31Z\",\"additions\":55,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7n9kPF\",\"title\":\"fix(ci): @elizaos/tui src resolution + relationships LLM journey + biome\",\"author\":\"lalalune\",\"number\":8557,\"body\":\"Three develop CI-lane fixes (all verified locally):\\n- **Zero-Key app browser / renderer builds**: alias `@elizaos/tui` to its src in the app vite config — it lacks an exports/eliza-source map so renderer builds that don't pre-build it failed to resolve it. Verified: app build passes with tui's dist deleted.\\n- **Server Tests**: add the relationships gui case so its LLM mock journey auto-generates (4/4 gate pass).\\n- **Quality (Extended)**: biome-format 2 plugin-discord files.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:28:00Z\",\"mergedAt\":\"2026-06-18T13:28:03Z\",\"additions\":49,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs7n94a5\",\"title\":\"fix(cloud): heartbeat cycle skips shared-runtime agents (no container to dial)\",\"author\":\"standujar\",\"number\":8561,\"body\":\"$4a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:40:45Z\",\"mergedAt\":\"2026-06-18T19:01:11Z\",\"additions\":44,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7n6L1t\",\"title\":\"fix(ci): green up gitleaks (full-history scans) + metrics-dashboard build [main]\",\"author\":\"lalalune\",\"number\":8552,\"body\":\"$4b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T11:07:05Z\",\"mergedAt\":\"2026-06-18T11:55:06Z\",\"additions\":43,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7n6KXa\",\"title\":\"fix(ci): green up gitleaks (full-history scans) + metrics-dashboard build\",\"author\":\"lalalune\",\"number\":8551,\"body\":\"$4c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T11:06:09Z\",\"mergedAt\":\"2026-06-18T11:20:19Z\",\"additions\":43,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7n9_57\",\"title\":\"fix(scenario): app-control delete uninstalls via /api/plugins/uninstall\",\"author\":\"lalalune\",\"number\":8562,\"body\":\"Fixes the Zero-Key scenario e2e failures (deterministic-app-control-actions + nl-routing). The 'real uninstall' code change moved teardown to POST /api/plugins/uninstall; the scenarios still mocked /api/apps/stop, so delete reported 'Deletion partially failed'. Intercept /api/plugins/*, add the uninstall handler, and update the exact HTTP ledger. Verified: 2/2 scenarios pass under strict LLM proxy.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:45:02Z\",\"mergedAt\":\"2026-06-18T13:45:06Z\",\"additions\":40,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs7oBhn7\",\"title\":\"fix(cloud-api): add missing Worker stub exports (unblocks staging deploys)\",\"author\":\"NubsCarson\",\"number\":8573,\"body\":\"Develop sync of #8572 (merged to main to unblock prod). Adds `runWithTrajectoryContext` + `parseJsonModelRecord` to the Worker @elizaos/core stub — the email-classification import pulled in via the spatial-framework promote broke the esbuild bundle on both branches. Verified via wrangler dry-run. Unblocks develop→staging deploys too.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T15:50:55Z\",\"mergedAt\":\"2026-06-18T15:50:59Z\",\"additions\":38,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7oBgcc\",\"title\":\"fix(cloud-api): add missing Worker stub exports (unblocks ALL prod deploys)\",\"author\":\"NubsCarson\",\"number\":8572,\"body\":\"$4d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T15:50:05Z\",\"mergedAt\":\"2026-06-18T15:50:20Z\",\"additions\":38,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7nvRoj\",\"title\":\"fix(cloud): app.elizacloud.ai-\u003eapex sign-in redirect + unblock main-\u003eprod deploys (opus)\",\"author\":\"NubsCarson\",\"number\":8519,\"body\":\"$4e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T01:45:51Z\",\"mergedAt\":\"2026-06-18T02:52:27Z\",\"additions\":33,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7nveBE\",\"title\":\"fix(cloud): make /api/auth/logout public so sign-out tears down the session (prod hotfix)\",\"author\":\"lalalune\",\"number\":8521,\"body\":\"$4f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T02:01:02Z\",\"mergedAt\":\"2026-06-18T03:08:17Z\",\"additions\":32,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs7nvc5m\",\"title\":\"fix(cloud): make /api/auth/logout public so sign-out tears down the session\",\"author\":\"lalalune\",\"number\":8520,\"body\":\"$50\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T01:59:45Z\",\"mergedAt\":\"2026-06-18T03:07:17Z\",\"additions\":32,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs7n9R1Q\",\"title\":\"fix(test): restore app coverage-gate lockstep (Client Tests green)\",\"author\":\"lalalune\",\"number\":8556,\"body\":\"Fixes the 5 Client Tests coverage-gate failures on develop with genuine coverage entries (all verified — selectors, bundle export, and view source all exist). See commit body. Locally: route-coverage + hmr-coverage + ui-smoke-coverage = 17/17 pass.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:17:33Z\",\"mergedAt\":\"2026-06-18T13:17:35Z\",\"additions\":31,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs7nvx6P\",\"title\":\"fix(cloud-api): gate apps-deploy (503) + models/status GET 405 (launch hardening)\",\"author\":\"NubsCarson\",\"number\":8523,\"body\":\"Two non-blocking hardening fixes surfaced by the launch-readiness verification sweep (do NOT gate launch; safe to land anytime).\\n\\n**1. apps/[id]/deploy → 503 when not enabled.** Until Product-2 is armed (`APPS_DEPLOY_ENABLED=1` on the Worker), `POST /api/v1/apps/:id/deploy` would create a deployment that flips the app to `building` with no trigger to advance it → stranded app, no URL, no recovery. Now returns 503 `apps_deploy_disabled`. Auto-opens when `APPS_DEPLOY_ENABLED=1` lands (#8425). (Not web-reachable today — no deploy button — but closes the CLI footgun.)\\n\\n**2. models/status GET → 405.** A bare GET fell through to the `[...model]` catalog splat and 500'd. Now a clean 405 (POST-only endpoint; POST unchanged). Verified live: POST works, all launch models `available:true`.\\n\\nbiome + typecheck clean. Refs #8434\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T02:28:17Z\",\"mergedAt\":\"2026-06-18T02:55:10Z\",\"additions\":28,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7oBXTC\",\"title\":\"fix(cloud): shared conversations carry updatedAt + status reports canRespond\",\"author\":\"NubsCarson\",\"number\":8571,\"body\":\"Prod ship of #8570 (also on develop). Adds `updatedAt` to shared conversation objects (the client's isConversationRecord() guard requires it — else sends were silently dropped) and `canRespond:true` to /api/status (the composer's send-gate is `canRespond ?? (running \u0026\u0026 model)`; a shared agent has no local model). typecheck 0, 17/17 tests, lint clean. Related history-persistence issue (CACHE_ENABLED=false on the prod Worker) flagged to @standujar separately.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T15:43:49Z\",\"mergedAt\":\"2026-06-18T15:43:52Z\",\"additions\":27,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7oBWeX\",\"title\":\"fix(cloud): shared conversations carry updatedAt + status reports canRespond\",\"author\":\"NubsCarson\",\"number\":8570,\"body\":\"$51\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T15:43:18Z\",\"mergedAt\":\"2026-06-18T15:43:27Z\",\"additions\":27,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7n64dY\",\"title\":\"feat(ui): tutorial UX fixes + full-completion e2e (Help-via-chat follow-up)\",\"author\":\"lalalune\",\"number\":8554,\"body\":\"$52\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T11:38:23Z\",\"mergedAt\":\"2026-06-18T17:59:04Z\",\"additions\":23,\"deletions\":72},{\"id\":\"PR_kwDOMT5cIs7nwX44\",\"title\":\"fix(android): always reconcile the Capacitor plugin manifest (follow-up to #8516)\",\"author\":\"NubsCarson\",\"number\":8526,\"body\":\"$53\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T03:16:54Z\",\"mergedAt\":\"2026-06-18T03:26:49Z\",\"additions\":22,\"deletions\":13},{\"id\":\"PR_kwDOMT5cIs7oF0QL\",\"title\":\"test(ui/voice): fix mic-gesture tests for the merged hands-free/dictation change\",\"author\":\"lalalune\",\"number\":8593,\"body\":\"Follow-up to the Her-style voice change merged in #8581. That PR changed the chat\\nmic behavior (tap = hands-free conversation, hold = dictation-into-draft) but the\\nmic-gesture tests still asserted the old behavior, so develop's test lanes went\\nred after the merge. This updates them:\\n\\n- **assistant-home-flow.spec.ts**: push-to-talk now dictates the held transcript\\n  into the composer draft (no auto-send) — assert the composer value, not a\\n  submitted turn.\\n- **ContinuousChatOverlay.test.tsx / .slash.test.tsx**: add\\n  `handsFree`/`toggleHandsFree`/`setDictationSink` to the mock `ShellController`\\n  (the overlay's dictation-sink mount effect calls `setDictationSink`, which\\n  threw on the partial mock and crashed the overlay tests); the tap test now\\n  asserts `toggleHandsFree` (was `toggleRecording`).\\n\\nPure test update — no production code change. biome-clean.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T19:09:53Z\",\"mergedAt\":\"2026-06-18T19:15:41Z\",\"additions\":19,\"deletions\":13},{\"id\":\"PR_kwDOMT5cIs7oILy4\",\"title\":\"fix(cloud-shared): shared-rest-adapter immune to mock.module ordering (Windows flake)\",\"author\":\"lalalune\",\"number\":8601,\"body\":\"Fixes the intermittent Windows CI `test-cloud-shared` failure (3 `shared-rest-adapter` tests: 'elizaSandboxService.bridge is an instance of Promise'). bun's process-global `mock.module` + module caching lets a sibling test bind the adapter's captured `elizaSandboxService` import before this test's mock installs; Windows' file order triggers it. Fix: read `elizaSandbox.elizaSandboxService` lazily through the module namespace at call-time — immune to import order. 17/17 adapter tests still pass.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T21:07:57Z\",\"mergedAt\":\"2026-06-18T21:08:00Z\",\"additions\":18,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7nwCx_\",\"title\":\"fix(apps): DirectPgExecutor accepts the tenant DB self-signed cert (real Product-2 blocker)\",\"author\":\"NubsCarson\",\"number\":8525,\"body\":\"$54\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T02:50:19Z\",\"mergedAt\":\"2026-06-18T02:54:14Z\",\"additions\":18,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7n9yQj\",\"title\":\"fix(ci): make @elizaos/tui resolvable for plugin spatial tests\",\"author\":\"lalalune\",\"number\":8559,\"body\":\"Greens the Plugin Tests lane: the 45 spatial-view tests import @elizaos/ui/spatial/tui → @elizaos/tui, which had no exports map and was never built before Plugin Tests, so vitest couldn't resolve it. Adds the standard exports map to @elizaos/tui + builds it before the plugin tests. Verified: plugin-wallet-ui InventorySpatialView.test.tsx 3/3 pass with ui+tui built.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:36:49Z\",\"mergedAt\":\"2026-06-18T13:36:52Z\",\"additions\":17,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7nvlkQ\",\"title\":\"fix(cloud): accept shared-runtime in BOTH first-run paths (native launch blocker)\",\"author\":\"NubsCarson\",\"number\":8522,\"body\":\"$55\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T02:10:56Z\",\"mergedAt\":\"2026-06-18T02:54:40Z\",\"additions\":17,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oFdW7\",\"title\":\"style(plugin-capacitor-bridge): biome-format model-grind.ts\",\"author\":\"lalalune\",\"number\":8590,\"body\":\"Fixes the Quality (Extended) + ci lint-and-format failure surfaced by the develop→main promote: new iOS model-grind code landed unformatted. `biome format --write`.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T18:53:25Z\",\"mergedAt\":\"2026-06-18T18:53:28Z\",\"additions\":15,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7n5wWQ\",\"title\":\"fix(cloud): shared agent /api/config declares streaming:false too\",\"author\":\"NubsCarson\",\"number\":8548,\"body\":\"Develop sync of #8547 (merged to main). /api/config now returns {websocket:false, streaming:false} so the app uses non-stream REST cleanly + can delete its per-base special-casing. typecheck 0, 17/17 tests, lint clean.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T10:48:03Z\",\"mergedAt\":\"2026-06-18T10:48:07Z\",\"additions\":15,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs7n5uzH\",\"title\":\"fix(cloud): shared agent /api/config declares streaming:false too\",\"author\":\"NubsCarson\",\"number\":8547,\"body\":\"Completes transport-capability negotiation for serverless (Tier-0) agents: /api/config now returns `{websocket:false, streaming:false}`. A stateless in-Worker agent has no token-by-token SSE chat stream, so the client uses the non-stream `POST .../messages` (already returns the full reply) cleanly without probing a 404 — and can delete its per-base special-casing. Non-stream chat is the shipping behaviour for the shared tier; real SSE streaming + greeting remain optional future polish (per the app team's own call). typecheck 0 errors, 17/17 tests, lint clean. Follow-up to #8543.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T10:47:10Z\",\"mergedAt\":\"2026-06-18T10:47:37Z\",\"additions\":15,\"deletions\":11},{\"id\":\"PR_kwDOMT5cIs7oGxlY\",\"title\":\"fix(cloud-frontend): dashboard pages scroll again (canvas-only viewport clamp)\",\"author\":\"NubsCarson\",\"number\":8598,\"body\":\"Prod ship of the dashboard scroll fix (already on develop via #8596). Renders the `h-dvh overflow-hidden` clamp only in canvas mode so the classic dashboard's natural body-scroll works on every long page (/dashboard/agents, billing, analytics, admin); drops the orphaned CloudAssistantPill that 404'd on /api/v1/genui. typecheck 0, lint clean, build green, audit:cloud visual gate passed (all 38 routes). Deploying so it reaches elizacloud.ai.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T19:53:44Z\",\"mergedAt\":\"2026-06-18T19:53:47Z\",\"additions\":13,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs7oGcR_\",\"title\":\"fix(cloud-frontend): dashboard pages scroll again (canvas-only viewport clamp) + drop 404 GenUI pill\",\"author\":\"NubsCarson\",\"number\":8596,\"body\":\"$56\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T19:38:45Z\",\"mergedAt\":\"2026-06-18T19:39:36Z\",\"additions\":13,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs7nvz2a\",\"title\":\"fix(cloud-e2e): navigate to /dashboard/agents/deploy (green the lone stale e2e)\",\"author\":\"NubsCarson\",\"number\":8524,\"body\":\"Greens the single deterministic cloud-e2e red (41 pass / 1 fail). After the #8339 canvas redesign the deploy form mounts only at `/dashboard/agents/deploy` (cloud-canvas.tsx:449), but the 'deploys an agent with a custom image' spec navigated to the bare `/dashboard/agents` list and filled immediately → no name field → `.fill()` fails. Navigate straight to `/deploy` + `waitFor({state:'visible'})` before filling. **Product is unaffected** — all backend provision/billing/IDOR E2Es pass; this is purely the test catching up to the route change.\\n\\nCaveat: cloud-e2e needs the full mock stack to run, which I couldn't spin up locally — CI validates. If CI still flags it, the alternative is marking cloud-e2e non-required for the promote (the synthesis's fallback). Refs #8434\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T02:30:38Z\",\"mergedAt\":null,\"additions\":12,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7oKeY0\",\"title\":\"fix(cloud): heartbeat dials the bridge port, not the dead web_ui_port (dedicated agents stay running)\",\"author\":\"NubsCarson\",\"number\":8611,\"body\":\"Every running **dedicated** agent flips to `disconnected` → 404s at its public subdomain (agent-router only routes `running`). The heartbeat built its URL via `getAgentApiEndpoint` → `http://\u003cheadscale_ip\u003e:\u003cweb_ui_port\u003e`, but **web_ui_port is a host-only docker mapping, not reachable over the headscale tailnet** (`000`); the container serves its full API on the **bridge** port (`/api/health` → `200`, the same endpoint provisioning's health probe uses). So every cycle: `{ succeeded: 0, failed: 38 }` → all agents disconnected. Fix: heartbeat dials `getSafeBridgeEndpoint(rec, '/api/health')`. Verified live on the prod CP. This is the last blocker for the monetized dedicated-agent product (per #8434 / the dedicated-agent enablement spec).\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:27:53Z\",\"mergedAt\":\"2026-06-18T23:29:59Z\",\"additions\":10,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7n-Fy7\",\"title\":\"fix(ci): Env Audit tolerates bun-canary lockfile reserialization\",\"author\":\"lalalune\",\"number\":8563,\"body\":\"Env Audit was develop's last recurring red: its install gate did `git diff --exit-code -- bun.lock` after a non-frozen fallback, which fails on bun-canary's byte-level lockfile reserialization (identical graph, different bytes) rather than real drift. Restore the committed lock after the fallback install; real drift is still gated by the Tests/build lanes. Env-audit step is continue-on-error.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:48:23Z\",\"mergedAt\":\"2026-06-18T13:48:26Z\",\"additions\":10,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7oKvZ2\",\"title\":\"Nubs/fix dedicated agent heartbeat\",\"author\":\"lalalune\",\"number\":8618,\"body\":\"$57\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T23:50:03Z\",\"mergedAt\":null,\"additions\":9,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7oEDh6\",\"title\":\"fix(facewear): update smartglasses completion gate for refactored sources\",\"author\":\"lalalune\",\"number\":8583,\"body\":\"$58\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T17:45:43Z\",\"mergedAt\":\"2026-06-18T17:45:52Z\",\"additions\":9,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7nq3y7\",\"title\":\"fix(apps-data-plane): partition app-node private IP per env (prod↔staging collision)\",\"author\":\"NubsCarson\",\"number\":8511,\"body\":\"Prod apps data-plane `terraform apply` failed at `hcloud_server_network.app_node` with \\\"API request failed\\\": staging + production app nodes share the apps-shared subnet, but the private-IP offset was `20 + node_index` for **both** envs, so prod node #1 tried to claim `10.30.1.21` — already held by the staging app node.\\n\\nFix: partition the base per env — staging `20+` (21,22,…), production `30+` (31,32,…); tenant DB stays at host 10. Staging is unchanged (still .21), so no drift on the existing staging node. Verified by re-running the prod apply off this branch.\\n\\nPart of standing up the prod apps data-plane (Product-2 per-app DB + container hosting). Tracker #8434.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T21:04:23Z\",\"mergedAt\":\"2026-06-18T02:54:20Z\",\"additions\":8,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7muz8Q\",\"title\":\"feat(cloud-api): enable APPS_DEPLOY_ENABLED on production (cutover trigger)\",\"author\":\"NubsCarson\",\"number\":8425,\"body\":\"$59\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-15T21:00:06Z\",\"mergedAt\":\"2026-06-18T07:42:12Z\",\"additions\":7,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7n9wh3\",\"title\":\"chore(cloud): set prod STEWARD_TENANT_ID explicitly (no implicit default)\",\"author\":\"standujar\",\"number\":8558,\"body\":\"$5a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:35:40Z\",\"mergedAt\":\"2026-06-18T19:01:05Z\",\"additions\":6,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7oAc6v\",\"title\":\"chore(deps): bump vite from 7.3.5 to 8.0.16\",\"author\":\"dependabot\",\"number\":8566,\"body\":\"$5b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T15:08:46Z\",\"mergedAt\":\"2026-06-18T17:23:23Z\",\"additions\":5,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7n9AY1\",\"title\":\"fix(ci): build @elizaos/tui before ui in Build Agent Image renderer build\",\"author\":\"lalalune\",\"number\":8555,\"body\":\"$5c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-18T13:07:10Z\",\"mergedAt\":\"2026-06-18T13:07:13Z\",\"additions\":4,\"deletions\":1}],\"detailedContributorSummaries\":{\"Muzzamil1\":\"Muzzamil1: Expanded the ecosystem's integration capabilities by merging PR #8574 in elizaos/eliza, which added the @human.tech/plugin-waap third-party registry. This contribution focused entirely on configuration updates to support new plugin functionality.\",\"NubsCarson\":\"NubsCarson: Drove significant stability and feature enhancements across the elizaos/eliza ecosystem, most notably implementing persistent rust-crypto and cross-signing for the Matrix plugin in PR #8579 (+1910/-86 lines) and streamlining cloud agent management and authentication. Their work, which spanned 66 commits and 228 files, focused heavily on critical bug fixes (88% of activity) and infrastructure hardening to improve the reliability of cloud-based agent deployments and shared-runtime chat history.\",\"github-advanced-security\":\"github-advanced-security: No activity today.\",\"github-code-quality\":\"github-code-quality: No activity today.\",\"greptile-apps\":\"greptile-apps: Focused on collaborative code review and feedback, providing 111 comments across various pull requests. This effort centered entirely on technical discussion and review engagement rather than direct code contributions or issue management.\",\"lalalune\":\"lalalune: Drove extensive development across the elizaos/eliza repository by merging 39 pull requests that delivered major feature enhancements, including chat-driven search, bidirectional voice integration, and a unified spatial view framework, while simultaneously stabilizing the platform through critical CI, cloud API, and test suite fixes. Their work demonstrated a high-impact focus on system architecture and user experience, characterized by significant refactoring and the resolution of complex integration challenges across the codebase.\",\"odilitime\":\"odilitime: Focused on enhancing cloud infrastructure and UI stability by merging two key fixes in elizaos/eliza, including enabling Worker cache via Upstash REST (#8578) and optimizing websocket handling for shared cloud agents (#8549). Their work primarily centered on bugfixes, with a balanced distribution of effort across code, testing, and configuration files.\",\"standujar\":\"standujar: Focused on strengthening cloud infrastructure and system reliability, notably codifying the headscale-on-CP cutover via PR #8565 and resolving a heartbeat cycle bug in PR #8561. Their work primarily centered on bugfixes and infrastructure improvements, supported by documentation updates to align cloud resources with current versions.\"}},\"summaryContent\":\"No activity recorded for 2026-06-18.\",\"className\":\"self-end sm:self-start\"}]]}],\"$L5d\",\"$L5e\",\"$L5f\"]}]}]\n"])</script><script>self.__next_f.push([1,"60:I[3642796,[\"/eliza-leaderboard/_next/static/chunks/872c789639e5504e.js\",\"/eliza-leaderboard/_next/static/chunks/85ed81863e311381.js\",\"/eliza-leaderboard/_next/static/chunks/f907095fa5da043c.js\",\"/eliza-leaderboard/_next/static/chunks/3c4b6a41a4af2135.js\",\"/eliza-leaderboard/_next/static/chunks/e104a2dfca7e4183.js\",\"/eliza-leaderboard/_next/static/chunks/a400816e9dd4d7a4.js\",\"/eliza-leaderboard/_next/static
