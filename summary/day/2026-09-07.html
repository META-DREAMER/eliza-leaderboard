nrelated fragments from overriding managed configuration. No WAL queue-size discard cutoff is configured. Automatic expiry remains disabled pending independent deletion authority and restore proof.\n\n# Verification\n\n- Exact rebased head 54718f4e6cb0b2ff005ac5b04ded6d4e705ac0c6 passed root verification after install. Infrastructure source was unchanged by rebase.\n- Infrastructure suite: 124 passed, 0 failed, 752 assertions. Native Terraform: 8 plans passed, including unsafe repository-input rejection. Actual rendered YAML parsed and extracted check script matched the tested source byte-for-byte.\n- Rendered pgBackRest backup policy passed real PostgreSQL 16.15/pgBackRest 2.59.1 recovery over a local TLS S3 fixture with bad-credential and untrusted-CA rejection. Fixture-only identity, paths and credentials were substituted.\n- Generated host files ran in a separate Ubuntu 24.04 VM with pgBackRest 2.50 and PostgreSQL16. An exclusively fixture-file-backed loop volume exercised exact-device bootstrap and one-use initialization. Restart preserved data. Actual systemd initialization, full backup, check and schedule readback passed.\n- Separate Linux candidate restored a post-backup update and insert from WAL while the source remained deleted. A repository access failure produced check exit 41; restored access returned exit 0. All fixture timers/candidates and the VM were stopped afterward.\n\n## Linux evidence excerpt\n\n```text\ntenant-db-init.service: Result=success, ExecMainStatus=0\ntenant-db-pitr-init.service: Result=success, ExecMainStatus=0\ntenant-db-pitr-check.service: Result=success, ExecMainStatus=0\neffective data_directory: /mnt/tenant-pgdata/16/main\neffective archive_mode: on\neffective archive_timeout: 1min\nrestored rows: restored-wal-value, wal-only-insert\nsource row count after fixture deletion: 0\nrepository denied: Result=exit-code, ExecMainStatus=41\nrepository restored: Result=success, ExecMainStatus=0\neliza-cloud-pitr-proof: Stopped\n```\n\n# esource deletion or merge performed. No maintainer CI exception requested.\n"])</script><script>self.__next_f.push([1,"19:T4b7,## Outcome\\n\\nPrevents a rapid post-stream inference request from seeing a transient missing organization-balance hint and failing with billing_cache_warming.\\n\\n## Root cause\\n\\nStreaming closes before off-response billing settlement finishes. The committed debit invalidated the inference balance hint, then settlement re-read the authoritative balance and republished it. A request in that handoff gap saw a cache-only miss.\\n\\n## Fix\\n\\n- Preserve the previous revisioned balance hint only for Durable Object-fenced live settlement and alarm recovery.\\n- Keep all other credit-cache invalidations, including legacy non-DO inference debit eviction.\\n- Replace the preserved hint with the authoritative post-debit balance and revision before releasing the admission lease.\\n- Keep the provider response stream independent of settlement latency.\\n\\nBase: 64bbc6017571ba65f66fefe46dff267ea470e68c\\nCommit: 2a0368621df\\n\\n## Verification\\n\\n- 70 focused shared billing/admission/recovery tests pass.\\n- Concurrent admission overspend regression passes.\\n- Streaming response-before-billing regression passes.\\n- cloud/shared typecheck passes.\\n- Biome passes on all changed files.\\n- git diff --check passes.1a:T44a,## Summary\n- Route paid chain, market, EVM, Solana, and `executeWithBody` inventory through one shared adapter that calls `requireGenerativeRouteCaller` exactly once.\n- Forward the combined admission snapshot and credential into engine dispatch; combined Worker mode never falls back to generic auth or a second reserve path.\n- Migrate direct Birdeye paid handling onto that same standing read plus engine settlement (mark, dispatch, async reconcile) without duplicating standing.\n- Keep the legacy Birdeye 308 redirect and other public/read-only/internal routes explicitly exempt.\n\nFixes #30252\n\n## Test plan\n- [x] Inventor g admission Durable Object lease (`/lease` or `/lease-authorized`) (~26 ms)\n2. Dispatch marker (`/dispatch`) (~21 ms)\n\nThis PR resolves #30635 by fusing these two operations into a single durable commit at the provider boundary for `/v1/chat/completions`, eliminating ~21–26 ms of latency per request while preserving complete cancellation, zero-settlement, alarm-recovery, and replay invariants.\n\n---\n\n## Changes\n1. **Durable Object (`packages/cloud/api/src/inference-admission-gate.ts`)**:\n   - Added `dispatch?: boolean` and `preProviderCancellationToken?: string` to `LeaseRequest` and `AuthorizedLeaseRequest`.\n   - In `this.lease()`, atomically persist the lease with `phase: \"dispatched\"`, `preProviderCancellationToken`, and updated alarm/ledger in one commit when `dispatch: true`.\n   - Handled duplicate/replay: if already leased/dispatched, safely update expiry and return `dispatched: true, duplicate: true` without double debit.\n   - Preserved pre-provider release capability: `/release` allows releasing a dispatched lease if and only if the valid `preProviderCancellationToken` matches.\n\n2. **Client Service (`packages/cloud/shared/src/lib/services/inference-admission-gate.ts`)**:\n   - Added `dispatch?: boolean` to `acquireInferenceAdmissionLease`. Generates `preProviderCancellationToken` and sends it with `dispatch: true`.\n   - Updated `markInferenceAdmissionLeaseDispatched`: consumes `preProviderCancellationToken` when already dispatched (zero network round-trip).\n   - Updated `releaseInferenceAdmissionLease` \u0026 `settleInferenceAdmissionLease`: allows zero-settlement release using `preProviderCancellationToken` if upstream aborted before provider call.\n\n3. **Organization Admission (`packages/cloud/shared/src/lib/services/organization-inference-admission.ts`)**:\n   - Added `dispatch?: boolean` to `OrganizationInferenceAdmissionParams` and forwarded to `acquireInferenceAdmissionLease`.\n\n4. **Completions Route (`packages/cloud/api/v1/chat/completions/route.ts`)**:\n   - Passed `dispatch: true` to `admitOrganizationInference` so the initial admission gate combines lease + dispatch before calling the upstream provider.\n\n---\n\n## Verification\n- **Unit Tests**: Added 2 test cases in `packages/cloud/api/__tests__/inference-admission-gate.test.ts` verifying atomic combined lease + dispatch, idempotent replay, mismatched token refusal, and token-based release. (52/52 pass)\n- **Integration Tests**: Verified `chat-completions-passthrough-streaming.test.ts` (47/47 pass) and `chat-completions-optimistic-billing.test.ts` (17/17 pass).\n- **Static Analysis**: `bunx --bun biome check` passes with 0 errors.\n- **Typecheck**: `bun run --cwd packages/cloud/api typecheck` passes with 0 errors.\n\nCloses #30635"])</script><script>self.__next_f.push([1,"1f:T847,"])</script><script>self.__next_f.push([1,"## Scope\nFixes #30881. Restores the reviewed complete authorized-conversation provider and complete admitted planner tool/child-schema dispatch after the newer author commits reached develop during review. Preserves newer develop production changes through normal merges; no force push or direct develop push. Keeps the useful current-time wording, removes literal-copy test assertions, reconciles OpenAI wire proof with current strict-schema transport, corrects stale map-roundtrip documentation, and refreshes only the generated UI inventory scanned-file count.\n\n## Verification\n- Genuine RED then GREEN: 13/17 recall assertions fail against keyword gating; all 17 pass after restoration.\n- Genuine RED then GREEN: two planner execution cases fail against tool pruning; all 80 planner/final-wire budget tests pass after restoration.\n- Complete restored core implementation at b917: 12,082 tests pass, three skipped.\n- Combined OpenAI implementation at 491a: all 582 tests across 40 files pass; final conflict-reconciled real HTTP/AI-SDK wire suite 33/33 passes, including complete-schema round trips and explicit HTTP400 reject schema, no network or privileged path is altered. The parser never evaluates log text (error-policy:J3) and continues to emit categorical, identifier-free output only.\n\n# Background\n\n## What does this PR do?\n\nThe read-only staging worker diagnostic decodes the deployed worker's health-timeout frames via `summarizeHealthFrames(messages, targetDigest)`. That parser recognized only **Bun**'s `console` rendering of an ordinary object — a fixed 5-line, double-quoted, JSON-decodable frame.\n\nIn production the worker runs under **Node** and logs through the core redactor: the call site is `logger.warn(\"[docker-sandbox] Health timeout diagnostics\", { containerName, nodeId, diagnostics })` in `packages/cloud/shared/src/lib/services/docker-sandbox-provider.ts`, and the cloud logger pipes every argument through `redactLogArgs` from `@elizaos/core/edge` before `console.warn`. Node renders that redacted **null-prototype** object very differently from Bun:\n\n- header line `[docker-sandbox] Health timeout diagnostics [Object: null prototype] {`\n- **single-quoted** string values\n- a multiline `diagnostics` string emitted as `'part\\n' +` continuation lines, which Node's console sink caps at 10000 characters with a `'…'... N more characters` marker (a real concern here because the producer runs `docker logs --tail 160`).\n\nThe old 5-line/double-quote matcher therefore decoded **zero** frames from real staging output (it did not even count them malformed — it silently ignored them).\n\nThis PR extends `summarizeHealthFrames` to also recognize the Node frame shape:\n\n- A dedicated Node branch collects the null-prototype object until its closing `}`, then validates and decodes the whole block; interleaved/malformed/incomplete blocks increment `malformedFrames` and never certify a target.\n- The multiline `diagnostics` string is reassembled **losslessly** from its continuation lines. Console string literals are decoded by an explicit escape table (`\\n \\r \\t \\b \\f \\v \\0 \\\\ \\' \\\" \\` \\xNN \\uNNNN \\u{…}`); any unsupported sequence returns `null` so the frame is rejected — the raw literal is never `eval`'d (error-policy:J3).\n- Truncated frames (past the 10000-char console cap) are decoded from their surviving prefix and flagged `diagnosticsTruncated: true`, so an absent boot signal in a clipped tail is not misread as a confirmed absence (honest DTO state rather than a healthy-looking false).\n- The existing SHA-256 `containerName` → target-digest association and the categorical, identifier-free output are preserved for the Node path.\n\nExtracted facts are identical to the Bun path: `containerState`, `health`, `exitCode`, `inspectErrorPresent`, `authKeyMarker`, `bootSignals`.\n\n## What kind of change is this?\n\nBug fix (non-breaking; the Node path was previously undecodable).\n\n# Documentation changes needed?\n\nNo. Behavior of the read-only diagnostic is unchanged for operators; it now decodes an additional (production) frame format. No user-facing docs describe the internal frame grammar.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/cloud/scripts/admin/staging-worker-diagnostic.test.mjs` — the new `nodeFrame` helper builds each frame through the **real** `redactLogArgs` + Node `console.warn` (mirroring the existing Bun `consoleFrame` helper), so the test exercises the actual producer-to-parser boundary rather than a hand-written literal.\n\n## Detailed testing steps\n\n```bash\n# owning parser tests (node's built-in runner, as the existing suite uses)\nnode --test packages/cloud/scripts/admin/staging-worker-diagnostic.test.mjs\n# consumer that also imports summarizeJournal\nbun test packages/cloud/scripts/admin/personal-dedicated-rereview-staging.test.ts\n# format/lint on the two changed files\nnpx biome check packages/cloud/scripts/admin/staging-worker-diagnostic.mjs packages/cloud/scripts/admin/staging-worker-diagnostic.test.mjs\n```\n\nThe final acceptance bullet in the issue — rerunning the read- Changes\n1. **Export loopback validator**:\n   - Export `isLoopbackBase` from `packages/app-core/platforms/electrobun/src/native/auth-bridge.ts`.\n2. **Invoke agent lifecycle for external runtimes**:\n   - In `main()`, invoke `_startAgent()` when `rt.mode === \"external\" || rt.mode === \"local\"`.\n3. **Initialize loopback external runtime session**:\n   - In `_startAgent()`, check whether `externalApiBase` is a loopback address using `isLoopbackBase(externalApiBase)`.\n   - For external loopback runtimes, resolve `rendererBase` (accounting for Vite/dev-server loopback origin), prime the session via `primeDesktopSessionAuth(externalApiBase, rendererBase)`, publish the renderer-facing API base and token, set agent ready, and reload the renderer via `reloadRendererAfterDesktopSessionPrime`.\n4. **Preserve remote runtime isolation \u0026 fail-closed invariants**:\n   - Remote (non-loopback) external runtimes are strictly excluded from local session priming and never receive locally minted authority.\n   - Failed handshakes fail closed, leaving the renderer in the standard unauthenticated/login state.\n5. **Unit test coverage**:\n   - Added tests in `desktop-session-prime.test.ts` verifying:\n     - External loopback runtime primes authority across both API base and dev-server renderer origin.\n     - Remote external runtimes are distinguished and excluded by `isLoopbackBase`.\n     - Failed handshake produces no cookies and fails closed.\n\n## Verification\n- `node packages/scripts/run-vitest.mjs run --config packages/app-core/vitest.config.ts packages/app-core/platforms/electrobun/src/lifecycle/` (42 tests pass across 4 suites)\n- `bunx @biomejs/biome check packages/app-core/platforms/electrobun/src/index.ts packages/app-core/platforms/electrobun/src/lifecycle/desktop-session-prime.test.ts packages/app-core/platforms/electrobun/src/native/auth-bridge.ts` (clean, 0 errors)"])</script><script>self.__next_f.push([1,"25:Td14,"])</script><script>self.__next_f.push([1,"Rep rate file, so they do not conflict.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop`\n      with zero conflicts (`git fetch origin \u0026\u0026 git rebase origin/develop`).\n- [x] `bun install` and `bun run verify` were run after sync, or any failure is\n      recorded below with the exact unrelated blocker.\n- [x] A reviewer can confirm the change works without reading the code, from the\n      evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased/merged onto the latest `origin/develop`; zero conflicts.\n- [x] `bun run verify` passes post-sync, or the exact unrelated blocker is\n      documented in **Known gaps / failures** below.\n\n# Risks\n\nLow. On a well-formed file the helper's output is byte-identical to the plain append it replaces (pinned by test), file modes are unchanged, and the only new behavior is one leading newline when the file's last byte is not a newline. The tail check and the append are two operations, so the helper does not add cross-process serialization; the three callers are single-process or already lock-serialized, and the helper's header says so. One new export on the `@elizaos/shared` root barrel, which already carries Node-only helpers such as `eliza-root`.\n\n# Background\n\n## What does this PR do?\n\nThree append-only JSONL writers (`recordCall` in account-usage, `recordAccountPoolConsumerUsage` in consumer metering, the capability-broker audit log) append `JSON.stringify(record)` plus a newline, and their readers split on newlines and skip lines that fail to parse. An append interrupted before its newline leaves a torn final line, and the next successful append landed on that same line, so the reader discarded the intact record together with the torn bytes. Reproduced on `develop` through the real account-usage module: two records written, the counters report one (transcript under Domain artifacts).\n\n`appendJsonlRecord` in `@elizaos/shared` writes a newline first whenever the file does not already end with one, then appends the record. The three writers use it. A torn line now stays on its own line, every later record is readable, and a complete record that only lost its newline becomes readable too.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/shared/src/utils/jsonl-append.ts` and its test, then the three call sites and the regression added beside each: `account-usage.test.ts` (counters count the record after a torn line), `account-pool-consumer-metering.torn-append.test.ts` (the record lands on its own line), `capability-broker.test.ts` (the decision after a torn audit line parses).\n\n## Detailed testing steps\n\nAutomated tests. The red run under Domain artifacts shows the three consumer regressions failing against the develop writers.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed. `scripts/pr-evidence.mjs rows`\nsets this marker from the live PR head; rerun it after every push.\n\u003c!-- evidence-head:38ce978465b3ed0e4e3cb988b8adb12b4d48f273 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] Before full-page screenshots: `N/A - file-system append helper; no rendered UI surface.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] After full-page screenshots: `N/A - file-system append helper; no rendered UI surface.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] Video walkthrough: `N/A - no user flow.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Backend logs: tests, typecheck, and Biome across the three packages on this exact head, pasted below.\n\n  \u003cdetails\u003e\n  \u003csummary\u003evitest, typecheck, and Biome transcript on this head\u003c/summary\u003e\n\n  ```\n# Backend logs ates are captured below.\n- [x] A reviewer can confirm the change works without reading the code, from the evidence attached below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop` (`141e35ae98`); zero conflicts.\n- [x] Owning-package typecheck + lint pass post-sync; see **Known gaps / failures** for the full-repo `verify` note.\n\n# Risks\n\nLow. The change adds one boolean condition to an existing guard in a single\nfunction. Default behavior (no `skipDistributedCache`, or `false`) is unchanged\nand covered by control tests. The only behavior change is that skip-mode callers\n(inference session authorization) no longer initiate distributed memo writes,\nwhich is the stated intent of the flag.\n\nOne trade-off worth recording: the distributed memo is keyed on `tokenHash`, so\nthe inference hot path previously *seeded* that shared entry for every caller.\nWith this change it no longer does, so a default-mode caller that later presents\nthe same token on another route will miss where it used to hit and pay one local\n`jose` verification instead of a distributed read. That is the correct call for\nthe hot path (one remote cache decision per request), but the cost shifts to\nother callers, so a future latency change on those routes should not be mistaken\nfor a new regression.\n\n# Background\n\n## What does this PR do?\n\n`verifyStewardTokenCached` in `packages/cloud/shared/src/lib/auth/steward-client.ts`\naccepts `skipDistributedCache`. That flag already suppressed the distributed\nverification-memo **read**, but after a successful local JWT verification the\nfunction still initiated distributed **write** operations on the shared cache:\n\n- With no execution context it `await`ed the distributed `cache.set(...)` write.\n- With a Cloudflare Worker `executionCtx` it scheduled the write via\n  `executionCtx.waitUntil(...)` — unnecessary remote work on the inference hot path.\n\nInference session authorization calls this with `skipDistributedCache: true`\n(`packages/cloud/shared/src/lib/services/inference-session-auth-context.ts`), so\nthe intent is \"do no distributed cache I/O for these ordinary Steward tokens\",\nyet distributed writes still fired.\n\nThis PR gates the distributed write block behind `!options.skipDistributedCache`,\nmirroring the existing read gate. The distributed `cache.del` paths live inside\nthe `if (cached)` block, which is unreachable in skip mode because the read is\nalready suppressed (`cached` is always `null`), so no distributed operation of\nany kind is initiated in skip mode.\n\nPreserved unchanged:\n- The in-isolate `IN_MEMORY_STEWARD_CACHE.set(...)` write (outside the guard).\n- Local JWT verification and all invalid-token / expiry / tenant / staging-binding rejection semantics.\n- Default distributed read/write/delete memo behavior, including the `executionCtx.waitUntil` scheduling path.\n\nNo funding/billing/account-standing logic was touched.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The option's\nexisting doc comment already describes the intended \"skip the distributed memo\"\nbehavior; this change makes the implementation honor it.\n\n# Testing\n\n## Where should a reviewer start?\n\nNew regression suite: `packages/cloud/shared/src/lib/auth/steward-client-skip-distributed-cache.test.ts`.\nIt uses real jose-signed tokens and a call-counting distributed-cache double\n(not a mock of the verifier).\n\n## Detailed testing steps\n\n```bash\n# From repo root\nbun test packages/cloud/shared/src/lib/auth/steward-client-skip-distributed-cache.test.ts\nbun run --cwd packages/cloud/shared typecheck\nbunx @biomejs/biome check packages/cloud/shared/src/lib/auth/steward-client.ts \\\n  packages/cloud/shared/src/lib/auth/steward-client-skip-distributed-cache.test.ts\n```\n\nCoverage added:\n- Skip mode, no execution context → token verifies, distributed get/set/del all observe **0** calls, in-memory memo populated.\n- Skip mode, Worker execution context → `executionCtx.waitUntil` **not** invoked; no distributed set scheduled.\n- Control (default mode) → distributed read + write fire; a malformed memo triggers the distributed `del` then re-verify + set.\n- Control (default mode + executionCtx) → the distributed write is scheduled through `executionCtx.waitUntil` exactly once.\n- Adversarial: skip mode still rejects invalid-signature and expired tokens with zero distributed I/O.\n\n**Failing-before / passing-after** (new tests against unmodified `steward-client.ts`, then after the guard):\n\n\u003cdetails\u003e\u003csummary\u003eBefore (unmodified source): 2 fail — distributed set + waitUntil still fire in skip mode\u003c/summary\u003e\n\n```\n(fail) ... cache miss with skipDistributedCache and no execution context initiates no distributed I/O\n  expect(distributedSetCalls).toBe(0);  Expected: 0  Received: 1\n(fail) ... cache miss with skipDistributedCache never schedules a distributed write on the execution context\n  expect(waitUntilCalls).toBe(0);       Expected: 0  Received: 1\n 5 pass\n 2 fail\nRan 7 tests across 1 file.\n```\n\u003c/details\u003e\n\n\u003cdetails\u003e\u003csummary\u003eAfter (with guard): all pass\u003c/summary\u003e\n\n```\n 7 pass\n 0 fail\nRan 7 tests across 1 file.\n```\n\u003c/details\u003e\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\u003c!-- evidence-head:b781a7228609e0d2ed44d24e902efad16dba5cfb --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - server-side auth cache path; no UI surface.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - server-side auth cache path; no UI surface.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - server-side auth cache path; no user-facing flow.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] The real `verifyStewardTokenCached` server path is exer via `{{availableContexts}}`, spending tokens on\ncategories it can never act on, with no supported way to trim the catalog short\nof patching core.\n\nThis adds a supported removal API mirroring the existing registration style:\n\n- `unregister(id: AgentContext): boolean` — remove one definition; returns\n  `true` if it existed and was removed, `false` otherwise. Normalizes the id via\n  `normalizeContextId` (same as `get`/`has`).\n- `unregisterMany(ids): { removed: AgentContext[]; missing: AgentContext[] }` —\n  batch removal, atomic like `registerMany`, partitioning requested ids.\n\nCorrectness guarantee: removal builds a candidate `next` map without the removed\nids, runs `assertNoUnknownEdges`/`assertNoContextCycles` on it, and only commits\n(clear-then-repopulate, mirroring `registerMany`) if validation passes. If a\nsurviving definition still references a removed context via\n`parent`/`parents`/`subcontexts`, it throws `ContextRegistryError` naming the\noffending edge and leaves `#definitions` untouched. Removing a context together\nwith every definition that references it in one `unregisterMany` call therefore\nsucceeds.\n\nScope is deliberately confined to the registry methods + tests. The alternative\n`Character.contexts.exclude` option mentioned in the issue is intentionally out\nof scope — `unregister`/`unregisterMany` are the clean, minimal supported\nextension point.\n\n## What kind of change is this?\n\nFeatures (non-breaking change which adds a supported extension point).\n\n# Documentation changes needed?\n\nNo separate docs site change. Both public methods carry JSDoc matching the\nsurrounding `tryRegister`/`tryRegisterMany` style, documenting the atomic-commit\nand edge-revalidation contract.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/core/src/runtime/context-registry.ts` (the two new methods) and the\nadded cases in `packages/core/src/runtime/__tests__/context-registry.test.ts`.\n\n## Detailed testing steps\n\n```bash\nbun install\ncd packages/core\nnode ../scripts/run-vitest.mjs run src/runtime/__tests__/context-registry.test.ts\nbunx tsc --noEmit -p ./tsconfig.json\nbunx @biomejs/biome check ./src/runtime/context-registry.ts ./src/runtime/__tests__/context-registry.test.ts\n```\n\nNew tests cover: leaf removal reflected by `has`/`get`; id normalization on\nremoval; unknown-id returns `false`; `unregisterMany` `removed`/`missing`\npartition; removing a still-referenced `subcontext` throws and leaves state\nintact; removing a still-referenced `parent` throws; removing a context with its\nreferencing definition in one call succeeds; a no-op batch reports only\n`missing` without mutating; and repeated ids de-duplicated so each lands in exactly one partition.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed.\n\u003c!-- evidence-head:99a2988e5fed61a637cae1d492e20b1bc93b8621 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - no UI surface; change is a core runtime module and its unit test.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] `N/A - no UI surface; change is a core runtime module and its unit test.`\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] `N/A - no UI/user flow; library method on ContextRegistry.`\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] `N/A - no server path exercised; deterministic unit test proves the contract (output below).`\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] `N/A - no frontend involved.`\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [ ] N/A - no agent/action/provider/prompt/model change; pure registry data-structure method.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [ ] N/A - deterministic unit-test, typecheck, and lint output are pasted inline under Evidence Details below; release-asset upload is unavailable to this fork account (HTTP 404 uploading to elizaOS/eliza releases).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] `N/A - no rendered visual surfac  are untouched, and every existing logger test still passes. True cycles still collapse to one `[Circular]` per back-edge, pinned for self, mutual, array, and Map cycles. The walker is single-threaded and synchronous, so the `try`/`finally` removal cannot interleave with another walk.\n\n# Background\n\n## What does this PR do?\n\n`redactLogValue` kept a permanent visited set while cloning a log payload, so any second reference to the same subobject rendered as `[Circular]` even when nothing was cyclic. `logger.info({ config: shared, retryConfig: shared }, ...)` rendered `retryConfig=[Circular]`; a leaf reached through a nested path and directly lost its content at the direct reference; the second node of a mutual cycle collapsed entirely instead of only at its back-edge. Nothing throws, so the false marker shipped verbatim into the ring buffer, the log routes, the file line, and the console. `safeStringify`, used when formatting trailing arguments, had the same visited-set shape.\n\nThe walker now tracks the active ancestor path and removes each container on the way out, so a reference is circular only when it re-enters a container still being walked. The replacer reconstructs that path by popping until its holder (`this`) is on top.\n\nReview follow-up (second commit): the ancestor path alone removed the deduplication the visited set had provided, so a wide graph re-walked a shared subtree once per reference path (8^8 for the reviewers' nine-object graph) and serialized to hundreds of megabytes. A rendered set with a repeat budget (`MAX_SHARED_EXPANSIONS = 256`) now expands an already-rendered container again while the budget lasts, so an ordinary diamond still reads in full at both references, and renders `[Shared]` afterwards, a true statement about the data. `safeStringify` applies the same budget.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to s` counted any `.js`/`.jsx` under `packages` and `plugins` that passed the path filters. Sibling packages (`packages/app`, `packages/agent`, `packages/app-core`, `packages/scenario-runner`) include the UI source tree in their own TypeScript programs, so a concurrent compile can drop `config-field.helpers.js` beside `config-field.helpers.tsx`. That output is gitignored, but the scanner counted it as an additional maintained React module, so the deterministic graph test read different lists between two calls, and inventory counts depended on whether the checkout had been built.\n\nThis adds `hasTypedSourceSibling` and applies it inside `isMaintainedSource`, so emitted JavaScript beside its TypeScript input is excluded while authored JavaScript without a typed sibling is retained. Two real-filesystem tests cover the neighboring-build race and the authored/emitted matrix inside isolated fixtures under the UI source root, including the identical-list-before-and-after property. Review follow-up (second commit): the first test originally probed beside the real authored input and required the emitted path to be absent, which fails when a neighbor has already compiled; it now builds its own fixture, and the suite passes with the real emitted sibling pre-created.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n`hasTypedSourceSibling` and the two-line change in `isMaintainedSource` in `packages/ui/scripts/find-duplicate-components.mjs`, then the two new tests in `find-duplicate-components.test.mjs`.\n\n## Detailed testing steps\n\nAutomated tests plus the before/after probe under Domain artifacts, which runs the `develop` scanner and this branch's scanner against the same emitted file.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed. `scripts/pr-evidence.mjs rows act unrelated blocker is\n      documented in **Known gaps / failures** below.\n\n# Risks\n\nMedium by reach, low by behavior. `parseJSONObjectFromText` is called from about a dozen non-test sites (reply, basic capabilities, runtime, message service, image description cache, trust actions, agent extract-params). The change only widens what parses: every input the old path accepted still resolves to the same value because the whole-text parse is attempted first and the fence paths are only consulted when it fails. The one narrowing is that a ``` embedded mid-line in prose no longer opens a fence; a fence must start its line, which is how models emit them.\n\n# Background\n\n## What does this PR do?\n\n`extractAndParseJSONObjectFromText` matched an unanchored, lazy fence pattern before attempting to parse the text. The first ``` anywhere in the input opened the fence and the next one closed it, so valid JSON whose string value contained three backticks (a shell snippet in a reply's `text` field) captured the bare words between them and threw, and `parseJSONObjectFromText` returned `null`. The same happened for a real ```json fence whose payload held an escaped code block. At `reply.ts` that `null` makes the whole `{thought, text}` envelope the reply text.\n\nNow the whole trimmed text is parsed first, so backticks inside a valid value are data. Only then a fence around the entire value is unwrapped through the shared `unwrapWholeCodeFence` helper (compact and json5 forms included), and finally a fenced block embedded in prose is matched with both delimiters anchored to their own line: a valid JSON string cannot contain a raw newline, so a ``` that starts a line is never string content.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/core/src/utils/json-llm.ts`, th ing readback is removed from one lane\n(`collectAffiliateInferenceFallback`), replaced with the value the debit\ntransaction already committed and returned. No schema, funding-ownership, or\nflag changes. The synchronous pre-provider SQL policy checks and all other\ngateway overhead are untouched.\n\n# Background\n\n## What does this PR do?\n\nThe fenced affiliate inference settlement in `collectAffiliateInferenceFallback`\n(`packages/cloud/shared/src/lib/services/credits.ts`) issued a **second**\n`organizations` balance query (`getOrganizationBalanceSnapshot`) **after** its\natomic debit transaction had already returned the authoritative post-debit\nbalance and revision. Ordinary deferred/direct settlement already publishes its\ncommitted debit result directly via `republishOrgBalanceHintAfterDebit` without\na readback.\n\nThis PR makes the affiliate lane behave identically: it publishes the\ntransaction's own `outcome.newBalance` / `outcome.balanceRevision` to the\nadmission fence (`publishAuthoritativeBalance`) and to the warm-cache republish\n(`republishOrgBalanceHint`), issuing **zero** `getOrganizationBalanceSnapshot`\ncalls on the settlement path.\n\nBecause the publication is now pinned to this debit's own committed transaction\nresult, a **concurrent newer-revision debit** committing during the fenced\nhandoff can no longer leak into this settlement's authoritative publication —\npreviously the readback could observe and publish that unrelated newer\nbalance/revision.\n\nPreserved unchanged: revision-aware admission fencing (`lowerCommittedBalance`\nstill fires first with the committed revision), collection/payout accounting,\nreplay handling (idempotent debit key), warm-cache handoff, and the\npublication-failure cache cleanup (`invalidateOrgBalanceHint` on the\n`error-policy:J2` path).\n\n## What kind of change is this?\n\nBug fix / performance (removes a redundant SQL read on a hot settlement path)\nplus a correctness hardening (revision pinning).\n\n# Documentation changes needed?\n\nNo. No public API, schema, or behavior contract changes; only the internal\nsettlement readback is removed.\n\n# Testing\n\n## Where should a reviewer start?\n\n`packages/cloud/shared/src/lib/services/__tests__/affiliate-payout-outbox.test.ts`\n— the real in-memory PGlite settlement suite, now seeded with the real\n`0177_organization_balance_revision.sql` trigger so committed `balance_revision`\nvalues actually advance on each debit.\n\n## Detailed testing steps\n\nFocused, from repo root:\n\n```bash\nbun test packages/cloud/shared/src/lib/services/__tests__/affiliate-payout-outbox.test.ts\nbun test packages/cloud/shared/src/lib/services/inference-admission-recovery.test.ts\ncd packages/cloud/shared \u0026\u0026 bunx @biomejs/biome check \\\n  src/lib/services/credits.ts \\\n  src/lib/services/__tests__/affiliate-payout-outbox.test.ts\n```\n\nNew / extended coverage in the affiliate suite (all real DB-backed):\n- **fenced affiliate settlement publishes its committed debit result without a balance readback** — pauses on the fence publication (not the removed readback), asserts the warm hint shows the committed lower balance mid-flight, asserts the published balance/revision equal the transaction's committed values, and asserts `getOrganizationBalanceSnapshot` is called **0** times across the whole settlement.\n- **concurrent newer-revision debit cannot leak into a fenced affiliate publication** — commits an unrelated newer-revision debit while the publication is paused and proves the fence still receives this debit's own committed balance/revision, never the concurrent `0.03`/newer revision, with **0** snapshot reads.\n- Existing initial-debit, replay, insufficient/uncollected-overage collection, and alarm/late-settlement race tests remain and pass.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:c61935ed170cee0363bc3f3aa2dc227fe27ae05a --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] `N/A - backend accounting change  existing `fetchModelsREST` path. Ten lines, one file, no new code path.\n\nIt only becomes visible when `ATLASCLOUD_API_KEY` is set — unset, `getOrFetchProvider` skips it exactly like any other unconfigured provider.\n\n## Why This PR\n\n`PROVIDER_ENV_KEYS` + the `fetchProviderModels` switch is already the extension point for OpenAI-compatible catalogs — `groq`, `xai`, `deepseek`, `zai` and `moonshot` are all the same two-part shape (a registry entry, and a `case` delegating to `fetchModelsREST`). Atlas Cloud serves a standard `/v1/models` document, so it fits that shape without touching `fetchModelsREST` itself.\n\nDisclosure: I work at Atlas Cloud. This is a registry-level addition, so closing it costs nothing if another provider isn't wanted here.\n\n## Validation\n\nRun locally against a real key:\n\n- `GET https://api.atlascloud.ai/v1/models` → **HTTP 200**, 117 models. I re-ran `fetchModelsREST`'s exact logic (same trailing-slash strip, `Authorization: Bearer` header, `{data:[{id,name?,type?}]}` parse, `localeCompare` sort) against the live response — it parses cleanly, every entry has an `id`, first ids are `anthropic/claude-haiku-4.5-20251001`, `anthropic/claude-opus-4-20250514`, …\n- Evaluated the edited `PROVIDER_ENV_KEYS` literal straight out of the file: 12 providers, `atlascloud` resolves to `{envKey:\"ATLASCLOUD_API_KEY\", baseUrl:\"https://api.atlascloud.ai/v1\"}`, and `groq`/`xai`/`deepseek`/`moonshot` base URLs are byte-identical to before.\n- `atlascloud` satisfies `MODEL_PROVIDER_ID_PATTERN` (`/^[a-z0-9][a-z0-9-]*$/`), so `providerCachePath()` accepts it and the cache file lands inside the models cache dir.\n\nRepo tests, after a full `bun install`, run with vitest:\n\n```\nvitest run packages/agent/src/api/model-provider-helpers.test.ts \\\n           packages/agent/src/api/model-provider-helpers.timeout.test.ts \\\n           packages/agent/src/api/model-catalog.test.ts \\\n           packages/agent/src/api/models-routes.test.ts\n→ Test Files 4 passed (4), Tests 26 passed (26)\n```\n\nOne note for anyone else touching these files: running them with `bun test` instead reports 2 failures in `fetchNearAIModels`, but that's the runner, not the code — the file uses `vi.stubGlobal` / `vi.unstubAllGlobals`, which bun's `vi` shim doesn't implement. `packages/agent`'s own `test` script goes through vitest, and under vitest all 4 pass. I hit this and briefly mistook it for a pre-existing failure.\n"])</script><script>self.__next_f.push([1,"45:T18b4,"])</script><script>self.__next_f.push([1,"# Relates to\n\nRepository gate health: `@elizaos/ui#lint:check` fails in `bun run verify` on a pristine checkout of `origin/develop` `867f0909eab` because the committed molecular inventory report is one file behind the tree. No issue exists for this; it follows the precedent of #29271 and b4ed96b571b.\n\nDefinition of Done: full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is based directly on the latest `origin/develop` with zero conflicts.\n- [x] `bun install` and the affected package gate were run after sync; see Known gaps for the repository-wide note.\n- [x] A reviewer can confirm the change works without reading the code, from the evidence attached below.\n\n# Sync with develop\n\n- [x] Based on `origin/develop` `867f0909eab`; zero conflicts.\n- [x] The failing gate passes post-change (transcript below).\n\n# Risks\n\nNone beyond the artifact itself: two generated report files change by one number each (`scannedFiles` 907 to 908). The report is produced by `bun run --cwd packages/ui audit:molecular-inventory`, not hand-edited; the molecular findings (101 compositions, no new duplicates) are unchanged.\n\n# Background\n\n## What does this PR do?\n\n`find-duplicate-molecular-components.mjs --check` compares the committed report against a fresh scan and fails with `Molecular inventory artifacts are stale: json, markdown` when they differ. The tree at `867f0909eab` scans 908 main
