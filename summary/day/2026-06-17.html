ext_f.push([1,"## Summary\n- **Billing idempotency:** container-billing cron rebill guard + unique `(container_id, billing_period)` index\n- **Suspended containers:** docker stop + allocation decrement on shutdown branch\n- **Isolated DB teardown:** deprovision job on app delete, DROP DATABASE/ROLE, `releaseSlot` for cluster capacity\n- **Deploy economics:** upfront deploy credit debit + balance precheck before provisioning\n- **Ingress:** Caddy admin client for multi-node apps lane routing\n\n## Test plan\n- [x] `bun run --cwd packages/cloud-shared test -- app-deploy-billing apps-ingress-client tenant-db-deprovision container-billing`\n- [x] `bun run --cwd packages/cloud-shared test -- app-container-store app-deployments container-executor-deps container-job-service provisioning-job`\n- [ ] Maintainer: approve fork PR workflows so GitHub CI runs\n\nFixes #8342, #8321\n\n\u003c!-- This is an auto-generated comment: release notes by coderabbit.ai --\u003e\n\n## Summary by CodeRabbit\n\n* **New Features**\n  * Added upfront deploy credit charges for app deployments with idempotency protection.\n  * Implemented container billing reconciliation for suspended containers and daily billing slot management.\n\n* **Infrastructure \u0026 Improvements**\n  * Enhanced app node security with network isolation rules and egress proxy configuration.\n  * Introduced pgbouncer connection pooling for tenant databases.\n  * Added automated app ingress snippet synchronization to worker nodes.\n\n\u003c!-- end of auto-generated comment: release notes by coderabbit.ai --\u003e"])</script><script>self.__next_f.push([1,"16:T995,"])</script><script>self.__next_f.push([1,"## Goal\nGet `staging.elizacloud.ai` stable again. Staging deploys from `develop`, which got broken by an AI-slop checkpoint commit.\n\n## Root cause\n`bc4bb287d2` (\"chore: checkpoint working tree (parallel in-progress changes) to unblock push\", authored by lalalune) force-committed a half-baked shared working tree onto develop. It:\n- **gutted the canvas/dexplorer UI** (`cloud-canvas.tsx` -300) and api-keys dashboard → broke the staging UI\n- **tore out the entire api-key permission system** mid-refactor: deleted `api-key-permission.ts` middleware, the permission guards on api-keys/publish/containers routes, the `permissions` schema column (+ a `0145_drop_api_key_permissions` migration), and the `apiKeyPermissions` context-set → broke the `group-k-affiliate` e2e (`standard API key is forbidden without affiliate permission → 403`) → **reddened Deploy API Worker** → staging deploy broken\n\nProd (`main`) is clean: full UI, full permission layer, no drop migration (main is at migration 0144; 0145 was slop). Nubs confirmed the dexplorer break is develop-only, never promoted.\n\n## Fix: revert the slop to prod's stable state\nRestored every slop-touched file to its `main` version (all now byte-identical to main):\n- **Frontend:** `cloud-canvas.tsx`, api-keys dashboard (`Page.tsx`, `api-keys-page-client.tsx`, `types.ts`, `apis-tab.tsx`, `data/api-keys.ts`)\n- **cloud-api:** `api-key-permission.ts` middleware, `auth.ts` re-exports, api-keys routes (+`[id]`, regenerate, explorer), publish route, containers route(+test), schemas\n- **cloud-shared:** `api_keys` schema `permissions` column, `workers-hono-auth` context-set, client/service/env types; **removed the `0145_drop_api_key_permissions` migration** + reverted the journal\n- **Tests:** `group-k-affiliate` back to the correct `403` expectation (NOT #8468's approach of weakening the test to accept the deleted gate), `middleware-auth-soc2` restored\n\n## Preserved\nThe experimental UI + parallel work is snapshotted on `preserve/dexplorer-experimental-ui` (+ `feat/canvas-genui`). Nothing lost.\n\n## NOT touched (legitimate develop progress)\n`#8465` orphan-cleanup (`eliza/agents/route.ts`, `agent-sandboxes`) and other real forward work are untouched — only the slop is reverted.\n\nThis is a revert-to-stable toward prod, not new behavior. It should green Deploy API Worker (group-k-affiliate → 403) + restore the staging dashboard UI.\n\nCo-authored-by: wakesync \u003cshadow@shad0w.xyz\u003e"])</script><script>self.__next_f.push([1,"17:T104d,"])</script><script>self.__next_f.push([1,"## Dedicated apps-control provisioning daemon + job lanes (Product 2)\n\n### Why\nStanding up Product-2 (per-app isolated DB + container hosting) on **prod** surfaced a real architecture gap (tracker #8434): per-app DB provisioning runs `pg` DDL against the **private-only** tenant Postgres (`10.30.1.10`, no public 5432 by design), but the agent control-plane provisioning-worker lives in a **separate Hetzner project** and can't reach it — so arming the existing daemon would leave every app stuck \"building\".\n\nEvery shortcut weakens the security posture:\n- exposing the tenant DB publicly puts the **shared multi-tenant** DB on the internet;\n- running the deploy daemon on the **app node** co-locates the **cluster admin DSN (master creds to every tenant DB)** with **untrusted user containers** → a container escape = full multi-tenant compromise;\n- running a *second copy of the agent daemon* would race/duplicate the agent-fleet singletons (liveness heartbeat, fleet upgrade, node autoscale, warm-pool drain) → could drain live agent nodes.\n\n### What\nA **purpose-built, slim apps-control daemon** that runs on a TRUSTED node **on the apps private net** (reaches the tenant DB privately) which runs **no untrusted containers** (those stay on the separate app node). It is **additive** — it touches zero existing infra (not the mesh, not the agent CP daemon's behavior, not the deploy code path) — so it cannot destabilize the live agent launch.\n\n- **`provisioning-job-types`** — split `JOB_TYPES` into `AGENT_JOB_TYPES` / `APPS_JOB_TYPES` lanes + `resolveJobTypesForLanes(PROVISIONING_JOB_LANES)`. **Fail-open to ALL types** so the split is **inert** until two daemons are deployed and each is pinned to its lane.\n- **`provisioning-jobs`** — `processPendingJobs` + `recoverStaleJobs` take an optional `jobTypes` lane (default = all → **behavior unchanged**, backward-compatible; the one other caller, `container-control-plane`, is unaffected).\n- **`provisioning-worker` (main)** — reads `PROVISIONING_JOB_LANES`; default all, so the **live CP worker is unchanged** until we pin it to `agent`.\n- **NEW `apps-provisioning-worker`** — claims **only** the apps lane, arms **only** the apps deploy backend, runs **none** of the agent singletons (no heartbeat/fleet-upgrade/autoscale/warm-pool). Two daemons coexist on the shared `jobs` table purely via lane-scoped `FOR UPDATE SKIP LOCKED` claims.\n- **NEW `eliza-apps-worker.service`** systemd unit.\n\n### Safety / tests\n- **Inert by default**: no env is set anywhere; with `PROVISIONING_JOB_LANES` unset the main daemon claims all 18 types exactly as today (`readWorkerConfig({}).jobTypes.length === 18`).\n- **Lane completeness invariant** test: every `JOB_TYPES` value is in **exactly one** lane (catches a future type orphaned from both daemons or double-claimed), plus disjointness + resolver fail-open/scoping. **17 pass.**\n- Existing daemon tests still pass (6/6); both daemons load clean under tsx.\n\n### Follow-up (not in this PR)\n- Deploy workflow + a dedicated apps-control node on the apps net; arm `APPS_DEPLOY_ENABLED=1` there; pin the CP worker to `PROVISIONING_JOB_LANES=agent`; e2e-verify (isolated DB + container + HTTPS + cross-tenant REJECTED + teardown).\n- Container-runtime hardening (gVisor/Kata/userns/seccomp) on the untrusted app node before real users at scale.\n\nRefs #8434 #8425\n\n\n---\n### Update — full Path-A toolchain now in this PR\nBeyond the daemon + lanes, this PR now ships the **end-to-end deploy/arm tooling** so standing it up is purely operational:\n- **`deploy-apps-worker.yml`** — slim deploy (no agent-router, no headscale wiring) targeting `ELIZA_APPS_WORKER_HOST`; skips cleanly until that secret is set.\n- **`arm-apps-daemon.yml`** — new `target: cp-daemon | apps-worker` input; `apps-worker` arms the apps env on the apps-control host + restarts `eliza-apps-worker.service`. Default `cp-daemon` = unchanged.\n\nSo once merged: bootstrap an apps-control node on the apps net → set the host secrets → `deploy-apps-worker` → `arm-apps-daemon target=apps-worker` → pin the CP worker to `PROVISIONING_JOB_LANES=agent` → e2e-verify. No further code needed.\n"])</script><script>self.__next_f.push([1,"18:T12d5,"])</script><script>self.__next_f.push([1,"## What's broken\n\n`POST /api/v1/eliza/agents` creates the sandbox row and enqueues its provision job as **two separate writes**, and the only rollback guarded just the enqueue. So a throw in the window between them strands a `pending` sandbox forever.\n\nThe window (`packages/cloud-api/v1/eliza/agents/route.ts`):\n- `~315` `elizaSandboxService.createAgent(...)` — **commits** the row as `status='pending'`.\n- `~328` `prepareManagedElizaEnvironment(...)` — mints a KMS-backed API key (can throw on KMS/Steward/DB).\n- `~336` `elizaSandboxService.updateAgentEnvironment(...)` — can throw.\n- `~440` `provisioningJobService.enqueueAgentProvision(...)` — the **only** call wrapped in a try/catch that deletes the row on failure (`~446-470`).\n\nA throw anywhere in `315→439` (i.e. `prepareManagedElizaEnvironment` or `updateAgentEnvironment`) leaves a committed `pending` sandbox with **no provision job and no `error_message`**. The provisioning-worker daemon only claims rows from the `jobs` table (`type='agent_provision'`, `status='pending'`) — it **never scans `agent_sandboxes`** — so a job-less `pending` row is structurally unclaimable, and no sweeper covered it. It sits in `pending` forever; the dashboard surfaces \"an unexpected error\".\n\n### Caught by a real live repro\nA dashboard \"Deploy Agent Instance\" (dedicated sandbox) produced exactly this: an orphaned `pending` sandbox `e2e-dedicated-test` with **no** `agent_provision` job. Manually enqueuing the missing job let the daemon provision it normally → **proving only the trigger was missing**, the agent itself was fine.\n\n### Same split-write elsewhere\n- `packages/cloud-api/v1/coding-containers/route.ts` — the pre-enqueue `updateAgentEnvironment` (`~234-243`) sat between the committed row and the job enqueue (`~252`), guarded only at the enqueue.\n- `packages/cloud-shared/src/lib/services/eliza-app/provisioning.ts` (`~90-107`) — `createAgent` then `enqueueAgentProvision` with **no** cleanup at all.\n\n## The fix — 3 guarded paths + a reconciler\n\n1. **agents POST** — wrap the whole `createAgent → enqueue` span in a `withOrphanCleanup` helper. Any throw deletes the just-created row (reusing the existing delete) and rethrows, so the caller still sees the error. The shared-runtime / warm-pool / `autoProvision=false` branches are untouched — they exit via clean `return`, never throw, so they pass straight through. The old enqueue-only try/catch is folded into the same wrapper.\n2. **coding-containers** — guard the pre-enqueue `updateAgentEnvironment` write too, reusing the same orphan-delete the enqueue catch already performs.\n3. **eliza-app provisioning** — guard the enqueue (delete the row + rethrow on failure).\n4. **Reconciler / safety-net** — new `markOrphanedPendingWithoutJobAsError` in `agent-sandboxes.ts`, mirroring the existing `markStuckProvisioningWithoutActiveJobAsError` but for orphaned **pending** rows:\n   - `status='pending'` **AND** `pool_status IS NULL` (real user sandbox, not a warm-pool row) **AND** no live `agent_provision` job **AND** `created_at` older than the same 10-min cutoff (`created_at`, not `updated_at`, because the managed-env write bumps `updated_at`).\n   - **Marks `error`** with a clear message (`\"Provisioning never started: no agent_provision job was enqueued (orphaned pending). Please retry.\"`) so the failure is visible instead of silent (today `error_message` stays null).\n   - **Conservative by design — never re-enqueues.** The original env-prep may have failed, so re-provisioning could spin up a half-configured agent; a clean error lets the user retry the whole flow.\n   - Wired into the **same** `cleanup-stuck-provisioning` cron that runs `markStuckProvisioningWithoutActiveJobAsError`.\n\n## Out of scope\nThese are separate pre-existing **infra/config** issues, not this code bug, and are intentionally **not** touched here:\n- Staging Steward auth-gate **500s** (degraded Steward tenant).\n- Headscale API key **401**.\n\n## Test plan\n- `route guard`: mocking `prepareManagedElizaEnvironment` to throw **and** `updateAgentEnvironment` to throw each asserts the sandbox is deleted (`agentSandboxesRepository.delete`), no provision job is enqueued, and the error propagates (≥500). Happy path still enqueues and never deletes (202).\n- `coding-containers`: a fresh (non-idempotent) row whose pre-enqueue env write throws → row deleted, no enqueue, 503.\n- `eliza-app`: enqueue failure deletes the just-created sandbox and rethrows.\n- `reconciler`: asserts the generated WHERE targets `pending` + `pool_status IS NULL` + `created_at` cutoff + `NOT EXISTS` agent_provision job, and the SET writes `status='error'` with the retry message.\n- All 10 touched-area tests pass; typecheck + biome clean for the changed files.\n\n**Do not merge** — leaving open for review."])</script><script>self.__next_f.push([1,"19:T6bb,"])</script><script>self.__next_f.push([1,"## What\nAdds a repeatable Headscale control-plane arming path for staging/production:\n\n- new arm-headscale-control-plane.yml workflow using GitHub Environment-scoped host/SSH/Headscale secrets\n- new packages/scripts/cloud/admin/arm-headscale-control-plane.mjs operator script for the same convergence locally\n- docs for the Hetzner control-plane Headscale path, including WHY the daemon requires a real headscale_ip before marking agents running\n\n## Why\nThe launch tracker exposed that prod Headscale wiring was still a hand-run sequence: set server_url, copy ACL/config, wire daemon env, align host/Worker secrets, restart services, then prove /health. This PR moves the repo-owned half into an idempotent workflow.\n\n## Safety\n- Does not generate or print a Headscale API key; it requires an existing HEADSCALE_API_KEY secret.\n- Writes the committed ACL policy from the repo.\n- Keeps PEM secrets single-line for systemd EnvironmentFile by storing literal \\n sequences.\n- Fails if local Headscale /health does not come up.\n- Leaves Cloudflare Worker secrets as an explicit operator step; host and Worker values still need to match.\n\n## Validation\n- node --check packages/scripts/cloud/admin/arm-headscale-control-plane.mjs\n- node packages/scripts/cloud/admin/arm-headscale-control-plane.mjs --help\n- dry-run render with fake SSH key path and PEM-like input\n- ruby -e 'require \"yaml\"; YAML.load_file(\".github/workflows/arm-headscale-control-plane.yml\")'\n- bunx @biomejs/biome check .github/workflows/arm-headscale-control-plane.yml packages/scripts/cloud/admin/arm-headscale-control-plane.mjs packages/cloud-services/headscale/DEPLOY.md packages/cloud-infra/cloud/terraform/hetzner/control-plane/README.md\n- git diff --check"])</script><script>self.__next_f.push([1,"1a:T8a2,"])</script><script>self.__next_f.push([1,"## Problem\nOn mobile (and the desktop onboarding-overlay), first-run showed a single gradient voice **orb** + a lone **Connect** button that jumped **straight to Eliza Cloud** — no choice of runtime. And when the in-app browser open failed, the cloud flow **dumped the raw `cli-login` URL as text**. Verified on a physical Solana Seeker.\n\n## Before → After\nBefore: orb + \"Connect\" (cloud-only). After: elizaOS logo + **\"Choose how to run your agent\"** with three cards:\n- **Eliza Cloud** (Recommended) — hosted, nothing to set up\n- **Remote server** — reveals a URL + access-token form\n- **Local models** — run on-device\n\n## What changed\n`CompactOnboarding.tsx` is the single first-run chokepoint (`StartupScreen → StartupShell → CompactOnboarding` on every platform + the desktop overlay), so rebuilding it fixes all surfaces without routing surgery and **reuses the existing `use-first-run-controller`** (no new finish logic):\n- drop the gradient orb; render the `logo_white_nobg.svg` + `elizaOS` lockup (continuity with the loading screen)\n- three option cards wired to `updateDraft(runtime, …)` + `finishRuntime()` (cloud/local) / `setStep(\"remote\")` (remote form, mirroring FirstRunShell's field shape)\n- cloud login URL surfaced as a tappable **\"Open sign-in page\"** button (`onboarding-cloud-open-signin`) instead of raw text\n- `FirstRunShell.tsx` (the separate desktop full-shell) is untouched.\n\n## Testing\n- `CompactOnboarding.test.tsx` rewritten — **8 passing** (3 options, remote form, cloud sign-in button, submitting/disabled state).\n- ui-smoke specs updated to the new testids (`onboarding-option-cloud|remote|local`, `onboarding-remote-connect`): runtime-configurability, first-run-startup, cloud-provisioning-startup. reset-returns-to-onboarding needed no change (keys on `onboarding-toast`, kept).\n- Typecheck clean (ui + app); biome clean.\n- **Verified on a physical Solana Seeker**: fresh install → logo + 3 cards render; Cloud → clean sign-in button; Remote → URL/token form; Local → starts the on-device agent.\n\n## Screenshots\nFresh-install onboarding now shows the elizaOS logo and the three runtime cards (Cloud / Remote / Local) on the orange brand background."])</script><script>self.__next_f.push([1,"1b:T854,"])</script><script>self.__next_f.push([1,"## Problem\nEverything routes through bitrouter (`bitrouter → openrouter → upstream provider`). The path is flaky on a per-call basis: identical requests bounce between transient failures and success.\n\n**Measured live (GLM 5.2 via bitrouter, 8 identical calls):**\n- 5× `200` (clean content, `finish:stop`)\n- 2× `429` (upstream provider rate-limited — openrouter rotates providers)\n- 1× `502` (`chat completion returned neither content nor tool calls` — provider momentarily returned an empty body)\n\n≈62% raw success. Today a single attempt fails the whole inference call on a momentary hiccup.\n\n## Fix\nAdd retry-with-backoff to the shared provider fetch helper (`providerFetchWithTimeout`), so **all** OpenAI-compatible providers that use it (bitrouter, vast, openai-direct, anthropic-direct) recover transient failures:\n- retry only **429/502/503/504**; never retry real 4xx errors (400/401/403/404 throw immediately)\n- exponential backoff + **full jitter**, capped at 8s, honors **Retry-After**\n- max 3 retries (4 tries): ≈62% → **≈95%** (3) / **≈98%** (4)\n- **never retry streaming** responses (bitrouter passes `maxRetries:0` when `request.stream`) or one-shot `ReadableStream` bodies — can't safely replay\n- abort-aware backoff sleep; preserves the exact `ProviderHttpError` envelope (refactored into `providerFetchOnce`, error shaping unchanged)\n\n## Proof\n**Live against real bitrouter + GLM 5.2** — with retry, **3/3 runs succeeded**, including one that `429`'d twice before landing `200` on the 3rd attempt:\n```\nRUN 1: attempt 1 → 200                                   SUCCESS\nRUN 2: attempt 1 → 429, attempt 2 → 429, attempt 3 → 200  SUCCESS\nRUN 3: attempt 1 → 200                                   SUCCESS\n```\n**7 new unit tests** cover: retry-429→success, retry-502→success, no-retry-400, budget-exhaustion, `maxRetries:0` (streaming), Retry-After, ReadableStream-no-replay. All pass; no regression in existing provider tests.\n\nNote: codex review hung on the VPS (OOM) — did a careful manual review; happy to re-run codex if preferred.\n\nCo-authored-by: wakesync \u003cshadow@shad0w.xyz\u003e"])</script><script>self.__next_f.push([1,"1c:T51f,## Summary\n- stop forcing Dev Smoke through the Cerebras OpenAI-compatible endpoint\n- expose the supported live-provider secrets so the existing selector can choose any configured provider\n- keep Cerebras available as an explicit opt-in through `ELIZA_DEV_SMOKE_PROVIDER=cerebras` or a Cerebras base URL override\n- apply the package-local Biome formatting fix in `plugin-local-inference`\n\n## Why\nCurrent `develop` failed `bun run dev onboarding chat` because Cerebras returned `429 token_quota_exceeded` with `retry-after: 86400`. That is not an app regression, but the workflow made it fatal by aliasing `OPENAI_API_KEY` to the Cerebras key and pinning `OPENAI_BASE_URL` to Cerebras for every run.\n\nThe dev-smoke harness already skips cleanly when no live provider is available and can run against Groq, OpenAI, Anthropic, Google, OpenRouter, or explicitly selected Cerebras. Letting that selector do its job keeps the live gate useful without making a single provider's daily quota the whole repo's red button.\n\n## Verification\n- `bun run --cwd plugins/plugin-local-inference format:check`\n- `bunx @biomejs/biome check .github/workflows/dev-smoke.yml plugins/plugin-local-inference/src/local-inference-routes.ts`\n- `ruby -e \"require 'yaml'; YAML.load_file('.github/workflows/dev-smoke.yml'); puts 'yaml ok'\"`\n1d:T582,"])</script><script>self.__next_f.push([1,"## Summary\nReplicates waifu.fun's **first-time passkey setup for new accounts** on eliza cloud. Today a brand-new user can't set up a passkey — `signInWithPasskey` assumes an existing credential, so new users get pushed to magic-link (\"Passkey works after you add one\").\n\n## What changed\nThe Passkey button is now smart:\n- **existing user** with a passkey → `signInWithPasskey` (unchanged)\n- **new user** (no passkey) → transparently falls into Privy-style signup:\n  1. email a 6-digit OTP (`auth.sendEmailOtp`)\n  2. new `otp-entry` step — user types the code\n  3. verify → `emailGrant` (`auth.verifyEmailOtp`)\n  4. register a passkey with the grant, no prior session (`auth.addPasskey(email, { emailGrant })`)\n\nA real WebAuthn cancel stays an error (no accidental fallback); only a 'no credential' miss triggers signup. Resend + back flag is off there (you only get a `headscale_ip` if `TS_AUTHKEY` was injected, which the staging/prod E2E confirmed). Only the explicit legacy-fallback case changes behavior.\n- Keeps the fallback flag internally consistent with `requiresHeadscaleRoute()`.\n- Adds 4 regression tests; existing route-guard suite stays green (15 tests, 0 fail). Typecheck + biome clean.\n\n## Test\n`bun test packages/cloud-shared/src/lib/services/__tests__/docker-sandbox-headscale-route.test.ts` → 15 pass / 0 fail.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"23:T7ad,"])</script><script>self.__next_f.push([1,"## What\n\nAdds the **`@agentradar/eliza-plugin`** community plugin to the third-party registry, following the flow in [`packages/registry/README.md`](https://github.com/elizaOS/eliza/blob/develop/packages/registry/README.md).\n\n[AgentRadar](https://api.vvpro.ai) is an on-chain meta-trust oracle for the x402 + ERC-8004 agent economy. The plugin gives an Eliza agent on-chain trust awareness:\n\n- **`VERIFY_AGENT` action** — when a message contains an EVM address and asks about safety/trust, the agent replies with the AgentRadar composite score (0–100), verdict (`TRUSTED`/`VERIFIED`/`CAUTION`/`RISKY`/`BLOCKED`), and risk flags.\n- **`AGENTRADAR_TRUST` provider** — injects trust context for any address mentioned, so the agent reasons with it before interacting or paying.\n\nThe signal is a composite of ERC-8004 reputation, a scam-wallet database, and static analysis — \"verify before you transact\" for autonomous agents.\n\n## Changes\n\n- `packages/registry/entries/third-party/agentradar__eliza-plugin.json` — the source entry (own `@agentradar` scope, not the reserved `@elizaos/*`).\n- `packages/registry/generated-registry.json` — regenerated; only the new key is added (the existing 8 entries are byte-identical).\n\n## Checklist\n\n- [x] Published to npm: [`@agentradar/eliza-plugin`](https://www.npmjs.com/package/@agentradar/eliza-plugin) (MIT), typechecked against `@elizaos/core@1.7.2`.\n- [x] `package` uses our own scope; `keywords` include `elizaos` (runtime auto-discovery) + `eliza-plugin`.\n- [x] Public source repo with resolvable `repository:` — [Bichev/agentradar-integrations](https://github.com/Bichev/agentradar-integrations) (`directory: eliza-plugin-agentradar`).\n- [x] Entry validates against `schema/registry-entry.schema.json` (required `package`/`repository`/`kind`; no extra properties).\n- [x] `generated-registry.json` regenerated with the documented transform (existing entries unchanged).\n\nMade with [Cursor](https://cursor.com)"])</script><script>self.__next_f.push([1,"24:Tb46,"])</script><script>self.__next_f.push([1,"## Symptom (launch-critical)\nEvery **shared-runtime agent turn** (`POST /api/v1/eliza/agents/:id/bridge` → `message.send`) returns `-32000 \"Sandbox bridge is unreachable\"`. Verified live on prod: **100% deterministic**, independent of params, retries, or credit balance (my test org has $93). Shared agents simply cannot reply.\n\n`status.get` / `heartbeat` return `runtime:\"shared\", ready:true` — so the agent is healthy; only `message.send` fails. The `-32000` is a **mask**: `ElizaSandboxService.bridge`'s catch logs the real error to the Worker log (eliza-sandbox.ts:1660) but returns the generic \"unreachable\" string to the caller.\n\n## Root cause\nShared-runtime turns call **Cerebras directly** (`run-shared-agent-turn.ts` → `createOpenAI({baseURL: cerebras})`), not via BitRouter. So billing reserves credits with `model=\"gpt-oss-120b\"`, `provider=\"cerebras\"`. In the pricing path:\n\n- `canonicalModelId(\"gpt-oss-120b\", \"cerebras\")` → **`cerebras/gpt-oss-120b`** (slash form).\n- The forced Cerebras pricing rows (`FORCED_BITROUTER_PRICING`) are keyed in BitRouter's colon-routing form **`cerebras:gpt-oss-120b`**.\n- `expandPricingCatalogModelCandidates` bridged namespaces (`xai`↔`x-ai`) and stripped the colon prefix (colon→bare) — but had **no slash→colon bridge**.\n\nSo the candidate set was `[\"cerebras/gpt-oss-120b\"]`, which never matches the colon-keyed forced row → `resolvePreparedPricingEntry` throws `Pricing unavailable for language:input cerebras/gpt-oss-120b`. `calculateTextCostFromCatalog` only `.catch()`es the **output** lookup (the input lookup is fatal), so the throw propagates `calculateCost → creditsService.reserve → reserveCredits` → re-thrown at eliza-sandbox.ts:1540 → bridge catch → masked `-32000`.\n\nInference (`/api/v1/chat/completions`) is unaffected because it resolves pricing under the routed (colon/bitrouter) id, not bare-model + cerebras-provider.\n\n## Fix\nAdd `forcedProviderColonVariant` (mirror of the existing `stripForcedProviderPrefix`) and emit the colon spelling in `expandPricingCatalogModelCandidates`. A direct-provider caller now resolves the colon-keyed forced rows. Also fixes `cerebras:zai-glm-4.7` (same class). Dash-bearing namespace prefixes (`x-ai/`) and already-colon variant ids (`:nitro`) are deliberately left untouched.\n\nThis is the Cerebras sibling of the documented `openai/gpt-oss-120b` \"Pricing unavailable\" forced-row fix (PR #8307/#8319).\n\n## Verification\n- Pure-function probe: candidates for `cerebras/gpt-oss-120b` now include `cerebras:gpt-oss-120b` (provider + billingSource already matched).\n- Added 2 regression tests in `ai-pricing-variant-indexing.test.ts` (slash→colon bridge + edge cases).\n- `ai-pricing-variant-indexing` 37 pass / 0 fail; `ai-pricing-bitrouter-units` 6 pass / 0 fail.\n- cloud-shared typecheck clean for the changed files.\n\nTracker: #8434 (Cloud 10-user launch)"])</script><script>self.__next_f.push([1,"25:T407,## Summary\n\nUpdates the BitRouter Railway service smoke test to match the current service contract:\n\n- assert the pinned `bitrouter@0.33.0` install instead of stale Dockerfile grep checks\n- assert BitRouter Cloud is intentionally not enabled via `providers.bitrouter`\n- assert the current Cerebras-first / OpenRouter-fallback model chains for `gpt-oss-120b` and `openai/gpt-oss-120b:nitro`\n- keep coverage for the auth proxy, internal JWT path, cost-audit mode, Cerebras request fixes, and Railway healthcheck\n\n## Why\n\n`packages/cloud-infra` was failing because the test still expected the older provider-level pricing layout. The runtime now uses top-level `models:` aliases plus explicit Cerebras BYOK configuration, so the test had become stale even though the current service shape is intentional.\n\n## Validation\n\n- `bun test packages/cloud-infra/tests/bitrouter-service.test.ts`\n- `bun run --cwd packages/cloud-infra test`\n- `bunx @biomejs/biome check packages/cloud-infra/tests/bitrouter-service.test.ts`\n- `git diff --check`26:T94b,"])</script><script>self.__next_f.push([1,"\u003e **DRAFT — pending a product decision.** Removing anonymous guest chat is contested: shad0w/nubs want it gone (sign-in friction is low-value now that signup grants $5); Odilitime thinks the \"try a response before signing up\" funnel may be worth keeping. **This is teed up and ready if @standujar says go** — otherwise it's here for review, not merge.\n\n## What\nReplace anonymous guest access with **\"sign in (get $5) to use it\"**. The\n`X-Affiliate-Code` revenue model is **completely untouched**.\n\n- Delete the 9 anon-session routes (`auth/{create-anonymous-session,anonymous-session,migrate-anonymous}`, `anonymous-session`, `set-anonymous-session`, `cron/cleanup-anonymous-sessions`, `affiliate/{create-session,create-character}`, `my-agents/claim-affiliate-characters`) + regenerate the router (`codegen`).\n- Delete the anon services (`anonymous-session-creator`, `anonymous-sessions`, `auth-anonymous`) + drop the cleanup cron entry.\n- `/v1/chat` + the eliza welcome route now **401 unauthenticated** instead of falling back to an anon user (the affiliate `X-Affiliate-Code` read is preserved).\n- **Gate the public chat** behind a sign-in CTA (\"Sign in to chat with {agent} — get $5 in credits\"); strip the dead anon plumbing in `eliza-page-client` + `my-agents`; remove the anon message-count increments.\n\n## Verified\nBuilt + typechecked locally against a real install: **`cloud-api` typecheck green, `cloud-frontend` typecheck green** (my files), **biome clean**. CI will re-verify.\n\n## Deliberately NOT in this PR\n- **The destructive DB drop** (`anonymous_sessions` table + `users`/`user_identities.is_anonymous` columns) is a **separate, soaked follow-up migration** — the columns are kept and simply no longer read (snapshot-only rollback for the drop, so it's decoupled).\n- The required **`audit:cloud` visual-review gate** (cloud-frontend UI change) — I couldn't run it in my env; needs an eyeball before \"done\".\n- Minor dead-but-harmless leftovers to prune in follow-up (non-breaking, never populated now): `chat-store.anonymousSessionToken`, the `is_anonymous` field in `lib/data/user.ts`, and the dead message-limit signup UI in `eliza-chat-interface`.\n\n## Keep (do not touch)\nThe affiliate revenue model: `affiliate_codes`/`user_affiliates`, `ai-billing` `affiliateCode` branch, `X-Affiliate-Code` header reads, `v1/affiliates`, redeemable/app earnings.\n"])</script><script>self.__next_f.push([1,"27:Tad7,"])</script><script>self.__next_f.push([1,"## Problem\n\nTonight prod's provisioning-worker daemon was pointing at a **stale CP-box headscale** (\\`http://88.99.82.102\\`) instead of the real Railway headscale (\\`https://headscale.elizacloud.ai\\`). The fix was a manual edit of \\`/opt/eliza/cloud/.env.local\\` on the box. That edit will silently drift again, because **nothing reconciles \\`HEADSCALE_*\\` from git/CI**.\n\nRoot cause:\n- The daemon + cloud-shared read \\`HEADSCALE_API_URL\\` / \\`HEADSCALE_PUBLIC_URL\\` / \\`HEADSCALE_API_KEY\\` straight from \\`process.env\\` (\\`headscale-client.ts:12-13\\`, \\`headscale-integration.ts:29\\`, \\`docker-sandbox-provider.ts\\`), fed by systemd \\`EnvironmentFile=/opt/eliza/cloud/.env.local\\` (\\`eliza-provisioning-worker.service:12\\`).\n- That \\`.env.local\\` is written once by the bootstrap (whose \\`buildRemoteEnv\\` overlay injects **no** \\`HEADSCALE_*\\`) and then **preserved verbatim on every deploy** (\\`git clean -fdx -e cloud/.env.local\\`). So \\`HEADSCALE_*\\` only ever lives as hand-edits on the box.\n- #8431 / #8423 wired only the headscale **server** side (Railway). The worker is the **consumer** and was left unmanaged.\n\n## Fix (workflow-only, additive)\n\nIn \\`deploy-eliza-provisioning-worker.yml\\`:\n1. Add \\`HEADSCALE_API_URL\\` / \\`HEADSCALE_PUBLIC_URL\\` (\\`vars\\`) + \\`HEADSCALE_API_KEY\\` (\\`secret\\`) to the deploy job \\`env:\\` — **reusing the canonical GH names already established by \\`arm-headscale-control-plane.yml\\`** (no new naming).\n2. Add them to the \\`appleboy/ssh-action\\` \\`envs:\\` allowlist.\n3. Before \\`systemctl restart\\`, **idempotently reconcile** each *non-empty* key into \\`.env.local\\` (delete any existing \\`HEADSCALE_$K=\\` line, append the CI value). CI becomes the single source of truth and the box self-heals on every deploy.\n\nThe **non-empty guard is load-bearing**: an unset GH var must never blank a working box — a blank \\`HEADSCALE_API_KEY\\` makes \\`docker-sandbox-provider.ts:792\\` throw \\`HEADSCALE_API_KEY is not configured\\` when a route is required.\n\nThis **does not touch \\`provisioning-worker.ts\\`** (active heartbeat work in #8455) — it mirrors the #8431 'GH var drives the value' pattern, applied to the worker/consumer instead of the headscale server.\n\n## Ops prereqs (set before/with merge)\n- GH Environment **vars**: \\`HEADSCALE_API_URL=https://headscale.elizacloud.ai\\`, \\`HEADSCALE_PUBLIC_URL=https://headscale.elizacloud.ai\\` (+ staging equivalents).\n- GH Environment **secret**: \\`HEADSCALE_API_KEY\\` = the freshly-minted Railway headscale apikey (production environment).\n\n## Test plan\n- YAML validates (\\`yaml.safe_load\\`).\n- Next provisioning-worker deploy: confirm \\`/opt/eliza/cloud/.env.local\\` contains the three reconciled \\`HEADSCALE_*\\` lines and the daemon routes through \\`https://headscale.elizacloud.ai\\`."])</script><script>self.__next_f.push([1,"28:T58b,"])</script><script>self.__next_f.push([1,"## What\nOn a stock-phone Android sideload, first-run now renders the 3-way runtime chooser (Eliza Cloud / Remote / Local) instead of auto-seeding the on-device local agent.\n\n## Why\n`preSeedAndroidLocalRuntimeIfFresh` auto-seeded local on any stock sideload (added in #8223 when onboarding was cloud-only and couldn't reach local). Post-redesign (#8457) the chooser has a **Local models** card, so auto-seeding now only does harm — verified on a real Solana Seeker (Android 16):\n- 🔔 Triggers the `POST_NOTIFICATIONS` prompt at launch (the auto-started agent foreground service posts a notification)\n- ⏳ Leaves the dashboard stuck \"connecting to backend\" while the slow on-device agent boots (MediaTek Dimensity 7300 ≈ 7 tok/s)\n- 🐢 Slows first load\n- ⛔ Skips the chooser entirely\n\n## Change\n`shouldPreSeedLocalRuntime()` → branded ElizaOS devices still auto-seed; stock sideloads fall through to the chooser. Removed the now-dead `isNativeAndroid`/`isAndroidCloudBuild`/`Capacitor` usage. Flipped the stock-sideload unit test (6/6 green).\n\n## Verified on device\nFresh install → chooser shows, **no notif prompt, no hang, fast** → tapped Remote → connected → \"100−37\" → reply **\"63\"**.\n\n@lalalune — this reverses the stock-sideload branch of your #8223 pre-seed (branded-device path unchanged). Heads-up since it's a deliberate behavior flip; the chooser's Local card preserves one-tap local."])</script><script>self.__next_f.push([1,"29:T77c,"])</script><script>self.__next_f.push([1,"## Symptom\nOn prod, `/v1/chat/completions` to `gpt-oss-120b` (the cloud's **default** TEXT_SMALL model) **intermittently returns empty content** at default/low `max_tokens` — the *same* prompt returns a full answer on one call and empty (but billed) output on the next. `zai-glm-4.7` (default TEXT_LARGE) has the same exposure.\n\n## Root cause\n`/v1/chat/completions` floors `max_tokens` at `MIN_RESPONSE_TOKENS` (4096) for reasoning models so the hidden chain-of-thought can't eat the whole budget and truncate the answer. But that floor only fires when `modelUsesReasoningTokens(model)` is true, and **neither launch model was detected**:\n- name patterns in `REASONING_MODEL_PATTERNS` don't cover `gpt-oss*` or `zai-glm-*`;\n- the authoritative catalog `supported_parameters` lookup is best-effort and fails in prod (falls back to name patterns).\n\nSo the handler's default `max_tokens` of **500** applies, and gpt-oss-120b — which spends output tokens on reasoning before answering — truncates mid-reasoning whenever the reasoning happens to exceed ~500 tokens (nondeterministic per call). Confirmed live: `modelUsesReasoningTokens(\"gpt-oss-120b\", undefined) === false` before this change.\n\n## Fix\nAdd `/^gpt-oss/` and `/^zai-glm-/` to `REASONING_MODEL_PATTERNS`. Both are reasoning models (gpt-oss is OpenAI's open-weight reasoning series; zai-glm-4.x is catalog-tagged `reasoning`). The 4096 floor now fires for both, on every id form (`gpt-oss-120b`, `cerebras:gpt-oss-120b`, `openai/gpt-oss-120b:nitro`, `zai-glm-4.7`, `cerebras:zai-glm-4.7`). Non-reasoning models (gpt-4o-mini, haiku) stay false — no over-matching.\n\n## Verification\n- Pure-fn probe: all launch-model id forms now detect `reasoning=true`.\n- 6 regression cases added to `pricing-reasoning-detection.test.ts`; suite green (44/0).\n- Already verified live: prod hotfix off `main` carries this + the #8484 Cerebras-pricing fix.\n\nTracker: #8434"])</script><script>self.__next_f.push([1,"2a:T61c,"])</script><script>self.__next_f.push([1,"## Goal\nStabilize `staging.elizacloud.ai`: boot into the **classic OG `DashboardLayout`**, not dEXploarer's half-baked experimental canvas UI.\n\n## Root cause\nThe interactive-canvas genui UI (`#8339`) was wired as the DEFAULT surface in the canvas store:\n```\ncanvasOpen: true\ndefaultUiMode: \"canvas\"\n```\nSo `App.tsx`'s `{canvasOpen ? \u003cCanvasLayout /\u003e : \u003cDashboardLayout /\u003e}` boots the experimental canvas instead of the stable classic dashboard. (This is on both develop and main — the canvas became the default, not just a staging regression.)\n\n## Fix (minimal, non-destructive — 1 file)\n`canvas-store.ts`:\n- initial state → `canvasOpen: false`, `defaultUiMode: \"classic\"`, `canvasMode: \"idle\"`\n- bump persist `version: 1` + `migrate` so existing users with a stale `defaultUiMode: \"canvas\"` in localStorage **also** reset to classic (not just fresh sessions)\n\nThe canvas UI is **NOT removed** — it stays fully available behind the toggle (`setDefaultUiMode`). The experimental work is preserved on `preserve/dexplorer-experimental-ui`. This just flips the default surface back to the stable OG dashboard.\n\n## Verified\n- typecheck clean for the change\n- OG render chain intact: `App.tsx` → `\u003cDashboardLayout/\u003e` (when canvasOpen=false) → `DashboardShell` (Header + Sidebar + routed pages), zero canvas dependency\n- only diff: 1 file, +18/-4\n\nNote: prod (main) has the same canvas-default — flagging that a follow-up may want the same flip on prod, but this PR targets develop/staging per the current goal.\n\nCo-authored-by: wakesync \u003cshadow@shad0w.xyz\u003e"])</script><script>self.__next_f.push([1,"2b:T432,## Summary\n- make the app-core Node/tsx runner opt into the existing `eliza-source` export condition\n- keep source-mode CI probes from requiring every workspace plugin to have a fresh `dist` build before they run\n\n## Why\nThe Scenario PR E2E `Zero-Key unit + UI coverage` job failed in #8453 because `test:local-provisioning` imported the agent API server and lazily resolved `@elizaos/plugin-x402` to `dist/index.js`. In that lane, plugin-x402 had not been built yet, so Node failed with `ERR_MODULE_NOT_FOUND` even though the workspace source was present. This runner is specifically for TypeScript workspace scripts, so resolving packages through `eliza-source` matches the source-mode behavior already used by Vitest aliases.\n\n## Verification\n- `bunx @biomejs/biome check packages/app-core/scripts/run-node-tsx.mjs`\n- `ELIZA_NODE_PATH=/Users/user1/.cache/codex-runtimes/codex-primary-runtime/dependencies/node/bin/node node packages/app-core/scripts/run-node-tsx.mjs -e \"const m = await import('@elizaos/plugin-x402'); console.log(typeof m.default, m.x402Plugin?.name)\"`\n2c:T2655,"])</script><script>self.__next_f.push([1,"Bumps [actions/setup-java](https://github.com/actions/setup-java) from 4 to 5.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/actions/setup-java/releases\"\u003eactions/setup-java's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev5.0.0\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003ch3\u003eBreaking Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eUpgrade to node 24 by \u003ca href=\"https://github.com/salmanmkc\"\u003e\u003ccode\u003e@​salmanmkc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/actions/setup-java/pull/888\"\u003eactions/setup-java#888\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMake sure your runner is updated to this version or newer to use this release. v2.327.1 \u003ca href=\"https://github.com/actions/runner/releases/tag/v2.327.1\"\u003eRelease Notes\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003eDependency Upgrades\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eUpgrade Publish Immutable Action by \u003ca href=\"https://github.com/HarithaVattikuti\"\u003e\u003ccode\u003e@​HarithaVattikuti\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/actions/setup-java/pull/798\"\u003eactions/setup-java#798\u003c/a\u003e\u003c/li\u003e\n\u003cli  at the self-hosted bitrouter's **cerebras** provider — but that provider only declared `api_base` + `api_key`, **no `api_protocol`**. `inherit_defaults` only fills `api_protocol` for *built-in* providers (openrouter); cerebras is custom, so the moment an alias actually routes to it, bitrouter 500s:\n```\ninvalid request: provider 'cerebras' has no api_protocol configured\n```\nLatent until those PRs added the cerebras aliases. **Found live on prod** — after the Cerebras-only deploy, `openai/gpt-oss-120b` returned HTTP 500.\n\n## The fix\nCerebras is OpenAI Chat Completions compatible, so declare `api_protocol: \"chat_completions\"` (matches the built-in `openrouter`/`openai` entries in bitrouter's provider catalog — verified against `crates/bitrouter-providers/providers/*.toml`).\n\n## Verified\nFixed config deployed to the `steward-eliza/production` bitrouter service via `railway up`; `openai/gpt-oss-120b` now routes 200 (Cerebras).\n\n**Scope:** the new-user default is unaffected (cerebras-**direct** via the Worker, never through bitrouter). This only fixes the legacy gateway-id + apps-chat paths that traverse bitrouter.\n\ncc @lalalune2e:T2d28,"])</script><script>self.__next_f.push([1,"Bumps [anthropics/claude-code-action](https://github.com/anthropics/claude-code-action) from 1.0.142 to 1.0.150.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/anthropics/claude-code-action/releases\"\u003eanthropics/claude-code-action's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev1.0.150\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/anthropics/claude-code-action/compare/v1...v1.0.150\"\u003ehttps://github.com/anthropics/claude-code-action/compare/v1...v1.0.150\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003ev1.0.149\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/ ersion (unless you reopen the PR or upgrade to it yourself)\n- `@dependabot ignore this minor version` will close this PR and stop Dependabot creating any more for this minor version (unless you reopen the PR or upgrade to it yourself)\n- `@dependabot ignore this dependency` will close this PR and stop Dependabot creating any more for this dependency (unless you reopen the PR or upgrade to it yourself)\n\n\n\u003c/details\u003e"])</script><script>self.__next_f.push([1,"2f:T4e5,## Why\nGitHub Actions hosted-minutes budget is exhausted → CI queue backlog. We stood up a 10-runner self-hosted fleet on `eliza-staging-robot-1` (isolated, non-root, resource-capped, validated end-to-end). This routes the heaviest *frequent* cloud workflow's compute jobs onto it to clear the queue + stop burning hosted minutes.\n\n## Change\n`cloud-tests.yml`: 5 pure-compute jobs → `runs-on: [self-hosted, linux, x64, hetzner-robot]`:\n- changed-paths, lint-and-types, unit-tests, integration-tests, e2e-tests\n\nThese need **no root**: `cloud-setup-test-env` uses setup-node/setup-bun (home-dir) + bun + the docker group (postgres/redis service containers) — all available to the non-root `github-runner` user (node+bun also pre-installed on the box).\n\n## Left on hosted (for now)\nThe 2 **playwright** jobs stay `ubuntu-latest` — they run `playwright install --with-deps chromium` which needs root/apt. Follow-up: pre-install playwright deps on the box, then route those too.\n\n## Validation\nThis PR's own `cloud-tests` run executes the 5 routed jobs **on the fleet** — confirming they pick up + pass on self-hosted before this hits develop. Incremental by design (one workflow first, expand after).\n\nCo-authored-by: wakesync \u003cshadow@shad0w.xyz\u003e30:T18c6,"])</script><script>self.__next_f.push([1,"Bumps [@ai-sdk/openai-compatible](https://github.com/vercel/ai/tree/HEAD/packages/openai-compatible) from 1.0.41 to 2.0.51.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e code\u003ereadResponseWithSizeLimit\u003c/code\u003e, \u003ccode\u003edownload\u003c/code\u003e, and \u003ccode\u003edownloadBlob\u003c/code\u003e, and \u003ccode\u003efetchWithValidatedRedirects\u003c/code\u003e cancels each redirect hop's body before following or rejecting the next hop.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eUpdated dependencies [5bfde36]\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eUpdated dependencies [779f5cd]\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e@​ai-sdk/gateway\u003c/code\u003e\u003ca href=\"https://github.com/3\"\u003e\u003ccode\u003e@​3\u003c/code\u003e\u003c/a\u003e.0.133\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e@​ai-sdk/provider-utils\u003c/code\u003e\u003ca href=\"https://github.com/4\"\u003e\u003ccode\u003e@​4\u003c/code\u003e\u003c/a\u003e.0.30\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/vercel/ai/blob/ai@6.0.207/packages/ai/CHANGELOG.md\"\u003eai's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e6.0.207\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e779f5cd: fix(provider-utils): cancel response body on download rejection to prevent socket leak\u003c/p\u003e\n\u003cp\u003eWhen a download was rejected early — because the \u003ccode\u003eContent-Length\u003c/code\u003e header exceeded the size limit, the response status was not ok, or a redirect resolved to a blocked URL — the fetch response body was left unconsumed and uncancelled. With WHATWG Fetch/undici this leaves the underlying TCP socket open instead of returning it to the connection pool, allowing an attacker-controlled origin to exhaust file descriptors and cause a denial of service. The body is now cancelled on all early-rejection paths in \u003ccode\u003ereadResponseWithSizeLimit\u003c/code\u003e, \u003ccode\u003edownload\u003c/code\u003e, and \u003ccode\u003edownloadBlob\u003c/code\u003e, and \u003ccode\u003efetchWithValidatedRedirects\u003c/code\u003e cancels each redirect hop's body before following or rejecting the next hop.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eUpdated dependencies [5bfde36]\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eUpdated dependencies [779f5cd]\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e@​ai-sdk/gateway\u003c/code\u003e\u003ca href=\"https://github.com/3\"\u003e\u003ccode\u003e@​3\u003c/code\u003e\u003c/a\u003e.0.133\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e@​ai-sdk/provider-utils\u003c/code\u003e\u003ca href=\"https://github.com/4\"\u003e\u003ccode\u003e@​4\u003c/code\u003e\u003c/a\u003e.0.30\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e6.0.206\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eUpdated dependencies [e962dda]\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e@​ai-sdk/gateway\u003c/code\u003e\u003ca href=\"https://github.com/3\"\u003e\u003ccode\u003e@​3\u003c/code\u003e\u003c/a\u003e.0.132\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e6.0.205\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eUpdated dependencies [6160ced]\u003c/li\u003e\n\u003cli\u003eUpdated dependencies [c9b8abd]\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e@​ai-sdk/gateway\u003c/code\u003e\u003ca href=\"https://github.com/3\"\u003e\u003ccode\u003e@​3\u003c/code\u003e\u003c/a\u003e.0.131\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e6.0.204\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eUpdated dependencies [c5d4716]\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e@​ai-sdk/gateway\u003c/code\u003e\u003ca href=\"https://github.com/3\"\u003e\u003ccode\u003e@​3\u003c/code\u003e\u003c/a\u003e.0.130\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e6.0.203\u003c/h2\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003ef42aa79: fix: harden download URL SSRF guard against hostname and redirect bypasses\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003evalidateDownloadUrl\u003c/code\u003e and the file download helpers (\u003ccode\u003edownloadBlob\u003c/code\u003e, \u003ccode\u003edownload\u003c/code\u003e) could be bypassed in several ways when handling untrusted URLs:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA fully-qualified hostname with a trailing dot (e.g. \u003ccode\u003elocalhost.\u003c/code\u003e, \u003ccode\u003emyhost.local.\u003c/code\u003e) skipped the localhost/\u003ccode\u003e.local\u003c/code\u003e blocklist.\u003c/li\u003e\n\u003cli\u003eIPv6 addresses that embed an IPv4 address in their last 32 bits — IPv4-compatible (\u003ccode\u003e::127.0.0.1\u003c/code\u003e), IPv4-translated (\u003ccode\u003e::ffff:0:127.0.0.1\u003c/code\u003e), and NAT64 (\u003ccode\u003e64:ff9b::127.0.0.1\u003c/code\u003e, including the \u003ccode\u003e64:ff9b:1::/48\u003c/code\u003e local-use prefix) — were not decoded and checked against the private IPv4 ranges.\u003c/li\u003e\n\u003cli\u003eRedirects were validated only \u003cem\u003eafter\u003c/em\u003e \u003ccode\u003efetch\u003c/code\u003e had already followed them, so the request to a redirect target (e.g. an internal/metadata address) had already been issued before the check ran.\u003c/li\u003e\n\u003cli\u003eSeveral reserved/internal address ranges were not blocked: CGNAT (\u003ccode\u003e100.64.0.0/10\u003c/code\u003e, used by some cloud providers for internal traffic), benchmarking (\u003ccode\u003e198.18.0.0/15\u003c/code\u003e), IETF protocol assignments (\u003ccode\u003e192.0.0.0/24\u003c/code\u003e), the reserved \u003ccode\u003e240.0.0.0/4\u003c/code\u003e block (including the \u003ccode\u003e255.255.255.255\u003c/code\u003e broadcast address), and IPv6 site-local (\u003ccode\u003efec0::/10\u003c/code\u003e) and multicast (\u003ccode\u003eff00::/8\u003c/code\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe validator now strips trailing dots before the hostname checks and fully expands IPv6 addresses to detect embedded private IPv4 targets. The download helpers now follow redirects manually (\u003ccode\u003eredirect: 'manual'\u003c/code\u003e), re-validating each hop before requesting it, so an unsafe redirect target is never fetched. When a redirect cannot be inspected because the runtime returns an opaque response, the helpers fail closed (reject the redirect) on the server; only in a real browser — where SSRF is not reachable (fetch is constrained by CORS and cannot reach a server's internal network or cloud-metadata endpoints) — is the redirect followed natively so legitimate redirected downloads keep working.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vercel/ai/commit/caebb44016dbd084e5bf7b7f4ab5194fd2c7c045\"\u003e\u003ccode\u003ecaebb44\u003c/code\u003e\u003c/a\u003e Version Packages (\u003ca href=\"https://github.com/vercel/ai/tree/HEAD/packages/ai/issues/16157\"\u003e#16157\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vercel/ai/commit/779f5cda10001add11430eac8ecaa8e1ea88cf35\"\u003e\u003ccode\u003e779f5cd\u003c/code\u003e\u003c/a\u003e Backport: fix(provider-utils): cancel response body on download rejection to ...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/vercel/ai/commit/562311796cd23e0518c8c8a74f1db35815a9287a\"\u003e\u003ccode\u003e p\u003econst name = await text({\nmessage: 'Enter your email',\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evalidate: type('string.email').describe('Invalid email'),\n});\n\u003c/code\u003e\u003c/pre\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/bombshell-dev/clack/pull/542\"\u003e#542\u003c/a\u003e \u003ca href=\"https://github.com/bombshell-dev/clack/commit/adb6af9f5fb39408934323a7415beb46b63ecd9a\"\u003e\u003ccode\u003eadb6af9\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/ghostdevv\"\u003e\u003ccode\u003e@​ghostdevv\u003c/code\u003e\u003c/a\u003e! - docs: add jsdoc for \u003ccode\u003ebox\u003c/code\u003e, \u003ccode\u003egroup\u003c/code\u003e, and \u003ccode\u003egroup-multi-select\u003c/code\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/bombshell-dev/clack/pull/534\"\u003e#534\u003c/a\u003e \u003ca href=\"https://github.com/bombshell-dev/clack/commit/3dcb31a7d63827d95a5a52ac630cbd48e3a68364\"\u003e\u003ccode\u003e3dcb31a\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/MattStypa\"\u003e\u003ccode\u003e@​MattStypa\u003c/code\u003e\u003c/a\u003e! - Fixed spaces and uppercase characters in multiline prompt\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/bombshell-dev/clack/pull/540\"\u003e#540\u003c/a\u003e \u003ca href=\"https://github.com/bombshell-dev/clack/commit/3170ed94dc2a6ed7973228d46c664fb7461969ad\"\u003e\u003ccode\u003e3170ed9\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/ghostdevv\"\u003e\u003ccode\u003e@​ghostdevv\u003c/code\u003e\u003c/a\u003e! - docs: add jsdoc for \u003ccode\u003eautocomplete\u003c/code\u003e, \u003ccode\u003econfirm\u003c/code\u003e, and \u003ccode\u003epath\u003c/code\u003e prompts "https://github.com/bombshell-dev/clack/commit/83428ac6d8bc5eda87615cc7b1f14e0c8b16e1b6\"\u003e\u003ccode\u003e83428ac\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/florian-lefebvre\"\u003e\u003ccode\u003e@​florian-lefebvre\u003c/code\u003e\u003c/a\u003e! - Adds support for Standard Schema validation\u003c/p\u003e\n\u003cp\u003ePrompts accept an optional \u003ccode\u003evalidate()\u003c/code\u003e function to validate user input. While a function provides more flexibility and customization over your validation, it can be a bit verbose. To help solve this, there are libraries that provide schema-based validation to make shorthand and type-strict validation substantially easier.\u003c/p\u003e\n\u003cp\u003eLibraries following the \u003ca href=\"https://github.com/standard-schema/standard-schema\"\u003eStandard Schema specification\u003c/a\u003e are now natively supported. For example, using \u003ca href=\"https://arktype.io/\"\u003eArktype\u003c/a\u003e:\u003c/p\u003e\n\u003cpre lang=\"diff\"\u003e\u003ccode\u003eimport { text } from '@clack/prompts';\nimport { type } from 'arktype';\n\u003cp\u003econst name = await text({\nmessage: 'Enter your email',\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evalidate: type('string.email').describe('Invalid email'),\n});\n\u003c/code\u003e\u003c/pre\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePatch Changes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://redirect.github.com/bombshell-dev/clack/pull/542\"\u003e#542\u003c/a\u003e \u003ca href=\"https://github.com/bombshell-dev/clack/commit/adb6af9f5fb39408934323a7415beb46b63ecd9a\"\u003e\u003ccode\u003eadb6af9\u003c/code\u003e\u003c/a\u003e Thanks \u003ca href=\"https://github.com/ghostdevv\"\u003e\u003ccode\u003e@​ghostdevv\u003c/code\u003e\u003c/a\u003e! - docs: add jsdoc for \u003ccode\u003ebox\u003c/code\u003e, \u003ccode\u003egroup\u003c/code\u003e, and \u003ccode\u003egroup- 003c/code\u003e option sets default option value to \u003ccode\u003etrue\u003c/code\u003e, default not implicitly set when define both positive and negative option in either order (\u003ca href=\"https://redirect.github.com/tj/commander.js/issues/2405\"\u003e#2405\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eupdate example to use compatible character for MINGW64 (\u003ca href=\"https://redirect.github.com/tj/commander.js/issues/2475\"\u003e#2475\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eChanged\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cem\u003eBreaking:\u003c/em\u003e migrated Commander implementation from CommonJS to ESM (\u003ca href=\"https://redirect.github.com/tj/commander.js/issues/2464\"\u003e#2464\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eBreaking:\u003c/em\u003e Commander 15 requires Node.js v22.12.0 or higher (for \u003ccode\u003erequire(esm)\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003edev: switch tests from Jest to \u003ccode\u003enode:test\u003c/code\u003e test runner (\u003ca href=\"https://redirect.github.com/tj/commander.js/issues/2463\"\u003e#2463\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eDeleted\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cem\u003eBreaking:\u003c/em\u003e removed deprecated export of \u003ccode\u003ecommander/esm.mjs\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/tj/commander.js/issues/2464\"\u003e#2464\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eMigration Tips\u003c/h3\u003e\n\u003cp\u003eCommander 15 is ESM only, but this does not mean you need to migrate to ESM to use it. Importing ESM from CommonJS is\nsupported by Node.js, and Bun, and Deno. Hopefully it Just Works for you! However, you may be using a different runtime or\nsome other part of your setup that may not yet natively support importing ESM from CommonJS, such as your testing framework\nor bundler.\u003c/p\u003e\n\u003cp\u003eIf you have problems using Command  href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20127\"\u003e#20127\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eCanonicalization: avoid suggesting large spacing-scale values for arbitrary lengths (e.g. \u003ccode\u003eleft-[99999px]\u003c/code\u003e → \u003ccode\u003eleft-[99999px]\u003c/code\u003e, not \u003ccode\u003eleft-24999.75\u003c/code\u003e) (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20130\"\u003e#20130\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure \u003ccode\u003e@tailwindcss/cli\u003c/code\u003e in \u003ccode\u003e--watch\u003c/code\u003e mode recovers when a tracked dependency is deleted and restored (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20137\"\u003e#20137\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure standalone \u003ccode\u003e@tailwindcss/cli\u003c/code\u003e binaries are ignored when scanning for class candidates (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20139\"\u003e#20139\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure class candidates are extracted from Twig \u003ccode\u003eaddClass(…)\u003c/code\u003e and \u003ccode\u003eremoveClass(…)\u003c/code\u003e calls (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20198\"\u003e#20198\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eDon't crash in the Ruby or Vue preprocessors when scanning files containing invalid UTF-8 bytes (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/19588\"\u003e#19588\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAllow \u003ccode\u003e@variant\u003c/code\u003e to be used inside \u003ccode\u003eaddBase\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/19480\"\u003e#19480\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure \u003ccode\u003e@source\u003c/code\u003e globs with symlinks are preserved (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20203\"\u003e#20203\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure later \u003ccode\u003e@source\u003c/code\u003e rules can re-include files excluded by earlier \u003ccode\u003e@source not\u003c/code\u003e rules (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20203\"\u003e#20203\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eUpgrade: don't migrate empty class rules to invalid \u003ccode\u003e@utility\u003c/code\u003e rules (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20205\"\u003e#20205\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure transitions between \u003ccode\u003einset-shadow-none\u003c/code\u003e and other inset shadows work correctly (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20208\"\u003e#20208\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure explicitly referenced \u003ccode\u003e@source\u003c/code\u003e directories are scanned even when ignored by git (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20214\"\u003e#20214\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eEnsure \u003ccode\u003e@source\u003c/code\u003e globs ending in \u003ccode\u003e**/*\u003c/code\u003e preserve dynamic path segments to avoid scanning too many files (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20217\"\u003e#20217\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eCanonicalization: don't fold \u003ccode\u003ecalc(…)\u003c/code\u003e divisions when the result would require high precision (e.g. \u003ccode\u003ew-[calc(100%/3.5)]\u003c/code\u003e → \u003ccode\u003ew-[calc(100%/3.5)]\u003c/code\u003e, not \u003ccode\u003ew-[28.571428571428573%]\u003c/code\u003e) (\u003ca href=\"https://redirect.github.com/tailwindlabs/tailwindcss/pull/20221\"\u003e#20221\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eServe ESM type declarations to ESM importers of \u003ccode\u003e@tailwindcss/postcss\u003c/code\u003e (\u003ca href=\"https://redirect.github. top Dependabot creating any more for this dependency (unless you reopen the PR or upgrade to it yourself)\n\n\n\u003c/details\u003e"])</script><script>self.__next_f.push([1,"40:T1de2,"])</script><script>self.__next_f.push([1,"Bumps [@noble/curves](https://github.com/paulmillr/noble-curves) from 1.9.1 to 2.2.0.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/paulmillr/noble-curves/releases\"\u003e@​noble/curves's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e2.2.0\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMarch 2026 self-audit\u003c/strong\u003e (all files): no major issues found\n\u003cul\u003e\n\u003cli\u003eAudited for spec compliance and security\u003c/li\u003e\n\u003cli\u003eed25519: make zip215 verification logic match spec more strictly (spec vectors were not enough)\u003c/li\u003e\n\u003cli\u003eed448: turn off zip215 mode by default, use stricter one\u003c/li\u003e\n\u003cli\u003eschnorr: reduce rand by mod N instead of throwing\u003c/li\u003e\n\u003cli\u003emath: hardening of sqrt\u003c/li\u003e\n\u003cli\u003ebabyjubjub: use correct curve and curve params\u003c/li\u003e\n\u003cli\u003eder: improve parsing\u003c/li\u003e\n\u003cli\u003ebls: improve point decoding\u003c/li\u003e\n\u003cli\u003ebls, bn: Fix Fp6 / Fp12 order\u003c/li\u003e\n\u003cli\u003ehash-to-curve: empty dst / count now throws\u003c/li\u003e\n\u003cli\u003eApply Object.freeze to most primitives\u003c/li\u003e\n\u003cli\u003eOther minor hardening\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eFix all Byte Array types, to ensure proper work in both TypeScript 5.6 \u0026amp; TypeScript 5.9+\n\u003cul\u003e\n\u003cli\u003eTS 5.6 has \u003ccode\u003eUint8Array\u003c/code\u003e, while TS 5.9+ made it generic \u003ccode\u003eUint8Array\u0026lt;ArrayBuffer\u0026gt;\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eThis creates incompatibility of code between versions\u003c/li\u003e\n\u003cli\u003ePreviously, it was hard to use and constantly emitted errors similar to \u003ccode\u003eTS2345\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eSee \u003ca href=\"https://redirect.github.com/microsoft/TypeScript/issues/62240\"\u003etypescript#62240\u003c/a\u003e for more context\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eImplement FROST threshold signatures from RFC 9591\u003c/li\u003e\n\u003cli\u003eFix compilation issues on TypeScript v6\u003c/li\u003e\n\u003cli\u003eImprove tree-shaking, reduce bundle sizes\u003c/li\u003e\n\u003cli\u003eAdd massive amounts of documentation everywhere\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003e(We're skipping v2.1, to align with other noble packages)\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/paulmillr/noble-curves/compare/2.0.1...2.2.0\"\u003ehttps://github.com/paulmillr/noble-curves/compare/2.0.1...2.2.0\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e2.0.1\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDisable extension-less imports. If you've used \u003ccode\u003e/ed25519\u003c/code\u003e, switch to \u003ccode\u003e/ed25519.js\u003c/code\u003e now. See \u003ca href=\"https://github.com/paulmillr/noble-curves/releases/tag/2.0.0\"\u003e2.0.0\u003c/a\u003e for more details.\u003c/li\u003e\n\u003cli\u003epackage.json: specify exported submodules to ensure typescript autocompletion\u003c/li\u003e\n\u003cli\u003epackage.json: bump hashes to 2.0.1 with scrypt \u0026amp; pkg.json changes\u003c/li\u003e\n\u003cli\u003eed25519: export map_to_curve_elligator2_curve25519 \u003ca href=\"https://redirect.github.com/paulmillr/noble-curves/pull/211\"\u003epaulmillr/noble-curves#211\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003ebls: try-catch pairingBatch in bls12_381.verify() by \u003ca href=\"https://github.com/MegaManSec\"\u003e\u003ccode\u003e@​MegaManSec\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/paulmillr/noble-curves/pull/212\"\u003epaulmillr/noble-curves#212\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003efft: expose extra info in \u003ccode\u003erootsOfUnity\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNew Contributors\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/MegaManSec\"\u003e\u003ccode\u003e@​MegaManSec\u003c/code\u003e\u003c/a\u003e made their first contribution in \u003ca href=\"https://redirect.github.com/paulmillr/noble-curves/pull/212\"\u003epaulmillr/noble-curves#212\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eGitHub Immutable Releases\u003c/h2\u003e\n\u003cp\u003eThis GH release does not include standalone noble-curves.js: use 2.0.0 for now, until we upgrade to newly added Immutable Releases\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/paulmillr/noble-curves/compare/2.0.0...2.0.1\"\u003ehttps://github.com/paulmillr/noble-curves/compare/2.0.0...2.0.1\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e2.0.0\u003c/h2\u003e\n\u003ch3\u003eHigh-level\u003c/h3\u003e\n\u003cp\u003ev2 massively simplifies internals, improves security, reduces bundle size and lays path for the future. To simplify upgrading, upgrade first to curves 1.9.x. It would show deprecations in vscode-like text editor.\u003c/p\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/paulmillr/noble-curves/commit/043905dfc90e75fe77bbbd60c791baa1e5177801\"\u003e\u003ccode\u003e043905d\u003c/code\u003e\u003c/a\u003e Release 2.2.0.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/paulmillr/noble-curves/commit/aa557118faefc01cf97cad83bbaa3ead726adf4  dependency by \u003ca href=\"https://github.com/mrmckeb\"\u003e\u003ccode\u003e@​mrmckeb\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/gpbl/react-day-picker/pull/2997\"\u003egpbl/react-day-picker#2997\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNew Contributors\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/mrmckeb\"\u003e\u003ccode\u003e@​mrmckeb\u003c/code\u003e\u003c/a\u003e made their first contribution in \u003ca href=\"https://redirect.github.com/gpbl/react-day-picker/pull/2997\"\u003egpbl/react-day-picker#2997\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/gpbl/react-day-picker/compare/v10.0.0...v10.0.1\"\u003ehttps://github.com/gpbl/react-day-picker/compare/v10.0.0...v10.0.1\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003ev10.0.0\u003c/h2\u003e\n\u003cp\u003eDayPicker v10 removes the public APIs deprecated in v9 and introduces a new \u003ccode\u003e@daypicker/react\u003c/code\u003e package name. Non-Gregorian calendars are now published as standalone \u003ccode\u003e@daypicker/*\u003c/code\u003e packages.\u003c/p\u003e\n\u003cp\u003eIf your app already uses the current v9 API, the upgrade should be relatively small. If your app still relies on deprecated v9 APIs, those usages should be updated before upgrading.\u003c/p\u003e\n\u003cp\u003eSee the full \u003ca href=\"https://daypicker.dev/changelog#v1000\"\u003ev10 changelog\u003c/a\u003e, the \u003ca href=\"https://daypicker.dev/upgrading\"\u003eupgrade guide\u003c/a\u003e, and the \u003ca href=\"https://github.com/gpbl/react-day-picker/discussions/2993\"\u003ev10 announcement\u003c/a\u003e for questions and upgrade feedback.\u003c/p\u003e\n\u003ch2\u003eInstall\u003c/h2\u003e\n\u003cpre lang=\"bash\"\u003e\u003ccode\u003enpm install react-day-picker@latest\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eFor new projects, prefer the scoped package name:\u003c/p\u003e\n\u003cpre lang=\"bash\"\u003e\u003ccode\u003enpm install @daypicker/react@latest\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"tsx\"\u003e\u003ccode\u003eimport { DayPicker } from \u0026quot;@daypicker/react\u0026quot;;\r\nimport \u0026quot;@daypicker/react/style.css\u0026quot;;\r\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe \u003ccode\u003ereact-day-picker\u003c/code\u003e package remains available in v10 for compatibility.\u003c/p\u003e\n\u003ch2\u003eBreaking Changes\u003c/h2\u003e\n\u003ch3\u003eDeprecated navigation props removed\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRemoved prop\u003c/th\u003e\n\u003cth\u003eUse instead\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efromMonth\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003estartMonth\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efromYear\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003estartMonth={new Date(year, 0)}\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etoMonth\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eendMonth\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etoYear\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eendMonth={new Date(year, 11)}\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efromDate\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ehidden={{ before: date }}\u003c/code\u003e and optionally \u003ccode\u003estartMonth\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etoDate\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ehidden={{ after: date }}\u003c/code\u003e and optionally \u003ccode\u003eendMonth\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003eDeprecated focus and event props removed\u003c/h3\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eChangelog\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/gpbl/react-day-picker/blob/main/packages/react-day-picker/CHANGELOG.md\"\u003ereact-day-picker's changelog\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev10.0.1\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003eRelease date: 2026-05-12\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThis patch release fixes inline styles for component slots and adds \u003ccode\u003e@types/react\u003c/code\u003e as an optional peer dependency for strict package managers.\u003c/p\u003e\n\u003ch4\u003eWhat's Changed\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003efix: apply inline styles to all component slots by \u003ca href=\"https://github.com/gpbl\"\u003e\u003ccode\u003e@​gpbl\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/gpbl/react-day-picker/pull/2995\"\u003e#2995\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003efix: add \u003ccode\u003e@types/react\u003c/code\u003e as an optional peer dependency by \u003ca href=\"https://github.com/mrmckeb\"\u003e\u003ccode\u003e@​mrmckeb\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/gpbl/react-day-picker/pull/2997\"\u003e#2997\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev10.0.0\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003eRelease date: 2026-05-08\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThis major release introduces the \u003ccode\u003e@daypicker/react\u003c/code\u003e package name, publishes calendar add-on packages under the \u003ccode\u003e@daypicker/*\u003c/code\u003e scope, and removes public APIs that were deprecated in v9.\u003c/p\u003e\n\u003ch4\u003eUpgrading to v10\u003c/h4\u003e\n\u003cp\u003eUpgrading from v9 should be straightforward if your app does not use any deprecated APIs. See the \u003ca href=\"https://daypicker.dev/upgrading\"\u003eupgrading guide\u003c/a\u003e for details. If you use one of the non-Gregorian calendars, such as Persian, Hebrew, Buddhist, Ethiopic, or Hijri, install the corresponding calendar add-on package alongside DayPicker.\u003c/p\u003e\n\u003ch4\u003ePackage Name\u003c/h4\u003e\n\u003cp\u003eFor new projects, prefer the \u003ccode\u003e@daypicker/react\u003c/code\u003e package:\u003c/p\u003e\n\u003cpre lang=\"tsx\"\u003e\u003ccode\u003eimport { DayPicker } from \u0026quot;@daypicker/react\u0026quot;;\nimport \u0026quot;@daypicker/react/style.css\u0026quot;;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe \u003ccode\u003ereact-day-picker\u003c/code\u003e package remains available for compatibility and exposes the same DayPicker API in v10.\u003c/p\u003e\n\u003ch4\u003eCalendar Packages\u003c/h4\u003e\n\u003cp\u003eCalendar add-on packages are now published under the \u003ccode\u003e@daypicker/*\u003c/code\u003e scope. Install the add-on package for the calendar you need alongside \u003ccode\u003e@daypicker/react\u003c/code\u003e. For example, to use the Persian calendar:\u003c/p\u003e\n\u003cpre lang=\"bash\"\u003e\u003ccode\u003enpm install @daypicker/react @daypicker/persian\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch4\u003eBreaking Changes\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003eRemoved deprecated props: \u003ccode\u003efromDate\u003c/code\u003e, \u003ccode\u003etoDate\u003c/code\u003e, \u003ccode\u003efromMonth\u003c/code\u003e, \u003ccode\u003etoMonth\u003c/code\u003e, \u003ccode\u003efromYear\u003c/code\u003e, \u003ccode\u003etoYear\u003c/code\u003e, \u003ccode\u003einitialFocus\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRemoved deprecated event props: \u003ccode\u003eonWeekNumberClick\u003c/code\u003e, \u003ccode\u003eonDayKeyUp\u003c/code\u003e, \u003ccode\u003eonDayKeyPress\u003c/code\u003e, \u003ccode\u003eonDayPointerEnter\u003c/code\u003e, \u003ccode\u003eonDayPointerLeave\u003c/code\u003e, \u003ccode\u003eonDayTouchCancel\u003c/code\u003e, \u003ccode\u003eonDayTouchEnd\u003c/code\u003e, \u003ccode\u003eonDayTouchMove\u003c/code\u003e, \u003ccode\u003eonDayTouchStart\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRemoved deprecated type exports from \u003ccode\u003etypes/deprecated\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRemoved deprecated aliases: \u003ccode\u003eformatMonthCaption\u003c/code\u003e, \u003ccode\u003eformatYearCaption\u003c/code\u003e, \u003ccode\u003elabelDay\u003c/code\u003e, \u003ccode\u003elabelCaption\u003c/code\u003e, \u003ccode\u003eisMatch\u003c/code\u003e, \u003ccode\u003eisDateInRange\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRemoved the deprecated \u003ccode\u003ecomponents.Button\u003c/code\u003e customization entry.\u003c/li\u003e\n\u003cli\u003eRemoved deprecated \u003ccode\u003eDeprecatedUI\u003c/code\u003e compatibility typing for \u003ccode\u003eclassNames\u003c/code\u003e and \u003ccode\u003estyles\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRemoved deprecated DateLib exports: \u003ccode\u003eFormatOptions\u003c/code\u003e, \u003ccode\u003eLabelOptions\u003c/code\u003e, \u003ccode\u003edateLib\u003c/code\u003e, and \u003ccode\u003eDateLib.Date\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRemoved the deprecated \u003ccode\u003ereact-day-picker/jalali\u003c/code\u003e subpath. Use \u003ccode\u003ereact-day-picker/persian\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/gpbl/react-day-picker/commit/6d3929d655779d178638d8f80171597a579468e8\"\u003e\u003ccode\u
