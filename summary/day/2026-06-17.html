an also trigger a rebase manually by commenting `@dependabot rebase`.\n\n[//]: # (dependabot-automerge-start)\n[//]: # (dependabot-automerge-end)\n\n---\n\n\u003cdetails\u003e\n\u003csummary\u003eDependabot commands and options\u003c/summary\u003e\n\u003cbr /\u003e\n\nYou can trigger Dependabot actions by commenting on this PR:\n- `@dependabot rebase` will rebase this PR\n- `@dependabot recreate` will recreate this PR, overwriting any edits that have been made to it\n- `@dependabot show \u003cdependency name\u003e ignore conditions` will show all of the ignore conditions of the specified dependency\n- `@dependabot ignore this major version` will close this PR and stop Dependabot creating any more for this major version (unless you reopen the PR or upgrade to it yourself)\n- `@dependabot ignore this minor version` will close this PR and stop Dependabot creating any more for this minor version (unless you reopen the PR or upgrade to it yourself)\n- `@dependabot ignore this dependency` will close this PR and stop Dependabot creating any more for this dependency (unless you reopen the PR or upgrade to it yourself)\n\n\n\u003c/details\u003e"])</script><script>self.__next_f.push([1,"43:T20b1,"])</script><script>self.__next_f.push([1,"Updates the requirements on [ag2](https://github.com/ag2ai/ag2) to permit the latest version.\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/ag2ai/ag2/releases\"\u003eag2's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev0.13.4\u003c/h2\u003e\n\u003ch2\u003eHighlights\u003c/h2\u003e\n\u003ch3\u003e🛣️ Continuing the Path to v1.0\u003c/h3\u003e\n\u003cp\u003eThree important Beta additions: serving an AG2 Agent as an \u003cstrong\u003eMCP server\u003c/strong\u003e, \u003cstrong\u003eSkillPlugin\u003c/strong\u003e with agentskills.io spec support, and a new \u003cstrong\u003eAmazon Bedrock\u003c/strong\u003e Beta client.\u003c/p\u003e\n\u003cp\u003e📍 \u003ca href=\"https://docs.ag2.ai/latest/docs/user-guide/release-roadmap/\"\u003eRelease Roadmap\u003c/a\u003e\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e🔬 Beta Framework (\u003ccode\u003eautogen.beta\u003c/code\u003e)\u003c/h2\u003e\n\u003ch3\u003e🔌 AG2 Agent as an MCP Server\u003c/h3\u003e\n\u003cp\u003ev0.13.0 added MCP support as a \u003cem\u003eclient\u003c/em\u003e: any AG2 Agent can now be served \u003cem\u003eas\u003c/em\u003e an MCP server, with \u003cstrong\u003eOAuth Resource Server authentication\u003c/strong\u003e for production-grade access control. Enables any MCP client to use an AG2 Agent as a tool.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDocs:\u003c/strong\u003e \u003ca href=\"https://docs.ag2.ai/latest/docs/beta/tools/mcp_servers/\"\u003eMCP Servers\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e🧰 SkillPlugin — agentskills.io Spec-Aligned Skills\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSkillPlugin\u003c/strong\u003e – Give agents access to local skills aligned with the \u003ca href=\"https://agentskills.io/\"\u003eagentskills.io\u003c/a\u003e spec. Skills become a first-class, portable extension surface for AG2 Agents.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e☁️ Amazon Bedrock Beta Client\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAmazon Bedrock Beta Client\u003c/strong\u003e – New Beta client for Amazon Bedrock, bringing Bedrock into the Beta config architecture.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eUsage\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDecoupled UsageEvent\u003c/strong\u003e – New usage reporting via a decoupled \u003ccode\u003eUsageEvent\u003c/code\u003e for cleaner separation between LLM calls and usage tracking.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e📔 Documentation\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e📔 Tweaked Beta cookbook examples for reliability.\u003c/li\u003e\n\u003cli\u003e📔 Added \u003ca href=\"https://docs.ag2.ai/latest/docs/ecosystem/\"\u003eTealTiger\u003c/a\u003e governance integration example to ecosystem.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eci: bump codecov-action to v7.0.0 (fixes bricked-keybase GPG key import failure by \u003ca href=\"https://github.com/marklysze\"\u003e\u003ccode\u003e@​marklysze\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/ag2ai/ag2/pull/2954\"\u003eag2ai/ag2#2954\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003efeat(beta/skills): SkillPlugin + agentskills.io spec-aligned local skills by \u003ca href=\"https://github.com/Lancetnik\"\u003e\u003ccode\u003e@​Lancetnik\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/ag2ai/ag2/pull/2957\"\u003eag2ai/ag2#2957\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003edocs(beta): Tweak cookbook examples for reliability by \u003ca href=\"https://github.com/marklysze\"\u003e\u003ccode\u003e@​marklysze\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/ag2ai/ag2/pull/2960\"\u003eag2ai/ag2#2960\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003efix(test): improve asyncio.sleep use reliability by \u003ca href=\"https://github.com/marklysze\"\u003e\u003ccode\u003e@​marklysze\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/ag2ai/ag2/pull/2961\"\u003eag2ai/ag2#2961\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003efeat(beta/mcp): serve an AG2 Agent as an MCP server (+ OAuth Resource Server auth) by \u003ca href=\"https://github.com/jsun-m\"\u003e\u003ccode\u003e@​jsun-m\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/ag2ai/ag2/pull/2937\"\u003eag2ai/ag2#2937\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003efeat(beta): add usage reporting via decoupled UsageEvent by \u003ca href=\"https://github.com/vvlrff\"\u003e\u003ccode\u003e@​vvlrff\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https:// e\u003e{pattern, mark?}\u003c/code\u003e as the parameter of \u003ccode\u003e.add()\u003c/code\u003e so that we could imitate the mechanism of \u003ccode\u003egit check-ignore\u003c/code\u003e as:\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003eig.add({\r\n  pattern: 'foo/*',\r\n  mark: '60'\r\n})\r\n\u003cp\u003econst {\u003cbr /\u003e\nignored,\u003cbr /\u003e\nrule\u003cbr /\u003e\n} = checkIgnore('foo/')\u003c/p\u003e\n\u003cp\u003eif (ignored) {\u003cbr /\u003e\nconsole.log(\u003ccode\u003e.gitignore:${result}:${rule.mark}:${rule.pattern} foo/\u003c/code\u003e)\u003cbr /\u003e\n}\u003c/p\u003e\n\u003cp\u003e// .gitignore:60:foo/* foo/\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003ch2\u003ePotential Incompatibilities\u003c/h2\u003e\n\u003cp\u003eThe only situation that \u003ccode\u003e7.0.0\u003c/code\u003e might bring incompatibility is to \u003ccode\u003e.add()\u003c/code\u003e a \u003ccode\u003e\u0026lt; 7.0.0\u003c/code\u003e instance into a \u003ccode\u003e\u0026gt;= 7.0.0\u003c/code\u003e instance, which might occur when the current workspace has multiple \u003ccode\u003enode-ignore\u003c/code\u003e versions installed, please be careful.\u003c/p\u003e\n\u003cpre lang=\"js\"\u003e\u003ccode\u003econst {anotherIgnoreInstance} = require('./ignore-6.0-instance')\r\n\u003cp\u003e// A 7.0.0 instance\u003cbr /\u003e\nignore().add(anotherIgnoreInstance)\u003c/p\u003e\n\u003cp\u003e// It will break your code\u003cbr /\u003e\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003cp\u003eOtherwise, in most cases, if you never do something above or there is only one version of \u003ccode\u003enode-ignore\u003c/code\u003e installed in the current workspace, it is quite safe to upgrade to \u003ccode\u003e7.0.0\u003c/code\u003e.\u003c/p\u003e\n\u003ch2\u003e6.x (== 5.3.2)\u003c/h2\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u \u003ccode\u003e@​Link\u003c/code\u003e\u003c/a\u003e- in \u003ca href=\"https://redirect.github.com/actions/upload-artifact/pull/754\"\u003eactions/upload-artifact#754\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUpgrade the module to ESM and bump dependencies by \u003ca href=\"https://github.com/danwkennedy\"\u003e\u003ccode\u003e@​danwkennedy\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/actions/upload-artifact/pull/762\"\u003eactions/upload-artifact#762\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eSupport direct file uploads by \u003ca href=\"https://github.com/danwkennedy\"\u003e\u003ccode\u003e@​danwkennedy\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/actions/upload-artifact/pull/764\"\u003eactions/upload-artifact#764\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNew Contributors\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/Link\"\u003e\u003ccode\u003e@​Link\u003c/code\u003e\u003c/a\u003e- made their first contribution in \u003ca href=\"https://redirect.github.com/actions/upload-artifact/pull/754\"\u003eactions/upload-artifact#754\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/actions/upload-artifact/compare/v6...v7.0.0\"\u003ehttps://github.com/actions/upload-artifact/compare/v6...v7.0.0\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003ev6.0.0\u003c/h2\u003e\n\u003ch2\u003ev6 - What's new\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e[!IMPORTANT]\nactions/upload-artifact@v6 now runs on Node.js 24 (\u003ccode\u003eruns.using: node24\u003c/code\u003e) and requires a minimum Actions Runner version of 2.327.1. If you are using self-hosted runners, ensure they are updated before upgrading.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003eNode.js 24\u003c/h3\u003e\n\u003cp\u003eThis release updates the runtime to Node.js 24. v5 had preliminary support f  API key for the owner's org may create affiliate characters — a key is just a key with full access (no per-key scopes).`\n\nSo the standard key now returns 201, not 403 — the assertion is stale. The middleware (`api-key-permission.ts`) and the other test references were already cleaned up in `bc4bb287d`; this one test file was just missed.\n\n## Change\n\nRemove the obsolete `forbidden without affiliate permission` test. The happy-path (201) and missing-auth (401) cases still cover the route. `bearerHeaders` stays referenced (setup + import), no orphan.\n\nThis greens the API Worker `test:e2e` and unblocks the `develop → main` promote.\n\ncc @lalalune — finishing the api-key permission-scope removal from `bc4bb287d`."])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-4xl\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-4 flex flex-col justify-between sm:flex-row\",\"children\":[[\"$\",\"$L12\",null,{\"currentInterval\":\"day\",\"currentDate\":\"2026-06-17\"}],[\"$\",\"$L13\",null,{\"metrics\":{\"date\":\"2026-06-17\",\"interval\":{\"intervalStart\":\"$D2026-06-17T00:00:00.000Z\",\"intervalEnd\":\"$D2026-06-18T00:00:00.000Z\",\"intervalType\":\"day\"},\"pullRequests\":{\"new\":52,\"merged\":46,\"total\":52},\"issues\":{\"new\":0,\"closed\":0,\"total\":0},\"activeContributors\":10,\"codeChanges\":{\"additions\":2962,\"deletions\":438,\"files\":101,\"commitCount\":93},\"topContributors\":[{\"username\":\"greptile-apps\",\"avatarUrl\":\"https://avatars.githubusercontent.com/in/867647?v=4\",\"totalScore\":382.5,\"prScore\":0,\"issueScore\":0,\"reviewScore\":382.5,\"commentScore\":0,\"summary\":\"greptile-apps: Focused on collaborative code review, providing 85 comments across various pull requests to support team development.\"},{\"username\":\"NubsCarson\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/192162056?u=d2be9082d i: Expanded the ElizaOS ecosystem by integrating the @usenami/plugin-funding via PR #8471, which involved modifying configuration files to support new plugin functionality. This contribution reflects a focused effort on extending project capabilities through configuration-based enhancements.\"}],\"focusAreas\":[{\"area\":\".github/workflows\",\"count\":32},{\"area\":\"cloud-shared\",\"count\":18},{\"area\":\"benchmarks\",\"count\":11},{\"area\":\"cloud-api\",\"count\":6},{\"area\":\"ui\",\"count\":5},{\"area\":\"registry\",\"count\":4},{\"area\":\"app-core\",\"count\":3},{\"area\":\"cloud-frontend\",\"count\":3},{\"area\":\"scripts\",\"count\":3},{\"area\":\"plugins/plugin-health\",\"count\":2}],\"topIssues\":[],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs7kAL2a\",\"title\":\"feat(cloud-frontend): implement interactive canvas Voice UX \u0026 default dashboard layout preference\",\"author\":\"Dexploarer\",\"number\":8339,\"body\":\"$14\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-08T16:50:36Z\",\"mergedAt\":null,\"additions\":20510,\"deletions\":10},{\"id\":\"PR_kwDOMT5cIs7kgLIA\",\"title\":\"fix(cloud): apps lane billing, ingress, and tenant DB teardown (#8342, #8321)\",\"author\":\"dutchiono\",\"number\":8351,\"body\":\"$15\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-09T18:16:45Z\",\"mergedAt\":null,\"additions\":1657,\"deletions\":157},{\"id\":\"PR_kwDOMT5cIs7jjZWm\",\"title\":\"fix(cloud): resolve unauthorized error in agent image provisioning\",\"author\":\"Dexploarer\",\"number\":8292,\"body\":\"## Summary\\n- keep cloud-managed iOS builds on the cloud bridge instead of falling through to local model downloads\\n- request proactive iOS contacts/reminders permissions and keep first-run progress counts aligned\\n- personalize shell greetings from persisted owner, device, or cloud user identity and re-render when the name resolves\\n- preserve the remote revert of the broader cloud control-plane changes while keeping the iOS first-run fixes\\n\\n## Verification\\n- bun run --cwd packages/ui test src/first-run/proactive-ios-permissions.test.ts\\n- bun run --cwd packages/ui typecheck\\n- bun run --cwd packages/ui lint (passes with 3 existing story noArrayIndexKey warnings)\\n- bun run --cwd packages/app test src/ios-runtime.test.ts\\n- bun run --cwd packages/app typecheck\\n\\n## Notes\\n- Existing PR branch was non-fast-forward; merged origin/codex/mobile-cloud-login-control-plane before pushing.\\n- CI is running on head 39d6e7fd69c31fce625bdd2d5a7e9bd3aea71e17.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-07T02:15:31Z\",\"mergedAt\":null,\"additions\":1603,\"deletions\":123},{\"id\":\"PR_kwDOMT5cIs7nmbwC\",\"title\":\"fix(cloud): restore stable prod UI + api-key permission layer to staging (revert dexplorer slop)\",\"author\":\"0xSolace\",\"number\":8489,\"body\":\"$16\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T17:48:01Z\",\"mergedAt\":null,\"additions\":850,\"deletions\":55},{\"id\":\"PR_kwDOMT5cIs7nsOhH\",\"title\":\"feat(apps): dedicated apps-control provisioning daemon + job lanes (Product 2)\",\"author\":\"NubsCarson\",\"number\":8514,\"body\":\"$17\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T22:20:56Z\",\"mergedAt\":\"2026-06-17T23:57:09Z\",\"additions\":801,\"deletions\":18},{\"id\":\"PR_kwDOMT5cIs7nRUU4\",\"title\":\"fix(cloud-api): stop orphaning `pending` agent sandboxes on non-atomic create→enqueue\",\"author\":\"standujar\",\"number\":8465,\"body\":\"$18\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T01:59:49Z\",\"mergedAt\":\"2026-06-17T02:32:13Z\",\"additions\":682,\"deletions\":156},{\"id\":\"PR_kwDOMT5cIs7nGiek\",\"title\":\"ci(cloud): add Headscale control-plane arm workflow\",\"author\":\"odilitime\",\"number\":8451,\"body\":\"$19\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-16T16:32:12Z\",\"mergedAt\":null,\"additions\":529,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs7nMDpu\",\"title\":\"feat(onboarding): rebuild first-run as a clean 3-way runtime chooser\",\"author\":\"NubsCarson\",\"number\":8457,\"body\":\"$1a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-16T20:41:18Z\",\"mergedAt\":null,\"additions\":432,\"deletions\":178},{\"id\":\"PR_kwDOMT5cIs7nWcZq\",\"title\":\"fix(cloud): retry transient bitrouter inference failures (429/502/503/504)\",\"author\":\"0xSolace\",\"number\":8470,\"body\":\"$1b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T07:01:49Z\",\"mergedAt\":\"2026-06-17T18:19:49Z\",\"additions\":398,\"deletions\":12},{\"id\":\"PR_kwDOMT5cIs7nSw__\",\"title\":\"ci: make dev smoke provider selection resilient\",\"author\":\"odilitime\",\"number\":8468,\"body\":\"$1c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T03:41:42Z\",\"mergedAt\":\"2026-06-17T18:18:31Z\",\"additions\":310,\"deletions\":41},{\"id\":\"PR_kwDOMT5cIs7nrPjQ\",\"title\":\"feat(cloud): first-time passkey setup for new accounts (waifu parity)\",\"author\":\"0xSolace\",\"number\":8512,\"body\":\"$1d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T21:24:12Z\",\"mergedAt\":\"2026-06-17T23:52:28Z\",\"additions\":169,\"deletions\":14},{\"id\":\"PR_kwDOMT5cIs7nrdqF\",\"title\":\"ci: reduce Linux build cache disk I/O\",\"author\":\"odilitime\",\"number\":8513,\"body\":\"## Summary\\n\\n- Remove the forced `--no-cache` flag from the root `build:core` script.\\n- Remove the forced `--no-cache` flag from the root `build:server` script.\\n- Enable remote-only Turborepo cache for the self-hosted Linux Cloud CF deploy jobs with `TURBO_CACHE=remote:rw`.\\n\\n## Why\\n\\nStaging Linux runners can reuse Turbo cache automatically when these scripts do not explicitly disable it. The Cloud CF deploy jobs run `build:core` on the self-hosted Hetzner runner, so remote-only Turbo cache avoids writing local `.turbo` cache artifacts while still allowing remote cache hits/uploads.\\n\\nTogether these should reduce repeated build work and disk I/O on the staging machine.\\n\\n## Validation\\n\\n- `bun -e \\\"JSON.parse(await Bun.file('package.json').text()); console.log('package.json ok')\\\"`\\n- `ruby -e \\\"require 'yaml'; YAML.load_file('.github/workflows/cloud-cf-deploy.yml'); puts 'cloud-cf-deploy.yml ok'\\\"`\\n- `TURBO_CACHE=remote:rw bun run build:core --dry-run=json`\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T21:37:02Z\",\"mergedAt\":\"2026-06-18T08:07:24Z\",\"additions\":111,\"deletions\":38},{\"id\":\"PR_kwDOMT5cIs7kiyTI\",\"title\":\"fix(cloud): apps data plane P0 — pgbouncer, ports, env contract (#8321)\",\"author\":\"dutchiono\",\"number\":8356,\"body\":\"$1e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-09T20:13:10Z\",\"mergedAt\":null,\"additions\":93,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs7nj__g\",\"title\":\"feat(ui): iOS three-detent chat sheet + suggestions floated above it\",\"author\":\"NubsCarson\",\"number\":8487,\"body\":\"$1f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T16:06:52Z\",\"mergedAt\":\"2026-06-17T18:19:17Z\",\"additions\":84,\"deletions\":16},{\"id\":\"PR_kwDOMT5cIs7ni5Ij\",\"title\":\"fix(cloud): reconcile live prod hotfixes into main (Cerebras pricing + reasoning floor)\",\"author\":\"NubsCarson\",\"number\":8485,\"body\":\"$20\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T15:24:16Z\",\"mergedAt\":\"2026-06-17T16:45:12Z\",\"additions\":74,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7nX28Q\",\"title\":\"registry: add @usenami/plugin-funding (ElizaOS plugin, third-party)\",\"author\":\"namixai\",\"number\":8471,\"body\":\"$21\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T08:06:37Z\",\"mergedAt\":\"2026-06-17T18:18:48Z\",\"additions\":66,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7nokdq\",\"title\":\"ci: run trusted linux jobs on self-hosted runners\",\"author\":\"odilitime\",\"number\":8501,\"body\":\"## Summary\\n- Move trusted Linux CI jobs from hosted Ubuntu to the self-hosted Linux x64 Hetzner runner pool.\\n- Preserve GitHub-hosted Ubuntu fallback for fork PRs so untrusted code keeps ephemeral runner isolation.\\n- Document the runner policy and why non-Linux/specialized lanes should stay on purpose-built runners until matching labels exist.\\n\\n## Why\\nThe project now has online self-hosted Linux x64 runners. Routing same-repository PRs, pushes, schedules, and manual runs there should reduce queue time and let the existing parallel CI slices do useful work without removing checks or weakening the quality gate. Fork PRs deliberately keep hosted runners because this is a public repo and self-hosted runners are persistent infrastructure.\\n\\n## Validation\\n- Parsed updated workflow YAML with Ruby YAML loader.\\n- Ran git diff --check.\\n- Verified targeted workflow files no longer contain direct hosted Ubuntu Linux runs-on entries.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T19:21:19Z\",\"mergedAt\":\"2026-06-17T19:42:04Z\",\"additions\":63,\"deletions\":43},{\"id\":\"PR_kwDOMT5cIs7npyGF\",\"title\":\"fix(cloud): honor bridge-host fallback when injecting TS_AUTHKEY\",\"author\":\"lalalune\",\"number\":8504,\"body\":\"$22\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:11:25Z\",\"mergedAt\":\"2026-06-18T07:31:19Z\",\"additions\":62,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7nRzNW\",\"title\":\"feat(registry): add @agentradar/eliza-plugin\",\"author\":\"Bichev\",\"number\":8466,\"body\":\"$23\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T02:30:31Z\",\"mergedAt\":\"2026-06-17T18:18:52Z\",\"additions\":57,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7nhzEh\",\"title\":\"fix(cloud): unbreak shared agents — resolve Cerebras pricing for direct-provider billing\",\"author\":\"NubsCarson\",\"number\":8484,\"body\":\"$24\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T14:44:47Z\",\"mergedAt\":\"2026-06-17T18:18:35Z\",\"additions\":54,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7nHH1N\",\"title\":\"test(cloud): align BitRouter infra contract\",\"author\":\"odilitime\",\"number\":8454,\"body\":\"$25\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-16T16:57:53Z\",\"mergedAt\":null,\"additions\":51,\"deletions\":38},{\"id\":\"PR_kwDOMT5cIs7jV6KV\",\"title\":\"refactor(cloud): remove anonymous guest sessions (sign-in required to chat)\",\"author\":\"NubsCarson\",\"number\":8274,\"body\":\"$26\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-06T03:06:19Z\",\"mergedAt\":null,\"additions\":49,\"deletions\":2559},{\"id\":\"PR_kwDOMT5cIs7nP8KI\",\"title\":\"ci(provisioning-worker): drive HEADSCALE_* from CI into .env.local (stop prod drifting to a stale hand-edited headscale)\",\"author\":\"NubsCarson\",\"number\":8464,\"body\":\"$27\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T00:27:47Z\",\"mergedAt\":\"2026-06-17T00:44:40Z\",\"additions\":36,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7nVOgE\",\"title\":\"fix(onboarding): show first-run chooser on stock sideload instead of auto-seeding local\",\"author\":\"NubsCarson\",\"number\":8469,\"body\":\"$28\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T06:00:54Z\",\"mergedAt\":\"2026-06-17T18:19:20Z\",\"additions\":21,\"deletions\":31},{\"id\":\"PR_kwDOMT5cIs7njVXH\",\"title\":\"fix(cloud): floor response tokens for gpt-oss + zai-glm — stop intermittent empty replies on the default model\",\"author\":\"NubsCarson\",\"number\":8486,\"body\":\"$29\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T15:40:39Z\",\"mergedAt\":\"2026-06-17T18:18:39Z\",\"additions\":20,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7npWdc\",\"title\":\"fix(cloud-frontend): default prod dashboard to classic OG, not canvas slop\",\"author\":\"0xSolace\",\"number\":8502,\"body\":\"## Summary\\nProd (`elizacloud.ai`) is still serving the experimental canvas UI as the default dashboard — confirmed live: prod bundle has `defaultUiMode:\\\\`canvas\\\\``. Staging was already fixed via #8493 (merged to develop, `defaultUiMode:\\\\`classic\\\\`` confirmed live on staging.elizacloud.ai).\\n\\nThis cherry-picks #8493 (`9e2e1a3cd2`) onto main so prod matches staging: the OG dashboard is the default, canvas stays behind the toggle.\\n\\n## What it does\\n- `canvas-store.ts`: `defaultUiMode: classic`, `canvasOpen: false`, `canvasView: idle`\\n- Adds persist `version: 1` + migrate so returning prod users with stale `eliza-cloud-canvas` localStorage (canvas) get reset to classic\\n- Canvas is NOT deleted — still reachable via the UI toggle\\n\\n## Validation\\n- Confirmed prod bundle currently ships `defaultUiMode:\\\\`canvas\\\\`` (the bug); staging ships `classic` (the fix)\\n- Cherry-pick is a clean 1-file change, classic-default + canvasOpen:false verified on this branch\\n\\nCo-authored-by: wakesync \u003cshadow@shad0w.xyz\u003e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T19:53:35Z\",\"mergedAt\":\"2026-06-17T19:53:55Z\",\"additions\":18,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7nnip8\",\"title\":\"fix(cloud-frontend): default to classic OG dashboard, not the canvas slop\",\"author\":\"0xSolace\",\"number\":8493,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T18:34:45Z\",\"mergedAt\":\"2026-06-17T18:35:38Z\",\"additions\":18,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7nSZ8h\",\"title\":\"fix(cloud): registry-probe handles digest-pinned image refs (ghcr token 400)\",\"author\":\"NubsCarson\",\"number\":8467,\"body\":\"## Bug\\n`resolveImageDigest` runs a **digest-pinned** ref (`repo@sha256:...`) through `parseImageRef`, which keeps the `@sha256` in the repo (`elizaos/eliza@sha256`) → corrupts the ghcr token scope `repository:elizaos/eliza@sha256:pull` → **HTTP 400**. The fleet-upgrade reconciler logs `[registry-probe] ghcr token fetch failed ... 400` and `skip_no_digest`s every cycle, so a digest-pinned fleet never auto-upgrades.\\n\\n**The prod agent image is digest-pinned** (`ghcr.io/elizaos/eliza@sha256:4abb...`), so this fired on every prod provisioning-worker heartbeat — surfaced during the prod dedicated-provision e2e (tracker #8434). @standujar independently flagged the same scope bug in his staging E2E writeup.\\n\\n## Fix\\nA digest-pinned ref is already resolved — the digest **is** the answer. Short-circuit before the tag path and return it (validated `sha256:\u003c64hex\u003e`), no token/manifest fetch. Tag-based refs unchanged.\\n\\ncc @standujar @lalalune\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T03:17:28Z\",\"mergedAt\":\"2026-06-17T18:19:24Z\",\"additions\":14,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs7nPyGY\",\"title\":\"ci(app-core): resolve tsx runner imports from source\",\"author\":\"odilitime\",\"number\":8463,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T00:17:31Z\",\"mergedAt\":\"2026-06-17T00:44:46Z\",\"additions\":12,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7nq3y7\",\"title\":\"fix(apps-data-plane): partition app-node private IP per env (prod↔staging collision)\",\"author\":\"NubsCarson\",\"number\":8511,\"body\":\"Prod apps data-plane `terraform apply` failed at `hcloud_server_network.app_node` with \\\"API request failed\\\": staging + production app nodes share the apps-shared subnet, but the private-IP offset was `20 + node_index` for **both** envs, so prod node #1 tried to claim `10.30.1.21` — already held by the staging app node.\\n\\nFix: partition the base per env — staging `20+` (21,22,…), production `30+` (31,32,…); tenant DB stays at host 10. Staging is unchanged (still .21), so no drift on the existing staging node. Verified by re-running the prod apply off this branch.\\n\\nPart of standing up the prod apps data-plane (Product-2 per-app DB + container hosting). Tracker #8434.\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T21:04:23Z\",\"mergedAt\":\"2026-06-18T02:54:20Z\",\"additions\":8,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7nei0F\",\"title\":\"chore(deps): bump actions/setup-java from 4 to 5\",\"author\":\"dependabot\",\"number\":8477,\"body\":\"$2c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:46:39Z\",\"mergedAt\":\"2026-06-17T17:37:58Z\",\"additions\":7,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs7nOwqG\",\"title\":\"fix(cloud-infra): declare api_protocol on bitrouter cerebras provider (gpt-oss-120b 500)\",\"author\":\"NubsCarson\",\"number\":8461,\"body\":\"$2d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-16T23:05:32Z\",\"mergedAt\":null,\"additions\":7,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7neiNq\",\"title\":\"chore(deps): bump anthropics/claude-code-action from 1.0.142 to 1.0.150\",\"author\":\"dependabot\",\"number\":8475,\"body\":\"$2e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:46:18Z\",\"mergedAt\":\"2026-06-17T17:37:35Z\",\"additions\":6,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs7noUqF\",\"title\":\"ci(cloud-tests): route compute jobs to self-hosted hetzner-robot runners\",\"author\":\"0xSolace\",\"number\":8500,\"body\":\"$2f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T19:10:17Z\",\"mergedAt\":null,\"additions\":5,\"deletions\":5},{\"id\":\"PR_kwDOMT5cIs7nqU0e\",\"title\":\"chore(deps): bump @ai-sdk/openai-compatible from 1.0.41 to 2.0.51\",\"author\":\"dependabot\",\"number\":8509,\"body\":\"$30\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:37:16Z\",\"mergedAt\":\"2026-06-17T23:56:35Z\",\"additions\":4,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7nqSZ4\",\"title\":\"chore(deps): bump ai from 6.0.174 to 6.0.207\",\"author\":\"dependabot\",\"number\":8506,\"body\":\"$31\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:35:21Z\",\"mergedAt\":\"2026-06-17T23:56:43Z\",\"additions\":4,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs7nniPJ\",\"title\":\"fix(deps): break workspace package dependency cycles (phantom deps)\",\"author\":\"lalalune\",\"number\":8492,\"body\":\"$32\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T18:34:25Z\",\"mergedAt\":\"2026-06-17T18:50:33Z\",\"additions\":4,\"deletions\":21},{\"id\":\"PR_kwDOMT5cIs7nqTrq\",\"title\":\"chore(deps): bump @clack/prompts from 0.11.0 to 1.5.1\",\"author\":\"dependabot\",\"number\":8507,\"body\":\"$33\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:36:22Z\",\"mergedAt\":\"2026-06-17T23:56:40Z\",\"additions\":3,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7nn6P4\",\"title\":\"chore(deps): bump commander from 14.0.3 to 15.0.0\",\"author\":\"dependabot\",\"number\":8495,\"body\":\"$34\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T18:51:35Z\",\"mergedAt\":\"2026-06-17T19:57:12Z\",\"additions\":3,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7nes5z\",\"title\":\"chore(deps): bump undici from 6.24.1 to 8.5.0\",\"author\":\"dependabot\",\"number\":8480,\"body\":\"$35\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:52:44Z\",\"mergedAt\":\"2026-06-17T17:37:38Z\",\"additions\":3,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7nehNt\",\"title\":\"chore(deps): update transformers requirement from ~=5.10.1 to ~=5.12.1 in /packages/benchmarks/OSWorld\",\"author\":\"dependabot\",\"number\":8473,\"body\":\"$36\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:45:42Z\",\"mergedAt\":\"2026-06-17T17:38:04Z\",\"additions\":3,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7neg6i\",\"title\":\"chore(deps): update matplotlib requirement from ~=3.10.8 to ~=3.11.0 in /packages/benchmarks/OSWorld\",\"author\":\"dependabot\",\"number\":8472,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:45:32Z\",\"mergedAt\":\"2026-06-17T17:38:07Z\",\"additions\":3,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs7nqFXf\",\"title\":\"chore(deps): update tqdm requirement from ~=4.68.2 to ~=4.68.3 in /packages/benchmarks/OSWorld\",\"author\":\"dependabot\",\"number\":8505,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:25:53Z\",\"mergedAt\":\"2026-06-17T23:56:46Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7npvhM\",\"title\":\"ci(cloud-cf-deploy): route prod deploy to self-hosted (unblock queued prod deploy)\",\"author\":\"0xSolace\",\"number\":8503,\"body\":\"odi's #8501 self-hosted routing landed on develop but not main. The prod deploy (push→main) still targets ubuntu-latest hosted runners = no budget = queued forever. This applies odi's exact conditional pattern to cloud-cf-deploy.yml's 2 deploy jobs so trusted events run on the hetzner-robot fleet while fork PRs keep hosted isolation. Unblocks #8502's prod classic-dashboard deploy.\\n\\nCo-authored-by: wakesync \u003cshadow@shad0w.xyz\u003e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:09:32Z\",\"mergedAt\":\"2026-06-17T20:09:52Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7nn8R5\",\"title\":\"chore(deps): bump @ai-sdk/gateway from 3.0.109 to 3.0.133\",\"author\":\"dependabot\",\"number\":8499,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T18:52:55Z\",\"mergedAt\":\"2026-06-17T19:56:57Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7nniuQ\",\"title\":\"fix: normalize native agent binary responses\",\"author\":\"odilitime\",\"number\":8494,\"body\":\"## Why\\n\\n`Cloud CF Deploy` typechecks `packages/cloud-frontend`, which pulls in the shared UI API transport. After the Android native-agent bridge started returning decoded binary response bodies as `Uint8Array`, the frontend typecheck rejected that value as a `Response` body under the current DOM typings.\\n\\nBinary responses still need to stay lossless for native local-agent paths, especially audio payloads, so the fix preserves bytes instead of falling back to text.\\n\\n## What changed\\n\\n- Decode native `bodyBase64` into bytes as before.\\n- Pass the underlying `ArrayBuffer` to `new Response(...)` instead of the `Uint8Array` view.\\n\\n## Verification\\n\\n- `bun run --cwd packages/ui test -- src/api/android-native-agent-transport.test.ts`\\n- `bunx @biomejs/biome check packages/ui/src/api/android-native-agent-transport.ts`\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T18:34:48Z\",\"mergedAt\":\"2026-06-17T18:50:29Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7nnbJM\",\"title\":\"chore(deps): update pytz requirement from ~=2026.1.post1 to ~=2026.2.0 in /packages/benchmarks/OSWorld\",\"author\":\"dependabot\",\"number\":8490,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T18:29:12Z\",\"mergedAt\":\"2026-06-17T18:50:40Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7neuPP\",\"title\":\"chore(deps): bump react-resizable-panels from 2.1.7 to 4.11.2\",\"author\":\"dependabot\",\"number\":8482,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:53:25Z\",\"mergedAt\":\"2026-06-17T17:37:48Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7nesl5\",\"title\":\"chore(deps): bump tailwindcss from 4.3.0 to 4.3.1\",\"author\":\"dependabot\",\"number\":8479,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:52:34Z\",\"mergedAt\":\"2026-06-17T17:37:42Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7neh-F\",\"title\":\"chore(deps): bump ruby/setup-ruby from 1.312.0 to 1.313.0\",\"author\":\"dependabot\",\"number\":8474,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T12:46:10Z\",\"mergedAt\":\"2026-06-17T17:37:51Z\",\"additions\":2,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs7nqVKP\",\"title\":\"chore(deps): bump @sapphire/snowflake from 3.5.3 to 3.5.5\",\"author\":\"dependabot\",\"number\":8510,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:37:31Z\",\"mergedAt\":\"2026-06-17T23:56:32Z\",\"additions\":1,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs7nqT_i\",\"title\":\"chore(deps): bump import-in-the-middle from 2.0.6 to 3.1.0\",\"author\":\"dependabot\",\"number\":8508,\"body\":\"$3f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-06-17T20:36:36Z
