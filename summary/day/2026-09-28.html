 `GET /api/v1/eliza/personal`\n- REST `conversations` list/create and `conversations/:id/messages` GET/POST\n- `conversations/:id/messages/stream`\n- `agents/:id/stream`\n- `agents/:id/bridge` (`message.send`)\n\nHow each state is handled:\n- **Access withdrawn:** the canonical conversation id is served from the interval's scoped journal, with the typed account-state provider. That provider now also reaches streaming, because `coordinateSharedStream` forwards `trustedAccountState`. Any other room returns 404, so the canonical, Dedicated and pre-upgrade history is never read.\n- **Dedicated owns the conversation:** Shared surfaces return a typed 409 `personal_eliza_dedicated` with `activeAgentId`. Before, only the sealed canonical room refused; other room ids got through.\n- **Recovery:** the journal is reconciled into the same Dedicated agent id before `/personal` or a surface hands that id back. If the coordinator is missing, the response is a retryable 503 `dedicated_reconciling`.\n\n**2. Signed, expiring recovery links.** The pay action (`recoveryAction.link`) now carries an ES256 JWS. It is signed with the existing Cloud JWKS key (`lib/auth/jwks`), bound to org, user, interval id, generation and action kind, and expires after 72h. The public route `GET /api/v1/eliza/personal/recovery/:token` verifies the token and checks that the interval still exists. It then redirects to `/cloud/billing?organizationId=…\u0026action=…`. The link carries no payment details and grants nothing: the billing page still requires sign-in. An expired link returns 410 and a bad token returns 400. The DO boundary parser admits only a well-formed resolver URL (no query, hash or credentials).\n\nIf the signing key is not configured, the link is left out and the gap is logged at error level. The `/cloud/billing` path still works.\n\n**3. Group and shared-gateway traffic.** `resolvePersonalDedicatedTrafficAccess` refuses a withdrawn personal Dedicated with the typed state in four places:\n- the connector gateway (`agent-gateway-router`, new reason `dedicated_access_withdrawn`)\n- the Dedicated bridge dispatch in `agents/:id/bridge`\n- the container control-plane `bridge`/`stream`\n- group turns in `personal-shared/messages`\n\nGroup turns get a neutral `group_dedicated_access_paused` reply that does not disclose the owner's billing state. Once the owner's access is back, a group turn also triggers the recovery reconcile. Agents that are not cut-over personal Dedicated agents are unaffected.\n\n### Verification\n- `bun test src/lib/services/__tests__/billing-suspension-resume.pglite.test.ts` (cloud-shared): 9 pass. The new scenario covers the full sequence entitled → lapsed → restarting → reconciled handback to the same id. It checks room mapping, the 404 for foreign rooms, gateway/group refusal, and link sign, resolve, tamper and expiry.\n- `bun test __tests__/shared-runtime-cutover-reminder.miniflare.test.ts` (cloud-api): 2 pass. The DO admits the signed link on bridge and stream turns and rejects links with payment data.\n- `bun test __tests__/phone-webhook-idempotency.pglite.test.ts` (cloud-api): 4 pass.\n- `tsc --noEmit` passes clean for cloud-shared, cloud-api and container-control-plane. `check:router-contract` and `check:worker-bundle` (wrangler dry run) pass.\n- Biome check is clean on all changed files.\n\n### Still open on #25146\n- A signed Stripe sandbox run against a live Dedicated agent on staging.\n- Owner confirmation of the 30-day retention.\n- App UI: the app needs to switch to `activeAgentId` on the 409, and to render `identity.accountState` and the pay-action link. That needs a UI change with the app visual audit.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"25:T2326,"])</script><script>self.__next_f.push([1,"This PR covers two areas: Cloud front-door sign-out and session coherence (#29918), and the iOS native Cloud credential lifecycle (#16420). Both issues remain partial because their remaining work needs a staging run or a physical device.\n\n## #29918: coherent sign-in, sign-out and recovery (partial)\nRefs #29918\n\n#32834 already re-landed the OAuth launch-origin fix and the bootstrap recovery-screen accessibility. This PR re-lands the remaining front-door pieces of the closed draft #30920 (credit: standujar), sized to what current develop can carry.\n\n**`/join` sign-out now reaches a signed-out state.** The recorded failure was a sign-out that bounced back through `/login` into `/join` and restarted Dedicated setup. Two client paths could restore the session that had just ended:\n- **Refresh race:** `StewardProviderRuntime`'s refresh-ahead loop wrote a rotated token unconditionally. A refresh that was in flight during sign-out therefore republished the session after it had been cleared. It now uses `replaceStoredStewardTokenIfCurrent`, a compare-and-swap against the token the refresh started from. A regression test fails without this change.\n- **Surviving refresh cookie:** the login page silently restored a refresh cookie that survived sign-out. It no longer does this while the origin's explicit sign-out marker is set. The next explicit sign-in still clears the marker: through the login section, the SSO exchange, or, new here, a completed magic link.\n- `JoinPage` now guards sign-out with a ref, so one activation sends exactly one hosted logout.\n\n**Session revalidation after confirmation.** A join attempt is now bound to the account that started it. If the user signs out, switches account, or another tab signs in during the Dedicated quote or adoption review, the attempt is aborted before the billable POST and the user gets a retryable error. A token rotation for the same subject does not abort the attempt.\n\n**Email completion.** Ordinary callback and cross-tab email completion use neutral Continue copy; only the app-authorization destination advertises app authorization.\n\n**Bootstrap recovery screen.** The session is now persisted before it is published. A storage failure shows a recoverable error; before, it left the screen stuck on \"submitting\" with an unhandled rejection.\n\n**#27241 (consolidated leaf):** phone and email/passkey validation messages now:\n- appear next to the field that failed;\n- set `aria-invalid` and `aria-describedby` on that field;\n- keep `role=alert`;\n- move focus to the invalid input.\n\n### Consolidated leaves, checked against the code\n| Leaf | State |\n|---|---|\n| #19171 | Fixed in code. `describeBackendFailure`/`BACKEND_NOT_FOUND` exists in `startup-phase-poll.ts`, and the staging API mounts were already fixed. Remaining: a credentialed staging run from a fresh magic link through `/auth/bridge` to `/join` and a reload. |\n| #19214 | **Not fixed.** The app host still hands off a full page to the auth host (`redirectToSsoBridge` → `staging.eliza.app/login`). Moving passwordless login onto the app origin is an architecture change that needs a product decision. |\n| #25042 | The structure is fixed on develop. `CloudSettingsPanel` is gone, so there is one `SettingsView` with experience filtering, and native desktop sections are gated by runtime capability. Remaining: first-paint and reload convergence evidence at the same viewport on Chromium and WebKit. |\n| #27241 | Fixed here. The empty-field \"no OTP request\" check is covered by the existing tests. |\n\n**Remaining:** the live per-method matrix on desktop and mobile (email, SMS, passkey, Google, Discord, GitHub, X, Telegram, EVM, Solana; fresh, returning, cancel and reload), pinned to a SHA. This includes a fresh authorized sign-out retest on staging. Both need a staging run.\n\n## #16420: iOS native Cloud authentication (partial)\nRefs #16420\n\nThis builds on the existing `ElizaCloudAuthSessionPlugin`, which uses ASWebAuthenticationSession with S256 PKCE and the claimed HTTPS callback `https://eliza.app/auth/callback`, and on the shared mobile PKCE client, which calls `app-auth/mobile/{config,token,ack}`.\n\n- **Inactive until ACK:** the exchanged secret is staged in its own Keychain slot. The new secure-store key `session.cloud_mobile_pending` is added to the Swift, Kotlin and TS allowlists. The secret is promoted into the Keychain-backed Steward token store only after the server ACK. If the ACK response fails or is lost, the staged secret is retained for exact-key revocation: the server may already have committed the ACK. The prior active session remains untouched.\n- **Exact recovery:** the ACK is recorded on the staged record before promotion. At launch, and before a new sign-in:\n  - an acknowledged staged credential is promoted exactly once, without opening a second browser;\n  - an unacknowledged one is revoked with its exact key before its local record is removed; a failed revoke preserves the record for retry.\n- **Revocation:** sign-out and disconnect revoke any staged credential before the active credential or SSO session. Each exact-key `DELETE /api/v1/api-keys/current` must succeed before its local copy is removed. This prevents a staged credential left by failed activation from restoring a session after sign-out. Failed revocation preserves the corresponding credential for retry.\n- **#30853 (consolidated):**\n  - Native device-code sign-in now opens the owned Capacitor Browser instead of a renderer popup.\n  - If persisting a claimed one-time CLI token fails, the client retries from memory instead of polling the consumed session again. A regression test fails without this change.\n- **#28888 (consolidated):** the code-side items are already on develop:\n  - idempotent callback ACK;\n  - typed terminal failures that survive a cleanup failure;\n  - removal of the stripped Android-only shell.\n\n  Its remaining acceptance is device evidence (see below).\n\n**Remaining (needs a device, signing and a deploy):**\n- Clean-install runs on an iOS device and an Android device, including sign-in, cancel, cold relaunch, revocation, and the recovery paths.\n- AASA/`webcredentials` verification for the signed team and bundle.\n- Enabling the mobile config routes in staging and production.\n- Cloud-only defaults for store builds.\n- A product decision on iOS 16.0–17.4, which keeps the device-code fallback.\n\n## Verification\n\nCurrent candidate: `159d342a9f6b46029ec20063e06c57a448866d37`, incorporating develop `5a130919a6283cd4abd4164ef3817c123a62570d` while preserving the author's existing commits.\n\n- Normal `bun install` completed, including native inference and embedding verification.\n- Root `bun run verify` passed with exit 0, including all 287 workspace tasks and subsequent repository audits.\n- 310 tests across nine affected and regression suites passed with the package's default timeouts and one worker. These include the real PKCE client and sign-out hook with controlled native/network collaborators, callback routing, email completion, and all suites that failed in the earlier full run. The deferred-route test now waits for observable React state rather than only the start of its API request; no assertion or timeout was removed.\n- A fresh complete UI suite is running. The previous revision's complete run passed 5,395 tests and failed six: five timeouts subsequently passed isolated checks; the remaining async assertion race is corrected in this candidate. This is not a full-suite passing claim.\n- Independent review of the staged-revocation repair, continuation copy, and final integration found no actionable source issue.\n- App audit at the preceding `680d6cbbc267` revision passed all 218 capture checks; OCR verified 208 views with zero broken and four expected AOSP-camera exemptions. Desktop/mobile signed-out Cloud captures were manually inspected. The final integration changes only the merged usage fix and the test synchronization described above.\n- A full iOS simulator Xcode build and Cloud artifact audit passed at `680d6cbbc267` (49 Mach-O binaries). The matching build at the current candidate also passed with the same renderer digest (`fe36fa7373cf`) and 49 Mach-O binaries. This is an unsigned simulator build, not signed-device login or Keychain lifecycle acceptance.\n- Hosted checks and native/live acceptance remain pending. This PR remains a draft; neither parent issue is complete.\n\n\u003cdetails\u003e\u003csummary\u003eTerminal local evidence\u003c/summary\u003e\n\n```text\nCurrent candidate targeted UI run:\nTest Files  9 passed (9)\nTests       310 passed (310)\n\nCurrent candidate repository verification:\nTasks: 287 successful, 287 total\n[anti-larp] clean — no focused tests, no untracked skips.\nexit 0\n\nPreceding revision full app audit:\n218 passed\n[ocr-triage] 212 views | verified 208 | broken 0 | needs-eyeball 4\nexit 0\n\nCurrent candidate iOS simulator build:\n** BUILD SUCCEEDED **\niOS cloud artifact audit passed; Mach-O=49\nsignature=not-applicable-unsigned-simulator-or-development-build\nexit 0\n```\n\n\u003c/details\u003e\n"])</script><script>self.__next_f.push([1,"26:T218a,"])</script><script>self.__next_f.push([1,"## #22930: billing hold after an underfunding refund or chargeback (Decision A)\n\nRefs #22930\n\nThe owner approved option A. This PR builds on the existing clawback mechanics in `credits.ts` and `stripe-event.ts`, and on the `organization_payment_reversal_holds` table from migration 0479. It does not add a second hold model; migration **0492** extends that table.\n\n- **Server-owned hold.** Sometimes a refund or dispute clawback cannot take the full reversed amount from the balance, leaving an unrecovered shortfall. In that case `clawbackCredits` inserts a `reversal_shortfall` hold **in the same SQL statement** as the clawback. That means a committed shortfall always has its hold. The hold records `shortfall_usd` and `outstanding_usd` and links to the clawback transaction.\n- **Fail-closed admission.** While a hold is active, paid admission is refused with a typed `BillingHoldActiveError` (`code: billing_hold_active`). It extends `InsufficientCreditsError`, so every paid route that already maps a funding denial to HTTP 402 returns 402 for it. The hold is checked in these places:\n  - inference admission (`admitOrganizationInference`, inside the policy transaction);\n  - pre-spend reservations (`reserveCredits`, `reserveFlatUsageCredits`, `reserveAllowanceEligibleCredits`), which also block Plus/Pro allowance funding;\n  - new containers (`createWithQuotaAndOptionalProjectIntent`, under the org lock);\n  - Dedicated create, provision, resume, wake and upgrade (the existing `checkAgentCreditGate`, whose 402 body now carries `billing_hold_active` and `outstandingUsd`);\n  - automatic resume.\n- **Clearing the hold.**\n  - Repayment: a Stripe top-up settles outstanding shortfalls oldest-first before anything else, recorded as a ledger debit. A hold is released once it is covered. The pay action also applies funds already in the balance.\n  - `charge.dispute.funds_reinstated`: releases the hold for that clawback, and returns any repayment already made toward it as a separate refund row that is not tagged with the payment intent, so later refund tallies stay correct.\n  - Operator release still works (now keyed by hold id).\n- **Lost disputes.** `charge.dispute.closed` with status lost no longer places a separate hold. The shortfall hold from `funds_withdrawn` already covers what is owed. Migration 0492 moves any still-owed legacy lost-dispute shortfall into a shortfall hold before it releases the old `chargeback_lost` holds.\n- **API and UI.**\n  - `GET /api/v1/billing/hold` returns a typed `{status: \"clear\"} | {status: \"held\", outstandingUsd, holds, payAction}`.\n  - `POST /api/v1/billing/hold` (billing manager session only) applies the current balance.\n  - The Billing tab shows a hold banner with **Pay $X**, which prefills the card top-up, and **Apply current balance**.\n\n| Policy field | Decision |\n|---|---|\n| Trigger | Any refund (including partial, cumulative) or `funds_withdrawn` clawback that leaves `unrecovered_clawback_usd \u003e 0`. A fully recovered reversal never holds. |\n| Shortfall | Authoritative debt equal to the unrecovered amount. Credits that land later repay it first. |\n| Blocked while held | Inference (credit- and allowance-funded), media/search/voice pre-spend, new containers, Dedicated create/provision/resume/wake/upgrade, automatic resume. |\n| Running resources | Not force-stopped. They keep settling against existing funding and follow the existing unfunded-stop lifecycle. The credit balance is 0 while held. |\n| Still available | Sign-in, billing history, reads/exports, cancellation/deletion, top-ups. |\n| Restoration | Automatic once repayment covers the outstanding amount or Stripe reinstates the dispute. Operator release is kept for write-offs. |\n| UI | Typed hold state, owed amount and pay action on the Billing tab. |\n| Scope | Forward-only: shortfalls recorded before this deploy are not backfilled, except legacy lost-dispute shortfalls. |\n\nVerification (each file run in its own `bun test` process):\n- packages/cloud/api:\n  - `__tests__/stripe-dispute-reinstatement.pglite.test.ts`: 9 pass. Uses the real Stripe consumer and PGlite. Covers:\n    - refunds: a full refund places no hold; a partial then cumulative refund after the credits were spent places a hold, with replayed deliveries; a partial and then full repayment clears it;\n    - disputes: a lost dispute keeps the hold; a won dispute returns the repayment exactly once.\n  - `stripe-event.test.ts` 48, `stripe-event-checkout-authority.test.ts` 7, `stripe-event-waifu.test.ts` 5, `stripe-retired-miniapp.pglite.test.ts` 4, `dedicated-agent-proxy.test.ts` 75, `chat-completions-ledger-continuity.test.ts` 2, `src/inference-app.test.ts` 14, `container-warning-rate.test.ts` 2: all pass.\n- packages/cloud/shared:\n  - `billing-suspension-resume.pglite.test.ts`: 5 pass. Migrations 0479 and 0492 are replayed; the hold beats a funded balance for the gate and for automatic resume until the shortfall is repaid.\n  - `containers-project-intent.pglite.test.ts`: 6 pass. A held org cannot create a new container, but an existing project intent still replays.\n  - `credits-reconcile.test.ts` 37 (the shortfall creates exactly one hold), `subscription-funding-debit-boundaries.test.ts` 4, and the `subscription-*` / `container-billing` / `org-storage` / `agent-billing-allowance-first` / `stripe-checkout-orders` / `payment-request-settlement` PGlite suites: all pass.\n- Typecheck:\n  - `tsc --noEmit` passes for cloud shared, cloud api and packages/ui.\n  - The api router contract passes.\n  - `check:worker-bundle` could not run: the host disk is full (`ENOSPC` in wrangler mkdtemp).\n- Other checks:\n  - packages/ui `vitest run src/cloud/billing`: 242 pass.\n  - `biome check` on the changed files is clean.\n- Pre-existing failure: `account-billing-snapshot-primary.pglite.test.ts` fails with or without this PR's fixture change (a policyLimits expectation).\n- Not run: the full `bun run test` across all 176 batches. It stops at the first failing batch, and host load was above 100.\n\nNot done here:\n- The app visual audit and desktop/mobile inspection of the new banner.\n- A live Stripe refund/dispute run on staging.\n- Customer notification email and receipt copy.\n- #23022 (creator payouts on reversed source payments) needs an owner decision.\n\n## #22957: ghost container catalogue charges (already fixed on develop)\n\nRefs #22957 (tracker; its consolidated children still need owner decisions)\n\nNothing to change here. The removal from closed PR #26383 is already on `develop`:\n- #32799 (`8ba8d267b2b`) deleted `DEPLOYMENT`, `IMAGE_UPLOAD`, `COST_PER_GB_*`, `COST_PER_ADDITIONAL_INSTANCE`, `MONTHLY_BASE_COST` and `calculateDeploymentCost`. The shutdown email now shows `dailyRate × 30`.\n- #32838 (`008d6170684`) pins the surviving catalogue (`DAILY_RUNNING_COST`, `SHUTDOWN_WARNING_HOURS`) in `container-warning-rate.test.ts`.\n- The docs pages that had the deployment-fee row (`packages/docs/cloud/billing.mdx`, `packages/docs/tracks/cloud/billing.mdx`) no longer exist, and no docs mention a deployment fee.\n\n`bun test __tests__/container-warning-rate.test.ts`: 2 pass.\n\nState of the consolidated child issues on `develop`:\n\n| Child | Status | What remains |\n|---|---|---|\n| #22956 storage pricing | Code fixed by #32799 (`requireServiceMethodCost`, no fallback for storage) | The owner needs to ratify the seeded storage prices (migration 0102 still has a pricing TODO). |\n| #22958 API-key contract | Open | Owner: key price and per-plan count. Code: enforce or drop the per-key `rate_limit`. |\n| #22961 MCP creator settlement | Open (MCP creator earnings are still live) | Owner: whether it is intended that creators are credited twice (org credit plus earnings). Needs a per-call settlement receipt. |\n| #22963 credit packs / minimum top-up | Partly fixed ($1–$1000 is a single server constant) | Owner: keep, reprice or retire the packs now that Plus/Pro exist. |\n| #23019 RPM tier credit sources | Open (only affects orgs that never subscribed) | Owner: which credit types count, or tie RPM tiers only to the Plus/Pro plan. |\n| #23020 affiliate surcharge disclosure | Open | Owner: approved disclosure copy. Code: have the server return the fee breakdown. |\n| #22967 frozen/sleeping retention | Open | Owner: retention states, price and windows. |\n| #22968 crypto/x402 refunds | Open (crypto and x402 are live) | Owner: refund, overpayment and finality policy per network. |\n| #20956 generated media vs storage quota | Open | Owner: choose option 1, 2 or 3 and set the size ceilings. |\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\n"])</script><script>self.__next_f.push([1,"27:T11fd,"])</script><script>self.__next_f.push([1,"## Refs #25146: app UI for the Dedicated-to-Shared fallback\n\n**Stacks on #32872** (`shaw/feat-fallback-direct-routes`). This branch is based on that one, so its diff includes #32872's server changes until #32872 merges. The UI change in this PR is the last commit and touches only `packages/ui`.\n\nThe server side (#32856, merged, and #32872) returns three typed signals to the app. This PR handles each one in chat.\n\n**1. 409 `personal_eliza_dedicated`: switch to `activeAgentId` without losing the draft.**\n`describePersonalRouteRefusal` (`api/personal-fallback.ts`) classifies the refusal. It walks the `cause` chain the same way the credit-gate classifier does. On a send or first-conversation create that gets this refusal, `useChatSend` does three things:\n- It drops the refused turn's optimistic rows.\n- It puts the text and attachments back in the composer, merged with anything typed since.\n- It calls the route owner (`state/personal-fallback-route.ts`).\n\nThe route owner re-reads `/api/v1/eliza/personal`, which is the authority and also gives the trusted Dedicated `apiBase`. It then repoints the live chat in place through the existing `silentlyRepointToDedicated`. The logical `personal:` identity stays the same, drafts are not cleared, and `SWITCH_AGENT` is not dispatched. The lookup is single-flight and only repoints the identity that is still bound to the chat.\n\n**2. `identity.accountState`: an honest banner in chat.**\n`getPersonalSharedEliza` now parses `identity.accountState` and validates it at the boundary. If the field is present but malformed, the call throws; it is never treated as \"no fallback\". A new `PersonalAccountStateBanner` sits above the composer and uses the canonical `Banner` atom. It shows:\n- the confirmed reason\n- that Dedicated memory is unavailable until billing is restored\n- the retention deadline, when one is set\n\nThe pay action (\"Add credits\" or \"Restore subscription\") opens the signed recovery link only when the link is unexpired and points at the same Cloud or a trusted control-plane host. Otherwise it opens `/cloud/billing`. `recovery_pending` shows an info state with no pay action. The banner re-resolves on mount and on every base change. When the server reports Dedicated again, it hands the chat back.\n\n**3. 503 `dedicated_reconciling` (and `dedicated_fallback_pending`): a retryable state.**\nThe draft goes back to the composer. The banner shows a retryable state with a \"Try again\" button, and retries once on its own after `Retry-After`.\n\ni18n: 14 new keys in `en.json`, with translations in all 7 other locales.\n\nA story (`Chat/PersonalFallbackBanner`) covers the four banner states.\n\n### Verification\n- `vitest run src/components/chat/PersonalAccountStateBanner.test.tsx`: 5 passed. This is the real banner, route owner and parser, with only the client transport and URL opener mocked. It covers reason, deadline, signed link vs expired-link fallback, no banner without a fallback, 503 → retry → handback to Dedicated, and malformed state rejected.\n- `vitest run src/state/useChatSend.test.tsx`: 128 passed, 3 of them new. They cover the 409 repoint with the draft merged back and the active server persisted as Dedicated under the same identity, the 503 draft kept with the retrying state, and a code-less 409 that is ignored.\n- `vitest run src/cloud/instances/components/agent-actions.dedicated-quote.test.tsx` (consumer of `silent-repoint`, whose imports now bypass the `state` barrel to avoid a cycle): 12 passed with `--testTimeout=30000`. At the default 5s timeout, 1–2 cases time out on this heavily loaded machine.\n- `tsc --noEmit -p packages/ui/tsconfig.json`: clean.\n- `biome check src scripts` (packages/ui): no errors. The warnings are pre-existing; the changed files are clean.\n- `node packages/app/scripts/check-i18n.ts`: OK.\n- App visual audit (`bun run --cwd packages/app audit:app:capture`): **not completed**. The Playwright web server's renderer build hit `process-timed-out` / `startup-failed` on this heavily loaded machine, before any capture ran. It needs to be rerun on a quiet machine or in CI. The audit's fixtures do not put an account in fallback in any case, so the banner states are covered by the story above and the jsdom render test.\n\n### Still open on #25146\n- Live desktop/mobile inspection of the banner against a real staging account in fallback. This needs the staging Stripe sandbox run noted in #32872.\n- A signed Stripe sandbox run against a live Dedicated agent on staging.\n- Owner confirmation of the 30-day retention.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"28:T124b,"])</script><script>self.__next_f.push([1,"## Todos: match-and-confirm by visible content\n\nFixes #29690\nRefs #29921\n\nTodo lists and `CURRENT_TODOS` show only content, so update, complete, cancel, and delete had no way to target a todo across turns. This follows the owner's match-and-confirm decision and the review constraints in #29690.\n\n- **Resolution happens in the store.** `target` (visible content or a close paraphrase) and `ref` are resolved inside `applyMutation`, under the scope advisory lock and within the entity/agent scope. The outcome is recorded in the mutation ledger. A retry with the same idempotency key replays the original outcome, even after the rename or delete removed the visible locator. Tests cover both the rename and the delete retry.\n- **Ambiguity.** When several todos match, the reply is a clarification and nothing is mutated. Each candidate carries its state, creation date, and a stable `ref` derived from the row id, so no storage id is exposed and no positional index is used. A ref still selects the same row after other rows are added or renamed. Open todos are preferred over finished ones with the same content.\n- **update** keeps `target` (which todo to change) separate from `content` (the new text).\n- **clear** records a durable preview of exactly the rows it would remove.\n  - The next call removes those rows, and only those, if the user's actual message is affirmative. Todos added after the preview survive.\n  - Any other reply cancels, and a preview expires after 5 minutes.\n  - The affirmative check reuses core's confirmation detector, now exported as `isAffirmativeConfirmationReply`. Model-supplied flags are never consulted.\n  - The preview lives in the ledger rather than the runtime cache, which is per-turn in-memory on Shared edge hosts. Cross-room scope from #28006 is unchanged.\n- **create** deduplicates in the store mutation under the scope lock, which also covers concurrent creates. When an open todo with the same content and parent exists, it returns that todo and asks. Only an affirmative reply to that question creates the second copy.\n- **Compatibility.** Serialization, cutover remapping, and the scope assertions cover the new outcomes. Legacy mutation records and request digests are unchanged.\n\nVerification, run one file at a time:\n- `plugins/plugin-todos`: `vitest run test/todo-visible-content.real-db.test.ts` (new, 12 passed); `test/todos.real-db.test.ts` (26 passed); `test/todo-scope-convergence.real-db.test.ts` (4 passed); `src/actions/todo.test.ts` (74 passed); the two export tests passed; `bun run typecheck` passed; `biome check` is clean.\n- `packages/testing`: `SCENARIO_USE_DETERMINISTIC_MODEL=1 … cli.ts run scenario-runner/test/scenarios --scenario deterministic-todos-actions` passed. The clear turn now previews, then confirms on \"yes\".\n- `packages/cloud/shared`: `bun test src/lib/services/shared-runtime/shared-todos.test.ts` passed.\n\n## Cloud sign-in stays on the originating host\n\nFixes #19214\nRefs #29918\n\nA signed-out visit to `cloud(-staging).eliza.app` (via `/join` or the app-mode entry) rode the SSO bridge to `(staging.)eliza.app/auth/bridge`. With no session there, the mint leg sent the user to that host's own `/login`, so sign-in finished on another host.\n\nThe bridge now only shares an existing session. When the mint host has none, it returns immediately to the paired app origin's `/login` with the sanitized `returnTo`, and sign-in completes on the host the user started on.\n\nUnchanged: the fixed pair allowlist, the referrer gate, `sanitizeBridgeReturnTo`, the PKCE state and verifier binding, and the same-origin Steward OAuth redirect URI. The mint-intent memory existed only to resume after the other-host login, so it is removed.\n\nA single automatic hop to the mint host remains for signed-out visitors. Steward cookies are host-only, so the app origin cannot tell in advance whether the mint host holds a session to share. No credential is entered on the mint host.\n\nVerification (`packages/ui`, one file at a time):\n- `SsoBridgeRoute.test.tsx` passed (26). The new case covers production and staging, asserting a return to the app host's `/login?returnTo=/chat` with no fetch and no retained state. The open-redirect case collapses to the app host's `/login?returnTo=/`.\n- `AppModeEntryRoute.sso.test.tsx` (5), `JoinPage.sso-handoff.test.tsx` (5), and `login-page.same-origin.test.tsx` (4) passed.\n- `bun run typecheck` passed; `biome check` is clean on the changed files.\n\nNot run: the repo-wide `bun run verify`, and the live staging check from #19214 (start and finish on cloud-staging with one tab), which needs a deployed build.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"29:T6e9,"])</script><script>self.__next_f.push([1,"Retention could mark an email sent before its provider accepted it, delete without the full warning period, or enqueue a stale sleep after an agent resumed. This follow-up to #32907 records successful notices under a database lock, preserves seven-day and one-day notice windows, checks lifecycle authority when queuing sleep, and rejects missing backups.\n\nAuto top-up now requires a charge preview matching the saved credit amount and explains credits versus total charge. Affiliate payouts reject fractional cents and conflicting amounts on an idempotent replay.\n\nValidation: 8 retention PGlite tests, 5 retirement/payout PGlite tests, 27 billing/MCP UI tests; repository `bun run verify`; 218 app visual audit cases and separate desktop/mobile billing inspection. The final repository verification rerun also passed after the last copy edit. Live email, Stripe, and provisioner acceptance are not established by these local checks.\n\n\n### Review follow-up\n\nA failed replacement quote leaves the auto-top-up toggle usable, so an owner can turn recurring charges off and save. Saving an enabled setting still requires a current quote. The regression failed before the fix and passes afterward.\n\nValidated reconciled head `bd733b704096d16fdccb442adf60dd10a092118d`: 27 component tests and full `bun run verify` (284 workspace tasks plus repository audits) passed. The integrated change also passed 13 PGlite retention/payout tests, 218 app visual audit cases, and four targeted desktop/mobile billing browser cases. Inspected desktop and mobile disabled-state screenshots. Browser tests use the actual renderer with a local API fixture; these results do not establish live email, Stripe, or provisioner acceptance. Hosted checks for this pushed revision remain pending.\n"])</script><script>self.__next_f.push([1,"2a:T101c,"])</script><script>self.__next_f.push([1,"Refs #31017. Planner and evaluator requests currently carry instructions and schema choices that their available tools and context cannot use. This change omits those inapplicable instructions while preserving complete conversation, provider, tool-result, and model content.\n\nThe planner scopes shell policy to the shell surface and coding delegation to `TASKS`/`TASKS_SPAWN_AGENT`. It retains the prohibition on delegating a single lookup, names only exposed `WEB_FETCH`/`WEB_SEARCH` alternatives, and applies the same mandatory rules to saved optimized prompts. Explicitly empty tool lists omit tool-specific rules; unspecified lists retain them.\n\nOther changes in this PR:\n\n- Advertise evaluator restoration routes ructured host display. Validate the canonical instant, timezone, source, record binding and snapshot revision; later writes, stale/conflicting reads, failed actions and pending work do not gain an exemption. Scan every remaining assertion unchanged and retain the original reply bytes for effect-receipt matching. Mixed delivered navigation plus reads is covered, including evaluator applied status. The final visible boundary rechecks authorized current results before rewriting, without adding a model call or warning for an already grounded observation.\n\nNo generic “Saved” removal, blanket read-only/evaluator-none bypass, forged write receipt, Notes import, output-schema change, model setting, source projection or record mutation. Real write claims before/after metadata still require their existing proof. This patch is independent of the separate Notes canonical-content descriptor PR #32882.\n\nValidation: the actual original case7 reply/result rejected before and passes both planned and visible egress after, with byte-identical reply/results and zero model calls or warnings. 123 tests across six guard/recovery/navigation suites passed on this independent branch; assistant typecheck, lint and diff checks passed. Independent review passed. Full repository verification and app build passed in the integrated checkout containing source commit `078aec0b2d8`, not as an independent-branch full-suite claim.\n\nA later integrated live smoke at `078aec0b2d8` returned the correct saved timestamp using only NOTES_LIST and three H/P/E calls: 34,622 input tokens, 12,288 cached input as a subset, 966 output, 3,856 ms whole turn. Separate background: 7,498 input, zero cached, 119 output, 1,024 ms. All eleven notes and Calendar were unchanged.\n\nImportant limitation: that live reply quoted its body, changing the punctuation immediately before Saved. The unchanged old detector returns false for the new reply and true for the original failure. Therefore the live smoke does **not** establish that this patch prevented recovery or improved speed. The unchanged-original offline regression is the discriminating proof. Earlier failures remain preserved; no universal timestamp/prose reliability or all-campaign pass is claimed.\n\nMerged `origin/develop` (1f8f5278c16) into the branch at `8b5fbcf34d5`; clean merge, PR source unchanged. The first dispatched CI run at `d775079a404` (36383123693) failed Tests (server, agent), Tests (client), Tests (server, remaining) and Zero-Key scenario runner; all four were stale-base failures (identical failures on sibling PR run 36383116488 at the same base; fixed on develop by 17c8e2a15c8, 369c5fa63ea, d6ec28ed79a, 729ce4151ba/70435a52d01). After the merge, local on Node 24.15.0: plugin-assistant `src/services/message/` 771/771 passed, typecheck and Biome clean. Hosted CI at `8b5fbcf34d5`: run 36386064853 — all test jobs passed; Quality hit a runner shutdown (exit 143), passed on rerun; run concluded success.\n\nLive evidence is integrated-source evidence, not a new run at this head. Raw note content, timestamps, history, identifiers, reasoning and private explorer files remain local. No deployment or protected merge.\n\n\u003c!-- evidence-head:d775079a404038482a67a15fde0b037381e33041 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] N/A - Backend reply guard; no renderer changes.\n\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] N/A - Reply bytes preserved; no renderer changes.\n\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [ ] N/A - Deterministic backend assertion validation; evidence and limits below.\n\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [32884-read-timestamp-runtime-summary.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32884-read-timestamp-runtime-summary.json)\n\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [ ] N/A - No frontend source changes or independent-head UI acceptance claim.\n\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] [32884-read-timestamp-model-contracts.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32884-read-timestamp-model-contracts.json)\n\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [32884-read-timestamp-preservation.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32884-read-timestamp-preservation.json)\n\n"])</script><script>self.__next_f.push([1,"2c:T183b,"])</script><script>self.__next_f.push([1,"Refs #30744, #30825\n\nI found three defects while verifying the merged desktop fixes on a packaged macOS build (unsigned Electrobun build from origin/develop `279e585dd84`, port 31337 held by a dummy listener). One commit each.\n\n## 1. Local backups fail on every desktop and standalone agent (`fix(agent)`)\n\n`POST /api/backups` returns HTTP 500 even for a tiny PGlite agent:\n- The local backup path calls `createKmsClient()` with no options.\n- Outside tests, that resolves to the Steward backend. A local agent never configures Steward.\n- The snapshot manifest is built, then encryption throws:\n\n```\nInfo  [agent-backup] Snapshot manifest created (database=pglite-dump, mediaFiles=0, vaultFiles=0, stateFiles=32)\nError [agent-backup] Local backup failed (err=ELIZA_KMS_BACKEND=steward requires steward.{baseUrl, tokenProvider})\n```\n\nThe suites missed it because `NODE_ENV=test` selects the in-memory KMS. The v1 envelope and the streamed v2 key wrap are both affected.\n\n**Fix:** local backups now seal with the local KMS adapter, rooted in the same OS keychain master key as the agent vault (or `ELIZA_VAULT_PASSPHRASE`).\n- An explicit `ELIZA_KMS_BACKEND`, `ELIZA_LOCAL_MODE`, `ELIZA_LOCAL_ROOT_KEY`, or a test environment keeps the current resolution.\n- An unavailable master key is surfaced and not cached.\n- Limits and backup contents are unchanged.\n\n## 2. Tray, menu, shortcut and deep-link callbacks crash the packaged app (`fix(desktop)`)\n\nBun 1.4.2 (the bundled runtime) passes `FFIType.cstring` JSCallback arguments as JS strings. Electrobun 1.18.1 converts each one with `new CString(arg)`, which throws `TypeError: ptr must be a number`. I reproduced this with a standalone Bun FFI callback.\n\nOn the packaged app:\n- Every `webviewEvent` / `eventBridgeHandler` conversion logs this error and the event is dropped.\n- The tray, application-menu, context-menu, global-shortcut, URL-open (deep link) and MIME callbacks have no try/catch. The first tray action or Cmd+Q ended in `Uncaught exception in worker` and killed the main process.\n- The embedded agent was left orphaned (ppid 1) on port 31339.\n\n**Fix:** the desktop build now rewrites these callback conversions in the shared Electrobun source and in every downloaded platform core (`dist-*`). The rewrite sits next to the existing RPC socket hardening, and the packaging step repackages when the downloaded core changes. The helper accepts strings, null, or raw pointers. If the upstream code shape changes, the build fails.\n\nAfter the fix, the same tray and menu Quit actions run the normal shutdown: `App quitting (explicit-quit)`, agent stopped, no crash.\n\n## 3. A returning packaged profile never leaves `starting-runtime` (`fix(desktop)`)\n\nThe packaged desktop embeds the app server host (`packages/app/src/runtime/startup-state.ts`). Its `/api/health` reports `startup.phase` as `runtime-ready`, `features-starting`, `ready` or `degraded`, all projected as agent state `running`. Only the legacy agent host reports `running`.\n\nTwo checks required the phase to be exactly `running`:\n- The shell's launch orchestrator (`classifyPhase`).\n- The renderer's `isRuntimeReadyFromBootProgress` and `isRuntimeReadyFromLaunchProgress`.\n\nSo with a configured profile:\n- The launch snapshot stayed at `agent-api-ready` (`boot.runtimePhase: \"ready\"`).\n- The renderer stayed in `starting-runtime` with an empty pill window, even though `/api/status` said `running`.\n\nFresh profiles were unaffected because first-run gating runs first. Dev and web builds were unaffected because they don't use the desktop RPC.\n\n**Fix:** both checks accept every phase the hosts project as running.\n\n## Verification\n\nPackaged app, unsigned, 31337 occupied by a dummy listener. The embedded API moved to 31339 in every run.\n\n| Scenario | Result |\n|---|---|\n| Fresh state dir | Backend `first-run/status complete:false`, `status not_started (awaiting-onboarding)`. Renderer: `restoring-session → resolving-target → polling-backend → first-run-required`, showing \"Let's get you signed in / Sign in to Eliza Cloud\" with a gated composer. Never ready. |\n| Returning profile, before fix 3 | `/api/status running`, but the renderer stayed in `starting-runtime` with an empty body for more than 4 minutes. |\n| Returning profile, after fix 3 | `starting-runtime → hydrating → ready`. `meta.firstRunComplete` preserved and `first-run/status complete:true`. |\n| Backup round trip, packaged app after fix 1 | Created conversation `PACKAGED-BACKUP-MARKER`, then `POST /api/backups` (200, 82 MB), then deleted it, then `POST /api/backups/restore` (`{\"restored\":true,\"requiresRestart\":true}`). After relaunch the marker is back. |\n| Backup round trip, standalone agent, before and after fix 1 | Before: 500 and no file written. After: 200, and the restore brings back the deleted conversation and drops the one added after the backup. |\n\nTests and checks:\n- `packages/agent`: `vitest run src/services/agent-backup-local-kms.test.ts` passed 3/3. `tsc --noEmit` is clean.\n- `packages/app`: `node --test scripts/lib/electrobun-ffi-callback-strings.test.ts scripts/lib/electrobun-loopback-hardening.test.ts` passed 7/7. The new test patches the installed Electrobun source and runs a real Bun FFI callback.\n- `packages/app/platforms/electrobun`: `bun run test` passed (13 files, 117 tests), including the new `launch-orchestrator.test.ts` (8 tests: serving phases give `ready`, starting phases wait). `typecheck` and `lint:check` are clean he handler persists the message before it resolves. A `deliveryIdempotencyKey` derives the message id, so a replay returns the stored row instead of writing a second one.\n- **personal-assistant**: `in_app` dispatch now awaits the durable history write.\n  - Only chat history or the notification inbox count as delivery. The event bus does not.\n  - The emitted event carries the persisted `roomId`, so the autonomy router does not store a second copy.\n  - If the history write fails, the dispatch returns a typed, retryable `transport_error`.\n  - A headless host has no `owner_chat` handler and no notifier, so it gets `disconnected` and the task is never marked delivered.\n  - `owner_chat` is added to the internal-source set in `delivery-binding.ts`, which checks for missing sources at compile time.\n\n### Test\n`packages/agent/test/scheduled-routine-no-conversation-delivery.test.ts` runs on a real SQLite runtime with the scheduling plugin, the PA production dispatcher, the agent event bus and the HTTP server:\n- **Headless** (no server): firing the routine records `lastDispatchResult` `{ok:false, reason:\"disconnected\"}`, and the fire result is not `fired`. On develop this assertion fails, because the fire result is `fired`.\n- **Server running, no conversation, no client**: the routine fires. When a client connects, `GET /api/conversations` returns exactly one conversation, and its room matches `ownerChatRoomId` in the scheduler record. Its history holds the routine exactly once, under the `ownerChatMessageId` the scheduler recorded.\n- **Replay** of the same occurrence: dispatch returns the same message id, with no new row and no new conversation.\n\n### Verification (one test file at a time)\n- `packages/agent`: `bunx vitest run test/scheduled-routine-no-conversation-delivery.test.ts` passes (1 test). `test/chat-ingress-persistence.test.ts` passes (4). `src/services/client-chat-sender.recency-fallback.test.ts` passes (2). `bun run typecheck` passes.\n- `plugins/plugin-personal-assistant`: `test/scheduled-task-in-app-dispatch.test.ts` (4), `test/scheduled-task-dispatcher.test.ts` (9), `test/scheduled-task-dispatch-render.test.ts` (11), `test/lifeops-scheduled-task-simulation.test.ts` (5), `test/persona-packs.simulation.test.ts` (5), `test/scheduled-task-local-backup-dispatcher.test.ts` (1) and `src/lifeops/scheduled-task/runtime-wiring.owner-facing-copy.test.ts` (6) all pass. `bun run typecheck` passes after building core.\n- `packages/core`: `bun run typecheck` passes. `src/__tests__/message-runtime-stage1.test.ts` passes (382).\n- Biome check on the changed files: no errors. The 3 warnings are pre-existing non-null assertions in `conversation-routes.ts`.\n- I did not run the repo-wide `bun run verify`, because the machine is under load.\n\n### Test change\nOne test in `runtime-wiring.owner-facing-copy.test.ts` expected `ok:true` from the event-bus emit alone, which is the fabricated success this PR removes. It now provides an `owner_chat` handler and asserts the durable write and its idempotency key.\n\n### Overlap\n#32904 adds `scheduled-routine-offline-delivery.test.ts`, which filters history by `source === \"lifeops-scheduled-task\"`. The `owner_chat` path keeps that source on the persisted row, so it should stay compatible.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"2e:T42e,An acknowledged Blooio/Twilio message held during Shared-to-Dedicated cutover could be lost after a transient retry failure or a partial Redis write. A slow redelivery could also outlive its lease and be executed by another replica.\n\nPersist the hold payload, retry index, and dedup claim atomically; retain pre-execution failures for retry; renew the unique ownership lease for the whole redelivery; and fence rescheduling, cleanup, and unlock by that token. This follow-up to merged #32905 includes #32908's lease-renewal commits and resolves their overlap with the durability repairs.\n\nValidation: all 44 gateway tests pass, including 11 combined cutover/egress integration tests and slow-redelivery/lease-replacement coverage. Earlier validation included 21 Miniflare admission tests, three Workerd cutover tests, nine PGlite funding tests, repository verification, and 218 app visual cases. Repository `bun run verify` passed on the combined head (284 tasks and repository audits). Live provider cutover and native iOS acceptance remain separate deployment checks.\n2f:T116e,"])</script><script>self.__next_f.push([1,"Refs #31017. This is the follow-up to #32870. It fixes the remaining action-retrieval problems at their source.\n\n## (b) Incidental domain words no longer load whole families\n\nIn `convo.echo-self-test`, Stage 1 selects `ECHO_TEST` for \"Please echo this message back to me: hello world\". The `world` token matched the MESSAGE family's `world` context, so the pending-intent bootstrap loaded nine `MESSAGE_*` tools. `pendingActionContexts` in `plugins/plugin-assistant/src/services/message/action-surface.ts` now requires a stronger signal when a clause is already claimed by a selected action (its verb names that action, e.g. `echo` names `ECHO_TEST`). An incidental domain word in that clause counts only if the clause also names one of the domain's operations. Otherwise the family stays behind `DISCOVER_ACTIONS`. Unclaimed clauses keep the existing inference, including #32835's pending programming-work cases. Declared contexts and explicit discovery are unchanged.\n\n## (a) Promoted children no longer repeat the parent description\n\n`promoteSubactionsToActions` used to compose each virtual's description as `${parent.description} — subaction = x`. A virtual now states only its operation, for example `MESSAGE operation \"edit\".` plus any authored override. The promotion marker carries the umbrella description. `buildPlannerToolsFromActions` and `buildPlannerToolsFromTieredActions` state it once per tool list: on the family's first exposed operation, with later operations referencing that tool. When the umbrella tool is already on the wire they add nothing. Canonical alias contracts (`planned-tool.ts`) and sub-planner value guides reconstruct the exact prior composed text from the marker. No context is truncated or summarized; the umbrella text is stated once rather than N times.\n\n## Measurement\n\nThe method matches #32870: deterministic scenario lane with trajectories from `--run-dir`, and all model-call inputs (`messages` + `tools`) counted with `o200k_base` (`gpt-tokenizer`). Before is `origin/develop` at 8fd60d09fb2; after is this branch rebased on it.\n\n| Scenario | Call | develop | this PR |\n| --- | --- | --- | --- |\n| convo.echo-self-test | planner (tools) | 6,627 (4,622 tool tokens; ECHO_TEST + 9 MESSAGE_*) | 2,789 (856 tool tokens; ECHO_TEST only) |\n| convo.echo-self-test | whole run, 3 calls | 10,905 | 7,067 (-35%) |\n\nBefore the rebase, on the prior develop head, splitting the parent description alone saved 913 of the 4,913 planner tool tokens when the nine MESSAGE_* tools were exposed. The retrieval fix then removed the family from this turn altogether. On `convo.context-hygiene` and `convo.greeting-dynamic` the exposed tools are the same before and after; the only difference is ±6 tokens of per-run identifier noise.\n\n## Verification\n\n- Deterministic scenarios, run one at a time on this head: `convo.echo-self-test`, `convo.greeting-dynamic` and `cross.world-continuity.topology-boundaries` (MESSAGE worlds) passed.\n- `convo.context-hygiene` fails with \"evaluator advertised context restoration with nothing deferred\". It fails the same way on unmodified `origin/develop` 8fd60d09fb2 source, and it passed with this change before the rebase. This is the #32835 regression another session is fixing.\n- Before the rebase: the whole `../scenarios` pr-deterministic corpus passed 9/9. The runner `test/scenarios` lane passed 26/27. The failure was `deterministic-lifeops-brief-recalibrate`: its first turn returned a privacy-denial REPLY after 413 s on the heavily loaded machine. Its other turns ran BRIEF_* normally. I did not confirm whether it also fails on develop.\n- plugin-assistant vitest, one file at a time: contextual-discovery (117), tool-discovery (52), umbrella-alias-consolidation (7), umbrella-children-consolidation (6), canonical-tools (8), umbrella-infer-subaction (23), personality-action (44), message.manage-server (15), compress-mode (3), tool-discovery.planner (4). All passed.\n- core vitest: message-runtime-stage1 (382), historical-observation-context (20) and completion-context (70) passed before the rebase. Orchestrator create/spawn/cancel/resume/provision/tasks-issue-similes unit tests passed.\n- `bun run typecheck` and `lint:check` pass for plugin-assistant and core (after the rebase). Biome is clean on all changed files.\n\n## Remaining for #31017\n\nLive latency and tool-choice measurement with the trajectory viewer.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"30:T857,"])</script><script>self.__next_f.push([1,"## Problem\n`cloud / e2e-tests` on develop failed 3× in a row at e1de9b114d (run 36392903797). Each time the worker \"died\" 14–20 s into the suite on a different route (MCP, discord heartbeat, advertising media): a plain-text 500 `Error: Network connection lost.` from Miniflare's entry worker, or wrangler exiting with an empty `✘ [ERROR]`. No `packages/cloud` code changed between the last green run and this SHA.\n\n## Root cause\n`wrangler dev` forwards every request ProxyWorker → UserWorker over a pooled keep-alive connection; both kj endpoints close idle sockets after 5 s, so a request written at that boundary never reaches the Worker. Wrangler only retries GET/HEAD, and the test client's `Connection: close` cannot reach that hop (cloudflare/workers-sdk#14641). The race is always present (passing runs also log kj `Broken pipe`) and becomes fatal under runner load. Reproduced on stock wrangler 4.116.0 with a hello-world Worker in a Linux container: 673–1286 of 1920 timed requests failed, then the server died with the same empty `[ERROR]`.\n\n## Fix\nTest lanes (`CLOUD_E2E=1`, `NODE_ENV=test`, no custom wrangler args) launch the Worker through `wrangler-direct-dev.ts`. It keeps wrangler's config, bundler and Miniflare runtime (`unstable_DevEnv`), but serves the public port from a Node listener that never idles out clients and forwards each request to the UserWorker over a fresh connection with the same original-URL and shared-secret headers. It never replays requests and rejects any unrecognized flag. Local dev is unchanged.\n\nNo assertions were weakened, no tests were skipped, and no retries were added.\n\n## Verification\n- Linux A/B burst test: 0/1920 failures with the launcher vs 673 and 1286 on stock wrangler. JSON, 100 KB and 5 MB bodies, multiple set-cookies, SSE and WebSocket upgrades behave the same as stock.\n- `bun run test:cloud:e2e` against local Postgres, run twice: 18/18 files, 512 pass / 19 skip, identical to the baseline.\n- `bun run test:cloud:integration`: 511 pass, 0 fail. No leftover workerd processes.\n- biome clean.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"31:T1232,"])</script><script>self.__next_f.push([1,"## Change\n\nThe Chromium companion ships only with elizaOS images. Move its sources and Chromium patch tooling to `packages/os/browser`, remove its standalone workspace, and point the existing Linux/AOSP assembly and provenance checks at that owner. Standard OS build/typecheck/lint/test commands include the browser, and Turbo tracks its generated assets and environment. The wire codec is consumed through the locked `plugin-browser/native-wire` dependency. Installed Linux acceptance now requires the embedded component and installed native relay.\n\nRemove the `remote-control-host` workspace by moving its controller and encrypted OS renderer checks do not prove native image operation.\n"])</script><script>self.__next_f.push([1,"32:Td2a,"])</script><script>self.__next_f.push([1,"## Fixes #32880\n\n`projectFinalizedTranscriptCommitments` / `commitmentRecordsFromTranscript` resolved `tomorrow`, weekdays, and explicit dates on the UTC calendar and pinned deadlines at 17:00 UTC. An evening promise in a zone behind UTC was a day late, and it disagreed with the zone-aware meeting-ghost row (#31249 / #32837) written by the same finalized event.\n\n**Changes (plugin-personal-assistant)**\n- `transcript-hook.ts`: resolves the owner's effective zone at the transcript instant with `resolveOwnerTimeZone`. This is the same resolver and instant the meeting-ghost consumer uses. The zone is passed into the extractor.\n- `commitments/ledger.ts`: `extractCommitmentLedgerRecords` accepts an optional `timeZone` and uses the shared `lifeops/time` local-day helpers (`getZonedDateParts`, `addDaysToLocalDate`, `getWeekdayForLocalDate`, `buildUtcDateFromLocalParts`) for explicit dates, `tomorrow`, weekdays, and the 17:00 local wall time. Callers that pass no zone (chat, sent mail) keep UTC behavior. An impossible explicit date such as `2026-02-30` now gives no deadline instead of rolling into the next month.\n- `meeting-ghost/index.ts`: aligns the two paths so one spoken commitment never persists as two rows with conflicting deadlines. The two writers used different source keys (`transcriptId:segmentId` vs `meetingId:commitmentId`), so both rows persisted.\n  - Relative days now count from the utterance instant (meeting start + `segment.startMs`), which matches the projection's `observedAt`.\n  - The ghost analyzer no longer writes a ledger row for the owner's own first-person promise when the transcript projection writes that segment. Named commitments (\"Ava will…\") spoken by the owner, and every other speaker's commitments, still come from the ghost path. Approvals and calendar intents are unchanged.\n\n**Regression** (`test/meeting-ghost.integration.test.ts`, real PGlite runtime through `handleMeetingTranscriptFinalized`):\n- The issue's exact repro: America/Los_Angeles, Monday 2026-09-14 17:30, \"I will send the report tomorrow.\" gives `transcript-local-day:seg-1` with `dueAt` `2026-09-16T00:00:00.000Z` and `observedAt` `2026-09-15T00:30:00.000Z`. Exactly one row is persisted per spoken commitment, and the ghost-sourced row for another speaker agrees on the local day.\n- East of UTC: Asia/Tokyo, Tuesday 08:00 JST (still Monday in UTC). \"on Wednesday\" and \"tomorrow\" both give `2026-09-16T08:00:00.000Z`.\n- Both new cases fail on the pre-fix source (2 failed / 3 passed) and pass with the fix.\n\n**Verification**\n- `bunx vitest run --config packages/scripts/vitest/integration.config.ts plugins/plugin-personal-assistant/test/meeting-ghost.integration.test.ts`: 5/5 passed\n- `bunx vitest run --config vitest.config.ts` for each of these files, run one at a time:\n  - `test/meeting-ghost.local-due-dates.test.ts`: 10/10\n  - `test/meeting-ghost.test.ts`: 9/9\n  - `test/commitment-transcript-hook.test.ts`: 4/4\n  - `test/commitment-ledger.test.ts`: 8/8\n  - `test/meeting-ghost-event-handler.test.ts`: 4/4\n- `bun run typecheck` (plugin-personal-assistant): passed\n- `bun run lint:check` (plugin-personal-assistant): 0 errors. 159 warnings already exist on develop, none in the changed files.\n- Root `bun run verify` was not run because the shared machine is heavily loaded.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"33:T12fa,"])</script><script>self.__next_f.push([1,"# Relates to\n\nA child step's ownership pre-read could race with another trajectory inserting the same global step ID. The guarded upsert would then affect zero rows, but persistence still reported success and committed the parent update.\n\n# Change\n\nRequire the guarded upsert to return exactly the expected child ID before treating it as written. Remove the normal ownership pre-read; diagnose ownership only if the write is unconfirmed. Parent revision checks, parent-step validation and transactional rollback remain in place.\n\n# Testing\n\nOn `593309ccc726ba5482d43b7ff479df164b7e6b9f`:\n\n- Owning real-PGlite persistence suite: 9 tests passed under Node 24.15.0. Covers same-owner writes, parent relationships, foreign-child rollback, a real insert-suppressing trigger and stale parent revisions.\n- Agent typecheck, changed-file Biome and diff checks passed.\n- Independent source review found no blocker. Full repository verification passed on combined integration commit `f31bb10020533478471680ca0cb3d757807d545b`; both changed file contents match this draft.\n- Real PostgreSQL 17.10 at READ COMMITTED, two independent connections with synthetic data: the original interleaving returned success despite a zero-row child upsert. The fixed path rejects with an ownership conflict, restores the complete parent snapshot, and leaves the other trajectory's child unchanged.\n- Both isolated PostgreSQL clusters stopped after the checks.\n\n- [x] Targets `develop`; based on `1f8f5278c164a6d9cbc4f0034a8a5d0273d66b0e`.\n- [x] Merged current `origin/develop` (merge `d8889d2d682`, clean), ran `bun install --frozen-lockfile`; `bun run verify` was not run locally on this head — full hosted CI dispatched instead (see Verification update).\n- [x] Updated relevant documentation: N/A - persistence correctness repair with an inline cost note.\n\n# Verification update (merge head `d8889d2d682`)\n\n- Node 24.15.0: `test/trajectory-read-persistence.test.ts` 9/9 passed (includes the trigger-suppressed write expecting `TRAJECTORY_STEP_WRITE_UNCONFIRMED`); both agent trajectory test files 13/13; default agent vitest run 43 files / 170 passed, 4 skipped.\n- `packages/agent` typecheck exit 0; Biome on changed files clean.\n- Review note: the CHANGES_REQUESTED finding (absent row misreported as ownership conflict) does not hold — `assertTrajectoryStepOwnership` only throws when an existing row has a different `trajectory_id`; an absent row returns, so the unconfirmed error is raised. The passing trigger test confirms this.\n- Full hosted CI run 36395295996 on `d8889d2d682`: success.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:593309ccc726ba5482d43b7ff479df164b7e6b9f --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered UI change.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered UI change.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - database concurrency boundary.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] Real database before/after assertions are summarized below.\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - no model/prompt/agent-decision change or inference; synthetic persistence records only.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] Real PostgreSQL parent/child snapshots establish rollback and foreign-row preservation.\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\n```text\nOriginal source, synthetic PostgreSQL race:\nA ownership pre-read: 0 rows\nB commits the shared child under a different trajectory\nA guarded child upsert: 0 affected rows\nA save result: true\nA parent step_count: 1; A dedicated children: 0\nB child owner/payload/script: unchanged\n\nCandidate, same interleaving:\nA ownership pre-read: absent\nB commits the shared child under a different trajectory\nA guarded child upsert: 0 affected rows\nA save: TRAJECTORY_STEP_OWNERSHIP_CONFLICT\nA parent before/after: identical; A dedicated children: 0\nB child owner/payload/script: unchanged\nBoth clusters: stopped; postmaster.pid absent\n\nOwning real-PGlite suite: 9 passed\nAgent typecheck: exit 0\nBiome: 2 files checked, no fixes\n```\n\n## Known gaps / failures\n\nThe race is a res the lease and delivers the same held turn again.\r\n2. **Lease stolen on release:** the first drainer's unconditional `del` then deletes the second drainer's lease, so a third can join.\r\n\r\n`redeliverHeldWebhook` calls `processMessage` directly, so the ingress-side processing claim does not protect this path. The user receives the reply twice. On private Blooio/Twilio replies the gateway has no egress lease.\r\n\r\n# Change\r\n\r\n`drainCutoverHolds` (`cutover-hold.ts`):\r\n\r\n- The lease value is a per-drain `randomUUID()` token.\r\n  - Before, it was `String(now)`, and the Redis adapters JSON-parse reads, so that value came back as a number.\r\n- While the redelivery runs, the lease is renewed every third of its period. Renewal stops, with a warning, if the lease is no longer ours. A failed renewal is logged and retried on the next tick.\r\n- The lease is released only if we still own it.\r\n- `options.leaseSeconds` (default 180, unchanged) lets tests outlive a lease in real time.\r\n- **Crash recovery is unchanged:** a dead drainer's lease still lapses within one period.\r\n- Renewal and release are atomic compare-and-act operations: `GatewayRedis.expireIfEquals` / `delIfEquals`, each a single server-side Lua script on the ioredis, ioredis-mock and Upstash adapters.\r\n  - A GET-then-act check (the first revision) left a one-round-trip gap in which the lease could change hands. Thanks @ss251.\r\n  - The hand-written `MemoryRedis` fake in `personal-private-egress.test.ts` implements the two methods too.\r\n\r\n# Testing\r\n\r\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\r\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\r\n- [ ] Updated relevant documentation.\r\n\r\nThis used Ubuntu 24.04 (WSL2), Bun 1.4.2 and `bun install --frozen-lockfile` on develop `3c2fbd0a5e`.\r\n\r\n**Reproduced on develop (unmodified).**\r\n- A throwaway test (not committed) drove the real `handleWebhook` → hold =\"https://github.com/vitest-dev/vitest/commit/e4067b3b150005fd42cf75f994300119245806b9\"\u003e\u003ccode\u003ee4067b3\u003c/code\u003e\u003c/a\u003e fix(browser): disable client \u003ccode\u003ecdp\u003c/code\u003e API when \u003ccode\u003eallowWrite/allowExec: false\u003c/code\u003e [ba...\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/vitest-dev/vitest/commits/v4.1.11/packages/vitest\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `drizzle-orm` from 0.44.7 to 0.45.3\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/drizzle-team/drizzle-orm/releases\"\u003edrizzle-orm's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e0.45.3\u003c/h2\u003e\n\u003ch2\u003eNew Netlify DB Driver\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eNote: The Netlify DB driver is developed and maintained by the Netlify team.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eInstallation:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre lang=\"bash\"\u003e\u003ccode\u003enpm i @netlify/db\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eUsage example:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre lang=\"typescript\"\u003e\u003ccode\u003eimport { drizzle } from 'drizzle-orm/netlify-db';\n\u003cp\u003e// reads NETLIFY_DB_URL and NETLIFY_DB_DRIVER env vars\nconst db = drizzle();\u003c/p\u003e\n\u003cp\u003econst result = await db.execute('select 1');\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003cpre lang=\"typescript\"\u003e\u003ccode\u003eimport { drizzle } from 'drizzle-orm/netlify-db';\n\nconst db = drizzle(process.env.DATABASE_URL);\n\nconst result = await db.execute('select 1');\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre lang=\"typescript\"\u003e\u003ccode\u003eimport { drizzle } from n\u003cli\u003esettle every send on a connection error, back off pool requeues, turn a bare CR into CRLF, bound fetch, honour requireTLS (\u003ca href=\"https://github.com/nodemailer/nodemailer/commit/63ccd66c894bbaac18c82084ee385bf6488226cf\"\u003e63ccd66\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ev10.0.11\u003c/h2\u003e\n\u003ch2\u003e\u003ca href=\"https://github.com/nodemailer/nodemailer/compare/v10.0.10...v10.0.11\"\u003e10.0.11\u003c/a\u003e (2026-09-27)\u003c/h2\u003e\n\u003ch3\u003eBug Fixes\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003efetch:\u003c/strong\u003e report a form body that can not be encoded through the returned stream (\u003ca href=\"https://github.com/nodemailer/nodemailer/commit/74d40bf1e4553bc0568b471250a9251bcb569b00\"\u003e74d40bf\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003ekeep the CommonJS entry point and the services subpath compatible with the pre-TypeScript build (\u003ca href=\"https://github.com/nodemailer/nodemailer/commit/52901ef3725ad179aa56276495a60f53b2c83516\"\u003e52901ef\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eqp:\u003c/strong\u003e keep wrap() terminating for short line lengths and a trailing incomplete escape (\u003ca href=\"https://github.com/nodemailer/nodemailer/commit/8fa140b11c62cb1202eac84d35bb3ba28bc3b1a1\"\u003e8fa140b\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003esmtp-connection:\u003c/strong\u003e fail a password login cleanly when the server offers only XOAUTH2 (\u003ca href=\"https://github.com/nodemailer/nodemailer/commit/90abf7d11db5ebfeb4292b62c1fff969741c7d33\"\u003e90abf7d\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003etypes:\u003c/strong\u003e restore the layout of \u003ccode\u003e@​types/nodemailer\u003c/code\u003e in the bundled declarations (\u003ca href=\"https://github.com/nodemailer/nodemailer/commit/ac2e40ffc69427e0eb33ce3945fae76c4c828c8d\"\u003eac2e40f\u003c/a\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u00 PREFERENCE_INCOMPLETE` guard in `CalendarService.listCalendars` (reviewer follow-up); verified that guard exists and throws when either field is missing.\n- `bun install --frozen-lockfile`, then built `plugin-assistant` and `plugin-native-calendar`: `adapter.test.ts` + `feed-preferences.test.ts` 19/19 passed.\n- Biome `lint:check` on plugin-calendar: no errors (existing warnings only).\n- Calendar `tsc --noEmit`: one error, `packages/ui/src/api/personal-fallback.ts` cannot resolve `@elizaos/cloud-shared/...` (the calendar tsconfig has no path mapping for it). Pre-existing from develop's `13354eac18f`, not touched by this PR.\n- Full calendar `bun run test` in the isolated worktree: 946 passed, 5 failed / 19 files failed to load because other workspace packages (`@elizaos/agent`, `plugin-elizacloud`) were not built locally. Not related to this PR. Hosted CI is authoritative: full CI run [36387936203](https://github.com/elizaOS/eliza/actions/runs/36387936203) on `5af6e8b1c84` completed **success**.\n\n## Known gaps / failures\n\nNo end-to-end latency measurement or latency reduction is claimed. Full repository verification and app build passed on the combined integration checkout containing this exact Calendar patch plus a separate evaluator change; they were not rerun on this isolated draft head. Dependency installation was reused. Scoped checks above were rerun on the exact draft head.\n\n## Deployment\n\nNo migration or deployment step.\n\n\n"])</script><script>self.__next_f.push([1,"3a:T12d3,"])</script><script>self.__next_f.push([1,"## #31316: Cloud Worker startup CPU (Refs #29024)\n\nFixes #31316\n\n### Why it regressed\n#31317 moved the Cloud logger and two Shared runtime helpers onto core leaf exports. Then 1047e6d0096 collapsed core's `exports` map to `.` only, so those imports went back to the full `@elizaos/core` root. That commit consolidated the export surface; it did not say the leaves were wrong. Core now has explicit leaf subpaths again, but these files never moved back to them.\n\nThe metafile showed a second path that #31317 never removed. `db/schemas/index.ts` imports the table objects from the `@elizaos/plugin-sql` root, and that root imports the core barrel. So fixing only the logger would have left the core barrel in startup. Nine eagerly loaded modules imported the core root. This PR removes all of them.\n\n### Change\n- **core**: added the `./security/redact`, `./network/ssrf`, `./types/primitives` and `./utils/string-to-uuid` subpaths.\n  - `stringToUuid` moved into its own leaf. `utils.ts` re-exports it.\n  - `mintInferenceTraceId` moved into the existing `inference-trace` leaf. `inference-timing.ts` re-exports it.\n  - Each function still has one implementation and the root barrel's API is unchanged. The leaves don't import the runtime barrel, as `packages/core/AGENTS.md` requires.\n- **plugin-sql**: added a `./schema` entry: a tsup entry plus an export map entry. `src/schema.ts` now also exports its tables by name. It imports only drizzle and core types.\n- **cloud/shared**: moved the eager importers to leaves:\n  - `logger.ts`, `shared-runtime-channel.ts` and `shared-runtime-history-policy.ts` (the three from the issue)\n  - `http-telemetry.ts`, `anonymous-sessions.ts`, `onboarding-coordinator-transport.ts` and `shared-runtime-errors.ts`\n  - `db/schemas/index.ts`, which now imports from `@elizaos/plugin-sql/schema`\n\n**What stays the same after 1047e6d0096.** There is still a single cloud logger module and a single redaction policy: `isSensitiveKeyName` and `redactLogArgs` come from the same core `security/redact` module. That module holds no configurable state, only a regex cache. `ElizaError` identity also holds across copies, because `instanceof` checks a shared brand. The deferred alarm-recovery and X-credential imports from #31317 are unchanged.\n\n### Measurements\nSame tree and toolchain, from `wrangler deploy --env production --dry-run` (the `check:worker-bundle` script) with `--metafile`. \"Eager\" means statically reachable from `src/index.ts`, which is what esbuild evaluates at Worker startup.\n\n| | before | after |\n|---|---|---|\n| Total upload (whole bundle) | 27959.21 KiB / gzip 6903.47 KiB | 27965.13 KiB / gzip 6905.95 KiB |\n| Eager modules at startup | 1159 | **483** |\n| Eager input bytes | 9.34 MB | **3.11 MB** |\n| Core modules evaluated at startup | 487 (4762 KiB) | 0 dist barrel modules; only leaf sources |\n| plugin-sql evaluated at startup | 676 KiB (adapter runtime) | 79 KiB (tables only) |\n| Core root barrel eager | yes | **no** |\n\nTotal bundle size is flat because the heavy code still ships and loads lazily on demand. The gain is in what the Worker evaluates when it starts.\n\n**Startup profile.** I ran `wrangler check startup --worker \u003cprebuilt bundle\u003e` three times on each bundle, interleaved:\n\n| | run 1 | run 2 | run 3 | median |\n|---|---|---|---|---|\n| before, active CPU (ms) | 11716 | 10841 | 13546 | **11716** |\n| after, active CPU (ms) | 5638 | 8353 | 5697 | **5697** |\n| before, script (ms) | 8955 | 8638 | 10618 | 8955 |\n| after, script (ms) | 4962 | 4788 | 4366 | 4788 |\n\nThe machine's load average was 150–260 during these runs, so the absolute numbers are far above real Cloudflare timings. Only the relative drop (about 50% active CPU, about 47% script time) means anything. This is local evidence only: canonical staging deployment and the separate Dedicated latency measurement from the issue's acceptance criteria are still pending.\n\n### Verification\n- `packages/cloud/api`: `bun run typecheck` (tsc, router contract and `check:worker-bundle` dry run) passed.\n- `packages/cloud/shared`: `bun run typecheck` passed.\n- `packages/core`: `bun run typecheck` passed.\n- `plugins/plugin-sql`: `bun run typecheck` and `lint:check` passed.\n- Biome passed on all changed files. `packages/cloud/api` `lint:check` reports 0 errors; its 25 warnings were already there.\n- Tests, run one file at a time:\n  - `packages/cl ts and demo: https://github.com/gazoy/concord (Python; Cosmos SDK port planned). The demo runs an agent paying an API per call and the API settling once.\\n\\nI'd like to build an Eliza plugin for it (a payment scheme alongside the existing x402 one) and am looking for a maintainer to sanity-check the design. Happy to open a draft PR if there's interest.\\n\",\"createdAt\":\"2026-09-28T14:00:45Z\",\"closedAt\":\"2026-09-28T23:01:17Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABTkdR9w\",\"title\":\"fix(personal-assistant): transcript commitments resolve deadlines on the UTC day\",\"author\":\"hermesagent270-commits\",\"number\":32880,\"repository\":\"elizaos/eliza\",\"body\":\"$18\",\"createdAt\":\"2026-09-28T02:03:47Z\",\"closedAt\":\"2026-09-28T04:58:32Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABTiXhaQ\",\"title\":\"Consolidate browser controller and transfer Chromium component ownership to OS\",\"author\":\"lalalune\",\"number\":32859,\"repository\":\"elizaos/eliza\",\"body\":\"The Chromium component is intended to ship only inside elizaOS Linux/AOSP images. Consolidate it into `packages/os/browser` in this monorepo, as requested. The separate remote-control-host workspace contains host-neutral controller code needed by app, CLI, and cloud; consolidate that code into server-only plugin-browser entrypoints.\\n\\nScope: remove both standalone workspaces; update Linux/AOSP staging, app/agent/cloud/UI consumers and deployment manifests; consume the canonical native-wire leaf through the locked plugin-browser workspace dependency. Preserve authorization, encryption, complete context, and consume-once behavior.\\n\\nAcceptance: moved controller, encrypted-storage, extension and native-wire tests pass; existing signed-artifact and Android certificate checks remain; installed Linux Chromium and signed AOSP device verification are reported separately from source/fixture tests. The separate elizaOS/os transfer proposal
