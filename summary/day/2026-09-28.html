ask completion.\n\n- Correct Cloud usage attribution before comparing runs: map native `promptTokens`/`completionTokens` to the usage-event `inputTokens`/`outputTokens` contract in buffered, SSE and non-SSE fallback paths. Check current behavior and reuse applicable #27744 work.\n- Verify emitted input/output/total counts match gateway usage, including a final SSE usage-only frame. Verify downstream cost estimates use the real counts when gateway cost is absent; retain unknown usage as unavailable. This fixes telemetry, not server-side credit debits.\n\nCloud token counts #27732 is consolidated here within the same five-day allocation. Original reproduction and consumer details remain linked in that issue.\n\n**Done when:** before/after trajectories show lower unnecessary context and efficient action/tool search, with the agreed tasks still completing correctly. Record token and latency changes, failures and any tradeoffs. Missing usage stays unknown; estimates are labeled.\n\nReruns, comparison, validation and targeted fixes are included in the five days. This ticket does not build another context editor.\n\n[Project and schedule](https://github.com/orgs/elizaOS/projects/20)\n"])</script><script>self.__next_f.push([1,"15:T6ca,"])</script><script>self.__next_f.push([1,"The running macOS app cannot create a backup of the current agent state, and the dialog hides the deterministic size rejection behind “Backup failed.” Retrying the same state cannot succeed.\n\nReproduced in signed development bundle a0de6f6cc43e8c086f12a2fbf1b932b91a7bee63: Settings → Backups → Back up agent → Create Backup. The dialog remains open with an error; no backup was created and no restore was attempted. Sanitized runtime diagnostic at 2026-09-06T19:11:54.645Z: `Snapshot refused during file capture: source budget exceeded`.\n\n`POST /api/backups` calls `createLocalAgentBackup`, which uses the v1 snapshot path. `AgentSnapshotBudgetExceededError` already carries code, stage, observed bytes and limit bytes. The route catches every failure and sends generic HTTP 500. The v1 shared restore ceiling is 128 MiB; source capture also accounts for allocation overhead. Do not raise that cap, truncate content, or omit state to make this test pass.\n\nAcceptance:\n\n- Translate the known typed budget rejection to a structured, safe response without filesystem paths or database diagnostics.\n- Show an actionable size-limit explanation in the native backup dialog and distinguish it from a retryable transport/storage failure.\n- Exercise the real route/error boundary and UI consumer, including an ordinary unexpected failure; preserve full backup data and existing limits.\n- Confirm whether the supported large-state local backup path is the existing v2 streaming implementation. Keep full backup success explicitly unverified until a created artifact is inspected and a restore is verified in isolated state.\n- Capture the native result in the rebuilt revision; the current observation is a failure, not acceptance proof.\n"])</script><script>self.__next_f.push([1,"16:T63f,"])</script><script>self.__next_f.push([1,"## Parent / scope\n\nFollow-up to #22942. Make every advertised container charge either enforced with a receipt or removed from the product contract.\n\n## Problem\n\nContainer constants advertise deploy, image, monthly reference, storage, bandwidth, and extra-instance charges, but the audited production callers only establish daily CPU/memory/count billing. These are ghost prices until code and ledgers prove otherwise.\n\n## Acceptance criteria\n\n- [ ] Inventory every container rate constant and its authoritative caller/ledger/receipt.\n- [ ] Obtain product approval for exact prices and units; do not infer missing rates.\n- [ ] Remove unused rates and UI/docs promises, or implement idempotent metering and settlement with exact numeric tests.\n- [ ] Expose only actually active charges through the canonical snapshot and active-billing API.\n- [ ] Prove replay, partial failure, and concurrent billing behavior for each retained charge.\n\n## Non-scope / overlap fence\n\nDo not modify #22553's selected/deleting/failed billable semantics or #22906's container-delete reconciliation.\n\n## Contribution provenance\n\n- AI assistance: yes\n- AI provider/model: OpenAI / gpt-5\n- Client / agent tooling: Codex\n- Contribution skill revision: elizaOS/eliza@a83adaa8eba1901b1e9fa99e177b4e0f1d7e8bc7:packages/skills/skills/contribute-to-eliza\n- Attribution status: self-reported\n\n— [codex-billing-v2-u07]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5\",\"client\":\"Codex\",\"skill_revision\":\"elizaOS/eliza@a83adaa8eba1901b1e9fa99e177b4e0f1d7e8bc7:packages/skills/skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"17:T5d8,"])</script><script>self.__next_f.push([1,"A clean single-instance launch of the current macOS development package exposes chat and Settings while its embedded backend is still an unconfigured first-run server.\n\nObserved on the real Mac with the packaged renderer (build content ID 15a2d61edd19, source 4582587bee3):\n- Embedded API correctly moves to port 31338 because 31337 is occupied.\n- Backend logs: fresh install; runtime boot deferred until onboarding commits.\n- Direct read-only API checks: auth/status required=false, authenticated=false; first-run/status complete=false; status state=not_started; runtime/mode mode=local.\n- Renderer nevertheless logs remote-backend, skips local startup, and reaches ready.\n- Desktop bootstrap returns 503 db_unavailable. Native chat fails to send.\n- Cloud sign-in remains on Opening Cloud sign-in without opening Safari; the same result reproduced after eliminating an initial duplicate-app launch.\n\nThe exact mechanism linking the stale/restored client target, first-run classification, and the stuck sign-in is still being investigated. Do not treat the backend first-run state as successful setup or bypass authentication to make the controls appear usable.\n\nAcceptance: on the packaged app, an unconfigured embedded backend leads to a usable setup path; Cloud sign-in opens and completes or shows a bounded actionable failure; setup initializes the real backend and a native chat reply succeeds. Retest returning configured profiles and occupied-port startup without discarding their setup.\n"])</script><script>self.__next_f.push([1,"18:T878,"])</script><script>self.__next_f.push([1,"## Reproduction\n\nOn current `develop` (`0831fda0f0`), the finalized-meeting event first calls `projectFinalizedTranscriptCommitments` and then runs the zone-aware meeting-ghost consumer. The commitment projector still resolves `tomorrow` and weekdays with `getUTCDay` / `setUTCDate` and fixes the resulting deadline at 17:00 UTC.\n\nUsing the production `commitmentRecordsFromTranscript` path with a meeting that starts Monday 2026-09-14 at 17:30 America/Los_Angeles and an owner segment saying `I will send the report tomorrow.` produces:\n\n```json\n{\"observedAt\":\"2026-09-15T00:30:00.000Z\",\"dueAt\":\"2026-09-16T17:00:00.000Z\",\"sourceKey\":\"transcript-local-day:seg-1\"}\n```\n\nThe owner's intended deadline is Tuesday 2026-09-15 at 17:00 Pacific, `2026-09-16T00:00:00.000Z`. The current row is Wednesday in the owner's local calendar, one day late, and disagrees with the meeting-ghost row emitted by the same finalized event.\n\n## Impact\n\nOwner-spoken promises from evening meetings can be ranked, displayed, and scheduled against the wrong day. The same event can persist two transcript commitment rows with conflicting deadlines.\n\n## Scope\n\n- Resolve the owner's effective time zone at the transcript instant in the runtime projection.\n- Pass that zone into the deterministic extractor.\n- Use the existing zoned-date helpers for explicit dates, `tomorrow`, weekdays, and the 17:00 wall-time deadline.\n- Preserve the existing UTC behavior for callers that do not provide a zone.\n\n## Acceptance proof\n\n- Re-run the exact production projector reproduction and observe `2026-09-16T00:00:00.000Z`.\n- Exercise the real PGlite runtime projection and inspect the persisted ledger row.\n- Verify the affected package tests, typecheck, lint, and root `bun run verify` on the final rebased head.\n\nAI provider/model: openai / gpt-5\nClient / agent tooling: codex\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5\",\"client\":\"codex\",\"skill_revision\":\"N/A - ordinary GitHub contribution without optional run evidence\"} --\u003e\n"])</script><script>self.__next_f.push([1,"19:T145c,"])</script><script>self.__next_f.push([1,"## Decision requested\n\nRatify what a Stripe refund or chargeback does to Cloud rights and actively billed resources, and when those rights may be restored.\n\n### A. Immediate billing hold — recommended\n\nKeep the existing idempotent proportional credit clawback, and place the organization in an explicit server-owned billing-hold state when the reversal makes its funded position invalid. New money spend and provisioning fail closed. Product must define below whether existing billable resources stop immediately or follow an explicit bounded window, and which read/export capabilities remain available. Restoration requires authoritative provider settlement plus a valid funded state; the client never infers it.\n\n### B. Balance-only enforcement\n\nKeep only the current credit clawback/shortfall record. The implementation floors the organization balance at zero, records any unrecovered amount, and disables auto-top-up, but there is no explicit cross-surface hold contract and already-running resources may continue accruing cost. This is simpler but leaves inconsistent behavior and unowned debt exposure across products.\n\n### C. Manual review before restriction\n\nRecord the reversal and wait for an operator decision before changing entitlements. This reduces accidental suspension but leaves a known abuse window and requires an operator SLA, queue, audit trail, and safe default when the SLA expires.\n\n## Exact policy fields required\n\nPlease select A, B, or C and define, without implementation guesses:\n\n1. Trigger semantics for voluntary refunds, partial refunds, `charge.dispute.funds_withdrawn`, and `charge.dispute.funds_reinstated`.\n2. Credit treatment: proportional clawback is currently implemented; the current schema forbids negative balances and records the unrecovered portion. Confirm whether that shortfall becomes authoritative debt, is written off, or triggers another state.\n3. Immediate gates for inference, storage writes/reads, domain and other one-off purchases, API-key use, new apps, containers, shared agents, and dedicated agents.\n4. Treatment and exact timing for already-running billable resources (continue, suspend, stop, or delete). If timing is not immediate, provide the exact duration and who pays during it.\n5. Which non-billable capabilities remain available (sign-in, billing history/receipts, data read/export, cancellation/deletion).\n6. Restoration rules after a won dispute or repayment, including whether restoration is automatic or reviewed.\n7. UI state, notification, receipt, support/escalation, and audit requirements.\n8. Interaction with future subscription states and dunning if #20328 proceeds with subscriptions.\n\n## Current-state evidence\n\nRevalidated on `develop` on 2026-08-22:\n\n- `packages/cloud/api/src/queue/stripe-event.ts` handles `charge.refunded`, `charge.dispute.funds_withdrawn`, and `charge.dispute.funds_reinstated`.\n- `packages/cloud/shared/src/lib/services/credits.ts` applies idempotent cumulative-delta clawbacks, floors `credit_balance` at zero under the organization lock, records `unrecovered_clawback_usd`, and disables auto-top-up.\n- `charge.dispute.funds_reinstated` restores only the clawback amount that was actually applied; it does not resolve the unrecovered shortfall or establish a global restoration/hold authority.\n- The merged payment-request receipt work provides provider-neutral settlement evidence, but it does not define a product-wide entitlement/resource hold.\n- No open issue currently records the required cross-surface policy. Historical #10920/#10938 closed the missing Stripe clawback implementation, not this product decision.\n\n## Scope and non-scope\n\nThis issue is a human product-decision record. It performs no payment, refund, provider call, deployment, database change, resource suspension, or production mutation. Do not implement a grace period, trial, plan entitlement, or deletion policy until the owner supplies it explicitly.\n\n## Acceptance criteria\n\n- [ ] A product owner records exactly `Decision: A`, `Decision: B`, or `Decision: C`.\n- [ ] Every policy field above is answered or explicitly delegated to a linked product specification.\n- [ ] Bounded implementation issues cover the server authority, per-route enforcement, active-resource reconciliation, UI/receipts, and adversarial tests.\n- [ ] Tests include partial refund, refund after consumption, duplicate/replayed events, lost response, dispute withdrawn/reinstated, and concurrent spend versus hold activation.\n\n## Claim / status\n\nHuman product decision required. Keep this issue human-gated until the policy is explicit; engineering claims begin only on the bounded implementation follow-ups.\n\n## Contribution provenance\n\n- AI assistance: yes\n- AI provider/model: OpenAI / gpt-5\n- Client / agent tooling: Codex\n- Contribution skill revision: elizaOS/eliza@a83adaa8eba1901b1e9fa99e177b4e0f1d7e8bc7:packages/skills/skills/contribute-to-eliza\n- Attribution status: self-reported\n\n— [codex-billing-refund-chargeback-decision]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5\",\"client\":\"Codex\",\"skill_revision\":\"elizaOS/eliza@a83adaa8eba1901b1e9fa99e177b4e0f1d7e8bc7:packages/skills/skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"1a:T4a7,## Follow-up\n\nNubs will look into this later. This is a deferred optimization investigation, not a confirmed correctness bug or an approved implementation change.\n\nA combined Notes and Calendar read used four foreground model calls: response handler, planner, evaluator after Notes, and the same evaluator again after Calendar. The first evaluation decided whether to continue; the second checked completion and produced the answer.\n\nInvestigate whether demonstrably independent, read-only actions can complete before a single evaluation, without weakening conditional execution, permissions, failure handling, evidence checks, or final-answer validation. Do not simply remove the intermediate evaluation: dependent requests may need it to decide whether the next action should run.\n\nAcceptance for any future proposal:\n- Explicitly distinguish independent work from conditional or dependent work.\n- Preserve cases where the second read must not execute.\n- Compare actual trajectories, correctness, call counts, token usage, and latency.\n- Retain the existing behavior unless a simpler safe alternative is supported by evidence.\n\nNo runtime behavior is changed as part of filing this issue.\n1b:T318b,"])</script><script>self.__next_f.push([1,"Re-lands manifest-v3 restore and finishes the restore coordinator, so a user restore of a catalogued manifest-v3 backup now runs end to end in production code: quarantined create → materialize → commit → boot → attest → probe → route CAS → finalize.\n\nRefs #20726\n\n## #20732: restore coordinator\n\nFixes #20732. Everything is in code and tested against real PGlite. The only thing left is the staging drill listed below.\n\n### Re-land (commit 1)\n- Cherry-picks `9ab8150880c`, which ports closed #30820 and standujar's `feat/20732-quarantine-runtime-bridge` onto current `develop`. standujar keeps `Co-authored-by` credit.\n- It applied cleanly on top of #32876, the #31334 local-state upgrade guard; the two touch different files.\n- `packages/agent/FOOTPRINT-REVIEW.md` now records that the owner reversed the removal of the restore-v3 candidate modules for #20732.\n\n### Phases\nThe existing phase names map onto the requested ones:\n- `restoring` means materialized.\n- `committed` means the generation is committed.\n- `restart_attested` means booted and attested.\n- `probed` means probes passed.\n- `published` means routed.\n\n| From → to | What the coordinator does |\n| --- | --- |\n| `reserved`/`vault_seeded` → `container_created` | Runs the existing exact quarantined create. An ambiguous provider outcome goes through the existing claim-fenced reconciliation. |\n| `container_created` → `restoring` | 1. Starts the quarantine host.\u003cbr\u003e2. Prepares private roots inside the container (new controller worker). Their device/inode identities are recorded.\u003cbr\u003e3. Streams the catalogue into the quarantine through the guarded materializer journal, using the worker's KMS key bundle and the storage registry. Each object uses its own persisted endpoint.\u003cbr\u003e4. Records the sealed candidate receipt and session. |\n| `restoring` → `committed` | Prepares and commits the generation inside the still-networkless container, then records the committed-generation handoff. |\n| `committed` → `restart_attested` | 1. Snapshots the previous route and observes the previous runtime.\u003cbr\u003e2. Stops the previous runtime **in place** (it is retained, so it can be restarted).\u003cbr\u003e3. Serving transition: detaches the exact container from `none`, attaches the agent network (which activates host ports reserved at create) and restarts the quarantine PID 1.\u003cbr\u003e4. Hands over a boot grant.\u003cbr\u003e5. Launches the committed generation.\u003cbr\u003e6. Polls a private-socket probe until it returns an HMAC-signed boot attestation under the per-restore activation token.\u003cbr\u003e7. Sandbox activation moves `restore_pending` → `restart_attested` and the operation advances, in one transaction. |\n| `restart_attested` → `probed` | Runs three fresh-nonce signed probes. Each checks the MAC, the identities, the committed-generation digest and the listen port. |\n| `probed` → `published` | Route CAS, in one transaction:\u003cbr\u003e- proves the canonical route still equals the snapshot;\u003cbr\u003e- adopts the provider-settled replacement (`lifecycle_committed`);\u003cbr\u003e- activates the generation (`active`, published/dispatched/completed);\u003cbr\u003e- points `sandbox_id`/`node_id`/`container_name`/`bridge_url`/`health_url`/`image_digest` at the restored container. |\n| `published` → `finalized` | 1. Appends the immutable activation publication from the active generation.\u003cbr\u003e2. Removes the previous container, bound to its identity, and releases its node slot once.\u003cbr\u003e3. Writes the final restore receipt (`commitAgentBackupRestore`, backup → `restore_verified`).\u003cbr\u003e4. Finalizes the operation with the receipt and releases the lease. |\n\n### Failure policy (fail closed at each phase)\n- **Before the previous runtime is touched:** failures retry with exponential backoff up to `AGENT_BACKUP_RESTORE_MAX_ATTEMPTS`. After that the restore activation is blocked and the operation fails terminally. The route never moves.\n- **After the previous runtime is stopped** (`committed`, `restart_attested`, `probed`): any failure rolls back. The restored container is stopped, the retained previous runtime is restarted, the activation is blocked, the operation fails terminally and the lease is released. If rollback is incomplete, the operation is recorded as `AGENT_BACKUP_RESTORE_ROLLBACK_INCOMPLETE` and the error is rethrown so an operator is alerted.\n- **Cleanup after a terminal failure:** the failed container is fenced (`cleanup_in_progress`) before it is removed exactly. It is then settled as `cleanup_proven`, and its node slot is released once. Settling frees the agent's replacement fence, so later restores and upgrades are not blocked. A cycle sweep retries any interrupted cleanup. A later restore may replace the `blocked` activation that the failed restore left behind.\n- **After the route CAS:** rollback no longer applies. Finalization retries until it settles.\n- **Lapsed lease:** an operation whose lease lapsed with no live claim is closed explicitly as `AGENT_BACKUP_RESTORE_LEASE_EXPIRED`.\n- **Evidence is write-once:** every piece of phase evidence lives in `agent_backup_restore_operations.serving_state` (migration `0495`, journal updated). A lost response therefore replays and never re-executes.\n\n### Production caller\n- `POST /api/v1/eliza/agents/:agentId/restore` → `elizaSandboxService.restore()` → `admitCoordinatedAgentBackupRestore`.\n- When `AGENT_BACKUP_RESTORE_COORDINATOR_ENABLED=1` and the selected backup is a catalogued manifest-v3 backup in a restorable state, the route acquires the restore lease for `AGENT_BACKUP_RESTORE_WORKER_ID`, opens the operation and returns **202** with the operation id.\n- A second request reports the in-progress restore. Another coordinator's restore returns 409.\n- Legacy snapshot rows keep the existing push/re-provision path.\n- The coordinator runs as a `restore-coordinator` stage of the existing backup-catalogue worker daemon. That stage shares the worker's KMS key bundle and storage registry.\n\n### Deliberate change to the quarantine create\n- Docker cannot add port bindings to an existing container. The exact quarantine is therefore created with its two host ports reserved (`-p`), still attached only to `none`, where the bindings are inert.\n- The create readback and every command fingerprint now require the reserved bindings.\n- The only transition that attaches a network is the coordinator's serving transition, after the committed generation is proven.\n\n### Agent side\n- `agent-backup-restore-v3-controller-worker`: one-shot, private, with three methods: `prepareRoots`, `commitGeneration` and `writeBootGrant`.\n- `agent-backup-restore-v3-restored-runtime`: boots `startEliza({ restoredGeneration })` behind an exclusive lock and serves signed attestations on a 0600 unix socket.\n- `agent-backup-restore-v3-probe-client`: relays one probe.\n- Contract: `@elizaos/core/contracts/agent-backup-restore-v3-serving`.\n- Agent restore tests had wall-clock test budgets that timed out under load. Those budgets are now load-tolerant. Assertions and deliberately short expiry deadlines are unchanged.\n\n### Remaining: staging drill (needs an authorized staging run)\n1. On a real Hetzner node, confirm Docker accepts `-p` with `--network none` at create. Then confirm that `docker network disconnect none` followed by `docker network connect \u003cagent-net\u003e` on the stopped exact container activates the reserved bindings.\n2. Confirm the built image ships the three new `dist/services/*.js` entrypoints and the new core contract in `packages/core/dist`. Confirm the runtime launched with `docker exec -d` (using the image's `/opt/tsx` loader) inherits the agent env and binds `ELIZA_PORT`.\n3. Restore a real agent and verify functional LLM recall of pre-backup memory through the published `bridge_url`.\n4. Exercise a forced probe failure and confirm the previous runtime restarts.\n\n## #24407: fair admission and legacy cron\n\nRefs #24407. Verified; the cron is **not** retired.\n- The minute admission (`/api/v1/cron/agent-backup-admission`) is fair: 64 sharded durable cursors, bounded per-invocation claim and enrollment budgets, and explicit deferral.\n- It only enrolls agents whose activation is `active` with published activation authority. Before this PR nothing in production wrote that state. After it, only coordinator restores do.\n- Retiring the six-hour `enqueueScheduledBackups` caller would therefore leave every legacy agent with no scheduled backup.\n- The cron comment now records this. Retirement needs an activation backfill for legacy agents first; the admission route stays gated off (`AGENT_BACKUP_ADMISSION_CALLER_ENABLED=0`).\n\n## #23235: capture escalation and stranded-row plan\n\nRefs #23235.\n- A capture operation that keeps failing retryably is escalated once it reaches `AGENT_BACKUP_CAPTURE_ESCALATION_ATTEMPTS` claims (default 8). The typical case is the available-memory gate.\n- The escalated failure becomes a trusted **terminal** disposition, `AGENT_BACKUP_V2_CAPTURE_ESCALATED`. It carries the exact spool-cleanup authority, so it settles through the vetted terminal path.\n- The worker raises `BACKUP_CAPTURE_V2_ESCALATED` and logs the org and backup.\n- Stale-runtime-authority failures are never escalated.\n\n### Plan for repairing stranded rows (not executed; live customer rows)\n1. **Inventory (read-only).** Collect every `agent_sandboxes` row in `deletion_pending`/`deletion_failed` older than 24h. For each, record its last error, `deletion_attempt_id`, `bridge_url`, node and whether a container is present (observe only).\n2. **Classify.**\n   - (a) node-unreachable, where the node is now reachable;\n   - (b) permanently failed on a since-fixed defect (#23117 `toISOString`, job timeout);\n   - (c) capture refused, where the customer wants the state gone;\n   - (d) the container is already absent.\n3. **Repair per class, through existing lifecycle authority only (no raw SQL).**\n   - (a)/(b): re-enqueue deletion with `reEnqueueFailedDeletions`.\n   - (d): run the reap path, which releases the allocation.\n   - (c): run `shutdown` with `stateLossAcknowledged` under an operator-recorded authorization.\n4. **`bridge_url` after reap.** Clear it in `releaseDeletionAllocationOnReap`, so a later attempt does not refuse on a dead bridge. This is a small follow-up code change with a PGlite regression test.\n5. **Dry run, then execute.** Dry-run in staging, then run in production with an operator present nk from 23,627 to 10,487 bytes for generic messaging, and 13,973 to 2,274 bytes for inbox search. Full schemas and authorized catalog discovery remain available. Five effect-free live probes selected suitable calls; connector effects were not executed.\n\nThe preserved historical study has all 30 pairs and failures. On 15 common successful pairs with complete usage, calls fell 92→56 and fresh input 296,288→114,140 (61.5% less); weighted cache share was 57.8%→58.8%. Historical acceptance is confounded by provider/client/admission failures and is not final-head reliability evidence.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:ce005a06184a4e8c643bc92b33614259a7a02c77 --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no product UI changes.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no product UI changes.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - backend runtime changes; synthetic task acceptance recorded separately.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [Exact-head hosted checks passed](https://github.com/elizaOS/eliza/actions/runs/36369061161); [clean-head root verification and synthetic acceptance evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend behavior change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] [Final and preserved cohort usage, prefix and context evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [Exact-byte/readback task acceptance and final text/PCM parity](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no product rendered surface changes.\n\n# Evidence Details\n\nComplete prompts, wire requests/responses and  (admin reject still works; it returns the pending lock to the frozen balance)\n- `POST /api/v1/apps/:id/earnings/withdraw`\n- `POST /api/cron/process-redemptions`, which is also removed from the cron schedule\n\nThe on-chain payout processor and the `lockForRedemption` / `refundRedemption` / `convertToCredits` helpers are deleted. Redemption history and the balance read (now always `canRedeem: false`) stay.\n\n**Affiliate payouts stay live.** The affiliate program continues; only creator, MCP and app monetization is retired.\n- `POST /api/v1/earnings/payout/stripe-connect/onboard` is restored for users who have an affiliate code. Anyone else gets 403.\n- `POST /api/v1/earnings/payout/stripe-connect/transfer` is restored. It is still admin-gated and still a compensating saga. It now debits through `affiliate-payouts.ts`, and a definitive Stripe rejection re-credits the amount as an affiliate earning. No cron is needed, because an operator triggers each transfer.\n- **The gate.** A payout may debit at most `min(affiliate net since retirement, available balance − frozen available)`. \"Affiliate net since retirement\" is the sum of the user's `affiliate` ledger earnings and adjustments after the retirement instant: the user's statement `frozen_at`, or the new `creator_monetization_retirement.retired_at` singleton written by 0500.\n  - The check and the debit run in one transaction under the same per-user advisory lock as the ledger, so concurrent payouts cannot both pass.\n  - A same-key retry reuses the prior debit.\n  - Anything more returns 409 `affiliate_payout_exceeds_payable`.\n  - Non-affiliate earnings after retirement (revenue shares and similar) are not payable through this path.\n- **Not payable here:** affiliate earnings that were already unpaid at retirement. They are inside the frozen statement and are settled manually with it.\n- The statement shows `affiliatePayableUsd`, and the Earnings tab shows it as \"Affiliate earnings available for payout\".\n\n**Freeze and statement.**\n- 0500 copies every user's unpaid balance (`available_balance + total_pending`) into `creator_earnings_retirement_statements`, broken down by source. The table has no foreign keys, so the record survives account deletion. The copy is idempotent.\n- `GET /api/v1/earnings/statement` returns the read-only statement.\n- The Monetization \"Earnings\" tab now shows this statement. The redemption UI, the app earnings dashboard, the withdraw dialog and the app monetization settings are removed.\n\n### Follow-up for manual handling: affected orgs and amounts\n\nNo local database was reachable (`DATABASE_URL` unset, nothing on localhost:5432), so this lists no orgs or amounts; it gives the queries to run instead. Run them against production **after 0500 is applied**:\n\n```sql\n-- Frozen creator balances per organization (what is owed)\nSELECT s.organization_id, o.name AS organization_name,\n       count(*) AS users, sum(s.unpaid_balance_usd) AS unpaid_usd,\n       sum(s.available_balance_usd) AS available_usd,\n       sum(s.pending_redemption_usd) AS pending_redemption_usd,\n       sum(s.earned_from_mcps_usd) AS from_mcps_usd,\n       sum(s.earned_from_agents_usd) AS from_agents_usd,\n       sum(s.earned_from_apps_usd) AS from_apps_usd,\n       sum(s.earned_from_affiliates_usd) AS from_affiliates_usd,\n       sum(s.earned_from_revenue_shares_usd) AS from_revenue_shares_usd\nFROM creator_earnings_retirement_statements s\nLEFT JOIN organizations o ON o.id = s.organization_id\nWHERE s.status = 'frozen'\nGROUP BY s.organization_id, o.name\nORDER BY unpaid_usd DESC;\n\n-- In-flight redemptions an operator must reconcile or reject (no cron pays them now)\nSELECT id, user_id, status, usd_value, network, broadcast_tx_hash, created_at\nFROM token_redemptions\nWHERE status IN ('pending', 'approved', 'processing')\nORDER BY created_at;\n\n-- Mark one balance settled after paying it out of band\nUPDATE creator_earnings_retirement_statements\nSET status = 'settled_manually', settled_at = now(), settlement_reference = '\u003cticket or transfer id\u003e'\nWHERE user_id = '\u003cuser id\u003e' AND status = 'frozen';\n```\n\n```sql\n-- Affiliate earnings payable through Stripe Connect now, per user\nWITH cutoff AS (\n  SELECT e.user_id,\n         COALESCE(s.frozen_at, (SELECT retired_at FROM creator_monetization_retirement)) AS since,\n         CASE WHEN s.status = 'frozen' THEN s.available_balance_usd ELSE 0 END AS frozen_available,\n         e.available_balance\n  FROM redeemable_earnings e\n  LEFT JOIN creator_earnings_retirement_statements s ON s.user_id = e.user_id\n)\nSELECT c.user_id,\n       GREATEST(0, LEAST(COALESCE(SUM(l.amount), 0), c.available_balance - c.frozen_available)) AS payable_usd\nFROM cutoff c\nLEFT JOIN redeemable_earnings_ledger l\n  ON l.user_id = c.user_id AND l.earnings_source = 'affiliate'\n AND l.entry_type IN ('earning', 'adjustment') AND l.created_at \u003e c.since\nGROUP BY c.user_id, c.available_balance, c.frozen_available\nHAVING GREATEST(0, LEAST(COALESCE(SUM(l.amount), 0), c.available_balance - c.frozen_available)) \u003e 0;\n```\n\n### Paid MCP listings retired\n\nWith creator monetization retired, a listing price would bill buyers for revenue that reaches no creator.\n- **Existing listings.** Migration **0502** makes every listing free: `pricing_type = 'free'`, both prices set to 0, x402 off. The prior pricing is saved in `metadata.retired_paid_listing` for audit. Usage history is untouched, and the column defaults are now free.\n- **New prices refused.** `POST /api/v1/mcps` and `PUT /api/v1/mcps/:id` refuse any price with 410 `creator_monetization_retired` (capability `paid_mcp_listing`). Setting a listing to free is still allowed.\n- **Proxy.** It never charges a listing price, even for a stale row. A free call skips the credit reservation, since zero-cost reservations are rejected. It runs the deferred strong credential check before calling upstream, then records usage at zero.\n- **Editor.** The MCP editor no longer shows pricing or x402 controls. It explains that listings are free and always submits `pricingType: \"free\"`.\n- **Not unlisted.** No listing was unlisted, because none has pricing that is intrinsic to the listing. x402 listings are made free too.\n\nListings affected by 0502. There is no local database, so run this before applying 0502, or use the `metadata` check after it:\n\n```sql\n-- Before 0502\nSELECT id, organization_id, slug, name, status, is_public, pricing_type,\n       credits_per_request, x402_price_usd, x402_enabled, total_requests\nFROM user_mcps\nWHERE pricing_type \u003c\u003e 'free' OR COALESCE(credits_per_request, 0) \u003c\u003e 0\n   OR COALESCE(x402_price_usd, 0) \u003c\u003e 0 OR x402_enabled = true\nORDER BY total_requests DESC;\n\n-- After 0502\nSELECT id, organization_id, slug, name, status, metadata -\u003e 'retired_paid_listing' AS previous_pricing\nFROM user_mcps\nWHERE metadata ? 'retired_paid_listing';\n```\n\n## #23020: affiliate surcharge disclosure\n\nFixes #23020\n\n- **One formula.** `auto-top-up-charge-breakdown.ts` holds the formula shared by the durable charge snapshot and a new server preview. The formula, percentages, rounding and activation gate are unchanged.\n- **Billing API.** `GET`/`PUT /api/v1/billing/settings` return `autoTopUp.chargePreview`: the credited base, affiliate markup, platform fee, total card charge, and whether attribution is `none`, `affiliate` or `unavailable`. `?previewAmount=` quotes an amount that has not been saved yet.\n- **Billing UI.** The auto top-up card shows those lines as separate rows before the customer saves, and re-quotes on the server when the amount is edited. It never computes money in the client. When attribution is unavailable, it says no surcharge will be charged.\n- **Receipts.** Invoices store `charge_breakdown`, parsed from the signed durable metadata. `GET /api/invoices/:id` and the ledger entries (`chargeBreakdown`) expose it, and the invoice page shows the markup, platform fee and total on separate lines. A breakdown whose lines do not add up to the charged total is never shown.\n- **Other paths.** One-time checkout applies no affiliate surcharge, so it has nothing to disclose. MCP calls already recorded `base_amount_usd`, `affiliate_fee_usd` and `platform_fee_usd` on their credit transactions and usage rows.\n- **Copy.** New UI copy is in `en.json`. The affiliate pricing example no longer promises a \"redeemable token balance\".\n\n## #22967: frozen/sleeping retention\n\nFixes #22967\n\nThis builds on existing machinery rather than adding a parallel path: the billing-stop authority, the automatic resume from #30702, the Dedicated fallback `retain_until` from #32856, the sleep lifecycle, the email service and the backup `billing-freeze` retention reason, which previously had no writers.\n\n- **Clock table.** 0501 adds `agent_funding_retentions`, one open row per stopped agent.\n- **Hourly cron.** `/api/cron/agent-funding-retention` does the following:\n  - **Discovery.** It finds provider-confirmed `billing_request` stops that are still the agent's latest decision (credits exhausted), and open plan-withdrawal fallbacks (plan lapsed past grace). The deadline is the stop time + 30 days, or the fallback's `retain_until`.\n  - **Notices.** It sends the 7-day and 1-day deletion emails through the email service, using a new template with all 8 locales. Each notice is claimed on its row before sending and released if the send fails, so it goes out once and failures retry.\n  - **No deletion without notice.**\n    - A clock first seen late, such as an agent already stopped when this ships, gets a deadline at least 7 days out.\n    - A deadline reached without the 1-day notice sends that notice and moves the deadline one day later.\n  - **Deadline.** It enqueues the existing `agent_sleep` job, which proves a durable backup before removing the container. When the agent is `sleeping`, the latest backup is pinned for 90 days: v2 rows get `retention_reason = 'billing-freeze'` and `retention_until = now + 90d`. Legacy inline rows have no time-based GC.\n  - **Paying resumes.** The existing resume paths restart the same agent id. The clock closes (`funding_restored`) once the agent is running or the fallback moved to recovery. It never deletes while an `agent_resume` or `agent_wake` job is in flight.\n  - **Blocked case.** An agent stopped with an unbacked in-place runtime (#30746) is reported as blocked instead of losing state.\n\n## Verification\n\nEach test file was run in its own process because the host load was about 110.\n\n- **New PGlite tests (cloud-shared):**\n  - `agent-funding-retention.pglite.test.ts` — 4 pass. It uses a fake clock and the real billing-stop discovery, the real `ProvisioningJobService` sleep enqueue and the real automatic-resume reconciler. It covers:\n    - no notice before day 23, the 7-day notice exactly once, the 1-day notice, the sleep job at day 30, and the container marked deleted with the backup kept 90 days;\n    - paying on day 20 queues a resume of the same agent id, and nothing is deleted after the deadline;\n    - a late-discovered stop gets the full notice schedule;\n    - a lapsed plan uses `retain_until` and closes on recovery.\n  - `creator-monetization-retirement.pglite.test.ts` — 5 pass. It covers:\n    - 0500 replayed twice: the statement is correct and the ledger is untouched;\n    - the flags are off, and re-enabling returns the retired error;\n    - an MCP call accrues no creator earnings or credit;\n    - **affiliate payouts:** a frozen $15 creator balance is refused. $7 of new affiliate earnings is payable, and $10 of new non-affiliate earnings is not. A $5 payout succeeds and a same-key retry deduplicates. A $3 payout that would reach the frozen balance is refused, and the remaining $2 succeeds. The frozen $15 is still intact;\n    - **MCP listings:** 0502 replayed twice makes a paid listing free and keeps its prior price in metadata. An update with a price and a create with x402 are refused. An update to free is allowed.\n  - `auto-top-up-charge-disclosure.pglite.test.ts` — 3 pass. It covers affiliate, no affiliate, rounding at the 1000% maximum markup, and the receipt matching the preview and the charged total.\n- **Existing cloud-shared tests:**\n  - `billing-suspension-resume.pglite` — 9 pass\n  - `account-deletion-reservation.pglite` — 16 pass; the restore expectation is updated\n  - `container-billing-idempotency` — 18 pass; the `convertToCredits` cases are removed with the helper\n  - `redeemable-earnings-fail-closed` — 3 pass\n  - `auto-top-up-cutover.pglite` — 26 pass\n  - `platform-cloud-tools.billing-auth` — 5 pass\n  - `active-billing-numeric-fail-closed` — 28 pass\n  - `inference-accounting-migrations` — 7 pass\n- **cloud-api tests:** `stripe-event` 48, `stripe-event-checkout-authority` 7, `stripe-event-waifu` 5, `billing-manager-mutations.pglite` 37, `container-warning-rate` 2. All pass.\n- **packages/ui (vitest):**\n  - `auto-top-up-card.test.tsx` — 25 pass, including 4 new disclosure tests\n  - `McpEditorDialog.test.tsx` — 1 pass. It is rewritten: no price controls, and edits submit a free listing.\n  - `invoice-detail-client.test.tsx` — 2 pass (new file)\n  - `MonetizationPage.test.tsx` — 1 pass\n- **packages/app:** `vite-source-resolution.test.ts` — 21 pass.\n- **Typecheck:** `tsc --noEmit` is clean for cloud-shared, cloud-api and packages/ui.\n- **Generated routes and migrations:**\n  - `bun run codegen` and `bun run check:router-contract` pass after both commits: 766 routes, all Hono leaves mounted.\n  - The SDK public routes were regenerated. Develop had drifted, and the output also picks up the existing `personal/recovery/{token}` route.\n  - `check:migration-prefix-order` passes.\n- **Biome:** `biome check` on every changed file is clean.\n- **Removed tests:** cloud e2e specs that exercised the retired flows (`redemption-flow`, `creator-monetization-journey`, `mone  bun bases listed in `image.lock.json`. `Dockerfile.ci` gains `NODE_IMAGE`/`BUN_IMAGE` args whose defaults are unchanged, and `verify-agent-image.sh` gains `DOCKER_BUILD_EXTRA_ARGS`. The script then overlays the digest-pinned `dstack-verifier` 0.6.0, pushes the image and records its registry digest.\n- **Measured app-compose.** `scripts/alpha-dstack.ts render` writes the exact app-compose bytes. The compose pins the image by digest, keeps state on an `eliza-state` volume at `/data/eliza`, uses `restart: unless-stopped` and health-checks `/api/health`.\n- **Model and ingress settings.** Text goes to Cerebras. Embeddings use Eliza Cloud or an OpenAI-compatible endpoint, and STT/TTS use Eliza Cloud. Local inference is off (plugin skipped, cloud deployment runtime, no local embeddings, no FFI llama). Ingress binds 0.0.0.0 and requires `ELIZA_API_TOKEN` (`ELIZA_REQUIRE_LOCAL_AUTH=1`). The `dstack-cpu` boot gate is on.\n- **Secrets.** Secrets appear only as `allowed_envs` names. `encrypt-env` sends them through dstack's KMS-encrypted environment, and `confidential-bootstrap.mjs` authenticates them before the agent loads. No secrets are in the repo.\n- **Attestation.** There is a new authenticated route, `POST /api/tee/dstack/attestation`, that returns raw guest evidence for an operator nonce. `verify-attestation` appraises it off-box with `verifyDstackAttestation` against the signed release. It also checks the signed Cerebras processor approval with `createConfidentialHostPolicy`.\n- **README.** Covers deploy, verify, pairing, and upgrade/rollback.\n\nVerification:\n- `node ../scripts/run-vitest.ts run --config vitest.host.config.ts src/services/alpha-dstack-deployment.test.ts` (packages/app): 5 passed. This includes `docker compose config`, release signing and bootstrap contract checks, and appraisal accept/reject cases.\n- `test/tee-dstack-operator-attestation.test.ts` (packages/agent): 2 passed, against a real Unix socket.\n- CLI smoke of `render`, `sign-confidential-release` and `sign-processors` on the committed example.\n- `ci-bun-version-contract` and `audit-tee-secret-leak` both pass.\n\n## #31021: phone pairing contract\nRefs #31021\n\n- **core.** Adds a `remote-agent-pairing` contract (endpoints, bearer auth) and a strict QR/deep-link payload: `elizaos://remote/agent-pair?v=1\u0026url=\u0026code=\u0026instance=`. The payload carries a one-time code and the issuing instance, never a token. The pair schemas gain an optional `instanceId`.\n- **agent.** The agent-only server now reports a per-process `instanceId`, which the app's `pair()` needs. Before this change, pairing against a hosted agent-only server failed with `PAIRING_NOT_READY`. `pair-code` can now be read from loopback or with the API token, so a CVM operator can use it. `pair` rejects a code issued by another instance with 409.\n- **app.** The compat `pair-code` route also admits an authenticated OWNER. The deep-link handler exchanges the code against a trusted origin (the build-pinned `VITE_ELIZA_REMOTE_FALLBACK_API_BASE` for Alpha APKs) before the normal connect, which asks the user to confirm.\n- **ui.** `exchangeRemoteAgentPairing` checks the origin before sending any request and binds the exchange to the issuing instance.\n- **Operator CLI.** `alpha-dstack.ts pair-link` prints the payload.\n\nVerification:\n- `test/remote-agent-pairing-http.test.ts` (packages/agent, real HTTP): 1 passed. It covers the wrong token, the wrong instance, a reused code, and bearer use afterwards.\n- `src/platform/remote-agent-pairing.test.ts` (packages/ui): 7 passed.\n\n## #31022: Alpha routines\nRefs #31022\n\n- Adds an opt-in `alpha-routines` supplemental pack in plugin-scheduling: morning brief, reminders and nudge. They are seeded disabled (`manual` trigger), and each carries an `owner_local` enable trigger. It is selected with `ELIZA_SCHEDULING_DEFAULT_PACKS`, read from the runtime setting first and then the environment. The dstack compose sets it.\n- `packages/agent/test/scheduled-routine-offline-delivery.test.ts` uses a real SQLite runtime, PA's production dispatcher and the HTTP server with no WebSocket client connected. It shows that a routine fired while offline lands in durable history exactly once, despite overlapping and repeated ticks, with a stable id across reloads.\n\nVerification: plugin-scheduling `plugin`, `record-startup` and `seed-registry` tests: 24 passed. The offline-delivery test: 1 passed. `turbo typecheck --filter=@elizaos/plugin-scheduling` passes.\n\n## #31034: white-label Android build\nRefs #31034\n\n`ELIZA_WHITELABEL_DIR` points at a private directory outside the repo containing a `brand.json` with app name, icon background, icon, splash, Cloud splash mark and boot animation logo/field.\n\n- The loader fails closed and rejects package ID, URL scheme and signing fields.\n- Same-ID white-label builds move to the app's own ignored Android tree.\n- `make splash`/`make bootanimation` render the private logo and field, and refuse to ship the upstream splash.\n- Documented in `packages/os/android/README.md`.\n\nVerification: `scripts/mobile/whitelabel.test.ts` (7 passed, placeholder assets) and `whitelabel-bootanimation.node.test.ts` (2 passed; renders and packs).\n\n## #31023: Pixel AOSP\nRefs #31023\n\nThe tree targets only `pixel11pro-grizzly`, and there is no Pixel 10 lock. This adds a `decisionNote` to the grizzly entry in `hardware-targets.json` and a README pointer that records the open device decision. No vendor, kernel or lock changes. `pixel-firmware-preparation.node.test.ts`: 4 passed.\n\n## Also referenced\n#31025, #31037 and #30844 need no code beyond the above. Their remaining work is device rollout, QA and the final APK.\n\n## Checks\nTypecheck passes for packages/agent, packages/app (host), packages/core, packages/ui and plugin-scheduling. Biome is clean on changed files; the only remaining finding is the pre-existing JSON formatting of `hardware-targets.json`. `audit-test-lane-membership`, `audit-focused-skipped-tests`, `fix-workspace-deps --check`, `alias-read-guard` and `audit-scripts` pass. The full `bun run verify` was not run because the machine was heavily loaded.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"1f:T2efb,"])</script><script>self.__next_f.push([1,"Refs #22957\n\nEliza Cloud has two ways to pay: **Plus/Pro subscriptions** (a monthly allowance plus plan limits, from #32838/#32854) and **pay-as-you-go prepaid credits**. This PR puts the owner's decisions on the consolidated #22957 children into code, one commit per child. `packages/cloud` has no billing README, so the policy table is here.\n\n| Policy | Decision (as implemented) |\n|---|---|\n| Storage prices (#22956) | `STORAGE_PRICING` in `shared/src/lib/constants/pricing.ts` is the only storage price source. PUT costs $0.0001 plus $0.000000001 per byte; GET, HEAD, list and presign cost $0.00005 each; DELETE is free. There is no per-GB fee. The `service_pricing` storage rows are a read-only copy, and the admin API refuses to edit them. |\n| Top-ups and packs (#22963) | Pay-as-you-go top-ups accept any whole-cent amount from **$5 to $1,000** per checkout, on card, crypto and direct wallet. The $10/$25/$50/$100 buttons are presets, not packs. Credits always equal the amount paid, with no bonus. Fixed packs are retired, but historical pack orders and ledger rows can still be read. |\n| API keys (#22958) | API keys are free. Plans cap how many a user can create: **pay-as-you-go 5, Plus 10, Pro 25**. Keys the system creates (default, explorer, sign-in, app and agent keys) don't count. A deactivated key counts until it is deleted. A key's own `rate_limit` (requests per minute across all endpoints) is a cap under the plan tier; it never raises the tier. |\n| RPM tiers (#23019) | Subscribers get their plan's tier. For pay-as-you-go, the $5 and $100 thresholds count only **purchased** credits: Stripe, OxaPay crypto, x402, direct wallet (paid USD only, not the promo bonus) and payment requests. Refunds and chargebacks subtract; a won dispute adds back. Promo, signup, referral, affiliate, earnings, MCP and refund credits never count. |\n| Crypto and x402 refunds (#22968) | Refunds are paid **only as Eliza Cloud credits**. Nothing is sent back on-chain or to fiat. Each refund is capped at the USD actually paid, can be replayed safely with the same refund key, and goes only to the org that owns the payment. The policy is stated at checkout and in the x402 top-up payment prompt. |\n| Generated media (#20956) | Generated media counts toward the **single storage quota**; there is no separate media quota. If the quota is already full, the request is refused before any charge. If the output doesn't fit once generated, it isn't stored and the provider cost is charged. Storage is released only after the object is confirmed deleted. |\n\nMigrations 0503–0505 are appended to the journal after develop's 0500–0502. They were first written as 0496–0498 and renumbered when #32907 merged, because the deployed migration ledger rejects entries inserted before already-applied migrations.\n\n## #22956: storage pricing\nFixes #22956\n\n- Every storage route now charges from `storageOperationPriceUsd`: objects PUT/GET/HEAD/DELETE, list and presign. None of them reads `service_pricing` any more, so the \"pricing unavailable\" 503 path is gone.\n- Migration **0503** updates the storage rows in `service_pricing` to match the catalogue. It writes an audit row for any price it corrects and removes the old \"finalize during pricing review\" TODO.\n- `PUT /api/v1/admin/service-pricing` now returns 409 `storage_pricing_code_owned` for `service_id=storage`.\n- Tests:\n  - `storage-pricing-boundary.test.ts` pins the exact catalogue and proves no route reads DB pricing.\n  - `storage-pricing-catalogue-migration.test.ts` applies 0503 on PGlite.\n\n## #22963: credit packs and minimum top-up\nFixes #22963\n\n- **Server:** `ORGANIZATION_CREDIT_CHECKOUT_LIMITS` is now $5–$1,000, and `ORGANIZATION_CREDIT_TOP_UP_PRESETS_USD` is [10, 25, 50, 100]. These bounds are read by:\n  - card checkout (`/api/stripe/create-checkout-session`) and `/api/v1/credits/checkout`;\n  - `/api/v1/credits/summary`;\n  - crypto (`MIN/MAX_PAYMENT_AMOUNT`) and `/api/crypto/direct-payments`;\n  - the billing-hold pay action.\n- **Checkout orders:** `stripeCheckoutOrdersService.create` rejects new pack orders, amounts outside the range, and any grant that isn't exactly the charged amount (so no bonus). These are typed errors.\n- **Removed:**\n  - the pack checkout branch (a `creditPackId` now gets a typed 400);\n  - `GET /api/stripe/credit-packs` (router regenerated);\n  - the pack cache and service lookups;\n  - the `seed-credit-packs` and `audit-credit-packs` scripts;\n  - local-dev pack seeding;\n  - `packSavingsPercent`.\n- Migration **0504** deactivates the pack rows. Legacy pack settlement and quarantine are unchanged.\n- **UI:** the billing tab has $10/$25/$50/$100 preset buttons and reads its limits from the contract. It previously had its own $1–$10,000 bounds.\n- **Copy:** the billing SEO text in all eight locales (en, es, ja, ko, pt, tl, vi, zh-CN) now describes Plus/Pro subscriptions with a monthly allowance and pay-as-you-go top-ups from $5 to $1,000. No locale mentions credit packs any more.\n\n## #22958: API keys\nFixes #22958\n\n- `apiKeys` is now a resource ceiling:\n  - added to `FREE_RESOURCE_CEILINGS` and to the Plus/Pro catalogue entries;\n  - `readOrganizationQuotaPolicy` resolves it for pay-as-you-go and for subscriber orgs;\n  - a lapsed subscription falls back to 5.\n- `POST /api/v1/api-keys` creates through `createUserManaged`:\n  - it takes the org policy lock and counts non-deleted user-created keys;\n  - at the limit it throws `ApiKeyLimitExceededError`, returned as 403 `api_key_limit_exceeded` with `used`, `limit` and `remaining`;\n  - rotating a key keeps its attribution.\n- `GET` returns `usage`, and the API keys page shows it.\n- Migration **0505** adds `api_keys.user_created`, backfills it for existing live user keys (system-provisioned keys are excluded), and adds a partial index.\n- **Per-key `rate_limit`, now enforced.** Nothing read this field before, but keys do carry custom values: the explorer key is minted at 100, app keys at 10000, and the API accepts 1–100000. So the field is kept and enforced.\n  - It means requests per minute for the key across every inference endpoint, and it only narrows the plan tier.\n  - `enforceOrgRateLimit` takes the presenting `apiKeyId` and reads the cap inside the locked policy transaction. Policy admission now passes its transaction to the callback.\n  - The cap is applied only when it can bind, i.e. when it is below the plan's combined per-minute tier. Default 1000 keys therefore add no work.\n  - The admission Durable Object checks the tier window and the per-key window in one serialized decision. Key windows are dropped after their minute ends.\n  - The Redis limiter path checks an `apikey:\u003cid\u003e:rpm` window.\n  - A key that authenticated but has since disappeared fails closed with a 503.\n  - Chat completions, chat, messages, embeddings and the generative routes pass the key id.\n- Tests:\n  - `api-key-plan-ceilings.pglite.test.ts`: the 5/10/25 ceilings, a refused 6th key, a deactivated key still counting, the slot freed on delete, org isolation, concurrent creates at N-1 admitting exactly one, and the Plus limit of 10.\n  - `api-key-plan-ceilings-migration.test.ts`: the backfill.\n  - `api-key-rate-limit.pglite.test.ts`: when a cap binds, and the fail-closed path for a missing or foreign key.\n  - `inference-admission-gate.miniflare.test.ts`: the per-key window in the real Durable Object. It counts across endpoints, doesn't limit other keys or key-less callers, and rejects an invalid cap. 20 pass.\n\n## #23019: RPM tier credit sources\nFixes #23019\n\n- The metadata denylist is replaced by `ORG_TIER_PURCHASED_CREDIT_SOURCES`, an allowlist keyed on payment identity, and the total is net of reversals.\n- Purchases, refunds and clawbacks now clear the cached tier, so a crypto or x402 purchase or a reversal takes effect without waiting out the one-hour cache.\n- `org-rate-limit-purchased-credits.pglite.test.ts` covers every provenance, the $4.99/$5 and $99.99/$100 boundaries, clawback and reinstatement, org isolation and the Plus plan tier.\n\n## #22968: crypto/x402 refunds\nFixes #22968\n\n- `CryptoPaymentRefundsService.refundAsCloudCredits` is the refund path, with the operator script `scripts/admin/refund-crypto-payment.ts`.\n  - `CRYPTO_REFUND_POLICY` maps both crypto and x402 to `cloud_credits`.\n  - Any other destination is refused with a typed `CryptoRefundError` before anything is read or written.\n  - It locks the payment row, checks the recipient is the owning org, and caps the refund at the paid USD (never the bonus).\n  - Refunds are idempotent per refund key and written as `refund` ledger rows, so they never count toward an RPM tier.\n- The x402 top-up payment prompt carries the policy in every locale, both in its `description` and in a structured `extra.refundPolicy` field (`{ destination: \"cloud_credits\", statement }`). Covered by `topup-refund-policy.test.ts`.\n- The billing tab states the policy when Crypto is selected. The direct-wallet overpayment error now points to a credit refund instead of an on-chain one.\n- Tests: `crypto-payment-refunds.pglite.test.ts`, plus a UI test.\n\n## #20956: generated media vs storage quota\nFixes #20956\n\n- The new `lib/storage/generated-media-storage.ts` is wired into image generation, `generate-music` and `generate-sfx`. Before admission it checks the org still has storage headroom; if not it returns a typed 413 `storage_quota_exceeded`. It then reserves the exact output bytes before writing to R2.\n- **Cleanup:** a failed history write or a partial multi-image request deletes the objects and releases their bytes.\n- **Gallery delete:** releases the bytes once, through `markDeletedOnce`, and only after R2 confirms the delete.\n- **Hosted audio:** fal and Suno results are never stored in Cloud R2, so they are not counted (`AudioProvider.storesOutputInCloud`).\n- The storage limits copy now describes one figure for files, avatars and generated media.\n- `generated-media-storage-quota.pglite.test.ts` drives the real image executor and quota repository.\n\n## Verification\nEach test file was run on its own; the machine was heavily loaded.\n\n- **Type checks, all pass:**\n  - `tsc --noEmit` for cloud shared, cloud api, cloud sdk and packages/ui;\n  - api `test/_router-contract.mjs`;\n  - `check-migration-prefix-order` and `check-tenant-scope`.\n- **New tests:** all pass.\n- **Updated existing tests, all pass:**\n\n  | Test file | Result |\n  |---|---|\n  | `stripe-checkout-orders.pglite` | 14 pass |\n  | `billing-manager-mutations.pglite` | 38 pass |\n  | `storage-pricing-boundary` | 2 pass |\n  | ui `billing-tab.test.tsx` | 14 pass |\n  | ui `billing-tab.idempotency.test.tsx` | 25 pass |\n\n- **Regression runs, all pass:**\n\n  | Test file | Result |\n  |---|---|\n  | `subscription-entitlements-derivation` | 5 |\n  | `api-keys-stranded-sweep` | 9 |\n  | `subscription-allowance-lifecycle.pglite` | 8 |\n  | `account-billing-snapshot-primary.pglite` | 2 |\n  | `org-storage-quota.pglite` | 4 |\n  | `containers-project-intent.pglite` | 6 |\n  | `org-storage-mutations.pglite` | 19 |\n  | `credits-reconcile` | 37 |\n  | `stripe-event` | 48 |\n  | `stripe-dispute-reinstatement.pglite` | 9 |\n\n- `biome check` is clean on every changed file.\n- **Not run:**\n  - the full `bun run verify` and the complete test batches (host load);\n  - `check:worker-bundle`;\n  - the live E2E groups: the direct-crypto and account-billing E2E cases were updated for the $5 minimum and the retired pack route;\n  - the app visual audit and desktop/mobile inspection of the new preset buttons, crypto policy note and API-key usage line.\n\n## Remaining\n- The new UI strings (quick amounts, crypto refund note, API-key usage, storage wording) exist only in `en.json`. Other locales show them in English through `defaultValue`. The billing SEO copy and the x402 refund statement are translated.\n- Crypto refunds go through the operator script only; there is no customer-facing refund request UI.\n- #22961, #23020 and #22967 are handled in a separate PR.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"20:T190c,"])</script><script>self.__next_f.push([1,"One commit per issue. Each touches only its own lane.\n\n## #30806 — Worker admission (Refs #30806)\n- **(a)** Affiliate-marked and flat-priced subscriber requests on the Worker now use the deferred Durable Object lease-and-settle lane.\n  - The affiliate payout contract is pinned in the lease recovery context.\n  - The payout is enqueued inside the funding transaction, so it commits atomically with the debit. Replays and alarm recovery never pay twice. The DO validates the pinned contract.\n  - Found and fixed: the synchronous subscriber reservation never enqueued its affiliate payout. `subscriptionFundingService.settleInTransaction` ignored the pinned `affiliatePayout` metadata.\n  - Non-Worker callers stay synchronous. The reason is documented in `isDeferredSubscriberLaneEligible`: they have no Worker lifetime and no DO for leases or alarm recovery.\n- **(b)** New flag `INFERENCE_SNAPSHOT_ADMISSION_ENABLED`, on in staging and off in production. With it on, the warm Worker path serves admission from the published admission snapshot. No policy transaction, dispatch-policy transaction or auth-cache policy read runs before dispatch.\n  - The snapshot now carries billing-hold state and subscriber funding capacity. Both are read under the publishing policy lock.\n  - Every publication advances the org DO's policy generation. A lease or dispatch carrying an older generation fails closed with `409 inference_admission_policy_stale`, and the projection is repaired under `waitUntil`.\n  - Aged snapshots, held orgs and subscribers without published capacity take the authoritative path.\n  - Documented residual: a policy or balance write that has not yet been republished is visible to the DO only after the snapshot max age (the auth-context TTL).\n- **(c)** The production strong-revocation (#30796) canary procedure is documented in `wrangler.toml`. Production is not flipped.\n- Remaining: the live Worker→Cerebras trace and certification, the staging soak of snapshot admission, and the production canary.\n\n## #16420 — mobile auth (Refs #16420)\n- **(a)** Already enabled; evidence only. `wrangler.toml` and the GitHub environment variable are both `true`. `GET /api/v1/app-auth/mobile/config` returns the registered client on `api.eliza.app` (production) and on `api-staging.eliza.app` (staging).\n- **(b)** App Store iOS builds are Cloud-only by default.\n  - The store lane bakes `VITE_ELIZA_IOS_RUNTIME_MODE=cloud` and omits the on-device engine. `ELIZA_IOS_APP_STORE_LOCAL_RUNTIME=1` is the explicit opt-in to cloud-hybrid; dev overrides still win.\n  - The store publish workflow no longer forces cloud-hybrid plus the full Bun engine.\n  - Such a renderer brands cloud-only before boot, so onboarding and settings hide local runtimes.\n- **(c)** Verified, no mismatch. The live `https://eliza.app/.well-known/apple-app-site-association` is served as `application/json`, with `applinks` and `webcredentials` for `25877RY2EH.ai.elizaos.app` and `/auth/callback`. That matches:\n  - the pbxproj team and bundle IDs;\n  - `App.entitlements`;\n  - the reviewed entitlement allowlist;\n  - the `ElizaCloudAuthSessionPlugin` callback.\n- Remaining: clean-install runs on iOS and Android devices, and the app visual audit on a device build.\n\n## #29921 / #22934 — connector cutover guarantees (Refs #29921)\nDecision (delegated): during cutover, ingress is held until Dedicated is attested. No message is dropped or delivered twice.\n- **Cloud:** the Shared seal (423) and the committed cutover (409) now become a typed `PersonalCutoverHoldError`. Before this, they surfaced as a 500 and as a terminal conflict. The route returns them as a retryable `503 personal_cutover_in_progress` with `Retry-After`.\n- **Gateway:** for acknowledged-before-processing providers (Blooio, Twilio), a held turn is persisted durably in Redis instead of being reopened and lost.\n  - It is stored as a record plus a sorted-set index, and its dedup key is marked \"held\".\n  - A leased drainer redelivers it with the original message id until Cloud accepts it, then records the delivery once.\n  - The one-hour budget expires to visible failure handling.\n- Remaining: the live Shared→Dedicated composed transition through a real provider.\n\n## #29919 / #22787 — staging Blooio isolation (Refs #29919)\nDecision: staging gets its own Blooio account, number and signing secret. Distinct signing secrets key each environment's webhooks.\n- **Runtime guards:** a non-production gateway or Worker disables Blooio when its sender is a production line. It also ignores any message addressed to a production line.\n- Removed the non-production fallback to the production sender.\n- **Deploy-time check:** added to the Cloud release and gateway deploy workflows. It reports an error annotation now; switch it to `--enforce` once staging is provisioned.\n- Remaining (operator): provision the staging account, number, webhook and secret; record the owner and rotation procedure.\n\n## Verification\nTests were run one file at a time.\n- `packages/cloud/shared`:\n  - `bun test src/lib/services/subscriber-inference-funding.pglite.test.ts`: 9 pass.\n  - `subscription-allowance-lifecycle.pglite`: 8 pass.\n  - `subscription-reconciliation.pglite`: 20 pass.\n  - `subscription-funding-transaction.pglite`: 32 pass, 19 skipped.\n  - `subscription-funding-debit-boundaries`: 4 pass.\n- `packages/c st chain.\n- Memory stays bounded at one 1 MiB segment plus one frame. No archive is built in memory.\n- Sizes are checked from `stat` before anything is streamed. Anything over the capture-v2 limits (1 GiB plaintext, frame and file counts) still returns the structured 413 through the same typed error, so the route and UI need no changes.\n\n**Encryption is preserved.**\n- Each backup gets its own AES-256-GCM data key, wrapped by the existing `agent-backup` KMS system key.\n- The body is encrypted in 1 MiB segments. Each segment's AAD covers the header, the segment index, the final flag and the trailer, so truncating, reordering or editing the archive makes decryption fail.\n- Listing reads only the plaintext header and trailer.\n\n**Restore** (`restoreLocalAgentBackup` picks v1 or v2 from the file extension):\n1. Authenticates and parses the whole archive into a temp staging dir under `backups/`, checking every frame and component digest.\n2. Recreates the empty PostgreSQL layout directories, checks `PG_VERSION`, and opens the staged database with PGlite.\n3. Only after all of that does it stop the runtime.\n4. Swaps the PGlite dir, media and `.vault-pglite` as whole directories, and state and vault files one by one. Every rename is journaled. If any step fails, the journal is replayed in reverse and the live data is left as it was.\n\n**Listing, pruning and retired-archive review/purge** handle both formats. Review decrypts and authenticates the whole v2 archive, and purge hashes files in streaming fashion.\n\n### Verification\n- `bunx vitest run test/local-backup-v2-restore.test.ts` (new, real HTTP host plus filesystem PGlite): 4/4 pass.\n  - A small agent still gets v1.\n  - A 144 MiB agent gets a v2 archive. The test checks the magic bytes, 0600 permissions, that a plaintext canary is absent, and that listing shows both formats.\n  - A corrupted archive is rejected with the runtime still running and no data changed.\n  - An injected swap failure (a read-only directory) rolls back the database, media and state.\n  - Restore over HTTP brings back byte-identical media and state and the database rows as they were at backup time.\n- `bunx vitest run test/backup-capture-http.test.ts`: 3/3 pass. The 413 case now uses a 1.5 GiB sparse file (the v2 limit), because 200 MiB is now backed up successfully.\n- `plugins/plugin-sql`: `src/__tests__/pglite-adapter-liveness.test.ts` 2/2 pass.\n- `tsc --noEmit` passes for both `packages/agent` and `plugins/plugin-sql`. Biome is clean on the changed files. The 36 warnings from the package-wide agent `lint:check` all come from files this PR doesn't touch.\n- The repo-wide `bun run verify` was not run because the shared machine is overloaded.\n\n### Crash recovery (second commit)\n- Each restore writes a durable journal to its `backups/.restore-*` directory. The journal moves through three phases: `staging`; `swapping`, which records the full move plan before the first rename; and `committed`. Each phase is fsynced when it is written.\n- An in-process swap failure now rolls back with the same journal algorithm that runs at startup.\n- `startEliza` calls `recoverInterruptedLocalBackupRestores()` before it loads the config or opens PGlite:\n  - a `swapping` journal is rolled back to the previous data;\n  - a `committed` journal is rolled forward (only the work files remain to remove);\n  - staging-only work is discarded.\n  Each outcome is logged with the structured logger, and the work directory is removed afterwards.\n- The crashed restore leaves its backup-authority claim behind. Recovery releases it only when that journal names the claim's operation id and the owner process no longer exists. If another live process holds the claim, recovery is skipped with a warning. A dead claim that no journal names returns the typed error `AGENT_BACKUP_RESTORE_RECOVERY_BLOCKED`.\n- Two new crash-injection points drive a real child-process crash in the test: `backup-restore-swap`, which hard-exits after the database and media are swapped, and `backup-restore-commit`. After each crash the test runs recovery, the step the next startup performs. It checks that the database rows, media and state are rolled back or forward, that the claim is released, and that authority-guarded work proceeds.\n- A Postgres agent over the ceiling still gets the typed 413. The error now says explicitly that v2 local backup supports PGlite only, and the body includes `streamedBackupSupported: false`.\n\nAdditional verification: `local-backup-v2-restore.test.ts` passes 5/5 (including the crash test), `backup-capture-http.test.ts` 3/3, and `connector-credential-durable.test.ts` 2/2 (a real `startElizaProcess` boot through the new startup hook). `tsc` passes and Biome is clean on the changed files.\n\n### Remaining\n- Postgres-backed agents above the in-memory ceiling get the explicit 413; v2 supports filesystem PGlite only.\n- The Postgres 413 wording has no automated test, because the harness has no Postgres runtime.\n- The native app still needs to be rebuilt and a backup/restore confirmed there, as the issue asks.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n"])</script><script>self.__next_f.push([1,"22:T188a,"])</script><script>self.__next_f.push([1,"Two trackers: the sandbox backup/restore epic (#20726) and exact-source staging certification (#29922). Both remain open; this PR delivers the code-completable slices. **No migrations added.**\n\n## #20726 — durable sandbox backup/restore (Refs #20726)\n\n### Restore re-land dropped\nThe re-land of #30820 was dropped from this PR. `dce4782e17` deliberately retired the manifest-v3 candidate-filesystem substrate (see `packages/agent/FOOTPRINT-REVIEW.md`: unfinished staging machinery with no callers), and re-landing it without a production caller would reverse that decision. #20732 stays open on that basis.\n\n### Local-state upgrade guard\n`fix(cloud): refuse blue/green upgrades that would strand local agent state`\n\nThe tion.** `test(app): validate browser MP4 evidence with ffprobe before labeling it` (Refs #29774)\n  - An MP4 is labeled `video/mp4` only after ffprobe checks the container, one H.264 yuv420p stream, positive duration, and that the bytes did not change during the probe.\n  - #29773's formal supervisor lane (#29600) is not on develop, so it has no call site.\n- **Launch gate.** `ci: add composed exact-SHA staging launch gate workflow`\n  - `staging-launch-gate.yml` is `workflow_dispatch`-only with `contents: read`, and runs a read-only preflight.\n  - Lanes, in order:\n    - front door (release-authority drift plus Steward discovery);\n    - first turn and reload (the deployed-renderer spec);\n    - messaging (Telegram gateway preflight plus `getMe`);\n    - routing (`verify-environment-routing --require-beacon`).\n  - `launch-gate-receipt.ts` writes closed, privacy-safe receipts per lane and composed. They are pinned to the source and deployed SHAs and name the owning tracker on failure. **Not dispatched against staging.**\n- **Already fixed:**\n  - #30375 is fixed by #30417 and #30672. It still needs one authorized deployed-renderer run.\n  - #30020 is fixed by #30021.\n\n## Verification\n- Typecheck passes for core, agent and cloud-shared.\n- Biome is clean on the changed files.\n- The local-state upgrade guard test passes 2/2 and fails with the guard disabled.\n- #29922 tests: 79 + 28 pass, the ffmpeg test passes 3/3, and actionlint is clean.\n- Agent restore suites are not part of this PR anymore.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n"])</script><script>self.__next_f.push([1,"23:T1dde,"])</script><script>self.__next_f.push([1,"Two issues, one commit each. Both are partial: the code-completable work is here, and what still needs staging or production is listed under each issue. The commits use `Refs`, so merging does not auto-close either issue.\n\n## #30806: subscriber admission off the synchronous funding path (partial)\nRefs #30806\n\nBefore this change, every subscription-funded Worker request ran `reserveSynchronously(params, true)` before provider dispatch. That call is a locked primary transaction that allocates allowance and can also debit purchased credit. After this change, token-priced subscriber requests on the Worker take the Durable Object lease lane:\n\n- **Admission:** reads funding capacity (purchased credit plus spendable allowance) inside the existing policy transaction and reuses that transaction's balance, revision and clock. It then leases that capacity in the organization's admission Durable Object, which serializes every in-flight estimate and runs the fused credential check.\n- **After the provider responds:** `fundSubscriberInferenceCharge` funds the exact charge, allowance first, in one primary transaction. That transaction also reads the post-accounting capacity, so settling the gate needs no balance readback.\n- **Alarm recovery:** replays the same `inference-gate:\u003crequestId\u003e` funding key, so a lease recovered after a lost settlement is never funded twice.\n- **Zero-collected replay:** settlement now persists a durable zero-collected receipt (migration `0493`) while retaining the actual cost. Replaying an earlier unfunded turn cannot charge newly added funds or substitute a later lease estimate. Real database regression coverage exercises the replay boundary.\n\n**How overspend is prevented**\n- **Revision:** migration `0491` advances `organizations.balance_revision` on every platform allowance transaction. Allowance-only spend, grants, releases and expiry therefore all look newer to the gate.\n- **Ceiling view:** the gate ledger records whether its ceiling is credit only or funding capacity (`balanceView: \"funding\"`).\n  - At an equal revision, the funding view replaces a credit-only observation.\n  - A newer revision always wins.\n  - Two observations of the same view can only lower the ceiling.\n  - A lease must carry the funding view exactly when its recovery accounting is `subscription_funding`.\n  - The view field is additive, so a rollback reads the ledger conservatively.\n- **Settlement:** caps the charge at the capacity available under the organization lock. Any remainder is reported as `uncollected_overage` and is never overdrawn, which matches the synchronous lane's policy.\n\n**Unchanged:** affiliate-marked, flat-priced (pending video) and non-Worker subscriber requests keep the synchronous reservation.\n\n**Folded micro-issues**\n- **#30724 (done):** `requireInferenceApiKeyWithOrg` now resolves key, user and organization with one primary statement. Rejection classes, messages and order are unchanged. Timing is now a single `auth_identity` hop, and the latency script is updated to match.\n- **#30715 (done):** as described above.\n- **#30860, #30865, #30718, #30722 (already fixed on develop):**\n  - #30860: the skip-mode memo write is gated in `steward-client.ts`.\n  - #30865: the affiliate settlement publishes its transaction's balance and revision.\n  - #30718: the policy statement already reads balance and revision.\n  - #30722: the aged deferred refresh landed in #32834.\n- **#30796 (remaining):** enabling `INFERENCE_STRONG_REVOCATION_ENABLED` in production needs the staging allow/deny/revoke canary and a normal release. This PR does not change it.\n\n**Remaining**\n- The policy-read and dispatch-policy transactions still run before dispatch. They were already there, so the zero pre-dispatch DB goal is still not met.\n- Live Worker-to-Cerebras certification and the traces for the exact deployed revision.\n- #30796, above.\n\n## #22552: first-turn warming 503s (partial)\nRefs #22552\n\nPartial work landed in #32834, which added the session-start prewarm and the keepwarm conversation-object leg for Personal Shared rooms. This PR adds three things.\n\n**Bounded join instead of an immediate warming 503**\n- The conversation Durable Object's history hydration, the linked-character cache and the combined admission snapshot now wait up to 4s for their in-flight hydration before failing.\n- Hydration that is slower than that, or that fails, still fails closed with the same retryable warming signal. The hydration keeps running under `waitUntil`.\n\n**Keep-warm for rowless Personal Shared identities**\n- A canonical personal turn records its verified owner in its conversation object. A forged projection, whose id is not derived from its account, is ignored.\n- The room prewarm reports that organization, and the cron then warms the organization's rate-limit gate once per sweep. The namespaced id is never sent to a UUID lookup.\n\n**Terminal transcript (#27685)**\n- The startup/recovery restore (`hydrateInitialConversation`) wrote its server snapshot straight into the transcript, bypassing the local-turn overlay.\n- A restore that landed while a send was absorbing warming retries evicted the pending turn. The next overlay capture then retired that turn for good, so the receipt had nothing left to re-anchor.\n- The restore now merges through the same overlay reconciliation that history loads use. A regression test that uses the real `useChatSend`, `useDataLoaders` and `hydrateInitialConversation` reproduced the staging signature before the fix.\n\n**Remaining**\n- The 503-rate and time-to-first-reply re-measurement, with a sample size stated in advance.\n- The canonical deployed staging run showing the anchored terminal turn.\n- #27685 receipt and reconciliation counters: the app exposes no signal to count from yet.\n\n## Verification\n- `bun test src/lib/services/subscriber-inference-funding.pglite.test.ts` (new, real subscription migrations plus `0177` and `0491` on PGlite): 5 pass.\n- `bun test src/lib/services/inference-api-key-auth.pglite.test.ts` (new): 3 pass.\n- `bun test src/lib/services/subscription-funding-debit-boundaries.test.ts src/lib/services/subscription-allowance-lifecycle.pglite.test.ts`: 12 pass.\n- `bun test __tests__/inference-admission-gate.miniflare
