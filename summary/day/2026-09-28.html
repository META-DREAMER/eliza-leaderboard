},{\"id\":\"PR_kwDOMT5cIs8AAAABFhLn7w\",\"title\":\"test(ui,assistant): pin the #30330 guards that no test discriminates\",\"author\":\"kenjohnscreates\",\"number\":32898,\"body\":\"$36\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T14:47:35Z\",\"mergedAt\":\"2026-09-29T19:04:54Z\",\"additions\":211,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABFlhrHw\",\"title\":\"chore(deps): bump the npm_and_yarn group across 9 directories with 4 updates\",\"author\":\"dependabot\",\"number\":32906,\"body\":\"$37\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T22:06:34Z\",\"mergedAt\":\"2026-10-01T13:10:19Z\",\"additions\":188,\"deletions\":64},{\"id\":\"PR_kwDOMT5cIs8AAAABFbzk4w\",\"title\":\"fix(assistant): require evaluator reply field in stable schema\",\"author\":\"NubsCarson\",\"number\":32888,\"body\":\"$38\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T05:29:28Z\",\"mergedAt\":\"2026-09-28T15:07:45Z\",\"additions\":157,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABFl9MxA\",\"title\":\"fix(cloud): require settled refunds and atomic media quota release\",\"author\":\"lalalune\",\"number\":32915,\"body\":\"A quoted or failed crypto payment could issue refund credits without confirmed settlement. Media deletion also committed its terminal status before releasing storage usage, leaving no retry after a database failure. This follow-up to #32910 requires a confirmed settlement receipt for refunds, commits media deletion and quota release together, and preserves retryability when object deletion fails.\\n\\nFailed media writes now compensate through the same quota owner that reserved the bytes. Crypto checkout validation rejects fractional cents and non-finite amounts before quoting a payment.\\n\\nValidation: 4 real PGlite refund tests, 7 media/storage tests including transaction rollback and replay, 6 purchased-credit/API-key rate-limit tests, 22 Miniflare admission tests, and the crypto amount boundary test. Repository `bun run verify` passed (284 tasks and the subsequent repository audits); live payment/provider acceptance is outside these local checks.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T23:03:02Z\",\"mergedAt\":\"2026-09-29T19:10:55Z\",\"additions\":156,\"deletions\":53},{\"id\":\"PR_kwDOMT5cIs8AAAABFby69g\",\"title\":\"fix(calendar): reuse listed source preference snapshots\",\"author\":\"NubsCarson\",\"number\":32887,\"body\":\"$39\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T05:27:40Z\",\"mergedAt\":\"2026-09-28T15:13:31Z\",\"additions\":145,\"deletions\":25},{\"id\":\"PR_kwDOMT5cIs8AAAABFaZekg\",\"title\":\"fix(cloud): keep core runtime barrel out of Worker startup graph\",\"author\":\"lalalune\",\"number\":32878,\"body\":\"$3a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T01:32:17Z\",\"mergedAt\":\"2026-09-28T01:40:28Z\",\"additions\":121,\"deletions\":34},{\"id\":\"PR_kwDOMT5cIs8AAAABFcMOxw\",\"title\":\"fix(calendar): omit exact duplicate extraction routing hints\",\"author\":\"NubsCarson\",\"number\":32889,\"body\":\"$3b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T06:25:36Z\",\"mergedAt\":\"2026-09-28T15:12:16Z\",\"additions\":116,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABFbPOug\",\"title\":\"fix(notes): explain canonical content in model-facing results\",\"author\":\"NubsCarson\",\"number\":32882,\"body\":\"$3c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T04:01:40Z\",\"mergedAt\":\"2026-09-28T15:10:23Z\",\"additions\":93,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABFhyFfQ\",\"title\":\"test(agent): verify local backup artifacts restore files and database\",\"author\":\"lalalune\",\"number\":32899,\"body\":\"$3d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T15:39:52Z\",\"mergedAt\":\"2026-09-29T18:35:26Z\",\"additions\":92,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABFZfxBQ\",\"title\":\"fix: keep unavailable backend out of ready state\",\"author\":\"lalalune\",\"number\":32873,\"body\":\"$3e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-27T22:35:21Z\",\"mergedAt\":\"2026-09-28T02:49:03Z\",\"additions\":91,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs8AAAABFkWOgA\",\"title\":\"test(cloud-e2e): replay a request once after the local ProxyWorker drop\",\"author\":\"lalalune\",\"number\":32901,\"body\":\"$3f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T19:59:30Z\",\"mergedAt\":\"2026-09-28T20:22:51Z\",\"additions\":81,\"deletions\":15},{\"id\":\"PR_kwDOMT5cIs8AAAABFkyxmA\",\"title\":\"fix(android): restore develop's mobile bundle and Play cloud build\",\"author\":\"fadhelcarlos\",\"number\":32902,\"body\":\"$40\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T20:44:49Z\",\"mergedAt\":\"2026-09-29T18:32:56Z\",\"additions\":78,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABFlujNg\",\"title\":\"fix(alpha): bind pairing to the verified device instance\",\"author\":\"lalalune\",\"number\":32912,\"body\":\"Alpha pairing could validate one device instance and then send the pairing request after the status endpoint switched identities. Bind the pairing exchange to the verified instance and reject the mismatch before sending credentials.\\n\\nAlso create the documented render output directory securely and resolve the offline integration dependencies from source for clean verification. Follow-up to #32904, which merged during review.\\n\\nValidation: 8 pairing UI tests, 12 host/white-label tests, 4 agent integration tests, actual render CLI smoke, and `bun run verify` passed with Bun 1.4.2 / Node 24.15.0. Live dstack provisioning and physical-phone acceptance were not performed.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T22:32:00Z\",\"mergedAt\":\"2026-09-29T18:35:07Z\",\"additions\":67,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABFmABMw\",\"title\":\"fix(agent): await owner conversation setup for concurrent deliveries\",\"author\":\"lalalune\",\"number\":32916,\"body\":\"Concurrent owner-directed deliveries could read a conversation registered in memory before its room setup finished. This follow-up to #32913 checks the pending creation before selecting a conversation, so every caller waits for the same durable setup.\\n\\nThe regression holds a real SQLite runtime's connection setup open, starts a second caller, and verifies it cannot resolve early. It fails on the original implementation and passes with this change; the existing full scheduling-to-chat delivery/replay test also passes. Repository `bun run verify` passed (284 tasks and repository audits). Includes the source-resolution aliases already proposed in #32912 so this branch can be validated independently.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T23:08:49Z\",\"mergedAt\":null,\"additions\":64,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABFamuVA\",\"title\":\"test(cloud): model the payment-reversal hold boundary in paid-admission harnesses\",\"author\":\"lalalune\",\"number\":32881,\"body\":\"$41\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T02:08:03Z\",\"mergedAt\":\"2026-09-28T02:48:16Z\",\"additions\":60,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABFaBOCQ\",\"title\":\"registry: add @unbrowse/plugin-unbrowse (third-party)\",\"author\":\"lekt9\",\"number\":32875,\"body\":\"$42\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T00:17:19Z\",\"mergedAt\":null,\"additions\":56,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABFbi5rw\",\"title\":\"test(scenarios): assert evaluator restoration eligibility in the decision state\",\"author\":\"lalalune\",\"number\":32885,\"body\":\"$43\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T04:50:09Z\",\"mergedAt\":\"2026-09-28T05:25:45Z\",\"additions\":16,\"deletions\":8},{\"id\":\"PR_kwDOMT5cIs8AAAABFlrOZw\",\"title\":\"style: apply biome formatting to the eliza-app config and Android hardware targets\",\"author\":\"lalalune\",\"number\":32911,\"body\":\"`canonical / Quality` failed on develop `3c2fbd0a5e` (run 36490504806, job 109158561478). The failing step was `@elizaos/cloud-shared` `lint:check`, a formatter error in `src/lib/services/eliza-app/config.ts` left by a3d7c4d3015. It is still present on develop `4778fe302d`.\\n\\nThis PR applies biome's formatting to that file and to `packages/os/android/hardware-targets.json` (aa25d612d7b), which has the same drift. It is formatting only, with no semantic changes.\\n\\n**Verified:**\\n- `bun run lint:check` in `packages/cloud/shared`: 0 errors.\\n- biome check on all 81 files changed on develop since 279e585dd8: clean apart from pre-existing warnings.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T22:25:10Z\",\"mergedAt\":\"2026-09-28T22:46:49Z\",\"additions\":11,\"deletions\":33},{\"id\":\"PR_kwDOMT5cIs8AAAABFaS6YA\",\"title\":\"test(ui): stabilize invite validation effects\",\"author\":\"lalalune\",\"number\":32877,\"body\":\"$44\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T01:12:44Z\",\"mergedAt\":\"2026-09-28T02:48:57Z\",\"additions\":7,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABFZ_J7Q\",\"title\":\"test(ui): unmount the invite page after each test\",\"author\":\"lalalune\",\"number\":32874,\"body\":\"`canonical / Tests (client)` failed on develop (Validate develop run 36357758891, 5a130919a6). All 5379 ui tests passed, but Vitest caught one unhandled error from `invite-accept-page.test.tsx`: `ReferenceError: window is not defined`, thrown by React's scheduler after jsdom teardown.\\n\\n`packages/ui` runs Vitest with `globals: false`, so Testing Library does not register its automatic cleanup. This test never unmounted the page, so its pending effects outlived the environment. Adding `afterEach(cleanup)` follows the pattern the other ui tests use.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T00:12:03Z\",
