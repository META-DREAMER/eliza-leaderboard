yed the connection deep link.\n\nThis change preserves accepted turns across transport disconnects, maintains paired-session authority through completion, persists terminal generation outcomes for reconnect, and binds pairing retries to the server and entered code. Credential persistence can retry without consuming the one-time code again; same-target deep-link replay preserves the paired session. Unpaired disconnected requests retain their cancellation behavior.\n\nValidation at integrated head `d172d7226a8e9b5b63f6eff7cc8a89a2ea8a7f12`: seven UI suites passed 194 tests, integrated agent pairing/readiness/failure-persistence suites passed 13 tests, and changed-file Biome passed. Full `bun run verify` passed 284/284 tasks and all final audits. The renderer build and full app capture passed 218/218 browser tests; all 24 manually flagged images plus desktop/mobile chat were inspected without a visual regression. Packaged OCR verified 208 views, zero broken, with four native-camera exemptions. Current-head hosted run 36630602979 passed all four checks; an additional Source checks rerun in 36628735628 is still running. The earlier renderer timeout is retained as a failed attempt, recovered by the completed renderer build and capture. These are source and browser-fixture results; this revised branch has not been installed on a physical phone.\n\n"])</script><script>self.__next_f.push([1,"17:T89e,"])</script><script>self.__next_f.push([1,"Depends on #32931 (saved-reminder presentation). This independently stacked draft contains only the 17-file absolute task-wake change, without the one-shot escalation, Automations UI or extractor-context changes.\n\nReminder deadlines previously waited for the next roughly minute-long LifeOps maintenance pass. Let the existing task request an absolute wake, retaining the existing one-second core poll and task identity. SQL-backed adapters atomically keep the earliest deadline and increment a revision; completion consumes only the revision observed before execution, preserving concurrent earlier/equal requests. Pause, failure backoff and delivery eligibility remain authoritative.\n\nLifeOps reconciles committed create/update/snooze changes, then derives the next deadline from the same effective plans, occurrences and attempts already used for dispatch. No second history scan, scheduler or queue is added. The wake mechanism introduces no model invocation; ordinary worker work still runs on each added pass. SQLite/custom adapters without atomic support explicitly retain ordinary cadence.\n\nCost: relevant mutations add an immediate reconciliation pass and atomic wake write; distinct deadlines may add further maintenance passes. Idle processing retains base cadence. Domain commit and wake write are separate, so crash recovery, processing limits, quiet gates or a busy worker can still delay delivery. Virtual-clock timing is not a live latency guarantee. No one-second delivery SLA is claimed.\n\nNormal PR Validation does not automatically run on this feature-branch base. Full exact-head CI and live acceptance remain pending.\n\nValidation on this independent stack: 31 focused tests passed (12 core wake/pause cases, 3 real SQL atomic-boundary cases, 13 personal-assistant unit/scheduler cases, 3 real reminder integrations). Covers equal-time/earlier request races, restart and passed-during-work deadlines, unsupported adapters, failure/pause precedence, malformed metadata, exact reminder-step identity, snooze and quiet-blocked no-spin behavior. Core build, core/SQL/personal-assistant typechecks, 17-file Biome and diff checks passed. No paid or live delivery test was run for this draft.\n"])</script><script>self.__next_f.push([1,"18:T76c,"])</script><script>self.__next_f.push([1,"Depends on #32931 (grounded saved-reminder presentation); this draft is stacked on its branch and contains only the three-file one-shot follow-up correction.\n\nA saved one-time owner reminder could deliver its configured notificati verify` passed on the combined head (284 tasks and repository audits). Live provider cutover and native iOS acceptance remain separate deployment checks.\n24:T1e98,"])</script><script>self.__next_f.push([1,"# Relates to\r\n\r\n#32905 added the durable cutover hold (#22934), and it merged today. `drainCutoverHolds` promises that \"a per-hold lease keeps replicas from running the same turn concurrently\", but that only holds while a redelivery finishes within one lease period.\r\n\r\n`packages/cloud/services/gateway-webhook/src/cutover-hold.ts` on develop does three things:\r\n\r\n- It takes `SET NX EX 180` on `webhook:cutover-hold-lease:\u003cdedupKey\u003e`.\r\n- It awaits `handlers.redeliver(held)`. That is `redeliverHeldWebhook` → `processMessage` → `sendPersonalSharedReply`, which runs a full Personal Shared turn: up to `PERSONAL_SHARED_TURN_TIMEOUT_MS = 15 * 60_000` per attempt (`webhook-handler.ts:78`), with up to `PERSONAL_SHARED_ATTEMPTS = 3` attempts.\r\n- It always runs `finally { await redis.del(leaseKey) }`.\r\n\r\nThe hold stays due in `webhook:cutover-holds` while it is being redelivered, and every replica polls every 2 s (`index.ts:256`, `CUTOVER_HOLD_DRAIN_INTERVAL_MS = 2_000`). `draining` only stops new drains, so during a rolling deploy the old pod keeps its in-flight redelivery while the new pod polls. So:\r\n\r\n1. **Duplicate turn:** once a redelivery runs past 180 s, another replica re-acquires the lease and delivers the same held turn again.\r\n2. **Lease stolen on release:** the first drainer's unconditional `del` then deletes the second drainer's lease, so a third can join.\r\n\r\n`redeliverHeldWebhook` calls `processMessage` directly, so the ingress-side processing claim does not protect this path. The user receives the reply twice. On private Blooio/Twilio replies the gateway has no egress lease.\r\n\r\n# Change\r\n\r\n`drainCutoverHolds` (`cutover-hold.ts`):\r\n\r\n- The lease value is a per-drain `randomUUID()` token.\r\n  - Before, it was `String(now)`, and the Redis adapters JSON-parse reads, so that value came back as a number.\r\n- While the redelivery runs, the lease is renewed every third of its period. Renewal stops, with a warning, if the lease is no longer ours. A failed renewal is logged and retried on the next tick.\r\n- The lease is released only if we still own it.\r\n- `options.leaseSeconds` (default 180, unchanged) lets tests outlive a lease in real time.\r\n- **Crash recovery is unchanged:** a dead drainer's lease still lapses within one period.\r\n- Renewal and release are atomic compare-and-act operations: `GatewayRedis.expireIfEquals` / `delIfEquals`, each a single server-side Lua script on the ioredis, ioredis-mock and Upstash adapters.\r\n  - A GET-then-act check (the first revision) left a one-round-trip gap in which the lease could change hands. Thanks @ss251.\r\n  - The hand-written `MemoryRedis` fake in `personal-private-egress.test.ts` implements the two methods too.\r\n\r\n# Testing\r\n\r\n- [x] Targets `develop` and has no conflicts with the latest `origin/develop`.\r\n- [ ] Ran `bun install` and `bun run verify` after syncing; record blockers below.\r\n- [ ] Updated relevant documentation.\r\n\r\nThis used Ubuntu 24.04 (WSL2), Bun 1.4.2 and `bun install --frozen-lockfile` on develop `3c2fbd0a5e`.\r\n\r\n**Reproduced on develop (unmodified).**\r\n- A throwaway test (not committed) drove the real `handleWebhook` → hold → `drainCutoverHolds` → `redeliverHeldWebhook` path against a local Cloud route, with the Blooio provider API substituted.\r\n- The Cloud route deletes the lease key while the attested turn runs, to stand in for the 180 s lease lapsing.\r\n- A second drainer then delivered the same turn:\r\n\r\n```\r\nfirst {\"delivered\":1,...} second {\"delivered\":1,...} cloudTurns 2 providerSends 2\r\n(fail) develop: a lapsed lease lets a second replica deliver the same held turn\r\n```\r\n\r\n**New tests** in `__tests__/cutover-hold.test.ts` use the same real handler, drainer and Redis path as the existing cutover tests (in-memory Redis; only the Blooio API is substituted):\r\n\r\n- *a redelivery that outlives one lease period is not run again by another replica*:\r\n  - Setup: lease is 1 s, the attested turn takes 2.5 s, and a second drainer runs at 1.5 s.\r\n  - Expected: the second drain is a no-op, and there is exactly 1 new Cloud turn, 1 provider send, and ledger `delivered`.\r\n- *a drainer releases only its own lease*:\r\n  - Setup: another replica's token replaces the lease mid-turn.\r\n  - Expected: finishing leaves it intact. **Fails on develop** (`Expected: \"other-replica-lease\"`, the lease was deleted).\r\n\r\nA new contract test runs `delIfEquals` / `expireIfEquals` through the in-memory adapter, which executes the real Lua scripts. It checks that a lost lease cannot extend or delete another owner's lease, while the owner can do both.\r\n\r\n`bun test __tests__/` (gateway-webhook) on this head: **14 pass, 0 fail across 4 files**. Each lease test fails when its half of the fix is removed:\r\n\r\n| Sabotage | Result |\r\n| --- | --- |\r\n| Renewal disabled | \"outlives one lease period\" fails (a second delivery happens); the others pass |\r\n| Unconditional `del(leaseKey)` restored | \"releases only its own lease\" fails; the others pass |\r\n\r\nAlso run: `tsc --noEmit` (gateway-webhook) passes, and `biome check` on both files is clean.\r\n\r\n# Evidence Gate\r\n\r\n\u003c!-- evidence-head:eb45a423546dcfa48514a07d4253f0466d3edd0f --\u003e\r\n\r\n\u003c!-- evidence-row:before-screenshots --\u003e\r\n- [x] N/A - gateway service change; no rendered UI surface.\r\n\u003c!-- evidence-row:after-screenshots --\u003e\r\n- [x] N/A - gateway service change; no rendered UI surface.\r\n\u003c!-- evidence-row:walkthrough-video --\u003e\r\n- [x] N/A - no UI flow; the webhook → hold → drain → redelivery path is exercised by the tests above.\r\n\u003c!-- evidence-row:backend-logs --\u003e\r\n- [x] Backend logs: develop reproduction h, `startsWith(`${name}/`)`). Both subpaths therefore resolved to the browser stub, which exports none of the crypto or cloud-endpoint symbols.\r\n\r\nThe mobile graph needs them. `packages/app/src/mobile-agent-entry.ts` registers `@elizaos/app/mobile-remote-target` (also `aospCore` in `packages/agent/src/runtime/core-plugins.ts:126`). That plugin imports the electrobun remote-target executor/rpc → `remote-target-runner.ts` → `remote-control-crypto`, and `packages/ui/src/api/client-cloud.ts` imports `direct-cloud-endpoints`.\r\n\r\nNo CI job runs `build:mobile` except the manual `android-build.yml`, which has no runs, so the break is invisible to develop CI.\r\n\r\nOnce `build:mobile` builds again, `build:android:cloud(:debug)` still fails its own Play audits on develop. These fail for the same reason: nothing runs this path in CI.\r\n\r\n1. **Pre-gradle audit**: `capacitor.plugins.json packages differ from the Play allowlist`. `@elizaos/capacitor-network-policy`, added by `2e894ceebe` for on-device model downloads, is neither allowlisted nor stripped.\r\n2. **Artifact audit** (`ANDROID_PLAY_MANIFEST_ALLOWLIST_FAILED`): the password-manager bridge added in `04c5080663` leaks into the Play manifest. That means `PasswordsActivity`, `BrowserNativeMessagingService` and its `org.chromium.chrome...NATIVE_MESSAGING` action, `USE_FULL_SCREEN_INTENT`, and `\u003cqueries\u003e` packages `com.onepassword.android`, `com.x8bit.bitwarden` and `org.chromium.chrome`.\r\n\r\n# Change\r\n\r\n`build-mobile-bundle.ts` resolves the six platform-neutral remote-control protocol modules to source: `crypto`, `controller`, `runtime-store`, `secure-store-contract`, `cloud-client`, `cloud-endpoints`.\r\n\r\n- Their imports are only `node:crypto`, `@elizaos/core`, `@elizaos/core/contracts/remote-control` and `@elizaos/plugin-elizacloud/cloud-config/domain-contract`. I checked each file's imports.\r\n- The longer alias wins over the `@elizaos/plugin-browser` stub.\r\n- `remote-control/browser-controller` stays stubbed: it imports `../browser-service` and `../targets/remote-device-target`.\r\n- The plugin root and all other subpaths are unchanged.\r\n\r\n**Android Play cloud policy** (`packages/app/scripts/mobile/android/cloud-policy.ts`, `strip.ts`):\r\n\r\n- `@elizaos/capacitor-network-policy` joins `ANDROID_CLOUD_STRIPPED_NATIVE_PLUGINS`.\r\n  - It serves on-device model downloads: only `ElizaAgentService` and `ElizaBionicInferenceServer` use it natively, and both are already stripped.\r\n  - The JS side is a bare side-effect import in `native-plugin-entrypoints.ts`, next to other stripped plugins (camera, canvas, appblocker, bun-runtime).\r\n- `PasswordsActivity` and `BrowserNativeMessagingService` join `ANDROID_CLOUD_STRIPPED_COMPONENTS`, and their Java sources join `ANDROID_CLOUD_STRIPPED_JAVA_FILES`.\r\n  - `CredentialManagerPlugin.java` is stripped too. Its only behavior is starting `PasswordsActivity`, and nothing in the cloud tree registers it.\r\n- `ANDROID_CLOUD_STRIPPED_QUERY_PACKAGES` (Chromium placeholder, Bitwarden, 1Password, healthdata) replaces the one-off healthdata `\u003cqueries\u003e` regex in `strip.ts`.\r\n- `ANDROID_CLOUD_MANIFEST_MERGER_REMOVED_QUERY_PACKAGES` adds a `tools:node=\"remove\"` marker for `${elizaChromiumPackageName}`, because the kept `plugin-native-browser-surface` library re-adds it through manifest merge (same pattern as `ANDROID_CLOUD_MANIFEST_MERGER_REMOVED_PERMISSIONS`).\r\n- **Bug fix:** `ANDROID_CLOUD_STRIPPED_PERMISSIONS` listed `\"android.permission.USE_FULL_SCREEN_INTENT\"`, while `removeAndroidPermissionRequests` prepends `android.permission.`. The entry never matched, so the permission always leaked. It is now `\"USE_FULL_SCREEN_INTENT\"`.\r\n- The Play allowlists themselves are unchanged (the manifest `queryPackages` allowlist is still `[]`).\r\n  - Everything above makes the cloud build meet the existing policy.\r\n  - Allowing the password-manager surface in the Play client would be a separate product ":18},{\"area\":\"agent\",\"count\":16},{\"area\":\"core\",\"count\":11},{\"area\":\".github/workflows\",\"count\":6},{\"area\":\"plugins/plugin-local-inference\",\"count\":3},{\"area\":\"os\",\"count\":3},{\"area\":\"plugins/plugin-sql\",\"count\":2}],\"topIssues\":[{\"id\":\"I_kwDOMT5cIs8AAAABT7n4hg\",\"title\":\"MemCode plugin for approved agent memory across elizaOS channels\",\"author\":\"vivekgupta-memcode\",\"number\":32932,\"repository\":\"elizaos/eliza\",\"body\":\"$14\",\"createdAt\":\"2026-09-29T14:59:31Z\",\"closedAt\":\"2026-09-29T18:24:25Z\",\"state\":\"CLOSED\",\"commentCount\":1}],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs8AAAABFxPgAw\",\"title\":\"Manage saved Reminders in Automations without adding them to Todos\",\"author\":\"NubsCarson\",\"number\":32939,\"body\":\"$15\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:20:57Z\",\"mergedAt\":\"2026-10-01T12:51:40Z\",\"additions\":3365,\"deletions\":229},{\"id\":\"PR_kwDOMT5cIs8AAAABFmzBTA\",\"title\":\"fix(phone): preserve paired turns and recover revoked sessions\",\"author\":\"NubsCarson\",\"number\":32922,\"body\":\"$16\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:07:56Z\",\"mergedAt\":\"2026-09-30T14:13:02Z\",\"additions\":1631,\"deletions\":72},{\"id\":\"PR_kwDOMT5cIs8AAAABFm2-Jw\",\"title\":\"fix(phone): keep first-use briefs and system notices truthful\",\"author\":\"NubsCarson\",\"number\":32928,\"body\":\"First-use remote phones could receive an invented morning brief when its sources were unavailable, or route a host error notice through ordinary assistant prose rendering.\\n\\nKeep source availability explicit in first-use check-ins and moment decisions, and preserve typed system notices through delivery and rendering. Error and setup messages remain distinct from generated assistant replies; unavailable brief sources are reported truthfully rather than replaced with fabricated content.\\n\\nValidation: six personal-assistant suites (54 tests, including real PGlite availability coverage); agent system-error notice suite; ChatOverlay suite (199 tests); focused Biome and typechecks. This is independently rebased onto develop and has not been installed on hardware; original combined phone QA is not a blanket acceptance of this draft. Auth/reconnect (#32922) and local-model readiness (#32926) are separate drafts. PGlite lifecycle and unsolicited-watcher fixes are excluded.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:17:30Z\",\"mergedAt\":\"2026-10-01T13:00:27Z\",\"additions\":1383,\"deletions\":208},{\"id\":\"PR_kwDOMT5cIs8AAAABFxTvWg\",\"title\":\"Wake the existing reminder task at durable deadlines\",\"author\":\"NubsCarson\",\"number\":32941,\"body\":\"$17\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:27:35Z\",\"mergedAt\":\"2026-10-01T11:27:26Z\",\"additions\":1300,\"deletions\":22},{\"id\":\"PR_kwDOMT5cIs8AAAABFxRuVg\",\"title\":\"Stop default escalation after one-shot reminder delivery\",\"author\":\"NubsCarson\",\"number\":32940,\"body\":\"$18\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:24:27Z\",\"mergedAt\":\"2026-10-01T11:44:10Z\",\"additions\":1102,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABFm2f6g\",\"title\":\"fix(core): record background task model calls in trajectories\",\"author\":\"NubsCarson\",\"number\":32927,\"body\":\"$19\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:16:20Z\",\"mergedAt\":\"2026-09-29T19:33:12Z\",\"additions\":936,\"deletions\":191},{\"id\":\"PR_kwDOMT5cIs8AAAABFm0r7w\",\"title\":\"fix(phone): expose remote local-model readiness accurately\",\"author\":\"NubsCarson\",\"number\":32926,\"body\":\"$1a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:12:07Z\",\"mergedAt\":\"2026-09-29T19:59:21Z\",\"additions\":920,\"deletions\":169},{\"id\":\"PR_kwDOMT5cIs8AAAABFl4JYg\",\"title\":\"fix(billing): preserve deletion notices and current charge consent\",\"author\":\"lalalune\",\"number\":32914,\"body\":\"$1b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T22:51:52Z\",\"mergedAt\":\"2026-09-29T19:58:59Z\",\"additions\":757,\"deletions\":198},{\"id\":\"PR_kwDOMT5cIs8AAAABFwffXQ\",\"title\":\"feat(os): stage verified downstream launcher APK overlays\",\"author\":\"lalalune\",\"number\":32936,\"body\":\"$1c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T19:03:22Z\",\"mergedAt\":\"2026-09-29T19:43:39Z\",\"additions\":738,\"deletions\":139},{\"id\":\"PR_kwDOMT5cIs8AAAABFxMTDg\",\"title\":\"Reuse request-bound planner context for task extraction\",\"author\":\"NubsCarson\",\"number\":32938,\"body\":\"$1d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:15:58Z\",\"mergedAt\":\"2026-09-30T14:54:05Z\",\"additions\":616,\"deletions\":24},{\"id\":\"PR_kwDOMT5cIs8AAAABFmzzlQ\",\"title\":\"fix(reminders): honor one-shot timing and in-app-only delivery\",\"author\":\"NubsCarson\",\"number\":32924,\"body\":\"$1e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:09:58Z\",\"mergedAt\":\"2026-09-29T19:19:20Z\",\"additions\":508,\"deletions\":174},{\"id\":\"PR_kwDOMT5cIs8AAAABFmxAjw\",\"title\":\"fix(core): avoid duplicate projections of identical conversation records\",\"author\":\"NubsCarson\",\"number\":32919,\"body\":\"$1f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:03:26Z\",\"mergedAt\":\"2026-09-29T18:34:31Z\",\"additions\":497,\"deletions\":12},{\"id\":\"PR_kwDOMT5cIs8AAAABFmwxhA\",\"title\":\"fix(ui): skip retired app catalog on view-only launcher\",\"author\":\"NubsCarson\",\"number\":32918,\"body\":\"Home showed “More apps unavailable” because its view-only launcher requested the retired installed-app catalog. Disable app catalog loading for that caller while retaining registered views, authority isolation, and real view errors. Other callers retain the existing default.\\n\\nValidation on the reviewed integration: 40 launcher/catalog tests passed; `bun run verify` passed all 284 tasks and repository audits with Node 24.15.0 and Bun 1.4.2. Affected desktop/mobile captures have been inspected. The complete app visual audit is still running; this remains draft until that finishes.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:02:48Z\",\"mergedAt\":\"2026-09-29T21:27:09Z\",\"additions\":490,\"deletions\":147},{\"id\":\"PR_kwDOMT5cIs8AAAABFxjZAg\",\"title\":\"fix(android): stabilize dialer readiness and onboarding confirmation\",\"author\":\"lalalune\",\"number\":32942,\"body\":\"$20\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T20:52:30Z\",\"mergedAt\":\"2026-10-02T08:28:57Z\",\"additions\":425,\"deletions\":44},{\"id\":\"PR_kwDOMT5cIs8AAAABFwJj9w\",\"title\":\"fix(ci): repair full-suite fixtures and workspace type dependencies\",\"author\":\"lalalune\",\"number\":32934,\"body\":\"$21\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T18:27:51Z\",\"mergedAt\":\"2026-09-29T20:48:04Z\",\"additions\":395,\"deletions\":149},{\"id\":\"PR_kwDOMT5cIs8AAAABFt_B0Q\",\"title\":\"fix(reminders): preserve saved one-shot facts through delivery\",\"author\":\"NubsCarson\",\"number\":32931,\"body\":\"$22\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T14:49:01Z\",\"mergedAt\":\"2026-09-29T21:28:07Z\",\"additions\":392,\"deletions\":41},{\"id\":\"PR_kwDOMT5cIs8AAAABFlqcmw\",\"title\":\"fix(cloud): preserve acknowledged messages during cutover retries\",\"author\":\"lalalune\",\"number\":32909,\"body\":\"$23\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T22:23:38Z\",\"mergedAt\":\"2026-09-29T19:02:57Z\",\"additions\":380,\"deletions\":34},{\"id\":\"PR_kwDOMT5cIs8AAAABFmzxuw\",\"title\":\"fix(scheduling): retain quiet watcher observations without messaging\",\"author\":\"NubsCarson\",\"number\":32923,\"body\":\"The default quiet-user watcher is observation-only, but generic dispatch rendered and delivered an unsolicited owner message. Route only its exact internal task identity through the existing observation helper, validate the configured quiet-day threshold, and persist observations in the existing dispatch result. Other watcher and visible-task paths remain unchanged.\\n\\nValidation: independent review, real SQLite runner tests for durable observations and failure results, actual notification/event/send boundaries, custom/default thresholds and unrelated watcher pass-through; agent typecheck and full repository verification pass. No real provider calls were used. This removes the writer call for this watcher; it does not establish that the morning brief consumes the stored observations, and adds no new consolidation framework.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:09:54Z\",\"mergedAt\":\"2026-09-29T18:37:57Z\",\"additions\":330,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABFllK-w\",\"title\":\"fix(gateway): keep the cutover-hold lease for the whole redelivery\",\"author\":\"fadhelcarlos\",\"number\":32908,\"body\":\"$24\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T22:13:07Z\",\"mergedAt\":null,\"additions\":237,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABFhLn7w\",\"title\":\"test(ui,assistant): pin the #30330 guards that no test discriminates\",\"author\":\"kenjohnscreates\",\"number\":32898,\"body\":\"$25\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T14:47:35Z\",\"mergedAt\":\"2026-09-29T19:04:54Z\",\"additions\":211,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABFthbKA\",\"title\":\"fix(lifeops): expire stale sleep decisions in merged schedule state\",\"author\":\"NubsCarson\",\"number\":32930,\"body\":\"$26\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T14:05:24Z\",\"mergedAt\":\"2026-09-29T19:00:08Z\",\"additions\":203,\"deletions\":38},{\"id\":\"PR_kwDOMT5cIs8AAAABFl9MxA\",\"title\":\"fix(cloud): require settled refunds and atomic media quota release\",\"author\":\"lalalune\",\"number\":32915,\"body\":\"A quoted or failed crypto payment could issue refund credits without confirmed settlement. Media deletion also committed its terminal status before releasing storage usage, leaving no retry after a database failure. This follow-up to #32910 requires a confirmed settlement receipt for refunds, commits media deletion and quota release together, and preserves retryability when object deletion fails.\\n\\nFailed media writes now compensate through the same quota owner that reserved the bytes. Crypto checkout validation rejects fractional cents and non-finite amounts before quoting a payment.\\n\\nValidation: 4 real PGlite refund tests, 7 media/storage tests including transaction rollback and replay, 6 purchased-credit/API-key rate-limit tests, 22 Miniflare admission tests, and the crypto amount boundary test. Repository `bun run verify` passed (284 tasks and the subsequent repository audits); live payment/provider acceptance is outside these local checks.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T23:03:02Z\",\"mergedAt\":\"2026-09-29T19:10:55Z\",\"additions\":156,\"deletions\":53},{\"id\":\"PR_kwDOMT5cIs8AAAABFmyXKQ\",\"title\":\"fix(agent): await pending owner conversation setup\",\"author\":\"NubsCarson\",\"number\":32921,\"body\":\"Concurrent owner deliveries could read a provisional conversation before its backing room existed. Check the already-pending creation promise before reading conversation entries, so callers share completion or failure. Tests cover concurrent readiness, shared rejection/cleanup and a successful later retry, plus durable delivery without an existing conversation.\\n\\nValidation: the two owning trigger/conversation suites pass all eight tests on the updated integration. Prior combined repository verification and app build passed. This draft isolates only the listed behavior and its tests; no inference call is added.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:06:30Z\",\"mergedAt\":\"2026-09-29T18:36:06Z\",\"additions\":136,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABFmyUPQ\",\"title\":\"fix(agent): reject trigger creation without a schedule\",\"author\":\"NubsCarson\",\"number\":32920,\"body\":\"An omitted schedule could silently create a recurring trigger. Reject creation when neither a recognized explicit trigger type nor timing fields are supplied; preserve existing explicit scheduling paths. This guards the observed malformed request; it does not claim the model will always supply correct timing.\\n\\nValidation: the two owning trigger/conversation suites pass all eight tests on the updated integration. Prior combined repository verification and app build passed. This draft isolates only the listed behavior and its tests; no inference call is added.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:06:25Z\",\"mergedAt\":\"2026-09-29T18:35:43Z\",\"additions\":102,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABFhyFfQ\",\"title\":\"test(agent): verify local backup artifacts restore files and database\",\"author\":\"lalalune\",\"number\":32899,\"body\":\"$27\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T15:39:52Z\",\"mergedAt\":\"2026-09-29T18:35:26Z\",\"additions\":92,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABFwLeEg\",\"title\":\"fix(ci): validate downloaded launch gate receipts before composition\",\"author\":\"lalalune\",\"number\":32935,\"body\":\"$28\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T18:30:59Z\",\"mergedAt\":\"2026-09-29T19:00:11Z\",\"additions\":90,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABFkyxmA\",\"title\":\"fix(android): restore develop's mobile bundle and Play cloud build\",\"author\":\"fadhelcarlos\",\"number\":32902,\"body\":\"$29\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T20:44:49Z\",\"mergedAt\":\"2026-09-29T18:32:56Z\",\"additions\":78,\"deletions\":6},{\"id\":\"PR_kwDOMT5cIs8AAAABFlujNg\",\"title\":\"fix(alpha): bind pairing to the verified device instance\",\"author\":\"lalalune\",\"number\":32912,\"body\":\"Alpha pairing could validate one device instance and then send the pairing request after the status endpoint switched identities. Bind the pairing exchange to the verified instance and reject the mismatch before sending credentials.\\n\\nAlso create the documented render output directory securely and resolve the offline integration dependencies from source for clean verification. Follow-up to #32904, which merged during review.\\n\\nValidation: 8 pairing UI tests, 12 host/white-label tests, 4 agent integration tests, actual render CLI smoke, and `bun run verify` passed with Bun 1.4.2 / Node 24.15.0. Live dstack provisioning and physical-phone acceptance were not performed.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T22:32:00Z\",\"mergedAt\":\"2026-09-29T18:35:07Z\",\"additions\":67,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABFmABMw\",\"title\":\"fix(agent): await owner conversation setup for concurrent deliveries\",\"author\":\"lalalune\",\"number\":32916,\"body\":\"Concurrent owner-directed deliveries could read a conversation registered in memory before its room setup finished. This follow-up to #32913 checks the pending creation before selecting a conversation, so every caller waits for the same durable setup.\\n\\nThe regression holds a real SQLite runtime's connection setup open, starts a second caller, and verifies it cannot resolve early. It fails on the original implementation and passes with this change; the existing full scheduling-to-chat delivery/replay test also passes. Repository `bun run verify` passed (284 tasks and repository audits). Includes the source-resolution aliases already proposed in #32912 so this branch can be validated independently.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-28T23:08:49Z\",\"mergedAt\":null,\"additions\":64,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABFmwKrg\",\"title\":\"fix(sql): wait for initialization before exclusive shutdown\",\"author\":\"NubsCarson\",\"number\":32917,\"body\":\"Closing a newly constructed PGlite client could deadlock: exclusive shutdown held the query mutex while initialization needed it to finish. Wait for initialization before entering the existing exclusive close, preserving queued-query and export draining.\\n\\nIncludes two files: the manager change and real-PGlite regression tests. All seven tests in the owning suite pass. Immediate close exercises the initialization ordering fix; queued writes/reopening and export-lock retention protect existing draining behavior, alongside the existing lock ownership tests.\\n\\nValidation used pinned Node 24.15.0 and Bun 1.4.2 against manager and test blobs identical to this draft. This is focused validation, not an exact-head full-CI claim. The change prevents a shutdown race; it does not repair damaged database files.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:01:10Z\",\"mergedAt\":\"2026-09-29T19:09:36Z\",\"additions\":48,\"deletions\":0},{\"id\":\"PR_kwDOMT5cIs8AAAABFw0hxw\",\"title\":\"Fix stale script references and integrated agent source aliases\",\"author\":\"CW1118\",\"number\":32937,\"body\":\"$2a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T19:37:47Z\",\"mergedAt\":\"2026-09-29T21:52:53Z\",\"additions\":3,\"deletions\":7},{\"id\":\"PR_kwDOMT5cIs8AAAABFwBISg\",\"title\":\"fix(build): resolve task-host-capabilities and plugin-pdf in agent typecheck\",\"author\":\"CW1118\",\"number\":32933,\"body\":\"$2b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T18:13:28Z\",\"mergedAt\":null,\"additions\":3,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABFmz_6w\",\"title\":\"fix(build): declare agent typecheck prerequisites for routine tests\",\"author\":\"NubsCarson\",\"number\":32925,\"body\":\"Agent typechecking now reaches app and PDF declarations through scheduled-routine tests, but its task graph did not declare those build prerequisites. Add the two owning build tasks so cold checks do not depend on previously generated dist files.\\n\\nValidation: the workspace dependency audit previously reproduced the missing prerequisites on the upstream source; with this change, the audit and full combined repository verification pass. This changes build ordering only, not runtime scheduling or model behavior.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:10:31Z\",\"mergedAt\":\"2026-09-29T18:32:59Z\",\"additions\":3,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABFn0wfQ\",\"title\":\"fix(app): ship white-label helper in published payload\",\"author\":\"hermesagent270-commits\",\"number\":32929,\"body\":\"$2c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T03:48:16Z\",\"mergedAt\":\"2026-09-29T18:25:58Z\",\"additions\":1,\"deletions\":0}],\"detailedContributorSummaries\":{}},\"summaryContent\":\"No activity recorded for 2026-09-29.\",\"className\":\"self-end sm:self-start\"}]]}],\"$L2d\",\"$L2e\",\"$L2f\"]}]}]\n"])</script><script>self.__next_f.push([1,"30:I[3642796,[\"/eliza-leaderboard/_next/static/chunks/872c789639e5504e.js\",\"/eliza-leaderboard/_next/static/chunks/85ed81863e311381.js\",\"/eliza-leaderboard/_next/static/chunks/f907095fa5da043c.js\",\"/eliza-leaderboard/_next/static/chunks/3c4b6a41a4af2135.js\",\"/eliza-leaderboard/_next/static/chunks/e104a2dfca7e4183.js\",\"/eliza-leaderboard/_next/static/chunks/a400816e9dd4d7a4.js\",\"/eliza-leaderboard/_next/static/chunks/4f6f1c9ebd75e684.js\",\"/eliza-leaderboard/_next/static/chunks/2d734ad4b9b36e9e.js\"],\"\"]\n31:I[3238488,[\"/eliza-leaderboard/_next/static/chunks/872c789639e5504e.js\",\"/eliza-leaderboard/_next/static/chunks/85ed81863e311381.js\",\"/eliza-leaderboard/_next/static/chunks/f907095fa5da043c.js\",\"/eliza-leaderboard/_next/static/chunks/3c4b6a41a4af2135.js\",\"/eliza-leaderboard/_next/static/chunks/e104a2dfca7e4183.js\",\"/eliza-leaderboard/_next/static/chunks/a400816e9dd4d7a4.js\",\"/eliza-leaderboard/_next/static/chunks/4f6f1c9ebd75e684.js\",\"/eliza-leaderboard/_next/static
