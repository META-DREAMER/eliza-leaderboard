cess: false, message: \"temporary database failure\" }`;\n- a shared event ledger records conversion and claim calls.\n\n```text\nbun test packages/cloud/api/__tests__/claim-affiliate-session-conversion.test.ts\n\n1 pass, 0 fail, 4 assertions\nevents: [\"session-converted\", \"claim-failed\"]\nresponse: HTTP 200, claimed: [], failed: [character]\n```\n\nThe passing reproduction asserts the current broken behavior. The conversion\nservice deactivates the session and sets `converted_at`; a later request skips\nthe session before it can retry the failed character.\n\n**Expected behavior / acceptance**\n\n- Session-backed ownership transfers run before the session is marked\n  converted.\n- A returned or thrown claim failure leaves the session unconverted and\n  retryable.\n- Multiple session-backed characters may partially succeed; the session stays\n  retryable until every session-backed character in that attempt succeeds.\n  Already-transferred characters are naturally absent from the anonymous\n  owner's next `listByUser` result.\n- Once all session-backed claims succeed, `markConverted` runs exactly once and\n  only after the claim calls.\n- Failures on unrelated room-discovered characters do not prevent conversion\n  when every character associated with the supplied session succeeded.\n- The existing page-safe response contract from #13769 remains intact.\n- Regression tests exercise the real route and assert response payloads plus\n  claim/conversion ordering and ledgers.\n\n**Evidence / reproduction proof**\n\n- Screenshots / recording: N/A — server-only API ordering with no rendered UI.\n- Backend logs: N/A — the exact route response and ordered service ledger are\n  recorded above.\n- Frontend console/network logs: N/A — no frontend behavior changes.\n- Real-LLM trajectory: N/A — no agent planner or model behavior is involved.\n- Domain artifacts: no live rows were mutated; deterministic service ledgers\n  prove the invalid ordering.\n\n**Duplicate and overlap eduling side effect.\n17:Tc2f,"])</script><script>self.__next_f.push([1,"## Defect\n\n`disconnectManagedGoogleConnection` (`packages/cloud/shared/src/lib/services/agent-google-connector/shared.ts:547-566`) falls through to `connections[0]` when an **explicit** `connectionId` matches nothing:\n\n```ts\nconst activeConnection =\n  (args.connectionId\n    ? connections.find((connection) =\u003e connection.id === args.connectionId)\n    : getPreferredActiveConnection(connections, args.userId, args.side)) ??\n  connections[0] ??        // \u003c- explicit-but-unknown id lands here\n  null;\n```\n\nA caller who passes a stale, wrong, or cross-side UUID — with otherwise valid authentication — gets **HTTP 200 `{ok:true}`** while a *different* connection (the first in the scoped list) is revoked. The explicit-id contract (\"disconnect THIS one\") silently degrades into \"disconnect whatever is first.\"\n\nThis is the `shared.ts:555-558` fallthrough flagged independently during #33090 review — outside that PR's body-validation scope, so filed separately as promised.\n\n## Reproduction (logic path, current `develop`)\n\n1. Authenticate as a user with ≥1 managed owner-side Google connection (id `A`).\n2. `POST /api/v1/eliza/google/disconnect` with a well-formed but nonexistent UUID: `{\"connectionId\":\"3f1c2a4e-0000-4000-8000-000000000000\"}`.\n3. The route parses fine (valid UUID), the connector's `find` returns `undefined`, and `?? connections[0]` selects connection `A`.\n4. **Result: 200 `{ok:true}` and connection `A` is revoked.**\n\nSame call shape, second connection `B` present and listed first: the caller intended to remove nothing that exists, and `B` is destroyed.\n\n## Expected behavior\n\n- An **explicit** `connectionId` that matches nothing in the caller's scoped connections → `AgentGoogleConnectorError` 404 (`Google connection not found.`), **no revoke** — exactly the contract the same file already implements for explicit-grant lookup in `getConnectionStatus` (`shared.ts:479`: `fail(404, \"Google connection not found.\")`).\n- Omitted/null `connectionId` keeps today's disconnect-active-or-first behavior unchanged.\n- The route already maps `AgentGoogleConnectorError` to its status (verified in `disconnect/route.ts` catch), so the 404 propagates with no route changes.\n\n## Acceptance\n\n- `{\"connectionId\": \"\u003cwell-formed unknown uuid\u003e\"}` with scoped connections present → 404, zero `revokeConnection` calls.\n- `{\"connectionId\": \"\u003cknown uuid\u003e\"}` → 200, that connection revoked (unchanged).\n- Empty body / `{}` / `{\"connectionId\": null}` → 200, active-or-first revoked (unchanged).\n- No scoped connections + explicit id → 404 (not the silent no-op `return` the current code takes).\n\n## Evidence\n\n- Server-only API behavior; connector call ledger from the #33090 review thread documents the same silent-revoke class for malformed bodies (this issue is the explicit-id half).\n- Reviewed head: `develop` `8113...` (2026-10-02), function verified unchanged by the 11 commits between `27dec7b0c3` and current develop.\n\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"nvidia\",\"model\":\"z-ai/glm-5.3\",\"client\":\"Hermes Agent\",\"skill_revision\":\"local:slop-eliza/skills/slop-cash-contribute\"} --\u003e"])</script><script>self.__next_f.push([1,"18:T9a5,"])</script><script>self.__next_f.push([1,"Requested by review on #33047 (hermesagent270-commits, Prabhat1308, nothingxnowhere): the install-boundary Bun pin guard needs a focused issue to own its acceptance criteria.\n\n## Scope\n\nThe root-postinstall Bun pin guard must reflect the real install boundary: two Bun runtimes participate in an install and each can be off-pin independently.\n\n1. **Installer runtime.** The binary that resolved dependencies and wrote `bun.lock` is exposed to lifecycle scripts as `npm_execpath`. Checking only the `bun` on PATH let an off-pin installer pass because a pinned child masked it (reproduced in the #33047 reviews ery renders the reminder's due time in the **host** timezone in two owner-visible places in `plugins/plugin-personal-assistant/src/lifeops/domains/reminders-service.ts`:\n\n1. `buildReminderDispatchPrompt` (the model-facing dispatch prompt) formats `- due:` with `new Date(args.reminderAt).toLocaleString()` — no `timeZone`. The model writes owner copy anchored to the server's wall clock, so with a UTC host and an `America/Los_Angeles` owner a 4:00 PM PDT reminder is described to the model as \"11:00 PM\".\n2. `renderReminderBody`'s deterministic fallback calls `buildReminderBody` **without** the `timezone` it already supports, so the fallback body (\"Due: …\") is host-local too. This fallback is what owners actually receive whenever `TEXT_SMALL` is unavailable, returns unusable text, or throws.\n\n`dispatchReminderAttempt` already resolves and carries `timezone: string`, and the exact in-app one-time path passes it through (`buildReminderBody({ ...args, … })`), so the value is in scope at both call sites — it is simply dropped.\n\nThis is the same defect family as #33155 (cadence summaries), but a different file and path: delivered reminder copy and the reminder dispatch prompt. #33164's fix touches only `actions/life.ts`.\n\n## Reproduction\n\nCurrent `develop`: `3248f87109353350b3721127bfaebaf8f081a740`; `reminders-service.ts` blob `3fb32700f87af20197e257d9a74d1f2509124b3c`.\n\nOwner timezone `America/Los_Angeles`; reminder due `2026-08-20T23:00:00.000Z` (4:00 PM PDT). Calling the exported `buildReminderBody` (as `renderReminderBody` does, without `timezone`) and `buildReminderDispatchPrompt`:\n\n- host `TZ=UTC`: `Due: 8/20/2026, 11:00:00 PM` and `- due: 8/20/2026, 11:00:00 PM`\n- host `TZ=America/New_York`: `Due: 8/20/2026, 7:00:00 PM` and `- due: 8/20/2026, 7:00:00 PM`\n\nExpected in both environments: `4:00 PM` (the owner's wall clock).\n\n## Acceptance criteria\n\n- `buildReminderDispatchPrompt` renders `- due:` in the explicit definition/draft timezone when one is provided, and is invariant across host `TZ` values.\n- `renderReminderBody` threads the owner timezone into both the fallback body and the prompt; `dispatchReminderAttempt` passes its `timezone` through.\n- Omitted timezone keeps today's behavior (no format change for callers that do not supply one).\n- Focused regressions cover the prompt formatter, the fallback body, and the `dispatchReminderAttempt → renderReminderBody` threading.\n\n## Duplication check\n\nOpen issue/PR searches for reminder dispatch timezone formatting found no matching work. #33155/#33164 cover cadence summaries in `actions/life.ts`; #33117 covers quiet-hours DST; #33122 covers calendar-day bounds; #33096 touches reminder plans/controls and UI widgets, not these formatters; #33107 classifies reminder replies.\n"])</script><script>self.__next_f.push([1,"1a:T598,"])</script><script>self.__next_f.push([1,"## Problem\n\nGmail replies sent from Personal Assistant inbox triage and the LifeOps Gmail reply endpoint can arrive as new conversations instead of remaining in the source thread.\n\nOn `develop`, the adapter drops the source `threadId` before `users.messages.send`, reads `metadata.references` even though the Gmail mapper stores `referencesHeader`, and can send a reply without the identifiers required to prove the parent message. The LifeOps HTTP path similarly sends with a thread id but omits the RFC reply chain.\n\nThis is user-visible: an owner replies from Eliza, but Gmail and recipient mail clients may show a separate conversation.\n\n## Acceptance criteria\n\n- Every Gmail reply send requires a non-empty source `threadId` and parent `Message-ID`; missing values fail before any send.\n- `users.messages.send` receives the source `threadId` on its Message resource.\n- `In-Reply-To` contains the parent Message-ID.\n- `References` contains the stored `referencesHeader` chain followed by the parent Message-ID.\n- Personal Assistant inbox triage and LifeOps HTTP reply sends use the same in ithubusercontent.com/u/140473048?v=4\",\"totalScore\":26.2,\"prScore\":0,\"issueScore\":0,\"reviewScore\":26,\"commentScore\":0.2,\"summary\":null},{\"username\":\"mashingaan\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/187997237?v=4\",\"totalScore\":15,\"prScore\":0,\"issueScore\":0,\"reviewScore\":15,\"commentScore\":0,\"summary\":null},{\"username\":\"greatcodeeer\",\"avatarUrl\":\"https://avatars.githubusercontent.com/u/3224374?u=d56a9778976761a0b0deb565a680273c102919cf\u0026v=4\",\"totalScore\":0.43799999999999994,\"prScore\":0,\"issueScore\":0,\"reviewScore\":0,\"commentScore\":0.43799999999999994,\"summary\":null}],\"focusAreas\":[{\"area\":\"app\",\"count\":69},{\"area\":\"plugins/plugin-assistant\",\"count\":57},{\"area\":\"plugins/plugin-workflow\",\"count\":43},{\"area\":\"agent\",\"count\":42},{\"area\":\"ui\",\"count\":39},{\"area\":\"core\",\"count\":29},{\"area\":\"plugins/plugin-native-reminders\",\"count\":29},{\"area\":\"plugins/plugin-native-browser-surface\",\"count\":28},{\"area\":\".github/workflows\",\"count\":27},{\"area\":\"plugins/plugin-personal-assistant\",\"count\":25}],\"topIssues\":[{\"id\":\"I_kwDOMT5cIs8AAAABUubNlw\",\"title\":\"fix(cloud): keep failed affiliate session claims retryable\",\"author\":\"hermesagent270-commits\",\"number\":33126,\"repository\":\"elizaos/eliza\",\"body\":\"$14\",\"createdAt\":\"2026-10-03T02:27:23Z\",\"closedAt\":\"2026-10-04T03:12:33Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUzNB7g\",\"title\":\"Steer token-address queries return unrelated wallet vaults\",\"author\":\"hermesagent270-commits\",\"number\":33208,\"repository\":\"elizaos/eliza\",\"body\":\"$15\",\"createdAt\":\"2026-10-03T15:09:58Z\",\"closedAt\":\"2026-10-04T03:11:54Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUzMNoQ\",\"title\":\"KNOWLEDGE_GRAPH set_relationship adds a duplicate edge on every restatement\",\"author\":\"hermesagent270-commits\",\"number\":33207,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`KNOWLEDGE_GRAPH set_relationship` (`plugins/plugin-relationships/src/actions/entity.ts`) calls `RelationshipStore.upsert` without a `relationshipId`, and the store creates a new id whenever one is missing. Restating a relationship (\\\"Pat is my manager\\\" twice) therefore adds a second active edge instead of updating the first, and the relationships API and viewer show duplicates.\\n\\n**Expected**\\n\\nRestating an edge updates the existing active `(from, to, type)` edge.\\n\\nFix: #33206\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T15:08:18Z\",\"closedAt\":\"2026-10-04T03:11:56Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUzAuNg\",\"title\":\"elizaOS Cloud buffered text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33204,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nelizaOS Cloud's buffered text requests (`generateNativeChatCompletion` → `/chat/completions`, and `/responses`, in `plugins/plugin-elizacloud/src/models/text.ts`) don't pass `GenerateTextParams.signal` to `requestRaw`, and the warming-503 backoff sleeps without it. A stopped turn's buffered request runs to the client timeout, plus the warming ladder, while holding the shared native-chat concurrency permit. The streaming and embeddings paths already forward the signal.\\n\\n**Expected**\\n\\nCancelling a turn aborts its buffered Cloud request and ends any warming backoff.\\n\\nFix: #33203\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:44:26Z\",\"closedAt\":\"2026-10-04T03:11:58Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUy--Mg\",\"title\":\"Anthropic text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33202,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe Anthropic text handler (`plugins/plugin-anthropic/models/text.ts`) never passes `GenerateTextParams.signal` to the AI SDK request, so stopping a chat turn does not cancel the Anthropic request. It keeps generating, and is billed, up to `maxOutputTokens`. `executeWithRetry` also treats `AbortError` as retryable, so a cancelled request would be re-sent three more times.\\n\\nOpenAI and the elizaOS Cloud stream path forward the signal.\\n\\n**Expected**\\n\\nA cancelled turn aborts the Anthropic request once and does not retry it.\\n\\nFix: #33201\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:40:51Z\",\"closedAt\":\"2026-10-04T03:12:00Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUy2pCQ\",\"title\":\"Telegram personal-account search matches the untrimmed query\",\"author\":\"hermesagent270-commits\",\"number\":33198,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe personal Telegram account's `searchConnectorMessages` (`plugins/plugin-telegram/src/account-client-service.ts`) checks `params.query.trim()` for blankness but matches the untrimmed query, so `\\\" invoice \\\"` finds only messages containing the word with spaces on both sides. The bot-side Telegram search and the Slack and Discord searches trim first.\\n\\n**Expected**\\n\\nA padded query matches the same messages as the trimmed one.\\n\\nFix: #33197\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:22:49Z\",\"closedAt\":\"2026-10-04T00:07:52Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUy09_g\",\"title\":\"X connector reports an empty inbox when the DM fetch fails\",\"author\":\"hermesagent270-commits\",\"number\":33196,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.fetchConnectorMessages` and `listRecentConnectorTargets` (`plugins/plugin-x/src/services/x.service.ts`) catch a DM fetch failure (expired token, rate limit), report it, and return `[]`. An X outage therefore reads as an empty inbox. The LifeOps X read delegate returns `handled` with no DMs instead of `unavailable`, and the MESSAGE action sees no recent DM partners. The code comment itself says the failure must not read as an empty inbox.\\n\\n**Expected**\\n\\nThe failure propagates to the callers' existing error boundaries, as it does for the Discord, Slack and Telegram connectors.\\n\\nFix: #33195\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:19:14Z\",\"closedAt\":\"2026-10-04T03:12:03Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyzUzw\",\"title\":\"Form undo reverts an older change after a field's first answer\",\"author\":\"hermesagent270-commits\",\"number\":33194,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nIn `@elizaos/plugin-form`, `FormService.updateField` records an undo entry only when the field already had a value, so a field's first answer is never in `session.history`. `undoLastChange` then reverts an older change, or does nothing.\\n\\n**Reproduction**\\n\\nA form with `name` and `email` (`allowUndo` is the default): set `name=Bob`, correct to `name=Rob`, set `email=a@b.co`, then undo. `name` goes back to `Bob` and `email` stays filled. Undo right after a single first answer returns `null`.\\n\\n**Expected**\\n\\nUndo reverts the most recent change: here it clears `email` and leaves `name` as `Rob`.\\n\\nFix: #33193\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:14:59Z\",\"closedAt\":\"2026-10-04T03:12:07Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyxDWQ\",\"title\":\"X connector attributes the account's own DMs to another user\",\"author\":\"hermesagent270-commits\",\"number\":33192,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.buildXDirectMessageMemory` (`plugins/plugin-x/src/services/x.service.ts`) compares `senderId` (an X numeric user id) with `runtime.agentId` (a UUID) to decide whether a DM is the account's own. That comparison is never true. The account's own outbound DMs are stored as memories from a synthetic `x:user:\u003cown id\u003e` entity with `fromBot: false`, so the X message connector shows the agent's own replies as if another user wrote them.\\n\\n`listRecentDirectMessages` already marks own DMs with `isInbound: false`, but the builder only copies that into `metadata.x`.\\n\\n**Expected**\\n\\nOwn DMs have `entityId === runtime.agentId` and `fromBot: true`.\\n\\nFix: #33191\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:09:56Z\",\"closedAt\":\"2026-10-04T03:12:10Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyr3kg\",\"title\":\"CONTACT follow-up confirmations use the host timezone instead of the owner's\",\"author\":\"hermesagent270-commits\",\"number\":33190,\"repository\":\"elizaos/eliza\",\"body\":\"$16\",\"createdAt\":\"2026-10-03T13:58:58Z\",\"closedAt\":\"2026-10-04T03:12:12Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyqsDQ\",\"title\":\"fix(cloud): an explicit-but-unknown Google disconnect connectionId silently revokes a different connection\",\"author\":\"OutstandingRetard\",\"number\":33189,\"repository\":\"elizaos/eliza\",\"body\":\"$17\",\"createdAt\":\"2026-10-03T13:56:32Z\",\"closedAt\":\"2026-10-04T03:12:14Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyc0sg\",\"title\":\"fix(scripts): install-time Bun pin guard must validate the installer runtime and describe its post-resolution failure\",\"author\":\"lumix5\",\"number\":33187,\"repository\":\"elizaos/eliza\",\"body\":\"$18\",\"createdAt\":\"2026-10-03T13:26:15Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUxO8DA\",\"title\":\"Reminder dispatch and fallback bodies use the host timezone instead of the owner's\",\"author\":\"lumix5\",\"number\":33172,\"repository\":\"elizaos/eliza\",\"body\":\"$19\",\"createdAt\":\"2026-10-03T10:29:35Z\",\"closedAt\":\"2026-10-04T03:12:25Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUwxa0A\",\"title\":\"Gmail replies can leave the original conversation thread\",\"author\":\"hermesagent270-commits\",\"number\":33165,\"repository\":\"elizaos/eliza\",\"body\":\"$1a\",\"createdAt\":\"2026-10-03T09:18:38Z\",\"closedAt\":\"2026-10-04T03:12:27Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUwVxWw\",\"title\":\"LIFE cadence summaries use host timezone and can delete the wrong reminder\",\"author\":\"hermesagent270-commits\",\"number\":33155,\"repository\":\"elizaos/eliza\",\"body\":\"$1b\",\"createdAt\":\"2026-10-03T08:11:04Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUvwkLw\",\"title\":\"PERSONAL_ASSISTANT sign_document approvals always fail with DOCUMENT_REQUEST_NOT_FOUND\",\"author\":\"hermesagent270-commits\",\"number\":33145,\"repository\":\"elizaos/eliza\",\"body\":\"$1c\",\"createdAt\":\"2026-10-03T06:27:06Z\",\"closedAt\":\"2026-10-04T03:12:31Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUuLX2Q\",\"title\":\"plugin-sql jsonb writes fail with raw PostgreSQL errors on lone UTF-16 surrogates\",\"author\":\"hermesagent270-commits\",\"number\":33125,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe plugin-sql jsonb sanitizer handles NUL but not lone UTF-16 surrogates (e.g. a truncated emoji `\\\"hi \\\\ud83d\\\"`), which PostgreSQL jsonb also rejects. Memory writes fail with a raw `invalid input syntax for type json` instead of a typed error, and a log body containing one fails the whole insert.\\n\\nReproduced on develop `811c3fac48` with the real PGlite adapter (createMemory text/metadata and log).\\n\\n## Acceptance\\n\\n- Strict writes reject lone surrogates with a typed error (as for NUL), leaving no partial row.\\n- Lenient sanitization (log bodies) replaces them with U+FFFD (as it strips NUL).\\n\\nFix: #33124\\n\",\"createdAt\":\"2026-10-03T01:45:12Z\",\"closedAt\":\"2026-10-04T03:12:35Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUuH4Qg\",\"title\":\"LIFE \\\"calendar today\\\" uses the host's midnight instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":33123,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nLIFE `query_calendar_today` builds \\\"today\\\" from the host clock's midnight plus 24 h and passes the host zone, ignoring the owner's timezone fact. On a UTC or shared server, an owner in New York asking at 21:00 gets tomorrow's events; DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48`: at `2026-10-03T01:00Z` (21:00 Oct 2 in New York), a `TZ=UTC` host queries `2026-10-03T00:00Z..2026-10-04T00:00Z` instead of `2026-10-02T04:00Z..2026-10-03T04:00Z`.\\n\\n## Acceptance\\n\\n- The calendar-today window is the owner's local day in their zone (23/25 h on DST days), independent of the host zone.\\n\\nFix: #33122\\n\",\"createdAt\":\"2026-10-03T01:35:21Z\",\"closedAt\":\"2026-10-04T03:12:37Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUuFC2g\",\"title\":\"queryEntities pagination skips and repeats entities across writes\",\"author\":\"hermesagent270-commits\",\"number\":33120,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`queryEntities` (plugin-sql `base.ts`) pages with `limit`/`offset` and no `ORDER BY`. Rows come back in physical order, which an `UPDATE` rewrites, so paging across a write skips an entity and serves another twice. plugin-form's `getRestorableSessions` pages this way and can drop a live session from restore.\\n\\nReproduced on develop `811c3fac48` on real PGlite: four entities paged with `limit: 1` across an `updateEntity` serve `e0, e2, e3, e0`.\\n\\n## Acceptance\\n\\n- Pages are totally ordered; each entity is served exactly once across a concurrent update.\\n\\nFix: #33119\\n\",\"createdAt\":\"2026-10-03T01:27:10Z\",\"closedAt\":\"2026-10-04T03:12:38Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUt--tg\",\"title\":\"Quiet-hours gate refires an hour off on DST nights\",\"author\":\"hermesagent270-commits\",\"number\":33118,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe `quiet_hours` gate defers by a wall-clock minute count (`until.offsetMinutes`), so a DST change inside the window shifts the refire: with quiet hours 22:00–07:00, a task deferred at 22:30 refires at 08:00 after spring-forward (New York, London), at 06:00 (still quiet) after fall-back, and at 07:30 in Lord Howe.\\n\\nReproduced on develop `811c3fac48` with the real gate.\\n\\n## Acceptance\\n\\n- Deferral targets the window's end instant in the owner's zone (`until.atIso`), 07:00 local on DST nights.\\n\\nFix: #33117\\n\",\"createdAt\":\"2026-10-03T01:10:32Z\",\"closedAt\":\"2026-10-04T03:12:40Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUt7WRA\",\"title\":\"GENERATE_MEDIA rejects the voice, genre, instrumental, quality, style, and negativePrompt it supports\",\"author\":\"hermesagent270-commits\",\"number\":33116,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`GENERATE_MEDIA` forwards `quality`, `style`, `negativePrompt`, `instrumental`, `genre`, and `voice` to the media service, but none is declared in the action's `parameters`. Core `validateToolArgs` rejects undeclared arguments, so a planner call can never choose a TTS voice, instrumental music or a genre, or image quality/style/negative prompt.\\n\\nReproduced on develop `811c3fac48` with the real `validateToolArgs`: `{ mediaType: \\\"audio\\\", audioKind: \\\"tts\\\", prompt, voice: \\\"nova\\\" }` → `Unexpected argument 'voice'`.\\n\\n## Acceptance\\n\\n- The six controls are declared (with the enums `buildRequest` accepts) and reach the media service from a validated planner call.\\n\\nFix: #33115\\n\",\"createdAt\":\"2026-10-03T01:00:41Z\",\"closedAt\":\"2026-10-04T03:12:42Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUtvzUQ\",\"title\":\"plugin-sql getLogs returns and deletes other agents' logs in a shared database\",\"author\":\"hermesagent270-commits\",\"number\":33113,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nIn a database shared by several agents, `getLogs` (plugin-sql `base.ts`) returns every agent's logs whenever no `roomId` is passed, because the `logs` table has no agent column and the query has no room/agent join. `deleteLogs`/`updateLogs` act on any id. Agent export therefore includes other agents' logs, and the logs-retention sweep and inference-timing pruner delete other agents' rows.\\n\\nReproduced on develop `811c3fac48` with two real `PgliteDatabaseAdapter`s on one PGlite database: `A.getLogs({ type: \\\"inference_timing\\\" })` returns B's log too.\\n\\n## Acceptance\\n\\n- `getLogs` returns only logs in the calling agent's rooms (as `getAgentRunSummaries` already does).\\n- `deleteLogs`/`updateLogs` cannot touch another agent's rows.\\n- Export pagination is stable.\\n\\nFix: #33112\\n\",\"createdAt\":\"2026-10-03T00:30:58Z\",\"closedAt\":\"2026-10-04T03:12:44Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUtq-2w\",\"title\":\"Google Fit health summaries use UTC days instead of the owner's local day\",\"author\":\"hermesagent270-commits\",\"number\":33111,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe health bridge documents day keys as calendar days in `HealthBridgeConfig.timeZone` (#31248/#31264), but the Google Fit backend aggregates `${date}T00:00Z` + 24 h, enumerates sleep days in UTC, and `getHealthDailySummary(date)` passes no zone. Every owner outside UTC gets Google Fit steps, sleep, heart rate, and calories for the wrong window every day, and DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48` (real `getDailySummary`, `fetch` stubbed): Asia/Kolkata 2026-10-02 is aggregated 05:30–05:30 IST; America/New_York 2026-03-08 is aggregated 3/7 19:00 EST – 3/8 20:00 EDT.\\n\\n## Acceptance\\n\\n- Google Fit day windows are local midnight to local midnight in the owner's zone (23/25 h on DST days).\\n- Sleep series use the owner's local days.\\n- The daily-summary path receives the owner's zone, like the trend path.\\n\\nFix: #33110\\n\",\"createdAt\":\"2026-10-03T00:19:03Z\",\"closedAt\":\"2026-10-04T03:12:45Z\",\"state\":\"CLOSED\",\"commentCount\":0}],\"topPullRequests\":[{\"id\":\"PR_kwDOMT5cIs8AAAABFPK6lA\",\"title\":\"Promote develop to staging\",\"author\":\"lalalune\",\"number\":32809,\"body\":\"$1d\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-26T10:14:25Z\",\"mergedAt\":\"2026-10-03T23:05:41Z\",\"additions\":3053643,\"deletions\":2975977},{\"id\":\"PR_kwDOMT5cIs8AAAABGPK-qw\",\"title\":\"feat: compose resident sessions, recoverable workers and approved device actions\",\"author\":\"lalalune\",\"number\":33026,\"body\":\"$1e\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T06:44:21Z\",\"mergedAt\":\"2026-10-03T22:49:22Z\",\"additions\":7233,\"deletions\":415},{\"id\":\"PR_kwDOMT5cIs8AAAABGXR9Cg\",\"title\":\"Fix native reminder plans, controls and review evidence\",\"author\":\"NubsCarson\",\"number\":33096,\"body\":\"$1f\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:15:13Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":5137,\"deletions\":312},{\"id\":\"PR_kwDOMT5cIs8AAAABGXbC8Q\",\"title\":\"Enable configured Android reminder push delivery\",\"author\":\"NubsCarson\",\"number\":33106,\"body\":\"$20\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:36:06Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":2046,\"deletions\":169},{\"id\":\"PR_kwDOMT5cIs8AAAABGfYJUw\",\"title\":\"feat(native): share host custody, runtime and update primitives\",\"author\":\"lalalune\",\"number\":33242,\"body\":\"$21\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T23:23:05Z\",\"mergedAt\":\"2026-10-03T23:28:11Z\",\"additions\":1895,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABGYIhyw\",\"title\":\"fix(personal-assistant): ground owner briefs and preserve scheduled copy\",\"author\":\"NubsCarson\",\"number\":33114,\"body\":\"$22\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T00:37:45Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":1837,\"deletions\":212},{\"id\":\"PR_kwDOMT5cIs8AAAABGfIViQ\",\"title\":\"Integrate latest runtime and retire AlphaPhone patch overlays\",\"author\":\"lalalune\",\"number\":33230,\"body\":\"$23\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T22:42:54Z\",\"mergedAt\":\"2026-10-03T22:56:34Z\",\"additions\":1782,\"deletions\":116},{\"id\":\"PR_kwDOMT5cIs8AAAABGatlxQ\",\"title\":\"feat(os): opt in to signer-bound Chromium activity embedding\",\"author\":\"lalalune\",\"number\":33167,\"body\":\"$24\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T09:49:16Z\",\"mergedAt\":\"2026-10-03T10:09:38Z\",\"additions\":1688,\"deletions\":37},{\"id\":\"PR_kwDOMT5cIs8AAAABGe5Vmg\",\"title\":\"feat(native-reminders): extract host-configured Android engine candidate\",\"author\":\"lalalune\",\"number\":33217,\"body\":\"$25\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T22:05:48Z\",\"mergedAt\":\"2026-10-03T22:48:02Z\",\"additions\":1496,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABGXSGGQ\",\"title\":\"Remove redundant receipt data and maintenance-task prompt context\",\"author\":\"NubsCarson\",\"number\":33100,\"body\":\"$26\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:15:34Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":1495,\"deletions\":759},{\"id\":\"PR_kwDOMT5cIs8AAAABGe-x4w\",\"title\":\"feat(devices)
