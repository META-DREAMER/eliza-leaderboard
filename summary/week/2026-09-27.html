za\",\"body\":\"$3e\",\"createdAt\":\"2026-08-26T16:12:35Z\",\"closedAt\":\"2026-09-27T19:33:43Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABN3pisw\",\"title\":\"fix(delivery): remove planner-controlled send confirmation\",\"author\":\"lalalune\",\"number\":25284,\"repository\":\"elizaos/eliza\",\"body\":\"$3f\",\"createdAt\":\"2026-08-23T06:54:15Z\",\"closedAt\":\"2026-09-27T19:33:32Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABNiQBXw\",\"title\":\"Define and implement payment-reversal, entitlement, and creator-payout policy\",\"author\":\"standujar\",\"number\":22930,\"repository\":\"elizaos/eliza\",\"body\":\"$40\",\"createdAt\":\"2026-08-20T12:17:24Z\",\"closedAt\":\"2026-09-28T01:11:57Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABUubNlw\",\"title\":\"fix(cloud): keep failed affiliate session claims retryable\",\"author\":\"hermesagent270-commits\",\"number\":33126,\"repository\":\"elizaos/eliza\",\"body\":\"$41\",\"createdAt\":\"2026-10-03T02:27:23Z\",\"closedAt\":\"2026-10-04T03:12:33Z\",\"state\":\"CLOSED\",\"commentCount\":1},{\"id\":\"I_kwDOMT5cIs8AAAABO6L4wQ\",\"title\":\"feat(lifeops): deliver Bettina owner-private family operations MVP\",\"author\":\"lalalune\",\"number\":30123,\"repository\":\"elizaos/eliza\",\"body\":\"$42\",\"createdAt\":\"2026-08-31T01:32:03Z\",\"closedAt\":\"2026-09-27T21:27:12Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUGLlvw\",\"title\":\"ci(cloud-stability): deterministic-keyless lane red on develop since grounded reminder delivery stopped consuming the dispatch fixtures\",\"author\":\"hermesagent270-commits\",\"number\":32959,\"repository\":\"elizaos/eliza\",\"body\":\"$43\",\"createdAt\":\"2026-09-30T08:37:33Z\",\"closedAt\":\"2026-10-01T10:14:43Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUDG7kw\",\"title\":\"gateway-webhook cutover hold: a turn settled while another replica held the lease is redelivered once that lease lapses\",\"author\":\"nothingxnowhere\",\"number\":32947,\"repository\":\"elizaos/eliza\",\"body\":\"$44\",\"createdAt\":\"2026-09-30T03:26:55Z\",\"closedAt\":\"2026-10-01T10:31:33Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUDD0CA\",\"title\":\"crypto checkout: an amount that is not whole cents is reported as AMOUNT_TOO_LARGE (\\\"Amount too large\\\")\",\"author\":\"nothingxnowhere\",\"number\":32945,\"repository\":\"elizaos/eliza\",\"body\":\"$45\",\"createdAt\":\"2026-09-30T03:20:41Z\",\"closedAt\":\"2026-10-01T11:29:07Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUC1UUw\",\"title\":\"gateway-webhook cutover hold: non-retryable Cloud refusals are replayed for the hold budget, and a delivered hold is replayed after its lease lapses\",\"author\":\"nothingxnowhere\",\"number\":32943,\"repository\":\"elizaos/eliza\",\"body\":\"$46\",\"createdAt\":\"2026-09-30T02:51:05Z\",\"closedAt\":\"2026-10-01T10:04:08Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUzNB7g\",\"title\":\"Steer token-address queries return unrelated wallet vaults\",\"author\":\"hermesagent270-commits\",\"number\":33208,\"repository\":\"elizaos/eliza\",\"body\":\"$47\",\"createdAt\":\"2026-10-03T15:09:58Z\",\"closedAt\":\"2026-10-04T03:11:54Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUzMNoQ\",\"title\":\"KNOWLEDGE_GRAPH set_relationship adds a duplicate edge on every restatement\",\"author\":\"hermesagent270-commits\",\"number\":33207,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`KNOWLEDGE_GRAPH set_relationship` (`plugins/plugin-relationships/src/actions/entity.ts`) calls `RelationshipStore.upsert` without a `relationshipId`, and the store creates a new id whenever one is missing. Restating a relationship (\\\"Pat is my manager\\\" twice) therefore adds a second active edge instead of updating the first, and the relationships API and viewer show duplicates.\\n\\n**Expected**\\n\\nRestating an edge updates the existing active `(from, to, type)` edge.\\n\\nFix: #33206\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T15:08:18Z\",\"closedAt\":\"2026-10-04T03:11:56Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUzAuNg\",\"title\":\"elizaOS Cloud buffered text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33204,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nelizaOS Cloud's buffered text requests (`generateNativeChatCompletion` → `/chat/completions`, and `/responses`, in `plugins/plugin-elizacloud/src/models/text.ts`) don't pass `GenerateTextParams.signal` to `requestRaw`, and the warming-503 backoff sleeps without it. A stopped turn's buffered request runs to the client timeout, plus the warming ladder, while holding the shared native-chat concurrency permit. The streaming and embeddings paths already forward the signal.\\n\\n**Expected**\\n\\nCancelling a turn aborts its buffered Cloud request and ends any warming backoff.\\n\\nFix: #33203\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:44:26Z\",\"closedAt\":\"2026-10-04T03:11:58Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUy--Mg\",\"title\":\"Anthropic text requests ignore the runtime cancellation signal\",\"author\":\"hermesagent270-commits\",\"number\":33202,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe Anthropic text handler (`plugins/plugin-anthropic/models/text.ts`) never passes `GenerateTextParams.signal` to the AI SDK request, so stopping a chat turn does not cancel the Anthropic request. It keeps generating, and is billed, up to `maxOutputTokens`. `executeWithRetry` also treats `AbortError` as retryable, so a cancelled request would be re-sent three more times.\\n\\nOpenAI and the elizaOS Cloud stream path forward the signal.\\n\\n**Expected**\\n\\nA cancelled turn aborts the Anthropic request once and does not retry it.\\n\\nFix: #33201\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:40:51Z\",\"closedAt\":\"2026-10-04T03:12:00Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUy2pCQ\",\"title\":\"Telegram personal-account search matches the untrimmed query\",\"author\":\"hermesagent270-commits\",\"number\":33198,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nThe personal Telegram account's `searchConnectorMessages` (`plugins/plugin-telegram/src/account-client-service.ts`) checks `params.query.trim()` for blankness but matches the untrimmed query, so `\\\" invoice \\\"` finds only messages containing the word with spaces on both sides. The bot-side Telegram search and the Slack and Discord searches trim first.\\n\\n**Expected**\\n\\nA padded query matches the same messages as the trimmed one.\\n\\nFix: #33197\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:22:49Z\",\"closedAt\":\"2026-10-04T00:07:52Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUy09_g\",\"title\":\"X connector reports an empty inbox when the DM fetch fails\",\"author\":\"hermesagent270-commits\",\"number\":33196,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.fetchConnectorMessages` and `listRecentConnectorTargets` (`plugins/plugin-x/src/services/x.service.ts`) catch a DM fetch failure (expired token, rate limit), report it, and return `[]`. An X outage therefore reads as an empty inbox. The LifeOps X read delegate returns `handled` with no DMs instead of `unavailable`, and the MESSAGE action sees no recent DM partners. The code comment itself says the failure must not read as an empty inbox.\\n\\n**Expected**\\n\\nThe failure propagates to the callers' existing error boundaries, as it does for the Discord, Slack and Telegram connectors.\\n\\nFix: #33195\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:19:14Z\",\"closedAt\":\"2026-10-04T03:12:03Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyzUzw\",\"title\":\"Form undo reverts an older change after a field's first answer\",\"author\":\"hermesagent270-commits\",\"number\":33194,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\nIn `@elizaos/plugin-form`, `FormService.updateField` records an undo entry only when the field already had a value, so a field's first answer is never in `session.history`. `undoLastChange` then reverts an older change, or does nothing.\\n\\n**Reproduction**\\n\\nA form with `name` and `email` (`allowUndo` is the default): set `name=Bob`, correct to `name=Rob`, set `email=a@b.co`, then undo. `name` goes back to `Bob` and `email` stays filled. Undo right after a single first answer returns `null`.\\n\\n**Expected**\\n\\nUndo reverts the most recent change: here it clears `email` and leaves `name` as `Rob`.\\n\\nFix: #33193\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:14:59Z\",\"closedAt\":\"2026-10-04T03:12:07Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyxDWQ\",\"title\":\"X connector attributes the account's own DMs to another user\",\"author\":\"hermesagent270-commits\",\"number\":33192,\"repository\":\"elizaos/eliza\",\"body\":\"**Describe the bug**\\n\\n`XService.buildXDirectMessageMemory` (`plugins/plugin-x/src/services/x.service.ts`) compares `senderId` (an X numeric user id) with `runtime.agentId` (a UUID) to decide whether a DM is the account's own. That comparison is never true. The account's own outbound DMs are stored as memories from a synthetic `x:user:\u003cown id\u003e` entity with `fromBot: false`, so the X message connector shows the agent's own replies as if another user wrote them.\\n\\n`listRecentDirectMessages` already marks own DMs with `isInbound: false`, but the builder only copies that into `metadata.x`.\\n\\n**Expected**\\n\\nOwn DMs have `entityId === runtime.agentId` and `fromBot: true`.\\n\\nFix: #33191\\n\\nAI provider/model: anthropic / claude-opus-5-5. Client: Claude Code.\\n\",\"createdAt\":\"2026-10-03T14:09:56Z\",\"closedAt\":\"2026-10-04T03:12:10Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyr3kg\",\"title\":\"CONTACT follow-up confirmations use the host timezone instead of the owner's\",\"author\":\"hermesagent270-commits\",\"number\":33190,\"repository\":\"elizaos/eliza\",\"body\":\"$48\",\"createdAt\":\"2026-10-03T13:58:58Z\",\"closedAt\":\"2026-10-04T03:12:12Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyqsDQ\",\"title\":\"fix(cloud): an explicit-but-unknown Google disconnect connectionId silently revokes a different connection\",\"author\":\"OutstandingRetard\",\"number\":33189,\"repository\":\"elizaos/eliza\",\"body\":\"$49\",\"createdAt\":\"2026-10-03T13:56:32Z\",\"closedAt\":\"2026-10-04T03:12:14Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUyc0sg\",\"title\":\"fix(scripts): install-time Bun pin guard must validate the installer runtime and describe its post-resolution failure\",\"author\":\"lumix5\",\"number\":33187,\"repository\":\"elizaos/eliza\",\"body\":\"$4a\",\"createdAt\":\"2026-10-03T13:26:15Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUxO8DA\",\"title\":\"Reminder dispatch and fallback bodies use the host timezone instead of the owner's\",\"author\":\"lumix5\",\"number\":33172,\"repository\":\"elizaos/eliza\",\"body\":\"$4b\",\"createdAt\":\"2026-10-03T10:29:35Z\",\"closedAt\":\"2026-10-04T03:12:25Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUwxa0A\",\"title\":\"Gmail replies can leave the original conversation thread\",\"author\":\"hermesagent270-commits\",\"number\":33165,\"repository\":\"elizaos/eliza\",\"body\":\"$4c\",\"createdAt\":\"2026-10-03T09:18:38Z\",\"closedAt\":\"2026-10-04T03:12:27Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUwVxWw\",\"title\":\"LIFE cadence summaries use host timezone and can delete the wrong reminder\",\"author\":\"hermesagent270-commits\",\"number\":33155,\"repository\":\"elizaos/eliza\",\"body\":\"$4d\",\"createdAt\":\"2026-10-03T08:11:04Z\",\"closedAt\":\"2026-10-04T03:12:29Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUvwkLw\",\"title\":\"PERSONAL_ASSISTANT sign_document approvals always fail with DOCUMENT_REQUEST_NOT_FOUND\",\"author\":\"hermesagent270-commits\",\"number\":33145,\"repository\":\"elizaos/eliza\",\"body\":\"$4e\",\"createdAt\":\"2026-10-03T06:27:06Z\",\"closedAt\":\"2026-10-04T03:12:31Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUuLX2Q\",\"title\":\"plugin-sql jsonb writes fail with raw PostgreSQL errors on lone UTF-16 surrogates\",\"author\":\"hermesagent270-commits\",\"number\":33125,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe plugin-sql jsonb sanitizer handles NUL but not lone UTF-16 surrogates (e.g. a truncated emoji `\\\"hi \\\\ud83d\\\"`), which PostgreSQL jsonb also rejects. Memory writes fail with a raw `invalid input syntax for type json` instead of a typed error, and a log body containing one fails the whole insert.\\n\\nReproduced on develop `811c3fac48` with the real PGlite adapter (createMemory text/metadata and log).\\n\\n## Acceptance\\n\\n- Strict writes reject lone surrogates with a typed error (as for NUL), leaving no partial row.\\n- Lenient sanitization (log bodies) replaces them with U+FFFD (as it strips NUL).\\n\\nFix: #33124\\n\",\"createdAt\":\"2026-10-03T01:45:12Z\",\"closedAt\":\"2026-10-04T03:12:35Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUuH4Qg\",\"title\":\"LIFE \\\"calendar today\\\" uses the host's midnight instead of the owner's day\",\"author\":\"hermesagent270-commits\",\"number\":33123,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nLIFE `query_calendar_today` builds \\\"today\\\" from the host clock's midnight plus 24 h and passes the host zone, ignoring the owner's timezone fact. On a UTC or shared server, an owner in New York asking at 21:00 gets tomorrow's events; DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48`: at `2026-10-03T01:00Z` (21:00 Oct 2 in New York), a `TZ=UTC` host queries `2026-10-03T00:00Z..2026-10-04T00:00Z` instead of `2026-10-02T04:00Z..2026-10-03T04:00Z`.\\n\\n## Acceptance\\n\\n- The calendar-today window is the owner's local day in their zone (23/25 h on DST days), independent of the host zone.\\n\\nFix: #33122\\n\",\"createdAt\":\"2026-10-03T01:35:21Z\",\"closedAt\":\"2026-10-04T03:12:37Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUuFC2g\",\"title\":\"queryEntities pagination skips and repeats entities across writes\",\"author\":\"hermesagent270-commits\",\"number\":33120,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`queryEntities` (plugin-sql `base.ts`) pages with `limit`/`offset` and no `ORDER BY`. Rows come back in physical order, which an `UPDATE` rewrites, so paging across a write skips an entity and serves another twice. plugin-form's `getRestorableSessions` pages this way and can drop a live session from restore.\\n\\nReproduced on develop `811c3fac48` on real PGlite: four entities paged with `limit: 1` across an `updateEntity` serve `e0, e2, e3, e0`.\\n\\n## Acceptance\\n\\n- Pages are totally ordered; each entity is served exactly once across a concurrent update.\\n\\nFix: #33119\\n\",\"createdAt\":\"2026-10-03T01:27:10Z\",\"closedAt\":\"2026-10-04T03:12:38Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUt--tg\",\"title\":\"Quiet-hours gate refires an hour off on DST nights\",\"author\":\"hermesagent270-commits\",\"number\":33118,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe `quiet_hours` gate defers by a wall-clock minute count (`until.offsetMinutes`), so a DST change inside the window shifts the refire: with quiet hours 22:00–07:00, a task deferred at 22:30 refires at 08:00 after spring-forward (New York, London), at 06:00 (still quiet) after fall-back, and at 07:30 in Lord Howe.\\n\\nReproduced on develop `811c3fac48` with the real gate.\\n\\n## Acceptance\\n\\n- Deferral targets the window's end instant in the owner's zone (`until.atIso`), 07:00 local on DST nights.\\n\\nFix: #33117\\n\",\"createdAt\":\"2026-10-03T01:10:32Z\",\"closedAt\":\"2026-10-04T03:12:40Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUt7WRA\",\"title\":\"GENERATE_MEDIA rejects the voice, genre, instrumental, quality, style, and negativePrompt it supports\",\"author\":\"hermesagent270-commits\",\"number\":33116,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`GENERATE_MEDIA` forwards `quality`, `style`, `negativePrompt`, `instrumental`, `genre`, and `voice` to the media service, but none is declared in the action's `parameters`. Core `validateToolArgs` rejects undeclared arguments, so a planner call can never choose a TTS voice, instrumental music or a genre, or image quality/style/negative prompt.\\n\\nReproduced on develop `811c3fac48` with the real `validateToolArgs`: `{ mediaType: \\\"audio\\\", audioKind: \\\"tts\\\", prompt, voice: \\\"nova\\\" }` → `Unexpected argument 'voice'`.\\n\\n## Acceptance\\n\\n- The six controls are declared (with the enums `buildRequest` accepts) and reach the media service from a validated planner call.\\n\\nFix: #33115\\n\",\"createdAt\":\"2026-10-03T01:00:41Z\",\"closedAt\":\"2026-10-04T03:12:42Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUtvzUQ\",\"title\":\"plugin-sql getLogs returns and deletes other agents' logs in a shared database\",\"author\":\"hermesagent270-commits\",\"number\":33113,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nIn a database shared by several agents, `getLogs` (plugin-sql `base.ts`) returns every agent's logs whenever no `roomId` is passed, because the `logs` table has no agent column and the query has no room/agent join. `deleteLogs`/`updateLogs` act on any id. Agent export therefore includes other agents' logs, and the logs-retention sweep and inference-timing pruner delete other agents' rows.\\n\\nReproduced on develop `811c3fac48` with two real `PgliteDatabaseAdapter`s on one PGlite database: `A.getLogs({ type: \\\"inference_timing\\\" })` returns B's log too.\\n\\n## Acceptance\\n\\n- `getLogs` returns only logs in the calling agent's rooms (as `getAgentRunSummaries` already does).\\n- `deleteLogs`/`updateLogs` cannot touch another agent's rows.\\n- Export pagination is stable.\\n\\nFix: #33112\\n\",\"createdAt\":\"2026-10-03T00:30:58Z\",\"closedAt\":\"2026-10-04T03:12:44Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUtq-2w\",\"title\":\"Google Fit health summaries use UTC days instead of the owner's local day\",\"author\":\"hermesagent270-commits\",\"number\":33111,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nThe health bridge documents day keys as calendar days in `HealthBridgeConfig.timeZone` (#31248/#31264), but the Google Fit backend aggregates `${date}T00:00Z` + 24 h, enumerates sleep days in UTC, and `getHealthDailySummary(date)` passes no zone. Every owner outside UTC gets Google Fit steps, sleep, heart rate, and calories for the wrong window every day, and DST days are always 24 h.\\n\\nReproduced on develop `811c3fac48` (real `getDailySummary`, `fetch` stubbed): Asia/Kolkata 2026-10-02 is aggregated 05:30–05:30 IST; America/New_York 2026-03-08 is aggregated 3/7 19:00 EST – 3/8 20:00 EDT.\\n\\n## Acceptance\\n\\n- Google Fit day windows are local midnight to local midnight in the owner's zone (23/25 h on DST days).\\n- Sleep series use the owner's local days.\\n- The daily-summary path receives the owner's zone, like the trend path.\\n\\nFix: #33110\\n\",\"createdAt\":\"2026-10-03T00:19:03Z\",\"closedAt\":\"2026-10-04T03:12:45Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUtcGkg\",\"title\":\"Orchestrator rewrites GitLab subgroup repository URLs to the parent group\",\"author\":\"hermesagent270-commits\",\"number\":33109,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\n`normalizeRepositoryInput` in `plugins/plugin-agent-orchestrator/src/services/repo-input.ts` keeps only two path segments, so `https://gitlab.com/group/subgroup/project` becomes `https://gitlab.com/group/subgroup.git`, which can never be a repository (GitLab namespaces cannot hold a project and a subgroup with the same path). The TASKS action's text extractor also captures only two segments. Every coding task for a GitLab subgroup project therefore fails to clone.\\n\\nReproduced on develop `811c3fac48`: `https://gitlab.com/gitlab-org/charts/gitlab` normalizes to `https://gitlab.com/gitlab-org/charts.git`, and `git ls-remote` on that URL fails, while `…/charts/gitlab.git` lists branches.\\n\\n## Acceptance\\n\\n- GitLab URLs keep the full namespace path up to the `/-/` page separator (and legacy page routes).\\n- GitHub and Bitbucket keep `owner/repo`; existing forms normalize as before.\\n- Output still passes `assertSafeGitRemote`.\\n\\nFix: #33108\\n\",\"createdAt\":\"2026-10-02T23:44:09Z\",\"closedAt\":\"2026-10-04T03:12:47Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUogUog\",\"title\":\"fix(cloud): reject malformed Google disconnect bodies before bulk removal\",\"author\":\"hermesagent270-commits\",\"number\":33073,\"repository\":\"elizaos/eliza\",\"body\":\"$4f\",\"createdAt\":\"2026-10-02T15:30:21Z\",\"closedAt\":\"2026-10-04T03:12:49Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoWsMQ\",\"title\":\"crypto refunds: a malformed or reused refund key is reported as CRYPTO_REFUND_INVALID_AMOUNT\",\"author\":\"nothingxnowhere\",\"number\":33065,\"repository\":\"elizaos/eliza\",\"body\":\"$50\",\"createdAt\":\"2026-10-02T15:17:29Z\",\"closedAt\":\"2026-10-04T03:12:52Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoQdlA\",\"title\":\"LOGS delete and RUNTIME reload_config report success on unacknowledged responses\",\"author\":\"hermesagent270-commits\",\"number\":33062,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nTwo agent actions report success on a 2xx response that does not carry the route's acknowledgement (the defect 6beb04b5c1 fixed for PLUGIN configure):\\n\\n- LOGS `delete` (`packages/agent/src/actions/logs.ts`): `resp.json().catch(() =\u003e ({}))` and a defaulted `cleared` make a proxy page, `{}`, or `{\\\"cleared\\\":\\\"lots\\\"}` report \\\"Cleared 0 log entries.\\\" with `success: true`.\\n- RUNTIME `reload_config` (`packages/agent/src/actions/runtime.ts`): `{}` or `{\\\"reloaded\\\":false}` reports \\\"No hot-reloadable fields changed.\\\" with `success: true`.\\n\\nReproduced on develop `27dec7b0c3` with the real handlers and a stubbed fetch.\\n\\n## Acceptance\\n\\n- Each op fails with its `*_FAILED` code unless the body matches its route: `{ cleared: \u003cnon-negative integer\u003e }` and `{ reloaded: true, applied: string[], requiresRestart: string[] }`.\\n- Genuine acknowledgements behave as before.\\n\\nFix: #33060\\n\",\"createdAt\":\"2026-10-02T15:09:36Z\",\"closedAt\":\"2026-10-04T03:12:54Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoPLRQ\",\"title\":\"agent status: canRespond is true on a runtime whose only text handler is the local-inference router\",\"author\":\"nothingxnowhere\",\"number\":33059,\"repository\":\"elizaos/eliza\",\"body\":\"$51\",\"createdAt\":\"2026-10-02T15:07:58Z\",\"closedAt\":\"2026-10-04T03:12:56Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUoIk5w\",\"title\":\"cloud operator scripts: refund, promote-admin and set-billing-email cannot start (unresolvable @/ imports)\",\"author\":\"nothingxnowhere\",\"number\":33054,\"repository\":\"elizaos/eliza\",\"body\":\"$52\",\"createdAt\":\"2026-10-02T14:59:17Z\",\"closedAt\":\"2026-10-04T03:12:59Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUnqlJw\",\"title\":\"fix(cloud): reject malformed Docker-node drain bodies before mutation\",\"author\":\"hermesagent270-commits\",\"number\":33050,\"repository\":\"elizaos/eliza\",\"body\":\"$53\",\"createdAt\":\"2026-10-02T14:19:59Z\",\"closedAt\":\"2026-10-04T03:13:01Z\",\"state\":\"CLOSED\",\"commentCount\":0},{\"id\":\"I_kwDOMT5cIs8AAAABUnkNmA\",\"title\":\"Log redaction clones print a Symbol.toPrimitive line on every object under Bun\",\"author\":\"hermesagent270-commits\",\"number\":33049,\"repository\":\"elizaos/eliza\",\"body\":\"## Defect\\n\\nSince #32957, every plain and Map/Set clone produced by `packages/core/src/security/log-redaction.ts` carries an own non-enumerable `Symbol.toPrimitive`. Bun's console prints non-enumerable symbol keys, so under Bun every object passed as a trailing log argument shows `[Symbol(Symbol.toPrimitive)]: [Function: value]` once per nesting level:\\n\\n```\\n Info       probe-console-symbol {\\n  [Symbol(Symbol.toPrimitive)]: [Function: value],\\n  owner: {\\n    [Symbol(Symbol.toPrimitive)]: [Function: value],\\n    id: \\\"u1\\\",\\n  },\\n```\\n\\nReproduced on develop `27dec7b0c3` with `logger.info(\\\"probe-console-symbol\\\", { owner: { id: \\\"u1\\\" } })` under Bun 1.4.2; Node 24 prints the same clone without it.\\n\\n## Acceptance\\n\\n- Clones without a shadowing `toString` own no symbol keys and print cleanly under Bun.\\n- #32957's coercion protection still holds for clones that own a non-callable `toString` (and for Error clones).\\n\\nFix: #33048\\n\",\"createdAt\":\"2026-10-02T14:11:25Z\",\"closedAt\":\"2026-10-04T03: 09-29T01:03:26Z\",\"mergedAt\":\"2026-09-29T18:34:31Z\",\"additions\":497,\"deletions\":12},{\"id\":\"PR_kwDOMT5cIs8AAAABGQ3DyQ\",\"title\":\"fix(core): make log redaction faithful and bounded\",\"author\":\"hermesagent270-commits\",\"number\":33045,\"body\":\"$aa\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T10:18:21Z\",\"mergedAt\":\"2026-10-04T02:29:24Z\",\"additions\":495,\"deletions\":39},{\"id\":\"PR_kwDOMT5cIs8AAAABFmwxhA\",\"title\":\"fix(ui): skip retired app catalog on view-only launcher\",\"author\":\"NubsCarson\",\"number\":32918,\"body\":\"Home showed “More apps unavailable” because its view-only launcher requested the retired installed-app catalog. Disable app catalog loading for that caller while retaining registered views, authority isolation, and real view errors. Other callers retain the existing default.\\n\\nValidation on the reviewed integration: 40 launcher/catalog tests passed; `bun run verify` passed all 284 tasks and repository audits with Node 24.15.0 and Bun 1.4.2. Affected desktop/mobile captures have been inspected. The complete app visual audit is still running; this remains draft until that finishes.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-29T01:02:48Z\",\"mergedAt\":\"2026-09-29T21:27:09Z\",\"additions\":490,\"deletions\":147},{\"id\":\"PR_kwDOMT5cIs8AAAABGXR_yw\",\"title\":\"Snooze reminders from the current eligible time\",\"author\":\"NubsCarson\",\"number\":33097,\"body\":\"Snoozing a reminder must use the current eligible occurrence and current time, including future reminders, without changing unrelated occurrences or history. Correct the existing snooze path and cover it with real PGlite persistence scenarios.\\n\\nValidation: real-database snooze cases and full verification passed on the earlier focused candidate. The latest-develop combined candidate passed full verification; final integrated physical QA remains pending. This PR stays draft.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-02T22:15:19Z\",\"mergedAt\":\"2026-10-03T23:14:58Z\",\"additions\":489,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABF8o-pw\",\"title\":\"Reduce redundant task context and hosted reply planning\",\"author\":\"NubsCarson\",\"number\":32972,\"body\":\"Successful internal task results could repeat the canonical persona in extractor input and generate an unbound reply-planner answer before the host’s receipt-bound evaluator.\\n\\nThe extractor separates only the trusted system prefix that exactly matches the live persona/role; dialogue, constraints, providers, receipts, repair and restoration remain intact. The hosted single-tool final-scope path now invokes semantic evaluation directly. Pre-tool prose cannot bypass that evaluation; queued work, pending dependencies and legacy standalone callers retain their existing paths.\\n\\nValidation: independent review; Core24, PA38 and Assistant132 focused tests; full combined verification/build. A two-packet, effect-free Qwen comparison removed513 input tokens (15,640→15,127) with valid plans on both sides. The reply-planner reduction is proved by no-I/O native/JSON/failure/legacy regression tests; fresh whole-chat timing remains pending. No queue batching, model-default change or new network call.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-30T17:54:37Z\",\"mergedAt\":\"2026-10-01T11:08:52Z\",\"additions\":478,\"deletions\":50},{\"id\":\"PR_kwDOMT5cIs8AAAABFSbphA\",\"title\":\"fix(assistant): expose bounded tools for pending domain work\",\"author\":\"NubsCarson\",\"number\":32824,\"body\":\"$ab\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-26T21:37:06Z\",\"mergedAt\":\"2026-09-27T00:57:05Z\",\"additions\":468,\"deletions\":185},{\"id\":\"PR_kwDOMT5cIs8AAAABGe9GsQ\",\"title\":\"fix(security): triage promotion history and remove bundled vLLM auth\",\"author\":\"lalalune\",\"number\":33224,\"body\":\"$ac\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-10-03T22:16:22Z\",\"merg
