gotiated capability and matching target identity; replay retrieves the bounded historical result without a new device read.\n- Managed Cloud owner configuration and Google delegation provide identity and Gmail/Calendar access boundaries with server-side credentials and scope checks.\n- Action discovery retains umbrella actions when a resource-specific alias matches, preserving role and context eligibility.\n- Workflow mutation replies carry canonical receipts from the actual committed definition. Cancellation provenance is captured under the row lock, with per-service workflow control serialization. Submission, cancellation requests and pending device approvals cannot serve as proof that the requested operation completed. Pending workflow widgets retain their callback delivery.\n\nValidation at prior head 252152eaa0352fd26f4824371e967bbf4e828bfd:\n\n- Focused workflow SQL/worker/settlement/evaluator/parser checks: 7 tests and 243 assertions passed; workflow typecheck and lint passed.\n- Device HTTP/PGlite lifecycle and evaluator checks passed, including refusal of false completion claims for pending approval, unknown outcomes and selected reads; assistant and agent typechecks passed.\n- Independent source review found no remaining blocker in the receipt correction. Cancellation serialization is per service instance; it is not a cross-process SQLite guarantee.\n- Full frozen installation, all284 standard root tasks and audits, emitted host build, twelve compiler cases, packaged Reminder flow and import guard passed with unchanged source. The original aggregate run failed on an unexplained cancellation HTTP reset. Separate unchanged-source workflow recovery passed31/31 files and167 tests; that original failure remains recorded.\n- The separately enabled historical compiler-upgrade E2E passed24 assertions with historical source and current dependencies.\n- Actual Cerebras qwen-3.8-27b chat completed with seven model calls, created one inactive unscheduled workflow, then a manually reviewed source was explicitly approved and executed once to return56. Removal preserved canonical approval/execution/lifecycle receipts, confirmed by fresh readback. This is local synthetic workflow acceptance.\n\nHosted CI36908850398 completed successfully at exact head252152eaa0352fd26f4824371e967bbf4e828bfd, including source/build checks, billing replay and PostgreSQL.\n\nNative paired Maps flows, Cloud login/Gmail revocation and physical-device acceptance remain pending. This draft does not establish complete MVP or deployment acceptance.\n\nCurrent head ab8f9a7110ae adds one bounded correction for model-authored invalid source quotes before any response field or action effects. The exact source validator remains unchanged; a repeated invalid reply fails closed. Actual HTTP/auth/PGlite/planner tests pass four cases, including one pending Maps proposal with rejected draft facts absent from storage. Sixteen owning pipeline cases, production and test-inclusive typechecks and formatting checks pass. Full exact-head qualification and live provider/native acceptance are pending.\n"])</script><script>self.__next_f.push([1,"5a:T2552,"])</script><script>self.__next_f.push([1,"## Summary\n\nThis PR implements the code findings from the compliance research review (`compliance-research-2026-09-18`) across core, agent, cloud and app/ui, re-checked against HEAD. It also removes about 2,500 lines of dead or duplicate code.\n\n### core\n- A typed modality table drives PII swap and binary/text handling. `TEXT_EMBEDDING_BATCH`, `TEXT_TO_SPEECH` and `PII_SCRUB` are no longer pseudonymized.\n- A host-only processing policy extends `ConfidentialInferenceAuthority`. It admits each attempt before the secret/PII swap, the hooks and the handler.\n  - A denial is terminal: it never fails over, the embedding queue doesn't retry it, and it isn't retryable when a model call inside an action handler raises it.\n  - The policy sees the model type the caller asked for, before any LLM-mode override.\n  - With no policy installed, behavior is unchanged.\n- `runActionsByMode` and plugin-assistant plan steps now settle through the action gate (`settleActionHandler`).\n- Removed, with zero in-repo callers: the `zod-schema.agent-runtime` subpath, `ToolPolicyService` / `getFilteredActions` / `isActionAllowed`, 17 private model wrappers in `runtime.ts`, and duplicate helpers. `canonicalJson` and `parseBooleanFromText` now each have one implementation. The shared canonical backup JSON rejects sparse array holes.\n\n### agent\n- `ELIZA_PROTECTED_PROFILE=dstack-cpu` (captured from the process env at entry) runs admission before config load, vault hydration, API listen and plugin resolution.\n- `ELIZA_TEE_*`, `ELIZA_DSTACK_*`, `ELIZA_CONFIDENTIAL_*` and `ELIZA_PROTECTED_*` are env-only. They are blocked from config and API env writes, and the state-dir `config.env` can't apply or persist them either.\n- Evidence-factory registration is refused under the profile.\n- Audit sinks are async, and a failure in a required sink now rejects. Retention never deletes audit log types. Confidential-runtime schema is v2.\n\n### cloud\n- API key create, delete, regenerate and mobile revoke write their audit event in the same transaction. A sink failure rolls the change back.\n  - An oversized client `X-Request-Id` is dropped from the event instead of failing the write.\n- PII scrub markers record their inspection scope (migration `0506`).\n- There is a single retryable provider-fallback middleware with a `ProviderFallbackPolicy` hook. A refusal throws `PROVIDER_FALLBACK_REFUSED`.\n- With `FIELD_ENCRYPTION_REQUIRED`, agent env secrets no longer fall back to plaintext. `FIELD_ENCRYPTION_REQUIRE_AAD` is documented as off until writers pass coordinates.\n- New `user_consents` table (migration `0507`) with `GET`/`POST /api/v1/me/consents` for `vision_capture`. GET also returns `effective` (the enforced policy, with `basis` and `defaultGranted`) and `capture.modelCallRecording` (the deployment's recording policy).\n  - There's a user-scoped live `POST /api/v1/me/data-export` that requires a recent login.\n- A single `getRequestIp` helper (`cf-connecting-ip` first) serves all webhooks. Expired `auth_events` are purged.\n\n### app / ui\n- There is one session-cookie parser: identical duplicate cookies are accepted, conflicting ones rejected.\n- Logout revokes every presented session credential, including conflicting duplicates, and also expires the `Domain` variant.\n- Revoking a session closes its open WebSockets (1008). Admission re-reads the session after binding, so a revoke that races the handshake can't leave a socket open.\n- The privacy panel shows the deployment's model-call recording policy (read-only) and leaves vision/screen capture to device permissions. It uses the live export endpoint.\n- Removed the dead first-run fork, update policy, `api/response` and `globals` shims.\n\n### Review feedback addressed\n- Migration collisions: renumbered to `0506_pii_scrub_markers_inspection_scope`, `0507_user_consents` and `0508_app_notification_secret_envelope_v2`. These are the filenames present in the current branch.\n- The sparse-array bug in canonical backup JSON is fixed.\n- The consents API exposes the effective policy and default, as distinct from an explicit grant.\n\n### Model-call recording, session controls and attestation\n**Recording (no consent; off in production):**\n- The cloud records billed model calls under one policy: `LLM_TRAJECTORY_CAPTURE=on|off`, otherwise off in production and on elsewhere. The `trajectory_training` consent purpose is removed.\n- Payloads never go to the public `BLOB` bucket. They use a dedicated private store when one is bound, otherwise Postgres.\n- Bodies are encrypted with row-bound org field encryption.\n- `LLM_TRAJECTORY_RETENTION_DAYS` (default 90) sets retention, enforced by a daily purge.\n- Account deletion removes payload objects by org prefix, orphans included.\n- The agent's trajectory gate defaults off under `ELIZA_PROTECTED_PROFILE`. Operators can still enable it inside the TEE.\n\n**Session and data safeguards:**\n- **Automatic logoff:** the protected profile gets a 30-minute idle logoff and a 12h absolute cap. `ELIZA_SESSION_IDLE_MINUTES` sets the idle window in any profile. The idle window slides only on real user activity (`x-eliza-last-activity` from the shared UI clients, allowed in CORS for remote agents), never on background polling or sockets.\n- **Password change:** revokes every other session and closes its sockets.\n- **Auth store:** row counts no longer assume success.\n- **Media:** under the protected profile, media is served only after authentication. Same-origin cookie auth keeps `\u003cimg\u003e`/`\u003caudio\u003e` working.\n- **Field encryption:**\n  - Row-bound writes use an `enc:v2` envelope that authenticates its AAD flag.\n  - Unbound writes keep the legacy v1 bytes for old readers.\n  - `SECRETS_MASTER_KEY_PREVIOUS` plus a guarded DEK rewrap enable master-key rotation.\n  - Migration `0508` lets the billing notification guard accept v2.\n- **Audit logs:** the audit-log purge cron now actually runs (7-year retention).\n\n**Attestation implementation and emulator validation (hardware acceptance pending):**\n- **In-repo verification:** dstack v1 attestations and TDX v4/v5 quotes are parsed in-repo. The raw report_data binding, the TD debug bit, the quote's self-signature and register agreement are checked independently of the pinned external verifier.\n- **Hardware-free harness:** a fake guest-agent socket, a pinned stub verifier and an NRAS emulator drive the real admission code to success and through a rejection matrix. The matrix includes dstack simulator output.\n- **GPU attestation:** NVIDIA confidential-GPU attestation goes through NRAS, and the ES384 EAT tokens are verified locally against NVIDIA's CA. GPU claims can only come from verified evidence bound to the TDX nonce.\n- **Key release:** the agent appraises its own evidence before trusting any KMS. A dstack `GetKey` client verifies the KMS signature chain to a pinned root.\n- **Satisfiable topologies:** the state-volume, `tdx-cpu` and GPU weight topologies and the dstack cloud inference profile require only claims that dstack and NRAS evidence actually establish.\n- **Test lanes:** `test:tee:dstack` (hardware-free) and `test:tee:dstack-live`, which is opt-in for a real CVM, the dstack simulator and H100 CC GPUs.\n\nThe model-weight unseal helpers are available, but the production model loader does not yet call `prepareConfidentialModelWeights`. This PR does not establish encrypted-weight loading in the shipped inference path or regulatory compliance.\n\n**Deploy order:**\n- Apply migration `0508` before deploying the Worker. Billing notification secrets are written as `enc:v2`.\n- Roll out readers before relying on `SECRETS_MASTER_KEY_PREVIOUS`.\n\n### Follow-ups\n- **Processing policy:** before any host installs a policy, first-party actions need an `egress` declaration, including `egress: []` for the security evaluator hook. Otherwise every action is denied as `destination_undeclared`. No host installs a policy today.\n- **PII swap:** it now skips `TEXT_TO_SPEECH` and `PII_SCRUB`, so a remote TTS provider receives real names. Confirm this is intended, or scope the skip to local providers.\n- **`FIELD_ENCRYPTION_REQUIRE_AAD`:** it stays off until agent env secrets can be row-bound. They are encrypted before their row id exists.\n- **Real hardware:** running `test:tee:dstack-live` on a dstack TDX CVM (and an H100 CC GPU) needs infrastructure.\n\n## Verification (Node 24.15.0, Bun 1.4.2, merged with develop `4778fe302d5`)\n- Root `bun run verify` passes on the merged tree (284/284 turbo tasks, all audits).\n- core: full suite earlier in this PR; `trajectory-gate` passes (5).\n- cloud-shared: 56 targeted tests pass: capture policy, trajectory storage and encryption, field encryption, account-deletion payloads and adapters, fallback policy, PII scrub. The 15 app-billing/generic-billing Postgres suites pass (45 pass; the rest skip without a live Postgres).\n- cloud-api: consents/export, API-key audit transaction and PII scrub route pass (13).\n- ui: account-security, auth/activity and client tests pass (77 before the final merge; account-security 52 after it).\n- app: auth store, session idle/protected-profile/cookie, browser-session WebSocket and password-change revocation pass (52).\n- agent (real end-to-end): TDX/dstack admission, protected profile, GPU attestation, live lane (skipped without hardware), protected media, media capability, TEE env boundary and audit durability pass (10 files). `scripts/tee-full-stack-local.ts` passes.\n- `check-migration-prefix-order` passes. The router was regenerated.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\n"])</script><script>self.__next_f.push([1,"5b:T16bf,"])</script><script>self.__next_f.push([1,"# Relates to\n\nAction tasks loaded unrelated schemas, sometimes finished without requested readback, and rebuilt avoidable prompt context. Simple arithmetic could unnecessarily enter evaluation. Paused work could lose its original domain when the response handler returned a simple reply.\n\n# Change\n\nKeep the response handler focused on contexts and intents. Use task-scoped `DISCOVER_ACTIONS`, operation-specific schemas, canonical tool ordering, stable evaluator instructions and instruction-aware cache affinity. Document verification/reference codes no longer infer programming work. Complete authorized source text and receipts remain intact.\n\nContinue against every requested outcome, with prerequisite barriers, verified receipts, explicit additional-budget resume, fresh authorization and cancellation. Saved schemas are not reused. Ambiguous effects are parked rather than replayed. Preserve external continuation-worker fixes. Completed simple answers stay on the one-call path.\n\nPreserve exact FILE bytes and final- usage, prefix and context evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [Exact-byte/readback task acceptance and final text/PCM parity](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no product rendered surface changes.\n\n# Evidence Details\n\nComplete prompts, wire requests/responses and failed diagnostics remain private local artifacts; public evidence contains synthetic acceptance and allowlisted metrics only. No deployment, physical voice acceptance, universal cache target or distributed exactly-once guarantee is claimed. Outcome interpretation remains model-dependent. Whole-revision historical comparisons include develop changes and do not isolate every gain to one patch.\n"])</script><script>self.__next_f.push([1,"5c:T1376,"])</script><script>self.__next_f.push([1,"This PR fixes the behavior bugs from the core/agent/app quality review (report §3). It includes only bugs that need **no owner decision** and **do not overlap** the unmerged `shaw/agent-framework-review-refactor-e7a9a1` branch. Each fix is its own commit with a regression test that fails on the old code and passes with the fix.\n\nDead-code deletion, consolidation, and the 28 owner decisions (D1–D28) are not in this PR. They wait for review.\n\n## Fixes (report bug numbers)\n**Security / data loss**\n- agent: capability-router persistence refuses to overwrite corrupt state instead of erasing every endpoint and trust policy (#1).\n- agent: malformed trust-policy / allowed-modules env settings now fail closed (#2).\n- agent: VFS git sends the host GitHub token only to `https://github.com`, and an empty env var counts as unset (#3).\n- agent: postgres restore and the VFS `\u003e\u003e` redirect propagate failures instead of swallowing them (#5, #7).\n- elizacloud: one shared dowRenderer`, and the dead fork is deleted (#56).\n- benchmarks: recall-bench and entity-voice-bench import from their plugin homes (#58).\n- agent: dead `shouldReject` branch removed from the context inspector (#59).\n\n**Build / release tooling**\n- The gateway maintainer deploys only on the explicit drift exit code 3 (#60).\n- Device leases are written atomically (#61).\n- apk extract failures propagate (#62).\n- `sleepSync` is defined (#24).\n- `clean-repo` removes homepage outputs (#26).\n- The voice catalog fails closed and the default id is `same` (#36).\n- The walkthrough, fused-lib, libllama, iOS smoke and patch-deps scripts fail closed (#63, #64, #66–#68).\n- The renderer shares the LP3/VPS flag predicates with the native build policy (#65).\n\n## Behavior changes to review\n- `resolveActivePgliteDataDir` (agent `runtime/eliza.ts`) is now exported and gives `config.database.pglite.dataDir` precedence over `PGLITE_DATA_DIR`, matching `applyDatabaseConfigToEnv`. This file is also edited on the agent-framework branch, so expect a small merge.\n- Desktop flags now honor `on`/`off`/`yes`/`no`. An unrecognized value keeps the default and logs a warning.\n- Cloud log redaction output differs slightly. Cycles now show as `[Circular]`, and a PEM block masks to `***`. It masks the same or more than before.\n- The benchmarks now import `@elizaos/plugin-assistant` and `@elizaos/plugin-relationships`. These resolve through workspace hoisting and are not yet declared in the suites' `package.json`.\n\n## Verification\n- `tsc` passes for core, agent, app (host + renderer), plugin-assistant and plugin-elizacloud.\n- Biome reports 0 errors on the 136 changed files.\n- All 55 new or changed test files pass under their package runners (vitest, bun test, node --test).\n- Each fix was also checked against the pre-fix code, where its regression test fails.\n- I have not run the full `bun run verify` locally because the machine is heavily loaded; hosted CI covers it.\n\n🤖 Generat l suites all passed. Exact PR-head hosted checks remain a separate merge gate.\n\n## Current validation\n\nHead `fbb16af0dbdc8457bd323ced1589b832bc2f7665` includes the post-refresh presentation fence: a pause or authorization change during an awaited refresh suppresses the stale choice. Presentation fixtures use actual HTTP admission, file-backed SQLite, and filesystem effects. Integrated host-policy head `ebf1940c33d8c528eddf6d59ac5aa2989b705c2d` passes 25 task tests, two credential-configuration tests, and two Cloud action-policy tests under Node24.15.0/Bun1.4.2. Its full root verification and exact-head hosted checks are running. Prior combined head22a855 passed all284 tasks and final audits; that earlier result does not qualify the new revision by itself.\n\n## Current repair and validation\n\nHead `fbb16af0dbdc8457bd323ced1589b832bc2f7665` integrates develop, including the reminder context change. A real HTTP/Pause regression reproduced stale choice delivery after refresh. Reads now recheck the task epoch, active status and authorization immediately before returning the widget.\n\nAll 21 related HTTP, presentation and choice tests pass. The new presentation scenarios now use authenticated HTTP task admission, file-backed SQLite and actual filesystem selection effects; they preserve restart, stale publication, forged labels and actor isolation checks. Agent typecheck initially failed because a cold ignore-scripts install had no embeddings declarations; the owning builds and final typecheck/lint are running. Full combined-stack verification and current-head hosted checks remain required. Earlier-head results below are historical and do not qualify this head.\n\n# Relates to\n\nDepends on #32976, #32980, #32981, #32983 and #32984. This branch includes the preceding stack and must not merge ahead of its dependencies.\n\n# Change\n\nChat delivery needs a durable view of a host-issued task choice without offering it again or executing a task. Add SqliteTaskPresentati escription26 tests passed; both packages typecheck/lint passed. Earlier reviewed task-stack repairs are included. Combined-stack root and current-head hosted checks are pending. Linked original-head artifacts were not regenerated.\n\n# Relates to\n\nDepends on #32976, #32980, #32981 and #32983. This branch includes the preceding stack; do not merge ahead of its dependencies. Review this extraction at the final commit.\n\n# Change\n\nPausing or cancelling a PDF task previously allowed rendering, OCR or Cloud vision to continue and could publish a late result. Complete PDF extraction now captures its options, rechecks host ownership before external work and publication, forwards AbortSignal to the model, and preserves cancellation instead of reporting a model outage. Cloud image description forwards the signal to the shared SDK, interrupts retry waits and rejects late responses.\n\nHosts supply task/account authorization; bill parsing and Senior Care workflow remain outside these shared packages. Add the testing workspace dependency already imported by existing Cloud plugin tests.\n\n# Original-head validation\n\n- PDF service: 52 tests passed, including cancellation during rendering/OCR/model work, changed caller options and suppressed page publication.\n- Cloud image: 26 tests passed, including pre-dispatch cancellation, late responses and interrupted warming waits.\n- Owning build/typecheck/lint: all eight tasks passed.\n- Root verification passed: all 284 tasks and repository audits.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:0c5c6c8dea7fe4ad9d7c89f9a98ac80c782e303c --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - this commit changes backend cancellation; inherited UI evidence is attributed below.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32984-desktop-retry.png)\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] https://githu y at this PR's exact head and must finish before merge. Earlier native/visual artifacts below remain scoped to their original head and unchanged files.\n\n## Current review validation\n\nHead `a6c214942abf810163baf9681d1d1159f07abcad` includes the reviewed foundation/browser/UI ancestry. Full-message metadata now uses the existing fixed maximum independently of the selected attachment limit; attachment fetch/decode retains the caller limit. Both new large-message/small-attachment regressions failed before the repair and passed afterward. Full Google Workspace suite: 472 passed. Focused managed Cloud Gmail suite: 13 passed. Both owning typecheck/lint checks passed. Combined-stack root and current-head hosted checks are pending. Linked original-head artifacts were not regenerated.\n\n# Relates to\n\nDepends on #32976, #32980 and #32981; review this extraction at commit `67580d208dad5269a7df2c87bb2a9e8e245c0612`. This branch includes the preceding stack and must not merge ahead of its dependencies.\n\n# Change\n\nAdd explicit-account Gmail attachment inventory and bounded complete-byte reads, preserve search continuation, and generate mailbox-specific source links without silently selecting mailbox zero. Managed Cloud reads reuse the shared MIME decoder and require the exact grant for attachment content. Both readers revalidate account access after the final provider response before releasing bytes.\n\nAdd a host-only task code resolver bound to account, actor, agent, task, epoch, provider, recipient and actual challenge. Ambiguous, expired or incomplete searches return no handle; a ready code is referenced opaquely and consumed once by a trusted fill adapter. Provider parsing, task authorization and revocation are supplied by the host. There is no generic newest-code fallback or model-facing code action.\n\n# Original-head validation\n\n- Google plugin: 18 focused tests passed for attachments, source links and task-code resolution.\n- Cloud: 12 focused tests passed for attachment reads and paginated account-bound search.\n- Both attachment readers have final-response revocation regressions.\n- Owning typecheck/lint: 12 tasks passed.\n- Root verification passed: all 284 tasks and repository audits.\n\n- [x] Targets develop; dependencies above are explicit.\n- [x] Root verification passed; Bun installation updated only the added workspace dependency in the lockfile.\n- [x] Updated owning READMEs.\n\n# Evidence Gate\n\n\u003c!-- evidence-head:9a940b67e841eac1342e12a4cb655df16f6c8fdf --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - this extraction adds no rendered UI; UI dependency evidence is in #32981.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] ![after-screenshots](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32983-desktop-retry.png)\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32983-desktop.mp4\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [32983-tests.log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32983-tests.log)\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend changes in this extraction.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - deterministic account-bound reads and opaque code resolution; no model or prompt changes.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [32983-senior-google-root.log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32983-senior-google-root.log)\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] [32983-ocr-review.txt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32983-ocr-review.txt)\n\n# Evidence Details\n\nTests run actual reader/parser/resolver code with explicit scoped provider fixtures. They check complete attachment bytes and SHA-256, malformed/oversized data, message/part identity, mailbox routing, pagination, challenge ambiguity, expiry, SID-bound native handles and immutable source publication. Windows workers load trusted built-in PowerShell modules and detach from the parent while retaining RPC pipes. Android recovery authenticates surviving workers and rechecks detached-agent liveness before admitting a new generation. Unproven ownership and interrupted effects remain unknown.\n\nClock proposals require the enrolled clock.handoff.v1 capability, explicit device review and canonical claim/receipt handling. Set operations bind hour/minute to the current phone timezone. Strict typed receipts distinguish opened, unavailable, denied, failed and unknown; opened establishes only the Clock handoff, never alarm creation or ringing. Date, recurrence and DST-fold selection are outside this handoff contract.\n\nValidation:\n\n- Current head 28ee31f8fc69cb3610aa92e6ae2601c496419d03: owning HTTP/PGlite approval, claim, receipt and replay lifecycle passes; assistant typecheck and package lint pass. Full bun run verify passes in 758.3 seconds with all 29,825 source files unchanged.\n- Clock coverage includes all five capability tokens, malformed/duplicate capability rejection, current-message timezone propagation, strict outcome binding, preapproval rejection and no duplicate claim. The product's complete patched runtime also passes the actual HTTP/PGlite lifecycle with before/after source guards; an earlier timeout is retained separately.\n- [Normal-hook Windows/platform acceptance](https://github.com/elizaOS/eliza/actions/runs/37041735574) passed at prior 1129a6: normal installation, both core jobs, native primitives, two backend survivor cases, all 12 helper-startup cases and all 6 Smithers cases. This is evidence for that exact prior source, not a fresh hosted pass at 28ee31.\n- [Android resident qualification](https://github.com/AlphaCompute/alphaphone/actions/runs/37045552334) passed its build/archive stage at product 475be7, then native setup failed on unavailable SDK package tools before emulator startup in #31775 (`processOnce`), so this PR only adds coverage. `api/__tests__/phone-webhook-idempotency.pglite.test.ts` uses a real PGlite idempotency store. Three concurrent deliveries of one message route once, and a failed delivery releases its claim so the retry routes again, for both providers. 4/4 pass on develop's routes; against the pre-#31775 routes it routed 3 times.\n\n## Refs #22957: container catalogue\nThe ghost container constants and the shutdown-email monthly figure were already removed by #32799. This ports the rest of #26383's intent: `container-warning-rate.test.ts` now pins the catalogue key set to `DAILY_RUNNING_COST` and `SHUTDOWN_WARNING_HOURS`, so an unmetered rate can't come back. The tracker's consolidated decisions remain open and need owner-picked values:\n- storage units, price and fallback (#22956)\n- API-key price, count and rate (#22958)\n- MCP buyer/creator settlement (#22961)\n- legacy packs and minimum top-up (#22963)\n- which credit sources count toward RPM tiers (#23019)\n- affiliate surcharge disclosure (#23020)\n- frozen/sleeping retention (#22967)\n- crypto/x402 refunds (#22968)\n- media rejected by storage quota (#20956)\n\n## Refs #32021: mini-app charge surface removed\nRemoved:\n- `/apps/:id/charges/**` and `/app-credits/checkout|verify` routes\n- `app-charge-{requests,settlement,callbacks}` services\n- the public app-charge page and its i18n keys\n- SDK methods and types\n- the orchestrator `apps.charges.*` broker commands\n- mock routes, scenarios and e2e charge tests\n\nThe crypto cron no longer drains app-charge callbacks. No tables or migrations are dropped.\n\n**Money safety:** Stripe `checkout.session.completed` and `payment_intent.succeeded` that carry legacy mini-app metadata (`charge_request_id`, `miniapp_app`, `app_credit_purchase`) are acked with `retired_miniapp_payment` and never fulfilled as a generic credit purchase. OxaPay confirmation throws a typed `RETIRED_MINIAPP_PAYMENT` before any write. Tests: `stripe-retired-miniapp.pglite` (4/4, including a crediting control case and replays) and `crypto-retired-miniapp.pglite` (3/3).\n\n**Kept, because non-mini-app features use it:**\n- App registration and auth.\n- App inference credit reservations used by chat completions, messages and admission recovery.\n- Earnings and monetization settings.\n- `/app-credits/balance`.\n- Payment requests and x402.\n- App-billing (per-app subscriptions and trials). Org subscription tables have foreign keys to `app_billing_scopes`, account deletion runs app-billing dispositions, plain app sign-up materializes app-billing accounts, and chat/embeddings inference calls `admitAppSubscriptionInference`.\n\n**Behaviour change to review:** sensitive-request payment links now point at the live payment-request page (`/payment/\u003cid\u003e` on the site URL) instead of the deleted app-charge page.\n\n## Plus/Pro subscription audit (webhooks)\n- **Terminal publish (lockout):** a subscription Stripe cancels after failed payments could never be published, because Stripe advances the period on a failed renewal. The DB stayed `active` and checkout refused to resubscribe. The terminal publish now accepts Stripe's advanced period; identity fields must still match.\n- **Dunning owner:** `invoice.payment_failed` and live past_due/unpaid now publish dunning with a 3-day grace. A paid renewal clears it, and recovery handles it too.\n- **Entitlement lapse:** the quota policy applies a 3-day grace after period end at read time. A lapsed or past-grace org gets the free tier instead of `ORGANIZATION_POLICY_UNAVAILABLE`.\n- **Routing:** events route on the live subscription status, not the payload.\n- **Events no longer thrown away:**\n  - unowned subscription events are acked as `unhandled_subscription_event`\n  - renewal/dashboard `customer.subscription.updated` is acked as `no_owned_change`\n  - permanent typed failures are acked, with code and reason logged\n- **Incidents instead of silent lapse:** out-of-band plan change, external cancel, trial/pause/pending updates, refunds/disputes on subscription invoices, and strict-validation renewal rejections.\n- **Basil payloads:** `invoice.paid` reads the subscription from the fetched invoice. An unexpected `api_version` is logged.\n- **Queue:** retries get exponential backoff and a drain no longer re-reads a message it just requeued. On dead-letter, the ingress `webhook_events` row is deleted so a Stripe resend can re-enter.\n- **Recovery:** already-published terminal subscriptions are skipped, and per-subscription degradation no longer 503s the whole cron.\n\n## Plus/Pro subscription audit (checkout, portal, status, UI, SDK)\n- **Customer Portal:** new `POST /api/v1/subscriptions/portal`.\n  - Gated to billing managers; the customer comes from the DB; the return URL is built on the server.\n  - Locked configuration: no plan switching, cancel at period end only.\n  - past_due and unpaid orgs can use it.\n- **Replays:** an APPLIED replay returns `completed` only while that subscription is live (otherwise `stale_intent`). FAILED/SUPERSEDED replays return `expired`.\n- **Different plan while a checkout is pending:** the open session is expired and the new checkout continues, unless the old session already completed.\n- **Stuck commands:** PREPARED or started-without-session commands are superseded or failed instead of blocking the org.\n- **Sweeper:** a stale-checkout sweeper runs in the Stripe queue cron. Account deletion closes open sessions.\n- **Stripe session:** 23h55m expiry, `currency: \"usd\"`, and prices with `currency_options` are rejected.\n- **Org scope:** the org checkout and command queries, and `enqueueCommand`'s conflict check, ignore app-scoped commands.\n- **Plans route:** rate limited, with a 5 s cache of typed failures.\n- **Error mapping:** non-retryable checkout reasons map to 409/403.\n- **Snapshot:** now has `subscriptionId` and a cancel/undo control.\n- **UI:**\n  - A status card shows plan, status, renew/cancel date, grace and allowance.\n  - It has cancel/undo with polling and the portal button.\n  - Subscribe is hidden for non-managers and live subscribers.\n  - The checkout key is per user, and localStorage access is guarded.\n  - The session id is dropped from the URL after confirm, and a cancel-return banner is shown.\n- **SDK:** new `startSubscriptionCheckout`, `confirmSubscriptionCheckout` and `createSubscriptionPortalSession`. The unused `SubscriptionDto` / `SubscriptionPublicState` are removed, which is a breaking export change.\n\n## Verification\nAll results below were re-run after rebasing onto develop `d0c5d08ace`. Test files were run one at a time (`bun test \u003cfile\u003e`); mocked stripe-event files leak `mock.module` into PGlite files when they share a process. Results:\n\n| Area | File | Result |\n|---|---|---|\n| Dispute reinstatement | stripe-dispute-reinstatement.pglite | 5/5 |\n| Phone webhooks | phone-webhook-idempotency.pglite | 4/4 |\n| Mini-app removal | stripe-retired-miniapp.pglite | 4/4 |\n| Mini-app removal | crypto-retired-miniapp.pglite | 3/3 |\n| Stripe queue (existing) | stripe-event, checkout-authority, waifu | 59 pass |\n| Container catalogue | container-warning-rate | 2/2 |\n| Billing manager authz | billing-manager-mutations.pglite (portal added to the role matrix) | 37/37 before the rebase. After the rebase it hits its existing 30 s `beforeAll` timeout at host load average ~255, before any test runs |\n| Bigint defaults | schema-snapshot-serialization | 1/1 |\n| Webhooks | subscription-dunning.pglite (new) | 6/6 |\n| Webhooks | subscription-reconciliation.pglite | 20/20 |\n| Webhooks | subscription-lifecycle-finalization.pglite | 26/26 |\n| Checkout / portal | subscription-checkout-recovery.pglite (new; real Stripe SDK against a loopback server) | 12/12 |\n| Snapshot | account-billing-snapshot-subscription.pglite | 6/6 |\n| UI | `src/cloud/billing` vitest | all pass; 3 files needed `--testTimeout 30000` under host load |\n\nOth y?\n5. Plan switching (Plus to Pro): currently unsupported, and Subscribe is hidden while a live subscription exists.\n6. The cancellation contract says \"billing owner, recent auth\", but the code allows owner or admin without recent auth.\n7. Cancel/undo is rejected during dunning.\n8. Paid checkout on an org fenced for deletion: refund, or manual review? Currently logged `subscription_paid_checkout_unentitled` and kept pending.\n9. The retry budget (8 attempts, about 2 h) and a DLQ replay tool.\n10. Recovery no longer scans canceled subscriptions. A corrupt projection on one is caught only by a late event.\n11. Renewal-validation rejections (discount/tax/balance/proration): keep acking with an incident, or keep the org funded while ops reviews?\n12. Latent: the live-subscription guard ignores `trialing`/`paused`. This only matters if trials are added.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"63:T14ef,"])</script><script>self.__next_f.push([1,"## Current validation\n\nReviewed head `6f5bde88f1dfa88fdf81c40508c2bd60f28dfd34` includes the refreshed dependency stack. Focused tests passed again, and combined-stack head `22a8550a6842ceb199a8dc3222da2a426ccd9a02` passed full `bun run verify`: 284/284 tasks plus all final repository audits (Node24.15.0/Bun1.4.2). Hosted checks are tracked separately at this PR's exact head and must finish before merge. Earlier native/visual artifacts below remain scoped to their original head and unchanged files.\n\n# Relates to\n\nDepends on #32976 and #32980. This branch includes their commits; the UI/voice extraction is commit `a712e7d27c8506a31f2ebc70336234c1535be6cc`. Review and merge the dependencies first.\n\n# Change\n\nProvide a browser-safe TaskChoice component for task-bound choices in chat or panels. The host supplies transport, styling and localized status/error text. Suppress duplicate in-flight clicks, reject expired responses at click time even when brow ion, rebinding, guide cleanup, preview expiry, value exclusion and prohibited actions. These are not installed Android Chromium tests. The visual captures show guidance on a local test page without accounts or payments.\n\n## Known gaps / failures\n\nThe full Eliza Android host compile stopped at `copyForkLlamaLib` because this checkout lacks the required bionic fused inference library, before Java compilation. The shared plugin builds and installed tests pass, but do not establish a full host APK build. The app audit passed; all four camera-unavailable OCR exemptions were visually inspected and are readable expected states. Hosted CI and review are pending. Owned Chromium compilation/installation, positive production native messaging, real account/biller journeys, and hardware acceptance remain separate required work. Product-specific flows and UI are not included here.\n\n## Deployment\n\nOpt-in host policy and matching owned-browser component are required. Existing pinned product consumers are not repinned by this PR. Missing capabilities, mismatched identity/pins, expired or stale task context fail closed. Review and deploy the matching host/browser pair before enabling task actions.\n\n\n\nAdditional mobile evidence: [before](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32980-mobile-before.png), [after](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32980-mobile-after.png), [walkthrough](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32980-mobile.mp4).\n"])</script><script>self.__next_f.push([1,"65:T94d,"])</script><script>self.__next_f.push([1,"Reminder creation and owner replies could omit timing or destination, lose the originating occurrence, repeat legacy review, or move the displayed completion time after the action. Notification taps could also open cached chat without their source message. This keeps creation, resolution, delivery and viewing on the existing pipelines with explicit source and ou local and device evidence.\n"])</script><script>self.__next_f.push([1,"66:T1ccc,"])</script><script>self.__next_f.push([1,"Fixes the Cloud Plus/Pro subscription defects found by the subscription audit, covering allowance-first funding (follow-up to #23092, closed) and entitlement-derived quotas (follow-up to #23094, closed). Webhook/checkout/portal/billing-UI work and the past_due/grace entitlement projection (A6, B2) are handled separately on `shaw/fix-cloud-billing-subscriptions` and are not touched here.\n\n## B1: paid plans could not create any resource (critical)\nPlus/Pro entitlements set every resource ceiling to `null`, and the quota policy treats `null` as unavailable, so subscribers were denied new apps, characters, containers, sandboxes and storage writes.\n- The v1 catalog now declares explicit `resourceCeilings`, validated so a paid plan is never below the Free ceilings. Until larger paid ceilings are ratified, paid ceilings equal Free (5 characters, 5 sandboxes, 1 container, 5 GiB, 25 apps).\n- Entitlement derivation reads the ceilings from the catalog. Migration `0474` republishes them onto existing paid projections so stored rows keep matching their derivation (the quota policy compares the two).\n- The public plan DTO (shared + SDK) exposes the ceilings instead of `null`.\n\n## A1: allowance-first funding for every allowance-eligible spend path\nEach path now funds subscribers allowance first, then purchased credit, through `subscriptionFundingService`; everyone else keeps the unchanged cash lane.\n- New router `lib/services/allowance-first-credits.ts` for request-scoped callers: search proxy, DexScreener proxy (now settles or releases its prepaid hold instead of refunding cash), meeting transcription, pending video holds and A2A chat/image/memory/conversation.\n- Pending video holds persist their funding identity; the video reconcile sweep settles funded holds through subscription funding.\n- Native storage PUTs and paid reads (migration `0475` adds a tenant-bound `funding_reservation_id` and rewrites the shape checks/read triggers).\n- Container daily/terminal billing (earnings first, then allowance, then credits) and container deploy debits (migration `0476`).\n- Legacy hourly agent billing and the agent operation biller (migration `0477`).\n- Money stays exact (canonical 6-decimal strings / bigint micros) and every funding key is retry-stable, so replays are idempotent.\n\n## A2: debit-boundary ratchet in CI\n`subscription-funding-debit-boundaries.test.ts` fails when production debit signals differ from the reviewed inventory, when a boundary's class disagrees with the policy, or when an allowance-eligible boundary does not route subscribers through allowance-first funding.\n\n## A3: stranded reservations\nReservations persist the caller's own deadline (TTL or window end) instead of the allowance period expiry. A sweep in the existing `sweep-credit-reservations` cron releases stale holds to their exact sources with keyed refunds. Only owners without their own reconciler are swept; Dedicated windows, native storage and pending video jobs are excluded.\n\n## A7: Dedicated stopped at every period boundary\nA time-metered window that straddles the period end funds only its in-period share from allowance and the remainder from purchased credit; the window is no longer clipped to the period.\n\n## A8: ex-subscribers on cash\nAn unfunded (canceled) subscription is cash-only for allowance-eligible work instead of a hard denial.\n\n## A9: expire job\n`expireEndedPeriods` retires ended periods (and periods of terminal subscriptions) with an append-only `expire` entry, from the same cron. Later settlements forfeit their remainder as `expired_refund`.\n\n## A10: resubscribe after a terminal lifecycle event\nGranting a new period retires an overlapping bucket left open by a terminal (canceled/incomplete_expired) predecessor instead of conflicting, and the expire job retires such buckets on the next tick. I did not add a call inside the webhook lifecycle finalizer (`subscription-billing-operations.ts`) to stay out of the webhook work in flight; it can call `subscriptionAllowanceRepository.retirePeriodInTransaction(tx, { reason: \"subscription_terminal\" })` after the entitlement rebuild if immediate retirement is wanted.\n\n## B4, B5, B6: caches and warnings\n- B4: a stale admission snapshot still fails its request closed, but the admission path now drops the isolate copy and republishes the shared projection at once, instead of ~30s of errors after every policy-generation bump.\n- B5: the org tier cache compares its stamp with the durable policy generation, so subscription changes invalidate it without a writer hook.\n- B6: the Dedicated low-funds warning counts remaining allowance.\n\n## A13: minor issues\n- Purchased-credit amounts that the numeric credit writer cannot represent exactly are rejected.\n- Request ids outside the durable key grammar are hashed into `inference-gate:sha256.\u003chex\u003e` instead of failing only subscription-funded requests.\n\n## Policy questions (conservative behavior chosen)\n- **A4, concurrent split:** kept the reserve-time split. Unused purchased credit is refunded at settle, but usage is not moved onto allowance that another request released later. Money never moves between sources after reservation.\n- **A5, overage:** usage above a subscriber's reservation is still recorded as `uncollected_overage` and not charged. We never charge more than the held amount.\n- **A11, mid-period plan change:** no proration. Allowance funding fails closed until the plan change is reconciled.\n- **A12, trials:** platform trials still get no allowance; app-scope trials are unchanged.\n- **B3, over-quota after downgrade:** existing resources are kept and only new create/start is blocked, per #23094.\n- **Also decided:** stranded reservations are released (refunded) rather than charged, since there is no usage evidence. Paid ceilings equal Free until larger ceilings are ratified.\n\n## Verification\n- `bun run typecheck` in `packages/cloud/shared`: pass. `bunx tsc --noEmit` in `packages/cloud/api`: pass. `bun run typecheck` in `packages/cloud/sdk`: pass.\n- `bun run lint:check` in shared/api/sdk: no errors (existing warnings only; none in changed files).\n- `bun test` in `packages/cloud/shared`:\n  - `subscription-allowance-lifecycle.pglite.test.ts` (new): 8 pass\n  - `subscription-funding-transaction.pglite.test.ts`: 32 pass, 19 skip (Postgres/SSH-only)\n  - `subscription-funding-debit-boundaries.test.ts` (new): 4 pass\n  - `subscription-allowance-visibility.pglite.test.ts`: 2 pass\n  - `subscription-entitlements-derivation.test.ts`: 5 pass; `subscription-entitlements.pglite.test.ts` and `account-billing-snapshot-subscription.pglite.test.ts`: pass\n  - `org-storage-subscription-funding.pglite.test.ts` (new) + `org-storage-mutations` + `org-storage-reads`: 38 pass; `org-storage-read-operations-migration.test.ts`: 4 pass\n  - `container-billing-subscription-funding.pglite.test.ts` (new): 10 pass; `container-billing-idempotency.test.ts`: 20 pass; `compute-billing-recovery.pglite.test.ts`: 60 pass\n  - `agent-billing-allowance-first.pglite.test.ts` (new): 6 pass; `provisioning-jobs-scheduled-backup-sentinel.test.ts`: 57 pass\n  - `__tests__/meeting-billing.test.ts`: 6 pass\n- `bun test __tests__/container-warning-rate.test.ts` in `packages/cloud/api`: 1 pass\n- Root `bun run verify` and full builds were not run because of limited disk space.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"67:T4106,"])</script><script>self.__next_f.push([1,"These are owner-decided Cloud billing policies: subscription (Plus/Pro) plus pay-as-you-go, with mini-app capabilities already removed. The tracker is #22957 and the policy table is in merged #32864. Migrations are **0500**, **0501** and **0502**; 0496–0499 are left for another branch, and the journal is updated.\n\nRefs #22957\n\n## #22961 / #23022: creator monetization retired (affiliates stay live)\n\nFixes #22961\nFixes #23022\n\n**Accrual stopped. History kept.**\n- MCP calls (`recordUsage`, `recordUsageWithoutDeduction`) no longer write either creator leg: no creator org credit and no `mcp` redeemable earning. New `mcp_usage` rows record `creator_earnings = 0`. The base price and platform fee go to `platform_earnings`, and the buyer charge is unchanged.\n- Agent inference markup and app creator monetization are switched off by 0500. Turning either back on returns HTTP 410 with `code: creator_monetization_retired`; this is a typed `CreatorMonetizationRetiredError` that extends `ApiError`.\n- Earnings-funded hosting (`pay_as_you_go_from_earnings`) was an automatic payout of the frozen balance. 0500 turns it off and sets the column default to false. The settings API refuses to turn it back on, and an account-deletion restore no longer re-enables it.\n- No ledger rows are deleted or rewritten.\n\n**Creator payout entry points.** Each of these now returns a typed 410:\n- `POST /api/v1/redemptions` and `GET /api/v1/redemptions/quote`\n- admin approve in `POST /api/admin/redemptions` (admin reject still works; it returns the pending lock to the frozen balance)\n- `POST /api/v1/apps/:id/earnings/withdraw`\n- `POST /api/cron/process-redemptions`, which is also removed from the cron schedule\n\nThe on-chain payout processor and the `lockForRedemption` / `refundRedemption` / `convertToCredits` helpers are deleted. Redemption history and the balance read (now always `canRedeem: false`) stay.\n\n**Affiliate payouts stay live.** The affiliate program continues; only creator, MCP and app monetization is retired.\n- `POST /api/v1/earnings/payout/stripe-connect/onboard` is restored for users who have an affiliate code. Anyone else gets 403.\n- `POST /api/v1/earnings/payout/stripe-connect/transfer` is restored. It is still admin-gated and still a compensating saga. It now debits through `affiliate-payouts.ts`, and a definitive Stripe rejection re-credits the amount as an affiliate earning. No cron is needed, because an operator triggers each transfer.\n- **The gate.** A payout may debit at most `min(affiliate net since retirement, available balance − frozen available)`. \"Affiliate net since retirement\" is the sum of the user's `affiliate` ledger earnings and adjustments after the retirement instant: the user's statement `frozen_at`, or the new `creator_monetization_retirement.retired_at` singleton written by 0500.\n  - The check and the debit run in one transaction under the same per-user advisory lock as the ledger, so concurrent payouts cannot both pass.\n  - A same-key retry reuses the prior debit.\n  - Anything more returns 409 `affiliate_payout_exceeds_payable`.\n  - Non-affiliate earnings after retirement (revenue shares and similar) are not payable through this path.\n- **Not payable here:** affiliate earnings that were already unpaid at retirement. They are inside the frozen statement and are settled manually with it.\n- The statement shows `affiliatePayableUsd`, and the Earnings tab shows it as \"Affiliate earnings available for payout\".\n\n**Freeze and statement.**\n- 0500 copies every user's unpaid balance (`available_balance + total_pending`) into `creator_earnings_retirement_statements`, broken down by source. The table has no foreign keys, so the record survives account deletion. The copy is idempotent.\n- `GET /api/v1/earnings/statement` returns the read-only statement.\n- The Monetization \"Earnings\" tab now shows this statement. The redemption UI, the app earnings dashboard, the withdraw dialog and the app monetization settings are removed.\n\n### Follow-up for manual handling: affected orgs and amounts\n\nNo local database was reachable (`DATABASE_URL` unset, nothing on localhost:5432), so this lists no orgs or amounts; it gives the queries to run instead. Run them against production **after 0500 is applied**:\n\n```sql\n-- Frozen creator balances per organization (what is owed)\nSELECT s.organization_id, o.name AS organization_name,\n       count(*) AS users, sum(s.unpaid_balance_usd) AS unpaid_usd,\n       sum(s.available_balance_usd) AS available_usd,\n       sum(s.pending_redemption_usd) AS pending_redemption_usd,\n       sum(s.earned_from_mcps_usd) AS from_mcps_usd,\n       sum(s.earned_from_agents_usd) AS from_agents_usd,\n       sum(s.earned_from_apps_usd) AS from_apps_usd,\n       sum(s.earned_from_affiliates_usd) AS from_affiliates_usd,\n       sum(s.earned_from_revenue_shares_usd) AS from_revenue_shares_usd\nFROM creator_earnings_retirement_statements s\nLEFT JOIN organizations o ON o.id = s.organization_id\nWHERE s.status = 'frozen'\nGROUP BY s.organization_id, o.name\nORDER BY unpaid_usd DESC;\n\n-- In-flight redemptions an operator must reconcile or reject (no cron pays them now)\nSELECT id, user_id, status, usd_value, network, broadcast_tx_hash, created_at\nFROM token_redemptions\nWHERE status IN ('pending', 'approved', 'processing')\nORDER BY created_at;\n\n-- Mark one balance settled after paying it out of band\nUPDATE creator_earnings_retirement_statements\nSET status = 'settled_manually', settled_at = now(), settlement_reference = '\u003cticket or transfer id\u003e'\nWHERE user_id = '\u003cuser id\u003e' AND status = 'frozen';\n```\n\n```sql\n-- Affiliate earnings payable through Stripe Connect now, per user\nWITH cutoff AS (\n  SELECT e.user_id,\n         COALESCE(s.frozen_at, (SELECT retired_at FROM creator_monetization_retirement)) AS since,\n         CASE WHEN s.status = 'frozen' THEN s.available_balance_usd ELSE 0 END AS frozen_available,\n         e.available_balance\n  FROM redeemable_earnings e\n  LEFT JOIN creator_earnings_retirement_statements s ON s.user_id = e.user_id\n)\nSELECT c.user_id,\n       GREATEST(0, LEAST(COALESCE(SUM(l.amount), 0), c.available_balance - c.frozen_available)) AS payable_usd\nFROM cutoff c\nLEFT JOIN redeemable_earnings_ledger l\n  ON l.user_id = c.user_id AND l.earnings_source = 'affiliate'\n AND l.entry_type IN ('earning', 'adjustment') AND l.created_at \u003e c.since\nGROUP BY c.user_id, c.available_balance, c.frozen_available\nHAVING GREATEST(0, LEAST(COALESCE(SUM(l.amount), 0), c.available_balance - c.frozen_available)) \u003e 0;\n```\n\n### Paid MCP listings retired\n\nWith creator monetization retired, a listing price would bill buyers for revenue that reaches no creator.\n- **Existing listings.** Migration **0502** makes every listing free: `pricing_type = 'free'`, both prices set to 0, x402 off. The prior pricing is saved in `metadata.retired_paid_listing` for audit. Usage history is untouched, and the column defaults are now free.\n- **New prices refused.** `POST /api/v1/mcps` and `PUT /api/v1/mcps/:id` refuse any price with 410 `creator_monetization_retired` (capability `paid_mcp_listing`). Setting a listing to free is still allowed.\n- **Proxy.** It never charges a listing price, even for a stale row. A free call skips the credit reservation, since zero-cost reservations are rejected. It runs the deferred strong credential check before calling upstream, then records usage at zero.\n- **Editor.** The MCP editor no longer shows pricing or x402 controls. It explains that listings are free and always submits `pricingType: \"free\"`.\n- **Not unlisted.** No listing was unlisted, because none has pricing that is intrinsic to the listing. x402 listings are made free too.\n\nListings affected by 0502. There is no local database, so run this before applying 0502, or use the `metadata` check after it:\n\n```sql\n-- Before 0502\nSELECT id, organization_id, slug, name, status, is_public, pricing_type,\n       credits_per_request, x402_price_usd, x402_enabled, total_requests\nFROM user_mcps\nWHERE pricing_type \u003c\u003e 'free' OR COALESCE(credits_per_request, 0) \u003c\u003e 0\n   OR COALESCE(x402_price_usd, 0) \u003c\u003e 0 OR x402_enabled = true\nORDER BY total_requests DESC;\n\n-- After 0502\nSELECT id, organization_id, slug, name, status, metadata -\u003e 'retired_paid_listing' AS previous_pricing\nFROM user_mcps\nWHERE metadata ? 'retired_paid_listing';\n```\n\n## #23020: affiliate surcharge disclosure\n\nFixes #23020\n\n- **One formula.** `auto-top-up-charge-breakdown.ts` holds the formula shared by the durable charge snapshot and a new server preview. The formula, percentages, rounding and activation gate are unchanged.\n- **Billing API.** `GET`/`PUT /api/v1/billing/settings` return `autoTopUp.chargePreview`: the credited base, affiliate markup, platform fee, total card charge, and whether attribution is `none`, `affiliate` or `unavailable`. `?previewAmount=` quotes an amount that has not been saved yet.\n- **Billing UI.** The auto top-up card shows those lines as separate rows before the customer saves, and re-quotes on the server when the amount is edited. It never computes money in the client. When attribution is unavailable, it says no surcharge will be charged.\n- **Receipts.** Invoices store `charge_breakdown`, parsed from the signed durable metadata. `GET /api/invoices/:id` and the ledger entries (`chargeBreakdown`) expose it, and the invoice page shows the markup, platform fee and total on separate lines. A breakdown whose lines do not add up to the charged total is never shown.\n- **Other paths.** One-time checkout applies no affiliate surcharge, so it has nothing to disclose. MCP calls already recorded `base_amount_usd`, `affiliate_fee_usd` and `platform_fee_usd` on their credit transactions and usage rows.\n- **Copy.** New UI copy is in `en.json`. The affiliate pricing example no longer promises a \"redeemable token balance\".\n\n## #22967: frozen/sleeping retention\n\nFixes #22967\n\nThis builds on existing machinery rather than adding a parallel path: the billing-stop authority, the automatic resume from #30702, the Dedicated fallback `retain_until` from #32856, the sleep lifecycle, the email service and the backup `billing-freeze` retention reason, which previously had no writers.\n\n- **Clock table.** 0501 adds `agent_funding_retentions`, one open row per stopped agent.\n- **Hourly cron.** `/api/cron/agent-funding-retention` does the following:\n  - **Discovery.** It finds provider-confirmed `billing_request` stops that are still the agent's latest decision (credits exhausted), and open plan-withdrawal fallbacks (plan lapsed past grace). The deadline is the stop time + 30 days, or the fallback's `retain_until`.\n  - **Notices.** It sends the 7-day and 1-day deletion emails through the email service, using a new template with all 8 locales. Each notice is claimed on its row before sending and released if the send fails, so it goes out once and failures retry.\n  - **No deletion without notice.**\n    - A clock first seen late, such as an agent already stopped when this ships, gets a deadline at least 7 days out.\n    - A deadline reached without the 1-day notice sends that notice and moves the deadline one day later.\n  - **Deadline.** It enqueues the existing `agent_sleep` job, which proves a durable backup before removing the container. When the agent is `sleeping`, the latest backup is pinned for 90 days: v2 rows get `retention_reason = 'billing-freeze'` and `retention_until = now + 90d`. Legacy inline rows have no time-based GC.\n  - **Paying resumes.** The existing resume paths restart the same agent id. The clock closes (`funding_restored`) once the agent is running or the fallback moved to recovery. It never deletes while an `agent_resume` or `agent_wake` job is in flight.\n  - **Blocked case.** An agent stopped with an unbacked in-place runtime (#30746) is reported as blocked instead of losing state.\n\n## Verification\n\nEach test file was run in its own process because the host load was about 110.\n\n- **New PGlite tests (cloud-shared):**\n  - `agent-funding-retention.pglite.test.ts` — 4 pass. It uses a fake clock and the real billing-stop discovery, the real `ProvisioningJobService` sleep enqueue and the real automatic-resume reconciler. It covers:\n    - no notice before day 23, the 7-day notice exactly once, the 1-day notice, the sleep job at day 30, and the container marked deleted with the backup kept 90 days;\n    - paying on day 20 queues a resume of the same agent id, and nothing is deleted after the deadline;\n    - a late-discovered stop gets the full notice schedule;\n    - a lapsed plan uses `retain_until` and closes on recovery.\n  - `creator-monetization-retirement.pglite.test.ts` — 5 pass. It covers:\n    - 0500 replayed twice: the statement is correct and the ledger is untouched;\n    - the flags are off, and re-enabling returns the retired error;\n    - an MCP call accrues no creator earnings or credit;\n    - **affiliate payouts:** a frozen $15 creator balance is refused. $7 of new affiliate earnings is payable, and $10 of new non-affiliate earnings is not. A $5 payout succeeds and a same-key retry deduplicates. A $3 payout that would reach the frozen balance is refused, and the remaining $2 succeeds. The frozen $15 is still intact;\n    - **MCP listings:** 0502 replayed twice makes a paid listing free and keeps its prior price in metadata. An update with a price and a create with x402 are refused. An update to free is allowed.\n  - `auto-top-up-charge-disclosure.pglite.test.ts` — 3 pass. It covers affiliate, no affiliate, rounding at the 1000% maximum markup, and the receipt matching the preview and the charged total.\n- **Existing cloud-shared tests:**\n  - `billing-suspension-resume.pglite` — 9 pass\n  - `account-deletion-reservation.pglite` — 16 pass; the restore expectation is updated\n  - `container-billing-idempotency` — 18 pass; the `convertToCredits` cases are removed with the helper\n  - `redeemable-earnings-fail-closed` — 3 pass\n  - `auto-top-up-cutover.pglite` — 26 pass\n  - `platform-cloud-tools.billing-auth` — 5 pass\n  - `active-billing-numeric-fail-closed` — 28 pass\n  - `inference-accounting-migrations` — 7 pass\n- **cloud-api tests:** `stripe-event` 48, `stripe-event-checkout-authority` 7, `stripe-event-waifu` 5, `billing-manager-mutations.pglite` 37, `container-warning-rate` 2. All pass.\n- **packages/ui (vitest):**\n  - `auto-top-up-card.test.tsx` — 25 pass, including 4 new disclosure tests\n  - `McpEditorDialog.test.tsx` — 1 pass. It is rewritten: no price controls, and edits submit a free listing.\n  - `invoice-detail-client.test.tsx` — 2 pass (new file)\n  - `MonetizationPage.test.tsx` — 1 pass\n- **packages/app:** `vite-source-resolution.test.ts` — 21 pass.\n- **Typecheck:** `tsc --noEmit` is clean for cloud-shared, cloud-api and packages/ui.\n- **Generated routes and migrations:**\n  - `bun run codegen` and `bun run check:router-contract` pass after both commits: 766 routes, all Hono leaves mounted.\n  - The SDK public routes were regenerated. Develop had drifted, and the output also picks up the existing `personal/recovery/{token}` route.\n  - `check:migration-prefix-order` passes.\n- **Biome:** `biome check` on every changed file is clean.\n- **Removed tests:** cloud e2e specs that exercised the retired flows (`redemption-flow`, `creator-monetization-journey`, `monetized-app-loop`, `monetized-full-loop`, `monetized-mock-llm-journey`) and `app/test/ui-smoke/earnings-redemption-flow.spec.ts` are deleted. The permission, skill-contract and frontend-monetization specs are updated to the 410 and statement contract. None of the Playwright e2e specs were run here, because they need the booted stack.\n\n**Not run:**\n- root `bun run verify`, because of host load\n- `check:worker-bundle`\n- the app visual audit and desktop/mobile inspection of the new statement, breakdown and invoice lines\n- a staging run of the cron against real agents, backups and email\n\n## Remaining for the owner or staging\n\n- **Frozen balances.** Manual settlement of the frozen balances, including affiliate earnings that were unpaid at retirement, and of any in-flight `pending`/`approved`/`processing` redemptions, using the SQL above.\n- **Affiliate payouts in production.** A live Stripe Connect affiliate payout has not been run.\n- **Agents already asleep.** Agents that were already `sleeping` because of a prepaid-sleep billing stop are not discovered, since their container is already gone. The plain `containers` product keeps its 48-hour stop without deletion, because it has no backup to keep.\n- **Staging.** A staging run of the retention cron with real sleep, backup and email.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n"])</script><script>self.__next_f.push([1,"68:T1cd0,"])</script><script>self.__next_f.push([1,"# Relates to\n\nThree generic pieces of OS release tooling lived only in a downstream product (extracted from the senior-care product's explicit patch overlay, eliza-research/senior-care): AOSP builder host provisioning, an offline release-key ceremony, and read-only Android device qualification. None of them is product-specific, so they belong next to the existing `packages/os` lock files, `release-trust.json`, `release-key-policy.ts` and `hardware-targets.json`. The product keeps its own key manifest and requirements file and will consume these after its next repin.\n\n# Change\n\n- **`packages/os/android/builder/`**: dry-run-by-default (`--apply` to act) GCE `c3d-highcpu-90` SPOT builder and Intel nested-virtualization Cuttlefish host scripts, a portable Ubuntu 24.04 cloud-init (signature-verified `repo`, data disk that is never reformatted, shell mirror of `assertBuilderCapacity` from `scripts/aosp/build-grizzly-bundle.ts`: 32 physical cores, 128 GiB RAM, 1500 GB total, 600 GiB free) and `bootstrap/sync-aosp.sh`. The sync script reads `android/aosp.lock.json` by default (relative to itself), checks the remote tag object/commit before fetching, the `.repo/manifests` commit before sync, and every locked project and `requiredSourceFiles` after; it supports `--mirror` and `--reference`. While porting, fixed a field shift for lock projects without `tagObject` (the Pixel 11 Pro profile), and added `EXTRA_LABELS` instead of a hard-coded product label. `make bootstrap` (`bootstrap-aosp.ts`) remains the canonical checkout; the README says how the two relate.\n- **`packages/os/android/signing/` + `scripts/aosp/{generate,decrypt}-release-keys.ts`**: generic key manifest (releasekey, platform, shared, media, networkstack, sdk_sandbox, bluetooth, nfc, apex, apex_payload, avb, plus Ed25519 `release_manifest`, `contract_release`, `contract_qualification`). Ed25519 fingerprints use exactly the SPKI base64/SHA-256 encodings that `release-key-policy.ts` pins, plus the PEM `release-trust.json` accepts. `--manifest` lets products add their own app keys; manifests are validated (safe names, RSA-4096/8192). Private keys are scrypt/AES-256 PKCS#8 at rest. Both tools refuse to write inside the eliza checkout or any other Git working tree. Runbook in `android/signing/README.md` (generic, no product names).\n- **`scripts/android/device-qualify.ts` + `device-qualify-lib.ts`**: read-only adb (fixed allowlist) / fastboot (`getvar` only) qualification against `--requirements FILE`, defaulting to the new `android/device-requirements/treble-gsi.json` (Treble, vendor API, kernel floor, ABI, dynamic partitions, SELinux, A/B preferred, unlockable/avb_custom_key). Product thresholds (RAM, cameras, radios) stay in product files. Records go to `test-results/os-device-qualification/`; emulator captures are labelled `emulator-observation`. Requirements files are validated (unknown checks rejected). Documented as complementary to the `hardware-targets.json` admission gate.\n\nRisk: additive only; no existing script, lock or trust file changes behaviour. No cloud resource, key or device is touched by tests.\n\n# Testing\n\n- `node --test scripts/__tests__/aosp-builder-infra.node.test.ts scripts/__tests__/release-key-ceremony.node.test.ts scripts/__tests__/device-qualify.node.test.ts` (from `packages/os`, Node 24.15.0, macOS arm64
