rguments or reliable task completion.\n\n- Correct Cloud usage attribution before comparing runs: map native `promptTokens`/`completionTokens` to the usage-event `inputTokens`/`outputTokens` contract in buffered, SSE and non-SSE fallback paths. Check current behavior and reuse applicable #27744 work.\n- Verify emitted input/output/total counts match gateway usage, including a final SSE usage-only frame. Verify downstream cost estimates use the real counts when gateway cost is absent; retain unknown usage as unavailable. This fixes telemetry, not server-side credit debits.\n\nCloud token counts #27732 is consolidated here within the same five-day allocation. Original reproduction and consumer details remain linked in that issue.\n\n**Done when:** before/after trajectories show lower unnecessary context and efficient action/tool search, with the agreed tasks still completing correctly. Record token and latency changes, failures and any tradeoffs. Missing usage stays unknown; estimates are labeled.\n\nReruns, comparison, validation and targeted fixes are included in the five days. This ticket does not build another context editor.\n\n[Project and schedule](https://github.com/orgs/elizaOS/projects/20)\n"])</script><script>self.__next_f.push([1,"15:T6ca,"])</script><script>self.__next_f.push([1,"The running macOS app cannot create a backup of the current agent state, and the dialog hides the deterministic size rejection behind “Backup failed.” Retrying the same state cannot succeed.\n\nReproduced in signed development bundle a0de6f6cc43e8c086f12a2fbf1b932b91a7bee63: Settings → Backups → Back up agent → Create Backup. The dialog remains open with an error; no backup was created and no restore was attempted. Sanitized runtime diagnostic at 2026-09-06T19:11:54.645Z: `Snapshot refused during file capture: source budget exceeded`.\n\n`POST /api/backups` calls `createLocalAgentBackup`, which uses the v1 snapshot path. `AgentSnapshotBudgetExceededError` already carries code, stage, observed bytes and limit bytes. The route catches every failure and sends generic HTTP 500. The v1 shared restore ceiling is 128 MiB; source capture also accounts for allocation overhead. Do not raise that cap, truncate content, or omit state to make this test pass.\n\nAcceptance:\n\n- Translate the known typed budget rejection to a structured, safe response without filesystem paths or database diagnostics.\n- Show an actionable size-limit explanation in the native backup dialog and distinguish it from a retryable transport/storage failure.\n- Exercise the real route/error boundary and UI consumer, including an ordinary unexpected failure; preserve full backup data and existing limits.\n- Confirm whether the supported large-state local backup path is the existing v2 streaming implementation. Keep full backup success explicitly unverified until a created artifact is inspected and a restore is verified in isolated state.\n- Capture the native result in the rebuilt revision; the current observation is a failure, not acceptance proof.\n"])</script><script>self.__next_f.push([1,"16:T5d8,"])</script><script>self.__next_f.push([1,"A clean single-instance launch of the current macOS development package exposes chat and Settings while its embedded backend is still an unconfigured first-run server.\n\nObserved on the real Mac with the packaged renderer (build content ID 15a2d61edd19, source 4582587bee3):\n- Embedded API correctly moves to port 31338 because 31337 is occupied.\n- Backend logs: fresh install; runtime boot deferred until onboarding commits.\n- Direct read-only API checks: auth/status required=false, authenticated=false; first-run/status complete=false; status state=not_started; runtime/mode mode=local.\n- Renderer nevertheless logs remote-backend, skips local startup, and reaches ready.\n- Desktop bootstrap returns 503 db_unavailable. Native chat fails to send.\n- Cloud sign-in remains on Opening Cloud sign-in without opening Safari; the same result reproduced after eliminating an initial duplicate-app launch.\n\nThe exact mechanism linking the stale/restored client target, first-run classification, and the stuck sign-in is still being investigated. Do not treat the backend first-run state as successful setup or bypass authentication to make the controls appear usable.\n\nAcceptance: on the packaged app, an unconfigured embedded backend leads to a usable setup path; Cloud sign-in opens and completes or shows a bounded actionable failure; setup initializes the real backend and a native chat reply succeeds. Retest returning configured profiles and occupied-port startup without discarding their setup.\n"])</script><script>self.__next_f.push([1,"17:T1977,"])</script><script>self.__next_f.push([1,"## Summary\nThe route-level model downloader `downloadModel` in `plugins/plugin-local-inference/src/local-inference-routes.ts` resumes an interrupted download by sending a `Range: bytes=\u003cn\u003e-` header and then opening the staging file in append mode whenever a `.part` file exists (`flags: existingPartial \u003e 0 ? \"a\" : \"w\"`). It never verifies the server actually honored the range (HTTP 206). If the origin ignores Range and replies HTTP 200 with the full body — common for CDN redirect targets, gated/proxy repos, or mirrors — the full file is appended onto the stale partial bytes, producing a corrupt GGUF. `record.total` is also miscomputed as `existingPartial + fullSize`. The corruption passes the only integrity check (`isGgufFile` reads just the first 4 bytes, which are still \"GGUF\" from the old partial), and there is no sha256 verification against an expected hash, so the corrupt file is renamed to final, registered as an installed model, and auto-assigned to the TEXT_SMALL/TEXT_LARGE/TEXT_EMBEDDING slots via `ensureDefaultAssignment`. The sibling canonical `services/downloader.ts` in the same package already guards this exact case (`if (startByte \u003e 0 \u0026\u0026 response.statusCode !== 206) { startByte = 0; received = 0 }` then `flags: startByte \u003e 0 ? \"a\" : \"w\"`); the route-level copy diverged and dropped the guard.\n\n## Reproduction\n```\nRan a local Vitest probe in plugins/plugin-local-inference (real fs + real local HTTP origin; only ELIZA_STATE_DIR and ELIZA_HF_BASE_URL redirected). Steps: (1) set ELIZA_HF_BASE_URL to a local http server that IGNORES Range and always answers `200` with the full body `GGUF`+`REAL-MODEL-BODY` (19 bytes); (2) seed a stale partial `\u003cstate\u003e/local-inference/downloads/eliza-1-2b.part` = `GGUF`+`STALE-PARTIAL`; (3) call the exported `applyLocalInferenceManagementMutation({ op: \"start_download\", modelId: \"eliza-1-2b\" })`, which runs `startDownload` -\u003e `downloadModel`; (4) poll for the final file `\u003cstate\u003e/local-inference/models/eliza-1-2b.gguf`.\nObserved output: `stored length: 36 expected: 19` and `stored bytes: \"GGUFSTALE-PARTIALGGUFREAL-MODEL-BODY\"`. Expected: exactly `GGUFREAL-MODEL-BODY` (19 bytes). The corrupt file was renamed to final and written into registry.json as an installed model. Test asserted `stored.equals(FULL)` -\u003e failed (false). Command: `npx vitest run src/__probe_resume.test.ts`.\n```\n\n## Proposed fix\nMirror the sibling downloader's guard in `downloadModel`: after receiving the response and validating 2xx, compute `let effectiveStart = existingPartial; if (existingPartial \u003e 0 \u0026\u0026 response.statusCode !== 206) { effectiveStart = 0; record.received = 0; }`, then use `effectiveStart` for both `record.total = effectiveStart + contentLength` and `flags: effectiveStart \u003e 0 ? \"a\" : \"w\"`. Bounded to ~6 lines in one function; no signature/API change. Test plan (\u003e=10 lines, honest): a Vitest suite standing up two local http origins — one that honors Range (206 + remaining bytes) and one that ignores it (200 + full body) — seeding a stale `.part`, driving `applyLocalInferenceManagementMutation({op:\"start_download\"})`, and asserting the final `models/\u003cid\u003e.gguf` bytes exactly equal the full file in BOTH cases (correct resume for 206, clean restart for 200); plus a regression assertion that `record.total`/registry size match the true file length. The probe already written proves the failing case and converts directly into the 200-path test.\n\n## Evidence plan\nThe PR will attach: the failing-before / passing-after Vitest output for both the 200 (ignore-range) and 206 (honor-range) origins; a hexdump/length comparison of the stored `models/\u003cid\u003e.gguf` showing 19 bytes (correct) vs the current 36-byte `GGUFSTALE-PARTIALGGUFREAL-MODEL-BODY` corruption; and a diff showing the route-level guard now matches services/downloader.ts (statusCode !== 206 -\u003e restart from 0).\n\n## Duplicate search\ngh search issues/prs --repo elizaOS/eliza --state all for: \"local-inference resume download\", \"local-inference partial download corrupt\", \"download Range 206 resume\", \"downloadModel append partial\", \"local-inference download\", \"resume download corrupt\", \"model download partial\" — all returned zero results. grep for an existing 206 guard in plugins/plugin-local-inference/src/local-inference-routes.ts found none (only the sibling services/downloader.ts and its test reference 206).\n\n_Filed under a standing operator authorization for the autonomous audit pipeline, after local reproduction and duplicate search._\n\nAI provider/model: anthropic / claude-opus-4-8\nClient / agent tooling: pi-coding-agent\nContribution skill revision: elizaOS/eliza@cd4fb2746e7387982986405451bf38c049747acf:packages/skills/skills/contribute-to-eliza\nAttribution status: self-reported\n— [eliza-swarm]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"anthropic\",\"model\":\"claude-opus-4-8\",\"client\":\"pi-coding-agent\",\"skill_revision\":\"elizaOS/eliza@cd4fb2746e7387982986405451bf38c049747acf:packages/skills/skills/contribute-to-eliza\"} --\u003e\n\n## Consolidated download-integrity scope — 2026-09-14\n\nThis issue is the canonical owner for duplicate #29454 and the related Content-Range integrity requirement from #30939. Preserve both route-level and canonical downloader consumers, including the UI host copy, in the implementation review. #29456 is retained as the narrow 200-response restart candidate; it is not complete proof of the full contract. #30888 and #30940 are unsuitable implementations for the reasons recorded on those PRs.\n\nAcceptance: append only when a valid 206 Content-Range matches the exact local offset; a full 200 response restarts from byte zero. Missing, malformed or mismatched ranges must not be treated as proof that append is safe. If the returned body starts at a nonzero offset that cannot be placed, reject or refetch the complete entity before replacing the partial; never write a tail fragment at offset zero. Validate start/end/total consistency and safe integer bounds. Exercise real temporary files and an HTTP origin covering ignored Range, correct resume, wrong-offset response, missing/malformed range, cancellation and retry. Assert final bytes and preservation of recoverable state, not only status codes or file magic.\n\nUse one shared protocol decision where package dependency boundaries allow it; do not clone divergent range parsers into each downloader. Existing candidate work and reproduction history remain linked in the source issues. Closure of those leaves means consolidated tracking, not repaired downloads.\n"])</script><script>self.__next_f.push([1,"18:T63f,"])</script><script>self.__next_f.push([1,"## Parent / scope\n\nFollow-up to #22942. Make every advertised container charge either enforced with a receipt or removed from the product contract.\n\n## Problem\n\nContainer constants advertise deploy, image, monthly reference, storage, bandwidth, and extra-instance charges, but the audited production callers only establish daily CPU/memory/count billing. These are ghost prices until code and ledgers prove otherwise.\n\n## Acceptanc / gpt-5.6-sol\nClient / agent tooling: Codex\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5.6-sol\",\"client\":\"Codex\",\"skill_revision\":\"N/A - ordinary GitHub contribution without optional run evidence\"} --\u003e\n"])</script><script>self.__next_f.push([1,"1a:T5f3,"])</script><script>self.__next_f.push([1,"## Problem\n\nReview of the Android speech implementation merged by #30759 at `63323d0f77f2b48eb6221fafbcb243ab3154b21d` found that coroutine cancellation can enter provider-failure handlers, the bionic inference socket is not closed by stop/teardown, and overlapping speech requests share playback resources without waiting for prior cleanup.\n\nThe affected consumer is the Android TalkMode `speak`/`stopSpeaking` bridge. Interrupting or destroying a session during local inference can leave a blocking request alive, report a phonemization failure instead of interruption, or start fallback speech. A replacement request can also lose its resources to an older request's cleanup.\n\n## Acceptance\n\n- Preserve coroutine cancellation through phonemization and provider fallback handlers; settle the bridge result as interrupted.\n- Close both local-agent and bionic inference sockets on stop and teardown, including connection/read phases.\n- Serialize playback resource ownership so a cancelled request finishes cleanup before its replacement starts; cancelled queued calls must also settle.\n- Exercise the actual Kotlin implementation for cancellation and replacement ordering, compile the Android plugin, and run the owning package/repository checks.\n- Verify stop, immediate replacement, and teardown on the installed current Android revision, including no fallback playback after cancellation and successful subsequent speech.\n\nThe isolated implementation is in progress. No passing device evidence is claimed by this issue.\n"])</script><script>self.__next_f.push([1,"1b:Te53,"])</script><script>self.__next_f.push([1,"The installed Android local agent cannot initialize the Notes service on a fresh agent-scoped store. `NotesStore.writeAtomicIfAbsent` publishes its fsynced temporary file with `fs.link`; Android denies that hard link with `EACCES`. The service reports `NOTES_STORE_WRITE_FAILED` and never becomes ready.\n\nReproduced on emulator-5580 with the current combined Android build fd755929592ee25f5268853015d3d5ee1cac450c. An independent invocation of the production NotesStore through the APK's installed Bun, using a disposable directory under the app's files directory, fails with the same nested `EACCES` / `link` cause. The disposable directory was removed; existing notes and app data were preserved.\n\nAcceptance:\n- Fresh Android Notes initialization succeeds through the installed runtime without hard-link permission.\n- Publication remains atomic and must never overwrite a document created by a concurrent initializer.\n- Existing state remains readable and mutable; malformed state fails explicitly.\n- Interrupted publication cannot expose an empty or partial valid-looking document.\n- Exercise real installed Android CRUD/restart and concurrent initialization, plus the package tests, typecheck, lint and root verify.\n\nCurrent implementation and validation:\n- Repaired production NotesStore uses an atomic nonempty-directory publication when the filesystem denies hard links; existing flat documents remain authoritative.\n- All 119 Notes package tests, typecheck, lint and guide parity pass. Four new real-filesystem tests cover restart mutations/deletion, preserving a competing initializer's notes, incomplete publication, and legacy flat state.\n- On Android emulator-5580, four separate installed-Bun processes initialized one fresh store concurrently. Five subsequent fresh processes created, edited, read, deleted, and verified the deletion. All passed without a filesystem mock. The disposable test directory was removed.\n- This device proof ran the repaired production store as a separate bundle through the installed runtime. Rebuilding the APK with the repaired Notes service and final combined repository gates remain pending; this issue is not yet closed.\n\nDownloadable evidence (uploaded assets were read back and SHA-256 verified):\n- [119 package tests](https://github.com/elizaOS/eliza/releases/download/pr-evidence-10/30725-package-tests.log)\n- [Focused publication regressions](https://github.com/elizaOS/eliza/releases/download/pr-evidence-10/30725-publication-tests.log)\n- [Android concurrent initialization and fresh-process persistence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-10/30725-device-store-proof.json)\n\n\n## Packaged Android startup proof\n\nThe canonical Android build and installation passed at `a4cfe886cd8ccf84f76dfcfa89d552a805d09bbd`. Installed APK SHA-256 matched `db74601d662b980bd0ce70c1b49af99ce06dae7d83d07b3fe152b69ebf9fd75f`. The actual app published valid revision-0 Notes state through normal deferred service startup: directory mode 0700, file mode 0600, with no `NOTES_STORE_WRITE_FAILED` in the fresh log.\n\n- [Packaged-service receipt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-10/30725-packaged-service-a4cfe886.json)\n- [Installed APK and native payload hashes](https://github.com/elizaOS/eliza/releases/download/pr-evidence-10/30604-installed-bytes-a4cfe886.json)\n- [Canonical Android build log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-10/30604-native-build-a4cfe886.log)\n\nThese artifacts were uploaded, downloaded, and SHA-256 compared. The broader Android PR remains unmerged because its live chat smoke exposed the separate #30785 behavior failure.\n"])</script><script>self.__next_f.push([1,"1c:T81b,"])</script><script>self.__next_f.push([1,"## Summary\n\nplugin-computeruse's OCR / Set-of-Marks provider registry is bundled twice, so plugin-vision's registration never reaches the readers in packaged builds. `plugins/plugin-computeruse/build.ts:52` builds `src/mobile/ocr-provider.ts` as a standalone entrypoint (`dist/mobile/ocr-provider.js`) while `src/index.ts` also inlines the same module into `dist/index.js` (there the writer is tree-shaken and only `var registeredCoordOcrProvider = null` plus the getter survive). plugin-vision writes through `await import(\"@elizaos/plugin-computeruse/mobile/ocr-provider\")` (`plugins/plugin-vision/src/index.ts:118-141`), which resolves to the subpath bundle; the readers `computer-use-service.ts:1231` (`runOcrOrDetect`), `scene/ocr-adapter.ts:98,156` and `app-control/defaults.ts:88,114` live in `dist/index.js` and read the other module instance.\n\n## Reproduction (develop `5b183d21ff25`, built dist)\n\n```\n$ grep -c 'function registerCoordOcrProvider' dist/index.js dist/mobile/ocr-provider.js\ndist/index.js:0\ndist/mobile/ocr-provider.js:1\n```\n\nA probe importing both bundles without `--conditions`, registering through the subpath and listing through the index: `subpath listOcrProviders -\u003e [\"probe-ocr\"]` / `index listOcrProviders -\u003e []`.\n\n## Consequence\n\nIn packaged desktop or npm-consumed builds `ocr` and `detect_elements` always fail with \"No OCR provider is registered. Enable @elizaos/plugin-vision…\" and `scene.ocr` stays empty even with plugin-vision loaded, while vision logs \"registered coord-OCR bridge\". Every repo dev/start script passes `--conditions=eliza-source` (both imports resolve to `src/`), which masks it. `plugins/plugin-computeruse/CLAUDE.md:275` documents this registry as the extension path.\n\n## Acceptance criteria\n\n- The index bundle and the `mobile/ocr-provider` subpath share one module instance (mark the subpath external in the index build, or have the index re-export from the built subpath), and a test proves a provider registered through the published subpath is visible to `runOcrOrDetect` without `--conditions=eliza-source`.\n"])</script><script>self.__next_f.push([1,"1d:T706,"])</script><script>self.__next_f.push([1,"## Summary\n\nMeeting-ghost relative due dates are resolved on the UTC calendar day of the meeting. `parseDueDate` in `plugins/plugin-personal-assistant/src/lifeops/meeting-ghost/index.ts:355-370` does `new Date(meetingStartedAt)`, adds days with `setUTCDate`, reads the weekday with `getUTCDay()` and formats with `toISOString().slice(0,10)`; `dueDateToLedgerDueAt` (373-377) then pins `${dueDate}T17:00:00.000Z` and the calendar deadline (436) `T09:00:00.000Z`. `event-handler.ts:67` feeds every transcript through this path.\n\n## Reproduction (develop `5b183d21ff25`)\n\nProbe calling the exported `analyzeMeetingGhostTranscript` (results are offset-driven, identical under any process TZ):\n\n```\nstartedAt=2026-09-14T17:30:00-07:00 \"Alice will send the report by tomorrow\" -\u003e dueDate=2026-09-16  (Mon 5:30pm PT; tomorrow is 09-15)\nstartedAt=2026-09-17T17:30:00-07:00 \"Bob will send the deck by Friday\"       -\u003e dueDate=2026-09-25  (Thu 5:30pm PT; Friday is 09-18)\nstartedAt=2026-09-14T08:00:00+09:00 \"Alice will send the report by tomorrow\" -\u003e dueDate=2026-09-14  (Mon 8am JST; tomorrow is 09-15)\nstartedAt=2026-09-14T08:00:00+09:00 \"Carol will file the taxes by Monday\"    -\u003e dueDate=2026-09-14  (said on Monday; next Monday is 09-21)\n```\n\n## Consequence\n\nThe commitment ledger `dueAt`, the follow-up approvals and the \"Deadline:\" calendar intent carry the wrong day, a full week off in the weekday case, for any meeting whose local evening is already the next UTC day (afternoon/evening in the Americas) or whose local morning is still the previous UTC day (east of UTC).\n\n## Acceptance criteria\n\n- Relative dates are resolved on the meeting's local calendar day (the transcript's or runtime's timezone), and the ledger/calendar instants are built from that zone.\n- Tests pin the four cases above.\n"])</script><script>self.__next_f.push([1,"1e:T57c,"])</script><script>self.__next_f.push([1,"**Is your feature request related to a problem? Please describe.**\nAn elizaOS agent can meet the same person through different channels, but a channel session alone does not express which user-approved facts should persist across them.\n\n**Describe the solution you would like**\nI’m Vivek Gupta, Founder \u0026 CEO of MemCode (https://memcode.in). I would like to contribute a plugin that uses the user’s authorization to recall a bounded set of relevant facts and offers explicit save, correct, and forget actions. Channel IDs would be mapped to the user on the server side. A first PR could include an example agent and tests for user separation and revoked access.\n\n**Describe alternatives you have considered**\nA standalone external plugin or MCP recipe may fit better than a first-party plugin. Existing runtime records and local storage would remain available; no full transcript would be copied automatically.\n\n**Additional context**\nWould maintainers prefer this in the first-party plugin structure or outside this repository? I can build the version you recommend.\n\n**Evidence / expected proof for implementation**\nA PR would include tests for user and channel scoping, a demonstration of the recall and explicit save flow, and logs or trajectory evidence where required. UI screenshots and video are N/A unless the chosen approach adds a UI.\n\ncc @NubsCarson for your thoughts on this integration."])</script><script>self.__next_f.push([1,"1f:T4a7,## Follow-up\n\nNubs will look into this later. This is a deferred optimization investigation, not a confirmed correctness bug or an approved implementation change.\n\nA combined Notes and Calendar read used four foreground model calls: response handler, planner, evaluator after Notes, and the same evaluator again after Calendar. The first evaluation decided whether to continue; the second checked completion and produced the answer.\n\nInvestigate whether demonstrably independent, read-only actions can complete before a single evaluation, without weakening conditional execution, permissions, failure handling, evidence checks, or final-answer validation. Do not simply remove the intermediate evaluation: dependent requests may need it to decide whether the next action should run.\n\nAcceptance for any future proposal:\n- Explicitly distinguish independent work from conditional or dependent work.\n- Preserve cases where the second read must not execute.\n- Compare actual trajectories, correctness, call counts, token usage, and latency.\n- Retain the existing behavior unless a simpler safe alternative is supported by evidence.\n\nNo runtime behavior is changed as part of filing this issue.\n20:T878,"])</script><script>self.__next_f.push([1,"## Reproduction\n\nOn current `develop` (`0831fda0f0`), the finalized-meeting event first calls `projectFinalizedTranscriptCommitments` and then runs the zone-aware meeting-ghost consumer. The commitment projector still resolves `tomorrow` and weekdays with `getUTCDay` / `setUTCDate` and fixes the resulting deadline at 17:00 UTC.\n\nUsing the production `commitmentRecordsFromTranscript` path with a meeting that starts Monday 2026-09-14 at 17:30 America/Los_Angeles and an owner segment saying `I will send the report tomorrow.` produces:\n\n```json\n{\"observedAt\":\"2026-09-15T00:30:00.000Z\",\"dueAt\":\"2026-09-16T17:00:00.000Z\",\"sourceKey\":\"transcript-local-day:seg-1\"}\n```\n\nThe owner's intended deadline is Tuesday 2026-09-15 at 17:00 Pacific, `2026-09-16T00:00:00.000Z`. The current row is Wednesday in the owner's local calendar, one day late, and disagrees with the meeting-ghost row emitted by the same finalized event.\n\n## Impact\n\nOwner-spoken promises from evening meetings can be ranked, displayed, and scheduled against the wrong day. The same event can persist two transcript commitment rows with conflicting deadlines.\n\n## Scope\n\n- Resolve the owner's effective time zone at the transcript instant in the runtime projection.\n- Pass that zone into the deterministic extractor.\n- Use the existing zoned-date helpers for explicit dates, `tomorrow`, weekdays, and the 17:00 wall-time deadline.\n- Preserve the existing UTC behavior for callers that do not provide a zone.\n\n## Acceptance proof\n\n- Re-run the exact production projector reproduction and observe `2026-09-16T00:00:00.000Z`.\n- Exercise the real PGlite runtime projection and inspect the persisted ledger row.\n- Verify the affected package tests, typecheck, lint, and root `bun run verify` on the final rebased head.\n\nAI provider/model: openai / gpt-5\nClient / agent tooling: codex\nContribution skill revision: N/A - ordinary GitHub contribution without optional run evidence\nAttribution status: self-reported\n— [contributor]\n\u003c!-- eliza-computer-attribution:v1 {\"provider\":\"openai\",\"model\":\"gpt-5\",\"client\":\"codex\",\"skill_revision\":\"N/A - ordinary GitHub contribution without optional run evidence\"} --\u003e\n"])</script><script>self.__next_f.push([1,"21:Tf99,"])</script><script>self.__next_f.push([1,"### What happens\n\n`validateActionParams` in `packages/core/src/actions.ts` (the version at the time of writing is reproduced below) returns `valid: true` with an **empty `errors` array** when an **optional** parameter is supplied with a value that fails its own declared schema — as long as that parameter declares no `schema.default`. The offending value is silently removed from the returned `params`.\n\nThe caller therefore cannot distinguish *\"the model did not supply this parameter\"* from *\"the model supplied an invalid value that was discarded\"*, and the action handler runs with a **different input than the one requested**, while still reporting success.\n\n### Minimal reproduction\n\nUses only the public API. Run against `@elizaos/core@2.0.3-beta.7` (Node 26):\n\n```js\nimport { validateActionParams } from '@elizaos/core';\n\nconst action = {\n  name: 'DEMO',\n  description: 'demo action',\n  validate: async () =\u003e true,\n  handler: async () =\u003e ({ success: true }),\n  parameters: [\n    { name: 'range', description: 'a bounded optional number', required: false,\n      schema: { type: 'number', minimum: 0, maximum: 100 } },\n    { name: 'token', description: 'required', required: true,\n      schema: { type: 'string', pattern: '^0x[0-9a-fA-F]{40}$' } },\n  ],\n};\n\nshow('in range       ', { range: 50,  token: '0x' + 'a'.repeat(40) });\nshow('out of range   ', { range: 500, token: '0x' + 'a'.repeat(40) });\nshow('required missing', { range: 50 });\nshow('required invalid', { range: 50, token: 'bad' });\n```\n\nObserved output (verbatim):\n\n```\nin range       \n   -\u003e {\"valid\":true,\"params\":{\"range\":50,\"token\":\"0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\"},\"errors\":[]}\nout of range   \n   -\u003e {\"valid\":true,\"params\":{\"token\":\"0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\"},\"errors\":[]}\nrequired missing\n   -\u003e {\"valid\":false,\"params\":{\"range\":50},\"errors\":[\"Required parameter 'token' was not provided for action DEMO\"]}\nrequired invalid\n   -\u003e {\"valid\":false,\"params\":{\"range\":50},\"errors\":[\"Parameter 'token' value 'bad' does not match pattern ^0x[0-9a-fA-F]{40}$\"]}\n```\n\nNote the second line: `range: 500` violates `maximum: 100`, yet the result is `valid: true` with `errors: []` and the value silently gone. The two **required**-parameter violations below it *are* reported, so the reporting path clearly exists — the optional branch just does not use it.\n\n### Why this is worth fixing\n\n- An action that bounds or filters its work from an optional parameter can **silently run unbounded**, returning a plausible-looking result for a request that was not honoured. In our case it produced a result computed without the filter the caller asked for.\n- **`HandlerOptions.parameterErrors` cannot be used as a workaround.** It is populated from this same `errors` array, which is empty here — so a handler has no signal that anything was dropped, and cannot detect it even after the fact.\n- Two further asymmetries are easy to miss while reading the code:\n  - `schema.type === 'number'` is required for `minimum`/`maximum` to be applied at all; with `type: 'integer'` they are ignored entirely.\n  - Declaring a `schema.default` changes the outcome from *dropped* to *silently replaced by the default* — also invisible to the caller.\n\n### Possible directions (maintainer's call)\n\n1. Record an error for an optional parameter whose **supplied** value fails validation, distinct from \"not provided\", so it reaches `parameterErrors` and the handler can react; or\n2. surface the rejected parameter name/value so the handler can decide; or\n3. if the current behaviour is intended, document it explicitly — right now the contract reads as \"invalid input is reported\", and the optional case breaks that.\n\nHappy to open a PR if a direction is preferred — and to test whatever shape is chosen against a real runtime.\n\n*(Found while building a plugin that declares bounded optional parameters, verified against a real `AgentRuntime` before filing. No other part of this report depends on that plugin.)*\n"])</script><script>self.__next_f.push([1,"22:T8ec,"])</script><script>self.__next_f.push([1,"**Status**\nConfirmed on current tree. `fa9d46be53` (\"refactor bigtime\", 2026-09-23) deleted `plugins/plugin-cli-inference` (the Codex `codex exec` text handler, formerly plugin-codex-cli); neither directory exists now. Nothing registers a `codex-cli` TEXT_SMALL/TEXT_LARGE handler, yet `openai-subscription` is still presented and persisted as a runtime chat backend:\n- `packages/core/src/contracts/first-run-options.ts:131,230,244` (first-run provider union / `SUBSCRIPTION_PROVIDER_SELECTIONS`), and `:730` treats it as the one subscription that needs no additional runtime provider.\n- `packages/ui/src/components/settings/useProviderEntries.ts:276-284` lists it; `ProviderSwitcher.tsx:514-517,587-589` treats it as the only subscription that can drive runtime inference.\n- `packages/ui/src/first-run/first-run-config.ts:150-158` and `packages/agent/src/api/provider-switch-config.ts:678-681,986-1000` write `linkedAccounts` + a direct `llmText` route `backend: openai-subscription` and `model.primary`.\n- `packages/agent/src/api/model-config-routes.ts:677-697` `resolveActiveChat` requires `hasTextHandlerRegistered(runtime, \"codex-cli\")`, which can never be true, so selecting it yields no active chat (users get a dead chat after setup).\n- Stale references: `packages/scripts/release-cohort.json:44` still lists `@elizaos/plugin-codex-cli`; `packages/app/platforms/electrobun/src/subscription-rpc.ts:15`.\n\n**Remaining work**\n- Decide: restore a Codex text handler, or stop offering `openai-subscription` as a chat backend (keep it only as a coding-agent/orchestrator credential, like anthropic-subscription).\n- If removing: drop it from chat-capable first-run/Settings selections, `requiresAdditionalRuntimeProvider`, provider-switch `runtimeApplicable`, and the `resolveActiveChat` branch; migrate persisted `llmText.backend=openai-subscription` configs to an explicit \"choose a provider\" state.\n- Remove `@elizaos/plugin-codex-cli` from release-cohort.json.\n\n**Effort**\nS-M, ~1-2 days.\n\n**Risks**\nExisting users with this route persisted need a visible migration, not silent fallback; orchestrator Codex coding agents (`plugin-agent-orchestrator/src/services/task-agent-frameworks.ts:796,1092,1324`) must keep working.\n\n**Scope changes**\nNone.\n\n\n_Found during backlog triage._\n"])</script><script>self.__next_f.push([1,"23:T43d,Stock Android full chat turns can fail with MODEL_OUTPUT_INCOMPLETE after 256 generated tokens even when the caller requested no output limit. A warm installed-APK run reached this failure after about 115 seconds.\n\nThe Bionic branch in plugin-capacitor-bridge's makeGenerateHandler constructs maxTokens as lane.maxTokens ?? 256. The canonical local-inference BionicHostLoader preserves an omitted limit so the native host owns the model capacity. Inspection of the accepted APK's bundled JavaScript and the distinct error context identifies the mobile bridge path as the source of this injected default.\n\nRemove the bridge-only default, retain explicit caller limits, and reject native incomplete-output receipts even when no explicit caller limit was supplied. Cover buffered and streaming framed transport, full prompt preservation, outputs beyond 256 tokens, explicit limits, and native exhaustion. Keep privacy and delivery deadlines unchanged. Device qualification must use a rebuilt installed artifact and the real full-turn API path; transport tests alone are not device proof.\n24:T57f,"])</script><script>self.__next_f.push([1,"The normal Android JNI staging task searches Bun/AOSP musl asset directories before using pre-staged NDK libraries. In the current cleanup acceptance run, following its missing-library instruction compiled a musl fused library successfully; Gradle assembled an APK, but the mandatory artifact audit rejected `__errno_location` as incompatible with Android bionic. Running the NDK staging tool produced valid bionic libraries. A subsequent build also exposed that the JNI CMake target requires x86_64 as well as arm64 while the staging task only fails early for missing arm64.\n\nScope: remove automatic JNI discovery in musl asset/cache directories; use explicitly configured library directories or NDK-staged jniLibs. Correct the generator and checked-in Gradle instructions to the existing stage-elizavoice-lib.mjs command. Require both supported JNI slices before the native build begins. Preserve Bun/AOSP musl assets and the separate compiler, explicit property/environment compatibility, cloud build behavior, and the final artifact audit.\n\nAcceptance: with musl assets and valid bionic JNI slices both present, the default copy task preserves the bionic libraries; missing required slices fail with the correct staging command; normal APK artifact audit passes before installation. Installed local chat and persistence remain separate required acceptance. No toolchain or ABI audit bypass is proposed.\n"])</script><script>self.__next_f.push([1,"25:Tc39,"])</script><script>self.__next_f.push([1,"## Summary\n\nGenerated media that arrives as a `data:` URL (Google Imagen images, TTS audio, voice-first audio) is undeliverable on Discord and Telegram. Discord's SDK resolves the string as a filesystem path (ENOENT, caption lost with it); Telegram's `sendMedia` throws `File not found at path: data:image/png;base64,\u003cwhole blob\u003e`, aborts the reply before the text is sent, and logs the full base64 payload twice.\n\n## Where (develop `c2bb8860be`)\n\n- Producers: `packages/agent/src/services/media-generation.ts:98-103` `bytesToAudioDataUrl` → `data:audio/mpeg;base64,…` (used at `:201` for TTS); `packages/core/src/features/advanced-capabilities/actions/generateMedia.ts:227` `data:image/png;base64,${result.imageBase64}` for base64-only image providers; `packages/core/src/services/message/delivery.ts:155` voice-first `data:audio/wav;base64,…`.\n- The media-persist hook that would rewrite these into `/api/media/\u003csha\u003e.\u003cext\u003e` handles (`packages/agent/src/api/media-runtime.ts:127-151`, phase `outgoing_before_deliver`) runs from `processor.ts:713/1303/1500` and the autonomy execution facade; the action callback that delivers `GENERATE_MEDIA` output reaches the connector send handlers without passing through it.\n- Discord: `plugins/plugin-discord/utils.ts:339-341` wraps the string in `AttachmentBuilder(\"data:…\")`; for audio/video the guarded fetch rejects non-http and the catch at `:372-377` falls through to the same `AttachmentBuilder(\"data:…\")`; discord.js 14.27.0 `DataResolver.resolveFile` then does `path.resolve` + `fs.stat` → ENOENT, and because files ride on the last text chunk (`utils.ts:690-700`) the caption in the same `channel.send` is lost too.\n- Telegram: `plugins/plugin-telegram/src/messageManager.ts:1121-1160` sends attachments in a `Promise.all` before the text; `:1425-1428` throws `File not found at path: ${mediaPath}` with the whole data URL; `:1464-1476` `logger.error({ mediaPath, error: error.message })` logs the blob twice; the rethrow aborts `sendMessageInChunks`, and the turn's `delivery_started` marker (`:1575-1610`) refuses a replay.\n- Slack: `plugins/plugin-slack/src/service.ts:2776-2793` rejects via the fetch guard and logs `{ url: media.url }`, i.e. the blob.\n\n## Input → wrong output\n\n`GENERATE_MEDIA` with the Google image provider (base64-only) or any TTS request → on Discord the caption and image are both lost (ENOENT); on Telegram nothing reaches the user, the log carries megabytes of base64, and the turn cannot be retried. Providers that return https URLs (OpenAI) work, which matches the live Discord evidence in PR #20460.\n\n## Fix direction\n\nRun the media-persist hook on action-callback deliveries too (so `data:` becomes a canonical media-store handle) and make Discord and Telegram resolve store handles to bytes; or decode `data:` URLs into a Buffer in `buildOutboundDiscordAttachment` and Telegram `sendMedia` (`{ source: buffer }` for Telegraf). Never put a `data:` payload into an error message or a log field (log a hash or length instead). Telegram should send text independently of attachments so one bad attachment cannot suppress the reply.\n"])</script><script>self.__next_f.push([1,"26:T5ee,"])</script><script>self.__next_f.push([1,"## Summary\n\nThe agent export bundle contains the agent's decrypted `settings.secrets`, and the import path writes a bundle's `settings.secrets` straight into the new agent, although the export is documented as stripping secrets.\n\n## Where (develop `c2bb8860be`)\n\n- `packages/agent/src/services/agent-export.ts:743-747` reads the agent through `db.getAgentsByIds`; `plugins/plugin-sql/src/base.ts:645-663` `mapAgentRow` runs `transformAgentSettings(agent, decryptedCharacter)`, so `agent.settings.secrets` is plaintext.\n- `agent-export.ts:921-923` strips only `runtime.character.secrets` into `characterConfig`; `:932` places the full `agent` record in the payload untouched.\n- `agent-export.ts:995-1002` on import strips `secrets` from `characterConfig` but spreads `payload.agent` (including `settings.secrets`) into `agentData` before `createAgents`.\n\n## Input → wrong output\n\n`POST /api/agent/export` → the decrypted JSON inside the `.eliza-agent` bundle carries every provider key under `agent.settings.secrets`; the only barrier is the bundle password. `POST /api/agent/import` with a bundle whose `agent.settings.secrets` was edited plants those values (keys, endpoints) into the newly created agent.\n\n## Fix direction\n\nDelete `agent.secrets` and `agent.settings.secrets` (and vault-shaped keys) in `extractAgentData` before building the payload, strip the same fields from `payload.agent` in `restoreAgentData`, and add a test that decrypts the produced bundle and asserts no `settings.secrets` is present.\n"])</script><script>self.__next_f.push([1,"27:T77a,"])</script><script>self.__next_f.push([1,"## Summary\n\n`persistMediaBytes` in `packages/agent/src/api/media-store.ts` (~400-406) writes `\u003csha256\u003e.\u003cext\u003e` with `fs.writeFileSync` directly to its final name and skips the write whenever a file with that name already exists. `writeFileSync` truncates and writes in chunks, so an `ENOSPC` or a crash mid-write leaves a truncated file under the correct content hash. Every later persist of the same bytes (a retry after freeing disk, the same image attached again, a backup restore) sees the file exists, skips the write, and returns a success URL that serves the truncated bytes with `Cache-Control: private, max-age=31536000, immutable`. Nothing repairs it: GC and eviction only consider mtime and references. The same pattern is in `writeStoredMediaFile` (restore path), `persistPrivateMediaBytes` and the pins ledger write.\n\n## Reproduction (develop `a6863aa318`, real module in a temporary `ELIZA_STATE_DIR`)\n\n```\npre-seeded 100-byte file under the sha256 of a 4096-byte payload\npersistMediaBytes(payload) -\u003e url=/api/media/\u003chash\u003e.bin, file size on disk 100 (expected 4096)\n\non a 64 KiB tmpfs with a 200 KiB payload:\nfirst persist -\u003e ENOSPC, partial file exists (65536 bytes)\nsecond persist -\u003e success URL; route serves 200 with 65536 bytes and the immutable cache header\n```\n\n## Impact\n\nOne disk-full event permanently corrupts specific attachments in a user's history, and content addressing guarantees the corruption is reused for every future identical upload and cached forever by the browser.\n\n## Fix direction\n\nWrite to a temporary sibling (`\u003cname\u003e.\u003cpid\u003e.\u003crandom\u003e.tmp`), fsync, then rename over the final name, removing the temporary file on any failure (the auth package's account file writer already does this); treat an existing file whose size differs from the payload as absent and rewrite it. Apply to all four write sites and pin with a test that pre-seeds a short file under the correct hash.\n"])</script><script>self.__next_f.push([1,"28:T563,"])</script><script>self.__next_f.push([1,"The scheduled-item editor labels its primary control “Run now” for manual starters, but calls the acknowledge mutation. The canonical runner only changes lifecycle state when acknowledging; it does not dispatch the task. The current UI test asserts that same incorrect verb, so it can pass while the owner receives no run.\n\nObserved source: packages/ui/src/components/pages/ScheduledTaskEditor.tsx and ScheduledTaskEditor.test.tsx; plugins/plugin-scheduling/src/scheduled-task/runner.ts acknowledge implementation. The real fire API already exists.\n\nExpected behavior: an explicit run executes through the existing authenticated fire API and canonical scheduling dispatcher. Acknowledging a delivered item remains a separate operation. The UI reports failed or unavailable execution visibly. Manual dossier refresh must work after a settled run without consuming or resetting automatic once-per-owner-day admission. Pending or uncertain delivery cannot be blindly replayed.\n\nAcceptance: exercise UI to API to canonical dispatch and inspect the resulting effect; retain concurrency, authorization, paused/manual, settled refresh, pending delivery and automatic-day invariants. Review affected desktop/mobile app captures and run owning package checks plus root verification. Related dossier acceptance work: #31872. No second scheduler or state-only substitute for execution.\n"])</script><script>self.__next_f.push([1,"29:T792,"])</script><script>self.__next_f.push([1,"A long-running owner-private calendar turn can finish its reads and then reject the authorized write solely because its ingress delivery-audience attestation expired after five minutes. The user receives no calendar event despite retaining the same owner, room and request.\n\nObserved in core-flows scenario `live-note-to-calendar-stale-source`, run `29192f53-198d-4b05-a1bd-64d006500333`: two availability observations settled successfully; the follow-up retrieved the current note and then `CALENDAR_CREATE_EVENT` was rejected with `expired_attestation`. The scenario failed and no successful create receipt was returned. This was a simulated CLI-provider diagnostic, not release-qualified evidence.\n\nThe synchronous action gate rejects expiration before the existing async membership revalidation. Simply lengthening the TTL or ignoring expiration would weaken the existing contract and is not the intended fix.\n\nAcceptance:\n- An active, originally authorized turn can renew audience evidence from current trusted authority before tool exposure/execution and visible egress.\n- Renewal is scoped to the exact runtime, turn, actor and destination, and ends on completion or cancellation; stale completed turns cannot acquire renewed access.\n- Canonical-room renewal checks the current owner, room kind and complete participant census. Authenticated API renewal revalidates the host principal with fresh credential/session checks rather than cached ingress authorization.\n- Revocation, changed ownership/membership/destination, unavailable verification, actor/runtime mismatch and cancelled work remain denied. Sensitive-disclosure bookkeeping survives renewal.\n- Regressions advance the clock beyond the normal TTL without relaxing it; cover successful long work and each invalidation boundary. Re-run the note-to-calendar journey and inspect authoritative event state and receipts.\n\nRelated implementation/recovery work: #31856, #31799.\n"])</script><script>self.__next_f.push([1,"2a:T492,When both keyless search providers fail, searchKeylessWeb currently returns undefined. The standalone agent tells the user “No web search results,” and coding tools report no_match even when the actual result was HTTP429, denial, timeout, malformed MCP, or an oversized response. A successful empty primary response followed by a failed fallback is also indistinguishable from a completed empty search.\n\nFor SEARCH-02, retain typed per-provider outcomes and report unavailable when any required attempted source failed, reserving an empty outcome for successful zero-hit responses. Preserve Retry-After metadata, bound response reads, and support caller cancellation without dispatching fallback after cancellation. Continue using the one shared transport and deliberate compatibility at its agent/coding/edge callers. Provider payloads and query text must not appear in diagnostics.\n\nAcceptance: real Web API transport responses exercise empty vs mixed failure, HTTP429/403, timeout, malformed payload, response-size rejection, abort-before/during dispatch and successful fallback. Action-level results must not translate an outage to no_match or “no results.”\n2b:T891,"])</script><script>self.__next_f.push([1,"## Summary\n\nThe Twilio and Blooio inbound webhooks use check-then-mark idempotency: `packages/cloud/api/webhooks/twilio/[orgId]/route.ts` calls `isAlreadyProcessed(idempotencyKey)` (~line 147), then `handleIncomingMessage` (~166), then `markAsProcessed` (~167); `webhooks/blooio/[orgId]/route.ts` has the same shape (~107-112, ~168). `handleIncomingMessage` runs agent inference, sends the reply through `messageRouterService.sendMessage`, and records a `twilio_sms` usage row keyed by `MessageSid`, so it routinely exceeds Twilio's 15 s webhook timeout. Any second delivery of the same `MessageSid` / message id that arrives before the first finishes (a fallback URL pointed at the same endpoint, an operator replay, a duplicate POST with a valid signature, or a non-production deployment with `SKIP_WEBHOOK_VERIFICATION=true`) passes the check and is processed in full again: two outbound SMS (real provider spend), two inference runs, two usage rows. `isAlreadyProcessed` also fails open on a DB error. The atomic primitive already exists and is what the WhatsApp webhook uses: `tryClaimForProcessing` (`INSERT ... ON CONFLICT DO NOTHING`) with `releaseProcessingClaim` on failure (`packages/cloud/shared/src/lib/utils/idempotency.ts`, `webhooks/whatsapp/[orgId]/route.ts:110-133`).\n\n## Reproduction (develop `1eba34ba95`, real primitives on PGlite with `idempotency_keys` pushed)\n\nTwo concurrent Twilio-style sequences (`isAlreadyProcessed` -\u003e 50 ms work -\u003e `markAsProcessed`) on key `twilio:SM_probe`, versus two concurrent `tryClaimForProcessing(\"whatsapp:probe\")`:\n\n```\ncheck-then-mark results [ \"processed\", \"processed\" ]  handled 2\ntryClaim results        [ true, false ]\n```\n\nThe route-level consequence follows from the code order above; the full route was not stood up (it needs an org, a phone gateway and a routed agent).\n\n## Fix direction\n\nClaim before processing in both routes exactly as WhatsApp does: `tryClaimForProcessing(key, \"twilio\")`; on `false` return the empty TwiML 200; on handler failure `releaseProcessingClaim(key)` so a genuine retry can proceed. Open PR #27661 touches `tryClaimForProcessing` (expired-key reclaim) but does not move these two routes onto it.\n"])</script><script>self.__next_f.push([1,"2c:T5bf,"])</script><script>self.__next_f.push([1,"Mounted Notes interactions are rejected by the view capability broker because the production NOTES_SURFACE does not declare agent-surface. The canonical NOTES_VIEW uses that surface. The real Notes renderer loads its authenticated state successfully, but get-notes fails with ViewCapabilityDeniedError before any mutation can execute. Calendar already declares the required capability.\n\nReproduced in desktop Chromium and Pixel 7 mobile against candidate 6c1c25705fdb79e823717f9cb9ba835bd74b2485 while validating #30688. The app loads the emitted production Notes bundle and actual authenticated Notes API backed by isolated PGlite; surrounding shell identity/provider responses are deterministic fixtures. Both runs received a real empty Notes snapshot at revision 0 and then rejected the mounted read. No live-account or provider acceptance is claimed.\n\nThe existing DynamicViewLoader.notes-operation integration test passes a hardcoded agent-surface grant instead of the canonical Notes surface, masking the mismatch.\n\nFix: declare the intended grant on NOTES_SURFACE and use that production declaration in the existing mounted Notes test. Keep the capability broker unchanged and retain denial of guarded operations for legacy bundles lacking operation-context support. Acceptance includes the actual mounted read, create, exact replay, changed-payload rejection, stale-revision rejection, durable receipt identity, and unchanged rendered state after rejected edits.\n"])</script><script>self.__next_f.push([1,"2d:T469,The public `/pricing` page cannot scroll to its renewal disclosure and **Open billing** link on pares two different units. The matched persisted clawback records the actual eligible credit amount.\n\nAcceptance:\n\n- Restore the matched dispute's actually applied credit amount, including packs whose credit value differs from provider dollars.\n- Preserve the existing replay key, organization ownership and out-of-order retry behavior.\n- Prove full pack reinstatement, partial consumption, duplicate/replayed events and legacy1:1 top-ups using actual queue/ledger behavior.\n- Never restore an unapplied shortfall or change resource holds, entitlements, auto-top-up policy or provider balances.\n\n#22930 explicitly records the existing applied-clawback-only reinstatement contract; its unresolved resource/entitlement and shortfall decisions remain outside this correction. This issue performs no historical ledger repair or production mutation.\n\nEvidence: real local database readback and backend failure above. UI screenshots/video and model trajectories: N/A, queue arithmetic/ledger defect. Full package/root/hosted qualification remains required before merge.\n"])</script><script>self.__next_f.push([1,"2f:Tef0,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\nTwo catch blocks in `plugins/plugin-wallet/src/chains/solana/service.ts` (develop `cbf357b0bd8a`) turn an RPC failure into a healthy-looking zero, and three consumers persist or serve that zero as fact.\n\n1. `getTokenAccountsByKeypair` (lines 2104-2107) returns `[]` from its catch. `updateWalletData` (lines 1975-1986) treats `accounts.length === 0` as an empty portfolio and writes `{ totalUsd: \"0\", totalSol: \"0\", items: [] }` to `SOLANA_WALLET_DATA_CACHE_KEY`. The Solana wallet provider (`providers/wallet.ts`, lines 66-71) renders that cache into the planner prompt as `Total Value: $0.00 (0 SOL)` and `No tokens found with non-zero balance`, and `GET /wallet/balance/:token` (`routes/index.ts`, line 119) answers `404 TOKEN_NOT_FOUND` for a token the wallet holds.\n2. `getBalancesByAddrs` (lines 2145-2154) returns `{}` from its catch; `GET /wallet/balance` (`routes/index.ts`, line 73) applies `balances[publicKeyStr] ?? 0` and answers `200` with `balance: 0`. The same catch retries on a `429` message with `return this.getBalancesByAddrs(...)` and no attempt counter, so a sustained rate limit is an unbounded recursion and the request never returns.\n\nBoth routes have their own `catch` that would have produced a correct 500; the service swallows the error first. This is the pattern the repository error policy forbids (a default return from a catch, and `?? \u003cliteral\u003e` disguising missing required data).\n\n**To Reproduce**\n\nReal `SolanaService`, real routes and real provider; only the RPC `Connection` is replaced by a stub that answers HTTP 500 to every call:\n\n```\n--- service layer ---\ngetBalancesByAddrs  -\u003e {}\n Error      Error fetching token accounts: Error: failed to get info about accounts: Server responded with 500 Internal Server Error\ngetTokenAccountsByKeypair -\u003e []\n--- HTTP routes (RPC is returning 500 for every call) ---\nGET /wallet/balance -\u003e HTTP 200 {\"success\":true,\"data\":{\"publicKey\":\"11111111111111111111111111111112\",\"balance\":0,\"symbol\":\"SOL\"}}\nGET /wallet/portfolio -\u003e HTTP 200 {\"success\":true,\"data\":{\"publicKey\":\"1111...1112\",\"totalUsd\":\"0\",\"totalSol\":\"0\",\"tokens\":[],\"hasBirdeyeData\":false}}\nGET /wallet/balance/:token (USDC) -\u003e HTTP 404 {\"success\":false,\"error\":{\"code\":\"TOKEN_NOT_FOUND\",\"message\":\"Token EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v not found in wallet\"}}\n--- portfolio cache written while RPC is down ---\nupdateWalletData() -\u003e {\"totalUsd\":\"0\",\"totalSol\":\"0\",\"items\":[]}\ncached under SOLANA_WALLET_DATA_CACHE_KEY: [[\"solana/walletData\",{\"totalUsd\":\"0\",\"totalSol\":\"0\",\"items\":[]}]]\nprovider text injected into the planner prompt:\nEliza's Main Solana Wallet (11111111111111111111111111111112)\nTotal Value: $0.00 (0 SOL)\nToken Balances:\nNo tokens found with non-zero balance\n```\n\n**Expected behavior**\n\nAn RPC failure propagates as a typed error (`ElizaError` with a code such as `SOLANA_RPC_UNAVAILABLE`). `updateWalletData` distinguishes \"RPC reported zero accounts\" from \"RPC did not answer\" and never caches the latter. The provider renders an explicit unavailable state instead of a zero portfolio. `GET /wallet/balance` returns the route's existing 500 path instead of `balance: 0`. The 429 retry is bounded by an attempt counter and ends in a typed `RATE_LIMITED` error.\n\n**Evidence / reproduction proof**\n\n- [ ] MP4 recording or JPG screenshots: N/A - no visible UI; the defect is in service and route output, reproduced with a script against the real modules.\n- [x] Backend logs and script output are inline above.\n- [ ] Real-LLM trajectory: N/A - the defect is reachable and observable without a model call.\n- [x] Domain artifacts: cache rows and HTTP responses are shown inline above.\n\n**Additional context**\n\nFound in a develop-wide sweep for catch blocks that return a healthy-looking default. The EVM sibling is reported separately.\n"])</script><script>self.__next_f.push([1,"30:T5b5,"])</script><script>self.__next_f.push([1,"Apply Alpha Compute’s design and branding to the finished phone experience.\n\n## Detailed Description\n\n**Estimate:** 5 working days, October 6–12. **After:** https://github.com/elizaOS/eliza/issues/31025 and all preceding project work.\n\n- Agree the Alpha Compute logo, colors, typography and key screen designs.\n- Apply the approved design to onboarding, chat/voice, settings, pairing and phone screens.\n- Update app name, icons, splash/boot branding and other visible product identity. Preserve required license notices.\n- Keep package identity, signing, authentication and update compatibility intact; coordinate any required identity changes across app and AOSP.\n- Install the branded release on all four phones and recheck pairing, voice xercised only by `truncate-suffix-reserve.test.ts` |\n\n## Reproduction (develop `822aba345b67`)\n\n```ts\nconst shared = { id: 1 };\nstringifyForDiagnostics({ a: shared, b: shared });\n// → {\"a\":{\"id\":1},\"b\":\"[Circular]\"}\n```\n\nThe same input through the other two helpers yields the same shape.\n\n## Expected\n\nOnly a reference back to an open ancestor is a cycle. For the two `JSON.stringify` replacers the ancestor path is recoverable from the replacer's `this` (the holder object): pop the stack until the top is the holder, then test membership. For the recursive walker, add before descending and delete in `finally`.\n\n\n## Consolidated scope — maintainer backlog review, 2026-09-14\n\nAlso owns #30999 (settings-debug shared references) and #31113 (log redaction shared references). These are the same ancestor-path versus globally visited-set defect, with distinct output contracts. Candidate PRs are #31005, #31002 and #31119; they are not approved by this consolidation. A coordinated implementation should avoid duplicating incompatible traversal logic, while retaining sink-specific secret redaction, explicit diagnostic preview limits and genuine cycle handling.\n\nAcceptance must include sibling aliases, repeated array entries, true cycles, nested Errors and secret-bearing values at the actual consumers. Check expansion cost on shared graphs. A diagnostic size guard must not silently truncate complete recorded/model-facing content; trace every consumer before calling an output a preview.\n\nThe JS runtime bridge data-conversion defect in #30994 stays separate: it changes returned values at a public execution boundary, rather than only diagnostics.\n\n\n## Logger consolidation and implementation rejection\n\nAlso owns #25125, the logger redaction shared-reference report (candidate #30887). Preserve logger-specific secret redaction and log-preview contracts; do not force logger and full trajectory/provider outputs into the same lossy serializer. #31005 adds a 50,000-object truncation marker to stringifyForDiagnostics even though core relationships provider context and recorded trajectories consume it. That implementation is rejected: the replacement must preserve complete model/recorded values or explicitly reject a real resource-boundary overflow without publishing a partial payload. Candidate #30887 requires independent sink review before reuse.\n"])</script><script>self.__next_f.push([1,"32:T44a,The final #30051 review independently reproduced two regressions introduced by 104be2 and 7516, which reached develop before the corrective review branch merged. Recent conversation bodies are replaced with room-ID summaries unless incoming text matches recall keywords. Planner preflight replaces the complete admitted tool catalog with candidate/umbrella tools under an estimated budget, removing child argument schemas. Authorization gates themselves remain intact. These violate the repository complete-model-context invariant and break cross-room recall and compound tool requests. Original regression tests demonstrate failures: 13/17 recall tests and two planner execution cases fail against the new code. Restoring reviewed complete-context behavior yields 17/17 recall and 80/80 planner/final-wire budget tests. Acceptance: preserve all authorized conversation bodies and admitted tool/child schemas; retain typed explicit rejection at genuine model boundaries; preserve current develop changes and publish focused regression evidence. Correction is prepared in the review closeout branch.33:T81c,"])</script><script>self.__next_f.push([1,"The approved cloud production plan requires billing-suspended agents to resume automatically when funded entitlement returns, without waiting for the owner to visit the agent. The inspected proxy/pairing routes provide request-triggered resume. The credit-increase path invalidates caches, and the billing sweep selects billable states rather than provider-confirmed suspensions. No refill-triggered e fulfilled, one rejected with code `already_joined`, one live session, one bot launched.\nThe scratch test was removed after confirming the failure.\n```\n\n## Proposed fix\nMake the reservation truly synchronous with the duplicate check by inserting the session into `this.sessions` BEFORE the first await (before `await billing.reserveInitial()`), instead of at the current `this.sessions.set(sessionId, session)` that follows the billing await. Concretely: build the session record (or a minimal non-terminal reservation placeholder keyed by sessionId with the platform/nativeMeetingId and status \"requested\") and `this.sessions.set` it immediately after the dup-check in the same synchronous turn; then run `await billing.reserveInitial()` and the rest of setup against the already-claimed slot. Extend the existing rollback: if billing.reserveInitial (or later world/room/writer setup) throws, `this.sessions.delete(sessionId)` so the meeting stays joinable (mirrors the current catch that releases the reservation). Test plan (\u003e=10 lines): add a billing-enabled variant of the MJ-4 concurrency test asserting exactly one fulfilled join, one `already_joined` rejection, one live session, one adapter launch, and exactly one billing reserveInitial consumed; plus a test that a failing reserveInitial rolls the reservation back so a subsequent join of the same meeting succeeds (not permanently `already_joined`).\n\n## Evidence plan\nPR attaches the failing-before/passing-after billing concurrency test output (fulfilled count 2→1, live sessions 2→1) and the rollback test, run via `npx vitest run` in plugins/plugin-meetings, alongside the unchanged existing no-billing MJ-4 test to show no regression.\n\n## Duplicate search\ngh search issues --repo elizaOS/eliza --state all, queries: \"plugin-meetings TOCTOU\", \"meetings double bot\", \"meetings concurrent join billing\", \"MeetingService already_joined billing\", \"reserveInitial concurrent\", \"meetings billing\" — all empty. rovider.getWalletBalances()` only returns per-chain native balances (`formatUnits(balance, 18)` from `getBalance`), so no token balance is ever consulted for the relative computation.\n\n## Reproduction\n```\nAdded a focused test at plugins/plugin-wallet/src/chains/evm/actions/swap.reltoken-repro.test.ts driving the real `buildSwapDetails` with a stub WalletProvider whose native `base` balance is \"2.0\" and a stub runtime whose model returns {inputToken:\"USDC\", outputToken:\"WETH\", amountMode:\"percent\", amountPercent:50, chain:\"base\"}.\nCommand: node_modules/.bin/vitest run plugins/plugin-wallet/src/chains/evm/actions/swap.reltoken-repro.test.ts\nObserved: PASS — details.fromToken === \"USDC\" and details.amount === \"1\". \"1\" is 50% of the 2.0 NATIVE balance, proving the 50%-of-USDC request was resolved against the ETH balance rather than the USDC balance. Expected: the amount should be 50% of the caller's USDC balance. (Test file removed after running; it is not part of the proposed diff’s permanent surface beyond the new regression test.)\n```\n\n## Proposed fix\nIn buildSwapDetails (plugins/plugin-wallet/src/chains/evm/actions/swap.ts): when amountMode is relative and the resolved fromToken is not the chain's native currency, resolve the fraction against the fromToken's on-chain balance (ERC-20 balanceOf → formatUnits with the token's decimals) instead of the native `chainBalance`. Keep the native-balance basis (with the existing 0.9 gas reserve for \"max\") only when fromToken is the native asset. If the token balance cannot be fetched, throw EVMError(INVALID_PARAMS) rather than silently using the native balance. Test plan (\u003e=10 lines): unit-test buildSwapDetails for (a) percent swap of an ERC-20 → amount equals the fraction of the token balance, (b) native \"max\" still applies the 0.9 reserve, (c) native \"half\" halves the native balance, (d) token balance unavailable → throws. Stub WalletProvider + runtime model output as in the repro.\n\n## /runs/36636159978 (2026-09-29T21:52Z). The previous run at `2a464d8413` (https://github.com/elizaOS/eliza/actions/runs/36628914261) was green; the two runs in between were cancelled by later pushes, so this is the first observed run after the reminder-delivery change landed.\n\n## Failure\n\nThe step summary only prints `{\"status\":\"failed\",\"firstAttemptPassed\":false,\"passedAttempts\":0}`. The uploaded `cloud-stability-keyless-1` artifact carries the reason in each attempt's `scenario.stdout.log` (identical for attempts 01-03):\n\n```text\n| cloud-stability-agent | failed | 1470ms | deterministic model fixtures were not consumed:\n[{\"name\":\"cloud-reminder-dispatch-body\",\"consumed\":0,\"min\":1,\"max\":1,\"required\":true},\n {\"name\":\"cloud-reminder-dispatch-title\",\"consumed\":0,\"min\":1,\"max\":1,\"required\":true}] |\n```\n\nThe reminder itself was created and dispatched: the scenario's `assertCloudReadback` guard was never reached because the fixture-consumption check fails first, and the `scenario-report.json` shows `OWNER_REMINDERS_CREATE` with `cadence.kind: \"once\"`, `metadata.ownerSurface: \"OWNER_REMINDERS\"`, one `in_app` plan step.\n\n## Cause\n\n`packages/cloud/e2e/scenarios/cloud-stability-agent.scenario.ts` declares two required `TEXT_SMALL` fixtures for the dispatch path:\n\n- `cloud-reminder-dispatch-body` (matches `Current reminder:\\n- title: Review the synthetic Cloud inbox`, cardinality 1)\n- `cloud-reminder-dispatch-title` (matches `Message body:\\nTime to review the synthetic Cloud inbox.`, cardinality 1)\n\nSince `51bd56787c` (fix(reminders): deliver grounded one-shot content without prose rewriting, via #32931 merged as `6d13e67446`), `RemindersService` no longer calls the model for exactly this reminder shape. In `plugins/plugin-personal-assistant/src/lifeops/domains/reminders-service.ts` the `exactReminder` branch (owner occurrence, `in_app`, lifecycle `plan`, `cadence.kind === \"once\"`, `metadata.ownerSurface === \"OWNER_REMINDERS\"`, no `bodyOverride`) builds the body with `buildReminderBody` (`Reminder: \u003ctitle\u003e\\nDue: \u003clocal time\u003e`) and issues a `ReminderPresentation` whose title is the literal `Reminder`; `renderReminderBody` and `renderOwnerNotificationTitle` are only reached on the non-exact path. The scenario's reminder satisfies every `exactReminder` condition, so neither `TEXT_SMALL` call happens and the two required fixtures stay at `consumed: 0`.\n\nThe readback assertion itself still holds with the grounded body (`notification.body.includes(\"synthetic Cloud inbox\")` matches `Reminder: Review the synthetic Cloud inbox`).\n\n## Fix\n\nRemove the two dead fixtures from the deterministic scenario (they encode the pre-`51bd56787c` prose-rewriting contract), leaving the readback assertion to pin the grounded dispatch. Only the deterministic lane is affected; `stability:real` uses the same scenario without fixtures.\n\nI am opening a PR for this.\n"])</script><script>self.__next_f.push([1,"44:T14aa,"])</script><script>self.__next_f.push([1,"**Describe the bug**\n\n`drainCutoverHolds` (`packages/cloud/services/gateway-webhook/src/cutover-hold.ts`) fences record removal to the current lease owner: the Lua step at `:255-258` refuses to delete the hold record when a *different* token owns the lease. That fence is correct while the other owner is alive. It leaves a gap when the other owner dies:\n\n1. Drainer A acquires the lease and starts redelivering a held Blooio or Twilio turn.\n2. A's renewal fails for a whole lease period, the lease lapses, and replica B acquires it (`set nx`). B then dies before draining.\n3. A's turn completes. The dedup ledger is written `delivered`, but A's `removeHeldRecord()` returns 0 because B's token owns the lease, so the record and its index entry stay.\n4. B's lease lapses. The next drainer acquires the lease, finds a live record, and calls `redeliver` without looking at the ledger. The Cloud turn runs again and the provider receives a second send.\n\nThis is the \"P2\" probe from the review of #32909 and the case #32944 left out of scope. #32944 fixed the sibling case where the lease lapsed with *no* new owner; this one needs the drainer to notice that the ledger has already left `held`.\n\n**To Reproduce**\n\nThe real `handleWebhook` and `drainCutoverHolds` against the local `Bun.serve` Cloud stub and in-memory Redis used by `__tests__/cutover-hold.test.ts` (Bun 1.3.14, Node 24.15.0, `--conditions=eliza-source`). A signed Blooio webhook is held during a `503 personal_cutover_in_progress`. Cloud is then attested, and while the attested turn runs the lease key is overwritten with another replica's token. After the first drain the lease is deleted (the other replica died and its lease lapsed) and a second drain runs.\n\nOn `190d8a3304` (#32944's head) the second drain redelivers:\n\n```\n$ bun test --conditions=eliza-source __tests__/cutover-hold.test.ts -t \"another replica owned the lease\"\n534 |     expect(second).toEqual({\nerror: expect(received).toEqual(expected)\n-   \"delivered\": 0,\n+   \"delivered\": 1,\n(fail) connector ingress during Shared→Dedicated cutover \u003e a hold settled while another replica owned the lease is not redelivered once that lease lapses\n 0 pass\n 1 fail\n```\n\nGateway log for the message (timestamps and trace ids omitted): the turn completes twice and the provider egress runs twice.\n\n```\n{\"level\":\"warn\",\"message\":\"Personal connector turn held for Dedicated cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"holdCode\":\"personal_cutover_in_progress\"}\n{\"level\":\"info\",\"message\":\"Personal Eliza connector message completed\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"cloudAttempts\":1,\"egressMs\":2,\"totalMs\":3}\n{\"level\":\"info\",\"message\":\"Held personal connector turn delivered after cutover\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"attempts\":1}\n{\"level\":\"info\",\"message\":\"Personal Eliza connector message completed\",\"platform\":\"blooio\",\"messageId\":\"msg_cutover_8\",\"cloudAttempts\":1,\"egressMs\":1,\"totalMs\":4}\n```\n\n**Expected behavior**\n\nA drainer that acquires the lease over a record whose dedup ledger is no longer `held` does not redeliver. It removes the record under the same owner fence and moves on. The turn above runs once and the provider receives one send.\n\n**Screenshots / recording of the wrong behavior (required for anything visible)**\n\nN/A - server-side gateway queue behaviour with no rendered surface; the test transcript and gateway log above are the proof.\n\n**Evidence / reproduction proof**\n\n- [x] MP4 recording or JPG screenshots of the broken behavior: N/A - no visible surface; see the transcript.\n- [x] Backend logs and frontend console/network logs when relevant: gateway log above; N/A for frontend (no UI).\n- [x] Real-LLM trajectory when the bug involves agent/action/prompt/model behavior: N/A - no model call; the Cloud route is a local stub.\n- [x] Domain artifacts when relevant: the drain statistics and the `delivered` ledger with a surviving record, in the transcript.\n\n**Additional context**\n\nThe remaining unguarded window is two live drainers running the same turn concurrently, which happens only if renewal fails and a second replica acquires the lease while the first turn is still in flight. Lease renewal (`renewLeaseWhileRedelivering`) exists to prevent that, and the ledger check below cannot see it because the ledger stays `held` until a turn settles.\n\n**Contribution provenance**\n\n\u003c!-- contribution-attribution:v1 --\u003e\n\u003c!-- attribution-row:ai-assistance --\u003e\n- AI assistance: `yes`\n\u003c!-- attribution-row:models --\u003e\n- Model(s) used: `anthropic/claude-fable-5-1`\n\u003c!-- attribution-row:client --\u003e\n- Agent tooling: `Claude Code`\n\u003c!-- attribution-row:skill-revision --\u003e\n- Skill path: `elizaOS/army@46fa4776ba6bd0df2e7236c95a3c77e69cd1db
