idence-head:1f1b272f2192690068026867432ef7165a86975c --\u003e\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [x] N/A - no rendered UI is changed.\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [x] N/A - no rendered UI is changed.\n\u003c!-- evidence-row:walkthrough-video --\u003e\n- [x] N/A - library contracts and host services have no visual workflow in this PR.\n\u003c!-- evidence-row:backend-logs --\u003e\n- [x] [32976-task-tests.log](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32976-task-tests.log)\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend is changed.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] N/A - deterministic task lifecycle infrastructure; no model calls, prompts, or model-selected actions are introduced.\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [32976-restart-evidence.json](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32976-restart-evidence.json)\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no rendered visual surface.\n\n# Evidence Details\n\nThe restart scenario runs a real Bun child against a real SQLite file, kills the child after the durable dispatch record, then starts another host. Recovery reports `paused`, operation `unknown`, epoch `1`, and preserves the ordered create/observe/prepare/dispatch/recover event sequence. The actuator in this scenario is controlled: this proves the journal boundary and recovery behavior, not browser or provider acceptance.\n\n## Known gaps / failures\n\nThe reviewed head passed hosted PR Validation and local repository verification. Browser/OS adapters, product consumption, real integrations, and device acceptance are separate follow-up changes. Dependency installation used `bun install --frozen-lockfile --ignore-scripts`; required dependency builds were exercised by the owning checks.\n\n## Deployment\n\nOpt-in services only. Hosts retain responsibility for database protection, retention and migration policy. Existing file-backed interaction sessions remain supported; this PR does not migrate or delete their storage.\n\n\n\n## Review repair\n\nActuator outcomes now require evidence for resolved status. Runtime validation also records malformed JavaScript/native replies as unknown after dispatch, preserving the journal and requiring explicit reconciliation instead of leaving the task waiting. Four real HTTP/SQLite cases cover missing evidence, malformed evidence, and invalid status; all 19 agent integration cases and 14 core cases pass. At reviewed head `1f1b272f2192690068026867432ef7165a86975c`, owning checks passed all 76 tasks and full `bun run verify` passed all 284 tasks plus final audits with exit 0 (Node 24.15.0, Bun 1.4.2). [Hosted PR Validation](https://github.com/elizaOS/eliza/actions/runs/36846174831) passed all four jobs. Current-head evidence: [agent integration tests](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32976-review-1f1b272-agent-tests.log), [core tests](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32976-review-1f1b272-core-tests.log), and [verification receipt](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/32976-review-1f1b272.json).\n"])</script><script>self.__next_f.push([1,"6a:T31a6,"])</script><script>self.__next_f.push([1,"Cloud agent lifecycle: safe restore gating, exact failed-provision cleanup, unpaid stop-in-place, automatic billing resume, lost-chargeback hold, and the Dedicated-to-Shared fallback authority.\n\nOne commit per issue. Stripe credit math and pricing files are untouched, which keeps this out of `shaw/fix-cloud-billing-subscriptions`. **Migration numbers:** this PR adds `0478`, `0479` and `0480`, after `0474` on develop. That leaves `0475`–`0477` for #32838; whichever lands second must re-sequence the journal `idx`/`when`.\n\n## #29678: stale provision cleanup can kill a same-name successor\n\nFixes #29678\n\n- **Deploy:** the provisioning-worker deploy now rewrites the preserved `/opt/eliza/cloud/.env.local` to exactly one repository-owned `ORPHAN_RECONCILER_ENABLED=0`. It verifies the value before restart and again in the health gate.\n- **Cleanup:** failed post-adoption provision cleanup no longer calls `stopForReplacement(handle.sandboxId)` by the reusable container name.\n  - It re-fences the adopted candidate with its exact node, immutable container ID, replacement attempt and VPN identity (`fenceAdoptedProvisionForCleanup`).\n  - It then retires the candidate through the existing durable replacement-cleanup authority, which releases the node slot exactly once.\n  - Incomplete Docker identity fails closed as a retryable cleanup failure.\n  - Name-based teardown remains only for non-Docker providers.\n- **Remaining:** the orphan classifier's read-authority mismatch, where it treated a live `running` row as orphaned, still needs its own staging investigation with the reconciler disabled.\n\n## #30697: preserve agent state and gate readiness until backup recovery succeeds\n\nFixes #30697\n\n- **Fail on any known-backup failure:** every lookup, reconstruction or application failure for a known backup now fails the provision. Nothing prunes the chain; `degradeUnrecoverableSnapshot` and `pruneBackups(agentId, 0)` are gone.\n  - Transient failures keep their cause so the job retries.\n  - Failures that cannot heal become `SNAPSHOT_RESTORE_REQUIRES_FRESH_BOOT_CONSENT`. These are crypto errors, 401/403, 404/410, a custom image without the restore endpoint, null reconstruction, and size refusal.\n- **Readiness gate:** every provision stays `provisioning` (non-routable) until the restore tail commits readiness through a generation-fenced CAS. Billing re-entry happens only after the restore is applied.\n- **Background reconciler:** the stuck-provisioning reconciler no longer flips a healthy row to `running` while the agent has a backup that was never proven applied.\n- **Unchanged paths:** first creation without a backup and explicit `forceFreshBoot` consent still work and keep retained backups.\n- **Behaviour change:** waking a custom image that lacks the restore endpoint now reports a recovery failure. Before, it skipped the restore silently. The owner can explicitly consent with `forceFreshBoot`.\n\n## #20726 (partial; consolidates #30746): durable backup/restore lifecycle\n\nRefs #20726. This is an umbrella issue and must stay open.\n\n**Unfunded/legacy stop path (#30746).** A bound billing suspension whose current backup cannot be captured used to refuse the stop, so unpaid compute kept running. It now stops the exact observed runtime **in place**:\n\n- The restart policy is disabled and the container is stopped by its immutable ID. It is never removed.\n- `agent_sandboxes.retained_runtime` (migration 0478) records the exact runtime and its private ingress. While it is set:\n  - node deprovisioning counts the row;\n  - the orphan reaper sees a live placement;\n  - provision, restore and sleep refuse to replace the runtime.\n- `executeResume` restarts that same container in place after billing settles, publishes ingress only after readiness, and clears the marker.\n- A missing or replaced runtime is a visible failure, never a fresh boot.\n\n**#30820 (manifest-v3 restore candidates) was not ported.**\n- Its Agent-side substrate was deleted from `develop` in `dce4782e17` (\"updates\", 2026-09-23). That is roughly 14k lines: the `agent-backup-restore-v3-candidate-{fs,records,file-set,...}` and `agent-backup-v2-capture` modules.\n- Its only behavioural test (`agent-backup-restore-v3-materialization.pglite.test.ts`) imports those modules.\n- The cloud-side join/seal hunks apply with a trivial import-path fix, but they would land as dormant code with no materializer and no runnable test. I left them out.\n- The intent (never route before a verified restore, never silently boot empty) is delivered on the production restore path by the #30697 commit.\n- **Owner decision needed:** whether the v3 Agent materializer is coming back.\n\n**Still needs live staging or further work for #20726:**\n- A staging drill on a real Docker node for the retained stop. It must cover:\n  - `docker update --restart=no`, then stop, then inspect;\n  - mounts and secrets retained;\n  - node deprovisioning blocked;\n  - exact restart.\n- Physical provider evidence for the #29678 exact cleanup. The same-name successor survives, driven through the real Docker identity resolver over SSH.\n- The #20732 explicit restore (materialize, commit generation, boot/attest, route CAS) and the v3 decision above.\n- #24594 node-loss failover, #24601 incremental chains / multipart publication, #24407 fair admission, #31270 heartbeat-vs-backup, #31325 restore memory budget, #31334/#31355 drain before cutover.\n- A staging backup, wipe, restore, boot and remembered-fact drill with measured RPO/RTO (artifacts A–E).\n\n## #30702: automatically resume billing-suspended agents when funding returns\n\nFixes #30702\n\nThe provisioning worker reconciles one cursor page per cycle, using the existing stop intents and provisioning jobs. No new scheduler is added.\n\n- **Discovery** selects provider-confirmed `billing_request` stops that meet all of:\n  - the intent is still the agent's newest intent;\n  - the agent is still `stopped`, not deleting, not replacement-fenced and unowned;\n  - no exclusive lifecycle job was created after the stop;\n  - the organization admits paid work.\n- **Admission** re-reads funding through the canonical credit gate (cash plus eligible subscription allowance). It re-verifies the stop authority under the agent lifecycle lock in the enqueue transaction. Repeated scans and concurrent refills therefore reuse one `agent_resume` job.\n- **Execution** rechecks authority and funding before any effect. A later user stop, a deletion or lapsed funding completes the job as an explicit `skipped` instead of resuming.\n- **Crash repair:** a crash between a credit commit and the enqueue is repaired by the next page.\n- **Resume paths:** retained runtimes restart in place; removed containers re-provision through the fail-closed restore from #30697.\n- **Remaining:** live verification of the final database, runtime and provider state before production rollout.\n\n## #25146 (server-side mechanism): reversible Dedicated-to-Shared fallback\n\nRefs #25146\n\n- **Most conservative withdrawal policy.** Dedicated access is withdrawn only when both hold:\n  - the runtime is stopped by a provider-confirmed billing stop that is still its latest lifecycle decision;\n  - the organization is **unfunded now**.\n\n  Transient, unknown, user-initiated and funded states keep Dedicated authority with the existing honest unavailability.\n- **Durable authority:** `personal_dedicated_fallbacks` (migration 0480) holds one active interval per account. Each interval has a monotonic generation, the withdrawing stop intent, and a new scoped Shared journal (`fallback:\u003cuuid\u003e`). A later withdrawal opens a new generation and never reopens an older interval.\n- **Memory boundary:** Shared answers in the scoped journal and never in the canonical Dedicated/pre-upgrade room. Responses carry a typed `accountState`: access, reason, `dedicatedMemory: \"unavailable\"`, generation, and the billing recovery path. It contains no payment details.\n- **Recovery:** once Dedicated runs again, both consumers close the interval before routing returns.\n- **One decision for both consumers:** personal message delivery and the personal-shared messages route use the same authority decision. Group turns are unchanged.\n- **Remaining (product decisions or live evidence):**\n  - importing the Shared interval into Dedicated on recovery;\n  - a model-facing account provider;\n  - signed, expiring recovery links;\n  - notice dedupe;\n  - isolating Shared long-term memory beyond conversation history;\n  - a policy for trial, grace, dunning and cancel-at-period-end;\n  - live Stripe sandbox and connector certification with desktop/mobile evidence.\n\n## #22930 (clearly-correct slice only): payment reversal entitlement\n\nRefs #22930. The owner decision is still required, so this does not close the issue.\n\n**Implemented:**\n- A dispute that closes **lost** (`charge.dispute.closed`, `status: \"lost\"`) records a durable, idempotent `organization_payment_reversal_holds` row (migration 0479). The row is attributed through the organization credit grant that the charge funded.\n- While a hold is active:\n  - the canonical agent credit gate denies new paid admission (create, provision, resume, wake, upgrade) regardless of balance;\n  - automatic resume (#30702) skips the organization.\n- A hold ends only through an explicit, audited release (`releasePaymentReversalHold`, with actor and reason required).\n- Won disputes, open disputes, refunds and charges without a credit grant never create a hold.\n- The existing clawback on `funds_withdrawn` is untouched.\n\n**Open decision points for the owner (Decision A/B/C and the eight fields):**\n1. Should refunds, partial refunds or `funds_withdrawn` (before a dispute is decided) also hold, or only a lost dispute (current behaviour)?\n2. Is the unrecovered clawback shortfall (`unrecovered_clawback_usd`) authoritative debt, written off, or a separate state?\n3. Which gates beyond agent admission should a hold block: inference, storage, domains, API keys, apps, containers?\n4. What happens to already-running billable resources during a hold (continue, suspend, stop), with what exact timing, and who pays? Nothing is stopped today.\n5. Which capabilities stay available during a hold (sign-in, billing history, export, deletion)?\n6. Restoration: automatic after repayment or a won re-dispute, or a reviewed release (current behaviour)? Who may release?\n7. UI states, notifications, receipts and support/audit requirements (#22966).\n8. Interaction with subscription dunning states.\n9. Creator payouts (#23022) are moot, since mini-app/creator payouts were removed.\n\n## Verification\n\nAll commands were run from the owning package directories on this branch.\n\n- `bun test src/lib/services/__tests__/provision-recovery.pglite.test.ts` (new, real `ElizaSandboxService` over PGlite): 11 pass\n- `bun test src/lib/services/__tests__/retained-unpaid-stop.pglite.test.ts` (new): 3 pass\n- `bun test src/lib/services/__tests__/billing-suspension-resume.pglite.test.ts` (new; covers automatic resume, the reversal hold and the fallback authority): 5 pass\n- Existing suites touched by these changes:\n  - `suspend-backup-durability.pglite`: 6 pass\n  - `eliza-sandbox/power.test.ts`: 30 pass (custom-image wake expectation updated to the fail-closed contract)\n  - `docker-node-workloads.retained.pglite`: 5 pass\n  - `docker-node-workload-reconciliation.pglite`: 6 pass\n  - `subscription-funding-transaction.pglite`: 32 pass\n  - `subscription-allowance-visibility.pglite`: 2 pass\n  - `account-billing-snapshot-primary.pglite`: 2 pass\n  - `provisioning-jobs-scheduled-backup-sentinel.test.ts`: 57 pass\n- `packages/cloud/api`:\n  - `bun test __tests__/stripe-event.test.ts`: 45 pass (2 new cases)\n  - `__tests__/dedicated-agent-proxy.test.ts`: 75 pass\n- `packages/cloud/scripts/admin/daemons`: `bun test provisioning-worker-env-reconcile.test.ts`: 14 pass (1 new case; runs the workflow block verbatim against a seeded stale host file)\n- Typecheck:\n  - `tsc --noEmit` in `packages/cloud/shared`: clean\n  - `tsc --noEmit` in `packages/cloud/api`: clean\n  - `provisioning-worker.ts` checked with the shared config: only the error at line 2241 (`PrePullImagesSummary | null`), which is also on `develop` and not touched here\n- Lint and migrations:\n  - Biome on every changed file: clean\n  - `drizzle-kit check`: clean\n  - `check-migration-prefix-order`: clean\n- After rebasing onto develop `d0c5d08ace`: shared `tsc` clean; `drizzle-kit check` and the migration-order check clean; the three migration-touching PGl o.\n- **Attestation.** There is a new authenticated route, `POST /api/tee/dstack/attestation`, that returns raw guest evidence for an operator nonce. `verify-attestation` appraises it off-box with `verifyDstackAttestation` against the signed release. It also checks the signed Cerebras processor approval with `createConfidentialHostPolicy`.\n- **README.** Covers deploy, verify, pairing, and upgrade/rollback.\n\nVerification:\n- `node ../scripts/run-vitest.ts run --config vitest.host.config.ts src/services/alpha-dstack-deployment.test.ts` (packages/app): 5 passed. This includes `docker compose config`, release signing and bootstrap contract checks, and appraisal accept/reject cases.\n- `test/tee-dstack-operator-attestation.test.ts` (packages/agent): 2 passed, against a real Unix socket.\n- CLI smoke of `render`, `sign-confidential-release` and `sign-processors` on the committed example.\n- `ci-bun-version-contract` and `audit-tee-secret-leak` both pass.\n\n## #31021: phone pairing contract\nRefs #31021\n\n- **core.** Adds a `remote-agent-pairing` contract (endpoints, bearer auth) and a strict QR/deep-link payload: `elizaos://remote/agent-pair?v=1\u0026url=\u0026code=\u0026instance=`. The payload carries a one-time code and the issuing instance, never a token. The pair schemas gain an optional `instanceId`.\n- **agent.** The agent-only server now reports a per-process `instanceId`, which the app's `pair()` needs. Before this change, pairing against a hosted agent-only server failed with `PAIRING_NOT_READY`. `pair-code` can now be read from loopback or with the API token, so a CVM operator can use it. `pair` rejects a code issued by another instance with 409.\n- **app.** The compat `pair-code` route also admits an authenticated OWNER. The deep-link handler exchanges the code against a trusted origin (the build-pinned `VITE_ELIZA_REMOTE_FALLBACK_API_BASE` for Alpha APKs) before the normal connect, which asks the user to confirm.\n- **ui.** `exchangeRemoteAgentPairing` checks the origin before sending any request and binds the exchange to the issuing instance.\n- **Operator CLI.** `alpha-dstack.ts pair-link` prints the payload.\n\nVerification:\n- `test/remote-agent-pairing-http.test.ts` (packages/agent, real HTTP): 1 passed. It covers the wrong token, the wrong instance, a reused code, and bearer use afterwards.\n- `src/platform/remote-agent-pairing.test.ts` (packages/ui): 7 passed.\n\n## #31022: Alpha routines\nRefs #31022\n\n- Adds an opt-in `alpha-routines` supplemental pack in plugin-scheduling: morning brief, reminders and nudge. They are seeded disabled (`manual` trigger), and each carries an `owner_local` enable trigger. It is selected with `ELIZA_SCHEDULING_DEFAULT_PACKS`, read from the runtime setting first and then the environment. The dstack compose sets it.\n- `packages/agent/test/scheduled-routine-offline-delivery.test.ts` uses a real SQLite runtime, PA's production dispatcher and the HTTP server with no WebSocket client connected. It shows that a routine fired while offline lands in durable history exactly once, despite overlapping and repeated ticks, with a stable id across reloads.\n\nVerification: plugin-scheduling `plugin`, `record-startup` and `seed-registry` tests: 24 passed. The offline-delivery test: 1 passed. `turbo typecheck --filter=@elizaos/plugin-scheduling` passes.\n\n## #31034: white-label Android build\nRefs #31034\n\n`ELIZA_WHITELABEL_DIR` points at a private directory outside the repo containing a `brand.json` with app name, icon background, icon, splash, Cloud splash mark and boot animation logo/field.\n\n- The loader fails closed and rejects package ID, URL scheme and signing fields.\n- Same-ID white-label builds move to the app's own ignored Android tree.\n- `make splash`/`make bootanimation` render the private logo and field, and refuse to ship the upstream splash.\n- Documented in `packages/os/android/README.md`.\n\nVerification: `scripts/mobile/whitelabel.test.ts` (7 passed, placeholder assets) and `whitelabel-bootanimation.node.test.ts` (2 passed; renders and packs).\n\n## #31023: Pixel AOSP\nRefs #31023\n\nThe tree targets only `pixel11pro-grizzly`, and there is no Pixel 10 lock. This adds a `decisionNote` to the grizzly entry in `hardware-targets.json` and a README pointer that records the open device decision. No vendor, kernel or lock changes. `pixel-firmware-preparation.node.test.ts`: 4 passed.\n\n## Also referenced\n#31025, #31037 and #30844 need no code beyond the above. Their remaining work is device rollout, QA and the final APK.\n\n## Checks\nTypecheck passes for packages/agent, packages/app (host), packages/core, packages/ui and plugin-scheduling. Biome is clean on changed files; the only remaining finding is the pre-existing JSON formatting of `hardware-targets.json`. `audit-test-lane-membership`, `audit-focused-skipped-tests`, `fix-workspace-deps --check`, `alias-read-guard` and `audit-scripts` pass. The full `bun run verify` was not run because the machine was heavily loaded.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"6c:T56f,"])</script><script>self.__next_f.push([1,"Saved Reminders appeared among owner Todos and had no dedicated management filter in Automations. Keep reminder records out of the Todo projection and expose them through a Reminders filter in the existing Automations page, without another launcher, scheduler or storage model.\n\nThe owner-scoped read projection includes saved messages, exact due times and recorded delivery outcomes. Existing definition/occurrence APIs handle message and one-shot due edits, eligible snoozes, and reversible cancellation by archival. Delivered reminders do not offer unsupported snooze/redelivery controls. Unknown or failed statuses are not labeled Scheduled; an unknown filter count is omitted rather than shown as zero. Other Automations content remains available.\n\nValidation on pinned develop: 26 UI tests and two real PGlite/API integration tests passed, including foreign-owner isolation, retained records/plans, Todo exclusion, message-edit propagation into the existing body formatter, and registered route handling. UI and personal-assistant typechecks passed after current core and cloud-sdk builds. Focused formatting and diff checks passed. These checks do not claim actual notification delivery, live browser acceptance or full-branch CI.\n\nThis change does not include the separate deadline scheduling, post-plan escalation, grounded reminder presentation or task-extraction context changes.\n"])</script><script>self.__next_f.push([1,"6d:T2efb,"])</script><script>self.__next_f.push([1,"Refs #22957\n\nEliza Cloud has two ways to pay: **Plus/Pro subscriptions** (a monthly allowance plus plan limits, from #32838/#32854) and **pay-as-you-go prepaid credits**. This PR puts the owner's decisions on the consolidated #22957 children into code, one commit per child. `packages/cloud` has no billing README, so the policy table is here.\n\n| Policy | Decision (as implemented) |\n|---|---|\n| Storage prices (#22956) | `STORAGE_PRICING` in `shared/src/lib/constants/pricing.ts` is the only storage price source. PUT costs $0.0001 plus $0.000000001 per byte; GET, HEAD, list and presign cost $0.00005 each; DELETE is free. There is no per-GB fee. The `service_pricing` storage rows are a read-only copy, and the admin API refuses to edit them. |\n| Top-ups and packs (#22963) | Pay-as-you-go top-ups accept any whole-cent amount from **$5 to $1,000** per checkout, on card, crypto and direct wallet. The $10/$25/$50/$100 buttons are presets, not packs. Credits always equal the amount paid, with no bonus. Fixed packs are retired, but historical pack orders and ledger rows can still be read. |\n| API keys (#22958) | API keys are free. Plans cap how many a user can create: **pay-as-you-go 5, Plus 10, Pro 25**. Keys the system creates (default, explorer, sign-in, app and agent keys) don't count. A deactivated key counts until it is deleted. A key's own `rate_limit` (requests per minute across all endpoints) is a cap under the plan tier; it never raises the tier. |\n| RPM tiers (#23019) | Subscribers get their plan's tier. For pay-as-you-go, the $5 and $100 thresholds count only **purchased** credits: Stripe, OxaPay crypto, x402, direct wallet (paid USD only, not the promo bonus) and payment requests. Refunds and chargebacks subtract; a won dispute adds back. Promo, signup, referral, affiliate, earnings, MCP and refund credits never count. |\n| Crypto and x402 refunds (#22968) | Refunds are paid **only as Eliza Cloud credits**. Nothing is sent back on-chain or to fiat. Each refund is capped at the USD actually paid, can be replayed safely with the same refund key, and goes only to the org that owns the payment. The policy is stated at checkout and in the x402 top-up payment prompt. |\n| Generated media (#20956) | Generated media counts toward the **single storage quota**; there is no separate media quota. If the quota is already full, the request is refused before any charge. If the output doesn't fit once generated, it isn't stored and the provider cost is charged. Storage is released only after the object is confirmed deleted. |\n\nMigrations 0503–0505 are appended to the journal after develop's 0500–0502. They were first written as 0496–0498 and renumbered when #32907 merged, because the deployed migration ledger rejects entries inserted before already-applied migrations.\n\n## #22956: storage pricing\nFixes #22956\n\n- Every storage route now charges from `storageOperationPriceUsd`: objects PUT/GET/HEAD/DELETE, list and presign. None of them reads `service_pricing` any more, so the \"pricing unavailable\" 503 path is gone.\n- Migration **0503** updates the storage rows in `service_pricing` to match the catalogue. It writes an audit row for any price it corrects and removes the old \"finalize during pricing review\" TODO.\n- `PUT /api/v1/admin/service-pricing` now returns 409 `storage_pricing_code_owned` for `service_id=storage`.\n- Tests:\n  - `storage-pricing-boundary.test.ts` pins the exact catalogue and proves no route reads DB pricing.\n  - `storage-pricing-catalogue-migration.test.ts` applies 0503 on PGlite.\n\n## #22963: credit packs and minimum top-up\nFixes #22963\n\n- **Server:** `ORGANIZATION_CREDIT_CHECKOUT_LIMITS` is now $5–$1,000, and `ORGANIZATION_CREDIT_TOP_UP_PRESETS_USD` is [10, 25, 50, 100]. These bounds are read by:\n  - card checkout (`/api/stripe/create-checkout-session`) and `/api/v1/credits/checkout`;\n  - `/api/v1/credits/summary`;\n  - crypto (`MIN/MAX_PAYMENT_AMOUNT`) and `/api/crypto/direct-payments`;\n  - the billing-hold pay action.\n- **Checkout orders:** `stripeCheckoutOrdersService.create` rejects new pack orders, amounts outside the range, and any grant that isn't exactly the charged amount (so no bonus). These are typed errors.\n- **Removed:**\n  - the pack checkout branch (a `creditPackId` now gets a typed 400);\n  - `GET /api/stripe/credit-packs` (router regenerated);\n  - the pack cache and service lookups;\n  - the `seed-credit-packs` and `audit-credit-packs` scripts;\n  - local-dev pack seeding;\n  - `packSavingsPercent`.\n- Migration **0504** deactivates the pack rows. Legacy pack settlement and quarantine are unchanged.\n- **UI:** the billing tab has $10/$25/$50/$100 preset buttons and reads its limits from the contract. It previously had its own $1–$10,000 bounds.\n- **Copy:** the billing SEO text in all eight locales (en, es, ja, ko, pt, tl, vi, zh-CN) now describes Plus/Pro subscriptions with a monthly allowance and pay-as-you-go top-ups from $5 to $1,000. No locale mentions credit packs any more.\n\n## #22958: API keys\nFixes #22958\n\n- `apiKeys` is now a resource ceiling:\n  - added to `FREE_RESOURCE_CEILINGS` and to the Plus/Pro catalogue entries;\n  - `readOrganizationQuotaPolicy` resolves it for pay-as-you-go and for subscriber orgs;\n  - a lapsed subscription falls back to 5.\n- `POST /api/v1/api-keys` creates through `createUserManaged`:\n  - it takes the org policy lock and counts non-deleted user-created keys;\n  - at the limit it throws `ApiKeyLimitExceededError`, returned as 403 `api_key_limit_exceeded` with `used`, `limit` and `remaining`;\n  - rotating a key keeps its attribution.\n- `GET` returns `usage`, and the API keys page shows it.\n- Migration **0505** adds `api_keys.user_created`, backfills it for existing live user keys (system-provisioned keys are excluded), and adds a partial index.\n- **Per-key `rate_limit`, now enforced.** Nothing read this field before, but keys do carry custom values: the explorer key is minted at 100, app keys at 10000, and the API accepts 1–100000. So the field is kept and enforced.\n  - It means requests per minute for the key across every inference endpoint, and it only narrows the plan tier.\n  - `enforceOrgRateLimit` takes the presenting `apiKeyId` and reads the cap inside the locked policy transaction. Policy admission now passes its transaction to the callback.\n  - The cap is applied only when it can bind, i.e. when it is below the plan's combined per-minute tier. Default 1000 keys therefore add no work.\n  - The admission Durable Object checks the tier window and the per-key window in one serialized decision. Key windows are dropped after their minute ends.\n  - The Redis limiter path checks an `apikey:\u003cid\u003e:rpm` window.\n  - A key that authenticated but has since disappeared fails closed with a 503.\n  - Chat completions, chat, messages, embeddings and the generative routes pass the key id.\n- Tests:\n  - `api-key-plan-ceilings.pglite.test.ts`: the 5/10/25 ceilings, a refused 6th key, a deactivated key still counting, the slot freed on delete, org isolation, concurrent creates at N-1 admitting exactly one, and the Plus limit of 10.\n  - `api-key-plan-ceilings-migration.test.ts`: the backfill.\n  - `api-key-rate-limit.pglite.test.ts`: when a cap binds, and the fail-closed path for a missing or foreign key.\n  - `inference-admission-gate.miniflare.test.ts`: the per-key window in the real Durable Object. It counts across endpoints, doesn't limit other keys or key-less callers, and rejects an invalid cap. 20 pass.\n\n## #23019: RPM tier credit sources\nFixes #23019\n\n- The metadata denylist is replaced by `ORG_TIER_PURCHASED_CREDIT_SOURCES`, an allowlist keyed on payment identity, and the total is net of reversals.\n- Purchases, refunds and clawbacks now clear the cached tier, so a crypto or x402 purchase or a reversal takes effect without waiting out the one-hour cache.\n- `org-rate-limit-purchased-credits.pglite.test.ts` covers every provenance, the $4.99/$5 and $99.99/$100 boundaries, clawback and reinstatement, org isolation and the Plus plan tier.\n\n## #22968: crypto/x402 refunds\nFixes #22968\n\n- `CryptoPaymentRefundsService.refundAsCloudCredits` is the refund path, with the operator script `scripts/admin/refund-crypto-payment.ts`.\n  - `CRYPTO_REFUND_POLICY` maps both crypto and x402 to `cloud_credits`.\n  - Any other destination is refused with a typed `CryptoRefundError` before anything is read or written.\n  - It locks the payment row, checks the recipient is the owning org, and caps the refund at the paid USD (never the bonus).\n  - Refunds are idempotent per refund key and written as `refund` ledger rows, so they never count toward an RPM tier.\n- The x402 top-up payment prompt carries the policy in every locale, both in its `description` and in a structured `extra.refundPolicy` field (`{ destination: \"cloud_credits\", statement }`). Covered by `topup-refund-policy.test.ts`.\n- The billing tab states the policy when Crypto is selected. The direct-wallet overpayment error now points to a credit refund instead of an on-chain one.\n- Tests: `crypto-payment-refunds.pglite.test.ts`, plus a UI test.\n\n## #20956: generated media vs storage quota\nFixes #20956\n\n- The new `lib/storage/generated-media-storage.ts` is wired into image generation, `generate-music` and `generate-sfx`. Before admission it checks the org still has storage headroom; if not it returns a typed 413 `storage_quota_exceeded`. It then reserves the exact output bytes before writing to R2.\n- **Cleanup:** a failed history write or a partial multi-image request deletes the objects and releases their bytes.\n- **Gallery delete:** releases the bytes once, through `markDeletedOnce`, and only after R2 confirms the delete.\n- **Hosted audio:** fal and Suno results are never stored in Cloud R2, so they are not counted (`AudioProvider.storesOutputInCloud`).\n- The storage limits copy now describes one figure for files, avatars and generated media.\n- `generated-media-storage-quota.pglite.test.ts` drives the real image executor and quota repository.\n\n## Verification\nEach test file was run on its own; the machine was heavily loaded.\n\n- **Type checks, all pass:**\n  - `tsc --noEmit` for cloud shared, cloud api, cloud sdk and packages/ui;\n  - api `test/_router-contract.mjs`;\n  - `check-migration-prefix-order` and `check-tenant-scope`.\n- **New tests:** all pass.\n- **Updated existing tests, all pass:**\n\n  | Test file | Result |\n  |---|---|\n  | `stripe-checkout-orders.pglite` | 14 pass |\n  | `billing-manager-mutations.pglite` | 38 pass |\n  | `storage-pricing-boundary` | 2 pass |\n  | ui `billing-tab.test.tsx` | 14 pass |\n  | ui `billing-tab.idempotency.test.tsx` | 25 pass |\n\n- **Regression runs, all pass:**\n\n  | Test file | Result |\n  |---|---|\n  | `subscription-entitlements-derivation` | 5 |\n  | `api-keys-stranded-sweep` | 9 |\n  | `subscription-allowance-lifecycle.pglite` | 8 |\n  | `account-billing-snapshot-primary.pglite` | 2 |\n  | `org-storage-quota.pglite` | 4 |\n  | `containers-project-intent.pglite` | 6 |\n  | `org-storage-mutations.pglite` | 19 |\n  | `credits-reconcile` | 37 |\n  | `stripe-event` | 48 |\n  | `stripe-dispute-reinstatement.pglite` | 9 |\n\n- `biome check` is clean on every changed file.\n- **Not run:**\n  - the full `bun run verify` and the complete test batches (host load);\n  - `check:worker-bundle`;\n  - the live E2E groups: the direct-crypto and account-billing E2E cases were updated for the $5 minimum and the retired pack route;\n  - the app visual audit and desktop/mobile inspection of the new preset buttons, crypto policy note and API-key usage line.\n\n## Remaining\n- The new UI strings (quick amounts, crypto refund note, API-key usage, storage wording) exist only in `en.json`. Other locales show them in English through `defaultValue`. The billing SEO copy and the x402 refund statement are translated.\n- Crypto refunds go through the operator script only; there is no customer-facing refund request UI.\n- #22961, #23020 and #22967 are handled in a separate PR.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"6e:T190c,"])</script><script>self.__next_f.push([1,"One commit per issue. Each touches only its own lane.\n\n## #30806 — Worker admission (Refs #30806)\n- **(a)** Affiliate-marked and flat-priced subscriber requests on the Worker now use the deferred Durable Object lease-and-settle lane.\n  - The affiliate payout contract is pinned in the lease recovery context.\n  - The payout is enqueued inside the funding transaction, so it commits atomically with the debit. Replays and alarm recovery never pay twice. The DO validates the pinned contract.\n  - Found and fixed: the synchronous subscriber reservation never enqueued its affiliate payout. `subscriptionFundingService.settleInTransaction` ignored the pinned `affiliatePayout` metadata.\n  - Non-Worker callers stay synchronous. The reason is documented in `isDeferredSubscriberLaneEligible`: they have no Worker lifetime and no DO for leases or alarm recovery.\n- **(b)** New flag `INFERENCE_SNAPSHOT_ADMISSION_ENABLED`, on in staging and off in production. With it on, the warm Worker path serves admission from the published admission snapshot. No policy transaction, dispatch-policy transaction or auth-cache policy read runs before dispatch.\n  - The snapshot now carries billing-hold state and subscriber funding capacity. Both are read under the publishing policy lock.\n  - Every publication advances the org DO's policy generation. A lease or dispatch carrying an older generation fails closed with `409 inference_admission_policy_stale`, and the projection is repaired under `waitUntil`.\n  - Aged snapshots, held orgs and subscribers without published capacity take the authoritative path.\n  - Documented residual: a policy or balance write that has not yet been republished is visible to the DO only after the snapshot max age (the auth-context TTL).\n- **(c)** The production strong-revocation (#30796) canary procedure is documented in `wrangler.toml`. Production is not flipped.\n- Remaining: the live Worker→Cerebras trace and certification, the staging soak of snapshot admission, and the production canary.\n\n## #16420 — mobile auth (Refs #16420)\n- **(a)** Already enabled; evidence only. `wrangler.toml` and the GitHub environment variable are both `true`. `GET /api/v1/app-auth/mobile/config` returns the registered client on `api.eliza.app` (production) and on `api-staging.eliza.app` (staging).\n- **(b)** App Store iOS builds are Cloud-only by default.\n  - The store lane bakes `VITE_ELIZA_IOS_RUNTIME_MODE=cloud` and omits the on-device engine. `ELIZA_IOS_APP_STORE_LOCAL_RUNTIME=1` is the explicit opt-in to cloud-hybrid; dev overrides still win.\n  - The store publish workflow no longer forces cloud-hybrid plus the full Bun engine.\n  - Such a renderer brands cloud-only before boot, so onboarding and settings hide local runtimes.\n- **(c)** Verified, no mismatch. The live `https://eliza.app/.well-known/apple-app-site-association` is served as `application/json`, with `applinks` and `webcredentials` for `25877RY2EH.ai.elizaos.app` and `/auth/callback`. That matches:\n  - the pbxproj team and bundle IDs;\n  - `App.entitlements`;\n  - the reviewed entitlement allowlist;\n  - the `ElizaCloudAuthSessionPlugin` callback.\n- Remaining: clean-install runs on iOS and Android devices, and the app visual audit on a device build.\n\n## #29921 / #22934 — connector cutover guarantees (Refs #29921)\nDecision (delegated): during cutover, ingress is held until Dedicated is attested. No message is dropped or delivered twice.\n- **Cloud:** the Shared seal (423) and the committed cutover (409) now become a typed `PersonalCutoverHoldError`. Before this, they surfaced as a 500 and as a terminal conflict. The route returns them as a retryable `503 personal_cutover_in_progress` with `Retry-After`.\n- **Gateway:** for acknowledged-before-processing providers (Blooio, Twilio), a held turn is persisted durably in Redis instead of being reopened and lost.\n  - It is stored as a record plus a sorted-set index, and its dedup key is marked \"held\".\n  - A leased drainer redelivers it with the original message id until Cloud accepts it, then records the delivery once.\n  - The one-hour budget expires to visible failure handling.\n- Remaining: the live Shared→Dedicated composed transition through a real provider.\n\n## #29919 / #22787 — staging Blooio isolation (Refs #29919)\nDecision: staging gets its own Blooio account, number and signing secret. Distinct signing secrets key each environment's webhooks.\n- **Runtime guards:** a non-production gateway or Worker disables Blooio when its sender is a production line. It also ignores any message addressed to a production line.\n- Removed the non-production fallback to the production sender.\n- **Deploy-time check:** added to the Cloud release and gateway deploy workflows. It reports an error annotation now; switch it to `--enforce` once staging is provisioned.\n- Remaining (operator): provision the staging account, number, webhook and secret; record the owner and rotation procedure.\n\n## Verification\nTests were run one file at a time.\n- `packages/cloud/shared hrough the SSRF-guarded fetcher.\n  - Filesystem paths and other schemes are rejected without reading disk.\n- Telegram, Discord and Slack now upload the resolved bytes.\n- Logs and delivery evidence carry only a scheme/host/path summary. The base64 payload no longer appears in the Telegram error.\n- If a Telegram attachment fails, the text reply is still sent.\n- Behavior change: Telegram no longer reads local file paths passed as attachment URLs. Treating a model-supplied path as a file on disk was the bug.\n\n## #32026: bounded Discord attachment cache\nFixes #32026. Ported from #32032.\n\n- The cache is now keyed by the stable attachment id instead of the signed CDN URL.\n- It holds at most 64 entries (LRU) with a 2-minute TTL.\n- Extracted transcript text is no longer kept in the cache.\n\n## #31464: per-account Discord disconnect (partial, `Refs`)\n`deleteAccount` used to be a no-op. It now works as follows:\n\n1. **Persist a disabled policy first.** It goes in the runtime cache, keyed by account id and a SHA-256 fingerprint of the token. The token itself is never stored.\n2. **Disconnect the account.** `DiscordService.disconnectAccount`:\n   - blocks new messages for that account only;\n   - drains its admitted turns, within the existing shutdown-drain timeout;\n   - tears down its client, login retry, debouncer, managers and audio sinks.\n3. **Siblings are unaffected.** Other accounts keep running, and the default alias moves to a remaining account.\n4. **Failures are retryable.** A teardown failure throws before the manager deletes its row, and a retry repeats the teardown.\n5. **Restart honors the policy.** After a restart, the service skips the disabled token and the provider stops listing it. Configuring a new token under the same id counts as a replacement and runs normally.\n\nRemaining, outside this plugin:\n- Removing the token from character settings or env. The host's settings owner has to do this; the plugin cannot write it.\n- The issue's gating of all-channel onboarding completion, which belongs to the onboarding flow.\n\n## #31789: typed keyless web-search failures (+ #31785 SSE binding)\nFixes #31789.\n\n- `searchKeylessWeb` now returns `undefined` only when a search succeeds with zero hits.\n- Every provider failure throws `KeylessWebSearchUnavailableError`, with:\n  - a reason: `rate_limited`, `http_error`, `timeout`, `network`, `aborted`, `malformed_response`, `response_too_large`, `unsupported_content_type` or `provider_error`;\n  - the HTTP status and `Retry-After`;\n  - no query text or provider payload in the message.\n- The search takes a caller `AbortSignal` and never dispatches after cancellation.\n- The MCP response parser now handles SSE strictly (#31785):\n  - it parses complete SSE events, including multi-line and unspaced `data:` fields;\n  - it ignores notifications and responses to other request ids;\n  - identical replays are collapsed, and conflicting or missing responses are rejected.\n- Callers updated: the agent `WEB_SEARCH` action, the edge runner, coding-tools and the cloud keyless search. A provider outage is now reported as unavailable, not as \"no results\" / `no_match`.\n\n## #29650: platform-filtered MCP tool discovery\nFixes #29650.\n\n- `Tier2ToolIndex.search` now ranks the whole index, filters by platform, and only then applies offset and limit.\n- It returns the total match count, and `SEARCH_ACTIONS` reports `totalMatches` and `hasMore`.\n\n## #29930: EVM relative swap sizing (money path)\nFixes #29930. Reworked from conflicting #29933 (credit @agent-cortex).\n\n- Half / max / percent are now sized from the balance of the token being sold:\n  - **ERC-20:** the token's on-chain `balanceOf` and `decimals`. Symbols resolve through Li.Fi, the same way `SwapAction` does. `max` spends the full balance.\n  - **Native asset:** the native balance, and `max` keeps the 10% gas reserve.\n- All math uses bigint raw units, so large, dust and high-precision balances are never rounded through floats.\n- A failed balance read, an unconfigured chain or a zero result throws `INVALID_PARAMS`. The code never falls back to another token's balance.\n\n## #31110: Solana RPC failure shown as $0\nFixes #31110. Ported from conflicting #31127 (credit @hermesagent270-commits).\n\n- The token-account and SOL balance reads now throw `ElizaError`:\n  - `SOLANA_RPC_UNAVAILABLE` for an RPC failure;\n  - `SOLANA_RPC_RATE_LIMITED` after 3 backed-off attempts on 429. The old code retried 429 without limit.\n- `updateWalletData` no longer caches an empty portfolio when a read fails, so the last known value stays.\n- A failed first refresh no longer makes the configured wallet look absent.\n- The wallet routes answer 503 with the typed code.\n\n## #30151: web wake word matched as a substring\nFixes #30151. Ported from closed #30152 (credit @agent-cortex).\n\n- The trigger must now be a standalone token, so \"elizabeth\" no longer fires \"eliza\".\n- The boundary rule is relaxed for scripts written without spaces (CJK, Thai and similar).\n\n## Verification\nEach package's tests, typecheck and lint were run.\n\n| Package | Tests | Typecheck | Lint |\n|---|---|---|---|\n| `plugins/plugin-native-swabble` | 60/60 pass | pass | pass |\n| `plugins/plugin-wallet` | swap-amount-mode 20/20, `service.rpc-errors` 7/7 | pass (`tsconfig` + `tsconfig.ui`) | biome clean on changed files |\n| `packages/core` | `media/outbound.test.ts` 10/10 | pass | pass |\n| `plugins/plugin-discord` | full suite: 102 files, 825 tests pass | pass | pass |\n| `plugins/plugin-telegram` | `messageManager` + outbound-media 51/51 | pass | pass (6 existing warnings) |\n| `plugins/plugin-slack` | outbound-attachments 8/8 | pass | pass |\n| `plugins/plugin-web-search` | full suite 53/53 | pass | pass |\n| `plugins/plugin-coding-tools` | `web-search.test.ts` 10/10 | pass | pass |\n| `packages/agent` | — | pass | pass |\n| `packages/cloud/shared` | `bun test .../bm25-index.test.ts` 3/3 | pass | pass |\n\nRoot `ve ing, reordering or editing the archive makes decryption fail.\n- Listing reads only the plaintext header and trailer.\n\n**Restore** (`restoreLocalAgentBackup` picks v1 or v2 from the file extension):\n1. Authenticates and parses the whole archive into a temp staging dir under `backups/`, checking every frame and component digest.\n2. Recreates the empty PostgreSQL layout directories, checks `PG_VERSION`, and opens the staged database with PGlite.\n3. Only after all of that does it stop the runtime.\n4. Swaps the PGlite dir, media and `.vault-pglite` as whole directories, and state and vault files one by one. Every rename is journaled. If any step fails, the journal is replayed in reverse and the live data is left as it was.\n\n**Listing, pruning and retired-archive review/purge** handle both formats. Review decrypts and authenticates the whole v2 archive, and purge hashes files in streaming fashion.\n\n### Verification\n- `bunx vitest run test/local-backup-v2-restore.test.ts` (new, real HTTP host plus filesystem PGlite): 4/4 pass.\n  - A small agent still gets v1.\n  - A 144 MiB agent gets a v2 archive. The test checks the magic bytes, 0600 permissions, that a plaintext canary is absent, and that listing shows both formats.\n  - A corrupted archive is rejected with the runtime still running and no data changed.\n  - An injected swap failure (a read-only directory) rolls back the database, media and state.\n  - Restore over HTTP brings back byte-identical media and state and the database rows as they were at backup time.\n- `bunx vitest run test/backup-capture-http.test.ts`: 3/3 pass. The 413 case now uses a 1.5 GiB sparse file (the v2 limit), because 200 MiB is now backed up successfully.\n- `plugins/plugin-sql`: `src/__tests__/pglite-adapter-liveness.test.ts` 2/2 pass.\n- `tsc --noEmit` passes for both `packages/agent` and `plugins/plugin-sql`. Biome is clean on the changed files. The 36 warnings from the package-wide agent `lint:check` all come from files this PR connector-credential-durable.test.ts` 2/2 (a real `startElizaProcess` boot through the new startup hook). `tsc` passes and Biome is clean on the changed files.\n\n### Remaining\n- Postgres-backed agents above the in-memory ceiling get the explicit 413; v2 supports filesystem PGlite only.\n- The Postgres 413 wording has no automated test, because the harness has no Postgres runtime.\n- The native app still needs to be rebuilt and a backup/restore confirmed there, as the issue asks.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n"])</script><script>self.__next_f.push([1,"71:T188a,"])</script><script>self.__next_f.push([1,"Two trackers: the sandbox backup/restore epic (#20726) and exact-source staging certification (#29922). Both remain open; this PR delivers the code-completable slices. **No migrations added.**\n\n## #20726 — durable sandbox backup/restore (Refs #20726)\n\n### Restore re-land dropped\nThe re-land of #30820 was dropped from this PR. `dce4782e17` deliberately retired the manifest-v3 candidate-filesystem substrate (see `packages/agent/FOOTPRINT-REVIEW.md`: unfinished staging machinery with no callers), and re-landing it without a production caller would reverse that decision. #20732 stays open on that basis.\n\n### Local-state upgrade guard\n`fix(cloud): refuse blue/green upgrades that would strand local agent state`\n\nThe fleet upgrade can cut a local-state Dedicated agent over to a fresh volume on another node, leaving its history behind (#31334). It now refuses before any placement or container work and returns a rollback-safe result, so the old container keeps serving.\n\n### What this does NOT finish\n- **Restore still stops before activation.** The restore operation still ends at `restore_pending`. No production dispatcher or cron calls the quarantined-create runtime, the restore coordinator, or the new materializer services.\n  - **Remaining code:** advance `container_created → restoring → committed → restart_attested → prob ery in-flight estimate and runs the fused credential check.\n- **After the provider responds:** `fundSubscriberInferenceCharge` funds the exact charge, allowance first, in one primary transaction. That transaction also reads the post-accounting capacity, so settling the gate needs no balance readback.\n- **Alarm recovery:** replays the same `inference-gate:\u003crequestId\u003e` funding key, so a lease recovered after a lost settlement is never funded twice.\n- **Zero-collected replay:** settlement now persists a durable zero-collected receipt (migration `0493`) while retaining the actual cost. Replaying an earlier unfunded turn cannot charge newly added funds or substitute a later lease estimate. Real database regression coverage exercises the replay boundary.\n\n**How overspend is prevented**\n- **Revision:** migration `0491` advances `organizations.balance_revision` on every platform allowance transaction. Allowance-only spend, grants, releases and expiry therefore all look newer to the gate.\n- **Ceiling view:** the gate ledger records whether its ceiling is credit only or funding capacity (`balanceView: \"funding\"`).\n  - At an equal revision, the funding view replaces a credit-only observation.\n  - A newer revision always wins.\n  - Two observations of the same view can only lower the ceiling.\n  - A lease must carry the funding view exactly when its recovery accounting is `subscription_funding`.\n  - The view field is additive, so a rollback reads the ledger conservatively.\n- **Settlement:** caps the charge at the capacity available under the organization lock. Any remainder is reported as `uncollected_overage` and is never overdrawn, which matches the synchronous lane's policy.\n\n**Unchanged:** affiliate-marked, flat-priced (pending video) and non-Worker subscriber requests keep the synchronous reservation.\n\n**Folded micro-issues**\n- **#30724 (done):** `requireInferenceApiKeyWithOrg` now resolves key, user and organization with one primary statement. Rejection classes, messages and order are unchanged. Timing is now a single `auth_identity` hop, and the latency script is updated to match.\n- **#30715 (done):** as described above.\n- **#30860, #30865, #30718, #30722 (already fixed on develop):**\n  - #30860: the skip-mode memo write is gated in `steward-client.ts`.\n  - #30865: the affiliate settlement publishes its transaction's balance and revision.\n  - #30718: the policy statement already reads balance and revision.\n  - #30722: the aged deferred refresh landed in #32834.\n- **#30796 (remaining):** enabling `INFERENCE_STRONG_REVOCATION_ENABLED` in production needs the staging allow/deny/revoke canary and a normal release. This PR does not change it.\n\n**Remaining**\n- The policy-read and dispatch-policy transactions still run before dispatch. They were already there, so the zero pre-dispatch DB goal is still not met.\n- Live Worker-to-Cerebras certification and the traces for the exact deployed revision.\n- #30796, above.\n\n## #22552: first-turn warming 503s (partial)\nRefs #22552\n\nPartial work landed in #32834, which added the session-start prewarm and the keepwarm conversation-object leg for Personal Shared rooms. This PR adds three things.\n\n**Bounded join instead of an immediate warming 503**\n- The conversation Durable Object's history hydration, the linked-character cache and the combined admission snapshot now wait up to 4s for their in-flight hydration before failing.\n- Hydration that is slower than that, or that fails, still fails closed with the same retryable warming signal. The hydration keeps running under `waitUntil`.\n\n**Keep-warm for rowless Personal Shared identities**\n- A canonical personal turn records its verified owner in its conversation object. A forged projection, whose id is not derived from its account, is ignored.\n- The room prewarm reports that organization, and the cron then warms the organization's rate-limit gate once per sweep. The namespaced id is never sent to a UUID ation_entitlements` projection and the exact subscription revision it was built from. These cases never withdraw:\n- an active plan whose allowance is spent\n- `grace`\n- a deadline that passed without a confirmed lifecycle event (webhook lag)\n- an `incomplete_expired` checkout\n\nThe existing confirmed-unfunded billing-stop path still applies. Payment-reversal holds are left to #22930.\n\n**Durable, fenced transitions (migration `0490`, journal updated; 0485–0489 left free).** Every transition:\n- runs under the account advisory lock\n- re-reads the projection inside the transaction\n- compare-and-swaps a row `revision`\n- ignores projection revisions older than the one already applied\n\nSo concurrent webhooks, reconciler pages and connector turns converge on one interval and one set of effects.\n\n**Container preserved, same id restored.**\n- A live Dedicated runtime is stopped through the lifecycle queue inside the transition transaction. The state is captured and the runtime is never deleted. `retain_until` is set to now + 30 days and shown to the user.\n- When entitlement returns, a resume is admitted for the same agent id, only after the stop has settled and only once.\n- Credit-driven automatic resume (#30702) is fenced while a plan withdrawal is active.\n- The provisioning worker runs an entitlement reconcile phase before billing resume, so the paid runtime stops without waiting for a connector turn.\n\n**Zero Dedicated memory access in Shared.**\n- Each withdrawal generation gets a new scoped journal (`fallback:\u003cuuid\u003e`).\n- Fallback turns never read agent-scoped facts, which are shared with Dedicated. Recall and history are already pinned to the journal room.\n- A typed minimal account-state provider (`state`, `reason`, `dedicatedRetainedUntil`, `recoveryAction` of `restore_subscription` or `add_credits` at `/cloud/billing`) is resolved on the server. It is validated exactly at the Durable Object boundary, and any other shape gets a 400. It is rendered into the model context and tells the model to say plainly that Dedicated memory is unavailable. It contains no payment details.\n\n**Recovery.** Before routing returns to Dedicated, the complete journal is imported into Dedicated, idempotently by source message id. The switch is committed with a receipt after a fresh entitlement check. If the import fails, the turn returns a retryable 503 and the interval stays `recovery_pending`.\n\n### Verification\n- `bun test src/lib/services/__tests__/billing-suspension-resume.pglite.test.ts` (cloud-shared): 8 pass / 0 fail. This is real PGlite plus the real `ProvisioningJobService` queue. It covers:\n  - the policy table\n  - concurrent withdrawal converging on one interval and one stop\n  - no delete jobs\n  - the credit auto-resume fence (confirmed to fail with the fence removed)\n  - a stale or reordered projection being ignored\n  - a single resume of the same agent id\n  - the receipt-backed route commit\n  - a new generation after the plan ends\n  - a refused final commit when entitlement is lost mid-recovery\n  - the reconciler path without a connector turn\n  - the updated legacy credit path\n- `bun test __tests__/shared-runtime-cutover-reminder.miniflare.test.ts` (cloud-api, Workerd): 2 pass. The new assertions show that a fallback journal turn is admitted while the canonical room is cutover-sealed, loads none of the canonical history, receives the exact account state, and that malformed state is rejected.\n- `tsc --noEmit` for cloud-shared and cloud-api: clean. `check:router-contract` and `check:worker-bundle`: pass.\n- Biome on cloud-shared, cloud-api and the daemon: no errors (existing warnings only).\n- `check-migration-prefix-order`: pass.\n- `scripts/admin/daemons/provisioning-worker-env-reconcile.test.ts`: 3 failures in the bash workflow-block env tests. These do not touch this change and are macOS/environment related.\n- Root `bun run verify` was not run (whole-monorepo turbo typecheck/lint).\n\n### Re every managed route comes from that load. Cold deep links in a real browser are also covered by the cloud-surfaces audit route table.\n\n## #30228: canRespond reflects Cloud model availability\nFixes #30228\n\n`CloudModelRegistryService` now evaluates the effective TEXT_SMALL/TEXT_LARGE ids against its cached, non-billable `/models` catalog. It returns a typed readiness: `available`, `unknown`, or `model_not_available` with `MODEL_NOT_AVAILABLE`, the config key and the model id.\n- The read is synchronous and makes no inference call. A stale catalog schedules one bounded background refresh, with a 30-minute TTL and a 60-second retry after a failure.\n- `computeCanRespond` returns false only when the catalog positively says a model is not listed **and** Eliza Cloud is the only registered provider for that model type. A catalog outage stays `unknown` and never gates chat.\n- `/api/status`, `/api/health` and the WS status events now carry `modelReadiness`. The chat composer names the invalid setting instead of asking the owner to set up a provider.\n\n## #22552: first-turn cache warming (partial)\nRefs #22552\n- Opening a Shared conversation (`GET .../api/conversations`) now schedules, under `waitUntil`, the prewarm the first turn needs. Personal Shared warms its rate-limit gate and its conversation object. Sandbox-backed shared agents run the provision-time legs.\n- The keepwarm cron now warms each recently active Personal Shared room through a new `listRecentlyActiveRooms` read (bounded and sequential), using the same start-empty semantics as the turns themselves. It previously skipped these identities entirely.\n- The turn path still fails closed with the retryable 503. Nothing absorbs or awaits hydration.\n\n**Remaining:**\n- The keepwarm cron cannot warm the organization-scoped rate-limit gate for rowless `personal:\u003cuuid\u003e` identities. The id is a one-way hash, and `shared_runtime_history` has no organization column, so fixing this needs a schema or owner The rest of #30920 is about 24k lines of owned session authority and desktop/native persistence. It depends on its own large first commit and was not re-landed. The post-confirmation session revalidation (c3b3a941) depends on that commit's options plumbing.\n- The `/join` error-surface logout failure is not reproduced in code. A likely suspect is that `signOutFromSsoBridgedHost` skips the server logout on hosts outside `ELIZA_CLOUD_DIRECT_API_BY_HOST`. It needs the failing staging trace.\n- #16921 (one durable owner activation turn plus persisted first goal) is not implemented. It needs an owner decision on eligibility and migration for established agents. It also needs a single owner across the shared Durable Object and dedicated runtimes, and it conflicts with the current \"never fabricate assistant turns\" greeting policy in `conversation-routes.ts`.\n- The per-method desktop/mobile matrix needs staging.\n\n## #16420: native iOS Cloud authentication (partial)\nRefs #16420\n- New `ElizaCloudAuthSessionPlugin` (App target, registered in `ElizaBridgeViewController`, added to the Xcode project). It runs `ASWebAuthenticationSession` with the claimed HTTPS callback `https://eliza.app/auth/callback` on iOS 17.4+. The login hosts are an allowlist, and the callback host and path are fixed natively. One session owns a sign-in at a time.\n- `ios-cloud-auth.ts` reuses the shared mobile PKCE client (S256, config, token, ACK) with an in-memory verifier. It joins concurrent attempts and never replays a consumed code.\n- The credential is written before the ACK into the Steward token store, which the storage bridge already backs with the Keychain.\n- `useCloudState` takes the native path on iOS and keeps the device-code fallback when it is unavailable.\n\n**Remaining (needs Xcode signing, a device, and a deploy):**\n- Confirm the `eliza.app` AASA covers `webcredentials` and `/auth/callback` for the signed team and bundle.\n- Enable the mobile app-auth config routes in staging and production.\n- Make store builds Cloud-only by default.\n- Clean-install device runs on iOS and Android.\n- Decide on iOS 16.0–17.4. The deployment target is 16.0 and HTTPS callbacks need 17.4, so those devices keep the device-code fallback.\n\n## Verification\n- `plugins/plugin-elizacloud`: `bunx vitest run __tests__/cloud-model-readiness.test.ts`: 5/5 pass (real HTTP catalog server). `bun run typecheck`: pass.\n- `packages/agent`: `bun run typecheck`: pass.\n- `packages/ui`: `bun run typecheck`: pass.\n  - `src/cloud/shell/CloudRouterShell.private-registration`: 15/15.\n  - `CloudRouterShell.root-route`: pass.\n  - `src/cloud/public-pages/pages/login/steward-login-section.oauth-launch`: 22/22.\n  - `src/ios-cloud`: 5/5.\n- `packages/cloud/shared`: `tsc --noEmit`: pass. `bun test src/db/repositories/shared-runtime-history-merge.integration.test.ts` (PGlite): 3/3.\n- `packages/cloud/api`: `tsc --noEmit`: pass. The router-contract and worker-bundle dry-run were not run because disk was tight, and no routes were added.\n- Swift: `ElizaCloudAuthSessionPlugin.swift` typechecks against the iPhoneSimulator 26.4 SDK (`-target arm64-apple-ios16.0-simulator`) with a stub Capacitor module. It has not had a full Xcode build.\n- Biome check is clean on every touched file.\n- Not run to completion: the Playwright audit-cloud `pricing` spec and the bootstrap-accessibility spec. The live-stack renderer build timed out on this machine (`renderer-build process-timed-out`, a shared, heavily loaded host). Both specs still need CI or a local run, plus the app visual audit at desktop and mobile sizes.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"7a:Tec2,"])</script><script>self.__next_f.push([1,"# Relates to\n\nNative browser/helper docking needs separate browser and host activity bounds. The owned Chromium build currently has no cross-app embedding opt-in.\n\n# Change\n\nAdd an explicit Android-only --embed-host option roid replayed the connection deep link.\n\nThis change preserves accepted turns across transport disconnects, maintains paired-session authority through completion, persists terminal generation outcomes for reconnect, and binds pairing retries to the server and entered code. Credential persistence can retry without consuming the one-time code again; same-target deep-link replay preserves the paired session. Unpaired disconnected requests retain their cancellation behavior.\n\nValidation at integrated head `d172d7226a8e9b5b63f6eff7cc8a89a2ea8a7f12`: seven UI suites passed 194 tests, integrated agent pairing/readiness/failure-persistence suites passed 13 tests, and changed-file Biome passed. Full `bun run verify` passed 284/284 tasks and all final audits. The renderer build and full app capture passed 218/218 browser tests; all 24 manually flagged images plus desktop/mobile chat were inspected without a visual regression. Packaged OCR verified 208 views, zero broken, with four native-camera exemptions. Current-head hosted run 36630602979 passed all four checks; an additional Source checks rerun in 36628735628 is still running. The earlier renderer timeout is retained as a failed attempt, recovered by the completed renderer build and capture. These are source and browser-fixture results; this revised branch has not been installed on a physical phone.\n\n"])</script><script>self.__next_f.push([1,"7c:T22b1,"])</script><script>self.__next_f.push([1,"Backlog fixes across `packages/agent`, `packages/core`, `plugins/plugin-sql` (plus the two `plugin-assistant` seams the audience renewal needs). One commit per issue.\n\n## #32016: agent export secrets (Fixes #32016)\nThe maintainer closed #32028 because a migration bundle is meant to carry credentials, and asked for a secrets-free export to be **opt-in** instead. So this PR does that:\n- The default bundle still carries `secrets` / `settings.secrets`, protected by the bundle password. The module header now says so, where it used to imply they were excluded.\n- `POST /api/agent/export` accepts `excludeSecrets: true` (core contract, route, UI client). That option strips both containers from the agent record and from the runtime character. A non-object `settings` gets a typed `AGENT_EXPORT_INVALID_SETTINGS` error.\n- Import is unchanged. A default bundle restores the credentials it carries.\n- Test: `test/agent-transfer-secrets.test.ts` runs on real PGlite. It checks that a default bundle round-trips `settings.secrets`, and that a credential-free bundle has no secret in the decrypted payload or on the imported agent.\n\n## #31952: atomic content-addressed media writer (Fixes #31952)\nPorted from #31973 and cut down as the maintainer asked:\n- Persist, restore and the pin ledger now share one write-temp-then-rename helper.\n- If a file already exists under a content hash but its size differs from the payload, it is rewritten.\n- Dropped from the original PR: the extra fsync, the GC sweep and the logging.\n- Test: `test/media-store-atomic-persistence.test.ts` runs on the real filesystem. It covers repair on persist, repair on restore, idempotent re-persist, and a failed rename that leaves no partial file. It fails 4/5 on develop and passes with the fix.\n- Not done: the #30019 sub-item (the plugin-meetings duplicate writer) is outside this PR's scope.\n\n## #31953: WebSocket fan-out backpressure (Fixes #31953)\nPorted from #31974.\n- A peer's queued bytes are the transport buffer plus frames waiting on host admission.\n- A peer above the soft limit keeps getting every frame for a grace period. If it still hasn't drained, it is terminated. Above the hard limit it is terminated at once.\n- Frames are never skipped on a live socket. The client sees the termination and replays from the event buffer when it reconnects.\n- A ping/pong sweep prunes peers that stop answering.\n- Note for review: #31974 was closed because of a general concern about caps. This version never drops frames silently; the only failure mode is an observable disconnect followed by replay.\n- Test: `test/event-hub-backpressure.test.ts` uses a real `ws` server and clients. A stalled peer is bounded and terminated while a healthy peer gets all 2000 frames. A peer that stops answering pings is pruned.\n\n## #31239: trade-mode write failure (Fixes #31239)\nPorted from #31259.\n- A failed `saveElizaConfig` restores the previous in-memory shape, including removing a `features` object or mode key the handler itself created.\n- The route then answers a structured 500 instead of `ok: true`.\n- Test: `test/trade-mode-persistence-http.test.ts` drives the handler over loopback HTTP with the real config writer, with the config path blocked by a directory.\n\n## #31004: shared references treated as cycles (Refs #31004)\n- `stringifyForDiagnostics` (core) and the JS runtime bridge marshaller now track only the open ancestor path. True cycles are still marked, and nothing is truncated.\n- The scheduling DAG validation site was already fixed by #30932, and that PR has tests.\n- Tests: `packages/core/src/runtime/json-output.diagnostics.test.ts` and `packages/agent/test/js-runtime-bridge-shared-refs.test.ts`, which runs the real host-node bridge.\n- Tracker items outside this area are still open: `ui` tts-debug, `plugin-personal-assistant` redact-sensitive-data, and logger #25125.\n\n## #31251: shared registries and ElizaError identity (Fixes #31251)\n- `ElizaError` now carries a `Symbol.for` brand on its prototype and a `Symbol.hasInstance` that checks it. That makes `instanceof`, `isElizaError` and `toElizaError` pass-through work across bundled copies.\n- Subclasses keep normal prototype `instanceof`, and look-alike plain objects are still rejected.\n- The OCR registry (#31254) and the local-inference vision augmenter (#31257) were already fixed on develop.\n- Test: `packages/core/src/errors.identity.test.ts` loads a second module instance and checks recognition in both directions.\n\n## #31881: owner-private audience renewal during long turns (Fixes #31881)\nThe 5-minute TTL is unchanged. What's new:\n- **Turn lease.** The message turn (plugin-assistant `turn-lifetime.ts`) opens a lease with `beginTrustedDeliveryAudienceTurn`. The lease is bound to the runtime, to this turn's evidence binding, and to its merged cancellation signal. It closes when processing settles.\n- **Renewal.** Expired evidence is re-derived from current authority:\n  - Canonical rooms re-read the room kind, the owner and the full participant census.\n  - API evidence renews only through a host-supplied fresh principal check.\n- **What renewal must match.** It succeeds only if actor, agent, room, destination kind, owner and census are all unchanged. Sensitive-disclosure bookkeeping carries over.\n- **When renewal is refused.** After completion or cancellation, for a different runtime, and for evidence that was already expired when the turn began.\n- **Where it runs.** Inside revalidation, before the planner's exposure gates, and before owner-gated tool execution.\n- Test: `packages/core/src/security/trusted-delivery-audience.renewal.test.ts` (14 cases) advances the clock past the TTL. It covers a long turn succeeding and each invalidation case.\n- Not done:\n  - `chat-routes.ts` does not yet pass `revalidatePrincipal` to `attestAuthenticatedApiDeliveryAudience`, so authenticated-API turns still expire at 5 minutes. That needs a host-side fresh session or token check.\n  - The `live-note-to-calendar-stale-source` scenario was not re-run (needs a live provider).\n\n## #30825: actionable local backup size failures (Refs #30825)\n- `POST /api/backups` maps `AgentSnapshotBudgetExceededError` to a 413. The response carries `code`, `stage`, `unit`, `observed`, `limit` and `retryable: false`, plus a message the settings dialog shows as-is. It exposes no paths or DB diagnostics.\n- Unexpected failures still return the generic 500.\n- The file-count refusal now has its own `file count` stage.\n- Test: zation and user approval remain host responsibilities.\n"])</script><script>self.__next_f.push([1,"7e:T839,"])</script><script>self.__next_f.push([1,"Historical receipts repeated property names and identical values, volatile context interrupted stable history prefixes, and internal maintenance queues appeared as user work. Reuse the typed receipt encoder across extraction/planning/evaluation, preserve every original source and occurrence, order trusted history before live context, and use the existing workbench admission contract for task context.\n\nNo history truncation, new model call, task deletion or scheduling change. Untagged custom scheduler records intentionally remain outside the workbench contract. Recorded character savings are not a general token or latency claim.\n\nValidation: exact receipt/source roundtrips, core tests (19 passed in this focused batch), assistant tests, real HTTP/PGlite task/owner cases, package typechecks/lint and full verification passed on the scoped latest-develop candidate. Earlier live reminder creation/delivery passed; final combined device acceptance is pending. Private inputs and raw captures are not published. This PR stays draft.\n\nBackground experience eligibility now ignores presentation-only reply metadata. The captured reminder result previously matched the style word “verified” in replyGrounding; the exact stored result no longer creates that false eligibility signal. Action outcomes, actual user/reply signals and audit history remain available. Validation: 114 owning tests, exact captured result before/after, package typecheck/lint and full integrated verification. This does not claim to remove every background model call or improve measured latency.\n\nA verified tool result can still contain malformed provider prose. Final selection now uses the existing user-visible safety check before preferring that text over a clean synthesis. The actual captured control-character case previously discarded a clean reply and tr
