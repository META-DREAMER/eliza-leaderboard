`\n      : `Reputation OK (${score}/100, ${tier})`\n  };\n}\n```\n\n### What the scoring covers\n\nThe API analyzes real on-chain USDC transaction history and runs 12 behavioral checks:\n\n- **Sybil detection** — closed-loop trading, puppet funding chains, coordinated wallet creation\n- **Gaming detection** — wash trading, velocity spikes, balance window dressing\n- **Identity signals** — account age, Basename registration, partner diversity\n- **Reliability** — transaction consistency, payment patterns\n\nReturns a 0–100 score with tier (New/Developing/Emerging/Established/Trusted), confidence level, and recommendation.\n\n### Why this fits Eliza\n\n- **Free tier**: 10 calls/day, no API key, no signup — zero friction for agent developers\n- **Fast**: \u003c200ms response, cached scores\n- **TypeScript native**: Simple `fetch()` call, typed responses\n- **On-chain data only**: No off-chain identity required — works for any wallet on Base\n- **Eliza's wallet system**: Agents using `IWalletService` to send transactions can check recipients before transferring\n\n### Try it\n\n```bash\ncurl \"https://djd-agent-score.fly.dev/v1/score/basic?wallet=0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045\"\n```\n\nReturns:\n```json\n{\n  \"score\": 68,\n  \"tier\": \"Established\",\n  \"confidence\": 0.49,\n  \"recommendation\": \"proceed_with_caution\"\n}\n```\n\n### Links\n\n- [API Docs](https://djd-agent-score.fly.dev/docs)\n- [OpenAPI Spec](https://djd-agent-score.fly.dev/openapi.json)\n- [GitHub](https://github.com/jacobsd32-cpu/djdagentscore)\n\nHappy to help with integration if there's interest."])</script><script>self.__next_f.push([1,"15:T640,"])</script><script>self.__next_f.push([1,"Make sure develop has the best v2.0.0\n\n\u003c!-- CURSOR_SUMMARY --\u003e\n---\n\n\u003e [!NOTE]\n\u003e **Medium Risk**\n\u003e Medium risk because it significantly changes CI and release automation (including NPM publish steps and new Rust/Python release workflows), which can break builds or publishing if misconfigured.\n\u003e \n\u003e **Overview**\n\u003e Modernizes repo automation for v2.0.0 by **consolidating CI** and expanding coverage to **TypeScript + interop + Python + Rust** in `ci.yaml`, while removing several older per-package workflows.\n\u003e \n\u003e Adds new automation workflows for **docs quality/link fixing** (`docs-ci.yml`), **multi-language test matrix** (`multi-lang-tests.yaml`), and **supply-chain SBOM/vulnerability scanning** (`supply-chain.yaml`).\n\u003e \n\u003e Reworks release pipelines by enhancing `release.yaml` to build **Rust/WASM artifacts**, temporarily **rewrite `workspace:*` dependency versions** for NPM publishing, and adding dedicated **PyPI** (`release-python.yaml`), **crates.io** (`release-rust.yaml`), and **ComputerUse crates** (`release-computeruse-crates.yaml`) release workflows.\n\u003e \n\u003e Includes repo hygiene/config updates: adds `.biomeignore`, expands `.gitignore`, removes Cursor submodule/rules and some legacy ignore/config files, updates issue templates/renovate/dependabot configs, and tweaks various workflow timeouts and action versions.\n\u003e \n\u003e \u003csup\u003eWritten by [Cursor Bugbot](https://cursor.com/dashboard?tab=bugbot) for commit 97d1aa00ce591e0374d267e64b13a81ab38db7b7. This will update automatically on new commits. Configure [here](https://cursor.com/dashboard?tab=bugbot).\u003c/sup\u003e\n\u003c!-- /CURSOR_SUMMARY --\u003e"])</script><script>self.__next_f.push([1,"16:Tfab,"])</script><script>self.__next_f.push([1,"\u003c!-- Use this template by filling in information and removing irrelevant sections. --\u003e\n\n# Relates to\n\nRelates to #6486\n\n# Risks\n\nLow — single condition removed from a boolean expression. No new code, no new logic paths.\n\n# Background\n\n## What does this PR do?\n\nRemoves the `providers.length` check from the `isSimple` determination in `packages/typescript/src/services/message.ts`.\n\n## What kind of change is this?\n\nBug fix (non-breaking change that fixes an issue).\n\n# Changes\n\nWhen a user sends a message containing a URL, the LLM's first call (via `runSingleShotCore`) generates and streams the response text. It also returns `providers: [\"ATTACHMENTS\"]` because the prompt template instructs it to when it sees URLs.\n\nThe `isSimple` check at line 1883 previously treated \"has providers\" as \"not simple\":\n\n```typescript\nconst isSimple =\n    responseContent?.actions \u0026\u0026\n    responseContent.actions.length === 1 \u0026\u0026\n    typeof responseContent.actions[0] === \"string\" \u0026\u0026\n    responseContent.actions[0].toUpperCase() === \"REPLY\" \u0026\u0026\n    (!responseContent.providers || responseContent.providers.length === 0);\n//   ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n//   This condition causes the bug\n```\n\nThis caused the message to go through the `actions` path, which triggered the REPLY action handler (`reply.ts:60`), making a **second LLM call** with `replyTemplate` and streaming another response — duplicating output and doubling token costs.\n\n**The fix:** Remove the providers check. Providers enrich state (already handled at L863-871) but don't require re-generating the response. `isSimple` should only care about whether the action is REPLY (text already generated and streamed) vs something else (needs execution).\n\n```typescript\nconst isSimple =\n    responseContent?.actions \u0026\u0026\n    responseContent.actions.length === 1 \u0026\u0026\n    typeof responseContent.actions[0] === \"string\" \u0026\u0026\n    responseContent.actions[0].toUpperCase() === \"REPLY\";\n```\n\n# Testing\n\n- [x] Message with URL → single response (not duplicated)\n- [x] Message without URL → works as before\n- [x] Multi-action messages (REPLY + other) → still trigger actions path\n- [x] Messages with non-REPLY actions → still trigger actions path\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nRemoves the `providers.length` check from the `isSimple` boolean expression, preventing duplicate LLM calls when messages contain URLs or trigger provider enrichment.\n\n**Key Changes:**\n- Removed condition `(!responseContent.providers || responseContent.providers.length === 0)` from `isSimple` check at line 1883\n- Messages with `actions: [\"REPLY\"]` now correctly use the \"simple\" path regardless of provider presence\n- Providers still enrich state (lines 863-871) but no longer force re-generation of already-streamed responses\n\n**Impact:**\n- Eliminates duplicate streaming when URLs are detected (previously triggered ATTACHMENTS provider → action path → second LLM call)\n- Reduces token costs by avoiding unnecessary second LLM invocation\n- Response text from first `runSingleShotCore` call is now correctly used as final output\n\n\u003ch3\u003eConfidence Score: 5/5\u003c/h3\u003e\n\n- This PR is safe to merge with minimal risk\n- Simple, surgical fix that removes a single condition causing unintended behavior. The logic is sound: providers enrich state (already handled separately at L863-871) but shouldn't force action-based execution when the response is already generated and streamed. No new code paths, no breaking changes.\n- No files require special attention\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n\n\n\n| Filename | Overview |\n|----------|----------|\n| packages/typescript/src/services/message.ts | Removed providers check from `isSimple` determination to prevent duplicate LLM calls when URLs trigger provider enrichment |\n\n\u003c/details\u003e\n\n\n\n\u003csub\u003eLast reviewed commit: 681b3d8\u003c/sub\u003e\n\n\u003c!-- greptile_other_comments_section --\u003e\n\n\u003csub\u003e(2/5) Greptile learns from your feedback when you react with thumbs up/down!\u003c/sub\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"17:T1a38,"])</script><script>self.__next_f.push([1,"## Summary\n- Replace `application_name`-based server context with parameterized `set_config('app.server_id', ...)` for SQL injection safety\n- Rename `withEntityContext` → `withIsolationContext` across all adapters (pg, pglite, base, interface)\n- Replace `sql.raw()` with parameterized `set_config()` in `withIsolationContext` for entity context\n- Remove legacy `migrations.ts` (`migrateToEntityRLS`) — v2.0.0 starts with fresh snake_case schema, no v1.6.4→v1.6.5 migration needed\n\n## Changes\n\n### Core RLS (`rls.ts`)\n- `current_server_id()` now reads from `current_setting('app.server_id', TRUE)` instead of `application_name`\n- Added early NULL/empty check before UUID cast for robustness\n\n### Connection Manager (`pg/manager.ts`)\n- `withIsolationContext()` uses parameterized `set_config()` instead of `sql.raw()`\n- Server context set via `set_config('app.server_id', $1, true)` (transaction-scoped)\n- Entity context set via `set_config('app.entity_id', $1, true)` (transaction-scoped)\n- UUID validation before setting entity context\n\n### Adapters\n- Renamed abstract method `withEntityContext` → `withIsolationContext` in `base.ts`\n- Updated `pg/adapter.ts` and `pglite/adapter.ts` implementations\n- Updated `IDatabaseAdapter` interface in `database.ts`\n\n### Removed\n- `migrations.ts` (750 LOC) — legacy v1.6.4→v1.6.5 camelCase→snake_case migration\n- `migration-before-1.6.5.test.ts` — associated test file\n- `migrateToEntityRLS()` call from `migration-service.ts`\n\n### Tests\n- All unit tests updated: `withEntityContext` → `withIsolationContext`\n- All integration tests updated: `application_name` pool config → `set_config('app.server_id', ...)`\n- Cleaned up stale comments referencing old patterns\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR strengthens SQL injection protection in the RLS (Row-Level Security) system by replacing `application_name`-based server context and `sql.raw()` calls with parameterized `set_config()` calls, while cleaning up legacy v1.6.4→v1.6.5 migration code that's no longer needed in v2.0.0.\n\n**Key changes:**\n- Replaced `application_name` pool config with parameterized `set_config('app.server_id', $1, true)` for server context\n- Replaced `sql.raw()` with parameterized `set_config('app.entity_id', $1, true)` for entity context\n- Renamed `withEntityContext` → `withIsolationContext` across all adapters to better reflect that it sets both server and entity context\n- Updated `current_server_id()` SQL function to read from `current_setting('app.server_id')` instead of `application_name`\n- Added early NULL/empty check before UUID cast in RLS functions for robustness\n- Removed 750 LOC of legacy migration code (`migrations.ts` and `migration-before-1.6.5.test.ts`) that handled v1.6.4→v1.6.5 schema migration\n- Updated all tests to reflect new patterns (integration tests now use `set_config()` instead of `application_name`)\n\nThe changes are well-structured and comprehensive, with proper UUID validation and consistent error handling throughout.\n\n\u003ch3\u003eConfidence Score: 5/5\u003c/h3\u003e\n\n- This PR is safe to merge - it improves security by eliminating SQL injection vectors while maintaining backward compatibility\n- The PR receives a perfect score because: (1) it addresses a real security concern by replacing `sql.raw()` with parameterized queries, (2) all changes are consistently applied across the codebase, (3) comprehensive test coverage is maintained with both unit and integration tests updated, (4) the method rename is semantically accurate and applied consistently, (5) removing legacy migration code is appropriate for v2.0.0 which starts with a fresh schema\n- No files require special attention - all changes follow consistent patterns and are well-tested\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n\n\n\n| Filename | Overview |\n|----------|----------|\n| plugins/plugin-sql/typescript/rls.ts | Replaces `application_name` with parameterized `set_config('app.server_id')` for SQL injection safety in RLS functions |\n| plugins/plugin-sql/typescript/pg/manager.ts | Replaces `sql.raw()` with parameterized `set_config()` calls, renames `withEntityContext` → `withIsolationContext`, removes `application_name` from pool config |\n| plugins/plugin-sql/typescript/base.ts | Renames abstract method `withEntityContext` → `withIsolationContext` and applies formatting updates |\n| plugins/plugin-sql/typescript/pg/adapter.ts | Updates implementation to use `withIsolationContext` instead of `withEntityContext` |\n| plugins/plugin-sql/typescript/migration-service.ts | Removes legacy `migrateToEntityRLS()` call and associated imports for v2.0.0 fresh start |\n| plugins/plugin-sql/typescript/migrations.ts | Deleted entire file (750 LOC) - legacy v1.6.4→v1.6.5 migration no longer needed in v2.0.0 |\n| packages/typescript/src/types/database.ts | Updates `IDatabaseAdapter` interface: `withEntityContext` → `withIsolationContext` plus formatting changes |\n\n\u003c/details\u003e\n\n\n\n\u003ch3\u003eSequence Diagram\u003c/h3\u003e\n\n```mermaid\nsequenceDiagram\n    participant App as Application\n    participant Adapter as PgDatabaseAdapter\n    participant Manager as PostgresConnectionManager\n    participant DB as PostgreSQL Database\n    participant RLS as RLS Policies\n\n    Note over App,RLS: Server Context Setup (v2.0.0 Pattern)\n    App-\u003e\u003eManager: new PostgresConnectionManager(url, rlsServerId)\n    Note over Manager: Store rlsServerId internally\u003cbr/\u003e(NOT in application_name)\n    \n    Note over App,RLS: Transaction with Isolation Context\n    App-\u003e\u003eAdapter: withIsolationContext(entityId, callback)\n    Adapter-\u003e\u003eManager: withIsolationContext(entityId, callback)\n    Manager-\u003e\u003eDB: BEGIN TRANSACTION\n    \n    alt Data Isolation Enabled\n        alt Server Context Available\n            Manager-\u003e\u003eDB: set_config('app.server_id', $rlsServerId, true)\n            Note over DB: Parameterized - SQL injection safe\n        end\n        \n        alt Entity Context Available\n            Manager-\u003e\u003eDB: Validate UUID format\n            Manager-\u003e\u003eDB: set_config('app.entity_id', $entityId, true)\n            Note over DB: Parameterized - SQL injection safe\n        end\n    end\n    \n    Manager-\u003e\u003eApp: Execute callback(tx)\n    App-\u003e\u003eDB: Execute queries\n    DB-\u003e\u003eRLS: Check current_server_id()\n    RLS-\u003e\u003eDB: current_setting('app.server_id', TRUE)::UUID\n    DB-\u003e\u003eRLS: Check current_entity_id()\n    RLS-\u003e\u003eDB: current_setting('app.entity_id', TRUE)::UUID\n    RLS-\u003e\u003eDB: Filter rows by server_id/entity_id\n    DB-\u003e\u003eApp: Return isolated data\n    \n    Manager-\u003e\u003eDB: COMMIT\n    DB-\u003e\u003eManager: Success\n    Manager-\u003e\u003eAdapter: Return result\n    Adapter-\u003e\u003eApp: Return result\n```\n\n\u003csub\u003eLast reviewed commit: dbe4ae7\u003c/sub\u003e\n\n\u003c!-- greptile_other_comments_section --\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"18:T10104,"])</script><script>self.__next_f.push([1,"Bumps the npm_and_yarn group with 1 update in the /packages/computeruse/crates/computeruse-mcp-agent directory: [@modelcontextprotocol/sdk](https://github.com/modelcontextprotocol/typescript-sdk).\nBumps the npm_and_yarn group with 1 update in the /packages/computeruse/crates/computeruse-mcp-agent/tests/integration directory: [@modelcontextprotocol/sdk](https://github.com/modelcontextprotocol/typescript-sdk).\nBumps the npm_and_yarn group with 2 updates in the /packages/computeruse/examples/mcp-client-elicitation directory: [@modelcontextprotocol/sdk](https://github.com/modelcontextprotocol/typescript-sdk) and [ajv](https://github.com/ajv-validator/ajv).\n\nUpdates `@modelcontextprotocol/sdk` from 1.17.3 to 1.26.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u "\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `hono` from 4.11.1 to 4.12.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/honojs/hono/releases\"\u003ehono's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.12.0\u003c/h2\u003e\n\u003ch1\u003eRelease Notes\u003c/h1\u003e\n\u003cp\u003eHono v4.12.0 is now available!\u003c/p\u003e\n\u003cp\u003eThis release includes new features for the Hono client, middleware improvements, adapter enhancements, and significant performance improvements to the router and context.\u003c/p\u003e\n\u003ch2\u003e\u003ccode\u003e$path\u003c/code\u003e for Hono Client\u003c/h2\u003e\n\u003cp\u003eThe Hono client now has a \u003ccode\u003e$path()\u003c/code\u003e method that returns the path string instead of a full URL. This is useful when you need just the path portion for routing or key-based operations:\u003c/p\u003e\n\u003cpre lang=\"ts\"\u003e\u003ccode\u003econst client = hc\u0026lt;typeof app\u0026gt;('http://localhost:8787')\n\u003cp\u003e// Get the path string\nconst path = client.api.posts.$path()\n// =\u0026gt; '/api/posts'\u003c/p\u003e\n\u003cp\u003e// With path parameters\nconst postPath = client.api.posts[':id'].$path({\nparam: { id: '123' },\n})\n// =\u0026gt; '/api/posts/123'\u003c/p\u003e\n\u003cp\u003e// With query parameters\nconst searchPath = client.api.posts.$path({\nquery: { filter: 'test' },\n})\n// =\u0026gt; '/api/posts?filter=test'\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003cp\u003eUnlike \u003ccode\u003e$url()\u003c/code\u003e which returns a \u003ccode\u003eURL\u003c/code\u003e object, \u003ccode\u003e$path()\u003c/code\u003e returns a plain path string, making it convenient for use with routers or as cache keys.\u003c/p\u003e\n\u003cp\u003eThanks \u003ca href=\"https://github.com/ShaMan123\"\u003e\u003ccode\u003e@​ShaMan123\u003c/code\u003e\u003c/a\u003e!\u003c/p\u003e\n\u003ch2\u003e\u003ccode\u003eApplyGlobalResponse\u003c/code\u003e Type Helper for RPC Client\u003c/h2\u003e\n\u003cp\u003eThe new \u003ccode\u003eApplyGlobalResponse\u003c/code\u003e type helper allows you to add global error response types to all routes in the RPC client. This is useful for typing common error responses from \u003ccode\u003eapp.onError()\u003c/code\u003e or global middlewares:\u003c/p\u003e\n\u003cpre lang=\"ts\"\u003e\u003ccode\u003econst app = new Hono()\n  .get('/api/users', (c) =\u0026gt; c.json({ users: ['alice', 'bob'] }, 200))\n  .onError((err, c) =\u0026gt; c.json({ error: err.message }, 500))\n\u003cp\u003etype AppWithErrors = ApplyGlobalResponse\u0026lt;\ntypeof app,\n{\n401: { json: { error: string; message: string } }\n500: { json: { error: string; message: string } }\n}\n\u0026lt;/tr\u0026gt;\u0026lt;/table\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/d2ed2e9c966d82e2369bd74bdae4acd4e8f57807\"\u003e\u003ccode\u003ed2ed2e9\u003c/code\u003e\u003c/a\u003e 4.12.0\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/01e78adc637de2bc4ae532cf4a80bf7863652f8e\"\u003e\u003ccode\u003e01e78ad\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/honojs/hono/issues/4735\"\u003e#4735\u003c/a\u003e from honojs/next\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/a340a25fc6065f41328a20068c495f8a32410401\"\u003e\u003ccode\u003ea340a25\u003c/code\u003e\u003c/a\u003e perf(context): use \u003ccode\u003ecreateResponseInstance\u003c/code\u003e for new Response (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4733\"\u003e#4733\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/bd26c3129f8e159864d3f96522f44e900516e847\"\u003e\u003ccode\u003ebd26c31\u003c/code\u003e\u003c/a\u003e perf(trie-router): improve performance (1.5x ~ 2.0x) (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4724\"\u003e#4724\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/b85c1e032864322c581f4d04652d37ef59130eee\"\u003e\u003ccode\u003eb85c1e0\u003c/code\u003e\u003c/a\u003e feat(types): Add exports field to ExecutionContext (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4719\"\u003e#4719\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/02346c6d945a10c98f54ae51622e8c7afbe3bad4\"\u003e\u003ccode\u003e02346c6\u003c/code\u003e\u003c/a\u003e feat(language): add progressive locale code truncation to normalizeLanguage (...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/7438ab93553ce61773e2a74376972777602f08ff\"\u003e\u003ccode\u003e7438ab9\u003c/code\u003e\u003c/a\u003e perf(context): add fast path to c.json() matching c.text() optimization (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4707\"\u003e#4707\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/034223f1bf8db3c98e4bf2d11d597c94362729d7\"\u003e\u003ccode\u003e034223f\u003c/code\u003e\u003c/a\u003e feat(trailing-slash): add \u003ccode\u003ealwaysRedirect\u003c/code\u003e option to support wildcard routes ...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/16321afd47e1bf8f48d06d9d8a2eae6b607c73ef\"\u003e\u003ccode\u003e16321af\u003c/code\u003e\u003c/a\u003e feat(adapter): add getConnInfo for AWS Lambda, Cloudflare Pages, and Netlify ...\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/bf37828d6df56618bb90649c65c1c4deb2f9bcd6\"\u003e\u003ccode\u003ebf37828\u003c/code\u003e\u003c/a\u003e feat(basic-auth): add context key and callback options (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4645\"\u003e#4645\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/honojs/hono/compare/v4.11.1...v4.12.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\n\nDependabot will resolve any conflicts with this PR as long as you don't alter it yourself. You can also trigger a rebase manually by commenting `@dependabot rebase`.\n\n[//]: # (dependabot-automerge-start)\n[//]: # (dependabot-automerge-end)\n\n---\n\n\u003cdetails\u003e\n\u003csummary\u003eDependabot commands and options\u003c/summary\u003e\n\u003cbr /\u003e\n\nYou can trigger Dependabot actions by commenting on this PR:\n- `@dependabot rebase` will rebase this PR\n- `@dependabot recreate` will recreate this PR, overwriting any edits that have been made to it\n- `@dependabot show \u003cdependency name\u003e ignore conditions` will show all of the ignore conditions of the specified dependency\n- `@dependabot ignore \u003cdependency name\u003e major version` will close this group update PR and stop Dependabot creating any more for the specific dependency's major version (unless you unignore this specific dependency's major version or upgrade to it yourself)\n- `@dependabot ignore \u003cdependency name\u003e minor version` will close this group update PR and stop Dependabot creating any more for the specific dependency's minor version (unless you unignore this specific dependency's minor version or upgrade to it yourself)\n- `@dependabot ignore \u003cdependency name\u003e` will close this group update PR and stop Dependabot creating any more for the specific dependency (unless you unignore this specific dependency or upgrade to it yourself)\n- `@dependabot unignore \u003cdependency name\u003e` will remove all of the ignore conditions of the specified dependency\n- `@dependabot unignore \u003cdependency name\u003e \u003cignore condition\u003e` will remove the ignore condition of the specified dependency and ignore conditions\nYou can disable automated security fix PRs for this repo from the [Security Alerts page](https://github.com/elizaOS/eliza/network/alerts).\n\n\u003c/details\u003e\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR updates npm dependencies across 3 directories in the computeruse package, primarily updating `@modelcontextprotocol/sdk` from various versions (1.17.3, 1.25.0) to 1.26.0. The update includes critical security fixes and addresses multiple vulnerabilities.\n\n**Key Security Improvements:**\n- **`@modelcontextprotocol/sdk` 1.26.0**: Fixes GHSA-345p-7cg4-v4c7 (cross-client response data leak vulnerability), prevents ReDoS attacks in UriTemplate regex patterns, and resolves npm audit vulnerabilities\n- **`ajv` 6.12.6→8.18.0**: Major version upgrade with CVE-2025-69873 fix (ReDoS mitigation in pattern validation with $data keyword)\n- **`qs` 6.14.0→6.15.0**: Minor update with bug fixes for arrayLimit handling and strictMerge option\n- **`hono` 4.11.1→4.12.0**: Minor update with performance improvements (transitive dependency)\n\n**Breaking Change Analysis:**\nThe `ajv` major version bump (v6→v8) is a transitive dependency change brought in by `@modelcontextprotocol/sdk`. Since the codebase does not directly import or use `ajv` (verified via code search), this breaking change is internally handled by the SDK and poses no risk to the application code.\n\n**Compatibility:**\nThe MCP SDK v1.26.0 maintains backward compatibility with v1.x APIs. The update includes type fixes and additional features (client credentials scopes support, schema validation improvements) without breaking existing usage patterns.\n\n\u003ch3\u003eConfidence Score: 5/5\u003c/h3\u003e\n\n- This PR is safe to merge with no risk - it's an automated dependency update that addresses critical security vulnerabilities\n- Score of 5 reflects: (1) automated Dependabot PR with well-documented changes, (2) critical security fixes including GHSA advisory and CVE patches, (3) no direct code changes - only dependency version bumps in lock files, (4) ajv major version bump is safely encapsulated within @modelcontextprotocol/sdk with no direct usage in application code, (5) all updates maintain backward compatibility for the SDK's public API\n- No files require special attention - all changes are standard dependency updates in package.json and package-lock.json files\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n\n\n\n| Filename | Overview |\n|----------|----------|\n| packages/computeruse/crates/computeruse-mcp-agent/package-lock.json | Updated MCP SDK and transitive dependencies including `ajv` 6.12.6→8.18.0, `qs` 6.14.0→6.15.0 with security patches |\n| packages/computeruse/crates/computeruse-mcp-agent/tests/integration/package-lock.json | Updated MCP SDK and transitive dependencies, notably `ajv` major version bump 6.12.6→8.18.0 with CVE fix |\n| packages/computeruse/examples/mcp-client-elicitation/package-lock.json | Updated MCP SDK and transitive dependencies including `ajv` 8.17.1→8.18.0, `hono` 4.11.1→4.12.0 with security patches |\n\n\u003c/details\u003e\n\n\n\n\u003csub\u003eLast reviewed commit: b820dcc\u003c/sub\u003e\n\n\u003c!-- greptile_other_comments_section --\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"19:T10102,"])</script><script>self.__next_f.push([1,"Bumps the npm_and_yarn group with 1 update in the /packages/computeruse/crates/computeruse-mcp-agent directory: [@modelcontextprotocol/sdk](https://github.com/modelcontextprotocol/typescript-sdk).\nBumps the npm_and_yarn group with 1 update in the /packages/computeruse/crates/computeruse-mcp-agent/tests/integration directory: [@modelcontextprotocol/sdk](https://github.com/modelcontextprotocol/typescript-sdk).\nBumps the npm_and_yarn group with 2 updates in the /packages/computeruse/examples/mcp-client-elicitation directory: [@modelcontextprotocol/sdk](https://github.com/modelcontextprotocol/typescript-sdk) and [ajv](https://github.com/ajv-validator/ajv).\n\nUpdates `@modelcontextprotocol/sdk` from 1.17.3 to 1.26.0\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/modelcontextprotocol/typescript-sdk/releases\"\u003e\u003ccode\u003e@​modelcontextprotocol/sdk\u003c/code\u003e's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev1.26.0\u003c/h2\u003e\n\u003cp\u003eAddresses \u0026quot;Sharing server/transport instances can leak cross-client response data\u0026quot; in this GHSA \u003ca href=\"https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-345p-7cg4-v4c7\"\u003ehttps://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-345p-7cg4-v4c7\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003echore: bump v1.25.3 for backport fixes by \u003ca href=\"https://github.com/pcarleton\"\u003e\u003ccode\u003e@​pcarleton\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/modelcontextprotocol/typescript-sdk/pull/1412\"\u003emodelcontextprotocol/typescript-sdk#1412\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003efix(deps): resolve npm audit vulnerabilities and bump dependencies (v1.x backport) by \u003ca href=\"https://github.com/samuv\"\u003e\u003ccode\u003e@​samuv\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/modelcontextprotocol/typescript-sdk/pull/1382\"\u003emodelcontextprotocol/typescript-sdk#1382\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFix \u003ca href=\"https://redirect.github.com/modelcontextprotocol/typescript-sdk/issues/1430\"\u003e#1430\u003c/a\u00 \"\u003e\u003ccode\u003e8e8df5a\u003c/code\u003e\u003c/a\u003e [Fix] fix regressions from robustness refactor\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ljharb/qs/commit/d60bab35a42b3c789d7a1461ea176eaee74eb751\"\u003e\u003ccode\u003ed60bab3\u003c/code\u003e\u003c/a\u003e v6.10.7\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/ljharb/qs/compare/v6.14.0...v6.15.0\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `hono` from 4.11.1 to 4.12.1\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/honojs/hono/releases\"\u003ehono's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003ev4.12.1\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003efix(client): export \u003ccode\u003eApplyGlobalResponse\u003c/code\u003e from \u003ccode\u003ehono/client\u003c/code\u003e by \u003ca href=\"https://github.com/sushichan044\"\u003e\u003ccode\u003e@​sushichan044\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/honojs/hono/pull/4743\"\u003ehonojs/hono#4743\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/honojs/hono/compare/v4.12.0...v4.12.1\"\u003ehttps://github.com/honojs/hono/compare/v4.12.0...v4.12.1\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003ev4.12.0\u003c/h2\u003e\n\u003ch1\u003eRelease Notes\u003c/h1\u003e\n\u003cp\u003eHono v4.12.0 is now available!\u003c/p\u003e\n\u003cp\u003eThis release includes new features for the Hono client, middleware improvements, adapter enhancements, and significant performance improvements to the router and context.\u003c/p\u003e\n\u003ch2\u003e\u003ccode\u003e$path\u003c/code\u003e for Hono Client\u003c/h2\u003e\n\u003cp\u003eThe Hono client now has a \u003ccode\u003e$path()\u003c/code\u003e method that returns the path string instead of a full URL. This is useful when you need just the path portion for routing or key-based operations:\u003c/p\u003e\n\u003cpre lang=\"ts\"\u003e\u003ccode\u003econst client = hc\u0026lt;typeof app\u0026gt;('http://localhost:8787')\r\n\u003cp\u003e// Get the path string\nconst path = client.api.posts.$path()\n// =\u0026gt; '/api/posts'\u003c/p\u003e\n\u003cp\u003e// With path parameters\nconst postPath = client.api.posts[':id'].$path({\nparam: { id: '123' },\n})\n// =\u0026gt; '/api/posts/123'\u003c/p\u003e\n\u003cp\u003e// With query parameters\nconst searchPath = client.api.posts.$path({\nquery: { filter: 'test' },\n})\n// =\u0026gt; '/api/posts?filter=test'\n\u003c/code\u003e\u003c/pre\u003e\u003c/p\u003e\n\u003cp\u003eUnlike \u003ccode\u003e$url()\u003c/code\u003e which returns a \u003ccode\u003eURL\u003c/code\u003e object, \u003ccode\u003e$path()\u003c/code\u003e returns a plain path string, making it convenient for use with routers or as cache keys.\u003c/p\u003e\n\u003cp\u003eThanks \u003ca href=\"https://github.com/ShaMan123\"\u003e\u003ccode\u003e@​ShaMan123\u003c/code\u003e\u003c/a\u003e!\u003c/p\u003e\n\u003ch2\u003e\u003ccode\u003eApplyGlobalResponse\u003c/code\u003e Type Helper for RPC Client\u003c/h2\u003e\n\u003cp\u003eThe new \u003ccode\u003eApplyGlobalResponse\u003c/code\u003e type helper allows you to add global error response types to all routes in the RPC client. This is useful for typing common error responses from \u003ccode\u003eapp.onError()\u003c/code\u003e or global middlewares:\u003c/p\u003e\n\u003cpre lang=\"ts\"\u003e\u003ccode\u003econst app = new Hono()\r\n  .get('/api/users', (c) =\u0026gt; c.json({ users: ['alice', 'bob'] }, 200))\r\n  .onError((err, c) =\u0026gt; c.json({ error: err.message }, 500))\r\n\u0026lt;/tr\u0026gt;\u0026lt;/table\u0026gt; \n\u003c/code\u003e\u003c/pre\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/2de30d7c2a25885c5df03c454582c305a34da771\"\u003e\u003ccode\u003e2de30d7\u003c/code\u003e\u003c/a\u003e 4.12.1\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/91ef235f9fd34266dbb473a4c43d999465be3c87\"\u003e\u003ccode\u003e91ef235\u003c/code\u003e\u003c/a\u003e fix(client): export \u003ccode\u003eApplyGlobalResponse\u003c/code\u003e from \u003ccode\u003ehono/client\u003c/code\u003e (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4743\"\u003e#4743\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/d2ed2e9c966d82e2369bd74bdae4acd4e8f57807\"\u003e\u003ccode\u003ed2ed2e9\u003c/code\u003e\u003c/a\u003e 4.12.0\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/01e78adc637de2bc4ae532cf4a80bf7863652f8e\"\u003e\u003ccode\u003e01e78ad\u003c/code\u003e\u003c/a\u003e Merge pull request \u003ca href=\"https://redirect.github.com/honojs/hono/issues/4735\"\u003e#4735\u003c/a\u003e from honojs/next\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/a340a25fc6065f41328a20068c495f8a32410401\"\u003e\u003ccode\u003ea340a25\u003c/code\u003e\u003c/a\u003e perf(context): use \u003ccode\u003ecreateResponseInstance\u003c/code\u003e for new Response (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4733\"\u003e#4733\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/honojs/hono/commit/bd26c3129f8e159864d3f96522f44e900516e847\"\u003e\u003ccode\u003ebd26c31\u003c/code\u003e\u003c/a\u003e perf(trie-router): improve performance (1.5x ~ 2.0x) (\u003ca href=\"https://redirect.github.com/honojs/hono/issues/4724\"\u003e#4724\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github curity review\n3. Include clear disclaimers about third-party tools and their risks\n\n\u003ch3\u003eConfidence Score: 0/5\u003c/h3\u003e\n\n- This PR is NOT safe to merge - it promotes installing unverified third-party software that handles cryptocurrency payments\n- Score of 0 reflects critical security issues: promotes non-existent package, instructs users to execute unverified external code via npx, facilitates real cryptocurrency payments to unknown addresses without verification, and functions as undisclosed promotional content for a commercial service. This documentation could directly lead to financial loss or security compromise for users.\n- docs/community/Base-Network-Wallet-Safety-with-x402.md requires immediate attention - this entire file should be removed or completely rewritten\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n\n\n\n| Filename | Overview |\n|----------|----------|\n| docs/community/Base-Network-Wallet-Safety-with-x402.md | New doc recommends installing unverified third-party package that executes code and handles crypto payments - multiple critical security issues |\n\n\u003c/details\u003e\n\n\n\n\u003csub\u003eLast reviewed commit: 69de118\u003c/sub\u003e\n\n\u003c!-- greptile_other_comments_section --\u003e\n\n\u003csub\u003e(2/5) Greptile learns from your feedback when you react with thumbs up/down!\u003c/sub\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-6 py-8 md:px-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-4xl\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-4 flex flex-col justify-between sm:flex-row\",\"children\":[[\"$\",\"$L12\",null,{\"currentInterval\":\"week\",\"currentDate\":\"2026-02-22\"}],[\"$\",\"$L13\",null,{\"metrics\":{\"date\":\"2026-02-22\",\"interval\":{\"intervalStart\":\"$D2026-02-22T00:00:00.000Z\",\"intervalEnd\":\"$D2026-03-01T00:00:00.000Z\",\"intervalType\":\"wee
