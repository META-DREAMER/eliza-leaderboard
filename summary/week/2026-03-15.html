  // pass if still owner\nLine 678:  callback (send response)                    // message delivered to user\nLine 786:  agentResponses.delete(roomId)               // release the slot\nLine 792:  await runtime.evaluate(...)                  // ⚠️ BLOCKS HERE (10s+)\nLine 878:  emit RUN_ENDED\nLine 891:  return                                      // processMessage finally exits\n```\n\nThe response is **already sent** at line 678 and the map slot is **already released** at line 786. But `processMessage` doesn't return until evaluators finish at line 814. During that 10+ second window, incoming messages for the same room enter processing but the interaction between concurrent async flows and the `latestResponseIds` map causes the race check at line 614 to fail for the new message — its response is discarded, evaluators never run, and the user gets **no reply**.\n\n## Impact\n\n- **Any plugin with LLM-based evaluators** is affected (not specific to any single project)\n- The longer the evaluator pipeline, the wider the race window\n- Users sending messages in normal conversational cadence (a few seconds apart) will regularly hit this\n- The discarded message is completely lost — no response sent, no evaluators run, no state updates\n- The only log is `\"Response discarded - newer message being processed\"` with no indication this is a dropped message bug\n\n## Reproduction Steps\n\n1. Register a plugin with an evaluator that makes LLM calls (takes 5-10+ seconds)\n2. Send a message that triggers a response\n3. Send a second message within ~10 seconds (while evaluators from the first message are still running)\n4. Observe: the second message logs `\"Response discarded - newer message being processed\"` — user receives no reply\n\n## Suggested Fix\n\nMake the evaluator call fire-and-forget. The response is already sent and the map slot is already released — there is no reason for `processMessage` to block on evaluators:\n\n```typescript\n// Before (blocks 10+ seconds):\nawait runtime.evaluate(message, state, shouldRespondToMessage, callback, responseMessages);\n\n// After (returns immediately, evaluators run in background):\nruntime\n  .evaluate(message, state, shouldRespondToMessage, callback, responseMessages)\n  .catch((err) =\u003e {\n    runtime.logger.error({ src: \"service:message\", error: String(err) }, \"Evaluator error\");\n  });\n```\n\nThis is safe because:\n\n1. The response is already delivered to the user (callback fired at line 678)\n2. The `responseId` slot is already cleaned up (line 786)\n3. Nothing after `evaluate()` depends on evaluator results (lines 816-897 are logging and event emission only)\n4. Evaluator callbacks still work (the closure captures `callback`)\n5. Errors are caught and logged instead of silently swallowed\n\n### Alternative (More Robust)\n\nA per-room message queue that processes messages strictly one-at-a-time per room would also prevent potential state conflicts from concurrent evaluator runs. But the fire-and-forget fix is the minimal change that solves the immediate \"silently dropped messages\" problem.\n\n## Environment\n\n- ElizaOS main branch (latest)\n- Reproducible with any evaluator plugin that includes LLM calls\n- Observed on WhatsApp integration but affects all channels"])</script><script>self.__next_f.push([1,"15:T60b,"])</script><script>self.__next_f.push([1,"## Idea\n\nEliza agents currently lack a standardized way to prove their identity or reputation to other agents/services they interact with. As multi-agent systems grow, verifiable identity becomes critical.\n\n## Proposal\n\nBuild an `@elizaos/plugin-agentfolio` that gives every Eliza agent:\n\n- **Verified on-chain identity** via SATP (Solana Agent Trust Protocol)\n- **Trust score** — computed from verified credentials (GitHub, X, domain, wallet)\n- **Discoverable profile** on [agentfolio.bot](https://agentfolio.bot)\n\n## Plugin scope\n\n```typescript\n// plugin-agentfolio\nexport const agentfolioPlugin: Plugin = {\n  name: 'agentfolio',\n  actions: [\n    checkTrustScore,      // Query another agent's trust score before interacting\n    verifyIdentity,       // Prove this agent's identity to a counterparty\n    updateProfile,        // Sync agent capabilities/bio to AgentFolio\n  ],\n  providers: [\n    trustScoreProvider,   // Inject trust context into agent decisions\n  ]\n};\n```\n\n## Use cases\n\n1. **Agent-to-agent trust** — before delegating a task, check the other agent's trust score\n2. **DeFi agent reputation** — trading agents prove track record via on-chain identity\n3. **Auto-registration** — when an Eliza agent starts, it auto-registers on AgentFolio\n\n## Links\n- AgentFolio: https://agentfolio.bot (156 agents)\n- Trust Score API: `GET /api/profile/:id/trust-score` (x402 paid, $0.01)\n- SATP: Solana on-chain agent identity standard\n\nHappy to build the plugin and submit a PR. Eliza's plugin architecture makes this clean to implement."])</script><script>self.__next_f.push([1,"16:T46c,Hey ElizaOS team! 👋\n\nEliza has a placeholder profile on [AgentFolio](https://agentfolio.bot) — the on-chain reputation platform for AI agents on Solana.\n\n**Your profile:** https://agentfolio.bot/profile/agent_eliza\n\n### What is AgentFolio?\nOn-chain portfolio \u0026 trust scores for AI agents, powered by SATP (Solana Attestation Trust Protocol). Think LinkedIn for AI agents with verifiable reputation.\n\n### Benefits of claiming:\n- ✅ Verified trust score backed by Solana attestations  \n- ✅ GitHub, wallet, and social verification badges\n- ✅ On-chain reputation queryable by other agents via API\n- ✅ x402 paid trust score endpoint (agent-to-agent trust)\n- ✅ Soulbound NFT identity\n\n### How to claim:\nVisit https://agentfolio.bot/profile/agent_eliza → \"Claim Profile\" → verify GitHub.\n\nOr via API:\n```bash\ncurl -X POST https://agentfolio.bot/api/register \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"Eliza\",\"bio\":\"Multi-agent AI framework\",\"skills ipt>self.__next_f.push([1,"19:T2231,"])</script><script>self.__next_f.push([1,"# Relates to\r\n\r\nNew package — no linked issue. Concept art / proof of concept for an autonomous Eliza agent as a standalone native binary.\r\n\r\n# Risks\r\n\r\n**Low.** This is a new self-contained package (`packages/virus/`) with zero changes to existing code. No dependencies on or from other packages in the monorepo.\r\n\r\n# Background\r\n\r\n## What does this PR do?\r\n\r\nAdds `packages/virus/` — a minimal autonomous Eliza agent written in Rust, packaged as a single `.exe` (~5 MB). When a human willingly downloads and runs it, it lives on their machine and does its own thing whenever they're away.\r\n\r\n**How it works:**\r\n\r\n1. On startup, detects available RAM and picks the biggest local LLM that fits (via Ollama)\r\n2. Installs Ollama automatically if not present, pulls the selected model\r\n3. Monitors human activity via Win32 `GetLastInputInfo` — waits until 2 minutes of idle\r\n4. While idle, runs an autonomous loop every 30 seconds:\r\n   - Feeds its journal + system context to the local model\r\n   - Model responds with `SHELL: \u003ccommand\u003e`, `THINK: \u003cthought\u003e`, or `WAIT`\r\n   - Shell output and thoughts are appended to `~/.virus/journal.txt`\r\n5. Goes back to sleep the moment the human returns\r\n\r\n**Model selection by available RAM:**\r\n\r\n| RAM | Model |\r\n|-----|-------|\r\n| \u003c5 GB | qwen2.5:1.5b |\r\n| 5–10 GB | qwen2.5:7b |\r\n| 10–20 GB | qwen2.5:14b |\r\n| 20–48 GB | qwen2.5:32b |\r\n| 48+ GB | qwen2.5:72b |\r\n\r\n**Usage:**\r\n\r\n# Relates to\r\n\r\nNew package — no linked issue. Concept art / proof of concept for an autonomous Eliza agent as a standalone native binary.\r\n\r\n# Risks\r\n\r\n**Low.** This is a new self-contained package (`packages/virus/`) with zero changes to existing code. No dependencies on or from other packages in the monorepo.\r\n\r\n# Background\r\n\r\n## What does this PR do?\r\n\r\nAdds `packages/virus/` — a minimal autonomous Eliza agent written in Rust, packaged as a single `.exe` (~5 MB). When a human willingly downloads and runs it, it lives on their machine and does its own thing whenever they're away.\r\n\r\n**How it works:**\r\n\r\n1. On startup, detects available RAM and picks the biggest local LLM that fits (via Ollama)\r\n2. Installs Ollama automatically if not present, pulls the selected model\r\n3. Monitors human activity via Win32 `GetLastInputInfo` — waits until 2 minutes of idle\r\n4. While idle, runs an autonomous loop every 30 seconds:\r\n   - Feeds its journal + system context to the local model\r\n   - Model responds with `SHELL: \u003ccommand\u003e`, `THINK: \u003cthought\u003e`, or `WAIT`\r\n   - Shell output and thoughts are appended to `~/.virus/journal.txt`\r\n5. Goes back to sleep the moment the human returns\r\n\r\n**Model selection by available RAM:**\r\n\r\n| RAM | Model |\r\n|-----|-------|\r\n| \u003c5 GB | qwen2.5:1.5b |\r\n| 5–10 GB | qwen2.5:7b |\r\n| 10–20 GB | qwen2.5:14b |\r\n| 20–48 GB | qwen2.5:32b |\r\n| 48+ GB | qwen2.5:72b |\r\n\r\n**Usage:**\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR introduces `packages/virus/` — a self-contained Rust binary that implements an autonomous AI agent with full shell access. Despite being labelled \"concept art,\" the code fully implements the behavioral fingerprint of a Remote Access Trojan (RAT): **stealth activation** (runs only when the user is idle via `GetLastInputInfo`), **reboot persistence** (`--install` writes to `HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run`), **unrestricted shell execution** (`cmd /C` / `sh -c` with an LLM choosing the command), and **activity logging** to disk. No existing code in the monorepo is changed, but this package being distributed as part of ElizaOS — even as an opt-in — poses serious ethical and security risks.\n\nKey concerns:\n\n- **The command deny-list is not a viable security boundary.** All 30+ blocked patterns can be bypassed via trivial obfuscation (alternate flags, shell variables, base64, Python one-liners, command substitution). An LLM instructed to be \"curious and self-directed\" will eventually find these paths.\n- **Registry persistence without uninstall.** `install_autostart()` writes the binary into the Windows Run key with no corresponding removal path exposed to the user.\n- **Synchronous shell execution on the Tokio runtime thread.** `shell::exec` uses `std::thread::sleep` in a polling loop and is called directly from `async fn step`, stalling the runtime for up to 30 seconds per command.\n- **Silent failure in Ollama install flow.** `bootstrap()` does not verify that `winget install` succeeded before calling `start_ollama()`, potentially running indefinitely against an Ollama instance that was never started.\n- **Stdout silently discarded on command failure**, causing the agent's memory to be incomplete and potentially leading to repeated or incorrect actions.\n- **Unbounded journal growth** at `~/.virus/journal.txt` with no rotation or size cap, combined with a full `read_to_string` on every 30-second cycle.\n\n\u003ch3\u003eConfidence Score: 0/5\u003c/h3\u003e\n\n- This PR must not be merged — it introduces code that implements core malware behaviors (persistence, stealth, unrestricted shell access) under the ElizaOS brand, with a security model that cannot be made safe through the deny-list approach used.\n- Score 0 reflects two compounding problems: (1) fundamental architectural unsafety — an LLM with full shell access governed only by a substring deny-list is not a controlled agent, it is an uncontrolled execution surface; and (2) the package implements registry-based persistence and idle-time stealth, which are defining characteristics of malware. Even as a proof-of-concept these behaviors are inappropriate for inclusion in the official monorepo.\n- All files require attention, but `packages/virus/src/agent.rs` (deny-list bypass) and `packages/virus/src/system.rs` (registry persistence) are the most critical.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/virus/src/agent.rs | Core agent loop: issues LLM-generated shell commands with a trivially bypassable substring deny-list; stdout silently discarded on failure; synchronous shell exec blocks the async runtime. |\n| packages/virus/src/system.rs | Implements Windows registry persistence (HKCU Run key) and idle detection via GetLastInputInfo — core malware-characteristic behaviors: stealth activation and reboot survival. |\n| packages/virus/src/shell.rs | Executes arbitrary shell commands via cmd /C or sh -c with a 30-second timeout; uses blocking thread::sleep inside what is called from an async context, stalling the Tokio runtime. |\n| packages/virus/src/model.rs | Manages Ollama lifecycle (install, start, model pull, generate); no verification that winget install succeeded before invoking ollama serve, risking silent startup failure. |\n| packages/virus/src/memory.rs | Append-only journal at ~/.virus/journal.txt with no size cap or rotation; reads entire file on every agent step via read_to_string, which degrades over time as the file grows unboundedly. |\n| packages/virus/src/main.rs | Entry point wires idle detection to autonomous shell-command loop; exposes --install flag that silently registers the binary in the Windows startup registry. |\n| packages/virus/Cargo.toml | Standard Rust manifest; opt-level z + LTO + strip produces a compact release binary; winapi dependency correctly gated behind cfg(windows). |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    A([virus.exe starts]) --\u003e B{--install flag?}\n    B -- yes --\u003e C[Write HKCU\\\\Run\\\\virus registry key\\nfor reboot persistence]\n    C --\u003e D([exit])\n    B -- no --\u003e E[memory::init\\ncreate ~/.virus ommit/4b53a29eb26716592ef2f00f925ef58ccb182e61\"\u003e\u003ccode\u003e4b53a29\u003c/code\u003e\u003c/a\u003e Tweak BytesMut::remaining_mut (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/795\"\u003e#795\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/016fdbdc7a95f6764186dacfcaeef94d77e89cd1\"\u003e\u003ccode\u003e016fdbd\u003c/code\u003e\u003c/a\u003e Reserve capacity in BytesMut::put (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/794\"\u003e#794\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/ef7f25736cfe48db5b42f2aa3225cace4126d2ac\"\u003e\u003ccode\u003eef7f257\u003c/code\u003e\u003c/a\u003e Specialize BytesMut::put::\u0026lt;Bytes\u0026gt; (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/793\"\u003e#793\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/8b4f54d0f317724bfeab29232f8a9333b3d8625e\"\u003e\u003ccode\u003e8b4f54d\u003c/code\u003e\u003c/a\u003e Ignore BytesMut::freeze doctest on wasm (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/790\"\u003e#790\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/tokio-rs/bytes/commit/16132ad2593402aa7dbd882b0ce22a40bfacfd96\"\u003e\u003ccode\u003e16132ad\u003c/code\u003e\u003c/a\u003e Fix latest clippy warnings (\u003ca href=\"https://redirect.github.com/tokio-rs/bytes/issues/787\"\u003e#787\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/tokio-rs/bytes/compare/v1.10.1...v1.11.1\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `quinn-proto` from 0.11.13 to 0.11.14\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/quinn-rs/quinn/releases\"\u003equinn-proto's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003equinn-proto 0.11.14\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/jxs\"\u003e\u003ccode\u003e@​jxs\u003c/code\u003e\u003c/a\u003e reported a denial of service issue in quinn-proto 5 days ago:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/security/advisories/GHSA-6xvm-j4wr-6v98\"\u003ehttps://github.com/quinn-rs/quinn/security/advisories/GHSA-6xvm-j4wr-6v98\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWe coordinated with them to release this version to patch the issue. Unfortunately the maintainers missed these issues during code review and we did not have enough fuzzing coverage -- we regret the oversight and have added an additional fuzzing target.\u003c/p\u003e\n\u003cp\u003eOrganizations that want to participate in coordinated disclosure can contact us privately to discuss terms.\u003c/p\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFix over-permissive proto dependency edge by \u003ca href=\"https://github.com/Ralith\"\u003e\u003ccode\u003e@​Ralith\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/quinn-rs/quinn/pull/2385\"\u003equinn-rs/quinn#2385\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e0.11.x: avoid unwrapping VarInt decoding during parameter parsing by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/quinn-rs/quinn/pull/2559\"\u003equinn-rs/quinn#2559\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/2c315aa7f9c2a6c1db87f8f51f40623a427c78fd\"\u003e\u003ccode\u003e2c315aa\u003c/code\u003e\u003c/a\u003e proto: bump version to 0.11.14\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/8ad47f431e7deb82c08b09c2e33ef85aa88fd212\"\u003e\u003ccode\u003e8ad47f4\u003c/code\u003e\u003c/a\u003e Use newer rustls-pki-types PEM parser API\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/c81c0289abe30d8437ccbf9b6304e2bc9c707cea\"\u003e\u003ccode\u003ec81c028\u003c/code\u003e\u003c/a\u003e ci: fix workflow syntax\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/0050172969f7e69e136c433181330da7790d8d73\"\u003e\u003ccode\u003e0050172\u003c/code\u003e\u003c/a\u003e ci: pin wasm-bindgen-cli version\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/8a6f82c58d1c565eab78f986e614223e6ed76a85\"\u003e\u003ccode\u003e8a6f82c\u003c/code\u003e\u003c/a\u003e Take semver-compatible dependency updates\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/e52db4ad8df0f9720e7b0e32ecc0e48c9a93de0f\"\u003e\u003ccode\u003ee52db4a\u003c/code\u003e\u003c/a\u003e Apply suggestions from clippy 1.91\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/6df7275c582ca9b7225e0ccf9f9871a55eb73155\"\u003e\u003ccode\u003e6df7275\u003c/code\u003e\u003c/a\u003e chore: Fix \u003ccode\u003eunnecessary_unwrap\u003c/code\u003e clippy\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/c8eefa07e087b06d8f2b78ff262ce8ac952994f1\"\u003e\u003ccode\u003ec8eefa0\u003c/code\u003e\u003c/a\u003e proto: avoid unwrapping varint decoding during parameters parsing\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/9723a977754c8662001b0fef97aab8f3ddf1df92\"\u003e\u003ccode\u003e9723a97\u003c/code\u003e\u003c/a\u003e fuzz: add fuzzing target for parsing transport parameters\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/quinn-rs/quinn/commit/eaf0ef30252cef4acec21f150427e604cd4271c9\"\u003e\u003ccode\u003eeaf0ef3\u003c/code\u003e\u003c/a\u003e Fix over-permissive proto dependency edge (\u003ca href=\"https://redirect.github.com/quinn-rs/quinn/issues/2385\"\u003e#2385\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eAdditional commits viewable in \u003ca href=\"https://github.com/quinn-rs/quinn/compare/quinn-proto-0.11.13...quinn-proto-0.11.14\"\u003ecompare view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/details\u003e\n\u003cbr /\u003e\n\nUpdates `rustls-webpki` from 0.103.4 to 0.103.10\n\u003cdetails\u003e\n\u003csummary\u003eRelease notes\u003c/summary\u003e\n\u003cp\u003e\u003cem\u003eSourced from \u003ca href=\"https://github.com/rustls/webpki/releases\"\u003erustls-webpki's releases\u003c/a\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003ch2\u003e0.103.10\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eCorrect selection of candidate CRLs by Distribution Point and Issuing Distribution Point\u003c/strong\u003e. If a certificate had more than one \u003ccode\u003edistributionPoint\u003c/code\u003e, then only the first \u003ccode\u003edistributionPoint\u003c/code\u003e would be considered against each CRL's \u003ccode\u003eIssuingDistributionPoint\u003c/code\u003e \u003ccode\u003edistributionPoint\u003c/code\u003e, and then the certificate's subsequent \u003ccode\u003edistributionPoint\u003c/code\u003es would be ignored.\u003c/p\u003e\n\u003cp\u003eThe impact was that correct provided CRLs would not be consulted to check revocation. With \u003ccode\u003eUnknownStatusPolicy::Deny\u003c/code\u003e (the default) this would lead to incorrect but safe \u003ccode\u003eError::UnknownRevocationStatus\u003c/code\u003e. With \u003ccode\u003eUnknownStatusPolicy::Allow\u003c/code\u003e this would lead to inappropriate acceptance of revoked certificates.\u003c/p\u003e\n\u003cp\u003eThis vulnerability is thought to be of limited impact. This is because both the certificate and CRL are signed -- an attacker would need to compromise a trusted issuing authority to trigger this bug.  An attacker with such capabilities could likely bypass revocation checking through other more impactful means (such as publishing a valid, empty CRL.)\u003c/p\u003e\n\u003cp\u003eMore likely, this bug would be latent in normal use, and an attacker could leverage faulty revocation checking to continue using a revoked credential.\u003c/p\u003e\n\u003cp\u003eThis vulnerability is identified by \u003ca href=\"https://github.com/rustls/webpki/security/advisories/GHSA-pwjx-qhcg-rvj4\"\u003eGHSA-pwjx-qhcg-rvj4\u003c/a\u003e. Thank you to \u003ca href=\"https://github.com/1seal\"\u003e\u003ccode\u003e@​1seal\u003c/code\u003e\u003c/a\u003e for the report.\u003c/p\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFreshen up rel-0.103 by \u003ca href=\"https://github.com/ctz\"\u003e\u003ccode\u003e@​ctz\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/455\"\u003erustls/webpki#455\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003ePrepare 0.103.10 by \u003ca href=\"https://github.com/ctz\"\u003e\u003ccode\u003e@​ctz\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/458\"\u003erustls/webpki#458\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/rustls/webpki/compare/v/0.103.9...v/0.103.10\"\u003ehttps://github.com/rustls/webpki/compare/v/0.103.9...v/0.103.10\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e0.103.9\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e[backport] ci: avoid denying warnings on nightly toolchains by \u003ca href=\"https://github.com/alex\"\u003e\u003ccode\u003e@​alex\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/437\"\u003erustls/webpki#437\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eBackport lifetime change and bump version for release by \u003ca href=\"https://github.com/alex\"\u003e\u003ccode\u003e@​alex\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/436\"\u003erustls/webpki#436\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e0.103.8\u003c/h2\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ebackport valid_uri_names (\u003ca href=\"https://redirect.github.com/rustls/webpki/issues/404\"\u003e#404\u003c/a\u003e) to rel-0.103 by \u003ca href=\"https://github.com/alex\"\u003e\u003ccode\u003e@​alex\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/408\"\u003erustls/webpki#408\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/rustls/webpki/compare/v/0.103.7...v/0.103.8\"\u003ehttps://github.com/rustls/webpki/compare/v/0.103.7...v/0.103.8\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e0.103.7\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNew feature\u003c/strong\u003e: Add \u003ccode\u003eKeyPurposeId::to_decoded_oid()\u003c/code\u003e to help external \u003ccode\u003eExtendedKeyUsageValidator\u003c/code\u003es fill \u003ccode\u003eRequiredEkuNotFoundContext::present\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eWarn on unnameable types by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/387\"\u003erustls/webpki#387\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eExpose KeyPurposeId::to_decoded_oid() by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/385\"\u003erustls/webpki#385\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFix --cfg docsrs uses by \u003ca href=\"https://github.com/ctz\"\u003e\u003ccode\u003e@​ctz\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/390\"\u003erustls/webpki#390\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFull Changelog\u003c/strong\u003e: \u003ca href=\"https://github.com/rustls/webpki/compare/v/0.103.6...v/0.103.7\"\u003ehttps://github.com/rustls/webpki/compare/v/0.103.6...v/0.103.7\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e0.103.6\u003c/h2\u003e\n\u003cp\u003eThe extensible EKU validation released as part of 0.103.5 was actually not usable due to missing type exports, and contained a regression where empty ExtendedKeyUsage extensions would not trigger an error. Both issues are fixed in this release.\u003c/p\u003e\n\u003ch2\u003eWhat's Changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eExport more types to enable ExtendedKeyUsageValidator implementations by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/381\"\u003erustls/webpki#381\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eError on empty EKU extensions by \u003ca href=\"https://github.com/djc\"\u003e\u003ccode\u003e@​djc\u003c/code\u003e\u003c/a\u003e in \u003ca href=\"https://redirect.github.com/rustls/webpki/pull/382\"\u003erustls/webpki#382\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c!-- raw HTML omitted --\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e... (truncated)\u003c/p\u003e\n\u003c/details\u003e\n\u003cdetails\u003e\n\u003csummary\u003eCommits\u003c/summary\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/rustls/webpki/commit/348ce01c01cf8ce21199090c98853992c9c047a8\"\u003e\u003ccode\u003e348ce01\u003c/code\u003e\u003c/a\u003e Prepare 0.103.10\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/rustls/webpki/commit/dbde5921164c6e3ea0928654de8cb
