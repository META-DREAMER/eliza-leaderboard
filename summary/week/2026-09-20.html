KiB payload:\nfirst persist -\u003e ENOSPC, partial file exists (65536 bytes)\nsecond persist -\u003e success URL; route serves 200 with 65536 bytes and the immutable cache header\n```\n\n## Impact\n\nOne disk-full event permanently corrupts specific attachments in a user's history, and content addressing guarantees the corruption is reused for every future identical upload and cached forever by the browser.\n\n## Fix direction\n\nWrite to a temporary sibling (`\u003cname\u003e.\u003cpid\u003e.\u003crandom\u003e.tmp`), fsync, then rename over the final name, removing the temporary file on any failure (the auth package's account file writer already does this); treat an existing file whose size differs from the payload as absent and rewrite it. Apply to all four write sites and pin with a test that pre-seeds a short file under the correct hash.\n"])</script><script>self.__next_f.push([1,"15:T899,"])</script><script>self.__next_f.push([1,"**Is your feature request related to a problem? Please describe.**\n\n`ContextRegistry` seeds ~39 \"LifeOps personal assistant\" context definitions unconditionally at boot (`packages/core/src/runtime/default-contexts.ts`, registered via `_initializeCore` → `tryRegisterMany(DEFAULT_CONTEXT_DEFINITIONS)`, `runtime.ts`). Per-turn selection (`listAvailableContextsForRole` → `ContextRegistry.listAvailable`) filters only by role gate. For a character built around a narrower domain (e.g. a single-purpose trading/social-posting agent with no email/calendar/contacts/phone/health/screen_time/subscriptions/payments/tasks/goals/todos/game/browser/files/terminal/code plugin loaded), the full catalog still renders into the Stage-1 routing prompt every turn via `formatAvailableContextsForPrompt`/`{{availableContexts}}`, burning prompt tokens on categories the agent can never act on — for a 24/7 autonomous agent this compounds daily.\n\nThere's no supported extension point to trim it: `compose_state_providers` filters a different registry (provider names), and `pre_model`/`post_model` only see the already-rendered prompt string.\n\n**Describe the solution you'd like**\n\nAn `unregister(id)` (or `unregisterMany`) method on `ContextRegistry`, or a constructor/character-level option to seed a reduced definition set (e.g. `Character.contexts?: { exclude?: AgentContext[] }` consulted in `listAvailableContextsForRole`), so a non-LifeOps deployment can drop irrelevant contexts without patching core.\n\n**Describe alternatives you've considered**\n\n- Regex-stripping the rendered catalog lines out of the prompt in a `pre_model` pipeline hook — works, but fragile (breaks silently if `formatAvailableContextsForPrompt`'s line format changes) and duplicates the id list outside the registry.\n- Reaching into `ContextRegistry`'s private `#definitions` field — not viable, it's a genuine private class field.\n\n**Additional context**\n\nConfirmed still open on `develop` as of this writing — `ContextRegistry` (`packages/core/src/runtime/context-registry.ts`) is unchanged from our vendored pin (`184a4cc8`): `register`/`registerMany`/`tryRegister`/`tryRegisterMany`/`listAvailable` only, no removal path."])</script><script>self.__next_f.push([1,"16:T135f,"])</script><script>self.__next_f.push([1,"Record model calls, context choices and tool results for each app-chat turn.\n\n## Detailed Description\n\n### Project / Coordination\n\n- Project board: https://github.com/orgs/elizaOS/projects/15\n- Parent tracker or epic: #17022\n- Coordination Discussion: https://github.com/elizaOS/eliza/discussions/14292\n- Suggested lane tag: `chat-trajectory-proof`\n\n### Alpha Phone allocation\n\nOwner: Nubs. September 11; one working day including the Alpha-relevant review/fixes below. Consolidates #30291 and #30734 without adding days or making batching a required deliverable.\n\n- Reproduce the stats-width report on the current stats path. #30291 records a real database overflow at lifetime totals above 2^31-1; it is not evidence that current tests, live scenario, app visual audit if the view changes, and `bun run verify`.\n\n### Claim / Status Notes\n\nBefore working, comment `CLAIMING: app chat trajectory observability` with your lane tag, add this issue to Project 15, set `Status = Claimed`, and set `Claimed by`.\n"])</script><script>self.__next_f.push([1,"17:T8ec,"])</script><script>self.__next_f.push([1,"**Status**\nConfirmed on current tree. `fa9d46be53` (\"refactor bigtime\", 2026-09-23) deleted `plugins/plugin-cli-inference` (the Codex `codex exec` text handler, formerly plugin-codex-cli); neither directory exists now. Nothing registers a `codex-cli` TEXT_SMALL/TEXT_LARGE handler, yet `openai-subscription` is still presented and persisted as a runtime chat backend:\n- `packages/core/src/contracts/first-run-options.ts:131,230,244` (first-run provider union / `SUBSCRIPTION_PROVIDER_SELECTIONS`), and `:730` treats it as the one subscription that needs no additional runtime provider.\n- `packages/ui/src/components/settings/useProviderEntries.ts:276-284` lists it; `ProviderSwitcher.tsx:514-517,587-589` treats it as the only subscription that can drive runtime inference.\n- `packages/ui/src/first-run/first-run-config.ts:150-158` and `packages/agent/src/api/provider-switch-config.ts:678-681,986-1000` write `linkedAccounts` + a direct `llmText` route `backend: openai-subscription` and `model.primary`.\n- `packages/agent/src/api/model-config-routes.ts:677-697` `resolveActiveChat` requires `hasTextHandlerRegistered(runtime, \"codex-cli\")`, which can never be true, so selecting it yields no active chat (users get a dead chat after setup).\n- Stale references: `packages/scripts/release-cohort.json:44` still lists `@elizaos/plugin-codex-cli`; `packages/app/platforms/electrobun/src/subscription-rpc.ts:15`.\n\n**Remaining work**\n- Decide: restore a Codex text handler, or stop offering `openai-subscription` as a chat backend (keep it only as a coding-agent/orchestrator credential, like anthropic-subscription).\n- If removing: drop it from chat-capable first-run/Settings selections, `requiresAdditionalRuntimeProvider`, provider-switch `runtimeApplicable`, and the `resolveActiveChat` branch; migrate persisted `llmText.backend=openai-subscription` configs to an explicit \"choose a provider\" state.\n- Remove `@elizaos/plugin-codex-cli` from release-cohort.json.\n\n**Effort**\nS-M, ~1-2 days.\n\n**Risks**\nExisting users with this route persisted need a visible migration, not silent fallback; orchestrator Codex coding agents (`plugin-agent-orchestrator/src/services/task-agent-frameworks.ts:796,1092,1324`) must keep working.\n\n**Scope changes**\nNone.\n\n\n_Found during backlog triage._\n"])</script><script>self.__next_f.push([1,"18:T43d,Stock Android full chat turns can fail with MODEL_OUTPUT_INCOMPLETE after 256 generated tokens even when the caller requested no output limit. A warm installed-APK run reached this failure after about 115 seconds.\n\nThe Bionic branch in plugin-capacitor-bridge's makeGenerateHandler constructs maxTokens as lane.maxTokens ?? 256. The canonical local-inference BionicHostLoader preserves an omitted limit so the native host owns the model capacity. Inspection of the accepted APK's bundled JavaScript and the distinct error context identifies the mobile bridge path as the source of this injected default.\n\nRemove the bridge-only default, retain explicit caller limits, and reject native incomplete-output receipts even when no explicit caller limit was supplied. Cover buffered and streaming framed transport, full prompt preservation, outputs beyond 256 tokens, explicit limits, and native exhaustion. Keep privacy and delivery deadlines unchanged. Device qualification must use a rebuilt installed artifact and the real full-turn API path; transport tests alone are not device proof.\n19:T57f,"])</script><script>self.__next_f.push([1,"The normal Android JNI staging task searches Bun/AOSP musl asset directories before using pre-staged NDK libraries. In the current cleanup acceptance run, following its missing-library instruction compiled a musl fused library successfully; Gradle assembled an APK, but the mandatory artifact audit rejected `__errno_location` as incompatible with Android bionic. Running the NDK staging tool produced valid bionic libraries. A subsequent build also exposed that the JNI CMake target requires x86_64 as well as arm64 while the staging task only fails early for missing arm64.\n\nScope: remove automatic JNI discovery in musl asset/cache directories; use explicitly configured library directories or NDK-staged jniLibs. Correct the generator and checked-in Gradle instructions to the existing stage-elizavoice-lib.mjs command. Require both supported JNI slices before the native build begins. Preserve Bun/AOSP musl assets and the separate compiler, explicit property/environment compatibility, cloud build behavior, and the final artifact audit.\n\nAcceptance: with musl assets and valid bionic JNI slices both present, the default copy task preserves the bionic libraries; missing required slices fail with the correct staging command; normal APK artifact audit passes before installation. Installed local chat and persistence remain separate required acceptance. No toolchain or ABI audit bypass is proposed.\n"])</script><script>self.__next_f.push([1,"1a:Tc39,"])</script><script>self.__next_f.push([1,"## Summary\n\nGenerated media that arrives as a `data:` URL (Google Imagen images, TTS audio, voice-first audio) is undeliverable on Discord and Telegram. Discord's SDK resolves the string as a filesystem path (ENOENT, caption lost with it); Telegram's `sendMedia` throws `File not found at path: data:image/png;base64,\u003cwhole blob\u003e`, aborts the reply before the text is sent, and logs the full base64 payload twice.\n\n## Where (develop `c2bb8860be`)\n\n- Producers: `packages/agent/src/services/media-generation.ts:98-103` `bytesToAudioDataUrl` → `data:audio/mpeg;base64,…` (used at `:201` for TTS); `packages/core/src/features/advanced-capabilities/actions/generateMedia.ts:227` `data:image/png;base64,${result.imageBase64}` for base64-only image providers; `packages/core/src/services/message/delivery.ts:155` voice-first `data:audio/wav;base64,…`.\n- The media-persist hook that would rewrite these into `/api/media/\u003csha\u003e.\u003cext\u003e` handles (`packages/agent/src/api/media-runtime.ts:127-151`, phase `outgoing_before_deliver`) runs from `processor.ts:713/1303/1500` and the autonomy execution facade; the action callback that delivers `GENERATE_MEDIA` output reaches the connector send handlers without passing through it.\n- Discord: `plugins/plugin-discord/utils.ts:339-341` wraps the string in `AttachmentBuilder(\"data:…\")`; for audio/video the guarded fetch rejects non-http and the catch at `:372-377` falls through to the same `AttachmentBuilder(\"data:…\")`; discord.js 14.27.0 `DataResolver.resolveFile` then does `path.resolve` + `fs.stat` → ENOENT, and because files ride on the last text chunk (`utils.ts:690-700`) the caption in the same `channel.send` is lost too.\n- Telegram: `plugins/plugin-telegram/src/messageManager.ts:1121-1160` sends attachments in a `Promise.all` before the text; `:1425-1428` throws `File not found at path: ${mediaPath}` with the whole data URL; `:1464-1476` `logger.error({ mediaPath, error: error.message })` logs the blob twice; the rethrow aborts `sendMessageInChunks`, and the turn's `delivery_started` marker (`:1575-1610`) refuses a replay.\n- Slack: `plugins/plugin-slack/src/service.ts:2776-2793` rejects via the fetch guard and logs `{ url: media.url }`, i.e. the blob.\n\n## Input → wrong output\n\n`GENERATE_MEDIA` with the Google image provider (base64-only) or any TTS request → on Discord the caption and image are both lost (ENOENT); on Telegram nothing reaches the user, the log carries megabytes of base64, and the turn cannot be retried. Providers that return https URLs (OpenAI) work, which matches the live Discord evidence in PR #20460.\n\n## Fix direction\n\nRun the media-persist hook on action-callback deliveries too (so `data:` becomes a canonical media-store handle) and make Discord and Telegram resolve store handles to bytes; or decode `data:` URLs into a Buffer in `buildOutboundDiscordAttachment` and Telegram `sendMedia` (`{ source: buffer }` for Telegraf). Never put a `data:` payload into an error message or a log field (log a hash or length instead). Telegram should send text independently of attachments so one bad attachment cannot suppress the reply.\n"])</script><script>self.__next_f.push([1,"1b:T5ee,"])</script><script>self.__next_f.push([1,"## Summary\n\nThe agent export bundle contains the agent's decrypted `settings.secrets`, and the import path writes a bundle's `settings.secrets` straight into the new agent, although the export is documented as stripping secrets.\n\n## Where (develop `c2bb8860be`)\n\n- `packages/agent/src/services/agent-export.ts:743-747` reads the agent through `db.getAgentsByIds`; `plugins/plugin-sql/src/base.ts:645-663` `mapAgentRow` runs `transformAgentSettings(agent, decryptedCharacter)`, so `agent.settings.secrets` is plaintext.\n- `agent-export.ts:921-923` strips only `runtime.character.secrets` into `characterConfig`; `:932` places the full `agent` record in the payload untouched.\n- `agent-export.ts:995-1002` on import strips `secrets` from `characterConfig` but spreads `payload.agent` (including `settings.secrets`) into `agentData` before `createAgents`.\n\n## Input → wrong output\n\n`POST /api/agent/export` → the decrypted JSON inside the `.eliza-agent` bundle carries every provider key under `agent.settings.secrets`; the only barrier is the bundle password. `POST /api/agent/import` with a bundle whose `agent.settings.secrets` was edited plants those values (keys, endpoints) into the newly created agent.\n\n## Fix direction\n\nDelete `agent.secrets` and `agent.settings.secrets` (and vault-shaped keys) in `extractAgentData` before building the payload, strip the same fields from `payload.agent` in `restoreAgentData`, and add a test that decrypts the produced bundle and asserts no `settings.secrets` is present.\n"])</script><script>self.__next_f.push([1,"1c:T563,"])</script><script>self.__next_f.push([1,"The scheduled-item editor labels its primary control “Run now” for manual starters, but calls the acknowledge mutation. The canonical runner only changes lifecycle state when acknowledging; it does not dispatch the task. The current UI test asserts that same incorrect verb, so it can pass while the owner receives no run.\n\nObserved source: packages/ui/src/components/pages/ScheduledTaskEditor.tsx and ScheduledTaskEditor.test.tsx; plugins/plugin-scheduling/src/scheduled-task/runner.ts acknowledge implementation. The real fire API already exists.\n\nExpected behavior: an explicit run executes through the existing authenticated fire API and canonical scheduling dispatcher. Acknowledging a delivered item remains a separate operation. The UI reports failed or unavailable execution visibly. Manual dossier refresh must work after a settled run without consuming or resetting automatic once-per-owner-day admission. Pending or uncertain delivery cannot be blindly replayed.\n\nAcceptance: exercise UI to API to canonical dispatch and inspect the resulting effect; retain concurrency, authorization, paused/manual, settled refresh, pending delivery and automatic-day invariants. Review affected desktop/mobile app captures and run owning package checks plus root verification. Related dossier acceptance work: #31872. No second scheduler or state-only substitute for execution.\n"])</script><script>self.__next_f.push([1,"1d:T792,"])</script><script>self.__next_f.push([1,"A long-running owner-private calendar turn can finish its reads and then reject the authorized write solely because its ingress delivery-audience attestation expired after five minutes. The user receives no calendar event despite retaining the same owner, room and request.\n\nObserved in core-flows scenario `live-note-to-calendar-stale-source`, run `29192f53-198d-4b05-a1bd-64d006500333`: two availability observations settled successfully; the follow-up retrieved the current note and then `CALENDAR_CREATE_EVENT` was rejected with `expired_attestation`. The scenario failed and no successful create receipt was returned. This was a simulated CLI-provider diagnostic, not release-qualified evidence.\n\nThe synchronous action gate rejects expiration before the existing async membership revalidation. Simply lengthening the TTL or ignoring expiration would weaken the existing contract and is not the intended fix.\n\nAcceptance:\n- An active, originally authorized turn can renew audience evidence from current trusted authority before tool exposure/execution and visible egress.\n- Renewal is scoped to the exact runtime, turn, actor and destination, and ends on completion or cancellation; stale completed turns cannot acquire renewed access.\n- Canonical-room renewal checks the current owner, room kind and complete participant census. Authenticated API renewal revalidates the host principal with fresh credential/session checks rather than cached ingress authorization.\n- Revocation, changed ownership/membership/destination, unavailable verification, actor/runtime mismatch and cancelled work remain denied. Sensitive-disclosure bookkeeping survives renewal.\n- Regressions advance the clock beyond the normal TTL without relaxing it; cover successful long work and each invalidation boundary. Re-run the note-to-calendar journey and inspect authoritative event state and receipts.\n\nRelated implementation/recovery work: #31856, #31799.\n"])</script><script>self.__next_f.push([1,"1e:Td15,"])</script><script>self.__next_f.push([1,"Promote `develop` to `staging`. The current candidate is `0805aecdc2356b2d06d475917dbc08e7bfcadd00`. Develop Full has passed; promotion PR validation and agent-image reconciliation are still running. Keep th /elizaOS/eliza/actions/runs/36351770799. The duplicate was hidden behind Biome's diagnostic limit; the existing `audit-design.ts` warning was not the failure.\n\nPrior integration work in #32816 reconciled staging ancestry and fixed ambiguous memory deletion; #32828 preserved benchmark corpus and patch bytes during whitespace admission. Their earlier passing results do not qualify the current promotion head.\n\nFinal acceptance: inspect the live PR head and terminal hosted checks immediately before merge, require the independent approval enforced by the staging ruleset, and validate the resulting staging commit afterward. This PR prepares staging promotion only; it does not authorize merging staging into main.\n\nOutstanding updater blocker: the training Dependabot run https://github.com/elizaOS/eliza/actions/runs/36278709464 remains failed because the requested dependency upgrade conflicts with the supported training-backend dependency range. Resolution was reproduced against the current training manifest. No constraint override or disabled check has been introduced; this remains unresolved separately from the passing Develop Full run.\n"])</script><script>self.__next_f.push([1,"1f:T16bf,"])</script><script>self.__next_f.push([1,"# Relates to\n\nAction tasks loaded unrelated schemas, sometimes finished without requested readback, and rebuilt avoidable prompt context. Simple arithmetic could unnecessarily enter evaluation. Paused work could lose its original domain when the response handler returned a simple reply.\n\n# Change\n\nKeep the response handler focused on contexts and intents. Use task-scoped `DISCOVER_ACTIONS`, operation-specific schemas, canonical tool ordering, stable evaluator instructions and instruction-aware cache affinity. Document verification/reference codes no longer infer programming work. Complete authorized source text and receipts remain intact.\n\nContinue against every requested outcome, with prerequisite barriers, verified receipts, explicit additional-budget resume, fresh authorization and cancellation. Saved schemas are not reused. Ambiguous effects are parked rather than replayed. Preserve external continuation-worker fixes. Completed simple answers stay on the one-call path.\n\nPreserve exact FILE bytes and final-line-ending evidence. A scoped native object envelope addresses observed Cerebras Qwen argument boundary loss while retaining native schemas, validation, cancellation and canonical hooks. Other providers and handler/evaluator transport are unchanged. Distinguish document identifiers from integrity metadata in evaluation.\n\n# Testing\n\nCurrent candidate: `ce005a06184a4e8c643bc92b33614259a7a02c77`; integrates develop through `93406451`.\n\n- Owning integration qualification: **465 tests passed** across evaluator (85), discovery (82), Cloud usage (123), navigation (59), and contextual retrieval (116).\n- Final follow-up: **71 routing tests**, **59 navigation tests**, full assistant and agent typechecks, and scoped Biome passed. Exact file I/O with empty model contexts no longer adds coding-task hints; explicit coding, delegation and mixed source refactoring remain preserved.\n- Both preserved eight-task cohorts at `6de0cc10`: **8/8 passed each**, with exact bytes, readbacks and requested replies. First: 29 foreground calls, 131,984 input / 63,488 cached / 68,496 fresh (48.10%). Warm repeat: 31 calls, 150,765 input / 90,112 cached / 60,653 fresh (59.77%). All 12 continuation comparisons retained complete evidence and stable system/tool/schema prefixes. These are separate unpaired observations, not a causal speedup or universal cache target.\n- Text and synthetic PCM STT→agent→TTS at `6de0cc10` passed with one handler call and one user/assistant pair each; 2,455 input / 2,048 cached (83.4%). Physical microphone/speaker acceptance is not claimed.\n- Fresh final-head HTML and two-file acceptance: **2/2 passed** with exact bytes, readbacks and replies. Eight foreground calls reported 40,634 nce evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:frontend-logs --\u003e\n- [x] N/A - no frontend behavior change.\n\u003c!-- evidence-row:llm-trajectory --\u003e\n- [x] [Final and preserved cohort usage, prefix and context evidence](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:domain-artifacts --\u003e\n- [x] [Exact-byte/readback task acceptance and final text/PCM parity](https://github.com/elizaOS/eliza/releases/download/pr-evidence-14/public-acceptance-ce005a06.json).\n\u003c!-- evidence-row:ocr-review --\u003e\n- [x] N/A - no product rendered surface changes.\n\n# Evidence Details\n\nComplete prompts, wire requests/responses and failed diagnostics remain private local artifacts; public evidence contains synthetic acceptance and allowlisted metrics only. No deployment, physical voice acceptance, universal cache target or distributed exactly-once guarantee is claimed. Outcome interpretation remains model-dependent. Whole-revision historical comparisons include develop changes and do not isolate every gain to one patch.\n"])</script><script>self.__next_f.push([1,"20:T1abc,"])</script><script>self.__next_f.push([1,"Fixes and ports across the connector, search, MCP and wallet plugins. One commit per issue.\n\n## #32027: outbound `data:` and media-store attachments (Discord, Telegram, Slack)\nFixes #32027. Ported from closed #32032 (credit @hermesagent270-commits).\n\n- Adds `resolveOutboundAttachmentBytes` to core. It handles each kind of URL as follows:\n  - `data:` URLs are decoded in process, with a size cap.\n  - Canonical `/api/media/...` handles use the runtime's local fetch.\n  - http(s) URLs go through the SSRF-guarded fetcher.\n  - Filesystem paths and other schemes are rejected without reading disk.\n- Telegram, Discord and Slack now upload the resolved bytes.\n- Logs and delivery evidence carry only a scheme/host/path summary. The base64 payload no longer appears in the Telegram error.\n- If a Telegram attachment fails, the text reply is still sent.\n- Behavior change: Telegram no longer reads local file paths passed as attachment URLs. Treating a model-supplied path as a file on disk was the bug.\n\n## #32026: bounded Discord attachment cache\nFixes #32026. Ported from #32032.\n\n- The cache is now keyed by the stable attachment id instead of the signed CDN URL.\n- It holds at most 64 entries (LRU) with a 2-minute TTL.\n- Extracted transcript text is no longer kept in the cache.\n\n## #31464: per-account Discord disconnect (partial, `Refs`)\n`deleteAccount` used to be a no-op. It now works as follows:\n\n1. **Persist a disabled policy first.** It goes in the runtime cache, keyed by account id and a SHA-256 fingerprint of the token. The token itself is never stored.\n2. **Disconnect the account.** `DiscordService.disconnectAccount`:\n   - blocks new messages for that account only;\n   - drains its admitted turns, within the existing shutdown-drain timeout;\n   - tears down its client, login retry, debouncer, managers and audio sinks.\n3. **Siblings are unaffected.** Other accounts keep running, and the default alias moves to a remaining account.\n4. **Failures are retryable.** A teardown failure throws before the manager deletes its row, and a retry repeats the teardown.\n5. **Restart honors the policy.** After a restart, the service skips the disabled token and the provider stops listing it. Configuring a new token under the same id counts as a replacement and runs normally.\n\nRemaining, outside this plugin:\n- Removing the token from character settings or env. The host's settings owner has to do this; the plugin cannot write it.\n- The issue's gating of all-channel onboarding completion, which belongs to the onboarding flow.\n\n## #31789: typed keyless web-search failures (+ #31785 SSE binding)\nFixes #31789.\n\n- `searchKeylessWeb` now returns `undefined` only when a search succeeds with zero hits.\n- Every provider failure throws `KeylessWebSearchUnavailableError`, with:\n  - a reason: `rate_limited`, `http_error`, `timeout`, `network`, `aborted`, `malformed_response`, `response_too_large`, `unsupported_content_type` or `provider_error`;\n  - the HTTP status and `Retry-After`;\n  - no query text or provider payload in the message.\n- The search takes a caller `AbortSignal` and never dispatches after cancellation.\n- The MCP response parser now handles SSE strictly (#31785):\n  - it parses complete SSE events, including multi-line and unspaced `data:` fields;\n  - it ignores notifications and responses to other request ids;\n  - identical replays are collapsed, and conflicting or missing responses are rejected.\n- Callers updated: the agent `WEB_SEARCH` action, the edge runner, coding-tools and the cloud keyless search. A provider outage is now reported as unavailable, not as \"no results\" / `no_match`.\n\n## #29650: platform-filtered MCP tool discovery\nFixes #29650.\n\n- `Tier2ToolIndex.search` now ranks the whole index, filters by platform, and only then applies offset and limit.\n- It returns the total match count, and `SEARCH_ACTIONS` reports `totalMatches` and `hasMore`.\n\n## #29930: EVM relative swap sizing (money path)\nFixes #29930. Reworked from conflicting #29933 (credit @agent-cortex).\n\n- Half / max / percent are now sized from the balance of the token being sold:\n  - **ERC-20:** the token's on-chain `balanceOf` and `decimals`. Symbols resolve through Li.Fi, the same way `SwapAction` does. `max` spends the full balance.\n  - **Native asset:** the native balance, and `max` keeps the 10% gas reserve.\n- All math uses bigint raw units, so large, dust and high-precision balances are never rounded through floats.\n- A failed balance read, an unconfigured chain or a zero result throws `INVALID_PARAMS`. The code never falls back to another token's balance.\n\n## #31110: Solana RPC failure shown as $0\nFixes #31110. Ported from conflicting #31127 (credit @hermesagent270-commits).\n\n- The token-account and SOL balance reads now throw `ElizaError`:\n  - `SOLANA_RPC_UNAVAILABLE` for an RPC failure;\n  - `SOLANA_RPC_RATE_LIMITED` after 3 backed-off attempts on 429. The old code retried 429 without limit.\n- `updateWalletData` no longer caches an empty portfolio when a read fails, so the last known value stays.\n- A failed first refresh no longer makes the configured wallet look absent.\n- The wallet routes answer 503 with the typed code.\n\n## #30151: web wake word matched as a substring\nFixes #30151. Ported from closed #30152 (credit @agent-cortex).\n\n- The trigger must now be a standalone token, so \"elizabeth\" no longer fires \"eliza\".\n- The boundary rule is relaxed for scripts written without spaces (CJK, Thai and similar).\n\n## Verification\nEach package's tests, typecheck and lint were run.\n\n| Package | Tests | Typecheck | Lint |\n|---|---|---|---|\n| `plugins/plugin-native-swabble` | 60/60 pass | pass | pass |\n| `plugins/plugin-wallet` | swap-amount-mode 20/20, `service.rpc-errors` 7/7 | pass (`tsconfig` + `tsconfig.ui`) | biome clean on changed files |\n| `packages/core` | `media/outbound.test.ts` 10/10 | pass | pass |\n| `plugins/plugin-discord` | full suite: 102 files, 825 tests pass | pass | pass |\n| `plugins/plugin-telegram` | `messageManager` + outbound-media 51/51 | pass | pass (6 existing warnings) |\n| `plugins/plugin-slack` | outbound-attachments 8/8 | pass | pass |\n| `plugins/plugin-web-search` | full suite 53/53 | pass | pass |\n| `plugins/plugin-coding-tools` | `web-search.test.ts` 10/10 | pass | pass |\n| `packages/agent` | — | pass | pass |\n| `packages/cloud/shared` | `bun test .../bm25-index.test.ts` 3/3 | pass | pass |\n\nRoot `verify` pieces run: `ensure-plugin-test-conventions --check`, `audit-test-lane-membership`, `audit-focused-skipped-tests` and `core/scripts/verify-package.ts` all pass. The full turbo `typecheck lint:check ending, then the designed unavailable screen with retry, then ready. Public routes, the session gate and the apex redirect order are unchanged.\n\nThe existing hosted-management test now installs a resolved private load, because every managed route comes from that load. Cold deep links in a real browser are also covered by the cloud-surfaces audit route table.\n\n## #30228: canRespond reflects Cloud model availability\nFixes #30228\n\n`CloudModelRegistryService` now evaluates the effective TEXT_SMALL/TEXT_LARGE ids against its cached, non-billable `/models` catalog. It returns a typed readiness: `available`, `unknown`, or `model_not_available` with `MODEL_NOT_AVAILABLE`, the config key and the model id.\n- The read is synchronous and makes no inference call. A stale catalog schedules one bounded background refresh, with a 30-minute TTL and a 60-second retry after a failure.\n- `computeCanRespond` returns false only when the catalog positively says a model is not listed **and** Eliza Cloud is the only registered provider for that model type. A catalog outage stays `unknown` and never gates chat.\n- `/api/status`, `/api/health` and the WS status events now carry `modelReadiness`. The chat composer names the invalid setting instead of asking the owner to set up a provider.\n\n## #22552: first-turn cache warming (partial)\nRefs #22552\n- Opening a Shared conversation (`GET .../api/conversations`) now schedules, under `waitUntil`, the prewarm the first turn needs. Personal Shared warms its rate-limit gate and its conversation object. Sandbox-backed shared agents run the provision-time legs.\n- The keepwarm cron now warms each recently active Personal Shared room through a new `listRecentlyActiveRooms` read (bounded and sequential), using the same start-empty semantics as the turns themselves. It previously skipped these identities entirely.\n- The turn path still fails closed with the retryable 503. Nothing absorbs or awaits hydration.\n\n**Remaining:**\n- The keepwarm cron cannot warm the organization-scoped rate-limit gate for rowless `personal:\u003cuuid\u003e` identities. The id is a one-way hash, and `shared_runtime_history` has no organization column, so fixing this needs a schema or owner decision. Session start covers it for app opens.\n- The #27685 transcript-anchor loss has no proven root cause. It needs the receipt and history-phase diagnostics plus a staging run.\n- The 503-rate and time-to-first-reply re-measurement, with a pre-stated n, needs staging.\n\n## #30806: inference admission latency (partial)\nRefs #30806\n- Done: aged API-key cache hits on the deferred-credential path (paid Worker routes) now schedule the same coalesced, retained background refresh as the standalone path (#30722). Previously they fell off the 60-second TTL into a cold authoritative request.\n- Already fixed on develop:\n  - #30860: skip-mode distributed memo writes (#30909 merged).\n  - #30718: admission hydration now reads balance and revision in the single policy statement, so there is no separate balance SELECT.\n\n**Remaining:**\n- #30865 / #30914 (drop the affiliate settlement readback) is in `credits.ts`, which the billing branch owns, so it was not ported.\n- #30724: fold the key and user/org lookups into one primary read. This needs a repository join that preserves the identity shaping in `findUserWithOrganizationById`, plus a real-DB test.\n- #30715: move subscription-funded admission off `reserveSynchronously` onto an allowance-aware Durable Object authority. This is a billing design change and needs the billing owner.\n- #30796: enable `INFERENCE_STRONG_REVOCATION_ENABLED` in production after a staging allow/deny/revoke canary, through a normal release.\n- Local Worker-to-Cerebras trace, and staging cold/warm/aged timing.\n\n## #29918: coherent sign-in and recovery (partial)\nRefs #29918\n\nRe-landed from the closed draft #30920 (credit: standujar):\n- The hosted OAuth redirect always returns to the launching origin. Previews used to bounce to `staging.eliza.app`, where the origin-local PKCE verifier could not be consumed.\n- Bootstrap recovery screen accessibility (contrast, focus treatment, 44px Start over) with its full-app spec.\n\n**Remaining:**\n- The rest of #30920 is about 24k lines of owned session authority and desktop/native persistence. It depends on its own large first commit and was not re-landed. The post-confirmation session revalidation (c3b3a941) depends on that commit's options plumbing.\n- The `/join` error-surface logout failure is not reproduced in code. A likely suspect is that `signOutFromSsoBridgedHost` skips the server logout on hosts outside `ELIZA_CLOUD_DIRECT_API_BY_HOST`. It needs the failing staging trace.\n- #16921 (one durable owner activation turn plus persisted first goal) is not implemented. It needs an owner decision on eligibility and migration for established agents. It also needs a single owner across the shared Durable Object and dedicated runtimes, and it conflicts with the current \"never fabricate assistant turns\" greeting policy in `conversation-routes.ts`.\n- The per-method desktop/mobile matrix needs staging.\n\n## #16420: native iOS Cloud authentication (partial)\nRefs #16420\n- New `ElizaCloudAuthSessionPlugin` (App target, registered in `ElizaBridgeViewController`, added to the Xcode project). It runs `ASWebAuthenticationSession` with the claimed HTTPS callback `https://eliza.app/auth/callback` on iOS 17.4+. The login hosts are an allowlist, and the callback host and path are fixed natively. One session owns a sign-in at a time.\n- `ios-cloud-auth.ts` reuses the shared mobile PKCE client (S256, config, token, ACK) with an in-memory verifier. It joins concurrent attempts and never replays a consumed code.\n- The credential is written before the ACK into the Steward token store, which the storage bridge already backs with the Keychain.\n- `useCloudState` takes the native path on iOS and keeps the device-code fallback when it is unavailable.\n\n**Remaining (needs Xcode signing, a device, and a deploy):**\n- Confirm the `eliza.app` AASA covers `webcredentials` and `/auth/callback` for the signed team and bundle.\n- Enable the mobile app-auth config routes in staging and production.\n- Make store builds Cloud-only by default.\n- Clean-install device runs on iOS and Android.\n- Decide on iOS 16.0–17.4. The deployment target is 16.0 and HTTPS callbacks need 17.4, so those devices keep the device-code fallback.\n\n## Verification\n- `plugins/plugin-elizacloud`: `bunx vitest run __tests__/cloud-model-readiness.test.ts`: 5/5 pass (real HTTP catalog server). `bun run typecheck`: pass.\n- `packages/agent`: `bun run typecheck`: pass.\n- `packages/ui`: `bun run typecheck`: pass.\n  - `src/cloud/shell/CloudRouterShell.private-registration`: 15/15.\n  - `CloudRouterShell.root-route`: pass.\n  - `src/cloud/public-pages/pages/login/steward-login-section.oauth-launch`: 22/22.\n  - `src/ios-cloud`: 5/5.\n- `packages/cloud/shared`: `tsc --noEmit`: pass. `bun test src/db/repositories/shared-runtime-history-merge.integration.test.ts` (PGlite): 3/3.\n- `packages/cloud/api`: `tsc --noEmit`: pass. The router-contract and worker-bundle dry-run were not run because disk was tight, and no routes were added.\n- Swift: `ElizaCloudAuthSessionPlugin.swift` typechecks against the iPhoneSimulator 26.4 SDK (`-target arm64-apple-ios16.0-simulator`) with a stub Capacitor module. It has not had a full Xcode build.\n- Biome check is clean on every touched file.\n- Not run to completion: the Playwright audit-cloud `pricing` spec and the bootstrap-accessibility spec. The live-stack renderer build timed out on this machine (`renderer-build process-timed-out`, a shared, heavily loaded host). Both specs still need CI or a local run, plus the app visual audit at desktop and mobile sizes.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n"])</script><script>self.__next_f.push([1,"22:T22b1,"])</script><script>self.__next_f.push([1,"Backlog fixes across `packages/agent`, `packages/core`, `plugins/plugin-sql` (plus the two `plugin-assistant` seams the audience renewal needs). One commit per issue.\n\n## #32016: agent export secrets (Fixes #32016)\nThe maintainer closed #32028 because a migration bundle is meant to carry credentials, and asked for a secrets-free export to be **opt-in** instead. So this PR does that:\n- The default bundle still carries `secrets` / `settings.secrets`, protected by the bundle password. The module header now says so, where it used to imply they were excluded.\n- `POST /api/agent/export` accepts `excludeSecrets: true` (core contract, route, UI client). That option strips both containers from the agent record and from the runtime character. A non-object `settings` gets a typed `AGENT_EXPORT_INVALID_SETTINGS` error.\n- Import is unchanged. A default bundle restores the credentials it carries.\n- Test: `test/agent-transfer-secrets.test.ts` runs on real PGlite. It checks that a default bundle round-trips `settings.secrets`, and that a credential-free bundle has no secret in the decrypted payload or on the imported agent.\n\n## #31952: atomic content-addressed media writer (Fixes #31952)\nPorted from #31973 and cut down as the maintainer asked:\n- Persist, restore and the pin ledger now share one write-temp-then-rename helper.\n- If a file already exists under a content hash but its size differs from the payload, it is rewritten.\n- Dropped from the original PR: the extra fsync, the GC sweep and the logging.\n- Test: `test/media-store-atomic-persistence.test.ts` runs on the real filesystem. It covers repair on persist, repair on restore, idempotent re-persist, and a failed rename that leaves no partial file. It fails 4/5 on develop and passes with the fix.\n- Not done: the #30019 sub-item (the plugin-meetings duplicate writer) is outside this PR's scope.\n\n## #31953: WebSocket fan-out backpressure (Fixes #31953)\nPorted from #31974.\n- A peer's queued bytes are the transport buffer plus frames waiting on host admission.\n- A peer above the soft limit keeps getting every frame for a grace period. If it still hasn't drained, it is terminated. Above the hard limit it is terminated at once.\n- Frames are never skipped on a live socket. The client sees the termination and replays from the event buffer when it reconnects.\n- A ping/pong sweep prunes peers that stop answering.\n- Note for review: #31974 was closed because of a general concern about caps. This version never drops frames silently; the only failure mode is an observable disconnect followed by replay.\n- Test: `test/event-hub-backpressure.test.ts` uses a real `ws` server and clients. A stalled peer is bounded and terminated while a healthy peer gets all 2000 frames. A peer that stops answering pings is pruned.\n\n## #31239: trade-mode write failure (Fixes #31239)\nPorted from #31259.\n- A failed `saveElizaConfig` restores the previous in-memory shape, including removing a `features` object or mode key the handler itself created.\n- The route then answers a structured 500 instead of `ok: true`.\n- Test: `test/trade-mode-persistence-http.test.ts` drives the handler over loopback HTTP with the real config writer, with the config path blocked by a directory.\n\n## #31004: shared references treated as cycles (Refs #31004)\n- `stringifyForDiagnostics` (core) and the JS runtime bridge marshaller now track only the open ancestor path. True cycles are still marked, and nothing is truncated.\n- The scheduling DAG validation site was already fixed by #30932, and that PR has tests.\n- Tests: `packages/core/src/runtime/json-output.diagnostics.test.ts` and `packages/agent/test/js-runtime-bridge-shared-refs.test.ts`, which runs the real host-node bridge.\n- Tracker items outside this area are still open: `ui` tts-debug, `plugin-personal-assistant` redact-sensitive-data, and logger #25125.\n\n## #31251: shared registries and ElizaError identity (Fixes #31251)\n- `ElizaError` now carries a `Symbol.for` brand on its prototype and a `Symbol.hasInstance` that checks it. That makes `instanceof`, `isElizaError` and `toElizaError` pass-through work across bundled copies.\n- Subclasses keep normal prototype `instanceof`, and look-alike plain objects are still rejected.\n- The OCR registry (#31254) and the local-inference vision augmenter (#31257) were already fixed on develop.\n- Test: `packages/core/src/errors.identity.test.ts` loads a second module instance and checks recognition in both directions.\n\n## #31881: owner-private audience renewal during long turns (Fixes #31881)\nThe 5-minute TTL is unchanged. What's new:\n- **Turn lease.** The message turn (plugin-assistant `turn-lifetime.ts`) opens a lease with `beginTrustedDeliveryAudienceTurn`. The lease is bound to the runtime, to this turn's evidence binding, and to its merged cancellation signal. It closes when processing settles.\n- **Renewal.** Expired evidence is re-derived from current authority:\n  - Canonical rooms re-read the room kind, the owner and the full participant census.\n  - API evidence renews only through a host-supplied fresh principal check.\n- **What renewal must match.** It succeeds only if actor, agent, room, destination kind, owner and census are all unchanged. Sensitive-disclosure bookkeeping carries over.\n- **When renewal is refused.** After completion or cancellation, for a different runtime, and for evidence that was already expired when the turn began.\n- **Where it runs.** Inside revalidation, before the planner's exposure gates, and before owner-gated tool execution.\n- Test: `packages/core/src/security/trusted-delivery-audience.renewal.test.ts` (14 cases) advances the clock past the TTL. It covers a long turn succeeding and each invalidation case.\n- Not done:\n  - `chat-routes.ts` does not yet pass `revalidatePrincipal` to `attestAuthenticatedApiDeliveryAudience`, so authenticated-API turns still expire at 5 minutes. That needs a host-side fresh session or token check.\n  - The `live-note-to-calendar-stale-source` scenario was not re-run (needs a live provider).\n\n## #30825: actionable local backup size failures (Refs #30825)\n- `POST /api/backups` maps `AgentSnapshotBudgetExceededError` to a 413. The response carries `code`, `stage`, `unit`, `observed`, `limit` and `retryable: false`, plus a message the settings dialog shows as-is. It exposes no paths or DB diagnostics.\n- Unexpected failures still return the generic 500.\n- The file-count refusal now has its own `file count` stage.\n- Test: `test/backup-capture-http.test.ts` gains a case against the real HTTP server and PGlite. A sparse 200 MiB media file gets a 413 with no state-dir path in the body; once it is removed, the backup succeeds.\n- Not done: streaming local backups through capture-v2, which is the L-sized part. Also no native-dialog capture.\n\n## #29069: plugin-sql metadata filter (Fixes #29069)\n`getMemories` now applies the same `metadata @\u003e :filter::jsonb` predicate that `countMemories` already uses.\n- **Why containment (#29074) and not per-key equality (#29735):** it is what `countMemories` already ships, the maintainer asked for both methods to stay on it, and switching count to equality would change existing callers.\n- Test: `memory-metadata-filter.real.test.ts` runs on real PGlite. It covers scalar, multi-key, nested objects in any key order, no match, empty filter and absent filter, with get and count agreeing. It fails 5/7 on develop.\n\n## #30881: complete authorized context (Fixes #30881)\n- `recent-conversations` always inlines the complete authorized cross-room bodies. A recall action now only appends a room index.\n- The provider no longer declares `overflowText`, so an estimated budget cannot swap the bodies for a body-free manifest.\n- The planner half is already satisfied: `pipeline.ts` runs no dispatch-budget preflight.\n- Test: `test/recent-conversations-complete-context.test.ts` runs on real PGlite with an attested owner DM. Bodies are in g → host zone and reports the `source`, and `calendarDateKey(now, timeZone)` produces the owner-day key.\n- Fail-closed: a resolver that throws is a `LifeOpsServiceError` 503 `CALENDAR_TIME_ZONE_UNAVAILABLE` (cause preserved); an invalid zone from the owner or the setting is 422 `CALENDAR_TIME_ZONE_INVALID`. No step falls through to another zone. A `null` owner zone is \"not configured\" and continues to the setting; that is the only fallthrough.\n- `FinancesService.getUpcomingBills` derives `todayIso` from `calendarDateKey(now, (await this.resolveCalendarTimeZone(now)).timeZone)`; the wrapper rethrows the shared error as `FinancesServiceError` with the same status and code, which `runPaymentsHandler` already turns into `success:false` and `runFinancesRoute` into `ctx.error(res, message, status)`. The action constructs `new FinancesService(runtime)` and the route `new FinancesService(runtime, {ownerEntityId})` exactly as before; neither needs injection because the owner lives on the runtime.\n- The personal-assistant plugin registers `resolveConfiguredOwnerTimeZone` in `init`, next to the other first-turn registries. It reads the owner facts through `ownerFactsToView`, so the active-travel destination override is honoured like every other owner-zone consumer, and it propagates a store read failure instead of substituting the host zone (the lenient `resolveOwnerTimeZone` used by reminders is unchanged).\n- Behavioral change for operators: an invalid owner or `TIMEZONE` zone now surfaces as an error on the bills route and the dashboard action instead of a silently UTC-classified list. Documented in `plugins/plugin-finances/README.md`.\n\n# Background\n\n## What does this PR do?\n\nMoves calendar time zone ownership into `@elizaos/shared`, registers the personal-assistant owner facts as that owner, and makes the finances bill classification read the owner's calendar day from it on every surface.\n\n## What kind of change is this?\n\nBug fix (non-breaking; additive exports).\n\n# Documentation changes needed?\n\nMy changes require a change to the project documentation, and it is included in this PR (`plugins/plugin-finances/README.md`, `TIMEZONE` row).\n\n# Testing\n\n## Where should a reviewer start?\n\n- `plugins/plugin-personal-assistant/src/routes/finances-calendar-time-zone.pglite.integration.test.ts` — real runtime (normally registered personal-assistant plugin, finances schema on PGlite, real runtime-plugin HTTP dispatcher). One bill due `2026-03-02`, `now = 2026-03-03T03:30Z`. Owner fact `America/Los_Angeles` → `upcoming` through both `runPaymentsHandler` (`dashboard`) and `GET /api/lifeops/money/bills`; owner fact `Asia/Tokyo` → `overdue` on both; owner fact `Mars/Phobos` → action `success:false` with `{status: 422, code: CALENDAR_TIME_ZONE_INVALID}` and the route 422 naming the zone. It also asserts the resolver registered by `init` resolves with `source: \"owner\"`.\n- `plugins/plugin-finances/src/upcoming-bills-calendar-time-zone.test.ts` — stubbed repository; owner-zone, setting, host-default, precedence, 503 on resolver failure with cause, 422 on invalid owner or setting zone.\n- `packages/shared/src/lifeops-normalize/calendar-time-zone.test.ts` — the owner's precedence and fail-closed contract and the LA/Honolulu/Tokyo/UTC date-key table.\n\n## Detailed testing steps\n\n```bash\nbun run --cwd packages/shared test\nbun run --cwd plugins/plugin-finances test\ncd plugins/plugin-personal-assistant \u0026\u0026 bunx vitest run --config vitest.src-integration.config.ts src/routes/finances-calendar-time-zone.pglite.integration.test.ts\n```\n\nResults at `5a18df43`:\n\n| Lane | Result |\n| --- | --- |\n| `packages/shared` full suite | 232 files, 2907 tests passed |\n| `plugins/plugin-finances` full suite | 16 files, 206 tests passed |\n| personal-assistant `src-integration` lane, the new dual-surface test | 4/4 passed on a real PGlite runtime |\n| personal-assistant owner fact-store and plugin-init tests | 7 files, 65 tests ployment is implied.\n"])</script><script>self.__next_f.push([1,"40:T92e,"])</script><script>self.__next_f.push([1,"## Problem\n\n`loadDefaultMasterKeySync` resolves a single persistent process-wide master key, but it is invoked **once per credential file** decoded by `account-storage.ts` (`masterKey()` → `decodeAccountRecord`). A `listAccounts()` over N pooled accounts therefore re-resolves the same key N times:\n\n- **Keychain hosts:** N `readKeychainKeySync` child-process spawns, each ~80-150ms (cold Node boot + `@napi-rs/keyring` dynamic load + Secret Service round trip).\n- **Passphrase hosts:** N scrypt derivations at 2^15 cost, ~90ms each.\n\nWith ~17 pooled subscription accounts this is **~2.5s of serialized, redundant key resolution**, and it runs inside the account-pool **lease** that every chat turn takes before its first model call.\n\n### Observed impact\n\nOn a live deployment the `model:TEXT_EMBEDDING` inference span measured **1.4–9.6s** while the embedding backend itself (`curl` to the same local endpoint) answered in **20-40ms**. `strace` of a turn showed the lease blocking on ~17 keychain child processes (fd read of the base64 key) back-to-back before the embedding HTTP call was even issued — the span wraps the lease, so the redundant key work is charged to the embedding.\n\n## Fix\n\nMemoize the resolved key per `service/account` for the process lifetime.\n\n- The value already lives in process memory for the duration of every vault/credential op; the cache is keyed by the same `service/account` tuple the resolver reads.\n- **Security posture unchanged:** no key is ever fabricated, failures are never cached (transient keychain/passphrase errors still retry on the next call), and the `ELIZA_VAULT_PASSPHRASE` length guard still runs before the cache lookup.\n- Adds a test-only `resetLoadDefaultMasterKeySyncCache()`.\n\n## Test\n\n`packages/auth/test/master-key-sync-cache.test.ts` asserts reference identity across a 17-call fan-out (simulating a `listAccounts()` decode loop):\n\n- **Fails on clean develop:** un-memoized resolver returns a fresh `Buffer` per call → `expect(key).toBe(first)` fails.\n- **Passes with the memo:** one resolution serves the whole fan-out.\n\nThe test tolerates the absence of the reset helper (falls back to a no-op) so the *behavioral* identity assertion is the bidirectional signal, not the new API symbol.\n\nExisting `keychain-process.test.ts` (7 tests) still passes.\n\n---\n\nClient / agent tooling: Sol\n"])</script><script>self.__next_f.push([1,"41:T5d9,"])</script><script>self.__next_f.push([1,"## Summary\n\nDelete unused test-support artifacts that leak into the published `@elizaos/app-core` package:\n\n- **`src/api/__tests__/sandbox-test-helpers.ts`** — zero callers anywhere in the repository\n- **`src/test-support/test-helpers.ts`** — HTTP factories (`createMockHttpResponse`, `createMockIncomingMessage`), `waitMs`, and connector plugin resolvers shipped in the package artifact with no production consumer\n- **`src/test-support/test-helpers.test.ts`** — self-tests for the above\n\nMove the six connector plugin import resolvers (`resolveTelegramPluginImportSpecifier`, etc.) and `extractPlugin`/`looksLikePlugin` to **`test/helpers/connector-imports.ts`** so the live e2e suites retain them without shipping in the package output. Update all six live-agent callers to the new path.\n\n## Caller audit\n\n| Export | Production callers | Test callers | Action |\n|---|---|---|---|\n| `createMockHttpResponse` | 0 | 1 (sandbox wrapper) | Deleted |\n| `createMockIncomingMessage` | 0 | 1 (sandbox wrapper) | Deleted |\n| `waitMs` | 0 | 1 (self-test only; `run-repo-setup.mjs` has its own local copy) | Deleted |\n| `extractPlugin` | 0 | 6 live-agent tests + `real-runtime.ts` (own copy) | Moved to `test/helpers/` |\n| `resolve*PluginImportSpecifier` | 0 | 6 live-agent tests | Moved to `test/helpers/` |\n| `sandbox-test-helpers.ts` | 0 | 0 | Deleted |\n\nNo production HTTP route or actual connecto ts move from the host zone to the Europe/London profile zone of its fixture.\n\n# Background\n\n## What does this PR do?\n\nMakes Fitbit instants host-independent so sleep-regularity and circadian rules see the user's real bedtime and wake time.\n\n## What kind of change is this?\n\nBug fix (non-breaking).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-health/test/fitbit-connector.local-wall-time.test.ts`: Fitbit's documented sleep-log example plus a weight log under host `TZ` UTC, Asia/Tokyo and America/Los_Angeles, asserting identical Los Angeles-correct instants, a sleep log across the 2020-03-08 PST to PDT transition, the offset fallback, and the fail-closed case.\n\n## Detailed testing steps\n\n```bash\ncd plugins/plugin-health \u0026\u0026 bunx vitest run test/fitbit-connector.local-wall-time.test.ts test/fitbit-connector.contract.test.ts\n```\n\nRed on develop's `health-connectors.ts` (test written first): 6/6 fail (UTC host stores 23:38 as `23:38Z`, Tokyo host moves the weight `localDate` to the previous day, `timezone` null everywhere). Green at this head: 6/6; whole plugin suite 39 files, 211 passed, 4 live-API files skipped. Plugin typecheck exit 0 and Biome clean.\n\n# Evidence Gate\n\nEvidence must match the exact commit reviewed. `scripts/pr-evidence.mjs rows`\nsets this marker from the live PR head; rerun it after every push.\n\u003c!-- evidence-head:1f0739a393a4e284819322ce752761b87e964458 --\u003e\n\n\u003c!-- evidence-row:before-screenshots --\u003e\n- [ ] Before full-page screenshots are attached for every affected UI surface\n      (desktop and mobile), or marked `N/A - \u003creason\u003e`.\n      `N/A - health connector ingestion; no UI surface.`\n\u003c!-- evidence-row:after-screenshots --\u003e\n- [ ] After full-page screenshots are attached for every affected UI surface\n      (desktop and mobile), or marked `N/A - \u00 : full standard in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\n- [x] This PR targets `develop` and is rebased onto the latest `origin/develop` with zero conflicts.\n- [x] `bun install` was run after sync; focused package gates (test, typecheck, lint) pass. `bun run verify` was not run to completion on this constrained device — see **Known gaps / failures**.\n- [x] A reviewer can confirm the change works without reading the code, from the before/after test evidence below.\n\n# Sync with develop\n\n- [x] Rebased onto the latest `origin/develop` (`958196206a`); zero conflicts.\n- [x] Focused package checks pass post-sync; full `bun run verify` blocker documented in **Known gaps / failures**.\n\n# Risks\n\nLow. The change is confined to one file (`plugins/plugin-native-agent/src/web.ts`), a Capacitor plugin **web fallback** used only when no native iOS/Android bridge is registered. It adds three `!res.ok` guards that mirror the pre-existing `chat()` guard; the success paths are unchanged (proven by regression tests). No public type changes — `AgentStatus` already declares `state: 'error'` and `error: string | null`.\n\n# Background\n\n## What does this PR do?\n\nThe Capacitor Agent web fallback (`AgentWeb`) did **not** check `res.ok` in `start()`, `getStatus()`, or `stop()`. The agent HTTP server deliberately answers lifecycle/status failures with core `writeJsonError`'s `{ error: message }` body and a 4xx/5xx status (`packages/agent/src/api/agent-lifecycle-routes.ts`):\n\n- `POST /api/agent/start` → `503` \"Agent runtime is not available and this server cannot boot one on demand\" when the host cannot boot; or `500` with the reported state flipped to `\"error\"` on a failed boot.\n\nBecause the web fallback blindly parsed and returned the body, callers received a **malformed `AgentStatus`** missing the required `state`/`agentName`/`port`/`startedAt` fields:\n\n- `start()` did `return data.status ?? data`, so on error it returned `{ error }` (no `state`).\n- `getStatus()` and `stop()` did `return res.json()` directly, returning the raw `{ error }` body.\n\nThe server's designed `\"error\"` / not-bootable state was silently discarded, violating the repo DTO/error policy (a failed producer must yield an explicit error/unavailable state, not healthy-looking/partial data). This is an internal inconsistency: `chat()` in the same file already checks `res.ok` and throws.\n\n**User-facing impact:** consumers cast the result to `AgentStatus` and read `.state`. `packages/app/src/main.tsx` `initializeAgent()` dispatches `AGENT_READY_EVENT` with the status, and `packages/ui/src/api/client-agent.ts` casts `Agent.start()`/`Agent.getStatus()` to `AgentStatus` and branches on `.state === \"running\"`. When a local-agent boot returns 503/500, the missing `.state` makes a failed boot surface as an unrecognizable status rather than the intended `error` state.\n\n### Fix\n\nIn `web.ts`, added `res.ok` handling to the three methods (mirroring `chat()`):\n\n- `start()` / `getStatus()`: when `!res.ok`, read the JSON body's `error` (falling back to `statusText`) and return a well-formed `{ state: 'error', agentName: null, port: null, startedAt: null, error: \u003cmessage\u003e }`.\n- `stop()`: when `!res.ok`, return `{ ok: false }` instead of the raw error body.\n\n## What kind of change is this?\n\nBug fix (non-breaking change which fixes an issue).\n\n# Documentation changes needed?\n\nMy changes do not require a change to the project documentation. The behavior now matches the documented `AgentStatus` contract in `src/definitions.ts`.\n\n# Testing\n\n## Where should a reviewer start?\n\n`plugins/plugin-native-agent/src/web.test.ts` — five added cases lock out the malformed-DTO regression, each asserting `.state`/`.ok` explicitly. Run:\n\n```bash\nbun run --cwd plugins/plugin-native-agent test\n```\n\n## Detailed testing steps\n\n1. **Before (fix reverted):** the four new error-path cases fail — `stop()` returns `{ error: 'stop failed' }` instead of `{ son\",\"number\":31456,\"body\":\"## Summary\\n\\nWhen `WEB_FETCH` fails upstream (blocked host, timeout, non-2xx), its failure text now names the keyless `WEB_SEARCH` tool as the next step instead of a generic failure, so the planner routes to search rather than retrying the same URL. Test added in `web-fetch.test.ts`.\\n\\nDerived from `nubsstableDONOTDELETE` ba32ebbff34 (live-gated 2026-09-14, part of #31031; carved out as a standalone change).\\n\\n## Verification\\n\\n- `plugins/plugin-coding-tools` `src/actions/web-fetch.test.ts` passes (see the PR checks for the full suite).\\n- Live: the BTC price turns on 2026-09-15 (API tj-16a90fa182b575, Discord tj-17237dd4a2649c) used `WEB_FETCH` on CoinGecko successfully; the fallback text is exercised by the unit test.\\n\\nModel attribution: Claude Fable 5.1 (`claude-fable-5-1`) via Claude Code.\\n\\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-15T22:51:32Z\",\"mergedAt\":null,\"additions\":17,\"deletions\":4},{\"id\":\"PR_kwDOMT5cIs8AAAABESf6mg\",\"title\":\"test(google): assert OAuth walk bounds without timing thresholds\",\"author\":\"lalalune\",\"number\":31925,\"body\":\"$57\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T06:56:55Z\",\"mergedAt\":\"2026-09-20T07:26:00Z\",\"additions\":16,\"deletions\":23},{\"id\":\"PR_kwDOMT5cIs8AAAABESRv6w\",\"title\":\"test(homepage): simplify smoke fixtures and capture lifecycle checks\",\"author\":\"lalalune\",\"number\":31905,\"body\":\"$58\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T05:41:53Z\",\"mergedAt\":\"2026-09-20T05:54:02Z\",\"additions\":16,\"deletions\":105},{\"id\":\"PR_kwDOMT5cIs8AAAABER6Uwg\",\"title\":\"test(lifeops): verify approved agreement pins in planner state\",\"author\":\"lalalune\",\"number\":31883,\"body\":\"$59\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T03:42:20Z\",\"mergedAt\":\"2026-09-20T04:22:21Z\",\"additions\":14,\"deletions\":3},{\"id\":\"PR_kwDOMT5cIs8AAAABDr1e7w\",\"title\":\"fix(core): recognize today's date in the grounded clock question guard\",\"author\":\"NubsCarson\",\"number\":31457,\"body\":\"$5a\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-15T22:52:07Z\",\"mergedAt\":null,\"additions\":11,\"deletions\":1},{\"id\":\"PR_kwDOMT5cIs8AAAABEU6ONg\",\"title\":\"test(cloud): consolidate A2A admission coverage and reject empty selections\",\"author\":\"lalalune\",\"number\":31985,\"body\":\"$5b\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T18:01:49Z\",\"mergedAt\":\"2026-09-20T18:11:51Z\",\"additions\":8,\"deletions\":38},{\"id\":\"PR_kwDOMT5cIs8AAAABEUj7zA\",\"title\":\"test(cloud): make cancellation backoff fixture deterministic\",\"author\":\"lalalune\",\"number\":31961,\"body\":\"The cancellation-during-backoff fixture assumed a 1-second initial retry delay guaranteed time for a 20ms cancellation. Full jitter legitimately permits zero delay, so retries could finish first and make CI flaky.\\n\\nReturn HTTP 503 with `Retry-After: 1` from the real local server and force zero random jitter in this test. Preserve exact cancellation-reason identity and the one-request assertion; production transport is unchanged.\\n\\nValidation:\\n- Negative control: zero jitter without Retry-After fails because the request resolves before cancellation.\\n- Full transport file: 19 passed, 74 assertions.\\n- Biome and git diff whitespace checks passed.\\n\\nCloses #31960.\\n\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T16:36:03Z\",\"mergedAt\":\"2026-09-20T19:31:43Z\",\"additions\":8,\"deletions\":2},{\"id\":\"PR_kwDOMT5cIs8AAAABEScNAQ\",\"title\":\"test(website-blocker): simplify fixtures and verify refreshed status\",\"author\":\"lalalune\",\"number\":31919,\"body\":\"$5c\",\"repository\":\"elizaos/eliza\",\"createdAt\":\"2026-09-20T06:37:26Z\",\"mergedAt\":\"2026-09-20T07:08:22Z\",\"additions\":8,\"deletions\":17},{\"id\":\"PR_kwDOMT5cIs8AAAA
