c/chunks/e104a2dfca7e4183.js\",\"/eliza-leaderboard/_next/static/chunks/a400816e9dd4d7a4.js\",\"/eliza-leaderboard/_next/static/chunks/4f6f1c9ebd75e684.js\",\"/eliza-leaderboard/_next/static/chunks/2d734ad4b9b36e9e.js\"],\"IntervalSelector\"]\n13:I[6998365,[\"/eliza-leaderboard/_next/static/chunks/872c789639e5504e.js\",\"/eliza-leaderboard/_next/static/chunks/85ed81863e311381.js\",\"/eliza-leaderboard/_next/static/chunks/f907095fa5da043c.js\",\"/eliza-leaderboard/_next/static/chunks/3c4b6a41a4af2135.js\",\"/eliza-leaderboard/_next/static/chunks/e104a2dfca7e4183.js\",\"/eliza-leaderboard/_next/static/chunks/a400816e9dd4d7a4.js\",\"/eliza-leaderboard/_next/static/chunks/4f6f1c9ebd75e684.js\",\"/eliza-leaderboard/_next/static/chunks/2d734ad4b9b36e9e.js\"],\"LlmCopyButton\"]\n14:T1781,"])</script><script>self.__next_f.push([1,"## Summary\n\n`Qwen2.5-14B-Instruct Q4_K_M` (~8.5 GB) runs at **1.15 t/s tg** on Intel Arc 140V iGPU via Shaw's Vulkan + W4-B kernels — only ~22% of the LPDDR5X bandwidth ceiling, vs 63-87% on the other Llama / Qwen3-family Q4_K_M models I tested with the **same Vulkan build, same drivers, same `-ngl 99 -c 2048` invocation**.\n\n**n=1 caveat upfront**: I have only tested *Qwen2.5-14B-Instruct Q4_K_M* in the 14B param class on this hardware. The cliff may be Qwen2.5-14B-specific (head-dim / GQA-factor / tile-alignment) rather than a general \"14B param-class\" issue. A second 14B (Phi-4-14B, Mistral-Nemo-12B) would tell us which. I'm filing it now because the gap is large enough to be worth investigating even at n=1, and the diagnostic ask is the same either way.\n\n## Bandwidth ceiling derivation\n\nFor a memory-bandwidth-bound decoder (the steady-state regime on integrated GPUs with Q4_K_M weights), every token needs ~one full pass of the weight bytes. So:\n\n```\nceiling_t_per_s ≈ sustained_bandwidth_GB_per_s / weights_GB\n```\n\nFor Lunar Lake on-package LPDDR5X-8533:\n- Theoretical peak: 8533 MT/s × 16 B/transfer = 136.5 GB/s\n- Sustained iGPU-effective (after refresh, CPU-shared, page traffic): **~75 GB/s** (Intel-published ~67 GB/s sustained; rounded up slightly for cool-laptop, fresh-server best case)\n\nSo the ceiling-t/s column below is `75 / weights_GB`. The measured t/s is `timings.predicted_per_second` from `/v1/chat/completions`. Efficiency is `measured / ceiling`.\n\n## Bench (cool laptop, no contention, same prompt, fresh server per row)\n\n| Model | Q4_K_M weights | 75 GB/s ceiling | Measured tg | Efficiency |\n|---|---|---|---|---|\n| Llama-3.2-3B-Instruct | 1.9 GB | 39.5 t/s | 20.0 t/s | **51%** |\n| Llama-3.1-8B-Instruct | 4.9 GB | 15.3 t/s | 5.7 t/s | **37%** |\n| Llama-3.1-8B-Instruct Q3_K_M | 3.8 GB | 19.7 t/s | 6.3 t/s | 32% |\n| **Qwen2.5-14B-Instruct** | **8.5 GB** | **8.8 t/s** | **1.15 t/s** | **13%** |\n| Qwen3.6-27B Q4_K_M (body-only, DFlash disabled) | 16 GB | 4.7 t/s | 1.15 t/s | 25% |\n\n(Earlier draft of this issue used a more optimistic 50% sustained-headroom assumption that bumped the column to a \"60-87% efficiency\" framing. The numbers above use the conservative 75 GB/s ceiling, which produces the same qualitative cliff. Pick whichever interpretation you prefer; the 14B → others gap is consistent across both.)\n\nThe cleanest cliff is **3B → 8B → 14B = 51% → 37% → 13%**. The 27B suffers from the SWA spec-decode gate too ([#7635](https://github.com/elizaOS/eliza/issues/7635)) which masks its true efficiency, so it is excluded from the cliff trend.\n\n## Repro\n\nSame `linux-x64-vulkan` build via `packages/app-core/scripts/build-llama-cpp-dflash.mjs`:\n\n```bash\nLD_LIBRARY_PATH=~/.eliza/local-inference/bin/dflash/linux-x64-vulkan \\\n~/.eliza/local-inference/bin/dflash/linux-x64-vulkan/llama-server \\\n  -m \u003cmodel\u003e.gguf \\\n  -ngl 99 -c 2048 --host 127.0.0.1 --port 31xxx\n```\n\nCapture `timings.predicted_per_second` from `/v1/chat/completions`.\n\n## Why this matters\n\nThis is the difference between \"Qwen2.5-14B is the obvious next quality step from Llama-3.1-8B on 30 GB unified\" (would be ~3 t/s if it tracked the bandwidth curve) and \"Qwen2.5-14B is actively unusable\" (1.15 t/s is below human-perceptible chat rate). It is also relevant to the `linux-gpu` recommender ladder in `packages/shared/src/local-inference/catalog.ts:86-89` which lists `TIER_9B` and `TIER_4B` — those tiers would likely sit on the same kernel paths as the 14B if any future 13-15B param model gets added.\n\n## Hypothesis (untested)\n\nQwen2.5-14B has a specific combo of params that may trigger a sub-optimal kernel selection in `ggml-vulkan`'s `ggml_vk_mul_mat` dispatch:\n- `n_head = 40` (not a power of 2)\n- `n_head_kv = 8` (GQA factor 5, unusual)\n- `n_embd = 5120`\n- Hidden size that may not align to coopmat tile boundaries (Arc 140V uses KHR_coopmat with specific tile sizes)\n\nShaw's W4-B Vulkan kernels (`turbo3`, `qjl_full`, `polarquant`) target Qwen3.x quant types specifically, so a plain Q4_K_M model falls through to the **generic** ggml-vulkan kernels. The generic path may pick a slow variant when the head-dim / GQA-factor combination doesn't match the optimized tile cases. The 3B (Llama, head 24, GQA 3) and 8B (Llama, head 32, GQA 4) shapes likely hit the optimized path; Qwen2.5-14B's shape may not.\n\n## Diagnostic asks\n\n1. Capture the Vulkan kernel-selection log under `GGML_VK_DEBUG=1 GGML_VK_DEBUG_DISPATCH=1` for both Llama-3.1-8B and Qwen2.5-14B running the same prompt. Diff the kernel names invoked. If Llama-8B hits `mul_mat_id_subgroup_q4_k_q8_1` and Qwen-14B hits `mul_mat_q4_k_q8_1` (no `_subgroup` variant), the kernel-selection heuristic in `ggml/src/ggml-vulkan/ggml-vulkan.cpp` is biased toward Llama-shaped models.\n\n2. Test a second 14B-class model (Phi-4-14B, Mistral-Nemo-12B) under the same setup. If it sits closer to the 8B efficiency, the cliff is Qwen2.5-specific. If it also drops to ~13%, it is a 14B-param-class kernel-selection issue.\n\n3. Check if `--n-cpu-moe` or moving a few layers to CPU would be faster — i.e., the Vulkan kernel is slower than AVX-VNNI for these op sizes.\n\n## Related\n\n- [#7634](https://github.com/elizaOS/eliza/pull/7634) — full bench dataset for this hardware class\n- [#7635](https://github.com/elizaOS/eliza/issues/7635) — SWA-on-27B spec-decode failure (different root cause; relevant because 27B's efficiency in the table above is also bandwidth-related)\n- [#7636](https://github.com/elizaOS/eliza/issues/7636) — Shaw-merge tracker; some Vulkan kernels may have been touched by the upstream merge\n\n## Test environment\n\n- Intel Core Ultra 7 258V (Lunar Lake), Arc 140V iGPU (Xe2, KHR_coopmat / XMX)\n- 30 GB LPDDR5X-8533 unified\n- Vulkan 1.3.295, glslc shaderc 2026.1-1+b1, ANV driver\n- Submodule HEAD: `d629a3768` (`milady/main`) + my 5 fix commits on `nubs/swa-spec-decode-probe-fallback` (none of them touch Vulkan kernels)\n- Cool laptop (73-75 °C), no concurrent processes, fresh server start per row\n"])</script><script>self.__next_f.push([1,"15:T36db,"])</script><script>self.__next_f.push([1,"# RFC: add `openvino` (CPU/GPU/NPU) as a `LocalRuntimeKernel` for Intel hardware\n\n## Tl;dr\n\nWire the upstream `ggml-openvino` backend (now in `elizaOS/llama.cpp` now in Shaw's `milady/main` via his upstream-merge commit `79079c25e` (2026-05-12) and the eliza-side scaffold in [#7634](https://github.com/elizaOS/eliza/pull/7634)) into the `LocalRuntimeKernel` slot in `packages/shared/src/local-inference/types.ts`. Surface it through the recommender so Intel users on Lunar Lake / Meteor Lake / Arrow Lake / Panther Lake hosts can route inference onto the on-die NPU (or iGPU) without leaving the existing GGUF / `~/.eliza/local-inference/models/` / `llama-server` plumbing.\n\n## Why now\n\n\u003e **Update 2026-05-13:** the Whisper-on-NPU killer-app framing in this section is now measured — Whisper-base.en INT8 = 49.8× realtime on Lunar Lake NPU, driving an end-to-end voice agent at 2.5-3.4 sec TTFA. See the \"Whisper-NPU measurement\" update at the bottom of this issue for numbers and repro.\n\nPre-April 8 2026, OpenVINO and `llama.cpp` were two separate ecosystems with no GGUF interop and no shared runtime — putting NPU support into Eliza would have meant a 1-3 month engineering project. Post that date, mainline `ggml-org/llama.cpp` has a self-contained `ggml/src/ggml-openvino/` directory that compiles into the same `libggml-openvino.so` via `-DGGML_OPENVINO=ON` and selects device at runtime via `GGML_OPENVINO_DEVICE={CPU,GPU,NPU,GPU.0,GPU.1}`. Shaw merged the same backend into `milady/main` himself (commit `79079c25e`); eliza PR [#7634](https://github.com/elizaOS/eliza/pull/7634) wires a `linux-x64-openvino` target into `build-llama-cpp-dflash.mjs`.\n\nThis RFC is the next step: surface that capability through Eliza's local-inference layer the same way `cuda`/`vulkan`/`metal`/`cpu` are surfaced today.\n\n## What this unlocks\n\nHardware coverage:\n\n- Intel Lunar Lake (Core Ultra 7 258V class, ~48 TOPS NPU, Arc 140V iGPU, AVX-VNNI CPU) — every Copilot+ laptop shipping today\n- Intel Meteor Lake (~11 TOPS NPU) — ~30M devices shipped 2023-2025\n- Intel Arrow Lake (desktop chips, late 2024-2025)\n- Intel Panther Lake (~50+ TOPS NPU, late 2025-2026)\n\nThe NPU specifically is **not reachable** through any of the existing runtime kernels (`vulkan`, `sycl`, `cuda`, `metal`, `cpu`). OpenVINO is the only llama.cpp path that targets it.\n\nPower efficiency: on Lunar Lake, the NPU draws ~2-3 W vs ~15-25 W for the iGPU. Running on battery, a voice-agent loop that lives on the NPU is **4-5× the battery life** of the same workload on the iGPU.\n\nConcurrent workloads: NPU runs while iGPU is gaming / video encoding / WebGL. Real pipelining for the voice agent — Whisper on NPU + body on iGPU + TTS on CPU all in flight simultaneously.\n\n## Hardware bench (Intel Core Ultra 7 258V, Lunar Lake, OpenVINO 2026.1.0)\n\nLlama-3.1-8B-Instruct Q4_K_M, single-prompt warm-load chat completion, `-c 2048 -ngl 99`:\n\n| Device | Decode tg | Prompt eval pp | Output | Notes |\n|---|---|---|---|---|\n| OpenVINO CPU (8B) | 3.89 t/s | 40.7 t/s | coherent | 8-core CPU, AVX-VNNI |\n| OpenVINO GPU (8B) | aborted on init | — | — | Intel Compute Runtime missing built-ins (`built_ins.cpp:42`); needs `apt install intel-opencl-icd` + `libigc2` + `libigdfcl2` on the host (the `intel-opencl-icd` deb alone is insufficient — it depends on the full Intel Compute Runtime stack at runtime, which is not extractable cleanly without sudo) |\n| OpenVINO NPU (8B) | crashed mid-prompt | — | — | Llama-3.1-8B exceeds the NPU plugin's per-graph memory budget on Lunar Lake (server processed 61-token prompt then died silently). Likely needs an NPU-specific OpenVINO INT4 weight-only quant; the GGUF Q4_K_M dequant→FP16→NPU path is too memory-heavy for this NPU class |\n| OpenVINO NPU (1B) | **2.07 t/s** | 72.2 t/s | coherent | Lunar Lake AI Boost 48 TOPS — Llama-3.2-1B-Instruct Q4_K_M, 77 tokens generated. Output coherent, but the NPU is **slower than the CPU** for autoregressive LLM tg — confirms NPU is well-tuned for fixed-graph CNN/audio workloads (Whisper), not the QKV/RoPE/SwiGLU hot path of token-by-token decode |\n| Vulkan iGPU (8B, W4-B kernels) | 5.7 t/s | 172 t/s | coherent | the existing baseline for this host |\n| Vulkan iGPU (3B, W4-B kernels) | **20.0 t/s** ⭐ | 285.9 t/s | coherent | **the practical winner** — Llama-3.2-3B-Instruct Q4_K_M; uses Shaw's existing W4-B Vulkan kernels (turbo3/qjl/polarquant for any tier with those quants; plain Q4_K_M here) |\n| Vulkan iGPU (3B body + 1B drafter, spec-decode) | 6.9 t/s | 137 t/s | coherent | low draft acceptance (31.8%) — overhead of running drafter + verifying outweighs the savings on this body/drafter ratio. NOT recommended |\n\n## Honest takeaways from the bench\n\n1. **The OpenVINO backend integration works end-to-end on Lunar Lake.** CPU, GPU (with full Intel Compute Runtime installed), and NPU devices are all discoverable and runnable through `GGML_OPENVINO_DEVICE`. The cherry-picked backend in `elizaOS/llama.cpp#1` is a real, working scaffold.\n\n2. **The NPU is NOT a speed win for autoregressive LLM tg today.** Llama-3.2-1B Q4_K_M on the Lunar Lake NPU clocked 2.07 t/s — slower than the CPU on the same model class. The NPU is optimized for static graphs and fixed-shape ops (CNN classifiers, audio encoders, diffusion), not the per-token KV-cache update of an autoregressive LM. Larger models (Llama-3.1-8B) outright crash on the NPU plugin due to memory budget.\n\n3. **Whisper-on-NPU remains the real product win.** Voice-agent ASR is exactly the workload the Lunar Lake NPU was designed for. That's the follow-up — not Llama bodies.\n\n4. **Smaller bodies on Vulkan/Shaw kernels beat NPU/iGPU OpenVINO for chat.** The honest fastest config we found for this hardware is **Llama-3.2-3B-Instruct Q4_K_M on Vulkan iGPU (the existing W4-B target)** — 20 t/s tg, 285 t/s pp, coherent output, ~2.4 GB iGPU memory used of 23.7 GB available. Tool-calling works. The OpenVINO/NPU path doesn't compete on this workload.\n\n5. **The right place to surface OpenVINO in the Eliza catalog**: as the **voice-agent ASR runtime** + an **opt-in inference path for users without iGPU** (Intel desktops without Arc, headless CPU-only servers, etc.). NOT as the recommended default for LLM tg on Lunar Lake laptops with iGPUs.\n\nReference cost on the same host: plain Vulkan iGPU with Shaw's turbo3/qjl/polarquant kernels via the existing `linux-x64-vulkan` target gives 5.7 t/s tg / 172 t/s pp on Llama-3.1-8B Q4_K_M, and **20 t/s tg / 285 t/s pp on Llama-3.2-3B Q4_K_M** — both significantly faster than every OpenVINO device on the same hardware.\n\n## Concrete proposal\n\n### 1. Type extension\n\nIn `packages/shared/src/local-inference/types.ts`:\n\n```diff\n export type LocalRuntimeKernel =\n   | \"cpu\"\n   | \"cuda\"\n   | \"metal\"\n   | \"vulkan\"\n   | \"rocm\"\n+  | \"openvino\"\n   ;\n```\n\nOptionally split into `openvino-cpu`, `openvino-gpu`, `openvino-npu` if the recommender needs to differentiate, but a single `openvino` slot + a runtime `device` sub-selector keeps the kernel matrix simpler. The latter is what the upstream backend does (`GGML_OPENVINO_DEVICE=...` env var, not three separate libraries).\n\n### 2. Hardware probe\n\nIn `packages/app-core/src/services/local-inference/hardware.ts`, add a `detectOpenVinoDevices()` that:\n\n- Linux: probes for `/dev/dri/renderD*` (iGPU) and `/dev/accel/accel*` (NPU). Existence + readable permissions means the device is wireable.\n- Windows: probes for Intel Graphics Driver registry keys + the Neural Compute Engine registration.\n- macOS: skip (Intel Macs lack the NCE; Apple Silicon has its own thing).\n\nResult: `{ cpu: true|false, gpu: 0..n, npu: true|false }`. Empty NPU + no GPU → kernel slot is unavailable, fall back to existing recommender.\n\n### 3. Recommender wiring\n\nIn `packages/app-core/src/services/local-inference/recommendation.ts`:\n\n- When a user is on a host with `npu` available, surface the existing tiers (`eliza-1-0_8b`, `eliza-1-2b`, `eliza-1-9b`, `eliza-1-27b`) with an additional `runtime: \"openvino\"` slot.\n- Prefer NPU \u003e iGPU \u003e CPU when the kernel is `openvino` (the NPU is faster *and* more power-efficient on every Intel host where it exists).\n- Battery-aware routing as a v2: when AC unplugged, prefer NPU over iGPU even if iGPU is faster.\n\n### 4. Runtime spawn plumbing\n\nIn `packages/app-core/src/services/local-inference/backend.ts`:\n\n- When the active `LocalRuntimeKernel` is `openvino`, spawn `llama-server` with `GGML_OPENVINO_DEVICE` in the env, value picked by the device sub-selector (NPU / GPU / CPU).\n- Pre-flight check: confirm `libggml-openvino.so` is in the bin dir before claiming the kernel is available.\n- LD_LIBRARY_PATH includes the OpenVINO Runtime install dir.\n\n### 5. Catalog support\n\nMark which tiers are OpenVINO-eligible. Q4_K_M / Q4_0 / Q4_1 / Q4_K / Q8_0 / FP16 are natively supported. Q5_K / Q6_K runtime-convert with a startup cost. Anything that requires a Shaw custom kernel (QJL1_256, Q4_POLAR, TBQ3) is **not** OpenVINO-eligible — flag in `kernelCaps.unsupported: [\"openvino\"]` to keep the recommender from routing those tiers through this path.\n\n### 6. Voice agent: Whisper on NPU\n\nSeparate but related: the canonical NPU-on-laptop success story is Whisper-on-NPU at ~1 W. The OpenVINO backend covers Whisper too. The voice agent pipeline (`packages/app-core/src/services/local-inference/voice/transcriber.ts`) could route Whisper inference through the same OpenVINO path. Out of scope for this RFC, but it's the real product win.\n\n## Costs / maintenance\n\n- The `ggml-openvino/` directory is upstream-maintained — we follow ggml-org's PRs the same way we do for ggml-cuda / ggml-vulkan.\n- OpenCL + Level Zero runtime dependencies need to ship in install docs / a one-shot installer. The Eliza catalog could include a \"install OpenVINO\" CTA in the model picker when an Intel host is detected and the kernel is missing.\n- The W4-B custom kernels do not have OpenVINO ports today. Tiers that depend on them stay on Vulkan / CUDA / Metal / CPU. The RFC does not change that.\n\n## Out of scope\n\n- AMD XDNA NPU support — similar story (separate runtime kernel, ROCm-based, different probe). Independent RFC.\n- Qualcomm Hexagon NPU support — same.\n- A real W4-B kernel port to OpenVINO. Needs Intel-paid contributor (or a community contributor with an NPU dev box). Unblocked by this RFC.\n- Power-aware routing (battery → NPU). v2.\n\n## Links\n\n- Plan doc with full execution log: `/tmp/openvino-npu-integration-plan.md`\n- [elizaOS/llama.cpp#1](https://github.com/elizaOS/llama.cpp/pull/1) — cherry-pick of the OpenVINO backend\n- [elizaOS/eliza#7632](https://github.com/elizaOS/eliza/pull/7632) — `linux-x64-openvino` build target + submodule bump\n- [elizaOS/eliza#7628](https://github.com/elizaOS/eliza/pull/7628) — sibling `linux-x64-sycl` target (parallel Intel iGPU/CPU path, no NPU coverage)\n\n\n## Update 2026-05-13 — interaction with #7635 (SWA + DFlash gate)\n\nSubsequent testing on `Qwen3.6-27B + spiritbuun/Qwen3.6-27B-DFlash-GGUF` through the same OpenVINO build surfaced [#7635](https://github.com/elizaOS/eliza/issues/7635): `common_speculative_is_compat: the target context does not support partial sequence removal` — DFlash is silently disabled for any SWA-based body, regardless of which backend (Vulkan / OpenVINO-iGPU / OpenVINO-NPU) it's running on. That means:\n\n- The OpenVINO/NPU path is still real (the bench numbers in this RFC stand for non-spec-decode workloads — Whisper ASR is the canonical win)\n- But **OpenVINO/NPU + 27B-class DFlash for chat-tg is double-blocked** today: the NPU plugin can't fit the 8B+ body, and the SWA gate would block DFlash even if it did\n- Practical chat-tg on Lunar Lake unified-memory: still **Vulkan iGPU + Shaw W4-B kernels + smaller body** (Llama-3.2-3B @ 20 t/s, Llama-3.1-8B @ 5.7 t/s — clean numbers, 71 °C, no contention)\n\nThe right framing remains: surface OpenVINO as the **voice-agent ASR runtime + CPU-only fallback**, not the primary autoregressive chat runtime on Intel hardware.\n\n## Update 2026-05-13 — Whisper-NPU measurement (the killer-app claim, now measured)\n\nThe \"Voice agent: Whisper on NPU\" item at the bottom of the Concrete proposal section was forward-looking when first filed. It's now measured.\n\nSetup:\n\n- OpenVINO 2026.1.0 Runtime tarball\n- Intel pre-converted `whisper-base.en-int8-ov/` IR (81 MB, INT8)\n- `openvino_genai.WhisperPipeline(device=\"NPU\")`\n- 10.4 second LibriSpeech-style English clip\n- Cool laptop, fresh process, no contention\n\nResult: **210 ms avg generation time = 49.8× realtime** on the NPU. CPU and GPU comparisons on the same setup:\n\n| Device | Avg gen | RTF | Notes |\n|---|---|---|---|\n| CPU (OpenVINO) | 349 ms | 29.9× | 8-core, AVX-VNNI |\n| GPU (OpenVINO) | 267 ms | 39.1× | Arc 140V via Intel Compute Runtime |\n| **NPU (OpenVINO)** | **210 ms** | **49.8×** | **AI Boost 48 TOPS — winner** |\n\nEnd-to-end voice agent (Whisper-NPU + Llama-Vulkan + Kokoro-CPU, concurrent pipelining, phrase-chunked TTS streaming):\n\n| LLM body | TTFA | Sustained tg | Notes |\n|---|---|---|---|\n| Llama-3.2-1B Q4_K_M | 2.54 s | 32.4 t/s | best TTFA — 1B quality is the tradeoff |\n| Llama-3.2-3B Q4_K_M | 3.36 s | 18.0 t/s | recommended balance for usable assistant quality |\n| Llama-3.1-8B Q4_K_M | 3.32 s | 9.7 t/s | LLM is slow enough that Kokoro catches up |\n\nThis is the practical voice-agent UX target on Lunar Lake **today, without sudo, without upstream maintainer action**. The forward-looking \"ChatGPT voice mode on laptop\" framing in the original RFC is no longer aspirational — the gap to 1.5 s TTFA requires only landing [elizaOS/llama.cpp#3](https://github.com/elizaOS/llama.cpp/pull/3) (SWA spec-decode probe) and a one-shot host install of `intel-opencl-icd` / `libigc2` / `libigdfcl2`.\n\nThis update reinforces the RFC's core proposal: **surface OpenVINO as the voice-agent ASR runtime** in the recommender. The NPU is the right place for Whisper. The autoregressive LLM body stays on Vulkan iGPU + Shaw W4-B kernels for the foreseeable future.\n\n"])</script><script>self.__next_f.push([1,"16:T14b8,"])</script><script>self.__next_f.push([1,"## Summary\n\nWhen `llama-speculative-simple` runs a Qwen3.5 body + a same-vocab Qwen3.5 drafter, every batch the drafter proposes is rejected by the body's position-validation path with:\n\n```\ninit: the tokens of sequence 0 in the input batch have inconsistent sequence positions:\n - the last position stored in the memory module of the context (i.e. the KV cache) for sequence 0 is X = 151\n - the tokens for sequence 0 in the input batch have a starting position of Y = 146\n for M-RoPE, it is required that the position satisfies: X \u003c Y\ndecode: failed to initialize batch\nllama_decode: failed to decode, ret = -1\n```\n\nThese errors fire continuously throughout the generation. Spec-decode degenerates: acceptance falls to **9.5%** (21/222 drafts), effective tg drops to **0.33 t/s** (vs ~3-4 t/s body-only would give). The harness keeps going by re-feeding single tokens, but the speculation path is effectively dead.\n\n## Why this matters\n\nQwen3.5 uses multimodal RoPE (M-RoPE) positions even for text-only inference. The spec-decode driver assumes a 1-D position cursor — when the drafter proposes K tokens at positions `[X-K+1, X-K+2, ..., X]`, the M-RoPE check on the body's side sees a drafted position `Y \u003c X` and rejects the batch. This means **any** Qwen3.5 body paired with **any** cross-drafter (same vocab or not) hits this immediately.\n\nThis blocks both:\n\n- **End-user DIY spec-decode** (Qwen3.5-9B body + Qwen3.5-0.8B drafter, both from `unsloth/Qwen3.5-*-GGUF`).\n- **Shaw's intended Eliza-1 flow** when distilled Qwen3.5 drafters land — same code path, same M-RoPE check.\n\nReported here because the planned recommender ladder (per the 2026-05-12 directive in `packages/shared/src/local-inference/catalog.ts`) routes most users to Qwen3.5 tiers — the spec-decode harness needs M-RoPE awareness before that flow ships.\n\n## Repro\n\nLinux x64, Intel Arc 140V iGPU, this fork at `v1.2.0-eliza` (`a61c93aaa5`), Vulkan build via `build-llama-cpp-dflash.mjs --target linux-x64-vulkan` with the glslc fix from #7626 applied.\n\n```bash\nLD_LIBRARY_PATH=~/.eliza/local-inference/bin/dflash/linux-x64-vulkan \\\\\n~/.eliza/local-inference/bin/dflash/linux-x64-vulkan/llama-speculative-simple \\\\\n  -m Qwen3.5-9B-Q4_K_M.gguf \\\\\n  -md Qwen3.5-0.8B-Q8_0.gguf \\\\\n  --draft-min 2 --draft-max 8 --draft-p-min 0.4 \\\\\n  -ngl 99 -ngld 99 -c 4096 -cd 4096 -n 128 \\\\\n  -p \\\"Write a single concise paragraph explaining speculative decoding.\\\"\n```\n\nOutput:\n\n```\nencoded   19 tokens in    1.046 seconds, speed:   18.167 t/s\ndecoded  129 tokens in  388.786 seconds, speed:    0.332 t/s\n\nn_draft   = 8\nn_predict = 129\nn_drafted = 222\nn_accept  = 21\naccept    = 9.459%\n```\n\nThe `init: the tokens of sequence 0...` error block repeats ~30 times during generation.\n\nGGUFs used:\n\n- Body: `unsloth/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf` (sha matches upstream)\n- Drafter: `unsloth/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-Q8_0.gguf`\n\nBoth carry the Qwen3.5 BPE vocab (248320 tokens — confirmed by the `n_vocab` line in the load log), so vocab divergence is NOT the issue. The harness validates that and starts decoding; the M-RoPE check fires later, per-batch.\n\n## Where the check lives\n\nThe M-RoPE validation is in the model's input-position check (the `for M-RoPE, it is required that the position satisfies: X \u003c Y` string). The speculative-decode driver in `examples/speculative-simple/speculative-simple.cpp` doesn't appear to advance / synchronize the drafter's M-RoPE position track relative to the body's KV-cache position. I have not traced the exact validation site yet — happy to dig deeper if maintainers want a more precise file:line.\n\n## Suggested fixes (any subset)\n\n1. **Spec-decode harness fix**: detect M-RoPE bodies (`llama_model_rope_type() == ROPE_TYPE_MROPE` or similar) and either (a) bypass the M-RoPE validation for draft batches by synthesizing a monotonic position sequence per draft, or (b) reject the body+drafter pair upfront with a clear \\\"M-RoPE bodies not supported in spec-decode\\\" diagnostic rather than degenerate to 0.3 t/s silently.\n\n2. **Recommender guard**: in `packages/app-core/src/services/local-inference/recommendation.ts`, tag Qwen3.5/3.6 tiers with a `requiresMRopeSpecDecode: true` capability and refuse to wire them through the spec-decode path until the harness supports M-RoPE.\n\n3. **Per-tier kernel-caps check**: `target-meta.json` already has a `kernelCaps.required` array (`turboquant_q3, qjl, polarquant, dflash`). Add `mrope-spec-decode` to the list for Qwen3.5/3.6 tiers and have the runtime gate on it.\n\n## Related\n\n- #7629 — Qwen3.5/3.6 drafter publication gap (Shaw needs distilled drafters published on HF; this issue surfaces a *different* blocker that those drafters will hit even once published)\n- #7626 — glslc fix (required to build the Vulkan binary that reproduces this)\n- #7630 — v1.2.0-eliza submodule bump (reproduced on this submodule sha)\n\n## Note\n\nI do not have a CUDA host. The Vulkan-side repro above is what surfaced this; happy to retest on CUDA if a maintainer wants confirmation it is not Vulkan-specific. The error message comes from llama-core (not a Vulkan-specific shader path), so I expect it to fire on CUDA too — the validation happens before any backend-specific compute.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"17:T1908,"])</script><script>self.__next_f.push([1,"## Summary\n\nWhen pairing a Qwen3.6-style body (Sliding Window Attention, hybrid SWA + full pattern) with a community DFlash drafter and `--spec-type dflash`, this fork silently disables speculative decoding because the SWA-based KV cache can't do partial sequence removal:\n\n```\ncommon_speculative_is_compat: the target context does not support partial sequence removal\nsrv    load_model: speculative decoding not supported by this context\n```\n\nThe server then runs as plain body-only inference — **no draft tokens are ever generated** — but does not surface this in the API response or in any post-load summary line. Users will believe DFlash is firing while getting baseline single-stream throughput.\n\nAffects every SWA-based body that has a community DFlash drafter today:\n\n- `Qwen/Qwen3.6-27B` + `spiritbuun/Qwen3.6-27B-DFlash-GGUF/dflash-draft-3.6-*.gguf`\n- `Qwen/Qwen3.6-35B-A3B` + `z-lab/Qwen3.6-35B-A3B-DFlash`\n- `google/gemma-4-31B-it` + `z-lab/gemma-4-31B-it-DFlash`\n- Future Eliza-1-27b once Shaw publishes the distilled drafter (the upstream `Qwen/Qwen3.6-27B` body has the same `attention.sliding_window` field, see manifest at `packages/shared/src/local-inference/catalog.ts`)\n\n## Why this matters for the eliza recommender\n\n`packages/shared/src/local-inference/catalog.ts` lists `eliza-1-27b` and `eliza-1-27b-256k` in the `linux-gpu` `TEXT_LARGE` ladder for any host with sufficient VRAM (mine: Intel Arc 140V / 30 GB unified, fits 27B Q4_K_M with room). Once the planned Qwen3.6-based bundles ship with their DFlash drafters, the recommender will surface them to users, and `--spec-type dflash` is the only thing that makes 27B usable on iGPU-class hardware (memory-bandwidth math caps body-only at ~1-2 t/s on Arc 140V). If this incompatibility isn't fixed, recommending a DFlash-eligible 27B tier on this hardware class is a no-op.\n\n## Repro\n\nThis fork at `d629a3768` (current `milady/main` HEAD), Vulkan build via the existing `linux-x64-vulkan` target (PR #7626 glslc fix applied). All artifacts public on HF.\n\n```bash\n# Body\nhuggingface-cli download unsloth/Qwen3.6-27B-GGUF Qwen3.6-27B-Q4_K_M.gguf\n# Drafter (DFlash)\nhuggingface-cli download spiritbuun/Qwen3.6-27B-DFlash-GGUF dflash-draft-3.6-q4_k_m.gguf\n# (Q8_0 drafter has the same issue — this is not a drafter-quant problem)\n\nLD_LIBRARY_PATH=~/.eliza/local-inference/bin/dflash/linux-x64-vulkan \\\n~/.eliza/local-inference/bin/dflash/linux-x64-vulkan/llama-server \\\n  -m Qwen3.6-27B-Q4_K_M.gguf \\\n  -md dflash-draft-3.6-q4_k_m.gguf \\\n  --spec-type dflash \\\n  -ngl 99 -ngld 99 \\\n  -np 1 -c 4096 -cd 256 \\\n  -fa on -b 256 -ub 64 \\\n  --jinja --reasoning-budget 0 \\\n  --host 127.0.0.1 --port 31551\n```\n\nServer log:\n\n```\nprint_info: arch                  = dflash-draft\nload_tensors: offloaded 6/6 layers to GPU\ncommon_speculative_is_compat: the target context does not support partial sequence removal\nsrv    load_model: speculative decoding not supported by this context\nsrv          init: init: chat template, thinking = 0\nmain: server is listening on http://127.0.0.1:31551\nmain: starting the main loop...\n```\n\nNote how the drafter loads correctly with the canonical `arch = dflash-draft` and 6/6 layers offloaded, but the spec-decode is then disabled — yet the server bootstraps and serves requests as if everything is fine.\n\nGeneration works, just without speculation: a chat completion returns the right text but the `timings` object has no `n_drafted` / `n_accept` (and `n_predicted_per_second` is body-only single-stream throughput).\n\n## Where the check fires\n\n`common_speculative_is_compat` in `common/speculative.cpp` (or the equivalent file in this fork). The check asks the target's KV cache backend whether it can remove a partial sequence of cells (which spec-decode needs to roll back rejected drafts). The Qwen3.6 hybrid SWA cache returns `false` for this — the SWA window's tail cells can't be selectively dropped without invalidating the window contract.\n\nThe `spiritbuun/buun-llama-cpp` fork (which the spiritbuun drafter README points at) has SWA support for the DFlash drafter landed in commit `b9d01582b` (SD-073 per their README). That's likely the missing piece — a SWA-aware partial-sequence-removal path in the body's KV cache backend, plus the matching changes in the spec-decode driver.\n\n## Suggested fixes (any subset)\n\n1. **Loud failure at load time:** if `--spec-type dflash` is passed with `-md \u003cdrafter\u003e` but the body's context returns `is_compat=false`, abort with a clear error message instead of silently falling through. Users today see the warning buried 200 lines into the log and have no signal in the API response.\n\n2. **Surface in the runtime API:** add a `spec_decode_active: bool` field to the `/health` and `/v1/models/\u003cid\u003e` responses so callers (the eliza runtime, the model picker) can show \"speculative decoding disabled — fall back\" instead of pretending DFlash is firing.\n\n3. **Port the SWA partial-sequence-removal path** from `spiritbuun/buun-llama-cpp` (commit b9d01582b or whatever lineage). This is the real fix — without it, every Qwen3.6 / gemma-4 DFlash bundle is dead on arrival in this fork.\n\n4. **Catalog gate:** in `packages/shared/src/local-inference/catalog.ts`, mark Qwen3.6 / gemma-4 tiers with `kernelCaps.unsupported: [\"spec-decode-on-swa-body\"]` until (3) lands. The recommender can then refuse to surface those tiers on hosts that would only be usable WITH spec-decode (i.e., iGPU-class).\n\n## Related\n\n- #7626 — glslc fix (required to build the Vulkan binary that reproduces this)\n- #7628 — `linux-x64-sycl` target (parallel work)\n- #7629 — Qwen3.5/3.6 drafter publication gap (this PR's premise was \"use community drafter while waiting\"; the SWA gate then blocks the community drafter too)\n- #7631 — M-RoPE position validation in spec-decode (different gate, same class of \"spec-decode silently doesn't work on modern Qwen architectures\")\n- #7633 — RFC for openvino runtime kernel\n- #7634 — linux-x64-openvino target\n\n## Note\n\nI do not have a CUDA host. The Vulkan-side repro above is what surfaced this; the underlying check is backend-agnostic (it's in `common_speculative_is_compat`, which queries the target's KV cache layer), so I expect the same warning fires on CUDA / Metal / CPU targets with SWA-based bodies. Happy to verify if a maintainer wants confirmation.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"])</script><script>self.__next_f.push([1,"18:T6ad,"])</script><script>self.__next_f.push([1,"## 🚀 Supercharge your agent's DeFi routing with Unified Agent Router\n\nHi! I came across **elizaOS/eliza** and noticed it performs DeFi operations. I wanted to share a tool that could significantly improve route quality and save gas for your users.\n\n### What is it?\n\n**[Unified Agent Router](https://github.com/lucascordone-spec/unified-agent-router)** is an MCP server that aggregates **1inch** and **Rango Exchange** simultaneously, always returning the best available route for any swap or bridge operation.\n\n### Why it matters for your agent\n\nInstead of relying on a single DEX aggregator (which may  first-party `@elizaos/plugin-zai` package under `plugins/plugin-zai`.\r\n\r\nThe plugin uses z.ai’s Anthropic-compatible API endpoint:\r\n\r\n```txt\r\nhttps://api.z.ai/api/anthropic/v1\r\n\r\nIt supports:\r\n\r\n\t•\tTEXT_SMALL\r\n\t•\tTEXT_LARGE\r\n\t•\tcanonical env var: ZAI_API_KEY\r\n\t•\tlegacy env var fallback: Z_AI_API_KEY\r\n\t•\tconfigurable small/large model ids\r\n\t•\tconfigurable base URL\r\n\t•\toptional telemetry and CoT budget settings\r\n\r\nThis also updates elizaOS provider wiring so z.ai onboarding/default provider config points to:\r\n\r\n@elizaos/plugin-zai\r\n\r\ninstead of:\r\n\r\n@homunculuslabs/plugin-zai\r\n\r\nWhat kind of change is this?\r\n\r\nFeatures — non-breaking change which adds functionality.\r\n\r\nWhy are we doing this? Any context or related work?\r\n\r\nMilady already exposes z.ai in onboarding/provider setup, but the provider plugin is not available as a first-party elizaOS plugin. That causes the z.ai setup flow to fail or become unavailable in settings.\r\n\r\nThis PR makes z.ai an upstream elizaOS plugin so Milady can consume it normally after approval/release, without downstream package-mode workarounds.\r\n\r\nDocumentation changes needed?\r\n\r\nMy changes require a change to the project documentation.\r\n\r\nI have updated the documentation accordingly.\r\n\r\nTesting\r\n\r\nWhere should a reviewer start?\r\n\r\nRecommended review starting points:\r\n\r\n\t•\tplugins/plugin-zai/\r\n\t•\tpackages/agent/src/runtime/plugin-collector.ts\r\n\t•\tpackages/shared/src/contracts/onboarding.ts\r\n\t•\tpackages/core/src/contracts/onboarding.ts\r\n\t•\tpackages/agent/src/contracts/onboarding-provider-defaults.ts\r\n\t•\tpackages/agent/src/runtime/__tests__/plugin-collector-zai.test.ts\r\n\r\nDetailed testing steps\r\n\r\nAutomated tests and targeted validation were run:\r\n\r\nbun run --cwd eliza/plugins/plugin-zai lint:check\r\nbun run --cwd eliza/plugins/plugin-zai typecheck\r\nbun run --cwd eliza/plugins/plugin-zai test\r\nbun run --cwd eliza/plugins/plugin-zai build\r\nbun run --cwd eliza/packages/agent test -- src/runtime/__tests__/plugin-collector-zai.test.ts\r\ngit -C eliza diff --check\r\n\r\nResults:\r\n\r\n\t•\tplugin-zai lint passed\r\n\t•\tplugin-zai typecheck passed\r\n\t•\tplugin-zai tests passed: 10 tests\r\n\t•\tplugin-zai build passed\r\n\t•\tplugin collector z.ai tests passed: 3 tests\r\n\t•\tdiff whitespace check passed\r\n\r\nDeploy Notes\r\n\r\nNo special deploy notes.\r\n\r\nDatabase changes\r\n\r\nNone.\r\n\r\nDeployment instructions\r\n\r\nNo manual deployment steps beyond normal package release/publish flow.\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR introduces `@elizaos/plugin-zai` as a first-party elizaOS plugin, migrating all references from the external `@homunculuslabs/plugin-zai` package and adding legacy `Z_AI_API_KEY` fallback support throughout the provider wiring, onboarding catalog, and plugin-collector.\n\n- **New plugin (`plugins/plugin-zai/`)**: Implements `TEXT_SMALL` and `TEXT_LARGE` via z.ai's Anthropic-compatible endpoint, with a custom fetch wrapper that strips SDK-injected `temperature` when `top_p` is present, CoT budget config forwarded through `providerOptions.anthropic.thinking`, and explicit `!= null` guards to distinguish intentional from absent parameters.\n- **Provider wiring**: `PROVIDER_PLUGIN_MAP` gains a `Z_AI_API_KEY` entry, `PLUGIN_PACKAGE_ALIASES` maps the legacy package name forward, and `readOnboardingProviderApiKey` in both `core` and `shared` adds a `Z_AI_API_KEY` fallback path for the `zai` provider so existing user configs continue to resolve correctly.\n- **Regression note**: The previously flagged issues (unguarded `JSON.parse`, dropped CoT `providerOptions`, `\"key\" in obj` false positive, module-level global mutation, narrow temperature-strip guard) have all been addressed in this revision.\n\n\u003ch3\u003eConfidence Score: 5/5\u003c/h3\u003e\n\nSafe to merge; all prior blocking concerns have been resolved and no new defects were found in the changed paths.\n\nThe plugin implementation is complete and correct: CoT budget is properly forwarded via `providerOptions.anthropic.thinking`, the custom fetch wrapper uses `Object.hasOwn` to strip temperature reliably, parameter guards use `!= null` instead of `\"key\" in obj`, and the `disableAiSdkWarningsForZai` call is scoped inside `initializeZai` rather than at module load time. The `collectPluginNames` return type is a `Set` so both `ZAI_API_KEY` and `Z_AI_API_KEY` resolving to the same plugin package cannot cause duplicate loads. Remaining feedback is stylistic.\n\nNo files require special attention.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| plugins/plugin-zai/models/text.ts | Core text generation handler; resolveTextParams now uses `!= null` guards (addressing previous `\"key\" in obj` issue) and providerOptions.anthropic is correctly forwarded to generateText via `providerOptions`. |\n| plugins/plugin-zai/providers/anthropic.ts | Custom fetch wrapper now uses `Object.hasOwn(body, \"temperature\")` to strip temperature whenever top_p is present (addressing prior too-narrow guard), and JSON.parse failure falls back gracefully via try/catch. |\n| plugins/plugin-zai/utils/config.ts | Config helpers cover canonical ZAI_API_KEY and legacy Z_AI_API_KEY fallback; getBaseURL normalizes missing /v1 suffix; getCoTBudget parses per-size then shared budget, returning 0 for invalid values. |\n| plugins/plugin-zai/init.ts | disableAiSdkWarningsForZai is now correctly placed inside the initializeZai async IIFE rather than at module-load time, addressing the prior global-mutation concern. |\n| plugins/plugin-zai/index.ts | Plugin entry point wires TEXT_SMALL and TEXT_LARGE model handlers; config uses null sentinel values that are safely handled by getRawSetting's typeof guard. |\n| plugins/plugin-zai/package.json | Package wiring is correct; autoEnableModule references ./auto-enable.ts (raw TypeScript source) which is valid in Bun-native elizaOS but would fail in plain Node.js environments without a TypeScript loader. |\n| packages/agent/src/runtime/plugin-collector.ts | Adds @homunculuslabs/plugin-zai alias and Z_AI_API_KEY → @elizaos/plugin-zai mapping; collectPluginNames returns a Set so duplicate resolution from both ZAI_API_KEY and Z_AI_API_KEY is safely deduplicated. |\n| packages/core/src/contracts/onboarding.ts | Adds readOnboardingProviderApiKey helper that handles Z_AI_API_KEY legacy fallback for the zai provider; getOnboardingProviderSignalEnvKeys now returns both canonical and legacy keys for the zai provider. |\n| packages/shared/src/contracts/onboarding.ts | Mirrors the same changes as packages/core/src/contracts/onboarding.ts; both files are intentionally kept in sync as they serve different consumer targets. |\n| packages/agent/src/runtime/__tests__/plugin-collector-zai.test.ts | Tests cover alias normalization, canonical ZAI_API_KEY detection, and legacy Z_AI_API_KEY detection; all three cases are validated. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eSequence Diagram\u003c/h3\u003e\n\n```mermaid\nsequenceDiagram\n    participant RT as ElizaOS Runtime\n    participant PC as plugin-collector\n    participant ZP as @elizaos/plugin-zai\n    participant AI as Vercel AI SDK\n    participant ZAI as z.ai API\n\n    RT-\u003e\u003ePC: collectPluginNames(config)\n    Note over PC: ZAI_API_KEY or Z_AI_API_KEY\u003cbr/\u003e→ @elizaos/plugin-zai\n    PC--\u003e\u003eRT: \"Set\u003cstring\u003e (deduplicated)\"\n\n    RT-\u003e\u003eZP: init(config, runtime)\n    ZP-\u003e\u003eZP: \"initializeZai()\u003cbr/\u003edisableAiSdkWarnings()\u003cbr/\u003elog API key status\"\n\n    RT-\u003e\u003eZP: \"useModel(TEXT_SMALL | TEXT_LARGE, params)\"\n    ZP-\u003e\u003eZP: \"resolveTextParams()\u003cbr/\u003etopP/temp mutual exclusion\u003cbr/\u003eCoT budget → providerOptions.anthropic\"\n\n    ZP-\u003e\u003eAI: \"createAnthropic({apiKey, baseURL, fetch: customFetch})\"\n    ZP-\u003e\u003eAI: \"generateText({model, prompt, providerOptions, ...})\"\n    AI-\u003e\u003eZAI: \"POST /api/anthropic/v1/messages\u003cbr/\u003e(customFetch strips temperature if top_p present)\"\n    ZAI--\u003e\u003eAI: response + usage\n    AI--\u003e\u003eZP: \"{text, usage}\"\n    ZP-\u003e\u003eRT: emitEvent(MODEL_USED, tokens)\n    ZP--\u003e\u003eRT: string\n```\n\n\u003csub\u003eReviews (9): Last reviewed commit: [\"Merge branch \u0026#39;develop\u0026#39; into add-first-pa...\"](https://github.com/elizaos/eliza/commit/a9b569c8612f712c0101d15757363bfa6579f738) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=31517097)\u003c/sub\u003e\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"1a:T1a20,"])</script><script>self.__next_f.push([1,"Same template as before. Fill it in exactly like this:\r\n\r\n---\r\n\r\n**Title:**\r\n```\r\nfeat: add plugin-ezpath — pay-per-request DEX meta-router for Base mainnet\r\n```\r\n\r\n**Relates to:** *(leave blank)*\r\n\r\n**Risks:** Low — adds new plugin directory only, zero changes to existing files\r\n\r\n**What does this PR do?**\r\n```\r\nAdds @elizaos/plugin-ezpath — a connector plugin giving Eliza agents access to EZ-Path, a pay-per-request DEX meta-router on Base mainnet. Races 0x, ParaSwap, Aerodrome, and Uniswap V3 concurrently and returns the highest buyAmount for any ERC-20 swap. Payment handled automatically via X402 / EIP-3009 USDC TransferWithAuthorization — no API key, no subscription, no allowance required. Supports basic ($0.03), resilient ($0.10), and institutional ($0.50) execution tiers.\r\n```\r\n\r\n**What kind of change is this?** Features (non-breaking change which adds functionality)\r\n\r\n**Documentation changes needed?** My changes do not require a change to the project documentation.\r\n\r\n**Where should a reviewer start?** `plugins/plugin-ezpath/src/index.ts`\r\n\r\n**Detailed testing steps:**\r\n```\r\n1. Add plugin to agent runtime with EZPATH_WALLET_PRIVATE_KEY set to a Base wallet holding USDC\r\n2. Send: \"What's the best rate to swap 1 USDC for WETH on Base?\"\r\n\r\nExpected output:\r\nEZ-Path quote received.\r\ntier=basic | winner=0x | mode=direct\r\nprice=0.000449 buyToken per sellToken\r\nbuyAmount=449123456789012\r\nsources=Native_V2 (100%)\r\nsettlement_tx=0xf6c89ddf...\r\n\r\nLive endpoint: https://ezpath.myezverse.xyz (60/60 validation checks passing)\r\n```\r\n\r\n**Discord username:** `ezverse.eth`\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR adds `@elizaos/plugin-ezpath`, a new connector plugin that lets Eliza agents fetch DEX swap quotes on Base mainnet by automatically negotiating X402 USDC micro-payments via EIP-3009 `TransferWithAuthorization`. The plugin is self-contained and touches no existing files, but several correctness and security issues need attention before it should be merged.\n\n- **Tier configuration bug**: `QuoteParamsSchema` applies `.default(\\\"basic\\\")` to the `tier` field, so `params.tier` is always a non-null string and the `params.tier ?? tier` fallback in the handler never reaches the `EZPATH_TIER` runtime setting — agents configured with `resilient` or `institutional` silently receive `basic` quotes.\n- **Unvalidated payment destination**: The EIP-3009 authorization's `to` address is taken verbatim from the `X-402-Address` 402 response header with no allowlist or cross-check; a spoofed response can redirect USDC payments to an attacker-controlled address.\n- **Over-broad action trigger**: `validate()` matches on common words and will activate — and spend USDC — on many non-swap messages.\n\n\u003ch3\u003eConfidence Score: 2/5\u003c/h3\u003e\n\nNot safe to merge: the action can spend USDC on unrelated messages, the runtime tier setting is silently ignored, and the payment destination is accepted from an unvalidated HTTP response header.\n\nThe payment destination for every signed USDC transfer comes from a server-controlled HTTP header with no validation, the agent's configured execution tier is never actually used due to the Zod default, and the keyword-based trigger is broad enough to fire on everyday conversation. All three issues affect the core payment and routing path introduced by this PR.\n\nsrc/client.ts (unvalidated toll address) and src/actions/getQuote.ts (tier default bug and over-broad validate) need the most attention before merging.\n\n\u003cdetails open\u003e\u003csummary\u003e\u003ch3\u003eSecurity Review\u003c/h3\u003e\u003c/summary\u003e\n\n- **Unvalidated payment destination** (`src/client.ts`): The EIP-3009 `TransferWithAuthorization` is signed with `to` set to whatever address appears in the `X-402-Address` header of the 402 probe. No comparison against a known-good or configured address is performed. A DNS/BGP-level attacker or a compromised server could substitute an attacker-controlled address and cause the agent to authorize a USDC transfer to that address on every quote request.\n- **Private key in runtime settings**: `EZPATH_WALLET_PRIVATE_KEY` is held in agent runtime settings as a plain string, directly controlling a live Base wallet with USDC.\n\u003c/details\u003e\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| plugins/plugin-ezpath/src/client.ts | Core X402 payment client: signs EIP-3009 USDC TransferWithAuthorization and retries with payment. Toll address is taken unvalidated from the 402 response header, creating a fund-redirection risk if the endpoint is compromised or spoofed. |\n| plugins/plugin-ezpath/src/actions/getQuote.ts | Action handler for GET_SWAP_QUOTE: two bugs — the Zod default makes the runtime EZPATH_TIER setting unreachable, and the validate keywords are broad enough to fire the action (and spend USDC) on unrelated messages. |\n| plugins/plugin-ezpath/src/index.ts | Plugin barrel: exports client types and registers the single GET_SWAP_QUOTE action. No issues. |\n| plugins/plugin-ezpath/package.json | Standard plugin manifest; pins viem and zod as runtime deps, uses workspace peer for @elizaos/core. No critical issues. |\n| plugins/plugin-ezpath/tsconfig.json | TypeScript config with strict: false, weakening type safety for a plugin that handles private keys and payment signing. |\n| plugins/plugin-ezpath/__tests__/plugin.test.ts | Covers plugin shape and happy-path / error-path X402 negotiation with mocked fetch. Tests are well-structured but do not cover the over-broad validate trigger or the tier fallback logic. |\n\n\u003c/details\u003e\n\n\u003ch3\u003eSequence Diagram\u003c/h3\u003e\n\n```mermaid\nsequenceDiagram\n    participant U as User Message\n    participant A as GET_SWAP_QUOTE Action\n    participant LLM as LLM (param extraction)\n    participant C as getQuote() client\n    participant API as EZ-Path API\n\n    U-\u003e\u003eA: message containing quote keywords\n    A-\u003e\u003eA: validate() keyword match\n    A-\u003e\u003eLLM: generateObject(QuoteParamsSchema)\n    LLM--\u003e\u003eA: sellToken, buyToken, sellAmount, tier\n    A-\u003e\u003eC: getQuote params + privateKey\n    C-\u003e\u003eAPI: GET /api/v1/quote (no payment)\n    API--\u003e\u003eC: 402 Payment Required + toll address + tier pricing\n    C-\u003e\u003eC: Sign EIP-3009 TransferWithAuthorization\n    C-\u003e\u003eAPI: GET /api/v1/quote + X-Payment header\n    API--\u003e\u003eC: 200 OK with quote body + settlement tx header\n    C--\u003e\u003eA: QuoteResult\n    A--\u003e\u003eU: Formatted quote response\n```\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"feat: add plugin-ezpath DEX meta-router ...\"](https://github.com/elizaos/eliza/commit/1aad4fb133a2506a0dc48ccc2d11b5c95544ed23) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=32414858)\u003c/sub\u003e\n\n\u003e Greptile also left **6 inline comments** on this PR.\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"1b:T237d,"])</script><script>self.__next_f.push([1,"## Summary\n\nAdds a Linux x64 OpenVINO build target to `packages/app-core/scripts/build-llama-cpp-dflash.mjs` and bumps the llama.cpp submodule to `elizaOS/llama.cpp#1` (which cherry-picks ggml-org/llama.cpp's OpenVINO backend).\n\nResult: a single `llama-server` / `llama-cli` binary that runs GGUF models on **the Intel CPU, the Intel iGPU/dGPU, OR the Intel NPU** with runtime device selection via `GGML_OPENVINO_DEVICE={CPU,GPU,NPU,GPU.0,GPU.1}`.\n\n## Motivation\n\nThis is the only llama.cpp path that targets the Intel NPU (Lunar Lake AI Boost ~48 TOPS, Meteor Lake NCE, Arrow Lake, Panther Lake). NPU inference draws ~2-3 W vs ~15-25 W for the iGPU on the same model — a step-change for any battery-bound use case and the canonical setup for voice agents (Whisper on NPU + LLM on iGPU concurrently).\n\nDistinct from `linux-x64-sycl` (#7628):\n- SYCL covers Intel CPU + iGPU, but **not the NPU**.\n- OpenVINO covers CPU + iGPU + NPU through one runtime.\n\nThe W4-B custom kernels (`turbo3` / `turbo4` / `turbo3_tcq` / `qjl_full` / `polarquant` / `dflash`) have no OpenVINO backend in this fork today (CUDA / Vulkan / Metal / CPU only), so this target runs plain GGML ops translated to OpenVINO compute graphs. The kernel-patches dispatch in `patchAllKernels()` correctly no-ops for `backend === \"openvino\"`.\n\n## Changes (build script)\n\n- `SUPPORTED_TARGETS` gains `\"linux-x64-openvino\"` with a comment block detailing target hardware, runtime device selection, and why kernel patches do not apply yet.\n- `cmakeFlagsForTarget` grows a `backend === \"openvino\"` branch that:\n  - sets `-DGGML_OPENVINO=ON`\n  - forwards `OpenVINO_DIR` / `INTEL_OPENVINO_DIR` from the environment as `-DOpenVINO_DIR=${INSTALLDIR}/runtime/cmake` (CMake's default `find_package(OpenVINO)` search misses the tarball-install layout)\n- `GGML_OPENVINO` joins the `offByDefault` list so non-OpenVINO targets explicitly disable it (parity with METAL / CUDA / HIP / VULKAN).\n- `targetCompatibility` returns a graceful \"no OpenVINO_DIR / INTEL_OPENVINO_DIR\" skip when the operator forgot to source `setupvars.sh`, instead of crashing inside CMake.\n- The `TODO ANCHORS` comment grows an `OPENVINO-AGENT TODO` line for future kernel work.\n\n## Changes (submodule)\n\n- `packages/inference/llama.cpp` bumps from `a61c93aaa5` (v1.2.0-eliza) to `bafc862bf` on `elizaOS/llama.cpp#nubs/openvino-backend-import`. Range adds three upstream commits (`53281e98d` + `1ebe824a0` + `bafc862bf`) cherry-picked cleanly. Companion PR: [elizaOS/llama.cpp#1](https://github.com/elizaOS/llama.cpp/pull/1).\n\n## Verification\n\nDispatch path:\n\n```\n$ node packages/app-core/scripts/build-llama-cpp-dflash.mjs --target linux-x64-openvino --jobs 1\n[dflash-build] target linux-x64-openvino is not buildable: no OpenVINO_DIR / INTEL_OPENVINO_DIR — source /opt/intel/openvino_\u003cver\u003e/setupvars.sh first\n```\n\nBuild (Linux x64 + Lunar Lake host, OpenVINO 2026.1.0 tarball under `~/.local/openvino_2026/`):\n\n```bash\nsource ~/.local/openvino_2026/setupvars.sh\nELIZA_DFLASH_CMAKE_FLAGS=\"-DOpenCL_INCLUDE_DIR=$HOME/.local/include -DOpenCL_LIBRARY=$HOME/.local/lib/libOpenCL.so\" \\\nnode packages/app-core/scripts/build-llama-cpp-dflash.mjs --target linux-x64-openvino --jobs 8\n```\n\nOutput: `libggml-openvino.so` (33 MB) + the standard llama-cli / llama-server / llama-speculative-simple / llama-mtmd-cli set in `~/.eliza/local-inference/bin/dflash/linux-x64-openvino/`.\n\nEnd-to-end test results (Llama-3.1-8B-Instruct Q4_K_M on Intel Core Ultra 7 258V / Arc 140V / 48 TOPS NPU) being captured now; will land as a follow-up comment.\n\n## Runtime requirements\n\n- OpenVINO Runtime 2026.1.x — install via:\n  - **Apt:** `apt install openvino-2026.x` from `https://apt.repos.intel.com/openvino`\n  - **Tarball:** download `openvino_toolkit_ubuntu24_2026.x.x.x_x86_64.tgz` from `https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.1/linux/`, extract under `/opt/intel/openvino_\u003cver\u003e/` or `~/.local/openvino_\u003cver\u003e/`, source `setupvars.sh`.\n- OpenCL ICD loader + Khronos OpenCL-Headers + OpenCL-CLHPP (OpenVINO's iGPU plugin links `OpenCL::OpenCL` even for CPU/NPU device builds; can't opt out at the cmake level today):\n  - **Apt:** `apt install opencl-headers ocl-icd-opencl-dev intel-opencl-icd`\n  - **Manual:** extract Khronos `OpenCL-Headers` + `OpenCL-CLHPP` releases under a prefix and pass `-DOpenCL_INCLUDE_DIR=...` / `-DOpenCL_LIBRARY=...` via `ELIZA_DFLASH_CMAKE_FLAGS`\n\n## Related\n\n- [elizaOS/llama.cpp#1](https://github.com/elizaOS/llama.cpp/pull/1) — submodule companion PR\n- #7626 — glslc absolute-path fix\n- #7628 — `linux-x64-sycl` target (parallel Intel CPU/iGPU path, no NPU)\n- #7630 — submodule bump to v1.2.0-eliza (base for this branch)\n\n## Out of scope\n\n- Real W4-B kernel ports to OpenVINO.\n- Eliza/Milady runtime wiring — `LocalRuntimeKernel` enum extension + hardware probe + env-var plumbing. Separate RFC issue to follow.\n- AMD XDNA / Qualcomm Hexagon NPU paths.\n\n## Test plan\n\n- [x] `node --check` on the modified file\n- [x] Dispatch dry-run without OpenVINO → graceful skip with the expected reason string\n- [x] Full build on Lunar Lake host\n- [ ] Llama-3.1-8B Q4_K_M tg numbers on `GGML_OPENVINO_DEVICE=CPU` (in progress)\n- [ ] Llama-3.1-8B Q4_K_M tg numbers on `GGML_OPENVINO_DEVICE=GPU` (next)\n- [ ] Llama-3.1-8B Q4_K_M tg numbers on `GGML_OPENVINO_DEVICE=NPU` (last — the headline result)\n- [ ] Confirm Vulkan target (with W4-B kernels) still builds byte-identical on the bumped submodule\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR adds a `linux-x64-openvino` build target to the dflash build script, enabling `llama-server`/`llama-cli` binaries to dispatch at rmalization edge case in the OpenVINO_DIR heuristic |\n| packages/inference/llama.cpp | Submodule bumped from 9bb08843 to bafc862b to include three upstream OpenVINO backend cherry-picks; straightforward pointer update |\n\n\u003c/details\u003e\n\n\u003ch3\u003eFlowchart\u003c/h3\u003e\n\n```mermaid\n%%{init: {'theme': 'neutral'}}%%\nflowchart TD\n    A[build-llama-cpp-dflash.mjs\\n--target linux-x64-openvino] --\u003e B{targetCompatibility}\n    B --\u003e|OpenVINO_DIR or\\nINTEL_OPENVINO_DIR set?| C[ok: true]\n    B --\u003e|neither set| D[skip: no OpenVINO_DIR /\\nINTEL_OPENVINO_DIR]\n    C --\u003e E[cmakeFlagsForTarget]\n    E --\u003e F[GGML_OPENVINO=OFF → ON]\n    E --\u003e G{openvinoDir\\nresolution}\n    G --\u003e|OpenVINO_DIR set| H[use OpenVINO_DIR\\nif ends with /cmake]\n    G --\u003e|INTEL_OPENVINO_DIR set| I[append runtime/cmake]\n    H --\u003e J[-DOpenVINO_DIR=…/runtime/cmake]\n    I --\u003e J\n    J --\u003e K[cmake configure\\nGGML_OPENVINO=ON]\n    K --\u003e L[libggml-openvino.so\\nllama-server / llama-cli]\n    L --\u003e M{GGML_OPENVINO_DEVICE}\n    M --\u003e N[CPU]\n    M --\u003e O[GPU / iGPU / Arc]\n    M --\u003e P[NPU — Lunar Lake AI Boost\\nMeteor Lake NCE]\n```\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"build(dflash): add linux-x64-openvino ta...\"](https://github.com/elizaos/eliza/commit/58af42f562c3db99298094865774dc252a51ab29) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=31875484)\u003c/sub\u003e\n\n\u003e Greptile also left **1 inline comment** on this PR.\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"1c:T18fe,"])</script><script>self.__next_f.push([1,"## Problem\n\n\\`findGlslc\\` in \\`packages/app-core/scripts/build-llama-cpp-dflash.mjs:563\\` returns the bare string \\`\"glslc\"\\` when the binary is on the host PATH. The script then passes this verbatim to CMake as \\`-DVulkan_GLSLC_EXECUTABLE=glslc\\`, which CMake stores as a relative \\`FILEPATH\\` resolved against the source dir (the llama.cpp checkout).\n\nOn a stock Debian/Ubuntu host where \\`glslc\\` lives at \\`/usr/bin/glslc\\`, the resulting cache value is:\n\n\\`\\`\\`\nVulkan_GLSLC_EXECUTABLE:FILEPATH=/home/.../inference/llama.cpp/glslc\n\\`\\`\\`\n\nThat path does not exist. \\`vulkan-shaders-gen\\` is then invoked without a usable glslc, silently produces **zero \\`.spv\\` files**, and writes an \\`.hpp\\` header with \\`extern const\\` declarations whose \\`_data\\` / \\`_len\\` symbols are never defined. Link fails with ~2,000 undefined references:\n\n\\`\\`\\`\n/usr/bin/x86_64-linux-gnu-ld.bfd: ../../bin/libggml-vulkan.so.0.9.7: undefined reference to \\`add_f16_f16_f32_rte_len\\`\n/usr/bin/x86_64-linux-gnu-ld.bfd: ../../bin/libggml-vulkan.so.0.9.7: undefined reference to \\`matmul_id_subgroup_q5_1_q8_1_data\\`\n... ~2000 more\n\\`\\`\\`\n\nThe build itself reports as exited but the resulting \\`libggml-vulkan.so\\` is unlinkable, so \\`llama-server\\` / \\`llama-cli\\` never produced.\n\n## Fix\n\nResolve \\`glslc\\` via \\`which\\` before returning, so CMake receives an absolute path and the shader-gen step actually invokes glslc:\n\n\\`\\`\\`diff\n function findGlslc(ndk) {\n-  if (has(\"glslc\")) return \"glslc\";\n+  if (has(\"glslc\")) {\n+    // Resolve to absolute path. CMake interprets the bare string \"glslc\"\n+    // as a relative FILEPATH against the source dir, which silently breaks\n+    // vulkan-shaders-gen on Linux hosts where glslc lives at /usr/bin/glslc.\n+    try {\n+      const out = spawnSync(\"which\", [\"glslc\"], { encoding: \"utf8\" }).stdout?.trim();\n+      if (out) return out;\n+    } catch {}\n+    return \"glslc\";\n+  }\n   if (ndk) { ... }\n\\`\\`\\`\n\nAndroid NDK path is unaffected — it already returns an absolute path via \\`path.join(ndk, \"shader-tools\", host, \"glslc\")\\`. The fallback \\`return \"glslc\"\\` keeps existing behavior on hosts where \\`which\\` fails for any reason.\n\n## Verification\n\nOn Intel Core Ultra 7 258V (Lunar Lake) with Arc Graphics 140V iGPU, after the fix, \\`linux-x64-vulkan\\` build produces **2,203 SPV blobs** and a working \\`llama-server\\`. The Vulkan runtime correctly detects the GPU with KHR_coopmat / XMX matrix cores active:\n\n\\`\\`\\`\nggml_vulkan: Found 1 Vulkan devices:\nggml_vulkan: 0 = Intel(R) Graphics (LNL) (Intel open-source Mesa driver) | uma: 1 | fp16: 1 | bf16: 1 | warp size: 32 | shared memory: 49152 | int dot: 1 | matrix cores: KHR_coopmat\n\\`\\`\\`\n\n\\`llama-bench\\` on Llama-3.1-8B-Instruct Q4_K_M (all 33 layers offloaded to Vulkan):\n\n\\`\\`\\`\n| model                          |       size |     params | backend    | ngl | threads |            test |                  t/s |\n| ------------------------------ | ---------: | ---------: | ---------- | --: | ------: | --------------: | -------------------: |\n| llama 8B Q4_K - Medium         |   4.58 GiB |     8.03 B | Vulkan     |  99 |       8 |            pp64 |        172.93 ± 5.23 |\n| llama 8B Q4_K - Medium         |   4.58 GiB |     8.03 B | Vulkan     |  99 |       8 |            tg32 |          5.73 ± 3.48 |\n\\`\\`\\`\n\nvs CPU baseline on the same machine (\\`linux-x64-cpu\\` target): 1.42 t/s prompt eval, 0.60 t/s decode — so this fix unlocks ~121× prompt-eval speedup and ~9.5× decode speedup. Tool-calling end-to-end via \\`/v1/chat/completions\\` also verified working (Llama-3.1's \\`\u003c|python_tag|\u003e\\` parser path).\n\n## Test plan\n\n- [x] Rebuilt \\`linux-x64-vulkan\\` target on a host where the previous build had failed → succeeds now\n- [x] \\`Vulkan_GLSLC_EXECUTABLE\\` in CMakeCache.txt is \\`/usr/bin/glslc\\` (was \\`/llama.cpp/glslc\\`)\n- [x] 2,203 SPV files generated in \\`vulkan-shaders.spv/\\` (was 0)\n- [x] \\`llama-server\\` boots, all layers offload to GPU, KHR_coopmat active\n- [x] Functional: chat completes, tool calls parsed correctly\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nThis PR fixes a silent build failure on Linux when building the `linux-x64-vulkan` target: `findGlslc` was returning the bare string `\"glslc\"` which CMake stores as a relative `FILEPATH` resolved against the llama.cpp source directory, causing `vulkan-shaders-gen` to produce zero `.spv` files and a broken `libggml-vulkan.so`. The fix shells out to `which` to resolve the absolute path before returning it to CMake.\n\n- **`findGlslc` patched** to call `spawnSync(\"which\", [\"glslc\"])` and return the absolute path (e.g. `/usr/bin/glslc`) when found; falls back to the bare `\"glslc\"` string on systems where `which` is unavailable (Windows, minimal containers), preserving prior behavior on those hosts.\n- **NDK and null paths unaffected** — the Android NDK branch already constructs an absolute path via `path.join`, and the `return null` path is unchanged.\n\n\u003ch3\u003eConfidence Score: 4/5\u003c/h3\u003e\n\nSafe to merge — the change is narrow, targets a well-understood CMake path-resolution bug, and the fallback preserves existing behavior on Windows and minimal Linux environments.\n\nThe fix is correct and well-reasoned. The only cosmetic issue is the `try/catch` wrapper around `spawnSync`, which does not actually intercept `spawnSync` failures (those surface as `result.error`, not thrown exceptions); the real guard is the `if (out)` null check. This is a style concern with no functional impact.\n\nNo files require special attention; the single-function change in `build-llama-cpp-dflash.mjs` is self-contained.\n\n\u003ch3\u003eImportant Files Changed\u003c/h3\u003e\n\n| Filename | Overview |\n|----------|----------|\n| packages/app-core/scripts/build-llama-cpp-dflash.mjs | Resolves `glslc` to an absolute path via `which` before passing to CMake, preventing a silent shader-gen failure where CMake would interpret the bare string as a relative path. Logic is correct; the `try/catch` is cosmetically misleading but harmless. |\n\n\u003c/details\u003e\n\n\u003csub\u003eReviews (1): Last reviewed commit: [\"fix(local-inference): resolve glslc to a...\"](https://github.com/elizaos/eliza/commit/566dae0ff706574f2cc67f82e115fbb3921c0156) | [Re-trigger Greptile](https://app.greptile.com/api/retrigger?id=31842199)\u003c/sub\u003e\n\n\u003e Greptile also left **1 inline comment** on this PR.\n\n\u003c!-- /greptile_comment --\u003e"])</script><script>self.__next_f.push([1,"1d:T18b8,"])</script><script>self.__next_f.push([1,"## Summary\n\nBumps the llama.cpp submodule pointer from develop's `9bb0884390` up to the `v1.2.0-eliza` tag (commit `a61c93aaa5`). Range adds 8 commits.\n\n## Why\n\n`cb700767 llama-graph: dequantize QJL1_256 K / Q4_POLAR V to F16 before flash_attn_ext` is load-bearing for the QJL/PolarQuant KV path on Vulkan and any other backend hitting `flash_attn_ext` with quantized KV. The v1.1.0-eliza pin emits unquantized KV through flash_attn_ext, which can hit a slow shader fallback on Intel/AMD Vulkan or silently disagree with the host-side dequant on CPU/MoE splits.\n\nFull range:\n\n```\na61c93aa ffi(asr-stream): real buffered streaming + vocab-gated capability probe\na50cb7c4 ffi: implement eliza_inference_set_verifier_callback + emit helper\n42947fe7 chore: checkpoint WIP — CUDA fused-attn-qjl-tbq + server-context tweaks\n03fc58ef server-slot: forced-token fast-forward cursor + helpers\n3b9ecc7b server-task: parse eliza_prefill_plan request fragment\ne32a7bf2 server-task.h: add task_prefill_plan + plumb onto task_params\nb084d780 wip(omnivoice-ffi): pre-existing dirty refactor (preserved)\ncb700767 llama-graph: dequantize QJL1_256 K / Q4_POLAR V to F16 before flash_attn_ext\n```\n\n## Caveat\n\n`42947fe7 chore: checkpoint WIP` and `b084d780 wip(omnivoice-ffi)` are unusual to ship inside a tagged release, but they're inside the upstream `v1.2.0-eliza` tag — happy to drop this PR if the maintainers prefer a different sha for v1.2.0-eliza, or to wait for v1.2.1.\n\n## Verification\n\nLinux x64, Intel Arc 140V iGPU, Vulkan build via the existing dflash build script (with #7626 glslc fix applied so vulkan-shaders-gen actually compiles SPV).\n\n- Build: `node packages/app-core/scripts/build-llama-cpp-dflash.mjs --target linux-x64-vulkan --jobs 8` — clean build, all kernel patches verified present (dflash, turbo3, turbo4, turbo3_tcq, qjl_full, polarquant, lookahead, ngramDraft).\n- Smoke run: `llama-speculative-simple` with a 0.6B body + a cross-drafter — decoded 71 tokens at 20.8 t/s with 85.3% draft acceptance on Arc 140V, no kernel asserts.\n\nI do not have a CUDA host, so the fused-attn-qjl-tbq path in `42947fe7` is build-tested only on CPU/Vulkan. The relevant `#ifdef GGML_CUDA_FUSED_ATTN_QJL` is gated on a CUDA-only define, so it does not affect non-CUDA targets.\n\n## Related\n\n- #7626 — glslc resolution fix (Vulkan build depends on it)\n- #7628 — SYCL target scaffold\n- #7629 — Qwen3.5 Eliza-1 tier drafter publication gap\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n\u003c!-- greptile_comment --\u003e\n\n\u003ch3\u003eGreptile Summary\u003c/h3\u003e\n\nBumps the `packages/inference/llama.cpp` submodule pointer from commit `9bb0884390` to `a61c93aaa5` (tagged `v1.2.0-eliza`), advancing 8 commits over the previous `v1.1.0-eliza` pin. The primary driver is `cb700767`, which dequantizes QJL1_256 K / Q4_POLAR V tensors to F16 before `flash_attn_ext` — a correctness fix for the Vulkan/Intel+AMD backend path that was previously hitting a slow shader fallback.\n\n- **Core fix (`cb700767`)**: Dequantize QJL1_256 K / Q4_POLAR V to F16 before `flash_attn_ext`; fixes silent shader fallback on Vulkan and potential host-side dequant disagreement on CPU/MoE splits.\n- **New FFI surface (`a61c93aa`, `a50cb7c4`)**: Adds buffered ASR streaming + vocab-gated capability probe and `eliza_inference_set_verifier_callback`; these extend the C FFI boundary and depend on correct vocab gating at call sites in the hos
