mote nodes\n\n### 2. Docker Infrastructure\n- **DockerSSHClient**: connection pooling keyed on `host:port`, command timeout\n- **DockerSandboxProvider**: container create/stop/health/runCommand, DB-backed port allocation (collision-free), health check polling (3s interval, 60s timeout), shell-escaped commands, full agentId container names\n- **DockerNodeManager**: DB-backed least-loaded placement, health checks, capacity sync\n\n### 3. Headscale VPN\n- **HeadscaleClient**: REST API client for Headscale control plane\n- **HeadscaleIntegration**: ephemeral pre-auth keys per container, VPN lifecycle, automatic cleanup\n\n### 4. Database (migration `0046_docker_nodes.sql`)\n- New `docker_nodes` table (node_id, hostname, capacity, health status, allocation tracking)\n- 6 new columns on `milady_sandboxes`: node_id, container_name, bridge_port, web_ui_port, headscale_ip, docker_image\n\n### 5. Admin API (7 routes, all `requireAdmin`)\n| Endpoint | Method | Description |\n|----------|--------|-------------|\n| `/admin/docker-nodes` | GET/POST | List/register nodes |\n| `/admin/docker-nodes/:id` | GET/PATCH/DELETE | Node CRUD |\n| `/admin/docker-nodes/:id/health-check` | POST | SSH health check |\n| `/admin/docker-containers` | GET | List running containers |\n| `/admin/docker-containers/audit` | POST | Ghost/orphan audit |\n| `/admin/docker-containers/:id/logs` | GET | Container logs |\n| `/admin/headscale` | GET | Mesh status |\n\n### 6. Admin UI\n- **Infrastructure dashboard** (1,284 lines): Overview + Nodes + Containers + Mesh tabs\n- **Milady sandboxes table**: Docker metadata, status badges, VPN IPs\n- **Agent detail page**: Docker info card, SSH access info\n- **Docker logs viewer**: search, copy, download, auto-scroll\n\n### 7. Documentation\n- `docs/INTEGRATION_MAP.md` (1,555 lines): auth, credits, sandbox lifecycle mapping\n- `docs/DOCKER_HEADSCALE_PLAN.md`: implementation plan\n- `docs/DOCKER_PROVISIONING_SUMMARY.md`: provisioning flow docs\n\n---\n\n## Code Review (from #375, all addressed)\n\nAll 12 findings from the automated review were fixed before rebasing:\n\n| # | Issue | Fix |\n|---|-------|-----|\n| 1 | In-memory registry loses state on restart | `resolveContainer()` hydrates from DB via `findBySandboxId()` |\n| 2 | DockerNodeManager bypassed | `create()` uses `getAvailableNode()` for least-loaded placement |\n| 3 | Port collision under concurrency | `allocatePort()` queries DB for used ports on target node |\n| 4 | Command injection in `runCommand()` | All args `shellQuote()`'d individually |\n| 5 | agentId unsanitized in shell | `validateAgentId()` before any shell interpolation |\n| 6 | Health check single-shot | Polls with 3s interval, 60s timeout |\n| 7 | Container name truncation collision | Uses full agentId |\n| 8 | Weakly typed metadata | Exported `DockerSandboxMetadata` interface |\n| 9 | Missing step 9 in comments | Fixed numbering |\n| 10 | SSH pool key collision | Keyed on `hostname:port` |\n| 11 | `parseDockerNodes()` re-parses every call | Module-level cache |\n| 12 | Docs at repo root | Moved to `docs/` |\n\n---\n\n## Configuration\n\n```env\n# Switch to Docker provider (default: vercel)\nMILADY_SANDBOX_PROVIDER=docker\nMILADY_DOCKER_NODES=node1:192.168.1.100:8,node2:192.168.1.101:8\nMILADY_SSH_KEY_PATH=/path/to/ssh/key\nMILADY_SSH_USER=root\n\n# Optional: Headscale VPN\nHEADSCALE_API_KEY=hskey-api-xxx\nHEADSCALE_API_URL=http://headscale:8081\nHEADSCALE_USER=milady\n```\n\n## Risk \u0026 Rollback\n\n- **Zero risk to existing Vercel path**: factory defaults to `vercel`, Docker code only loaded when configured\n- **Rollback**: remove `MILADY_SANDBOX_PROVIDER` env var\n- **Migration is additive**: new table + nullable columns, no data modifications\n- **No breaking API changes**: all existing routes work identically\n\n## Testing Checklist\n\n- [ ] Provision agent with `MILADY_SANDBOX_PROVIDER=vercel` (no regression)\n- [ ] Provision agent with `MILADY_SANDBOX_PROVIDER=docker`\n- [ ] Docker metadata persisted in DB\n- [ ] Bridge/stream/snapshot/restore work through provider\n- [ ] Agent deletion cleans up container + VPN\n- [ ] Admin API: nodes CRUD, container list/logs/audit, headscale status\n- [ ] Admin dashboard renders all tabs\n- [ ] Run migration `0046_docker_nodes.sql` on test DB\n- [ ] `tsc --noEmit` passes (2 pre-existing errors only)"])</script><script>self.__next_f.push([1,"18:T2344,"])</script><script>self.__next_f.push([1,"## Summary\n\nAdds a full Docker container + Headscale VPN infrastructure layer as an alternative sandbox provider for Milaidy agents. Instead of running agents in Vercel Sandboxes, operators can now deploy agents as Docker containers on remote VPS nodes with optional WireGuard mesh networking via Headscale.\n\n**34 files changed, ~8,200 lines added**\n\n---\n\n## Motivation\n\nVercel Sandboxes are convenient but limiting: no persistent filesystem, no SSH access, no custom networking, constrained resources. For agents that need a real VPS-like environment (CLI tools, persistent data, inter-agent communication), we need Docker containers on dedicated infrastructure.\n\nThis PR introduces a provider abstraction so both backends coexist cleanly, controlled by a single env var.\n\n---\n\n## Architecture\n\n```\n                    MILAIDY_SANDBOX_PROVIDER=docker\n                              │\nUser → Eliza Cloud API → SandboxProvider Factory\n                              │\n              ┌───────────────┼───────────────┐\n              ▼                               ▼\n     VercelSandboxProvider          DockerSandboxProvider\n     (existing behavior)                      │\n                                    ┌─────────┼─────────┐\n                                    ▼         ▼         ▼\n                               SSH Client  Node Mgr  Headscale\n                                    │         │         │\n                                    ▼         ▼         ▼\n                              Hetzner VPS  Placement  VPN Mesh\n                              (Docker)     Strategy   (WireGuard)\n```\n\n---\n\n## What's included\n\n### 1. Sandbox Provider Abstraction (`lib/services/sandbox-provider.ts`)\n\nExtracted a `SandboxProvider` interface from the existing Vercel-specific code:\n\n```typescript\ninterface SandboxProvider {\n  create(config: SandboxCreateConfig): Promise\u003cSandboxHandle\u003e;\n  stop(sandboxId: string): Promise\u003cvoid\u003e;\n  checkHealth(healthUrl: string): Promise\u003cboolean\u003e;\n  runCommand?(sandboxId: string, cmd: string): Promise\u003cstring\u003e;\n}\n```\n\nFactory function reads `MILAIDY_SANDBOX_PROVIDER` env var (`vercel` | `docker`), defaults to `vercel`. Existing Vercel code extracted into `VercelSandboxProvider` with zero behavior changes.\n\n### 2. Docker SSH Client (`lib/services/docker-ssh.ts`)\n\nSSH client with connection pooling for managing containers on remote nodes:\n- Connection pool with configurable max connections\n- Command execution with timeout support\n- Container lifecycle (create, stop, remove, inspect, logs)\n- Image management (pull, check)\n\n### 3. Docker Sandbox Provider (`lib/services/docker-sandbox-provider.ts`)\n\nFull `SandboxProvider` implementation for Docker:\n- Container creation on remote nodes via SSH\n- Port allocation: bridge (18790-19790), web UI (20000-25000)\n- Health check polling with configurable timeout\n- In-memory container registry with DB backing\n- Optional Headscale VPN integration (graceful degradation if not configured)\n- Metadata passthrough (node_id, container_name, ports, VPN IP, image)\n\n### 4. Node Manager (`lib/services/docker-node-manager.ts`)\n\nMulti-node management with smart placement:\n- Least-loaded allocation strategy\n- Periodic health checks\n- Capacity tracking and reporting\n- Node enable/disable for maintenance\n\n### 5. Headscale VPN Layer\n\n**Client** (`lib/services/headscale-client.ts`):\n- Full REST API client for Headscale control plane\n- Node management, pre-auth key generation, route handling, health checks\n\n**Integration** (`lib/services/headscale-integration.ts`):\n- Container VPN lifecycle: prepare → register → cleanup\n- Ephemeral pre-auth keys per container\n- VPN registration polling (60s timeout)\n- Automatic node cleanup on container stop\n\n### 6. Database Schema (`db/migrations/0034_docker_nodes.sql`)\n\nNew `docker_nodes` table:\n```sql\nCREATE TABLE docker_nodes (\n  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  node_id TEXT UNIQUE NOT NULL,\n  hostname TEXT NOT NULL,\n  ssh_port INTEGER DEFAULT 22,\n  capacity INTEGER DEFAULT 8,\n  enabled BOOLEAN DEFAULT true,\n  status TEXT DEFAULT 'unknown',\n  allocated_count INTEGER DEFAULT 0,\n  last_health_check TIMESTAMPTZ,\n  ssh_user TEXT DEFAULT 'root',\n  metadata JSONB DEFAULT '{}'\n);\n```\n\n6 new columns on `milaidy_sandboxes`: `node_id`, `container_name`, `bridge_port`, `web_ui_port`, `headscale_ip`, `docker_image`.\n\n### 7. Admin API Routes (`app/api/v1/admin/`)\n\n7 new route files behind `requireAdmin` auth:\n\n| Endpoint | Method | Description |\n|----------|--------|-------------|\n| `/admin/docker-nodes` | GET | List all nodes with capacity info |\n| `/admin/docker-nodes` | POST | Register a new node |\n| `/admin/docker-nodes/:id` | GET/PATCH/DELETE | Node CRUD |\n| `/admin/docker-nodes/:id/health-check` | POST | SSH health check |\n| `/admin/docker-containers` | GET | List running containers |\n| `/admin/docker-containers/audit` | POST | Ghost/orphan container audit |\n| `/admin/docker-containers/:id/logs` | GET | Fetch container logs |\n| `/admin/headscale` | GET | Mesh status, nodes, pre-auth keys |\n\n### 8. Admin Infrastructure Dashboard (`components/admin/infrastructure-dashboard.tsx`)\n\nFull admin UI (1,284 lines) with three tabs:\n- **Docker Nodes**: list, add, edit, delete, health check, capacity bars\n- **Containers**: list with status badges, log viewer, ghost audit\n- **Headscale**: mesh status, connected nodes, pre-auth keys, VPN IPs\n\n### 9. Enhanced Container Views\n\n- **`components/containers/milaidy-sandboxes-table.tsx`** (608 lines): New table component showing all sandboxes with provider type, docker metadata, status filtering\n- **`components/containers/docker-logs-viewer.tsx`** (259 lines): Real-time log viewer with auto-scroll, line count, tail controls\n- **`app/dashboard/containers/agents/[id]/page.tsx`** (532 lines): Agent detail page with overview, logs, actions\n- Sidebar updated with infrastructure nav items\n\n### 10. Documentation\n\n- `docs/INTEGRATION_MAP.md` (1,555 lines): Comprehensive mapping of auth, credits, sandbox lifecycle, API surface, and data model between ElizaCloud and milady-cloud\n- `DOCKER_HEADSCALE_PLAN.md`: Original implementation plan\n- `DOCKER_PROVISIONING_SUMMARY.md`: Provisioning flow documentation\n\n---\n\n## Provisioning flow (Docker)\n\n```\n1. Database setup     → Neon DB provisioned (same as Vercel path)\n2. VPN preparation    → Generate Headscale pre-auth key (optional)\n3. Container creation → SSH to least-loaded node, pull image, run container\n4. VPN registration   → Wait for container to join mesh (60s timeout)\n5. Health check       → Poll /health endpoint via provider\n6. State restore      → Push backup via bridge API (if exists)\n7. Persist metadata   → Store docker fields in milaidy_sandboxes\n8. Return handle      → bridgeUrl + healthUrl (VPN IP or node hostname)\n```\n\n---\n\n## Configuration\n\n### Required for Docker provider\n```env\nMILAIDY_SANDBOX_PROVIDER=docker\nMILAIDY_DOCKER_NODES=node1:192.168.1.100:8,node2:192.168.1.101:8\nMILAIDY_SSH_KEY_PATH=/path/to/ssh/key\nMILAIDY_SSH_USER=root\n```\n\n### Optional (Headscale VPN)\n```env\nHEADSCALE_API_KEY=hskey-api-xxx\nHEADSCALE_API_URL=http://headscale:8081\nHEADSCALE_USER=milaidy\n```\n\n### Switching providers\n```env\n# Use Vercel (default, no change needed)\nMILAIDY_SANDBOX_PROVIDER=vercel\n\n# Use Docker\nMILAIDY_SANDBOX_PROVIDER=docker\n```\n\n---\n\n## Testing checklist\n\n .push([1,"1c:Te20,"])</script><script>self.__next_f.push([1,"## Summary\n\nImplements field-level encryption for sensitive database credentials (`user_database_uri`) using AES-256-GCM with per-organization Data Encryption Keys (DEKs).\n\n- **Per-organization encryption keys** for tenant isolation\n- **Encoded format** (`enc:v1:...`) requires zero schema changes\n- **Backward compatible**: handles both encrypted and legacy plaintext URIs\n- **Migration script** for encrypting existing data\n\n## Architecture\n\n```\nMaster Key (SECRETS_MASTER_KEY env var)\n    └── wraps →\nOrganization DEKs (stored encrypted in DB)\n    └── encrypts →\nSensitive fields (user_database_uri, future: API keys, etc.)\n```\n\n**Encrypted format**: `enc:v1:\u003corg_key_id\u003e:\u003cnonce\u003e:\u003cauth_tag\u003e:\u003cciphertext\u003e`\n\n## Files Changed\n\n| File | Description |\n|------|-------------|\n| `lib/services/field-encryption.ts` | Core encryption service (AES-256-GCM) |\n| `db/schemas/organization-encryption-keys.ts` | Drizzle schema for org encryption keys |\n| `db/repositories/organization-encryption-keys.ts` | Repository for CRUD operations |\n| `db/migrations/0017_add_organization_encryption_keys.sql` | Schema migration |\n| `lib/services/user-database.ts` | Encrypt URI on store, add decrypt helper |\n| `lib/services/sandbox/tool-executor.ts` | Decrypt URI before injecting as DATABASE_URL |\n| `scripts/migrate-encrypt-user-database-uris.ts` | Migration script for existing data |\n| `example.env.local` | Documentation for new env vars |\n\n## Deployment Checklist\n\n- [ ] Run migration `0017_add_organization_encryption_keys.sql`\n- [ ] **Add `SECRETS_MASTER_KEY` to Vercel Environment Variables**\n  - Generate with: `openssl rand -hex 32`\n  - Must be 64 hex characters (32 bytes)\n  - ⚠️ Back up securely - losing this key means losing access to encrypted data\n- [ ] Deploy code changes\n- [ ] Run migration script: `npx tsx scripts/migrate-encrypt-user-database-uris.ts`\n
